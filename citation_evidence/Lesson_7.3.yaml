# ---- Eck & Page 2026 (s02) ----
- id: 7.3-01
  lesson_text: >-
    A team testing models on historical concert programmes ran each model ten times on every image for exactly this reason: the outputs vary from run to run
  kind: paraphrase
  verdict: supported
  citation: "Eck & Page, 2026"
  source_file: raw/readings/Module_05_Reconciliation/02_A_methodological_framework_for_the_use_of_AI_tools_in_automated_workflows_for_ge.pdf
