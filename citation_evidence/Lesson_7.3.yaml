# ---- De Cristofaro & Zilio 2025 (s03) ----
- id: 7.3-02
  lesson_text: >-
    A study of models encoding twentieth-century letters found that one model drifted away from the reference file it had been given and relied on its own information instead, which produced errors where the supplied material should have been followed
  kind: paraphrase
  verdict: supported
  citation: "De Cristofaro & Zilio, 2025"
  source_file: raw/readings/Module_02_Cataloguing/07_Metadata_for_research_data.pdf
  pdf_page: 9
  printed_page: 535
  title_page: 5
  passage: >-
    ChatGPT demonstrates strong performance in encoding published works but fails when encoding the pre-publication stages. This result demonstrates that the macro.xml file was not considered the main reference point, while it relies on its own information for encoding works.
  justification: >-
    The passage says ChatGPT did not treat the supplied macro.xml reference file as its main reference point and relied on its own information, so it failed to encode the pre-publication stages; that is the drift away from supplied material described in the lesson. The letters are twentieth-century film-world correspondence, such as Fellini to Musso, 1990, shown on the same page.
