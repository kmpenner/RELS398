# ---- Huskey 2024 (s02) ----
- id: 7.1-01
  lesson_text: >-
    Layout belongs to the rendering of an edition's data, not to the data themselves, which is why some digital projects treat display as a separate scholarly task
  kind: paraphrase
  verdict: supported
  citation: "Huskey, 2024"
  source_file: raw/readings/Module_01_Orientation/02_Developing_a_new_integrated_editing_platform_for_source_documents_in_classics.pdf
  pdf_page: 8
  printed_page: 16
  passage: >-
    Some of the most noticeable differences between the 1910 and 1924 editions have to do with layout, but those differences affect the rendering of the edition’s data, not the data themselves. Since the DLL treats the visualization of its editions as a separate scholarly concern, how to render the data in the format of the 1924 edition is a matter for a visualization project.
# ---- Pierazzo 2016 (s03, s05, s06, s07) ----
- id: 7.1-02
  lesson_text: >-
    Because an encoded text can be run through different sets of rules held in stylesheets, the same file can be shown as a diplomatic text, a critical text, or a reading text
  kind: paraphrase
  verdict: supported
  citation: "Pierazzo, 2016"
  source_file: raw/readings/Module_13_Publication/03_Digital_Scholarly_Editing_in_Practice_Making_Oxford_University_Voltaire.pdf
  pdf_page: 68
  printed_page: 51
  passage: >-
    In fact, by the application of different sets of rules contained in the so-called stylesheets, if the text has been produced by the means of text encoding, it is possible to visualise it in any number of different formats, for instance as a critical, diplomatic, variorum or as a reading text.
- id: 7.1-03
  lesson_text: >-
    A clean reading text, with almost no visible trace of the editing behind it, can give readers the false impression that the text is stable and finished
  kind: paraphrase
  verdict: supported
  citation: "Pierazzo, 2016"
  source_file: raw/readings/Module_13_Publication/03_Digital_Scholarly_Editing_in_Practice_Making_Oxford_University_Voltaire.pdf
  pdf_page: 64
  printed_page: 47
  passage: >-
    The provision of ‘clean’ reading texts, where almost no traces of the underlying editorial work are visible, have contributed to giving readers a false impression that stability, a ‘trueness’ of the texts, is an achievable goal
- id: 7.1-04
  lesson_text: >-
    Print editions tried to serve every kind of reader with one product because of cost, but a digital edition can offer different outputs for different readers
  kind: paraphrase
  verdict: supported
  citation: "Pierazzo, 2016"
  source_file: raw/readings/Module_13_Publication/03_Digital_Scholarly_Editing_in_Practice_Making_Oxford_University_Voltaire.pdf
  pdf_page: 71
  printed_page: 54
  passage: >-
    Governed by economic constraints, the publication of texts has aimed at satisfying many if not all types of reading with a single product, but as the same constraints do not apply for the digital environment, it is conceivable to produce editions that aim at only one type of reading (and readers) or editions that provide different outputs for different readers
- id: 7.1-05
  lesson_text: >-
    The same text read on a phone, a tablet, a laptop, or a sheet of printed paper can give a quite different reading experience
  kind: paraphrase
  verdict: supported
  citation: "Pierazzo, 2016"
  source_file: raw/readings/Module_13_Publication/03_Digital_Scholarly_Editing_in_Practice_Making_Oxford_University_Voltaire.pdf
  pdf_page: 68
  printed_page: 51
  passage: >-
    The experience of reading a text on the screen of a mobile phone can be radically different from that of a tablet or a laptop; the same applies to texts read from a web browser or downloaded within an eReader application or even printed out on A4 paper. All of these manifestations present the same text, yet the reading experience (and ultimately the message) can vary greatly.
# ---- Bausi et al. 2015 (s27) ----
- id: 7.1-06
  lesson_text: >-
    Manuscript scholars note that a carefully annotated file can produce both diplomatic and critical editions, in print and online, automatically
  kind: paraphrase
  verdict: supported
  citation: "Bausi et al., 2015"
  source_file: raw/readings/Module_01_Orientation/02_A_corpus-based_approach_to_philological_issues.pdf
  pdf_page: 47
  printed_page: 24
  passage: >-
    Taking all the features of XML together, it is conceivable that the contents of a manuscript can be electronically annotated with them in such a way that both different forms of editions (‘diplomatic’ and ‘critical’, printed and online) and several kinds of indexes can automatically be derived from the annotated text
- id: 7.1-07
  lesson_text: >-
    The usual tool is XSLT, a language that can transform an XML document into an HTML web page, a plain-text file, or a formatting-object file that is then turned into a PDF
  kind: paraphrase
  verdict: supported
  citation: "Bausi et al., 2015"
  source_file: raw/readings/Module_01_Orientation/02_A_corpus-based_approach_to_philological_issues.pdf
  pdf_page: 47
  printed_page: 24
  passage: >-
    For the former purpose, this presupposes the design and application of so-called ‘Extensible Stylesheet Language Transformations’ (XSLT), which can be used to transform XML documents into HTML web pages, plain text files, or ‘Extensible Stylesheet Language Formatting Objects’ (XSL-FO) which can subsequently be converted to PDF or other output formats.
# ---- Weigl et al. 2025 (s27) ----
- id: 7.1-08
  lesson_text: >-
    Working projects build this into their routine: in one recent music-and-text edition project, the encoders tested their transcription and edition versions with XSLT stylesheets before storing the files in Git
  kind: paraphrase
  verdict: supported
  citation: "Weigl et al., 2025"
  source_file: raw/readings/Module_10_Consolidation/06_Collaborative_workflows_for_encoding,_validating,_and_publishing_a_multimodal_di.pdf
  pdf_page: 4
  passage: >-
    After testing the transcription and edition versions with XSLT stylesheets and linking to the respective facsimiles, the encodings are stored using git, following the same release process as for the music encodings.
