dge a tool's decisions until you have made your own.\n\nThe idea of generating editions automatically from one encoded file is not new. Manuscript scholars note that a carefully annotated file can produce both diplomatic and critical editions, in print and online, automatically (Bausi et al., 2015). The usual tool is XSLT, a language that can transform an XML document into an HTML web page, a plain-text file, or a formatting-object file that is then turned into a PDF (Bausi et al., 2015). Working projects build this into their routine: in one recent music-and-text edition project, the encoders tested their transcription and edition versions with XSLT stylesheets before storing the files in Git (Weigl et al., 2025).\n\nYour hand-made page is your ground truth, just as your manual transcription was in Week 4. On Wednesday you will hold the XSLT output up against it. On Friday you will hold an AI-written stylesheet up against it. Every difference will be either a mistake by the tool or a decision you had not thought to make. Either way, you will only see it because you did this first.\n\n**Vocabulary.** *XSLT* — A language for transforming XML documents into other forms, such as HTML. *Ground truth* — A carefully checked result used as the standard for judging automated results.\n\n**Takeaway:** Your hand-made page is the ground truth for this week; without it, you cannot tell whether Wednesday's and Friday's automatic renderings are right.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Why Do This by Hand?", "questiontext": "<p>Why build the page by hand before using XSLT on Wednesday?</p>", "generalfeedback": "<p>Your hand-made page is the ground truth for this week; without it, you cannot tell whether Wednesday's and Friday's automatic renderings are right.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because the hand-made page is the ground truth against which the automatic and AI renderings are measured.</p>", "feedback": "<p>Correct. You can only judge a tool's decisions after you have made your own.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because XSLT cannot transform XML into HTML.</p>", "feedback": "<p>Incorrect. Transforming XML into HTML is exactly what XSLT is for.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the hand-made page will replace the TEI file as the master copy.</p>", "feedback": "<p>Incorrect. The TEI file remains the master; the page is one rendering of it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because automatic renderings are never used in real editing projects.</p>", "feedback": "<p>Incorrect. Real projects test their encodings with XSLT stylesheets routinely.</p>"}]}}, {"step": 28, "title": "Hypothetical Scenario: The Quotation That Went Wrong", "content": "**Hypothetical Scenario: The Quotation That Went Wrong**\n\n*This scenario is invented to illustrate the risk; it describes no real person or edition.*\n\nA student writing a paper on colonial treaty language finds an online edition of a mid-eighteenth-century treaty. The page is clean and pleasant to read. The student quotes a clause in the paper, word for word, and comments on how \"modern\" the treaty's spelling seems for its date.\n\nThe professor checks the clause against a photograph of the original. The original spellings are quite different. The edition had regularized every word, which was a reasonable choice for a reading view. But the page gave no sign of it: no statement at the top, no hint on changed words, and no link to a diplomatic view. The student had no way to know.\n\nWho made the mistake? The student should have checked the edition's introduction. But the edition made the mistake easy. Its encoding may have been flawless, with every `<orig>` and `<reg>` in place, and its rendering still misled a careful reader.\n\nAsk yourself which of today's decisions would have prevented this. A one-sentence statement at the top of the page. A light mark on regularized words. A link to the diplomatic view. Each is cheap, and each belongs in your `RENDERING.md`.\n\n**Vocabulary.** *Hypothetical scenario* — An invented situation used to show a real risk. *Rendering statement* — A short note on a page telling readers which view they are seeing and what was changed.\n\n**Takeaway:** A perfect encoding can still mislead readers if the rendering hides its interventions; a rendering statement and a link to the diplomatic view prevent it.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Hypothetical Scenario: The Quotation That Went Wrong", "questiontext": "<p>In the scenario, the edition's encoding was flawless. What misled the student?</p>", "generalfeedback": "<p>A perfect encoding can still mislead readers if the rendering hides its interventions; a rendering statement and a link to the diplomatic view prevent it.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The rendering regularized every word without any statement, hint or link to the diplomatic view.</p>", "feedback": "<p>Correct. A perfect encoding can still mislead if the rendering hides its interventions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI file was missing every &lt;orig&gt; element.</p>", "feedback": "<p>Incorrect. The scenario says the encoding had every &lt;orig&gt; and &lt;reg&gt; in place.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The photograph of the original was mislabelled.</p>", "feedback": "<p>Incorrect. The photograph is how the professor caught the problem.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Regularization is never acceptable in a reading view.</p>", "feedback": "<p>Incorrect. Regularizing was reasonable; hiding it was the failure.</p>"}]}}, {"step": 29, "title": "Saving Your Work in Git", "content": "**Saving Your Work in Git**\n\nYour rendering is part of your edition, so it belongs in your repository with everything else. Organize it so that anyone, including you in December, can see how the parts fit together.\n\nA simple layout is:\n\n<table>\n  <thead>\n    <tr><th>File</th><th>What it holds</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><code>RENDERING.md</code></td><td>Your decision table, your readers, and your checks</td></tr>\n    <tr><td><code>rendering/edition.html</code></td><td>The hand-written page with both layers</td></tr>\n    <tr><td><code>rendering/diplomatic.css</code></td><td>Rules for the diplomatic view</td></tr>\n    <tr><td><code>rendering/reading.css</code></td><td>Rules for the reading view</td></tr>\n  </tbody>\n</table>\n\nCommit in small steps, as you learned in Week 1. Commit `RENDERING.md` once your decisions are written, before you write any code, with a message such as `docs: record rendering decisions for diplomatic and reading views`. Commit the HTML and each stylesheet separately once they work. If a later change breaks the page, these small commits let you see exactly what changed and step back.\n\nThe order of those commits also tells a story. It shows that you decided first and coded second, which is the method of the whole course.\n\n**Vocabulary.** *Repository layout* — The arrangement of folders and files in a project, chosen so others can find their way. *Atomic commit* — A commit that records one complete, self-contained change.\n\n**Takeaway:** Keep `RENDERING.md`, your HTML page and both stylesheets in your repository, and commit your decisions before your code.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Saving Your Work in Git", "questiontext": "<p>In what order should you commit your Step 1 work?</p>", "generalfeedback": "<p>Keep <code>RENDERING.md</code>, your HTML page and both stylesheets in your repository, and commit your decisions before your code.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<code>RENDERING.md</code> first, once your decisions are written, then the HTML and each stylesheet separately once they work.", "feedback": "<p>Correct. Small commits in that order show that you decided first and coded second.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Everything in one commit at the end of the week.</p>", "feedback": "<p>Incorrect. One large commit hides the order of your work and makes mistakes hard to undo.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The stylesheets first, then the decisions that justify them.</p>", "feedback": "<p>Incorrect. Decisions come before code.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only the HTML; decision files do not belong in the repository.</p>", "feedback": "<p>Incorrect. <code>RENDERING.md</code> is part of your edition and belongs in the repository.</p>"}]}}, {"step": 30, "title": "Review and Step 1 Checklist", "content": "**Review and Step 1 Checklist**\n\nToday you moved your edition from a file that only machines and editors can read to a page that anyone can open in a browser. More importantly, you made every display decision yourself, in writing, before any tool could make it for you.\n\nBefore you leave, confirm each item below:\n\n<ol>\n  <li><strong>Readers named:</strong> Does <code>RENDERING.md</code> name two or three real readers of your edition and what each needs to do with it?</li>\n  <li><strong>Decision table complete:</strong> Does it give a diplomatic and a reading decision for every element in your <code>&lt;body&gt;</code>, including line breaks, every <code>&lt;choice&gt;</code> pair, <code>&lt;unclear&gt;</code>, <code>&lt;gap/&gt;</code>, and structural elements?</li>\n  <li><strong>Page built:</strong> Does <code>rendering/edition.html</code> hold at least ten lines of your document, with both layers of every <code>&lt;choice&gt;</code>, and the correct <code>charset</code> and <code>lang</code>?</li>\n  <li><strong>Two views working:</strong> Do <code>diplomatic.css</code> and <code>reading.css</code> each produce the right view when linked?</li>\n  <li><strong>Honest marks:</strong> Are gaps and uncertain readings visible in both views without relying on colour, and does each view carry a rendering statement?</li>\n  <li><strong>Checked and valid:</strong> Have you done the read-back and word-count checks, and does the page pass the HTML validator?</li>\n  <li><strong>Committed:</strong> Are your decisions and your code committed in separate, clearly described commits?</li>\n</ol>\n\nOn Wednesday you will render the same file automatically with XSLT and with CETEIcean, and compare the results with the page you made today.\n\n**Vocabulary.** *Step 1 milestone* — The completed manual rendering and decision record, fixed as the standard for the rest of the week.\n\n**Takeaway:** Completing Step 1 gives you a written set of display decisions and a hand-made page that carries them out, the standard against which every automatic rendering this week will be judged.\n\n---\n\n## References\n\nBausi, A., Borbone, P. G., Briquel-Chatonnet, F., Buzi, P., Gippert, J., Macé, C., Maniaci, M., Melissakis, Z., Parodi, L. E., & Witakowski, W. (Eds.). (2015). *Comparative oriental manuscript studies: An introduction*. COMSt.\n\nHuskey, S. J. (2024). Committing to reproducibility and explainability: Using Git as a research journal. *International Journal of Digital Humanities, 6*, 9–21. https://doi.org/10.1007/s42803-023-00076-9\n\nPierazzo, E. (2016). Modelling digital scholarly editing: From Plato to Heraclitus. In M. J. Driscoll & E. Pierazzo (Eds.), *Digital scholarly editing: Theories and practices* (pp. 41–58). Open Book Publishers. https://doi.org/10.11647/OBP.0095.03\n\nWeigl, D. M., Janjuš, O., Rosmer, S., de Valk, R., Burghoff, H., Schöning, K., Kyriazis, I., Jaklin, J., Rauber, A., Bürgermeister, M., Steindl, C., & Bischoff, S. (2025). Collaborative workflows for encoding, validating, and publishing a multimodal digital edition. In *Proceedings of the 12th International Conference on Digital Libraries for Musicology (DLfM 2025)*. ACM. https://doi.org/10.1145/3748336.3748349", "html": null, "image_b64": null, "question": {"name": "30 Question: Review and Step 1 Checklist", "questiontext": "<p>Which pair of items is required for Step 1 of the rendering week?</p>", "generalfeedback": "<p>Completing Step 1 gives you a written set of display decisions and a hand-made page that carries them out, the standard against which every automatic rendering this week will be judged.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A complete decision table in <code>RENDERING.md</code> and a hand-made HTML page with diplomatic and reading stylesheets.</p>", "feedback": "<p>Correct. Together they are the standard against which every automatic rendering this week is judged.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An XSLT stylesheet and a CETEIcean page.</p>", "feedback": "<p>Incorrect. Those are Wednesday's work; Step 1 is manual.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An AI-generated stylesheet and its audit report.</p>", "feedback": "<p>Incorrect. That is Friday's work.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A printed PDF of the edition and a new TEI schema.</p>", "feedback": "<p>Incorrect. Print stylesheets come on Wednesday, and no new schema is needed.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
</html>
