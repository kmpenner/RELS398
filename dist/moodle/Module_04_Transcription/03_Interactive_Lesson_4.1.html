to retype.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The software cannot produce output at all without first being given a transcription.</p>", "feedback": "<p>Incorrect. A general model produces output immediately. That it needs training data is a separate, weaker argument.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Machine output cannot be committed to git with the correct provenance labels.</p>", "feedback": "<p>Incorrect. It can, and Wednesday shows you how.</p>"}]}}, {"step": 26, "title": "A Worked Example", "content": "**A Worked Example**\n\nA short passage with everything marked up, so you can see the tags working together.\n\n```xml\n<pb n=\"42r\" facs=\"#f42r\"/>\n<lb n=\"1\" facs=\"#f42r_l01\"/>ἐν ἀρχῇ ἦν ὁ λόγος καὶ ὁ λό\n<lb n=\"2\" facs=\"#f42r_l02\"/>γος ἦν πρὸς τὸν <choice>\n    <abbr>θν</abbr>\n    <expan>θε<ex>ό</ex>ν</expan>\n  </choice> καὶ <choice>\n    <abbr>θς</abbr>\n    <expan>θε<ex>ό</ex>ς</expan>\n  </choice>\n<lb n=\"3\" facs=\"#f42r_l03\"/>ἦν ὁ λόγος οὗτος <unclear reason=\"faded\"\n    cert=\"medium\" resp=\"#KMP\" source=\"#natural\">ἦν</unclear> ἐν\n<lb n=\"4\" facs=\"#f42r_l04\"/>ἀρχῇ πρὸς τὸν <subst>\n    <del rend=\"strikethrough\">θεόν</del>\n    <add place=\"above\" hand=\"#hand2\">κύριον</add>\n  </subst>\n<lb n=\"5\" facs=\"#f42r_l05\"/><gap reason=\"lacuna\" extent=\"6\" unit=\"chars\"/>\n  διʼ αὐτοῦ ἐγένετο\n```\n\nLook at what this records besides the words. Two sacred names kept as written, with their spellings attached. One doubtful reading, with a reason, a confidence level, a named editor, and the photograph it was read from. A correction by a second person, recorded in both directions. A hole, with its size measured. A word left split across two lines.\n\nA tidied-up version of the same passage would read beautifully and keep none of it. Every one of those tags is evidence some later week needs — the short forms for Week 6, the correction for Week 7, the doubtful reading and the hole for Weeks 8 and 12.\n\n**Vocabulary.** *Worked example* — a complete small case showing the method end to end. *Apparatus* — the record of variant readings printed alongside an edited text.\n\n**Takeaway:** The encoding records abbreviation, uncertainty, correction, and loss — all evidence that later weeks need and that a clean transcription discards.\n\n---", "image_b64": null, "question": {"name": "26 Question: A Worked Example", "questiontext": "<p>Beyond the words themselves, what does the worked example record that a tidied-up transcription would lose?</p>", "generalfeedback": "<p>The encoding records abbreviation, uncertainty, correction, and loss — all evidence that later weeks need and that a clean transcription discards.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Short forms as written, a doubtful reading with its cause and source, a correction by a second hand, and a measured hole.</p>", "feedback": "<p>Correct. Every one of those is evidence a later week needs — Week 6 for the short forms, Week 7 for the correction, Weeks 8 and 12 for the doubt and the loss.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The line numbering, which a tidied version would renumber from one.</p>", "feedback": "<p>Incorrect. Line numbering survives tidying easily. What is lost is the evidential markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Greek accents, which tidying always removes.</p>", "feedback": "<p>Incorrect. Tidying usually keeps accents — it may even add ones the scribe omitted. The losses are elsewhere.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The file's character encoding, which changes when text is regularized.</p>", "feedback": "<p>Incorrect. Encoding is unrelated to whether the text has been regularized.</p>"}]}}, {"step": 27, "title": "Checklist Before You Leave", "content": "**Checklist Before You Leave**\n\nCheck these rather than assuming them.\n\n- One page typed completely, at full zoom.\n- Every line has an `<lb/>` with a number and an image link.\n- The `<lb/>` count equals the `<zone>` count.\n- Short forms encoded with `<choice>`, `<abbr>`, `<expan>`, `<ex>`.\n- Doubtful readings marked `<unclear>` with a reason and a confidence.\n- Holes marked `<gap/>` with a measured size.\n- Scribal corrections encoded with `<subst>`, `<del>`, `<add>`.\n- The file passes schema validation.\n- Accents stored consistently; the hook ran.\n- `transcription/CONVENTIONS.md` written and committed.\n- `transcription/HAND.md` written and committed.\n- Accent height noted for tomorrow.\n- Committed with the provenance labels.\n- The ground truth version tagged.\n\nFinish anything outstanding before Wednesday rather than carrying it over. Tomorrow's work builds straight on this file, and an unchecked transcription stops the session.\n\n**Vocabulary.** *Provenance labels* — the commit lines recording whether text was made by a person or a machine. *Validation* — checking a file against its schema.\n\n**Takeaway:** Finish and validate before Wednesday — tomorrow's work builds directly on this file.\n\n---", "image_b64": null, "question": {"name": "27 Question: Checklist Before You Leave", "questiontext": "<p>Why finish and validate today rather than carrying unfinished work into Wednesday?</p>", "generalfeedback": "<p>Finish and validate before Wednesday — tomorrow's work builds directly on this file.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Tomorrow's work builds directly on this file, so an unchecked transcription stops the session.</p>", "feedback": "<p>Correct. You cannot correct line strips or train anything against a file that is not finished and valid.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the file is submitted for marking at the end of Tuesday.</p>", "feedback": "<p>Incorrect. The Transcription Assignment is due 2 October, at the end of Week 5.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because git will not let you commit an invalid XML file.</p>", "feedback": "<p>Incorrect. Git stores whatever you give it. Validation is your responsibility.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Transkribus validates the file on import and rejects invalid TEI.</p>", "feedback": "<p>Incorrect. It imports images, not your TEI file. The dependency is on your own next steps.</p>"}]}}, {"step": 28, "title": "Where This Leads", "content": "**Where This Leads**\n\n| Meeting | Step | What you do | Today's file serves as |\n| --- | --- | --- | --- |\n| Tue Sep 22 (#9) | Manual | Type it by hand | The product |\n| Wed Sep 23 (#10) | Software | Correct lines, train a model | Training examples |\n| Fri Sep 25 (#11) | AI, remote | LLM transcription and correction | Comparison reference |\n| Week 5 Tue (#12) | Manual | Type it twice, settle differences | The text being checked |\n| Week 5 Fri (#13) | Measurement | Score both machine attempts | The answer key |\n\nNotice that today's file does a different job each time. Training examples on Wednesday. A comparison on Friday. The thing being checked in Week 5. The answer key at the end of Week 5. One file, four jobs — which is why its quality spreads so far.\n\nThe **Transcription Assignment is due Friday October 2**, at the end of Week 5, and includes your reconciliation report. These two weeks are really one task: type it, automate it, compare, settle, measure, report.\n\n**Vocabulary.** *Reconciliation report* — your written account of the differences between versions and how you settled them. *Model* — the trained program that converts handwriting images into text.\n\n**Takeaway:** Today's file serves as training data, comparison reference, verification object, and measurement reference — four roles, one artefact.\n\n---", "image_b64": null, "question": {"name": "28 Question: Where This Leads", "questiontext": "<p>Today's file plays four different roles across the next two weeks. Name them.</p>", "generalfeedback": "<p>Today's file serves as training data, comparison reference, verification object, and measurement reference — four roles, one artefact.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Training examples on Wednesday, a comparison on Friday, the thing being checked in Week 5, and the answer key at the end of Week 5.</p>", "feedback": "<p>Correct. One file doing four jobs is why its quality spreads so far.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A draft, a corrected version, a final version, and a submitted version.</p>", "feedback": "<p>Incorrect. Those are stages of one file, not different roles it plays for different purposes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Training data, a backup, a marking record, and an archive copy.</p>", "feedback": "<p>Incorrect. Backup and archiving are not roles in the methodology.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An answer key on Wednesday, training data on Friday, and a draft in Week 5.</p>", "feedback": "<p>Incorrect — the order is reversed. It is training data on Wednesday and the answer key at the end of Week 5.</p>"}]}}, {"step": 29, "title": "What Good Work Looks Like Here", "content": "**What Good Work Looks Like Here**\n\n\"A transcription\" and \"a good transcription\" are different things.\n\nAn acceptable one is accurate, covers the whole page, and passes validation.\n\nA good one also:\n\n- Marks doubt honestly, including where you would rather not admit it.\n- Keeps short forms as written instead of quietly spelling them out.\n- Keeps scribal corrections in both directions.\n- Measures holes rather than just noting them.\n- States its own rules.\n- Records which photograph supported each difficult reading.\n- Says what is still unresolved after checking every image.\n- Has a commit history explaining the decisions.\n\nThe first is the hardest and the most telling. Marking a word `<unclear>` feels like admitting defeat, and the temptation is to pick the likelier reading and type it plainly. Resist that. An honest `<unclear>` is more useful to every later reader — including you in Week 8, building the apparatus — than a confident guess. It is the difference between recording evidence and announcing a conclusion.\n\n**Vocabulary.** *Apparatus* — the list of variant and doubtful readings accompanying an edition. *Evidence* — what the page shows, as distinct from what you concluded from it.\n\n**Takeaway:** Marking uncertainty honestly is the hardest and most diagnostic part of good transcription — a confident guess destroys the record of what was actually legible.\n\n---", "image_b64": null, "question": {"name": "29 Question: What Good Work Looks Like Here", "questiontext": "<p>Which part of good transcription is described as both the hardest and the most telling?</p>", "generalfeedback": "<p>Marking uncertainty honestly is the hardest and most diagnostic part of good transcription — a confident guess destroys the record of what was actually legible.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Marking doubt honestly, including where you would rather resolve it and move on.</p>", "feedback": "<p>Correct. An honest `&lt;unclear&gt;` is more useful to every later reader than a confident guess — it is the difference between recording evidence and announcing a conclusion.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Keeping the line numbering consistent across every folio.</p>", "feedback": "<p>Incorrect. Necessary and worth checking, but mechanical rather than difficult.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Encoding every abbreviation with the full `&lt;choice&gt;` structure.</p>", "feedback": "<p>Incorrect. Laborious, but it is a rule you can simply follow. Admitting doubt is a judgement you must resist avoiding.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Producing enough folios to train a usable model.</p>", "feedback": "<p>Incorrect. Volume comes later in the week and is explicitly not today's priority.</p>"}]}}, {"step": 30, "title": "Synthesis: The Anchor", "content": "**Synthesis: The Anchor**\n\nOne idea holds this meeting and the whole week together.\n\nAutomated transcription is always measured *against something*. A character score is a distance from a reference. A word score is a distance from a reference. Every claim that a program is accurate, or better than another program, or good enough for a given manuscript, is a claim about distance from a reference. Without one, the output is text of unknown quality, and no amount of cleverness in the program supplies what the reference supplies (AlKendi et al., 2024).\n\nThat reference has to be made by hand, diplomatically, by someone who has read the page. This is not a shortcoming of today's technology that a better model will fix one day. It is structural. A ruler cannot be checked against itself, and a program's own output cannot show whether the program is right.\n\nThat is what makes the manual step unavoidable rather than merely traditional, and why Tuesday comes before Wednesday every week of this course. The three-step cycle is not hand work followed by better machine work. It is building a measuring instrument, then taking two measurements with it.\n\n**For Wednesday.** Bring the seven items in section 22, especially your note on accent height. You will be correcting line boxes before you train anything.\n\n**For Friday.** Remote. Check your whole setup per section 23 before then.\n\n**Vocabulary.** *Reference* — the correct version everything else is scored against. *Three-step cycle* — this course's weekly pattern of manual, then deterministic, then AI-assisted work.\n\n**Takeaway:** Automation is always measured against a reference, and a reference cannot be produced by the thing it measures — which is why the manual step is irreducible rather than merely traditional.\n\n---\n\n## References\n\nAlKendi, W., Gechter, F., Heyberger, L., & Guyeux, C. (2024). Advancements and\nchallenges in handwritten text recognition: A comprehensive survey. *Journal of\nImaging*.\n\nClérice, T., Pinche, A., Chagué, A., Camps, J.-B., Vlachou-Efstathiou, M., Levenson,\nM. G., Brisville-Fertin, O., Boschetti, F., & Fischer, F. (2024). CATMuS Medieval:\nA multilingual large-scale cross-century dataset in Latin script for handwritten\ntext recognition and beyond. In *International Conference on Document Analysis and\nRecognition (ICDAR)*.\n\neScriptorium/Kraken. (2024). *eScriptorium platform documentation*.\nhttps://escriptorium.eu/about\n\nGeelhaar, T. (2022). *Carolingian minuscule model CMM 9th–11th c.* Transkribus\nModel. https://www.transkribus.org/models/latin-carolingian-minuscule\n\nLevchenko, M. A. (2024). *Evaluating LLMs for historical document OCR: A\nmethodological framework for digital humanities*.\n\nPerdiki, E., & Konstantinidou, M. (2023). Preparing big manuscript data for\nhierarchical clustering with minimal HTR training. *Journal of Data Mining &\nDigital Humanities*. https://jdmdh.episciences.org/12664/pdf\n\nPuigcerver, J. (2017). *PyLaia: A deep learning toolkit for handwritten document\nanalysis*. https://github.com/jpuigcerver/PyLaia\n\nTEI Consortium. (2026). *TEI P5: Guidelines for electronic text encoding and\ninterchange*. https://www.tei-c.org/release/doc/tei-p5-doc/en/html/", "image_b64": null, "question": {"name": "30 Question: Synthesis: The Anchor", "questiontext": "<p>Why is the manual step described as unavoidable rather than merely traditional?</p>", "generalfeedback": "<p>Automation is always measured against a reference, and a reference cannot be produced by the thing it measures — which is why the manual step is irreducible rather than merely traditional.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A ruler cannot be checked against itself, so a program's own output cannot show whether the program is right.</p>", "feedback": "<p>Correct. This is structural, not a shortcoming of current technology that a better model will one day fix.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because no software currently reaches an acceptable error rate on Greek manuscripts.</p>", "feedback": "<p>Incorrect. Some do very well. Even a perfect program would still need an independent reference to be shown to be perfect.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because copyright rules require a human-produced transcription in a scholarly edition.</p>", "feedback": "<p>Incorrect. The argument is about measurement, not about rights.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the manual step is the only one that produces valid TEI.</p>", "feedback": "<p>Incorrect. Machine output can be encoded as valid TEI. The issue is what it can be measured against.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
