n up, which is documented to make the result worse.</p>", "feedback": "<p>Correct. It cannot see the picture, so it corrects toward the ordinary — damaging precisely the unusual readings you are recording.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Correct it by hand, since corrections introduce your own expectation errors.</p>", "feedback": "<p>Incorrect. Correcting by hand against the image is exactly the intended workflow.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Commit it to the repository before it has been checked.</p>", "feedback": "<p>Incorrect. That is required — raw output must be committed unchecked so it can be scored.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Use it to extend the transcription onto further leaves.</p>", "feedback": "<p>Incorrect. That is the point of having trained it, provided it scores well enough.</p>"}]}}, {"step": 26, "title": "The Bigger Point", "content": "**The Bigger Point**\n\nStep back from transcription, because this pattern returns every week for the rest of the term.\n\nEach week runs the same job three ways: by hand, with a specialized tool, and with AI. That structure is not about transcription. It is a general way of judging computational tools in scholarly work, and the logic is the same each time.\n\nThe manual step builds a reference and, just as importantly, builds *your* understanding of the material. The specialized step shows what a bounded, purpose-built tool produces — fast, consistent, limited to what it was made for. The AI step shows what an unbounded general tool produces — faster still, more flexible, and capable of failures the other two structurally cannot commit.\n\nComparing them gives you something none of the three gives alone: a measured account of what each is good for on *this* material. That is the only sound basis for choosing tools.\n\nNotice that the method needs the manual step to come first and to be done properly. Every measurement is a distance from the reference, and a damaged reference damages everything computed from it. That is why Tuesday is not a warm-up.\n\n**Vocabulary.** *Bounded* — limited to a defined range. *Unbounded* — not restricted to any particular domain.\n\n**Takeaway:** The three-step cycle is a general method for evaluating tools against material, and it collapses if the manual reference is compromised.\n\n---", "image_b64": null, "question": {"name": "26 Question: The Bigger Point", "questiontext": "<p>Why does the three-step cycle collapse if the manual step is done badly?</p>", "generalfeedback": "<p>The three-step cycle is a general method for evaluating tools against material, and it collapses if the manual reference is compromised.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Every measurement is a distance from the reference, so a damaged reference damages everything computed from it.</p>", "feedback": "<p>Correct. That is why Tuesday is not a warm-up.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the specialized tool cannot be trained without a perfect transcription.</p>", "feedback": "<p>Incorrect. It trains on imperfect material readily — the problem is what the results then mean.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the AI step is run first and depends on the manual output.</p>", "feedback": "<p>Incorrect. The AI step is last, and needs no input from you but a picture.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the comparison requires all three to have the same error rate.</p>", "feedback": "<p>Incorrect. They will differ enormously, and that difference is the finding.</p>"}]}}, {"step": 27, "title": "Counting the Cost Honestly", "content": "**Counting the Cost Honestly**\n\nOne more comparison, because quality without cost is half an argument.\n\n| Method | Setup | Cost per leaf afterwards | Quality here |\n| --- | --- | --- | --- |\n| By hand | None | Highest | The reference |\n| Trained model | A whole session | Low, plus correcting | Your figure |\n| General AI | Minutes | Very low, plus correcting | Your figure |\n\nFill the right column from today's measurements and the middle from your own timings.\n\nThe comparison genuinely has three dimensions and resists a simple ranking. Typing by hand costs nothing to set up and the most per leaf. The trained model costs a session to set up and little per leaf — so it pays off across many leaves and does not pay off across four. The general AI costs almost nothing either way and, on old material, may produce output not worth correcting at all.\n\nThe threshold governs. Past roughly 15% wrong, correcting costs more than typing, and a tool being cheap per leaf is irrelevant if its output has to be thrown away (AlKendi et al., 2024).\n\nFor a passage of twenty to forty lines — your edition — the honest sum may well be that typing by hand beats the trained model, because the setup never pays for itself. Say so if you find it. The value of the exercise is in having measured the trade-off on real material, not in reaching a conclusion someone decided in advance.\n\n**Vocabulary.** *Setup cost* — the one-off effort before any output. *Marginal cost* — what each additional unit costs after that.\n\n**Takeaway:** For a short passage, HTR's setup cost may never amortize — say so if you find it, because the measurement is the point.\n\n---", "image_b64": null, "question": {"name": "27 Question: Counting the Cost Honestly", "questiontext": "<p>Why might typing by hand beat the trained model for a passage of twenty to forty lines?</p>", "generalfeedback": "<p>For a short passage, HTR's setup cost may never amortize — say so if you find it, because the measurement is the point.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The trained model costs a whole session to set up, and across so few leaves that setup never pays for itself.</p>", "feedback": "<p>Correct. Say so if you find it — the value is in having measured the trade-off on real material.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the trained model is less accurate than a person on short passages.</p>", "feedback": "<p>Incorrect. Accuracy does not depend on passage length. The argument is about setup cost.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because short passages cannot supply enough examples to train anything.</p>", "feedback": "<p>Incorrect. One leaf is enough for a first model — the issue is whether the effort repays.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the platform charges a minimum fee regardless of passage length.</p>", "feedback": "<p>Incorrect. The cost being counted is your time, not a fee.</p>"}]}}, {"step": 28, "title": "Committing and Pushing", "content": "**Committing and Pushing**\n\nClose the week out properly.\n\nEverything committed today should carry full provenance. Check with the audit commands:\n\n```bash\ngit log --grep=\"AI-Generated: true\" --oneline\ngit log --grep=\"Human-Verified: false\" --oneline\n```\n\nThe second lists what a machine wrote and nobody has checked. If you have corrected today's output, commit the corrections separately, and that commit should say `Human-Verified: true`.\n\nTag today's raw output:\n\n```bash\ngit tag -a vlm-w4-raw -m \"Raw VLM output, [model/version], before correction\"\ngit push --tags\n```\n\nPush everything, tags included. **Tags are not pushed by default.** The three tagged states from this week — `gt-f42r`, `htr-w4-raw`, `vlm-w4-raw` — are what Week 5's measurement goes and fetches. A tag that exists only on this laptop is a tag Week 5 cannot use if you work from anywhere else.\n\nCheck the push worked and the tags are on the remote before you stop. A remote session that ends with unpushed work is a session you may have to repeat.\n\n**Vocabulary.** *Remote* — the copy of your repository on the server. *Push* — send your commits to it.\n\n**Takeaway:** Push tags explicitly — they are not pushed by default, and Week 5's measurement retrieves the tagged states.\n\n---", "image_b64": null, "question": {"name": "28 Question: Committing and Pushing", "questiontext": "<p>What is easy to forget when pushing at the end of today, and why does it matter?</p>", "generalfeedback": "<p>Push tags explicitly — they are not pushed by default, and Week 5's measurement retrieves the tagged states.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Tags are not pushed by default, and Week 5's measurement fetches the three tagged versions.</p>", "feedback": "<p>Correct. A tag that exists only on this laptop is one Week 5 cannot use from anywhere else.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Commits are not pushed unless each is pushed individually.</p>", "feedback": "<p>Incorrect. A single push sends all commits on the branch.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The provenance labels must be added again after pushing.</p>", "feedback": "<p>Incorrect. They are part of the commit message and travel with it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Raw output must be pushed to a separate branch from corrections.</p>", "feedback": "<p>Incorrect. Separate commits, not separate branches.</p>"}]}}, {"step": 29, "title": "Pulling the Week Together", "content": "**Pulling the Week Together**\n\nWhat Topic 4 established, across three meetings.\n\nTuesday: a diplomatic transcription keeps what the manuscript shows — short forms, doubts, corrections, damage. It is made by hand, zoomed in, by somebody reading rather than expecting. And it serves at once as training material, as a comparison, as the thing being checked, and as the answer key.\n\nWednesday: finding the lines comes before reading them, and faults in the first wreck the second. The strips must include Greek accents or the model never sees them. Starting from a matched existing model is decisive. And a specialist's limited competence makes it fail loudly rather than smoothly.\n\nFriday: general AI models collapse on historical material despite excelling on modern. They fail in ways specialists cannot — inventing old spellings, fabricating fluently, mangling the structure. And a good score can sit alongside the destruction of everything that made the transcription faithful.\n\nThe thread: automation speeds the work and depends on a hand-made diplomatic reference, because that is the only thing its errors can be measured against (AlKendi et al., 2024).\n\nWeek 5 takes that reference, improves it by typing it twice, and does the measuring properly.\n\n**Vocabulary.** *Topic* — one week's unit of this course. *Ground truth* — the hand-made reference everything is scored against.\n\n**Takeaway:** Three meetings, one thesis — automation accelerates transcription and depends absolutely on a hand-produced reference to be evaluated at all.\n\n---", "image_b64": null, "question": {"name": "29 Question: Pulling the Week Together", "questiontext": "<p>State the thesis that ties all three meetings of this week together.</p>", "generalfeedback": "<p>Three meetings, one thesis — automation accelerates transcription and depends absolutely on a hand-produced reference to be evaluated at all.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Automation genuinely speeds the work and depends absolutely on a hand-made reference, because that is the only thing its errors can be measured against.</p>", "feedback": "<p>Correct. Tuesday built the reference, Wednesday measured a bounded tool against it, Friday an unbounded one.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Automated transcription is not yet good enough for scholarly work and should be avoided.</p>", "feedback": "<p>Incorrect. The specialized model may do very well. The claim is about what makes evaluation possible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Specialized tools are always better than general ones for every task.</p>", "feedback": "<p>Incorrect. General models excel at several tasks, including translating an existing transcription.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manual transcription is the most accurate method available.</p>", "feedback": "<p>Incorrect. It contains errors too — which is why Week 5 types the page a second time.</p>"}]}}, {"step": 30, "title": "Synthesis: Reading Well Is Not Reading Right", "content": "**Synthesis: Reading Well Is Not Reading Right**\n\nThe finding worth carrying out of this week.\n\nA general AI model pointed at a historical manuscript produces fluent text. It reads well. The Greek is grammatical, the vocabulary is plausible, the sentences finish properly. And on old material it may be wrong at rates approaching 80% of characters, may insert spellings from centuries before the document, and may supply confident readings for parchment carrying no legible ink at all (AlKendi et al., 2024; Levchenko, 2024).\n\nReading well and being right are independent properties. The systems best at the first are not the systems best at the second. That is the week's central lesson, and it reaches well past transcription: the better a tool is at producing plausible output, the less its plausibility tells you about its accuracy — and the more you must check against the source.\n\nThis is why the specialist's loud failures are a virtue. Output that announces its own doubt by being obviously wrong is safer than output that hides its doubt by being smooth. A model producing an impossible letter string has told you something true about the ink. A model producing a perfect word has told you something about its own expectations.\n\nAnd it is why the manual step cannot be removed. Only somebody who has read the parchment can tell those apart — and having read it, they hold the reference everything else is measured against.\n\n**Due Friday October 2.** The Transcription Assignment, including the reconciliation report, at the end of Week 5.\n\n**For Tuesday.** Week 5 opens with double-keying: type your leaf again, independently, without looking at Tuesday's version first. The independence is what makes the comparison worth anything.\n\n**Vocabulary.** *Fluency* — reading smoothly and naturally. *Fidelity* — matching the source faithfully. They are not the same thing.\n\n**Takeaway:** Fluency and fidelity are independent, and the more plausible a tool's output, the less its plausibility tells you about its accuracy.\n\n---\n## References\n\nAlKendi, W., Gechter, F., Heyberger, L., & Guyeux, C. (2024). Advancements and\nchallenges in handwritten text recognition: A comprehensive survey. *Journal of\nImaging*.\n\nClérice, T., Pinche, A., Chagué, A., Camps, J.-B., Vlachou-Efstathiou, M., Levenson,\nM. G., Brisville-Fertin, O., Boschetti, F., & Fischer, F. (2024). CATMuS Medieval:\nA multilingual large-scale cross-century dataset in Latin script for handwritten\ntext recognition and beyond. In *International Conference on Document Analysis and\nRecognition (ICDAR)*.\n\nColavizza, G., Ehrmann, M., & Bunout, E. (2022). Benchmarking large language\nmodels for handwritten text recognition. *Journal of Documentation*.\n\nGeelhaar, T. (2022). *Carolingian minuscule model CMM 9th–11th c.* Transkribus\nModel. https://www.transkribus.org/models/latin-carolingian-minuscule\n\nLevchenko, M. A. (2024). *Evaluating LLMs for historical document OCR: A\nmethodological framework for digital humanities*.\n\nLi, M., Lv, T., Chen, J., Cui, L., Lu, Y., Florencio, D., Zhang, C., Li, Z., & Wei,\nF. (2023). TrOCR: Transformer-based optical character recognition with pre-trained\nmodels. *Proceedings of the AAAI Conference on Artificial Intelligence, 37*(11),\n13094–13102.\n\nMattingly, W. J. B., et al. (2024). *When simpler is better: Evaluating translation\npipelines for medieval Latin manuscripts*.\n\nPerdiki, E., & Konstantinidou, M. (2023). Preparing big manuscript data for\nhierarchical clustering with minimal HTR training. *Journal of Data Mining &\nDigital Humanities*. https://jdmdh.episciences.org/12664/pdf\n\nPuigcerver, J. (2017). *PyLaia: A deep learning toolkit for handwritten document\nanalysis*. https://github.com/jpuigcerver/PyLaia\n\nRomein, C. A., et al. (2025). *Assessing advanced handwritten text recognition\nengines for digitizing historical documents*.\n\nTEI Consortium. (2026). *TEI P5: Guidelines for electronic text encoding and\ninterchange*. https://www.tei-c.org/release/doc/tei-p5-doc/en/html/", "image_b64": null, "question": {"name": "30 Question: Synthesis: Reading Well Is Not Reading Right", "questiontext": "<p>Why are the specialized model's loud, obvious failures described as a virtue?</p>", "generalfeedback": "<p>Fluency and fidelity are independent, and the more plausible a tool's output, the less its plausibility tells you about its accuracy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Output that announces its own doubt by being obviously wrong is safer than output that hides its doubt by being smooth.</p>", "feedback": "<p>Correct. An impossible letter string tells you something true about the ink; a perfect word tells you about the model's expectations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because obvious failures are easier for the platform to correct automatically.</p>", "feedback": "<p>Incorrect. Nothing corrects them automatically — they are easy for *you* to see.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because they occur less often than the general model's failures.</p>", "feedback": "<p>Incorrect. They may occur more often. Conspicuousness, not frequency, is the virtue.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because they indicate the model is close to the right reading.</p>", "feedback": "<p>Incorrect. They indicate the ink was genuinely unclear, not that the answer is nearly right.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
