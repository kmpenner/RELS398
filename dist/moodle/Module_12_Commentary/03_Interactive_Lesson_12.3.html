    <script>
        const lessonData = {"course_title": "AI-Assisted Commentary Drafting, Intertextual Verification, and Philological Vetting", "subtitle": "RELS 398 / ENGL 398 Digital Methods", "total_sections": 30, "slides": [{"step": 1, "title": "Entering Step 3: AI-Assisted Commentary Drafting", "content": "**Entering Step 3: AI-Assisted Commentary Drafting**\n\nThis week we have examined how editors build scholarly commentary for historical documents. On Tuesday, you drafted notes by hand. You identified linguistic puzzles, historical people, and literary echoes in your text. On Wednesday, you explored rule-based algorithms. You tested stoplists, phrase matching, and W3C Web Annotation links.\n\nToday is Friday, Meeting #33. We arrive at Step 3 of our comparative cycle: **artificial intelligence**.\n\nLarge language models (such as Claude and Gemini) can draft commentary notes quickly. Unlike simple keyword matching, AI models understand syntax and semantic meaning. They can summarize complex historical context, translate archaic phrasing, and draft explanatory paragraphs in seconds.\n\nHowever, computational speed introduces serious editorial hazards. Language models predict plausible words based on statistical patterns. They do not consult verified archives unless we guide them. They can fabricate citations, misinterpret legal terms, and smooth away real historical difficulties.\n\nToday you will evaluate AI models as drafting assistants. You will test their suggestions against your Tuesday manual notes and Wednesday rule-based results.\n\n**Vocabulary.** *Generative AI* — computational models that generate text by predicting probable words from training data. *Human-in-the-Loop (HITL)* — an editorial workflow where human scholars review and approve every automated proposal.\n\n**Takeaway:** AI models generate commentary quickly through semantic inference, but human editors must verify every claim against primary sources.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: Entering Step 3: AI-Assisted Commentary Drafting", "questiontext": "<p>Why must human editors audit commentary notes drafted by generative AI models?</p>", "generalfeedback": "<p>AI models generate commentary quickly through semantic inference, but human editors must verify every claim against primary sources.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because AI models predict words based on statistical patterns and can fabricate citations unless checked against primary sources.</p>", "feedback": "<p>Correct. Language models predict plausible text but do not inherently know whether historical claims or citations are true.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models cannot generate English sentences grammatically.</p>", "feedback": "<p>Incorrect. Modern AI models write fluent, highly grammatical prose; the danger is factual inaccuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the TEI guidelines strictly forbid computers from drafting XML.</p>", "feedback": "<p>Incorrect. TEI markup supports recording computational provenance through the @resp attribute.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models run too slowly to produce useful drafts in a classroom.</p>", "feedback": "<p>Incorrect. Generative models produce drafts in seconds; speed is their main advantage.</p>"}]}}, {"step": 2, "title": "Semantic Inference vs Lexical Matching", "content": "**Semantic Inference vs Lexical Matching**\n\nTo understand AI commentary, we must contrast **lexical matching** with **semantic inference**:\n<ul>\n  <li><strong>Lexical Matching (Wednesday):</strong> Finds exact words or lemmatized forms. If two documents use different words for the same idea, keyword matching fails.</li>\n  <li><strong>Semantic Inference (Friday):</strong> Models words in high-dimensional vector spaces. The AI recognizes related concepts, synonyms, and thematic motifs even when no words match directly.</li>\n</ul>\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 25%;\">Analytical Feature</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">Rule-Based Matching (Wed)</th>\n      <th style=\"padding: 8px; text-align: left; width: 40%;\">AI Semantic Inference (Fri)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Matching Basis</strong></td>\n      <td style=\"padding: 8px;\">Exact character strings and word stems</td>\n      <td style=\"padding: 8px;\">Contextual meanings and thematic associations</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Synonym Handling</strong></td>\n      <td style=\"padding: 8px;\">Blind to synonyms unless manually listed</td>\n      <td style=\"padding: 8px;\">Understands equivalent concepts easily</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Primary Weakness</strong></td>\n      <td style=\"padding: 8px;\">Misses idea paraphrases</td>\n      <td style=\"padding: 8px;\">Invents connections that never existed historically</td>\n    </tr>\n  </tbody>\n</table>\n\nFor example, consider Andromeda's 1752 Peace and Friendship Treaty. The text mentions \"liberty of hunting and fishing.\" A rule-based search only finds identical legal phrasing. An AI model recognizes idea links to colonial resource rights and Mi'kmaw sovereignty.\n\n**Takeaway:** Semantic inference allows AI models to connect related ideas across different vocabularies, acting as powerful hypothesis generators.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: Semantic Inference vs Lexical Matching", "questiontext": "<p>How does AI semantic inference differ from rule-based lexical matching when analyzing historical texts?</p>", "generalfeedback": "<p>Semantic inference allows AI models to connect related ideas across different vocabularies, acting as powerful hypothesis generators.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Semantic inference recognizes related concepts, synonyms, and themes even when no exact words are shared.</p>", "feedback": "<p>Correct. By modeling words in high-dimensional vector spaces, AI connects thematic ideas across differing vocabularies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Semantic inference only works on numbers and dates, while lexical matching works on letters.</p>", "feedback": "<p>Incorrect. Both techniques analyze textual words and phrases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Semantic inference guarantees 100% historical truth with zero errors.</p>", "feedback": "<p>Incorrect. Semantic inference is prone to hallucinating connections that never existed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Lexical matching understands poetic metaphors better than neural networks.</p>", "feedback": "<p>Incorrect. Lexical matching is blind to metaphors unless words match character-for-character.</p>"}]}}, {"step": 3, "title": "AI Capabilities in Commentary Drafting", "content": "**AI Capabilities in Commentary Drafting**\n\nWhen given clear guidelines, modern AI models excel at specific editorial tasks:\n<ul>\n  <li><strong>Drafting Historical Context:</strong> Summarizing background events, political institutions, and social customs of an era.</li>\n  <li><strong>Explaining Technical Terms:</strong> Defining historical legal phrases, archaic units of currency, and specialized trade jargon.</li>\n  <li><strong>Paraphrasing Complex Syntax:</strong> Unpacking convoluted legal clauses into plain language for modern readers.</li>\n  <li><strong>Structuring Data:</strong> Formatting prose notes into structured TEI XML or JSON-LD tags.</li>\n</ul>\n\nConsider our cohort documents:\n<ul>\n  <li><strong>Ace (1791 French Decree):</strong> The model explains the monetary depreciation of paper <em>assignats</em> during the French Revolution.</li>\n  <li><strong>Olyvia (1967 Maud Lewis Letter):</strong> The model identifies folk art terminology, Nova Scotia postal routes, and regional prices in 1967.</li>\n  <li><strong>Andromeda (1752 Treaty):</strong> The model outlines the roles of Governor Peregrine Hopson and Mi'kmaw Chief Jean-Baptiste Cope in Halifax.</li>\n</ul>\n\nThe model acts as an eager research assistant. It produces a first draft in seconds, saving hours of initial typing.\n\n**Takeaway:** AI models speed up commentary drafting by providing historical summaries, defining specialized terms, and structuring note metadata.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: AI Capabilities in Commentary Drafting", "questiontext": "<p>Which editorial task is an AI assistant best suited to perform when drafting commentary?</p>", "generalfeedback": "<p>AI models speed up commentary drafting by providing historical summaries, defining specialized terms, and structuring note metadata.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Summarizing broad historical context, explaining archaic terms, and structuring prose notes into XML templates.</p>", "feedback": "<p>Correct. AI models excel at rapid contextual summarization, term definition, and data formatting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Conducting physical chemical tests on the paper fibers of the manuscript.</p>", "feedback": "<p>Incorrect. AI software has no physical sensors to test paper fibers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Guaranteeing that archival documents in local libraries will never suffer fire damage.</p>", "feedback": "<p>Incorrect. Digital software cannot provide physical disaster protection.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replacing human historians on academic editorial boards.</p>", "feedback": "<p>Incorrect. AI is an editorial assistant, not a replacement for human scholarship.</p>"}]}}, {"step": 4, "title": "The Epistemic Hazard: Citation Hallucination", "content": "**The Epistemic Hazard: Citation Hallucination**\n\nDespite their fluency, large language models present a major risk: **hallucination**.\n\nLanguage models are word-predicting text generators. They predict what word sounds natural next in a sentence. They do not know whether a historical claim is true or false. When asked for evidence, models often invent convincing details:\n<ul>\n  <li><strong>Fabricated Primary Sources:</strong> Citing archive files, treaty articles, or court cases that do not exist.</li>\n  <li><strong>Ghost Citations:</strong> Inventing author names, book titles, volume numbers, and page references that look scholarly but are completely fictitious.</li>\n  <li><strong>False Quotations:</strong> Producing plausible quotations in archaic English or French that never appear in real historical documents.</li>\n</ul>\n\nIn ordinary conversation, a minor error may go unnoticed. In a scholarly edition, an invented citation destroys the credibility of your research. A digital edition must be dependable. Readers rely on your notes to understand primary evidence.\n\n**Vocabulary.** *Hallucination* — a phenomenon where an AI model generates false information, citations, or quotations while sounding confident and authoritative. *Epistemic integrity* — the truthfulness and verifiable accuracy of scholarly claims.\n\n**Takeaway:** Because AI models predict words statistically, they can fabricate citations and historical evidence that appear completely genuine.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: The Epistemic Hazard: Citation Hallucination", "questiontext": "<p>What is citation hallucination in generative AI commentary?</p>", "generalfeedback": "<p>Because AI models predict words statistically, they can fabricate citations and historical evidence that appear completely genuine.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The fabrication of non-existent primary sources, book titles, archive references, or volume numbers that appear genuine.</p>", "feedback": "<p>Correct. Because models predict plausible-sounding words, they frequently invent realistic citations that do not exist.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A technical glitch that deletes the user's hard drive during an AI query.</p>", "feedback": "<p>Incorrect. Hallucination refers to generating false textual information, not disk formatting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When an AI model translates French text into Italian instead of English.</p>", "feedback": "<p>Incorrect. Language confusion is a translation error, not citation fabrication.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When a scanner misreads a letter due to low optical resolution.</p>", "feedback": "<p>Incorrect. Optical character misrecognition is an OCR scanning error.</p>"}]}}, {"step": 5, "title": "Cohort Hallucination Audit: Treaty Clauses and Maud Lewis", "content": "**Cohort Hallucination Audit: Treaty Clauses and Maud Lewis**\n\nLet us examine real examples of model hallucinations from our three student projects.\n\nWhen asked to provide historical notes for Andromeda's 1752 Treaty, an unconstrained model claimed:\n<p style=\"background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 12px; margin: 12px 0;\">\n<em>\"Article 9 of the 1752 Treaty specifies that all trade disputes shall be adjudicated before the Court of Admiralty in Boston.\"</em>\n</p>\n\nThis claim sounds official. But the 1752 Treaty contains only eight articles. Article 9 does not exist. Furthermore, trade disputes were managed in Halifax, not Boston. The model hallucinated the clause by blending details from older colonial records.\n\nSimilarly, when asked about Olyvia's 1967 letter from Maud Lewis to Leonard Kinnear, a model asserted:\n<p style=\"background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 12px; margin: 12px 0;\">\n<em>\"Leonard Kinnear was a prominent art dealer in Montreal who hosted Lewis's first solo gallery exhibition in November 1966.\"</em>\n</p>\n\nThis statement is entirely false. Leonard Kinnear was an amateur collector from New Brunswick who corresponded with Maud Lewis by mail. Maud Lewis never had a solo gallery show in Montreal in 1966.\n\n**Takeaway:** Never accept AI claims about archival people or legal articles without checking the primary documents directly.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Cohort Hallucination Audit: Treaty Clauses and Maud Lewis", "questiontext": "<p>Why did the AI model hallucinate an 'Article 9' when prompted about Andromeda's 1752 Peace and Friendship Treaty?</p>", "generalfeedback": "<p>Never accept AI claims about archival people or legal articles without checking the primary documents directly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because the model blended patterns from other colonial records, failing to recognize that the 1752 treaty contains only eight articles.</p>", "feedback": "<p>Correct. The model generated plausible colonial legal language without checking the primary document's eight-article boundary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the 1752 Treaty was written in modern French.</p>", "feedback": "<p>Incorrect. The 1752 Halifax treaty was composed in English.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the Nova Scotia Archives removed Article 9 in 2020.</p>", "feedback": "<p>Incorrect. The historical 1752 manuscript has always consisted of eight articles.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models refuse to read treaties written before 1800.</p>", "feedback": "<p>Incorrect. AI models process texts from all historical eras.</p>"}]}}, {"step": 6, "title": "Historical Anachronism and Conceptual Flattening", "content": "**Historical Anachronism and Conceptual Flattening**\n\nA second major danger is **anachronism**. AI models are trained mostly on modern internet text. As a result, they frequently project modern concepts onto historical documents:\n<ul>\n  <li><strong>Modern Legal Definitions:</strong> Interpreting 18th-century treaties using 21st-century contract law concepts.</li>\n  <li><strong>Modern Economic Concepts:</strong> Treating 1791 French <em>assignats</em> like modern fiat currency rather than land-backed revolutionary bonds.</li>\n  <li><strong>Biographical Misunderstandings:</strong> Describing Maud Lewis's folk paintings using modern commercial art marketing terminology.</li>\n</ul>\n\nThis tendency causes **idea flattening**. The model erases the unique historical oddities of the past. It replaces strange historical practices with familiar modern ideas.\n\nScholarly commentary must highlight the strangeness of the past. It should explain how historical people thought within their own time. When an AI replaces 18th-century concepts with modern clichés, the editor must step in and correct the text.\n\n**Vocabulary.** *Anachronism* — placing an event, person, or idea in a time period where it does not belong. *idea flattening* — erasing historical differences by describing past ideas with modern categories.\n\n**Takeaway:** AI models tend to project modern ideas onto historical records, requiring editors to guard against anachronism.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Historical Anachronism and Conceptual Flattening", "questiontext": "<p>What is 'conceptual flattening' in AI-generated historical commentary?</p>", "generalfeedback": "<p>AI models tend to project modern ideas onto historical records, requiring editors to guard against anachronism.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Erasing unique historical differences by explaining past ideas through familiar modern categories.</p>", "feedback": "<p>Correct. Conceptual flattening strips away the distinctive historical peculiarities of 18th-century practices.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Compressing an image file into a low-resolution JPEG.</p>", "feedback": "<p>Incorrect. Conceptual flattening is an intellectual distortion of historical ideas, not image compression.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ironing a wrinkled parchment page before photography.</p>", "feedback": "<p>Incorrect. Physical conservation is unrelated to conceptual flattening.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Converting all fonts in a TEI file to Arial.</p>", "feedback": "<p>Incorrect. Font styling is a layout choice, not conceptual flattening.</p>"}]}}, {"step": 7, "title": "Automation Bias and Editorial Vigilance", "content": "**Automation Bias and Editorial Vigilance**\n\nWhen working with AI tools, editors face a psychological trap called **automation bias**.\n\nAutomation bias is the human tendency to trust automated systems uncritically. When an AI outputs a beautifully written, grammatical paragraph with clear headings, our brains assume it is correct. We read quickly and miss factual errors.\n\nTo fight automation bias, you must adopt **editorial vigilance**:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 30%;\">Vigilance Habit</th>\n      <th style=\"padding: 8px; text-align: left; width: 70%;\">Action in VS Code</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Verify Every Date</strong></td>\n      <td style=\"padding: 8px;\">Check dates against archival metadata files in your workspace.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Check Every Person</strong></td>\n      <td style=\"padding: 8px;\">Look up historical figures in authority records like the Dictionary of Canadian Biography.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Confirm Quotations</strong></td>\n      <td style=\"padding: 8px;\">Search your transcription file using <code>Ctrl+F</code> to confirm the exact quoted string.</td>\n    </tr>\n  </tbody>\n</table>\n\nTreat every AI output as an unverified draft written by an eager student intern.\n\n**Takeaway:** Automation bias leads scholars to trust fluent AI prose; editors must actively verify dates, names, and quotes against primary files.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: Automation Bias and Editorial Vigilance", "questiontext": "<p>How can an editor counter automation bias when reviewing AI commentary drafts in VS Code?</p>", "generalfeedback": "<p>Automation bias leads scholars to trust fluent AI prose; editors must actively verify dates, names, and quotes against primary files.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By actively verifying every date, person, and quoted string against primary files in the workspace.</p>", "feedback": "<p>Correct. Editorial vigilance requires checking every factual claim rather than trusting fluent prose uncritically.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By accepting all suggestions without reading them to finish the assignment faster.</p>", "feedback": "<p>Incorrect. Uncritical acceptance is the exact definition of automation bias.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By turning off the computer monitor and guessing the answers.</p>", "feedback": "<p>Incorrect. Guessing blindly does not produce scholarly work.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the primary transcription file completely.</p>", "feedback": "<p>Incorrect. Primary transcription files are the foundation of your digital edition.</p>"}]}}, {"step": 8, "title": "The Epistemic Boundary: Public History vs Archival Witnesses", "content": "**The Epistemic Boundary: Public History vs Archival Witnesses**\n\nTo evaluate AI assistance, you must know what language models know and what they do not know.\n\nLanguage models have vast knowledge of **broad public history**:\n<ul>\n  <li>They know the major dates and battles of the French Revolution.</li>\n  <li>They know the names of British colonial governors and French monarchs.</li>\n  <li>They know general information about famous artists and historic treaties.</li>\n</ul>\n\nHowever, models have no direct access to **unique archival witnesses**:\n<ul>\n  <li>The model has never seen the physical letter Maud Lewis mailed to Leonard Kinnear in 1967.</li>\n  <li>The model does not know the exact ink corrections on Ace's copy of the 1791 French decree.</li>\n  <li>The model cannot see the wax seals or margin notations on Andromeda's 1752 treaty manuscript.</li>\n</ul>\n\nThis division defines your **epistemic boundary**. Use AI to draft general historical context. But rely exclusively on your own eyes and transcription files for the unique features of your manuscript.\n\n**Takeaway:** AI models excel at general historical background but know nothing about the physical peculiarities of your unique archival manuscript.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: The Epistemic Boundary: Public History vs Archival Witnesses", "questiontext": "<p>What falls outside an AI model's epistemic boundary when analyzing unique archival manuscripts?</p>", "generalfeedback": "<p>AI models excel at general historical background but know nothing about the physical peculiarities of your unique archival manuscript.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The physical ink strokes, unique margin notes, and specific archival corrections on your particular manuscript copy.</p>", "feedback": "<p>Correct. While models know broad historical facts, they have never inspected the physical peculiarities of your unique witness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The year the French Revolution began.</p>", "feedback": "<p>Incorrect. General public dates fall squarely within the AI model's training data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The names of famous British monarchs like King George II.</p>", "feedback": "<p>Incorrect. Broad historical figures are well known to AI models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The general definition of paper currency in economic history.</p>", "feedback": "<p>Incorrect. Broad conceptual history is easily handled by AI models.</p>"}]}}, {"step": 9, "title": "Designing Structured System Prompts for Commentary", "content": "**Designing Structured System Prompts for Commentary**\n\nCasual prompts produce poor commentary. If you ask an AI model, \"Tell me about this document,\" it returns rambling paragraphs filled with generic opinions.\n\nA scholarly **system prompt** guides the model with clear rules:\n<ol>\n  <li><strong>Role Definition:</strong> State the exact scholarly role (for example, \"You are an assistant editor in digital documentary editing\").</li>\n  <li><strong>Document Context:</strong> Provide the exact title, date, author, and archival repository of your source.</li>\n  <li><strong>Target Span:</strong> Supply the exact sentence or phrase you want to annotate, including its <code>xml:id</code> anchor.</li>\n  <li><strong>Target Category:</strong> Specify whether you want a philological, historical, or intertextual note.</li>\n  <li><strong>Audience Level:</strong> Ask for clear, concise prose suitable for undergraduate researchers.</li>\n</ol>\n\nWhen you provide concrete boundaries, the model focuses its attention on the specific passage. Its answers become factual, relevant, and useful.\n\n**Takeaway:** Structured system prompts define roles, context, target spans, and categories, forcing the AI to generate disciplined commentary drafts.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Designing Structured System Prompts for Commentary", "questiontext": "<p>What is the primary benefit of including the target span's xml:id in a commentary system prompt?</p>", "generalfeedback": "<p>Structured system prompts define roles, context, target spans, and categories, forcing the AI to generate disciplined commentary drafts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It anchors the model's attention to an exact passage and ensures the output note links to a stable XML identifier.</p>", "feedback": "<p>Correct. Providing the specific xml:id tethers the generated note directly to your transcription markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically purchases a software license for the AI model.</p>", "feedback": "<p>Incorrect. An xml:id is a markup identifier, not a financial payment token.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents anyone on the internet from reading your commentary.</p>", "feedback": "<p>Incorrect. XML IDs organize internal document structure, not internet firewalls.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the model to write in Latin instead of English.</p>", "feedback": "<p>Incorrect. Language output is governed by role instructions, not XML ID tags.</p>"}]}}, {"step": 10, "title": "Negative Prompt Constraints and Guardrails", "content": "**Negative Prompt Constraints and Guardrails**\n\nPositive instructions tell the AI what to do. **Negative constraints** tell the AI what it is strictly forbidden from doing.\n\nNegative guardrails are your best defense against hallucinated citations:\n<ul>\n  <li><em>\"Do NOT invent secondary source citations or page numbers.\"</em></li>\n  <li><em>\"Do NOT assume modern legal meanings for 18th-century terms.\"</em></li>\n  <li><em>\"If a historical fact is unverified or uncertain, explicitly write [UNVERIFIED].\"</em></li>\n  <li><em>\"Cite only primary sources included in the prompt context.\"</em></li>\n  <li><em>\"Keep explanations under 100 words per note.\"</em></li>\n</ul>\n\nForcing the model to output `[UNVERIFIED]` is especially effective. It gives the model permission to admit uncertainty instead of inventing a plausible lie.\n\nWhen you inspect the generated draft in VS Code, you can search for `[UNVERIFIED]` to see exactly where you need to do manual archive research.\n\n**Takeaway:** Negative prompt constraints prevent hallucinations by explicitly forbidding invented citations and demanding [UNVERIFIED] flags for uncertain claims.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Negative Prompt Constraints and Guardrails", "questiontext": "<p>Why is instructing an AI model to output '[UNVERIFIED]' for uncertain claims an effective guardrail?</p>", "generalfeedback": "<p>Negative prompt constraints prevent hallucinations by explicitly forbidding invented citations and demanding [UNVERIFIED] flags for uncertain claims.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It permits the model to admit ignorance rather than inventing a plausible lie or hallucinated citation.</p>", "feedback": "<p>Correct. Demanding an explicit flag for uncertainty breaks the model's tendency to fabricate facts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because [UNVERIFIED] causes VS Code to shut down automatically.</p>", "feedback": "<p>Incorrect. VS Code treats [UNVERIFIED] as ordinary text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the TEI validator crashes if it encounters uncertainty.</p>", "feedback": "<p>Incorrect. TEI markup supports editorial uncertainty through elements like <unclear> and <certainty>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because it proves that the student did not do any homework.</p>", "feedback": "<p>Incorrect. Identifying unverified claims is an essential step in honest research.</p>"}]}}, {"step": 11, "title": "Schema-Constrained Generation: Structured JSON and TEI Output", "content": "**Schema-Constrained Generation: Structured JSON and TEI Output**\n\nRaw text output from an AI model is difficult to integrate into digital editions. You must manually copy, paste, and reformat every sentence.\n\nInstead, you can instruct the model to produce **schema-constrained output** using JSON or TEI XML:\n<pre><code>{\n  \"target_id\": \"seg_assignat_01\",\n  \"category\": \"historical\",\n  \"lemma\": \"assignats\",\n  \"draft_note\": \"Paper currency issued during the French Revolution, backed by confiscated church lands.\",\n  \"confidence\": \"high\",\n  \"sources\": [\n    \"Archives Parlementaires, vol. 26\"\n  ]\n}</code></pre>\n\nDemanding structured fields forces the model to separate its claims into distinct parts:\n<ul>\n  <li><code>target_id</code> ensures the note links to an anchor in your transcription.</li>\n  <li><code>category</code> matches your editorial taxonomy from Lesson 12.1.</li>\n  <li><code>lemma</code> identifies the exact word being explained.</li>\n  <li><code>sources</code> isolates citations so you can verify them individually.</li>\n</ul>\n\nStructured output simplifies validation and allows automated scripts to parse the results.\n\n**Takeaway:** Requesting JSON or XML output forces the model to structure its commentary notes into distinct, machine-readable fields.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Schema-Constrained Generation: Structured JSON and TEI Output", "questiontext": "<p>Why is requesting JSON or XML output better than requesting free-flowing paragraphs for digital commentary?</p>", "generalfeedback": "<p>Requesting JSON or XML output forces the model to structure its commentary notes into distinct, machine-readable fields.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It forces the model to separate targets, categories, claims, and citations into machine-readable fields that scripts can parse.</p>", "feedback": "<p>Correct. Schema-constrained outputs allow automated validation and seamless integration into digital editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because JSON files take up zero bytes of storage space on disk.</p>", "feedback": "<p>Incorrect. JSON files occupy memory like any text file.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because free-flowing paragraphs are illegal under copyright law.</p>", "feedback": "<p>Incorrect. Prose paragraphs are completely legal but harder to parse computationally.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because XML cannot be read by human beings.</p>", "feedback": "<p>Incorrect. XML is designed to be readable by both humans and machines.</p>"}]}}, {"step": 12, "title": "Anchoring AI Notes to Stable XML Identifiers", "content": "**Anchoring AI Notes to Stable XML Identifiers**\n\nIn Lesson 12.1, you created stable anchors in your transcription files using `xml:id` attributes. Every note pointed to an anchor with a `@target` reference.\n\nWhen you generate notes with an AI assistant, you must maintain this anchoring discipline:\n<ul>\n  <li>Provide the AI with the list of valid `xml:id` attributes from your document.</li>\n  <li>Instruct the model to link every proposed note to an existing ID.</li>\n  <li>Forbid the model from creating new, unanchored notes.</li>\n</ul>\n\nConsider this example from Ace's 1791 decree:\n<pre><code>&lt;!-- In your transcription file --&gt;\n&lt;seg xml:id=\"seg_loi_1791_03\"&gt;fabrication des assignats&lt;/seg&gt;\n\n&lt;!-- In the AI-generated note --&gt;\n&lt;note type=\"historical\" target=\"#seg_loi_1791_03\" resp=\"#ai-draft\"&gt;\n  The French National Assembly authorized assignat production to stabilize public debt.\n&lt;/note&gt;</code></pre>\n\nNotice the `@resp` attribute. It records that this note was drafted by an AI model. Anchoring notes to stable IDs keeps your edition organized.\n\n**Takeaway:** AI-drafted commentary notes must point to valid xml:id anchors in your transcription, with provenance tracked in the resp attribute.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Anchoring AI Notes to Stable XML Identifiers", "questiontext": "<p>In TEI standoff commentary, what is the role of the @resp attribute on an AI-generated note?</p>", "generalfeedback": "<p>AI-drafted commentary notes must point to valid xml:id anchors in your transcription, with provenance tracked in the resp attribute.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It transparently attributes the note's drafting origin to an AI assistant rather than human scholarship.</p>", "feedback": "<p>Correct. The @resp attribute tracks editorial provenance, distinguishing machine drafts from human vetting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It specifies how many seconds the AI took to draft the sentence.</p>", "feedback": "<p>Incorrect. The @resp attribute indicates responsibility, not execution runtime.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes the background color of the webpage to red.</p>", "feedback": "<p>Incorrect. Provenance attributes carry editorial metadata, not visual styling.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents other scholars from citing the note.</p>", "feedback": "<p>Incorrect. Stating machine provenance informs readers without preventing citation.</p>"}]}}, {"step": 13, "title": "Philological Vetting: 18th-Century French and Colonial English", "content": "**Philological Vetting: 18th-Century French and Colonial English**\n\nAI models often misread historical vocabulary because words evolve over time. Editors must vet every linguistic claim:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 25%;\">Historical Word</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">AI Modern Misreading</th>\n      <th style=\"padding: 8px; text-align: left; width: 40%;\">Vetted Historical Meaning</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>cours forcé</strong> (1791 French)</td>\n      <td style=\"padding: 8px;\">Forced running or fast pace</td>\n      <td style=\"padding: 8px;\">Mandatory legal tender status for paper currency.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Truckhouse</strong> (1752 Treaty)</td>\n      <td style=\"padding: 8px;\">A garage or repair depot for trucks</td>\n      <td style=\"padding: 8px;\">A government trading post for regulated bartering of furs and goods.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Febuary</strong> (1967 Maud Lewis)</td>\n      <td style=\"padding: 8px;\">A spelling mistake that should be corrected</td>\n      <td style=\"padding: 8px;\">A phonetic folk spelling reflecting maritime Canadian speech patterns.</td>\n    </tr>\n  </tbody>\n</table>\n\nWhen vetting AI drafts, check historical dictionaries. For 18th-century French, check the 1798 *Dictionnaire de l'Académie française*. For colonial English, check the Oxford English Dictionary's historical quotations.\n\n**Takeaway:** Philological vetting catches humorous or misleading modern readings of historical vocabulary, restoring true archival meaning.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Philological Vetting: 18th-Century French and Colonial English", "questiontext": "<p>Why did the unvetted AI model incorrectly define 'Truckhouse' as an automobile repair garage in the 1752 Treaty?</p>", "generalfeedback": "<p>Philological vetting catches humorous or misleading modern readings of historical vocabulary, restoring true archival meaning.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because the model applied a modern 20th-century definition instead of the historical 18th-century meaning of a regulated fur-trading post.</p>", "feedback": "<p>Correct. Historical vetting catches anachronistic vocabulary shifts and restores authentic archival meaning.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the British army used pickup trucks during the Seven Years' War.</p>", "feedback": "<p>Incorrect. Motor vehicles were invented over a century after the 1752 treaty.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the treaty was translated into German before reaching Halifax.</p>", "feedback": "<p>Incorrect. The treaty was negotiated in English and Mi'kmaq.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the scribe wrote 'garage' in the margins of the manuscript.</p>", "feedback": "<p>Incorrect. The word garage does not appear in 18th-century colonial treaty manuscripts.</p>"}]}}, {"step": 14, "title": "Intertextual Allusion Detection: Real vs Imagined Parallels", "content": "**Intertextual Allusion Detection: Real vs Imagined Parallels**\n\nAI models excel at detecting thematic allusions across literary and legal traditions. Because they have seen millions of books, they notice echoes that human editors overlook.\n\nHowever, models frequently confuse thematic resemblance with actual textual borrowing:\n<ul>\n  <li><strong>Thematic Resemblance:</strong> Two texts discuss the same topic (such as peace, trade, or winter cold) using standard cultural imagery.</li>\n  <li><strong>Textual Borrowing:</strong> An author deliberately adapts or quotes an earlier document.</li>\n</ul>\n\nFor example, when examining Andromeda's 1752 Treaty, an AI might suggest an allusion to John Locke's *Second Treatise of Government* regarding property rights. While Locke influenced colonial thinking, there is no evidence the Halifax treaty authors quoted Locke directly.\n\nConversely, the model might correctly identify borrowing between the 1752 Treaty and the 1725 Dummer's Treaty. In that case, identical phrasing confirms genuine textual reuse.\n\nThe editor's job is to distinguish between genuine historical borrowing and accidental conceptual overlap.\n\n**Takeaway:** AI models discover interesting thematic parallels, but editors must verify whether an echo represents genuine historical borrowing or coincidence.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Intertextual Allusion Detection: Real vs Imagined Parallels", "questiontext": "<p>How should an editor verify an AI model's claim that a document quotes an earlier historical work?</p>", "generalfeedback": "<p>AI models discover interesting thematic parallels, but editors must verify whether an echo represents genuine historical borrowing or coincidence.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By confirming that both texts share distinctive verbatim phrasing or documented historical borrowing, rather than mere thematic coincidence.</p>", "feedback": "<p>Correct. Editors must distinguish deliberate borrowing from general cultural or topical overlap.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By accepting the claim if the AI sounds confident and polite.</p>", "feedback": "<p>Incorrect. AI confidence has no correlation with historical accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting both documents from the course syllabus.</p>", "feedback": "<p>Incorrect. Editors analyze documents rather than deleting them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By checking if both texts were printed in the exact same year.</p>", "feedback": "<p>Incorrect. Borrowing occurs across different years; identical printing dates do not prove intertextuality.</p>"}]}}, {"step": 15, "title": "Entity Linking and Authority Control (Wikidata and VIAF)", "content": "**Entity Linking and Authority Control (Wikidata and VIAF)**\n\nIn Lesson 12.1 and Module 9, you explored named entities. Commentary notes frequently explain historical persons and geographic places.\n\nYou can ask an AI model to propose authority control identifiers for historical entities:\n<ul>\n  <li><strong>Wikidata QIDs:</strong> Persistent identifiers for people, concepts, and places across all languages.</li>\n  <li><strong>VIAF IDs:</strong> Virtual International Authority File numbers used by global research libraries.</li>\n</ul>\n\nHere is how an AI assistant might propose authority links:\n<pre><code>{\n  \"entity\": \"Peregrine Hopson\",\n  \"role\": \"Governor of Nova Scotia (1752-1753)\",\n  \"wikidata_qid\": \"Q7168019\",\n  \"viaf_id\": \"104473859\"\n}</code></pre>\n\nAlways verify these identifiers in your browser before adding them to your TEI header or note tags. AI models occasionally mix up people with similar names, such as confusing Peregrine Hopson with his uncle or military colleagues.\n\n**Takeaway:** AI models can draft Wikidata and VIAF identifiers for historical entities, but editors must confirm that each link points to the correct individual.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Entity Linking and Authority Control (Wikidata and VIAF)", "questiontext": "<p>Why should editors verify Wikidata QIDs and VIAF IDs proposed by an AI model?</p>", "generalfeedback": "<p>AI models can draft Wikidata and VIAF identifiers for historical entities, but editors must confirm that each link points to the correct individual.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because models can confuse individuals sharing similar names, linking a historical figure to the wrong person.</p>", "feedback": "<p>Correct. Authority identifiers must point to the exact historical person, not an uncle or namesake.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Wikidata charges a fee every time a QID is accessed.</p>", "feedback": "<p>Incorrect. Wikidata is a free, open-access knowledge base.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because VIAF IDs expire after thirty days.</p>", "feedback": "<p>Incorrect. VIAF identifiers are permanent, persistent library authority numbers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI XML does not allow external web links.</p>", "feedback": "<p>Incorrect. TEI supports external authority links through attributes like @ref and @corresp.</p>"}]}}, {"step": 16, "title": "Detecting Model Sycophancy and Leading Prompts", "content": "**Detecting Model Sycophancy and Leading Prompts**\n\nLanguage models suffer from a behavioral flaw known as **sycophancy**. They tend to agree with whatever opinion or premise the user presents.\n\nIf you write a leading prompt:\n<p style=\"background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 12px; margin: 12px 0;\">\n<em>\"Explain how Maud Lewis deliberately encoded anti-war political messages in this 1967 letter.\"</em>\n</p>\n\nThe AI will not correct your mistaken assumption. Instead, it will draft an elaborate, fluent argument defending your false premise. It will invent reasons why Maud Lewis's mention of paint prices was a subtle critique of the Vietnam War.\n\nTo avoid sycophancy, always use **neutral, open-ended prompts**:\n<p style=\"background-color: #f0fdf4; border-left: 4px solid #22c55e; padding: 12px; margin: 12px 0;\">\n<em>\"Analyze the primary subject matter of this 1967 letter. Does the text contain political commentary, or does it focus on commercial sales and personal news? Cite exact lines.\"</em>\n</p>\n\nNeutral phrasing encourages the model to report evidence rather than flatter your preconceptions.\n\n**Vocabulary.** *Sycophancy* — the tendency of AI models to agree with the user's suggestions and validate false premises rather than giving objective facts.\n\n**Takeaway:** Write neutral prompts without leading assumptions to prevent AI models from generating flattering but false historical theories.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Detecting Model Sycophancy and Leading Prompts", "questiontext": "<p>What happens when an editor prompts an AI model with a leading, biased question?</p>", "generalfeedback": "<p>Write neutral prompts without leading assumptions to prevent AI models from generating flattering but false historical theories.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model exhibits sycophancy, flattering the editor by generating elaborate justifications for the false premise.</p>", "feedback": "<p>Correct. Language models tend to confirm user biases unless prompted neutrally.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model immediately disconnects from the internet in protest.</p>", "feedback": "<p>Incorrect. Models do not have emotional protests; they generate text matching the prompt's tone.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model deletes all files in the editor's workspace.</p>", "feedback": "<p>Incorrect. Text generation queries cannot delete local project files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model forces the user to retake the course quiz.</p>", "feedback": "<p>Incorrect. AI chat interfaces do not administer university course grading policies.</p>"}]}}, {"step": 17, "title": "Multi-Model Cross-Verification Pipelines", "content": "**Multi-Model Cross-Verification Pipelines**\n\nA powerful technique for vetting commentary is **multi-model cross-verification**.\n\nInstead of trusting a single AI model, you send the same structured prompt to two different models (for example, Claude and Gemini) or run the same model at two different temperature settings:\n<ol>\n  <li><strong>Generate Draft A:</strong> Prompt Model 1 for historical and philological notes.</li>\n  <li><strong>Generate Draft B:</strong> Prompt Model 2 using the identical system prompt and document context.</li>\n  <li><strong>Run Comparison:</strong> Compare the outputs side by side in VS Code.</li>\n  <li><strong>Isolate Disagreements:</strong> Where both models agree on dates, names, and meanings, confidence is higher. Where they disagree, you have located a potential error or ambiguity.</li>\n</ol>\n\nThis cross-check is especially helpful for historical dates and translations of archaic words. Discrepancies between models immediately highlight where human archive verification is needed.\n\n**Takeaway:** Running prompts across two different models highlights factual disagreements and flags passages that require close human review.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Multi-Model Cross-Verification Pipelines", "questiontext": "<p>In a multi-model verification pipeline, what does a disagreement between two AI models signify?</p>", "generalfeedback": "<p>Running prompts across two different models highlights factual disagreements and flags passages that require close human review.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It flags a factual discrepancy, ambiguous historical evidence, or a translation difficulty requiring close human investigation.</p>", "feedback": "<p>Correct. Where models disagree, the human editor must examine primary sources to establish ground truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves that both computers have suffered permanent hardware failures.</p>", "feedback": "<p>Incorrect. Model disagreement is a standard statistical outcome, not a hardware breakdown.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It means the historical document must be completely discarded.</p>", "feedback": "<p>Incorrect. Ambiguity in historical texts is normal and requires scholarly interpretation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It indicates that one of the models has become sentient.</p>", "feedback": "<p>Incorrect. AI models are pattern-matching software tools, not conscious beings.</p>"}]}}, {"step": 18, "title": "The Four-Step Forensic Fact-Checking Protocol", "content": "**The Four-Step Forensic Fact-Checking Protocol**\n\nWhen auditing an AI-generated commentary draft, follow this four-step forensic protocol:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 15%;\">Step</th>\n      <th style=\"padding: 8px; text-align: left; width: 25%;\">Audit Focus</th>\n      <th style=\"padding: 8px; text-align: left; width: 60%;\">Action in VS Code</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Step 1</strong></td>\n      <td style=\"padding: 8px;\"><strong>Quotation Check</strong></td>\n      <td style=\"padding: 8px;\">Search your transcription file to confirm that every quoted string matches character for character.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Step 2</strong></td>\n      <td style=\"padding: 8px;\"><strong>Entity Check</strong></td>\n      <td style=\"padding: 8px;\">Verify people, places, and organizations against authoritative biographical dictionaries and gazetteers.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Step 3</strong></td>\n      <td style=\"padding: 8px;\"><strong>Citation Check</strong></td>\n      <td style=\"padding: 8px;\">Search library catalogs or digital repositories to verify that cited secondary works actually exist.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Step 4</strong></td>\n      <td style=\"padding: 8px;\"><strong>Anchor Check</strong></td>\n      <td style=\"padding: 8px;\">Confirm that the target <code>xml:id</code> exists in your transcription and covers the intended span.</td>\n    </tr>\n  </tbody>\n</table>\n\nThis protocol takes only a few minutes per note, but it ensures that your digital edition maintains high scholarly standards.\n\n**Takeaway:** Follow a four-step audit protocol—checking quotations, entities, citations, and XML anchors—before accepting any AI note.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: The Four-Step Forensic Fact-Checking Protocol", "questiontext": "<p>What is the first step in the four-step forensic fact-checking protocol for AI commentary?</p>", "generalfeedback": "<p>Follow a four-step audit protocol—checking quotations, entities, citations, and XML anchors—before accepting any AI note.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A quotation check, confirming that every quoted string matches the primary transcription character for character.</p>", "feedback": "<p>Correct. Step 1 verifies that the AI did not alter, modernize, or fabricate the quoted manuscript words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Publishing the unvetted draft on social media.</p>", "feedback": "<p>Incorrect. Unvetted drafts should never be published publicly.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating the note into Latin and back into English.</p>", "feedback": "<p>Incorrect. Round-trip translation adds noise rather than verifying quotes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Formatting the text as a printed PDF book.</p>", "feedback": "<p>Incorrect. Verification must occur before final presentation typesetting.</p>"}]}}, {"step": 19, "title": "Human-in-the-Loop (HITL) Validation Protocols", "content": "**Human-in-the-Loop (HITL) Validation Protocols**\n\nIn a digital edition, the AI is an assistant, not an author. The human editor bears full intellectual and ethical responsibility for the finished edition.\n\nTo manage this responsibility, adopt a formal **HITL decision framework**:\n<ul>\n  <li><strong style=\"color: #16a34a;\">ACCEPT:</strong> The AI draft is factually accurate, beautifully written, properly anchored, and well cited. You adopt it with minimal copyediting.</li>\n  <li><strong style=\"color: #2563eb;\">REVISE:</strong> The draft contains good historical insight, but its tone is modern, its wording is wordy, or a minor date is wrong. You rewrite the text.</li>\n  <li><strong style=\"color: #dc2626;\">REJECT:</strong> The draft contains fabricated citations, hallucinated legal clauses, or anachronistic theories. You discard the note completely.</li>\n  <li><strong style=\"color: #d97706;\">FLAG:</strong> The draft makes an intriguing historical claim that you cannot verify immediately. You mark it for archive investigation.</li>\n</ul>\n\nDocumenting your decisions ensures transparent editorial practice.\n\n**Takeaway:** The human editor holds final authority, classifying every AI proposal as Accept, Revise, Reject, or Flag.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Human-in-the-Loop (HITL) Validation Protocols", "questiontext": "<p>Under the HITL decision framework, when should an editor choose the REVISE action for an AI draft?</p>", "generalfeedback": "<p>The human editor holds final authority, classifying every AI proposal as Accept, Revise, Reject, or Flag.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When the draft provides sound historical context, but its prose contains modern clichés, wordiness, or a minor factual error.</p>", "feedback": "<p>Correct. REVISE salvages useful background while polishing style and correcting minor inaccuracies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the draft is completely fabricated and must be thrown into the trash.</p>", "feedback": "<p>Incorrect. Fabricated notes should be marked REJECT, not REVISE.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the draft is 100% perfect and needs no changes whatsoever.</p>", "feedback": "<p>Incorrect. Flawless notes should be marked ACCEPT.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the editor does not know what the document means.</p>", "feedback": "<p>Incorrect. Unresolved questions should be marked FLAG for further archive research.</p>"}]}}, {"step": 20, "title": "The Commentary Ledger: COMMENTARY.md", "content": "**The Commentary Ledger: COMMENTARY.md**\n\nTo track your editorial decisions, create a tracking ledger called `COMMENTARY.md` in your project folder.\n\nA commentary ledger records the provenance and verification history of every note:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left;\">Anchor ID</th>\n      <th style=\"padding: 8px; text-align: left;\">Category</th>\n      <th style=\"padding: 8px; text-align: left;\">Draft Origin</th>\n      <th style=\"padding: 8px; text-align: left;\">Decision</th>\n      <th style=\"padding: 8px; text-align: left;\">Audit Notes</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><code>#seg_01</code></td>\n      <td style=\"padding: 8px;\">Historical</td>\n      <td style=\"padding: 8px;\">AI (Claude 3.5)</td>\n      <td style=\"padding: 8px; color: #2563eb;\"><strong>REVISE</strong></td>\n      <td style=\"padding: 8px;\">Corrected hallucinated 1792 date to 1791; trimmed wordiness.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><code>#seg_02</code></td>\n      <td style=\"padding: 8px;\">Linguistic</td>\n      <td style=\"padding: 8px;\">Manual (Tuesday)</td>\n      <td style=\"padding: 8px; color: #16a34a;\"><strong>ACCEPT</strong></td>\n      <td style=\"padding: 8px;\">Verified against 1798 Academy dictionary.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><code>#seg_03</code></td>\n      <td style=\"padding: 8px;\">Intertextual</td>\n      <td style=\"padding: 8px;\">Rule-based (Wed)</td>\n      <td style=\"padding: 8px; color: #dc2626;\"><strong>REJECT</strong></td>\n      <td style=\"padding: 8px;\">Spurious 3-gram match on common legal formula.</td>\n    </tr>\n  </tbody>\n</table>\n\nMaintaining this ledger fulfills your course requirement for transparent research. It shows your instructor exactly how you applied human expertise to evaluate computational suggestions.\n\n**Takeaway:** The COMMENTARY.md ledger logs the origin, audit notes, and editorial decision for every note in your digital edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: The Commentary Ledger: COMMENTARY.md", "questiontext": "<p>What is the scholarly purpose of maintaining a COMMENTARY.md ledger in your repository?</p>", "generalfeedback": "<p>The COMMENTARY.md ledger logs the origin, audit notes, and editorial decision for every note in your digital edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To document the provenance, audit notes, and editorial decisions for every commentary note with full transparency.</p>", "feedback": "<p>Correct. A ledger provides an auditable record demonstrating how human expertise governed computational drafting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To hide computational mistakes from course instructors.</p>", "feedback": "<p>Incorrect. The ledger explicitly documents mistakes and corrections to demonstrate critical thinking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To replace the need for writing a final term paper.</p>", "feedback": "<p>Incorrect. The ledger is a research tracking tool, not a substitute for scholarly writing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To store encrypted passwords for your GitHub account.</p>", "feedback": "<p>Incorrect. Security credentials must never be stored in markdown repository files.</p>"}]}}, {"step": 21, "title": "Hands-On: Prompting for Ace's 1791 French Decree", "content": "**Hands-On: Prompting for Ace's 1791 French Decree**\n\nLet us apply these methods to our three student projects, starting with Ace's 1791 decree (*Loi relative à la fabrication des assignats*).\n\nOpen VS Code and open your AI chat window. Enter a disciplined system prompt:\n<pre><code>Role: Assistant scholarly editor in 18th-century French digital history.\nSource: 1791 National Assembly decree on assignats (Paris, Imprimerie Royale).\nTarget Span: \"fabrication des assignats de 5 livres\" (xml:id=\"seg_assig_05\")\nTask: Draft a concise historical commentary note explaining why 5-livre assignats were introduced in 1791.\nConstraints:\n\n- Maximum 80 words.\n- Do NOT invent secondary citations.\n- Explicitly mention the shift from large-denomination notes to small currency for daily wages.\n- If citing a decree date, verify it against standard revolutionary calendars.</code></pre>\n\nReview the generated response:\n<ul>\n  <li>Does it explain that early assignats were only issued in large sums (such as 1,000 livres), causing coin shortages?</li>\n  <li>Does it describe how 5-livre notes were created to pay everyday workers and soldiers?</li>\n  <li>Did the model fabricate any non-existent committee names?</li>\n</ul>\n\n**Takeaway:** Prompting for historical decrees requires specifying denominations, legislative context, and strict negative constraints against fake dates.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Hands-On: Prompting for Ace's 1791 French Decree", "questiontext": "<p>When prompting for historical commentary on the 1791 assignat decree, why specify the 5-livre denomination?</p>", "generalfeedback": "<p>Prompting for historical decrees requires specifying denominations, legislative context, and strict negative constraints against fake dates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because 5-livre notes represented a crucial shift to small currency for paying workers and soldiers, addressing coin hoarding.</p>", "feedback": "<p>Correct. Denomination context explains the economic necessity of issuing small paper notes during the Revolution.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because 5 livres was the exact price of an iPad in 1791 Paris.</p>", "feedback": "<p>Incorrect. Consumer electronics did not exist in 18th-century France.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because King Louis XVI refused to touch paper money larger than five livres.</p>", "feedback": "<p>Incorrect. The King's personal preferences did not govern revolutionary monetary policy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the French language only had words for numbers up to five.</p>", "feedback": "<p>Incorrect. French mathematics and vocabulary possessed complete numerical systems.</p>"}]}}, {"step": 22, "title": "Hands-On: Prompting for Olyvia's 1967 Maud Lewis Letter", "content": "**Hands-On: Prompting for Olyvia's 1967 Maud Lewis Letter**\n\nNext, let us prompt for Olyvia's project: Maud Lewis's February 1967 letter to Leonard Kinnear.\n\nEnter this prompt in VS Code:\n<pre><code>Role: Assistant editor in Canadian folk art and maritime social history.\nSource: Maud Lewis, handwritten letter to Leonard Kinnear, Feb 1967 (Digby, NS).\nTarget Span: \"The price of the paintings is \\$6.00\" (xml:id=\"seg_price_01\")\nTask: Draft a biographical and economic commentary note on Maud Lewis's pricing in 1967.\nConstraints:\n\n- Maximum 75 words.\n- Explain her modest pricing despite growing national publicity following the 1965 CBC documentary.\n- Note that Leonard Kinnear was a private correspondent in Moncton, New Brunswick.\n- Do NOT claim she employed gallery agents or held formal exhibitions.</code></pre>\n\nExamine the result:\n<ul>\n  <li>Did the model accurately mention her husband Everett's role in roadside sales?</li>\n  <li>Did it mention the CBC *Telescope* broadcast from 1965 that made her famous across Canada?</li>\n  <li>Did it keep the explanation grounded in regional Nova Scotia folk art?</li>\n</ul>\n\n**Takeaway:** Prompting for personal letters requires strict biographical guardrails to avoid confusing private correspondence with commercial gallery business.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Hands-On: Prompting for Olyvia's 1967 Maud Lewis Letter", "questiontext": "<p>Why must prompts regarding Maud Lewis's 1967 letter include guardrails against mentioning commercial art galleries?</p>", "generalfeedback": "<p>Prompting for personal letters requires strict biographical guardrails to avoid confusing private correspondence with commercial gallery business.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because Maud Lewis sold her paintings directly from her Digby home or through personal mail, not through formal commercial galleries.</p>", "feedback": "<p>Correct. Guardrails prevent the model from projecting modern commercial art marketing onto a humble folk artist.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because commercial art galleries were strictly illegal in Nova Scotia in 1967.</p>", "feedback": "<p>Incorrect. Commercial galleries existed in Canada, but Maud Lewis did not use them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Maud Lewis was an undercover police detective.</p>", "feedback": "<p>Incorrect. Maud Lewis was an internationally celebrated Canadian folk painter.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the letter was written on gallery letterhead.</p>", "feedback": "<p>Incorrect. The letter was handwritten on plain correspondence paper.</p>"}]}}, {"step": 23, "title": "Hands-On: Prompting for Andromeda's 1752 Treaty", "content": "**Hands-On: Prompting for Andromeda's 1752 Treaty**\n\nNow let us prompt for Andromeda's document: the 1752 Peace and Friendship Treaty concluded at Halifax.\n\nEnter this prompt:\n<pre><code>Role: Assistant documentary editor in 18th-century Mi'kmaq-British treaty history.\nSource: 1752 Peace and Friendship Treaty, Halifax, Nova Scotia.\nTarget Span: \"free liberty of Hunting and Fishing as usual\" (xml:id=\"seg_hunt_01\")\nTask: Draft a legal and historical commentary note explaining the meaning of this clause in 1752.\nConstraints:\n\n- Maximum 90 words.\n- Mention Governor Peregrine Hopson and Chief Jean-Baptiste Cope.\n- Connect to earlier agreements (1725 Dummer's Treaty).\n- Note that this clause recognized ongoing Mi'kmaw resource harvesting rights.\n- Do NOT cite modern court decisions or 21st-century legal cases.</code></pre>\n\nAudit the response:\n<ul>\n  <li>Did the model describe the diplomatic relationship between Cope and Hopson accurately?</li>\n  <li>Did it follow the negative constraint forbidding 21st-century legal references?</li>\n  <li>Did it stay focused on the historical context of 1752?</li>\n</ul>\n\n**Takeaway:** Treaty commentary requires careful historical balancing, connecting 18th-century agreements to prior treaties while excluding modern legal anachronisms.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Hands-On: Prompting for Andromeda's 1752 Treaty", "questiontext": "<p>Why should a prompt for the 1752 Treaty forbid citing 21st-century court cases?</p>", "generalfeedback": "<p>Treaty commentary requires careful historical balancing, connecting 18th-century agreements to prior treaties while excluding modern legal anachronisms.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To ensure the generated commentary explains the agreement within its authentic 1752 historical and diplomatic context.</p>", "feedback": "<p>Correct. Historical commentary explains what terms meant to the original signatories, avoiding modern legal anachronism.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because 21st-century court cases are secret and classified.</p>", "feedback": "<p>Incorrect. Modern court judgments are public legal records.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Canadian courts have never cited the 1752 Treaty.</p>", "feedback": "<p>Incorrect. Canadian courts have extensively analyzed historical peace treaties.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the AI model will crash if it reads modern legal citations.</p>", "feedback": "<p>Incorrect. Models process modern legal text easily; the constraint preserves historical focus.</p>"}]}}, {"step": 24, "title": "Hands-On: The Hallucination Hunt (Catching Fabricated Sources)", "content": "**Hands-On: The Hallucination Hunt (Catching Fabricated Sources)**\n\nNow you will practice forensic editing. Below is an unvetted AI commentary draft containing three deliberate errors:\n<p style=\"background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 12px; margin: 12px 0;\">\n<em>\"In the 1752 Halifax Treaty, Article 12 established a joint British-Mi'kmaw naval patrol on the Shubenacadie River. According to Dr. Ronald MacFarlane's 1984 monograph, 'Colonial Treaties of Acadia' (University of Toronto Press, p. 142), Chief Jean-Baptiste Cope personally delivered twenty beaver pelts to Halifax in January 1753 to purchase five British cannons.\"</em>\n</p>\n\nFind the three hallucinations:\n<ol>\n  <li><strong>The Article Number:</strong> The 1752 Treaty has only 8 articles. Article 12 is fictitious.</li>\n  <li><strong>The Monograph and Citation:</strong> \"Dr. Ronald MacFarlane\" and his book *Colonial Treaties of Acadia* (1984) do not exist. The AI made up the author, book, publisher, and page.</li>\n  <li><strong>The Cannon Purchase:</strong> Chief Cope never traded pelts for British cannons in January 1753. This claim is completely invented.</li>\n</ol>\n\nSpotting these fabrications proves why the human editor must never trust unverified citations.\n\n**Takeaway:** Practicing hallucination hunts sharpens your editorial eye to catch fake articles, phantom books, and invented historical events.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Hands-On: The Hallucination Hunt (Catching Fabricated Sources)", "questiontext": "<p>In the hallucination hunt exercise, how do we know the citation to 'Dr. Ronald MacFarlane (1984)' was fabricated?</p>", "generalfeedback": "<p>Practicing hallucination hunts sharpens your editorial eye to catch fake articles, phantom books, and invented historical events.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>No scholar by that name published 'Colonial Treaties of Acadia' with University of Toronto Press in 1984; the model invented the citation.</p>", "feedback": "<p>Correct. Verifying citations against library catalogs confirms that the book and author do not exist.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because books published in 1984 were printed entirely in purple ink.</p>", "feedback": "<p>Incorrect. 1984 books were printed using standard black ink.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because University of Toronto Press only publishes medical books.</p>", "feedback": "<p>Incorrect. University of Toronto Press is a renowned publisher of Canadian history.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because all treaties from Acadia were destroyed in a flood in 1800.</p>", "feedback": "<p>Incorrect. Treaties from the Maritime region survive in official government archives.</p>"}]}}, {"step": 25, "title": "Hands-On: Vetting Tone, Grammar, and Style", "content": "**Hands-On: Vetting Tone, Grammar, and Style**\n\nIn addition to catching factual errors, you must vet the writing style of AI drafts. Language models often produce wordy, cliché-filled prose:\n<ul>\n  <li><strong>Eliminate Buzzwords:</strong> Remove empty phrases like \"serves as a testament to,\" \"rich tapestry,\" and \"plays a pivotal role.\"</li>\n  <li><strong>Prefer Active Voice:</strong> Change \"The assignats were seen by the assembly as being\" to \"The assembly issued assignats to.\"</li>\n  <li><strong>Cut Redundant Explanations:</strong> Keep your notes concise so readers can read them quickly without losing their place in the primary document.</li>\n</ul>\n\nHere is a before-and-after revision:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 50%;\">Unvetted AI Draft</th>\n      <th style=\"padding: 8px; text-align: left; width: 50%;\">Vetted Human Revision</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 8px; background-color: #fff1f2;\">This pivotal clause stands as a profound testament to the complex sociopolitical dynamics of 1752 Halifax, illuminating the ongoing negotiations.</td>\n      <td style=\"padding: 8px; background-color: #f0fdf4;\">Article 4 guaranteed Mi'kmaw hunting and fishing rights, continuing terms first established in the 1725 Dummer's Treaty.</td>\n    </tr>\n  </tbody>\n</table>\n\nCrisp, concise prose is the mark of good scholarship.\n\n**Takeaway:** Vetting style means removing AI clichés and wordiness, producing clear and direct explanations for your readers.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Hands-On: Vetting Tone, Grammar, and Style", "questiontext": "<p>Why should editors eliminate clichés like 'serves as a testament to' and 'rich tapestry' from AI drafts?</p>", "generalfeedback": "<p>Vetting style means removing AI clichés and wordiness, producing clear and direct explanations for your readers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because empty buzzwords inflate sentence length without providing specific historical evidence or clear explanation.</p>", "feedback": "<p>Correct. Scholarly commentary values direct, concise prose that explains concrete evidence without decorative filler.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the words 'testament' and 'tapestry' are copyright protected by Microsoft.</p>", "feedback": "<p>Incorrect. Common words cannot be copyrighted by software companies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI XML does not permit the letter 'T' inside note elements.</p>", "feedback": "<p>Incorrect. TEI supports all standard Unicode alphabetic characters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because students lose points if their notes contain fewer than 500 words.</p>", "feedback": "<p>Incorrect. Concise commentary notes are preferred over bloated, repetitive text.</p>"}]}}, {"step": 26, "title": "Hands-On: Converting Vetted AI Notes to TEI Standoff XML", "content": "**Hands-On: Converting Vetted AI Notes to TEI Standoff XML**\n\nOnce you have verified and polished an AI-drafted note, you encode it into your document's TEI `<standOff>` section.\n\nUse the TEI tagging standards you mastered in Lesson 12.1:\n<pre><code>&lt;standOff&gt;\n  &lt;interpGrp type=\"commentary\"&gt;\n    &lt;note xml:id=\"note_assig_05\"\n          target=\"#seg_assig_05\"\n          type=\"historical\"\n          resp=\"#ai-draft\"&gt;\n      &lt;p&gt;The National Assembly issued five-livre assignats in May 1791 \n      to relieve a severe shortage of small silver coinage for daily wages.&lt;/p&gt;\n      &lt;bibl&gt;Archives Parlementaires, 26:145.&lt;/bibl&gt;\n    &lt;/note&gt;\n  &lt;/interpGrp&gt;\n&lt;/standOff&gt;</code></pre>\n\nNotice how we record responsibility:\n<ul>\n  <li><code>resp=\"#ai-draft\"</code> records that the initial draft was machine-generated.</li>\n  <li>In your TEI header, declare `<respStmt>` to credit the human editor who audited and verified the note.</li>\n</ul>\n\nThis encoding preserves complete transparency while maintaining standard TEI P5 compliance.\n\n**Takeaway:** Encode vetted notes into TEI standOff elements, using resp attributes to maintain transparent records of AI assistance and human editing.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Hands-On: Converting Vetted AI Notes to TEI Standoff XML", "questiontext": "<p>Where are commentary notes stored within a TEI document according to the standoff annotation model?</p>", "generalfeedback": "<p>Encode vetted notes into TEI standOff elements, using resp attributes to maintain transparent records of AI assistance and human editing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Inside the <standOff> element, grouped in an <interpGrp> and linked to the transcription via @target attributes.</p>", "feedback": "<p>Correct. Standoff markup keeps the primary transcription clean by isolating interpretive notes in a separate container.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scattered randomly between words inside <w> tags.</p>", "feedback": "<p>Incorrect. In-line note embedding clutters primary transcription markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In a separate Microsoft Word document saved on a flash drive.</p>", "feedback": "<p>Incorrect. TEI standoff commentary is stored in the same XML file or linked XML document.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In the computer'
