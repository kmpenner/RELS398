s motherboard BIOS memory.</p>", "feedback": "<p>Incorrect. TEI markup is stored in standard text files, not motherboard hardware memory.</p>"}]}}, {"step": 27, "title": "Hands-On: Serializing Vetted Commentary as W3C JSON-LD", "content": "**Hands-On: Serializing Vetted Commentary as W3C JSON-LD**\n\nTo make your vetted commentary available across the web, serialize it using the W3C Web Annotation Data Model you studied on Wednesday.\n\nHere is a complete JSON-LD annotation for Olyvia's Maud Lewis note:\n<pre><code>{\n  \"@context\": \"http://www.w3.org/ns/anno.jsonld\",\n  \"id\": \"https://rels398.stfx.ca/annotations/maud_01\",\n  \"type\": \"Annotation\",\n  \"motivation\": \"commenting\",\n  \"creator\": {\n    \"id\": \"https://rels398.stfx.ca/editors/olyvia\",\n    \"type\": \"Person\",\n    \"name\": \"Olyvia\"\n  },\n  \"generator\": {\n    \"type\": \"Software\",\n    \"name\": \"Claude 3.5 Sonnet\"\n  },\n  \"target\": {\n    \"source\": \"https://rels398.stfx.ca/texts/lewis_kinnear_1967.xml\",\n    \"selector\": {\n      \"type\": \"TextQuoteSelector\",\n      \"exact\": \"The price of the paintings is \\$6.00\"\n    }\n  },\n  \"body\": {\n    \"type\": \"TextualBody\",\n    \"value\": \"Maud Lewis maintained modest prices of \\$4 to \\$6 for paintings sold from her Digby cottage during the late 1960s.\",\n    \"format\": \"text/plain\"\n  }\n}</code></pre>\n\nNotice the clear distinction between `creator` (the student editor) and `generator` (the AI drafting tool). This format makes your commentary shareable across modern web viewers.\n\n**Takeaway:** Serializing vetted notes as W3C JSON-LD distinguishes human creator from AI generator, enabling open web annotation sharing.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Hands-On: Serializing Vetted Commentary as W3C JSON-LD", "questiontext": "<p>In a W3C Web Annotation JSON-LD file, what is the role of the TextQuoteSelector?</p>", "generalfeedback": "<p>Serializing vetted notes as W3C JSON-LD distinguishes human creator from AI generator, enabling open web annotation sharing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It anchors the annotation to exact words in the target document, ensuring resilience even if character offsets shift slightly.</p>", "feedback": "<p>Correct. TextQuoteSelector matches exact text snippets, making annotations robust against minor markup edits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically purchases the painting mentioned in the text.</p>", "feedback": "<p>Incorrect. Web annotations describe data; they do not conduct financial purchases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes any quotation marks found in the document.</p>", "feedback": "<p>Incorrect. Selectors identify text spans; they do not alter source content.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates the annotation into Chinese characters.</p>", "feedback": "<p>Incorrect. Language translation is governed by separate processes, not quotation selectors.</p>"}]}}, {"step": 28, "title": "The Three-Way Comparative Audit Matrix", "content": "**The Three-Way Comparative Audit Matrix**\n\nWe have now tested three distinct methods for building scholarly commentary. Let us compare them across key editorial dimensions:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 22%;\">Dimension</th>\n      <th style=\"padding: 8px; text-align: left; width: 26%;\">1. Manual (Tue)</th>\n      <th style=\"padding: 8px; text-align: left; width: 26%;\">2. Deterministic (Wed)</th>\n      <th style=\"padding: 8px; text-align: left; width: 26%;\">3. AI-Assisted (Fri)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Drafting Speed</strong></td>\n      <td style=\"padding: 8px;\">Slow (15-30 min/note)</td>\n      <td style=\"padding: 8px;\">Instantaneous</td>\n      <td style=\"padding: 8px;\">Very fast (seconds)</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Precision</strong></td>\n      <td style=\"padding: 8px;\">High (human verified)</td>\n      <td style=\"padding: 8px;\">Variable (spurious matches)</td>\n      <td style=\"padding: 8px;\">Medium (plausible errors)</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Recall</strong></td>\n      <td style=\"padding: 8px;\">Low (limited by memory)</td>\n      <td style=\"padding: 8px;\">High for exact phrases</td>\n      <td style=\"padding: 8px;\">High for thematic motifs</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Error Type</strong></td>\n      <td style=\"padding: 8px;\">Omission, human fatigue</td>\n      <td style=\"padding: 8px;\">Literalism, formula matches</td>\n      <td style=\"padding: 8px;\">Hallucination, anachronism</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Required Skill</strong></td>\n      <td style=\"padding: 8px;\">Philological expertise</td>\n      <td style=\"padding: 8px;\">Scripting and thresholds</td>\n      <td style=\"padding: 8px;\">Forensic fact-checking</td>\n    </tr>\n  </tbody>\n</table>\n\nThis comparative matrix demonstrates that no single method is sufficient on its own. The best digital editions combine manual expertise, rule-based algorithms, and vetted AI assistance.\n\n**Takeaway:** Combining manual close reading, rule-based text search, and vetted AI drafts creates a resilient and balanced commentary workflow.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: The Three-Way Comparative Audit Matrix", "questiontext": "<p>According to the Three-Way Comparative Audit Matrix, what is the primary strength of manual commentary authoring (Tuesday)?</p>", "generalfeedback": "<p>Combining manual close reading, rule-based text search, and vetted AI drafts creates a resilient and balanced commentary workflow.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>High precision and verified accuracy, guided by careful human reading and historical expertise.</p>", "feedback": "<p>Correct. Manual drafting ensures trustworthy scholarship, though it requires significant time and labor.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It takes zero seconds to draft fifty notes.</p>", "feedback": "<p>Incorrect. Manual authoring is slow and labor-intensive.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically checks every library in the world simultaneously.</p>", "feedback": "<p>Incorrect. Human memory and search capacity are limited.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires no knowledge of historical grammar or context.</p>", "feedback": "<p>Incorrect. Manual commentary depends directly on human philological and historical knowledge.</p>"}]}}, {"step": 29, "title": "Ethical Transparency and Scholarly Provenance", "content": "**Ethical Transparency and Scholarly Provenance**\n\nUsing AI tools in academic research requires strict ethical transparency. Hiding AI assistance is academic dishonesty. Disclosing it clearly is good digital scholarship.\n\nIn your edition's TEI header or introductory paratext, include an **Editorial Method Statement**:\n<p style=\"background-color: #f8fafc; border-left: 4px solid #64748b; padding: 12px; margin: 12px 0;\">\n<em>\"Commentary notes in this digital edition were drafted using Claude 3.5 Sonnet as a research assistant. All generated claims, historical dates, and citations were audited, corrected, and verified against primary archival documents by the editor. Fabricated references and anachronistic interpretations were rejected. Final editorial responsibility rests entirely with the human editor.\"</em>\n</p>\n\nThis statement clarifies that the AI served as a tool for initial drafting, while human expertise ensured truthfulness and historical accuracy.\n\n**Takeaway:** Ethical scholarship requires full disclosure of AI drafting tools, documenting editorial audit procedures, and claiming final human responsibility.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Ethical Transparency and Scholarly Provenance", "questiontext": "<p>Why must a digital edition include an Editorial Method Statement disclosing AI assistance?</p>", "generalfeedback": "<p>Ethical scholarship requires full disclosure of AI drafting tools, documenting editorial audit procedures, and claiming final human responsibility.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To uphold academic integrity by making research methods transparent and establishing human responsibility for final claims.</p>", "feedback": "<p>Correct. Transparent disclosure is essential for ethical scholarship and reproducible research.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To allow the AI model to receive university course credit.</p>", "feedback": "<p>Incorrect. AI software cannot earn academic degrees or university credit.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the government fines scholars who use computers.</p>", "feedback": "<p>Incorrect. Digital scholarship is widely encouraged and supported by academic institutions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prevent students from submitting their homework on time.</p>", "feedback": "<p>Incorrect. Method statements clarify research procedures; they do not delay submissions.</p>"}]}}, {"step": 30, "title": "Synthesis: Completing the Commentary Cycle and Preparing for Assignment 12", "content": "**Synthesis: Completing the Commentary Cycle and Preparing for Assignment 12**\n\nCongratulations! You have completed the Three-Step Comparative Cycle for Topic 12:\n<ol>\n  <li><strong>Lesson 12.1 (Manual):</strong> You authored historical, linguistic, and intertextual notes by hand and encoded them into TEI <code>&lt;standOff&gt;</code> and <code>&lt;interpGrp&gt;</code> elements.</li>\n  <li><strong>Lesson 12.2 (Deterministic):</strong> You scanned for text reuse using stoplists, n-grams, and TF-IDF formulas, serializing notes as W3C JSON-LD.</li>\n  <li><strong>Lesson 12.3 (AI-Assisted):</strong> You tested AI drafting assistants with negative constraints, audited outputs for hallucinations, and logged decisions in <code>COMMENTARY.md</code>.</li>\n</ol>\n\n**Assignment 12 Details:**\n<ul>\n  <li><strong>Due Date:</strong> Friday, December 4, at 11:00 PM.</li>\n  <li><strong>Total Value:</strong> 80 points on Moodle.</li>\n  <li><strong>Grading Rubric (4+3+3):</strong>\n    <ol>\n      <li><strong>Manual Ground Truth Precision (4 points / 40%):</strong> Accurate, scholarly commentary notes anchored to your primary transcription file.</li>\n      <li><strong>Standoff TEI Markup Validity (3 points / 30%):</strong> Well-formed TEI XML using <code>&lt;standOff&gt;</code>, <code>&lt;interpGrp&gt;</code>, and <code>@target</code> attributes.</li>\n      <li><strong>Comparative Audit Reflection (3 points / 30%):</strong> A completed <code>COMMENTARY.md</code> ledger comparing manual, rule-based, and AI-assisted notes with honest audit reflections.</li>\n    </ol>\n  </li>\n</ul>\n\nSubmit your files on Moodle by December 4. Your commentary edition will serve as the foundation for our final publication modules!\n\n**Takeaway:** Assignment 12 brings together manual precision, standoff TEI markup, and comparative audit reflections, due Friday, December 4 at 11:00 PM.", "html": null, "image_b64": null, "question": {"name": "30 Question: Synthesis: Completing the Commentary Cycle and Preparing for Assignment 12", "questiontext": "<p>What are the three components of the 4+3+3 grading rubric for Assignment 12?</p>", "generalfeedback": "<p>Assignment 12 brings together manual precision, standoff TEI markup, and comparative audit reflections, due Friday, December 4 at 11:00 PM.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manual Ground Truth Precision (4 pts), Standoff TEI Markup Validity (3 pts), and Comparative Audit Reflection (3 pts).</p>", "feedback": "<p>Correct. The rubric evaluates accurate notes (40%), valid TEI standoff markup (30%), and the COMMENTARY.md ledger (30%).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Attendance (4 pts), Typing Speed (3 pts), and Laptop Battery Life (3 pts).</p>", "feedback": "<p>Incorrect. Course assignments evaluate digital editing skills, not typing speed or battery life.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Buying Coffee (4 pts), Cleaning the Lab (3 pts), and Printing Posters (3 pts).</p>", "feedback": "<p>Incorrect. Assignment 12 evaluates textual editing, TEI markup, and critical reflection.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Memorizing Dates (4 pts), Drawing Maps (3 pts), and Reciting Speeches (3 pts).</p>", "feedback": "<p>Incorrect. The course focuses on digital scholarly editing methods.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
