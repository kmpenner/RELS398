ent in an Era of Linguistic AI**\n\nAs AI models grow more f. Capable, some people wonder if human textual scholarship will become obsolete.\n\nWeek Eight gives you the definitive answer to that question: **absolutely not.**\n\nAn AI model has no historical stake in truth. It will happily alter historical characters, smooth over scribal slip. Invent non-existent latin roots with absolute confidence. It cannot replace the scholar who spent months studying the ink, the pap. The archival context of an eighteenth-century document.\n\nAI models are extraordinary power tools. But power tools require a skilled craftsperson. You are the craftsperson. Your historical knowledge, your philological judgment,. Your commitment to truth are what make digital editions trustworthy. Keep that critical human eye sharp, and enjoy your weekend!\n\n**Takeaway:** AI provides extraordinary speed, but human scholars remain the essential guardians of historical truth and textual integrity.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: Human Judgment in an Era of Linguistic AI", "questiontext": "<p>In an era of powerful automated language models, why does human philological judgment remain indispensable?</p>", "generalfeedback": "<p>AI provides extraordinary speed, but human scholars remain the essential guardians of historical truth and textual integrity.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Human scholars provide ethical stewardship, historical contextualization, and rigorous verification of primary documentary evidence.</p>", "feedback": "<p>Correct. Statistical algorithms generate plausible text, but only human scholars can evaluate historical truth and authentic textual witnesses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models will soon delete all historical books from the internet.</p>", "feedback": "<p>Incorrect. Human judgment is needed for critical analysis and verification, not alarmist retreat.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computers are legally prohibited from displaying historical literature.</p>", "feedback": "<p>Incorrect. Digital humanities thrives on computational analysis under scholarly editorial direction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because human editors can memorize millions of pages faster than a supercomputer.</p>", "feedback": "<p>Incorrect. Computers excel at raw retrieval speed; humans excel at critical discernment and evidential adjudication.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
