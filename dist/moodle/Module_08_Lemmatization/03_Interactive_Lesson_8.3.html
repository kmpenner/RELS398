    <script>
        const lessonData = {"course_title": "Lesson 8.3 — AI-Assisted Linguistic Markup, Comparative Audit, and Assignment 8 Synthesis", "subtitle": "Digital Methods for Historical Documents", "total_sections": 30, "slides": [{"step": 1, "title": "The Third Tier: Prompting Neural Models for Grammar", "content": "**The Third Tier: Prompting Neural Models for Grammar**\n\nWelcome to the final stage of Week Eight. On Tuesday, you parsed and lemmatized twenty words by hand using scholarly dictionaries. That manual work gave you an authoritative ground truth. On Wednesday, you ran deterministic NLP pipelines like TreeTagger and SpaCy. You saw their speed, but you also saw them stumble on Out-of-Vocabulary historical spellings.\n\nToday, we take Step 3 of our three-step cycle: AI models. In VS Code Antigravity, we can prompt AI models to analyze historical grammar.\n\nUnlike deterministic taggers that follow rigid suffix rules, modern language models were trained on billions of words from historical book. Archives. They possess remarkable intuition for archaic vocabulary. However, they bring serious risks, including invented lemmas and unrequested modernizations. Today, you will test an AI model on your text, execute a three-way comparativ. Finalize your linguistic markup assignment.\n\n**Vocabulary.** *Language Model (LLM)*. An AI model trained on vast text datasets that predicts and generates natural language. *Three-Way Comparative Audit* — Comparing annotations across three tiers: manual human craft, deterministic NLP scrip. Generative ai models.\n\n**Takeaway:** Large language models bring powerful intuition to historical language, but their outputs must be audited against manual ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: The Third Tier: Prompting Neural Models for Grammar", "questiontext": "<p>What is the primary role of generative AI models in Week 8's three-step comparative philological cycle?</p>", "generalfeedback": "<p>Large language models bring powerful intuition to historical language, but their outputs must be audited against manual ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To provide an AI-assisted morphological analysis that is rigorously audited against the manual gold standard.</p>", "feedback": "<p>Correct. Generative models supply powerful linguistic intuition, but their output must be measured directly against the verified manual ground truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To replace human editors permanently and eliminate the need for primary source verification.</p>", "feedback": "<p>Incorrect. Human philological ground truth remains the essential sovereign benchmark.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To automatically delete historical manuscripts and replace them with modern translations.</p>", "feedback": "<p>Incorrect. Digital philology preserves and enriches historical documents, never erasing them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To guess grammatical categories randomly without any reference to sentence context.</p>", "feedback": "<p>Incorrect. Modern neural models analyze whole sentences using self-attention mechanisms.</p>"}]}}, {"step": 2, "title": "How Large Language Models Understand Historical Prose", "content": "**How Large Language Models Understand Historical Prose**\n\nHow can an AI model read eighteenth-century French or archaic legal Eng. A rule-based tool failed? The secret lies in pre-training data.\n\nDeterministic taggers like TreeTagger rely on relatively small, modern dictionaries. If a word like *décrétoit* is missing from its dictionary, the tool fails. By contrast, AI models have ingested millions of digitized historical books, including eighteenth-century F. Colonial treaties.\n\nDuring training, the model learned statistical associations across centuries of language change. It knows that eighteenth-century French authors wrote *-oit* where modern writers use *-ait*. It knows that *shew'd* means *showed*. This broad historical exposure gives neural models a significant advantage over simple lookup. Reading archival prose.\n\n**Vocabulary.** *Pre-Training Data* — The massive collection of digital book. Historical documents used to train a neural language model. *Context Window* — The amount of surrounding text a model considers when analyzing words.\n\n**Takeaway:** Language models succeed on historical prose because their training data includes centuries of digitized historical literature.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: How Large Language Models Understand Historical Prose", "questiontext": "<p>Why do neural large language models frequently recognize archaic spellings (such as 18th-century French -oit or English shew'd) that cause deterministic lookup taggers to fail?</p>", "generalfeedback": "<p>Language models succeed on historical prose because their training data includes centuries of digitized historical literature.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because their massive pre-training data incorporates centuries of digitized historical books and archival literature.</p>", "feedback": "<p>Correct. Broad exposure to historical print and manuscripts allows language models to associate archaic suffix variants with their canonical roots.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because LLMs are programmed with every rule of 18th-century grammar by human linguists.</p>", "feedback": "<p>Incorrect. Neural models learn statistical associations from massive corpora rather than manual rule coding.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because historical French and English spellings are identical to contemporary modern corporate documents.</p>", "feedback": "<p>Incorrect. Historical orthography contains significant variation that modern dictionaries often exclude.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the models translate all historical words into binary machine code before checking grammar.</p>", "feedback": "<p>Incorrect. Pre-training exposure across historical text is what supplies morphological familiarity.</p>"}]}}, {"step": 3, "title": "Structured Prompt Engineering for Linguistic Markup", "content": "**Structured Prompt Engineering for Linguistic Markup**\n\nWhile an AI model understands historical vocabulary, it will not output TEI XML automatically unless you instruct it with care. In computational editing, we use **structured prompt engineering**.\n\nA structured prompt gives the model three essential things:\n<ol>\n  <li><strong>Role Definition:</strong> Instruct the model to act as an expert computational philologist and TEI encoder.</li>\n  <li><strong>Task Specification:</strong> Instruct the model to tokenize the passage, look up canonical lemmas, and assign Universal Dependencies tags.</li>\n  <li><strong>Output Format:</strong> Explicitly demand valid TEI P5 XML wrapped in <code>&lt;s&gt;</code>, <code>&lt;w&gt;</code>, and <code>&lt;pc&gt;</code> elements.</li>\n</ol>\n\nWithout strict prompt formatting, models tend to produce conversational essays or unformatted markdown tables. A structured prompt forces the model to return clean, machine-readable XML.\n\n**Vocabulary.** *System Prompt* — High-level instructions provided to an AI model that define its p. Required output format. *Structured Output* — Machine-readable output (such as valid XML or JSON) constrained by strict formatting rules.\n\n**Takeaway:** Structured prompts define the model's expert role, specify its linguistic task, and enforce strict TEI XML output formatting.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: Structured Prompt Engineering for Linguistic Markup", "questiontext": "<p>What is the primary purpose of structured prompt engineering when requesting linguistic annotations from an AI model?</p>", "generalfeedback": "<p>Structured prompts define the model's expert role, specify its linguistic task, and enforce strict TEI XML output formatting.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It establishes the model's expert persona, specifies the exact grammatical task, and enforces strict TEI XML output formatting.</p>", "feedback": "<p>Correct. Clear role definition, task parameters, and output constraints ensure the model generates valid annotations rather than conversational banter.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the model to run faster by shutting off its internal memory.</p>", "feedback": "<p>Incorrect. Prompt structure guides output quality and schema compliance, not raw hardware clock speed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows the user to bypass university copyright restrictions on primary manuscripts.</p>", "feedback": "<p>Incorrect. Prompt engineering governs formatting and linguistic analysis, not legal rights.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents the model from accessing dictionary definitions.</p>", "feedback": "<p>Incorrect. Prompts instruct models to apply lexicographical rigor to the target text.</p>"}]}}, {"step": 4, "title": "Providing the Universal Dependencies Schema in Prompts", "content": "**Providing the Universal Dependencies Schema in Prompts**\n\nNever assume an AI model remembers the exact tags you want. Large models know dozens of different grammar tagsets, from older Penn Treebank tags to French national standards.\n\nTo guarantee consistent output, provide the exact **Universal Dependencies (UD)** tagset directly in your prompt. List the core UPOS tags: `NOUN`, `VERB`, `ADJ`, `ADV`, `PRON`, `DET`, `AUX`, `ADP`, `CCONJ`,. `punct`.\n\nInstruct the model explicitly: *Use only official Universal Dependencies UPOS tags in the pos attribute*. When the model has the allowed tags in its prompt, it will not invent non-standard labels like `PREP` or `ARTICLE`. This keeps the AI output aligned with your Tuesday ground truth and Wednesday NLP benchmark.\n\n**Takeaway:** Including the 17 Universal Dependencies UPOS tags in your prompt prevents the model from inventing non-standard grammatical labels.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Providing the Universal Dependencies Schema in Prompts", "questiontext": "<p>Why is it essential to explicitly supply the Universal Dependencies (UD) tagset in the system prompt?</p>", "generalfeedback": "<p>Including the 17 Universal Dependencies UPOS tags in your prompt prevents the model from inventing non-standard grammatical labels.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To constrain the model to the standard 17 UPOS tags, preventing it from inventing arbitrary or conflicting grammatical labels.</p>", "feedback": "<p>Correct. Explicitly providing the tagset ensures interoperability and prevents models from mixing legacy tagsets like Penn Treebank.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models are physically incapable of recognizing parts of speech without external help.</p>", "feedback": "<p>Incorrect. Models know many grammatical systems; explicit schemas prevent them from using conflicting tagsets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Universal Dependencies was designed exclusively for 21st-century social media text.</p>", "feedback": "<p>Incorrect. Universal Dependencies is an international cross-linguistic standard used extensively across historical corpora.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI schemas reject any document that uses standard grammatical terminology.</p>", "feedback": "<p>Incorrect. TEI welcomes standard linguistic attributes like pos and lemma.</p>"}]}}, {"step": 5, "title": "Enforcing Strict Negative Constraints", "content": "**Enforcing Strict Negative Constraints**\n\nIn prompt engineering, what you forbid is just as important as what you request. These boundaries are called **negative constraints**.\n\nLanguage models are trained to be helpful assistants. When they see historical spelling mistakes or scribal abbreviations, their default instinct is to \"fix\" the text for modern readers. In scholarly editing, this instinct corrupts historical evidence!\n\nInclude these four negative constraints in your prompt:\n<ol>\n  <li><strong>DO NOT alter surface text:</strong> Preserve the exact historical characters, spelling slips, and accents inside the <code>&lt;w&gt;</code> tags.</li>\n  <li><strong>DO NOT invent lemmas:</strong> Use modern canonical dictionary headwords; do not invent archaic lemmas like <em>faisoir</em>.</li>\n  <li><strong>DO NOT drop punctuation:</strong> Enclose every comma, period, and colon in a <code>&lt;pc&gt;</code> tag.</li>\n  <li><strong>DO NOT wrap in markdown fences:</strong> Output raw XML without conversational introductions or explanations.</li>\n</ol>\n\nNegative constraints rein in the model's helpful impulses and enforce scholarly discipline.\n\n**Vocabulary.** *Negative Constraint*. An explicit instruction in a prompt that forbids unwanted model behaviors, such as modernizing spelling or dropping punctuation.\n\n**Takeaway:** Negative constraints prevent AI models from modernizing historical spellings, dropping punctuation, or adding conversational filler.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Enforcing Strict Negative Constraints", "questiontext": "<p>Why are negative constraints (specifying what the model must NOT do) vital when parsing historical documents with AI?</p>", "generalfeedback": "<p>Negative constraints prevent AI models from modernizing historical spellings, dropping punctuation, or adding conversational filler.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They prevent the model from modernizing archaic spellings, altering punctuation, or prepending conversational pleasantries.</p>", "feedback": "<p>Correct. Explicit negative constraints guard against the natural conversational tendencies and modernization habits of generative models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They prevent the computer monitor from displaying dark colors during processing.</p>", "feedback": "<p>Incorrect. Negative constraints are linguistic rules, not display configurations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They instruct the computer to reject all historical documents permanently.</p>", "feedback": "<p>Incorrect. Negative constraints preserve the authentic historical surface tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They cause the neural network to forget all training data.</p>", "feedback": "<p>Incorrect. Constraints restrict the response format, protecting documentary fidelity.</p>"}]}}, {"step": 6, "title": "Invented word Modes in Historical Lemmatization", "content": "**Invented word Modes in Historical Lemmatization**\n\nThe greatest danger when using AI in scholarly editing is **invented word**. A inv. A model generates plausible-sounding output that is factually wrong or non-existent.\n\nIn linguistic markup, invented words take specific forms:\n<ul>\n  <li><strong>Invented Lemmas:</strong> The model invents a fake Latin or Old French root word that never existed in any dictionary.</li>\n  <li><strong>Confabulated Meanings:</strong> The model invents an imaginary historical meaning to explain an unusual spelling.</li>\n  <li><strong>Ghost Morphemes:</strong> The model breaks a simple word into non-existent prefixes and suffixes.</li>\n</ul>\n\nBecause language models write with total grammatical confidence, invented words can easily fool unwary editors. Every lemma produced by an AI model must be checked against an authoritative dictionary (OED or TLFi).\n\n**Vocabulary.** *Invented word* — Confidently generated model output that is factually false, ungrounded, or non-existent in reality. *Lexical Verification* — Checking model-generated words against an authoritative reference dictionary.\n\n**Takeaway:** AI models can confidently invent non-existent lemmas; every AI-generated headword must be verified against an authoritative lexicon.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Invented word Modes in Historical Lemmatization", "questiontext": "<p>What is an invented lemma (morphological hallucination) in AI-assisted text analysis?</p>", "generalfeedback": "<p>AI models can confidently invent non-existent lemmas; every AI-generated headword must be verified against an authoritative lexicon.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A plausible-sounding but factually non-existent headword invented by the model rather than found in an authoritative lexicon.</p>", "feedback": "<p>Correct. Models can generate fluent-looking Latinate or French headwords that do not exist in historical lexicography; editors must verify every lemma.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A genuine historical word that human editors have forgotten how to read.</p>", "feedback": "<p>Incorrect. An invented lemma is a synthetic error produced by the statistical model.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A lemma that has been verified against the Oxford English Dictionary and TLFi.</p>", "feedback": "<p>Incorrect. A verified headword is authentic ground truth, not an invented hallucination.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A software bug that causes printer ink to smear on physical paper.</p>", "feedback": "<p>Incorrect. Lemmatization hallucinations occur in digital text generation.</p>"}]}}, {"step": 7, "title": "The Modernizing error Hazard in Historical Linguistics", "content": "**The Modernizing error Hazard in Historical Linguistics**\n\nA subtle form of invented word is **modernizing error**. Modernizing. A model treats a genuine historical feature as an error and silently \"corrects\" it.\n\nIn Andromeda's 1752 Treaty, the scribe wrote *acknowledg'd*. An AI model might silently change the surface text to *acknowledged* inside the `<w>` tag, erasing the historical apostrophe. In Maud Lewis's letters, an informal phrase like *them things* might be silently converted to *those things*.\n\nIn Ace's 1791 decree, an 18th-century verb form like *décrétoit* might be silently changed to *décrétait*. When an editor asks for linguistic markup, they want tags attached to the historical ink, not a modern rewrite. Tracking modernizing errors is one of your main tasks during today's audit.\n\n**Vocabulary.** *Modernizing error* — An autom. A model inappropriately modernizes or standardizes genuine historical language features.\n\n**Takeaway:** Watch out for hypercorrection: AI models often try to smooth away historical spellings, contractions, and scribal quirks.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: The Modernizing error Hazard in Historical Linguistics", "questiontext": "<p>How does the 'modernization trap' manifest when an AI model processes historical text?</p>", "generalfeedback": "<p>Watch out for hypercorrection: AI models often try to smooth away historical spellings, contractions, and scribal quirks.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model silently 'corrects' authentic historical orthography or dialectal inflections into standard modern equivalents.</p>", "feedback": "<p>Correct. Generative models trained heavily on modern text often exhibit hypercorrection, smoothing over genuine historical traits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model refuses to process any text written before the year 2000.</p>", "feedback": "<p>Incorrect. Models process historical text readily, but tend to modernize irregular spellings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model changes all fonts in the editor to modern sans-serif typefaces.</p>", "feedback": "<p>Incorrect. Modernization refers to linguistic alteration of tokens and headwords.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model deletes all vowels from the student's manuscript transcription.</p>", "feedback": "<p>Incorrect. Modernization typically substitutes contemporary standardized spellings.</p>"}]}}, {"step": 8, "title": "Handling Out-of-Vocabulary Terms with Generative Context", "content": "**Handling Out-of-Vocabulary Terms with Generative Context**\n\nWhile AI models have risks, they also possess genuine strengths. Their greatest advantage over deterministic taggers is their ability to handle Out-of-Vocabulary historical words.\n\nOn Wednesday, you saw that TreeTagger failed on *décrétoit*. *shew'd* because those exact spellings were missing from its modern dictionary. A AI model does not suffer from this rigid limitation.\n\nBecause the AI model reads the entire sentence, it understands the syntax. It sees that *décrétoit* occupies the finite verb slot following the subject *l'Assemblée*. It recognizes the historical *-oit* suffix as an older imperfect ending. It correctly deduces that the base lemma is *décréter*. Where deterministic tools fail, generative models use context to solve historical puzzles.\n\n**Takeaway:** Generative AI models use full sentence context to deduce correct lemmas for historical spellings that break deterministic taggers.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Handling Out-of-Vocabulary Terms with Generative Context", "questiontext": "<p>What enables an LLM to deduce the correct lemma for an out-of-vocabulary historical word that breaks rule-based taggers?</p>", "generalfeedback": "<p>Generative AI models use full sentence context to deduce correct lemmas for historical spellings that break deterministic taggers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model uses its wide context window to evaluate syntactic and semantic relationships across the whole sentence.</p>", "feedback": "<p>Correct. Rather than relying on a static dictionary lookup, neural attention evaluates how the archaic word functions in context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model queries Wikipedia in real time to look up the author's biography.</p>", "feedback": "<p>Incorrect. The inference engine evaluates token probabilities within its attention context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model re-scans the original parchment manuscript with an optical sensor.</p>", "feedback": "<p>Incorrect. The language model processes the transcribed token sequence directly.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model automatically converts the historical word into an acronym.</p>", "feedback": "<p>Incorrect. Attention mechanisms assess surrounding syntax to determine part of speech and base meaning.</p>"}]}}, {"step": 9, "title": "Prompting for TEI XML vs JSON Output", "content": "**Prompting for TEI XML vs JSON Output**\n\nWhen designing an AI pipeline, you have two choices for output format: requesting raw TEI XML directly, or requesting structured JSON that you convert to XML with a script.\n\nRequesting TEI XML directly is fast and convenient:\n```xml\n<w lemma=\"promise\" pos=\"VERB\">promis'd</w>\n```\nHowever, models sometimes make small XML syntax errors, such as forgetting a closing tag or omitting quotes around attributes.\n\nRequesting structured JSON is often more robust:\n```json\n{\"token\": \"promis'd\", \"lemma\": \"promise\", \"pos\": \"VERB\"}\n```\nA short Python script can validate the JSON and convert it into valid TEI XML. For today's classroom exercise, prompting directly for clean TEI XML is completely f. Large projects often use the json-to-xml route.\n\n**Takeaway:** Prompting for TEI XML directly is fast for short excerpts; prompting for JSON provides stricter programmatic validation for large texts.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Prompting for TEI XML vs JSON Output", "questiontext": "<p>What is the key trade-off between prompting an AI model for raw TEI XML versus structured JSON?</p>", "generalfeedback": "<p>Prompting for TEI XML directly is fast for short excerpts; prompting for JSON provides stricter programmatic validation for large texts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Direct TEI XML is fast for short excerpts; structured JSON enables strict programmatic validation before conversion.</p>", "feedback": "<p>Correct. Direct XML is convenient for small passages, while JSON paired with Pydantic ensures schema validation for large batches.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Direct TEI XML is strictly prohibited by international digital humanities standards.</p>", "feedback": "<p>Incorrect. Both formats are widely accepted; JSON simply facilitates automated post-processing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>JSON files can only store English words, while TEI XML stores French and Latin.</p>", "feedback": "<p>Incorrect. Both JSON and XML fully support universal Unicode character sets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>TEI XML destroys all linguistic attributes upon generation.</p>", "feedback": "<p>Incorrect. TEI <w> tags cleanly represent lemma, pos, and morphological attributes.</p>"}]}}, {"step": 10, "title": "The Three-Way Comparative Audit: Manual vs NLP vs AI", "content": "**The Three-Way Comparative Audit: Manual vs NLP vs AI**\n\nNow we bring all three stages of Week Eight together in our **Three-Way Comparative Audit**.\n\nOpen three files side by side in VS Code:\n<ol>\n  <li><code>ground_truth_manual.xml</code>: Tuesday's hand-verified philological baseline.</li>\n  <li><code>nlp_baseline.xml</code>: Wednesday's deterministic SpaCy / TreeTagger output.</li>\n  <li><code>ground_truth_ai.xml</code>: Today's AI-generated markup.</li>\n</ol>\n\nBy comparing all three tiers across the exact same twenty-word passage, you can evaluate each technology objectively. Where did all three agree? Where did the deterministic tool fail while the AI succeeded? Where did the AI hallucinate while human scholarship stood firm?\n\n**Takeaway:** The three-way audit compares manual, deterministic, and AI markup side by side, evaluating the strengths and weaknesses of each tier.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: The Three-Way Comparative Audit: Manual vs NLP vs AI", "questiontext": "<p>What is the primary objective of the three-way comparative audit in Week 8?</p>", "generalfeedback": "<p>The three-way audit compares manual, deterministic, and AI markup side by side, evaluating the strengths and weaknesses of each tier.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To evaluate manual, deterministic, and AI markup side by side, measuring the accuracy and trade-offs of each tier.</p>", "feedback": "<p>Correct. Benchmarking all three methods against each other reveals the unique failure modes of human, rule-based, and generative approaches.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prove that human scholars should never learn computer programming.</p>", "feedback": "<p>Incorrect. The comparative audit empowers scholars to master and critically assess computational tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force all students to arrive at identical numerical word counts.</p>", "feedback": "<p>Incorrect. The audit measures qualitative and quantitative agreement across tiers on authentic documents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To delete the student's manual ground truth if the AI produces different tags.</p>", "feedback": "<p>Incorrect. The manual ground truth is the reference standard against which tools are measured.</p>"}]}}, {"step": 11, "title": "Taxonomy of Discrepancies: Four Error Categories", "content": "**Taxonomy of Discrepancies: Four Error Categories**\n\nWhen you compare your three files, you will find differences. To analyze them rigorously, classify every discrepancy into one of four standard categories:\n\n<table>\n  <thead>\n    <tr>\n      <th>Category</th>\n      <th>Name</th>\n      <th>Description and Cause</th>\n      <th>Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Category A</strong></td>\n      <td>Human Slip</td>\n      <td>A human error in Tuesday's manual ground truth caused by fatigue or a typo.</td>\n      <td>Human miskeyed lemma as <code>trety</code></td>\n    </tr>\n    <tr>\n      <td><strong>Category B</strong></td>\n      <td>Deterministic Rigid Miss</td>\n      <td>The rule-based NLP tool failed due to an Out-of-Vocabulary historical spelling.</td>\n      <td>SpaCy failed on <code>décrétoit</code> or <code>shew'd</code></td>\n    </tr>\n    <tr>\n      <td><strong>Category C</strong></td>\n      <td>AI Hallucination / Smoothing</td>\n      <td>The AI model modernized spelling, invented a fake lemma, or dropped punctuation.</td>\n      <td>AI altered <code>promis'd</code> to <code>promised</code></td>\n    </tr>\n    <tr>\n      <td><strong>Category D</strong></td>\n      <td>Genuine Crux / Ambiguity</td>\n      <td>The text allows two equally valid grammatical readings; both tiers are defensible.</td>\n      <td>Homograph <code>will</code> as noun vs auxiliary</td>\n    </tr>\n  </tbody>\n</table>\n\nThis taxonomy turns random errors into structured scholarly insights.\n\n**Vocabulary.** *Error Taxonomy*. A formal classification system used to categoriz. Analyze the root causes of computational and human errors.\n\n**Takeaway:** Classify every disagreement into Category A (human slip), B (NLP rigid miss), C (AI hallucination), or D (genuine crux).\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Taxonomy of Discrepancies: Four Error Categories", "questiontext": "<p>In the course's four-category discrepancy taxonomy, what distinguishes Category B from Category C?</p>", "generalfeedback": "<p>Classify every disagreement into Category A (human slip), B (NLP rigid miss), C (AI hallucination), or D (genuine crux).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Category B represents deterministic NLP rule or dictionary misses, while Category C represents AI hallucinations or modernizations.</p>", "feedback": "<p>Correct. Category B captures rigid tagger errors (like OOV failures), whereas Category C tracks generative model fabrications.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Category B indicates human typographical errors, while Category C indicates server outages.</p>", "feedback": "<p>Incorrect. Human slips are Category A; B and C isolate deterministic vs neural failure modes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Category B applies only to nouns, while Category C applies only to verbs.</p>", "feedback": "<p>Incorrect. The taxonomy classifies error origins regardless of grammatical category.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Category B represents genuine manuscript cruces, while Category C represents perfect agreement.</p>", "feedback": "<p>Incorrect. Genuine cruces are Category D; agreements are not errors.</p>"}]}}, {"step": 12, "title": "Evaluating Token-Level Accuracy Across All Three Tiers", "content": "**Evaluating Token-Level Accuracy Across All Three Tiers**\n\nTo complete your benchmark, calculate token-level accuracy for both automated tiers against your manual ground truth.\n\nCreate a summary comparison table in your notes:\n\n<table>\n  <thead>\n    <tr>\n      <th>Metric</th>\n      <th>Deterministic NLP (SpaCy / TreeTagger)</th>\n      <th>AI Model (Antigravity / Claude)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Total Tokens Evaluated</td>\n      <td>20</td>\n      <td>20</td>\n    </tr>\n    <tr>\n      <td>Matching UPOS Tags</td>\n      <td>18 / 20 (90%)</td>\n      <td>19 / 20 (95%)</td>\n    </tr>\n    <tr>\n      <td>Matching Lemmas</td>\n      <td>16 / 20 (80%)</td>\n      <td>19 / 20 (95%)</td>\n    </tr>\n    <tr>\n      <td>Overall Token Accuracy</td>\n      <td>80%</td>\n      <td>95%</td>\n    </tr>\n  </tbody>\n</table>\n\nIn most historical documents, the AI model scores higher on lemm. Of its broader vocabulary. It may lose points on punctuation or surface-text alterations.\n\n**Takeaway:** Calculate token-level POS and Lemma accuracy for both automated tiers to see which tool performed best on your document.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Evaluating Token-Level Accuracy Across All Three Tiers", "questiontext": "<p>How is token-level part-of-speech accuracy calculated in the linguistic benchmarking harness?</p>", "generalfeedback": "<p>Calculate token-level POS and Lemma accuracy for both automated tiers to see which tool performed best on your document.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By dividing the number of correctly tagged tokens by the total number of aligned tokens against the manual ground truth.</p>", "feedback": "<p>Correct. Token accuracy is the percentage of tokens where the machine tag exactly matches the verified manual baseline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By counting the total number of letters in the document and multiplying by one hundred.</p>", "feedback": "<p>Incorrect. Accuracy measures correct token classifications, not character length.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By asking the AI model to grade its own confidence on a scale of one to ten.</p>", "feedback": "<p>Incorrect. Self-reported confidence scores do not replace empirical ground-truth verification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By measuring the physical file size of the resulting XML document in kilobytes.</p>", "feedback": "<p>Incorrect. File size reflects data volume, not classification accuracy.</p>"}]}}, {"step": 13, "title": "Calculating AI Precision, Recall, and Invented word Rates", "content": "**Calculating AI Precision, Recall, and Invented word Rates**\n\nIn addition to accuracy, calculate the model's **invented word rate** and **modernizing error rate**.\n\nUse these two simple metrics:\n<ul>\n  <li><strong>Hallucination Rate:</strong> (Number of Invented Lemmas / Total Tokens) * 100. In a sound scholarly prompt, this should be 0%.</li>\n  <li><strong>Hypercorrection Rate:</strong> (Number of Altered Surface Words / Total Tokens) * 100. This measures how often the model modernized your historical characters.</li>\n</ul>\n\nIf the model changed *promis'd* to *promised* once in twenty words, its modernizing error rate is 5%. Documenting these rates proves that you are evaluating AI with scientific rigor.\n\n**Takeaway:** Quantify AI risks by calculating hallucination and hypercorrection rates alongside standard precision and recall scores.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Calculating AI Precision, Recall, and Invented word Rates", "questiontext": "<p>Why is it essential to calculate the invented word (hallucination) rate alongside standard accuracy?</p>", "generalfeedback": "<p>Quantify AI risks by calculating hallucination and hypercorrection rates alongside standard precision and recall scores.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because a model may achieve high general accuracy while still introducing non-existent, fabricated lemmas into the edition.</p>", "feedback": "<p>Correct. General accuracy can mask critical lexicographical fabrications; tracking invented headwords isolates this specific risk.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because precision and recall cannot be calculated on digital text files.</p>", "feedback": "<p>Incorrect. Precision and recall are standard mathematical metrics in computational linguistics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because digital editions are only evaluated on the speed of their web hosting server.</p>", "feedback": "<p>Incorrect. Scholarly integrity depends directly on lexicographical and editorial precision.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because hallucinated lemmas improve the literary style of historical documents.</p>", "feedback": "<p>Incorrect. Invented lemmas corrupt the historical evidence of the witness.</p>"}]}}, {"step": 14, "title": "Testing AI on Andromeda's 1752 Treaty Excerpt", "content": "**Testing AI on Andromeda's 1752 Treaty Excerpt**\n\nLet us look at how an AI model performs on Andromeda's project: the 1752 P. Friendship treaty.\n\nClause: *All Treaties shall be renewed by the Governor*.\n\nHere is the three-way comparison:\n<ul>\n  <li><strong>Manual Ground Truth:</strong> <em>All</em> (DET, all), <em>Treaties</em> (NOUN, treaty), <em>shall</em> (AUX, shall), <em>be</em> (AUX, be), <em>renewed</em> (VERB, renew).</li>\n  <li><strong>Deterministic SpaCy:</strong> Matched all five tokens perfectly (100% accuracy).</li>\n  <li><strong>AI Model:</strong> Matched all five tokens perfectly, and correctly identified that <em>renewed</em> is a passive participle.</li>\n</ul>\n\nOn standard 18th-century legal formulas, both automated tools perform exceptionally well. Disagreements only emerge when archaic contractions like *promis'd* or legal compounds like *whereunto* appear.\n\n**Takeaway:** On standard legal English formulas, both deterministic NLP and AI models achieve near-perfect agreement with human ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Testing AI on Andromeda's 1752 Treaty Excerpt", "questiontext": "<p>Why did automated NLP and AI taggers achieve high accuracy on Andromeda's 1752 Peace and Friendship Treaty excerpt?</p>", "generalfeedback": "<p>On standard legal English formulas, both deterministic NLP and AI models achieve near-perfect agreement with human ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The text follows formal, standardized 18th-century colonial legal formulas with predictable syntactic structures.</p>", "feedback": "<p>Correct. Highly formulaic legal prose aligns well with both rule-based grammars and pre-trained language models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The treaty was originally composed using modern Python programming scripts.</p>", "feedback": "<p>Incorrect. The treaty is an authentic 18th-century historical legal instrument.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The text contained no verbs or nouns whatsoever.</p>", "feedback": "<p>Incorrect. Legal agreements contain complex noun phrases and performative verbs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The students replaced all English words with Latin translations before tagging.</p>", "feedback": "<p>Incorrect. The treaty was parsed in its authentic printed English proclamation text.</p>"}]}}, {"step": 15, "title": "Testing AI on Ace's 1791 French Decree Excerpt", "content": "**Testing AI on Ace's 1791 French Decree Excerpt**\n\nNow let us examine Ace's project: a 1791 French Revolutionary decree containing the archaic verb *décrétoit*.\n\nSentence: *L'Assemblée nationale décrétoit la loi*.\n\nHere is the three-way comparison:\n<ul>\n  <li><strong>Manual Ground Truth:</strong> <em>décrétoit</em> &rarr; lemma <code>décréter</code>, UPOS <code>VERB</code>, Features: Tense=Imp|VerbForm=Fin.</li>\n  <li><strong>Deterministic SpaCy:</strong> <em>décrétoit</em> &rarr; lemma <code>décrétoit</code>, UPOS <code>NOUN</code> (Category B error: OOV suffix failure).</li>\n  <li><strong>AI Model:</strong> <em>décrétoit</em> &rarr; lemma <code>décréter</code>, UPOS <code>VERB</code>, Features: Tense=Imp|VerbForm=Fin (Match!).</li>\n</ul>\n\nLook at that result! SpaCy failed because *-oit* was missing from its modern dictionary. The AI model recognized the 18th-century suffix. Mapped the verb to its proper infinitive *décréter*. This is a clear demonstration of AI's strength on historical morphology.\n\n**Takeaway:** AI models successfully resolve 18th-century French verbal suffixes like *-oit* where deterministic dictionaries fail.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Testing AI on Ace's 1791 French Decree Excerpt", "questiontext": "<p>When processing Ace's 1791 French Revolutionary decree, how did the generative AI handle the archaic verb form décrétoit?</p>", "generalfeedback": "<p>AI models successfully resolve 18th-century French verbal suffixes like -oit where deterministic dictionaries fail.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The AI correctly recognized the 18th-century imperfect suffix -oit and assigned the canonical lemma décréter.</p>", "feedback": "<p>Correct. Contextual historical exposure allowed the AI to resolve the archaic spelling where modern lookup dictionaries failed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI reported an error and deleted the entire sentence from the file.</p>", "feedback": "<p>Incorrect. The generative model successfully lemmatized the archaic inflected form.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI translated the French verb into German without assigning a lemma.</p>", "feedback": "<p>Incorrect. The model remained in French, lemmatizing décrétoit as décréter.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI insisted that décrétoit was a modern English preposition.</p>", "feedback": "<p>Incorrect. The model accurately identified it as an inflected French verb.</p>"}]}}, {"step": 16, "title": "Testing AI on Maud Lewis's Folk Correspondence Excerpt", "content": "**Testing AI on Maud Lewis's Folk Correspondence Excerpt**\n\nNext, we examine Olyvia's project: Maud Lewis's informal 1967 letter: *I received your letter today*.\n\nHere is the three-way comparison:\n<ul>\n  <li><strong>Manual Ground Truth:</strong> <em>your</em> &rarr; lemma <code>you</code>, UPOS <code>PRON</code>, Feature: Poss=Yes (OED policy).</li>\n  <li><strong>Deterministic SpaCy:</strong> <em>your</em> &rarr; lemma <code>your</code>, UPOS <code>PRON</code> (Lexicographical policy disagreement).</li>\n  <li><strong>AI Model:</strong> <em>your</em> &rarr; lemma <code>you</code>, UPOS <code>PRON</code> (Followed prompt policy!).</li>\n</ul>\n\nBecause our prompt explicitly instructed the AI model to map possessive pronouns to base personal pronouns, the AI followed our project policy. SpaCy could not be reconfigured without editing its internal lexicon. AI prompts offer superior flexibility when enforcing custom project guidelines.\n\n**Takeaway:** AI models easily adopt custom project dictionary policies provided in prompts, outperforming rigid pre-compiled tagger libraries.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Testing AI on Maud Lewis's Folk Correspondence Excerpt", "questiontext": "<p>Why did the generative AI model perform well on Olyvia's 1967 Maud Lewis letter?</p>", "generalfeedback": "<p>AI models easily adopt custom project dictionary policies provided in prompts, outperforming rigid pre-compiled tagger libraries.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model readily followed custom project dictionary policies provided in the prompt for informal Maritime vernacular.</p>", "feedback": "<p>Correct. In-context instructions allow LLMs to adopt specialized editorial conventions that rigid pre-compiled taggers cannot accommodate.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Maud Lewis wrote her personal letters in formal Classical Attic Greek.</p>", "feedback": "<p>Incorrect. Maud Lewis wrote in 20th-century Nova Scotia informal English.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The letter contained only numbers and punctuation marks.</p>", "feedback": "<p>Incorrect. The letter is a personal handwritten correspondence about painting sales.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI model was trained exclusively on Maud Lewis's personal diary.</p>", "feedback": "<p>Incorrect. The model generalized from prompt instructions and historical English exposure.</p>"}]}}, {"step": 17, "title": "Adjudicating Disagreements: The Editor as Arbiter", "content": "**Adjudicating Disagreements: The Editor as Arbiter**\n\nAfter completing your three-way audit, you will have a table of disagreements. Now comes the core scholarly duty: **editorial adjudication**.\n\nAn algorithm cannot decide what belongs in your final edition. The human editor is the ultimate arbiter. Go through each discrepancy:\n<ul>\n  <li>If the machine made an error (Category B or C), reject the machine prediction and keep your manual ground truth.</li>\n  <li>If the machine exposed a genuine human slip in your Tuesday table (Category A), gratefully correct your ground truth!</li>\n  <li>If the disagreement is a genuine crux (Category D), select the reading best supported by historical evidence and document your reasons.</li>\n</ul>\n\nThis review process transforms raw machine output into reliable, peer-reviewed scholarship.\n\n**Vocabulary.** *Editorial Adjudication*. The scholarly decision-making p. A human editor resolves conflicting readings and approves the final text.\n\n**Takeaway:** The human editor serves as the ultimate arbiter, adjudicating every machine disagreement before publishing the edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Adjudicating Disagreements: The Editor as Arbiter", "questiontext": "<p>When the manual baseline, deterministic tagger, and AI model produce conflicting readings, who makes the final decision?</p>", "generalfeedback": "<p>The human editor serves as the ultimate arbiter, adjudicating every machine disagreement before publishing the edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The human scholarly editor, who evaluates lexical authority files and context to decide the definitive reading.</p>", "feedback": "<p>Correct. Automated tools suggest hypotheses; the human editor exercises critical judgment to establish authoritative text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The software company that manufactures the user's laptop.</p>", "feedback": "<p>Incorrect. Editorial responsibility rests with the textual scholar.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A coin flip or random number generator.</p>", "feedback": "<p>Incorrect. Scholarly editing requires reasoned justification grounded in evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whichever automated tool produced its answer in the fewest milliseconds.</p>", "feedback": "<p>Incorrect. Speed does not guarantee lexicographical accuracy.</p>"}]}}, {"step": 18, "title": "Synthesizing the Final Linguistic XML: `transcription_linguistic.xml`", "content": "**Synthesizing the Final Linguistic XML: `transcription_linguistic.xml`**\n\nWith all disagreements adjudicated, you are ready to produce your official deliverable: `transcription_linguistic.xml`.\n\nThis file merges the verified readings into your complete project TEI document. Every word token in your 20-word excerpt is wrapped in a `<w>` tag with verified `@lemma`. `@pos` attributes. Punctuation is enclosed in `<pc>`. Sentences are enclosed in `<s>`.\n\nCheck that your file is well-formed XML:\n<ul>\n  <li>Every open tag has a matching closing tag.</li>\n  <li>Attribute values are enclosed in quotes.</li>\n  <li>The XML tree nests cleanly without overlapping boundaries.</li>\n</ul>\n\nThis file represents the definitive linguistic layer of your digital edition.\n\n**Takeaway:** Combine your adjudicated readings into `transcription_linguistic.xml`, verifying clean XML syntax and well-formed tags.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Synthesizing the Final Linguistic XML: `transcription_linguistic.xml`", "questiontext": "<p>What is the final technical deliverable that integrates the adjudicated linguistic markup in Module 8?</p>", "generalfeedback": "<p>Combine your adjudicated readings into transcription_linguistic.xml, verifying clean XML syntax and well-formed tags.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A well-formed TEI XML document (transcription_linguistic.xml) with tokens wrapped in <w> tags carrying lemma and pos attributes.</p>", "feedback": "<p>Correct. The final file embeds adjudicated lemmas, UPOS tags, and morphological attributes directly into the TEI edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A handwritten notebook left on the instructor's desk.</p>", "feedback": "<p>Incorrect. The deliverable is a validated TEI XML digital file.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A collection of raw unformatted JPEG screen captures.</p>", "feedback": "<p>Incorrect. Digital scholarly editions require structured, standards-compliant XML data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A blank text file with no XML markup.</p>", "feedback": "<p>Incorrect. The assignment requires complete TEI linguistic markup.</p>"}]}}, {"step": 19, "title": "Transparent Metadata Attribution with `@resp`", "content": "**Transparent Metadata Attribution with `@resp`**\n\nIn digital scholarly editions, transparency is paramount. R. Researchers must know who produced each annotation: a human scholar, a deterministic script, or an ai model.\n\nTEI P5 provides the `@resp` (responsibility) attribute for this exact purpose. In your `teiHeader`, define your agents:\n```xml\n<respStmt>\n  <resp>Manual annotation</resp>\n  <name xml:id=\"editor\">Ken Penner</name>\n</respStmt>\n<respStmt>\n  <resp>Deterministic NLP pipeline</resp>\n  <name xml:id=\"spacy\">SpaCy 3.7 (en_core_web_sm)</name>\n</respStmt>\n<respStmt>\n  <resp>AI-assisted parsing</resp>\n  <name xml:id=\"claude\">Claude 3.5 Sonnet / Antigravity</name>\n</respStmt>\n```\n\nOn your `<w>` elements, you can cite who verified the tag: `<w lemma=\"renew\" pos=\"VERB\" resp=\"#editor\">`. Transparent attribution ensures full academic integrity.\n\n**Vocabulary.** *`@resp`*. The tei attribute that indicates who is responsible for a specific editorial decision, correction, or markup layer.\n\n**Takeaway:** Use the TEI `@resp` attribute and header statements to document whether annotations came from human editors, scripts, or AI models.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Transparent Metadata Attribution with `@resp`", "questiontext": "<p>How does TEI XML record transparent provenance for linguistic annotations produced by different agents?</p>", "generalfeedback": "<p>Use the TEI @resp attribute and header statements to document whether annotations came from human editors, scripts, or AI models.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By attaching the @resp attribute to <w> elements, referencing specific editor, script, or AI agent IDs defined in the header.</p>", "feedback": "<p>Correct. The @resp pointer links each annotation to an editor or computational tool recorded in <titleStmt> or <revisionDesc>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By adding invisible watermark pixels to the background of the web browser.</p>", "feedback": "<p>Incorrect. Provenance is encoded explicitly in semantic TEI XML attributes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By locking the computer so that future users cannot read the source code.</p>", "feedback": "<p>Incorrect. Scholarly standards demand open, verifiable annotation provenance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By renaming the XML file after every execution of a Python script.</p>", "feedback": "<p>Incorrect. TEI uses standard header metadata and attribute pointers.</p>"}]}}, {"step": 20, "title": "Combining All Layers: The Complete TEI Architecture", "content": "**Combining All Layers: The Complete TEI Architecture**\n\nTake a moment to admire what your TEI document now contains. Over eight weeks, you have built a deeply layered digital monument:\n\n<ol>\n  <li><strong>Metadata Layer:</strong> The <code>teiHeader</code> catalogues author, date, archive, license, and project policies.</li>\n  <li><strong>Image Layer:</strong> The <code>&lt;facsimile&gt;</code> container links high-resolution image manifests directly to text surfaces.</li>\n  <li><strong>Diplomatic Layer:</strong> The transcribed text preserves original ink, scribal lineation (<code>&lt;lb/&gt;</code>), and historical characters.</li>\n  <li><strong>Regularization Layer:</strong> The <code>&lt;choice&gt;</code> elements pair original spellings (<code>&lt;orig&gt;</code>) with modernized readings (<code>&lt;reg&gt;</code>).</li>\n  <li><strong>Linguistic Layer:</strong> The <code>&lt;w&gt;</code> and <code>&lt;s&gt;</code> elements record dictionary lemmas, parts of speech, and syntactic features.</li>\n</ol>\n\nAll five layers coexist in a single well-formed XML file. This is the true power of the Text Encoding Initiative.\n\n**Takeaway:** Your final TEI file unifies metadata, images, diplomatic text, normalized readings, and linguistic grammar in a single standards-compliant document.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Combining All Layers: The Complete TEI Architecture", "questiontext": "<p>How does the linguistic markup of Module 8 enrich the cumulative digital edition built over preceding weeks?</p>", "generalfeedback": "<p>Your final TEI file unifies metadata, images, diplomatic text, normalized readings, and linguistic grammar in a single standards-compliant document.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It integrates lexical lemmas and grammar directly into the existing architecture of metadata, facsimile links, and normalized text.</p>", "feedback": "<p>Correct. Over eight weeks, the TEI document grows into a multi-layered digital monument linking physical layout, orthography, and grammar.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It overwrites and destroys all bibliographic metadata created in Module 2.</p>", "feedback": "<p>Incorrect. TEI modules are cumulative and complementary; metadata is preserved.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts the edition into an unreadable encrypted cipher.</p>", "feedback": "<p>Incorrect. Linguistic tagging increases analytical accessibility for readers and search engines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It eliminates the need for manuscript facsimile images.</p>", "feedback": "<p>Incorrect. Facsimile images remain essential codicological evidence in the edition.</p>"}]}}, {"step": 21, "title": "Building Syntactic Dependency Trees with AI", "content": "**Building Syntactic Dependency Trees with AI**\n\nIn addition to parts of speech, you can prompt modern AI models to generate complete Universal Dependencies syntax trees in CoNLL-U format.\n\nIn your prompt, instruct the model: *For each word, identify its governing head ID. Its deprel relation tag*. The model will output the full 10-column table, identifying the root v. Linking subjects, obj. Modifiers.\n\nWhen evaluating AI syntax trees, check for **cycle errors**. In a valid dependency tree, no word can depend on itself. Arrows must never form closed loops. The tree must form a clean hierarchy descending from the central root verb.\n\n**Vocabulary.** *Treebank* — A text corpus annotated with complete syntactic dependency or phrase-structure trees. *Cycle Error*. An invalid syntactic grap. Dependency links form an infinite closed loop rather than a rooted tree.\n\n**Takeaway:** AI models can predict complete syntactic dependency trees, but editors must audit them to ensure clean hierarchies without cycle errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Building Syntactic Dependency Trees with AI", "questiontext": "<p>What additional structural relationship do syntactic dependency trees represent in CoNLL-U format?</p>", "generalfeedback": "<p>AI models can predict complete syntactic dependency trees, but editors must audit them to ensure clean hierarchies without cycle errors.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Hierarchical head-dependent relationships showing which words govern or modify other words in the sentence.</p>", "feedback": "<p>Correct. Dependency syntax models grammatical structure by linking modifiers to their governing syntactic heads.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The chronological order in which the scribe purchased ink and paper.</p>", "feedback": "<p>Incorrect. Dependency trees model grammatical syntax, not material history.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The geographic distance between printing presses in eighteenth-century Europe.</p>", "feedback": "<p>Incorrect. CoNLL-U trees model linguistic relationships between sentence tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The price of the digital edition on commercial e-book platforms.</p>", "feedback": "<p>Incorrect. Dependency syntax is an analytical linguistic framework.</p>"}]}}, {"step": 22, "title": "Auditing AI Dependency Trees Against Ground Truth", "content": "**Auditing AI Dependency Trees Against Ground Truth**\n\nAuditing a syntax tree is straightforward when you follow the grammatical flow of the sentence.\n\nAsk these four structural questions:\n<ol>\n  <li><strong>Root Check:</strong> Did the model assign <code>root</code> to the main finite verb or participle?</li>\n  <li><strong>Subject Check:</strong> Does the nominal subject (<code>nsubj</code>) point directly to the root verb?</li>\n  <li><strong>Object Check:</strong> Does the direct object (<code>obj</code>) attach to its governing transitive verb?</li>\n  <li><strong>Preposition Check:</strong> Do prepositions attach to their noun objects with relation <code>case</code>?</li>\n</ol>\n\nIf the model attaches an adverbial clause to the wrong noun, correct the head ID. Auditing syntax trees sharpens your understanding of how historical authors constructed arguments.\n\n**Takeaway:** Audit AI dependency trees by verifying root verbs, subject links, direct objects, and prepositional attachments.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Auditing AI Dependency Trees Against Ground Truth", "questiontext": "<p>What structural constraint must an editor verify when auditing an AI-generated dependency tree?</p>", "generalfeedback": "<p>Audit AI dependency trees by verifying root verbs, subject links, direct objects, and prepositional attachments.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The clause must have exactly one root verb, and dependency arcs must form an acyclic directed tree without circular loops.</p>", "feedback": "<p>Correct. Standard dependency grammar requires a single root and a well-formed tree hierarchy with no circular dependencies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Every single word in the sentence must be marked as the root simultaneously.</p>", "feedback": "<p>Incorrect. A sentence has exactly one root predicate in standard dependency trees.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Dependency arrows must always point in alternating alphabetical directions.</p>", "feedback": "<p>Incorrect. Arcs reflect grammatical governor-dependent relationships, not alphabetization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Punctuation marks must be designated as the governing head of all nouns.</p>", "feedback": "<p>Incorrect. Punctuation attaches to neighboring clauses or predicates, never governing nouns.</p>"}]}}, {"step": 23, "title": "The Reflection Report: Analyzing Linguistic Bottlenecks", "content": "**The Reflection Report: Analyzing Linguistic Bottlenecks**\n\nFor tonight's Assignment 8 submission, you will write a **300–500 word critical reflection** analyzing your findings.\n\nYour reflection should not simply restate your tables. It should answer these scholarly questions:\n<ul>\n  <li>Which morphological categories caused the highest failure rate in the automated tools?</li>\n  <li>Why did deterministic taggers stumble on historical spellings, while the AI model handled them?</li>\n  <li>Did the AI model introduce any subtle hypercorrections or hallucinated lemmas?</li>\n  <li>How did Module 6 spelling normalizations help bridge the gap between historical ink and modern algorithms?</li>\n</ul>\n\nA strong reflection connects technical error rates to broader philological and historical principles.\n\n**Takeaway:** Your 300–500 word reflection should analyze why specific grammatical categories failed and discuss the trade-offs of automation.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: The Reflection Report: Analyzing Linguistic Bottlenecks", "questiontext": "<p>What is the primary focus of the 300–500 word reflection report in Assignment 8?</p>", "generalfeedback": "<p>Your 300–500 word reflection should analyze why specific grammatical categories failed and discuss the trade-offs of automation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Analyzing why specific linguistic categories caused automated pipeline failures and evaluating the methodological trade-offs of automation.</p>", "feedback": "<p>Correct. The reflection evaluates error patterns (such as archaic inflections or homographs) and synthesizes the lessons of the three-tier workflow.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Writing a fictional narrative about travel in eighteenth-century Canada.</p>", "feedback": "<p>Incorrect. The reflection is a rigorous analytical critique of the computational methods.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Complaining about the speed of the campus internet connection.</p>", "feedback": "<p>Incorrect. The report focuses on linguistic and lexicographical methodology.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Listing every word in the dictionary in alphabetical order.</p>", "feedback": "<p>Incorrect. The reflection analyzes discrepancy patterns and tool performance.</p>"}]}}, {"step": 24, "title": "Documenting the Three-Way Audit in `LINGUISTIC_AUDIT.md`", "content": "**Documenting the Three-Way Audit in `LINGUISTIC_AUDIT.md`**\n\nTo keep your work organized, assemble y. Reflection inside `linguistic_audit.md` in your repository root.\n\nYour audit report should contain four clear sections:\n<ol>\n  <li><strong>Master Comparison Table:</strong> A 20-row table comparing Token, Manual Parse, NLP Parse, and AI Parse.</li>\n  <li><strong>Accuracy Scorecard:</strong> Numerical accuracy percentages, precision, recall, and hallucination rates.</li>\n  <li><strong>Discrepancy Taxonomy:</strong> An analysis sorting disagreements into Categories A, B, C, and D.</li>\n  <li><strong>Critical Reflection:</strong> Your 300–500 word discussion of algorithmic strengths and limitations.</li>\n</ol>\n\nThis report serves as the primary scholarly text that K. Evaluate for your assignment grade.\n\n**Takeaway:** Compile your master comparison table, scorecard, discrepancy taxonomy, and reflection in `LINGUISTIC_AUDIT.md`.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Documenting the Three-Way Audit in `LINGUISTIC_AUDIT.md`", "questiontext": "<p>What core documentation must be compiled inside LINGUISTIC_AUDIT.md?</p>", "generalfeedback": "<p>Compile your master comparison table, scorecard, discrepancy taxonomy, and reflection in LINGUISTIC_AUDIT.md.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The three-way comparison matrix, token accuracy scorecards, discrepancy taxonomy, and critical reflection report.</p>", "feedback": "<p>Correct. LINGUISTIC_AUDIT.md serves as the comprehensive audit ledger recording all experimental findings and editorial decisions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The personal contact information and passwords of the student cohort.</p>", "feedback": "<p>Incorrect. Audit files document philological and computational findings, not credentials.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A copy of the university's annual operating budget.</p>", "feedback": "<p>Incorrect. The file records linguistic benchmark data for the assigned manuscript passage.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Raw unformatted binary code that cannot be opened in a text editor.</p>", "feedback": "<p>Incorrect. LINGUISTIC_AUDIT.md is human-readable GitHub-flavored Markdown.</p>"}]}}, {"step": 25, "title": "Finalizing Assignment: Module 8 (Linguistic Markup)", "content": "**Finalizing Assignment: Module 8 (Linguistic Markup)**\n\nTonight at 11:00 PM, **Assignment: Module 8 (Linguistic Markup)** is due on Moodle. Let us review the grading. You know exactly how your work will be evaluated:\n\n<ul>\n  <li><strong>Manual Ground Truth Precision (4 pts / 40%):</strong> Your 20-word manual parse accurately identifies canonical dictionary lemmas and inflectional features without grammatical errors.</li>\n  <li><strong>TEI Linguistic Markup Validity (3 pts / 30%):</strong> Your XML cleanly wraps tokens in <code>&lt;w&gt;</code> and <code>&lt;pc&gt;</code> elements with valid <code>lemma=</code> and <code>pos=</code> attributes conforming to TEI P5.</li>\n  <li><strong>Comparative Error Analysis (3 pts / 30%):</strong> Your reflection insightfully discusses why automated engines struggle with homographs, historical spellings, or rare irregular conjugations.</li>\n</ul>\n\nTotal grade: 10 points (scaled to 80 points in the Moodle gradebook). Meeting these three standards ensures full marks.\n\n**Takeaway:** Assignment 8 is graded on manual precision (4 pts), TEI XML validity (3 pts), and comparative error analysis (3 pts).\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Finalizing Assignment: Module 8 (Linguistic Markup)", "questiontext": "<p>How are grades distributed across the 4 + 3 + 3 rubric for Assignment: Module 8?</p>", "generalfeedback": "<p>Assignment 8 is graded on manual precision (4 pts), TEI XML validity (3 pts), and comparative error analysis (3 pts).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manual Ground Truth Precision (4 pts), TEI Linguistic Markup Validity (3 pts), and Comparative Error Analysis (3 pts).</p>", "feedback": "<p>Correct. The rubric allocates 40% to manual accuracy, 30% to schema validity, and 30% to the analytical audit reflection.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>10 points for whichever student types the fastest in the computer lab.</p>", "feedback": "<p>Incorrect. Evaluation is based on philological precision and analytical rigor, not typing speed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>5 points for attendance and 5 points for bringing snacks to class.</p>", "feedback": "<p>Incorrect. Grades adhere strictly to the 4 + 3 + 3 academic rubric.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>10 points awarded only if the AI model makes zero mistakes on the first try.</p>", "feedback": "<p>Incorrect. Errors are expected; learning to audit and correct them earns credit.</p>"}]}}, {"step": 26, "title": "Validating Your TEI File Against the Course Schema", "content": "**Validating Your TEI File Against the Course Schema**\n\nBefore submitting your assignment, you must run the course schema validator on `transcription_linguistic.xml`.\n\nIn your VS Code terminal, run the validator:\n```bash\npython3 scripts/validate_tei.py src/modules/Module_08_Lemmatization/transcription_linguistic.xml\n```\n\nThe validator checks:\n<ul>\n  <li>Well-formed XML syntax: all tags closed and properly nested.</li>\n  <li>Valid attribute names: <code>lemma</code> and <code>pos</code> on <code>&lt;w&gt;</code> elements.</li>\n  <li>No illegal characters or broken entity references.</li>\n</ul>\n\nFix any validation errors immediately. A valid TEI file is a mandatory requirement for full credit.\n\n**Takeaway:** Always run the schema validator on your TEI file before submission to verify that XML syntax and attributes are well-formed.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Validating Your TEI File Against the Course Schema", "questiontext": "<p>Why must students validate transcription_linguistic.xml with the course schema validator before submission?</p>", "generalfeedback": "<p>Always run the schema validator on your TEI file before submission to verify that XML syntax and attributes are well-formed.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To catch syntax errors, unclosed tags, and invalid attributes that would break downstream digital publishing tools.</p>", "feedback": "<p>Correct. Schema validation guarantees that the XML file strictly conforms to TEI P5 guidelines before deployment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To delete the student's work automatically if any word is misspelled.</p>", "feedback": "<p>Incorrect. Validators check structural and syntactic conformity, not spelling.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because invalid XML files permanently damage computer hardware.</p>", "feedback": "<p>Incorrect. Schema validation ensures data integrity, not physical safety.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prevent other scholars from reading the edition online.</p>", "feedback": "<p>Incorrect. Standards compliance ensures that digital editions remain widely accessible and interoperable.</p>"}]}}, {"step": 27, "title": "Packaging the Submission Portfolio for Moodle", "content": "**Packaging the Submission Portfolio for Moodle**\n\nTo complete your submission, make sure all four project deliverables are committed to your git repository:\n\n<ol>\n  <li><code>LEMMATIZATION_POLICIES.md</code>: Your project's dictionary and tokenization rules.</li>\n  <li><code>tagger_pipeline.py</code>: Your Python script for automated NLP execution.</li>\n  <li><code>transcription_linguistic.xml</code>: Your validated TEI XML fragment with <code>&lt;w&gt;</code> elements.</li>\n  <li><code>LINGUISTIC_AUDIT.md</code>: Your three-way comparative audit table and 300–500 word reflection.</li>\n</ol>\n\nOn Moodle, upload your `transcription_linguistic.xml`. Paste the text of your `linguistic_audit.md` into the online submission box before 11:00 pm tonight.\n\n**Takeaway:** Submit your validated TEI XML file and reflection report to the Moodle assignment portal before 11:00 PM tonight.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Packaging the Submission Portfolio for Moodle", "questiontext": "<p>What files constitute the complete submission package for Assignment: Module 8?</p>", "generalfeedback": "<p>Submit your validated TEI XML file and reflection report to the Moodle assignment portal before 11:00 PM tonight.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The validated TEI linguistic XML file, prompt records/scripts, and LINGUISTIC_AUDIT.md committed to git and uploaded to Moodle.</p>", "feedback": "<p>Correct. The submission portfolio includes the XML edition file, audit documentation, and reproducible pipeline prompts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only a single screenshot of the VS Code interface with no text files.</p>", "feedback": "<p>Incorrect. Full digital edition XML and Markdown audit files must be submitted.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A printed paper copy delivered by postal mail.</p>", "feedback": "<p>Incorrect. Digital Methods assignments are submitted electronically via Moodle.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An audio recording of the student reading the dictionary out loud.</p>", "feedback": "<p>Incorrect. The portfolio requires TEI XML markup and analytical audit documentation.</p>"}]}}, {"step": 28, "title": "Looking Ahead: From Words to Named Entities in Module 9", "content": "**Looking Ahead: From Words to Named Entities in Module 9**\n\nCongratulations on completing Module 8! You have mastered grammatical words, dictionary headwords, and syntactic trees.\n\nNext week, in Module 9, we take the next logical step in digital textual editing: **Named Entity Recognition (NER)**.\n\nGrammar tells us what a word *does* in a sentence (it is a noun, a verb, an adjective). Named entity markup tells us what a word *refers to* in the real world:\n<ul>\n  <li>People: <code>&lt;persName&gt;</code> (Peregrine Thomas Hopson, Maud Lewis, King Louis XVI).</li>\n  <li>Places: <code>&lt;placeName&gt;</code> (Halifax, Nova Scotia, Paris).</li>\n  <li>Organizations: <code>&lt;orgName&gt;</code> (National Assembly, Mi'kmaq Nation).</li>\n</ul>\n\nYour linguistic markup provides the grammatical foundation on which named entity recognition will build.\n\n**Takeaway:** Module 9 will build on your linguistic markup by identifying and encoding named people, places, and historical organizations.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Looking Ahead: From Words to Named Entities in Module 9", "questiontext": "<p>How does Module 8's linguistic markup prepare students for Module 9 (Named Entities)?</p>", "generalfeedback": "<p>Module 9 will build on your linguistic markup by identifying and encoding named people, places, and historical organizations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Identifying proper nouns and grammatical categories provides the essential foundation for extracting and authority-linking historical people and places.</p>", "feedback": "<p>Correct. Morphological analysis distinguishes proper names (PROPN) from common nouns, preparing students to attach Wikidata authority URIs in Module 9.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Module 9 abandons computers completely and returns to pen-and-paper calligraphy.</p>", "feedback": "<p>Incorrect. Module 9 continues the computational pipeline with named entity recognition and authority linking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Named entities have no connection to grammar, vocabulary, or text encoding.</p>", "feedback": "<p>Incorrect. Named entities are linguistic tokens enriched with ontological and historical identifiers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Students will delete all linguistic markup before beginning Module 9.</p>", "feedback": "<p>Incorrect. TEI markup is cumulative; Module 9 builds directly upon the linguistic layer.</p>"}]}}, {"step": 29, "title": "The Digital Textual Scholar's Toolkit", "content": "**The Digital Textual Scholar's Toolkit**\n\nStep back and look at the method you have practiced this week. You did not rely exclusively on human close reading, nor did you blindly surrender your text to an automated algorithm.\n\nYou practiced a three-step critical method:\n<ol>\n  <li><strong>Establish Ground Truth:</strong> Close human philology and authoritative dictionaries set the gold standard.</li>\n  <li><strong>Deploy Deterministic Tools:</strong> Fast rule-based and statistical scripts scale processing across corpora.</li>\n  <li><strong>Evaluate with AI & Audit:</strong> Generative models resolve complex edge cases, while critical human review catches hallucinations.</li>\n</ol>\n\nThis balanced workflow represents the cutting edge of digital humanities scholarship today.\n\n**Takeaway:** True digital scholarship combines human philological ground truth, deterministic scripts, and generative AI under critical human oversight.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: The Digital Textual Scholar's Toolkit", "questiontext": "<p>What fundamental methodological principle underpins the Three-Step Comparative Cycle?</p>", "generalfeedback": "<p>True digital scholarship combines human philological ground truth, deterministic scripts, and generative AI under critical human oversight.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Combining human philological craft, reproducible deterministic scripts, and generative models under critical human oversight.</p>", "feedback": "<p>Correct. The course balances close reading with computational scale, keeping the human editor in command of the workflow.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Relying exclusively on generative chatbots and ignoring historical primary sources.</p>", "feedback": "<p>Incorrect. Uncritical reliance on AI produces hallucinations and modernizing errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Rejecting all computational tools and refusing to digitize historical documents.</p>", "feedback": "<p>Incorrect. Digital methods unlock scale, accessibility, and new analytical insights.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Assuming that computers never make mistakes when processing historical languages.</p>", "feedback": "<p>Incorrect. Automated models reflect modern biases and require continuous empirical auditing.</p>"}]}}, {"step": 30, "title": "Human Judgment in an Era of Linguistic AI", "content": "**Human Judgm
