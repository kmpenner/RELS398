 in Module 9, we take the next logical step in digital textual editing: **Named Entity Recognition (NER)**.\n\nGrammar tells us what a word *does* in a sentence (it is a noun, a verb, an adjective). Named entity markup tells us what a word *refers to* in the real world:\n<ul>\n  <li>People: <code>&lt;persName&gt;</code> (Peregrine Thomas Hopson, Maud Lewis, King Louis XVI).</li>\n  <li>Places: <code>&lt;placeName&gt;</code> (Halifax, Nova Scotia, Paris).</li>\n  <li>Organizations: <code>&lt;orgName&gt;</code> (National Assembly, Mi'kmaq Nation).</li>\n</ul>\n\nYour linguistic markup provides the grammatical foundation on which named entity recognition will build.\n\n**Takeaway:** Module 9 will build on your linguistic markup by identifying and encoding named people, places, and historical organizations.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Human-in-the-Loop Editorial Workflows", "questiontext": "<p>In a modern Human-in-the-Loop (HITL) editorial workflow, what is the function of active learning retraining?</p>", "generalfeedback": "<p>Human-in-the-loop workflows combine automated pre-annotation with expert scholarly review, ensuring computational scalability never compromises philological rigor.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manually corrected annotations are committed to the repository and fed back into fine-tuning pipelines, continuously improving the project's specialized models.</p>", "feedback": "<p>Correct. Active learning creates a virtuous cycle where human corrections continuously improve the accuracy of local neural models on project-specific vocabulary and dialects.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Human editors are trained by automated bots to accept machine errors without question.</p>", "feedback": "<p>Incorrect. Human scholars provide the expert corrections that retrain and improve the machine models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All human edits are deleted at the end of each working day.</p>", "feedback": "<p>Incorrect. Human corrections are version-controlled in Git as permanent scholarly contributions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Active learning converts all historical Greek manuscripts into modern German.</p>", "feedback": "<p>Incorrect. Active learning refines model weights on historical language datasets.</p>"}]}}, {"step": 29, "title": "The Digital Textual Scholar's Toolkit", "content": "**The Digital Textual Scholar's Toolkit**\n\nStep back and look at the method you have practiced this week. You did not rely exclusively on human close reading, nor did you blindly surrender your text to an automated algorithm.\n\nYou practiced a three-step critical method:\n<ol>\n  <li><strong>Establish Ground Truth:</strong> Close human philology and authoritative dictionaries set the gold standard.</li>\n  <li><strong>Deploy Deterministic Tools:</strong> Fast rule-based and statistical scripts scale processing across corpora.</li>\n  <li><strong>Evaluate with AI & Audit:</strong> Generative models resolve complex edge cases, while critical human review catches hallucinations.</li>\n</ol>\n\nThis balanced workflow represents the cutting edge of digital humanities scholarship today.\n\n**Takeaway:** True digital scholarship combines human philological ground truth, deterministic scripts, and generative AI under critical human oversight.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Preparing the Complete Linguistic Layer for Assignment 3", "questiontext": "<p>Before committing Assignment 3 edition files to GitHub, what four validation checks must be executed?</p>", "generalfeedback": "<p>Finalizing Assignment 3 requires validating tokenization, @lemma, @pos, @msd, and normalization markup against project schemas.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verifying tokenization integrity (<w>/<pc>), linguistic attribute completeness (@lemma/@pos/@msd), normalization transparency (@orig/@norm), and schema validation.</p>", "feedback": "<p>Correct. The final checklist ensures structural tokenization, complete UD attributes, transparent normalization markup, and clean schema/Schematron validation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating the text to modern Spanish, converting it to PDF, emailing it to Google, and deleting the Git repo.</p>", "feedback": "<p>Incorrect. Assignment 3 requires validated TEI XML and CoNLL-U files stored in the course Git repository.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all XML tags and replacing them with unformatted text files.</p>", "feedback": "<p>Incorrect. Assignment 3 evaluates structured TEI P5 linguistic markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Encrypting the files with a private password so the instructor cannot grade them.</p>", "feedback": "<p>Incorrect. Assignment 3 files are committed to GitHub for automated grading and peer review.</p>"}]}}, {"step": 30, "title": "Human Judgment in an Era of Linguistic AI", "content": "**Human Judgment in an Era of Linguistic AI**\n\nAs AI models grow more f. Capable, some people wonder if human textual scholarship will become obsolete.\n\nWeek Eight gives you the definitive answer to that question: **absolutely not.**\n\nAn AI model has no historical stake in truth. It will happily alter historical characters, smooth over scribal slip. Invent non-existent latin roots with absolute confidence. It cannot replace the scholar who spent months studying the ink, the pap. The archival context of an eighteenth-century document.\n\nAI models are extraordinary power tools. But power tools require a skilled craftsperson. You are the craftsperson. Your historical knowledge, your philological judgment,. Your commitment to truth are what make digital editions trustworthy. Keep that critical human eye sharp, and enjoy your weekend!\n\n**Takeaway:** AI provides extraordinary speed, but human scholars remain the essential guardians of historical truth and textual integrity.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: Synthesis: The Three-Step Method and the Future of Digital Philology", "questiontext": "<p>How does the Week 8 three-step cycle (Manual -> Deterministic -> AI-Assisted) define the future of digital philology?</p>", "generalfeedback": "<p>The three-step cycle establishes that computational NLP tools amplify, but remain strictly accountable to, human philological expertise.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It proves that computational NLP tools amplify, but remain strictly accountable to, human philological evidence and expert scholarship.</p>", "feedback": "<p>Correct. The three-step method demonstrates that computational automation scales textual analysis while human philological rigor maintains evidentiary integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It demonstrates that computers will soon abolish all human languages in favor of binary machine code.</p>", "feedback": "<p>Incorrect. Computational philology enriches human understanding of historical languages and literature.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It concludes that manual philology is completely useless and should be banned from university curricula.</p>", "feedback": "<p>Incorrect. Manual philology provides the indispensable gold standard for all computational modeling.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves that artificial intelligence models never require testing or evaluation.</p>", "feedback": "<p>Incorrect. Systematic benchmarking against ground truth is the foundational requirement of rigorous digital scholarship.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
