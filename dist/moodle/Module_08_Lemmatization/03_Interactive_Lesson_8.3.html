    <script>
        const lessonData = {"course_title": "AI-Assisted Linguistic Markup, Comparative Audit, and Assignment 8 Synthesis", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "The Third Tier: Prompting Neural Models for Grammar", "content": "**The Third Tier: Prompting Neural Models for Grammar**\n\nWelcome to the final stage of Week Eight. On Tuesday, you parsed and lemmatized twenty words by hand using scholarly dictionaries. That manual work gave you an authoritative ground truth. On Wednesday, you ran deterministic NLP pipelines like TreeTagger and SpaCy. You saw their speed, but you also saw them stumble on Out-of-Vocabulary historical spellings.\n\nToday, we take Step 3 of our three-step cycle: AI models. In VS Code Antigravity, we can prompt AI models to analyze historical grammar.\n\nUnlike deterministic taggers that follow rigid suffix rules, modern language models were trained on billions of words from historical book. Archives. They possess remarkable intuition for archaic vocabulary. However, they bring serious risks, including invented lemmas and unrequested modernizations. Today, you will test an AI model on your text, execute a three-way comparativ. Finalize your linguistic markup assignment.\n\n**Vocabulary.** *Language Model (LLM)*. An AI model trained on vast text datasets that predicts and generates natural language. *Three-Way Comparative Audit* — Comparing annotations across three tiers: manual human craft, deterministic NLP scrip. Generative ai models.\n\n**Takeaway:** Large language models bring powerful intuition to historical language, but their outputs must be audited against manual ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: The Friday Cycle: Benchmarking Generative AI Against Ground Truth", "questiontext": "<p>What is the methodological goal of benchmarking generative AI and neural models against manual ground truth in Topic 8?</p>", "generalfeedback": "<p>The Friday cycle benchmarks neural transformers and LLMs against manual ground truth to quantify parsing precision, recall, and hallucination rates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To establish a rigorous evaluation harness that measures precision, recall, and F1 scores, identifying the boundaries between neural reasoning and morphological hallucination.</p>", "feedback": "<p>Correct. The objective is to quantify model performance objectively against the manual gold standard, exposing exact strengths and error modes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prove that human philologists are unnecessary and can be replaced immediately by unmonitored chatbots.</p>", "feedback": "<p>Incorrect. Human philological ground truth is the indispensable benchmark that makes evaluation possible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To train AI models to generate entirely fictitious historical manuscripts.</p>", "feedback": "<p>Incorrect. Digital philology focuses on accurate representation and analysis of authentic historical texts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To eliminate all computational evaluation metrics in favor of subjective impressions.</p>", "feedback": "<p>Incorrect. The lab builds a quantitative benchmarking harness based on mathematical precision, recall, and F1 metrics.</p>"}]}}, {"step": 2, "title": "How Large Language Models Understand Historical Prose", "content": "**How Large Language Models Understand Historical Prose**\n\nHow can an AI model read eighteenth-century French or archaic legal Eng. A rule-based tool failed? The secret lies in pre-training data.\n\nDeterministic taggers like TreeTagger rely on relatively small, modern dictionaries. If a word like *décrétoit* is missing from its dictionary, the tool fails. By contrast, AI models have ingested millions of digitized historical books, including eighteenth-century F. Colonial treaties.\n\nDuring training, the model learned statistical associations across centuries of language change. It knows that eighteenth-century French authors wrote *-oit* where modern writers use *-ait*. It knows that *shew'd* means *showed*. This broad historical exposure gives neural models a significant advantage over simple lookup. Reading archival prose.\n\n**Vocabulary.** *Pre-Training Data* — The massive collection of digital book. Historical documents used to train a neural language model. *Context Window* — The amount of surrounding text a model considers when analyzing words.\n\n**Takeaway:** Language models succeed on historical prose because their training data includes centuries of digitized historical literature.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: Neural Architectures in Classical Philology: From RNNs to Transformers", "questiontext": "<p>Why are transformer self-attention mechanisms superior to recurrent neural networks (RNNs/Bi-LSTMs) for parsing classical historical languages?</p>", "generalfeedback": "<p>Transformer self-attention mechanisms resolve long-distance hyperbaton by computing direct dependencies between words across entire sentences simultaneously.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Self-attention computes direct dependency scores between all word pairs simultaneously across the entire sentence, easily resolving long-distance hyperbaton.</p>", "feedback": "<p>Correct. Transformers compute token compatibility in parallel regardless of linear distance, avoiding the gradient degradation that causes RNNs to lose long-distance dependencies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Transformers process only one single character at a time and ignore sentence context.</p>", "feedback": "<p>Incorrect. Transformers process whole sentences simultaneously with full bidirectional context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>RNNs are too fast and accurate for historical research purposes.</p>", "feedback": "<p>Incorrect. RNNs struggle with long-distance syntactic dependencies in languages with flexible word order.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Transformers do not require any electricity or computing hardware to run.</p>", "feedback": "<p>Incorrect. Transformers require matrix multiplication hardware (CPUs/GPUs); their advantage is architectural attention modeling.</p>"}]}}, {"step": 3, "title": "Structured Prompt Engineering for Linguistic Markup", "content": "**Structured Prompt Engineering for Linguistic Markup**\n\nWhile an AI model understands historical vocabulary, it will not output TEI XML automatically unless you instruct it with care. In computational editing, we use **structured prompt engineering**.\n\nA structured prompt gives the model three essential things:\n<ol>\n  <li><strong>Role Definition:</strong> Instruct the model to act as an expert computational philologist and TEI encoder.</li>\n  <li><strong>Task Specification:</strong> Instruct the model to tokenize the passage, look up canonical lemmas, and assign Universal Dependencies tags.</li>\n  <li><strong>Output Format:</strong> Explicitly demand valid TEI P5 XML wrapped in <code>&lt;s&gt;</code>, <code>&lt;w&gt;</code>, and <code>&lt;pc&gt;</code> elements.</li>\n</ol>\n\nWithout strict prompt formatting, models tend to produce conversational essays or unformatted markdown tables. A structured prompt forces the model to return clean, machine-readable XML.\n\n**Vocabulary.** *System Prompt* — High-level instructions provided to an AI model that define its p. Required output format. *Structured Output* — Machine-readable output (such as valid XML or JSON) constrained by strict formatting rules.\n\n**Takeaway:** Structured prompts define the model's expert role, specify its linguistic task, and enforce strict TEI XML output formatting.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: Specialized Neural Encoders: GreBERTa and PhilBERTa", "questiontext": "<p>How do specialized neural encoders like GreBERTa and PhilBERTa achieve high-accuracy, deterministic morphological tagging?</p>", "generalfeedback": "<p>Specialized neural encoders like GreBERTa leverage bidirectional masked pre-training on classical corpora to deliver highly accurate, deterministic morphological classification.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They utilize bidirectional transformer encoders pre-trained on classical Greek/Latin corpora and fine-tuned on dependency treebanks to classify tokens from fixed tagsets.</p>", "feedback": "<p>Correct. By training on historical corpora (TLG, Perseus) and fine-tuning on treebanks (AGLDT, PROIEL), encoder models predict UPOS and FEATS without generative hallucinations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They translate ancient texts into modern French before looking up English dictionary definitions.</p>", "feedback": "<p>Incorrect. GreBERTa and PhilBERTa operate directly on ancient Greek and Latin token embeddings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They generate random text completions by sampling from modern social media posts.</p>", "feedback": "<p>Incorrect. These models are encoder-only classifiers trained on curated historical literary corpora.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete all inflected endings and replace them with modern punctuation.</p>", "feedback": "<p>Incorrect. They perform token classification to assign standard UPOS and morphological feature tags.</p>"}]}}, {"step": 4, "title": "Providing the Universal Dependencies Schema in Prompts", "content": "**Providing the Universal Dependencies Schema in Prompts**\n\nNever assume an AI model remembers the exact tags you want. Large models know dozens of different grammar tagsets, from older Penn Treebank tags to French national standards.\n\nTo guarantee consistent output, provide the exact **Universal Dependencies (UD)** tagset directly in your prompt. List the core UPOS tags: `NOUN`, `VERB`, `ADJ`, `ADV`, `PRON`, `DET`, `AUX`, `ADP`, `CCONJ`,. `punct`.\n\nInstruct the model explicitly: *Use only official Universal Dependencies UPOS tags in the pos attribute*. When the model has the allowed tags in its prompt, it will not invent non-standard labels like `PREP` or `ARTICLE`. This keeps the AI output aligned with your Tuesday ground truth and Wednesday NLP benchmark.\n\n**Takeaway:** Including the 17 Universal Dependencies UPOS tags in your prompt prevents the model from inventing non-standard grammatical labels.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Sequence-to-Sequence String Transduction: GreTA and PhilTA", "questiontext": "<p>How do sequence-to-sequence models like GreTA and PhilTA solve the lemmatization of irregular and suppletive verbs?</p>", "generalfeedback": "<p>Sequence-to-sequence transformers like GreTA treat lemmatization as contextual string transduction, decoding canonical dictionary headwords character by character.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They formulate lemmatization as contextual string transduction, decoding canonical dictionary headwords character by character from bidirectional sentence embeddings.</p>", "feedback": "<p>Correct. GreTA uses a T5 encoder-decoder architecture to generate lemmas dynamically at the character level, handling irregular principal parts and ablaut without intermediate POS bottlenecks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They search an unchangeable static lookup table and fail whenever an irregular verb is encountered.</p>", "feedback": "<p>Incorrect. Sequence-to-sequence decoders generate character sequences dynamically, generalizing beyond static tables.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They assign every verb the generic lemma 'verbum'.</p>", "feedback": "<p>Incorrect. GreTA generates precise dictionary headwords (e.g. mapping ἦλθον to ἔρχομαι).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They require human users to type the lemma before they can output the sentence.</p>", "feedback": "<p>Incorrect. GreTA is fully automated and infers lemmas directly from sentence context.</p>"}]}}, {"step": 5, "title": "Enforcing Strict Negative Constraints", "content": "**Enforcing Strict Negative Constraints**\n\nIn prompt engineering, what you forbid is just as important as what you request. These boundaries are called **negative constraints**.\n\nLanguage models are trained to be helpful assistants. When they see historical spelling mistakes or scribal abbreviations, their default instinct is to \"fix\" the text for modern readers. In scholarly editing, this instinct corrupts historical evidence!\n\nInclude these four negative constraints in your prompt:\n<ol>\n  <li><strong>DO NOT alter surface text:</strong> Preserve the exact historical characters, spelling slips, and accents inside the <code>&lt;w&gt;</code> tags.</li>\n  <li><strong>DO NOT invent lemmas:</strong> Use modern canonical dictionary headwords; do not invent archaic lemmas like <em>faisoir</em>.</li>\n  <li><strong>DO NOT drop punctuation:</strong> Enclose every comma, period, and colon in a <code>&lt;pc&gt;</code> tag.</li>\n  <li><strong>DO NOT wrap in markdown fences:</strong> Output raw XML without conversational introductions or explanations.</li>\n</ol>\n\nNegative constraints rein in the model's helpful impulses and enforce scholarly discipline.\n\n**Vocabulary.** *Negative Constraint*. An explicit instruction in a prompt that forbids unwanted model behaviors, such as modernizing spelling or dropping punctuation.\n\n**Takeaway:** Negative constraints prevent AI models from modernizing historical spellings, dropping punctuation, or adding conversational filler.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: State-of-the-Art Latin Parsing: The Cracovia System", "questiontext": "<p>What dual-head architecture enabled the Cracovia system to achieve the top performance (F1 = 0.9627) in the EvaLatin 2022 competition?</p>", "generalfeedback": "<p>The Cracovia system combines XLM-RoBERTa encoders with multi-task fine-tuning on LASLA and UD treebanks to achieve state-of-the-art Latin morphological tagging.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It fine-tuned XLM-RoBERTa with shared representations across two specialized heads: one for coarse UPOS and one for fine-grained FEATS morphosyntactic bundles.</p>", "feedback": "<p>Correct. The Cracovia system shares transformer representations across joint UPOS and FEATS prediction heads, learning mutual grammatical constraints across the LASLA and UD treebanks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It disabled all neural network layers and relied exclusively on a 19th-century printed dictionary.</p>", "feedback": "<p>Incorrect. Cracovia is a state-of-the-art transformer architecture built upon cross-lingual XLM-RoBERTa encoders.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It restricted Latin parsing to simple three-word sentences from elementary school textbooks.</p>", "feedback": "<p>Incorrect. Cracovia was benchmarked on complex classical Latin prose and poetry across 1.7 million LASLA tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaced Latin case categories with modern English word-order rules.</p>", "feedback": "<p>Incorrect. Cracovia explicitly models Latin nominal cases, verbal moods, and agreement features.</p>"}]}}, {"step": 6, "title": "Invented word Modes in Historical Lemmatization", "content": "**Invented word Modes in Historical Lemmatization**\n\nThe greatest danger when using AI in scholarly editing is **invented word**. A inv. A model generates plausible-sounding output that is factually wrong or non-existent.\n\nIn linguistic markup, invented words take specific forms:\n<ul>\n  <li><strong>Invented Lemmas:</strong> The model invents a fake Latin or Old French root word that never existed in any dictionary.</li>\n  <li><strong>Confabulated Meanings:</strong> The model invents an imaginary historical meaning to explain an unusual spelling.</li>\n  <li><strong>Ghost Morphemes:</strong> The model breaks a simple word into non-existent prefixes and suffixes.</li>\n</ul>\n\nBecause language models write with total grammatical confidence, invented words can easily fool unwary editors. Every lemma produced by an AI model must be checked against an authoritative dictionary (OED or TLFi).\n\n**Vocabulary.** *Invented word* — Confidently generated model output that is factually false, ungrounded, or non-existent in reality. *Lexical Verification* — Checking model-generated words against an authoritative reference dictionary.\n\n**Takeaway:** AI models can confidently invent non-existent lemmas; every AI-generated headword must be verified against an authoritative lexicon.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Generalized Large Language Models in Morphological Analysis", "questiontext": "<p>How do generalized Large Language Models (LLMs) differ fundamentally from dedicated neural parsers like GreBERTa or Cracovia?</p>", "generalfeedback": "<p>General-purpose LLMs possess broad emergent philological reasoning, but their probabilistic sampling creates non-deterministic outputs that require systematic validation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>LLMs rely on in-context learning and autoregressive token sampling from massive multilingual pre-training rather than fixed tag classification over formal grammar rules.</p>", "feedback": "<p>Correct. LLMs generate text probabilistically from broad pre-training weights, exhibiting emergent philological reasoning but introducing potential formatting drift and hallucination risks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>LLMs can only process numbers and cannot understand text or language.</p>", "feedback": "<p>Incorrect. LLMs excel at linguistic and semantic tasks due to extensive pre-training.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Dedicated parsers generate conversational explanations, while LLMs output only binary machine code.</p>", "feedback": "<p>Incorrect. LLMs produce natural language explanations; dedicated parsers output structured tagsets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>There are no differences; LLMs and dedicated parsers use identical software and training datasets.</p>", "feedback": "<p>Incorrect. Dedicated parsers are task-specific discriminative models; LLMs are massive generative autoregressive models.</p>"}]}}, {"step": 7, "title": "The Modernizing error Hazard in Historical Linguistics", "content": "**The Modernizing error Hazard in Historical Linguistics**\n\nA subtle form of invented word is **modernizing error**. Modernizing. A model treats a genuine historical feature as an error and silently \"corrects\" it.\n\nIn Andromeda's 1752 Treaty, the scribe wrote *acknowledg'd*. An AI model might silently change the surface text to *acknowledged* inside the `<w>` tag, erasing the historical apostrophe. In Maud Lewis's letters, an informal phrase like *them things* might be silently converted to *those things*.\n\nIn Ace's 1791 decree, an 18th-century verb form like *décrétoit* might be silently changed to *décrétait*. When an editor asks for linguistic markup, they want tags attached to the historical ink, not a modern rewrite. Tracking modernizing errors is one of your main tasks during today's audit.\n\n**Vocabulary.** *Modernizing error* — An autom. A model inappropriately modernizes or standardizes genuine historical language features.\n\n**Takeaway:** Watch out for hypercorrection: AI models often try to smooth away historical spellings, contractions, and scribal quirks.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: The Precision-Recall Paradox in LLM POS Tagging", "questiontext": "<p>What characterizes the 'Precision-Recall Paradox' observed when evaluating zero-shot LLMs on Latin and Greek POS tagging?</p>", "generalfeedback": "<p>LLMs exhibit near-perfect precision but poor recall in zero-shot POS tagging, frequently skipping or dropping ambiguous historical tokens.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>LLMs achieve near-perfect precision (>99%) when asserting tags, but suffer low recall (<89%) because they frequently drop or skip ambiguous tokens.</p>", "feedback": "<p>Correct. Zero-shot LLMs are highly conservative: their predictions are almost always accurate, but they omit difficult or ambiguous historical tokens, reducing overall F1 below dedicated taggers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>LLMs achieve 100% recall on all words but have 0% precision on common nouns.</p>", "feedback": "<p>Incorrect. The paradox is high precision paired with lower recall due to token dropping.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>LLMs execute tag predictions faster than dedicated C-based tools like TreeTagger.</p>", "feedback": "<p>Incorrect. LLM inference is substantially slower and more computationally intensive than local taggers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>LLMs produce identical precision and recall scores regardless of prompt design.</p>", "feedback": "<p>Incorrect. Prompt engineering and few-shot exemplars significantly alter LLM recall and precision balances.</p>"}]}}, {"step": 8, "title": "Handling Out-of-Vocabulary Terms with Generative Context", "content": "**Handling Out-of-Vocabulary Terms with Generative Context**\n\nWhile AI models have risks, they also possess genuine strengths. Their greatest advantage over deterministic taggers is their ability to handle Out-of-Vocabulary historical words.\n\nOn Wednesday, you saw that TreeTagger failed on *décrétoit*. *shew'd* because those exact spellings were missing from its modern dictionary. A AI model does not suffer from this rigid limitation.\n\nBecause the AI model reads the entire sentence, it understands the syntax. It sees that *décrétoit* occupies the finite verb slot following the subject *l'Assemblée*. It recognizes the historical *-oit* suffix as an older imperfect ending. It correctly deduces that the base lemma is *décréter*. Where deterministic tools fail, generative models use context to solve historical puzzles.\n\n**Takeaway:** Generative AI models use full sentence context to deduce correct lemmas for historical spellings that break deterministic taggers.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Zero-Shot vs. Few-Shot In-Context Prompting", "questiontext": "<p>Why does providing few-shot annotated exemplars in an LLM prompt improve morphological tagging performance?</p>", "generalfeedback": "<p>Few-shot prompting with annotated exemplars anchors LLM output to standard tagsets, dramatically improving recall and citation consistency.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Exemplars anchor the model's output distribution, enforcing strict tagset vocabularies, boosting recall on closed-class words, and standardizing dictionary citation forms.</p>", "feedback": "<p>Correct. Few-shot demonstrations constrain the LLM to valid UD tags, prevent invented labels, recover missing particles, and ensure adherence to canonical LSJ/OLD lemma conventions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Exemplars permanently retrain the base weights of the remote cloud model.</p>", "feedback": "<p>Incorrect. In-context learning conditions the active inference context; it does not update base model weights.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Exemplars reduce prompt length and make the API call free of charge.</p>", "feedback": "<p>Incorrect. Adding exemplars increases prompt token count and API cost, but significantly improves accuracy and tagset compliance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Exemplars force the model to respond exclusively in Latin poetry.</p>", "feedback": "<p>Incorrect. Exemplars guide the model to output structured JSON or CoNLL-U annotations.</p>"}]}}, {"step": 9, "title": "Prompting for TEI XML vs JSON Output", "content": "**Prompting for TEI XML vs JSON Output**\n\nWhen designing an AI pipeline, you have two choices for output format: requesting raw TEI XML directly, or requesting structured JSON that you convert to XML with a script.\n\nRequesting TEI XML directly is fast and convenient:\n```xml\n<w lemma=\"promise\" pos=\"VERB\">promis'd</w>\n```\nHowever, models sometimes make small XML syntax errors, such as forgetting a closing tag or omitting quotes around attributes.\n\nRequesting structured JSON is often more robust:\n```json\n{\"token\": \"promis'd\", \"lemma\": \"promise\", \"pos\": \"VERB\"}\n```\nA short Python script can validate the JSON and convert it into valid TEI XML. For today's classroom exercise, prompting directly for clean TEI XML is completely f. Large projects often use the json-to-xml route.\n\n**Takeaway:** Prompting for TEI XML directly is fast for short excerpts; prompting for JSON provides stricter programmatic validation for large texts.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Morphological Hallucination: Mechanisms and Manifestations", "questiontext": "<p>What are the primary drivers of morphological hallucination when LLMs parse ancient historical languages?</p>", "generalfeedback": "<p>Morphological hallucination stems from modern language pre-training bias and analogical regularization of irregular historical paradigms.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Modern language intrusion from pre-training data, false analogical regularization of suppletive verbs, and etymological over-decomposition.</p>", "feedback": "<p>Correct. Hallucination occurs when modern Greek/Romance data overrides ancient forms, when irregular suppletive roots are falsely regularized, or when rare compounds are split fictitiously.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Hardware overheating causing random bit-flips in GPU memory.</p>", "feedback": "<p>Incorrect. Hallucination is a systemic linguistic phenomenon caused by training bias and analogical over-generalization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The total absence of ancient Greek and Latin texts on the internet.</p>", "feedback": "<p>Incorrect. Classical texts are widely digitized; the issue is the overwhelming statistical preponderance of modern language data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Strict adherence to 19th-century German philological dictionaries.</p>", "feedback": "<p>Incorrect. Adherence to authoritative dictionaries prevents hallucinations rather than causing them.</p>"}]}}, {"step": 10, "title": "The Three-Way Comparative Audit: Manual vs NLP vs AI", "content": "**The Three-Way Comparative Audit: Manual vs NLP vs AI**\n\nNow we bring all three stages of Week Eight together in our **Three-Way Comparative Audit**.\n\nOpen three files side by side in VS Code:\n<ol>\n  <li><code>ground_truth_manual.xml</code>: Tuesday's hand-verified philological baseline.</li>\n  <li><code>nlp_baseline.xml</code>: Wednesday's deterministic SpaCy / TreeTagger output.</li>\n  <li><code>ground_truth_ai.xml</code>: Today's AI-generated markup.</li>\n</ol>\n\nBy comparing all three tiers across the exact same twenty-word passage, you can evaluate each technology objectively. Where did all three agree? Where did the deterministic tool fail while the AI succeeded? Where did the AI hallucinate while human scholarship stood firm?\n\n**Takeaway:** The three-way audit compares manual, deterministic, and AI markup side by side, evaluating the strengths and weaknesses of each tier.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Comparative Benchmarks Across Classical Corpora", "questiontext": "<p>According to comparative empirical benchmarks, which parsing architecture is most effective on standardized Classical Attic prose?</p>", "generalfeedback": "<p>Specialized taggers dominate standardized classical prose, while sequence-to-sequence models and LLMs excel on archaic poetry and noisy medieval manuscripts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Fine-tuned neural encoders (Cracovia) and large-lexicon probabilistic models (TreeTagger/Diorisis), which achieve over 96% accuracy at minimal computational cost.</p>", "feedback": "<p>Correct. Standardized prose is parsed near-flawlessly by specialized classical models, making expensive generative LLM inference unnecessary for standard texts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Zero-shot chatbots querying unconstrained consumer web interfaces.</p>", "feedback": "<p>Incorrect. Unconstrained chatbots have lower recall and higher latency compared to dedicated classical parsers on standard prose.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manual transcription using physical typewriters without digital storage.</p>", "feedback": "<p>Incorrect. Digital pipelines achieve massive throughput speed and high accuracy on standard corpora.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Random guessing based on word length.</p>", "feedback": "<p>Incorrect. Structured linguistic models achieve >96% accuracy through formal grammar rules and trained embeddings.</p>"}]}}, {"step": 11, "title": "Taxonomy of Discrepancies: Four Error Categories", "content": "**Taxonomy of Discrepancies: Four Error Categories**\n\nWhen you compare your three files, you will find differences. To analyze them rigorously, classify every discrepancy into one of four standard categories:\n\n<table>\n  <thead>\n    <tr>\n      <th>Category</th>\n      <th>Name</th>\n      <th>Description and Cause</th>\n      <th>Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Category A</strong></td>\n      <td>Human Slip</td>\n      <td>A human error in Tuesday's manual ground truth caused by fatigue or a typo.</td>\n      <td>Human miskeyed lemma as <code>trety</code></td>\n    </tr>\n    <tr>\n      <td><strong>Category B</strong></td>\n      <td>Deterministic Rigid Miss</td>\n      <td>The rule-based NLP tool failed due to an Out-of-Vocabulary historical spelling.</td>\n      <td>SpaCy failed on <code>décrétoit</code> or <code>shew'd</code></td>\n    </tr>\n    <tr>\n      <td><strong>Category C</strong></td>\n      <td>AI Hallucination / Smoothing</td>\n      <td>The AI model modernized spelling, invented a fake lemma, or dropped punctuation.</td>\n      <td>AI altered <code>promis'd</code> to <code>promised</code></td>\n    </tr>\n    <tr>\n      <td><strong>Category D</strong></td>\n      <td>Genuine Crux / Ambiguity</td>\n      <td>The text allows two equally valid grammatical readings; both tiers are defensible.</td>\n      <td>Homograph <code>will</code> as noun vs auxiliary</td>\n    </tr>\n  </tbody>\n</table>\n\nThis taxonomy turns random errors into structured scholarly insights.\n\n**Vocabulary.** *Error Taxonomy*. A formal classification system used to categoriz. Analyze the root causes of computational and human errors.\n\n**Takeaway:** Classify every disagreement into Category A (human slip), B (NLP rigid miss), C (AI hallucination), or D (genuine crux).\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: The Stress Test: Byzantine Epigrams and Unstandardized Orthography", "questiontext": "<p>Why did state-of-the-art classical NLP pipelines suffer a 20–25% accuracy collapse when tested on the Database of Byzantine Book Epigrams (DBBE)?</p>", "generalfeedback": "<p>Unstandardized medieval manuscript transcriptions cause specialized classical taggers to suffer a catastrophic 20–25% accuracy collapse.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The models were trained on standardized classical texts and failed when confronted with unedited scribal transcriptions containing pervasive itacism and phonetic spellings.</p>", "feedback": "<p>Correct. Pre-trained models expect normalized classical orthography; unedited manuscript transcriptions with itacisms cause out-of-vocabulary lookup misses and subword fragmentation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Byzantine book epigrams were written in an unknown non-human language.</p>", "feedback": "<p>Incorrect. The poems are in medieval Greek; the challenge is unstandardized scribal orthography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The DBBE database corrupted the text files with computer viruses.</p>", "feedback": "<p>Incorrect. DBBE is a prestigious academic corpus of authentic medieval manuscript transcriptions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Treebanks are legally prohibited from parsing Byzantine literature.</p>", "feedback": "<p>Incorrect. The collapse is purely algorithmic: classical models fail to generalize to noisy medieval scribal spelling.</p>"}]}}, {"step": 12, "title": "Evaluating Token-Level Accuracy Across All Three Tiers", "content": "**Evaluating Token-Level Accuracy Across All Three Tiers**\n\nTo complete your benchmark, calculate token-level accuracy for both automated tiers against your manual ground truth.\n\nCreate a summary comparison table in your notes:\n\n<table>\n  <thead>\n    <tr>\n      <th>Metric</th>\n      <th>Deterministic NLP (SpaCy / TreeTagger)</th>\n      <th>AI Model (Antigravity / Claude)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Total Tokens Evaluated</td>\n      <td>20</td>\n      <td>20</td>\n    </tr>\n    <tr>\n      <td>Matching UPOS Tags</td>\n      <td>18 / 20 (90%)</td>\n      <td>19 / 20 (95%)</td>\n    </tr>\n    <tr>\n      <td>Matching Lemmas</td>\n      <td>16 / 20 (80%)</td>\n      <td>19 / 20 (95%)</td>\n    </tr>\n    <tr>\n      <td>Overall Token Accuracy</td>\n      <td>80%</td>\n      <td>95%</td>\n    </tr>\n  </tbody>\n</table>\n\nIn most historical documents, the AI model scores higher on lemm. Of its broader vocabulary. It may lose points on punctuation or surface-text alterations.\n\n**Takeaway:** Calculate token-level POS and Lemma accuracy for both automated tiers to see which tool performed best on your document.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Linguistic Noise 1: Itacism and Vowel Mergers", "questiontext": "<p>How does itacistic vowel merger (e.g. scribes writing γινώσκω or γεινώσκω for γιγνώσκω) disrupt transformer-based language models?</p>", "generalfeedback": "<p>Itacism merges six distinct historical vowel spellings into the [i] sound, causing catastrophic lexicon lookup misses and transformer subword fragmentation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It causes subword tokenizers to fragment unfamiliar phonetic spellings into arbitrary subword units, corrupting contextual embeddings and causing lexicon lookup misses.</p>", "feedback": "<p>Correct. Non-standard vowel spellings break subword tokenization (creating fragments like ['##οτ', '##ήσ', '##θι']), destroying the root's semantic representation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the model to shut down and delete the operating system.</p>", "feedback": "<p>Incorrect. Itacism degrades linguistic accuracy; it does not affect operating system integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It makes the transformer believe that all words are Latin adjectives.</p>", "feedback": "<p>Incorrect. The issue is subword fragmentation and lexical mismatch, leading to false POS and lemma predictions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It has zero effect because transformer models ignore vowels entirely.</p>", "feedback": "<p>Incorrect. Transformers process subword tokens derived directly from character strings, making them sensitive to spelling shifts.</p>"}]}}, {"step": 13, "title": "Calculating AI Precision, Recall, and Invented word Rates", "content": "**Calculating AI Precision, Recall, and Invented word Rates**\n\nIn addition to accuracy, calculate the model's **invented word rate** and **modernizing error rate**.\n\nUse these two simple metrics:\n<ul>\n  <li><strong>Hallucination Rate:</strong> (Number of Invented Lemmas / Total Tokens) * 100. In a sound scholarly prompt, this should be 0%.</li>\n  <li><strong>Hypercorrection Rate:</strong> (Number of Altered Surface Words / Total Tokens) * 100. This measures how often the model modernized your historical characters.</li>\n</ul>\n\nIf the model changed *promis'd* to *promised* once in twenty words, its modernizing error rate is 5%. Documenting these rates proves that you are evaluating AI with scientific rigor.\n\n**Takeaway:** Quantify AI risks by calculating hallucination and hypercorrection rates alongside standard precision and recall scores.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Linguistic Noise 2: Omission of Iota Subscript and Diacritics", "questiontext": "<p>Why is the omission of the iota subscript in manuscript transcriptions a critical vector of grammatical error?</p>", "generalfeedback": "<p>Omission of the iota subscript obliterates the morphological boundary between datives, nominatives, subjunctives, and adverbs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It removes the overt graphemic distinction between dative singular nouns and nominative nouns, as well as between subjunctive and indicative verbs.</p>", "feedback": "<p>Correct. Without the subscript iota, dative forms (καρδίᾳ) become identical to nominatives (καρδία), causing automated parsers to systematically misassign case and mood.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents the text from being rendered in digital fonts.</p>", "feedback": "<p>Incorrect. Unicode renders text with or without diacritics; the error is grammatical disambiguation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes all Greek verbs into indeclinable prepositions.</p>", "feedback": "<p>Incorrect. Verbs remain verbs, but mood distinctions (subjunctive vs. indicative) are obscured.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It only affects modern 21st-century texts, never medieval manuscripts.</p>", "feedback": "<p>Incorrect. Omitting the silent iota subscript was standard practice among medieval scribes.</p>"}]}}, {"step": 14, "title": "Testing AI on Andromeda's 1752 Treaty Excerpt", "content": "**Testing AI on Andromeda's 1752 Treaty Excerpt**\n\nLet us look at how an AI model performs on Andromeda's project: the 1752 P. Friendship treaty.\n\nClause: *All Treaties shall be renewed by the Governor*.\n\nHere is the three-way comparison:\n<ul>\n  <li><strong>Manual Ground Truth:</strong> <em>All</em> (DET, all), <em>Treaties</em> (NOUN, treaty), <em>shall</em> (AUX, shall), <em>be</em> (AUX, be), <em>renewed</em> (VERB, renew).</li>\n  <li><strong>Deterministic SpaCy:</strong> Matched all five tokens perfectly (100% accuracy).</li>\n  <li><strong>AI Model:</strong> Matched all five tokens perfectly, and correctly identified that <em>renewed</em> is a passive participle.</li>\n</ul>\n\nOn standard 18th-century legal formulas, both automated tools perform exceptionally well. Disagreements only emerge when archaic contractions like *promis'd* or legal compounds like *whereunto* appear.\n\n**Takeaway:** On standard legal English formulas, both deterministic NLP and AI models achieve near-perfect agreement with human ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Linguistic Noise 3: Uncontracted Dialectal Forms and Archaic Suffixes", "questiontext": "<p>How does Homeric dialectal morphology challenge NLP models trained primarily on Classical Attic prose?</p>", "generalfeedback": "<p>Uncontracted vowels, archaic suffixes, and unaugmented verbs in Homeric Greek cause Attic-trained taggers to misclassify tense, aspect, and nominal case.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Archaic uncontracted vowels (στήθεα), epic case suffixes (-οιο, -φι), and unaugmented verbs (βάλε) violate Attic rules, causing high out-of-vocabulary rates and misclassified tenses.</p>", "feedback": "<p>Correct. Attic models fail on Homeric dialectal variants, frequently misparsing uncontracted substantives as proper names and unaugmented past verbs as imperatives.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Homeric Greek contains no nouns or pronouns.</p>", "feedback": "<p>Incorrect. Homeric Greek has a rich nominal system with distinctive archaic case endings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Attic prose models automatically translate Homeric epic into modern English verse.</p>", "feedback": "<p>Incorrect. Classical Attic models attempt to parse Homeric forms against Attic rules, leading to errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Homeric poetry was composed without vowels.</p>", "feedback": "<p>Incorrect. Homeric Greek is fully vocalic and metrically structured in dactylic hexameter.</p>"}]}}, {"step": 15, "title": "Testing AI on Ace's 1791 French Decree Excerpt", "content": "**Testing AI on Ace's 1791 French Decree Excerpt**\n\nNow let us examine Ace's project: a 1791 French Revolutionary decree containing the archaic verb *décrétoit*.\n\nSentence: *L'Assemblée nationale décrétoit la loi*.\n\nHere is the three-way comparison:\n<ul>\n  <li><strong>Manual Ground Truth:</strong> <em>décrétoit</em> &rarr; lemma <code>décréter</code>, UPOS <code>VERB</code>, Features: Tense=Imp|VerbForm=Fin.</li>\n  <li><strong>Deterministic SpaCy:</strong> <em>décrétoit</em> &rarr; lemma <code>décrétoit</code>, UPOS <code>NOUN</code> (Category B error: OOV suffix failure).</li>\n  <li><strong>AI Model:</strong> <em>décrétoit</em> &rarr; lemma <code>décréter</code>, UPOS <code>VERB</code>, Features: Tense=Imp|VerbForm=Fin (Match!).</li>\n</ul>\n\nLook at that result! SpaCy failed because *-oit* was missing from its modern dictionary. The AI model recognized the 18th-century suffix. Mapped the verb to its proper infinitive *décréter*. This is a clear demonstration of AI's strength on historical morphology.\n\n**Takeaway:** AI models successfully resolve 18th-century French verbal suffixes like *-oit* where deterministic dictionaries fail.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Joint Learning and Auxiliary Objectives for Morphological Robustness", "questiontext": "<p>How does joint multi-task learning (training on lemmatization, POS tagging, and language modeling simultaneously) improve robustness on noisy historical texts?</p>", "generalfeedback": "<p>Joint learning trains neural networks on lemmatization, POS tagging, and language modeling simultaneously, preventing error propagation on noisy texts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It forces the encoder to learn deep semantic and syntactic representations, preventing error propagation where a wrong POS tag permanently locks in an incorrect lemma.</p>", "feedback": "<p>Correct. Manjavacas et al. (2019) showed that adding auxiliary language modeling loss regularizes representations, reducing historical lemmatization errors by over 18%.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It separates every NLP task into an independent silo that never shares data.</p>", "feedback": "<p>Incorrect. Joint learning explicitly shares encoder representations across complementary tasks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes non-standard historical words from the training dataset.</p>", "feedback": "<p>Incorrect. Joint learning improves performance specifically on non-standard, noisy historical datasets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces neural networks with printed paper glossaries.</p>", "feedback": "<p>Incorrect. Joint learning is an advanced neural training strategy for deep encoder-decoder models.</p>"}]}}, {"step": 16, "title": "Testing AI on Maud Lewis's Folk Correspondence Excerpt", "content": "**Testing AI on Maud Lewis's Folk Correspondence Excerpt**\n\nNext, we examine Olyvia's project: Maud Lewis's informal 1967 letter: *I received your letter today*.\n\nHere is the three-way comparison:\n<ul>\n  <li><strong>Manual Ground Truth:</strong> <em>your</em> &rarr; lemma <code>you</code>, UPOS <code>PRON</code>, Feature: Poss=Yes (OED policy).</li>\n  <li><strong>Deterministic SpaCy:</strong> <em>your</em> &rarr; lemma <code>your</code>, UPOS <code>PRON</code> (Lexicographical policy disagreement).</li>\n  <li><strong>AI Model:</strong> <em>your</em> &rarr; lemma <code>you</code>, UPOS <code>PRON</code> (Followed prompt policy!).</li>\n</ul>\n\nBecause our prompt explicitly instructed the AI model to map possessive pronouns to base personal pronouns, the AI followed our project policy. SpaCy could not be reconfigured without editing its internal lexicon. AI prompts offer superior flexibility when enforcing custom project guidelines.\n\n**Takeaway:** AI models easily adopt custom project dictionary policies provided in prompts, outperforming rigid pre-compiled tagger libraries.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Intertextual Citation Detection and the HTRG Filter", "questiontext": "<p>Why does downstream intertextual citation detection rely heavily on accurate low-level POS tagging via the HTRG filter?</p>", "generalfeedback": "<p>Intertextual citation detection relies on the HTRG filter, where minor POS tagging errors cascade into major failures in discovering literary allusions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The HTRG filter retains substantive matches (Noun-Noun, Verb-Verb) and discards functional noise (conjunctions); tagging errors cause false negatives in citation networks.</p>", "feedback": "<p>Correct. As shown by Wittweiler et al. (2024), a 5% drop in POS tagging accuracy causes a >20% collapse in intertextual citation precision by disrupting HTRG filtering.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The HTRG filter requires all quotations to be written in modern English.</p>", "feedback": "<p>Incorrect. The filter identifies historical intertextual text reuse in Greek and Latin.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Intertextual detection only searches for exact 100-character verbatim string matches.</p>", "feedback": "<p>Incorrect. Ancient authors modify syntax and case when citing sources; lemma and POS matching are required.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The HTRG filter automatically deletes the source text from the digital edition.</p>", "feedback": "<p>Incorrect. The filter indexes literary allusions and quotations across texts.</p>"}]}}, {"step": 17, "title": "Adjudicating Disagreements: The Editor as Arbiter", "content": "**Adjudicating Disagreements: The Editor as Arbiter**\n\nAfter completing your three-way audit, you will have a table of disagreements. Now comes the core scholarly duty: **editorial adjudication**.\n\nAn algorithm cannot decide what belongs in your final edition. The human editor is the ultimate arbiter. Go through each discrepancy:\n<ul>\n  <li>If the machine made an error (Category B or C), reject the machine prediction and keep your manual ground truth.</li>\n  <li>If the machine exposed a genuine human slip in your Tuesday table (Category A), gratefully correct your ground truth!</li>\n  <li>If the disagreement is a genuine crux (Category D), select the reading best supported by historical evidence and document your reasons.</li>\n</ul>\n\nThis review process transforms raw machine output into reliable, peer-reviewed scholarship.\n\n**Vocabulary.** *Editorial Adjudication*. The scholarly decision-making p. A human editor resolves conflicting readings and approves the final text.\n\n**Takeaway:** The human editor serves as the ultimate arbiter, adjudicating every machine disagreement before publishing the edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Structured LLM Output Formatting: JSON and Pydantic Schemas", "questiontext": "<p>Why is enforcing structured JSON generation via Pydantic schemas essential when deploying LLMs in digital editorial pipelines?</p>", "generalfeedback": "<p>Constraining LLM generation with Pydantic schemas guarantees type safety, strict tagset compliance, and direct serialization into downstream pipelines.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It guarantees type safety, constrains tags to valid Universal Dependencies vocabularies, eliminates conversational preamble, and enables automatic exception retries.</p>", "feedback": "<p>Correct. Pydantic schemas enforce strict data validation, preventing invented tags and allowing direct programmatic serialization into TEI XML or CoNLL-U.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows the LLM to format its response as an unformatted stream of conversational chat.</p>", "feedback": "<p>Incorrect. Schemas prevent unstructured chat preamble, enforcing clean, machine-actionable JSON.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It disables all security protections on the database server.</p>", "feedback": "<p>Incorrect. Schema validation improves software robustness and data integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It makes the LLM run without using any computer memory.</p>", "feedback": "<p>Incorrect. Schemas structure the output format; they do not eliminate computational memory usage.</p>"}]}}, {"step": 18, "title": "Synthesizing the Final Linguistic XML: `transcription_linguistic.xml`", "content": "**Synthesizing the Final Linguistic XML: `transcription_linguistic.xml`**\n\nWith all disagreements adjudicated, you are ready to produce your official deliverable: `transcription_linguistic.xml`.\n\nThis file merges the verified readings into your complete project TEI document. Every word token in your 20-word excerpt is wrapped in a `<w>` tag with verified `@lemma`. `@pos` attributes. Punctuation is enclosed in `<pc>`. Sentences are enclosed in `<s>`.\n\nCheck that your file is well-formed XML:\n<ul>\n  <li>Every open tag has a matching closing tag.</li>\n  <li>Attribute values are enclosed in quotes.</li>\n  <li>The XML tree nests cleanly without overlapping boundaries.</li>\n</ul>\n\nThis file represents the definitive linguistic layer of your digital edition.\n\n**Takeaway:** Combine your adjudicated readings into `transcription_linguistic.xml`, verifying clean XML syntax and well-formed tags.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Serializing AI Annotations to TEI P5 XML", "questiontext": "<p>How are AI-generated linguistic annotations serialized into standard TEI P5 Chapter 18 XML?</p>", "generalfeedback": "<p>TEI P5 att.linguistic attributes (@lemma, @pos, @msd) serialize computational NLP outputs directly onto <w> word tokens.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By populating @lemma, @pos, and @msd attributes from the att.linguistic class directly onto inline <w> word elements and <pc> punctuation elements.</p>", "feedback": "<p>Correct. TEI Chapter 18 attaches @lemma, @pos (UPOS), and @msd (FEATS) directly to <w> tokens, maintaining full separation between text nodes and analytical metadata.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By pasting screenshot images of the LLM chat window into the XML body.</p>", "feedback": "<p>Incorrect. Annotations are encoded as structured XML attributes on text elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By converting the entire document into an unformatted CSV spreadsheet.</p>", "feedback": "<p>Incorrect. The standard format for archival digital scholarly editions is TEI P5 XML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the Latin/Greek text and inserting machine-translated English paragraphs.</p>", "feedback": "<p>Incorrect. Scholarly editions preserve the diplomatic historical text and enrich it with linguistic attributes.</p>"}]}}, {"step": 19, "title": "Transparent Metadata Attribution with `@resp`", "content": "**Transparent Metadata Attribution with `@resp`**\n\nIn digital scholarly editions, transparency is paramount. R. Researchers must know who produced each annotation: a human scholar, a deterministic script, or an ai model.\n\nTEI P5 provides the `@resp` (responsibility) attribute for this exact purpose. In your `teiHeader`, define your agents:\n```xml\n<respStmt>\n  <resp>Manual annotation</resp>\n  <name xml:id=\"editor\">Ken Penner</name>\n</respStmt>\n<respStmt>\n  <resp>Deterministic NLP pipeline</resp>\n  <name xml:id=\"spacy\">SpaCy 3.7 (en_core_web_sm)</name>\n</respStmt>\n<respStmt>\n  <resp>AI-assisted parsing</resp>\n  <name xml:id=\"claude\">Claude 3.5 Sonnet / Antigravity</name>\n</respStmt>\n```\n\nOn your `<w>` elements, you can cite who verified the tag: `<w lemma=\"renew\" pos=\"VERB\" resp=\"#editor\">`. Transparent attribution ensures full academic integrity.\n\n**Vocabulary.** *`@resp`*. The tei attribute that indicates who is responsible for a specific editorial decision, correction, or markup layer.\n\n**Takeaway:** Use the TEI `@resp` attribute and header statements to document whether annotations came from human editors, scripts, or AI models.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Managing Normalization in TEI XML: att.lexicographic.normalized", "questiontext": "<p>How does a digital edition preserve manuscript itacisms while providing normalized strings for NLP search engines in TEI XML?</p>", "generalfeedback": "<p>The att.lexicographic.normalized class (@orig and @norm) preserves manuscript diplomatic spelling while supplying normalized forms for NLP parsers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By encoding the raw manuscript reading in @orig (or <orig>) and the regularized classical form in @norm (or <reg>) on the <w> element.</p>", "feedback": "<p>Correct. Using att.lexicographic.normalized (@orig and @norm) satisfies paleographical fidelity for humanists and computational normalization for search and NLP tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By silently correcting manuscript errors without documenting the original reading anywhere.</p>", "feedback": "<p>Incorrect. Silent correction destroys valuable paleographical and historical phonological evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By publishing two completely separate editions under different ISBN numbers.</p>", "feedback": "<p>Incorrect. TEI embeds both diplomatic and normalized layers in the same XML element structure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By forbidding researchers from querying normalized lemmas.</p>", "feedback": "<p>Incorrect. The dual-layer encoding is designed specifically to enable lemma and normalized queries.</p>"}]}}, {"step": 20, "title": "Combining All Layers: The Complete TEI Architecture", "content": "**Combining All Layers: The Complete TEI Architecture**\n\nTake a moment to admire what your TEI document now contains. Over eight weeks, you have built a deeply layered digital monument:\n\n<ol>\n  <li><strong>Metadata Layer:</strong> The <code>teiHeader</code> catalogues author, date, archive, license, and project policies.</li>\n  <li><strong>Image Layer:</strong> The <code>&lt;facsimile&gt;</code> container links high-resolution image manifests directly to text surfaces.</li>\n  <li><strong>Diplomatic Layer:</strong> The transcribed text preserves original ink, scribal lineation (<code>&lt;lb/&gt;</code>), and historical characters.</li>\n  <li><strong>Regularization Layer:</strong> The <code>&lt;choice&gt;</code> elements pair original spellings (<code>&lt;orig&gt;</code>) with modernized readings (<code>&lt;reg&gt;</code>).</li>\n  <li><strong>Linguistic Layer:</strong> The <code>&lt;w&gt;</code> and <code>&lt;s&gt;</code> elements record dictionary lemmas, parts of speech, and syntactic features.</li>\n</ol>\n\nAll five layers coexist in a single well-formed XML file. This is the true power of the Text Encoding Initiative.\n\n**Takeaway:** Your final TEI file unifies metadata, images, diplomatic text, normalized readings, and linguistic grammar in a single standards-compliant document.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Representing Ambiguity: Inline Attributes vs. Feature Structures", "questiontext": "<p>When an ancient word sustains multiple disputed grammatical interpretations among scholars, why are TEI Feature Structures (<fs>, <f>, <vAlt>) preferred over inline attributes?</p>", "generalfeedback": "<p>Stand-off TEI Feature Structures (<fs>, <f>, <vAlt>) represent complex, disputed morphological ambiguities without flattening scholarly debate.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Feature structures can represent multi-layered, competing analyses with explicit attribution to specific scholarly editions using <vAlt>, avoiding reductive over-simplification.</p>", "feedback": "<p>Correct. While inline attributes store only a single value, stand-off Feature Structures with <vAlt> model multi-vocal scholarly debate and competing grammatical analyses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inline attributes are illegal under XML syntax rules.</p>", "feedback": "<p>Incorrect. Inline attributes are fully valid, but they cannot represent competing alternative analyses without flattening ambiguity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Feature structures automatically translate the entire document into German.</p>", "feedback": "<p>Incorrect. Feature structures provide a formal XML mechanism for complex linguistic and scholarly metadata.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Feature structures delete all manuscript variant readings from the edition.</p>", "feedback": "<p>Incorrect. Feature structures enrich the edition by modeling complex, multi-layered scholarly variants.</p>"}]}}, {"step": 21, "title": "Building Syntactic Dependency Trees with AI", "content": "**Building Syntactic Dependency Trees with AI**\n\nIn addition to parts of speech, you can prompt modern AI models to generate complete Universal Dependencies syntax trees in CoNLL-U format.\n\nIn your prompt, instruct the model: *For each word, identify its governing head ID. Its deprel relation tag*. The model will output the full 10-column table, identifying the root v. Linking subjects, obj. Modifiers.\n\nWhen evaluating AI syntax trees, check for **cycle errors**. In a valid dependency tree, no word can depend on itself. Arrows must never form closed loops. The tree must form a clean hierarchy descending from the central root verb.\n\n**Vocabulary.** *Treebank* — A text corpus annotated with complete syntactic dependency or phrase-structure trees. *Cycle Error*. An invalid syntactic grap. Dependency links form an infinite closed loop rather than a rooted tree.\n\n**Takeaway:** AI models can predict complete syntactic dependency trees, but editors must audit them to ensure clean hierarchies without cycle errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Designing a Python Benchmarking Harness", "questiontext": "<p>What three evaluation constraints must an automated Python benchmarking harness enforce when scoring AI predictions against a manual gold standard?</p>", "generalfeedback": "<p>An automated Python benchmarking harness aligns predictions against gold-standard IDs to calculate rigorous lemma, POS, and strict accuracy metrics.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Token alignment by unique ID, Unicode NFC normalization, and multi-level scoring (lemma, UPOS, and strict exact match).</p>", "feedback": "<p>Correct. The harness must link predictions via unique @xml:id anchors, normalize Unicode polytonic characters to NFC, and calculate granular accuracy metrics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all mismatching tokens, disabling error logging, and assuming 100% precision.</p>", "feedback": "<p>Incorrect. A rigorous harness records all discrepancies and penalizes dropped tokens as recall errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Evaluating only the title of the document while ignoring all sentence tokens.</p>", "feedback": "<p>Incorrect. The harness evaluates every token in the passage across all morphological dimensions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Allowing the AI model to grade its own output without human reference keys.</p>", "feedback": "<p>Incorrect. Scoring must be performed deterministically against the locked manual gold standard.</p>"}]}}, {"step": 22, "title": "Auditing AI Dependency Trees Against Ground Truth", "content": "**Auditing AI Dependency Trees Against Ground Truth**\n\nAuditing a syntax tree is straightforward when you follow the grammatical flow of the sentence.\n\nAsk these four structural questions:\n<ol>\n  <li><strong>Root Check:</strong> Did the model assign <code>root</code> to the main finite verb or participle?</li>\n  <li><strong>Subject Check:</strong> Does the nominal subject (<code>nsubj</code>) point directly to the root verb?</li>\n  <li><strong>Object Check:</strong> Does the direct object (<code>obj</code>) attach to its governing transitive verb?</li>\n  <li><strong>Preposition Check:</strong> Do prepositions attach to their noun objects with relation <code>case</code>?</li>\n</ol>\n\nIf the model attaches an adverbial clause to the wrong noun, correct the head ID. Auditing syntax trees sharpens your understanding of how historical authors constructed arguments.\n\n**Takeaway:** Audit AI dependency trees by verifying root verbs, subject links, direct objects, and prepositional attachments.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Evaluation Metrics: Accuracy, Precision, Recall, and Macro-F1", "questiontext": "<p>Why is Macro-averaged F1 more revealing than Micro-averaged accuracy when evaluating historical language taggers?</p>", "generalfeedback": "<p>Macro-averaged F1 weights rare and frequent grammatical categories equally, exposing model blind spots on sparse historical morphology.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Macro-F1 assigns equal weight to rare and frequent categories, exposing model blind spots on sparse historical morphology (such as optatives or duals).</p>", "feedback": "<p>Correct. Micro-accuracy is dominated by high-frequency nouns and verbs; Macro-F1 weights all grammatical classes equally, preventing rare category failures from being masked.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Macro-F1 can only be calculated on modern newspaper corpora.</p>", "feedback": "<p>Incorrect. Macro-F1 is a universal metric essential for evaluating imbalanced historical tagsets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Micro-accuracy is illegal under international statistical guidelines.</p>", "feedback": "<p>Incorrect. Both metrics are valid, but Macro-F1 is more diagnostic for sparse and imbalanced classes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Macro-F1 always returns a score of 100% regardless of model performance.</p>", "feedback": "<p>Incorrect. Macro-F1 penalizes models severely when they fail on low-frequency grammatical categories.</p>"}]}}, {"step": 23, "title": "The Reflection Report: Analyzing Linguistic Bottlenecks", "content": "**The Reflection Report: Analyzing Linguistic Bottlenecks**\n\nFor tonight's Assignment 8 submission, you will write a **300–500 word critical reflection** analyzing your findings.\n\nYour reflection should not simply restate your tables. It should answer these scholarly questions:\n<ul>\n  <li>Which morphological categories caused the highest failure rate in the automated tools?</li>\n  <li>Why did deterministic taggers stumble on historical spellings, while the AI model handled them?</li>\n  <li>Did the AI model introduce any subtle hypercorrections or hallucinated lemmas?</li>\n  <li>How did Module 6 spelling normalizations help bridge the gap between historical ink and modern algorithms?</li>\n</ul>\n\nA strong reflection connects technical error rates to broader philological and historical principles.\n\n**Takeaway:** Your 300–500 word reflection should analyze why specific grammatical categories failed and discuss the trade-offs of automation.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Qualitative Error Analysis: Categorizing AI Failure Modes", "questiontext": "<p>In qualitative error analysis, what is the significance of distinguishing 'Level 1 (Minor)' errors from 'Level 4 (Fatal)' errors?</p>", "generalfeedback": "<p>Qualitative error analysis categorizes failure modes across stem confusion, diacritic blindness, clitic errors, and lexical hallucination.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Level 1 errors (accents/breathings) can be fixed by automated Unicode normalization, while Level 4 errors (hallucinated headwords) corrupt concordances and require lexicon filter gates.</p>", "feedback": "<p>Correct. Categorizing error severity allows editors to apply automated pre/post-processing fixes to minor errors while deploying strict validation gates against fatal hallucinations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Level 1 errors cause computers to crash, while Level 4 errors have no impact.</p>", "feedback": "<p>Incorrect. Level 1 errors are minor orthographic variations; Level 4 errors are fatal corruptions of lexical data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Level 4 errors are automatically corrected by typing on the keyboard.</p>", "feedback": "<p>Incorrect. Level 4 errors require architectural mitigations like lexicon verification gates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All errors have identical severity and should be ignored equally.</p>", "feedback": "<p>Incorrect. Distinguishing error severity is the foundation of targeted engineering and workflow design.</p>"}]}}, {"step": 24, "title": "Documenting the Three-Way Audit in `LINGUISTIC_AUDIT.md`", "content": "**Documenting the Three-Way Audit in `LINGUISTIC_AUDIT.md`**\n\nTo keep your work organized, assemble y. Reflection inside `linguistic_audit.md` in your repository root.\n\nYour audit report should contain four clear sections:\n<ol>\n  <li><strong>Master Comparison Table:</strong> A 20-row table comparing Token, Manual Parse, NLP Parse, and AI Parse.</li>\n  <li><strong>Accuracy Scorecard:</strong> Numerical accuracy percentages, precision, recall, and hallucination rates.</li>\n  <li><strong>Discrepancy Taxonomy:</strong> An analysis sorting disagreements into Categories A, B, C, and D.</li>\n  <li><strong>Critical Reflection:</strong> Your 300–500 word discussion of algorithmic strengths and limitations.</li>\n</ol>\n\nThis report serves as the primary scholarly text that K. Evaluate for your assignment grade.\n\n**Takeaway:** Compile your master comparison table, scorecard, discrepancy taxonomy, and reflection in `LINGUISTIC_AUDIT.md`.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: In-Context Paradigm Injection: The LingoLLM Approach", "questiontext": "<p>How does in-context paradigm injection (LingoLLM) reduce LLM morphological hallucination on irregular verbs from 14.8% down to 0.4%?</p>", "generalfeedback": "<p>In-context paradigm injection supplies explicit grammatical rules in prompts, reducing irregular verb hallucination below 0.5%.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By injecting explicit grammatical descriptions and paradigm tables from authoritative grammars directly into the prompt context.</p>", "feedback": "<p>Correct. Zhang et al. (2024) demonstrated that supplying explicit paradigm rules transforms LLM generation from unconstrained sampling into constraint-guided deduction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting all irregular verbs from the historical text.</p>", "feedback": "<p>Incorrect. Paradigm injection parses authentic irregular forms accurately by supplying their grammatical rules in context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By reducing the size of the computer memory by 90%.</p>", "feedback": "<p>Incorrect. Paradigm injection is a prompt engineering methodology, not a hardware modification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By forcing the LLM to translate the text into Spanish.</p>", "feedback": "<p>Incorrect. The model performs ancient morphological parsing guided by explicit grammatical constraints.</p>"}]}}, {"step": 25, "title": "Finalizing Assignment: Module 8 (Linguistic Markup)", "content": "**Finalizing Assignment: Module 8 (Linguistic Markup)**\n\nTonight at 11:00 PM, **Assignment: Module 8 (Linguistic Markup)** is due on Moodle. Let us review the grading. You know exactly how your work will be evaluated:\n\n<ul>\n  <li><strong>Manual Ground Truth Precision (4 pts / 40%):</strong> Your 20-word manual parse accurately identifies canonical dictionary lemmas and inflectional features without grammatical errors.</li>\n  <li><strong>TEI Linguistic Markup Validity (3 pts / 30%):</strong> Your XML cleanly wraps tokens in <code>&lt;w&gt;</code> and <code>&lt;pc&gt;</code> elements with valid <code>lemma=</code> and <code>pos=</code> attributes conforming to TEI P5.</li>\n  <li><strong>Comparative Error Analysis (3 pts / 30%):</strong> Your reflection insightfully discusses why automated engines struggle with homographs, historical spellings, or rare irregular conjugations.</li>\n</ul>\n\nTotal grade: 10 points (scaled to 80 points in the Moodle gradebook). Meeting these three standards ensures full marks.\n\n**Takeaway:** Assignment 8 is graded on manual precision (4 pts), TEI XML validity (3 pts), and comparative error analysis (3 pts).\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Multi-Engine Ensemble and Consensus Tagging", "questiontext": "<p>How does a multi-engine ensemble pipeline handle tokens where finite-state transducers, neural models, and LLMs produce conflicting analyses?</p>", "generalfeedback": "<p>Multi-engine ensemble pipelines combine FSTs, neural transformers, and LLMs, automating unanimous tokens while routing disagreements to human scholars.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It arbitrates via majority consensus for high-confidence cases and flags low-confidence disagreements with <?review-needed?> for human scholarly adjudication.</p>", "feedback": "<p>Correct. Ensemble pipelines automate unanimous predictions (over 92% of tokens) while routing difficult cruxes directly to the editor's review queue.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the entire sentence containing the conflict from the digital edition.</p>", "feedback": "<p>Incorrect. Disputed tokens are preserved and flagged for human scholarly review.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It crashes the server and halts all processing permanently.</p>", "feedback": "<p>Incorrect. The arbitration engine handles conflicts gracefully using deterministic routing rules.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It selects whichever parse contains the longest English word.</p>", "feedback": "<p>Incorrect. Arbitration uses structured consensus logic and confidence thresholds.</p>"}]}}, {"step": 26, "title": "Validating Your TEI File Against the Course Schema", "content": "**Validating Your TEI File Against the Course Schema**\n\nBefore submitting your assignment, you must run the course schema validator on `transcription_linguistic.xml`.\n\nIn your VS Code terminal, run the validator:\n```bash\npython3 scripts/validate_tei.py src/modules/Module_08_Lemmatization/transcription_linguistic.xml\n```\n\nThe validator checks:\n<ul>\n  <li>Well-formed XML syntax: all tags closed and properly nested.</li>\n  <li>Valid attribute names: <code>lemma</code> and <code>pos</code> on <code>&lt;w&gt;</code> elements.</li>\n  <li>No illegal characters or broken entity references.</li>\n</ul>\n\nFix any validation errors immediately. A valid TEI file is a mandatory requirement for full credit.\n\n**Takeaway:** Always run the schema validator on your TEI file before submission to verify that XML syntax and attributes are well-formed.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: The Alternative Annotator Test and LLM-in-the-Loop Arbitration", "questiontext": "<p>Why is deploying an LLM as an arbiter at points of parser disagreement more cost-effective than running the LLM over the entire corpus?</p>", "generalfeedback": "<p>The Alternative Annotator Test deploys LLMs as targeted arbiters on conflicting parser outputs, maximizing accuracy while minimizing computational costs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It reserves expensive, high-latency LLM API calls strictly for the 5–8% of ambiguous conflict tokens, reducing computational costs by over 90%.</p>", "feedback": "<p>Correct. Running fast local parsers for routine text and deploying LLMs only for difficult conflicts maximizes accuracy while minimizing API costs and latency.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because LLMs refuse to process more than ten words per day.</p>", "feedback": "<p>Incorrect. LLMs can process large volumes, but commercial API costs and latency scale linearly with token volume.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because deterministic parsers are illegal to run on personal computers.</p>", "feedback": "<p>Incorrect. Local parsers (TreeTagger, Morpheus, LatinCy) are free, open-source, and highly efficient.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because LLM arbitration eliminates the need for human editors entirely.</p>", "feedback": "<p>Incorrect. LLM arbitration handles routine parser disagreements; complex editorial cruxes still involve human scholars.</p>"}]}}, {"step": 27, "title": "Packaging the Submission Portfolio for Moodle", "content": "**Packaging the Submission Portfolio for Moodle**\n\nTo complete your submission, make sure all four project deliverables are committed to your git repository:\n\n<ol>\n  <li><code>LEMMATIZATION_POLICIES.md</code>: Your project's dictionary and tokenization rules.</li>\n  <li><code>tagger_pipeline.py</code>: Your Python script for automated NLP execution.</li>\n  <li><code>transcription_linguistic.xml</code>: Your validated TEI XML fragment with <code>&lt;w&gt;</code> elements.</li>\n  <li><code>LINGUISTIC_AUDIT.md</code>: Your three-way comparative audit table and 300–500 word reflection.</li>\n</ol>\n\nOn Moodle, upload your `transcription_linguistic.xml`. Paste the text of your `linguistic_audit.md` into the online submission box before 11:00 pm tonight.\n\n**Takeaway:** Submit your validated TEI XML file and reflection report to the Moodle assignment portal before 11:00 PM tonight.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Cost, Latency, and Carbon Footprint in Computational Philology", "questiontext": "<p>Under the 'Minimal Computing' paradigm in digital humanities, what is the recommended architecture for large-scale corpus annotation?</p>", "generalfeedback": "<p>Minimal computing mandates using fast local models for bulk annotation, reserving costly cloud LLMs for targeted edge cases.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Deploy fast, local, open-source neural and probabilistic taggers for bulk processing, reserving commercial cloud LLMs for targeted edge cases.</p>", "feedback": "<p>Correct. Minimal computing emphasizes energy efficiency, local software sovereignty, and low cost, avoiding unnecessary reliance on expensive cloud APIs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Send all 50 million words of a corpus through commercial cloud APIs regardless of cost or carbon footprint.</p>", "feedback": "<p>Incorrect. This approach is financially unsustainable and introduces fragile dependencies on external proprietary vendors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Refuse to use any computers and print all editions by hand on wooden presses.</p>", "feedback": "<p>Incorrect. Minimal computing uses open-source digital tools efficiently rather than rejecting computation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete all digital corpora after five days to save cloud storage space.</p>", "feedback": "<p>Incorrect. Digital preservation requires durable, locally sustainable data formats (TEI XML, Git).</p>"}]}}, {"step": 28, "title": "Looking Ahead: From Words to Named Entities in Module 9", "content": "**Looking Ahead: From Words to Named Entities in Module 9**\n\nCongratulations on completing Module 8! You have mastered grammatical words, dictionary headwords, and syntactic trees.\n\nNext week,
