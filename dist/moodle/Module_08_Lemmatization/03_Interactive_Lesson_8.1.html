 manual ground-truth table be used in Wednesday's Lesson 8.2?</p>", "generalfeedback": "<p>Today's manual ground truth is the benchmark you will use to evaluate automated tools on Wednesday and Friday.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It will serve as the trusted benchmark against which the output of automated NLP taggers will be evaluated.</p>", "feedback": "<p>Correct. Wednesday's computational tagger output will be scored against today's manual ground truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It will be deleted before Wednesday's class begins.</p>", "feedback": "<p>Incorrect. The manual ground truth is the reference standard for the entire module.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It will be converted into a printed poster for library decoration.</p>", "feedback": "<p>Incorrect. The table is an active computational testing asset.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It will be submitted directly to a journal for publication without testing.</p>", "feedback": "<p>Incorrect. The table forms Step 1 of our three-step comparative cycle.</p>"}]}}, {"step": 30, "title": "The Scholar as the Ground Truth", "content": "**The Scholar as the Ground Truth**\n\nComputers make linguistic tagging fast. Modern programs can process thousands of words in a few seconds. Yet all of that automation depends on human scholarship.\n\nA computer does not understand the meaning of a 1791 French Revolutionary decree. It does not feel the personal warmth in Maud Lewis's letters, nor the legal weight of the 1752 Treaty. It simply follows statistical patterns learned from modern text. When an algorithm runs into old spelling or unusual grammar, it often breaks down.\n\nThe human editor remains the essential foundation of the digital edition. By looking up lemmas, tagging parts of speech, and encoding them in TEI XML, you create the trusted ground truth that computers cannot produce alone. Today you laid that foundation; tomorrow you will put automated tools to the test against it.\n\n**Takeaway:** Computers process text quickly, but only human editors possess the historical knowledge to create true ground-truth data.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: The Scholar as the Ground Truth", "questiontext": "<p>Why does computational linguistic analysis in digital humanities ultimately depend on human expertise?</p>", "generalfeedback": "<p>Computers process text quickly, but only human editors possess the historical knowledge to create true ground-truth data.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because algorithms rely on statistical patterns from modern data, while human scholars understand historical language and context.</p>", "feedback": "<p>Correct. Human editors provide the historical and linguistic knowledge that machines cannot invent.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computers are incapable of processing text files.</p>", "feedback": "<p>Incorrect. Computers process text with tremendous speed, but lack historical understanding.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because human scholars can memorize every word in all world languages.</p>", "feedback": "<p>Incorrect. Scholars rely on dictionaries and critical analysis, not superhuman memory.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because university policies forbid computers from connecting to the internet.</p>", "feedback": "<p>Incorrect. Digital humanities actively leverages modern computational tools guided by human expertise.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
