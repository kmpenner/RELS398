    <script>
        const lessonData = {"course_title": "Manual Grammatical Parsing, Lemmatization, and TEI Linguistic Markup", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "Words Beyond Strings: Why Editions Need Linguistic Markup", "content": "**Words Beyond Strings: Why Editions Need Linguistic Markup**\n\nOver the past seven weeks, you built a real digital edition from scratch. You catalogued your primary witness in a `teiHeader`. You linked high-resolution images with `<facsimile>`. You transcribed every line as written. You reconciled your readings against an AI pass. In Module 6, you regularized historical spelling variations using `<choice>`. Last week, in Module 7, you wrote stylesheets to turn those markup layers into clean reading views.\n\nThroughout all those steps, your computer treated your text as a string of letters. String searches can find exact words. However, a search cannot understand grammar. A computer cannot deduce that *treaties*, *treaty*, and *treaty's* belong to the same word family. It cannot tell whether *left* in Maud Lewis's letter means a direction or the past tense of *leave*. In Ace's 1791 French decree, a search for *décrète* misses *décrété* or *décrétèrent* unless an editor connects them.\n\nLinguistic markup solves this problem. It adds parts of speech, dictionary headwords, and grammatical details to your text. This turns a simple transcript into a powerful research database. Scholars can search for all past-tense verbs or all adjectives that modify a legal title. Today, you will build this grammatical ground truth by hand.\n\n**Vocabulary.** *Linguistic Markup* — Adding grammatical labels and dictionary forms to words in an electronic text. *String Search* — Searching text strictly for matching characters without understanding grammar.\n\n**Takeaway:** String searches only find exact character matches; linguistic markup reveals the grammar and word families beneath the text.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: Words Beyond Strings: Why Editions Need Linguistic Markup", "questiontext": "<p>Why does digital textual scholarship require linguistic markup rather than relying exclusively on exact character string searches?</p>", "generalfeedback": "<p>String searches only find exact character matches; linguistic markup reveals the grammar and word families beneath the text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>String searches cannot connect different inflected word forms to their shared dictionary headword or identify parts of speech.</p>", "feedback": "<p>Correct. Simple character matching leaves grammatical relationships and word families hidden; linguistic markup records grammar and lemmas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>String searches require supercomputers and are too slow to run on modern laptops.</p>", "feedback": "<p>Incorrect. String matching is fast and computationally simple, but it is blind to grammar.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digital editions are forbidden by TEI guidelines from storing plain character text.</p>", "feedback": "<p>Incorrect. TEI easily accommodates plain text; linguistic markup is an analytical enrichment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Optical character recognition software cannot read printed books without parts of speech.</p>", "feedback": "<p>Incorrect. OCR extracts characters from images; linguistic analysis happens downstream.</p>"}]}}, {"step": 2, "title": "Tokens, Surface Forms, and Dictionary Lemmas", "content": "**Tokens, Surface Forms, and Dictionary Lemmas**\n\nTo study text with computers, you must know three basic terms: token, surface form, and lemma.\n\nA **token** is a single instance of a word or punctuation mark in your text. If the word *the* appears fifty times on a manuscript page, it counts as fifty tokens.\n\nA **surface form** is the exact spelling of that token on the historical page. In Andromeda's 1752 Treaty, the surface form might be *promis'd* or *acknowledg'd*. In Ace's 1791 decree, it might be *décrété* or the older spelling *décrétoit*. Surface forms preserve every scribal quirk, ink blot, and historical spelling.\n\nA **lemma** is the base headword you look up in a dictionary. For *promis'd*, *promises*, and *promising*, the English lemma is the base verb *promise*. For *treaties*, the lemma is *treaty*. In French, verbs are listed under their infinitive form (*décréter*). Nouns are listed in the singular (*loi*). Lemmatization means connecting each surface word on the page to its dictionary lemma.\n\n**Vocabulary.** *Token* — An individual word or mark in a text. *Surface Form* — The exact spelling written on the manuscript page. *Lemma* — The base dictionary headword representing a group of related word forms.\n\n**Takeaway:** Lemmatization links inflected surface words from the manuscript to their standard dictionary headwords.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: Tokens, Surface Forms, and Dictionary Lemmas", "questiontext": "<p>What is the difference between an inflected surface form on a manuscript page and a dictionary lemma?</p>", "generalfeedback": "<p>Lemmatization links inflected surface words from the manuscript to their standard dictionary headwords.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The surface form is the exact spelling written on the page, while the lemma is the standard uninflected dictionary headword.</p>", "feedback": "<p>Correct. The surface form preserves historical spelling (e.g. promis'd), while the lemma is the canonical dictionary entry (promise).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The surface form is an uninflected base word, while the lemma is an inflected plural.</p>", "feedback": "<p>Incorrect. The lemma is the uninflected dictionary citation headword.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The surface form only applies to nouns, while lemmas only apply to verbs.</p>", "feedback": "<p>Incorrect. Both nouns and verbs possess surface forms and dictionary lemmas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The surface form is generated by a computer, while the lemma was written by the historical scribe.</p>", "feedback": "<p>Incorrect. The historical scribe wrote the surface form; modern editors assign the lemma.</p>"}]}}, {"step": 3, "title": "The Grammatical Feature List", "content": "**The Grammatical Feature List**\n\nWords do more than carry dictionary meanings. In a sentence, words take on different shapes to show their grammatical job. The collection of grammatical traits on a single word is its **feature list**.\n\nLook at the word *writes* in Maud Lewis's letters: *She writes to Mr. Kinnear*. The dictionary lemma is *write*. Its feature list tells us more: Part of Speech = Verb, Person = Third, Number = Singular, and Tense = Present. In English, pronouns change shape for case: *she* is a subject, while *her* is an object or possessive.\n\nFrench uses rich feature lists for nearly every word. In the 1791 phrase *les assemblées nationales*, the noun *assemblées* is Feminine and Plural. The adjective *nationales* matches those traits through agreement. When you parse a word by hand, you record both its dictionary headword and its full list of grammatical features.\n\n**Vocabulary.** *Word Form* — The specific grammatical shape an inflected word takes in a sentence. *Feature List* — The set of grammatical tags (such as tense, person, number, and gender) that describe a word.\n\n**Takeaway:** A grammatical feature list records all traits—including part of speech, tense, person, gender, and number—for an inflected word.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Grammatical Feature List", "questiontext": "<p>What information is recorded in a word's grammatical feature list (FEATS)?</p>", "generalfeedback": "<p>A grammatical feature list records all traits—including part of speech, tense, person, gender, and number—for an inflected word.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The specific grammatical traits of the inflected word, such as part of speech, tense, person, number, and gender.</p>", "feedback": "<p>Correct. A feature list captures the bundle of inflectional traits attached to an inflected word form.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The physical dimensions and ink chemical properties of the parchment leaf.</p>", "feedback": "<p>Incorrect. Those are codicological physical traits, not grammatical features.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The market price of the manuscript at auction.</p>", "feedback": "<p>Incorrect. Valuation data does not belong in linguistic feature lists.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The font size and CSS style rules used to display the website.</p>", "feedback": "<p>Incorrect. CSS formatting is separate from grammatical morphology.</p>"}]}}, {"step": 4, "title": "Tokenization in Real Historical Documents", "content": "**Tokenization in Real Historical Documents**\n\nBefore you can tag or lemmatize words, you must separate your text into tokens. In modern English books, software simply splits text at spaces and punctuation. In old documents, tokenization is trickier.\n\nConsider the contractions in Maud Lewis's letters: *can't*, *didn't*, *it's*, and *I'll*. Is *can't* one token or two? Linguistically, it represents two words: the helping verb *can* and the negative word *not*. If you keep them together, software cannot find a dictionary entry for *can't*. If you split them into *can* and *n't*, both parts receive clean tags and lemmas.\n\nIn Ace's 1791 French decree, short words often cling to nouns: *l'assemblée*, *d'état*, *qu'un*. The letter *l'* is the definite article *le*. The word *assemblée* is a noun. Standard French tools split *l'assemblée* into two tokens: *l'* (lemma *le*) and *assemblée*. In old English treaties, phrases like *whereof* and *thereunto* fuse words together. Your tokenization rules decide where each token begins and ends.\n\n**Vocabulary.** *Tokenization* — Splitting running text into distinct words, symbols, and punctuation marks. *Clitic* — A short word that attaches phonetically to a neighbor, like French *l'* or English *'ve*.\n\n**Takeaway:** Tokenization must split contracted words so that each underlying word receives its own lemma and grammatical tag.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Tokenization in Real Historical Documents", "questiontext": "<p>Why should contractions like French l'assemblée or English can't be split into separate tokens before lemmatization?</p>", "generalfeedback": "<p>Tokenization must split contracted words so that each underlying word receives its own lemma and grammatical tag.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because each piece represents a distinct underlying word that requires its own lemma and part-of-speech tag.</p>", "feedback": "<p>Correct. Splitting l' into a determiner (le) and assemblée into a noun allows each to receive an accurate dictionary lemma.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computer operating systems crash if a word contains an apostrophe.</p>", "feedback": "<p>Incorrect. Computers handle apostrophes without crashing; splitting is done for grammatical accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI schemas prohibit the use of apostrophes in diplomatic transcriptions.</p>", "feedback": "<p>Incorrect. TEI handles apostrophes easily; tokenization isolates words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because punctuation marks must always be deleted from digital historical editions.</p>", "feedback": "<p>Incorrect. Punctuation is preserved and tagged with <pc>, not deleted.</p>"}]}}, {"step": 5, "title": "Words with Multiple Meanings: Homographs", "content": "**Words with Multiple Meanings: Homographs**\n\nA major hurdle in grammar tagging is double meanings. In natural human language, one written spelling can represent two completely different words. Words that share an identical spelling but differ in meaning or origin are called **homographs**.\n\nEnglish has thousands of homographs. In the 1752 Treaty, the word *will* appears in two ways. It can be a helping verb (*the Tribe will observe this Treaty*). It can also be a noun (*of their own free will*). The spelling is identical, but the lemmas and parts of speech are totally different. If a computer guesses without reading the sentence, it often makes a mistake.\n\nFrench has the same double meanings. The token *est* can be a form of the verb *être* (\"is\"). It can also be the noun *est* meaning the East. The word *son* can mean \"his\" or \"sound\". Human readers resolve these puzzles easily by looking at the sentence context. Automated programs often trip over them.\n\n**Vocabulary.** *Homograph* — A word spelled the same as another word but with a different meaning or part of speech. *Disambiguation* — Picking the correct meaning or grammatical tag for an ambiguous word in context.\n\n**Takeaway:** Human readers use sentence context to pick the right lemma when two different words share the same spelling.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Words with Multiple Meanings: Homographs", "questiontext": "<p>How do human editors resolve the grammatical category of homographs like English will or French est?</p>", "generalfeedback": "<p>Human readers use sentence context to pick the right lemma when two different words share the same spelling.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By examining the surrounding sentence context and grammatical role of the word.</p>", "feedback": "<p>Correct. Context reveals whether will functions as a helping verb or a common noun, and whether est means is or East.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By choosing whichever meaning appears first in an alphabetical dictionary.</p>", "feedback": "<p>Incorrect. Alphabetical order has no bearing on what an author meant in a sentence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By converting the word to uppercase letters in the TEI transcription.</p>", "feedback": "<p>Incorrect. Casing does not resolve grammatical ambiguity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the ambiguous word from the historical transcription.</p>", "feedback": "<p>Incorrect. Editors never delete genuine witness words.</p>"}]}}, {"step": 6, "title": "Verbs: Tense, Person, and Agreement", "content": "**Verbs: Tense, Person, and Agreement**\n\nVerbs form the backbone of sentences in English and French. In historical texts, verb endings reveal who acted, when they acted, and whether the action was finished.\n\nIn English, verbs change shape to match third-person subjects (*she paints*, *he writes*). Older English used distinct verb endings (*thou dost*, *he hath*, *she speaketh*). The 1752 Treaty uses formal legal style: *doth hereby promise and grant*. The lemma for *doth* is *do*. Its features are Verb, Present Tense, Third Person, Singular.\n\nFrench verbs have rich sets of endings. In Ace's 1791 decree, you find past-tense forms like *décréta* (past definite), *décrétoit* (older spelling of the imperfect), and *a décrété* (compound past). In all three cases, the base dictionary lemma is *décréter*. When tagging verbs, editors separate main verbs that take subjects from infinitives and participles.\n\n**Vocabulary.** *Finite Verb* — A verb that has a person and tense and serves as the main predicate of a clause. *Infinitive* — The uninflected base form of a verb, such as *to write* or *décréter*.\n\n**Takeaway:** Verb endings show tense, person, and number; manual parsing identifies both the inflected form and its base dictionary infinitive.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Verbs: Tense, Person, and Agreement", "questiontext": "<p>What is the canonical dictionary lemma for archaic English verbal forms like doth or French imperfect forms like décrétoit?</p>", "generalfeedback": "<p>Verb endings show tense, person, and number; manual parsing identifies both the inflected form and its base dictionary infinitive.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The uninflected base verb or infinitive, such as do for doth and décréter for décrétoit.</p>", "feedback": "<p>Correct. The canonical citation lemma for verbs is the base uninflected form or infinitive.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The exact surface spelling preserved as a new separate dictionary entry.</p>", "feedback": "<p>Incorrect. Inventing separate lemmas for inflected variants fragments the dictionary index.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The third-person singular past participle form.</p>", "feedback": "<p>Incorrect. Standard English and French lexica cite verbs under base forms or infinitives.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A Latin root from the fifth century.</p>", "feedback": "<p>Incorrect. Lemmas are cited in standard modern forms of the language being edited.</p>"}]}}, {"step": 7, "title": "Nouns and Adjectives: Gender and Number", "content": "**Nouns and Adjectives: Gender and Number**\n\nNouns name people, places, things, and ideas. Adjectives describe nouns. In modern English, nouns change for number (singular *letter*, plural *letters*) and possession (*Maud's*). English adjectives never change shape for gender or number. The word *red* stays the same whether describing one apple or ten.\n\nFrench works differently. Every French noun has a grammatical gender: masculine or feminine. French nouns also show singular or plural number. Adjectives must match their noun in both gender and number. In the phrase *décrets nationaux* (national decrees), *décrets* is masculine plural. The adjective *nationaux* changes its ending to agree with it. Its base lemma is *national*.\n\nIn English historical documents, pronouns still show case (*they*, *them*, *their*). Knowing whether a word is a subject, an object, or a modifier helps you understand the legal force of an old document.\n\n**Vocabulary.** *Agreement* — When modifying words match their head noun in gender, number, or case. *Grammatical Gender* — A noun class system (masculine or feminine) that controls how modifiers change.\n\n**Takeaway:** French adjectives change their endings to agree with nouns, while English words mainly show number and possession.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: Nouns and Adjectives: Gender and Number", "questiontext": "<p>How does adjectival inflection in French (such as décrets nationaux) differ from modern English adjectives?</p>", "generalfeedback": "<p>French adjectives change their endings to agree with nouns, while English words mainly show number and possession.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>French adjectives must change their endings to agree in gender and number with their head noun, whereas English adjectives do not inflect.</p>", "feedback": "<p>Correct. French nationaux agrees with masculine plural décrets; English national does not change endings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>French adjectives never change endings, while English adjectives have twelve distinct cases.</p>", "feedback": "<p>Incorrect. French adjectives inflect for gender and number; modern English adjectives do not.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>French adjectives only modify pronouns, never nouns.</p>", "feedback": "<p>Incorrect. Adjectives modify both nouns and pronouns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>French adjectives are always placed in the teiHeader rather than running text.</p>", "feedback": "<p>Incorrect. Adjectives occur throughout the running document text.</p>"}]}}, {"step": 8, "title": "Function Words: Determiners, Prepositions, and Conjunctions", "content": "**Function Words: Determiners, Prepositions, and Conjunctions**\n\nLinguists divide words into two big groups: content words and function words. **Content words**—nouns, main verbs, adjectives, and adverbs—carry specific real-world meaning. Languages invent new content words all the time.\n\n**Function words**, on the other hand, act as grammatical glue. They include determiners (*the*, *a*, *le*, *ces*), prepositions (*in*, *by*, *sur*, *dans*), and conjunctions (*and*, *but*, *et*, *ou*). Languages rarely add new function words. While they do not change shape often, function words show how clauses fit together.\n\nIn the 1752 Treaty, prepositions and conjunctions link long legal clauses: *between His Excellency Peregrine Thomas Hopson... and Major Jean Baptiste Cope*. Here, *between* and *and* link names and titles into a clear legal partnership. In your parsing, pay careful attention to function words.\n\n**Vocabulary.** *Content Words* — Words like nouns and verbs that carry real-world meaning. *Function Words* — Words like prepositions and conjunctions that connect phrases and show grammar.\n\n**Takeaway:** Function words link nouns and verbs together into complete, well-structured sentences.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Function Words: Determiners, Prepositions, and Conjunctions", "questiontext": "<p>What primary role do closed-class function words (like between, and, and dans) play in historical documents?</p>", "generalfeedback": "<p>Function words link nouns and verbs together into complete, well-structured sentences.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They provide the structural grammatical glue that connects nouns, verbs, and clauses into meaningful sentences.</p>", "feedback": "<p>Correct. Prepositions and conjunctions govern syntactic relationships between phrases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They provide the primary creative metaphors and poetic imagery in the text.</p>", "feedback": "<p>Incorrect. Open-class content words carry creative imagery; closed-class words provide grammatical structure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They are temporary filler words that can be omitted from scholarly digital editions.</p>", "feedback": "<p>Incorrect. Function words are essential to sentence syntax and legal meaning.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They only appear in spoken conversation, never in legal treaties or government decrees.</p>", "feedback": "<p>Incorrect. Function words are pervasive in formal legal and administrative prose.</p>"}]}}, {"step": 9, "title": "The Universal Dependencies Part-of-Speech Tagset", "content": "**The Universal Dependencies Part-of-Speech Tagset**\n\nTo help projects share linguistic data across languages, linguists built the **Universal Dependencies (UD)** project. UD created a standard list of 17 Universal Part-of-Speech (UPOS) tags.\n\nInstead of making up private tags, everyone uses the same labels. Here are the core tags you will use for our course documents:\n\n<table>\n  <thead>\n    <tr>\n      <th>Tag</th>\n      <th>Meaning</th>\n      <th>Examples in English and French</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>NOUN</code></td>\n      <td>Common noun</td>\n      <td>treaty, letter, assemblée, décrets</td>\n    </tr>\n    <tr>\n      <td><code>PROPN</code></td>\n      <td>Proper name</td>\n      <td>Hopson, Cope, France, Paris</td>\n    </tr>\n    <tr>\n      <td><code>VERB</code></td>\n      <td>Main verb</td>\n      <td>promise, write, décrète, signer</td>\n    </tr>\n    <tr>\n      <td><code>AUX</code></td>\n      <td>Helping verb</td>\n      <td>shall, will, have, est, ont</td>\n    </tr>\n    <tr>\n      <td><code>ADJ</code></td>\n      <td>Adjective</td>\n      <td>peaceable, good, national, royal</td>\n    </tr>\n    <tr>\n      <td><code>DET</code></td>\n      <td>Determiner</td>\n      <td>the, this, le, la, ces</td>\n    </tr>\n    <tr>\n      <td><code>ADP</code></td>\n      <td>Preposition</td>\n      <td>in, between, par, dans</td>\n    </tr>\n    <tr>\n      <td><code>CCONJ</code></td>\n      <td>Coordinating conjunction</td>\n      <td>and, but, et, ou</td>\n    </tr>\n    <tr>\n      <td><code>PUNCT</code></td>\n      <td>Punctuation</td>\n      <td>., ,, ;, :</td>\n    </tr>\n  </tbody>\n</table>\n\nUsing standard UPOS tags means tools can compare Ace's 1791 French decree directly with Andromeda's 1752 English treaty.\n\n**Vocabulary.** *Universal Dependencies (UD)* — An open global standard for grammar annotation across languages. *UPOS* — Universal Part-of-Speech tags, a set of 17 standard labels.\n\n**Takeaway:** The 17 Universal Dependencies UPOS tags give researchers a shared vocabulary for tagging parts of speech across languages.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: The Universal Dependencies Part-of-Speech Tagset", "questiontext": "<p>What is the purpose of the 17 Universal Part-of-Speech (UPOS) tags in Universal Dependencies?</p>", "generalfeedback": "<p>The 17 Universal Dependencies UPOS tags give researchers a shared vocabulary for tagging parts of speech across languages.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To provide a standardized set of grammatical labels that work consistently across different human languages.</p>", "feedback": "<p>Correct. The 17 UPOS tags provide a shared grammatical vocabulary for English, French, and other corpora.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To replace standard English spelling with computer binary code.</p>", "feedback": "<p>Incorrect. UPOS tags are grammatical labels, not binary text encodings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To assign grades to student transcriptions automatically.</p>", "feedback": "<p>Incorrect. UPOS is a linguistic framework, not an educational grading rubric.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force all historical languages to adopt modern English word order.</p>", "feedback": "<p>Incorrect. UPOS tags describe grammar without changing historical word order.</p>"}]}}, {"step": 10, "title": "Standard Grammatical Features (FEATS)", "content": "**Standard Grammatical Features (FEATS)**\n\nA UPOS tag tells you a word's broad class (like `NOUN` or `VERB`). It does not record details like past tense or plural number. In Universal Dependencies, those details live in a field called **FEATS** (Features).\n\nFEATS uses simple pairs separated by vertical bars. For example, the French noun *décrets* in Ace's text gets: `Gender=Masc|Number=Plur`. The English verb *promised* gets: `Tense=Past|VerbForm=Fin`.\n\n<table>\n  <thead>\n    <tr>\n      <th>Feature</th>\n      <th>Common Values</th>\n      <th>Simple Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>Number</code></td>\n      <td><code>Sing</code>, <code>Plur</code></td>\n      <td>treaty (Sing), treaties (Plur)</td>\n    </tr>\n    <tr>\n      <td><code>Gender</code></td>\n      <td><code>Masc</code>, <code>Fem</code></td>\n      <td>roi (Masc), reine (Fem)</td>\n    </tr>\n    <tr>\n      <td><code>Tense</code></td>\n      <td><code>Past</code>, <code>Pres</code></td>\n      <td>wrote (Past), writes (Pres)</td>\n    </tr>\n    <tr>\n      <td><code>Person</code></td>\n      <td><code>1</code>, <code>2</code>, <code>3</code></td>\n      <td>am (1), is (3)</td>\n    </tr>\n    <tr>\n      <td><code>VerbForm</code></td>\n      <td><code>Fin</code>, <code>Inf</code>, <code>Part</code></td>\n      <td>writes (Fin), write (Inf), written (Part)</td>\n    </tr>\n  </tbody>\n</table>\n\nStandard feature names let researchers search across many files for exact grammar forms, such as all feminine plural adjectives.\n\n**Vocabulary.** *FEATS* — The field in Universal Dependencies that holds specific grammatical traits like tense and number.\n\n**Takeaway:** The FEATS field records specific grammatical details using simple pairs like `Gender=Masc` and `Number=Plur`.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Standard Grammatical Features (FEATS)", "questiontext": "<p>How does Universal Dependencies store detailed grammatical traits like gender, tense, and number?</p>", "generalfeedback": "<p>The FEATS field records specific grammatical details using simple pairs like Gender=Masc and Number=Plur.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>As standardized attribute-value pairs separated by vertical bars in the FEATS field.</p>", "feedback": "<p>Correct. FEATS uses standard pairs such as Gender=Masc|Number=Plur.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside secret encrypted files stored on a blockchain.</p>", "feedback": "<p>Incorrect. FEATS values are plain-text attribute-value pairs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By coloring the words green or red in the web browser.</p>", "feedback": "<p>Incorrect. Visual styling is presentation; FEATS is structured linguistic data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By adding hundreds of footnotes to the printed page.</p>", "feedback": "<p>Incorrect. FEATS annotations are structured computational attributes.</p>"}]}}, {"step": 11, "title": "Authoritative Dictionaries as Citation Baselines", "content": "**Authoritative Dictionaries as Citation Baselines**\n\nHow do you decide on the official lemma for an old word? In everyday life, people guess word origins. In scholarly editing, every lemma must come from an authoritative dictionary.\n\nFor historical English texts—including the 1752 Treaty and Maud Lewis's letters—our primary authority is the **Oxford English Dictionary (OED)**. The OED tracks spelling history and gives standard modern headwords. If a word is archaic, like *whereunto*, the OED confirms its canonical dictionary entry.\n\nFor French texts, the primary baseline is the **Trésor de la Langue Française informatisé (TLFi)** and the historical dictionaries of the Académie française. When lemmatizing words in Ace's 1791 decree, checking the TLFi ensures that 18th-century government words map to the headwords recognized by scholars.\n\n**Vocabulary.** *Citation Baseline* — The standard scholarly dictionary chosen to govern lemma spellings in an edition. *OED* — Oxford English Dictionary, the historical authority for English. *TLFi* — Trésor de la Langue Française informatisé, the primary digital lexicon for French.\n\n**Takeaway:** Every lemma should be checked against an authoritative dictionary, such as the OED for English or the TLFi for French.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Authoritative Dictionaries as Citation Baselines", "questiontext": "<p>Which scholarly authority serves as the primary citation baseline for historical English lemmas in our course documents?</p>", "generalfeedback": "<p>Every lemma should be checked against an authoritative dictionary, such as the OED for English or the TLFi for French.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The Oxford English Dictionary (OED).</p>", "feedback": "<p>Correct. The OED provides the historical lexicographical authority for English headwords.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A modern social media hashtag index.</p>", "feedback": "<p>Incorrect. Social media tags lack scholarly historical authority.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A bilingual English-Latin pocket phrasebook.</p>", "feedback": "<p>Incorrect. Specialized scholarly editing requires unabridged historical lexica like the OED.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A spellchecker plugin on a smartphone.</p>", "feedback": "<p>Incorrect. Commercial spellcheckers do not provide historical citation baselines.</p>"}]}}, {"step": 12, "title": "TEI XML Word Elements: `<w>` and `<pc>`", "content": "**TEI XML Word Elements: `<w>` and `<pc>`**\n\nThe Text Encoding Initiative provides clean tags to mark words and punctuation directly in XML. The two most important tags are `<w>` (word) and `<pc>` (punctuation character).\n\nThe `<w>` tag wraps a single word. Punctuation marks go inside `<pc>`. Here is how a short clause from the 1752 Treaty looks when segmented into TEI elements:\n\n```xml\n<w>The</w>\n<w>said</w>\n<w>Chief</w>\n<w>doth</w>\n<w>promise</w>\n<pc>,</pc>\n```\n\nWrapping words in `<w>` makes token boundaries unmistakable for software. Normal spaces between words remain in the file, but programs process each `<w>` tag as one unit. The `<pc>` tag marks punctuation clearly, preventing search tools from treating a comma as part of a word.\n\n**Vocabulary.** *`<w>`* — The TEI tag that encloses a single grammatical word token. *`<pc>`* — The TEI tag that encloses a punctuation mark or symbol.\n\n**Takeaway:** Use the TEI `<w>` element to enclose words and the `<pc>` element to enclose punctuation marks.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: TEI XML Word Elements: <w> and <pc>", "questiontext": "<p>How does TEI P5 recommend encoding an individual word token and an adjacent comma?</p>", "generalfeedback": "<p>Use the TEI <w> element to enclose words and the <pc> element to enclose punctuation marks.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Wrapping the word in <w> and the comma in <pc>.</p>", "feedback": "<p>Correct. <w> marks a word token and <pc> explicitly marks punctuation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Wrapping both together in a <choice> tag.</p>", "feedback": "<p>Incorrect. <choice> is used for editorial alternatives, not basic word tokenization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Putting the entire sentence in a single <lb/> milestone.</p>", "feedback": "<p>Incorrect. <lb/> is an empty line-beginning milestone, not a word container.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting the comma so the word can stand alone.</p>", "feedback": "<p>Incorrect. Punctuation must be preserved and encoded with <pc>.</p>"}]}}, {"step": 13, "title": "Adding Attributes: `@lemma` and `@pos`", "content": "**Adding Attributes: `@lemma` and `@pos`**\n\nWrapping words in `<w>` is only the first step. To add grammatical information, you include attributes. The two main attributes are `@lemma` and `@pos`.\n\nThe `@lemma` attribute holds the dictionary headword. The `@pos` attribute holds the part-of-speech tag. Here is the same 1752 clause enriched with linguistic attributes:\n\n```xml\n<w lemma=\"the\" pos=\"DET\">The</w>\n<w lemma=\"say\" pos=\"VERB\">said</w>\n<w lemma=\"chief\" pos=\"NOUN\">Chief</w>\n<w lemma=\"do\" pos=\"AUX\">doth</w>\n<w lemma=\"promise\" pos=\"VERB\">promise</w>\n<pc pos=\"PUNCT\">,</pc>\n```\n\nLook at what this achieves. The surface form *said* connects to its dictionary headword *say*. The old auxiliary *doth* connects to *do*. A reader sees the original historical words on screen, while a search engine can find *do* and *promise* across the whole collection.\n\n**Vocabulary.** *`@lemma`* — The TEI attribute holding the dictionary headword. *`@pos`* — The TEI attribute holding the part-of-speech tag.\n\n**Takeaway:** Adding `@lemma` and `@pos` to `<w>` tags attaches dictionary headwords and grammar tags without altering the original text.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Adding Attributes: @lemma and @pos", "questiontext": "<p>Where are dictionary headwords and part-of-speech tags stored on a TEI word token?</p>", "generalfeedback": "<p>Adding @lemma and @pos to <w> tags attaches dictionary headwords and grammar tags without altering the original text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>In the @lemma and @pos attributes directly on the <w> element.</p>", "feedback": "<p>Correct. <w lemma=\"promise\" pos=\"VERB\"> records both properties on the word.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside the file name of the digital image.</p>", "feedback": "<p>Incorrect. Linguistic attributes belong on the text elements, not image files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In the CSS stylesheet under body font rules.</p>", "feedback": "<p>Incorrect. CSS controls display styling, not grammatical lemmas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In an unlinked external spreadsheet on a different computer.</p>", "feedback": "<p>Incorrect. TEI records linguistic metadata directly on <w> elements.</p>"}]}}, {"step": 14, "title": "Grammar Tags vs. Spelling Normalization", "content": "**Grammar Tags vs. Spelling Normalization**\n\nIn Module 6, you learned how to clean up historical spellings using `<choice>`, `<orig>`, and `<reg>`. Students often ask: is lemmatization just another kind of spelling normalization?\n\nThey are two distinct tasks. Spelling normalization updates historical spelling; lemmatization identifies the base grammatical word. In the 1752 Treaty, the scribe wrote *acknowledg'd*. In Module 6, you normalized that spelling to *acknowledged*:\n\n```xml\n<choice>\n  <orig>acknowledg'd</orig>\n  <reg>acknowledged</reg>\n</choice>\n```\n\nNotice that *acknowledged* is still an inflected past-tense verb! It is not the dictionary headword; the headword is the infinitive *acknowledge*. When combining both layers, TEI nests the regularized `<choice>` tag inside the linguistic `<w>` tag:\n\n```xml\n<w lemma=\"acknowledge\" pos=\"VERB\">\n  <choice>\n    <orig>acknowledg'd</orig>\n    <reg>acknowledged</reg>\n  </choice>\n</w>\n```\n\nThis nesting keeps both editorial choices clear: you standardized the spelling to *acknowledged*, and you mapped the word to the lemma *acknowledge*.\n\n**Takeaway:** Normalization updates spelling, while lemmatization identifies the base word; in TEI XML, `<choice>` nests inside `<w>`.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Grammar Tags vs. Spelling Normalization", "questiontext": "<p>How should an editor combine orthographic regularization with linguistic lemmatization in TEI XML?</p>", "generalfeedback": "<p>Normalization updates spelling, while lemmatization identifies the base word; in TEI XML, <choice> nests inside <w>.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Nest the <choice> regularization element inside the linguistic <w> element.</p>", "feedback": "<p>Correct. <w lemma=\"acknowledge\" pos=\"VERB\"><choice><orig>acknowledg'd</orig><reg>acknowledged</reg></choice></w> keeps both layers intact.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the <w> tag entirely with <reg> and discard the historical spelling.</p>", "feedback": "<p>Incorrect. Discarding the historical spelling destroys diplomatic evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Put the lemma inside <orig> and the part of speech inside <reg>.</p>", "feedback": "<p>Incorrect. <orig> and <reg> hold surface text spellings, not grammatical metadata.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They cannot be combined because TEI schemas forbid using <w> and <choice> in the same file.</p>", "feedback": "<p>Incorrect. TEI fully supports nesting <choice> inside <w>.</p>"}]}}, {"step": 15, "title": "External Feature Links with `@ana`", "content": "**External Feature Links with `@ana`**\n\nWhen grammatical annotations grow complex, writing long lists of traits inside tag attributes can make XML hard to read. TEI provides the `@ana` (analysis) attribute to link a word to an external definition.\n\nInstead of writing long strings of features, an editor defines grammatical categories in a feature list inside the `teiHeader`. Then, the `<w>` tag points to that definition using a link:\n\n```xml\n<w lemma=\"assemblée\" pos=\"NOUN\" ana=\"#fem_sing\">assemblée</w>\n```\n\nIn the header, `#fem_sing` points to an entry that defines the word as Feminine and Singular. This method, called **stand-off annotation**, keeps your main transcription neat while storing rich linguistic data. For class labs, inline `@lemma` and `@pos` attributes are plenty, but large projects use `@ana` often.\n\n**Vocabulary.** *`@ana`* — A TEI attribute that points to an external analysis definition. *Stand-Off Annotation* — Storing notes and linguistic data in a separate place from the main text.\n\n**Takeaway:** The `@ana` attribute links words to external feature lists, keeping transcripts clean while supporting deep grammatical notes.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: External Feature Links with @ana", "questiontext": "<p>What advantage does stand-off annotation with @ana offer when encoding detailed linguistic features?</p>", "generalfeedback": "<p>The @ana attribute links words to external feature lists, keeping transcripts clean while supporting deep grammatical notes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It points to centralized feature definitions in the header, keeping the primary text clean and readable.</p>", "feedback": "<p>Correct. @ana links tokens to feature libraries, avoiding repetitive inline attribute bloat.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It speeds up computer internet connections by compressing audio files.</p>", "feedback": "<p>Incorrect. @ana is an XML markup pointer, not an internet compression protocol.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It hides the text from readers who do not have an academic degree.</p>", "feedback": "<p>Incorrect. Stand-off markup organizes data; it does not restrict access.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically translates the document into Spanish.</p>", "feedback": "<p>Incorrect. @ana references grammatical analyses, not language translation.</p>"}]}}, {"step": 16, "title": "Marking Sentences with `<s>`", "content": "**Marking Sentences with `<s>`**\n\nGrammar does not end with single words; it also shapes sentences. In TEI P5, complete sentences are wrapped in the `<s>` (sentence) tag.\n\nGrouping words into `<s>` elements is essential for studying syntax. Grammar rules—such as a subject matching its verb—work within sentence boundaries. Here is an example using `<s>`, `<w>`, and `<pc>` together:\n\n```xml\n<s>\n  <w lemma=\"the\" pos=\"DET\">The</w>\n  <w lemma=\"treaty\" pos=\"NOUN\">Treaty</w>\n  <w lemma=\"be\" pos=\"AUX\">was</w>\n  <w lemma=\"sign\" pos=\"VERB\">signed</w>\n  <pc pos=\"PUNCT\">.</pc>\n</s>\n```\n\nNotice how punctuation marks sit in `<pc>` tags. This cleanly separates words from sentence endings. In historical texts, punctuation is often irregular. Marking sentence boundaries by hand helps grammar tools parse clauses correctly.\n\n**Vocabulary.** *`<s>`* — The TEI element that marks a grammatical sentence.\n\n**Takeaway:** Wrapping clauses in `<s>` elements marks sentence boundaries that guide grammatical analysis.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Marking Sentences with <s>", "questiontext": "<p>Why is wrapping clauses in TEI <s> elements important for computational grammar analysis?</p>", "generalfeedback": "<p>Wrapping clauses in <s> elements marks sentence boundaries that guide grammatical analysis.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because syntactic dependency relations operate within sentence boundaries.</p>", "feedback": "<p>Correct. Syntactic relationships like subjects and verb objects are bounded by sentence units.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because web browsers cannot render text unless every sentence has an <s> tag.</p>", "feedback": "<p>Incorrect. Web browsers display text with standard HTML tags; <s> is for syntactic segmentation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because sentences are required to be exactly ten words long in TEI P5.</p>", "feedback": "<p>Incorrect. Sentences have natural varying lengths.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because <s> elements automatically erase spelling errors in old documents.</p>", "feedback": "<p>Incorrect. <s> marks grammatical sentence boundaries without altering spelling.</p>"}]}}, {"step": 17, "title": "Parsing Walkthrough 1: The 1752 Peace and Friendship Treaty", "content": "**Parsing Walkthrough 1: The 1752 Peace and Friendship Treaty**\n\nLet us look at a hands-on manual parse from Andromeda's project: the 1752 Peace and Friendship Treaty.\n\nConsider this opening clause: *All Treaties shall be renewed*. Here is the grammatical breakdown in a clear table:\n\n<table>\n  <thead>\n    <tr>\n      <th>Surface Word</th>\n      <th>Lemma</th>\n      <th>UPOS</th>\n      <th>Features (FEATS)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>All</td>\n      <td>all</td>\n      <td><code>DET</code></td>\n      <td>PronType=Tot</td>\n    </tr>\n    <tr>\n      <td>Treaties</td>\n      <td>treaty</td>\n      <td><code>NOUN</code></td>\n      <td>Number=Plur</td>\n    </tr>\n    <tr>\n      <td>shall</td>\n      <td>shall</td>\n      <td><code>AUX</code></td>\n      <td>VerbForm=Fin</td>\n    </tr>\n    <tr>\n      <td>be</td>\n      <td>be</td>\n      <td><code>AUX</code></td>\n      <td>VerbForm=Inf</td>\n    </tr>\n    <tr>\n      <td>renewed</td>\n      <td>renew</td>\n      <td><code>VERB</code></td>\n      <td>Tense=Past|VerbForm=Part</td>\n    </tr>\n  </tbody>\n</table>\n\nNotice how each token receives an exact analysis. *Treaties* maps to the singular lemma *treaty*. The verb group *shall be renewed* breaks down into a helping verb (`shall`), a helping infinitive (`be`), and a main past participle (`renewed`, lemma *renew*).\n\n**Takeaway:** Breaking old legal clauses into tables makes lemmas, parts of speech, and grammatical features clear and simple.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Parsing Walkthrough 1: The 1752 Peace and Friendship Treaty", "questiontext": "<p>In the 1752 Treaty clause All Treaties shall be renewed, what is the lemma and UPOS tag for Treaties?</p>", "generalfeedback": "<p>Breaking old legal clauses into tables makes lemmas, parts of speech, and grammatical features clear and simple.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Lemma: treaty, UPOS: NOUN.</p>", "feedback": "<p>Correct. Treaties is a plural common noun with canonical singular lemma treaty.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Lemma: treat, UPOS: VERB.</p>", "feedback": "<p>Incorrect. Treaties is a noun denoting formal agreements, not the verb treat.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Lemma: all, UPOS: DET.</p>", "feedback": "<p>Incorrect. All is the preceding determiner, not the lemma for Treaties.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Lemma: renewed, UPOS: ADJ.</p>", "feedback": "<p>Incorrect. Renewed is the following participle verb.</p>"}]}}, {"step": 18, "title": "Parsing Walkthrough 2: The 1791 French Revolutionary Decree", "content": "**Parsing Walkthrough 2: The 1791 French Revolutionary Decree**\n\nNow let us examine a government clause from Ace's project: a 1791 decree from the National Assembly of Revolutionary France.\n\nConsider this line: *L'Assemblée nationale décrète les lois suivantes* (\"The National Assembly decrees the following laws\"). Because French features rich agreement and clitics, we look closely at each ending:\n\n<table>\n  <thead>\n    <tr>\n      <th>Surface Word</th>\n      <th>Lemma</th>\n      <th>UPOS</th>\n      <th>Features (FEATS)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>L'</td>\n      <td>le</td>\n      <td><code>DET</code></td>\n      <td>Gender=Fem|Number=Sing|PronType=Art</td>\n    </tr>\n    <tr>\n      <td>Assemblée</td>\n      <td>assemblée</td>\n      <td><code>NOUN</code></td>\n      <td>Gender=Fem|Number=Sing</td>\n    </tr>\n    <tr>\n      <td>nationale</td>\n      <td>national</td>\n      <td><code>ADJ</code></td>\n      <td>Gender=Fem|Number=Sing</td>\n    </tr>\n    <tr>\n      <td>décrète</td>\n      <td>décréter</td>\n      <td><code>VERB</code></td>\n      <td>Number=Sing|Person=3|Tense=Pres|VerbForm=Fin</td>\n    </tr>\n    <tr>\n      <td>les</td>\n      <td>le</td>\n      <td><code>DET</code></td>\n      <td>Number=Plur|PronType=Art</td>\n    </tr>\n    <tr>\n      <td>lois</td>\n      <td>loi</td>\n      <td><code>NOUN</code></td>\n      <td>Gender=Fem|Number=Plur</td>\n    </tr>\n    <tr>\n      <td>suivantes</td>\n      <td>suivant</td>\n      <td><code>ADJ</code></td>\n      <td>Gender=Fem|Number=Plur</td>\n    </tr>\n  </tbody>\n</table>\n\nLook at the matching pairs. *Assemblée* is feminine singular, so *L'* and *nationale* match it. Next, *lois* is feminine plural, and *suivantes* agrees with it. The verb *décrète* maps to its base infinitive *décréter*.\n\n**Takeaway:** French manual parsing requires tracking gender and number agreement across phrases and mapping verbs to infinitives.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Parsing Walkthrough 2: The 1791 French Revolutionary Decree", "questiontext": "<p>In the 1791 French phrase L'Assemblée nationale décrète les lois suivantes, how do the adjectives agree with their nouns?</p>", "generalfeedback": "<p>French manual parsing requires tracking gender and number agreement across phrases and mapping verbs to infinitives.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>nationale agrees with feminine singular Assemblée, and suivantes agrees with feminine plural lois.</p>", "feedback": "<p>Correct. French adjectives inflect in gender and number to match their governing nouns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Both adjectives remain masculine singular regardless of the nouns.</p>", "feedback": "<p>Incorrect. French adjectives must agree in gender and number.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>nationale is a verb, while suivantes is a preposition.</p>", "feedback": "<p>Incorrect. Both words function as qualifying adjectives.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The adjectives agree with the king rather than the nouns in the sentence.</p>", "feedback": "<p>Incorrect. Grammatical agreement is syntactic, linking modifiers to their head nouns.</p>"}]}}, {"step": 19, "title": "Parsing Walkthrough 3: Maud Lewis's Folk Correspondence", "content": "**Parsing Walkthrough 3: Maud Lewis's Folk Correspondence**\n\nFor our third walkthrough, we examine a line from Olyvia's project: a handwritten 1967 letter by Maud Lewis to Mr. Kinnear.\n\nMaud Lewis's writing is warm, personal, and informal: *I received your letter today*. Here is the grammatical breakdown:\n\n<table>\n  <thead>\n    <tr>\n      <th>Surface Word</th>\n      <th>Lemma</th>\n      <th>UPOS</th>\n      <th>Features (FEATS)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>I</td>\n      <td>I</td>\n      <td><code>PRON</code></td>\n      <td>Case=Nom|Number=Sing|Person=1|PronType=Prs</td>\n    </tr>\n    <tr>\n      <td>received</td>\n      <td>receive</td>\n      <td><code>VERB</code></td>\n      <td>Tense=Past|VerbForm=Fin</td>\n    </tr>\n    <tr>\n      <td>your</td>\n      <td>you</td>\n      <td><code>PRON</code></td>\n      <td>Person=2|Poss=Yes|PronType=Prs</td>\n    </tr>\n    <tr>\n      <td>letter</td>\n      <td>letter</td>\n      <td><code>NOUN</code></td>\n      <td>Number=Sing</td>\n    </tr>\n    <tr>\n      <td>today</td>\n      <td>today</td>\n      <td><code>NOUN</code></td>\n      <td>Number=Sing</td>\n    </tr>\n  </tbody>\n</table>\n\nEven personal letters benefit from linguistic tags. The possessive pronoun *your* links to its base lemma *you*. The past-tense verb *received* maps to *receive*. Tagging Maud Lewis's letters helps researchers trace her vocabulary and informal writing style across her letters.\n\n**Takeaway:** Personal letters follow standard Universal Dependencies tags, recording informal phrasing and everyday vocabulary clearly.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Parsing Walkthrough 3: Maud Lewis's Folk Correspondence", "questiontext": "<p>In Maud Lewis's sentence I received your letter today, how is the word your analyzed in Universal Dependencies?</p>", "generalfeedback": "<p>Personal letters follow standard Universal Dependencies tags, recording informal phrasing and everyday vocabulary clearly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Lemma: you, UPOS: PRON, Feature: Poss=Yes.</p>", "feedback": "<p>Correct. Your is a second-person possessive pronoun derived from lemma you.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Lemma: letter, UPOS: NOUN.</p>", "feedback": "<p>Incorrect. Letter is the head noun being modified.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Lemma: your, UPOS: VERB.</p>", "feedback": "<p>Incorrect. Your is a possessive pronoun, not a verb.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Lemma: Maud, UPOS: PROPN.</p>", "feedback": "<p>Incorrect. Maud is the letter writer, not the lemma of the pronoun your.</p>"}]}}, {"step": 20, "title": "Handling Old Spellings During Lemmatization", "content": "**Handling Old Spellings During Lemmatization**\n\nIn historical manuscripts, you will often find words with non-standard spellings. Scribes made spelling slips, used local spellings, or followed conventions that changed over time. How should you lemmatize a word with an unusual spelling?\n\nThe main rule of lemmatization is simple: **the lemma is always modern and canonical, even when the manuscript spelling is unusual.**\n\nIn 18th-century English, words like *publick* or *musick* ended in *ck*. The surface form on the page is *publick*, but the lemma is modern *public*. In 18th-century French, imperfect verbs ended in *-oit* (*faisoit*, *étoit*). The surface spelling is *faisoit*, but its lemma is the standard infinitive *faire*.\n\nIf an editor invented an archaic lemma like *faisoir* or *publick*, they would break the dictionary index. A digital edition connects old spellings to modern dictionaries so that readers can search the text using familiar words.\n\n**Vocabulary.** *Canonical Lemma* — The modern standard headword used to index historical spelling variations in a lexicon.\n\n**Takeaway:** Always assign a modern standard dictionary headword as the lemma, no matter how unusual the spelling is on the page.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Handling Old Spellings During Lemmatization", "questiontext": "<p>When lemmatizing an 18th-century word with an archaic spelling (such as French faisoit or English publick), what should the lemma be?</p>", "generalfeedback": "<p>Always assign a modern standard dictionary headword as the lemma, no matter how unusual the spelling is on the page.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The modern standard headword (faire or public).</p>", "feedback": "<p>Correct. Lemmas are always modern citation headwords, connecting old spellings to standard dictionaries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An invented historical lemma that preserves the archaic letters exactly (faisoir or publick).</p>", "feedback": "<p>Incorrect. Inventing archaic lemmas breaks dictionary lookups across corpora.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The word left blank because old words cannot have lemmas.</p>", "feedback": "<p>Incorrect. Historical words map to standard lemmas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A Latin translation of the word.</p>", "feedback": "<p>Incorrect. Lemmas are cited in the standard form of the document's language.</p>"}]}}, {"step": 21, "title": "Multi-Word Phrases and Titles", "content": "**Multi-Word Phrases and Titles**\n\nIn many documents, several words work together as a single unit. These are called **multi-word expressions** or compound terms.\n\nIn English legal texts, you often find fixed formulas like *in witness whereof*, *peace and friendship*, or *His Excellency*. In French government papers, titles like *procès-verbal* or *assemblée nationale* represent single official ideas.\n\nHow do you encode them in TEI? In standard tokenization, each written word gets its own `<w>` tag. However, TEI provides the `<phr>` (phrase) tag to group multi-word expressions together:\n\n```xml\n<phr type=\"legal_formula\">\n  <w lemma=\"in\" pos=\"ADP\">in</w>\n  <w lemma=\"witness\" pos=\"NOUN\">witness</w>\n  <w lemma=\"whereof\" pos=\"ADV\">whereof</w>\n</phr>\n```\n\nThis lets search engines analyze each word on its own while still knowing that the three words form a single fixed phrase.\n\n**Vocabulary.** *Multi-Word Expression* — A group of words that functions together as a single phrase or meaning. *`<phr>`* — The TEI element used to group words into grammatical phrases.\n\n**Takeaway:** Group multi-word legal formulas with `<phr>` while keeping individual `<w>` elements for each token.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Multi-Word Phrases and Titles", "questiontext": "<p>How can an editor group multi-word legal formulas like in witness whereof in TEI XML?</p>", "generalfeedback": "<p>Group multi-word legal formulas with <phr> while keeping individual <w> elements for each token.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Wrap the group in a <phr> element while keeping individual <w> tags for each word.</p>", "feedback": "<p>Correct. <phr> groups idioms and multi-word units without destroying word-level tokenization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete two of the words and keep only one.</p>", "feedback": "<p>Incorrect. Deleting words corrupts the historical text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Merge all three words into a single long string with no spaces.</p>", "feedback": "<p>Incorrect. Merging words destroys tokenization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the phrase with an emoji symbol.</p>", "feedback": "<p>Incorrect. Scholarly editions maintain rigorous textual integrity.</p>"}]}}, {"step": 22, "title": "Splitting Contractions for Tagging", "content": "**Splitting Contractions for Tagging**\n\nAs noted earlier, contractions join two words into one printed unit. When preparing text for tagging, you must decide how to handle these words.\n\nIn French, words join with an apostrophe: *d'accord*, *l'homme*, *qu'il*. If you keep *d'accord* as a single word, it has no single part of speech. It is a preposition plus a noun. In TEI XML, you can tag both words while keeping the apostrophe:\n\n```xml\n<w lemma=\"de\" pos=\"ADP\">d'</w>\n<w lemma=\"accord\" pos=\"NOUN\">accord</w>\n```\n\nIn English, informal words like *don't* or *they'll* follow the same pattern:\n\n```xml\n<w lemma=\"do\" pos=\"AUX\">do</w>\n<w lemma=\"not\" pos=\"ADV\">n't</w>\n```\n\nNotice how the surface letters are shared between the two `<w>` elements. This preserves the original letters on the page while giving accurate tags to each underlying word.\n\n**Takeaway:** Splitting contracted words across separate `<w>` tags lets each word receive its own lemma and part of speech.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Splitting Contractions for Tagging", "questiontext": "<p>In French clitic contractions like d'accord or English don't, how should tokens be divided for linguistic markup?</p>", "generalfeedback": "<p>Splitting contracted words across separate <w> tags lets each word receive its own lemma and part of speech.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Split the string so each underlying grammatical word has its own <w> tag with appropriate lemma and POS.</p>", "feedback": "<p>Correct. Distributing letters across <w> tags preserves text while giving each word an accurate tag.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Always delete the apostrophe and join the remaining letters into one word.</p>", "feedback": "<p>Incorrect. Deleting characters alters the historical evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Treat the apostrophe as a finite verb with lemma apostrophe.</p>", "feedback": "<p>Incorrect. Punctuation marks are not verbs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ignore contractions and refuse to parse sentences containing them.</p>", "feedback": "<p>Incorrect. Contractions are standard features of natural language.</p>"}]}}, {"step": 23, "title": "Heads and Modifiers: The Heart of Syntax", "content": "**Heads and Modifiers: The Heart of Syntax**\n\nLinguistic annotation goes beyond sorting single words; it also shows how words connect in sentences. The central idea of **dependency grammar** is that words connect through links between **heads** and **modifiers**.\n\nIn every word pair, one word acts as the head, and the other acts as its dependent modifier. In the phrase *national decree*, the noun *decree* is the head, and the adjective *national* is the modifier. If you drop the adjective, the sentence still makes sense (*The decree was read*). If you drop the noun, the phrase breaks down.\n\nIn a full clause, the main verb serves as the root of the sentence. The subject noun depends on the verb, and the direct object depends on the verb. Seeing this structure is the first step toward syntactic treebanking.\n\n**Vocabulary.** *Dependency Grammar* — A grammar model based on links between governing heads and dependent modifiers. *Head* — The main word that governs a grammatical phrase. *Modifier* — A word that depends on a governing head word.\n\n**Takeaway:** Sentences are organized into trees where dependent words connect directly to governing head words.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Heads and Modifiers: The Heart of Syntax", "questiontext": "<p>In dependency grammar, what relationship exists between the words in the phrase national decree?</p>", "generalfeedback": "<p>Sentences are organized into trees where dependent words connect directly to governing head words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>decree is the governing head, and national is the dependent modifier.</p>", "feedback": "<p>Correct. The noun decree anchors the phrase, while the adjective national modifies it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>national is the head governing the direct object decree.</p>", "feedback": "<p>Incorrect. Adjectives modify nouns, not govern them as objects.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Neither word is connected because adjectives cannot relate to nouns.</p>", "feedback": "<p>Incorrect. Adjectives depend directly on their head nouns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Both words are sentence roots with no dependencies.</p>", "feedback": "<p>Incorrect. Only the central clause verb serves as the sentence root.</p>"}]}}, {"step": 24, "title": "A First Look at Dependency Relations", "content": "**A First Look at Dependency Relations**\n\nJust as Universal Dependencies uses UPOS tags for parts of speech, it uses **relation tags** to label how words connect.\n\nHere are the six most common relation tags you will see in our historical English and French documents:\n\n<table>\n  <thead>\n    <tr>\n      <th>Tag</th>\n      <th>Job</th>\n      <th>Example (Head → Modifier)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>root</code></td>\n      <td>Main sentence verb</td>\n      <td>[Sentence] → signed</td>\n    </tr>\n    <tr>\n      <td><code>nsubj</code></td>\n      <td>Subject noun</td>\n      <td>signed → Chief</td>\n    </tr>\n    <tr>\n      <td><code>obj</code></td>\n      <td>Direct object</td>\n      <td>signed → Treaty</td>\n    </tr>\n    <tr>\n      <td><code>amod</code></td>\n      <td>Adjective modifier</td>\n      <td>decree → national</td>\n    </tr>\n    <tr>\n      <td><code>det</code></td>\n      <td>Determiner</td>\n      <td>decree → the</td>\n    </tr>\n    <tr>\n      <td><code>punct</code></td>\n      <td>Punctuation</td>\n      <td>signed → .</td>\n    </tr>\n  </tbody>\n</table>\n\nIn a sentence like *The Chief signed the Treaty*, the verb *signed* is the `root`. *Chief* is the `nsubj` of *signed*, and *Treaty* is the `obj`. Each noun connects to *the* with a `det` tag. This gives you the basic grammatical skeleton of the sentence.\n\n**Vocabulary.** *Relation Tag* — A label that describes the grammatical link between a head word and a modifier. *`root`* — The central verb that anchors an entire sentence.\n\n**Takeaway:** Standard relation tags like `nsubj`, `obj`, and `amod` label how words connect to their governing heads.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: A First Look at Dependency Relations", "questiontext": "<p>Which Universal Dependencies relation tag labels the main finite verb of an independent clause?</p>", "generalfeedback": "<p>Standard relation tags like nsubj, obj, and amod label how words connect to their governing heads.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>root</p>", "feedback": "<p>Correct. The central governing verb of an independent clause is tagged as root.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>amod</p>", "feedback": "<p>Incorrect. amod is used for adjectival modifiers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>punct</p>", "feedback": "<p>Incorrect. punct is used for punctuation marks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>det</p>", "feedback": "<p>Incorrect. det is used for determiners like the and a.</p>"}]}}, {"step": 25, "title": "The CoNLL-U Plain-Text Format", "content": "**The CoNLL-U Plain-Text Format**\n\nIn computational linguistics, syntax trees are stored in an open plain-text format called **CoNLL-U**. Every sentence is written as a simple 10-column table.\n\nEach line in a CoNLL-U file represents one token. Here are the ten columns:\n\n<ol>\n  <li><strong>ID:</strong> Word number in the sentence (starting at 1).</li>\n  <li><strong>FORM:</strong> Word spelling on the page.</li>\n  <li><strong>LEMMA:</strong> Dictionary headword.</li>\n  <li><strong>UPOS:</strong> Universal part-of-speech tag.</li>\n  <li><strong>XPOS:</strong> Local language tag (often <code>_</code>).</li>\n  <li><strong>FEATS:</strong> Grammatical features list (or <code>_</code>).</li>\n  <li><strong>HEAD:</strong> The ID number of the governing head word (or <code>0</code> for root).</li>\n  <li><strong>DEPREL:</strong> Grammatical relation to the head word.</li>\n  <li><strong>DEPS:</strong> Extra dependency links (often <code>_</code>).</li>\n  <li><strong>MISC:</strong> Extra notes (like <code>SpaceAfter=No</code>).</li>\n</ol>\n\nBecause CoNLL-U is plain text, any text editor or script can read it easily. On Wednesday, you will see how automated tools output CoNLL-U tables directly.\n\n**Vocabulary.** *CoNLL-U* — The standard 10-column plain-text file format used to store Universal Dependencies sentences.\n\n**Takeaway:** CoNLL-U is the global 10-column text format used to store tokens, lemmas, tags, and syntax trees.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: The CoNLL-U Plain-Text Format", "questiontext": "<p>How many standardized columns are used on each token line in a CoNLL-U format file?</p>", "generalfeedback": "<p>CoNLL-U is the global 10-column text format used to store tokens, lemmas, tags, and syntax trees.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Exactly ten columns.</p>", "feedback": "<p>Correct. CoNLL-U files use 10 tab-separated columns for token ID, form, lemma, UPOS, FEATS, and syntax.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Two columns: word and definition.</p>", "feedback": "<p>Incorrect. CoNLL-U has 10 standard columns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Fifty columns covering all world languages.</p>", "feedback": "<p>Incorrect. CoNLL-U uses 10 columns across all languages.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A variable number that changes randomly on every line.</p>", "feedback": "<p>Incorrect. CoNLL-U requires a strict 10-column tabular structure.</p>"}]}}, {"step": 26, "title": "Building Your Manual Ground-Truth Table", "content": "**Building Your Manual Ground-Truth Table**\n\nYour main task for this week is to build a **manual ground-truth table** for a 20-word excerpt from your project document. This table serves as the benchmark against which automated tools will be tested.\n\nTo build your table, follow these four simple steps:\n<ol>\n  <li><strong>Pick an Excerpt:</strong> Select 20 words in a row from your transcript that form complete clauses.</li>\n  <li><strong>Tokenize:</strong> Put each word on its own line, separating punctuation and splitting contractions.</li>\n  <li><strong>Look Up Lemmas:</strong> Check each word in your chosen dictionary (OED for English, TLFi for French) to find its canonical headword.</li>\n  <li><strong>Tag Grammar:</strong> Assign the right UPOS tag and record features like number, tense, and gender.</li>\n</ol>\n\nDo not guess from memory. Check your dictionary and write down your reasons in your notes.\n\n**Vocabulary.** *Ground Truth* — An authoritatively verified dataset built by hand to test automated programs.\n\n**Takeaway:** Your 20-word manual ground-truth table provides the trusted benchmark for testing automated software.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Building Your Manual Ground-Truth Table", "questiontext": "<p>What is the first step in creating your project's 20-word manual ground-truth table?</p>", "generalfeedback": "<p>Your 20-word manual ground-truth table provides the trusted benchmark for testing automated software.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Select 20 consecutive words from your primary witness that form complete grammatical clauses.</p>", "feedback": "<p>Correct. Choosing continuous grammatical clauses ensures meaningful syntactic analysis.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ask a chatbot to invent twenty random fictional words.</p>", "feedback": "<p>Incorrect. Ground truth must come from your actual primary manuscript witness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Download a modern news article from the internet.</p>", "feedback": "<p>Incorrect. Course work is anchored in the enrolled historical witnesses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Guess the parts of speech without looking at a dictionary.</p>", "feedback": "<p>Incorrect. Ground-truth creation requires authoritative dictionary verification.</p>"}]}}, {"step": 27, "title": "Writing Rules in `LEMMATIZATION_POLICIES.md`", "content": "**Writing Rules in `LEMMATIZATION_POLICIES.md`**\n\nWhen annotating historical texts, you will run into questions that need consistent answers. Should proper names stay capitalized in lemmas? How should archaic contractions be split? Which dictionary edition sets the rules?\n\nTo keep your work consistent, record these decisions in a file called `LEMMATIZATION_POLICIES.md`.\n\nYour policy file should answer three simple questions:\n<ol>\n  <li><strong>Dictionary Authority:</strong> Which dictionary governs headwords (e.g., OED, TLFi)?</li>\n  <li><strong>Capitalization Rules:</strong> Are proper names capitalized in lemmas (e.g., *France*, *Hopson*) while common nouns stay lower-case?</li>\n  <li><strong>Contraction Rules:</strong> Exactly where are contractions split, and how are missing letters recorded?</li>\n</ol>\n\nWriting these choices down ensures that your edition remains consistent across every page.\n\n**Vocabulary.** *Policy Ledger* — A document recording your project's rules to keep annotations consistent.\n\n**Takeaway:** Document your dictionary sources, capitalization rules, and contraction splits in `LEMMATIZATION_POLICIES.md`.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Writing Rules in LEMMATIZATION_POLICIES.md", "questiontext": "<p>Why must digital edition projects document their annotation rules in a policy ledger like LEMMATIZATION_POLICIES.md?</p>", "generalfeedback": "<p>Document your dictionary sources, capitalization rules, and contraction splits in LEMMATIZATION_POLICIES.md.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To record decisions on dictionary authorities, capitalization, and contraction boundaries so annotations remain consistent.</p>", "feedback": "<p>Correct. An explicit policy ledger prevents inconsistent editorial decisions across the text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To satisfy commercial copyright laws when selling the manuscript.</p>", "feedback": "<p>Incorrect. The policy ledger is a scholarly methodological document, not a commercial contract.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI software will not open XML files without a markdown companion file.</p>", "feedback": "<p>Incorrect. XML processors parse XML independently; the policy document is for scholars.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prevent other researchers from citing the edition.</p>", "feedback": "<p>Incorrect. Scholarly documentation invites transparent review and citation.</p>"}]}}, {"step": 28, "title": "Recording Difficult Readings and Editorial Doubts", "content": "**Recording Difficult Readings and Editorial Doubts**\n\nEven skilled editors sometimes disagree on how to parse an old word. A word might fit two parts of speech, or an old sentence might allow two different readings.\n\nWhen two people tag the same text separately, the percentage of words where they agree is called **editor agreement**. In digital humanities research, high agreement (often 90% or higher) shows that the project rules are clear.\n\nWhen you find a word that has two reasonable readings, do not hide the problem. Put your preferred reading in your table, but add a brief note explaining the alternative. Recording these questions shows scholarly honesty and helps future readers understand difficult spots.\n\n**Vocabulary.** *Editor Agreement* — The percentage of words where two independent scholars assign matching tags. *Textual Crux* — A puzzling or ambiguous passage that has more than one valid reading.\n\n**Takeaway:** When an old word allows two different readings, record your top choice and note the alternative reading clearly.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Recording Difficult Readings and Editorial Doubts", "questiontext": "<p>What should an editor do when a historical word in a manuscript permits two equally plausible grammatical readings?</p>", "generalfeedback": "<p>When an old word allows two different readings, record your top choice and note the alternative reading clearly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Record the primary interpretation in the table and document the alternative reading in an explanatory note.</p>", "feedback": "<p>Correct. Transparently logging editorial doubts records genuine philological cruxes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the sentence from the digital edition.</p>", "feedback": "<p>Incorrect. Deleting difficult passages destroys historical evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Flip a coin and pretend no ambiguity ever existed.</p>", "feedback": "<p>Incorrect. Scholarly integrity requires acknowledging genuine interpretive cruxes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the word with a modern synonym.</p>", "feedback": "<p>Incorrect. Editors preserve witness readings rather than rewriting history.</p>"}]}}, {"step": 29, "title": "Getting Ready for Wednesday's Automated NLP Test", "content": "**Getting Ready for Wednesday's Automated NLP Test**\n\nToday's manual parsing is not a standalone drill. It sets up the rest of the week's experiments. Over the next two meetings, you will run computer tools over this exact same passage.\n\nOn Wednesday, in Lesson 8.2, you will run an automated rule-based tagger (like TreeTagger or SpaCy) on your 20-word excerpt. You will compare the computer's results directly against today's manual table. Every place where the computer disagrees with your work will be examined. Did the tool choke on an old spelling, or did it pick the wrong homograph?\n\nOn Friday, in Lesson 8.3, you will test an AI model on the same text. Having a trusted manual ground truth is the only way to measure how well these automated tools perform.\n\n**Takeaway:** Today's manual ground truth is the benchmark you will use to evaluate automated tools on Wednesday and Friday.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Getting Ready for Wednesday's Automated NLP Test", "questiontext": "<p>How will today's
