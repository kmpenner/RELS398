Large Language Model (such as Anthropic's Claude) at a technical level?</p>", "generalfeedback": "<p>LLMs are statistical machine learning models that generate fluent text based on deep pattern recognition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A statistical neural network trained on vast text corpora that uses probability to understand prompts and generate contextually appropriate language and code.</p>", "feedback": "<p>Correct. LLMs are large-scale statistical language predictors trained on massive textual datasets, not conscious entities.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A sentient, conscious mind with personal feelings and emotions.</p>", "feedback": "<p>Incorrect. LLMs are mathematical neural network models, not conscious beings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A physical robot that walks around library basements scanning books.</p>", "feedback": "<p>Incorrect. LLMs are software algorithms running on high-performance cloud servers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A standard dictionary that only looks up word definitions alphabetically.</p>", "feedback": "<p>Incorrect. LLMs generate fluid, multi-paragraph contextual responses and code.</p>"}]}}, {"step": 26, "title": "How AI Can Assist: Transcribing, Summarizing, and Formatting", "content": "**How AI Can Assist: Transcribing, Summarizing, and Formatting**\n\nFor digital humanists, LLMs represent an astonishingly versatile research partner. When used properly, an AI assistant like Claude can accelerate scholarship in several major areas:\n\n1. **Preliminary Transcription & Decipherment:** Helping decipher damaged or difficult manuscript readings by proposing plausible grammatical reconstructions based on context.\n2. **Metadata Extraction:** Reading an unstructured 19th-century Latin catalogue entry and automatically restructuring the dates, authors, and shelfmarks into a tidy table or JSON format.\n3. **Drafting Markup:** Converting plain text into draft TEI XML with proper tags and attributes in seconds, saving hours of manual bracket typing.\n4. **Code Explanation:** Explaining what a confusing Python script does line-by-line in plain English, helping you debug errors.\n\nAI does not replace the scholar's expertise; it acts as a tireless research assistant that handles tedious structural conversions at lightning speed.\n\n**Vocabulary.** *AI-Assisted Philology* — the practice of using artificial intelligence models to assist with transcription, translation, grammatical parsing, and markup in textual scholarship. *Data Restructuring* — converting unstructured text (like a narrative book description) into standardized, structured data (like XML or JSON).\n\n**Takeaway:** AI models can assist scholars by generating draft transcriptions, restructuring messy bibliographic notes into clean XML, and explaining complex computer code.\n\n---", "question": {"name": "26 Question: AI Capabilities in Digital Philology", "questiontext": "<p>Which task is an appropriate and effective use of an AI assistant like Claude in digital scholarship?</p>", "generalfeedback": "<p>AI accelerates structural conversions, preliminary transcription, and draft encoding under human direction.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Generating a draft TEI XML encoding from plain text or restructuring messy catalogue notes into a standardized data table for human review.</p>", "feedback": "<p>Correct. AI models excel at structural conversion, draft transcription, and code explanation when guided by human scholars.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Letting the AI write your entire final thesis without reading any primary sources.</p>", "feedback": "<p>Incorrect. Uncritical reliance on AI violates academic integrity and produces ungrounded scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Allowing the AI to unilaterally decide the true historical meaning of an ancient religion.</p>", "feedback": "<p>Incorrect. Historical interpretation requires human judgment, context, and rigorous evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Using AI to automatically delete all books in the university library.</p>", "feedback": "<p>Incorrect. AI is a research assistant for digital analysis and formatting.</p>"}]}}, {"step": 27, "title": "The Critical Rule: AI Hallucinations and Why the Human Stays in Charge", "content": "**The Critical Rule: AI Hallucinations and Why the Human Stays in Charge**\n\nDespite their impressive fluency, LLMs have a critical, dangerous flaw: **hallucination**. Because an LLM generates text based on statistical plausibility rather than an internal concept of ground-truth fact, it can confidently invent false information that *looks* completely convincing:\n\n- An LLM might invent a non-existent Greek manuscript shelfmark at the British Library.\n- It might cite a fake academic paper written by real professors.\n- It might translate a Latin verb with absolute grammatical confidence, but completely invert the historical meaning.\n\nIn scholarship, an unverified hallucination is fatal. That is why the golden rule of this course is: **The AI proposes, but the human scholar disposes.** \n\nYou must never blindly accept AI output as authoritative truth. Every AI-generated transcription, translation, and XML tag must be audited and verified against the primary historical evidence by a human editor.\n\n**Vocabulary.** *Hallucination (AI)* — a confident response generated by an AI model that contains false, fabricated, or inaccurate information not grounded in its source data. *Human-in-the-Loop (HITL)* — a workflow design where automated or AI processes require human review, judgment, and approval at critical decision points.\n\n**Takeaway:** AI models frequently hallucinate plausible-sounding falsehoods; human scholars must always audit and verify every AI-generated claim against primary evidence.\n\n---", "question": {"name": "27 Question: The Risk of AI Hallucinations", "questiontext": "<p>What is an **AI hallucination**, and why is it dangerous in historical scholarship?</p>", "generalfeedback": "<p>AI models can fabricate convincing falsehoods; every claim must be audited by a human scholar.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When an AI model generates plausible-sounding but completely fabricated facts, citations, or manuscript shelfmarks with high confidence.</p>", "feedback": "<p>Correct. Hallucinations look convincing but are factually false, making human verification against primary evidence essential.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When an AI model creates beautiful graphic illustrations of mythological monsters.</p>", "feedback": "<p>Incorrect. Hallucination refers specifically to generating false or fabricated factual information.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the computer monitor turns purple because of low battery power.</p>", "feedback": "<p>Incorrect. Hallucination is a model inference error, not a hardware display glitch.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When an AI model refuses to answer a question in English.</p>", "feedback": "<p>Incorrect. Hallucination is the fluent generation of false statements.</p>"}]}}, {"step": 28, "title": "What is Antigravity? An Agentic Workspace for Pair-Programming", "content": "**What is Antigravity? An Agentic Workspace for Pair-Programming**\n\nIn traditional computing, you use software in isolation: you type code in one window, copy it into a chatbot web browser in another window, and paste the answer back. This back-and-forth copying is slow and disconnects the AI from your actual project environment.\n\nIn this course, we work in an advanced environment called **Antigravity** (built on Google's advanced agentic developer architecture). Antigravity is an **agentic pair-programming workspace**. \n\nIn Antigravity:\n\n- The AI agent can see your project files directly (reading the exact XML, Python, and Markdown files on your disk).\n- You collaborate with the AI through natural-language conversation, asking it to inspect files, run automated verification linters, and propose edits.\n- The AI creates structured implementation plans and highlights changes for your review before executing them.\n\nAntigravity models the future of digital humanities collaboration: a seamless partnership where the human scholar directs the research questions and evaluates the historical evidence, while the AI agent assists with technical execution and automated consistency checks.\n\n**Vocabulary.** *AI Agent* — an artificial intelligence system that can perceive its computational environment, use tools (like reading files and running terminal commands), and take autonomous actions to achieve a specified goal. *Pair Programming* — a collaborative software development technique where two developers (or a human and an AI agent) work together on the same codebase simultaneously.\n\n**Takeaway:** Antigravity is an agentic pair-programming workspace where human scholars and AI agents collaborate directly within the project filesystem to build, test, and audit digital editions.\n\n---", "question": {"name": "28 Question: The Antigravity Workspace Environment", "questiontext": "<p>How does an agentic pair-programming workspace like **Antigravity** differ from a standard web chatbot window?</p>", "generalfeedback": "<p>Antigravity provides direct filesystem integration and tool access for collaborative human-AI pair programming.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>In Antigravity, the AI agent interacts directly with the project files and terminal on your disk, collaborating with the scholar to plan, edit, lint, and verify real files.</p>", "feedback": "<p>Correct. Antigravity integrates AI directly into the developer environment and filesystem for structured, verifiable pair-programming.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Antigravity completely locks the human scholar out of the computer.</p>", "feedback": "<p>Incorrect. The human scholar directs all research goals and reviews all implementation plans.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Antigravity requires users to float in zero-gravity space capsules.</p>", "feedback": "<p>Incorrect. 'Antigravity' is the software environment name for agentic development.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Antigravity only works when editing Microsoft PowerPoint slide decks.</p>", "feedback": "<p>Incorrect. Antigravity operates across full codebases, XML trees, Python scripts, and markdown.</p>"}]}}, {"step": 29, "title": "The Three-Step Method of This Course: Manual -> Automated -> AI-Assisted", "content": "**The Three-Step Method of This Course: Manual -> Automated -> AI-Assisted**\n\nTo prepare you for the intellectual journey of this semester, RELS 398 is structured around a rigorous, comparative methodology called the **Three-Step Comparative Cycle**. Almost every module in this course walks through three distinct phases:\n\n1. **Tuesday (Manual Foundations):** We work by hand, establishing the ground truth of scholarship. You will read raw manuscript images, transcribe letters with your own eyes, and experience the physical challenges that scribes and traditional editors faced.\n2. **Wednesday (Deterministic & Rule-Based Tools):** We apply classical computational methods—running Python scripts, compiling TEI XML, executing CollateX algorithms, and testing against strict schemas. These tools follow rigid, predictable mathematical rules.\n3. **Friday (AI-Assisted & Large Language Models):** We deploy generative AI models (like Claude) to perform the same task. We measure the AI's speed, evaluate its accuracy, audit its hallucinations, and calculate error rates (CER and WER) against our Tuesday manual ground truth.\n\nBy comparing all three methods every week, you will discover exactly where human judgment is irreplaceable, where rule-based algorithms excel, and where AI provides genuine scholarly leverage.\n\n**Vocabulary.** *Ground Truth* — the empirically verified, authoritative baseline data against which automated and AI models are measured. *Deterministic Algorithm* — an algorithm that given the same input will always produce the exact same output every time. *Comparative Methodology* — a research strategy that systematically compares different techniques (manual, algorithmic, AI) on the same dataset to evaluate their strengths and weaknesses.\n\n**Takeaway:** RELS 398 follows a Three-Step Comparative Cycle (Tuesday Manual $\nightarrow$ Wednesday Deterministic $\nightarrow$ Friday AI-Assisted) to teach you how traditional philology, rule-based algorithms, and modern AI intersect.\n\n---", "question": {"name": "29 Question: The Three-Step Comparative Methodology", "questiontext": "<p>What is the educational purpose of the **Three-Step Comparative Cycle** (Tuesday Manual $\nightarrow$ Wednesday Deterministic $\nightarrow$ Friday AI-Assisted) in RELS 398?</p>", "generalfeedback": "<p>The Three-Step Cycle systematically compares manual, algorithmic, and AI methods on identical historical texts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To understand how traditional human philology, rule-based computational algorithms, and generative AI compare, identifying where human judgment is essential and where automation provides leverage.</p>", "feedback": "<p>Correct. Comparing manual ground truth against deterministic code and AI models teaches students the strengths, error rates, and limitations of each approach.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force students to do three times as much homework as other classes.</p>", "feedback": "<p>Incorrect. The cycle provides a structured comparative methodology for understanding digital tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prove that computers are always superior to human scholars in every way.</p>", "feedback": "<p>Incorrect. The cycle demonstrates where algorithms fail and why human expertise is irreplaceable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To teach students how to build hardware computer chips by hand.</p>", "feedback": "<p>Incorrect. The course focuses on digital methods for historical documents.</p>"}]}}, {"step": 30, "title": "Synthesis: Building Your Toolkit for the Semester Ahead", "content": "**Synthesis: Building Your Toolkit for the Semester Ahead**\n\nLook back at what you have explored in this opening lesson. You have moved from the passive consumer mindset of word processors to the active, empowered stance of a digital humanist.\n\nYou now understand the complete anatomy of our digital scriptorium:\n\n- **Plain Text and VS Code:** The durable, transparent foundation where all our data lives.\n- **Git and Version Control:** The project time machine that protects your work and records your scholarly reasoning.\n- **XML and the TEI:** The international language of structured manuscript markup that preserves cultural heritage.\n- **Python:** The versatile script engine that automates repetitive textual tasks.\n- **Claude and Antigravity:** The AI assistants and agentic workspace that augment your analytical reach while keeping you firmly in the editorial driver's seat.\n\nYou do not need to memorize every command or XML tag today. Each tool will be practiced step-by-step in the weeks ahead. You are now equipped with the conceptual roadmap for the digital methods of the 21st century. Welcome to the scriptorium—let us begin building!\n\n**Vocabulary.** *Computational Philology* — the application of computational methods, software tools, and data structures to the historical study of language, texts, and manuscripts. *Digital Scriptorium* — a modern digital workspace for transcribing, editing, and publishing historical documents using computational tools.\n\n**Takeaway:** Digital scholarship unites plain text, Git version control, TEI XML markup, Python automation, and AI pair-programming into a powerful, transparent workspace for preserving and studying historical documents.", "question": {"name": "30 Question: Synthesis of the Digital Scriptorium", "questiontext": "<p>Which statement best summarizes the overarching philosophy of the digital scholar's toolkit introduced in Lesson 1.1?</p>", "generalfeedback": "<p>The digital scholar's workbench unites open plain-text tools, version control, markup, and AI to advance humanistic research.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Digital scholarship combines transparent plain text, Git version control, TEI XML markup, Python scripting, and AI collaboration to create durable, open, and reproducible historical research.</p>", "feedback": "<p>Correct. These open tools unite into a transparent digital scriptorium where human scholars maintain complete control over data and evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digital scholarship means replacing human critical thinking with automated smartphone apps.</p>", "feedback": "<p>Incorrect. Digital methods augment and deepen human critical inquiry.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digital scholarship requires storing all historical knowledge inside proprietary corporate databases.</p>", "feedback": "<p>Incorrect. Digital humanities champions open standards and software longevity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digital scholarship is only relevant for computer science majors, not humanities students.</p>", "feedback": "<p>Incorrect. Digital methods empower historians, literature scholars, and linguists to preserve and study cultural heritage.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
