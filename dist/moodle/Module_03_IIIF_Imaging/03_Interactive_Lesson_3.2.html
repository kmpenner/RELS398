 this term — the equipment is not\navailable. You may well be able to *use* them, and the distinction matters for\nyour own edition.\n\nWhere to look:\n\n- **The manifest itself.** Additional captures frequently appear as extra canvases or as `Choice` alternatives, without being surfaced in the default viewer. Search the JSON for `ultraviolet`, `infrared`, `UV`, `IR`, `processed`, `PCA`, or `multispectral`.\n- **Dedicated project sites.** Major palimpsest projects publish separately from the holding library's catalogue.\n- **The Sinai Palimpsests Project**, which has published extensive multispectral data for St Catherine's Monastery manuscripts.\n- **Institutional imaging labs**, whose datasets sometimes exist but are not linked from the catalogue record.\n- **Direct enquiry.** Curators frequently hold imaging data that has never been published, and a polite, specific request from a student with a clear purpose is often answered.\n\nThe last route is worth attempting if your passage has damaged or erased regions.\nAn email stating the manuscript, the folios, your purpose, and your institutional\naffiliation costs nothing and occasionally yields a dataset.\n\nIf no multispectral data exists for your manuscript — which is the common case —\nyou are not disadvantaged for this course. Weeks 4 through 13 proceed from\nvisible-light images. This week's content remains necessary because it is what\nlets you read the imaging literature on your manuscript, evaluate published\nrecovered readings, and understand what the images in your edition are and are not.\n\n**Takeaway:** Check your manifest for unlisted spectral layers,\nand ask curators directly; if none exists, the course proceeds from visible light.\n\n---", "question": {"name": "22 Question: Practical Access to Multispectral Data", "questiontext": "<p>If an institution's public web catalogue displays only visible-light images, where can a researcher look to find existing multispectral captures for a manuscript?</p>", "generalfeedback": "<p>Check your manifest for unlisted spectral layers, and ask curators directly; if none exists, the course proceeds from visible light.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Inspect the IIIF manifest JSON for unlisted <code>Choice</code> items or canvases, check dedicated project portals (e.g., Sinai Palimpsests Project), or contact curators directly.</p>", "feedback": "<p>Correct. Spectral data is often present in manifest data, specialized portals, or institutional archives even when omitted from basic catalogue viewers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Attempt to hack the institution's private cloud servers to download raw sensor logs.</p>", "feedback": "<p>Incorrect. Legitimate discovery relies on manifest inspection, published project repositories, and polite direct curator enquiry.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Assume that no manuscript digitized before 2025 could ever have undergone multispectral capture.</p>", "feedback": "<p>Incorrect. Major multispectral imaging campaigns have operated since the late 1990s.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Purchase commercial satellite imaging subscriptions to photograph the library building from orbit.</p>", "feedback": "<p>Incorrect. Satellite photography cannot image indoor manuscript vaults.</p>"}]}}, {"step": 23, "title": "Beyond Optics: XRF and Materials Analysis", "content": "**Beyond Optics: XRF and Materials Analysis**\n\nThe Archimedes gold-leaf problem introduced a technique that goes beyond\nphotography, and it is worth situating within the wider range of manuscript\nanalysis.\n\n**X-ray fluorescence** (XRF) imaging does not measure reflected light. An X-ray\nbeam excites atoms in the sample, which emit characteristic X-rays at energies\nspecific to each element. Mapping those emissions produces an image of *elemental\ndistribution* — where the iron is, where the copper is — rather than an image of\nappearance (Easton et al., 2003).\n\nFor iron-gall ink this is decisive: the ink contains iron, the parchment does not,\nand iron's characteristic emission passes through overlying material that stops\nvisible light entirely. Hence the recovery of Archimedes text beneath gold leaf.\n\n| Technique | Measures | Reveals |\n| --- | --- | --- |\n| Multispectral imaging | Reflectance across wavelengths | Ink residue; layered texts |\n| RTI | Surface response to light direction | Relief; dry-point; erasure |\n| XRF | Elemental composition | Ink chemistry through obscuring layers |\n| Raman spectroscopy | Molecular vibration | Pigment identification |\n| Fibre optic reflectance | Reflectance spectra at points | Pigment and binder characterization |\n\nClausen et al. (2026) argue that these heterogeneous datasets — multispectral,\nXRF, Raman — belong in a unified repository alongside the TEI encoding and\nstructural metadata, because the questions worth asking span them. Dating an ink\nby its chemistry bears on the dating of a hand; identifying a pigment bears on\nlocalization; and both bear on the textual argument.\n\nThis is where the canvas abstraction pays off most fully. An elemental map, a\nspectral composite, and a transcribed line can all target the same canvas region —\nwhich is what allows a chemical observation and a palaeographic one to be stated\nabout the same place.\n\n**Takeaway:** XRF maps elemental composition rather than\nappearance, and the canvas is what lets chemical and textual observations refer to\nthe same place on the page.\n\n---", "question": {"name": "23 Question: Beyond Optics: XRF and Materials Analysis", "questiontext": "<p>How does X-ray Fluorescence (XRF) spectroscopy differ fundamentally from multispectral optical imaging?</p>", "generalfeedback": "<p>XRF maps elemental composition rather than appearance, and the canvas is what lets chemical and textual observations refer to the same place on the page.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>XRF measures secondary X-ray emissions characteristic of specific chemical elements (e.g., iron, copper) rather than reflected optical photons, mapping elemental composition.</p>", "feedback": "<p>Correct. XRF is an elemental analysis technique mapping specific atoms, whereas multispectral imaging measures optical reflectance and fluorescence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XRF measures the optical color temperature of ambient room lighting in Kelvin.</p>", "feedback": "<p>Incorrect. XRF measures characteristic elemental X-ray emissions, not room lighting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XRF destroys the manuscript by vaporizing small sections of parchment with a thermal laser.</p>", "feedback": "<p>Incorrect. XRF is a non-destructive spectroscopic imaging method.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XRF only works on modern synthetic plastic substrates produced after 1950.</p>", "feedback": "<p>Incorrect. XRF is widely used on historical manuscripts, pigments, and metallic inks.</p>"}]}}, {"step": 24, "title": "The Manuscript as Data", "content": "**The Manuscript as Data**\n\nStep back to the conceptual claim these techniques collectively support, because\nit reframes what your edition is.\n\nThe traditional model treats a manuscript as a *carrier* of text. The text is the\nobject of study; the parchment is the medium that conveys it; and the editor's job\nis to extract the text and present it accurately. Codicological description\nbelongs to the introduction, as context.\n\nThe techniques in this lesson do not fit that model. They recover text from\nchemical residue, from surface topography, from elemental distribution — from\nproperties of the object that are not text at all, and would be discarded as\nirrelevant medium under the traditional view. The Archimedes recovery worked\nprecisely because the manuscript was treated as a chemical and topological matrix\nrather than as a surface bearing writing (Easton et al., 2003).\n\nThe alternative model treats the manuscript as a *dataset* of which the visible\ntext is one projection. Other projections — spectral, topographic, elemental —\ncarry information that is often complementary and occasionally the only surviving\nwitness to the text.\n\nThis is not merely a technical shift. It changes what counts as evidence in a\ntextual argument. A claim about a reading may now be supported by an elemental\nmap or a spectral component rather than by an appeal to what an examiner can see,\nand evaluating such a claim requires understanding how the evidence was produced —\nwhich is why this lesson exists in a philology course.\n\n**Takeaway:** Recovery techniques treat the manuscript as a\ndataset with many projections rather than a surface bearing text, which changes\nwhat can count as evidence for a reading.\n\n---", "question": {"name": "24 Question: The Manuscript as Data", "questiontext": "<p>How does computational palaeography reframe the relationship between a physical manuscript and its textual content?</p>", "generalfeedback": "<p>Recovery techniques treat the manuscript as a dataset with many projections rather than a surface bearing text, which changes what can count as evidence for a reading.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It treats the manuscript as a multi-dimensional physical and chemical dataset of which the visible text is only one projection among several (topographic, spectral, elemental).</p>", "feedback": "<p>Correct. The manuscript is understood as a rich material matrix carrying multiple recoverable data signals, rather than a mere passive surface for writing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It asserts that physical manuscripts have zero historical value once converted into text strings.</p>", "feedback": "<p>Incorrect. Computational palaeography emphasizes the physical and material matrix of the object.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It claims that texts were generated by ancient computer algorithms rather than human scribes.</p>", "feedback": "<p>Incorrect. The framework applies modern computational analysis to historical human artifacts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It restricts manuscript studies strictly to financial accounting and inventory management.</p>", "feedback": "<p>Incorrect. The paradigm enriches philological, codicological, and historical analysis.</p>"}]}}, {"step": 25, "title": "Limits and Honest Reporting", "content": "**Limits and Honest Reporting**\n\nBalance is owed. The cases in this lesson are the celebrated successes, and\nsuccess is not the usual outcome.\n\nMultispectral imaging fails frequently. Where erasure was thorough, no residue may\nremain. Where the substrate is papyrus rather than parchment, fluorescence\nbehaviour differs and UV recovery is often ineffective. Where ink was\ncarbon-based, the UV mechanism does not apply, since carbon does not present the\nfluorescence contrast that iron-gall does. Where damage is severe enough, the\nsignal is simply absent.\n\n| Condition | Likelihood of recovery | Reason |\n| --- | --- | --- |\n| Iron-gall on parchment, lightly washed | Good | Residue remains; strong UV contrast |\n| Iron-gall on parchment, thoroughly scraped | Variable | Depends on penetration into the substrate |\n| Carbon ink, obscured by stains | Good with IR | Carbon absorbs; stains become transparent |\n| Carbon ink, erased | Poor | Sits on the surface; leaves little residue |\n| Any ink on papyrus | Variable | Different fluorescence behaviour |\n| Fire or water damage, severe | Poor | Substrate structure destroyed |\n\nReporting failure is part of the method. A project that images a palimpsest and\nrecovers nothing has produced a real result — the negative finding constrains what\nfuture work should attempt, and prevents the same folios being reimaged\nrepeatedly. In practice negative results are underreported, which means the\nliterature overstates the technique's reliability.\n\nApply the same standard in your own edition. If you attempt to resolve a\nquestionable reading against a spectral layer and it remains unresolved, record\nthat. An `<unclear>` element with `@cert=\"low\"` and a note that UV was consulted\nwithout resolution is a more useful scholarly statement than a confident reading\nor a silent omission.\n\n**Takeaway:** Recovery often fails, and a documented negative\nresult is a real finding — record what you consulted even when it resolved\nnothing.\n\n---", "question": {"name": "25 Question: Limits and Honest Reporting", "questiontext": "<p>Why is the reporting of negative results (e.g., imaging techniques that failed to resolve erased text) essential in manuscript scholarship?</p>", "generalfeedback": "<p>Recovery often fails, and a documented negative result is a real finding — record what you consulted even when it resolved nothing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Documenting failed attempts prevents redundant reimaging of unresponsive folios, constrains methodological claims, and provides an honest record of evidence.</p>", "feedback": "<p>Correct. Documenting negative findings bounds what is recoverable and prevents wasted effort, providing transparent scholarly evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Negative results automatically void the academic credentials of the research team.</p>", "feedback": "<p>Incorrect. Negative results are normal, valuable scientific findings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Journals are legally required to fine researchers who publish unreadable manuscript images.</p>", "feedback": "<p>Incorrect. Transparent reporting of negative findings is standard scholarly best practice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Negative results prove that the manuscript is a modern forgery.</p>", "feedback": "<p>Incorrect. Severe physical erasure, substrate degradation, or carbon ink can defeat UV recovery on authentic manuscripts.</p>"}]}}, {"step": 26, "title": "An Exercise for This Meeting", "content": "**An Exercise for This Meeting**\n\nWork through the following on your own manuscript.\n\n- Search both witnesses' manifests for non-visible-light or processed images, using the search terms in section 22.\n- If any exist, load the manifest into Mirador and confirm whether a layer selector appears.\n- If a `Choice` is present, examine its labels and record what imaging conditions are documented.\n- Identify the most damaged or least legible region of your passage.\n- Compare that region across every available layer, at full zoom.\n- Record what each layer does and does not resolve.\n- Search the scholarly literature for imaging work on your manuscript.\n- Commit your findings as a note in your repository.\n\nIf no additional layers exist, do the second half anyway. Identify the least\nlegible region of your passage under visible light, record precisely what is\nuncertain about it, and note what imaging technique would be appropriate given the\nink type and damage. That is a real scholarly assessment, and it will inform your\n`<unclear>` encoding in Week 4.\n\nAdd the results to `images/SOURCES.md` alongside yesterday's record and commit\nwith a Conventional Commits message. By Friday this file documents your edition's\nentire image basis.\n\n**Takeaway:** Assess the least legible region of your passage\nagainst every layer available, and record what remains unresolved.\n\n---", "question": {"name": "26 Question: An Exercise for This Meeting", "questiontext": "<p>When assessing the least legible region of your chosen manuscript, what should you do if no multispectral layers are available?</p>", "generalfeedback": "<p>Assess the least legible region of your passage against every layer available, and record what remains unresolved.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Document the specific ambiguities under visible light, analyze the ink type and damage, and formulate a methodological hypothesis about which spectral technique would be appropriate.</p>", "feedback": "<p>Correct. Assessing visible-light ambiguities and determining suitable imaging modalities is authentic scholarly work that informs <unclear> encoding.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Invent fictional Greek readings to fill in all missing words without notation.</p>", "feedback": "<p>Incorrect. Scholarly editions document uncertainty rather than fabricating readings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Immediately abandon your passage and select a modern twentieth-century printed book instead.</p>", "feedback": "<p>Incorrect. Course editions proceed from visible-light images with proper encoding of illegibility.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Apply graphic design blur filters to make the rest of the manuscript equally illegible.</p>", "feedback": "<p>Incorrect. The exercise requires rigorous assessment of illegibility, not degrading clean data.</p>"}]}}, {"step": 27, "title": "Reading Imaging Scholarship Critically", "content": "**Reading Imaging Scholarship Critically**\n\nYou will encounter published recovered readings, and you need to be able to\nevaluate them rather than accept them.\n\nQuestions to ask of any published recovery:\n\n| Question | What a weak answer looks like |\n| --- | --- |\n| What wavelengths were captured? | Unspecified, or \"multispectral imaging was used\" |\n| What transformation produced this image? | Not stated |\n| Which components, and how assigned to channels? | Not stated |\n| Was the reading confirmed by another method? | Only one composite is shown |\n| Who read it, and with what expertise? | No palaeographer involved |\n| Was the reading expected in advance? | Confirms a prior hypothesis, with no discussion |\n| Are negative results reported? | Only successful folios are shown |\n\nPublications answering most of these poorly should be treated as preliminary\nreports rather than as established readings. This is not scepticism about the\ntechniques, which are sound; it is the ordinary requirement that a method be\ndescribed sufficiently for a reader to evaluate its application.\n\nThe sixth row is the subtle one and connects to section 18. A recovery that\nconfirms an expected reading is the case where confirmation bias operates most\nstrongly, and a careful publication acknowledges this — typically by having the\nreading confirmed by someone unaware of the expectation.\n\nWhere a published recovery bears on your own passage, cite it with its\nqualifications intact. \"Smith reads X, from an ICA composite; components and\nparameters unreported\" is honest and lets your reader weigh it. Repeating the\nreading as established fact passes along a confidence the evidence may not support.\n\n**Takeaway:** Evaluate published recoveries by whether the\nimaging and processing are described well enough for you to assess them, and cite\nthem with their qualifications intact.\n\n---", "question": {"name": "27 Question: Reading Imaging Scholarship Critically", "questiontext": "<p>What constitutes a critical weakness in a published article claiming to have recovered an erased historical reading through multispectral imaging?</p>", "generalfeedback": "<p>Evaluate published recoveries by whether the imaging and processing are described well enough for you to assess them, and cite them with their qualifications intact.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Failing to state capture wavelengths, transformation methods, component selection, channel assignments, or whether independent palaeographical verification was performed.</p>", "feedback": "<p>Correct. Without capture and processing parameters, published recoveries cannot be independently tested, evaluated, or verified.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The authors published their findings in a peer-reviewed open-access journal.</p>", "feedback": "<p>Incorrect. Open-access publication is standard; the weakness is omission of technical processing parameters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manuscript was written in ancient Greek rather than modern English.</p>", "feedback": "<p>Incorrect. Historical texts are the standard objects of study in this field.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The authors included high-resolution color figures alongside their transcription.</p>", "feedback": "<p>Incorrect. High-resolution figures are desirable; omitting processing provenance is the defect.</p>"}]}}, {"step": 28, "title": "Preparing for Lesson 3.3", "content": "**Preparing for Lesson 3.3**\n\nFriday assembles both meetings into a working artefact: the IIIF manifest for\nyour passage, bound to your TEI transcription by canvas coordinates.\n\nEverything so far is input to it. Lesson 3.1 gave the structural model — manifest,\ncanvas, annotation, fragment selector. This lesson gave the imaging model — what\nthe images are, how they were produced, and how alternatives are expressed as a\n`Choice`. Friday joins them and connects the result to your TEI.\n\nBring the following:\n\n- Manifest URLs for both witnesses, recorded and verified.\n- Canvas identifiers and dimensions for every folio of your passage.\n- Rights statements and required attribution text.\n- A record of any additional spectral layers and what they show.\n- Your Week 2 TEI header, in a valid state.\n- Your assessment of the least legible region of your passage.\n\nThe TEI header is required because Friday binds the manifest to the encoding, and\nthat is also **the Cataloguing & Metadata Assignment, due Friday September 18** —\nthe same day. Ensure the header validates before Friday's meeting; debugging\nschema errors while attempting to build coordinate bindings is a poor use of the\nsession.\n\n**Takeaway:** Friday joins the structural and imaging models to\nyour TEI, and the cataloguing assignment is due the same day — validate your\nheader beforehand.\n\n---", "question": {"name": "28 Question: Preparing for Lesson 3.3", "questiontext": "<p>Why must a student ensure their Week 2 TEI header is valid before beginning Friday's Lesson 3.3 meeting?</p>", "generalfeedback": "<p>Friday joins the structural and imaging models to your TEI, and the cataloguing assignment is due the same day — validate your header beforehand.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Lesson 3.3 binds canvas coordinates directly to the TEI document; debugging schema errors during binding creation disrupts the workflow for the Cataloguing Assignment due that day.</p>", "feedback": "<p>Correct. Coordinate binding builds directly upon a valid TEI document; pre-validating the header ensures focus remains on spatial integration.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Invalid TEI headers cause permanent hard drive data corruption during Git commits.</p>", "feedback": "<p>Incorrect. Schema validation errors cause validation failures, not hardware corruption.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>TEI schemas automatically delete all image files stored on remote university servers.</p>", "feedback": "<p>Incorrect. TEI validation operates locally on XML files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Friday's session requires converting all TEI documents into raw binary PostScript files.</p>", "feedback": "<p>Incorrect. Lesson 3.3 works with TEI XML <facsimile> and <surface> elements.</p>"}]}}, {"step": 29, "title": "Consolidating the Week's Concepts", "content": "**Consolidating the Week's Concepts**\n\nA summary table of what has been established across both meetings, which is worth\nholding as a whole before Friday.\n\n| Concept | Established in | Function in your edition |\n| --- | --- | --- |\n| Image API | 3.1 | Retrieve any region of any folio at any size |\n| Presentation API | 3.1 | Describe your passage as a structured object |\n| Canvas | 3.1 | The coordinate space every layer and annotation targets |\n| Fragment selector | 3.1 | Address the exact region supporting a reading |\n| Raking light | 3.2 | Reveal ruling, erasure, and dry-point |\n| RTI | 3.2 | Model surface relief; recover ink-less writing |\n| Multispectral imaging | 3.2 | Recover erased or obscured text |\n| PCA, ICA, MNF | 3.2 | Separate ink from parchment and over-text |\n| False-colour composite | 3.2 | Present computed components legibly |\n| `Choice` | 3.2 | Express spectral alternatives on one canvas |\n| Provenance documentation | 3.2 | Make processed images evaluable as evidence |\n\nThe unifying idea is that the canvas is a shared coordinate space. Every technique\nin the right-hand column ultimately produces something that targets a region of a\ncanvas — an image painted onto it, an annotation attached to it, a transcription\nbound to it. That is what allows the imaging, the transcription, the apparatus,\nand the commentary to be parts of one object rather than four separate documents\nabout the same manuscript (Clausen et al., 2026).\n\nKeep that in view on Friday. The manifest you build is not a container for\npictures; it is the coordinate framework the rest of your edition attaches to.\n\n**Takeaway:** Every technique this week produces something that\ntargets a canvas region, which is what makes the imaging, transcription, and\napparatus one object.\n\n---", "question": {"name": "29 Question: Consolidating the Week's Concepts", "questiontext": "<p>What core concept unifies the Image API, Presentation API, multispectral imaging, and TEI facsimile encoding?</p>", "generalfeedback": "<p>Every technique this week produces something that targets a canvas region, which is what makes the imaging, transcription, and apparatus one object.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The IIIF Canvas serves as a shared coordinate space that image layers, spectral alternatives, annotations, and transcribed text lines all target simultaneously.</p>", "feedback": "<p>Correct. The canvas coordinate space is the central spine connecting pixel delivery, spectral evidence, and textual transcription.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All digital humanities tools must be written in the Java programming language.</p>", "feedback": "<p>Incorrect. Tools span Python, JavaScript, XML, and JSON-LD across open web standards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manuscripts must be physically destroyed after digitization to reduce library storage costs.</p>", "feedback": "<p>Incorrect. Preservation of original codices is paramount; digital surrogates serve research and access.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digital editions are prohibited from citing printed scholarly editions or catalogues.</p>", "feedback": "<p>Incorrect. Digital editions engage with and incorporate print scholarship and catalogue traditions.</p>"}]}}, {"step": 30, "title": "Synthesis: Instruments, Not Photographs", "content": "**Synthesis: Instruments, Not Photographs**\n\nThe claim this meeting has developed is that the digital surrogate is not a\npicture of the manuscript but the output of an instrument applied to it.\n\nA visible-light photograph is already an instrument's output, with a spectral\nresponse, a dynamic range, and a colour rendering that are properties of the\ncamera rather than the object. A UV fluorescence capture is more obviously so. An\nICA composite is unambiguously so: nothing in it corresponds to what any eye could\nsee under any illumination, and its brightness values represent computed\nstatistical quantities (Easton et al., 2003).\n\nTwo consequences follow, and they pull in opposite directions.\n\nThe first is expansive. Instruments can exceed the eye. Erased text becomes\nlegible; ink-less writing is recovered from surface relief; text is read through\ngold leaf by elemental fluorescence. Readings that were permanently lost become\navailable, and the Archimedes treatises are the demonstration (Easton et al.,\n2003).\n\nThe second is restrictive. An instrument's output must be interpreted in light of\nhow it was produced, and an image whose production is undocumented cannot be\nevaluated. Statistical enhancement amplifies noise as readily as signal, and\nexpectation makes false letterforms easy to see. The discipline that makes\nrecovery trustworthy is documentation and cross-verification, not the technique\nitself.\n\nBoth are why this lesson sits in a philology course rather than a physics course.\nYou will not operate this equipment. You will read, cite, and rely on its output,\nand doing that responsibly requires knowing what the output is.\n\n**For Friday.** Bring the six items listed in section 28. **The Cataloguing &\nMetadata Assignment is due Friday September 18**, and Friday's meeting builds your\nmanifest and binds it to your TEI.\n\n**Takeaway:** Every manuscript image is an instrument's output,\nwhich is why it can show more than the eye and why it cannot be evaluated without\nits documentation.\n\n---\n\n## References\n\nClausen, H., Brenner, S., Schreiner, M., & Vetter, W. (2026). Multimodal\nmanuscript representation: Toward an open repository for manuscript research\ndata. *The European Physical Journal Plus*.\nhttps://doi.org/10.1140/epjp/s13360-025-07133-y\n\nEaston, R. L., Knox, K. T., & Christens-Barry, W. A. (2003). Multispectral\nimaging of the Archimedes palimpsest. In *32nd Applied Imagery Pattern\nRecognition Workshop*. https://doi.org/10.1109/AIPR.2003.1284258\n\neScriptorium/Kraken. (2024). *eScriptorium platform documentation*.\nhttps://escriptorium.eu/about\n\nGriffin, S. M. (2023). Digital libraries, epigraphy and paleography: Bringing\nrecords from the distant past to the present. *International Journal on Digital\nLibraries*. https://doi.org/10.1007/s00799-023-00381-2\n\nIIIF Consortium. (2020). *IIIF Presentation API 3.0 specification*.\nhttps://iiif.io/api/presentation/3.0/\n\nMalzbender, T., Gelb, D., & Wolters, H. (2001). *Polynomial texture maps*.\nHewlett-Packard Laboratories.\n\nTEI Consortium. (2026). *TEI P5: Guidelines for electronic text encoding and\ninterchange*. https://www.tei-c.org/release/doc/tei-p5-doc/en/html/", "question": {"name": "30 Question: Synthesis: Instruments, Not Photographs", "questiontext": "<p>Why is a digital surrogate considered the output of a scientific instrument rather than a passive photograph?</p>", "generalfeedback": "<p>Every manuscript image is an instrument's output, which is why it can show more than the eye and why it cannot be evaluated without its documentation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Every surrogate reflects sensor responses, illumination physics, and statistical transformations that can exceed visual limits but require explicit documentation to be evaluated as evidence.</p>", "feedback": "<p>Correct. Digital images are scientific datasets whose evidential validity depends on documenting how optical and computational instruments generated them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digital cameras take pictures using mechanical film that is chemically developed in darkrooms.</p>", "feedback": "<p>Incorrect. Digital imaging uses optoelectronic sensors and computational processing pipelines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digital surrogates are legally classified as medical diagnostic equipment under health regulations.</p>", "feedback": "<p>Incorrect. The classification is epistemological and methodological within textual science.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scientific instruments can never be used to study humanities objects like literary manuscripts.</p>", "feedback": "<p>Incorrect. Modern philology actively uses imaging physics, spectroscopy, and statistical computing.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
</html>
