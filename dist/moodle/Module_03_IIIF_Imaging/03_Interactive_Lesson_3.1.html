 are not required to implement Content Search this term. It is worth knowing\nthat the capability is standardized, because it shapes what you should aim at:\nif your transcription is bound to canvas coordinates — which is precisely what\nLesson 3.3 does — then a searchable image-linked edition is a matter of\nconfiguration rather than of redesign.\n\n**Takeaway:** Binding your transcription to canvas coordinates\nnow is what makes a searchable, image-linked edition possible later.\n\n---", "question": {"name": "22 Question: Content Search and Navigation APIs", "questiontext": "<p>How does binding a TEI transcription to canvas coordinates enable the functionality of the IIIF Content Search API?</p>", "generalfeedback": "<p>Binding your transcription to canvas coordinates now is what makes a searchable, image-linked edition possible later.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Search queries matched against transcribed text can return exact canvas coordinates, allowing a viewer to highlight the matching word directly on the manuscript image.</p>", "feedback": "<p>Correct. Content Search navigates from textual query to spatial coordinates on the canvas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows search engines to rewrite the underlying Greek text into modern standardized orthography automatically.</p>", "feedback": "<p>Incorrect. Content Search indexes text annotations and locates their coordinates on the image.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically crawls external library databases to buy physical copies of missing manuscripts.</p>", "feedback": "<p>Incorrect. Content Search searches annotations attached to a specific manifest.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts raster images into searchable PDF files by embedding OCR text directly into the camera raw files.</p>", "feedback": "<p>Incorrect. The IIIF Content Search API searches web annotations targeted at canvas coordinates.</p>"}]}}, {"step": 23, "title": "Where IIIF Fits in the Course Pipeline", "content": "**Where IIIF Fits in the Course Pipeline**\n\nSituate this week within the whole, because the imaging layer is what several\nlater weeks silently depend on.\n\n| Week | Operation | Dependency on IIIF |\n| --- | --- | --- |\n| 3 | Build the manifest | The work itself |\n| 4 | Transcription and HTR | Transkribus and eScriptorium ingest manifests directly |\n| 5 | Reconciliation | Comparing readings against the image requires deep zoom |\n| 6 | Normalization | Checking orthography against the manuscript |\n| 7 | Collation | Witnesses juxtaposed in Mirador |\n| 8 | Apparatus | Each variant anchored to its canvas region |\n| 12 | Commentary | Reproducing the exact region under discussion |\n| 13 | Publication | Viewer integration; the edition's image layer |\n\nThe Week 4 dependency is the most immediate. HTR platforms ingest images by\nmanifest URI rather than by file upload, which means the manifest you build on\nFriday is the input to next week's transcription work (eScriptorium/Kraken,\n2024). A manifest that is malformed or incomplete on Friday is a blocked Tuesday.\n\nThe Week 8 dependency is the most interesting scholarly one. An apparatus entry\nrecording a variant reading can carry the canvas region showing that reading in\neach witness — so that a reader evaluating your editorial decision sees the\nparchment rather than taking your word for it. That is a genuine advance over\nprint, where the apparatus can only assert.\n\n**Takeaway:** Friday's manifest is Tuesday's HTR input, and\nevery later week's verification against the manuscript runs through it.\n\n---", "question": {"name": "23 Question: Where IIIF Fits in the Course Pipeline", "questiontext": "<p>In the RELS 398 course workflow, how does the completed IIIF manifest directly enable Week 4's transcription work?</p>", "generalfeedback": "<p>Friday's manifest is Tuesday's HTR input, and every later week's verification against the manuscript runs through it.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Handwritten Text Recognition (HTR) platforms like Transkribus and eScriptorium ingest manuscript images directly via manifest URIs for layout analysis and transcription.</p>", "feedback": "<p>Correct. HTR platforms import image sequences and metadata directly from the IIIF manifest URL.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manifest automatically generates all TEI critical apparatus entries before transcription begins.</p>", "feedback": "<p>Incorrect. The apparatus is constructed in later weeks after transcription and collation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manifest compiles the final print PDF edition using LaTeX.</p>", "feedback": "<p>Incorrect. The manifest supplies the imaging foundation for ingestion into HTR and transcription tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manifest replaces the need for any manual diplomatic transcription or ground truth verification.</p>", "feedback": "<p>Incorrect. Ground truth transcription must be created by the scholar from the manifest images.</p>"}]}}, {"step": 24, "title": "The Multimodal Repository Argument", "content": "**The Multimodal Repository Argument**\n\nClausen et al. (2026) extend the interoperability argument beyond images, and\ntheir framing is useful for understanding where this is all heading.\n\nTheir observation is that a manuscript under modern investigation generates\nmany kinds of data. Multispectral imaging produces datacubes. X-ray fluorescence\nproduces elemental maps. Raman spectroscopy characterizes pigments. Codicological\nexamination produces structural description. Transcription produces TEI. Each has\ntraditionally been held by the discipline that produced it, in its own format, in\nits own repository — and the connections between them, which are where the\ninteresting questions live, are lost.\n\nTheir proposal is an open repository integrating these heterogeneous datasets\naround the physical object, linking material analyses to structural textual\nencodings so that a question spanning them can be asked at all (Clausen et al.,\n2026).\n\n| Data type | Produced by | Traditionally held in |\n| --- | --- | --- |\n| Multispectral datacube | Imaging science | Imaging lab archives |\n| XRF elemental map | Conservation science | Conservation records |\n| Raman pigment analysis | Materials chemistry | Chemistry publications |\n| Codicological description | Manuscript studies | Library catalogues |\n| Transcription and apparatus | Textual criticism | Editions and TEI repositories |\n\nIIIF is a substantial part of the answer, because the canvas provides a shared\ncoordinate space that every one of these can target. An elemental map, a\nprocessed composite, and a transcribed line can all address the same region of\nthe same canvas — which is exactly what makes them relatable.\n\nYour own edition is a small instance of this. By Week 13 it will link\ncodicological description, images under multiple conditions, transcription,\napparatus, and commentary, all anchored to a common coordinate space.\n\n**Takeaway:** The canvas is a shared coordinate space that\nimaging, materials analysis, and transcription can all target, which is what makes\nthem relatable.\n\n---", "question": {"name": "24 Question: The Multimodal Repository Argument", "questiontext": "<p>According to Clausen et al. (2026), what role does the IIIF Canvas play in integrating heterogeneous manuscript datasets (multispectral datacubes, XRF maps, Raman spectroscopy, TEI)?</p>", "generalfeedback": "<p>The canvas is a shared coordinate space that imaging, materials analysis, and transcription can all target, which is what makes them relatable.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It provides a unified, shared coordinate space that chemical, structural, and textual annotations can all target simultaneously.</p>", "feedback": "<p>Correct. The canvas allows disparate scientific analyses and textual encodings to reference the exact same spatial region on the page.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts chemical spectra into audio frequencies for acoustic playback in web browsers.</p>", "feedback": "<p>Incorrect. The canvas provides spatial coordinate alignment for heterogeneous data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically executes quantum mechanical simulations of ink degradation on the client.</p>", "feedback": "<p>Incorrect. Clausen et al. propose repository integration using shared spatial coordinates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces all scientific data to be converted into 8-bit grayscale JPEG files.</p>", "feedback": "<p>Incorrect. Datasets maintain their scientific structures while targeting common canvas coordinates.</p>"}]}}, {"step": 25, "title": "Persistent Identifiers and Citation", "content": "**Persistent Identifiers and Citation**\n\nAn edition that cannot be cited stably is not scholarship, and IIIF resources are\nidentified by URIs — which are notoriously unstable.\n\nThe problem is real. Institutions reorganize, domains lapse, platforms migrate,\nand a canvas URI cited in a 2026 article may resolve to nothing in 2036. This is\nthe digital equivalent of a shelfmark changing after a library recatalogues, with\nthe difference that the digital failure is silent and total.\n\nMitigations, in order of reliability:\n\n| Approach | Mechanism | Durability |\n| --- | --- | --- |\n| DOI | Registered persistent identifier with maintained resolution | High; the scholarly standard |\n| ARK | Archival Resource Key, widely used by libraries | High where the institution maintains it |\n| Purl | Redirection service under the publisher's control | Moderate |\n| Institutional URI | The library's own URL scheme | Variable; depends on institutional stability |\n| Ad-hoc URL | Whatever the current platform emits | Low |\n\nFor your own citations this term, record the DOI or ARK where one exists, and the\nfull canvas URI in every case. Where a manifest carries a `seeAlso` block, follow\nit — institutions frequently link the persistent catalogue record there.\n\nAlso record what you saw and when. A citation of the form \"MS Vat. gr. 1209,\nf. 42r, canvas `https://…/canvas/p42`, accessed 15 September 2026, image dimensions\n3000×4000\" survives partial link rot: even if the URI stops resolving, a reader\ncan identify the folio and the exact region you meant. Your Week 1 commit\ndiscipline is the mechanism here — record the identifiers in the repository, at\nthe time you use them.\n\n**Takeaway:** Record DOIs, full canvas URIs, dimensions, and\naccess dates, so that your citations survive the link rot that will eventually\noccur.\n\n---", "question": {"name": "25 Question: Persistent Identifiers and Citation", "questiontext": "<p>To ensure a digital citation of a manuscript folio survives future institutional URL changes or link rot, what should a scholar record alongside the canvas URI?</p>", "generalfeedback": "<p>Record DOIs, full canvas URIs, dimensions, and access dates, so that your citations survive the link rot that will eventually occur.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Permanent identifiers (DOI/ARK), the repository shelfmark, folio designation, access date, and canvas pixel dimensions.</p>", "feedback": "<p>Correct. Recording persistent identifiers, shelfmarks, dates, and dimensions allows citations to remain verifiable even if a specific URL changes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only the short URL generated by a third-party commercial link-shortening service.</p>", "feedback": "<p>Incorrect. Third-party link shorteners are highly vulnerable to domain expiration and link rot.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The IP address and MAC address of the local Wi-Fi router used during the work session.</p>", "feedback": "<p>Incorrect. Local networking hardware identifiers provide no scholarly citation permanence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A proprietary screenshot saved in an unindexed local folder without metadata.</p>", "feedback": "<p>Incorrect. Scholarly citation requires verifiable identifiers and documented coordinates.</p>"}]}}, {"step": 26, "title": "A Practical Exercise for This Meeting", "content": "**A Practical Exercise for This Meeting**\n\nWork through the following now, on your own passage. Everything in Lesson 3.3\nassumes it is complete.\n\n- Locate the manifest URL for your primary witness and record it in your repository.\n- Retrieve it with `curl` and pretty-print it; do not merely open it in a viewer.\n- Identify the canvases corresponding to your folios and record their ids.\n- Record each canvas's `height` and `width`.\n- Extract the `rights` value and the `requiredStatement`.\n- Construct an Image API URL by hand that returns the full folio at 1000 pixels wide, and open it.\n- Construct a second that returns only the region containing the first line of your passage.\n- Load the manifest into Mirador and confirm it renders.\n- Repeat for your second witness.\n- Commit all of it as a structured note in your repository.\n\nThe hand-constructed URLs matter more than they appear. Anyone can drag a\nmanifest into a viewer; being able to write an Image API request from scratch is\nwhat lets you extract precisely the evidence you need, script it over many\nfolios, and diagnose failures when a viewer shows nothing.\n\nRecord the results as a Markdown file in your repository — `images/SOURCES.md` is\na reasonable location — and commit it with a Conventional Commits message. In\nWeek 13 this file is the basis of your edition's image documentation.\n\n**Takeaway:** Write the Image API URLs by hand; that skill is\nwhat makes you independent of any particular viewer.\n\n---", "question": {"name": "26 Question: A Practical Exercise for This Meeting", "questiontext": "<p>Why is hand-authoring a IIIF Image API URL for a specific manuscript region a crucial scholarly skill?</p>", "generalfeedback": "<p>Write the Image API URLs by hand; that skill is what makes you independent of any particular viewer.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It empowers the scholar to extract precise parchment regions at specific resolutions independently of any viewer, enabling scripting, commentary integration, and failure diagnosis.</p>", "feedback": "<p>Correct. Writing Image API URLs by hand allows targeted evidence extraction and troubleshooting across any compliant repository.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is the only way to bypass institutional paywalls on commercial subscription databases.</p>", "feedback": "<p>Incorrect. IIIF Image API requests interact with open endpoints, not paywall circumvention.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows students to permanently delete defective images from the holding library's server.</p>", "feedback": "<p>Incorrect. Image API requests are read-only HTTP GET operations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts Greek text in the image directly into formatted HTML without transcription.</p>", "feedback": "<p>Incorrect. The Image API handles pixel transformations, not optical character recognition.</p>"}]}}, {"step": 27, "title": "Common Failures and Their Diagnosis", "content": "**Common Failures and Their Diagnosis**\n\nPredictable failures, so you recognize them rather than rediscovering them.\n\n| Symptom | Likely cause | Diagnosis |\n| --- | --- | --- |\n| Viewer shows nothing, no error | Invalid manifest | Run the IIIF validator |\n| Manifest loads, images blank | Image endpoints moved or restricted | `curl -I` each image URI |\n| Images load in one viewer, not another | Version mismatch, 2.1 versus 3.0 | Inspect `@context` |\n| Cross-origin error in the browser console | Server lacks CORS headers | Check response headers; contact the institution |\n| Zoom stops at low magnification | Level 0 service; no higher tiles exist | Inspect the `service` block |\n| Coordinates address the wrong region | Canvas dimensions differ from image dimensions | Compare canvas `height`/`width` with the image |\n| Labels display as `[object Object]` | Language map handled as a string, or vice versa | Check the label's shape against the version |\n\nThe CORS case is worth explaining, since it produces the most bewildering\nsymptom. A browser refuses to let a page fetch data from another domain unless\nthat domain's server explicitly permits it with a Cross-Origin Resource Sharing\nheader. If an institution's server omits the header, its manifest works in that\ninstitution's own viewer and fails everywhere else — an accidental silo,\nreproducing the exact problem IIIF was built to eliminate. Nothing on your side\ncan fix it; the remedy is to report it to the institution, which usually treats\nit as the bug it is.\n\nThe last row is the classic hand-authoring error and the one most likely to bite\nyou on Friday. In 2.1 a label is a string; in 3.0 it is a language map holding\narrays. Mixing them produces exactly this symptom.\n\n**Takeaway:** Diagnose in order — validate the manifest, check\nthe image endpoints, then check the version — and recognize CORS failures as the\ninstitution's bug, not yours.\n\n---", "question": {"name": "27 Question: Common Failures and Their Diagnosis", "questiontext": "<p>When a manifest loads in a library's own viewer but fails in an external Mirador instance with a browser console error, what is the most probable cause?</p>", "generalfeedback": "<p>Diagnose in order — validate the manifest, check the image endpoints, then check the version — and recognize CORS failures as the institution's bug, not yours.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The institution's image server lacks Cross-Origin Resource Sharing (CORS) headers, creating an accidental silo by blocking third-party domains.</p>", "feedback": "<p>Correct. Missing CORS headers cause modern browsers to block cross-domain JSON or image requests, locking the asset into the host's own viewer.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The client computer does not have a specialized graphics card capable of 3D polygon rendering.</p>", "feedback": "<p>Incorrect. CORS is a standard HTTP security policy enforced by browsers, not a hardware defect.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Mirador requires all external manifests to be cryptographically signed by the Library of Congress.</p>", "feedback": "<p>Incorrect. Mirador requires standard JSON-LD and permissive CORS headers, not institutional signatures.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manuscript's Greek text contains Unicode characters that trigger web browser firewall blocks.</p>", "feedback": "<p>Incorrect. Text encoding does not trigger HTTP cross-origin security violations.</p>"}]}}, {"step": 28, "title": "What a Canvas Is Not", "content": "**What a Canvas Is Not**\n\nA consolidating exercise, since the canvas abstraction is where conceptual errors\nconcentrate and each error has a characteristic downstream symptom.\n\n| Misconception | Why it is wrong | Consequence |\n| --- | --- | --- |\n| \"A canvas is an image\" | It is a coordinate space; images are painted onto it | Cannot model multispectral layers |\n| \"A canvas has one image\" | It may carry many, including alternatives | Cannot model a `Choice` |\n| \"Canvas dimensions are image dimensions\" | They may differ; images are scaled to fit | Coordinates address the wrong region |\n| \"A canvas must have an image\" | An empty canvas can represent a lost folio | Cannot model lacunae in a codex |\n| \"A canvas is a page\" | It is an abstraction that usually *stands for* a page | Cannot model an opening, a fragment, or a reconstruction |\n\nThe third row causes the most practical trouble and is worth stating carefully.\nCanvas dimensions define the coordinate space, and images are painted into that\nspace — scaled if their pixel dimensions differ. If a canvas is 3000×4000 while\nthe image is 6000×8000, then canvas coordinate (1500, 2000) corresponds to image\npixel (3000, 4000). Fragment selectors address *canvas* coordinates. Computing a\nregion from the image's pixel dimensions when the canvas differs puts your\nannotation in the wrong place, and the error is systematic rather than random —\neverything is off by the same factor, which makes it easy to miss and easy to\ncorrect once seen.\n\nAlways read the canvas dimensions from the manifest, and never assume they match\nthe image.\n\n**Takeaway:** Fragment selectors address canvas coordinates, not\nimage pixels, and the two frequently differ by a scale factor.\n\n---", "question": {"name": "28 Question: What a Canvas Is Not", "questiontext": "<p>If a canvas has dimensions 3000×4000 while the underlying master image is 6000×8000, what happens if an editor calculates annotation coordinates based on image pixels instead of canvas units?</p>", "generalfeedback": "<p>Fragment selectors address canvas coordinates, not image pixels, and the two frequently differ by a scale factor.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>All annotation boxes will be shifted and scaled incorrectly by a factor of 2, addressing the wrong regions of the canvas.</p>", "feedback": "<p>Correct. Fragment selectors target canvas coordinates; if image pixel coordinates are used without scaling, annotations will be systematically misplaced.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The web browser will crash with a fatal memory segmentation fault.</p>", "feedback": "<p>Incorrect. The browser will simply render the annotation box at the wrong canvas coordinates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manifest validator will automatically rescale the master image file on the remote server.</p>", "feedback": "<p>Incorrect. Validators do not alter server files, and client annotations will be misplaced.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The annotation text will automatically invert its reading direction from left-to-right to right-to-left.</p>", "feedback": "<p>Incorrect. The issue is a geometric scaling discrepancy, not text orientation.</p>"}]}}, {"step": 29, "title": "Preparing for Lesson 3.2", "content": "**Preparing for Lesson 3.2**\n\nWednesday moves from delivery to acquisition — from how images are served to how\nthey are made, and to what can be recovered from a manuscript that ordinary\nphotography cannot show.\n\nThe connection is the canvas abstraction established today. Multispectral imaging\nproduces many images of one folio: visible light, ultraviolet, several infrared\nbands, and statistically processed composites. In a model where a page has one\nimage, these are unrelated files that a scholar must manage by hand. In the IIIF\nmodel they are alternative content painted onto a single canvas, and a viewer can\npresent them as toggleable layers over one coordinate space.\n\nThat is why this week is ordered as it is. The `Choice` construct introduced\ntomorrow is meaningless without today's understanding that a canvas is a space\nrather than a picture, and the coordinate binding on Friday is meaningless\nwithout both.\n\nBefore Wednesday:\n\n- Complete the exercise in section 26 for both witnesses.\n- Confirm Mirador renders both manifests.\n- Note whether either institution provides non-visible-light images — search the manifest for terms such as `ultraviolet`, `infrared`, `UV`, `IR`, or `processed`.\n- Read the `rights` statements and record what they permit.\n\nThe third item is genuinely worth doing. Multispectral captures exist for many\nmanuscripts but are frequently not surfaced in the default viewer, appearing only\nas additional entries in the manifest. If your manuscript has them, Wednesday's\nwork applies directly to your own edition rather than to an example.\n\n**Takeaway:** The canvas-as-space abstraction is what makes\ntomorrow's spectral layering expressible; check now whether your own manuscript\nhas non-visible-light captures.\n\n---", "question": {"name": "29 Question: Preparing for Lesson 3.2", "questiontext": "<p>How does the canvas coordinate model prepare for the multispectral imaging techniques introduced in Lesson 3.2?</p>", "generalfeedback": "<p>The canvas-as-space abstraction is what makes tomorrow's spectral layering expressible; check now whether your own manuscript has non-visible-light captures.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Visible light, ultraviolet, infrared, and PCA composite images of the same folio can all be defined as alternative <code>Choice</code> layers painted onto a single shared canvas coordinate space.</p>", "feedback": "<p>Correct. The canvas allows multiple spectral captures of a single folio to be toggled and cross-faded over a unified coordinate space.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically performs chemical synthesis of iron-gall ink inside the browser.</p>", "feedback": "<p>Incorrect. Canvas abstraction provides spatial alignment for spectral layers, not chemical simulation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It restricts each manuscript page to a single grayscale TIFF file to prevent visual confusion.</p>", "feedback": "<p>Incorrect. The canvas enables multi-layer and multi-spectral representation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires editors to manually redraw ancient letterforms using vector Bezier curves.</p>", "feedback": "<p>Incorrect. Multispectral layers present calibrated photographic and processed sensor data.</p>"}]}}, {"step": 30, "title": "Synthesis: Images as Addressable Scholarly Resources", "content": "**Synthesis: Images as Addressable Scholarly Resources**\n\nThe argument of this meeting, stated once more in its own terms.\n\nDigitization alone produced silos. Millions of manuscript images existed, each\naccessible only through the interface of the institution that made it, which\nmeant that the fundamental operation of textual criticism — juxtaposing witnesses\n— remained obstructed. The obstruction was not technical scarcity but the absence\nof a shared standard.\n\nIIIF resolves it by making images *addressable*. The Image API gives every region\nof every image a URL constructed by a rule anyone can apply. The Presentation API\ndescribes objects in a shared vocabulary, so that any viewer can render any\ninstitution's manifest. Cooperation happens without coordination, because both\nparties implement the same specification (Griffin, 2023; IIIF Consortium, 2020).\n\nThe abstraction that carries the most weight is the canvas: a coordinate space\nstanding for the page, onto which evidence is painted. This is what permits many\nimages of one page, transcriptions bound to regions of it, annotations targeting\nits coordinates, and the whole multimodal integration that Clausen et al. (2026)\nargue manuscript scholarship now requires.\n\n**For Wednesday.** Complete the section 26 exercise for both witnesses, confirm\nboth render in Mirador, and check your manifests for non-visible-light captures.\n\n**For Friday.** The **Cataloguing & Metadata Assignment is due Friday September\n18**, and Friday's meeting builds the manifest for your passage and binds it to\nyour TEI. Everything recorded today is the input to that work.\n\n**Takeaway:** IIIF makes every region of every image\naddressable by a shared rule, and the canvas — a coordinate space, not a picture —\nis what lets images, text, and analysis all refer to the same place.\n\n---\n\n## References\n\nClausen, H., Brenner, S., Schreiner, M., & Vetter, W. (2026). Multimodal\nmanuscript representation: Toward an open repository for manuscript research\ndata. *The European Physical Journal Plus*.\nhttps://doi.org/10.1140/epjp/s13360-025-07133-y\n\nEaston, R. L., Knox, K. T., & Christens-Barry, W. A. (2003). Multispectral\nimaging of the Archimedes palimpsest. In *32nd Applied Imagery Pattern\nRecognition Workshop*. https://doi.org/10.1109/AIPR.2003.1284258\n\neScriptorium/Kraken. (2024). *eScriptorium platform documentation*.\nhttps://escriptorium.eu/about\n\nGriffin, S. M. (2023). Digital libraries, epigraphy and paleography: Bringing\nrecords from the distant past to the present. *International Journal on Digital\nLibraries*. https://doi.org/10.1007/s00799-023-00381-2\n\nIIIF Consortium. (2020). *IIIF Presentation API 3.0 specification*.\nhttps://iiif.io/api/presentation/3.0/\n\nTEI Consortium. (2026). *TEI P5: Guidelines for electronic text encoding and\ninterchange*. https://www.tei-c.org/release/doc/tei-p5-doc/en/html/", "question": {"name": "30 Question: Synthesis: Images as Addressable Scholarly Resources", "questiontext": "<p>What is the core conceptual shift that IIIF achieves for digital textual scholarship?</p>", "generalfeedback": "<p>IIIF makes every region of every image addressable by a shared rule, and the canvas — a coordinate space, not a picture — is what lets images, text, and analysis all refer to the same place.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It transforms manuscript images from isolated, interface-locked files into standardized, addressable networked resources whose coordinate spaces support multi-layered evidence and transcription.</p>", "feedback": "<p>Correct. IIIF makes every region of every image addressable by standard rules, creating an open framework for comparative scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It eliminates the need for human philologists by automating the complete editorial and collation process.</p>", "feedback": "<p>Incorrect. IIIF provides the infrastructure for evidence; philological analysis remains a human scholarly discipline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It establishes a centralized commercial repository that owns and monetizes all global digitized cultural heritage.</p>", "feedback": "<p>Incorrect. IIIF is a decentralized open standard that connects independent institutions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces TEI XML with proprietary binary formats optimized for closed viewing software.</p>", "feedback": "<p>Incorrect. IIIF works alongside open standards like TEI XML to build linked, interoperable digital editions.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
