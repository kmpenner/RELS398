ng the record is partly how you establish which era you are dealing with, which in turn tells you which conventions apply.\n\n**The same discipline applies to every register.** A Dickinson call number tells you which series the item sits in, which tells you whether it is a poem or a letter. A treaty reference number tells you the volume but not the status. Reading the record is what converts an identifier into knowledge.\n\n**Vocabulary.** *Recueil* — a collected volume; in French archival and library practice, a set of pieces bound together, each with its own date, which may be catalogued as one item or many.\n\n**Takeaway:** An identifier is a pointer, not a fact. Open the record and read its fields, because the metadata inside is what goes into your header — and mismatches between the record and your expectations are findings, not obstacles.\n\n---", "image_b64": null, "question": {"name": "21 Question: Reading a Record, Not Just Finding It", "questiontext": "<p>The Gallica record for <code>ark:/12148/bpt6k9690620k</code> reports the format as <em>67 pièces en 1 vol. in-4&deg;</em>. Why does that field matter to your catalogue entry?</p>", "generalfeedback": "<p>An identifier is a pointer, not a fact. Open the record and read its fields, because the metadata inside is what goes into your header — and mismatches between the record and your expectations are findings, not obstacles.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It warns that the object is a <em>recueil</em> of many pieces, so cataloguing the volume as one act would misdescribe what you are holding.</p>", "feedback": "<p>Correct. Reading the record is what turns an identifier into knowledge, and mismatches with your expectations are findings rather than obstacles.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It confirms that the volume contains exactly one document, since a single volume is a single catalogue item.</p>", "feedback": "<p>Incorrect. One volume may bind many pieces, which is precisely what the field is telling you.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It has no bearing on the header, since physical format belongs to the holding library's internal records.</p>", "feedback": "<p>Incorrect. Format and extent are facts a TEI header records, and they are also facts you can check.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It means the ARK identifies the individual piece rather than the volume, so no further disambiguation is needed.</p>", "feedback": "<p>Incorrect. The ARK identifies the digitized object described by that record, which the format field shows to be a collected volume.</p>"}]}}, {"step": 22, "title": "Dating: Where Records Mislead", "content": "**Dating: Where Records Mislead**\n\nDates in catalogue records are not neutral facts, and this is the single most productive place to catch a subtle error.\n\n**Editorial attribution.** The Emily Dickinson Archive states plainly that Dickinson \"very rarely dated her poems,\" and that the libraries and editions \"often give approximate dates.\" A date in a Dickinson record is therefore an *editorial attribution*, not an authorial statement — frequently with the attributing scholar named in brackets. Recording it as a certain date in your header would overstate the evidence. TEI gives you the vocabulary to be honest about this, and Module 02's `<origin>` work is where you apply it.\n\n**Calendar style.** France adopted the Gregorian calendar in December 1582, so no Julian day-shift applies to an 18th-century French document. Do not \"correct\" one.\n\n**But check which traps your date can even reach.** The famous Ancien Régime trap is **year-start style**: before the *édit de Roussillon* (1564) took full effect in 1567, the year was reckoned from Easter or Christmas in some usages, so a document dated between 1 January and Easter is often **one year later** in modern reckoning. That trap cannot touch a document of 1791, because the year had begun on 1 January for over two centuries by then. What *does* bear on the Revolutionary era is the **Republican calendar**: an I began 22 September 1792, it was in force from 6 October 1793, and it was abolished from 1 January 1806 — so a 1791 document predates it, but a later copy or a retrospective register entry may carry both eras. **Knowing which period your document belongs to tells you which trap is live.** Applying a rule from the wrong century is its own kind of error, and a confident one.\n\n**Printed vs manuscript date.** A printed proclamation carries a date of printing. That is not necessarily the date of the event it records, and it is certainly not the date of the agreement it publishes.\n\n**Vocabulary.** *Editorial attribution* — a date supplied by a modern editor rather than stated by the document. *Year-start style* — the convention determining which day begins the year, which varied by place and period.\n\n**Takeaway:** Ask of every date whether it is authorial, editorial, or a record of something else — and record the uncertainty rather than flattening it, because a confident wrong date is exactly the failure your workshop is about.\n\n---", "image_b64": null, "question": {"name": "22 Question: Dating: Where Records Mislead", "questiontext": "<p>You are dating a Dickinson poem and a French act of 1791, and a watermark on the paper reads 1771. Which statement reflects the lesson's caution about dates?</p>", "generalfeedback": "<p>Ask of every date whether it is authorial, editorial, or a record of something else — and record the uncertainty rather than flattening it, because a confident wrong date is exactly the failure your workshop is about.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A date in a catalogue record may be an editorial attribution rather than an authorial statement, and a watermark dates the paper rather than the document.</p>", "feedback": "<p>Correct. Ask of every date whether it is authorial, editorial, or a record of something else, and record the uncertainty instead of flattening it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The watermark gives a secure date for the paper and therefore for the poem written on it.</p>", "feedback": "<p>Incorrect. Dating the paper does not date the writing, and Dickinson's poems were rarely dated by their author at all.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Ancien Régime year-start-style trap applies to the 1791 act, so its year may need adjusting.</p>", "feedback": "<p>Incorrect. That trap cannot reach a document of 1791: the French year had begun on 1 January since the édit de Roussillon took full effect in 1567. Knowing the period tells you which trap is live — applying a rule from the wrong century is its own kind of confident error.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A printed proclamation's date of printing is the date of the agreement it publishes.</p>", "feedback": "<p>Incorrect. A printing date is not the date of the event recorded and certainly not the date of the agreement published.</p>"}]}}, {"step": 23, "title": "Recording the Citation in Your Header", "content": "**Recording the Citation in Your Header**\n\nHow do you put all of this into your TEI header?\n\nThe `ref` attribute carries the identifier, on whichever element describes the thing being identified:\n\n```xml\n<msIdentifier>\n    <settlement ref=\"https://www.wikidata.org/wiki/Q3350\">Antigonish</settlement>\n    <repository ref=\"http://viaf.org/viaf/...\">Nova Scotia Archives</repository>\n    <idno type=\"reference\">RG 1 volume 430 number 2</idno>\n    <idno type=\"ARK\">ark:/12148/bpt6k9690620k</idno>\n</msIdentifier>\n```\n\nThree things to notice:\n\n1. **`<idno>` takes a `type` attribute.** Use it. A reference number, an ARK, and a call number are different kinds of identifier, and `type` is how you say which is which. A bare `<idno>` with no type tells a reader nothing about what they are looking at.\n2. **`ref` goes on the element it identifies**, not on the header as a whole. A repository name gets a repository's authority URI; a settlement gets a place's.\n3. **The human-readable text stays human-readable.** The reader sees \"Nova Scotia Archives\"; the machine follows the URI. That is the whole point of authority control.\n\nFor the status of the object — original, copy, transcript, or printed edition — use `<note>` inside or beside the identifier, because the reference number alone will not tell you:\n\n```xml\n<idno type=\"reference\">RG 1 volume 430 number 2</idno>\n<note type=\"status\">Printed proclamation; no original signed copy is known to survive.</note>\n```\n\n**Vocabulary.** *`ref` attribute* — the TEI attribute pointing to a canonical URI or authority record. *`idno`* — the TEI element for a formal identifier, qualified by `type`.\n\n**Takeaway:** Record each identifier in its own `<idno>` with a `type`, put authority URIs in `ref` on the element they identify, and state the object's status separately — because the identifier alone does not say what kind of thing you are holding.\n\n---", "image_b64": null, "question": {"name": "23 Question: Recording the Citation in Your Header", "questiontext": "<p>Which entry records the treaty's reference number correctly in <code>&lt;msIdentifier&gt;</code>?</p>", "generalfeedback": "<p>Record each identifier in its own `<idno>` with a `type`, put authority URIs in `ref` on the element they identify, and state the object's status separately — because the identifier alone does not say what kind of thing you are holding.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<code>&lt;idno type=\"reference\"&gt;RG 1 volume 430 number 2&lt;/idno&gt;</code>, with the object's status given separately in a typed <code>&lt;note&gt;</code>.", "feedback": "<p>Correct. The <code>@type</code> says which kind of identifier this is, and the reference number alone never states whether the object is an original, a copy, or a printed edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>&lt;idno&gt;RG 1 volume 430 number 2&lt;/idno&gt;</code>, since the number's form makes its kind self-evident.", "feedback": "<p>Incorrect. A bare <code>&lt;idno&gt;</code> tells a reader nothing about which kind of identifier it is, which is what <code>@type</code> is for.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>&lt;idno type=\"reference\"&gt;RG1/430/2&lt;/idno&gt;</code>, normalizing the reference into a consistent delimited form.", "feedback": "<p>Incorrect. Renaming the identifier breaks it; the reference must be copied exactly as the issuing institution writes it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>&lt;repository ref=\"RG 1 volume 430 number 2\"&gt;Nova Scotia Archives&lt;/repository&gt;</code>, placing the citation on the holding institution.", "feedback": "<p>Incorrect. A reference number identifies the object, not the repository, and <code>@ref</code> carries an authority URI rather than an archival citation.</p>"}]}}, {"step": 24, "title": "Hands-On in VS Code: Connecting to the Schema", "content": "**Hands-On in VS Code: Connecting to the Schema**\n\nNow it is time for today's practical lab work. \n\nOpen Visual Studio Code on your machine. Open your course repository, and locate the primary witness header file you hand-authored yesterday:\n\n`03a_Lesson_2.1_Primary_Witness_Header.xml`\n\nMake a copy of this file for today's milestone:\n\n`03a_Lesson_2.2_Validated_Witness_Header.xml`\n\nNow, insert the official schema instruction at the very top of the file, right after line 1:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?xml-model href=\"https://raw.githubusercontent.com/msdesc/consolidated-tei-schema/master/msdesc.rng\" \n            type=\"application/xml\" \n            schematypens=\"http://relaxng.org/ns/structure/1.0\"?>\n<TEI xmlns=\"http://www.tei-c.org/ns/1.0\">\n```\n\nSave the file (`Ctrl+S` or `Cmd+S`).\n\nWatch your editor. Within two seconds, the background XML language server in VS Code will parse your hand-written markup against the official schema. If you made any syntax or structural mistakes yesterday, red squiggly lines will appear!\n\n**Vocabulary.** *Schema linking* — declaring the online or local location of a schema within an XML file to enable real-time editor validation. *Diagnostics* — the automated error and warning messages generated by a language server.\n\n**Takeaway:** Copy your hand-written header to `03a_Lesson_2.2_Validated_Witness_Header.xml`, add the `xml-model` processing instruction, and let VS Code audit your markup.\n\n---", "image_b64": null, "question": {"name": "24 Question: Hands-On in VS Code: Connecting to the Schema", "questiontext": "<p>What are the concrete steps of today's lab in VS Code, before any enriching of the header?</p>", "generalfeedback": "<p>Copy your hand-written header to `03a_Lesson_2.2_Validated_Witness_Header.xml`, add the `xml-model` processing instruction, and let VS Code audit your markup.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Copy <code>03a_Lesson_2.1_Primary_Witness_Header.xml</code> to <code>03a_Lesson_2.2_Validated_Witness_Header.xml</code> and add the <code>xml-model</code> instruction at the top so the editor audits it.</p>", "feedback": "<p>Correct. The copy preserves Tuesday's ground truth while the processing instruction connects the working file to the official schema.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Validate the file by uploading it to an institutional server, then download the corrected version.</p>", "feedback": "<p>Incorrect. The language server validates locally and continuously; there is no upload step.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Re-type the header from scratch so that the schema's defaults are applied as you go.</p>", "feedback": "<p>Incorrect. Re-typing discards the human ground truth the whole exercise depends on.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Download the RELAX NG schema by hand and paste it into the header so the rules travel with the file.</p>", "feedback": "<p>Incorrect. The schema is referenced by the <code>xml-model</code> instruction, not embedded in the document.</p>"}]}}, {"step": 25, "title": "Slaying the Red Squiggles: Reading Validator Error Messages", "content": "**Slaying the Red Squiggles: Reading Validator Error Messages**\n\nWhen red squiggly lines light up your screen, do not panic! Every programmer and digital editor in the world spends their days debugging errors. The secret to debugging is learning how to read what the validator is trying to tell you.\n\nOpen the Problems panel in VS Code (`Ctrl+Shift+M` or `Cmd+Shift+M`). \n\nHere are the three most common error messages you will encounter today, and how to fix them:\n\n1. **\"Element 'xyz' is not allowed here\"**: You put a tag in the wrong container or out of sequence. Check the order! Does `<publicationStmt>` come before `<sourceDesc>`? Did you accidentally put `<supportDesc>` outside of `<objectDesc>`?\n2. **\"The element type 'xyz' must be terminated by the matching end-tag\"**: You forgot the closing slash `/` in your end tag, or you forgot to close a tag altogether.\n3. **\"Attribute 'material' has invalid value\"**: You typed a value that violates the schema enumeration. For example, you typed `material=\"vellum\"`, but the schema only permits `material=\"parchment\"`. Change it to `\"parchment\"`!\n\nWork through the Problems panel one line at a time. Click on an error in the panel, and VS Code will jump directly to the offending line in your code. Fix the issue, save the file, and watch the error count drop.\n\n**Vocabulary.** *Debugging* — the process of identifying, analyzing, and removing errors from computer code or markup. *Problems panel* — the VS Code interface displaying active errors, warnings, and schema diagnostic messages.\n\n**Takeaway:** Read schema error messages carefully to identify sequence mistakes, unclosed tags, or illegal attribute values, resolving them one by one.\n\n---", "image_b64": null, "question": {"name": "25 Question: Slaying the Red Squiggles: Reading Validator Error Messages", "questiontext": "<p>VS Code reports <em>\"Attribute 'material' has invalid value\"</em> on <code>&lt;supportDesc material=\"vellum\"&gt;</code>. What is the correct fix?</p>", "generalfeedback": "<p>Read schema error messages carefully to identify sequence mistakes, unclosed tags, or illegal attribute values, resolving them one by one.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Change the value to one the schema permits for that attribute — the message is telling you the value violates an enumeration.</p>", "feedback": "<p>Correct. Reading the message precisely is what separates an enumeration violation from a sequence mistake or an unclosed tag.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the <code>@material</code> attribute, since a description cannot legally specify a material.</p>", "feedback": "<p>Incorrect. The attribute is legal and expected; it is the value that is outside the permitted list.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Reorder <code>&lt;supportDesc&gt;</code> within <code>&lt;objectDesc&gt;</code>, because the message means the element is out of sequence.</p>", "feedback": "<p>Incorrect. A sequence problem produces \"is not allowed here\"; this message names an attribute value.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Insert the missing closing tag for <code>&lt;supportDesc&gt;</code>, which is what has made the value unreadable.</p>", "feedback": "<p>Incorrect. An unclosed element produces a termination message naming the element type.</p>"}]}}, {"step": 26, "title": "Enriching Your Header with Authority URIs", "content": "**Enriching Your Header with Authority URIs**\n\nOnce your file validates with zero errors, the next task is to enrich your header with authority URIs.\n\nOpen your browser and look up two identifiers for your document:\n\n1. **Holding repository.** Search `viaf.org` or `wikidata.org` for the institution that holds your document — the Nova Scotia Archives, the Houghton Library, the Bibliothèque nationale de France. Copy the canonical URI and put it on `<repository>`:\n   ```xml\n   <repository ref=\"http://viaf.org/viaf/...\">Nova Scotia Archives</repository>\n   ```\n   If the institution has no authority record, say so in a `<note>` — a verified absence is a finding, and it is honest.\n\n2. **Place of origin or place of issue.** Use the register that fits your document. **TGN** (`getty.edu`) or **GeoNames** work for most modern and early-modern places. **Pleiades** is the right tool only for ancient Greek and Roman geography — it will not help you with Halifax, Amherst, or Paris.\n   ```xml\n   <origPlace ref=\"https://www.geonames.org/...\">Halifax</origPlace>\n   ```\n\n**Verify by reading the record, not by checking the link.** Open each URI and confirm that the name, dates, and description match the entity you intend. Some registers return a page even for identifiers that do not exist, so a link that loads proves nothing.\n\n**Vocabulary.** *Entity enrichment* — adding external authority identifiers to plain-text names in a document. *Canonical record* — the authoritative master entry for an entity in a shared register.\n\n**Takeaway:** Enrich your repository and place of issue with authority URIs from the register appropriate to your document's tradition, and verify each by reading the record's content rather than by confirming the link resolves.\n\n---", "image_b64": null, "question": {"name": "26 Question: Enriching Your Header with Authority URIs", "questiontext": "<p>You need a URI for the place of issue on your document. What does the lesson recommend?</p>", "generalfeedback": "<p>Enrich your repository and place of issue with authority URIs from the register appropriate to your document's tradition, and verify each by reading the record's content rather than by confirming the link resolves.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Use the register appropriate to the place in question, open the candidate record, and confirm its name, dates, and description match the entity you intend.</p>", "feedback": "<p>Correct. Verification means reading the record's content; a register that returns a page for a non-existent identifier makes a loading link worthless as evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Use whichever geographic register returns a result first, since any gazetteer entry for a place name is better than none.</p>", "feedback": "<p>Incorrect. The wrong register may describe a different entity or a different kind of place entirely, and coverage is not correctness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Use a general ancient-geography register for every place, so that all your place references come from one system.</p>", "feedback": "<p>Incorrect. An ancient-geography register will not help with a modern town, so the register has to fit the document.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Cite the holding institution's own web page for the place, since the institution is the authority for its own records.</p>", "feedback": "<p>Incorrect. An institution's page about a place is not an authority record for that place, and it does not give you a shared identifier.</p>"}]}}, {"step": 27, "title": "Adding Your Canonical Citation", "content": "**Adding Your Canonical Citation**\n\nNow add your witness's identifiers to your header.\n\n**Step 1 — identify what kind of identifier your holding institution uses.** This depends on your document:\n\n- **A French act** → an Archives nationales cote (the series depends on the era) and, if digitised, a Gallica ARK of the form `ark:/12148/...`\n- **A Dickinson manuscript** → a Houghton call number, e.g. `MS Am 1118.3 [338]`, from the finding aid or the Emily Dickinson Archive.\n- **A treaty document** → a Nova Scotia Archives reference, e.g. `RG 1 volume 430 number 2`.\n\n**Step 2 — find the general-layer authority URI** for the holding institution or the person chiefly responsible. This is usually a VIAF or Wikidata URI, and it is frequently provided on the institution's own record page.\n\n**Step 3 — write them into `<msIdentifier>`**, each in its own `<idno>` with a `type`, and add a `<note>` recording the object's status:\n\n```xml\n<msIdentifier>\n    <settlement ref=\"https://www.wikidata.org/wiki/Q3350\">Antigonish</settlement>\n    <repository ref=\"http://viaf.org/viaf/...\">Nova Scotia Archives</repository>\n    <idno type=\"reference\">RG 1 volume 430 number 2</idno>\n    <note type=\"status\">Printed proclamation; no original signed copy is known to survive.</note>\n</msIdentifier>\n```\n\nSave the file and verify that VS Code accepts the attributes without schema warnings.\n\n**One rule above all:** copy the identifier in the **exact syntax** you found it. Do not normalise `ark:/` to `ark://`, do not convert `RG 1 volume 430 number 2` into `RG1/430/2`, and do not add or remove brackets in a call number. An identifier is a name, and renaming it breaks it.\n\n**Vocabulary.** *`idno`* — the TEI element for a formal identifier, qualified by a `type` attribute. *`ref`* — the attribute carrying a canonical URI for the element it sits on.\n\n**Takeaway:** Put each identifier in its own typed `<idno>`, add the object's status as a `<note>`, and copy the syntax exactly as the issuing institution writes it.\n\n---", "image_b64": null, "question": {"name": "27 Question: Adding Your Canonical Citation", "questiontext": "<p>You have an ARK, a call number, or an archival reference, plus a general-layer authority URI. What rule governs writing them into the header?</p>", "generalfeedback": "<p>Put each identifier in its own typed `<idno>`, add the object's status as a `<note>`, and copy the syntax exactly as the issuing institution writes it.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Each identifier goes in its own typed <code>&lt;idno&gt;</code>, the object's status is recorded in a <code>&lt;note&gt;</code>, and every identifier is copied in the exact syntax the issuing institution uses.</p>", "feedback": "<p>Correct. An identifier is a name, so normalising its punctuation or spacing renames it and breaks it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Each identifier is recorded once, in a canonical normalized form, so that your edition's citations are internally consistent.</p>", "feedback": "<p>Incorrect. Internal consistency is achieved at the cost of correctness: the identifier must match the institution's form, not your house style.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Identifiers are recorded in the <code>&lt;encodingDesc&gt;</code>, keeping <code>&lt;msIdentifier&gt;</code> for the manuscript's own name and shelfmark.</p>", "feedback": "<p>Incorrect. The identifiers of the object belong in <code>&lt;msIdentifier&gt;</code>, which is what the lesson's markup shows.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The status of the object is omitted, since a reference number identifies the object precisely enough on its own.</p>", "feedback": "<p>Incorrect. A reference number tells you the volume but not whether the item is an original, a copy, or a printed edition.</p>"}]}}, {"step": 28, "title": "Seeing Your Header as Linked Data", "content": "**Seeing Your Header as Linked Data**\n\nHow does a computer read the markup you just wrote?\n\nWhen semantic tools ingest your TEI header, they extract the identifiers and URIs you recorded and turn them into statements a machine can follow. Conceptually, your header becomes a set of assertions:\n\n```text\n<your document>  has holding institution  <Nova Scotia Archives>\n<your document>  has reference number     \"RG 1 volume 430 number 2\"\n<your document>  has status               \"printed proclamation\"\n<Nova Scotia Archives>  is identified by  <its VIAF URI>\n```\n\nThat is the payoff of authority control: your plain XML file has become a set of queryable claims about real-world entities, and each claim is traceable to a source.\n\n**And here is where the lesson connects to your workshop.** Every one of those claims is checkable, which means every one can be *false*. A model can produce a well-formed header asserting a repository URI that resolves to a different institution, or a reference number that belongs to a different volume. The structure will validate. Only a human comparing the claim against the record catches it.\n\n**Vocabulary.** *Triple* — a subject-predicate-object statement; the unit of Linked Data. *Triple extraction* — deriving such statements from structured markup.\n\n**Takeaway:** Your header is a set of checkable claims about real entities — which is exactly why an AI-generated header can be confidently, structurally valid, and wrong.\n\n---", "image_b64": null, "question": {"name": "28 Question: Seeing Your Header as Linked Data", "questiontext": "<p>When semantic tools ingest your header, they read it as a series of checkable claims. What follows from that for your workshop?</p>", "generalfeedback": "<p>Your header is a set of checkable claims about real entities — which is exactly why an AI-generated header can be confidently, structurally valid, and wrong.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The structure can validate perfectly while a claim is false — a repository URI pointing at another institution, say — and only a human comparing the claim against the record catches it.</p>", "feedback": "<p>Correct. Your header is a set of claims about real entities, which is exactly why an AI-generated header can be confidently, structurally valid, and wrong.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Validating the file is sufficient quality control, because a schema-valid header cannot contain false statements.</p>", "feedback": "<p>Incorrect. A schema can check that a URI is well formed but has no access to which institution it names.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The claims are only as reliable as the triples extracted from them, so the extraction step must be repeated annually.</p>", "feedback": "<p>Incorrect. Re-extraction would reproduce the same claims from the same file; the risk lies in the claims themselves.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Claims become checkable only once the header is published to a triple store rather than stored as a file.</p>", "feedback": "<p>Incorrect. Checkability does not depend on publication; the assertions are checkable as soon as they are written.</p>"}]}}, {"step": 29, "title": "The Stage Gate: Achieving a Zero-Error Audit in Git", "content": "**The Stage Gate: Achieving a Zero-Error Audit in Git**\n\nBefore you commit today's work, you must pass the **deterministic stage gate**.\n\nLook at the bottom left of your VS Code window. The Problems counter must say:\n**0 Errors, 0 Warnings.**\n\nA single remaining syntax error or schema violation means your document cannot be ingested by downstream pipelines in Weeks 3 through 13. Deterministic validation is an all-or-nothing threshold.\n\nOnce your file passes with zero errors, stage and commit it to Git:\n\n```bash\ngit add 03a_Lesson_2.2_Validated_Witness_Header.xml\ngit commit -m \"Topic 02 (Cataloguing): Pass deterministic schema validation in VS Code with LOD enrichment [0 errors]\"\ngit push origin main\n```\n\nNotice the commit message: `[0 errors]`. You are documenting that your work passed the automated audit. Your Git commit history is your permanent, tamper-proof lab notebook.\n\n**Vocabulary.** *Stage gate* — a mandatory quality-assurance milestone that must be 100% satisfied before a project can advance to the next production phase. *Clean validation* — an XML document state containing zero errors and zero warnings against all active schemas.\n\n**Takeaway:** Verify that VS Code reports 0 errors and 0 warnings, then commit your validated header to Git as your certified deterministic milestone.\n\n---", "image_b64": null, "question": {"name": "29 Question: The Stage Gate: Achieving a Zero-Error Audit in Git", "questiontext": "<p>Your header still shows one schema violation when you are ready to commit. What does the stage gate require?</p>", "generalfeedback": "<p>Verify that VS Code reports 0 errors and 0 warnings, then commit your validated header to Git as your certified deterministic milestone.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Resolve it until the Problems counter reads zero errors and zero warnings, then commit and push the validated file with the error count noted in the message.</p>", "feedback": "<p>Correct. Deterministic validation is an all-or-nothing threshold, and the commit message documents that the automated audit passed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Commit the file anyway and note the outstanding violation in the message, since the work can be corrected later.</p>", "feedback": "<p>Incorrect. A single remaining violation means the document cannot be ingested by the downstream pipelines that follow.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Suppress the warning in the editor so the counter reads zero, then commit the suppressed file.</p>", "feedback": "<p>Incorrect. Suppressing a diagnostic changes the report, not the document, and leaves the defect in place.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Commit only once the file also passes every Schematron rule the project might later adopt.</p>", "feedback": "<p>Incorrect. The gate is the active schema reported in the Problems panel, not an open-ended set of future rules.</p>"}]}}, {"step": 30, "title": "Synthesis: The Three-Step Cycle in Action", "content": "**Synthesis: The Three-Step Cycle in Action**\n\nLook back at what you have accomplished across the first two days of Module 02:\n\n1. **Tuesday (Manual Ground Truth)**: You hand-wrote your manuscript description in raw XML. You made human decisions about ink, parchment, and scribal hands, discovering firsthand the tactile complexity of the artifact.\n2. **Wednesday (Deterministic Validation)**: You introduced your draft to the machine. You ran it against the official TEI RELAX NG schema in VS Code, slayed the syntax errors, enriched your entities with authority URIs from the registers appropriate to your document, and recorded its persistent identifier.\n\nYou now possess an authoritative, certified baseline. \n\nWhy was this two-step preparation so crucial?\n\nBecause on **Friday, in Lesson 2.3**, we unleash **Artificial Intelligence**. You will feed raw cataloguing prose and manuscript images into large language models (LLMs) and ask the AI to automatically extract metadata and generate TEI markup.\n\nBecause LLMs are probabilistic, they will hallucinate. They will invent non-existent shelfmarks, mix up folio numbers, and generate invalid XML tags that sound convincing. But on Friday, the AI will not be able to fool you. You will have your human ground truth from Tuesday and your deterministic schema validator from Wednesday. You will measure the AI's output against your baseline, calculate its precision and recall, and discover exactly where AI accelerates scholarship—and where it fails.\n\n**Due today, Wednesday September 9.** Your fully validated `03a_Lesson_2.2_Validated_Witness_Header.xml` committed and pushed to GitHub with zero schema errors.\n\n**Next class (Friday).** Step 3: Probabilistic AI-assisted metadata extraction, entity recognition, and scoring AI accuracy against human ground truth.\n\n**Takeaway:** Manual ground truth plus deterministic validation creates the rigorous foundation needed to evaluate and control probabilistic AI on Friday.\n\n---\n\n## References\n\nBlackwell, C. W., & Smith, N. (2019). The CITE Architecture: A framework for linked data in the humanities. *Digital Humanities Quarterly, 13*(1).\n\nBodleian Libraries. (2024). *Bodleian TEI manuscript description schema (msdesc.odd)*. University of Oxford. https://github.com/bodleian/consolidated-tei-schema\n\nCummings, J. (2018). The Text Encoding Initiative and the study of literature. In *A New Companion to Digital Humanities* (pp. 451–476). Wiley-Blackwell.\n\nGriffitts, T. (2020). *Digital philology and the Text Encoding Initiative: Methods for ancient manuscript research*. De Gruyter.\n\nHuskey, S. J. (2024). Committing to reproducibility and explainability: Using Git as a research journal. *International Journal of Digital Humanities, 6*, 9–21. https://doi.org/10.1007/s42803-023-00076-9\n\nHyvönen, E., et al. (2021). Mapping Manuscript Migrations: A knowledge graph and portal for medieval and Renaissance manuscripts. *Digital Humanities Quarterly, 15*(2).\n\nSmith, N., & Blackwell, C. W. (2012). *The Canonical Text Services protocol*. Harvard University Center for Hellenic Studies.\n\nTEI Consortium. (2026). *TEI P5: Guidelines for electronic text encoding and interchange* (Version 4.12.0). https://tei-c.org/guidelines/p5/", "image_b64": null, "question": {"name": "30 Question: Synthesis: The Three-Step Cycle in Action", "questiontext": "<p>Why does the course insist on manual ground truth plus deterministic validation before any AI is introduced?</p>", "generalfeedback": "<p>Manual ground truth plus deterministic validation creates the rigorous foundation needed to evaluate and control probabilistic AI on Friday.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Together they establish a certified baseline against which a probabilistic model's output can be measured for precision and recall.</p>", "feedback": "<p>Correct. Without a verified baseline there is nothing to score the AI against, and the hallucinations it invents cannot be demonstrated.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the AI cannot process a file that has not first passed schema validation.</p>", "feedback": "<p>Incorrect. A model will process any text; the baseline exists to judge the output, not to feed it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the manual and deterministic stages together produce a description more accurate than any automated tool can achieve.</p>", "feedback": "<p>Incorrect. The argument is methodological: the two stages define what correct means so that automated output can be evaluated.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the deterministic stage replaces the human judgement exercised on the first day.</p>", "feedback": "<p>Incorrect. The two steps are complementary — human interpretation, then machine verification — and neither replaces the other.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
