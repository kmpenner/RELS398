    <script>
        const lessonData = {"course_title": "Schema Validation and Authority Control", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "The Rule of the Machine: What \"Deterministic\" Really Means", "content": "**The Rule of the Machine: What \"Deterministic\" Really Means**\n\nYesterday, you sat at your keyboard and made human, interpretive decisions. You looked at a high-resolution photograph of ancient parchment and decided how to describe ink colors, margin widths, and scribal handwriting in TEI XML. That was humanistic intuition at work.\n\nToday, we meet the machine.\n\nIn digital scholarship, we call today's stage **deterministic**. A process is deterministic when identical inputs run through rule-governed algorithms produce the exact same, mathematically verifiable result every single time. There is no guessing, no mood, no statistical approximation, and no creative license. If you feed the number 2 + 2 into a calculator, it does not respond with \"around 4ish\" or write a poetic reflection on the nature of even numbers; it returns 4. Every time. Guaranteed.\n\nWhen you validate your hand-written TEI XML document today, the software will not \"interpret\" your thoughts or grade you on effort. It will evaluate every single bracket, element name, attribute value, and closing slash against a strict mathematical rulebook called a **schema**. If your markup obeys the rulebook to the letter, the validator gives you a clean bill of health. If you missed a single quote mark, misspelled an element name, or put a date inside the wrong container, the validator will stop you cold. That uncompromising strictness is not your enemy; it is the quality assurance that makes digital editions durable for centuries.\n\n**Vocabulary.** *Deterministic* — a computational process governed by explicit rules where identical inputs produce identical, mathematically verifiable outputs with zero variance. *Schema validation* — the algorithmic verification of an XML document against a formal structural rulebook.\n\n**Takeaway:** Deterministic tools evaluate XML against unbending mathematical rules, ensuring that subjective human markup conforms to a rigorous, certified data standard.\n\n---", "image_b64": null, "question": {"name": "01 Question: The Rule of the Machine: What \"Deterministic\" Really Means", "questiontext": "<p>Yesterday you described ink, margins, and scribal hands by human judgement. Today the file meets a deterministic process. What makes a process deterministic?</p>", "generalfeedback": "<p>Deterministic tools evaluate XML against unbending mathematical rules, ensuring that subjective human markup conforms to a rigorous, certified data standard.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Identical inputs run through explicit, rule-governed algorithms produce the identical, mathematically verifiable result every time.</p>", "feedback": "<p>Correct. Determinism means zero variance: the same file in always yields the same verdict out, with no guessing and no creative license.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The process produces a result that a human editor has reviewed and approved before it is reported.</p>", "feedback": "<p>Incorrect. Human review is interpretive judgement; the machine's verdict is produced by rules alone, without any editor in the loop.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The process returns a confidence score rather than a fixed pass or fail, leaving the decision to the scholar.</p>", "feedback": "<p>Incorrect. A confidence score is a probabilistic output; determinism returns the same verdict, not a graded estimate.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The process silently repairs any mistakes it finds so the document always ends up valid.</p>", "feedback": "<p>Incorrect. A validator reports conformance; it does not rewrite your file, and a repaired file would hide the error rather than certify the markup.</p>"}]}}, {"step": 2, "title": "The Rulebook: Schema Languages, and Why TEI Uses RELAX NG", "content": "**The Rulebook: Schema Languages, and Why TEI Uses RELAX NG**\n\nIn Lesson 1.1 you met the difference between well-formed XML and valid XML. Anyone can write *well-formed* XML: tags nest properly and attribute values sit in quotes, so the syntax is correct even if you invent `<cheeseburger price=\"5\">`.\n\nA scholarly community cannot function on invented tags. If one scholar writes `<parchment>`, another `<animalSkin>`, and a third `<vellum>`, no search engine can connect their research. Collaboration needs a shared rulebook defining which tags are permitted, where each may appear, how often each may repeat, and what format attribute values must follow.\n\n**That rulebook is written in a schema language, and there are three you should be able to name.**\n\n| Language | What it is | Strengths and limits |\n| :--- | :--- | :--- |\n| **DTD** (Document Type Definition) | The oldest, inherited from SGML. Declares elements, their order, cardinality and attributes. | Simple and widely supported. **No datatypes** — it cannot say \"this must be a valid date\". Not namespace-aware. |\n| **XSD** (XML Schema Definition) | The W3C standard. Adds a rich system of datatypes and full namespace support. | Very expressive and very verbose. Common in publishing, government and finance. |\n| **RELAX NG** (RNG) | An ISO/IEC standard schema language. Describes permitted structures as patterns over a tree. | Concise, namespace-aware, and supports datatypes. **This is what TEI uses.** |\n\n**Why RELAX NG for TEI?** TEI is enormous — over 500 elements and thousands of attributes — and it is *customised*: every project selects the subset it needs. RELAX NG handles that scale while staying readable, and it interoperates cleanly with the ODD system you will meet later in this lesson, where a single customization file generates the schema. TEI also pairs RELAX NG with **Schematron** for rules a grammar cannot express.\n\n**A DTD is not a lesser curiosity.** You will meet them constantly in older digital editions and in library systems, and many archival formats still ship one. Knowing which language a document's schema is written in tells you which tool can check it — which is the subject of the next section.\n\n**Vocabulary.** *DTD* — Document Type Definition; the original XML schema language, without datatypes. *XSD* — XML Schema Definition; the W3C schema language. *RELAX NG* — the ISO schema language TEI uses. *Schematron* — a rule-based assertion language for constraints a grammar cannot state.\n\n**Takeaway:** Three schema languages matter — DTD (oldest, no datatypes), XSD (W3C, rich but verbose), and RELAX NG (concise, namespace-aware, and TEI's choice) — and identifying which one a document uses tells you which tool can validate it.\n\n---", "image_b64": null, "question": {"name": "02 Question: The Rulebook: Schema Languages, and Why TEI Uses RELAX NG", "questiontext": "<p>TEI writes its schemas in RELAX NG rather than DTD or XSD. What is the main reason?</p>", "generalfeedback": "<p>Three schema languages matter — DTD (oldest, no datatypes), XSD (W3C, rich but verbose), and RELAX NG (concise, namespace-aware, and TEI's choice) — and identifying which one a document uses tells you which tool can validate it.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It is concise, namespace-aware and supports datatypes, which suits TEI's scale and its customisable subsets — unlike DTD, which has no datatypes, or XSD, which is far more verbose.</p>", "feedback": "<p>Correct. All three languages can state which tags are legal and where; the choice turns on datatypes, namespaces and readability at TEI's scale.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>RELAX NG is the only schema language that can express element order and cardinality.</p>", "feedback": "<p>Incorrect. DTD and XSD can both constrain order and repetition; that is not what distinguishes them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>DTD and XSD are proprietary, so TEI had to adopt an open standard.</p>", "feedback": "<p>Incorrect. DTD came from SGML and XSD is a W3C Recommendation — both open. The reasons are technical, not licensing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>RELAX NG is the only one that can be generated automatically from a single customization file.</p>", "feedback": "<p>Incorrect. The ODD system can generate other schema formats too; RELAX NG is simply TEI's default output.</p>"}]}}, {"step": 3, "title": "Setting Up VS Code, and Which Extension Checks What", "content": "**Setting Up VS Code, and Which Extension Checks What**\n\nYou wrote your header in the shell. Now you get an editor, and the editor is where validation becomes continuous rather than a thing you run and read.\n\n**Install two extensions, because they do different jobs.**\n\n| Extension | Marketplace id | What it validates |\n| :--- | :--- | :--- |\n| **Red Hat XML** | `redhat.vscode-xml` | The general-purpose XML extension. Handles **DTD and XSD**, and gives you completion, formatting and navigation for XML generally. |\n| **Scholarly XML** | `raffazizzi.sxml` | Purpose-built for academic encoding: a **RELAX NG and Schematron validator** with schema-aware autocomplete. This is the one that checks TEI. |\n\n**Scholarly XML is the tool this module depends on**, and it is worth knowing why it is the right choice for a course rather than a research workstation. It **does not require Java** — it is built on a TypeScript RELAX NG implementation — which its publisher notes makes it *\"easy to install for use with students, in workshops, and in minimal computing projects.\"* It won the **Rahtz Prize for TEI Ingenuity** in 2024 and is maintained by Raff Viglianti.\n\n**Connect your file to the schema.** To make either extension check your document, add a processing instruction called `xml-model` at the very top, immediately beneath the XML declaration:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?xml-model href=\"https://raw.githubusercontent.com/msdesc/consolidated-tei-schema/master/msdesc.rng\" \n            type=\"application/xml\" \n            schematypens=\"http://relaxng.org/ns/structure/1.0\"?>\n<TEI xmlns=\"http://www.tei-c.org/ns/1.0\">\n```\n\nNote the `schematypens` value: it declares which *schema language* the target is written in. That attribute is how the editor knows it is being asked to apply RELAX NG rather than a DTD.\n\n**The trap, and it is the most dangerous one in this module.** If you have only Red Hat XML installed and no RELAX NG validator, your file will report **zero errors** — not because it is correct, but because nothing is inspecting it. A clean Problems panel from the wrong tool is a false negative, and it looks exactly like success. **Confirm which extension is doing the checking before you trust a green tick.**\n\n**Takeaway:** Install Red Hat XML for general XML work and Scholarly XML for RELAX NG and Schematron, connect the file with `xml-model` and its `schematypens`, and never trust a clean Problems panel until you know which extension produced it.\n\n---", "image_b64": null, "question": {"name": "03 Question: Setting Up VS Code, and Which Extension Checks What", "questiontext": "<p>You have only the Red Hat XML extension installed, open your TEI header, and the Problems panel reports zero errors. Why is that not good news?</p>", "generalfeedback": "<p>Install Red Hat XML for general XML work and Scholarly XML for RELAX NG and Schematron, connect the file with `xml-model` and its `schematypens`, and never trust a clean Problems panel until you know which extension produced it.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Red Hat XML is the general XML extension; the RELAX NG validation TEI needs comes from Scholarly XML, so nothing may have been checking your file at all.</p>", "feedback": "<p>Correct. Scholarly XML is the RELAX NG and Schematron validator; a clean panel from the wrong tool is a false negative, and it looks exactly like success.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Red Hat XML suppresses errors until you save the file manually.</p>", "feedback": "<p>Incorrect. The extension validates on open and on change; the issue is which schema language it is applying, not when.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The schema is cached, so the first run after installing an extension always reports clean.</p>", "feedback": "<p>Incorrect. A schema may be downloaded on first use, but a successful download does not produce a false clean result.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Zero errors means the header is valid, so no further check is needed.</p>", "feedback": "<p>Incorrect. That is the assumption this section exists to break — validity claims are only as good as the tool that made them.</p>"}]}}, {"step": 4, "title": "Structural Rules and Element Hierarchy in RNG", "content": "**Structural Rules and Element Hierarchy in RNG**\n\nHow does a RELAX NG schema actually make decisions about your text? It evaluates your document as an ordered hierarchy of containers.\n\nInside a schema, elements are defined with specific rules regarding their children:\n\n- **Sequence (`<rng:group>`)**: Elements must appear in an exact chronological order. For example, inside `<fileDesc>`, TEI demands that `<titleStmt>` must come *before* `<publicationStmt>`, and `<publicationStmt>` must come *before* `<sourceDesc>`. If you flip the order, the schema flags an error!\n- **Choice (`<rng:choice>`)**: You must provide one option from a set of alternatives (e.g. choose between `<p>` for prose description or `<msItem>` for structured listing).\n- **Cardinality (`<rng:zeroOrMore>`, `<rng:oneOrMore>`, `<rng:optional>`)**: Governs how many times an element can appear. You can have multiple `<editor>` elements, but only one `<msIdentifier>` per manuscript description.\n\nWhen you see a validation error that says *\"Element 'sourceDesc' is not allowed here\"*, the validator is rarely saying that `<sourceDesc>` doesn't exist. It is usually telling you that you put it in the wrong order or nested it inside the wrong parent box!\n\n**Vocabulary.** *Sequence* — a schema constraint requiring child elements to appear in a strict, predefined order. *Cardinality* — rules defining the minimum and maximum number of times an element may legally appear within a parent container.\n\n**Takeaway:** Schema validators check not only whether tags exist, but whether they appear in the correct sequence and within the correct parent container.\n\n---", "image_b64": null, "question": {"name": "04 Question: Structural Rules and Element Hierarchy in RNG", "questiontext": "<p>RELAX NG reports <em>\"Element 'sourceDesc' is not allowed here\"</em> on a header that closes <code>&lt;fileDesc&gt;</code> before adding <code>&lt;sourceDesc&gt;</code>. What is the validator actually objecting to?</p>", "generalfeedback": "<p>Schema validators check not only whether tags exist, but whether they appear in the correct sequence and within the correct parent container.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The sequence rule: <code>&lt;titleStmt&gt;</code>, <code>&lt;publicationStmt&gt;</code>, and <code>&lt;sourceDesc&gt;</code> must appear in that order inside <code>&lt;fileDesc&gt;</code>.</p>", "feedback": "<p>Correct. The element is legal, but it has landed in the wrong place in the ordered hierarchy, which is what the message means.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The element does not exist in the TEI vocabulary and must be spelled differently.</p>", "feedback": "<p>Incorrect. <code>&lt;sourceDesc&gt;</code> is a standard TEI element; a misspelling would produce a different message naming an unknown element.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>&lt;sourceDesc&gt;</code> is optional, so the schema treats any instance of it as surplus.", "feedback": "<p>Incorrect. In a manuscript header the element is required; the complaint is about its position, not its presence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Cardinality has been exceeded, because <code>&lt;fileDesc&gt;</code> can contain only one child element.</p>", "feedback": "<p>Incorrect. <code>&lt;fileDesc&gt;</code> must contain several children; cardinality limits repetition, not the number of distinct children.</p>"}]}}, {"step": 5, "title": "Data Typing, Enumerations, and Attribute Constraints", "content": "**Data Typing, Enumerations, and Attribute Constraints**\n\nA schema does not just check tag names; it polices what goes *inside* those tags and attributes.\n\nIn computer science, unformatted text is called a \"string\". If a computer asks for a date and you type \"sometime during the reign of Charlemagne, probably a chilly autumn\", a human understands, but a database cannot calculate how many years passed between that event and the Norman Conquest.\n\nSchemas enforce **datatypes**:\n\n1. **ISO 8601 Dates**: In attributes like `when=\"1050\"`, `notBefore=\"1000\"`, or `notAfter=\"1099\"`, the schema demands standard numerical formats (`YYYY` or `YYYY-MM-DD`). If you write `when=\"about 1050\"`, validation fails.\n2. **Enumerated Lists**: For certain attributes, the schema restricts you to a closed list of legal keywords. In `<supportDesc material=\"...\">`, you must choose from authorized values like `\"parchment\"`, `\"papyrus\"`, or `\"paper\"`. If you type `material=\"animal_skin\"`, the validator flags it because it violates the enumeration.\n3. **URIs and URLs**: In `ref=\"...\"` or `target=\"...\"`, the schema checks that the value is a properly formatted web address or persistent identifier.\n\nBy enforcing strict datatypes, the schema ensures that your edition can be filtered, sorted, and calculated by automated algorithms worldwide.\n\n**Vocabulary.** *Datatype* — a classification identifying the type of data a value can hold (e.g., integer, boolean, ISO date string). *Enumeration* — a closed, restricted set of allowable values for a specific attribute.\n\n**Takeaway:** Schemas enforce datatypes and closed vocabulary enumerations, preventing fuzzy text from breaking automated database calculations.\n\n---", "image_b64": null, "question": {"name": "05 Question: Data Typing, Enumerations, and Attribute Constraints", "questiontext": "<p>You write <code>&lt;supportDesc material=\"animal_skin\"&gt;</code> and <code>when=\"about 1050\"</code>. Which description of the schema's response is right?</p>", "generalfeedback": "<p>Schemas enforce datatypes and closed vocabulary enumerations, preventing fuzzy text from breaking automated database calculations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Both fail: <code>@material</code> is checked against a closed enumeration and <code>@when</code> against an ISO 8601 date format.</p>", "feedback": "<p>Correct. Datatypes police the value space and enumerations police the permitted keyword list, so fuzzy prose fails in an attribute even when a human would understand it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Both pass, because a schema checks only element nesting and never the contents of attributes.</p>", "feedback": "<p>Incorrect. Attribute datatypes and enumerations are exactly what a schema enforces; only element content is left comparatively free.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>@material</code> fails but <code>@when</code> passes, since dates are free text in TEI attributes.", "feedback": "<p>Incorrect. <code>@when</code> is constrained to ISO 8601; that is what makes chronology machine-computable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>@when</code> fails but <code>@material</code> passes, since material values are project-defined.", "feedback": "<p>Incorrect. <code>@material</code> draws on an authorized vocabulary; only an institution's ODD can narrow it further, not a cataloguer's invention.</p>"}]}}, {"step": 6, "title": "Beyond Grammar: The Necessity of Schematron Business Logic", "content": "**Beyond Grammar: The Necessity of Schematron Business Logic**\n\nHere is a surprising truth about RELAX NG schemas: they have blind spots.\n\nA RELAX NG schema is like an English spelling and grammar checker. It knows that *\"The dog chased the cat\"* is grammatically correct. But if you write *\"The two-year-old child drove a commercial Boeing 747 across the Atlantic\"*, the grammar checker sees no problem—subject, verb, object are all in order. It has no idea that the sentence makes no logical sense in the real world.\n\nThe same problem happens in XML. \n\nSuppose in your TEI Header you write:\n```xml\n<handDesc hands=\"1\">\n    <handNote xml:id=\"h1\">...</handNote>\n    <handNote xml:id=\"h2\">...</handNote>\n</handDesc>\n```\nTo RELAX NG, this is valid XML. It has a `<handDesc>` containing `<handNote>` elements. But logically, you have contradicted yourself! You explicitly declared `hands=\"1\"`, yet you immediately listed two distinct scribal hands (`h1` and `h2`)!\n\nTo catch these logical contradictions, digital editors use a complementary technology called **Schematron**. Schematron uses XPath expressions to write \"business rules\" that check real-world relationships across your document.\n\n**Vocabulary.** *Schematron* — a rule-based validation language that asserts business logic, cross-element constraints, and semantic consistency in XML documents. *XPath* — a syntax used to navigate through elements and attributes in an XML document.\n\n**Takeaway:** Grammatical schemas (RELAX NG) check tag structure, while rule-based validators (Schematron) catch real-world logical contradictions and broken cross-references.\n\n---", "image_b64": null, "question": {"name": "06 Question: Beyond Grammar: The Necessity of Schematron Business Logic", "questiontext": "<p>A header declares <code>&lt;handDesc hands=\"1\"&gt;</code> and then lists <code>&lt;handNote xml:id=\"h1\"&gt;</code> and <code>&lt;handNote xml:id=\"h2\"&gt;</code>. RELAX NG raises no error. Why is Schematron needed here?</p>", "generalfeedback": "<p>Grammatical schemas (RELAX NG) check tag structure, while rule-based validators (Schematron) catch real-world logical contradictions and broken cross-references.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The contradiction is semantic, not grammatical: only rule-based validation can compare <code>@hands</code> with the number of <code>&lt;handNote&gt;</code> children.</p>", "feedback": "<p>Correct. RELAX NG sees a permitted parent with permitted children; the logical clash between the count and the list is beyond a grammar.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because RELAX NG cannot count repeated child elements, so it is unable to see the two <code>&lt;handNote&gt;</code> elements.</p>", "feedback": "<p>Incorrect. Cardinality is a core RELAX NG feature; the problem is that \"one hand\" and \"two handNotes\" are two separate facts the grammar never compares.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because <code>&lt;handNote&gt;</code> is not a legal child of <code>&lt;handDesc&gt;</code> and only Schematron knows the permitted hierarchy.</p>", "feedback": "<p>Incorrect. Element hierarchy is exactly what RELAX NG enforces; if the nesting were illegal, the grammar would have caught it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because <code>xml:id</code> values are only validated by Schematron, so the duplicate identifiers went unchecked.</p>", "feedback": "<p>Incorrect. Uniqueness of <code>xml:id</code> is not the issue here, and the two ids are in fact distinct.</p>"}]}}, {"step": 7, "title": "Writing Schematron Rules for Cross-References", "content": "**Writing Schematron Rules for Cross-References**\n\nIn your course project, one of the most powerful uses of Schematron is verifying internal cross-references.\n\nIn Lesson 2.1, you learned to give each scribal hand a unique identifier: `<handNote xml:id=\"h1\">`. Later, in Week 4, when you transcribe text, you will link each line to that scribe using an attribute: `<line hand=\"#h1\">`.\n\nWhat happens if you accidentally type `<line hand=\"#h99\">`?\n\nWithout Schematron, your XML might pass schema validation, but downstream software will crash because hand `#h99` does not exist! A Schematron rule prevents this by writing a simple assertion:\n\n```xml\n<pattern>\n    <rule context=\"tei:line[@hand]\">\n        <assert test=\"substring-after(@hand, '#') = //tei:handNote/@xml:id\">\n            The hand reference <value-of select=\"@hand\"/> must point to an existing handNote xml:id in the header!\n        </assert>\n    </rule>\n</pattern>\n```\n\nIf a reference breaks, Schematron prints a clear, human-readable error message in your editor: *\"The hand reference #h99 must point to an existing handNote xml:id in the header!\"* That is the power of automated structural auditing.\n\n**Vocabulary.** *Cross-reference validation* — verifying that internal pointers (like `#h1`) match real identifier targets (`xml:id=\"h1\"`) declared elsewhere in the document. *Assertion (`<assert>`)* — a Schematron test condition that triggers an error message if evaluated as false.\n\n**Takeaway:** Schematron audits internal pointers across your document, guaranteeing that every hand, scribe, and image reference points to an existing target.\n\n---", "image_b64": null, "question": {"name": "07 Question: Writing Schematron Rules for Cross-References", "questiontext": "<p>Your transcription reads <code>&lt;line hand=\"#h99\"&gt;</code> while the header declares only <code>h1</code> and <code>h2</code>. What does the Schematron assertion on <code>tei:line[@hand]</code> do about it?</p>", "generalfeedback": "<p>Schematron audits internal pointers across your document, guaranteeing that every hand, scribe, and image reference points to an existing target.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It evaluates the XPath test comparing the pointer with the declared <code>@xml:id</code> values and fires its error message when no hand note matches.</p>", "feedback": "<p>Correct. The assertion converts a dangling internal pointer into a clear, human-readable diagnostic instead of a downstream crash.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It repairs the pointer by rewriting <code>#h99</code> to the nearest declared hand identifier.</p>", "feedback": "<p>Incorrect. Schematron asserts; it never edits the document, and guessing which hand was meant would fabricate evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It rejects the file at parse time, because <code>@hand</code> values must be declared in the schema enumeration.</p>", "feedback": "<p>Incorrect. <code>@hand</code> is an IDREF-style attribute; its target's existence is a document-level relationship, not a grammar rule.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It flags the error only when the referenced hand later appears in the transcription body.</p>", "feedback": "<p>Incorrect. The assertion runs against the document as it stands; a pointer to a non-existent target fails immediately.</p>"}]}}, {"step": 8, "title": "Customizing the TEI: The ODD (One Document Does-It-All) Philosophy", "content": "**Customizing the TEI: The ODD (One Document Does-It-All) Philosophy**\n\nThe complete Text Encoding Initiative Guidelines contain over 500 different elements and thousands of attributes. It covers everything from ancient Greek papyri to 19th-century poetry to speech corpora.\n\nIf you tried to validate your student manuscript against the *entire* TEI at once, it would be overwhelming. You could legally put stage directions from a Shakespeare play inside your biblical manuscript description!\n\nTo prevent this chaos, the TEI invented a design philosophy called **ODD (One Document Does-it-all)**.\n\nAn ODD file is a single master document written in TEI XML that defines a project's customized editorial profile. In an ODD file, a research team:\n\n1. Selects only the specific TEI modules they need (e.g., `msdescription`, `textstructure`, `transcr`).\n2. Deletes elements they will never use.\n3. Modifies allowable attribute values to fit their corpus.\n4. Writes documentation explaining *why* they chose those rules.\n\nFrom this single ODD file, automated compilers generate both human-readable HTML documentation and the machine-readable RELAX NG schema (`.rng`) that polices your files!\n\n**Vocabulary.** *ODD (One Document Does-it-all)* — the TEI format combining human-readable documentation, editorial guidelines, and machine-actionable schema specifications in a single XML source. *Subsetting* — creating a tailored profile of the TEI by including only relevant elements for a specific project.\n\n**Takeaway:** The TEI is customized for specific projects through ODD files, which generate both human documentation and strict RELAX NG schemas from a single source.\n\n---", "image_b64": null, "question": {"name": "08 Question: Customizing the TEI: The ODD (One Document Does-It-All) Philosophy", "questiontext": "<p>The full TEI Guidelines offer over 500 elements. Why does a project define an ODD instead of validating against the whole of TEI?</p>", "generalfeedback": "<p>The TEI is customized for specific projects through ODD files, which generate both human documentation and strict RELAX NG schemas from a single source.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The ODD selects the modules a project needs, removes unused elements, narrows attribute values, and documents the reasoning — and from it the schema is generated.</p>", "feedback": "<p>Correct. One master document yields both the human-readable guidelines and the machine-readable RELAX NG schema, so rules and prose cannot drift apart.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The ODD is a pre-built schema downloaded from the TEI Consortium that each project edits by hand into a <code>.rng</code> file.</p>", "feedback": "<p>Incorrect. An ODD is a project's own TEI-XML customization from which the <code>.rng</code> is compiled, not a downloaded file edited by hand.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The ODD restricts what a validator can report, suppressing errors about elements the project does not use.</p>", "feedback": "<p>Incorrect. Subsetting removes elements from the vocabulary rather than suppressing messages about them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The ODD replaces Schematron, using XPath assertions to enforce cross-element business rules.</p>", "feedback": "<p>Incorrect. An ODD generates the grammar and its documentation; logical cross-element rules still come from Schematron.</p>"}]}}, {"step": 9, "title": "Case Study: The Bodleian `msdesc.odd` Consolidated Schema", "content": "**Case Study: The Bodleian `msdesc.odd` Consolidated Schema**\n\nTo see how world-class institutions use this workflow, look at the **Bodleian Libraries at the University of Oxford**.\n\nThe Bodleian holds tens of thousands of medieval and Renaissance manuscripts in dozens of languages (Greek, Latin, Arabic, Hebrew, Armenian). To catalogue these treasures consistently across hundreds of scholars, the Bodleian developed `msdesc.odd` — a consolidated manuscript description schema.\n\nInstead of allowing cataloguers to invent whatever markup they pleased, the Bodleian schema strictly enforces:\n\n- Standardized settlement and repository naming conventions.\n- Mandatory `<supportDesc>` declarations with controlled vocabulary for parchment and paper.\n- Standardized foliation formats (`f. 1r`, `f. 1v`).\n- Automated linking to the Bodleian's internal digital library authority records.\n\nThe schema we link to in this course (`msdesc.rng`) is directly derived from these international consortium best practices. When your file validates against it, your work meets the exact same technical standard used by Oxford University.\n\n**Vocabulary.** *Consolidated schema* — an institutional TEI customization that unifies cataloguing rules across large, heterogeneous archival collections. *Standardization* — adopting uniform encoding conventions across diverse manuscript traditions.\n\n**Takeaway:** Major archives like Oxford's Bodleian Library rely on customized TEI schemas to ensure consistent cataloguing across thousands of historical manuscripts.\n\n---", "image_b64": null, "question": {"name": "09 Question: Case Study: The Bodleian `msdesc.odd` Consolidated Schema", "questiontext": "<p>The Bodleian holds manuscripts in dozens of languages, catalogued by hundreds of scholars. What does <code>msdesc.odd</code> enforce across that diversity?</p>", "generalfeedback": "<p>Major archives like Oxford's Bodleian Library rely on customized TEI schemas to ensure consistent cataloguing across thousands of historical manuscripts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Uniform repository naming, mandatory <code>&lt;supportDesc&gt;</code> declarations with controlled material vocabulary, standard foliation formats, and links to the library's own authority records.</p>", "feedback": "<p>Correct. A consolidated schema is what makes records from many cataloguers comparable at the same technical standard.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A single shared language of description that cataloguers must translate their source material into before encoding.</p>", "feedback": "<p>Incorrect. The schema standardizes encoding conventions; the manuscripts' own languages are unaffected.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A fixed template of manuscript descriptions that cataloguers fill in by substituting values into boilerplate prose.</p>", "feedback": "<p>Incorrect. The ODD constrains structure and vocabulary, not a single prescribed text to be filled in.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A guarantee that every described manuscript has been digitized to a common imaging standard.</p>", "feedback": "<p>Incorrect. The schema governs the TEI description, which can be written for an undigitized manuscript as easily as a digitized one.</p>"}]}}, {"step": 10, "title": "Case Study: Bibliotheca Laureshamensis and the ENRICH Schema", "content": "**Case Study: Bibliotheca Laureshamensis and the ENRICH Schema**\n\nAnother landmark case study in digital codicology is the **Bibliotheca Laureshamensis** (the virtual reconstruction of the medieval monastic library of Lorsch, Germany).\n\nDuring the Reformation and the Thirty Years' War, the magnificent 8th-century library of Lorsch was dispersed across the globe. Today, its surviving codices are scattered across 73 libraries in 12 countries, including Heidelberg, Rome, London, and Vienna.\n\nHow do you digitally reunite a library that has been physically shattered for four centuries?\n\nBy using the **ENRICH (European Network for Research on Information and Cultural Heritage) TEI schema**. Participating libraries in Germany, the Vatican, and the UK each catalogued their physical holdings according to the shared ENRICH schema. Because the metadata was strictly valid and interoperable, a unified search portal was able to ingest XML records from 73 independent institutions and virtually assemble the entire monastic library on a single screen. That is the triumph of deterministic standards over local isolation.\n\n**Vocabulary.** *Virtual reunification* — digitally aggregating separated leaves, quires, or entire manuscripts preserved in different global archives into a single unified scholarly resource. *Interoperability* — the ability of diverse computer systems to exchange and use data without custom conversion.\n\n**Takeaway:** The virtual reconstruction of Lorsch Abbey demonstrates how shared XML schemas allow globally scattered manuscript collections to be digitally reunited.\n\n---", "image_b64": null, "question": {"name": "10 Question: Case Study: Bibliotheca Laureshamensis and the ENRICH Schema", "questiontext": "<p>The library of Lorsch was dispersed during the Reformation and the Thirty Years' War; its codices now sit in 73 libraries in 12 countries. How was it virtually reunified?</p>", "generalfeedback": "<p>The virtual reconstruction of Lorsch Abbey demonstrates how shared XML schemas allow globally scattered manuscript collections to be digitally reunited.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Participating libraries each catalogued their holdings under the shared ENRICH schema, so one portal could ingest records from 73 independent institutions.</p>", "feedback": "<p>Correct. Interoperable metadata, not physical movement, is what reassembled the collection on a single screen.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The surviving codices were loaned or transferred back to Lorsch so they could be catalogued together in one place.</p>", "feedback": "<p>Incorrect. The manuscripts remain dispersed in their holding institutions; the reunification is entirely digital.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Each library's records were converted by hand into one common format by a central cataloguing team.</p>", "feedback": "<p>Incorrect. The point of a shared schema is that records are already interoperable, so no bespoke conversion is needed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A single large manuscript database was purchased and all competing records were discarded.</p>", "feedback": "<p>Incorrect. The project aggregates the participating libraries' own descriptions rather than replacing them.</p>"}]}}, {"step": 11, "title": "Breaking Out of the Silo: Why XML Needs Linked Open Data", "content": "**Breaking Out of the Silo: Why XML Needs Linked Open Data**\n\nValidating your XML file in VS Code is a major milestone. Your file is structurally sound, grammatically clean, and internally consistent.\n\nBut it has one major limitation: **it is an isolated island**.\n\nIf your XML file says:\n```xml\n<origPlace>Halifax</origPlace>\n<author>Thomas Hopson</author>\n```\nA computer knows that \"Halifax\" is a place name and \"Thomas Hopson\" is a person's name. But to the computer, those words are just dumb sequences of text characters (strings). \n\nWhat if another scholar writes `<origPlace>Kjipuktuk</origPlace>` or `<settlement>Halifax, N.S.</settlement>`? What if a French source writes `<author>Thomas Hopsonn</author>`? To an automated search engine, those look like entirely different people and completely different cities!\n\nTo connect our scholarship to the rest of the world, we must move **from strings to things**. We must connect text names to permanent entities in global knowledge graphs. This is the world of **Linked Open Data (LOD)**.\n\n**Vocabulary.** *Data silo* — an isolated repository of data that cannot easily interact with other computer systems. *Linked Open Data (LOD)* — structured data published on the web using open standards, explicitly linked to global knowledge bases.\n\n**Takeaway:** Clean XML markup creates structured documents, but Linked Open Data connects the entities inside those documents to global knowledge networks.\n\n---", "image_b64": null, "question": {"name": "11 Question: Breaking Out of the Silo: Why XML Needs Linked Open Data", "questiontext": "<p>Your validated header records <code>&lt;origPlace&gt;Antigonish&lt;/origPlace&gt;</code>. Another cataloguer's file records <code>&lt;origPlace&gt;Town of Antigonish&lt;/origPlace&gt;</code> for the same town. What is the problem, and what is the remedy?</p>", "generalfeedback": "<p>Clean XML markup creates structured documents, but Linked Open Data connects the entities inside those documents to global knowledge networks.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To the machine both are uninterpreted character strings naming no shared entity, so each name must be linked to a persistent identifier for the place.</p>", "feedback": "<p>Correct. The file is structurally sound and semantically isolated; moving from strings to things is what lets two repositories' records connect.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The two spellings are a validation failure, and the schema should be customized to accept both variants.</p>", "feedback": "<p>Incorrect. Both files validate; the schema constrains markup, and widening it would not tell a machine that the two names denote one city.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A search engine can never find either string, so the names must be indexed in a full-text search service.</p>", "feedback": "<p>Incorrect. Simple keyword search would find them; the failure is automated reasoning about identity, not retrieval.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>One spelling is historically wrong and should be corrected to the form the source document uses.</p>", "feedback": "<p>Incorrect. Editing the name may well be right for the transcription, but it does nothing to link the record to a shared entity.</p>"}]}}, {"step": 12, "title": "Speaking in Triples: The Resource Description Framework (RDF)", "content": "**Speaking in Triples: The Resource Description Framework (RDF)**\n\nHow do computers express knowledge about the real world without getting confused by human language? They use **RDF (Resource Description Framework)**.\n\nAt its core, RDF is astonishingly simple. Every fact in the universe is expressed as a three-part sentence called a **triple**:\n\nSubject -> Predicate -> Object\n\nThink of it like basic English grammar:\n\n- **Subject**: What are we talking about? (*This Manuscript Page*)\n- **Predicate**: What is its relationship or property? (*was copied in*)\n- **Object**: What is the target value? (*Halifax*)\n\nIn RDF, however, we don't use fuzzy English words; we use permanent web addresses (URIs) for each of the three pieces:\n\n- **Subject**: `https://archives.novascotia.ca/mikmaq/archives/?ID=623`\n- **Predicate**: `http://purl.org/dc/terms/spatial`\n- **Object**: `https://pleiades.stoa.org/places/520998`\n\nWhen computers read this triple, there is zero ambiguity. A machine in Tokyo and a machine in Antigonish both resolve that identifier to the same place, with no ambiguity about which Halifax is meant.\n\n**Vocabulary.** *RDF (Resource Description Framework)* — a standard data model for representing information about resources on the web as semantic graphs. *Semantic triple* — a foundational knowledge statement composed of a Subject, a Predicate, and an Object.\n\n**Takeaway:** RDF models knowledge as unambiguous three-part statements (Subject to Predicate to Object), connecting web identifiers into global knowledge graphs.\n\n---", "image_b64": null, "question": {"name": "12 Question: Speaking in Triples: The Resource Description Framework (RDF)", "questiontext": "<p>An RDF statement about your witness reads: subject <code>https://www.wikidata.org/wiki/Q3350</code>, predicate <code>http://purl.org/dc/terms/spatial</code>, object <code>https://www.geonames.org/...</code>. What is the role of each part?</p>", "generalfeedback": "<p>RDF models knowledge as unambiguous three-part statements (Subject to Predicate to Object), connecting web identifiers into global knowledge graphs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The subject is the thing being described, the predicate names the relationship, and the object is the value — all three named by URI rather than by prose words.</p>", "feedback": "<p>Correct. A triple is the subject-predicate-object sentence of Linked Data, and URIs let two machines read it without ambiguity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The subject is the property, the predicate is the value, and the object is the vocabulary that defines the property.</p>", "feedback": "<p>Incorrect. That reverses the roles; the predicate is the property and the object is the value assigned to it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The subject is a literal string, the predicate is a natural-language verb such as \"was copied in\", and the object is a URI.</p>", "feedback": "<p>Incorrect. RDF deliberately replaces fuzzy English words with URIs for every position, including the predicate.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The three parts are the XML element, its attribute, and its text content, serialized as URIs.</p>", "feedback": "<p>Incorrect. Those are components of an XML tree; a triple is a graph edge with no dependence on XML markup.</p>"}]}}, {"step": 13, "title": "From Strings to Real Things: Authority Control in TEI", "content": "**From Strings to Real Things: Authority Control in TEI**\n\nHow do we embed these global Linked Data identifiers directly into our hand-authored TEI Header?\n\nWe use **authority control attributes**, primarily `ref=\"...\"` and `key=\"...\"`.\n\nLook at how we transform plain text into Linked Data:\n\n```xml\n<!-- Before: plain strings with no external reference -->\n<settlement>Antigonish</settlement>\n<repository>Nova Scotia Archives</repository>\n<origPlace>Halifax</origPlace>\n\n<!-- After: connected to authority records -->\n<settlement ref=\"https://www.wikidata.org/wiki/Q3350\">Antigonish</settlement>\n<repository ref=\"http://viaf.org/viaf/...\">Nova Scotia Archives</repository>\n<origPlace ref=\"https://www.geonames.org/...\">Halifax</origPlace>\n```\n\nLook at the difference. The human reader still sees the familiar words. But underneath, the computer follows the `ref` attribute straight to the authority record. Automated tools can then crawl your edition, pull the coordinates or the institutional identity, and connect your document to everything else described by the same registers.\n\n**Vocabulary.** *Authority control* — the practice of linking variant names and terms to a single standardized identifier in an established cultural register. *`ref` attribute* — the TEI attribute used to point directly to a canonical URI or authority record.\n\n**Takeaway:** By adding `ref` attributes to names and places, your TEI Header links human-readable text to permanent machine-readable authority records.\n\n---", "image_b64": null, "question": {"name": "13 Question: From Strings to Real Things: Authority Control in TEI", "questiontext": "<p>How do you convert <code>&lt;repository&gt;Nova Scotia Archives&lt;/repository&gt;</code> in your header into an authority-controlled reference?</p>", "generalfeedback": "<p>By adding `ref` attributes to names and places, your TEI Header links human-readable text to permanent machine-readable authority records.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Add a <code>@ref</code> attribute carrying the institution's canonical URI, keeping the human-readable name as the element's text.</p>", "feedback": "<p>Correct. The reader still sees the familiar name while the machine follows the URI to the authority record for the institution.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the repository name with the authority URI, since only the URI is machine-actionable.</p>", "feedback": "<p>Incorrect. Dropping the readable text removes what a human reader needs, and authority control keeps both layers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Add the URI in a <code>&lt;note&gt;</code> beside the element so the reference is preserved without altering the markup.</p>", "feedback": "<p>Incorrect. A note is prose; automated tools follow <code>@ref</code>, not free text inside a note.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Wrap the repository name in a <code>&lt;ptr&gt;</code> element nested inside <code>&lt;repository&gt;</code>.</p>", "feedback": "<p>Incorrect. The standard mechanism here is <code>@ref</code> on the element that names the entity, not a nested pointer element.</p>"}]}}, {"step": 14, "title": "The Authority Registers: A General Layer and a Tradition-Specific Layer", "content": "**The Authority Registers: A General Layer and a Tradition-Specific Layer**\n\nWhere do you find these URIs for your document's entities? You look them up in recognized authority registers — but there are two layers, and only the first is universal.\n\n**The general layer applies to almost any historical document:**\n\n1. **VIAF (Virtual International Authority File)** (`viaf.org`): The gold standard for historical people and corporate bodies. It combines authority files from the Library of Congress, the British Library, the Bibliothèque nationale de France, and many others into a single identifier for a person or institution.\n2. **Wikidata** (`wikidata.org`): The open, multilingual knowledge graph. A `Q` number identifies a person, place, work, or institution, and it links out to every other register.\n3. **Library of Congress authorities** (`id.loc.gov`): LCCN and name/title authorities. Strong for printed material and for American imprints in particular.\n4. **Getty Vocabularies** (`getty.edu/research/tools/vocabularies/`):\n   - **TGN (Thesaurus of Geographic Names)**: global geographic authority, for `<origPlace>` and `<settlement>`.\n   - **AAT (Art & Architecture Thesaurus)**: standard terms for materials, scripts, and techniques — for example \"parchment\", \"laid paper\", \"cursive\".\n5. **GeoNames** (`geonames.org`): a general gazetteer, useful for modern place names when TGN has no entry.\n\n**The tradition-specific layer is where documents diverge.** A register built for one scholarly tradition will not describe a document from another, and choosing the wrong register is a methodological error rather than a harmless one:\n\n| Your document | The registers that actually govern it |\n| :--- | :--- |\n| A **Greek literary manuscript** | **Trismegistos** (the text as a documented object), **Pinakes** (the work and the manuscripts carrying it), **Diktyon** (the physical Greek codex), and **Pleiades** for ancient places. |\n| A **French act** (Ancien Régime or Revolutionary) | **Archives nationales** cotes; **Gallica / BnF ARK** identifiers of the form `ark:/12148/...`; **FranceArchives**. The series differs by era — Y (Châtelet) for pre-1789 police acts, D (Comité des décrets) for 1789–an II. |\n| A **Peace and Friendship Treaty document** | **Nova Scotia Archives** references (`RG 1 volume ... number ...`); **Library and Archives Canada**; the **National Archives (UK)**, Colonial Office papers `CO 217`. |\n| A **19th-century American literary manuscript** | **Emily Dickinson Archive**; **Houghton Library** call numbers in the `MS Am 1118.x` series; **Amherst College** `AC` accession numbers. |\n\nNeither Trismegistos nor Pleiades will help you with a French decree, a treaty, or a Dickinson poem. That does not mean those documents lack authority control; it means their authority lives in different registers, and **finding out which is part of the scholarly work**.\n\n**In your lab work today**, identify the general-layer record for the person or institution attached to your document, then find at least one tradition-specific identifier and confirm it resolves to the right object.\n\n**A warning about verification.** Some registers return a success response for identifiers that do not exist. A VIAF URL with an invented number still loads a page. **Do not validate an identifier by checking that the link opens** — open the record and read its content against an independent source. A live link is not evidence.\n\n**Vocabulary.** *Authority control* — linking variant names and terms to a single standardized identifier in an established register. *VIAF* — Virtual International Authority File, linking personal and corporate identities across national libraries. *Gazetteer* — a geographical dictionary or register; TGN and GeoNames are gazetteers.\n\n**Takeaway:** Authority control has a general layer (VIAF, Wikidata, LC, Getty) that works for almost anything, and a tradition-specific layer that does not transfer between traditions. Identify both, justify why each register governs your document, and verify by reading the record rather than by checking that the link loads.\n\n---", "image_b64": null, "question": {"name": "14 Question: The Authority Registers: A General Layer and a Tradition-Specific Layer", "questiontext": "<p>Which statement about authority registers matches how this course divides them?</p>", "generalfeedback": "<p>Authority control has a general layer (VIAF, Wikidata, LC, Getty) that works for almost anything, and a tradition-specific layer that does not transfer between traditions. Identify both, justify why each register governs your document, and verify by reading the record rather than by checking that the link loads.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Registers such as VIAF, Wikidata, Library of Congress, and Getty apply broadly, while a tradition-specific register governs only documents of its own tradition.</p>", "feedback": "<p>Correct. Choosing a register built for the wrong tradition is a methodological error, not a harmless extra link.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>General registers cover institutions and tradition-specific registers cover physical objects, and between them every document is fully covered.</p>", "feedback": "<p>Incorrect. The split is by tradition, not by object type, and no register set is automatically complete for a document.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Any register may be used for any document, provided the identifier resolves to a record of some kind.</p>", "feedback": "<p>Incorrect. A resolving identifier from the wrong register describes the wrong kind of object, and a link that loads is not evidence of relevance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Tradition-specific registers are older and less reliable, so general registers should be used in preference wherever possible.</p>", "feedback": "<p>Incorrect. The two layers answer different questions; the tradition-specific register is often the only one that governs the object.</p>"}]}}, {"step": 15, "title": "Mapping Manuscript Migrations (MMM): Harmonizing Global Data", "content": "**Mapping Manuscript Migrations (MMM): Harmonizing Global Data**\n\nTo see the staggering power of Linked Open Data in codicology, consider the **Mapping Manuscript Migrations (MMM)** project.\n\nFor centuries, scholars had no way to track how manuscripts moved across Europe between the Middle Ages and the twentieth century. Data was trapped in separate institutional databases: the Schoenberg Database of Manuscripts at Penn, the Bibale database in Paris, and the Medieval Manuscripts in Oxford Libraries portal.\n\nThe MMM project took over 500,000 manuscript records from these three independent institutions, converted their metadata into RDF triples, and linked them through shared authority IDs (VIAF, Wikidata, and TGN).\n\nThe result? \n\nAn interactive computational platform (`mappingmanuscriptmigrations.org`) where researchers can track the entire lifetime journey of a manuscript. You can see how a codex copied in a German monastery in 1100 was sold to an Italian merchant in 1520, bought by an English duke in 1740, and purchased by an American university in 1950. That global visualization is only possible because independent cataloguers agreed on shared Linked Data identifiers.\n\n**Vocabulary.** *Data harmonization* — integrating disparate data formats from multiple archives into a unified, coherent semantic model. *Schoenberg Database of Manuscripts (SDBM)* — an international database tracking manuscript provenance, sales, and migrations.\n\n**Takeaway:** The Mapping Manuscript Migrations project proves how linking local catalog records to shared RDF authorities unlocks global historical patterns of manuscript trade and provenance.\n\n---", "image_b64": null, "question": {"name": "15 Question: Mapping Manuscript Migrations (MMM): Harmonizing Global Data", "questiontext": "<p>MMM combined over 500,000 records from the Schoenberg Database, Bibale, and the Oxford medieval manuscripts portal. What made that harmonization possible?</p>", "generalfeedback": "<p>The Mapping Manuscript Migrations project proves how linking local catalog records to shared RDF authorities unlocks global historical patterns of manuscript trade and provenance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Each institution's metadata was converted into RDF triples and linked through shared authority identifiers, so provenance events across collections could be joined.</p>", "feedback": "<p>Correct. Shared authority IDs are the join key that turns three separate catalogues into one queryable graph of manuscript movement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The three databases were merged into a single centralized catalogue with one institution as its maintainer.</p>", "feedback": "<p>Incorrect. The source databases remain separate; MMM links across them rather than absorbing them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Each institution rewrote its records to a single agreed prose template for provenance statements.</p>", "feedback": "<p>Incorrect. Harmonization operates on structured triples, not on standardizing the wording of prose descriptions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The records were matched by comparing manuscript titles and dates with a string-similarity algorithm.</p>", "feedback": "<p>Incorrect. Shared identifiers, not approximate string matching, are what link records to the same entity reliably.</p>"}]}}, {"step": 16, "title": "Wikibase and Knowledge Graphs for Codicology", "content": "**Wikibase and Knowledge Graphs for Codicology**\n\nIn recent years, the digital humanities community has embraced **Wikibase** — the open-source software engine behind Wikidata — as a flexible platform for building domain-specific knowledge graphs.\n\nWhy Wikibase?\n\nTraditional relational databases are rigid: they require fixed tables with predefined columns. If you discover an unexpected codicological detail (such as a 14th-century merchant's shopping list scribbled on a flyleaf), a traditional database has nowhere to put it. \n\nA knowledge graph, by contrast, is a living web of nodes and edges. You can connect any entity to any other entity using typed properties:\n\n- *Manuscript X* -> `hasBinding` -> *16th-century pigskin*\n- *Manuscript X* -> `containsAnnotationBy` -> *Erasmus of Rotterdam*\n- *Erasmus of Rotterdam* -> `studiedAt` -> *University of Paris*\n\nWhen your TEI Header includes Wikidata identifiers (`ref=\"https://www.wikidata.org/wiki/Q...\"`), external knowledge graphs can ingest your edition and automatically connect your full-page witness to millions of related historical facts.\n\n**Vocabulary.** *Knowledge graph* — a network of real-world entities and their semantic relationships, represented as interconnected nodes and edges. *Wikibase* — the open-source software used to create collaborative, machine-actionable knowledge graphs.\n\n**Takeaway:** Knowledge graphs represent complex, interconnected manuscript histories as living networks of entities and relationships, easily enriched by TEI metadata.\n\n---", "image_b64": null, "question": {"name": "16 Question: Wikibase and Knowledge Graphs for Codicology", "questiontext": "<p>A 14th-century merchant's shopping list turns up scribbled on a flyleaf of your manuscript. Why is a knowledge graph better placed to record this than a fixed relational table?</p>", "generalfeedback": "<p>Knowledge graphs represent complex, interconnected manuscript histories as living networks of entities and relationships, easily enriched by TEI metadata.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A graph connects any entity to any other through typed properties, so an unexpected kind of detail needs a new statement rather than a new column.</p>", "feedback": "<p>Correct. The model is a living web of nodes and edges, and typed properties let codicological discoveries be added as they arise.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A graph stores all values as free text, so unusual details can be typed in without designing a schema for them.</p>", "feedback": "<p>Incorrect. Graph statements are structured subject-predicate-object claims, not unstructured text fields.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A graph is simply a faster database because it keeps related records adjacent on disk.</p>", "feedback": "<p>Incorrect. Performance is not the argument; the difference is how the data model accommodates unforeseen relationships.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A graph requires no identifiers, so the shopping list can be recorded without naming the manuscript it sits in.</p>", "feedback": "<p>Incorrect. Entities and properties in a knowledge graph are identified, which is what makes the claims queryable and linkable.</p>"}]}}, {"step": 17, "title": "Link Rot and 404s: Why Regular Web Links Fail Ancient Documents", "content": "**Link Rot and 404s: Why Regular Web Links Fail Ancient Documents**\n\nNow let us tackle a second great danger in digital scholarship: **the crisis of broken citations**.\n\nSuppose you are writing a research paper and you cite an online manuscript image like this:\n`https://www.somelibrary.edu/special-collections/greek/mss/box4/image23.jpg`\n\nWhat happens in three years when the library updates its web server? What happens when the library renames its website, reorganizes its digital collections, or goes through a rebranding campaign?\n\n**404 Not Found. The link dies.**\n\nThis disease is known as **link rot**. In computational scholarship, relying on standard web URLs is fatal. If the citations in your digital edition break after five years, your scholarship is useless to the next generation of researchers.\n\nYour three documents have survived two to three centuries, and some have outlived every catalogue that ever described them. The Emily Dickinson poem survived because Houghton has kept it; the 1791 decree survives in the Archives nationales; the 1752 treaty survives in a printed copy because no original does. Each will need to be citable in another century. How do you build a citation that lasts as long as the object? Not with a web address.\n\n**Vocabulary.** *Link rot* — the phenomenon where web links become broken and point to missing resources (404 errors) as servers and website structures change over time. *Ephemerality* — the fragile, short-lived nature of standard web URLs.\n\n**Takeaway:** Standard web URLs are fragile and prone to link rot; scholarly editions require persistent, location-independent citation architectures that outlive server reboots.\n\n---", "image_b64": null, "question": {"name": "17 Question: Link Rot and 404s: Why Regular Web Links Fail Ancient Documents", "questiontext": "<p>Your edition cites a facsimile at <code>https://www.somelibrary.edu/special-collections/greek/mss/box4/image23.jpg</code>. Why is this an unacceptable citation for scholarship that should last?</p>", "generalfeedback": "<p>Standard web URLs are fragile and prone to link rot; scholarly editions require persistent, location-independent citation architectures that outlive server reboots.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The URL names a location on one server, so a reorganization, rename, or rebranding turns the citation into a 404 with nothing to fall back on.</p>", "feedback": "<p>Correct. Link rot is the predictable consequence of citing a temporary address rather than an identifier independent of it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The URL is too long and complex to be printed accurately in a journal article.</p>", "feedback": "<p>Incorrect. Length is not the defect; even a short URL dies with the server path it encodes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The URL points to an image rather than to a text, and images cannot be cited in scholarly editions.</p>", "feedback": "<p>Incorrect. Images are cited routinely; the problem is the instability of the address, not the medium.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The URL lacks a file extension that identifies the resource type to a resolver.</p>", "feedback": "<p>Incorrect. The extension is present, and in any case it would not make the address survive a server reorganization.</p>"}]}}, {"step": 18, "title": "Citing a Structure, Not a File", "content": "**Citing a Structure, Not a File**\n\nTo understand why canonical citation matters, separate two things that are easy to confuse: the **logical structure** of a text, and the **physical carrier** it happens to sit on.\n\nConsider any document you might edit:\n\n- A **treaty** has articles and clauses, and it exists in several exemplars — a printed proclamation, manuscript copies in council registers, a transcription sent to London. The *text* of the treaty is one thing; each *carrier* is another.\n- A **French act** has a preamble, a dispositif, and a dating clause. Before 1789 a royal *édit* or *ordonnance* might survive as a sealed parchment original, as a registration in a court's register, and as a printed piece in a *recueil*. After 1789 the instrument is a *décret* of the Assemblée, and it may survive as a printed placard, an entry in the *procès-verbaux*, or a ministerial circular. Either way: three carriers, one act.\n- A **Dickinson poem** has stanzas and lines. It may exist as a pencil draft on wrapping paper, a fair copy, and a transcription in a printed edition. The poem is not the paper.\n\nThe principle this illustrates — that a text has a structure independent of the object carrying it — is what makes durable citation possible. If your citation points at the *structure* (article 3 of the treaty, verse 4 of the poem) rather than at *this file on this server*, the citation survives the server being reorganised.\n\nDifferent traditions formalise this differently. Classical philology built the **CITE Architecture** and the **OHCO2 model** (\"Ordered Hierarchy of Content Objects\") for Greek and Latin texts, and **CTS URNs** to address them. Modern archival practice uses persistent identifiers like **ARK**. Library cataloguing uses call numbers plus series structure. The implementations differ; the underlying insight is the same.\n\n**Vocabulary.** *Logical structure* — the internal organisation of a text (articles, chapters, lines) as distinct from its physical carrier. *Carrier* — the physical object or file that transmits a text. *CITE Architecture* — a framework from classical philology for persistent, machine-actionable citation. *OHCO2* — Ordered Hierarchy of Content Objects; the model treating texts as stable structural hierarchies.\n\n**Takeaway:** Distinguish the text's logical structure from the physical carrier that transmits it — that distinction is what lets a citation outlive the shelfmark, the server, and the file path.\n\n---", "image_b64": null, "question": {"name": "18 Question: Citing a Structure, Not a File", "questiontext": "<p>A treaty survives as a printed proclamation, as manuscript copies in council registers, and as a transcription sent to London. What does this case show about citation?</p>", "generalfeedback": "<p>Distinguish the text's logical structure from the physical carrier that transmits it — that distinction is what lets a citation outlive the shelfmark, the server, and the file path.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The text has a structure — articles and clauses — independent of whichever carrier transmits it, and citing that structure outlives any one carrier.</p>", "feedback": "<p>Correct. Separating the logical structure from the physical carrier is what makes a citation survive the shelfmark, the server, and the file path.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The treaty's text differs in each carrier, so a citation must specify which of the three versions is being quoted.</p>", "feedback": "<p>Incorrect. Multiple carriers of one text is the normal case; the principle at issue is citing the structure they share.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The printed proclamation is the authoritative carrier, so citations should follow its pagination.</p>", "feedback": "<p>Incorrect. Print pagination is exactly the location-dependent label that a durable citation avoids.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only the manuscript register copies count as archival objects, so only they can be given identifiers.</p>", "feedback": "<p>Incorrect. Identifiers are assigned to whatever the responsible institution holds, and to the work as well as the carrier.</p>"}]}}, {"step": 19, "title": "Canonical Citation: Giving Your Object a Stable Address", "content": "**Canonical Citation: Giving Your Object a Stable Address**\n\nA citation that depends on a shelfmark is fragile. Shelfmarks change: libraries reclassify, collections move, and a manuscript catalogued as one shelfmark today can be renumbered in the next revision. If your edition cites the shelfmark alone, your citation breaks the moment the holding library reorganises.\n\n**Canonical citation** solves this by giving your object an identifier that survives such changes.\n\nThe general principle is the same in every tradition: an identifier is assigned by some authority, it is persistent, and it resolves to the object regardless of where the object currently sits.\n\n**Vocabulary.** *Persistent identifier* — an identifier designed to keep resolving to the same object even when URLs, systems, or shelfmarks change. *Canonical citation* — citing an object by such an identifier rather than by a location-dependent label.\n\n**Takeaway:** Cite your object by a persistent identifier as well as by its shelfmark, because shelfmarks change and scholarship has to outlast them.\n\n---", "image_b64": null, "question": {"name": "19 Question: Canonical Citation: Giving Your Object a Stable Address", "questiontext": "<p>Why is citing a manuscript by its shelfmark alone a fragile practice?</p>", "generalfeedback": "<p>Cite your object by a persistent identifier as well as by its shelfmark, because shelfmarks change and scholarship has to outlast them.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Shelfmarks change when libraries reclassify or collections move, so a citation built on one breaks at the next revision.</p>", "feedback": "<p>Correct. A canonical citation therefore adds an identifier assigned by an authority and persistent across such changes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Shelfmarks are assigned by cataloguers rather than by the holding institution, so they carry no authority.</p>", "feedback": "<p>Incorrect. Shelfmarks are assigned by the holding library; the defect is their mutability, not the absence of an authority.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Shelfmarks are not unique, since two libraries may use the same call number for different manuscripts.</p>", "feedback": "<p>Incorrect. A shelfmark is unique within its repository, and citations normally name the repository as well.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Shelfmarks describe the physical object, whereas scholarship needs to cite the abstract work.</p>", "feedback": "<p>Incorrect. Citing the object is legitimate and often necessary; the problem is that the label pointing to it is not stable.</p>"}]}}, {"step": 20, "title": "Three Citation Systems, Three Traditions", "content": "**Three Citation Systems, Three Traditions**\n\nThe identifier that works for your document depends on its tradition. Here are the three in play this term.\n\n**1. ARK — for the French decree (and a great deal else).**\n\nAn **ARK** (Archival Resource Key) is a persistent identifier designed for archival and cultural objects. It takes the form:\n\n```text\nark:/12148/bpt6k9690620k\n```\n\n- `ark:` declares the scheme.\n- `12148` is the **NAAN** — the Name Assigning Authority Number. BnF's is `12148`.\n- `bpt6k9690620k` is the object name.\n\nThe point of ARK is that the **Name Mapping Authority** — the organisation currently serving the object — can change while the ARK name stays fixed. That is why it persists. Note the syntax: `ark:/` takes a **single** slash; the NAAN is separated from the name by a further slash.\n\n**2. Library call numbers — for the Dickinson manuscript.**\n\nHarvard's Houghton Library identifies Dickinson material by a call number in a fixed series:\n\n```text\nMS Am 1118.3 [338]\n```\n\n`MS Am` denotes an American manuscript; `1118.3` is the series (poems — fascicles and loose sheets, as distinct from `1118.2`, the Holland letters); `[338]` is the item. This is not a persistent identifier in the ARK sense — it is a shelfmark — but it is the citable reference the holding library requires, and it is stable in practice because Houghton maintains it.\n\n**3. Archival reference numbers — for the treaty.**\n\nThe Nova Scotia Archives cites by record group, volume, and number:\n\n```text\nRG 1 volume 430 number 2\n```\n\nOversize items get a separate form, `O/S number 511`. Note what this citation does *not* tell you: whether you are looking at an original, a copy, or a printed edition. Two documents in the same volume can differ in status entirely, so the reference number must be paired with a statement of what the object actually is.\n\n**Vocabulary.** *ARK* — Archival Resource Key; a persistent identifier for archival objects. *NAAN* — Name Assigning Authority Number, the numeric prefix identifying which institution minted the ARK. *Record group* — an archival arrangement unit, here abbreviated `RG`.\n\n**Takeaway:** ARK, library call number, and archival reference number are three different citation systems serving three different traditions — use the one your holding institution uses, and copy its syntax exactly rather than normalising it.\n\n---", "image_b64": null, "question": {"name": "20 Question: Three Citation Systems, Three Traditions", "questiontext": "<p>Which grouping correctly pairs each student's document with the citation system its holding institution uses?</p>", "generalfeedback": "<p>ARK, library call number, and archival reference number are three different citation systems serving three different traditions — use the one your holding institution uses, and copy its syntax exactly rather than normalising it.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The French act with an Archives nationales cote and, if digitised, a Gallica ARK such as <code>ark:/12148/...</code>; the Dickinson manuscript with a Houghton call number; and the treaty with a Nova Scotia Archives record-group reference.</p>", "feedback": "<p>Correct. Three traditions, three systems, and in each case the identifier is copied in the syntax the issuing institution writes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All three with an ARK, since ARK is the general-purpose persistent identifier scheme for cultural objects.</p>", "feedback": "<p>Incorrect. ARK is a scheme many institutions could mint, but Houghton and the Nova Scotia Archives cite their holdings in their own forms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The French act with a call number, the Dickinson poem with an archival record-group reference, and the treaty with an ARK.</p>", "feedback": "<p>Incorrect. That is the pairing inverted: call numbers belong to library manuscript series and record groups to archives.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All three with a normalized form, converting each identifier to a single consistent pattern so records can be compared.</p>", "feedback": "<p>Incorrect. Normalizing an identifier renames it, and an identifier is a name; the instruction is to copy its syntax exactly.</p>"}]}}, {"step": 21, "title": "Reading a Record, Not Just Finding It", "content": "**Reading a Record, Not Just Finding It**\n\nFinding an identifier is not the same as verifying one. A record has to be read.\n\nHere is a worked example, from an Ancien Régime source (it is an illustration of the method, not one of your three documents). Its ARK is `ark:/12148/bpt6k9690620k`. Open the record and you find:\n\n| Field | Value |\n| :--- | :--- |\n| Shelfmark | Bibliothèque nationale de France, département Droit, économie, politique, F-21718 |\n| Date | 1771 |\n| Format | 67 pièces en 1 vol. in-4° |\n| Creator | Louis XV (1710-1774 ; roi de France) |\n\nEvery one of those fields is a fact you can put in a TEI header — and every one is a fact you can check. Does the date match what you expected? Is the creator the person you thought? Does \"67 pièces en 1 vol.\" describe one document or sixty-seven bound together? That last question matters: a *recueil* is a collected volume, and cataloguing it as though it were a single act would be a mistake.\n\n**Note what the record tells you about its own era.** *Creator: Louis XV*, *Date: 1771*, and a title listing *édits, arrêts, lettres patentes, déclarations* — those fields describe Ancien Régime royal legislation. A 1791 décret would show a different creator (the Assemblée nationale, or the king under the constitution) and a different instrument name. Readi
