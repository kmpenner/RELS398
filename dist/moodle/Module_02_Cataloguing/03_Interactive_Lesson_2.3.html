nTo prevent citation drift, automated pipelines must cross-walk AI-generated URNs against authoritative CTS service inventories (`GetCapabilities` endpoints) before committing records to publication (Tiepmar & Heyer, 2014).\n\n**Takeaway:** AI-generated CTS URNs must be validated against authoritative CTS capability inventories to prevent hallucinated work IDs and token index drift.\n\n---", "question": {"name": "23 Question: Cross-Walking AI Outputs into Canonical Identifiers (CTS / CITE)", "questiontext": "<p>Why must AI-generated Canonical Text Services (CTS) URNs be cross-walked against authoritative service inventories?</p>", "generalfeedback": "<p>AI-generated CTS URNs must be validated against authoritative CTS capability inventories to prevent hallucinated work IDs and token index drift.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>LLMs frequently hallucinate invalid namespace prefixes, misremember author TLG numbers, or drift on word token sub-reference indices.</p>", "feedback": "<p>Correct. Validating URNs against live CTS <code>GetCapabilities</code> endpoints ensures that canonical links resolve to genuine works and passages.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because CTS URNs are secret commercial passwords that cannot be stored in plain text.</p>", "feedback": "<p>Incorrect. CTS URNs are open, standardized academic identifiers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because XML schemas prohibit attributes from containing colon characters.</p>", "feedback": "<p>Incorrect. Colons are standard in attribute values and URN strings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because URNs expire after 24 hours if not renewed by a centralized authority.</p>", "feedback": "<p>Incorrect. URNs are persistent, permanent identifiers; cross-walking verifies initial construction accuracy.</p>"}]}}, {"step": 24, "title": "Reconciling AI Discrepancies with the Manual Ground Truth", "content": "**Reconciling AI Discrepancies with the Manual Ground Truth**\n\nToday's central analytical exercise is performing a systematic discrepancy reconciliation between your manual ground truth and the AI-generated metadata records.\n\nUsing computational diff tools (such as `git diff` or Python's `difflib`), you will align your validated Tuesday/Wednesday XML against the AI output and classify every discrepancy into one of four categories:\n\n1. **AI Error (Structural):** Illegal XML nesting, unquoted attributes, bad entity escaping, or non-ISO dates.\n2. **AI Error (Factual):** Fabricated historical dates, false scribal attributions, or incorrect physical dimensions.\n3. **AI Superiority (Completeness):** Instances where the AI successfully recognized a subtle historical detail or bibliographic cross-reference that you overlooked during manual inspection.\n4. **Valid Editorial Divergence:** Differences in descriptive wording where both the human and AI interpretations are defensible.\n\n```\nDiscrepancy Audit Log Example:\n- Line 42 (<origDate>): Human=\"0550-0599\" | AI=\"0500-0600\" -> [Valid Divergence: AI used broader century range]\n- Line 58 (<supportDesc>): Human=\"parchment\" | AI=\"parchment\" -> [Match: 100% Agreement]\n- Line 89 (<handNote>): Human=\"h1, h2, h3\" | AI=\"h1\" -> [AI Error: Omission of marginal hands h2 and h3]\n- Line 112 (<decoNote>): Human=\"None\" | AI=\"Hexaplaric asterisks\" -> [AI Superiority: AI caught marginal signs]\n```\n\nDocumenting these discrepancies produces the empirical data required for your Topic 02 comparative report.\n\n**Takeaway:** Reconciling AI outputs against human ground truth reveals AI errors, omissions, and occasional surprising discoveries, providing empirical data for editorial evaluation.\n\n---", "question": {"name": "24 Question: Reconciling AI Discrepancies with the Manual Ground Truth", "questiontext": "<p>When reconciling discrepancies between AI-generated metadata and your manual ground truth, what does an \"AI Superiority (Completeness)\" finding represent?</p>", "generalfeedback": "<p>Reconciling AI outputs against human ground truth reveals AI errors, omissions, and occasional surprising discoveries, providing empirical data for editorial evaluation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>An instance where the AI correctly identified a subtle historical detail or bibliographic link that the human editor overlooked during manual inspection.</p>", "feedback": "<p>Correct. Discrepancy audits occasionally reveal valid features caught by AI broad associative recall, enriching the final edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An instance where the AI successfully proved that the physical manuscript is a modern forgery.</p>", "feedback": "<p>Incorrect. AI completeness refers to uncovering overlooked cataloguing details, not forgery claims.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A state where the AI generated valid XML that completely contradicted the laws of physics.</p>", "feedback": "<p>Incorrect. Discrepancies evaluate codicological accuracy and bibliographic completeness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A case where the human editor deliberately introduced syntax errors to confuse the validator.</p>", "feedback": "<p>Incorrect. Ground truth is certified error-free; reconciliation compares genuine editorial observations.</p>"}]}}, {"step": 25, "title": "The Economics and Scalability of AI Cataloguing", "content": "**The Economics and Scalability of AI Cataloguing**\n\nBeyond philological fidelity, scholarly editors must evaluate the practical economics and computational scalability of AI-assisted cataloguing pipelines (De Cristofaro & Zilio, 2025).\n\nA comprehensive economic assessment balances API infrastructure costs against human labor hours:\n\n| Workflow Phase | Manual Method (Tue) | Deterministic Method (Wed) | AI-Assisted Method (Fri) |\n| --- | --- | --- | --- |\n| **Cataloguing Time per Codex** | 8–15 Hours | 1–2 Hours (Validation & Linking) | 30–60 Seconds (Generation) |\n| **Human Labor Cost** | High (Expert Postdoc/Faculty) | Moderate (Technical Editor) | Low (Review & Audit Only) |\n| **Computational API Cost** | $0.00 | $0.00 (Open-source tools) | ~$0.05–$0.20 per record |\n| **Scalability across 10,000 MSS** | Impossible without massive grants | Highly scalable if structured | Instantaneous batch processing |\n| **Error Rate (Structural)** | Moderate (Human typographical) | 0% (Enforced by schema gate) | Variable (5–20% without self-repair) |\n| **Error Rate (Factual)** | Very Low (Expert verification) | Very Low (Authoritative LOD) | High (Requires human audit) |\n\nAI-assisted cataloguing dramatically reduces data entry costs, but shifts the human labor burden from *authoring* to *auditing and error reconciliation* (De Cristofaro & Zilio, 2025).\n\n**Takeaway:** AI cataloguing reduces processing time from hours to seconds, shifting human expertise from manual data entry to critical schema auditing and fact-checking.\n\n---", "question": {"name": "25 Question: The Economics and Scalability of AI Cataloguing", "questiontext": "<p>How does the integration of AI alter the economics and division of human labor in large-scale manuscript cataloguing projects?</p>", "generalfeedback": "<p>AI cataloguing reduces processing time from hours to seconds, shifting human expertise from manual data entry to critical schema auditing and fact-checking.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It reduces initial data entry time from hours to seconds per codex, shifting expert human labor from manual drafting to schema auditing and error reconciliation.</p>", "feedback": "<p>Correct. AI accelerates production at minimal API cost, but demands skilled human editorial review to certify data integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It makes manuscript cataloguing 100 times more expensive by requiring supercomputers in every library.</p>", "feedback": "<p>Incorrect. API calls cost pennies per record, radically reducing data entry expenses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It eliminates the need for human scholars to possess knowledge of ancient languages or palaeography.</p>", "feedback": "<p>Incorrect. Auditing AI outputs requires deep palaeographical and philological expertise.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It slows down cataloguing workflows because computers process text slower than human scribes.</p>", "feedback": "<p>Incorrect. AI generates draft records in seconds, accelerating throughput dramatically.</p>"}]}}, {"step": 26, "title": "Ethics, Provenance, and AI Attribution in Digital Editions", "content": "**Ethics, Provenance, and AI Attribution in Digital Editions**\n\nWhen artificial intelligence models contribute to the generation of cultural heritage metadata, intellectual transparency demands explicit documentation of algorithmic provenance (De Cristofaro & Zilio, 2025; TEI Consortium, 2025).\n\nA scholarly digital edition must never conceal the role of AI. If an LLM generated the initial manuscript description or extracted entities, this contribution must be formally recorded in the `<teiHeader>` using `<respStmt>` and `<change>` audit logs:\n\n```xml\n<teiHeader>\n  <fileDesc>\n    <titleStmt>\n      <title>Diplomatic Edition of Codex Marchalianus (Vat. gr. 2125)</title>\n      <respStmt>\n        <resp>Manual codicological ground truth and human editorial audit</resp>\n        <name xml:id=\"JD\">Jane Doe</name>\n      </respStmt>\n      <respStmt>\n        <resp>AI-assisted metadata extraction and entity linking</resp>\n        <orgName xml:id=\"AI_Claude\">Anthropic Claude 3.5 Sonnet (API Version 2024-10-22)</orgName>\n      </respStmt>\n    </titleStmt>\n  </fileDesc>\n  \n  <revisionDesc>\n    <change when=\"2026-09-11\" who=\"#AI_Claude\">\n      Initial automated draft of msDesc generated via Claude 3.5 Sonnet using system prompt v2.1.\n    </change>\n    <change when=\"2026-09-11\" who=\"#JD\">\n      Manual audit, error reconciliation, and RELAX NG schema validation certification.\n    </change>\n  </revisionDesc>\n</teiHeader>\n```\n\nExplicit algorithmic attribution preserves the historical integrity of the scholarly record, ensuring future researchers know exactly which assertions were generated by neural networks and verified by human editors (De Cristofaro & Zilio, 2025).\n\n**Takeaway:** Transparency requires documenting AI models in `<respStmt>` and recording automated drafting steps in `<revisionDesc>` change logs.\n\n---", "question": {"name": "26 Question: Ethics, Provenance, and AI Attribution in Digital Editions", "questiontext": "<p>How should a scholarly digital edition ethically document the involvement of artificial intelligence in metadata creation?</p>", "generalfeedback": "<p>Transparency requires documenting AI models in `<respStmt>` and recording automated drafting steps in `<revisionDesc>` change logs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By formally declaring the AI model and version in <code>&lt;respStmt&gt;</code> and recording automated drafting actions in <code>&lt;revisionDesc&gt;</code> change logs.</p>", "feedback": "<p>Correct. Academic integrity and provenance transparency require explicit attribution of algorithmic contributions in TEI metadata headers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting all commit history and claiming that all text was authored exclusively by ancient scribes.</p>", "feedback": "<p>Incorrect. Concealing machine contributions violates scholarly transparency and provenance standards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By attributing all AI-generated text to anonymous medieval monks.</p>", "feedback": "<p>Incorrect. Attributing modern computational output to historical figures is an unethical falsification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By encoding the entire digital edition in encrypted binary format to prevent external auditing.</p>", "feedback": "<p>Incorrect. Digital humanities editions prioritize open-access transparency and verifiable data.</p>"}]}}, {"step": 27, "title": "Building the Production Pipeline: CI/CD for Human-in-the-Loop Cataloguing", "content": "**Building the Production Pipeline: CI/CD for Human-in-the-Loop Cataloguing**\n\nThe culmination of this week's technical learning is the design of an automated **Continuous Integration / Continuous Deployment (CI/CD)** pipeline for hybrid, human-in-the-loop manuscript cataloguing (De Cristofaro & Zilio, 2025; Cummings, 2018).\n\nIn modern digital publishing, repositories use automated workflows (such as GitHub Actions) to govern the cataloguing lifecycle:\n\n```yaml\n# Conceptual GitHub Actions CI/CD Workflow for Automated TEI Auditing\nname: TEI Metadata Validation Gate\non: [push, pull_request]\n\njobs:\n  validate-tei:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout Repository\n        uses: actions/checkout@v4\n\n      - name: Install Jing RELAX NG Validator\n        run: sudo apt-get install -y jing\n\n      - name: Validate AI-Generated TEI Files\n        run: |\n          echo \"Auditing TEI XML files against msdesc.rng...\"\n          jing schemas/msdesc.rng src/modules/Topic_02_Cataloguing/*.xml\n\n      - name: Audit Schematron Cross-References\n        run: |\n          python3 scripts/audit_schematron.py --dir src/modules/Topic_02_Cataloguing/\n```\n\nWhen an AI model commits an updated manuscript description to Git, the CI/CD pipeline immediately executes the Jing RELAX NG validator and Schematron scripts. If the AI commit violates schema rules, the build fails automatically, blocking publication and notifying the human editor to intervene (Cummings, 2018).\n\n**Takeaway:** CI/CD pipelines automate RELAX NG and Schematron validation on every Git commit, creating an automated gate that prevents invalid AI markup from entering production.\n\n---", "question": {"name": "27 Question: Building the Production Pipeline: CI/CD for Human-in-the-Loop Cataloguing", "questiontext": "<p>What is the function of an automated Continuous Integration (CI/CD) validation gate in a collaborative manuscript cataloguing repository?</p>", "generalfeedback": "<p>CI/CD pipelines automate RELAX NG and Schematron validation on every Git commit, creating an automated gate that prevents invalid AI markup from entering production.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It runs Jing RELAX NG and Schematron checks on every Git commit or pull request, automatically blocking invalid AI or human markup from entering production.</p>", "feedback": "<p>Correct. CI/CD pipelines automate quality assurance, ensuring that only certified, schema-compliant files are merged.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically pushes unreviewed AI drafts directly to public web servers without testing.</p>", "feedback": "<p>Incorrect. CI/CD acts as an automated gatekeeper to prevent unvalidated files from reaching production.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes any Git repository that contains more than ten commits.</p>", "feedback": "<p>Incorrect. Git repositories store permanent version history; CI/CD executes automated testing suites.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates all XML files into proprietary closed-source binary databases.</p>", "feedback": "<p>Incorrect. CI/CD validates and builds open standard TEI XML and RDF files.</p>"}]}}, {"step": 28, "title": "Hands-On: Running the AI Metadata Extraction on Your Passage", "content": "**Hands-On: Running the AI Metadata Extraction on Your Passage**\n\nNow you execute the comparative AI laboratory experiment for Meeting #5.\n\nFollow this experimental protocol:\n\n1. **Prepare Raw Input:** Extract the raw, unformatted cataloguing notes and Latin/English description for your primary witness into a plain text file.\n2. **Execute Prompting:** Run the extraction prompt across two frontier models:\n   - **Pass A (ChatGPT-4):** Execute the structured codicological prompt with `temperature=0.2`.\n   - **Pass B (Claude 3.5 Sonnet):** Execute the identical prompt and `macro.xml` reference dictionary.\n3. **Capture Raw Outputs:** Save the unedited XML outputs as:\n   - `03a_Lesson_2.3_AI_Draft_GPT4.xml`\n   - `03a_Lesson_2.3_AI_Draft_Claude35.xml`\n4. **Execute Validation Scoring:** Run the programmatic validation script against both files, recording well-formedness errors, RELAX NG schema violations, and Schematron warnings.\n5. **Execute Self-Correction Pass:** For any file that failed validation, feed the compiler error logs back into the model in a reflection prompt and capture the repaired output.\n6. **Score Precision & Recall:** Compare the final AI files against your Tuesday manual ground truth, calculating the F1-score across core metadata fields.\n\nSave all test files and your scoring matrix in your personal Git branch.\n\n**Takeaway:** The hands-on lab executes structured AI metadata extractions across ChatGPT-4 and Claude 3.5, scoring raw outputs, self-correction passes, and F1 metrics against ground truth.\n\n---", "question": {"name": "28 Question: Hands-On: Running the AI Metadata Extraction on Your Passage", "questiontext": "<p>What are the primary operational phases of the comparative AI laboratory experiment in Lesson 2.3?</p>", "generalfeedback": "<p>The hands-on lab executes structured AI metadata extractions across ChatGPT-4 and Claude 3.5, scoring raw outputs, self-correction passes, and F1 metrics against ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Prompting ChatGPT-4 and Claude 3.5, scoring raw XML outputs, executing compiler error self-correction loops, and calculating F1-scores against ground truth.</p>", "feedback": "<p>Correct. This protocol systematically benchmarks generation quality, error recovery, and codicological accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Training a new 100-billion-parameter neural network from scratch on a home laptop.</p>", "feedback": "<p>Incorrect. The lab prompts existing frontier models via APIs or interfaces using structured protocols.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting the Tuesday and Wednesday lab files to save disk storage space.</p>", "feedback": "<p>Incorrect. Prior lab files serve as the indispensable ground truth against which AI outputs are scored.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manually translating the entire Greek Septuagint into modern French prose.</p>", "feedback": "<p>Incorrect. The lab focuses on codicological metadata extraction and validation auditing for the chosen witness passage.</p>"}]}}, {"step": 29, "title": "Compiling the Topic 02 Comparative Evaluation Report", "content": "**Compiling the Topic 02 Comparative Evaluation Report**\n\nBefore concluding today's session, you will synthesize your findings from Tuesday, Wednesday, and Friday into the **Topic 02 Comparative Evaluation Report**.\n\nYour report must present a clear, quantitative comparison across the three steps of the cycle:\n\n| Metric / Dimension | Manual Method (Tue) | Deterministic Method (Wed) | AI-Assisted Method (Fri) |\n| --- | --- | --- | --- |\n| Authoring / Execution Time | 4.5 Hours | 45 Minutes | 45 Seconds |\n| Initial Schema Validity Rate | N/A (Unvalidated) | 100% (After manual fix) | Pass 1: 60% / Pass 2: 95% |\n| RELAX NG Error Count (Initial) | 7 Errors | 0 Errors | 12 Errors (GPT) / 1 (Claude) |\n| Schematron Pointer Broken Rate | 3 Broken IDs | 0 Broken IDs | 4 Broken IDs |\n| Entity Disambiguation Precision | 100% (Manual VIAF) | 100% (Certified LOD) | 85% (Factual hallucinations) |\n| F1 Codicological Score | 1.00 (Reference) | 1.00 (Ground Truth) | 0.88 (Composite F1) |\n\nFollow the standard RELS 398 analytical structure:\n\n- **§1 Methodological Overview:** State the passage, witness, and tools evaluated.\n- **§2 Quantitative Results:** Present the validation error counts, F1-scores, and convergence passes.\n- **§3 Qualitative Error Analysis:** Detail specific structural hallucinations and factual misattributions.\n- **§4 Editorial Recommendation:** Formulate an evidence-based recommendation on how your project will deploy AI tools responsibly within a schema-governed pipeline.\n\n**Takeaway:** The comparative evaluation report synthesizes quantitative error rates, F1-scores, and qualitative analyses across the manual, deterministic, and AI passes.\n\n---", "question": {"name": "29 Question: Compiling the Topic 02 Comparative Evaluation Report", "questiontext": "<p>What core components must be synthesized in the Topic 02 Comparative Evaluation Report?</p>", "generalfeedback": "<p>The comparative evaluation report synthesizes quantitative error rates, F1-scores, and qualitative analyses across the manual, deterministic, and AI passes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A methodological overview, quantitative validation error counts and F1-scores, qualitative analysis of structural/factual errors, and editorial pipeline recommendations.</p>", "feedback": "<p>Correct. The report synthesizes empirical data from all three days into a rigorous scholarly evaluation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A creative short story about medieval scribes traveling through time.</p>", "feedback": "<p>Incorrect. The report is an empirical, scientific evaluation of text encoding and metadata extraction methods.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A list of commercial advertising sponsors for the course website.</p>", "feedback": "<p>Incorrect. The report documents scholarly methodology and error analyses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A single sentence declaring that all AI models are completely infallible.</p>", "feedback": "<p>Incorrect. The report presents nuanced, quantitative data highlighting both capabilities and failure modes.</p>"}]}}, {"step": 30, "title": "Synthesis: The Schema as the Indispensable Anchor of AI Philology", "content": "**Synthesis: The Schema as the Indispensable Anchor of AI Philology**\n\nThis week has walked you through the full arc of computational manuscript cataloguing:\n\n- **Tuesday (Manual):** You hand-authored a complete TEI Header, confronting the material complexities of physical codices and establishing an authoritative human ground truth (Le Bœuf, 2012; TEI Consortium, 2025).\n- **Wednesday (Deterministic):** You subjected your markup to the uncompromising gate of RELAX NG and Schematron validation in Oxygen, linked your entities to RDF knowledge graphs, and established persistent CTS URNs (Cummings, 2018; Koho et al., 2021; Blackwell & Smith, 2019).\n- **Friday (AI-Assisted):** You deployed frontier Large Language Models and computer vision pipelines to automate cataloguing, discovering both the immense speed of neural generation and the critical necessity of schema auditing (De Cristofaro & Zilio, 2025; Ignatowicz et al., 2025).\n\n```\nThe Complete Three-Step Comparative Cycle — Topic 02:\n[X] Tue: Manual — Hand-written TEI Header and msDesc (Human Ground Truth)\n[X] Wed: Deterministic — RELAX NG & Schematron validation in Oxygen, RDF LOD, CTS URNs\n[X] Fri: AI-Assisted — LLM metadata extraction scored against your manual baseline\n```\n\nThe grand conclusion of Topic 02 is that **Artificial Intelligence does not replace text encoding schemas; it makes them more essential than ever.** In an era where neural networks can generate infinite volumes of plausible, probabilistic text, the formal, deterministic schema—enforced by RELAX NG, Schematron, and rigorous human editorial judgement—is the sole anchor that preserves academic truth, structural integrity, and historical reality in digital scholarship.\n\n**Takeaway:** Generative AI accelerates cataloguing, but deterministic schemas and human editorial judgement remain the indispensable anchors of scholarly integrity.\n\n---\n\n## References\n\nBlackwell, C., & Smith, N. (2019). The CITE Architecture: A conceptual and practical overview. In M. Berti (Ed.), *Digital Classical Philology: Ancient Greek and Latin in the Digital Revolution* (pp. 73–94). De Gruyter Saur.\n\nCummings, J. (2018). The Text Encoding Initiative and the study of literature. In R. Siemens & S. Schreibman (Eds.), *A Companion to Digital Literary Studies* (pp. 451–476). Blackwell.\n\nDe Cristofaro, M., & Zilio, D. (2025). Automating XML-TEI encoding of unpublished correspondence: A comparative analysis of two LLM approaches. *AIUCD 2025 Proceedings: Diversity, Equity, and Inclusion: Challenges and Opportunities for Digital Humanities in the Age of Artificial Intelligence*.\n\nIgnatowicz, J., Kutt, K., & Nalepa, G. J. (2025). Metadata Enrichment Model: Integrating neural networks and semantic knowledge graphs for cultural heritage applications. *arXiv preprint*. https://arxiv.org/abs/2505.23543\n\nKoho, M., Burrows, T., Hyvönen, E., Ikkala, E., Page, K., Ransom, L., ... & Wijsman, H. (2021). Harmonizing and publishing heterogeneous premodern manuscript metadata as Linked Open Data. *Journal of the Association for Information Science and Technology*, 73(2), 240–257. https://doi.org/10.1002/asi.24499\n\nKoho, M., Coladangelo, L. P., Ransom, L., & Emery, D. (2023). Wikibase model for premodern manuscript metadata harmonization, linked data integration, and discovery. *ACM Journal on Computing and Cultural Heritage*, 16(3), Article 56. https://doi.org/10.1145/3594723\n\nLe Bœuf, P. (2012). Modeling rare and unique documents: Using FRBRoo/CIDOC CRM. *Journal of Archival Organization*, 10(2), 96–106.\n\nTEI Consortium. (2025). *TEI P5: Guidelines for Electronic Text Encoding and Interchange*. Version 4.8.0. https://tei-c.org/release/doc/tei-p5-doc/en/html/\n\nTiepmar, J., & Heyer, G. (2014). A new implementation for Canonical Text Services. In *Proceedings of the Workshop on Human-Computer Tractable Data for the Digital Humanities* (pp. 1–8).", "question": {"name": "30 Question: Synthesis: The Schema as the Indispensable Anchor of AI Philology", "questiontext": "<p>Why does the proliferation of generative artificial intelligence make deterministic XML schemas more vital than ever in digital scholarship?</p>", "generalfeedback": "<p>Generative AI accelerates cataloguing, but deterministic schemas and human editorial judgement remain the indispensable anchors of scholarly integrity.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because in an era of infinite probabilistic text generation, formal schemas and human editorial oversight provide the sole verifiable anchor for structural integrity and truth.</p>", "feedback": "<p>Correct. Deterministic schemas ensure that computational editions remain accurate, reproducible, and grounded in scholarly reality.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because schemas are legally required to pay royalties to artificial intelligence companies.</p>", "feedback": "<p>Incorrect. Schemas are open humanistic standards, not commercial royalty systems.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models will permanently crash the global internet unless every file on earth is formatted in TEI XML.</p>", "feedback": "<p>Incorrect. The necessity is epistemological and methodological within scholarship, not a global network collapse.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because schemas allow computers to replace the need for historical evidence entirely.</p>", "feedback": "<p>Incorrect. Schemas structure and verify evidence; they never replace historical reality.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
</html>
