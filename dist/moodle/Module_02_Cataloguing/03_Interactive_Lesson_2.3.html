lability is not the reason for the ordering.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the schema requires all identifiers to be present before validation.</p>", "feedback": "<p>Incorrect. The schema does not require these identifiers at all.</p>"}]}}, {"step": 26, "title": "Writing the Comparison", "content": "**Writing the Comparison**\n\nYour comparison is 300 to 500 words and carries three of the ten workshop points. The rubric asks it to *precisely diagnose model hallucinations* and *explain the methodological necessity of deterministic validation*. Both halves are graded, and the second is the one people forget.\n\nA structure that fits the word count.\n\n- **Method, about 60 words.** Your witness, the model, the prompt, the schema. Enough that someone could repeat it.\n- **Numbers, about 60 words.** First-pass error count, count after correction, six-field score. Actual figures.\n- **Your two subtle hallucinations, about 250 words.** This is the substance. For each: quote the AI's markup, state what is actually true and how you verified it, and name why it survived validation.\n- **Why the schema is necessary anyway, about 80 words.** Answer the second half of the rubric.\n\nThat last part deserves care, because the obvious answer is wrong. Your own evidence shows the schema catching structural errors and missing every subtle one you reported. So why keep it?\n\nBecause it removes an entire class of failure at zero cost, leaving your attention free for the errors only you can catch. A validator that eliminates the cheap errors is what makes it possible to spend your limited attention on the expensive ones. Argue it from your own numbers rather than from conviction.\n\n**Takeaway:** The comparison reports method and figures briefly, spends its length on two verified subtle hallucinations, and argues the schema's necessity from your own numbers.\n\n---", "image_b64": null, "question": {"name": "26 Question: Writing the Comparison", "questiontext": "<p>Your own evidence shows the schema catching structural errors and missing every subtle one. How should the comparison then argue for deterministic validation?</p>", "generalfeedback": "<p>The comparison reports method and figures briefly, spends its length on two verified subtle hallucinations, and argues the schema's necessity from your own numbers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>That it removes an entire class of failure at no cost, freeing your limited attention for the errors only a person can catch.</p>", "feedback": "<p>Correct. The argument runs from your own numbers rather than from conviction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the schema catches most hallucinations, so it remains the primary safeguard.</p>", "feedback": "<p>Incorrect. Your own findings contradict this, and the marker will notice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That schemas will eventually detect factual errors as they improve.</p>", "feedback": "<p>Incorrect. Factual verification is outside what any grammar-based schema can do.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That validation matters mainly because Moodle requires valid XML on import.</p>", "feedback": "<p>Incorrect. This is a technical convenience, not a methodological argument.</p>"}]}}, {"step": 27, "title": "Where This Method Transfers", "content": "**Where This Method Transfers**\n\nThe audit you are learning is not specific to TEI headers, and it is worth naming what it actually is, because it is the most durable thing in this module.\n\n**The pattern is: establish ground truth independently, generate with a machine, compare against the ground truth rather than against plausibility, and classify the differences by kind.**\n\nThat sequence works anywhere a language model produces structured output that must correspond to something real:\n\n- Extracting metadata from a digitised collection at scale — where no human can check every record, so you sample and audit.\n- Converting legacy finding aids into structured data — where the model's fluency makes errors hard to spot.\n- Generating catalogue records for uncatalogued material — the case where its confident inventions are most dangerous, because no existing record contradicts them.\n- Any downstream pipeline where a wrong identifier silently attaches to the wrong object.\n\n**What does not transfer is the shortcut.** There is no version of this where you accept the output because it looks right, and there is no version where the schema checking it is sufficient. The schema checks construction. You check truth. That division of labour is the lesson.\n\n**Takeaway:** The method — independent ground truth, generation, comparison against truth rather than plausibility, classification of differences — transfers to any structured output a model produces about real objects.\n\n---", "image_b64": null, "question": {"name": "27 Question: Where This Method Transfers", "questiontext": "<p>Which part of this three-step method transfers beyond TEI headers?</p>", "generalfeedback": "<p>The method — independent ground truth, generation, comparison against truth rather than plausibility, classification of differences — transfers to any structured output a model produces about real objects.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The sequence: establish ground truth independently, generate, compare against truth rather than plausibility, and classify the differences.</p>", "feedback": "<p>Correct. That pattern works wherever a model produces structured output about real objects.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The specific TEI elements and schema used in this module.</p>", "feedback": "<p>Incorrect. Elements are discipline-specific; the method is what generalises.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The prompting technique alone, since better prompts remove the need to audit.</p>", "feedback": "<p>Incorrect. No prompt eliminates the need for independent verification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The scorecard's six fields, which apply to any document.</p>", "feedback": "<p>Incorrect. The fields are chosen for this assignment; the comparison discipline is the transferable part.</p>"}]}}, {"step": 28, "title": "The Three-Step Cycle, Completed", "content": "**The Three-Step Cycle, Completed**\n\nStep back and look at what the three meetings of this cycle built.\n\n**Tuesday — the manual baseline.** You read a document and wrote a header by hand. Slow, and the only step where a human looked at the object and decided what was true.\n\n**Wednesday — the deterministic gate.** You linked a schema and drove the errors to zero. This did not make your header true; it made it well built, and it gave you a machine-checkable standard.\n\n**Friday — the measured audit.** A model wrote the same header in seconds. You put it through the same gate, then through the comparison the gate cannot perform, and you came out with numbers and a claim about where machine description fails and why.\n\nEach step exists because the previous one is insufficient. Hand-authoring does not scale and cannot self-check. Schema validation checks form and is blind to fact. Machine generation is fast and fluent and cannot be trusted. **Only the combination produces a record you can defend**, and the part that makes it defensible is the human comparison at the end.\n\nThat is the argument this course is making, and this week is the first place you have made it with evidence of your own rather than taking it on faith.\n\n**Takeaway:** Manual authorship gives truth without scale, schema validation gives structure without truth, and machine generation gives scale without either — the audit is what makes the combination defensible.\n\n---", "image_b64": null, "question": {"name": "28 Question: The Three-Step Cycle, Completed", "questiontext": "<p>What does each step of the three-step cycle contribute that the others cannot?</p>", "generalfeedback": "<p>Manual authorship gives truth without scale, schema validation gives structure without truth, and machine generation gives scale without either — the audit is what makes the combination defensible.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manual authorship gives truth without scale, schema validation gives structure without truth, machine generation gives scale without either.</p>", "feedback": "<p>Correct. The audit is what makes the combination defensible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manual authorship is the fastest and the schema makes it reliable.</p>", "feedback": "<p>Incorrect. Hand-authoring is the slowest step; its value is that a human checked the object.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Schema validation checks the facts and the model supplies the structure.</p>", "feedback": "<p>Incorrect. This inverts both roles: the schema checks structure, the model supplies fluent text that may be false.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Machine generation is authoritative once the output validates.</p>", "feedback": "<p>Incorrect. Validation certifies construction, never truth.</p>"}]}}, {"step": 29, "title": "Writing It Up: What Your Marker Is Looking For", "content": "**Writing It Up: What Your Marker Is Looking For**\n\nYour comparison is 300 to 500 words, and it is worth being explicit about how it is read.\n\n**What earns credit:**\n\n- Two *subtle* hallucinations, named specifically, with the field and the false value\n- Evidence that they passed validation — this is what makes them subtle\n- Your two counts, used with their correct names\n- A claim about why those fields failed, not just that they did\n- Correct attribution of authority identifiers to the sources you actually used\n\n**What does not:**\n\n- A general account of AI limitations. The lesson already gave you that; reproducing it shows nothing.\n- Errors the schema caught. These are cheap and every student will have them.\n- Claims you cannot point to a file for.\n- Padding toward the word count. Five hundred words of specificity beats five hundred words of reflection.\n\n**The one-sentence summary of the assignment:** show that a schema-valid description can be false, name the specific ways yours was, and explain what that implies about relying on structure as a guarantee.\n\n**Takeaway:** Name two specific schema-valid falsehoods, supply your counts, and explain why those fields failed — specificity about your own files is what the mark rewards.\n\n---", "image_b64": null, "question": {"name": "29 Question: Writing It Up: What Your Marker Is Looking For", "questiontext": "<p>Which of these earns credit in the comparison write-up?</p>", "generalfeedback": "<p>Name two specific schema-valid falsehoods, supply your counts, and explain why those fields failed — specificity about your own files is what the mark rewards.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Two specific subtle hallucinations, with the field and the false value, and evidence they passed validation.</p>", "feedback": "<p>Correct. Specificity about your own files is what the mark rewards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A general account of the known limitations of large language models.</p>", "feedback": "<p>Incorrect. The lesson already supplied that; reproducing it demonstrates nothing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The structural errors the schema caught during validation.</p>", "feedback": "<p>Incorrect. Those are cheap, and every student will have them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A thorough reflection on the ethics of machine cataloguing.</p>", "feedback": "<p>Incorrect. Interesting, but it is not what this comparison is graded on.</p>"}]}}, {"step": 30, "title": "What the Week Was For", "content": "**What the Week Was For**\n\nThree days, three ways of producing the same description.\n\n- **Tuesday, by hand.** You wrote a TEI header yourself and found out how much a manuscript demands before it can be described at all (TEI Consortium, 2025).\n- **Wednesday, by rule.** You gave your file to a schema, which found what you could not see in your own work (Cummings, 2018).\n- **Friday, by machine.** A model did the job in seconds, and you measured it — which you could only do because of Tuesday and Wednesday.\n\n```\nTopic 02, complete:\n  Tue  manual        hand-authored TEI header       -> your ground truth\n  Wed  deterministic validated to 0 errors          -> your structural baseline\n  Fri  AI-assisted   generated header, audited      -> measured against both\n```\n\nHere is the conclusion the week was built toward, and it is not the expected one. AI does not make schemas less important. It makes them essential.\n\nWhen markup was slow and expensive, errors were rare because so little got produced. A system generating plausible TEI in seconds can produce wrong markup faster than anyone can read it. The schema is what removes the cheap errors automatically — and that is precisely what frees a human editor to spend attention on the expensive ones, the fabricated provenance and the identifier pointing at the wrong codex.\n\nNotice what changed this week and what did not. The typing got faster. The judgement did not get easier, and it did not get less necessary. It became the only part that was ever scarce.\n\n**Takeaway:** Generative AI makes deterministic schemas and human editorial judgement more necessary, because automating the cheap errors is what frees attention for the ones only a person can catch.\n\n---\n\n## References\n\n\n\nCummings, J. (2018). The Text Encoding Initiative and the study of literature. In R. Siemens & S. Schreibman (Eds.), *A Companion to Digital Literary Studies* (pp. 451–476). Blackwell.\n\nDe Cristofaro, M., & Zilio, D. (2025). Automating XML-TEI encoding of unpublished correspondence: A comparative analysis of two LLM approaches. *AIUCD 2025 Proceedings: Diversity, Equity, and Inclusion: Challenges and Opportunities for Digital Humanities in the Age of Artificial Intelligence*.\n\nIgnatowicz, J., Kutt, K., & Nalepa, G. J. (2025). Metadata Enrichment Model: Integrating neural networks and semantic knowledge graphs for cultural heritage applications. *arXiv preprint*. https://arxiv.org/abs/2505.23543\n\nKoho, M., Burrows, T., Hyvönen, E., Ikkala, E., Page, K., Ransom, L., ... & Wijsman, H. (2021). Harmonizing and publishing heterogeneous premodern manuscript metadata as Linked Open Data. *Journal of the Association for Information Science and Technology*, 73(2), 240–257. https://doi.org/10.1002/asi.24499\n\nRomanello, M., & Gautier, A. (2024). Automatic metadata extraction: Leveraging large language models in digital humanities. *Journal of Open Humanities Data*.\n\nTEI Consortium. (2025). *TEI P5: Guidelines for Electronic Text Encoding and Interchange*. Version 4.8.0. https://tei-c.org/release/doc/tei-p5-doc/en/html/", "image_b64": null, "question": {"name": "30 Question: What the Week Was For", "questiontext": "<p>Why does the ability to generate plausible TEI in seconds make deterministic schemas more necessary rather than less?</p>", "generalfeedback": "<p>Generative AI makes deterministic schemas and human editorial judgement more necessary, because automating the cheap errors is what frees attention for the ones only a person can catch.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Automating away the cheap errors is what frees a human editor's attention for the expensive ones only a person can catch.</p>", "feedback": "<p>Correct. When markup was slow, errors were rare because so little was produced; that constraint is gone.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because models generate markup that existing schemas cannot parse.</p>", "feedback": "<p>Incorrect. The output parses readily; the problem is its volume and confidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because schemas are the only tool capable of detecting fabricated provenance.</p>", "feedback": "<p>Incorrect. Schemas cannot detect fabrication at all, as section 18 demonstrated.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because generated files are larger and require stricter storage rules.</p>", "feedback": "<p>Incorrect. The argument concerns verification, not file size.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
