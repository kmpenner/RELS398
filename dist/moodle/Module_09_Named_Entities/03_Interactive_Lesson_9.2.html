    <script>
        const lessonData = {"course_title": "Automated Named Entity Recognition (NER) and Gazetteer Lookup", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "From Hand Craft to Automated Processing: Scaling Entity Recognition", "content": "**From Hand Craft to Automated Processing: Scaling Entity Recognition**\n\nYesterday, you established an authoritative manual baseline for named entities. You read your manuscript witness closely, extracted twenty entity mentions, and linked them to authority files like Wikidata and GeoNames. That manual work is the scientific gold standard of textual scholarship.\n\nHowever, hand-tagging does not scale to an entire archive. A single colonial treaty or letter is short enough to annotate by hand in one morning. A national archive containing thousands of parliamentary decrees, diplomatic treaties, and personal letters requires computational automation.\n\nToday, we take our second step: automated Named Entity Recognition (NER). You will write and run a Python script using SpaCy sequence models to find and tag entities automatically. You will measure the machine's accuracy directly against yesterday's manual baseline.\n\n**Vocabulary.** *Automated NER* — Using computer software to find and classify proper names in text automatically. *Scalability* — The ability of a digital method to process thousands of pages rapidly.\n\n**Takeaway:** Hand annotation creates gold-standard benchmarks; automated NER provides the speed needed to process large archival collections.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: From Hand Craft to Automated Processing: Scaling Entity Recognition", "questiontext": "<p>Why do digital scholars transition from manual entity annotation to automated Natural Language Processing (NER) pipelines?</p>", "generalfeedback": "<p>Automated NER scales entity identification across large textual corpora that would be impractical to annotate entirely by hand.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manual markup is precise but too slow to scale across large archival corpora containing thousands of manuscript pages.</p>", "feedback": "<p>Correct. While manual annotation establishes rigorous gold standards, automated tools are required to analyze extensive archival corpora at scale.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manual markup is forbidden by international copyright laws once a document exceeds one hundred words.</p>", "feedback": "<p>Incorrect. Copyright law does not prohibit manual scholarly transcription or markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Automated tools eliminate 100% of errors and never require human verification.</p>", "feedback": "<p>Incorrect. Automated models regularly make errors on historical texts, necessitating careful auditing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Computers refuse to display XML files that were typed by human beings.</p>", "feedback": "<p>Incorrect. XML parsers process valid XML regardless of how it was created.</p>"}]}}, {"step": 2, "title": "How Computers Read Names: Statistical Sequence Models", "content": "**How Computers Read Names: Statistical Sequence Models**\n\nA computer cannot understand who a person is or what a town represents. When an automated program reads text, it analyzes statistical patterns across neighboring words.\n\nModern NER engines are trained on millions of words in curated digital corpora. The software learns grammatical clues that signal a proper name. For example, if a capitalized word follows the title *Governor* or *Major*, statistical probability strongly suggests a personal name (`PER`). If a word follows a spatial preposition like *at* or *near*, the model predicts a location (`LOC`).\n\nThese statistical sequence models make decisions in fractions of a second. They process entire paragraphs without human fatigue. But because they rely on probability rather than true understanding, they make systematic mistakes when historical language shifts.\n\n**Vocabulary.** *Sequence Model* — An algorithm that predicts labels for words based on neighboring context. *Training Corpus* — A large body of digitized text used to teach algorithms statistical language patterns.\n\n**Takeaway:** Statistical sequence models predict entity types by calculating the probability of neighboring words in a clause.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: How Computers Read Names: Statistical Sequence Models", "questiontext": "<p>How do statistical sequence models like SpaCy identify named entities in running text?</p>", "generalfeedback": "<p>Statistical sequence models use contextual weights trained on large corpora to predict entity tags probabilistically.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They evaluate tokens and their surrounding contexts using probabilistic machine learning weights trained on annotated language corpora.</p>", "feedback": "<p>Correct. Modern sequence models use contextual embeddings and statistical transition weights to predict entity spans and types.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They connect directly to the human author's mind using telepathic sensors.</p>", "feedback": "<p>Incorrect. Statistical NLP models rely on mathematical probability and training corpora, not telepathy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They consult a hard-coded alphabetical list containing every word in existence.</p>", "feedback": "<p>Incorrect. Static lists are gazetteers; statistical models predict entities based on probabilistic context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They randomly assign entity tags using a digital coin toss.</p>", "feedback": "<p>Incorrect. Models optimize predictions mathematically based on contextual training features.</p>"}]}}, {"step": 3, "title": "The IOB2 Tagging Standard: Inside, Outside, Beginning", "content": "**The IOB2 Tagging Standard: Inside, Outside, Beginning**\n\nTo track multi-word entity phrases, natural language processing uses a standard labeling scheme called **IOB2**.\n\nThe letters stand for three spatial states:\n\n1. **B (Beginning):** The very first token of an entity span (e.g., `B-PER` for *Major* in *Major Cope*).\n\n2. **I (Inside):** Any subsequent token that continues that same entity span (e.g., `I-PER` for *Cope*).\n\n3. **O (Outside):** Any token that does not belong to any named entity.\n\nLook at how the IOB2 scheme labels a historical sentence:\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Token</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">IOB2 Tag</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Entity Meaning</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Boundary Role</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Governor</td>\n      <td style=\"padding: 0.5rem;\"><code>B-PER</code></td>\n      <td style=\"padding: 0.5rem;\">Person</td>\n      <td style=\"padding: 0.5rem;\">First word of person name</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Hopson</td>\n      <td style=\"padding: 0.5rem;\"><code>I-PER</code></td>\n      <td style=\"padding: 0.5rem;\">Person</td>\n      <td style=\"padding: 0.5rem;\">Continuation of person name</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">at</td>\n      <td style=\"padding: 0.5rem;\"><code>O</code></td>\n      <td style=\"padding: 0.5rem;\">None</td>\n      <td style=\"padding: 0.5rem;\">Outside any entity</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">Halifax</td>\n      <td style=\"padding: 0.5rem;\"><code>B-LOC</code></td>\n      <td style=\"padding: 0.5rem;\">Location</td>\n      <td style=\"padding: 0.5rem;\">Single-word place name</td>\n    </tr>\n  </tbody>\n</table>\n\nThis three-letter scheme prevents software from merging two adjacent names into a single person.\n\n**Vocabulary.** *IOB2 Scheme* — A standard token-level annotation format using Beginning, Inside, and Outside tags. *Entity Span* — The complete sequence of words that forms a single named entity.\n\n**Takeaway:** The IOB2 tagging scheme allows computers to distinguish where multi-word entity spans begin, continue, and end.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The IOB2 Tagging Standard: Inside, Outside, Beginning", "questiontext": "<p>In the IOB2 tagging scheme, what does the 'B-' prefix indicate?</p>", "generalfeedback": "<p>The IOB2 standard uses B- (Beginning), I- (Inside), and O (Outside) to delimit entity boundaries cleanly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The beginning token of a multi-token or single-token named entity span.</p>", "feedback": "<p>Correct. 'B-' marks the initial token of an entity, distinguishing it from subsequent 'I-' (inside) tokens or 'O' (outside) tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A binary token that represents computer bytecode.</p>", "feedback": "<p>Incorrect. In IOB2 notation, 'B' stands for 'Beginning'.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A bad or corrupted token that must be deleted from memory.</p>", "feedback": "<p>Incorrect. 'B-' is a standard structural label marking the start of an entity span.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A background color applied to web browser typography.</p>", "feedback": "<p>Incorrect. IOB2 is a token annotation format, not a CSS display rule.</p>"}]}}, {"step": 4, "title": "Two Main Tools: SpaCy and Rule-Based Gazetteers", "content": "**Two Main Tools: SpaCy and Rule-Based Gazetteers**\n\nIn digital humanities workflows, researchers combine two computational approaches: statistical models and rule-based gazetteers.\n\n**SpaCy** is the modern industry standard for Python natural language processing. It provides pre-trained neural sequence pipelines for English (`en_core_web_sm`) and French (`fr_core_news_sm`). SpaCy tokenizes sentences, identifies parts of speech, and extracts entity spans simultaneously.\n\n**Gazetteers** take a different, rule-based approach. A gazetteer is an explicit dictionary list of known places, people, and groups. Instead of guessing based on statistical context, gazetteer matching searches text for exact string matches against verified lists.\n\nCombining both tools gives editors the best of both worlds: statistical flexibility for new names, and gazetteer precision for known historical places.\n\n**Vocabulary.** *SpaCy* — An open-source Python library for advanced natural language processing. *Gazetteer Matching* — Identifying place names by matching text directly against pre-compiled geographic dictionaries.\n\n**Takeaway:** Digital workflows combine statistical models like SpaCy with rule-based gazetteer lookups for maximum accuracy.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Two Main Tools: SpaCy and Rule-Based Gazetteers", "questiontext": "<p>What is the difference between a statistical NER tagger (like SpaCy) and a rule-based gazetteer?</p>", "generalfeedback": "<p>Gazetteers match known names deterministically; statistical models predict entities contextually.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>SpaCy generalizes based on sentence context and patterns, while a gazetteer matches exact pre-compiled lists of known names.</p>", "feedback": "<p>Correct. Gazetteers look up known strings deterministically, whereas statistical models infer entities probabilistically from surrounding context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>SpaCy works only on numbers, while gazetteers work only on punctuation marks.</p>", "feedback": "<p>Incorrect. Both tools process natural language words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Gazetteers are neural networks running in the cloud, while SpaCy is a printed dictionary.</p>", "feedback": "<p>Incorrect. SpaCy is a Python NLP library, and gazetteers are structured lookup lists.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>There is no difference; SpaCy and gazetteer are synonyms for the exact same algorithm.</p>", "feedback": "<p>Incorrect. They represent fundamentally different paradigms: deterministic lookup vs. probabilistic sequence modeling.</p>"}]}}, {"step": 5, "title": "A 10-Line Python NER Pipeline in VS Code", "content": "**A 10-Line Python NER Pipeline in VS Code**\n\nRunning an automated entity recognition pipeline in Visual Studio Code requires only a few lines of Python.\n\nYou import the `spacy` library, load your pre-trained language model, and pass your manuscript text into the pipeline. SpaCy processes the text and stores all detected entities in the `.ents` collection.\n\nLook at the simple script:\n```python\nimport spacy\n\nnlp = spacy.load(\"en_core_web_sm\")  # or fr_core_news_sm\ntext = \"Governor Hopson met Major Cope at Halifax in 1752.\"\ndoc = nlp(text)\n\nprint(f\"{'Entity':20} {'Label':10}\")\nprint(\"-\" * 30)\nfor ent in doc.ents:\n    print(f\"{ent.text:20} {ent.label_:10}\")\n```\n\nWithin two seconds, the script prints detected entities alongside standard labels like `PERSON`, `GPE` (geopolitical entity), and `DATE`.\n\n**Vocabulary.** *Pre-Trained Pipeline* — A machine learning model already trained on millions of words, ready for immediate use. *Entity Collection* — The list of detected named entity spans stored in SpaCy's document object.\n\n**Takeaway:** A 10-line Python script using SpaCy can automatically extract people, places, and dates from historical text.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: A 10-Line Python NER Pipeline in VS Code", "questiontext": "<p>In a standard SpaCy Python script, what object is created when text is passed through the loaded language pipeline (`doc = nlp(text)`)?</p>", "generalfeedback": "<p>Passing text into a SpaCy pipeline generates an annotated Doc object containing processed tokens and entity spans.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A Doc container object holding processed Token and Span objects with linguistic and entity annotations.</p>", "feedback": "<p>Correct. Calling nlp(text) runs the pipeline and returns a Doc object containing tokens, sentences, and entity spans (doc.ents).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A compressed audio recording of the manuscript being read aloud.</p>", "feedback": "<p>Incorrect. SpaCy produces structured linguistic data structures, not audio files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A blank text document with all letters replaced by zeros.</p>", "feedback": "<p>Incorrect. The Doc preserves tokens, text, and rich morphological attributes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A raster graphic image of the original manuscript page.</p>", "feedback": "<p>Incorrect. SpaCy operates on textual strings and tokens, not raster images.</p>"}]}}, {"step": 6, "title": "SpaCy Entity Labels: PERSON, GPE, LOC, and ORG", "content": "**SpaCy Entity Labels: PERSON, GPE, LOC, and ORG**\n\nSpaCy uses its own standard set of entity labels, which map closely to TEI elements.\n\nThe label `PERSON` corresponds directly to `<persName>`. The label `ORG` maps to `<orgName>`. The label `DATE` maps to `<date>`.\n\nFor places, SpaCy divides locations into two categories:\n\n1. **GPE (Geopolitical Entity):** Named administrative territories with a government, such as cities, provinces, and nations (e.g., *Halifax*, *Nova Scotia*, *France*).\n\n2. **LOC (Location):** Natural geographic features without a civic government, such as rivers, mountains, and oceans (e.g., *the Atlantic Ocean*, *the Shubenacadie River*).\n\nBoth `GPE` and `LOC` map into TEI `<placeName>`. Understanding this mapping helps you convert SpaCy output into TEI XML.\n\n**Vocabulary.** *GPE* — Geopolitical Entity: a place with an organized government, like a city or country. *LOC* — Non-GPE Location: a physical geographic feature like a mountain or lake.\n\n**Takeaway:** SpaCy tags people, groups, dates, geopolitical entities (GPE), and physical locations (LOC).\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: SpaCy Entity Labels: PERSON, GPE, LOC, and ORG", "questiontext": "<p>In standard SpaCy pipelines, what does the entity label 'GPE' represent?</p>", "generalfeedback": "<p>GPE (Geopolitical Entity) identifies administrative units like nations and cities, distinguishing them from physical landmarks (LOC).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Geopolitical Entity: countries, cities, and states with defined governments.</p>", "feedback": "<p>Correct. GPE designates political territories (cities, nations), distinct from non-political geographic landmarks (LOC).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>General Purpose Equipment: tools, machinery, and furniture.</p>", "feedback": "<p>Incorrect. GPE stands for Geopolitical Entity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Grammatical Prepositional Element: conjunctions and adverbs.</p>", "feedback": "<p>Incorrect. GPE is a named entity label, not a part-of-speech category.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Global Positioning Error: distorted satellite navigation data.</p>", "feedback": "<p>Incorrect. GPE is a semantic entity category used in information extraction.</p>"}]}}, {"step": 7, "title": "The Out-of-Vocabulary Problem: Historical Orthography Traps", "content": "**The Out-of-Vocabulary Problem: Historical Orthography Traps**\n\nWhy do modern NER models fail on archival manuscripts? The primary cause is the **Out-of-Vocabulary (OOV)** problem.\n\nLanguage models are trained on contemporary digital text: modern news articles, Wikipedia, and digitized books. Modern training corpora reflect modern spelling, grammar, and vocabulary.\n\nWhen an automated model encounters eighteenth-century spelling variations, it gets confused. Scribes write *shew'd*, *promis'd*, *décrétoit*, or *acknowledg'd*. An unrecognized word disrupts the statistical context of the clause. If the model fails to recognize an archaic verb, it often misinterprets surrounding proper names.\n\nUnderstanding OOV errors is the first lesson of computational auditing. The machine is not broken; its training data simply lacks eighteenth-century language experience.\n\n**Vocabulary.** *Out-of-Vocabulary (OOV)* — A word missing from an algorithm's pre-trained dictionary and training data. *Training Bias* — Systematic model errors caused by training data that reflects only modern digital texts.\n\n**Takeaway:** Modern language models stumble on historical manuscripts because their training data reflects contemporary spelling.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: The Out-of-Vocabulary Problem: Historical Orthography Traps", "questiontext": "<p>Why do modern pre-trained models like `en_core_web_sm` frequently fail on early modern documents?</p>", "generalfeedback": "<p>Domain mismatch and historical orthography cause out-of-vocabulary failures in models trained on modern corpora.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They are trained on modern news and web text, making them struggle with archaic spellings, capitalization habits, and obsolete syntax.</p>", "feedback": "<p>Correct. The Out-of-Vocabulary (OOV) problem arises because training data distributions diverge sharply from historical manuscript orthography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because early modern documents contain dangerous computer viruses.</p>", "feedback": "<p>Incorrect. Historical texts are harmless human linguistic records.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because pre-trained models refuse to process text written in the Roman alphabet.</p>", "feedback": "<p>Incorrect. English and French models process Roman alphabets natively.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because eighteenth-century scribes deliberately scrambled their letters to trick future computers.</p>", "feedback": "<p>Incorrect. Historical scribes wrote according to the standard conventions of their own era.</p>"}]}}, {"step": 8, "title": "Boundary Errors: Where Does a Name Begin and End?", "content": "**Boundary Errors: Where Does a Name Begin and End?**\n\nThe most common error in automated entity extraction is a **boundary error**. A boundary error occurs when an algorithm tags part of a name correctly but cuts off or extends the entity span.\n\nConsider the title and name *Governor Hopson*. Did the model tag `Governor Hopson` as a single person, or did it tag only `Hopson`? In Ace's 1791 decree, did the model tag `l'Assemblée nationale` including the elided article `l'`, or did it tag only `Assemblée nationale`?\n\nBoundary errors severely penalize automated scoring. If your manual ground truth tags `Major Jean Baptiste Cope` and the computer tags only `Jean Baptiste`, the algorithm fails both precision and recall tests on that token.\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Historical Phrase</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Manual Truth (9.1)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Machine Span (9.2)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Error Diagnosis</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Governor Hopson</td>\n      <td style=\"padding: 0.5rem;\"><code>Governor Hopson</code></td>\n      <td style=\"padding: 0.5rem;\"><code>Hopson</code></td>\n      <td style=\"padding: 0.5rem;\">Excluded official role title</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">l'Assemblée nationale</td>\n      <td style=\"padding: 0.5rem;\"><code>Assemblée nationale</code></td>\n      <td style=\"padding: 0.5rem;\"><code>l'Assemblée nationale</code></td>\n      <td style=\"padding: 0.5rem;\">Included French elided article</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">Digby County</td>\n      <td style=\"padding: 0.5rem;\"><code>Digby County</code></td>\n      <td style=\"padding: 0.5rem;\"><code>Digby</code></td>\n      <td style=\"padding: 0.5rem;\">Truncated geographic region</td>\n    </tr>\n  </tbody>\n</table>\n\n**Vocabulary.** *Boundary Error* — When an automated model incorrectly expands or truncates the start or end of an entity span. *Exact Match* — When an automated prediction matches the manual span's start and end tokens perfectly.\n\n**Takeaway:** Boundary errors occur when an automated tool captures part of a name but misses surrounding titles or geographic words.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Boundary Errors: Where Does a Name Begin and End?", "questiontext": "<p>What is a classic boundary error in automated entity extraction?</p>", "generalfeedback": "<p>Boundary errors clip titles, drop name components, or absorb adjacent punctuation into the entity span.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Tagging 'Governor Hopson' as only 'Hopson', omitting the title or capturing trailing punctuation.</p>", "feedback": "<p>Correct. Boundary errors occur when a model clips a vital part of a name or absorbs adjacent non-entity words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Changing the font color from black to purple in the terminal window.</p>", "feedback": "<p>Incorrect. Terminal styling has nothing to do with entity token boundary extraction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Converting an English word into an ancient Greek translation.</p>", "feedback": "<p>Incorrect. Boundary errors concern span coordinates, not linguistic translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Saving a text file with an illegal filename extension.</p>", "feedback": "<p>Incorrect. File naming is an operating system task separate from token span detection.</p>"}]}}, {"step": 9, "title": "Entity Type Confusion: Mixing Up Places, Groups, and People", "content": "**Entity Type Confusion: Mixing Up Places, Groups, and People**\n\nA second frequent failure mode is **entity type confusion**. The algorithm identifies the correct word boundary, but assigns the wrong semantic category.\n\nIn Ace's 1791 decree, SpaCy's French model often tags `l'Assemblée nationale` as a `LOC` (location) rather than an `ORG` (organization). The model sees the capital letters and French noun structure and guesses that the Assembly is a physical building rather than a legislative body.\n\nIn Andromeda's treaty, the model often mistakes `His Majesty's Council` for a person (`PER`) because it associates *Majesty* with royalty. Diagnosing type confusion helps editors decide when rule-based filters must override statistical guesses.\n\n**Vocabulary.** *Type Confusion* — When an algorithm correctly identifies an entity span but assigns the wrong category label. *Semantic Ambiguity* — Words that can represent both physical places and governing organizations.\n\n**Takeaway:** Automated taggers frequently confuse governing organizations with physical buildings or personal titles.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Entity Type Confusion: Mixing Up Places, Groups, and People", "questiontext": "<p>Which example illustrates entity type confusion in an automated NER model?</p>", "generalfeedback": "<p>Entity type confusion occurs when an algorithm correctly locates a name but assigns it to the wrong semantic class.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Classifying 'Assemblée nationale' as a PERSON rather than an ORG.</p>", "feedback": "<p>Correct. Type confusion occurs when the span boundaries are correct but the assigned semantic category is wrong.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Recognizing 'Paris' as a place located in France.</p>", "feedback": "<p>Correctly identifying Paris as a place is accurate classification, not confusion.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Failing to find the word 'and' in a sentence.</p>", "feedback": "<p>Conjunctions are not named entities, so omitting them is correct behavior.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Printing the text to a desktop printer without paper.</p>", "feedback": "<p>Printer hardware errors are unrelated to entity type confusion.</p>"}]}}, {"step": 10, "title": "Cohort Corpus A Tests: Ace and the 1791 French Decree", "content": "**Cohort Corpus A Tests: Ace and the 1791 French Decree**\n\nWhen Ace runs SpaCy's French pipeline (`fr_core_news_sm`) over the 1791 French Revolutionary decree, several predictable errors emerge.\n\nFirst, elided clitics create tokenization traps. In French, the definite article *le* or *la* contracts before a vowel into `l'`. When SpaCy encounters `l'Assemblée nationale`, does it split `l'` from `Assemblée`? If the tokenizer treats `l'Assemblée` as a single word, the entity boundary becomes corrupted.\n\nSecond, royal and revolutionary dates challenge modern parsers. The phrase *ce 25 Août 1791* contains historical capitalization and month naming. SpaCy often misses the full date expression, capturing only the year `1791` while ignoring the day and month.\n\n**Vocabulary.** *Clitic Contraction* — A contracted word like French l' attached directly to a neighboring noun. *Date Truncation* — Capturing only a single year number while missing the surrounding calendar phrase.\n\n**Takeaway:** French historical decrees challenge automated parsers with elided articles and complex formal date phrasing.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Cohort Corpus A Tests: Ace and the 1791 French Decree", "questiontext": "<p>When Ace runs `fr_core_news_sm` on the 1791 French Revolutionary decree, which language feature challenges the model?</p>", "generalfeedback": "<p>French historical contractions (l', d') and institutional titles challenge default modern tokenization and tagging.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Elided determiners and prepositions like 'l'Assemblée' and 'd'Orléans', which modern tokenizers may fail to split cleanly.</p>", "feedback": "<p>Correct. French contractions and historical royal/legislative formulas test the limits of modern news-trained tokenizers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The entire text being written in Chinese pictograms.</p>", "feedback": "<p>Incorrect. The decree is written in eighteenth-century French.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manuscript containing only numerical accounting tables without words.</p>", "feedback": "<p>Incorrect. The decree is a legislative narrative text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The French language having no nouns or adjectives.</p>", "feedback": "<p>Incorrect. French possesses rich morphological and nominal structures.</p>"}]}}, {"step": 11, "title": "Cohort Corpus B Tests: Olyvia and Maud Lewis's Letters", "content": "**Cohort Corpus B Tests: Olyvia and Maud Lewis's Letters**\n\nWhen Olyvia runs SpaCy's English pipeline (`en_core_web_sm`) over Maud Lewis's 1967 letter, a different set of challenges arises.\n\nInformal personal correspondence lacks formal official titles. Maud Lewis writes in casual prose, referring to her husband simply as *Everett*. Because *Everett* appears without an honorific title like *Mr.* or *Dr.*, SpaCy's statistical model assigns lower confidence to the word.\n\nFurthermore, rural Maritime place names test modern training corpora. SpaCy easily recognizes *Halifax* and *Nova Scotia*. But it often completely ignores *Marshalltown*, treating it as an ordinary common noun. Automated tools trained on global news know world capitals, but they are blind to rural Nova Scotia hamlets.\n\n**Vocabulary.** *Low-Resource Toponym* — A small village or rural location rarely mentioned in global digital training text. *Confidence Score* — A mathematical probability value generated by an algorithm indicating its certainty.\n\n**Takeaway:** Modern NER models easily recognize global cities like Halifax but frequently miss rural hamlets like Marshalltown.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Cohort Corpus B Tests: Olyvia and Maud Lewis's Letters", "questiontext": "<p>Why does `en_core_web_sm` struggle to detect entities in Olyvia's Maud Lewis correspondence?</p>", "generalfeedback": "<p>Informal personal letters lack the formal journalistic context that standard statistical models expect.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Informal colloquial mentions like 'Everett' lack institutional titles or formal journalistic sentence context.</p>", "feedback": "<p>Correct. Intimate epistolary style diverges from the formal journalistic prose used to train standard news models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Maud Lewis wrote her letters entirely in mathematical equations.</p>", "feedback": "<p>Incorrect. Maud Lewis wrote informal personal English letters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The letters were typed on a digital word processor with spellcheck enabled.</p>", "feedback": "<p>Incorrect. The letters were hand-painted or handwritten on paper.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Personal letters are legally exempt from Natural Language Processing.</p>", "feedback": "<p>Incorrect. Any textual document can be analyzed using NLP tools.</p>"}]}}, {"step": 12, "title": "Cohort Corpus C Tests: Andromeda and the 1752 Treaty", "content": "**Cohort Corpus C Tests: Andromeda and the 1752 Treaty**\n\nWhen Andromeda runs SpaCy over the 1752 Peace and Friendship Treaty, the model encounters eighteenth-century legal rhetoric.\n\nThe treaty features long, complex sentences with multiple embedded clauses. In the phrase *Major Jean Baptiste Cope, Chief Sachem of the Tribe of Mickmack Indians*, SpaCy struggles to separate personal names from sovereign titles.\n\nThe model frequently tags *Major Jean Baptiste Cope* as a person, but truncates *Tribe of Mickmack Indians* or misclassifies it as a location. Crucially, SpaCy completely overlooks the Indigenous toponym *Chigabenakady*, guessing that the archaic word is a foreign term or common noun.\n\n**Vocabulary.** *Legal Preamble* — The introductory formal declaration of a treaty or law setting out parties and dates. *Toponym Blindness* — The total failure of an algorithm to recognize an Indigenous or historical place name.\n\n**Takeaway:** Complex 18th-century treaty rhetoric and Indigenous place names cause severe omissions in standard NER pipelines.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Cohort Corpus C Tests: Andromeda and the 1752 Treaty", "questiontext": "<p>In Andromeda's 1752 Treaty, what causes automated models to misclassify 'Major Jean-Baptiste Cope'?</p>", "generalfeedback": "<p>Complex historical titles and intercultural naming conventions frequently mislead automated statistical classifiers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The military title 'Major' combined with hyphenated French forenames in an eighteenth-century English diplomatic treaty.</p>", "feedback": "<p>Correct. Cross-cultural naming conventions and military honorifics confuse single-language modern models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The treaty was written in computer machine binary.</p>", "feedback": "<p>Incorrect. The treaty is written in eighteenth-century diplomatic English.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The text contains no names of any human beings.</p>", "feedback": "<p>Incorrect. The treaty prominently names Mi'kmaw and British signatories.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Treaties are always rejected by Python libraries as invalid syntax.</p>", "feedback": "<p>Incorrect. Python processes treaty text without difficulty.</p>"}]}}, {"step": 13, "title": "Measuring Machine Accuracy: Precision, Recall, and F1-Score", "content": "**Measuring Machine Accuracy: Precision, Recall, and F1-Score**\n\nTo evaluate automated tools scientifically, computational humanists use three standard mathematical metrics: **Precision**, **Recall**, and **F1-Score**.\n\n**Precision** measures correctness: out of all the entities the computer predicted, how many were actually right?\n$$\\text{Precision} = \\frac{\\text{True Positives}}{\\text{True Positives} + \\text{False Positives}}$$\n\n**Recall** measures completeness: out of all the true entities in your document, how many did the computer find?\n$$\\text{Recall} = \\frac{\\text{True Positives}}{\\text{True Positives} + \\text{False Negatives}}$$\n\n**F1-Score** is the harmonic balance between Precision and Recall. A model that guesses rarely might have high precision, but terrible recall. F1 measures overall reliability.\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Metric</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Core Question</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Formula</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">What It Penalizes</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Precision</td>\n      <td style=\"padding: 0.5rem;\">Were the computer's guesses correct?</td>\n      <td style=\"padding: 0.5rem;\">TP / (TP + FP)</td>\n      <td style=\"padding: 0.5rem;\">False alarms (hallucinated entities)</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Recall</td>\n      <td style=\"padding: 0.5rem;\">Did the computer find all true entities?</td>\n      <td style=\"padding: 0.5rem;\">TP / (TP + FN)</td>\n      <td style=\"padding: 0.5rem;\">Missed entities (silent omissions)</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">F1-Score</td>\n      <td style=\"padding: 0.5rem;\">What is the overall balanced score?</td>\n      <td style=\"padding: 0.5rem;\">2 * (P * R) / (P + R)</td>\n      <td style=\"padding: 0.5rem;\">Unbalanced performance</td>\n    </tr>\n  </tbody>\n</table>\n\n**Vocabulary.** *Precision* — The fraction of retrieved entities that are relevant and accurate. *Recall* — The fraction of true historical entities that the model successfully retrieved. *F1-Score* — The balanced harmonic mean of precision and recall.\n\n**Takeaway:** Precision measures accuracy, recall measures completeness, and F1-Score balances both metrics into a single score.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Measuring Machine Accuracy: Precision, Recall, and F1-Score", "questiontext": "<p>What does the Recall metric measure in named entity evaluation?</p>", "generalfeedback": "<p>Recall measures completeness: what percentage of all real ground-truth entities did the model capture?</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The proportion of true entities from the human ground truth that the automated model successfully found.</p>", "feedback": "<p>Correct. Recall = True Positives / (True Positives + False Negatives), measuring coverage completeness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The physical speed at which the computer processor completes the calculation.</p>", "feedback": "<p>Incorrect. Processing speed is execution throughput, not recall accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The percentage of predicted entities that turned out to be correct.</p>", "feedback": "<p>Incorrect. That is the definition of Precision, not Recall.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The number of spelling errors found in the original manuscript.</p>", "feedback": "<p>Incorrect. Recall measures model retrieval performance, not scribal errors.</p>"}]}}, {"step": 14, "title": "Understanding Error Types: False Positives vs. False Negatives", "content": "**Understanding Error Types: False Positives vs. False Negatives**\n\nTo calculate precision and recall, you must classify every machine decision into one of four bins:\n\n\n1. **True Positive (TP):** The machine predicted an entity, and your manual ground truth confirms it is correct.\n\n2. **False Positive (FP):** The machine predicted an entity that is not in your ground truth (a false alarm).\n\n3. **False Negative (FN):** Your ground truth contains an entity that the machine completely missed (an omission).\n\n4. **True Negative (TN):** Ordinary words that both you and the machine correctly ignored.\n\nIf your 20-entity passage produced 14 True Positives, 3 False Positives, and 6 False Negatives, your Precision is $14 / 17 = 82.4\\%$. Your Recall is $14 / 20 = 70.0\\%$.\n\n**Vocabulary.** *True Positive* — A correctly identified named entity. *False Positive* — An incorrect prediction where ordinary text was falsely tagged as an entity. *False Negative* — A true entity that the machine completely overlooked.\n\n**Takeaway:** Classifying machine decisions into True Positives, False Positives, and False Negatives allows exact mathematical scoring.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Understanding Error Types: False Positives vs. False Negatives", "questiontext": "<p>What constitutes a False Positive in named entity recognition?</p>", "generalfeedback": "<p>A False Positive is an incorrect detection: the model claimed something was an entity when the ground truth says it is not.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model predicts an entity where none exists in the ground truth, or tags a common noun as a name.</p>", "feedback": "<p>Correct. A False Positive is an erroneous prediction, incorrectly claiming a non-entity or wrong span as a name.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model correctly identifies a person and assigns the correct name.</p>", "feedback": "<p>Incorrect. That is a True Positive.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model completely misses a real historical person mentioned in the text.</p>", "feedback": "<p>Incorrect. Missing a real entity is a False Negative.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model turns off the computer monitor during execution.</p>", "feedback": "<p>Incorrect. Hardware states are not classification error types.</p>"}]}}, {"step": 15, "title": "Automated Gazetteers: Matching Names Against Pre-Compiled Lists", "content": "**Automated Gazetteers: Matching Names Against Pre-Compiled Lists**\n\nStatistical sequence models are not the only way to find entities. A **gazetteer pipeline** uses exact dictionary lookup.\n\nA gazetteer is a simple text file containing known historical names, places, and organizations. When your Python script reads a historical document, it searches every token against the gazetteer list.\n\nLook at how a simple Python gazetteer operates:\n```python\nplaces = {\"Halifax\", \"Marshalltown\", \"Digby\", \"Paris\", \"Chigabenakady\"}\nwords = text.split()\nfound_places = [w for w in words if w in places]\n```\n\nGazetteer lookups are lightning fast and 100% predictable. If *Chigabenakady* is in your list, the computer finds it every time. However, gazetteers cannot identify new, unexpected names that are missing from the list.\n\n**Vocabulary.** *Gazetteer Lookup* — Finding entities by matching words directly against a pre-compiled list. *Dictionary Coverage* — The percentage of true entities contained within a gazetteer list.\n\n**Takeaway:** Gazetteer lookups provide fast, reliable matching for known historical names but cannot discover new entities.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Automated Gazetteers: Matching Names Against Pre-Compiled Lists", "questiontext": "<p>What is the primary strength and primary weakness of a pure gazetteer lookup approach?</p>", "generalfeedback": "<p>Gazetteers provide rock-solid precision for known entries, but fail completely on novel or uncatalogued variants.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It achieves 100% precision for known names on its list, but has zero recall for novel names or variant spellings not included.</p>", "feedback": "<p>Correct. Gazetteers cannot recognize uncatalogued variants (poor recall), but match listed names reliably (high precision).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It runs infinitely fast but destroys all files on the hard drive.</p>", "feedback": "<p>Incorrect. Gazetteers are safe string-matching algorithms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It can read handwritten manuscripts from photos without OCR, but cannot read print.</p>", "feedback": "<p>Incorrect. Gazetteers operate strictly on digital text strings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires quantum computing hardware to run simple searches.</p>", "feedback": "<p>Incorrect. Gazetteers are simple, lightweight dictionary lookups.</p>"}]}}, {"step": 16, "title": "SpaCy EntityRuler: Combining Rules with Statistical Models", "content": "**SpaCy EntityRuler: Combining Rules with Statistical Models**\n\nSpaCy provides a powerful built-in component that bridges rules and statistics: the **EntityRuler**.\n\nThe EntityRuler lets you define custom pattern-matching rules using Python dictionaries. You can specify exact word strings, capitalization patterns, or regular expressions.\n\nLook at how you teach SpaCy an Indigenous place name that its statistical model missed:\n```python\nruler = nlp.add_pipe(\"entity_ruler\", before=\"ner\")\npatterns = [\n    {\"label\": \"GPE\", \"pattern\": \"Chigabenakady\"},\n    {\"label\": \"PERSON\", \"pattern\": \"Major Jean Baptiste Cope\"}\n]\nruler.add_patterns(patterns)\n```\n\nBy placing the EntityRuler *before* the statistical NER model, your verified historical rules take priority. The computer checks your rules first, and uses statistical predictions only for remaining words.\n\n**Vocabulary.** *EntityRuler* — A SpaCy component that applies custom pattern-matching rules before statistical models. *Rule Precedence* — The principle that verified editorial rules override machine statistical guesses.\n\n**Takeaway:** The SpaCy EntityRuler lets you add verified historical names to the pipeline so custom rules override statistical errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: SpaCy EntityRuler: Combining Rules with Statistical Models", "questiontext": "<p>How does the SpaCy `EntityRuler` enhance a statistical NER pipeline?</p>", "generalfeedback": "<p>The EntityRuler blends rule-based patterns and gazetteers directly into SpaCy's pipeline to correct statistical blind spots.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It injects deterministic pattern-matching rules and gazetteer lists directly into the pipeline, overriding or supplementing statistical predictions.</p>", "feedback": "<p>Correct. The EntityRuler combines rule-based precision with statistical breadth, allowing custom rules to patch known model weaknesses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It physically measures the margins of the manuscript page in inches.</p>", "feedback": "<p>Incorrect. EntityRuler is a software component for pattern matching, not a physical measuring stick.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates the entire text into Latin before parsing.</p>", "feedback": "<p>Incorrect. EntityRuler matches token patterns in the target language.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all statistical machine learning models from the computer.</p>", "feedback": "<p>Incorrect. EntityRuler works harmoniously alongside statistical taggers.</p>"}]}}, {"step": 17, "title": "Exporting Automated NER to TEI XML: Building ner_baseline.xml", "content": "**Exporting Automated NER to TEI XML: Building ner_baseline.xml**\n\nTo compare automated predictions directly against yesterday's manual ground truth, the computer's output must be exported in the same file format: TEI XML.\n\nYour Python script processes your manuscript text, extracts detected entity spans, and wraps them in TEI elements: `<persName>`, `<placeName>`, `<orgName>`, and `<date>`.\n\nThe script saves the result to `ner_baseline.xml`. Every automatically detected entity receives an automated ID, such as `xml:id=\"ner-01\"`. By converting raw SpaCy predictions into structured XML, you prepare the file for direct side-by-side diffing in VS Code.\n\n**Vocabulary.** *XML Serialization* — Converting computer data structures into formatted, valid XML text. *Baseline XML* — The unedited automated output file used to benchmark machine accuracy.\n\n**Takeaway:** Exporting automated predictions into ner_baseline.xml creates a standardized XML file ready for direct comparison with ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Exporting Automated NER to TEI XML: Building ner_baseline.xml", "questiontext": "<p>Why must automated NER predictions be exported into valid TEI XML before running a comparative benchmark?</p>", "generalfeedback": "<p>Exporting predictions to TEI XML aligns machine outputs with the manual baseline for direct scientific auditing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To allow direct, automated token-by-token comparison against the manual ground-truth XML baseline.</p>", "feedback": "<p>Correct. Structuring both manual and automated predictions in matching TEI format enables systematic diffing and scoring.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Python scripts cannot write data to any format other than TEI XML.</p>", "feedback": "<p>Incorrect. Python can output JSON, CSV, plain text, and many other formats.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Moodle crashes if non-XML files exist in the project directory.</p>", "feedback": "<p>Incorrect. Moodle does not inspect internal local development files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because historical manuscripts cannot be stored in modern databases.</p>", "feedback": "<p>Incorrect. Historical texts are regularly stored across many database architectures.</p>"}]}}, {"step": 18, "title": "The VS Code Side-by-Side Diff Audit", "content": "**The VS Code Side-by-Side Diff Audit**\n\nNow comes your primary scientific task for today: auditing machine predictions against human ground truth using the VS Code diff viewer.\n\nOpen your project terminal in VS Code and launch the diff viewer:\n```bash\ncode --diff ground_truth_entities_manual.xml ner_baseline.xml\n```\n\nVS Code opens both files in a split-screen view. Differences appear highlighted in red and green:\n\n* **Green on the Left:** Entities from your manual baseline that the computer missed (False Negatives).\n\n* **Red on the Right:** Entities that the computer hallucinated or tagged incorrectly (False Positives).\n\n* **Aligned Blocks:** Entities where both human and computer agreed perfectly (True Positives).\n\n**Vocabulary.** *Diff Viewer* — A software tool that visually highlights textual differences between two files side by side. *Visual Auditing* — Inspecting colored diff lines to locate machine errors rapidly.\n\n**Takeaway:** The VS Code diff viewer highlights discrepancies between manual truth and automated predictions in clear color codes.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: The VS Code Side-by-Side Diff Audit", "questiontext": "<p>How does an editor perform a side-by-side diff audit between `ground_truth_entities_manual.xml` and `ner_baseline.xml` in VS Code?</p>", "generalfeedback": "<p>VS Code's side-by-side diff view enables rapid, visual auditing of disagreements between manual and machine markup.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By selecting both files in the file explorer and choosing 'Compare Selected' to visually highlight every tag and boundary disagreement.</p>", "feedback": "<p>Correct. VS Code's diff viewer highlights additions, deletions, and structural divergences side-by-side in color.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By printing both files onto transparent plastic sheets and holding them up to a window.</p>", "feedback": "<p>Incorrect. VS Code provides built-in digital diff capabilities on screen.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting both files and rewriting them from memory.</p>", "feedback": "<p>Incorrect. Auditing requires comparing the existing files directly.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By running an audio converter to listen to the files simultaneously.</p>", "feedback": "<p>Incorrect. Textual diffing is visual and programmatic, not acoustic.</p>"}]}}, {"step": 19, "title": "Building the Discrepancy Table in NER_BENCHMARK.md", "content": "**Building the Discrepancy Table in NER_BENCHMARK.md**\n\nAs you inspect the diff, you will record every disagreement in your benchmark report: `NER_BENCHMARK.md`.\n\nYou will compile a structured discrepancy table with four columns:\n\n1. **Mention:** The historical word string on the manuscript page.\n\n2. **Manual Truth (9.1):** Your verified human tag and category.\n\n3. **Machine Guess (9.2):** What the automated tool predicted.\n\n4. **Error Diagnosis:** Why the machine failed (e.g., OOV spelling, boundary error, type confusion).\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Mention</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Manual Truth (9.1)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Machine Guess (9.2)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Error Diagnosis</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Major Cope</td>\n      <td style=\"padding: 0.5rem;\"><code>&lt;persName&gt;</code></td>\n      <td style=\"padding: 0.5rem;\"><code>Cope (PER)</code></td>\n      <td style=\"padding: 0.5rem;\">Boundary error: dropped title</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Chigabenakady</td>\n      <td style=\"padding: 0.5rem;\"><code>&lt;placeName&gt;</code></td>\n      <td style=\"padding: 0.5rem;\">[None]</td>\n      <td style=\"padding: 0.5rem;\">False negative: OOV Indigenous name</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">Assemblée</td>\n      <td style=\"padding: 0.5rem;\"><code>&lt;orgName&gt;</code></td>\n      <td style=\"padding: 0.5rem;\"><code>LOC</code></td>\n      <td style=\"padding: 0.5rem;\">Type confusion: tagged org as place</td>\n    </tr>\n  </tbody>\n</table>\n\nDocumenting these errors transforms raw numbers into scholarly insight.\n\n**Vocabulary.** *Discrepancy Table* — A structured log listing every point of disagreement between two annotation passes. *Error Diagnosis* — Explaining the linguistic or technical reason behind a machine failure.\n\n**Takeaway:** The discrepancy table in NER_BENCHMARK.md records and diagnoses every machine error against manual ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Building the Discrepancy Table in NER_BENCHMARK.md", "questiontext": "<p>What information should be recorded for each entry in the `NER_BENCHMARK.md` discrepancy table?</p>", "generalfeedback": "<p>The discrepancy table documents token spans, expected tags, machine predictions, error categories, and philological causes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Token span, manual ground truth tag, machine prediction tag, error classification, and philological explanation.</p>", "feedback": "<p>Correct. A thorough discrepancy audit logs what was expected, what was predicted, the error type, and the root cause.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The weather outside the library and the temperature of the room.</p>", "feedback": "<p>Incorrect. Environmental weather is irrelevant to computational text benchmarking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The price of the student's laptop computer.</p>", "feedback": "<p>Incorrect. Hardware costs do not belong in a textual discrepancy report.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The names of all students enrolled in other university departments.</p>", "feedback": "<p>Incorrect. The discrepancy table focuses on the text under investigation.</p>"}]}}, {"step": 20, "title": "Preprocessing with Module 6 Normalization", "content": "**Preprocessing with Module 6 Normalization**\n\nHow can an editor improve automated NER accuracy on historical documents? The most effective strategy is **text preprocessing** using our work from Module 6.\n\nIn Module 6, you created normalized reading forms inside `<choice>` tags. Scribes wrote *décrétoit* and *shew'd*; you added normalized forms like *décrétait* and *showed*.\n\nIf you feed raw historical ink into SpaCy, OOV errors spike. But if you feed your normalized reading text into the pipeline, dictionary lookups succeed. The model recognizes the modern spelling, predicts the correct entity tags, and transfers those tags back to your diplomatic edition. Preprocessing bridges premodern spelling with modern training models.\n\n**Vocabulary.** *Text Preprocessing* — Cleaning or regularizing text before passing it to machine learning tools. *Normalization Bridge* — Using standardized spellings from choice tags to rescue modern NLP tools.\n\n**Takeaway:** Preprocessing text with Module 6 regularized spellings dramatically increases automated NER accuracy on historical documents.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Preprocessing with Module 6 Normalization", "questiontext": "<p>How does applying Module 6 orthographic normalization before running NER improve automated performance?</p>", "generalfeedback": "<p>Orthographic normalization reduces out-of-vocabulary errors, allowing modern models to recognize historical name tokens.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Standardizing historical spelling variants (e.g. historical 's', contractions) brings words closer to the modern training vocabulary of the model.</p>", "feedback": "<p>Correct. Normalizing archaic typography resolves out-of-vocabulary mismatches, significantly increasing recall.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all consonants from the manuscript.</p>", "feedback": "<p>Incorrect. Deleting consonants renders the text unreadable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes the historical text into modern slang.</p>", "feedback": "<p>Incorrect. Scholarly normalization standardizes historical orthography without rewriting semantics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces all proper names with generic numbers.</p>", "feedback": "<p>Incorrect. Entity recognition requires preserving name tokens.</p>"}]}}, {"step": 21, "title": "Token Alignment and Overlapping Spans", "content": "**Token Alignment and Overlapping Spans**\n\nWhen evaluating automated models, you must verify that token counts remain aligned.\n\nIf SpaCy splits contractions differently than your manual file, token counts diverge. For example, if your manual ground truth treated *can't* as two tokens (`can` and `n't`) and SpaCy treats it as one token (`can't`), scoring scripts will throw alignment errors.\n\nAlways run a token alignment check before calculating final precision and recall. If token counts differ, adjust your tokenization settings in Python before computing performance scores.\n\n**Vocabulary.** *Token Alignment* — Ensuring that two different annotation passes share identical word boundaries and token counts. *Alignment Error* — A mismatch in token splitting that prevents automated scoring scripts from running.\n\n**Takeaway:** Verifying token alignment between manual and machine files is required before calculating precision and recall.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Token Alignment and Overlapping Spans", "questiontext": "<p>What problem occurs when an automated tagger splits a hyphenated word that the manual baseline treated as a single token?</p>", "generalfeedback": "<p>Token alignment must be preserved or reconciled to calculate accurate mathematical precision and recall scores.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Token misalignment, making automated 1-to-1 evaluation impossible without alignment mapping.</p>", "feedback": "<p>Correct. Discrepant token boundaries break automated evaluation matrices unless an alignment map reconciles character offsets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The hard drive immediately formats itself.</p>", "feedback": "<p>Incorrect. Software token mismatch does not damage hardware.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The text automatically translates into French.</p>", "feedback": "<p>Incorrect. Tokenization differences do not trigger language translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer operating system cancels the student's enrollment.</p>", "feedback": "<p>Incorrect. Academic enrollment is handled by university administrative servers.</p>"}]}}, {"step": 22, "title": "Entity Linking: From Tagged Spans to External Records", "content": "**Entity Linking: From Tagged Spans to External Records**\n\nExtracting an entity span is only the first half of the task. The second half is **Entity Linking** (also called entity disambiguation or Wikification).\n\nEntity linking matches an extracted string (like *Halifax*) to a specific authority record in Wikidata, VIAF, or GeoNames.\n\nAutomated sequence models like SpaCy find the boundaries of names, but standard models do not link them to external URLs by default. To automate entity linking, digital scholars use specialized linking libraries like SpaCy-Entity-Linker or direct API queries against Wikidata.\n\n**Vocabulary.** *Entity Linking* — Connecting a detected entity span to its specific entry in an external knowledge base. *Wikification* — Automatically linking text mentions to relevant Wikipedia or Wikidata articles.\n\n**Takeaway:** Entity linking connects raw detected name strings to specific external authority records in public knowledge graphs.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Entity Linking: From Tagged Spans to External Records", "questiontext": "<p>What is the distinction between Named Entity Recognition (NER) and Named Entity Linking (NEL)?</p>", "generalfeedback": "<p>NER identifies entity boundaries and types; NEL resolves those entities to unique authority records (e.g. Wikidata Q-numbers).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>NER detects name spans and categories in text; NEL resolves those spans to specific external authority database records.</p>", "feedback": "<p>Correct. Recognition finds the mentions (who/where), while linking connects them to canonical database identifiers (which exact person/place).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>NER is for books, while NEL is for newspapers.</p>", "feedback": "<p>Incorrect. Both techniques apply across all genres of text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>NER is done by humans, while NEL can only be done by hand with a pencil.</p>", "feedback": "<p>Incorrect. Both tasks can be executed manually or automated programmatically.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>There is no distinction; NER and NEL are identical synonyms.</p>", "feedback": "<p>Incorrect. Recognition and linking are two distinct phases of the information extraction pipeline.</p>"}]}}, {"step": 23, "title": "Wikidata API Queries in Python", "content": "**Wikidata API Queries in Python**\n\nYou can automate entity linking in Python by sending search requests directly to the Wikidata Web API.\n\nWhen your script detects an entity span like *Maud Lewis*, it formats a search URL and retrieves matching Wikidata entities in JSON format:\n```python\nimport urllib.request, json, urllib.parse\n\nquery = urllib.parse.quote(\"Maud Lewis\")\nurl = f\"https://www.wikidata.org/w/api.php?action=wbsearchentities&search={query}&language=en&format=json\"\nreq = urllib.request.urlopen(url)\ndata = json.loads(req.read().decode())\n\ntop_result = data[\"search\"][0]\nprint(top_result[\"id\"], top_result[\"label\"], top_result[\"description\"])\n```\n\nWithin half a second, the API returns `Q2302306`: \"Canadian folk artist (1903–1970).\" Your script captures this ID and writes it into the `@ref` attribute.\n\n**Vocabulary.** *Web API* — An online interface that allows software programs to request and receive structured data automatically. *JSON* — JavaScript Object Notation, the standard data format for web API responses.\n\n**Takeaway:** Python scripts can query the Wikidata API automatically to retrieve Q-identifiers for detected entities.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Wikidata API Queries in Python", "questiontext": "<p>How does a Python script query the Wikidata API to find potential matches for an entity string?</p>", "generalfeedback": "<p>Python queries the Wikidata `wbsearchentities` API to retrieve candidate Q-identifiers and descriptions automatically.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By sending an HTTP GET request to the `wbsearchentities` action endpoint with the search string and language parameters.</p>", "feedback": "<p>Correct. The MediaWiki API endpoint `wbsearchentities` returns structured JSON candidate records with descriptions and Q-identifiers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By sending a printed postcard to the Wikimedia Foundation headquarters in California.</p>", "feedback": "<p>Incorrect. APIs provide instantaneous automated programmatic access over HTTP.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By scraping every web page on Wikipedia into a local text file.</p>", "feedback": "<p>Incorrect. Scraping the entire encyclopedia is inefficient; the API provides targeted querying.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By executing a shell command that shuts down the local network router.</p>", "feedback": "<p>Incorrect. API queries use standard network communication.</p>"}]}}, {"step": 24, "title": "The Ambiguity Trap in Automated Linking", "content": "**The Ambiguity Trap in Automated Linking**\n\nAutomated entity linking works well for famous, unique names. But it falls into catastrophic traps when a name is common or ambiguous.\n\nSuppose your script searches the Wikidata API for the surname *Cope* from the 1752 Treaty. The API returns dozens of results: Edward Drinker Cope (the American paleontologist), Arthur Cope (the British portrait painter), and Julian Cope (the rock musician).\n\nAn automated script without historical context often defaults to the most famous modern result. It might link an eighteenth-century Mi'kmaw leader to a twentieth-century rock singer. Human supervision is required to prevent absurd automated linking errors.\n\n**Vocabulary.** *Linking Ambiguity* — When a search query matches multiple plausible authority records in a knowledge base. *Default Bias* — An automated algorithm's tendency to select the most popular modern record when multiple matches exist.\n\n**Takeaway:** Automated linking frequently confuses historical figures with famous modern names; human supervision prevents absurd errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: The Ambiguity Trap in Automated Linking", "questiontext": "<p>Why must automated entity linking results be carefully verified when searching for common names?</p>", "generalfeedback": "<p>Automated search often defaults to prominent modern figures, requiring human disambiguation for historical entities.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Multiple historical figures often share identical names, and automated scripts may link to the most famous modern person instead of the historical actor.</p>", "feedback": "<p>Correct. Popularity-ranked API results frequently return modern celebrities rather than eighteenth-century colonial or revolutionary figures.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Wikidata deliberately gives false answers to test students.</p>", "feedback": "<p>Incorrect. Wikidata is a collaborative open knowledge base, not a deceptive test.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the internet cannot transfer historical data across national borders.</p>", "feedback": "<p>Incorrect. Internet protocols transmit all digital text globally.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because search algorithms only return results written in German.</p>", "feedback": "<p>Incorrect. Wikidata supports multilingual querying across dozens of languages.</p>"}]}}, {"step": 25, "title": "Handling Verified Absences in Automated Pipelines", "content": "**Handling Verified Absences in Automated Pipelines**\n\nWhat happens when an automated linking script searches Wikidata for a historical person who has no record?\n\nStandard API scripts are programmed to return the closest fuzzy match. If a minor French clerk or rural correspondent has no entry, the algorithm picks the nearest similar name.\n\nA scholarly pipeline must include a **similarity threshold gate**. If the API's top match score falls below an editorial confidence threshold (such as 85%), the script must record a null result rather than attaching a false match. The mention remains tagged in TEI XML, but the `@ref` attribute points to your local `<particDesc>` in the header.\n\n**Vocabulary.** *Confidence Threshold* — A minimum mathematical score required before an automated tool accepts an API match. *Fuzzy Matching* — Searching for strings that are approximately similar rather than exact matches.\n\n**Takeaway:** Setting a strict confidence threshold prevents automated linking scripts from attaching false matches to unindexed people.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Handling Verified Absences in Automated Pipelines", "questiontext": "<p>What should an automated linking pipeline do when an API search returns zero matching records for a historical person?</p>", "generalfeedback": "<p>Automated pipelines must flag zero-match queries as Verified Absences and mint local identifiers rather than confabulating links.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Assign a local project identifier, flag the entity as a Verified Absence, and log it for human review.</p>", "feedback": "<p>Correct. Graceful handling records the absence and assigns a local identifier rather than crashing or assigning a false match.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Invent a random 8-digit number and pretend it is a real Wikidata Q-ID.</p>", "feedback": "<p>Incorrect. Inventing fake identifiers corrupts linked open data integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Crash the entire pipeline and delete all previously parsed documents.</p>", "feedback": "<p>Incorrect. Pipelines should catch missing records and log them gracefully.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the person's name in the document with 'Unknown'.</p>", "feedback": "<p>Incorrect. Editorial pipelines never alter the primary historical text.</p>"}]}}, {"step": 26, "title": "Synthesizing Results: Writing NER_BENCHMARK.md", "content": "**Synthesizing Results: Writing NER_BENCHMARK.md**\n\nToday's lab culminates in the creation of your formal benchmark report: `NER_BENCHMARK.md`. This file documents your empirical findings in your project repository.\n\nYour report must contain four core sections:\n\n1. **Pipeline Configuration:** Detail the model used (`en_core_web_sm` or `fr_core_news_sm`), Python version, and parameters.\n\n2. **Quantitative Scores:** Report your exact Precision, Recall, and F1-Scores against Tuesday's manual table.\n\n3. **Discrepancy Analysis:** Include your four-column discrepancy table diagnosing every machine error.\n\n4. **Scholarly Reflection:** A 200–300 word discussion explaining why the automated model struggled with your specific historical witness.\n\n**Vocabulary.** *Benchmark Report* — A formal document reporting the quantitative accuracy and error analysis of a computational tool. *Empirical Findings* — Results derived from actual experimental data and mathematical measurement.\n\n**Takeaway:** NER_BENCHMARK.md documents your model setup, accuracy scores, error diagnoses, and methodological reflection.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Synthesizing Results: Writing NER_BENCHMARK.md", "questiontext": "<p>What is the primary role of the `NER_BENCHMARK.md` report in your project repository?</p>", "generalfeedback": "<p>NER_BENCHMARK.md documents experimental precision, recall, F1 scores, and error analyses for reproducible research.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To formally record experimental methodology, performance metrics (P/R/F1), error taxonomy breakdowns, and curated discrepancy tables.</p>", "feedback": "<p>Correct. The benchmark document provides a transparent, reproducible scientific audit of automated tool performance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To serve as a marketing advertisement to sell the software to commercial companies.</p>", "feedback": "<p>Incorrect. NER_BENCHMARK.md is an open scholarly research report.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To complain about the difficulty of university examinations.</p>", "feedback": "<p>Incorrect. Academic reports maintain professional scholarly focus.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To provide a fictional narrative about time travel.</p>", "feedback": "<p>Incorrect. The report documents empirical computational linguistics experiments.</p>"}]}}, {"step": 27, "title": "The Error Taxonomy: Four Reasons Machines Fail", "content": "**The Error Taxonomy: Four Reasons Machines Fail**\n\nIn your benchmark report, classify every error according to our four-part course taxonomy:\n\n\n1. **Historical Orthography (OOV):** Archaic spellings, contractions, or suffixes confused the model.\n\n2. **Boundary Truncation:** The model dropped honorific titles, prepositions, or surrounding words.\n\n3. **Type Confusion:** The model assigned the wrong category (e.g., tagging an organization as a place).\n\n4. **Toponym Blindness:** The model completely overlooked a regional or Indigenous place name missing from global training data.\n\nThis taxonomy proves that you understand *why* the tool failed, not just that it produced a wrong answer.\n\n**Vocabulary.** *Error Taxonomy* — A structured classification system that groups mistakes by their underlying technical causes. *Toponym Blindness* — The total failure of an algorithm to recognize a geographic name.\n\n**Takeaway:** Grouping errors into our four-part taxonomy explains the technical and linguistic causes behind machine failures.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: The Error Taxonomy: Four Reasons Machines Fail", "questiontext": "<p>What are the four categories in our course error taxonomy for automated NER?</p>", "generalfeedback": "<p>Our error taxonomy diagnoses failures across OOV orthography, boundary errors, type confusion, and contextual ambiguity.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Out-of-Vocabulary (OOV) Orthography, Boundary Errors, Entity Type Confusion, and Contextual Ambiguity / Polysemy.</p>", "feedback": "<p>Correct. Our course taxonomy classifies errors into OOV orthography, boundary slips, type confusion, and contextual ambiguity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Hardware Overheating, Low Battery, Bad Monitor, and Broken Mouse.</p>", "feedback": "<p>Incorrect. These are hardware maintenance issues, not linguistic error classes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Syntax Errors, Indentation Errors, Memory Errors, and Type Errors.</p>", "feedback": "<p>Incorrect. These are generic Python programming runtime errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Breakfast, Lunch, Dinner, and Dessert.</p>", "feedback": "<p>Incorrect. These are daily meals, not computational error categories.</p>"}]}}, {"step": 28, "title": "Refining the Pipeline: Adding Custom Rules to Boost Recall", "content": "**Refining the Pipeline: Adding Custom Rules to Boost Recall**\n\nBefore finalizing your benchmark, you can test how much custom rules improve performance.\n\nIn your Python script, add an `EntityRuler` containing three or four project-specific patterns. Add patterns for your document's primary historical figures and Indigenous place names.\n\nRerun your pipeline and recompute your scores. You will watch your Recall jump from 70% to 90% or higher. Documenting this performance boost shows how human editorial rules rescue general-purpose computer models.\n\n**Vocabulary.** *Performance Boost* — A measurable increase in accuracy achieved by tuning an algorithm or adding custom rules. *Hybrid Pipeline* — A computational pipeline that combines human-authored rules with machine-learned statistical models.\n\n**Takeaway:** Adding custom patterns via EntityRuler rescues missing entities and demonstrates the power of hybrid workflows.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Refining the Pipeline: Adding Custom Rules to Boost Recall", "questiontext": "<p>How can an editor demonstrate pipeline improvement in `NER_BENCHMARK.md`?</p>", "generalfeedback": "<p>Iterative pipeline refinement demonstrates how targeted rules improve recall and overall F1 performance.</p>", "answers": [{"fraction": 100.0, "is_correct":
