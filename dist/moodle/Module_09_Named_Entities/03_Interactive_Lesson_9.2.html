 true, "text": "<p>By running a post-rule benchmark using EntityRuler or custom gazetteers and showing a measurable increase in Recall and F1-score.</p>", "feedback": "<p>Correct. Demonstrating iterative improvement via targeted custom rules shows scientific mastery and pipeline control.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By manually deleting all difficult sentences from the test corpus.</p>", "feedback": "<p>Incorrect. Altering the test corpus to artificially inflate scores violates scientific integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By claiming 100% accuracy without providing any supporting data.</p>", "feedback": "<p>Incorrect. Scholarly claims must be backed by empirical evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By copying another student's test scores into your report.</p>", "feedback": "<p>Incorrect. Academic honesty requires reporting your own experimental data.</p>"}]}}, {"step": 29, "title": "Preparing for Friday's AI Synthesis Test", "content": "**Preparing for Friday's AI Synthesis Test**\n\nToday's deterministic experiments provide the essential middle tier of our three-step comparative cycle.\n\nOn Tuesday, you established manual ground truth. Today, you tested deterministic natural language processing models, observing their speed, rigidity, and predictable blind spots.\n\nOn Friday, in Lesson 9.3, you will test large language model artificial intelligence prompts on this exact same passage. You will compare human close reading, statistical sequence taggers, and generative AI in a comprehensive three-way audit.\n\n**Vocabulary.** *Three-Step Cycle* — The course's core method: comparing manual baseline, deterministic automation, and AI models on the same text. *Three-Way Audit* — A comprehensive comparison evaluating the strengths and weaknesses of three distinct editorial methods.\n\n**Takeaway:** Today's deterministic benchmark establishes the middle comparison tier for Friday's three-way audit with generative AI.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Preparing for Friday's AI Synthesis Test", "questiontext": "<p>Why is understanding SpaCy's deterministic errors vital before testing Large Language Models in Friday's lab?</p>", "generalfeedback": "<p>Benchmarking deterministic taggers establishes the necessary baseline for evaluating generative LLM performance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It establishes a clear middle-tier performance baseline, allowing scholars to evaluate whether generative AI solves or exacerbates specific failure modes.</p>", "feedback": "<p>Correct. Benchmarking deterministic models provides the empirical reference needed to evaluate LLM strengths and hallucination risks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because LLMs refuse to run unless a SpaCy model has run within the previous twenty-four hours.</p>", "feedback": "<p>Incorrect. LLMs run independently of SpaCy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because SpaCy is an artificial intelligence model that writes poetry.</p>", "feedback": "<p>Incorrect. SpaCy is a deterministic and statistical sequence processing library.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because generative AI models cannot read English or French words.</p>", "feedback": "<p>Incorrect. Generative LLMs excel at multilingual textual understanding.</p>"}]}}, {"step": 30, "title": "The Stage Gate: Committing Your Benchmark and Pipeline", "content": "**The Stage Gate: Committing Your Benchmark and Pipeline**\n\nYou have reached the stage gate for Step 2 of Module 9. Today, you moved from manual cataloguing to automated algorithmic processing.\n\nYou authored a Python NER script, processed your 20-entity excerpt, exported `ner_baseline.xml`, and conducted a side-by-side diff in VS Code. You computed exact precision and recall scores and diagnosed every error in `NER_BENCHMARK.md`.\n\nStage and commit all four files to your git repository:\n```bash\ngit add ner_pipeline.py ner_baseline.xml NER_BENCHMARK.md\ngit commit -m \"Week 9 Step 2: deterministic NER pipeline and benchmark audit\"\n```\n\nVerify that your working tree on `main` is clean. On Friday, we bring generative artificial intelligence into our workflow to complete our three-way synthesis.\n\n**Vocabulary.** *Stage Gate Commit* — A verified git commit that locks in project deliverables before beginning the next phase. *Clean Working Tree* — A git status showing that all changes are committed and no untracked files remain.\n\n**Takeaway:** Committing your pipeline script, baseline XML, and benchmark report completes Step 2 and prepares your repository for Friday's AI audit.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: The Stage Gate: Committing Your Benchmark and Pipeline", "questiontext": "<p>What artifacts must be committed to git to complete the Module 9 Step 2 stage gate?</p>", "generalfeedback": "<p>Committing your automated baseline, tagging pipeline, and benchmark report secures Step 2 of Module 9.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>`ner_baseline.xml`, the Python tagging script, and the completed `NER_BENCHMARK.md` report.</p>", "feedback": "<p>Correct. Committing the baseline XML, execution code, and markdown benchmark locks in your automated testing tier.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A full copy of your computer's operating system kernel.</p>", "feedback": "<p>Incorrect. Operating systems are not committed to project repositories.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only an empty text file named 'done.txt'.</p>", "feedback": "<p>Incorrect. Stage gates require complete analytical deliverables.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A screenshot of your desktop wallpaper.</p>", "feedback": "<p>Incorrect. Project repositories track research code, data, and analytical reports.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
