", "content": "**Hand-Authoring ground_truth_entities_manual.xml**\n\nOnce your twenty entities are verified in your table, you will encode them into a TEI XML document named `ground_truth_entities_manual.xml`.\n\nThis file contains the continuous diplomatic transcription of your excerpt, with each entity wrapped in its appropriate tag. Every tag must include a unique `xml:id` and an authoritative `@ref` attribute.\n\nExamine this clean model fragment:\n```xml\n<p>\n  At <placeName xml:id=\"ent-01\" ref=\"geonames:6324729\">Halifax</placeName>,\n  concluded with <persName xml:id=\"ent-02\" ref=\"dcb:cope_jean_baptiste\">Major \n  Jean Baptiste Cope</persName>, Chief Sachem of \n  <placeName xml:id=\"ent-03\" ref=\"geonames:6147610\">Chigabenakady</placeName>,\n  this <date xml:id=\"ent-04\" when=\"1752-11-22\">22d Day of November 1752</date>.\n</p>\n```\n\nNotice that commas and periods stay outside the tags. Keeping clean boundaries makes automated comparisons work smoothly on Wednesday.\n\n**Vocabulary.** *Diplomatic Wrapper* — Wrapping tags around words without altering surface spelling or punctuation. *Tag Boundary* — The precise starting and ending points of an XML element in a sentence.\n\n**Takeaway:** The manual XML file encodes your twenty verified entities in clean TEI markup with IDs and authority links.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Hand-Authoring ground_truth_entities_manual.xml", "questiontext": "<p>When authoring the manual ground-truth XML fragment, how should entity tags interact with word tokens?</p>", "generalfeedback": "<p>Hand-authored TEI fragments must preserve full text context and maintain well-formed XML token boundaries.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Entity tags must wrap complete word spans cleanly, respecting document hierarchy without crossing structural tags or dropping punctuation.</p>", "feedback": "<p>Correct. Valid XML demands well-formed nested structures with precise token boundary alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Entity tags must be inserted randomly into the middle of word syllables.</p>", "feedback": "<p>Incorrect. Splitting syllables with entity tags creates invalid tokens and destroys searchability.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All words that are not entities must be deleted from the XML file.</p>", "feedback": "<p>Incorrect. Full text context must be preserved for token alignment and reading.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Entity elements must be written in uppercase HTML rather than lowercase TEI.</p>", "feedback": "<p>Incorrect. TEI P5 elements are case-sensitive and must be written in lowercase.</p>"}]}}, {"step": 29, "title": "Validating Your Entity Markup in VS Code", "content": "**Validating Your Entity Markup in VS Code**\n\nBefore your manual ground truth can serve as an authoritative benchmark, it must pass schema validation in Visual Studio Code.\n\nIn Module 2, you set up the Red Hat XML and Scholarly XML extensions to validate files against RELAX NG schemas. Your `ground_truth_entities_manual.xml` file must validate to zero errors.\n\nWatch out for three common mistakes:\n\n1. **Misspelled Attributes:** Writing `href=` or `link=` instead of the TEI standard `ref=`.\n2. **Invalid Dates:** Writing `when=\"Nov 22 1752\"` instead of the required `when=\"1752-11-22\"`.\n3. **Overlapping Tags:** Putting an entity tag across paragraph or line boundaries incorrectly.\n\nOpen the Problems panel in VS Code (`Ctrl+Shift+M`) to confirm that your file shows zero errors.\n\n**Vocabulary.** *Schema Validation* — Checking that an XML file follows all the structural rules of a schema. *Problems Panel* — The VS Code view that displays syntax and schema errors.\n\n**Takeaway:** Schema validation confirms that your entity markup conforms strictly to TEI P5 guidelines with zero errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Validating Your Entity Markup in VS Code", "questiontext": "<p>Which tool in Visual Studio Code verifies that your TEI XML fragment conforms strictly to TEI P5 schema rules?</p>", "generalfeedback": "<p>Real-time TEI schema validation in VS Code catches malformed elements and invalid attributes immediately.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The XML Language Support extension (Red Hat), configured with the TEI P5 Relax NG schema.</p>", "feedback": "<p>Correct. Schema validation in VS Code flags syntax errors, invalid elements, and illegal attributes in real time.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Windows Media Player audio equalizer.</p>", "feedback": "<p>Incorrect. Media players play sound files; they do not validate XML schemas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Microsoft Excel spreadsheet spellchecker.</p>", "feedback": "<p>Incorrect. Excel is a spreadsheet tool, not an XML schema validator.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Google Chrome cookie settings panel.</p>", "feedback": "<p>Incorrect. Browser cookie settings manage web privacy, not TEI schema validation.</p>"}]}}, {"step": 30, "title": "The Stage Gate: Committing Your Manual Entity Baseline", "content": "**The Stage Gate: Committing Your Manual Entity Baseline**\n\nYou have reached the finish line for Step 1 of Module 9. Today, you established a rigorous manual baseline for historical named entities.\n\nYou documented your editorial rules in `ENTITY_POLICIES.md`. You researched twenty historical people, places, organizations, and dates in your project witness. You linked them to Wikidata, GeoNames, or your local header. You encoded them in schema-valid TEI XML.\n\nBefore leaving class today, stage and commit your deliverables to your git repository:\n```bash\ngit add ENTITY_POLICIES.md ground_truth_entities_manual.xml\ngit commit -m \"Week 9 Step 1: establish manual named entity ground truth and authority links\"\n```\n\nOn Wednesday, in Lesson 9.2, you will run an automated natural language processing tool over this same passage to measure how well computers identify historical entities.\n\n**Vocabulary.** *Stage Gate* — A required project milestone that must be completed and committed before moving forward. *Git Baseline* — A committed set of files used as the foundation for future testing.\n\n**Takeaway:** Committing your entity policy and manual XML completes Step 1 and sets up Wednesday's automated NER tests.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: The Stage Gate: Committing Your Manual Entity Baseline", "questiontext": "<p>Why is committing your manual entity files to git before running automated tools an essential scientific stage gate?</p>", "generalfeedback": "<p>Committing the manual baseline locks in an uncorrupted scientific gold standard before running automated algorithms.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It guarantees an immutable, version-controlled baseline that cannot be accidentally overwritten or biased by subsequent machine predictions.</p>", "feedback": "<p>Correct. Version control locks in the human gold standard before exposing it to automated experiments.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Git automatically rewrites and improves student code when committed.</p>", "feedback": "<p>Incorrect. Git records historical snapshots; it does not alter or improve human analysis.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because GitHub deletes repositories that do not commit files every two hours.</p>", "feedback": "<p>Incorrect. GitHub does not delete repositories based on hourly commit frequencies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because committing to Git instantly deploys the files to the national library.</p>", "feedback": "<p>Incorrect. Local commits record changes in the working tree without external publication.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
