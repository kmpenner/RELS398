    <script>
        const lessonData = {"course_title": "Manual Entity Identification, Authority Record Research, and Canonical Citation", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "Names Beyond Strings: Why Editions Need Entity Markup", "content": "**Names Beyond Strings: Why Editions Need Entity Markup**\n\nOver the past eight weeks, you built a real digital edition from the ground up. You catalogued your witness in a `teiHeader`. You linked high-resolution images with `<facsimile>`. You transcribed every line as written. In Module 6, you normalized historical spelling with `<choice>`. In Module 7, you created stylesheets for online reading. Last week, in Module 8, you added parts of speech and dictionary lemmas to your words.\n\nNow we take the next major step in digital textual editing: named entities. A computer sees text only as a sequence of letters and spaces. A search for the word *Paris* finds every instance of those five letters. But the computer does not know if *Paris* means the capital of France, a small town in Maine, or the mythological Trojan prince.\n\nNamed entity markup solves this problem. It identifies real-world people, geographic places, corporate organizations, and dates in your text. It links those mentions to global authority records. Today, you will establish this ground truth by hand for your own project witness.\n\n**Vocabulary.** *Named Entity* — A real-world person, place, group, or date mentioned in a text. *Entity Disambiguation* — Distinguishing between different people or places that share the same name.\n\n**Takeaway:** String searches find matching letters; entity markup reveals the actual people, places, groups, and dates behind those letters.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: Names Beyond Strings: Why Editions Need Entity Markup", "questiontext": "<p>Why is plain-text string searching inadequate for identifying historical entities in a digital scholarly edition?</p>", "generalfeedback": "<p>Entity markup connects variant historical names to stable real-world entities, overcoming the ambiguities of literal text strings.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A single historical entity can appear under multiple spelling variants, aliases, and titles, while identical strings can refer to completely different entities.</p>", "feedback": "<p>Correct. Plain strings cannot distinguish between different people sharing a name or gather variant historical spellings together without semantic entity markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Plain-text search algorithms are illegal under international copyright and manuscript preservation treaties.</p>", "feedback": "<p>Incorrect. Copyright law does not prohibit string searching in digital humanities software.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modern web browsers refuse to display documents that do not contain semantic XML markup.</p>", "feedback": "<p>Incorrect. Web browsers display plain text easily; entity markup serves research and semantic linking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Text search engines require supercomputers and cannot run on archival documents.</p>", "feedback": "<p>Incorrect. String searching is computationally simple and fast, but semantically blind.</p>"}]}}, {"step": 2, "title": "The Four Core Classes: People, Places, Organizations, and Dates", "content": "**The Four Core Classes: People, Places, Organizations, and Dates**\n\nIn digital humanities, entity recognition focuses on four main categories. Every historical document is shaped by these four classes of information.\n\nThe first class is **people** (`persName`). This includes authors, monarchs, scribes, soldiers, artists, and correspondents. The second class is **places** (`placeName`). This covers towns, rivers, provinces, roads, and natural features. The third class is **organizations** (`orgName`). This includes governments, parliaments, military regiments, churches, and committees. The fourth class is **dates** (`date`). This covers calendar days, months, years, and historical eras.\n\nSeparating these four classes requires human reading. Consider the word *Halifax* in Andromeda's 1752 Treaty. Does it mean the colonial town in Nova Scotia, the city in England, or Lord Halifax? The letters are identical. Only human context tells you that the treaty was signed in the coastal settlement of Halifax.\n\n**Vocabulary.** *Person Entity* — An individual human being named in a text. *Place Entity* — A physical geographic location. *Organization Entity* — A group, council, or formal institution. *Date Entity* — A specific point or span in time.\n\n**Takeaway:** The four core entity types in historical texts are people, places, organizations, and dates.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: The Four Core Classes: People, Places, Organizations, and Dates", "questiontext": "<p>What are the four primary entity classes standardized in digital humanities research?</p>", "generalfeedback": "<p>Digital entity markup models historical records through four core classes: persons, places, organizations, and dates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Persons, Places, Organizations, and Dates.</p>", "feedback": "<p>Correct. Digital humanities and computational linguistics focus on these four foundational categories to map historical actors, geography, institutions, and chronologies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Fonts, Margins, Bookbindings, and Paper Sizes.</p>", "feedback": "<p>Incorrect. These are physical and typographic layout features, not semantic named entities.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Verbs, Adjectives, Adverbs, and Conjunctions.</p>", "feedback": "<p>Incorrect. These are grammatical parts of speech, not named entity classes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manuscripts, Microfilms, Hard Drives, and Flash Drives.</p>", "feedback": "<p>Incorrect. These are physical and digital storage media, not entity classes.</p>"}]}}, {"step": 3, "title": "TEI P5 Chapter 13: The Four Core Elements", "content": "**TEI P5 Chapter 13: The Four Core Elements**\n\nThe Text Encoding Initiative gives us standard XML tags for names and dates in Chapter 13 of the Guidelines. These tags preserve your transcript while labeling what each name means.\n\nTo tag a person, wrap their name in `<persName>`. To tag a place, use `<placeName>`. For an organization, use `<orgName>`. For a date or time expression, use `<date>`.\n\nLook at how these elements appear in practice:\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Entity Class</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">TEI Tag</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Historical Example</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">What It Marks</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Person</td>\n      <td style=\"padding: 0.5rem;\"><code>&lt;persName&gt;</code></td>\n      <td style=\"padding: 0.5rem;\">Major Jean Baptiste Cope</td>\n      <td style=\"padding: 0.5rem;\">A real human individual</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Place</td>\n      <td style=\"padding: 0.5rem;\"><code>&lt;placeName&gt;</code></td>\n      <td style=\"padding: 0.5rem;\">Chigabenakady</td>\n      <td style=\"padding: 0.5rem;\">A geographic site or territory</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Organization</td>\n      <td style=\"padding: 0.5rem;\"><code>&lt;orgName&gt;</code></td>\n      <td style=\"padding: 0.5rem;\">Assemblée nationale</td>\n      <td style=\"padding: 0.5rem;\">A formal group or assembly</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">Date</td>\n      <td style=\"padding: 0.5rem;\"><code>&lt;date&gt;</code></td>\n      <td style=\"padding: 0.5rem;\">22 Novembre 1752</td>\n      <td style=\"padding: 0.5rem;\">A calendar point in time</td>\n    </tr>\n  </tbody>\n</table>\n\nThese tags leave the ink on the page unchanged. They simply add a digital wrapper that explains what the name is.\n\n**Vocabulary.** *TEI Chapter 13* — The section of the TEI Guidelines that governs names, dates, people, and places. *Element Wrapper* — An XML tag placed around historical words without changing their spelling.\n\n**Takeaway:** TEI P5 provides four primary tags—persName, placeName, orgName, and date—to identify historical entities.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: TEI P5 Chapter 13: The Four Core Elements", "questiontext": "<p>Which set of XML elements from TEI P5 Chapter 13 encodes the four core entity classes?</p>", "generalfeedback": "<p>TEI Chapter 13 provides specialized elements: <persName>, <placeName>, <orgName>, and <date> for tagging named entities in text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<persName>, <placeName>, <orgName>, and <date>", "feedback": "<p>Correct. TEI P5 Chapter 13 defines <persName> for people, <placeName> for places, <orgName> for institutions, and <date> for chronological points.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<person>, <place>, <organization>, and <calendar>", "feedback": "<p>Incorrect. <person> and <place> describe entity definitions in the header, while <persName>, <placeName>, <orgName>, and <date> tag inline mentions in body text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<name type=\"person\">, <location>, <corp>, and <time>", "feedback": "<p>Incorrect. While generic <name> exists, Chapter 13 standardizes specialized tags <persName>, <placeName>, and <orgName>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<who>, <where>, <group>, and <when>", "feedback": "<p>Incorrect. These are not standard TEI P5 tags for named entities.</p>"}]}}, {"step": 4, "title": "Names with Internal Parts: Surnames, Forenames, and Titles", "content": "**Names with Internal Parts: Surnames, Forenames, and Titles**\n\nHistorical names often contain multiple parts. Scribes combine official titles, first names, family surnames, and nicknames in a single phrase.\n\nTEI allows you to break down a name into smaller pieces inside the `<persName>` tag. You can tag a first name with `<forename>`. You can tag a family name with `<surname>`. You can mark an official office or military rank with `<roleName>`.\n\nLook at the signature in the 1752 Treaty: *Major Jean Baptiste Cope*. In basic markup, you can tag the whole string as `<persName>`. In detailed markup, you can tag *Major* as `<roleName>`, *Jean Baptiste* as `<forename>`, and *Cope* as `<surname>`. This helps future scholars search for all military officers or sort people by family name without confusing titles with personal names.\n\n**Vocabulary.** *Forename* — A given first or middle name. *Surname* — A family or clan name. *Role Name* — An official title, military rank, or social office.\n\n**Takeaway:** Detailed tags like forename, surname, and roleName let you break historical names into clear grammatical parts.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Names with Internal Parts: Surnames, Forenames, and Titles", "questiontext": "<p>How does TEI allow editors to break down complex personal names into structured subcomponents?</p>", "generalfeedback": "<p>Subcomponents like <forename>, <surname>, and <roleName> provide granular structure within parent <persName> tags.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By nesting <forename>, <surname>, <roleName>, or <addName> inside a parent <persName> element.</p>", "feedback": "<p>Correct. Naming subcomponents like forenames, surnames, and titles can be granularly tagged inside <persName>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By separating the names with semicolons and storing them in an external CSV spreadsheet.</p>", "feedback": "<p>Incorrect. TEI embeds structured subcomponents hierarchically within XML elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By converting the entire personal name into capital letters and removing all vowels.</p>", "feedback": "<p>Incorrect. TEI preserves historical spellings and casing rather than modifying the surface text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By restricting personal names to exactly two words per individual.</p>", "feedback": "<p>Incorrect. TEI places no arbitrary word count limits on personal names.</p>"}]}}, {"step": 5, "title": "Places with Layers: Towns, Counties, and Countries", "content": "**Places with Layers: Towns, Counties, and Countries**\n\nGeographic locations also appear in layers. An address or travel record often moves from a specific building or town to a larger district, province, and nation.\n\nTEI represents these spatial layers using child elements inside `<placeName>`. You can tag a village or city with `<settlement>`. You can tag a county or province with `<region>`. You can tag an entire sovereign realm with `<country>`.\n\nWhen Maud Lewis writes from *Marshalltown, Digby County, Nova Scotia*, she names three geographic layers. Marshalltown is a `<settlement>`. Digby County is a `<region type=\"county\">`. Nova Scotia is a `<region type=\"province\">`. This keeps your digital map accurate and prevents software from mistaking a tiny village for a whole region.\n\n**Vocabulary.** *Settlement* — A town, village, or city. *Region* — A county, state, province, or district. *Country* — A sovereign nation or land.\n\n**Takeaway:** Nested place tags like settlement and region preserve the spatial layers of historical geography.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Places with Layers: Towns, Counties, and Countries", "questiontext": "<p>Which TEI child elements allow editors to capture hierarchical geographic information inside <placeName>?</p>", "generalfeedback": "<p>Hierarchical places are cleanly modeled in TEI using <settlement>, <district>, <region>, and <country> inside <placeName>.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<settlement>, <district>, <region>, and <country>", "feedback": "<p>Correct. TEI provides geographic hierarchy elements like <settlement> (town/city), <district> (county), <region> (province/state), and <country>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<street>, <postalCode>, <apartmentNumber>, and <floor>", "feedback": "<p>Incorrect. While postal address elements exist in TEI for modern mail, historical geography uses settlement, district, region, and country.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<latitude>, <longitude>, <altitude>, and <satellite>", "feedback": "<p>Incorrect. Coordinates are recorded using <geo>, not XML element wrappers around text tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<forest>, <river>, <mountain>, and <valley>", "feedback": "<p>Incorrect. Specific landforms use <geogName> or feature typing rather than standard administrative hierarchy tags.</p>"}]}}, {"step": 6, "title": "Time on the Page: The Essential @when Attribute", "content": "**Time on the Page: The Essential @when Attribute**\n\nDates in historical documents look very different from modern calendar entries. Scribes write dates in words, Latin phrases, or regnal years. A clerk might write *the twenty-second Day of November in the twenty-sixth Year of the Reign of King George*.\n\nA search engine looking for the year 1752 will miss that phrase unless you help it. TEI solves this with the `@when` attribute on the `<date>` tag.\n\nThe text inside the tag keeps the scribe's exact words: `<date when=\"1752-11-22\">the twenty-second Day of November</date>`. The `@when` attribute holds the standardized date in ISO 8601 format (`YYYY-MM-DD`). This lets computers sort, filter, and timeline historical events while keeping the original manuscript ink visible.\n\n**Vocabulary.** *ISO 8601* — The international standard format for dates (YYYY-MM-DD). *The @when Attribute* — The TEI attribute that stores a normalized computer-readable date.\n\n**Takeaway:** The when attribute normalizes historical dates into YYYY-MM-DD format while preserving original manuscript phrasing.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Time on the Page: The Essential @when Attribute", "questiontext": "<p>Why is the @when attribute essential when tagging historical dates with the <date> element?</p>", "generalfeedback": "<p>The @when attribute supplies machine-readable ISO 8601 dates (YYYY-MM-DD) for historical temporal expressions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It normalizes ambiguous, non-standard, or archaic scribal phrasing into machine-readable ISO 8601 standard dates (YYYY-MM-DD).</p>", "feedback": "<p>Correct. The @when attribute records the normalized date (e.g. @when=\"1791-08-25\") while preserving the original historical text inside the element.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces web browsers to reload the web page at a specific time of day.</p>", "feedback": "<p>Incorrect. The @when attribute is an analytical data attribute, not a browser timer.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the scribe's original historical wording from the digital edition.</p>", "feedback": "<p>Incorrect. TEI preserves the historical surface text inside the <date> element unchanged.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It calculates the exact monetary cost of transcribing the historical document.</p>", "feedback": "<p>Incorrect. The @when attribute handles temporal data normalization, not project finances.</p>"}]}}, {"step": 7, "title": "When Capital Letters Lie: Scribes and Common Nouns", "content": "**When Capital Letters Lie: Scribes and Common Nouns**\n\nIn modern English, we capitalize proper names and lowercase common nouns. In eighteenth-century manuscripts, scribes did not follow this rule.\n\nIn the 1752 Treaty and the 1791 French decree, scribes capitalized common nouns for emphasis or elegance. Words like *Treaty*, *Governor*, *Assembly*, *Law*, and *Peace* often begin with capital letters. A computer might guess that every capitalized word is a proper name.\n\nA human editor knows better. Capital letters alone do not make a word a named entity. You must ask whether the word refers to an individual person, a real geographic site, or a formal legal body. Human judgment separates scribe habits from true historical entities.\n\n**Vocabulary.** *Proper Noun* — A specific name for a person, place, or thing. *Common Noun* — A general word for a class of items or ideas. *Capitalization Drift* — Scribe habits of capitalizing ordinary words for decoration or emphasis.\n\n**Takeaway:** Historical scribes capitalized common nouns frequently; editors must look beyond capital letters to find real entities.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: When Capital Letters Lie: Scribes and Common Nouns", "questiontext": "<p>Why can an editor not rely solely on capitalization to identify proper named entities in eighteenth-century texts?</p>", "generalfeedback": "<p>Capitalization in early modern documents reflects rhetorical emphasis and stylistic convention, not named entity status.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Eighteenth-century scribes and printers frequently capitalized common nouns for emphasis, while some lowercase words are proper names.</p>", "feedback": "<p>Correct. Historical orthography routinely capitalized ordinary nouns like 'Treaty', 'Peace', or 'Gold', so capitalization does not guarantee a proper entity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Eighteenth-century printing presses did not possess capital letter blocks.</p>", "feedback": "<p>Incorrect. Movable type printing presses included full uppercase type cases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scribes only capitalized words when writing in secret diplomatic code.</p>", "feedback": "<p>Incorrect. Capitalization of common nouns was standard orthographic convention in eighteenth-century English.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Capital letters were wiped from manuscripts during modern museum conservation.</p>", "feedback": "<p>Incorrect. Conservation stabilizes paper and ink; it does not erase letter casing.</p>"}]}}, {"step": 8, "title": "Why Text Strings Fail: Connecting Names to Real Things", "content": "**Why Text Strings Fail: Connecting Names to Real Things**\n\nText strings are slippery. A single historical figure can appear under half a dozen different names in the same archive.\n\nIn Revolutionary France, the king might be called *Louis XVI*, *Louis Seize*, *le Roi*, or *Citoyen Capet*. In British records, Governor Hopson might be called *Peregrine Thomas Hopson*, *Governor Hopson*, or *His Excellency*. A computer reading plain text sees four different people.\n\nAuthority control solves this problem. It links all those different names to a single, permanent record in an authority database. Instead of treating names as isolated text strings, authority control connects them to real historical entities.\n\n**Vocabulary.** *Authority Control* — Linking different names and spelling variants to a single official record. *Identifier* — A unique code or web address that stands for one specific entity.\n\n**Takeaway:** Authority control connects multiple name variants across documents to a single permanent identity.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Why Text Strings Fail: Connecting Names to Real Things", "questiontext": "<p>What fundamental problem arises when two historical individuals in a corpus share the exact same name string?</p>", "generalfeedback": "<p>Disambiguating identical name strings requires linking them to unique entity records rather than matching raw text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>String identity causes polysemy or entity confusion, merging two distinct historical biographies into a single query result.</p>", "feedback": "<p>Correct. Two people with the same name string must be disambiguated through unique entity identifiers to prevent conflation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The operating system halts and throws a memory allocation error.</p>", "feedback": "<p>Incorrect. Computers have no problem storing identical text strings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The XML parser automatically deletes one of the two names from the document.</p>", "feedback": "<p>Incorrect. XML parsers do not delete content due to shared names.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Both individuals are automatically merged into a single person in real historical records.</p>", "feedback": "<p>Incorrect. The people remain historically distinct; failure to disambiguate is an editorial error.</p>"}]}}, {"step": 9, "title": "Three Global Registries: Wikidata, VIAF, and GeoNames", "content": "**Three Global Registries: Wikidata, VIAF, and GeoNames**\n\nDigital scholars rely on three main open authority registries to link their documents to the wider world.\n\nFirst, **Wikidata** is an open knowledge database run by the Wikimedia Foundation. Every person, place, and event gets a unique Q-number. For example, Maud Lewis is `Q1479154`. King Louis XVI is `Q7732`.\n\nSecond, **VIAF** (the Virtual International Authority File) combines authority lists from national libraries across the world. It assigns a single number that clusters library records for an author or historical figure.\n\nThird, **GeoNames** is the world's standard geographic database. It provides coordinates, administrative codes, and variant names for millions of places. For example, Halifax, Nova Scotia, is GeoNames `6324729`.\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Registry</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">What It Covers</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Identifier Format</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Wikidata</td>\n      <td style=\"padding: 0.5rem;\">People, things, groups, events</td>\n      <td style=\"padding: 0.5rem;\"><code>Q[0-9]+</code></td>\n      <td style=\"padding: 0.5rem;\">Q1479154 (Maud Lewis)</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">VIAF</td>\n      <td style=\"padding: 0.5rem;\">Library authority files</td>\n      <td style=\"padding: 0.5rem;\"><code>viaf:[0-9]+</code></td>\n      <td style=\"padding: 0.5rem;\">viaf:84035444 (Louis XVI)</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">GeoNames</td>\n      <td style=\"padding: 0.5rem;\">Geographic places and features</td>\n      <td style=\"padding: 0.5rem;\"><code>geonames:[0-9]+</code></td>\n      <td style=\"padding: 0.5rem;\">geonames:6324729 (Halifax)</td>\n    </tr>\n  </tbody>\n</table>\n\n**Vocabulary.** *Wikidata* — A free, multilingual knowledge graph of people, concepts, and places. *VIAF* — A global registry combining national library authority files. *GeoNames* — A global database of geographic names and coordinates.\n\n**Takeaway:** Wikidata, VIAF, and GeoNames are the primary public databases used to identify people, libraries, and places.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Three Global Registries: Wikidata, VIAF, and GeoNames", "questiontext": "<p>What are the primary target domains for Wikidata, VIAF, and GeoNames respectively?</p>", "generalfeedback": "<p>Wikidata, VIAF, and GeoNames serve as foundational global registries for linked open entity data.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Wikidata covers structured general entities, VIAF aggregates library authority records for persons/orgs, and GeoNames standardizes global geographical places.</p>", "feedback": "<p>Correct. Wikidata provides structured semantic web items (Q-numbers), VIAF unites international library authorities, and GeoNames identifies spatial places.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Wikidata registers medical patents, VIAF indexes legal deeds, and GeoNames lists real estate prices.</p>", "feedback": "<p>Incorrect. These registries are open scholarly authorities for general knowledge, library catalogues, and geography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Wikidata tracks computer hardware, VIAF monitors internet routers, and GeoNames stores astronomy star maps.</p>", "feedback": "<p>Incorrect. None of these registries are computer hardware or astronomy registries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Wikidata, VIAF, and GeoNames are identical copies of Wikipedia with no structural differences.</p>", "feedback": "<p>Incorrect. Each registry has a distinct architecture, identifier schema, and authority scope.</p>"}]}}, {"step": 10, "title": "The TEI @ref Attribute: Building the Linked Data Bridge", "content": "**The TEI @ref Attribute: Building the Linked Data Bridge**\n\nIn TEI XML, you link an entity to an authority database using the `@ref` attribute. The `@ref` attribute holds the web address (URI) or identifier of the official record.\n\nLook at how the attribute attaches to a name tag:\n```xml\n<persName ref=\"https://www.wikidata.org/wiki/Q1479154\">Maud Lewis</persName>\n```\n\nThe text between the opening and closing tags remains the exact manuscript wording. The `@ref` attribute builds the bridge to the global web of data.\n\nWhen another scholar searches your edition, their software can follow the `@ref` link to learn Maud Lewis's birth year, artistic style, and museum holdings. You can also write shorter forms like `ref=\"wikidata:Q1479154\"` if you define the prefix in your header.\n\n**Vocabulary.** *The @ref Attribute* — The TEI attribute that points to an external authority record or local identifier. *Linked Data* — A method of publishing structured data so that digital documents can link to one another.\n\n**Takeaway:** The TEI ref attribute embeds authority links into names, connecting local editions to global research networks.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: The TEI @ref Attribute: Building the Linked Data Bridge", "questiontext": "<p>How does an editor connect a TEI entity element to an external authority file like Wikidata or GeoNames?</p>", "generalfeedback": "<p>The @ref attribute bridges TEI elements to global Linked Open Data registries through canonical URIs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By placing the canonical Uniform Resource Identifier (URI) or prefixed identifier in the @ref attribute of the entity element.</p>", "feedback": "<p>Correct. The @ref attribute stores canonical URIs (e.g. @ref=\"https://www.wikidata.org/wiki/Q38\" or @ref=\"wikidata:Q38\").</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By typing a footnote at the very bottom of the printed page.</p>", "feedback": "<p>Incorrect. Footnotes provide human prose, whereas @ref creates machine-actionable Linked Data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By embedding an executable Python script inside the XML text node.</p>", "feedback": "<p>Incorrect. TEI XML documents do not execute inline Python scripts inside text nodes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By creating a new internet domain name for every historical person.</p>", "feedback": "<p>Incorrect. Editors link to existing authority registries via established URIs.</p>"}]}}, {"step": 11, "title": "Local and Regional Registers: Canadian and Indigenous Databases", "content": "**Local and Regional Registers: Canadian and Indigenous Databases**\n\nGlobal databases like Wikidata and VIAF are immense, but they have major blind spots. They focus heavily on famous European rulers, published writers, and large cities. They often overlook regional Canadian artists, local historical figures, and Indigenous communities.\n\nWhen you edit regional manuscripts, specialized databases provide far better information. For Canadian figures, the **Dictionary of Canadian Biography (DCB)** gives peer-reviewed historical profiles. The **Canadian Heritage Information Network (CHIN)** catalogues Canadian artists and museum collections.\n\nFor Indigenous places and treaties, **Native Land Digital** maps ancestral territories and treaties. Relying only on colonial databases can erase Indigenous heritage. Always look for authority records that respect the local history of your document.\n\n**Vocabulary.** *Regional Authority* — A specialized database focused on national or local historical figures. *Dictionary of Canadian Biography* — The premier scholarly biographical dictionary for Canadian history. *Native Land Digital* — An Indigenous-led platform mapping ancestral territories and languages.\n\n**Takeaway:** Specialized regional databases provide essential authority records where global databases fall short.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Local and Regional Registers: Canadian and Indigenous Databases", "questiontext": "<p>Why must editors of Canadian historical documents consult national and regional registries like the Dictionary of Canadian Biography (DCB) alongside global databases?</p>", "generalfeedback": "<p>Regional databases like DCB, Native Land Digital, and local archives provide critical depth missing from global registries.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Global registries like Wikidata have systemic representation gaps regarding regional Canadian historical figures and Indigenous leadership.</p>", "feedback": "<p>Correct. Regional and specialized repositories contain rich biographical and historical evidence omitted from broad global databases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Canadian law forbids referencing non-Canadian databases in university publications.</p>", "feedback": "<p>Incorrect. There is no legal restriction against using international databases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>International databases like Wikidata charge high licensing fees for Canadian users.</p>", "feedback": "<p>Incorrect. Wikidata and VIAF are free and open-access public resources.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Canadian historical figures were legally forbidden from having international records.</p>", "feedback": "<p>Incorrect. Many prominent figures appear internationally, but regional figures are often omitted.</p>"}]}}, {"step": 12, "title": "The Verified Absence Rule: When a Person Has No Record", "content": "**The Verified Absence Rule: When a Person Has No Record**\n\nWhat happens when you research a person in your document and find no record in Wikidata, VIAF, or any national archive?\n\nMany beginners panic and attach an unrelated person who shares the same name. Other beginners leave the name untagged. Both choices damage scholarship. Forcing a fake match introduces false data into the historical record.\n\nIn our course, you follow the **Verified Absence Rule**. If you search the relevant archives and prove that no record exists, that verified absence earns full credit. Document the registries you searched and state clearly that the person is unindexed. Proving that an archive overlooked an ordinary person is an important historical finding.\n\n**Vocabulary.** *Verified Absence* — Documenting that an entity does not exist in standard authority databases after a thorough search. *False Match* — Forcing a name to link to an unrelated person who shares a similar spelling.\n\n**Takeaway:** Proving and documenting that a person lacks an authority record earns full credit; never force-fit an incorrect link.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: The Verified Absence Rule: When a Person Has No Record", "questiontext": "<p>Under our course editorial rules, what must an editor do when a historical person cannot be found in Wikidata, VIAF, or regional authority files?</p>", "generalfeedback": "<p>The Verified Absence rule requires explicit documentation and local ID minting when no external record exists.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Document a Verified Absence by citing the searched registries, recording search dates, and creating a local project identifier.</p>", "feedback": "<p>Correct. If an exhaustive search reveals no record, editors document the verified absence and mint a local URI (e.g. #person-001) rather than guessing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Invent a plausible-sounding fictional URI and pretend the record exists.</p>", "feedback": "<p>Incorrect. Inventing fake URIs corrupts scholarly linked open data integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the person from the historical transcript to maintain database compliance.</p>", "feedback": "<p>Incorrect. Editors never alter or delete historical witnesses to satisfy database requirements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Halt the entire digital edition project permanently until an external record appears.</p>", "feedback": "<p>Incorrect. Scholarly workflows document verified absences locally and proceed.</p>"}]}}, {"step": 13, "title": "Building Your Own Directory: <particDesc> in the Header", "content": "**Building Your Own Directory: <particDesc> in the Header**\n\nWhen people in your document lack public records in Wikidata, where do you store their biographical information?\n\nTEI solves this by letting you build your own biographical directory inside the `teiHeader`. The element is called `<particDesc>` (participation description). It lives inside the `<profileDesc>` section of the header.\n\nInside `<particDesc>`, you add a `<person>` element for each individual and give them an internal ID, like `xml:id=\"person-kinnear\"`. You record their birth date, occupation, and role in your text. In your transcript, your tag points to this internal ID: `<persName ref=\"#person-kinnear\">Mr. Kinnear</persName>`. This keeps your edition complete and self-contained.\n\n**Vocabulary.** *particDesc* — The TEI header element that houses a local directory of people mentioned in a document. *Local ID* — An internal xml:id used to link mentions in the text to descriptions in the header.\n\n**Takeaway:** The particDesc element in the header lets you create a local biographical directory for people without external records.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Building Your Own Directory: <particDesc> in the Header", "questiontext": "<p>Where in a TEI document does an editor define a structured local directory of historical participants and persons?</p>", "generalfeedback": "<p>Local biographical prosopography is formally housed within <profileDesc>/<particDesc> in the TEI Header.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>In the <teiHeader> inside <profileDesc> within the <particDesc> element.</p>", "feedback": "<p>Correct. The <particDesc> (participation description) element in <profileDesc> holds local <person> and <org> biographical records.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In the <body> inside the very first <p> paragraph.</p>", "feedback": "<p>Incorrect. The body contains the primary text, while metadata directories belong in <teiHeader>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In an external invisible text file saved on the desktop.</p>", "feedback": "<p>Incorrect. Self-contained TEI editions house local prosopographies within <teiHeader>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In the <revisionDesc> change logs at the end of the header.</p>", "feedback": "<p>Incorrect. <revisionDesc> logs editorial changes, not biographical entity directories.</p>"}]}}, {"step": 14, "title": "Building Your Own Map: <settingDesc> in the Header", "content": "**Building Your Own Map: <settingDesc> in the Header**\n\nJust as you create a local directory of people in `<particDesc>`, you can create a local gazetteer of places in `<settingDesc>`.\n\nHistorical letters and treaties often mention local creeks, family farms, or Indigenous trails that do not appear in GeoNames. Forcing a local path into a modern city record distorts geography.\n\nInside `<settingDesc>`, you add a `<place>` element with a unique `xml:id`, historical notes, and geographic coordinates if known. In your transcript, you point your place tag to your local record: `<placeName ref=\"#place-marshalltown\">Marshalltown</placeName>`. This allows your edition to record local geography with complete historical integrity.\n\n**Vocabulary.** *settingDesc* — The TEI header element that houses a local gazetteer of places. *Local Gazetteer* — A project-specific list of place names and geographic notes.\n\n**Takeaway:** The settingDesc element in the header houses a local gazetteer for historical places missing from modern databases.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Building Your Own Map: <settingDesc> in the Header", "questiontext": "<p>Which TEI Header element provides a local gazetteer of geographical places mentioned in the text?</p>", "generalfeedback": "<p>The <settingDesc> container in <profileDesc> defines local places, historical names, and geographic coordinates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<settingDesc>, containing <listPlace> and individual <place> entries.", "feedback": "<p>Correct. Inside <profileDesc>, the <settingDesc> element houses <listPlace> with structured <place> definitions and coordinates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<mapContainer>, containing <gpsCoordinate> elements.", "feedback": "<p>Incorrect. <mapContainer> is not a valid TEI P5 element.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<fileDesc>, containing <titleStmt> sub-elements.", "feedback": "<p>Incorrect. <fileDesc> records bibliographic metadata about the digital file.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<layoutDesc>, containing line and column counts.", "feedback": "<p>Incorrect. <layoutDesc> records codicological page layout, not geographic settings.</p>"}]}}, {"step": 15, "title": "Case Study 1: Political Entities in Ace's 1791 French Decree", "content": "**Case Study 1: Political Entities in Ace's 1791 French Decree**\n\nLet us look at the entities in Ace's 1791 French Revolutionary decree from the *Comité des décrets* (British Library Zweig MS 169). This document was produced during a dramatic political shift: the creation of a constitutional monarchy in France.\n\nAce's text contains powerful political bodies. The primary group is the `<orgName ref=\"wikidata:Q876424\">l'Assemblée nationale</orgName>` (the National Assembly). The document also mentions the `<orgName>Comité des décrets</orgName>`, the legislative committee that verified and printed parliamentary decrees.\n\nPersonal names include the constitutional king, `<persName ref=\"wikidata:Q7732\">Louis XVI</persName>`, and administrative signers like `<persName>Dejoly</persName>`. The place of issue is `<placeName ref=\"geonames:2988507\">Paris</placeName>`. Identifying these entities requires understanding the French state in the summer of 1791.\n\n**Vocabulary.** *National Assembly* — The revolutionary parliamentary body of France from 1789 to 1791. *Constitutional Monarchy* — A system where a monarch rules alongside an elected parliament under a constitution.\n\n**Takeaway:** Ace's 1791 French decree features formal revolutionary assemblies, royal figures, and administrative signers in Paris.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Case Study 1: Political Entities in Ace's 1791 French Decree", "questiontext": "<p>In Ace's 1791 French Revolutionary decree, which entity class best categorizes the 'Comité des décrets'?</p>", "generalfeedback": "<p>Institutional governing bodies like the Comité des décrets are encoded as <orgName>.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<orgName>, because it represents an official governmental committee and institutional body.", "feedback": "<p>Correct. Legislative committees, clubs, and corporate assemblies are tagged as organizations (<orgName>).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<persName>, because it is composed of individual human beings.", "feedback": "<p>Incorrect. The committee is a collective institution, not an individual person.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<placeName>, because the committee met in a physical building in Paris.", "feedback": "<p>Incorrect. The meeting place is geographic, but the committee itself is an organization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<date>, because the decree was approved in August 1791.", "feedback": "<p>Incorrect. The decree date is temporal, but the committee is an institution.</p>"}]}}, {"step": 16, "title": "The National Assembly and the King: Royal and Legislative Bodies", "content": "**The National Assembly and the King: Royal and Legislative Bodies**\n\nIn August 1791, power in France was split between the elected National Assembly and King Louis XVI. Decrees had to be approved by the assembly and sanctioned by the king before they became law.\n\nWhen encoding these organizations, editors must distinguish between legislative bodies and the crown. The National Assembly is tagged as `<orgName>`. The king can be tagged as an individual with `<persName>` or as an office with `<roleName>le Roi</roleName>`.\n\nNotice how the words *Nation*, *Loi*, and *Roi* frequently appear together: \"la Nation, la Loi, et le Roi.\" An automated program might confuse these capitalized words for personal names. A human editor tags *la Loi* as a concept, *la Nation* as the body politic, and *le Roi* as the monarch.\n\n**Vocabulary.** *Royal Sanction* — The official royal approval required to turn an assembly decree into law. *Body Politic* — The collective political body of the people or state.\n\n**Takeaway:** Editorial judgment distinguishes royal offices and legal concepts from ordinary personal names in French administrative texts.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: The National Assembly and the King: Royal and Legislative Bodies", "questiontext": "<p>How did political authority in France split in the August 1791 constitutional decree?</p>", "generalfeedback": "<p>The 1791 decree reflects constitutional monarchy: legislative authority in the National Assembly and royal executive authority in Louis XVI.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Between the legislative power of the elected National Assembly and the executive royal authority of King Louis XVI.</p>", "feedback": "<p>Correct. The 1791 Constitution established a constitutional monarchy dividing power between the legislative assembly and the crown.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Between the Pope in Rome and the Ottoman Sultan in Istanbul.</p>", "feedback": "<p>Incorrect. The 1791 French decree was an internal French constitutional reorganization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Between private commercial shipping corporations and labor guilds.</p>", "feedback": "<p>Incorrect. The decree concerns national state sovereignty, not commercial guilds.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Between local parish priests and rural municipal mayors exclusively.</p>", "feedback": "<p>Incorrect. The National Assembly and the monarch held constitutional sovereignty.</p>"}]}}, {"step": 17, "title": "French Authority Files: Using BnF and IdRef for Revolutionary Names", "content": "**French Authority Files: Using BnF and IdRef for Revolutionary Names**\n\nWhen researching French historical figures, French national databases offer richer evidence than general English websites.\n\nTwo French registries are essential. First, the **Bibliothèque nationale de France (BnF)** maintains authoritative catalogue records for every person, printer, and institution in French history. Second, **IdRef** is the French higher education authority registry, linking researchers, deputies, and historical manuscripts.\n\nIn Ace's document, legislative deputies and minor clerks who appear only as signatures can often be found in IdRef or the BnF catalogue. Linking to BnF or IdRef alongside Wikidata provides ironclad authority evidence for French digital editions.\n\n**Vocabulary.** *BnF* — The National Library of France, maintaining standard French authority records. *IdRef* — The French academic authority registry used by universities and research libraries.\n\n**Takeaway:** The BnF and IdRef registries provide authoritative documentation for French historical figures and institutions.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: French Authority Files: Using BnF and IdRef for Revolutionary Names", "questiontext": "<p>Which French national databases provide the most authoritative Linked Data records for eighteenth-century French figures?</p>", "generalfeedback": "<p>BnF and IdRef provide the primary canonical authority registries for French historical persons and institutions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Bibliothèque nationale de France (BnF) and IdRef (Identifiants et Référentiels pour l'enseignement supérieur).</p>", "feedback": "<p>Correct. BnF and IdRef are France's national bibliographic and higher education authority registries, offering detailed French historical biographical records.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The British Royal Navy Admiralty Registry.</p>", "feedback": "<p>Incorrect. The British Admiralty does not maintain French domestic political authority files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The United States Library of Congress Copyright Office.</p>", "feedback": "<p>Incorrect. The LC records American copyrights and is not the primary authority for French revolutionary officials.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The International Olympic Committee Historical Database.</p>", "feedback": "<p>Incorrect. The IOC records modern athletic competitions, not French revolutionary history.</p>"}]}}, {"step": 18, "title": "Case Study 2: Personal Names in Olyvia's 1967 Maud Lewis Letter", "content": "**Case Study 2: Personal Names in Olyvia's 1967 Maud Lewis Letter**\n\nOlyvia is editing a 1967 handwritten letter by Nova Scotia folk artist Maud Lewis. This witness offers a total contrast to Ace's formal political decree. It is an intimate, twentieth-century personal letter about art and daily life.\n\nMaud Lewis lived in a tiny painted house in Marshalltown, Nova Scotia. She suffered from severe arthritis and sold painted boards from her home. Her letter to art buyer Leonard Kinnear discusses painting prices, house visits, and her husband Everett.\n\nThe entities here are personal and local: `<persName ref=\"wikidata:Q1479154\">Maud Lewis</persName>`, her husband `<persName ref=\"wikidata:Q115223560\">Everett Lewis</persName>`, and correspondent `<persName>Mr. Kinnear</persName>`. The geographic references point to rural Nova Scotia. Understanding these names requires attention to mid-century folk art culture.\n\n**Vocabulary.** *Folk Artist* — An artist without formal academic training whose work reflects local community culture. *Epistolary Witness* — A handwritten letter preserved as primary historical evidence.\n\n**Takeaway:** Olyvia's Maud Lewis letter features intimate personal names and rural Maritime locations in mid-century Nova Scotia.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Case Study 2: Personal Names in Olyvia's 1967 Maud Lewis Letter", "questiontext": "<p>Why do personal letters like Maud Lewis's 1967 correspondence present unique challenges for named entity identification?</p>", "generalfeedback": "<p>Epistolary texts present informal names, first-name mentions, and private local networks requiring local prosopography.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Letters feature informal nicknames, first names without surnames, and references to local neighbors not recorded in global encyclopedias.</p>", "feedback": "<p>Correct. Epistolary writing relies on intimate, informal naming that requires careful historical contextualization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Letters are written in secret invisible ink that cannot be digitized.</p>", "feedback": "<p>Incorrect. Historical correspondence is written in standard ink on paper.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Letters never mention real people or geographic locations.</p>", "feedback": "<p>Incorrect. Letters are rich in personal names, family relations, and geographic settings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>TEI guidelines explicitly forbid encoding private correspondence.</p>", "feedback": "<p>Incorrect. TEI has extensive guidance specifically for epistolary and correspondence markup.</p>"}]}}, {"step": 19, "title": "First Names and Nicknames: Resolving 'Everett' in Letters", "content": "**First Names and Nicknames: Resolving 'Everett' in Letters**\n\nIn personal letters, writers rarely use full formal names. Maud Lewis does not write \"my husband Everett Lewis.\" She simply writes \"Everett.\"\n\nHow should an editor encode a bare first name like \"Everett\"? In your TEI transcript, you must never alter the text. The tag wraps only the single word: `<persName>Everett</persName>`.\n\nTo show who \"Everett\" is, you use the `@ref` attribute: `<persName ref=\"wikidata:Q115223560\">Everett</persName>`. The link connects this casual first name to the full biography of Everett Lewis. This preserves the warm, informal tone of the letter while providing full digital clarity for researchers.\n\n**Vocabulary.** *Bare Name* — A first name or nickname used without a surname or official title. *Biographical Resolution* — Linking a casual first name to its full canonical identity via an attribute.\n\n**Takeaway:** The ref attribute allows casual first names and nicknames in letters to resolve to complete biographical records.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: First Names and Nicknames: Resolving 'Everett' in Letters", "questiontext": "<p>When Maud Lewis writes 'Everett' without a last name, how should an editor resolve this entity?</p>", "generalfeedback": "<p>Contextual knowledge resolves informal first-name mentions to full historical identities via @ref attributes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Tag the mention with <persName> and link via @ref to the authority record for Everett Lewis (or a local project identifier).</p>", "feedback": "<p>Correct. Contextual historical knowledge identifies Everett as Maud's husband Everett Lewis, allowing linked disambiguation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Alter the manuscript text by forcibly inserting 'Lewis' into Maud's handwritten sentence.</p>", "feedback": "<p>Incorrect. Editors never silently alter historical surface text; markup supplies external identity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Refuse to tag the word because it lacks an explicit surname.</p>", "feedback": "<p>Incorrect. Valid entities should be tagged even when expressed informally.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Assume 'Everett' refers to the city of Everett, Massachusetts.</p>", "feedback": "<p>Incorrect. Archival biographical context clearly identifies Everett Lewis, not a distant city.</p>"}]}}, {"step": 20, "title": "Maritime Places: Marshalltown, Digby, and Nova Scotia", "content": "**Maritime Places: Marshalltown, Digby, and Nova Scotia**\n\nThe geography in Maud Lewis's letter anchors her art in the rural landscape of southwestern Nova Scotia.\n\nShe writes from *Marshalltown*, located near the town of *Digby* in *Digby County*. In GeoNames, Digby has its own entry (`geonames:5938959`), and Marshalltown has a separate entry (`geonames:6066228`).\n\nWhen encoding these places, an editor captures their geographic relationship:\n```xml\n<placeName ref=\"geonames:6066228\">Marshalltown</placeName>,\n<placeName ref=\"geonames:5938959\">Digby</placeName>\n```\nLocal Maritime history is essential here. Without knowing Nova Scotia geography, an automated tool might confuse Digby with Digby Island in British Columbia.\n\n**Vocabulary.** *Toponym* — The proper name of a place or geographic feature. *Geographic Disambiguation* — Distinguishing between different towns that share the same name in different regions.\n\n**Takeaway:** Accurate Maritime place tagging links local Nova Scotia communities to precise gazetteer coordinates.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Maritime Places: Marshalltown, Digby, and Nova Scotia", "questiontext": "<p>How do the geographic entities in Maud Lewis's letters reflect spatial hierarchy?</p>", "generalfeedback": "<p>Geographical hierarchy cleanly nests local hamlets (Marshalltown) inside counties (Digby) and regions (Nova Scotia).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Marshalltown is a settlement within Digby County, which is situated within the province of Nova Scotia.</p>", "feedback": "<p>Correct. Spatial nested hierarchy places the local settlement within its municipal district and provincial region.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Digby is a sovereign nation containing Canada and North America.</p>", "feedback": "<p>Incorrect. Digby is a town and county in Nova Scotia, Canada.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Marshalltown, Digby, and Nova Scotia are identical synonymous names for the same street.</p>", "feedback": "<p>Incorrect. They represent three distinct levels of geographic scale.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Nova Scotia is a small house located inside Marshalltown.</p>", "feedback": "<p>Incorrect. Nova Scotia is the Canadian Atlantic province containing Marshalltown.</p>"}]}}, {"step": 21, "title": "Case Study 3: Sovereign Entities in Andromeda's 1752 Treaty", "content": "**Case Study 3: Sovereign Entities in Andromeda's 1752 Treaty**\n\nAndromeda is editing the 1752 Peace and Friendship Treaty concluded in Halifax, Nova Scotia. This diplomatic proclamation is a foundational legal pact between the British Crown and the Mi'kmaq Nation.\n\nThis document contains high-stakes political and sovereign entities. It names the British monarch, King George II, and his colonial representative, Governor Peregrine Thomas Hopson. It names the Mi'kmaw leader, Major Jean-Baptiste Cope, described as the Chief Sachem of the Chignecto tribe.\n\nThe treaty also names nations and sovereign bodies: the `<orgName>Tribe of Mickmack Indians</orgName>` and the `<orgName>His Majesty's Council</orgName>`. Editing this document requires historical precision, legal understanding, and cultural respect.\n\n**Vocabulary.** *Peace and Friendship Treaty* — An 18th-century treaty between the British Crown and Indigenous nations in the Maritimes establishing peace and trade without ceding land. *Sovereign Entity* — A self-governing political nation or royal authority.\n\n**Takeaway:** Andromeda's 1752 Treaty contains sovereign diplomatic entities, British officials, and Mi'kmaw national leadership.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Case Study 3: Sovereign Entities in Andromeda's 1752 Treaty", "questiontext": "<p>Which sovereign nations entered into the 1752 Peace and Friendship Treaty?</p>", "generalfeedback": "<p>The 1752 Treaty engaged sovereign Mi'kmaw leadership and the British colonial crown in mutual diplomatic relations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The Mi'kmaq Nation (represented by Chief Sachem Jean-Baptiste Cope) and the British Crown (represented by Governor Hopson).</p>", "feedback": "<p>Correct. The 1752 Treaty represents a bilateral diplomatic agreement between the Mi'kmaw nation and the British colonial sovereign.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Kingdom of Spain and the Republic of Venice.</p>", "feedback": "<p>Incorrect. Neither Spain nor Venice was party to Nova Scotia peace and friendship treaties.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Hudson's Bay Company and the Russian Empire.</p>", "feedback": "<p>Incorrect. The treaty was concluded between local British colonial authorities and the Mi'kmaq.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The United States of America and the Dominion of Canada.</p>", "feedback": "<p>Incorrect. In 1752, neither Canada nor the United States existed as independent federal states.</p>"}]}}, {"step": 22, "title": "Mi'kmaw Leadership: Chief Sachem Jean-Baptiste Cope", "content": "**Mi'kmaw Leadership: Chief Sachem Jean-Baptiste Cope**\n\nThe central Indigenous figure in the 1752 Treaty is Major Jean-Baptiste Cope (c. 1698–c. 1760). Cope was a prominent Mi'kmaw leader from Shubenacadie who negotiated with British authorities in Halifax.\n\nIn the treaty text, his name appears with colonial titles: *Major Jean Baptiste Cope, Chief Sachem*. The title *Major* was an honorary distinction given by French authorities, while *Sachem* is an Indigenous leadership title.\n\nIn TEI, you can encode his name with granular precision or as a complete phrase:\n```xml\n<persName ref=\"dcb:cope_jean_baptiste\">\n  <roleName>Major</roleName>\n  <forename>Jean Baptiste</forename>\n  <surname>Cope</surname>\n</persName>\n```\nHis scholarly biography is published in the *Dictionary of Canadian Biography*, providing an authoritative citation link.\n\n**Vocabulary.** *Sachem* — A traditional title for a chief or sovereign leader in eastern Indigenous nations. *Honorary Rank* — A military title granted as a diplomatic courtesy rather than an active command.\n\n**Takeaway:** Major Jean-Baptiste Cope's title combines Mi'kmaw and European leadership roles, linking to the Dictionary of Canadian Biography.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Mi'kmaw Leadership: Chief Sachem Jean-Baptiste Cope", "questiontext": "<p>How should Chief Sachem Jean-Baptiste Cope's title and personal name be encoded in TEI?</p>", "generalfeedback": "<p>Structured personal names combine <roleName> for diplomatic titles with <forename> and <surname> within <persName>.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<persName><roleName>Chief Sachem</roleName> <forename>Jean-Baptiste</forename> <surname>Cope</surname></persName>", "feedback": "<p>Correct. Tagging Cope with structured roleName, forename, and surname honors both diplomatic title and personal identity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<title>Chief Sachem</title><name>Jean-Baptiste Cope</name>", "feedback": "<p>Incorrect. <title> denotes creative or published works; diplomatic and political titles belong in <roleName>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<placeName>Jean-Baptiste Cope</placeName>", "feedback": "<p>Incorrect. Cope is a revered historical human leader, not a geographic place.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<orgName>Jean-Baptiste Cope</orgName>", "feedback": "<p>Incorrect. Cope is an individual human actor, not an impersonal organization.</p>"}]}}, {"step": 23, "title": "Colonial Government: Governor Peregrine Thomas Hopson", "content": "**Colonial Government: Governor Peregrine Thomas Hopson**\n\nThe primary British official in the 1752 Treaty is Peregrine Thomas Hopson (1696–1759). Hopson served as Governor of Nova Scotia from 1752 to 1755, following Governor Edward Cornwallis.\n\nHopson pursued a deliberate policy of diplomatic reconciliation with the Mi'kmaq. His treaty guaranteed hunting and fishing rights and established a framework for regulated commerce.\n\nIn your markup, Hopson is encoded with his authority link:\n```xml\n<persName ref=\"wikidata:Q7167799\">Peregrine Thomas Hopson</persName>\n```\nHopson also appears in the *Dictionary of Canadian Biography*. Linking his name connects the treaty to eighteenth-century British colonial administration records.\n\n**Vocabulary.** *Colonial Governor* — The appointed royal official representing the British Crown in a colony. *Diplomatic Reconciliation* — A formal policy aimed at resolving military conflict through legal treaties.\n\n**Takeaway:** Governor Peregrine Thomas Hopson represented the British Crown in the 1752 negotiations, linking to colonial administrative records.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Colonial Government: Governor Peregrine Thomas Hopson", "questiontext": "<p>In the 1752 Treaty, what role does Peregrine Thomas Hopson occupy, and how is his authority grounded?</p>", "generalfeedback": "<p>Governor Peregrine Thomas Hopson signed the 1752 Treaty under the authority of King George II.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Governor-in-Chief of Nova Scotia, representing the sovereign authority of King George II of Great Britain.</p>", "feedback": "<p>Correct. Hopson held the official colonial commission representing the British monarch.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A private French merchant trading furs without government sanction.</p>", "feedback": "<p>Incorrect. Hopson was the official British royal governor.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An anonymous clerk with no political authority or signature.</p>", "feedback": "<p>Incorrect. Hopson signed and sealed the treaty as Governor-in-Chief.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A Spanish naval admiral stationed in the Mediterranean Sea.</p>", "feedback": "<p>Incorrect. Hopson was British governor stationed in Halifax, Nova Scotia.</p>"}]}}, {"step": 24, "title": "Historical Toponyms: Chigabenakady and Colonial Renaming", "content": "**Historical Toponyms: Chigabenakady and Colonial Renaming**\n\nWhen editing colonial treaties, you encounter historical place names that colonial officials later altered or Anglicized.\n\nThe treaty refers to Cope's home territory as *Chigabenakady*. This is the historical English spelling of the Mi'kmaw name *Sipekne'katik*, which translates to \"where the wild groundnuts grow.\" Today, the town is commonly spelled *Shubenacadie*.\n\nIf you link *Chigabenakady* only to the modern Canadian census town in GeoNames, you obscure its Indigenous geography. A responsible digital edition notes the ancestral territory of *Sipekne'katik* in the header or commentary:\n```xml\n<placeName ref=\"geonames:6147610\">Chigabenakady</placeName>\n```\nScholarly markup acknowledges original Indigenous place names rather than treating colonial spellings as the only truth.\n\n**Vocabulary.** *Sipekne'katik* — The traditional Mi'kmaw district name meaning \"place of wild groundnuts.\" *Anglicization* — Changing a foreign or Indigenous name to fit English spelling and pronunciation habits.\n\n**Takeaway:** Historical treaty markup records original Indigenous place names like Chigabenakady alongside modern gazetteer coordinates.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Historical Toponyms: Chigabenakady and Colonial Renaming", "questiontext": "<p>Why is the historical place name 'Chigabenakady' significant when editing the 1752 Treaty?</p>", "generalfeedback": "<p>Historical toponyms like Chigabenakady reflect authentic Indigenous geography (Sipekne'katik) that predates colonial renaming.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It represents the ancestral Mi'kmaw toponym for Sipekne'katik (anglicized as Shubenacadie), preserving Indigenous geographic heritage before colonial distortion.</p>", "feedback": "<p>Correct. Historical editions record indigenous toponyms to preserve authentic place names obscured by later colonial mapping.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It was a fictional mythical kingdom invented by British poets in London.</p>", "feedback": "<p>Incorrect. Chigabenakady is an authentic historical Mi'kmaw regional location.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is the Latin translation of the city of Paris, France.</p>", "feedback": "<p>Incorrect. It is an indigenous Mi'kmaw placename in Nova Scotia.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It was a printing typographical error with no real-world meaning.</p>", "feedback": "<p>Incorrect. The toponym refers to the ancestral Shubenacadie river region.</p>"}]}}, {"step": 25, "title": "Regnal Years and Calendars: The King's Reign in Dates", "content": "**Regnal Years and Calendars: The King's Reign in Dates**\n\nIn eighteenth-century British law, dates were measured by the monarch's reign as well as the calendar year. A monarch's regnal year begins on the day they ascend the throne.\n\nThe 1752 Treaty dates its preamble \"in the Twenty Sixth Year of the Reign of our Sovereign Lord George the Second.\" George II became king on June 11, 1727. Therefore, November 1752 fell in his twenty-sixth regnal year.\n\nWhen you encode this legal date, wrap the entire phrase and calculate the true calendar date:\n```xml\n<date when=\"1752-11-22\">the Twenty Sixth Year of the Reign of our Sovereign Lord George the Second</date>\n```\nThe `@when` attribute stores the exact day in ISO 8601 format, ensuring your digital timeline remains accurate.\n\n**Vocabulary.** *Regnal Year* — A year counted from the official accession date of a reigning monarch. *Accession* — The formal date when a monarch inherits the crown and begins their reign.\n\n**Takeaway:** Legal regnal dates must be calculated and normalized into standard YYYY-MM-DD dates in the when attribute.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Regnal Years and Calendars: The King's Reign in Dates", "questiontext": "<p>What is a regnal date in eighteenth-century British official legal documents?</p>", "generalfeedback": "<p>Regnal years express legal dates by counting the elapsed years of a monarch's reign alongside the Julian or Gregorian calendar.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A date calculated from the anniversary of a monarch's ascension to the throne (e.g. 'the twenty-sixth year of the reign of King George the Second').</p>", "feedback": "<p>Correct. Regnal dating measures legal time relative to the reigning king's coronation year.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A date determined by the position of Jupiter's moons through a telescope.</p>", "feedback": "<p>Incorrect. Astronomical planetary tables were not used for legal regnal dating.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A secret calendar only understood by tax collectors.</p>", "feedback": "<p>Incorrect. Regnal dating was standard public legal notation throughout the British Empire.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A date that changes every day according to the weather.</p>", "feedback": "<p>Incorrect. Regnal years were mathematically fixed by royal accession dates.</p>"}]}}, {"step": 26, "title": "Writing Your Editorial Policy: ENTITY_POLICIES.md", "content": "**Writing Your Editorial Policy: ENTITY_POLICIES.md**\n\nBefore you annotate entities in your text, you must record your editorial rules in a project policy file. You will create `ENTITY_POLICIES.md` in the root of your repository.\n\nYour policy document must answer four concrete questions:\n\n1. **Which authority registries govern your project?** (e.g., Wikidata and VIAF for people; GeoNames and Native Land Digital for places).\n2. **What is your granularity policy?** Do you tag compound names like \"Governor Hopson\" as a single `<persName>`, or do you split them into `<roleName>` and `<surname>`?\n3. **How do you normalize partial dates?** If a letter says \"Feb 1967,\" do you write `when=\"1967-02\"`?\n4. **What is your verified absence procedure?** Which databases must you check before declaring a person unindexed?\n\nWriting these rules down guarantees consistency across your entire manuscript.\n\n**Vocabulary.** *Editorial Policy* — A written set of rules that defines how an editor makes markup and tagging decisions. *Granularity Policy* — The decision on how deeply to break names into sub-elements.\n\n**Takeaway:** The ENTITY_POLICIES.md file records your project rules for registries, tagging depth, and date normalization.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Writing Your Editorial Policy: ENTITY_POLICIES.md", "questiontext": "<p>Why must a digital edition project compile a formal ENTITY_POLICIES.md document before starting entity annotation?</p>", "generalfeedback": "<p>ENTITY_POLICIES.md locks in editorial rules for entity spans, classification edge cases, and authority linking.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To establish explicit, repeatable decision rules for entity boundaries, ambiguous mentions, missing records, and canonical registries.</p>", "feedback": "<p>Correct. Editorial policy documents ensure consistency, prevent subjective drift, and document methodological constraints.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computer operating systems refuse to run Python scripts without a markdown file in the folder.</p>", "feedback": "<p>Incorrect. Software execution does not depend on project policy markdown files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To register the project with international patent offices for commercial profit.</p>", "feedback": "<p>Incorrect. Scholarly digital editions are academic research projects, not commercial patents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To list the student authors' favorite movies and leisure activities.</p>", "feedback": "<p>Incorrect. ENTITY_POLICIES.md outlines rigorous philological tagging guidelines.</p>"}]}}, {"step": 27, "title": "The 20-Entity Ground Truth Table", "content": "**The 20-Entity Ground Truth Table**\n\nTo create your benchmark for this week's experiments, you will extract twenty entity mentions from your manuscript witness.\n\nYou will organize these twenty entities into a four-column table in your notes or policy file:\n\n1. **Surface Mention:** The exact text as written on the historical page.\n2. **Entity Class:** Person, Place, Organization, or Date.\n3. **Canonical Name:** The standardized dictionary or biographical name.\n4. **Authority Link:** The URI or ID from Wikidata, GeoNames, or your local header.\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Surface Mention</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Entity Class</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Canonical Name</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Authority Link (@ref)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Major Jean Baptiste Cope</td>\n      <td style=\"padding: 0.5rem;\">Person</td>\n      <td style=\"padding: 0.5rem;\">Jean-Baptiste Cope</td>\n      <td style=\"padding: 0.5rem;\"><code>dcb:cope_jean_baptiste</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Halifax</td>\n      <td style=\"padding: 0.5rem;\">Place</td>\n      <td style=\"padding: 0.5rem;\">Halifax, Nova Scotia</td>\n      <td style=\"padding: 0.5rem;\"><code>geonames:6324729</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">l'Assemblée nationale</td>\n      <td style=\"padding: 0.5rem;\">Organization</td>\n      <td style=\"padding: 0.5rem;\">Assemblée nationale</td>\n      <td style=\"padding: 0.5rem;\"><code>wikidata:Q876424</code></td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">22 Novembre 1752</td>\n      <td style=\"padding: 0.5rem;\">Date</td>\n      <td style=\"padding: 0.5rem;\">1752-11-22</td>\n      <td style=\"padding: 0.5rem;\"><code>ISO-8601</code></td>\n    </tr>\n  </tbody>\n</table>\n\nEvery entry must be checked by eye against historical sources. This table represents your ground truth.\n\n**Vocabulary.** *Ground Truth Table* — A verified reference list of entities used to evaluate automated software predictions. *Canonical Name* — The official, standardized spelling of an entity's name.\n\n**Takeaway:** A 20-entity table establishes the manual benchmark against which computational NER tools will be tested.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: The 20-Entity Ground Truth Table", "questiontext": "<p>What is the methodological purpose of manually compiling a 20-entity ground truth table?</p>", "generalfeedback": "<p>The manual 20-entity ground truth table establishes the gold standard needed to evaluate automated models.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It serves as the gold-standard benchmark against which automated tools (NER models and LLMs) can be rigorously scored and audited.</p>", "feedback": "<p>Correct. An authoritative human baseline is essential to measure precision, recall, and error rates of machine models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It serves as a decorative graphic to display on the university homepage.</p>", "feedback": "<p>Incorrect. The ground truth table is an empirical scholarly benchmark.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It fulfills a legal copyright requirement to transfer ownership of the manuscript.</p>", "feedback": "<p>Incorrect. Ground truth benchmarking is an analytical evaluation method.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces the entire full text of the original historical document.</p>", "feedback": "<p>Incorrect. The table benchmarks a curated sample excerpt, not replacing the witness.</p>"}]}}, {"step": 28, "title": "Hand-Authoring ground_truth_entities_manual.xml
