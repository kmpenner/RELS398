edition; the edition is the encoded file and the decisions that render it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The authoritative edition, which replaces the TEI file.</p>", "feedback": "<p>Incorrect. The TEI remains the source; the PDF is an output.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Something that can only be made with XSL-FO software.</p>", "feedback": "<p>Incorrect. The browser's Save as PDF with a print stylesheet is a sound route.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A file that must be edited by hand after export.</p>", "feedback": "<p>Incorrect. Editing the PDF by hand would break the link to your rules.</p>"}]}}, {"step": 26, "title": "Worked Example: The 1791 Decree by XSLT", "content": "**Worked Example: The 1791 Decree by XSLT**\n\nAce's decree shows how the stylesheets handle a French text. Suppose one illustrative line of the TEI reads:\n\n```xml\n<lb n=\"4\"/>qui <choice><orig>étoient</orig><reg>étaient</reg></choice> réunis\n```\n\nThe reading stylesheet chooses `<reg>` and writes:\n\n```html\nqui <span class=\"reg\">étaient</span> réunis\n```\n\nThe diplomatic stylesheet chooses `<orig>` and writes a numbered line reading *qui étoient réunis*.\n\nThree adjustments make the stylesheets right for Ace's file. First, change `<html lang=\"en\">` in the page shell to `<html lang=\"fr\">`, because the page is French. Second, keep `encoding=\"utf-8\"` in `xsl:output` and `<meta charset=\"utf-8\"/>` in the head. Open the result and check every accented letter: *é*, *è*, *à*, *ç*. If any appears as a pair of strange symbols, one of those two settings is missing. Third, if the decree's divisions are articles or clauses, check that `class=\"{@type}\"` produced the class names your CSS expects.\n\nThen do the line-by-line check from Tuesday on ten lines. Every regularized form should appear in the reading view and every original form in the diplomatic view, with nothing glued together and nothing missing.\n\n**Vocabulary.** *`xsl:output`* — The XSLT element that sets the kind of output, such as HTML, and its character encoding. *Mojibake* — Garbled characters that appear when text is read with the wrong encoding.\n\n**Takeaway:** For a French text, set `lang=\"fr\"`, keep UTF-8 in both the output setting and the page head, and check every accented letter and every `<choice>` in both views.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Worked Example: The 1791 Decree by XSLT", "questiontext": "<p>Accented letters in Ace's generated page appear as pairs of strange symbols. What should be checked first?</p>", "generalfeedback": "<p>For a French text, set <code>lang=\"fr\"</code>, keep UTF-8 in both the output setting and the page head, and check every accented letter and every <code>&lt;choice&gt;</code> in both views.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>That <code>xsl:output</code> has <code>encoding=\"utf-8\"</code> and the page head has <code>&lt;meta charset=\"utf-8\"/&gt;</code>.</p>", "feedback": "<p>Correct. A missing encoding setting is the usual cause of garbled accents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the page says <code>lang=\"en\"</code>.</p>", "feedback": "<p>Incorrect. The page should say <code>lang=\"fr\"</code>, but the language setting does not cause garbled letters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That every &lt;choice&gt; selects &lt;orig&gt;.</p>", "feedback": "<p>Incorrect. Layer choice does not affect how letters are encoded.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the decree has no &lt;div&gt; elements.</p>", "feedback": "<p>Incorrect. Structure has nothing to do with character encoding.</p>"}]}}, {"step": 27, "title": "Worked Example: The 1752 Treaty in CETEIcean", "content": "**Worked Example: The 1752 Treaty in CETEIcean**\n\nAndromeda's treaty shows the CETEIcean route. Take the illustrative lines from Tuesday, now with a damaged word:\n\n```xml\n<lb n=\"11\"/>That the <choice><abbr>Gov<hi rend=\"sup\">r</hi></abbr><expan>Gov<ex>erno</ex>r</expan></choice>\n<lb n=\"12\"/>and <choice><orig>Councill</orig><reg>Council</reg></choice> of the Pro-<lb n=\"13\" break=\"no\"/>vince\n<lb n=\"14\"/>shall <unclear>meet</unclear> <gap reason=\"damage\" quantity=\"2\" unit=\"word\"/> yearly.\n```\n\nWith `cetei-reading.css` and the gap behavior, the reading view runs the lines together as one sentence: That the Gov*erno*r and Council of the Pro-vince shall meet […] yearly. The word *meet* carries a dotted underline. With `cetei-diplomatic.css`, the same file shows four numbered lines: *Gov* with a raised *r*, *Councill* with its double *l*, and *Pro-* ending line 12.\n\nNow look closely at what CETEIcean did not do. The gap shows brackets, but its reason and extent are only in the attributes, invisible on screen and on paper. And if the `<lb break=\"no\"/>` in your file sits on a new line of the XML, the reading view shows *Pro- vince*, because CSS cannot remove whitespace the way the XSLT recipe in section 14 did. Each of these is a difference from your decision table, and each goes into `RENDERING.md`.\n\nThese lines are illustrative. Use the real lines from your own file, and choose at least one that contains a gap or an unclear reading.\n\n**Vocabulary.** *Attribute-only information* — Data recorded in an element's attributes that no reader sees unless a rule displays it. *Fidelity gap* — A place where a rendering shows less than the source records.\n\n**Takeaway:** CETEIcean renders the treaty lines in both views with Tuesday's rules, but gap details stay hidden in attributes and split-word whitespace survives; record both against your table.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Worked Example: The 1752 Treaty in CETEIcean", "questiontext": "<p>Which difference from the decision table does the CETEIcean treaty example reveal?</p>", "generalfeedback": "<p>CETEIcean renders the treaty lines in both views with Tuesday's rules, but gap details stay hidden in attributes and split-word whitespace survives; record both against your table.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Gap reasons and extents stay hidden in attributes, and split-word whitespace can survive as a stray space.</p>", "feedback": "<p>Correct. Both are fidelity gaps to record in <code>RENDERING.md</code>.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The regularized spellings are lost entirely.</p>", "feedback": "<p>Incorrect. Both layers are in the page; CSS chooses which to show.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Line numbers cannot be shown at all.</p>", "feedback": "<p>Incorrect. The diplomatic CSS shows them from the kept <code>n</code> attribute.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Unclear readings are deleted.</p>", "feedback": "<p>Incorrect. tei-unclear is styled with a dotted underline.</p>"}]}}, {"step": 28, "title": "The Fidelity Audit: Tool Error or Undecided Decision?", "content": "**The Fidelity Audit: Tool Error or Undecided Decision?**\n\nEvery difference between a generated page and Tuesday's page has one of two causes, and sorting them is today's most important task.\n\nA **tool error** is a place where your decision was clear but the rule failed to carry it out. The namespace prefix was missing; a template selected the wrong child; a gap had no template and vanished. The fix is in the stylesheet or the CSS.\n\nAn **undecided decision** is a place where the tool met something your table never addressed. Perhaps your file contains a `<hi rend=\"underline\">` you never mentioned, or a `<note>` that appears on line 30, beyond the ten lines you rendered by hand. The rule had to do something, and whatever it did was not your choice. The fix is in `RENDERING.md` first: make the decision, then write the rule.\n\n<table>\n  <thead>\n    <tr><th>What you see</th><th>Likely cause</th><th>Where to fix it</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Both layers glued together</td><td>Tool error: missing prefix or template</td><td>Stylesheet</td></tr>\n    <tr><td>A gap or line break missing</td><td>Tool error: no template or behavior for an empty element</td><td>Stylesheet or behavior</td></tr>\n    <tr><td>Words from an element you never listed</td><td>Undecided decision</td><td><code>RENDERING.md</code>, then the rule</td></tr>\n    <tr><td>Header text at the top of the page</td><td>Tool error: body not selected</td><td>Page shell</td></tr>\n  </tbody>\n</table>\n\nRun a quick search to catch undecided elements. Open your TEI file in VS Code, list every element name inside `<body>`, and tick each one off against your table. Any element without a row is undecided, however the tool happened to display it.\n\n**Vocabulary.** *Tool error* — A failure of a rule to carry out a clear, recorded decision. *Undecided decision* — A case the decision table never addressed, so that a tool's default chose instead of the editor.\n\n**Takeaway:** Sort every difference into a tool error, fixed in the rule, or an undecided decision, fixed first in `RENDERING.md`; a tool's default is never an editorial decision.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: The Fidelity Audit: Tool Error or Undecided Decision?", "questiontext": "<p>The generated page shows the text of a &lt;note&gt; on line 30 as plain words, and your <code>RENDERING.md</code> never mentions &lt;note&gt;. What kind of problem is this, and where is it fixed first?</p>", "generalfeedback": "<p>Sort every difference into a tool error, fixed in the rule, or an undecided decision, fixed first in <code>RENDERING.md</code>; a tool's default is never an editorial decision.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>An undecided decision; decide in <code>RENDERING.md</code> how notes should appear, then write the rule.</p>", "feedback": "<p>Correct. The tool's default chose for you; a default is never an editorial decision.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A tool error; fix the stylesheet and leave <code>RENDERING.md</code> alone.</p>", "feedback": "<p>Incorrect. The rule could not carry out a decision that was never made.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>No problem; the tool's output is acceptable as it stands.</p>", "feedback": "<p>Incorrect. Whatever the tool did was not your choice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A transcription error; delete the &lt;note&gt; from the TEI.</p>", "feedback": "<p>Incorrect. The encoding is fine; the rendering decision is missing.</p>"}]}}, {"step": 29, "title": "Hypothetical Scenario: The Vanishing Gap", "content": "**Hypothetical Scenario: The Vanishing Gap**\n\n*This scenario is invented to illustrate the risk; it describes no real person or edition.*\n\nAn editor publishes an online reading text of a damaged eighteenth-century letter. The stylesheet was adapted from a colleague's project, which had no damaged documents and so no template for `<gap/>`. The page looks clean and complete.\n\nA historian quotes a sentence from it in an article, arguing that the writer made a promise without conditions. A reviewer later checks the manuscript and finds a hole in the paper exactly where a condition might have stood. The TEI file recorded it correctly, with a `<gap reason=\"damage\" quantity=\"3\" unit=\"word\"/>`. The rendering dropped it silently, because an empty element with no template produces nothing.\n\nNo one was careless with the evidence. The transcription was right, and the encoding was right. The failure was a missing rule, and it went unnoticed because nobody compared the rendered page against the source, element by element.\n\nAsk yourself how this week's steps would have caught it. Tuesday's decision table would have listed `<gap/>` as an element that must show in both views. Today's audit would have found that the generated page had fewer brackets than the TEI had gaps. A simple count, gaps in the file against brackets on the page, takes a minute.\n\n**Vocabulary.** *Silent failure* — An error that produces no warning and leaves output that looks correct. *Count check* — Comparing the number of occurrences of an element in the source with the number of marks in the rendering.\n\n**Takeaway:** An empty element with no rule disappears without warning; counting each element in the TEI against its marks on the page catches the loss.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Hypothetical Scenario: The Vanishing Gap", "questiontext": "<p>Which quick check would have caught the vanishing gap in the scenario?</p>", "generalfeedback": "<p>An empty element with no rule disappears without warning; counting each element in the TEI against its marks on the page catches the loss.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Counting the &lt;gap/&gt; elements in the TEI against the brackets on the rendered page.</p>", "feedback": "<p>Correct. A count check takes a minute and catches silent losses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Validating the TEI file against the schema.</p>", "feedback": "<p>Incorrect. The TEI was valid; the loss happened in the rendering.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Checking that the page looked clean.</p>", "feedback": "<p>Incorrect. A clean look was exactly what hid the problem.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Running the stylesheet a second time.</p>", "feedback": "<p>Incorrect. A deterministic stylesheet would drop the gap again.</p>"}]}}, {"step": 30, "title": "Review and Step 2 Checklist", "content": "**Review and Step 2 Checklist**\n\nToday you turned your decision table into rules and rendered your whole document twice, once by XSLT and once by CETEIcean. You also learned where each route fails silently, and you compared both against the page you made by hand.\n\nBefore you leave, confirm each item below:\n\n<ol>\n  <li><strong>XSLT stylesheets:</strong> Do <code>rendering/reading.xsl</code> and <code>rendering/diplomatic.xsl</code> use the <code>tei:</code> prefix, select only the <code>&lt;body&gt;</code>, and have a template for every element in your decision table?</li>\n  <li><strong>Generated pages:</strong> Do <code>reading-auto.html</code> and <code>diplomatic-auto.html</code> show your whole document, with the correct <code>charset</code> and <code>lang</code>, and link to each other?</li>\n  <li><strong>CETEIcean pages:</strong> Do both CETEIcean views load through a local server, with every structural element displayed as a block and every gap showing brackets?</li>\n  <li><strong>Print rules:</strong> Does the print preview of your reading view show gap details as text and keep every editorial mark visible without colour?</li>\n  <li><strong>Audit recorded:</strong> Does <code>RENDERING.md</code> list each difference from Tuesday's page as a tool error or an undecided decision, with what you did about it?</li>\n  <li><strong>Count check:</strong> Do the numbers of gaps, unclear readings and <code>&lt;choice&gt;</code> elements in your TEI match the marks in each generated view?</li>\n  <li><strong>Committed:</strong> Are <code>render.py</code>, the stylesheets, the CETEIcean pages and the updated <code>RENDERING.md</code> committed in clearly described commits?</li>\n</ol>\n\nOn Friday you will ask an AI model to write a stylesheet for the same file, and audit its output against Tuesday's page and today's rules, element by element.\n\n**Vocabulary.** *Step 2 milestone* — The completed rule-based rendering and audit, fixed as the second point of comparison for Friday.\n\n**Takeaway:** Completing Step 2 gives you runnable rules that render your whole document in both views, and an audit that separates tool errors from decisions you had not yet made.\n\n---\n\n## References\n\nBausi, A., Borbone, P. G., Briquel-Chatonnet, F., Buzi, P., Gippert, J., Macé, C., Maniaci, M., Melissakis, Z., Parodi, L. E., & Witakowski, W. (Eds.). (2015). *Comparative oriental manuscript studies: An introduction*. COMSt.\n\nClausen, H., Brenner, S., Schreiner, M., & Vetter, W. (2026). Multimodal manuscript representation: Toward an open repository for manuscript research data. *The European Physical Journal Plus, 141*, 445. https://doi.org/10.1140/epjp/s13360-025-07133-y\n\nFaghihi, Y., Holford, M., & Jones, H. (2022). Teaching the Text Encoding Initiative: Context, community and collaboration. *Journal of Open Humanities Data, 8*, 15. https://doi.org/10.5334/johd.72\n\nLazzerini, F., & Di Franco, M. (2026). Creating a digital critical edition of a classical text with XML/TEI. *Umanistica Digitale, 23*. https://doi.org/10.60923/issn.2532-8816/23486\n\nPierazzo, E. (2016). Modelling digital scholarly editing: From Plato to Heraclitus. In M. J. Driscoll & E. Pierazzo (Eds.), *Digital scholarly editing: Theories and practices* (pp. 41–58). Open Book Publishers. https://doi.org/10.11647/OBP.0095.03", "html": null, "image_b64": null, "question": {"name": "30 Question: Review and Step 2 Checklist", "questiontext": "<p>What does completing Step 2 give you for Friday?</p>", "generalfeedback": "<p>Completing Step 2 gives you runnable rules that render your whole document in both views, and an audit that separates tool errors from decisions you had not yet made.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Runnable rules that render the whole document in both views, and an audit separating tool errors from decisions not yet made.</p>", "feedback": "<p>Correct. On Friday an AI-written stylesheet will be audited against Tuesday's page and today's rules.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A finished, final edition that needs no further changes.</p>", "feedback": "<p>Incorrect. The rendering will keep changing as your TEI and decisions develop.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A replacement for Tuesday's decision table.</p>", "feedback": "<p>Incorrect. The rules carry out the table; they do not replace it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A PDF ready for submission.</p>", "feedback": "<p>Incorrect. The Print-Ready Publication is due in December; today only starts it.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
