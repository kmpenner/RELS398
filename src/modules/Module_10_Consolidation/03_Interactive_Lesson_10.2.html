text, and stylesheets inside the repository rather than relying on external dynamic servers.\n4. **Platform Independence:** Ensure the edition can run locally from a USB drive or static web host without special server software.\n5. **No Dynamic Vulnerabilities:** Static files have no database security holes and can survive safely for decades.\n\nBuilding your edition in clean TEI XML with CSS ensures your work stays readable twenty years from now.\n\n**Vocabulary.** *The Endings Project* — A digital humanities research initiative defining technical standards for long-term preservation of digital editions. *Digital Longevity* — The capacity of digital resources to remain accessible, functional, and citeable over decades.\n\n**Takeaway:** The Endings Project principles mandate static, open-standard files to ensure digital editions survive for decades without maintenance.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Digital Longevity and the Endings Project Principles", "questiontext": "<p>Why does The Endings Project recommend building digital editions using static files rather than server databases?</p>", "generalfeedback": "<p>The Endings Project principles mandate static, open-standard files to ensure digital editions survive for decades without maintenance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Static HTML, CSS, and TEI XML files survive for decades without database maintenance, security patches, or server upgrades.</p>", "feedback": "<p>Correct. Static files eliminate database obsolescence and security vulnerabilities, ensuring twenty-year digital longevity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Static files automatically generate money for university endowments.</p>", "feedback": "<p>Incorrect. The Endings Project focuses on long-term preservation and digital survival, not monetization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Server databases are illegal under Canadian intellectual property legislation.</p>", "feedback": "<p>Incorrect. Databases are legal; the issue is that complex dynamic servers require continuous maintenance and decay quickly.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Static files can only be read on computers manufactured before 1995.</p>", "feedback": "<p>Incorrect. Static web standards are supported by all modern and future web browsers.</p>"}]}}, {"step": 29, "title": "Archiving, Persistent Identification, and FAIR Data", "content": "**Archiving, Persistent Identification, and FAIR Data**\n\nGitHub is an outstanding platform for active collaboration and continuous integration. However, GitHub is a commercial company. It is not an archival repository. Long-term scholarly preservation requires depositing your edition in an academic data repository.\n\nWhen your edition is finished, archive a release on **Zenodo**. Zenodo is an open research repository run by CERN:\n\n- **Permanent Digital Object Identifier (DOI):** Zenodo mints a permanent, citable DOI (such as `10.5281/zenodo.1234567`) for your repository snapshot.\n- **Automated GitHub Integration:** You can link GitHub directly to Zenodo so that every new GitHub Release is archived automatically.\n- **FAIR Compliance:** Zenodo guarantees permanent bit-level preservation, indexing your metadata in international academic search engines.\n\nArchiving your consolidated repo gives your scholarship a permanent home. It becomes citable in the global academic record.\n\n**Vocabulary.** *Zenodo* — An open-access scholarly repository operated by CERN that provides permanent storage and DOIs for research data. *Digital Object Identifier (DOI)* — A persistent, unique alphanumeric string used to permanently identify and cite academic publications.\n\n**Takeaway:** Archiving releases to Zenodo mints permanent DOIs. It guarantees long-term preservation.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Archiving, Persistent Identification, and FAIR Data", "questiontext": "<p>What scholarly benefit does depositing a repository release in Zenodo provide?</p>", "generalfeedback": "<p>Archiving releases to Zenodo mints permanent DOIs. It guarantees long-term preservation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It mints a permanent Digital Object Identifier (DOI) and guarantees long-term bit-level preservation in academic archives.</p>", "feedback": "<p>Correct. Zenodo provides persistent DOIs and archival storage, ensuring your edition is permanently findable and citable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically registers the student for graduate school admission.</p>", "feedback": "<p>Incorrect. Zenodo is an open research archive, not a university admissions office.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the repository from GitHub to save cloud storage space.</p>", "feedback": "<p>Incorrect. Zenodo archives a snapshot while your GitHub repository remains active for ongoing work.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents anyone from reading your edition without paying a fee.</p>", "feedback": "<p>Incorrect. Zenodo supports open-access research data sharing under FAIR principles.</p>"}]}}, {"step": 30, "title": "The Consolidated Milestone: Looking Ahead to Final Publication", "content": "**The Consolidated Milestone: Looking Ahead to Final Publication**\n\nCongratulations! You have completed the mid-term consolidation milestone for RELS 398.\n\nLook at how far your digital edition has advanced:\n\n- You built a codicological `<teiHeader>` cataloguing your witness.\n- You linked high-resolution `<facsimile>` images with coordinate zones.\n- You created diplomatic and AI-reconciled transcriptions.\n- You regularized historical orthography using `<choice>` tags.\n- You designed responsive reading views with CSS.\n- You enriched your text with grammatical lemmatization and named entities.\n- Today, you united all these layers under automated CI validation and collaborative peer review.\n\nNext week, in Module 11, we begin Phase 3: **Advanced Publication and Interactive Presentation**. You will turn your consolidated edition into web interfaces and interactive tools.\n\n**Vocabulary.** *Consolidated Edition* — A unified digital scholarly edition integrating metadata, facsimile, transcription, regularization, and entity layers. *Project Milestone* — A major project stage where all underlying data layers are validated and prepared for publication.\n\n**Takeaway:** Completing the consolidation milestone unites nine editorial layers under automated CI gates, preparing your edition for publication.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: The Consolidated Milestone: Looking Ahead to Final Publication", "questiontext": "<p>What milestone does completing Module 10 represent in the RELS 398 curriculum?</p>", "generalfeedback": "<p>Completing the consolidation milestone unites nine editorial layers under automated CI gates, preparing your edition for publication.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>All nine accumulated layers are validated under automated CI gates, preparing the edition for publication and interface design.</p>", "feedback": "<p>Correct. Consolidation completes the foundational encoding phase, setting the stage for advanced publication and public presentation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Students graduate immediately and no further coursework is required.</p>", "feedback": "<p>Incorrect. Phase 3 (Advanced Publication and Presentation) begins next week in Module 11.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The primary manuscript witnesses are returned to museum archives and never used again.</p>", "feedback": "<p>Incorrect. The digitized editions continue into Phase 3 for web styling and interactive publication.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All TEI XML files are deleted to make room for final exam review notes.</p>", "feedback": "<p>Incorrect. The consolidated XML files are the primary assets that will be published in Modules 11 through 13.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
