    <script>
        const lessonData = {"course_title": "Automated Schema Validation, CI/CD Gates, and Peer Review", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "The Quality Assurance Gate in Textual Scholarship", "content": "**The Quality Assurance Gate in Textual Scholarship**\n\nA digital edition requires high editorial standards. If an edition has broken tags, scholars cannot trust it. If metadata or links are missing, citation fails. Quality assurance is the careful process of checking files. It verifies that files meet technical and scholarly standards.\n\nIn digital editing, quality assurance relies on two complementary gates:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Quality Assurance Gate</th>\n<th>Primary Instrument</th>\n<th>What It Verifies</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Automated Validation Gate</strong></td>\n<td>Software parsers (`xmllint`, Relax NG, Schematron, GitHub Actions)</td>\n<td>Well-formedness, tag syntax, schema grammar, and attribute co-occurrence rules.</td>\n</tr>\n<tr>\n<td><strong>Human Peer Review Gate</strong></td>\n<td>Scholarly peers and editorial boards</td>\n<td>Transcription fidelity, paleographical readings, historical accuracy, and interpretive insight.</td>\n</tr>\n</tbody>\n</table>\n\nComputers check rules fast. They scan thousands of lines in seconds. Humans provide historical judgment. Combining automated checks with human review gives your edition stability. It also ensures scholarly quality.\n\n**Vocabulary.** *Quality Assurance (QA)* — The careful testing and verification of files against defined technical standards. *Dual-Gate Design* — Pairing automated software checks with human peer review to evaluate digital editions.\n\n**Takeaway:** A dependable digital scholarly edition requires both automated software validation and human peer review.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: The Quality Assurance Gate in Textual Scholarship", "questiontext": "<p>Why does digital scholarly editing require both automated validation and human peer review?</p>", "generalfeedback": "<p>A dependable digital scholarly edition requires both automated software validation and human peer review.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Computers check rules and syntax instantly across thousands of lines, while humans provide historical judgment and paleographical insight.</p>", "feedback": "<p>Correct. The dual-gate approach pairs rapid machine checking of structural rules with human scholarly interpretation and contextual evaluation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Commercial publishing contracts legally require two software companies to sign off on files.</p>", "feedback": "<p>Incorrect. Quality assurance is scholarly and open-source, not dependent on commercial company signatures.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Automated validation can only check Latin documents, requiring humans for all modern languages.</p>", "feedback": "<p>Incorrect. Automated XML validators check any language encoded in Unicode, but cannot judge historical truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Human peer review is obsolete and only used as a backup when Internet access is unavailable.</p>", "feedback": "<p>Incorrect. Human peer review is essential for assessing paleography, historical context, and editorial decisions.</p>"}]}}, {"step": 2, "title": "The Fragility of Local Desktop Validation", "content": "**The Fragility of Local Desktop Validation**\n\nDuring class, you validated XML in VS Code. You looked for red squiggly lines. Local validation helps during drafting. But relying only on your laptop is risky.\n\nLocal settings drift over time. One student might use an old schema. Another might ignore red squiggly lines. A third might forget to run checks before committing.\n\nThis creates a common trap: \"It works on my machine!\" When Ace clones Olyvia's repository, he may discover errors. Her local editor hid those mistakes. Automated workflows ensure consistency. Every file is tested against identical standards on an independent cloud server.\n\n**Vocabulary.** *Local Settings Drift* — When individual desktop software settings, schemas, or extensions become outdated or inconsistent across a team. *Centralized Validation* — Running standardized automated tests on a shared remote server rather than individual laptops.\n\n**Takeaway:** Local laptop validation is convenient for drafting, but centralized automated checks guarantee consistency across a project.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: The Fragility of Local Desktop Validation", "questiontext": "<p>What risk arises when project teams rely solely on local desktop validation on individual laptops?</p>", "generalfeedback": "<p>Local laptop validation is convenient for drafting, but centralized automated checks guarantee consistency across a project.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Local software settings and schemas drift over time, hiding errors that break consistency across the project.</p>", "feedback": "<p>Correct. Individual laptop environments often diverge in schema paths or tool settings, leading to the \"it works on my machine\" trap.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Desktop text editors automatically delete all XML files after thirty days of inactivity.</p>", "feedback": "<p>Incorrect. Editors like VS Code do not delete user files; the hazard is configuration divergence across team members.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Local validation permanently damages laptop screen hardware when errors occur.</p>", "feedback": "<p>Incorrect. Validation is software parsing and poses no risk to computer hardware.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Desktop computers cannot validate files containing more than fifty words.</p>", "feedback": "<p>Incorrect. Local editors handle large documents easily, but human inconsistency allows unvetted commits to slip through.</p>"}]}}, {"step": 3, "title": "The Multi-Tiered Validation Hierarchy", "content": "**The Multi-Tiered Validation Hierarchy**\n\nValidation is not a single test. In digital editing, quality control operates across three levels. Each tier increases in strictness:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Validation Tier</th>\n<th>Standard Technology</th>\n<th>Core Question Answered</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Tier 1: Syntax</strong></td>\n<td>XML Well-Formedness (`xmllint`)</td>\n<td>Is the document syntactically legal XML with closed, nested tags?</td>\n</tr>\n<tr>\n<td><strong>Tier 2: Grammar</strong></td>\n<td>RELAX NG Schema (`msdesc.rng`, `tei_all.rng`)</td>\n<td>Do elements and attributes follow TEI structure rules and data types?</td>\n</tr>\n<tr>\n<td><strong>Tier 3: Semantics</strong></td>\n<td>ISO Schematron (`.sch`)</td>\n<td>Do attributes follow project rules, cross-references, and conditional rules?</td>\n</tr>\n</tbody>\n</table>\n\nEach tier builds on the last level. A file must pass Tier 1 first. Then a schema checks Tier 2. Next, Schematron tests Tier 3 rules.\n\n**Vocabulary.** *Validation Hierarchy* — A three-tiered system of testing XML files for syntax, structure rules, and semantic rules. *Project Rules* — Project-specific editorial rules that go beyond generic schema constraints.\n\n**Takeaway:** Digital editions validate across three tiers: clean syntax, grammatical schemas, and semantic rules.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Multi-Tiered Validation Hierarchy", "questiontext": "<p>What are the three distinct tiers of quality control in digital textual scholarship?</p>", "generalfeedback": "<p>Digital editions validate across three tiers: clean syntax, structure rules, and semantic constraints.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Tier 1 syntax (well-formedness), Tier 2 grammar (RELAX NG), and Tier 3 semantics (Schematron).</p>", "feedback": "<p>Correct. Validation progresses from universal XML syntax, through structural tree grammar, to context-dependent semantic business rules.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Tier 1 word count, Tier 2 font selection, and Tier 3 print paper weight.</p>", "feedback": "<p>Incorrect. Those are physical typography choices, not formal XML validation tiers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Tier 1 spelling correction, Tier 2 language translation, and Tier 3 audio generation.</p>", "feedback": "<p>Incorrect. XML validation tiers evaluate formal syntactic well-formedness, schema grammar, and rule assertions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Tier 1 Git push, Tier 2 GitHub pull, and Tier 3 USB backup drive.</p>", "feedback": "<p>Incorrect. Those are version-control operations, not XML validation tiers.</p>"}]}}, {"step": 4, "title": "Tier 1 Validation: XML Well-Formedness and Parser Mechanics", "content": "**Tier 1 Validation: XML Well-Formedness and Parser Mechanics**\n\nTier 1 validation checks **well-formedness**. Well-formedness is the basic syntax foundation set by the W3C.\n\nAn XML parser does not care about TEI rules. It ignores manuscripts. It only checks syntax. A document is well-formed if:\n\n1. It contains exactly one root element enclosing all other tags.\n2. Every start tag matches an end tag with identical spelling and case.\n3. Elements nest cleanly without overlapping boundaries.\n4. All attribute values are wrapped in matching quotation marks.\n\nIf a file breaks any of these rules, the parser stops. It reports a **fatal error**. Web browsers guess meaning when HTML is broken. XML parsers never guess. You test Tier 1 in your terminal using `xmllint`:\n\n```bash\nxmllint --noout witness.xml\n```\n\n**Vocabulary.** *Well-Formed XML* — XML text that strictly obeys basic syntax rules, allowing parsers to build a tree structure. *Fatal Error Policy* — The XML rule requiring software to stop parsing immediately when a syntax error is found.\n\n**Takeaway:** Well-formedness is the non-negotiable syntactic baseline required before any schema validation can occur.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Tier 1 Validation: XML Well-Formedness and Parser Mechanics", "questiontext": "<p>How do XML parsers behave when encountering a syntax error, unlike web browsers rendering HTML?</p>", "generalfeedback": "<p>Well-formedness is the non-negotiable syntactic baseline required before any schema validation can occur.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>XML parsers enforce a strict fatal error policy and immediately stop parsing without guessing user intent.</p>", "feedback": "<p>Correct. Unlike lenient web browsers that attempt error recovery, XML parsers mandate strict well-formedness to ensure unambiguous tree parsing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XML parsers automatically correct missing tags and rewrite the user's files.</p>", "feedback": "<p>Incorrect. Parsers never rewrite files; they halt and report fatal syntax errors to preserve data integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XML parsers send an automated notification to local law enforcement authorities.</p>", "feedback": "<p>Incorrect. Parser errors are standard programming feedback, not legal infractions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XML parsers continue parsing and convert broken tags into emoji icons.</p>", "feedback": "<p>Incorrect. XML parsing halts immediately upon detecting malformed syntax.</p>"}]}}, {"step": 5, "title": "Tier 2 Validation: Grammar-Based Schemas with RELAX NG", "content": "**Tier 2 Validation: Grammar-Based Schemas with RELAX NG**\n\nOnce your file is well-formed, Tier 2 evaluates its **validity**. A well-formed XML file can still contain invented tags like `<magic>` or `<cookie>`. Tier 2 checks your markup against a formal schema.\n\nIn the TEI community, the standard schema is **RELAX NG**. RELAX NG defines the allowed tags and grammar for an edition:\n\n- It controls which elements may appear inside other elements.\n- It specifies the required sequence of child elements.\n- It defines which attributes are permitted on specific tags.\n- It checks data types for attribute values, such as dates.\n\nIn this course, we test files against `msdesc.rng` or `tei_all.rng`. If Andromeda puts a `<p>` inside `<extent>`, RELAX NG catches it. The tool flags the mistake right away.\n\n**Vocabulary.** *RELAX NG* — A powerful, modern schema language used by the TEI to specify element structures and attributes. *Schema Validity* — Conforming strictly to the structure rules and element rules of an official schema.\n\n**Takeaway:** RELAX NG schemas enforce the structure rules, element ordering, and attribute types of your digital edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Tier 2 Validation: Grammar-Based Schemas with RELAX NG", "questiontext": "<p>What structural features does a RELAX NG schema enforce in a TEI digital edition?</p>", "generalfeedback": "<p>RELAX NG schemas enforce the structure rules, element ordering, and attribute types of your digital edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Allowed elements, child element sequences, permitted attributes, and data types like ISO dates.</p>", "feedback": "<p>Correct. RELAX NG defines the formal grammar of an edition, verifying structural hierarchy and attribute constraints.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The literary quality of the primary document's poetic metaphors.</p>", "feedback": "<p>Incorrect. Schemas validate formal XML structure, not the aesthetic value of historical poetry.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The market resale value of the physical manuscript at auction.</p>", "feedback": "<p>Incorrect. Schemas evaluate digital data formatting, not commercial manuscript valuations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The physical weight of the paper used in the author's laptop printer.</p>", "feedback": "<p>Incorrect. RELAX NG is a digital schema language with no connection to printer paper specifications.</p>"}]}}, {"step": 6, "title": "The Limits of Grammar: What RELAX NG Cannot Catch", "content": "**The Limits of Grammar: What RELAX NG Cannot Catch**\n\nRELAX NG checks structure rules well. But it has natural blind spots. RELAX NG cannot easily test conditional relationships across different parts of a file.\n\nConsider these common editorial needs:\n\n- If a `<persName>` has `type=\"deputy\"`, it should require a `@ref` pointing to a person in the header.\n- If a `<date>` tag contains text, its `@when` attribute should match the ISO format `YYYY-MM-DD`.\n- If an editor tags a `<corr>` element, there must be a matching `<sic>` element inside a parent `<choice>`.\n- Every local reference (such as `who=\"#editor\"`) must resolve to a real `xml:id` defined in the file.\n\nRELAX NG evaluates tags in isolation. It cannot evaluate complex conditional rules. To enforce these editorial guidelines, we need Tier 3 validation: Schematron.\n\n**Vocabulary.** *Co-Occurrence Constraint* — A rule where the presence or value of one attribute depends on another attribute. *Context Rule* — An editorial condition that cannot be expressed purely through hierarchical tree grammar.\n\n**Takeaway:** Grammar schemas cannot enforce cross-element conditional rules, creating the need for rule-based Schematron validation.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: The Limits of Grammar: What RELAX NG Cannot Catch", "questiontext": "<p>Which type of editorial constraint exceeds the capabilities of pure RELAX NG grammar schemas?</p>", "generalfeedback": "<p>Grammar schemas cannot enforce cross-element conditional rules, creating the need for rule-based Schematron validation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Conditional rules across elements, such as requiring `@ref` when `type=\"deputy\"` or matching `@orig` with `@reg`.</p>", "feedback": "<p>Correct. Grammar schemas evaluate elements in isolation and cannot easily enforce conditional co-occurrence rules or cross-references.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Checking whether an element has a closing tag.</p>", "feedback": "<p>Incorrect. Checking closing tags is basic Tier 1 well-formedness handled by all XML parsers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Checking whether element names use uppercase or lowercase letters.</p>", "feedback": "<p>Incorrect. RELAX NG schemas easily enforce exact case sensitivity on element names.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Detecting whether a file is saved on a hard drive or a USB thumb drive.</p>", "feedback": "<p>Incorrect. Schemas validate text contents, not storage drive hardware types.</p>"}]}}, {"step": 7, "title": "Tier 3 Validation: ISO Schematron (ISO/IEC 19757-3)", "content": "**Tier 3 Validation: ISO Schematron (ISO/IEC 19757-3)**\n\n**Schematron** is a rule-based validation language. It is standardized under ISO/IEC 19757-3. RELAX NG describes an entire document tree from the top down. In contrast, Schematron makes targeted queries using XPath.\n\nSchematron searches for specific patterns in text. When it finds a tag, it tests an assertion. If that test fails, Schematron prints a clear note. Project editors write these notes in plain English.\n\nThis makes Schematron friendly for scholars. Traditional parser warnings can be cryptic, like `element choice unexpected at this position`. Schematron prints plain language:\n\n> \"Error in French decree line 24: Every <orig> tag must be accompanied by a <reg> tag inside <choice>.\"\n\nSchematron acts as an automated editorial supervisor. It checks project guidelines with high precision.\n\n**Vocabulary.** *Schematron* — An ISO standard rule-based XML validation language based on XPath assertions. *XPath* — A query language used to select elements and evaluate expressions inside an XML document.\n\n**Takeaway:** Schematron uses XPath to enforce project-specific editorial rules and emit plain-language error messages.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: Tier 3 Validation: ISO Schematron (ISO/IEC 19757-3)", "questiontext": "<p>How does Schematron differ from RELAX NG in evaluating XML documents?</p>", "generalfeedback": "<p>Schematron uses XPath to enforce project-specific editorial rules and emit plain-language error messages.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Schematron uses XPath to query targeted patterns and test assertions, outputting human-authored error messages.</p>", "feedback": "<p>Correct. Schematron selects nodes using XPath expressions and tests specific conditions, reporting friendly project-specific errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Schematron converts all XML files into relational SQL database tables.</p>", "feedback": "<p>Incorrect. Schematron is an XML validation language, not a database transformation utility.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Schematron requires an active subscription to commercial cloud software.</p>", "feedback": "<p>Incorrect. Schematron is an open ISO standard that runs locally with open-source tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Schematron only runs on documents written in Classical Greek.</p>", "feedback": "<p>Incorrect. Schematron validates any well-formed XML document regardless of language.</p>"}]}}, {"step": 8, "title": "Authoring Schematron Rules for Scholarly Editions", "content": "**Authoring Schematron Rules for Scholarly Editions**\n\nWriting Schematron rules is straightforward. A Schematron file contains three main building blocks: patterns, rules, and assertions.\n\nHere is a practical Schematron rule designed for our class editions:\n\n```xml\n<pattern id=\"check-dates\">\n  <rule context=\"tei:date[@when]\">\n    <assert test=\"matches(@when, '^\\d{4}(-\\d{2}(-\\d{2})?)?$')\">\n      The @when attribute must follow ISO format: YYYY, YYYY-MM, or YYYY-MM-DD.\n    </assert>\n  </rule>\n</pattern>\n```\n\nLet us look at how this works:\n\n- `<rule context=\"...\">`: Specifies the target elements. It selects every `<date>` tag that has a `@when` attribute.\n- `<assert test=\"...\">`: States the mandatory condition that must evaluate to true. Here, it checks that the date matches standard year, month, and day patterns.\n- Error Message: The text inside `<assert>` is displayed to the student if the test fails.\n\nWhen Olyvia types `when=\"Feb 13 1967\"`, Schematron catches the informal date format. It tells her how to fix it.\n\n**Vocabulary.** *Rule Context* — The XPath selector identifying which XML elements a Schematron rule applies to. *Schematron Assertion* — A condition that must be true; if false, its enclosed warning message is displayed.\n\n**Takeaway:** Schematron patterns select target elements and test assertions, guiding editors with helpful error messages.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Authoring Schematron Rules for Scholarly Editions", "questiontext": "<p>What is the function of the `<assert>` element in a Schematron rule?</p>", "generalfeedback": "<p>Schematron patterns select target elements and test assertions, guiding editors with helpful error messages.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It defines a mandatory test condition that must be true; if false, its human-readable error message is displayed.</p>", "feedback": "<p>Correct. The `assert` element tests an XPath condition and prints its enclosed message whenever that condition evaluates to false.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically generates digital images of missing manuscript folios.</p>", "feedback": "<p>Incorrect. Schematron tests text rules; it does not generate visual imagery.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes any XML tag that contains spelling mistakes.</p>", "feedback": "<p>Incorrect. Schematron reports validation warnings but does not delete user markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It encrypts the document so that peer reviewers cannot read it.</p>", "feedback": "<p>Incorrect. Schematron is a transparent testing tool that facilitates open peer review.</p>"}]}}, {"step": 9, "title": "Enforcing Cross-Reference and Identifier Integrity", "content": "**Enforcing Cross-Reference and Identifier Integrity**\n\nOne of the best uses of Schematron is enforcing **identifier integrity**. In TEI XML, elements point to each other using internal links. Examples include `@ref=\"#cope\"` or `@who=\"#editor\"`.\n\nSuppose Andromeda points to `#cope` in the treaty text. But she forgot to define `xml:id=\"cope\"` in the `<teiHeader>`. The link is broken. RELAX NG cannot detect this missing link.\n\nA simple Schematron rule checks every internal reference automatically:\n\n```xml\n<pattern id=\"check-internal-links\">\n  <rule context=\"tei:*[@ref[starts-with(., '#')]]\">\n    <assert test=\"//tei:*[@xml:id = substring-after(current()/@ref, '#')]\">\n      Broken reference: The target '<value-of select=\"@ref\"/>' does not match any xml:id in this edition.\n    </assert>\n  </rule>\n</pattern>\n```\n\nThis automated check protects your edition. It verifies that all person, place, and organization references resolve to valid entities before you publish.\n\n**Vocabulary.** *Identifier Integrity* — Guaranteeing that every local pointer or reference resolves to a valid, existing `xml:id`. *value-of* — A Schematron tag that inserts the value of an attribute directly into an error message.\n\n**Takeaway:** Schematron rules verify that all internal links and person references resolve to defined identifiers in your edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Enforcing Cross-Reference and Identifier Integrity", "questiontext": "<p>How does Schematron protect identifier integrity across a digital edition?</p>", "generalfeedback": "<p>Schematron rules verify that all internal links and person references resolve to defined identifiers in your edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It verifies that internal pointers like `@ref=\"#cope\"` resolve to matching `xml:id` definitions in the `<teiHeader>`.</p>", "feedback": "<p>Correct. Schematron uses XPath to ensure every internal hash reference points to an existing defined identifier in the document.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents students from using personal pronouns in their essays.</p>", "feedback": "<p>Incorrect. Schematron verifies XML attribute pointers, not essay writing style.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It assigns random serial numbers to every paragraph on the page.</p>", "feedback": "<p>Incorrect. Schematron tests existing attributes; it does not inject random serial numbers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It removes all hyperlinks to external library websites.</p>", "feedback": "<p>Incorrect. Schematron verifies link validity rather than removing links.</p>"}]}}, {"step": 10, "title": "Validating Linguistic and Attribute Co-Occurrences", "content": "**Validating Linguistic and Attribute Co-Occurrences**\n\nIn Module 8, you added linguistic tags to your witness. You marked words with `<w lemma=\"...\" pos=\"...\">`. Maintaining consistency across thousands of words requires automated testing.\n\nSchematron easily enforces linguistic markup consistency:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Editorial Rule</th>\n<th>Schematron Assertion</th>\n<th>What It Prevents</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Lemma Completeness</strong></td>\n<td><code>test=\"@lemma and string-length(@lemma) > 0\"</code></td>\n<td>Prevents tagging a word with `<w>` while forgetting its dictionary headword.</td>\n</tr>\n<tr>\n<td><strong>Valid POS Tags</strong></td>\n<td><code>test=\"@pos = ('NOUN', 'VERB', 'ADJ', 'PRON', 'DET', 'ADP')\"</code></td>\n<td>Catches typos like `pos=\"VERBB\"` or non-standard part-of-speech codes.</td>\n</tr>\n<tr>\n<td><strong>Regularization Pairs</strong></td>\n<td><code>test=\"tei:orig and tei:reg\"</code></td>\n<td>Ensures `<choice>` elements include both historical original and regularized form.</td>\n</tr>\n</tbody>\n</table>\n\nWhen Ace encodes French decree verbs, these checks confirm every inflected form. Each word links to its canonical infinitive.\n\n**Vocabulary.** *Linguistic Consistency* — Ensuring that all words share standardized grammatical categories and canonical lemmas. *Attribute Whitelist* — An explicit list of permitted values checked by a validation rule.\n\n**Takeaway:** Schematron guards linguistic annotations by checking that words carry canonical lemmas and valid part-of-speech codes.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Validating Linguistic and Attribute Co-Occurrences", "questiontext": "<p>Why is Schematron valuable for auditing grammatical lemmatization markup in `<w>` tags?</p>", "generalfeedback": "<p>Schematron guards linguistic annotations by checking that words carry canonical lemmas and valid part-of-speech codes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It confirms that words marked as verbs or nouns carry non-empty canonical lemmas and valid part-of-speech codes.</p>", "feedback": "<p>Correct. Schematron verifies that linguistic attributes like `@lemma` and `@pos` are consistently populated and conform to approved whitelists.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates historical verbs into colloquial modern slang.</p>", "feedback": "<p>Incorrect. Schematron validates grammatical annotation consistency; it does not modernize historical vocabulary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It counts the number of letters in every word and reorders them alphabetically.</p>", "feedback": "<p>Incorrect. Schematron checks markup rules without altering text order.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forbids editors from tagging more than ten verbs per manuscript page.</p>", "feedback": "<p>Incorrect. Schematron enforces data quality rather than arbitrary quantitative caps.</p>"}]}}, {"step": 11, "title": "Compiling and Executing Schematron via XSLT Engines", "content": "**Compiling and Executing Schematron via XSLT Engines**\n\nYou might wonder how a computer runs Schematron. Behind the scenes, Schematron relies on XSLT (Extensible Stylesheet Language Transformations).\n\nA Schematron file (`.sch`) compiles into an XSLT stylesheet. It uses a standard three-stage pipeline. When that compiled XSLT runs against your TEI document, it outputs an SVRL report. SVRL stands for Schematron Validation Report Language.\n\nIn practice, you run Schematron in the terminal using **Jing**:\n\n```bash\njing -c schema.rnc witness.xml\njing schema.sch witness.xml\n```\n\nJing reads the Schematron file. It scans your TEI document. It prints line numbers for every rule violation. This terminal command lets us automate validation inside build scripts and CI pipelines.\n\n**Vocabulary.** *Jing* — An open-source command-line validator for RELAX NG and Schematron schemas written by James Clark. *SVRL* — Schematron Validation Report Language, the standard XML format used to report Schematron results.\n\n**Takeaway:** Tools like Jing execute Schematron rules on the command line, enabling automated validation in scripts and CI pipelines.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Compiling and Executing Schematron via XSLT Engines", "questiontext": "<p>Which command-line utility is standard for executing RELAX NG and Schematron validation in terminal workflows?</p>", "generalfeedback": "<p>Tools like Jing execute Schematron rules on the command line, enabling automated validation in scripts and CI pipelines.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>`jing`</p>", "feedback": "<p>Correct. James Clark's open-source `jing` validator processes both RELAX NG schemas and Schematron rule files directly in the terminal.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>`photoshop`</p>", "feedback": "<p>Incorrect. Adobe Photoshop is an image manipulation program, not an XML schema validator.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>`curl`</p>", "feedback": "<p>Incorrect. `curl` transfers data across network protocols; it does not validate XML schemas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>`ping`</p>", "feedback": "<p>Incorrect. `ping` tests network connectivity between computers, not XML validation.</p>"}]}}, {"step": 12, "title": "Introduction to Continuous Integration (CI/CD) for Digital Humanities", "content": "**Introduction to Continuous Integration (CI/CD) for Digital Humanities**\n\nRunning `xmllint` and `jing` by hand in the terminal is a good habit. But people are forgetful. An editor working late at night might push a commit without running tests.\n\nModern software engineering solves this with **Continuous Integration (CI)**. Continuous Integration is the practice of automatically testing a project every time code is pushed to a shared repository.\n\nIn digital editing, CI acts as an automated gatekeeper. When Ace, Olyvia, or Andromeda pushes a commit, a cloud runner starts. It downloads the files. It runs `xmllint`. It checks Relax NG. It tests Schematron rules.\n\nIf all checks pass, the commit gets a green check (`✔`). If any check fails, it gets a red cross (`✖`). The author gets an alert right away.\n\n**Vocabulary.** *Continuous Integration (CI)* — Automating tests and validation checks on a cloud server whenever repository commits are pushed. *CI Pipeline* — The sequence of automated steps executed by a CI server to verify project integrity.\n\n**Takeaway:** Continuous Integration automatically tests every commit in the cloud, guaranteeing that broken files never go unnoticed.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Introduction to Continuous Integration (CI/CD) for Digital Humanities", "questiontext": "<p>What is the primary function of Continuous Integration in a collaborative digital edition?</p>", "generalfeedback": "<p>Continuous Integration automatically tests every commit in the cloud, guaranteeing that broken files never go unnoticed.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Automatically running tests and validation checks on a cloud server whenever commits are pushed to the repository.</p>", "feedback": "<p>Correct. CI acts as an automated gatekeeper, testing every commit to ensure broken markup or invalid schemas are detected immediately.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Automatically printing physical paper books and shipping them to local bookstores.</p>", "feedback": "<p>Incorrect. CI automates software testing and digital builds, not physical commercial distribution.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replacing human historians with automated conversational chatbots.</p>", "feedback": "<p>Incorrect. CI provides technical quality control to support human scholars, not replace them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Preventing team members from making commits outside of scheduled class hours.</p>", "feedback": "<p>Incorrect. CI runs anytime a commit is pushed, supporting asynchronous collaboration.</p>"}]}}, {"step": 13, "title": "Anatomy of a GitHub Actions Workflow", "content": "**Anatomy of a GitHub Actions Workflow**\n\nOn GitHub, Continuous Integration is provided through **GitHub Actions**. A workflow is an automated procedure. It is defined in a YAML configuration file stored at `.github/workflows/validate.yml`.\n\nA GitHub Actions workflow consists of four core concepts:\n\n1. **Events (Triggers):** What starts the workflow? Common triggers are a `push` to `main` or opening a `pull_request`.\n2. **Runners:** The virtual machine that executes your tests (such as `ubuntu-latest`, a clean Linux cloud server).\n3. **Jobs:** A collection of steps executed on the runner.\n4. **Steps:** Individual tasks, such as checking out code, installing software, or running terminal commands.\n\nWorkflows are saved as plain text files in your repository. Therefore, your testing rules are version-controlled alongside your text.\n\n**Vocabulary.** *GitHub Actions* — GitHub's built-in platform for automating software workflows, testing, and continuous integration. *Workflow YAML* — A human-readable configuration file specifying triggers, environments, and test commands.\n\n**Takeaway:** GitHub Actions workflows are version-controlled YAML files that define automated testing triggers and commands.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Anatomy of a GitHub Actions Workflow", "questiontext": "<p>Where are GitHub Actions workflows configured inside a project repository?</p>", "generalfeedback": "<p>GitHub Actions workflows are version-controlled YAML files that define automated testing triggers and commands.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Inside `.github/workflows/` as human-readable YAML configuration files.</p>", "feedback": "<p>Correct. Workflows live in `.github/workflows/*.yml`, version-controlled right alongside your edition source text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside the computer's BIOS firmware chip.</p>", "feedback": "<p>Incorrect. Workflows are standard text files stored in the Git repository.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside an unversioned Word document saved on the instructor's desktop.</p>", "feedback": "<p>Incorrect. Workflows must be saved inside `.github/workflows/` so GitHub can execute them automatically.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside a temporary browser cookie that expires after twenty minutes.</p>", "feedback": "<p>Incorrect. Workflows are permanent repository assets tracked in Git history.</p>"}]}}, {"step": 14, "title": "Writing a Complete TEI Validation Workflow", "content": "**Writing a Complete TEI Validation Workflow**\n\nLet us examine a complete GitHub Actions workflow for a TEI digital edition.\n\nHere is `.github/workflows/validate.yml`:\n\n```yaml\nname: TEI Edition Validation Gate\n\non:\n  push:\n    branches: [ main ]\n  pull_request:\n    branches: [ main ]\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository code\n        uses: actions/checkout@v4\n\n      - name: Install XML validation tools\n        run: sudo apt-get update && sudo apt-get install -y libxml2-utils jing\n\n      - name: Verify XML Well-Formedness\n        run: xmllint --noout witness.xml\n\n      - name: Validate TEI Relax NG Schema\n        run: jing schemas/msdesc.rng witness.xml\n```\n\nNotice how clean this is. Every step matches commands you already ran locally. The cloud runner boots up, installs `xmllint` and `jing`, and runs your tests in under twenty seconds.\n\n**Vocabulary.** *actions/checkout* — A standard GitHub action that downloads your repository code onto the cloud virtual machine. *ubuntu-latest* — The default Linux cloud environment provided by GitHub for running automated jobs.\n\n**Takeaway:** A twenty-line YAML file configures GitHub Actions. It installs XML tools and tests your files on every push.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Writing a Complete TEI Validation Workflow", "questiontext": "<p>What sequence of actions does a basic TEI validation workflow execute on GitHub Actions?</p>", "generalfeedback": "<p>A twenty-line YAML file configures GitHub Actions. It installs XML tools and tests your files on every push.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Checking out the repository code, installing XML tools like `libxml2-utils` and `jing`, and running `xmllint` and schema checks.</p>", "feedback": "<p>Correct. A standard workflow checks out files, sets up command-line validators, and tests the XML for well-formedness and schema validity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Formatting the hard drive, reinstalling the operating system, and shutting down the server.</p>", "feedback": "<p>Incorrect. Workflows run harmless software checks inside isolated cloud containers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Downloading video games and broadcasting live streams to social media.</p>", "feedback": "<p>Incorrect. GitHub Actions runners execute specified testing commands for project validation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating the repository into Morse code and transmitting it over radio waves.</p>", "feedback": "<p>Incorrect. The workflow tests XML files using standard command-line tools.</p>"}]}}, {"step": 15, "title": "Integrating Community Validation Actions", "content": "**Integrating Community Validation Actions**\n\nBesides running raw terminal commands, you can use shared actions. The open-source digital humanities community shares many useful tools.\n\nFor instance, the TEI community shares actions that download official schemas automatically. You do not need to store large schema files in your repository. Instead, a workflow step fetches the canonical schema:\n\n```yaml\n      - name: Download Canonical TEI All Schema\n        run: curl -s https://tei-c.org/release/xml/tei/custom/schema/relaxng/tei_all.rng -o tei_all.rng\n```\n\nRemote schema downloads ensure you test against official releases. This keeps your repo small. It also ensures international standards compliance.\n\n**Vocabulary.** *Community Action* — A reusable workflow component published on the GitHub Actions Marketplace. *Canonical Schema URL* — The official, permanent web address where authoritative schema definitions are hosted.\n\n**Takeaway:** Community actions and remote schema downloads keep repository sizes small while validating against official TEI releases.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Integrating Community Validation Actions", "questiontext": "<p>Why is fetching canonical schemas directly from authoritative URLs advantageous in CI workflows?</p>", "generalfeedback": "<p>Community actions and remote schema downloads keep repository sizes small while validating against official TEI releases.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It keeps repository file sizes small while guaranteeing validation against official international TEI P5 releases.</p>", "feedback": "<p>Correct. Downloading official schemas during workflow runs prevents bloat in your repository and ensures tests use canonical definitions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents classmates from viewing your repository source code.</p>", "feedback": "<p>Incorrect. Remote schema fetching does not alter repository visibility settings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It eliminates the need to write TEI XML tags in your document.</p>", "feedback": "<p>Incorrect. Schemas validate XML tags; they do not write markup for you.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It charges commercial licensing fees to the university department.</p>", "feedback": "<p>Incorrect. Official TEI schemas are completely free and open-source.</p>"}]}}, {"step": 16, "title": "Associating Documents and Schemas: `<?xml-model?>`", "content": "**Associating Documents and Schemas: `<?xml-model?>`**\n\nHow does a computer know which schema belongs to an XML document? In TEI P5, we associate schemas using **processing notes**. We place them at the very top of the file, before `<TEI>`.\n\nA standard TEI document begins with `<?xml-model?>` declarations:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?xml-model href=\"schemas/msdesc.rng\" type=\"application/xml\" schematypens=\"http://relaxng.org/ns/structure/1.0\"?>\n<?xml-model href=\"schemas/rules.sch\" type=\"application/xml\" schematypens=\"http://purl.oclc.org/dsdl/schematron\"?>\n<TEI xmlns=\"http://www.tei-c.org/ns/1.0\">\n```\n\nNotice that we include two separate `<?xml-model?>` lines:\n\n- The first line links the Relax NG structural schema (`.rng`).\n- The second line links the Schematron rule file (`.sch`).\n\nWhen VS Code or automated validators open your document, they read these lines. They automatically apply both validation tiers.\n\n**Vocabulary.** *Processing Note* — A special XML declaration (`<?...?>`) providing instructions to software processing the document. *xml-model* — The standard W3C processing instruction that associates an XML file with its schema.\n\n**Takeaway:** The xml-model processing instruction links both Relax NG and Schematron schemas directly inside the XML document header.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Associating Documents and Schemas: `<?xml-model?>`", "questiontext": "<p>Where should `<?xml-model?>` processing instructions be placed within a TEI document?</p>", "generalfeedback": "<p>The xml-model processing instruction links both Relax NG and Schematron schemas directly inside the XML document header.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>At the very top of the file, immediately after the XML declaration and before the root `<TEI>` element.</p>", "feedback": "<p>Correct. Processing instructions belong in the file prolog before the root element so editors and tools can discover schemas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside the `<teiHeader>` revision log as a `<change>` entry.</p>", "feedback": "<p>Incorrect. Processing instructions belong in the file prolog before `<TEI>`, not inside child elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>At the very end of the file, after the closing `</TEI>` tag.</p>", "feedback": "<p>Incorrect. XML parsers require all content except comments to precede or exist inside the single root element.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside an external CSS stylesheet file.</p>", "feedback": "<p>Incorrect. The `<?xml-model?>` declaration is an XML processing instruction that lives in the XML document itself.</p>"}]}}, {"step": 17, "title": "Converting CI Failures to Inline GitHub Annotations", "content": "**Converting CI Failures to Inline GitHub Annotations**\n\nWhen a CI workflow fails on GitHub, finding the error is easy. You do not have to read thousands of lines of terminal logs.\n\nGitHub Actions turns validation output into visual **annotations**. When `xmllint` or `jing` reports an error on line 64, GitHub flags that line. It shows a yellow warning or red error badge in the pull request diff.\n\nClicking on the badge opens the exact message:\n\n> \"Error: element persName missing required attribute ref at line 64, column 12.\"\n\nThis quick feedback loop helps authors fix mistakes fast. You see the line. You read the error. You fix it in VS Code and push an update.\n\n**Vocabulary.** *GitHub Annotation* — A visual inline alert displayed on a pull request diff highlighting the line where a CI test failed. *Feedback Loop* — The rapid cycle of making changes, receiving automated test results, and correcting mistakes.\n\n**Takeaway:** GitHub CI automatically displays validation errors as inline visual annotations on the exact lines that caused the failure.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Converting CI Failures to Inline GitHub Annotations", "questiontext": "<p>How does GitHub Actions display validation failures to pull request reviewers?</p>", "generalfeedback": "<p>GitHub CI automatically displays validation errors as inline visual annotations on the exact lines that caused the failure.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>As visual inline annotations highlighting the exact line of code where the error occurred in the diff.</p>", "feedback": "<p>Correct. GitHub translates compiler errors into clickable inline badges directly on conflicted or failing lines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By sending a physical printed postcard through the postal service.</p>", "feedback": "<p>Incorrect. Alerts are displayed digitally within the web pull request interface.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By locking the user out of their computer operating system.</p>", "feedback": "<p>Incorrect. CI errors are informational warnings displayed within GitHub.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the pull request automatically without saving logs.</p>", "feedback": "<p>Incorrect. Pull requests remain open and preserve detailed logs so authors can inspect and fix errors.</p>"}]}}, {"step": 18, "title": "Protecting Branches with Automated CI Merge Gates", "content": "**Protecting Branches with Automated CI Merge Gates**\n\nRunning automated tests is useful. But what prevents someone from merging broken code anyway? The answer is **Branch Protection Rules**.\n\nGitHub lets repository owners set protection rules on the `main` branch:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Protection Setting</th>\n<th>What It Enforces</th>\n<th>Scholarly Benefit</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Require status checks to pass</strong></td>\n<td>The green \"Merge\" button is disabled until the validation workflow passes with 0 errors.</td>\n<td>Guarantees that broken XML or invalid schemas can never enter the official master text.</td>\n</tr>\n<tr>\n<td><strong>Require pull request reviews</strong></td>\n<td>At least one peer reviewer must formally approve the PR before merging.</td>\n<td>Ensures all textual changes receive human scholarly review.</td>\n</tr>\n<tr>\n<td><strong>Do not allow bypassing</strong></td>\n<td>Applies the rules to repository administrators and instructors as well.</td>\n<td>Enforces equal accountability and disciplined version-control habits across the team.</td>\n</tr>\n</tbody>\n</table>\n\nWith branch protection on, your CI pipeline becomes a mandatory gate. Quality rules are enforced automatically by software.\n\n**Vocabulary.** *Branch Protection Rule* — A safety rule on GitHub that blocks direct pushes and prevents merging until checks pass. *Merge Gate* — A mandatory validation test that must succeed before a pull request can be merged.\n\n**Takeaway:** Branch protection rules disable the merge button until all automated validation tests pass with zero errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Protecting Branches with Automated CI Merge Gates", "questiontext": "<p>How do Branch Protection Rules prevent broken XML from reaching production editions?</p>", "generalfeedback": "<p>Branch protection rules disable the merge button until all automated validation tests pass with zero errors.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They disable the green \"Merge\" button on pull requests until all required automated validation checks pass with zero errors.</p>", "feedback": "<p>Correct. Protection rules enforce quality gates, ensuring that failing or invalid code cannot be merged into the master branch.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete the entire repository whenever a student types a syntax error.</p>", "feedback": "<p>Incorrect. Branch protection guards the main branch; it never deletes repositories.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They require students to pay a cash deposit before creating a branch.</p>", "feedback": "<p>Incorrect. Branch protection is a free repository security setting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They prevent instructors from viewing student homework submissions.</p>", "feedback": "<p>Incorrect. Branch protection enforces merge criteria; it does not restrict read access.</p>"}]}}, {"step": 19, "title": "Automated Preview and Artifact Compilation in CI", "content": "**Automated Preview and Artifact Compilation in CI**\n\nContinuous Integration does more than catch mistakes. Modern digital projects use CI to **compile edition artifacts** automatically on every push.\n\nIn Module 7, you made stylesheets to turn TEI XML into HTML reading views. In this course, we also compile printable PDF notes. You can configure GitHub Actions to build these views automatically:\n\n```yaml\n      - name: Compile HTML Reading View\n        run: python3 scripts/generate_reading_view.py witness.xml dist/index.html\n\n      - name: Deploy Preview to GitHub Pages\n        uses: peaceiris/actions-gh-pages@v3\n        with:\n          github_token: ${{ secrets.GITHUB_TOKEN }}\n          publish_dir: ./dist\n```\n\nWhen a pull request merges into `main`, GitHub Actions rebuilds the reading view. It publishes the pages to GitHub Pages. Reviewers can read the live edition in any browser.\n\n**Vocabulary.** *Artifact Compilation* — Automatically transforming raw TEI XML source files into user-friendly formats like HTML or PDF. *GitHub Pages* — A free hosting service provided by GitHub to serve static websites directly from a repository.\n\n**Takeaway:** CI workflows can automatically transform raw TEI XML into web reading views and publish them live to GitHub Pages.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Automated Preview and Artifact Compilation in CI", "questiontext": "<p>In addition to validation, what artifact compilation tasks can GitHub Actions automate upon merge?</p>", "generalfeedback": "<p>CI workflows can automatically transform raw TEI XML into web reading views and publish them live to GitHub Pages.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Transforming TEI XML into HTML reading views and deploying preview websites live to GitHub Pages.</p>", "feedback": "<p>Correct. CI pipelines can run stylesheet transformations and publish static web previews automatically whenever main updates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Mining cryptocurrency tokens in the background on university servers.</p>", "feedback": "<p>Incorrect. University and GitHub policies strictly forbid cryptocurrency mining.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Purchasing physical antique parchment from rare manuscript dealers.</p>", "feedback": "<p>Incorrect. CI workflows execute computational file processing, not commercial purchases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all previous versions of the primary manuscript image.</p>", "feedback": "<p>Incorrect. CI workflows build derivative reading views while preserving all source assets.</p>"}]}}, {"step": 20, "title": "The Boundary Between Automated Linting and Human Peer Review", "content": "**The Boundary Between Automated Linting and Human Peer Review**\n\nAutomated CI pipelines are powerful, but they have natural limits. Software verifies whether XML is well-formed. It checks whether attributes follow a schema. It verifies whether links resolve.\n\nHowever, software cannot determine whether your transcription is **true**:\n\n- Software cannot tell whether a scribal stroke in Maud Lewis's letter is an *e* or an *o*.\n- Software cannot know whether an omitted word in Ace's French decree was deliberate or accidental.\n- Software cannot evaluate whether Andromeda chose the best treaty translation.\n\nAutomated linting handles the basic mechanics. This frees human reviewers to focus on paleographical judgment, historical context, and scholarly rigor.\n\n**Vocabulary.** *Basic Mechanics* — The basic syntactic and grammatical correctness verified automatically by software. *Scholarly Insight* — The critical human evaluation of historical evidence, paleography, and context.\n\n**Takeaway:** Software enforces mechanical validity, freeing human scholars to focus on paleographical judgment and historical interpretation.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: The Boundary Between Automated Linting and Human Peer Review", "questiontext": "<p>What critical dimension of digital scholarship can human peer reviewers assess that automated linters cannot?</p>", "generalfeedback": "<p>Software enforces mechanical validity, freeing human scholars to focus on paleographical judgment and historical interpretation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Whether the transcription accurately represents the physical manuscript handwriting and historical context.</p>", "feedback": "<p>Correct. Linters check syntactic and schema rules; only human scholars can judge paleographical readings and historical accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whether the file contains balanced angle brackets.</p>", "feedback": "<p>Incorrect. Automated linters easily verify balanced angle brackets and XML well-formedness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whether the file was saved with UTF-8 character encoding.</p>", "feedback": "<p>Incorrect. Character encoding is easily checked and verified by automated tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whether the file has an `.xml` extension.</p>", "feedback": "<p>Incorrect. File extensions are trivial for software to inspect.</p>"}]}}, {"step": 21, "title": "Designing a Structured TEI Peer-Review Rubric", "content": "**Designing a Structured TEI Peer-Review Rubric**\n\nWhen reviewing a classmate's edition, helpful feedback requires a rubric. Without a rubric, reviews become vague comments like \"looks good to me!\"\n\nA scholarly review rubric evaluates four distinct layers:\n\n1. **Metadata and Codicology (`teiHeader`):** Are the repository, shelfmark, and license accurately recorded?\n2. **Diplomatic Fidelity (`<facsimile>` & `<text>`):** Do line breaks (`<lb/>`) and characters match the high-resolution manuscript image?\n3. **Editorial Normalization (`<choice>`):** Are regularized spellings and expanded abbreviations historically defensible?\n4. **Entity Markup & Linking (`<persName>`, `<placeName>`):** Do entity tags resolve to verifiable authority records like VIAF or Wikidata?\n\nThis structured rubric guides your evaluation during our in-class peer review exchange.\n\n**Vocabulary.** *Peer-Review Rubric* — A standardized set of criteria used to evaluate the scholarly and technical quality of an edition. *Editorial Layer* — A distinct level of annotation within a multi-tiered digital edition.\n\n**Takeaway:** A structured four-layer rubric ensures that peer review evaluates metadata, diplomatic fidelity, normalization, and entity markup.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Designing a Structured TEI Peer-Review Rubric", "questiontext": "<p>What four editorial layers should a structured peer-review rubric evaluate in our seminar editions?</p>", "generalfeedback": "<p>A structured four-layer rubric ensures that peer review evaluates metadata, diplomatic fidelity, normalization, and entity markup.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Metadata and codicology, diplomatic transcription fidelity, editorial normalization, and named-entity markup.</p>", "feedback": "<p>Correct. A complete scholarly audit examines the teiHeader, facsimile alignment, regularized choice tags, and entity links.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Screen resolution, internet download speed, keyboard model, and mouse sensitivity.</p>", "feedback": "<p>Incorrect. Those are hardware specifications, not scholarly digital edition criteria.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Page count, font color, printer paper size, and bookbinding glue.</p>", "feedback": "<p>Incorrect. Those are physical manufacturing features, not digital philology layers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Spelling, grammar, punctuation, and word count of personal diary entries.</p>", "feedback": "<p>Incorrect. The rubric evaluates structured TEI encoding layers and manuscript evidence.</p>"}]}}, {"step": 22, "title": "Auditing the `teiHeader` and Provenance Layer", "content": "**Auditing the `teiHeader` and Provenance Layer**\n\nThe first stage of peer review evaluates the `<teiHeader>`. The header is the identity card of the edition. If the header is incomplete, future scholars cannot cite the document reliably.\n\nWhen auditing a classmate's header, check these four items:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Header Component</th>\n<th>What to Verify</th>\n<th>Common Error to Flag</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code><titleStmt></code></td>\n<td>Author, title, and responsible student editor defined with `@xml:id`.</td>\n<td>Missing student editor name or placeholder \"Title goes here\" text.</td>\n</tr>\n<tr>\n<td><code><publicationStmt></code></td>\n<td>Clear open license (such as Creative Commons CC BY 4.0).</td>\n<td>Undefined availability or restrictive copyright claims.</td>\n</tr>\n<tr>\n<td><code><sourceDesc></code></td>\n<td>Holding archive, shelfmark, physical support, and date.</td>\n<td>Incomplete physical description or missing institution name.</td>\n</tr>\n<tr>\n<td><code><revisionDesc></code></td>\n<td>Chronological log of revisions recording commits and PRs.</td>\n<td>Empty revision history with no record of past editorial changes.</td>\n</tr>\n</tbody>\n</table>\n\nA complete header guarantees your edition follows FAIR principles (Findable, Accessible, Interoperable, and Reusable).\n\n**Vocabulary.** *sourceDesc* — The TEI Header element recording the physical holding institution, shelfmark, and provenance of the original witness. *FAIR Data Principles* — International guidelines ensuring digital scholarship is Findable, Accessible, Interoperable, and Reusable.\n\n**Takeaway:** Auditing the teiHeader verifies that physical holding archives, licenses, and revision histories are thoroughly documented.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Auditing the `teiHeader` and Provenance Layer", "questiontext": "<p>What essential information must be confirmed when auditing an edition's `<sourceDesc>`?</p>", "generalfeedback": "<p>Auditing the teiHeader verifies that physical holding archives, licenses, and revision histories are thoroughly documented.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The holding archive, physical shelfmark, material support, and historical date of the primary witness.</p>", "feedback": "<p>Correct. The `sourceDesc` must thoroughly document the physical artifact and holding institution to ensure scholarly citable provenance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The retail purchase price of the laptop used by the student transcriber.</p>", "feedback": "<p>Incorrect. `sourceDesc` describes the historical manuscript artifact, not modern laptop equipment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The personal home address of the archive security guard.</p>", "feedback": "<p>Incorrect. Personal staff addresses should never be included; privacy must be protected.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The weather forecast in Paris or Halifax on the day the file was committed.</p>", "feedback": "<p>Incorrect. Meteorological forecasts are irrelevant to archival witness identification.</p>"}]}}, {"step": 23, "title": "Auditing Diplomatic Transcription and Physical Milestones", "content": "**Auditing Diplomatic Transcription and Physical Milestones**\n\nThe second stage of peer review audits the diplomatic transcription against visual evidence. Open your classmate's manuscript image side by side with their TEI XML in VS Code.\n\nAs a reviewer, read the text line by line:\n\n- **Line Breaks (`<lb/>`):** Does every `<lb/>` tag match a physical line start on the page?\n- **Character Accuracy:** Did the transcriber misread letterforms, such as confusing long *s* with *f* in French?\n- **Damage and Ambiguity:** Are torn regions tagged with `<unclear>` or `<gap>`?\n- **Zone Links:** Does the `@facs` attribute point to the correct coordinate zone on the image?\n\nIf you spot an alternative reading, do not fix it in secret. Open a comment on GitHub. Explain what handwriting strokes support your reading.\n\n**Vocabulary.** *Diplomatic Audit* — A line-by-line verification comparing transcribed XML characters directly against high-resolution manuscript images. *Physical Milestone* — An empty XML tag (like `<pb/>` or `<lb/>`) marking a physical transition in the original witness.\n\n**Takeaway:** Auditing diplomatic transcription requires comparing every character, line break, and unclear stroke against high-resolution facsimiles.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Auditing Diplomatic Transcription and Physical Milestones", "questiontext": "<p>What is a primary task when auditing diplomatic transcription against high-resolution facsimiles?</p>", "generalfeedback": "<p>Auditing diplomatic transcription requires comparing every character, line break, and unclear stroke against high-resolution facsimiles.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verifying that every line break `<lb/>` matches a physical line on the page and that damaged strokes are tagged with `<unclear>`.</p>", "feedback": "<p>Correct. Reviewers compare transcribed text line by line against visual facsimiles, checking lineation and damage markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replacing all historical handwriting with modern computerized cursive fonts.</p>", "feedback": "<p>Incorrect. Diplomatic auditing verifies transcription accuracy, not font replacement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all line breaks to convert the historical document into a single long sentence.</p>", "feedback": "<p>Incorrect. Diplomatic editions strictly preserve physical line breaks using `<lb/>` milestones.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Cropping the manuscript image to remove all historical marginalia.</p>", "feedback": "<p>Incorrect. Marginalia provide crucial codicological evidence and must be preserved.</p>"}]}}, {"step": 24, "title": "Auditing Normalization, Rendering, and Stylesheets", "content": "**Auditing Normalization, Rendering, and Stylesheets**\n\nThe third stage of peer review evaluates editorial regularizations and reading stylesheets developed in Modules 6 and 7.\n\nInspect how your classmate regularized historical language:\n\n- **Symmetry of `<choice>`:** Does every `<choice>` contain a balanced pair (such as `<orig>` with `<reg>`, or `<abbr>` with `<expan>`)?\n- **Historical Accuracy:** In Ace's 1791 decree, did he accurately normalize Voltairean *-oit* spelling endings (such as *décrétoit* to *décrétait*)? In Andromeda's treaty, are 18th-century abbreviations expanded accurately?\n- **Stylesheet Legibility:** Open their HTML reading view in a browser. Does the CSS clearly distinguish between diplomatic and regularized views? Can readers toggle layers comfortably?\n\nA strong edition respects both historical authenticity and modern readability. Reviewers ensure that normalization rules were applied consistently rather than haphazardly.\n\n**Vocabulary.** *Regularization Audit* — Evaluating whether historical spelling changes and abbreviation expansions are applied consistently. *Reading View Toggle* — A stylesheet mechanism allowing readers to switch between diplomatic and modern reading modes.\n\n**Takeaway:** Auditing normalization ensures that historical spelling choices are linguistically sound and render clearly in stylesheets.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Auditing Normalization, Rendering, and Stylesheets", "questiontext": "<p>What should a reviewer check when evaluating editorial regularizations in `<choice>` tags?</p>", "generalfeedback": "<p>Auditing normalization ensures that historical spelling choices are linguistically sound and render clearly in stylesheets.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>That `<orig>` and `<reg>` pairs are symmetric, historically defensible, and render clearly in reading stylesheets.</p>", "feedback": "<p>Correct. Reviewers verify that historical forms and regularized readings are balanced, justified by policy, and displayed well in CSS.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That all historical spellings have been erased from the XML file permanently.</p>", "feedback": "<p>Incorrect. TEI `<choice>` preserves both original historical spelling and regularized form side by side.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the stylesheet only displays text in bright neon pink.</p>", "feedback": "<p>Incorrect. Reading stylesheets should prioritize legibility and scholarly clarity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That regularized words are translated into ancient Egyptian hieroglyphs.</p>", "feedback": "<p>Incorrect. Regularization normalizes historical orthography within the same language.</p>"}]}}, {"step": 25, "title": "Auditing Linguistic Markup and Named Entities", "content": "**Auditing Linguistic Markup and Named Entities**\n\nThe fourth stage of peer review evaluates the grammatical and named-entity annotations added in Modules 8 and 9.\n\nReview these semantic layers:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Annotation Layer</th>\n<th>Inspection Checklist</th>\n<th>Concrete Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Linguistic Markup (`<w>`)</strong></td>\n<td>Verify that part-of-speech tags and dictionary lemmas are accurate.</td>\n<td>Confirming *promis'd* has lemma *promise* and `pos=\"VERB\"`.</td>\n</tr>\n<tr>\n<td><strong>Named Entities</strong></td>\n<td>Check that people, places, and organizations are correctly tagged.</td>\n<td>Confirming `<persName>` wraps *Jean-Baptiste Cope* and `<placeName>` wraps *Chigabenakady*.</td>\n</tr>\n<tr>\n<td><strong>Authority Links</strong></td>\n<td>Click every `@ref` link to ensure it opens a real VIAF, GeoNames, or Wikidata page.</td>\n<td>Verifying that VIAF ID `61536214` resolves to François-Claude-Amour de Bouillé.</td>\n</tr>\n</tbody>\n</table>\n\nChecking authority links is vital. A broken VIAF link hurts your connection to Linked Open Data.\n\n**Vocabulary.** *Semantic Audit* — Verifying that grammatical tags, named entities, and authority record links represent true historical data. *Authority Link Resolution* — Confirming that external URIs (like VIAF or Wikidata) resolve to the correct real-world entity.\n\n**Takeaway:** Auditing linguistic and entity markup confirms that lemmas are canonical and authority links resolve to verified records.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Auditing Linguistic Markup and Named Entities", "questiontext": "<p>Why must reviewers test authority links (`@ref`) attached to `<persName>` and `<placeName>` tags?</p>", "generalfeedback": "<p>Auditing linguistic and entity markup confirms that lemmas are canonical and authority links resolve to verified records.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To ensure that links resolve to verified real-world entities in databases like VIAF, GeoNames, or Wikidata.</p>", "feedback": "<p>Correct. A broken or mismatched authority link corrupts the edition's connection to the Linked Open Data cloud.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To verify that the historical figures are currently active on social media platforms.</p>", "feedback": "<p>Incorrect. Authority records identify historical persons; they do not check contemporary social media accounts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To ensure that external websites pay advertising commissions to the university.</p>", "feedback": "<p>Incorrect. Linked Open Data authorities are non-profit public academic infrastructure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To confirm that all personal names are written entirely in capital letters.</p>", "feedback": "<p>Incorrect. Capitalization preserves historical or canonical orthography; authority links verify entity identity.</p>"}]}}, {"step": 26, "title": "Executing the In-Class Peer Review Exchange", "content": "**Executing the In-Class Peer Review Exchange**\n\nDuring today's in-class lab, our three cohort members execute a peer review exchange:\n\n- **Ace** reviews **Olyvia's** Maud Lewis correspondence edition.\n- **Olyvia** reviews **Andromeda's** 1752 Peace and Friendship Treaty edition.\n- **Andromeda** reviews **Ace's** 1791 French Revolutionary decree edition.\n\nFollow this four-step peer review protocol:\n\n1. **Clone the Repository:** Clone your partner's repository from GitHub to your laptop.\n2. **Run Automated CI Checks:** Run `xmllint` and `jing` in your terminal to verify their automated validation passes.\n3. **Conduct the 4-Layer Audit:** Inspect their header, facsimiles, normalizations, and entities against the rubric.\n4. **Open Constructive Issues:** Open at least two clear GitHub Issues or inline PR comments praising strong encoding and suggesting specific improvements.\n\nReviewing a classmate's edition sharpens your own editorial eye and strengthens the collective quality of our seminar's editions.\n\n**Vocabulary.** *Peer Review Exchange* — A structured in-class partnership where students audit each other's digital editions. *Helpful Feedback* — Actionable, respectful criticism that identifies specific problems and provides clear solutions.\n\n**Takeaway:** The in-class peer review exchange allows students to test each other's editions against automated checks and scholarly rubrics.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Executing the In-Class Peer Review Exchange", "questiontext": "<p>What is the final step in the four-step peer review exchange protocol?</p>", "generalfeedback": "<p>The in-class peer review exchange allows students to test each other's editions against automated checks and scholarly rubrics.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Opening constructive GitHub Issues or inline PR comments with specific praise and actionable suggestions.</p>", "feedback": "<p>Correct. Reviewers synthesize their audit into clear, actionable feedback on GitHub to help their classmates improve their editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting the partner's repository from GitHub to prevent competition.</p>", "feedback": "<p>Incorrect. Peer review is collaborative and supportive; deleting classmate work is strictly forbidden.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Refusing to speak to classmates until the end of the academic year.</p>", "feedback": "<p>Incorrect. The peer review exchange fosters active discussion and shared problem-solving.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Writing a negative review on public social media rating websites.</p>", "feedback": "<p>Incorrect. Scholarly reviews are conducted professionally within project repositories.</p>"}]}}, {"step": 27, "title": "Case Study: Digital Scholarly Publishing and Traveling Validation", "content": "**Case Study: Digital Scholarly Publishing and Traveling Validation**\n\nTo see automated validation operating in major digital humanities publishing, examine the **Digital Latin Library (DLL)**, a joint initiative of the Society for Classical Studies and the Medieval Academy of America.\n\nThe DLL publishes born-digital Latin editions in its *Library of Digital Latin Texts* (LDLT). Instead of sending printed books to a press, scholars submit Git repos containing TEI XML.\n\nThe DLL uses a CI pipeline called the \"Traveling Imprimatur.\" When an editor submits work, the CI server tests Relax NG and Schematron rules. If tests pass, the edition advances to human peer review. Once approved, the edition receives a digital certificate of scholarly quality.\n\n**Vocabulary.** *Digital Latin Library (DLL)* — A major scholarly publishing platform that peer-reviews and publishes open-access digital Latin editions. *Traveling Imprimatur* — An automated cryptographic certificate confirming an edition passed all schema and editorial validation gates.\n\n**Takeaway:** Major publishing platforms like the Digital Latin Library use automated CI pipelines as formal gateways to scholarly publication.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Case Study: Digital Scholarly Publishing and Traveling Validation", "questiontext": "<p>What is the \"Traveling Imprimatur\" developed by the Digital Latin Library?</p>", "generalfeedback": "<p>Major publishing platforms like the Digital Latin Library use automated CI pipelines as formal gateways to scholarly publication.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>An automated CI pipeline that tests XML files against strict schemas, certifying passing editions with a digital imprimatur.</p>", "feedback": "<p>Correct. The DLL uses automated CI validation as a prerequisite for formal peer review and scholarly publication.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A physical rubber stamp mailed to authors by post.</p>", "feedback": "<p>Incorrect. The Traveling Imprimatur is an automated digital certification pipeline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A commercial copyright license sold to students for profit.</p>", "feedback": "<p>Incorrect. The DLL is an open-access non-profit scholarly publishing platform.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A software program that automatically translates Latin into French.</p>", "feedback": "<p>Incorrect. The DLL publishes critical Latin editions; the imprimatur certifies XML validity.</p>"}]}}, {"step": 28, "title": "Digital Longevity and the Endings Project Principles", "content": "**Digital Longevity and the Endings Project Principles**\n\nWhen building digital editions, scholars must consider digital longevity. Hundreds of early digital humanities projects from the 1990s and 2000s are now completely dead. They relied on complex databases and old plugins. These tools broke when grant funding ended.\n\nTo prevent digital decay, the University of Victoria established **The Endings Project**. The Endings Project defines five principles for long-term digital preservation:\n\n1. **Static Files Only:** Rely on static HTML, CSS, and plain XML. Avoid server-side databases (like MySQL or PHP) that require ongoing maintenance.\n2. **Standards Compliance:** Use open, international standards (like W3C XML and TEI P5) that any modern computer can parse.\n3. **Self-Contained Data:** Keep all metadata,
