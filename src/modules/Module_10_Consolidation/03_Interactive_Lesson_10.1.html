    <script>
        const lessonData = {"course_title": "Collaborative Git Workflows for Digital Textual Scholarship", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "The Mid-Term Consolidation Milestone", "content": "**The Mid-Term Consolidation Milestone**\n\nOver the past nine weeks, you built a rich digital edition from scratch. You started in Week 1 with terminal Git commands. In Weeks 2 and 3, you catalogued your document in a `<teiHeader>` and linked digital images. Weeks 4 through 6 guided you through diplomatic transcription, AI reconciliation, and regularizing spellings with `<choice>` tags. In Week 7, you created reading stylesheets using CSS. In Weeks 8 and 9, you added grammar tags and named entities.\n\nUntil now, you worked as a solitary editor in an isolated folder. You made files on your own laptop and tested them in private. But real scholarly editions are rarely solitary projects. Real editions require teams of historians, paleographers, and encoders to work together across institutions.\n\nWeek 10 is our consolidation milestone. The university is closed on Wednesday for Remembrance Day. Therefore, this week has two focused meetings. We introduce no new XML tags this week. Instead, we connect your isolated workspace to GitHub. You will learn to share editions, propose changes, and review work as a community.\n\n**Vocabulary.** *Consolidation* — Pausing new tag authoring to synthesize, organize, and validate all accumulated edition layers. *Collaborative Edition* — A digital scholarly project produced and maintained by multiple editors working together.\n\n**Takeaway:** Consolidation synthesizes nine discrete encoding layers into a shared, multi-editor digital scholarly edition on GitHub.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: The Mid-Term Consolidation Milestone", "questiontext": "<p>What is the primary objective of the Week 10 consolidation milestone in RELS 398?</p>", "generalfeedback": "<p>Consolidation synthesizes nine discrete encoding layers into a shared, multi-editor digital scholarly edition on GitHub.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Synthesizing nine accumulated encoding layers into a shared, collaborative digital edition on GitHub.</p>", "feedback": "<p>Correct. Consolidation pauses new tag authoring to connect solitary local workspaces into an integrated, communal edition on GitHub.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Discarding earlier diplomatic transcriptions in order to start new documents from scratch.</p>", "feedback": "<p>Incorrect. Consolidation preserves and unifies all previous work rather than discarding primary transcriptions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating historical documents into modern colloquial English using automated neural models.</p>", "feedback": "<p>Incorrect. The course focuses on critical digital editing and historical preservation, not replacing source texts with automated translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting local Git repositories to save hard drive space before final project evaluation.</p>", "feedback": "<p>Incorrect. Local Git repositories preserve full version history and must be maintained and connected to GitHub.</p>"}]}}, {"step": 2, "title": "From Solitary Editor to Distributed Textual Community", "content": "**From Solitary Editor to Distributed Textual Community**\n\nIn traditional print scholarship, an editor often worked alone in an archive. That solitary scholar transcribed manuscripts into private notebooks. They resolved textual puzzles in isolation. Eventually, they published a single book. When early computer projects began, editors often continued this solitary habit. They typed transcriptions into desktop word processors. They emailed files back and forth as attachments.\n\nExchanging files by email causes severe problems. Files quickly drift out of sync. Suppose Ace emails a corrected XML file to Olyvia. Meanwhile, Olyvia adds entity tags to her own copy. Which file is current? Merging those two files by hand is slow and painful. Crucial editorial decisions get buried in private email chains instead of staying with the text.\n\nDistributed version control solves this dilemma. By hosting repositories on GitHub, all team members share one historical record. Every change is tracked. Every editorial choice is documented. Contributors receive full credit for their work. Moving to GitHub turns private files into an open, living resource.\n\n**Vocabulary.** *Distributed Version Control* — A system where every editor holds a complete, independent copy of the project history while synchronizing through a shared network host. *Editorial Provenance* — The transparent, verifiable record of who changed a text, when they changed it, and why.\n\n**Takeaway:** Distributed version control replaces chaotic email attachments with a transparent, communal record of all editorial interventions.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: From Solitary Editor to Distributed Textual Community", "questiontext": "<p>Why is exchanging manuscript files via email attachments problematic for collaborative digital editions?</p>", "generalfeedback": "<p>Distributed version control replaces chaotic email attachments with a transparent, communal record of all editorial interventions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Files quickly drift out of synchronization, creating untraceable conflicts and losing the rationale behind editorial choices.</p>", "feedback": "<p>Correct. Email attachments lead to version drift, accidental overwriting, and scattered discussions separated from the actual files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Email servers automatically delete all XML files due to international security regulations.</p>", "feedback": "<p>Incorrect. Email servers handle XML files normally, but human version management becomes chaotic and unreliable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Email prevents editors from reading primary manuscript facsimiles on high-resolution monitors.</p>", "feedback": "<p>Incorrect. Email does not restrict monitor display capabilities; the issue is version drift and lost editorial provenance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modern XML editors refuse to open any file that has traveled across the Internet.</p>", "feedback": "<p>Incorrect. Editors like VS Code open any text file regardless of how it was downloaded.</p>"}]}}, {"step": 3, "title": "The Directed Graph: How Git Tracks Repository History", "content": "**The Directed Graph: How Git Tracks Repository History**\n\nTo collaborate smoothly, you must understand how Git stores history. Git does not save files as a loose collection of folders. Instead, Git models your repository as a graph of snapshots. Every time you run `git commit`, Git takes a complete snapshot of your project.\n\nEach commit receives a unique forty-character fingerprint. We call this a SHA-1 hash. An example is `7a3f81b`. Git calculates this hash mathematically. It combines the exact file text, your commit message, the date, and the parent commit hash. Because each commit points backward to its parent, history forms an unbroken tree.\n\nThis graph structure guarantees scholarly integrity. Suppose someone modifies a single letter in Andromeda's 1752 Treaty in an old commit. That commit hash changes instantly. In turn, every subsequent commit hash breaks. Git makes secret alterations impossible. It provides a permanent audit trail for historical documents.\n\n**Vocabulary.** *Commit Snapshot* — A permanent, frozen record of all tracked files in a repository at a specific moment. *SHA-1 Hash* — A unique cryptographic fingerprint that identifies a commit and verifies its contents have not been altered.\n\n**Takeaway:** Git records project history as an immutable graph of commit snapshots, providing permanent citation stability and audit integrity.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Directed Graph: How Git Tracks Repository History", "questiontext": "<p>How does Git's Directed Acyclic Graph structure protect the integrity of a scholarly edition?</p>", "generalfeedback": "<p>Git records project history as an immutable graph of commit snapshots, providing permanent citation stability and audit integrity.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Each commit has an immutable cryptographic hash based on its contents and parent, making silent retroactive alterations impossible.</p>", "feedback": "<p>Correct. The cryptographic SHA-1 hash incorporates parent pointers and file contents, ensuring that tampering with past commits breaks subsequent history.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Git automatically translates archaic French or 18th-century English into modern standardized grammar.</p>", "feedback": "<p>Incorrect. Git tracks file snapshots and version history, but it does not alter or modernize textual language.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Git encrypts all manuscript images so that unauthorized readers cannot view primary sources.</p>", "feedback": "<p>Incorrect. Git records text and metadata history; image access is managed through IIIF and web servers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The graph structure prevents editors from making more than five commits per week.</p>", "feedback": "<p>Incorrect. Git places no limits on the number of commits an editor may record.</p>"}]}}, {"step": 4, "title": "The Anatomy of Remotes: Local Clones and GitHub", "content": "**The Anatomy of Remotes: Local Clones and GitHub**\n\nDuring the first nine weeks of class, your Git repository lived only on your laptop. Your commits were strictly local. If your computer crashed, your work was lost. A **remote** is a copy of your repository hosted on the web, usually on GitHub.\n\nA remote repository stores the same commit graph and files as your local project. It acts as a shared central meeting point. In Git terminology, the default name for your primary remote repository is **origin**. When you connect your local repo to GitHub, you register this remote web address.\n\nWorking with a remote involves two main actions: pushing and fetching. Running `git push` uploads your local commits to GitHub so others can view them. Running `git fetch` downloads new commits from GitHub to your laptop. The remote simply mirrors your commit graph on the web.\n\n**Vocabulary.** *Remote Repository* — A copy of your Git repository hosted on a network server such as GitHub. *Origin* — The standard default name Git assigns to your primary remote repository.\n\n**Takeaway:** A remote repository on GitHub acts as an accessible central anchor for sharing commit snapshots across multiple computers.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: The Anatomy of Remotes: Local Clones and GitHub", "questiontext": "<p>In Git version control, what is a \"remote repository\" such as origin?</p>", "generalfeedback": "<p>A remote repository on GitHub acts as an accessible central anchor for sharing commit snapshots across multiple computers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A copy of the repository hosted on a network server like GitHub that acts as a shared central meeting point.</p>", "feedback": "<p>Correct. A remote repository mirrors your commit graph on the web, enabling synchronization between distributed editors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A specialized hardware cable used to connect two laptop computers directly in a computer lab.</p>", "feedback": "<p>Incorrect. Remotes are software repositories hosted on network servers, not physical cables.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An external backup hard drive that is permanently disconnected from the Internet.</p>", "feedback": "<p>Incorrect. A remote is accessible across the network to facilitate collaborative pushing and fetching.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A hidden file on your desktop that stores your operating system passwords.</p>", "feedback": "<p>Incorrect. Remotes are network repository locations, not local password files.</p>"}]}}, {"step": 5, "title": "Collaboration Models: Shared Write Access vs. Fork-and-Pull", "content": "**Collaboration Models: Shared Write Access vs. Fork-and-Pull**\n\nDigital editions organize teamwork using two primary models: shared write access and the fork-and-pull model.\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Collaboration Model</th>\n<th>How It Works</th>\n<th>Best Use Case</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Shared Write Access</strong></td>\n<td>Every team member has direct push permission to the main repository. Anyone can commit directly to branches.</td>\n<td>Small, tightly coordinated teams of two or three trusted co-authors.</td>\n</tr>\n<tr>\n<td><strong>Fork-and-Pull</strong></td>\n<td>Contributors make a personal copy (fork) on GitHub, push to their fork, and submit a Pull Request to the upstream project.</td>\n<td>Public open-source projects, large editions, and classroom peer review.</td>\n</tr>\n</tbody>\n</table>\n\nIn this course, we practice the fork-and-pull model. This model protects the authoritative edition from accidental errors. It guarantees that every proposed change is inspected, discussed, and validated before it enters the official text.\n\n**Vocabulary.** *Shared Write Access* — Granting multiple users permission to push commits directly into a single repository. *Fork-and-Pull Model* — A workflow where contributors edit personal forks and request that maintainers pull their changes.\n\n**Takeaway:** The fork-and-pull model protects the primary edition while inviting outside scholars and peers to propose improvements.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Collaboration Models: Shared Write Access vs. Fork-and-Pull", "questiontext": "<p>Why does our seminar use the fork-and-pull model rather than granting everyone direct write access to the main repository?</p>", "generalfeedback": "<p>The fork-and-pull model protects the primary edition while inviting outside scholars and peers to propose improvements.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It protects the authoritative edition by requiring proposed changes to be inspected, discussed, and validated before merging.</p>", "feedback": "<p>Correct. The fork-and-pull model ensures that all additions are vetted through pull request reviews before entering the master branch.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Direct write access causes physical damage to student laptop keyboards during heavy typing.</p>", "feedback": "<p>Incorrect. Fork-and-pull is an editorial governance strategy, not a hardware protection mechanism.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>GitHub charges high commercial subscription fees whenever a repository has more than two direct contributors.</p>", "feedback": "<p>Incorrect. GitHub provides free collaboration tools for academic and open-source projects.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The fork-and-pull model automatically converts TEI XML files into commercial eBook formats.</p>", "feedback": "<p>Incorrect. Fork-and-pull governs branch synchronization and peer review; it does not convert file formats.</p>"}]}}, {"step": 6, "title": "Forking a Scholarly Repository on GitHub", "content": "**Forking a Scholarly Repository on GitHub**\n\nA **fork** is a personal copy of another user's repository on GitHub. It lives under your personal account. When you click the \"Fork\" button on GitHub, GitHub copies the whole repository. This copy includes all files, branches, and commit history.\n\nForking lets you experiment without risking the original project. For instance, Andromeda can fork the course repository to study Ace's French Revolutionary decree. In her fork, Andromeda can test alternative `<persName>` tags. She can try new CSS styles. Ace's original repository remains untouched.\n\nYour fork stays connected to the original project across GitHub. The original repository is called the **upstream** repository. Once you finish an editorial improvement on your fork, you can send those commits back to upstream as a formal proposal.\n\n**Vocabulary.** *Fork* — A server-side duplicate of a GitHub repository hosted under your own personal account. *Upstream* — The original parent repository from which a fork was created.\n\n**Takeaway:** Forking creates a safe personal sandbox where you can freely modify an edition before contributing back to the parent project.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Forking a Scholarly Repository on GitHub", "questiontext": "<p>What occurs when you click the \"Fork\" button on a GitHub repository?</p>", "generalfeedback": "<p>Forking creates a safe personal sandbox where you can freely modify an edition before contributing back to the parent project.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>GitHub creates a personal duplicate of the entire repository under your account, allowing safe experimentation.</p>", "feedback": "<p>Correct. Forking duplicates files, branches, and commit history into your profile, leaving the upstream project untouched.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The original repository is permanently deleted and replaced by an empty folder.</p>", "feedback": "<p>Incorrect. Forking never deletes or alters the original upstream repository.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All files in the repository are automatically converted into binary executable programs.</p>", "feedback": "<p>Incorrect. Forking duplicates source text files and version history without altering file types.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Your local computer immediately downloads twenty gigabytes of high-resolution print scans.</p>", "feedback": "<p>Incorrect. Forking happens on GitHub servers; downloading to your laptop requires a separate clone command.</p>"}]}}, {"step": 7, "title": "Branching Strategies for Digital Scholarly Editions", "content": "**Branching Strategies for Digital Scholarly Editions**\n\nWorking directly on your `main` branch can be dangerous. The `main` branch should always hold your stable, production-ready edition. If you start transcribing a messy new page directly on `main`, your repository is temporarily broken.\n\nA **branch** is an independent line of development. It branches off from `main`. You can think of a branch as a lightweight moveable pointer. Creating a branch takes one second. On a branch, you can draft markup, test regularizations, or revise metadata safely.\n\nWhen your work on the branch is complete and validated, you merge it into `main`. If an experiment fails, you simply delete the branch. Your main edition stays completely clean.\n\n**Vocabulary.** *Main Branch* — The primary, stable line of development in a Git repository. *Feature Branch* — A temporary branch created to develop a specific addition, fix, or editorial layer in isolation.\n\n**Takeaway:** Isolating editorial work on temporary feature branches keeps the primary main branch clean, stable, and always valid.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: Branching Strategies for Digital Scholarly Editions", "questiontext": "<p>Why should editors develop new markup on dedicated feature branches rather than working directly on main?</p>", "generalfeedback": "<p>Isolating editorial work on temporary feature branches keeps the primary main branch clean, stable, and always valid.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Working on feature branches keeps the primary main branch clean, stable, and always valid while experiments are underway.</p>", "feedback": "<p>Correct. Feature branches isolate ongoing work, ensuring that incomplete or invalid draft markup never breaks the production text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Git forbids users from creating more than one commit on the main branch per month.</p>", "feedback": "<p>Incorrect. Git allows unlimited commits on main, but disciplined editorial practice reserves main for verified stable milestones.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Branches automatically compress manuscript image files to save disk space.</p>", "feedback": "<p>Incorrect. Branches are lightweight pointers to commits; they do not compress image assets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Working on feature branches eliminates the need to run schema validation.</p>", "feedback": "<p>Incorrect. All branches must eventually validate against schemas before merging into main.</p>"}]}}, {"step": 8, "title": "Branch Naming Conventions and Repository Hygiene", "content": "**Branch Naming Conventions and Repository Hygiene**\n\nIn collaborative projects, descriptive branch names prevent confusion. If three students name their branches `test`, `new`, and `my-branch`, nobody knows what each branch contains. Professional digital humanities teams establish clear branch naming conventions.\n\nGood branch names use lowercase letters, numbers, and hyphens. They typically begin with a prefix describing the category of work, followed by a slash and a concise summary:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Branch Prefix</th>\n<th>Purpose</th>\n<th>Example Branch Name</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>feature/</code></td>\n<td>Adding a substantial new encoding layer or document section</td>\n<td><code>feature/french-named-entities</code></td>\n</tr>\n<tr>\n<td><code>fix/</code></td>\n<td>Correcting a transcription mistake or schema error</td>\n<td><code>fix/maud-lewis-date-when</code></td>\n</tr>\n<tr>\n<td><code>docs/</code></td>\n<td>Updating project documentation or README files</td>\n<td><code>docs/treaty-citation-guide</code></td>\n</tr>\n</tbody>\n</table>\n\nNotice how clear these names are. When Olyvia sees `fix/maud-lewis-date-when`, she knows immediately that the branch fixes an attribute error on a `<date>` element without opening a single file.\n\n**Vocabulary.** *Branch Prefix* — A standard category label (such as `feature/` or `fix/`) placed at the start of a branch name. *Repository Hygiene* — Habits of organization, clear naming, and regular cleanups that keep a codebase readable.\n\n**Takeaway:** Meaningful branch names with standard prefixes communicate the exact scope of an editorial task to collaborators.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Branch Naming Conventions and Repository Hygiene", "questiontext": "<p>Which of the following represents a well-structured branch name following professional digital humanities conventions?</p>", "generalfeedback": "<p>Meaningful branch names with standard prefixes communicate the exact scope of an editorial task to collaborators.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>feature/french-named-entities</p>", "feedback": "<p>Correct. Using a standard prefix like `feature/` followed by a concise descriptive summary clearly communicates the scope of work.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>new-test-branch-final-v2</p>", "feedback": "<p>Incorrect. Generic names like `test` or `final-v2` create confusion about what editorial task is actually underway.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>stuff_i_did_yesterday</p>", "feedback": "<p>Incorrect. Branch names should identify the textual or technical feature being added, not casual personal timelines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>MY_NEW_EDITION_PROJECT!!!</p>", "feedback": "<p>Incorrect. Professional repository hygiene avoids uppercase letters, spaces, and exclamation points.</p>"}]}}, {"step": 9, "title": "Configuring and Managing Remotes via the Command Line", "content": "**Configuring and Managing Remotes via the Command Line**\n\nTo manage remotes in VS Code, use the `git remote` command. When you clone your fork from GitHub to your laptop, Git automatically creates one remote. It names this remote `origin`, pointing to your personal fork.\n\nYou can check your remotes by typing:\n\n```bash\ngit remote -v\n```\n\nThis command prints the name and URL for both fetch and push operations. To keep your fork in sync with the course project, add a second remote. By convention, name this second remote **upstream**:\n\n```bash\ngit remote add upstream https://github.com/stfx-rels/rels-398-editions.git\n```\n\nNow your local repository knows about two locations. It knows `origin` (your personal fork with write permission). It also knows `upstream` (the shared class repository with read permission).\n\n**Vocabulary.** *git remote -v* — The command that prints all configured remote names alongside their network URLs. *Remote Tracking Branch* — A local read-only reference that tracks the state of a branch on a remote server.\n\n**Takeaway:** Configuring both origin and upstream remotes allows your local repository to push personal work and pull shared updates.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Configuring and Managing Remotes via the Command Line", "questiontext": "<p>In a fork-and-pull workflow, what is the role of the upstream remote configured on your laptop?</p>", "generalfeedback": "<p>Configuring both origin and upstream remotes allows your local repository to push personal work and pull shared updates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows you to fetch the latest official commits and updates from the primary course repository.</p>", "feedback": "<p>Correct. The upstream remote points to the authoritative central repository so you can keep your local workspace synchronized.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically posts your homework grades to your university transcript.</p>", "feedback": "<p>Incorrect. Upstream is simply a Git network pointer for fetching repository commits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes your local files whenever you shut down your laptop computer.</p>", "feedback": "<p>Incorrect. Remotes do not delete local working files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents classmates from viewing your public GitHub profile.</p>", "feedback": "<p>Incorrect. Upstream configuration has no effect on user profile visibility settings.</p>"}]}}, {"step": 10, "title": "Synchronizing with Upstream: Fetch, Merge, and Fast-Forward", "content": "**Synchronizing with Upstream: Fetch, Merge, and Fast-Forward**\n\nAs weeks pass, classmates and instructors add files to the upstream project. Your personal fork does not update automatically. You must fetch and merge those upstream changes yourself.\n\nThe safest workflow has two clear steps: `git fetch` and `git merge`. First, fetch the latest commits from upstream:\n\n```bash\ngit fetch upstream\n```\n\nThis command downloads new commits and updates `upstream/main`. Crucially, `git fetch` never touches your working files. It never edits your active branches. It simply downloads the data so you can check it.\n\nNext, switch to your local `main` branch, and merge the upstream commits:\n\n```bash\ngit checkout main\ngit merge upstream/main\n```\n\nIf you made no local commits on `main`, Git does a **fast-forward** merge. It simply advances your `main` pointer forward. Your local files are now fully up to date.\n\n**Vocabulary.** *git fetch* — Downloading commits and branches from a remote without altering your local working directory. *Fast-Forward Merge* — Advancing a branch pointer directly forward along a linear line of history when no diverging commits exist.\n\n**Takeaway:** Fetching from upstream and merging into your local main branch keeps your workspace synchronized with project updates.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Synchronizing with Upstream: Fetch, Merge, and Fast-Forward", "questiontext": "<p>What is the key difference between running git fetch and running git merge?</p>", "generalfeedback": "<p>Fetching from upstream and merging into your local main branch keeps your workspace synchronized with project updates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>`git fetch` downloads commits without altering your local working files, while `git merge` integrates those commits into your active branch.</p>", "feedback": "<p>Correct. Fetching is safe and non-destructive; merging actively combines downloaded history into your current branch.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>`git fetch` deletes untracked files, while `git merge` recovers deleted files from the recycle bin.</p>", "feedback": "<p>Incorrect. Neither command deletes untracked files; fetch retrieves remote commits and merge combines branch histories.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>`git fetch` only works on images, while `git merge` only works on XML documents.</p>", "feedback": "<p>Incorrect. Both commands operate on Git commit graphs regardless of file formats.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>`git fetch` requires an administrator password, while `git merge` is completely public.</p>", "feedback": "<p>Incorrect. Both commands run under standard user permissions in your terminal.</p>"}]}}, {"step": 11, "title": "The Pull Request as the Dynamic Apparatus Criticus", "content": "**The Pull Request as the Dynamic Apparatus Criticus**\n\nIn print editions, the **apparatus criticus** sits at the page foot. It records variant readings, proposed emendations, and editor notes. The apparatus lets readers evaluate why an editor picked one reading over another.\n\nIn digital editing on GitHub, the **Pull Request (PR)** acts as a living apparatus criticus. When you open a pull request, you are not just submitting code. You are proposing a scholarly hypothesis. You say: \"Here is my proposed transcription. Here is the historical evidence for it. Here is how it improves our edition.\"\n\nA pull request creates an open discussion forum attached to your commit diff. Collaborators can debate paleographical readings, challenge regularizations, and test markup before accepting it into the master text.\n\n**Vocabulary.** *Pull Request (PR)* — A formal proposal on GitHub to merge commits from one branch into another, accompanied by discussion and review. *Scholarly Apparatus* — The critical commentary and recorded variants accompanying an edition's primary text.\n\n**Takeaway:** A GitHub Pull Request acts as a living apparatus criticus where editors debate textual readings before adopting them.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: The Pull Request as the Dynamic Apparatus Criticus", "questiontext": "<p>In what way does a GitHub Pull Request function like a dynamic apparatus criticus in digital editing?</p>", "generalfeedback": "<p>A GitHub Pull Request acts as a living apparatus criticus where editors debate textual readings before adopting them.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It serves as a scholarly forum where editors propose readings, cite evidence, and debate textual interpretations before adoption.</p>", "feedback": "<p>Correct. A pull request attaches scholarly rationale and debate directly to proposed markup changes before they enter the master text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically detects and translates Greek and Latin abbreviations without human input.</p>", "feedback": "<p>Incorrect. A pull request is a collaborative review interface, not an automated translation tool.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prints physical paper footnotes along the bottom edge of your laptop monitor.</p>", "feedback": "<p>Incorrect. The comparison is conceptual: both provide critical commentary and variant tracking for scholarly scrutiny.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It permanently locks the repository against future editorial contributions.</p>", "feedback": "<p>Incorrect. Pull requests facilitate ongoing contributions rather than locking repositories.</p>"}]}}, {"step": 12, "title": "Anatomy of a Scholarly Pull Request", "content": "**Anatomy of a Scholarly Pull Request**\n\nAn effective pull request must be clear and helpful. Submitting a PR with no description or a title like \"updates\" forces reviewers to guess what you did.\n\nA professional scholarly pull request contains four key parts:\n\n1. **A Clear Title:** State the exact editorial action (such as `Add named entities for French National Assembly deputies`).\n2. **Context and Rationale:** Explain why you made the change. Did you fix a transcription typo? Did you normalize an archaic spelling?\n3. **Evidence and Citations:** Cite the manuscript folio image or authority record (like VIAF or Wikidata) supporting your choice.\n4. **Validation Proof:** State that your TEI XML file passed `xmllint` and schema checks with zero errors.\n\nWhen Ace submits a PR for his 1791 decree, he attaches an image crop. He explains why he linked *M. de Bouillé* to VIAF ID `61536214`. Reviewing that PR becomes quick, educational, and reliable.\n\n**Vocabulary.** *Pull Request Description* — The markdown body of a PR explaining the rationale, scope, and evidence for proposed changes. *Imperative Title* — A concise title phrased as a command describing what the change achieves.\n\n**Takeaway:** A thorough PR description pairs proposed markup changes with historical evidence, rationale, and schema validation proof.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Anatomy of a Scholarly Pull Request", "questiontext": "<p>Which element is essential in the description of a professional scholarly pull request?</p>", "generalfeedback": "<p>A thorough PR description pairs proposed markup changes with historical evidence, rationale, and schema validation proof.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A clear rationale for the changes, accompanied by primary facsimile evidence and schema validation proof.</p>", "feedback": "<p>Correct. A strong PR description explains why changes were made, cites supporting evidence, and confirms that validation checks passed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A generic one-word description like \\\"fixed\\\" with no mention of documents or folios.</p>", "feedback": "<p>Incorrect. Vague descriptions force reviewers to guess what was changed and slow down scholarly review.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An apology explaining that the XML file contains syntax errors and could not be validated.</p>", "feedback": "<p>Incorrect. Authors should fix syntax errors and verify schema compliance before opening a pull request.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A list of personal grievances regarding the difficulty of transcribing 18th-century handwriting.</p>", "feedback": "<p>Incorrect. PR descriptions should maintain a professional, evidence-based scholarly focus.</p>"}]}}, {"step": 13, "title": "Standardizing Editorial Contributions: `PULL_REQUEST_TEMPLATE.md`", "content": "**Standardizing Editorial Contributions: `PULL_REQUEST_TEMPLATE.md`**\n\nTo help contributors provide proper evidence, repositories use pull request templates. When you add a file named `PULL_REQUEST_TEMPLATE.md` to `.github/`, GitHub displays that template whenever someone opens a new PR.\n\nA template provides a helpful checklist for digital philology:\n\n```markdown\n## Summary of Changes\n- What document or encoding layer does this PR modify?\n\n## Codicological and Paleographical Evidence\n- [ ] Facsimile image verified against primary witness\n- [ ] Authority IDs verified against VIAF or Wikidata\n\n## Schema and Validation Checklist\n- [ ] Well-formed XML verified (`xmllint --noout`)\n- [ ] Relax NG schema passes with 0 errors\n```\n\nThis checklist prevents rushed submissions. It reminds Olyvia to check her Maud Lewis date attributes. It prompts Andromeda to verify her treaty placenames before opening the PR.\n\n**Vocabulary.** *PULL_REQUEST_TEMPLATE.md* — A standardized markdown form automatically displayed by GitHub when creating a pull request. *Pre-Flight Checklist* — A set of verification steps an author completes before requesting scholarly review.\n\n**Takeaway:** Standardized PR templates ensure that every submitted edition update includes required evidence and validation checks.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Standardizing Editorial Contributions: `PULL_REQUEST_TEMPLATE.md`", "questiontext": "<p>How does placing `PULL_REQUEST_TEMPLATE.md` in `.github/` improve collaborative edition quality?</p>", "generalfeedback": "<p>Standardized PR templates ensure that every submitted edition update includes required evidence and validation checks.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It provides a standard checklist prompting contributors to confirm evidence, authority links, and schema validation before submitting.</p>", "feedback": "<p>Correct. Templates ensure that all authors verify essential criteria like well-formedness, Relax NG checks, and authority records.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically rejects any pull request submitted after 5:00 PM on weekdays.</p>", "feedback": "<p>Incorrect. Templates guide human authoring; they do not enforce arbitrary submission curfews.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts all Markdown text into binary computer code.</p>", "feedback": "<p>Incorrect. Templates are plain text Markdown forms displayed in the GitHub browser interface.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It removes the need for human peer reviewers to inspect incoming code.</p>", "feedback": "<p>Incorrect. Templates assist reviewers by ensuring authors provide necessary contextual evidence up front.</p>"}]}}, {"step": 14, "title": "Visualizing Diffs in Hierarchical XML Documents", "content": "**Visualizing Diffs in Hierarchical XML Documents**\n\nThe heart of any pull request review is the **diff**. GitHub compares your branch with the target branch line by line. It shows additions in green with a plus sign (`+`). It shows deletions in red with a minus sign (`-`).\n\nReading XML diffs requires attention to nesting. A change on line 42 can affect an opening tag on line 10. When viewing a diff on GitHub, you can pick between two view modes:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Diff View Mode</th>\n<th>Description</th>\n<th>Best Use Case</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Unified Diff</strong></td>\n<td>Shows deletions and additions inline in a single continuous column.</td>\n<td>Quick checks on mobile screens or small one-line typo fixes.</td>\n</tr>\n<tr>\n<td><strong>Split Diff</strong></td>\n<td>Displays the original file on the left and the modified file on the right side by side.</td>\n<td>Reviewing structural XML changes, closing tags, and nested elements.</td>\n</tr>\n</tbody>\n</table>\n\nSplit diff mode makes missing tags obvious. If an editor deleted an opening `<p>` tag thirty lines earlier, the split view reveals the structural shift right away.\n\n**Vocabulary.** *Diff* — A visual representation of differences between two versions of a file, highlighting additions and deletions. *Split Diff* — A side-by-side view comparing original and modified text in parallel columns.\n\n**Takeaway:** Using split diff view helps reviewers spot subtle structural changes and mismatched tags in hierarchical XML.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Visualizing Diffs in Hierarchical XML Documents", "questiontext": "<p>Why is Split Diff view particularly advantageous when reviewing modifications to TEI XML documents?</p>", "generalfeedback": "<p>Using split diff view helps reviewers spot subtle structural changes and mismatched tags in hierarchical XML.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It displays original and modified versions side by side, making structural element shifts and unclosed tags immediately obvious.</p>", "feedback": "<p>Correct. Comparing columns side by side reveals structural misalignments and tag omissions that might be obscured in unified view.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates French and 18th-century English text into modern German.</p>", "feedback": "<p>Incorrect. Split diff view compares text versions; it does not perform language translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically highlights spelling mistakes using red underline animations.</p>", "feedback": "<p>Incorrect. Split diff displays textual differences between Git commits, not spell-check alerts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It hides all XML tags so reviewers only read plain unformatted prose.</p>", "feedback": "<p>Incorrect. Reviewing digital editions requires inspecting XML markup tags directly.</p>"}]}}, {"step": 15, "title": "The Scholarly Code Review Interface", "content": "**The Scholarly Code Review Interface**\n\nGitHub provides clean tools for peer review. Hover your cursor over any line number in a pull request diff. A blue plus icon appears. Clicking that icon opens an inline comment box on that exact line.\n\nThis inline interface enables focused dialogue. Instead of sending a vague message saying \"your date looks wrong,\" a reviewer clicks directly on `<date when=\"1752-11-22\">` and writes:\n\n> \"The proclamation heading says *November 22*, but the articles were signed on November 24. Should we encode two separate date elements?\"\n\nGitHub also includes an \"Insert a suggestion\" button. Reviewers can write the exact replacement XML they recommend. The author can accept the suggestion with one click. GitHub creates a commit that applies the fix instantly.\n\n**Vocabulary.** *Inline Comment* — A review note attached to a specific line number within a pull request diff. *Suggested Change* — A proposed code replacement submitted by a reviewer that the author can accept with one click.\n\n**Takeaway:** Inline review comments allow scholars to conduct precise, line-by-line debates directly on the digital text.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: The Scholarly Code Review Interface", "questiontext": "<p>How does GitHub's inline commenting feature facilitate granular peer review?</p>", "generalfeedback": "<p>Inline review comments allow scholars to conduct precise, line-by-line debates directly on the digital text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Reviewers can attach comments directly to specific line numbers in the diff and propose exact XML replacement suggestions.</p>", "feedback": "<p>Correct. Inline comments allow precise discussions tied to specific tags or lines, and suggested changes can be accepted with one click.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It sends private text messages to the author's personal mobile telephone.</p>", "feedback": "<p>Incorrect. Inline comments appear publicly within the pull request thread on GitHub.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents authors from replying to reviewer feedback.</p>", "feedback": "<p>Incorrect. Inline comments create interactive discussion threads where authors and reviewers debate readings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes any line of text that receives more than two comments.</p>", "feedback": "<p>Incorrect. Comments do not delete code; they facilitate scholarly evaluation.</p>"}]}}, {"step": 16, "title": "Iterating on an Open Pull Request", "content": "**Iterating on an Open Pull Request**\n\nOpening a pull request does not freeze your files. A pull request is a discussion, not a final exam. When reviewers suggest improvements, you do not close the PR or start over.\n\nTo update your pull request, return to your branch in VS Code. Make the requested edits, commit them, and push them to your fork:\n\n```bash\ngit checkout feature/treaty-entities\n# edit witness.xml to address reviewer suggestions\ngit add witness.xml\ngit commit -m \"Clarify ratification date and add VIAF reference\"\ngit push origin feature/treaty-entities\n```\n\nAs soon as your push reaches GitHub, the pull request updates automatically. Your new commit appears in the PR thread. The diff updates immediately. When all comments are resolved and validation passes, the maintainer merges your work into `main`.\n\n**Vocabulary.** *Pull Request Iteration* — Pushing new commits to an active feature branch to address peer feedback before merging. *PR Lifecycle* — The progression of a proposal from draft creation through review, iteration, approval, and merge.\n\n**Takeaway:** Pushing new commits to your active branch automatically updates the open pull request, making peer review an iterative cycle.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Iterating on an Open Pull Request", "questiontext": "<p>What should an author do when a peer reviewer suggests revisions on an open pull request?</p>", "generalfeedback": "<p>Pushing new commits to your active branch automatically updates the open pull request, making peer review an iterative cycle.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Make the edits on the local feature branch, commit them, and push to GitHub; the PR updates automatically.</p>", "feedback": "<p>Correct. Pushing new commits to the existing branch updates the active pull request without needing to open a new one.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Close the pull request, delete the repository, and start the assignment over from scratch.</p>", "feedback": "<p>Incorrect. Pull requests are designed for iterative improvement; authors simply push corrective commits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Reject the feedback and immediately merge the branch into main without making changes.</p>", "feedback": "<p>Incorrect. Collaborative editing requires responding constructively to peer feedback and resolving concerns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Email the corrected XML file directly to the instructor as an unversioned attachment.</p>", "feedback": "<p>Incorrect. Changes should be committed to Git and pushed to GitHub to preserve public provenance.</p>"}]}}, {"step": 17, "title": "Understanding Merge Conflicts in Hierarchical XML", "content": "**Understanding Merge Conflicts in Hierarchical XML**\n\nCollaboration is straightforward when editors work on separate files. But what happens when two editors edit the same lines at the same time? Git stops and reports a **merge conflict**.\n\nGit is designed to be safe. Suppose Ace edits line 45 to read `<persName ref=\"#bouille\">Bouillé</persName>`. Meanwhile, Olyvia edits line 45 to read `<persName role=\"general\">Bouillé</persName>`. Git cannot know which interpretation is correct. Rather than guessing and erasing someone's work, Git pauses. It asks a human editor to choose.\n\nMerge conflicts are not software bugs. They are normal events in collaborative work. They simply mean two scholars proposed different readings for the same phrase, requiring thoughtful adjudication.\n\n**Vocabulary.** *Merge Conflict* — A state where Git cannot automatically combine two branches because both changed the same lines in conflicting ways. *Editorial Adjudication* — The human decision-making process required to evaluate conflicting textual interpretations.\n\n**Takeaway:** Merge conflicts occur when two branches alter the same lines concurrently; Git safely pauses to let human editors decide.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Understanding Merge Conflicts in Hierarchical XML", "questiontext": "<p>Why does Git pause and declare a merge conflict when two branches modify the same line concurrently?</p>", "generalfeedback": "<p>Merge conflicts occur when two branches alter the same lines concurrently; Git safely pauses to let human editors decide.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Git cannot determine which scholar's reading is historically or structurally correct and safely asks a human editor to decide.</p>", "feedback": "<p>Correct. Git avoids guessing; when competing edits overlap, it pauses so editors can adjudicate the correct reading.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A merge conflict indicates that the user's computer has contracted a dangerous software virus.</p>", "feedback": "<p>Incorrect. Merge conflicts are standard, expected events in collaborative version control, not virus infections.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Git automatically chooses whichever branch was created by the user with more GitHub followers.</p>", "feedback": "<p>Incorrect. Git does not prioritize users by follower count; it requires explicit human conflict resolution.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A merge conflict permanently erases all commit history from both branches.</p>", "feedback": "<p>Incorrect. Commit history is completely preserved; only the conflicting lines require resolution.</p>"}]}}, {"step": 18, "title": "Anatomy of a Git Conflict Marker", "content": "**Anatomy of a Git Conflict Marker**\n\nWhen a merge conflict happens, Git writes special text markers directly into the file. These markers show both competing versions.\n\nHere is a conflict marker in TEI XML:\n\n```xml\n<<<<<<< HEAD\n<date when=\"1967-02-13\">Feb 13</date>\n=======\n<date when=\"1967-02-15\" cert=\"medium\">Feb 15?</date>\n>>>>>>> feature/date-audit\n```\n\nThe markers divide the text into three sections:\n\n- `<<<<<<< HEAD`: Marks the start of the conflict. It contains text from your current local branch.\n- `=======`: The divider separating your version from the incoming version.\n- `>>>>>>> feature/date-audit`: Marks the end of the conflict and names the incoming branch.\n\nWhile these markers remain, your XML is invalid. You must open the file, select the right reading, and erase all three marker lines.\n\n**Vocabulary.** *Conflict Marker* — Special delimiter strings (`<<<<<<<`, `=======`, `>>>>>>>`) inserted by Git to highlight competing text versions. *HEAD (Conflict Context)* — The commit representing your currently active local branch during a merge.\n\n**Takeaway:** Git conflict markers isolate competing readings between HEAD and the incoming branch, requiring manual editing to resolve.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Anatomy of a Git Conflict Marker", "questiontext": "<p>In a conflicted file, what text is contained between `<<<<<<< HEAD` and `=======`?</p>", "generalfeedback": "<p>Git conflict markers isolate competing readings between HEAD and the incoming branch, requiring manual editing to resolve.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The version of the text from your currently checked-out local branch before the merge attempt.</p>", "feedback": "<p>Correct. `HEAD` represents your active local branch, while the incoming branch content sits between `=======` and `>>>>>>>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The incoming version from the remote branch on GitHub.</p>", "feedback": "<p>Incorrect. The incoming version is located between `=======` and `>>>>>>>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An automated summary of syntax errors generated by the XML parser.</p>", "feedback": "<p>Incorrect. Conflict markers enclose competing source code lines, not parser error logs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A cryptographic password required to unlock your Git repository.</p>", "feedback": "<p>Incorrect. Conflict markers contain human-readable text from the conflicting commits.</p>"}]}}, {"step": 19, "title": "Modular Architecture and Conflict Mitigation", "content": "**Modular Architecture and Conflict Mitigation**\n\nThe best way to handle merge conflicts is to prevent them. In large digital editions, teams design a **modular architecture** to minimize simultaneous edits on the same file.\n\nIf an entire edition sits in one large 5,000-line `edition.xml` file, conflicts happen constantly. Every time someone touches metadata or changes a tag, they collide with a classmate.\n\nTeams reduce conflicts through smart file separation:\n\n1. **Splitting Layers:** Store metadata in `teiHeader.xml`, diplomatic text in `transcription.xml`, and entity lists in `taxonomy.xml`.\n2. **Page-by-Page Files:** Store each folio in its own file, such as `folio_01r.xml`.\n3. **Task Assignment:** Use GitHub Issues to claim specific folios before editing so two people never transcribe the same page simultaneously.\n\n**Vocabulary.** *Modular Architecture* — Organizing an edition into separate, self-contained files to reduce editing friction and collision. *Conflict Mitigation* — Proactive project design and communication strategies that minimize overlapping edits.\n\n**Takeaway:** Dividing an edition into modular files and assigning clear editorial roles drastically reduces concurrent merge conflicts.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Modular Architecture and Conflict Mitigation", "questiontext": "<p>How does designing a modular file architecture reduce merge conflicts in a digital edition?</p>", "generalfeedback": "<p>Dividing an edition into modular files and assigning clear editorial roles drastically reduces concurrent merge conflicts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Splitting metadata, folios, and entity lists into separate files minimizes concurrent edits on the same lines.</p>", "feedback": "<p>Correct. When editors work in separate modular files (such as distinct folio files or headers), simultaneous line edits rarely collide.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces all editors to share a single computer terminal in the classroom.</p>", "feedback": "<p>Incorrect. Modular architecture enables distributed work across multiple independent computers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It eliminates the need to use XML tags by converting everything to plain text.</p>", "feedback": "<p>Incorrect. Modular files remain fully encoded TEI XML documents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents Git from tracking file modification dates.</p>", "feedback": "<p>Incorrect. Git tracks modification timestamps and commit authors across all modular files.</p>"}]}}, {"step": 20, "title": "Step-by-Step Conflict Resolution in VS Code", "content": "**Step-by-Step Conflict Resolution in VS Code**\n\nModern code editors make resolving conflicts simple. When you open a conflicted file in Visual Studio Code, the editor displays clickable action buttons above the conflict:\n\n- **Accept Current Change:** Keeps your current branch version (`HEAD`) and deletes the incoming version.\n- **Accept Incoming Change:** Overwrites your version with the incoming branch version.\n- **Accept Both Changes:** Keeps both versions stacked together.\n- **Compare Changes:** Opens a side-by-side diff to examine differences.\n\nIn scholarly editing, clicking \"Accept Current\" or \"Accept Incoming\" is often too blunt. Often, the ideal solution is a synthesis. Perhaps Ace added a necessary `@ref` attribute, while Olyvia added a valuable `@role` attribute.\n\nThe best editorial choice is to combine both contributions by hand: `<persName ref=\"#bouille\" role=\"general\">Bouillé</persName>`. After synthesizing the markup, delete any leftover marker lines.\n\n**Vocabulary.** *Accept Current Change* — A VS Code shortcut that retains the local HEAD version and discards the incoming change. *Editorial Synthesis* — Combining valuable elements from both competing branches into a unified, superior reading.\n\n**Takeaway:** Resolving scholarly conflicts often requires hand-synthesizing complementary markup from both branches rather than picking one.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Step-by-Step Conflict Resolution in VS Code", "questiontext": "<p>Why is choosing \\\"Accept Current\\\" or \\\"Accept Incoming\\\" often insufficient when resolving conflicts in scholarly editions?</p>", "generalfeedback": "<p>Resolving scholarly conflicts often requires hand-synthesizing complementary markup from both branches rather than picking one.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Scholarly conflicts often involve complementary annotations (like one editor adding a lemma and another adding a role) that should be synthesized.</p>", "feedback": "<p>Correct. Blindly picking one version discards the other scholar's valid work; synthesizing both creates a richer, more complete reading.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Clicking either button permanently corrupts the operating system registry.</p>", "feedback": "<p>Incorrect. The buttons simply accept one text block; the problem is loss of complementary scholarly markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code disables those buttons for files with a `.xml` extension.</p>", "feedback": "<p>Incorrect. VS Code provides merge conflict buttons for all text files, including XML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Accepting incoming changes deletes the user's local Git repository.</p>", "feedback": "<p>Incorrect. Accepting incoming changes only updates the conflicted text in the working file.</p>"}]}}, {"step": 21, "title": "The Non-Negotiable Step: Verifying XML Well-Formedness", "content": "**The Non-Negotiable Step: Verifying XML Well-Formedness**\n\nAfter editing a merge conflict, never commit immediately. Editors often leave behind stray marker characters, duplicate tags, or broken brackets.\n\nA single remaining marker like `<<<<<<<` makes your entire document fatally invalid. An XML parser will crash when reading it. Therefore, checking well-formedness immediately after resolving a conflict is mandatory:\n\n```bash\nxmllint --noout witness.xml\n```\n\nIf `xmllint` returns complete silence with an exit code of 0, your file is clean. If it reports an error (such as `syntax error, unexpected '<'`), a broken tag or conflict marker survived. Fix the error in VS Code and run `xmllint` again until it passes cleanly.\n\n**Vocabulary.** *xmllint --noout* — A terminal utility that parses an XML document to verify syntactic well-formedness without printing the file body. *Syntax Gate* — A mandatory validation check that must pass before any file can be staged or committed.\n\n**Takeaway:** Always run xmllint --noout immediately after editing a conflict to ensure no stray markers or broken tags survive.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: The Non-Negotiable Step: Verifying XML Well-Formedness", "questiontext": "<p>Why must you always run `xmllint --noout` immediately after editing a conflicted XML file?</p>", "generalfeedback": "<p>Always run xmllint --noout immediately after editing a conflict to ensure no stray markers or broken tags survive.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To guarantee that no stray conflict markers or unclosed tags survived, which would cause XML parsers to crash fatally.</p>", "feedback": "<p>Correct. Leftover markers like `<<<<<<<` break XML well-formedness, causing parsers and schemas to abort immediately.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To automatically upload the resolved document to the university library archive.</p>", "feedback": "<p>Incorrect. `xmllint` is a local syntax checking tool; it does not upload files to archives.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To convert British spelling variants into standardized Canadian English.</p>", "feedback": "<p>Incorrect. `xmllint` checks XML syntax, not linguistic orthography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To verify that your laptop battery has sufficient charge to complete the commit.</p>", "feedback": "<p>Incorrect. `xmllint` has nothing to do with battery management.</p>"}]}}, {"step": 22, "title": "Completing the Conflict Merge Commit", "content": "**Completing the Conflict Merge Commit**\n\nWhen your resolved file passes `xmllint` and schema validation, you can finish the merge. Concluding a merge requires staging the file and recording a dedicated commit.\n\nRun these three commands in your terminal:\n\n```bash\ngit add witness.xml\ngit status\ngit commit -m \"Merge branch 'feature/date-audit': synthesize date attributes\"\n```\n\nRunning `git status` verifies that the file moved from \"Unmerged paths\" to \"Changes to be committed.\" Running `git commit` creates a **merge commit**. Unlike ordinary commits with one parent, a merge commit has two parents. It unites two diverged lines of history into one.\n\nYour repository is now clean, unconflicted, and ready for further work.\n\n**Vocabulary.** *Merge Commit* — A commit with two parent commits that records the successful integration of two diverged branches. *Staging a Resolution* — Using `git add` to tell Git that a conflicted file has been successfully edited and verified.\n\n**Takeaway:** Staging resolved files with git add and committing creates a two-parent merge commit that reunites diverged branches.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Completing the Conflict Merge Commit", "questiontext": "<p>What distinguishes a Git merge commit from a regular commit in repository history?</p>", "generalfeedback": "<p>Staging resolved files with git add and committing creates a two-parent merge commit that reunites diverged branches.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A merge commit has two parent commits, joining two diverged lines of development back into a single history.</p>", "feedback": "<p>Correct. Ordinary commits have one parent; merge commits unite two independent branches and record both parents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A merge commit cannot be viewed by other collaborators on GitHub.</p>", "feedback": "<p>Incorrect. Merge commits are pushed to remotes and viewed like any other commit.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A merge commit is automatically deleted after twenty-four hours.</p>", "feedback": "<p>Incorrect. Merge commits are permanent nodes in Git's Directed Acyclic Graph.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A merge commit does not require a commit message.</p>", "feedback": "<p>Incorrect. Merge commits require clear commit messages documenting how the conflict was resolved.</p>"}]}}, {"step": 23, "title": "GitHub Issues as Scholarly Marginalia and Task Tracking", "content": "**GitHub Issues as Scholarly Marginalia and Task Tracking**\n\nCollaboration involves more than submitting files. Scholars need a space to discuss puzzles, question tricky handwriting, and plan upcoming tasks. On GitHub, this conversation happens in **Issues**.\n\nAn Issue is a dedicated discussion thread inside a repository. Think of Issues as public scholarly marginalia. Instead of scribbling a private note about an uncertain word in Maud Lewis's letter on a napkin, Olyvia opens a GitHub Issue titled: `Paleographical query: illegible verb on folio 1 verso line 14`.\n\nIn the Issue description, Olyvia attaches an image crop. She pastes her draft transcription. She tags Ace and Andromeda using `@username`. Her classmates receive alerts, inspect the script, and reply with readings. When the team agrees, the issue is closed, leaving a permanent public record.\n\n**Vocabulary.** *GitHub Issue* — A trackable discussion thread in a repository used for reporting bugs, proposing tasks, or debating scholarly questions. *Scholarly Marginalia* — Scholarly notes, queries, and annotations recorded alongside a primary text.\n\n**Takeaway:** GitHub Issues serve as public, searchable discussion forums for tracking editorial tasks and resolving paleographical queries.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: GitHub Issues as Scholarly Marginalia and Task Tracking", "questiontext": "<p>How do GitHub Issues function as public scholarly marginalia for digital textual editors?</p>", "generalfeedback": "<p>GitHub Issues serve as public, searchable discussion forums for tracking editorial tasks and resolving paleographical queries.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They provide trackable discussion threads where editors discuss paleographical queries, tag collaborators, and preserve research debates.</p>", "feedback": "<p>Correct. Issues serve as a transparent public forum for debating difficult readings, tracking bugs, and assigning editorial tasks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They automatically print physical marginal notes in the margins of original 18th-century manuscripts.</p>", "feedback": "<p>Incorrect. Issues exist as digital discussion threads on GitHub; they do not alter physical artifacts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They allow students to submit anonymous complaints about course readings.</p>", "feedback": "<p>Incorrect. Issues are public, attributed project management threads tied to GitHub user accounts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They prevent search engines from finding your digital edition on the web.</p>", "feedback": "<p>Incorrect. Public repository issues are indexed by search engines and contribute to open scholarly transparency.</p>"}]}}, {"step": 24, "title": "Authoring Issue Templates for Digital Editions", "content": "**Authoring Issue Templates for Digital Editions**\n\nJust as pull request templates help file submissions, **issue templates** ensure structured discussions. Without templates, users open vague tickets like \"broken text\" without naming the file or folio.\n\nYou create issue templates by saving markdown files in `.github/ISSUE_TEMPLATE/`. For example, you can create a template for paleographical questions:\n\n```markdown\n---\nname: Paleographical Query\nabout: Report an illegible hand, abbreviation, or damaged text\ntitle: \"[PALEOGRAPHY]: \"\nlabels: transcription, needs-review\n---\n\n### Document and Location\n- Document: [Ace 1791 / Maud Lewis / 1752 Treaty]\n- Folio and Line Number:\n\n### Image Evidence\nAttach a high-resolution screenshot of the manuscript region.\n\n### Proposed Readings\n1. Reading A:\n2. Reading B:\n```\n\nWhen someone clicks \"New Issue\" on GitHub, this template guides them. It ensures essential coordinates and evidence are included from the start.\n\n**Vocabulary.** *Issue Template* — A pre-formatted form that guides users in submitting complete, well-documented issue tickets. *Issue Labels* — Coloured tags applied to issues to categorize their domain, priority, or status.\n\n**Takeaway:** Issue templates prompt contributors to provide exact document coordinates, image crops, and competing readings up front.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Authoring Issue Templates for Digital Editions", "questiontext": "<p>What is the primary benefit of creating specialized issue templates in `.github/ISSUE_TEMPLATE/`?</p>", "generalfeedback": "<p>Issue templates prompt contributors to provide exact document coordinates, image crops, and competing readings up front.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They structure user input with required prompts, ensuring tickets include document coordinates, image evidence, and proposed readings.</p>", "feedback": "<p>Correct. Issue templates prompt users to provide essential scholarly context up front, preventing vague or unhelpful tickets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They allow non-registered users to push code directly to the main branch.</p>", "feedback": "<p>Incorrect. Issue templates guide discussion creation; they do not grant code push permissions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They automatically resolve and close all open issues within forty-eight hours.</p>", "feedback": "<p>Incorrect. Issues remain open until human maintainers inspect and resolve them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They translate all issue discussions into Latin.</p>", "feedback": "<p>Incorrect. Templates display whatever language and fields the repository creators author.</p>"}]}}, {"step": 25, "title": "Project Management: Labels, Milestones, and Kanban Boards", "content": "**Project Management: Labels, Milestones, and Kanban Boards**\n\nAs a digital edition grows to dozens of files and hundreds of lines, managing workflow becomes essential. GitHub provides three lightweight project management tools built into every repository:\n\n<table class=\"table table-bordered my-3\">\n<thead>\n<tr>\n<th>Project Tool</th>\n<th>Function in Digital Editions</th>\n<th>Concrete Course Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Labels</strong></td>\n<td>Color-coded tags that categorize tickets by topic, status, or difficulty.</td>\n<td><code>paleography</code>, <code>tei-header</code>, <code>needs-review</code>, <code>good-first-issue</code></td>\n</tr>\n<tr>\n<td><strong>Milestones</strong></td>\n<td>Target containers that group issues and PRs under a specific deadline.</td>\n<td><code>Milestone: Week 10 Consolidation (Due Nov 13)</code></td>\n</tr>\n<tr>\n<td><strong>Project Boards</strong></td>\n<td>Visual Kanban boards with columns (To Do, In Progress, Done) to track task progress.</td>\n<td>Moving \"Tag French deputies in 1791 decree\" from In Progress to Done.</td>\n</tr>\n</tbody>\n</table>\n\nUsing these tools gives the entire editorial team a clear visual overview of progress. It ensures no historical witness is forgotten.\n\n**Vocabulary.** *Milestone* — A project management target on GitHub that tracks progress toward a specific calendar deadline. *Kanban Board* — A visual workflow management board using columns to display task status from backlog to completion.\n\n**Takeaway:** Labels, milestones, and project boards organize complex editorial labor into clear, trackable collaborative milestones.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Project Management: Labels, Milestones, and Kanban Boards", "questiontext": "<p>How do Milestones assist teams in managing collaborative digital edition deadlines?</p>", "generalfeedback": "<p>Labels, milestones, and project boards organize complex editorial labor into clear, trackable collaborative milestones.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They group related issues and pull requests together toward a specific calendar target with a visual progress bar.</p>", "feedback": "<p>Correct. Milestones track task completion against a targeted delivery date, showing what percentage of tasks are closed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They automatically deduct points from student grades if an issue is closed late.</p>", "feedback": "<p>Incorrect. Milestones are organizational project tracking tools, not automated grading systems.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They prevent collaborators from editing files on weekends or holidays.</p>", "feedback": "<p>Incorrect. Milestones do not restrict editing access times.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete all open issues once the target date is reached.</p>", "feedback": "<p>Incorrect. Open issues remain active until maintainers address them or adjust the target date.</p>"}]}}, {"step": 26, "title": "Case Study: The Scholastic Commentaries and Texts Archive (SCTA)", "content": "**Case Study: The Scholastic Commentaries and Texts Archive (SCTA)**\n\nTo see these collaboration principles operating at scale, look at the **Scholastic Commentaries and Texts Archive (SCTA)**, directed by Jeffrey Witt. The SCTA is an open digital library preserving hundreds of medieval philosophical works written between 1200 and 1500.\n\nRather than forcing scholars worldwide into a single database, the SCTA decentralizes editing. Every medieval text lives in its own Git repository on GitHub. Researchers transcribe Latin manuscripts in TEI XML on personal forks and submit updates through pull requests.\n\nAutomated scripts regularly harvest these distributed repositories. They validate TEI markup and connect them into a global Linked Data graph. Witt's design proves that distributed Git workflows can unite international researchers around complex historical texts.\n\n**Vocabulary.** *Scholastic Commentaries and Texts Archive (SCTA)* — A major distributed digital humanities project using Git and TEI to edit medieval manuscripts. *Decentralized Editing* — Allowing independent scholars to maintain separate edition repositories that aggregate into a shared network.\n\n**Takeaway:** The SCTA demonstrates how international teams use GitHub repositories and pull requests to edit medieval texts collaboratively.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Case Study: The Scholastic Commentaries and Texts Archive (SCTA)", "questiontext": "<p>How does Jeffrey Witt's SCTA project utilize distributed Git workflows to edit medieval texts?</p>", "generalfeedback": "<p>The SCTA demonstrates how international teams use GitHub repositories and pull requests to edit medieval texts collaboratively.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Independent scholars edit Latin commentaries in dedicated Git repositories, which automated scripts aggregate into a shared Linked Data graph.</p>", "feedback": "<p>Correct. The SCTA decentralizes editorial labor across individual GitHub repositories, combining them into a massive unified knowledge base.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The SCTA requires all scholars to travel to Paris and work on a single desktop computer.</p>", "feedback": "<p>Incorrect. The SCTA is an international distributed project coordinating scholars across institutions via Git.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The SCTA uses Git exclusively to distribute audio recordings of medieval church music.</p>", "feedback": "<p>Incorrect. The SCTA edits medieval philosophical and theological texts encoded in TEI XML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The SCTA bans pull requests in favor of emailing files on floppy disks.</p>", "feedback": "<p>Incorrect. The SCTA relies on GitHub pull requests and automated validation workflows.</p>"}]}}, {"step": 27, "title": "Case Study: Perseids and Classics Collaborative Editing", "content": "**Case Study: Perseids and Classics Collaborative Editing**\n\nAnother prominent example of collaborative digital philology is the **Perseids Project** at Tufts University. Perseids provides an online environment where students and professional Classicists collaborate on ancient Greek and Latin texts, papyri, and inscriptions.\n\nPerseids incorporates version control directly into its teaching. When students annotate treebanks, transcribe inscriptions, or encode variants, their work is backed by Git commits. Scholars review student contributions through a board modeled on GitHub pull requests.\n\nThis workflow turns student assignments into real scholarly contributions. A student who transcribes an inscription does not merely receive a grade. Their verified work merges into the permanent scholarly edition with full credit.\n\n**Vocabulary.** *Perseids Project* — A collaborative digital platform for editing ancient Greek and Latin texts using distributed version control. *Pedagogical Philology* — Integrating student classroom encoding directly into permanent, peer-reviewed scholarly digital editions.\n\n**Takeaway:** The Perseids Project proves that student editors can contribute directly to published digital editions through disciplined version control.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Case Study: Perseids and Classics Collaborative Editing", "questiontext": "<p>What pedagogical innovation does the Perseids Project demonstrate for student textual scholarship?</p>", "generalfeedback": "<p>The Perseids Project proves that student editors can contribute directly to published digital editions through disciplined version control.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Student classroom transcription and treebank annotations are peer-reviewed on Git, merging verified work into the published scholarly record.</p>", "feedba
