ck": "<p>Correct. Perseids integrates student coursework directly into authentic, citable digital editions through structured version-control review.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Students are graded entirely by artificial intelligence models without any instructor oversight.</p>", "feedback": "<p>Incorrect. Perseids uses human peer review boards modeled on scholarly editorial practices.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Students are forbidden from using computers and must complete all work on wax tablets.</p>", "feedback": "<p>Incorrect. Perseids is a cutting-edge web platform leveraging digital version control and XML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Student contributions are erased at the end of each semester to protect institutional copyright.</p>", "feedback": "<p>Incorrect. Verified student contributions are preserved permanently with proper attribution.</p>"}]}}, {"step": 28, "title": "Case Study: Multimodal Collaborative Editing in E-LAUTE", "content": "**Case Study: Multimodal Collaborative Editing in E-LAUTE**\n\nCollaborative version control extends beyond literary texts into diverse historical media. The **E-LAUTE** project is an international collaboration between scholars in Germany and Switzerland editing sixteenth-century lute music books.\n\nLute tablatures combine musical notes, German and French lyrics, woodcut illustrations, and printer metadata. To edit these works, the team coordinates musicologists, computer scientists, and bibliographers across institutions.\n\nThe E-LAUTE team maintains their digital editions on GitHub. They use feature branches for transcriptions, automated checks for musical validity, and GitHub Releases to publish versioned editions. Their work shows that distributed Git workflows successfully coordinate interdisciplinary teams editing varied historical media.\n\n**Vocabulary.** *E-LAUTE* — An international collaborative digital edition project encoding Renaissance lute tablatures and song lyrics. *Multimodal Edition* — A scholarly digital project that integrates text, musical notation, and visual book art into a unified edition.\n\n**Takeaway:** E-LAUTE illustrates how international interdisciplinary teams coordinate complex, multimodal digital editions using Git and GitHub.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Case Study: Multimodal Collaborative Editing in E-LAUTE", "questiontext": "<p>What challenge does the E-LAUTE project address using distributed GitHub workflows?</p>", "generalfeedback": "<p>E-LAUTE illustrates how international interdisciplinary teams coordinate complex, multimodal digital editions using Git and GitHub.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Coordinating interdisciplinary teams editing multimodal Renaissance artifacts that combine lute music, song lyrics, and visual art.</p>", "feedback": "<p>Correct. E-LAUTE uses GitHub branches, releases, and CI checks to coordinate musicologists, philologists, and programmers across institutions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating 20th-century pop songs into ancient Egyptian hieroglyphs.</p>", "feedback": "<p>Incorrect. E-LAUTE edits 16th-century Renaissance lute tablatures and song texts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Automating the physical manufacturing of wooden musical instruments in factories.</p>", "feedback": "<p>Incorrect. E-LAUTE is a digital scholarly edition project, not a manufacturing enterprise.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Banning version control in favor of handwritten letters delivered by courier.</p>", "feedback": "<p>Incorrect. E-LAUTE actively uses GitHub version control and CI pipelines.</p>"}]}}, {"step": 29, "title": "Scholarly Attribution, Provenance, and `<revisionDesc>`", "content": "**Scholarly Attribution, Provenance, and `<revisionDesc>`**\n\nWhile GitHub tracks commit hashes and usernames on the web, a TEI XML document must remain self-contained offline. In TEI P5, this internal provenance lives inside the `<revisionDesc>` element in the `<teiHeader>`.\n\nEvery major editorial milestone, pull request merge, or conflict resolution should be recorded in a `<change>` element:\n\n```xml\n<revisionDesc>\n  <change when=\"2026-11-10\" who=\"#editor\" status=\"consolidated\">\n    Consolidated Modules 1 through 9 layers; resolved merge conflict \n    in date attributes via PR #4; verified zero schema errors.\n  </change>\n</revisionDesc>\n```\n\nNotice how the TEI metadata directly references the collaborative workflow. The `@who` attribute points to the editor definition in `titleStmt`. The `@when` attribute records the date. The description records the specific pull request. By mirroring Git milestones inside the TEI header, your edition guarantees permanent, self-documenting provenance.\n\n**Vocabulary.** *revisionDesc* — The TEI Header element that records the chronological revision history of a digital edition. *change* — A single entry inside revisionDesc detailing an editorial intervention, timestamp, and responsible editor.\n\n**Takeaway:** Mirroring GitHub pull request merges and milestones inside the TEI revisionDesc element preserves self-contained scholarly provenance.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Scholarly Attribution, Provenance, and `<revisionDesc>`", "questiontext": "<p>Why should major Git pull request merges and editorial milestones be recorded in the TEI `<revisionDesc>`?</p>", "generalfeedback": "<p>Mirroring GitHub pull request merges and milestones inside the TEI revisionDesc element preserves self-contained scholarly provenance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It ensures that the document's internal revision history remains self-contained, citable, and transparent even when offline.</p>", "feedback": "<p>Correct. Recording changes inside `<revisionDesc>` preserves provenance within the XML file itself, independent of external web platforms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Git deletes commit history whenever a repository is cloned to a new computer.</p>", "feedback": "<p>Incorrect. Git preserves full commit history; `<revisionDesc>` provides standardized internal TEI metadata.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because XML parsers crash if `<revisionDesc>` contains fewer than ten entries.</p>", "feedback": "<p>Incorrect. Schemas do not mandate a specific number of change entries, though historical rigor demands thorough documentation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because recording revisions in the header automatically increments student grade scores.</p>", "feedback": "<p>Incorrect. Header metadata documents scholarly provenance; it is not a grade tracking tool.</p>"}]}}, {"step": 30, "title": "Looking Ahead to Friday: Preparing for Automated CI and Peer Review", "content": "**Looking Ahead to Friday: Preparing for Automated CI and Peer Review**\n\nToday, you connected solitary desktop editing to distributed community collaboration. You learned about remotes, forking, feature branching, pull request apparatus, and conflict resolution in VS Code.\n\nBefore our next meeting on Friday, make sure your repository is fully prepared:\n\n1. Confirm your local `witness.xml` contains all nine completed layers (metadata, facsimiles, transcription, reconciliation, regularization, reading stylesheets, lemmatization, and named entities).\n2. Verify that your file passes `xmllint --noout witness.xml` with zero syntax errors.\n3. Push your latest commits to your `main` branch on GitHub.\n\nOn Friday, in Meeting #27, we conclude our consolidation milestone. We will build an automated Continuous Integration (CI) pipeline using **GitHub Actions**. You will write an automated workflow that runs `xmllint` and the Relax NG schema every time you push. We will also exchange repositories for in-class peer review.\n\n**Vocabulary.** *Continuous Integration (CI)* — Automatically testing and validating code every time a developer pushes changes to a shared repository. *Peer Review Exchange* — An in-class exercise where students evaluate a classmate's edition against a structured rubric.\n\n**Takeaway:** Preparing your repository today sets the stage for Friday's automated GitHub Actions validation and collaborative peer review.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: Looking Ahead to Friday: Preparing for Automated CI and Peer Review", "questiontext": "<p>What preparation is required before Friday's Meeting #27 on Continuous Integration and peer review?</p>", "generalfeedback": "<p>Preparing your repository today sets the stage for Friday's automated GitHub Actions validation and collaborative peer review.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Confirming that local witness files contain all nine layers, pass `xmllint` with 0 errors, and are pushed to GitHub main.</p>", "feedback": "<p>Correct. Friday's automated CI and peer review exchange requires a clean, complete, and syntactically valid baseline repository.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all previous commits so that Friday's automated test runs faster.</p>", "feedback": "<p>Incorrect. Version history is essential for peer review; never delete commit history.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Printing the entire XML document on physical paper to turn in by hand.</p>", "feedback": "<p>Incorrect. Quality assurance and peer review will be conducted digitally on GitHub.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Disabling Internet access on your laptop for the duration of the semester.</p>", "feedback": "<p>Incorrect. GitHub collaboration and CI test runners require Internet connectivity.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
