    <script>
        const lessonData = {"course_title": "Deterministic NLP Tagging, Lemmatization, and Universal Dependencies", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "From Hand Parsing to Algorithmic Pipelines", "content": "**From Hand Parsing to Algorithmic Pipelines**\n\nYesterday, in Lesson 8.1, you parsed and lemmatized a twenty-word passage from your manuscript witness by hand. You looked up each word in a scholarly dictionary, chose the correct part-of-speech tag. Recorded its grammatical features. That manual work gave you an authoritatively verified ground truth.\n\nToday, we take Step 2 of our three-step comparative cycle: deterministic, automated language processing. In modern digital humanities projects, editors cannot parse million-word collections by hand. We need computer programs that can tokenize, tag, and lemmatize text automatically in fractions of a second.\n\nYet automation comes with a price. Algorithms follow fixed rules and statistical patterns trained on modern newspapers and books. When an algorithm encounters an eighteenth-century legal treaty, a French Revolutionary. A handwritten folk art letter, it often makes surprising mistakes. Today, you will run automated tagging tools over your text and measure their accuracy directly against yesterday's manual baseline.\n\n**Vocabulary.** *Natural Language Processing (NLP)* — Computational methods for analyzing, parsing. Understanding human language in digital texts. *Deterministic Pipeline*. Software that follows fixed algorithms and statistical models, producing the same output for a given input every time.\n\n**Takeaway:** Automated NLP pipelines process large corpora quickly. Their accuracy must be measured against an authoritative manual ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: From Hand Parsing to Algorithmic Pipelines", "questiontext": "<p>Why must digital textual scholars evaluate automated NLP pipelines against an authoritatively verified manual ground truth?</p>", "generalfeedback": "<p>Automated NLP pipelines process large corpora quickly, but their accuracy must be measured against an authoritative manual ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because automated tools are trained on modern data and often make predictable errors on historical prose.</p>", "feedback": "<p>Correct. Pre-trained models reflect modern language patterns and must be benchmarked against manual historical truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because automated tools always produce zero percent accuracy on all text files.</p>", "feedback": "<p>Incorrect. Modern tools often achieve high accuracy, but error rates spike on historical orthography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because university accreditation rules forbid computers from processing historical manuscripts.</p>", "feedback": "<p>Incorrect. Digital humanities encourages automated methods when rigorously validated.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because manual parsing deletes all files from the server.</p>", "feedback": "<p>Incorrect. Manual parsing provides the reference benchmark for testing.</p>"}]}}, {"step": 2, "title": "How Rule-Based Lemmatizers Work", "content": "**How Rule-Based Lemmatizers Work**\n\nThe earliest automated lemmatizers relied entirely on explicit rules written by linguists. These programs are called **rule-based lemmatizers**.\n\nA rule-based program uses two main tools: an internal dictionary of known root words and a set of ending rules. When the program reads an inflected English word like *treaties*, it checks its rules. A rule says: if a word ends in *ies*, replace *ies* with *y* and check if *treaty* is in the dictionary. Since *treaty* is found, the program assigns *treaty* as the lemma.\n\nFor regular words, rule systems are fast and predictable. However, natural language is full of irregular exceptions. If a program encounters *was* or *went*, simple suffix rules fail. The program must consult a large table of irregular forms (*went* maps to *go*, *was* maps to *be*). If an old word form is missing from that table, the rule system cannot solve it.\n\n**Vocabulary.** *Rule-Based System* — Software that analyzes language using explicit human-written rules and lookup tables. *Suffix Stripping* — Removing common word endings (like *-ing* or *-ed*) to find a base stem.\n\n**Takeaway:** Rule-based lemmatizers combine ending rules with lookup tables of irregular forms to identify base words.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: How Rule-Based Lemmatizers Work", "questiontext": "<p>How does a traditional rule-based lemmatizer determine the dictionary headword for an inflected word?</p>", "generalfeedback": "<p>Rule-based lemmatizers combine suffix-stripping rules with lookup tables of irregular forms to identify base words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By combining suffix-stripping rules with lookup tables of known roots and irregular word forms.</p>", "feedback": "<p>Correct. Rule-based systems strip standard endings (like -ies to -y) and check irregular tables (like went to go).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By asking human editors questions over a phone network.</p>", "feedback": "<p>Incorrect. Rule-based algorithms execute deterministic local code.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By translating the word into binary code and measuring electrical resistance.</p>", "feedback": "<p>Incorrect. Lemmatization is a symbolic and lexicographical algorithm.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By picking a random word from the first page of a dictionary.</p>", "feedback": "<p>Incorrect. Rules follow systematic linguistic algorithms.</p>"}]}}, {"step": 3, "title": "Statistical Sequence Taggers: Parts of Speech in Context", "content": "**Statistical Sequence Taggers: Parts of Speech in Context**\n\nIdentifying parts of speech is harder than simply looking up words in a list. As you saw yesterday, homographs like *will*, *left*, and *est* can belong to multiple grammatical categories. To pick the right tag, an algorithm must look at surrounding words.\n\nModern deterministic tools use **statistical sequence models**, such as Hidden Markov Models or Decision trees. These models are trained on large collections of hand-tagged sentences called **training corpora**. By reading millions of tagged words, the algorithm learns word chances: how often a determiner like *the* is followed by a noun versus a verb.\n\nWhen the tagger reads *the will of the people*, it calculates probabilities. It knows that after *the*, the word *will* is far more likely to be a noun than a helping verb. By calculating probabilities across whole sentences, statistical taggers achieve ninety to ninety-five percent accuracy on modern standard texts.\n\n**Vocabulary.** *Sequence Model*. An algorithm that predicts labels for a sequence of tokens based on surrounding context. *Training Corpus* — A large body of human-annotated text used to train statistical language algorithms.\n\n**Takeaway:** Statistical taggers calculate probabilities from surrounding sentence context to predict parts of speech for ambiguous words.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: Statistical Sequence Taggers: Parts of Speech in Context", "questiontext": "<p>How do statistical sequence taggers resolve the part of speech for ambiguous homographs like will or est?</p>", "generalfeedback": "<p>Statistical taggers calculate probabilities from surrounding sentence context to predict parts of speech for ambiguous words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By calculating transition probabilities from surrounding words in a sentence based on training corpora.</p>", "feedback": "<p>Correct. Sequence models evaluate neighboring words (such as preceding determiners) to predict the most likely part of speech.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By selecting whichever part of speech has the shortest English definition.</p>", "feedback": "<p>Incorrect. Statistical taggers evaluate surrounding sentence probabilities, not definition lengths.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By refusing to tag any word that appears more than once in a paragraph.</p>", "feedback": "<p>Incorrect. Frequent words are processed on every occurrence in context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By converting the entire text into uppercase letters.</p>", "feedback": "<p>Incorrect. Case conversion does not resolve part-of-speech probabilities.</p>"}]}}, {"step": 4, "title": "TreeTagger: The Probabilistic Decision-Tree Engine", "content": "**TreeTagger: The Probabilistic Decision-Tree Engine**\n\nOne of the most famous and durable tools in digital humanities is **TreeTagger**, developed by Helmut Schmid at the University of Stuttgart. TreeTagger is widely used because it supports dozens of languages, including English, French, Latin, and German.\n\nTreeTagger uses decision trees to estimate word chances. A decision tree asks a sequence of yes-or-no questions about neighboring words. For example: Is the previous word a determiner? Is the next word a finite verb? Based on the answers, the tree navigates to a leaf node that assigns the most probable part-of-speech tag and dictionary lemma.\n\nTreeTagger is fast, lightweight, and deterministic. It processes thousands of words per second on an ordinary laptop. Because it has been refined over three decades, its French and English parameter files handle complex syntax with remarkable stability.\n\n**Vocabulary.** *TreeTagger*. A standard statistical software tool that uses decision trees to assign part-of-speech tags and lemmas to text. *Decision Tree* — A branching flowchart algorithm that sorts data by answering a series of categorical questions.\n\n**Takeaway:** TreeTagger uses decision trees to assign parts of speech and lemmas rapidly across many historical and modern languages.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: TreeTagger: The Probabilistic Decision-Tree Engine", "questiontext": "<p>What algorithmic architecture enables Helmut Schmid's TreeTagger to assign parts of speech and lemmas efficiently?</p>", "generalfeedback": "<p>TreeTagger uses decision trees to assign parts of speech and lemmas rapidly across many historical and modern languages.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A decision tree that evaluates sequences of categorical questions about neighboring words.</p>", "feedback": "<p>Correct. TreeTagger uses decision trees to estimate transition probabilities from context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A physical mechanical typewriter installed in a library basement.</p>", "feedback": "<p>Incorrect. TreeTagger is a software application developed in computational linguistics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A search engine crawler that queries public websites in real time.</p>", "feedback": "<p>Incorrect. TreeTagger runs locally using pre-compiled parameter files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A random number generator with no linguistic training data.</p>", "feedback": "<p>Incorrect. TreeTagger is trained on curated corpora.</p>"}]}}, {"step": 5, "title": "SpaCy and Stanza: Modern Industrial NLP in Python", "content": "**SpaCy and Stanza: Modern Industrial NLP in Python**\n\nWhile TreeTagger remains a classic tool, modern computational linguistics often relies on Python-based libraries like **SpaCy** and **Stanza**.\n\nSpaCy is designed for fast text analysis. It includes pre-trained neural and statistical pipelines for over twenty languages. In Python, you can load a model with a single line of code and pass text to it directly. SpaCy tokenizes the text, tags parts of speech, extracts lemmas, and builds complete sentence trees in memory.\n\nStanza, developed by the Stanford NLP Group, offers similar capabilities with deep support for historical treebanks. For our work in RELS 398, SpaCy provides a fast and accessible way to test automated parsing in VS Code. Models like `en_core_web_sm` for English and `fr_core_news_sm` for French give you instant access to standard Universal Dependencies pipelines.\n\n**Vocabulary.** *SpaCy* — A popular open-source Python library for advanced language processing. *Pre-Trained Pipeline* — A ready-to-use software package containing statistical models and dictionaries trained on large text datasets.\n\n**Takeaway:** Python libraries like SpaCy provide fast pre-trained language pipelines that tokenize, tag, lemmatiz. Parse sentences with simple code.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: SpaCy and Stanza: Modern Industrial NLP in Python", "questiontext": "<p>What capability distinguishes modern Python NLP libraries like SpaCy and Stanza?</p>", "generalfeedback": "<p>Python libraries like SpaCy provide fast pre-trained language pipelines that tokenize, tag, lemmatize, and parse sentences with simple code.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They provide pre-trained modular pipelines that tokenize, tag parts of speech, lemmatize, and parse syntax with simple code.</p>", "feedback": "<p>Correct. Libraries like SpaCy package tokenizers, taggers, lemmatizers, and parsers into unified Python pipelines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They physically repair torn parchment in library archives.</p>", "feedback": "<p>Incorrect. SpaCy is a computational text-processing library.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They automatically delete all XML files that contain spelling errors.</p>", "feedback": "<p>Incorrect. Python libraries process text in memory without deleting source files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They require users to write all code in machine binary.</p>", "feedback": "<p>Incorrect. SpaCy provides high-level, human-readable Python functions.</p>"}]}}, {"step": 6, "title": "Setting Up Python for Language Processing in VS Code", "content": "**Setting Up Python for Language Processing in VS Code**\n\nRunning an NLP pipeline does not require complicated software. In VS Code, you can write a short Python script that loads your transcript and runs a language pipeline in a few lines.\n\nHere is what a complete ten-line Python script looks like using SpaCy:\n\n```python\nimport spacy\n\n# Load the standard English language model\nnlp = spacy.load(\"en_core_web_sm\")\n\n# Read your 20-word text excerpt\ntext = \"All Treaties shall be renewed by the Governor.\"\n\n# Process the text\ndoc = nlp(text)\n\n# Print the automated results\nfor token in doc:\n    print(f\"{token.text:12} {token.lemma_:12} {token.pos_:8} {token.dep_:8}\")\n```\n\nWhen you run this script, SpaCy processes every token and outputs a clean table showing the surface text, the predicted lemma, the UPOS tag. The grammatical dependency relation.\n\n**Takeaway:** A short Python script using SpaCy can load a pre-trained model and print lemmas, parts of sp. Grammar links in seconds.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Setting Up Python for Language Processing in VS Code", "questiontext": "<p>What standard Python object in SpaCy holds the processed tokens, lemmas, and syntactic tags for an analyzed sentence?</p>", "generalfeedback": "<p>A short Python script using SpaCy can load a pre-trained model and print lemmas, parts of speech, and syntactic relations in seconds.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A Doc container object iterated over individual Token objects.</p>", "feedback": "<p>Correct. Passing text to a SpaCy model returns a Doc object containing Token instances with attributes like lemma_ and pos_.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An unformatted plain-text bitmap image.</p>", "feedback": "<p>Incorrect. SpaCy returns structured linguistic Python objects.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A locked PDF file stored in the trash.</p>", "feedback": "<p>Incorrect. The Doc object is an active in-memory data structure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A hardware serial port address.</p>", "feedback": "<p>Incorrect. Token attributes are accessed via standard Python object properties.</p>"}]}}, {"step": 7, "title": "The Out-of-Vocabulary (OOV) Dilemma", "content": "**The Out-of-Vocabulary (OOV) Dilemma**\n\nWhen an automated tagger reads modern text, it performs with high accuracy. When it reads historical manuscripts, it runs directly into the **Out-of-Vocabulary (OOV)** problem.\n\nAn OOV word is any token that does not exist in the software's training dictionary. Modern language models are trained on contemporary sources like Wikipedia, news articles, and modern books. They know modern vocabulary intimately. However, they have never seen eighteenth-century abbreviations, regional dialect spellings, or archaic contractions.\n\nWhen a tagger encounters an OOV word, its dictionary lookup fails. Most taggers fall back to a simple default: they assume the lemma is identical to the surface string. They guess based on common prefixes and suffixes. In historical documents, this causes frequent errors.\n\n**Vocabulary.** *Out-of-Vocabulary (OOV)*. A word that does not appear in a language model's vocabulary list or dictionary. *Graceful Degradation* — How software behaves when it meets unexpected input without crashing.\n\n**Takeaway:** The missing word problem occurs when historical words or unusual spellings are missing from an automated model's training dictionary.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: The Out-of-Vocabulary (OOV) Dilemma", "questiontext": "<p>What causes the Out-of-Vocabulary (OOV) problem when running modern NLP pipelines on historical documents?</p>", "generalfeedback": "<p>The Out-of-Vocabulary problem occurs when historical words or unusual spellings are missing from an automated model's training dictionary.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Historical words or archaic spellings do not exist in the modern dictionary data used to train the software.</p>", "feedback": "<p>Correct. Models trained on modern texts lack entries for eighteenth-century orthography and scribal variants.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer hard drive runs completely out of digital storage space.</p>", "feedback": "<p>Incorrect. OOV refers to missing lexical items in a language model, not disk space.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The text file is encrypted with military-grade passwords.</p>", "feedback": "<p>Incorrect. OOV occurs on readable, unencrypted historical text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The software refuses to parse words containing more than three vowels.</p>", "feedback": "<p>Incorrect. Word length does not trigger OOV failures; absent lexicon entries do.</p>"}]}}, {"step": 8, "title": "Handling Historical Spelling in Deterministic Models", "content": "**Handling Historical Spelling in Deterministic Models**\n\nHistorical spelling variations present a severe obstacle for deterministic taggers. In Module 6, you saw how eighteenth-century scribes used spellings that look unfamiliar today.\n\nIn Andromeda's 1752 Treaty, words like *shew'd* (for *showed*) or *promis'd* (for *promised*) confuse modern models. Because *shew'd* is not in the modern dictionary, the tagger cannot find the lemma *show*. It may tag *shew'd* as a noun or invent a fictitious lemma *shew'd*.\n\nIn Ace's 1791 French decree, eighteenth-century scribes wrote imperfect verb endings with *-oit* instead of modern *-ait* (*faisoit*, *décrétoit*). A modern French model expects *faisait* or *décrétait*. When it sees *faisoit*, it fails to recognize the verb *faire*. As an editor, understanding this limitation helps you diagnose why taggers stumble on archival sources.\n\n**Takeaway:** Historical spelling variations like French *-oit* or English *shew'd* confuse automated taggers because they deviate from modern training lexica.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Handling Historical Orthography in Deterministic Models", "questiontext": "<p>Why do eighteenth-century French spellings like décrétoit or English spellings like shew'd trigger errors in modern taggers?</p>", "generalfeedback": "<p>Historical spelling variations like French -oit or English shew'd confuse automated taggers because they deviate from modern training lexica.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Modern training lexica expect standardized forms like décrétait and showed, failing to recognize archaic suffixes.</p>", "feedback": "<p>Correct. Deviations from modern standardized orthography prevent models from matching words in their internal lexica.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Historical scribes wrote in secret mathematical ciphers designed to prevent reading.</p>", "feedback": "<p>Incorrect. Premodern archival records were written for contemporary human comprehension.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Eighteenth-century words contain characters that cannot be rendered in Unicode.</p>", "feedback": "<p>Incorrect. Historical alphabetic text is fully encoded in UTF-8.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modern software automatically deletes any word older than fifty years.</p>", "feedback": "<p>Incorrect. Software processes text without temporal deletion rules.</p>"}]}}, {"step": 9, "title": "Universal Dependencies in Automated NLP", "content": "**Universal Dependencies in Automated NLP**\n\nA major benefit of modern NLP pipelines like SpaCy and Stanza is that they output standard **Universal Dependencies (UD)** tags by default.\n\nWhen SpaCy processes a sentence, its `token.pos_` attribute returns the exact 17 UPOS tags you learned yesterday (`NOUN`, `VERB`, `ADJ`, `DET`, `PUNCT`). Its `token.morph` attribute provides standard FEATS pairs, such as `Number=Plur` or `Tense=Past`.\n\nThis standardization is crucial for our comparative workflow. Because the automated program outputs the same tag names as your manual ground truth from Lesson 8.1, you can compare human and computer decisions directly in code. You do not need to translate between different labeling systems.\n\n**Takeaway:** Modern NLP libraries output Universal Dependencies tags by default, allowing direct side-by-side comparison with your manual ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Universal Dependencies in Automated NLP", "questiontext": "<p>Why is it beneficial that tools like SpaCy and Stanza output standard Universal Dependencies tags by default?</p>", "generalfeedback": "<p>Modern NLP libraries output Universal Dependencies tags by default, allowing direct side-by-side comparison with your manual ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Their predictions can be directly compared against your manual ground truth without translating between naming systems.</p>", "feedback": "<p>Correct. Shared UPOS and FEATS standards allow immediate side-by-side automated evaluation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces all languages to translate their text into French.</p>", "feedback": "<p>Incorrect. Universal Dependencies provides grammatical labels, not translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents students from seeing any errors made by the computer.</p>", "feedback": "<p>Incorrect. Standardized tags make errors immediately apparent in comparative audits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes the historical author's name in the teiHeader.</p>", "feedback": "<p>Incorrect. Linguistic tagging does not alter metadata author credits.</p>"}]}}, {"step": 10, "title": "Tokenization Pitfalls in French: Clitics and Apostrophes", "content": "**Tokenization Pitfalls in French: Clitics and Apostrophes**\n\nBefore a computer can tag parts of speech, it must tokenize the text. In French, apostrophes create frequent tokenization traps for automated tools.\n\nIn Ace's 1791 decree, phrases like *l'assemblée* or *d'état* require splitting the clitic from the noun. Modern French SpaCy models usually handle standard clitics like *l'* and *d'* correctly. However, if a historical document contains irregular spacing (such as *l ' assemblée* or *d' accord* with extra space), the tokenizer can split in the wrong place.\n\nWorse, archaic contractions like *qu'il* or *lorsqu'il* are sometimes kept as a single token by older taggers. When this happens, the entire multi-word unit receives an inaccurate tag. The second word loses its lemma. Checking token boundaries is always the first diagnostic step when evaluating tagger output.\n\n**Takeaway:** In French text, verify that automated tokenizers split apostrophe clitics cleanly so that articles and nouns receive separate tags.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Tokenization Pitfalls in French: Clitics and Apostrophes", "questiontext": "<p>What common tokenization error occurs when automated taggers process French phrases with apostrophes (like l'assemblée)?</p>", "generalfeedback": "<p>In French text, verify that automated tokenizers split apostrophe clitics cleanly so that articles and nouns receive separate tags.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Failing to split the clitic article from the noun, causing the entire string to be misclassified as a single unit.</p>", "feedback": "<p>Correct. Keeping l'assemblée as one token prevents both the determiner and the noun from receiving clean tags.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting the noun and keeping only the letter L.</p>", "feedback": "<p>Incorrect. Tokenizers do not delete words; they split or merge characters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replacing the apostrophe with an exclamation mark.</p>", "feedback": "<p>Incorrect. Punctuation is preserved or separated, not swapped for other marks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating the French noun into German.</p>", "feedback": "<p>Incorrect. Tokenization segments text in its original language.</p>"}]}}, {"step": 11, "title": "Tokenization Pitfalls in English: Contractions and Hyphens", "content": "**Tokenization Pitfalls in English: Contractions and Hyphens**\n\nHistorical English documents present their own tokenization challenges. In Maud Lewis's informal correspondence, contractions like *can't*, *it's*, and *I'll* appear frequently.\n\nModern English SpaCy tokenizers are programmed to split contractions into syntactic components: *ca* + *n't*. *i* + *'ll*. However, if the scribe wrote with non-standard punctuation (such as a grave accent instead of an apostrop. Missing spaces), the tokenizer treats the contraction as a single unknown word.\n\nIn Andromeda's 1752 Treaty, legal compounds like *hereinafter*, *whereof*, and *thereunto* pose the opposite problem. Are they single tokens or multiple words? Most modern tokenizers treat *whereof* as a single token with UPOS `ADV`. If your project policy in `LEMMATIZATION_POLICIES.md` specifies a different split, an editorial disagreement occurs.\n\n**Takeaway:** Verify how automated tokenizers handle informal contractions and historical compound adverbs against your project policies.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Tokenization Pitfalls in English: Contractions and Hyphens", "questiontext": "<p>How do modern English tokenizers typically handle informal contractions like can't or didn't?</p>", "generalfeedback": "<p>Verify how automated tokenizers handle informal contractions and historical compound adverbs against your project policies.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They split the contraction into two syntactic tokens, separating the auxiliary verb from the negative particle.</p>", "feedback": "<p>Correct. Splitting can't into ca + n't allows the helping verb and negative adverb to be tagged independently.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete the contraction and insert a question mark.</p>", "feedback": "<p>Incorrect. Punctuation and letters are preserved across tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They merge the entire paragraph into one giant compound word.</p>", "feedback": "<p>Incorrect. Tokenizers segment sentences into individual word units.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They convert negative contractions into positive verbs.</p>", "feedback": "<p>Incorrect. Grammatical tokenization preserves semantic polarity.</p>"}]}}, {"step": 12, "title": "Homograph Meaning choice Under the Microscope", "content": "**Homograph Meaning choice Under the Microscope**\n\nYesterday, you learned that homographs like *will* and *est* require sentence context to resolve. Today, you can test how well statistical algorithms handle those same ambiguous words.\n\nIn Andromeda's 1752 Treaty, consider the sentence: *The Chief will observe this Treaty of his own free will*. The word *will* appears twice. The first *will* is an auxiliary verb (`AUX`). The second *will* is a common noun (`NOUN`).\n\nWhen you run SpaCy over this sentence, the statistical model uses surrounding words to make its choices. Because the first *will* precedes the infinitive *observe*, SpaCy predicts `AUX`. Because the second *will* follows the adjectives *own free*, SpaCy predicts `NOUN`. In this test, the statistical model succeeds! However, if sentence syntax is distorted by archaic word order, the model's predictions often collapse.\n\n**Takeaway:** Statistical models use neighboring words to resolve double meanings, succeeding on standard syntax but stumbling on unusual historical phrasing.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Homograph Disambiguation Under the Microscope", "questiontext": "<p>In the sentence The Chief will observe this Treaty of his own free will, how does a statistical model determine that the second will is a noun?</p>", "generalfeedback": "<p>Statistical models use neighboring words to disambiguate homographs, succeeding on standard syntax but stumbling on unusual historical phrasing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It evaluates preceding words like own free, recognizing that adjectives typically modify nouns.</p>", "feedback": "<p>Correct. Neighboring adjective modifiers provide strong statistical evidence that will functions as a noun.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It consults an astrological horoscope to make its choice.</p>", "feedback": "<p>Incorrect. Models rely on mathematical transition probabilities from surrounding text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It assumes the first occurrence of any word is a verb and all subsequent occurrences are nouns.</p>", "feedback": "<p>Incorrect. Tagging evaluates local syntactic context, not arbitrary position rules.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the second word because repetitions are prohibited.</p>", "feedback": "<p>Incorrect. Repetitions are tagged based on their immediate syntactic environment.</p>"}]}}, {"step": 13, "title": "Universal Dependencies Syntactic Relations (DEPREL)", "content": "**Universal Dependencies Syntactic Relations (DEPREL)**\n\nIn addition to tagging parts of speech, modern pipelines analyze sentence grammar by predicting **dependency relations (DEPREL)**.\n\nIn Universal Dependencies, every word in a clause connects to a governing head word through a labeled relation. Here is a summary of the most common dependency tags used by automated tools:\n\n<table>\n  <thead>\n    <tr>\n      <th>Relation</th>\n      <th>Description</th>\n      <th>Example (Head → Dependent)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>root</code></td>\n      <td>Main clause verb</td>\n      <td>[Sentence] → renewed</td>\n    </tr>\n    <tr>\n      <td><code>nsubj</code></td>\n      <td>Nominal subject</td>\n      <td>renewed → Treaties</td>\n    </tr>\n    <tr>\n      <td><code>obj</code></td>\n      <td>Direct object</td>\n      <td>signed → Treaty</td>\n    </tr>\n    <tr>\n      <td><code>iobj</code></td>\n      <td>Indirect object</td>\n      <td>gave → Chief</td>\n    </tr>\n    <tr>\n      <td><code>amod</code></td>\n      <td>Adjectival modifier</td>\n      <td>Treaty → peaceable</td>\n    </tr>\n    <tr>\n      <td><code>det</code></td>\n      <td>Determiner</td>\n      <td>Treaty → the</td>\n    </tr>\n    <tr>\n      <td><code>case</code></td>\n      <td>Preposition marker</td>\n      <td>Governor → by</td>\n    </tr>\n    <tr>\n      <td><code>punct</code></td>\n      <td>Punctuation mark</td>\n      <td>renewed → .</td>\n    </tr>\n  </tbody>\n</table>\n\nThese tags show how words work together to build meaning.\n\n**Takeaway:** Relation tags like `nsubj`, `obj`. `case` describe the specific grammatical jobs that words perform in clauses.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Universal Dependencies Syntactic Relations (DEPREL)", "questiontext": "<p>Which Universal Dependencies relation tag labels the nominal subject of an active transitive verb?</p>", "generalfeedback": "<p>Dependency relation tags like nsubj, obj, and case describe the specific grammatical jobs that words perform in clauses.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>nsubj</p>", "feedback": "<p>Correct. nsubj identifies the nominal subject governing an active verb predicate.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>obj</p>", "feedback": "<p>Incorrect. obj identifies the direct object receiving the action.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>amod</p>", "feedback": "<p>Incorrect. amod identifies an adjectival modifier.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>punct</p>", "feedback": "<p>Incorrect. punct identifies punctuation marks.</p>"}]}}, {"step": 14, "title": "Heads and Dependents in Automated Trees", "content": "**Heads and Dependents in Automated Trees**\n\nHow do automated parsers connect words into syntactic trees? In dependency grammar, every word has exactly one governing **head**, except for the main verb. This is the **root** of the sentence.\n\nConsider the passive clause: *All Treaties shall be renewed by the Governor*. In this sentence, the main past participle *renewed* is the structural root (Head = 0). The subject noun *Treaties* points to *renewed* as its head with relation `nsubj:pass`. The helping verb *shall* points to *renewed* with relation `aux`. The infinitive *be* points to *renewed* with relation `aux:pass`.\n\nPrepositional phrases also attach to their heads. In *by the Governor*, the noun *Governor* attaches to *renewed* as an oblique agent (`obl`). The preposition *by* attaches to *Governor* with relation `case`. The parser builds a complete tree linking every word back to the central verb.\n\n**Vocabulary.** *Root* — The main governing verb of an independent clause. This has no syntactic head in the sentence. *Oblique (obl)* — A noun phrase functioning as an adverbial modifier, usually introduced by a preposition.\n\n**Takeaway:** Dependency parsers link every word to a governing head word, creating a rooted tree centered on the main finite verb.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Heads and Dependents in Automated Trees", "questiontext": "<p>What role does the main finite verb serve in a dependency grammar sentence tree?</p>", "generalfeedback": "<p>Dependency parsers link every word to a governing head word, creating a rooted tree centered on the main finite verb.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The structural root of the sentence, possessing no governing head within the clause.</p>", "feedback": "<p>Correct. The main verb serves as the root (Head = 0) from which all subjects, objects, and modifiers depend.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A minor dependent modifier attached to a punctuation mark.</p>", "feedback": "<p>Incorrect. Punctuation attaches to the clause, while the verb governs the sentence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The direct object of the first preposition in the sentence.</p>", "feedback": "<p>Incorrect. Prepositions govern nouns; the main finite verb serves as the clause root.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An external metadata tag stored only in the teiHeader.</p>", "feedback": "<p>Incorrect. Verbs are syntactic words in the running text body.</p>"}]}}, {"step": 15, "title": "Visualizing Dependency Trees with displaCy", "content": "**Visualizing Dependency Trees with displaCy**\n\nLooking at text tables of heads and relation tags can feel abstract. SpaCy provides a built-in visualization tool called **displaCy** that renders syntactic trees into beautiful graphical diagrams.\n\nWith a single Python command, you can launch a local web server or generate an SVG image showing arrows connecting heads to dependents:\n\n```python\nfrom spacy import displacy\n\n# Generate an SVG visualization of the syntax tree\nsvg = displacy.render(doc, style=\"dep\", jupyter=False)\n\n# Save the SVG image to disk\nwith open(\"syntax_tree.svg\", \"w\", encoding=\"utf-8\") as f:\n    f.write(svg)\n```\n\nOpening `syntax_tree.svg` in your browser reveals the sentence structure visually. Curved arrows arc from *renewed* to *Treaties*, labeled with `nsubj`. Seeing the visual tree makes grammatical hierarchies immediately intuitive.\n\n**Vocabulary.** *displaCy*. A visual rendering tool in spacy that turns dependency trees and entity markup into interactive diagrams. *SVG* — Vector graphics, an open image format for rendering clean vector lines in web browsers.\n\n**Takeaway:** Visualizing syntax trees with displaCy turns abstract grammar links into clear graphical diagrams of sentence structure.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Visualizing Dependency Trees with displaCy", "questiontext": "<p>What visual insight does the displaCy rendering tool provide to an editor?</p>", "generalfeedback": "<p>Visualizing syntax trees with displaCy turns abstract dependency relations into clear graphical diagrams of sentence structure.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It renders sentence syntax as an interactive graphical diagram with directed arrows linking heads to dependents.</p>", "feedback": "<p>Correct. displaCy draws visual arcs between words labeled with their dependency relation tags.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It generates three-dimensional animated cartoons of manuscript authors.</p>", "feedback": "<p>Incorrect. displaCy renders linguistic dependency trees, not character animations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It displays a satellite map showing where the parchment was manufactured.</p>", "feedback": "<p>Incorrect. displaCy visualizes grammatical syntax.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It hides all text and shows only black rectangles on screen.</p>", "feedback": "<p>Incorrect. displaCy makes sentence structure transparent and legible.</p>"}]}}, {"step": 16, "title": "The CoNLL-U Data Pipeline in Python", "content": "**The CoNLL-U Data Pipeline in Python**\n\nYesterday, you learned that CoNLL-U is the global ten-column plain-text exchange format for Universal Dependencies. In Python, you can easily read, modify, and write CoNLL-U files.\n\nWhen you run an automated pipeline like SpaCy or Stanza, you can export the results directly into CoNLL-U format using the open-source `spacy-conll` package or a simple Python loop:\n\n```python\nfor i, token in enumerate(doc, 1):\n    head_id = token.head.i + 1 if token.head != token else 0\n    print(f\"{i}\\t{token.text}\\t{token.lemma_}\\t{token.pos_}\\t_\\t{token.morph}\\t{head_id}\\t{token.dep_}\\t_\\t_\")\n```\n\nThis short script produces standard ten-column CoNLL-U output. Because CoNLL-U is plain text, you can save it to `nlp_baseline.conllu` in your repository and diff it directly against your manual ground truth.\n\n**Takeaway:** Python scripts can format automated NLP predictions directly into standard ten-column CoNLL-U exchange files.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: The CoNLL-U Data Pipeline in Python", "questiontext": "<p>How do Python NLP scripts format automated linguistic annotations for export to CoNLL-U files?</p>", "generalfeedback": "<p>Python scripts can format automated NLP predictions directly into standard ten-column CoNLL-U exchange files.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By printing each token as a tab-delimited line with ten standard Universal Dependencies columns.</p>", "feedback": "<p>Correct. CoNLL-U files use 10 tab-separated columns for index, surface form, lemma, UPOS, FEATS, and syntax.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By writing encrypted binary code that cannot be opened in text editors.</p>", "feedback": "<p>Incorrect. CoNLL-U is a plain-text exchange format.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By printing words diagonally across the terminal screen.</p>", "feedback": "<p>Incorrect. CoNLL-U requires strict tabular column formatting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By converting all characters into hexadecimal numbers.</p>", "feedback": "<p>Incorrect. CoNLL-U uses standard UTF-8 characters.</p>"}]}}, {"step": 17, "title": "Running an NLP Pipeline on the 1752 Treaty", "content": "**Running an NLP Pipeline on the 1752 Treaty**\n\nLet us look at what happens when we run an automated English SpaCy pipeline on the opening clause from Andromeda's project: *All Treaties shall be renewed*.\n\nHere are the automated predictions:\n\n<table>\n  <thead>\n    <tr>\n      <th>Token</th>\n      <th>Predicted Lemma</th>\n      <th>Predicted UPOS</th>\n      <th>Predicted Deprel</th>\n      <th>Manual Truth Match?</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>All</td>\n      <td>all</td>\n      <td><code>DET</code></td>\n      <td><code>det</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>Treaties</td>\n      <td>treaty</td>\n      <td><code>NOUN</code></td>\n      <td><code>nsubj:pass</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>shall</td>\n      <td>shall</td>\n      <td><code>AUX</code></td>\n      <td><code>aux</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>be</td>\n      <td>be</td>\n      <td><code>AUX</code></td>\n      <td><code>aux:pass</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>renewed</td>\n      <td>renew</td>\n      <td><code>VERB</code></td>\n      <td><code>ROOT</code></td>\n      <td>Match</td>\n    </tr>\n  </tbody>\n</table>\n\nOn this straightforward legal sentence, the modern model achieves a perfect score! Every lemma matches the OED baseline, every part of sp. The passive dependency structure is correctly analyzed.\n\n**Takeaway:** On formal clauses with standard grammar, modern automated pipelines can achieve high accuracy matching human ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Running an NLP Pipeline on the 1752 Treaty", "questiontext": "<p>In the 1752 Treaty clause All Treaties shall be renewed, why does an automated pipeline achieve high accuracy?</p>", "generalfeedback": "<p>On formal clauses with standard grammar, modern automated pipelines can achieve high accuracy matching human ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because the vocabulary is formal and standard, and the passive syntax matches patterns in modern training data.</p>", "feedback": "<p>Correct. Standard spelling and clear syntax allow modern statistical models to predict tags accurately.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the 1752 Treaty was written by modern software programmers.</p>", "feedback": "<p>Incorrect. The Treaty was composed in the eighteenth century by colonial officials.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the program deleted all difficult words before evaluating accuracy.</p>", "feedback": "<p>Incorrect. All words were evaluated in running sequence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because legal documents are prohibited from containing verbs.</p>", "feedback": "<p>Incorrect. Legal clauses rely heavily on modal and finite verb structures.</p>"}]}}, {"step": 18, "title": "Running an NLP Pipeline on the 1791 French Decree", "content": "**Running an NLP Pipeline on the 1791 French Decree**\n\nNow let us test our automated pipeline on Ace's project: a 1791 French Revolutionary decree.\n\nWhen we run French SpaCy (`fr_core_news_sm`) on *L'Assemblée nationale décrète les lois suivantes*, here is what the program outputs:\n\n<table>\n  <thead>\n    <tr>\n      <th>Token</th>\n      <th>Predicted Lemma</th>\n      <th>Predicted UPOS</th>\n      <th>Predicted Deprel</th>\n      <th>Manual Truth Match?</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>L'</td>\n      <td>le</td>\n      <td><code>DET</code></td>\n      <td><code>det</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>Assemblée</td>\n      <td>assemblée</td>\n      <td><code>NOUN</code></td>\n      <td><code>nsubj</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>nationale</td>\n      <td>national</td>\n      <td><code>ADJ</code></td>\n      <td><code>amod</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>décrète</td>\n      <td>décréter</td>\n      <td><code>VERB</code></td>\n      <td><code>ROOT</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>les</td>\n      <td>le</td>\n      <td><code>DET</code></td>\n      <td><code>det</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>lois</td>\n      <td>loi</td>\n      <td><code>NOUN</code></td>\n      <td><code>obj</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>suivantes</td>\n      <td>suivant</td>\n      <td><code>ADJ</code></td>\n      <td><code>amod</code></td>\n      <td>Match</td>\n    </tr>\n  </tbody>\n</table>\n\nThe model correctly handles the elided article *L'*, matches the feminine agreement on *nationale*. Maps the conjugated verb *décrète* to its infinitive *décréter*. However, on older passages with eighteenth-century spelling (*décrétoit*), the model stumbles.\n\n**Takeaway:** French pre-trained models handle standard vocabulary accurately, but require normalized spelling to parse older texts correctly.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Running an NLP Pipeline on the 1791 French Decree", "questiontext": "<p>Under what condition does an automated French model begin to fail on an eighteenth-century decree?</p>", "generalfeedback": "<p>French pre-trained models handle standard vocabulary accurately, but require normalized spelling to parse older texts correctly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When it encounters eighteenth-century verbal spellings (like décrétoit) that deviate from modern training lexica.</p>", "feedback": "<p>Correct. Archaic spelling variants trigger Out-of-Vocabulary errors and misclassified parts of speech.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the decree mentions the National Assembly.</p>", "feedback": "<p>Incorrect. Named entities are handled routinely by modern models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the document is written on handmade rag paper.</p>", "feedback": "<p>Incorrect. Physical paper composition does not affect digital text algorithms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the French text contains more than five words.</p>", "feedback": "<p>Incorrect. Modern pipelines routinely process long texts.</p>"}]}}, {"step": 19, "title": "Running an NLP Pipeline on Maud Lewis's Letter", "content": "**Running an NLP Pipeline on Maud Lewis's Letter**\n\nNext, we test our automated pipeline on Olyvia's project: Maud Lewis's informal 1967 letter: *I received your letter today*.\n\nHere are the automated predictions:\n\n<table>\n  <thead>\n    <tr>\n      <th>Token</th>\n      <th>Predicted Lemma</th>\n      <th>Predicted UPOS</th>\n      <th>Predicted Deprel</th>\n      <th>Manual Truth Match?</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>I</td>\n      <td>I</td>\n      <td><code>PRON</code></td>\n      <td><code>nsubj</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>received</td>\n      <td>receive</td>\n      <td><code>VERB</code></td>\n      <td><code>ROOT</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>your</td>\n      <td>your</td>\n      <td><code>PRON</code></td>\n      <td><code>nmod:poss</code></td>\n      <td>Disagreement</td>\n    </tr>\n    <tr>\n      <td>letter</td>\n      <td>letter</td>\n      <td><code>NOUN</code></td>\n      <td><code>obj</code></td>\n      <td>Match</td>\n    </tr>\n    <tr>\n      <td>today</td>\n      <td>today</td>\n      <td><code>NOUN</code></td>\n      <td><code>obl:tmod</code></td>\n      <td>Match</td>\n    </tr>\n  </tbody>\n</table>\n\nLook closely at row three! In our manual ground truth from yesterday, we assigned the canonical lemma *you* for the possessive pronoun *your* (following standard dictionary policy). SpaCy predicted *your* as its own lemma. This is an editorial policy disagreement: does a possessive pronoun map to its base personal p. Does it keep its own lemma?\n\n**Takeaway:** Automated tools may follow different dictionary conventions for pronouns, creating disagreements with your project policies.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Running an NLP Pipeline on Maud Lewis's Letter", "questiontext": "<p>In Maud Lewis's sentence I received your letter today, what caused the disagreement between SpaCy and our manual ground truth on your?</p>", "generalfeedback": "<p>Automated tools may follow different lexicographical conventions for pronouns, creating disagreements with your project policies.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A difference in lexicographical policy regarding whether possessive pronouns take their own lemma or map to you.</p>", "feedback": "<p>Correct. Editorial policy in our ground truth mapped your to lemma you, whereas SpaCy cited your as its own headword.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>SpaCy concluded that Maud Lewis was writing in sixteenth-century Latin.</p>", "feedback": "<p>Incorrect. SpaCy correctly identified the language as English.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>SpaCy deleted the word your because it was misspelled.</p>", "feedback": "<p>Incorrect. The word was spelled correctly; the disagreement concerned dictionary headword conventions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The software crashed and returned a null string.</p>", "feedback": "<p>Incorrect. The tool executed cleanly; the difference was purely lexicographical.</p>"}]}}, {"step": 20, "title": "Measuring Machine Accuracy Against Human Ground Truth", "content": "**Measuring Machine Accuracy Against Human Ground Truth**\n\nNow that you have run your automated pipeline, how do you evaluate its performance? In computational scholarship, we calculate **token-level accuracy**.\n\nToken accuracy is the percentage of tokens where the computer's prediction exactly matches your manual ground truth. To calculate accuracy, use this simple formula:\n\n```text\nAccuracy = (Number of Correct Tokens) / (Total Number of Tokens) * 100\n```\n\nIf your 20-word excerpt contains 18 tokens where both the lemma and the part-of-speech tag match your manual ground truth, your pipeline's accuracy is 90%.\n\nWhen evaluating, calculate two separate scores: **POS Accuracy** (did the tagger get the part of speech right?) and **Lemma Accuracy** (did the tagger assign the right dictionary headword?). Often, a tagger identifies that a word is a v. Fails to find the right historical lemma.\n\n**Vocabulary.** *Accuracy*. The proportion of correct predictions made by a model out of the total number of items tested.\n\n**Takeaway:** Calculate separate accuracy scores for parts of speech and lemmas by comparing automated output directly to your manual ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Measuring Machine Accuracy Against Human Ground Truth", "questiontext": "<p>How is token-level part-of-speech accuracy calculated in computational textual scholarship?</p>", "generalfeedback": "<p>Calculate separate accuracy scores for parts of speech and lemmas by comparing automated output directly to your manual ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By dividing the number of correctly tagged tokens by the total number of tokens evaluated and multiplying by 100.</p>", "feedback": "<p>Correct. Accuracy measures the percentage of machine predictions that match the human ground truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By measuring the physical temperature of the computer processor during execution.</p>", "feedback": "<p>Incorrect. Processing temperature is hardware diagnostics, not linguistic accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By counting the number of punctuation marks in the manuscript margin.</p>", "feedback": "<p>Incorrect. Accuracy measures label agreement on tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By multiplying the word count by the price of the software.</p>", "feedback": "<p>Incorrect. Commercial software costs have no bearing on scientific accuracy metrics.</p>"}]}}, {"step": 21, "title": "Calculating Precision, Recall, and F1 Score", "content": "**Calculating Precision, Recall, and F1 Score**\n\nOverall accuracy gives a broad overview. However, it can hide critical flaws. If an edition contains ninety common nouns and ten rare verbs, a model that guesses `NOUN` for everything might score ninety percent accuracy while being completely useless for verbs!\n\nTo evaluate specific grammatical categories, computational linguists use **Precision** and **Recall**:\n\n<ul>\n  <li><strong>Precision:</strong> When the model predicts a specific tag (like <code>VERB</code>), how often is it actually right?</li>\n  <li><strong>Recall:</strong> Out of all real verbs in your text, how many did the model successfully find?</li>\n</ul>\n\nThe **F1 Score** is the harmonic mean of precision and recall, balancing false alarms against missed words. In historical editing, high precision means you can trust the tags the computer assigns. In contrast, high recall means the computer did not overlook rare grammatical constructions.\n\n**Vocabulary.** *Precision* — The proportion of predicted instances for a category that are correct. *Recall* — The proportion of actual instances of a category in the text that were successfully retrieved. *F1 Score* — A balanced score combining precision and recall into a single metric.\n\n**Takeaway:** Precision and recall reveal how well a pipeline performs on specific grammatical classes, balancing false alarms against missed words.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Calculating Precision, Recall, and F1 Score", "questiontext": "<p>What does Precision measure when evaluating an automated model's performance on verbs?</p>", "generalfeedback": "<p>Precision and recall reveal how well a pipeline performs on specific grammatical classes, balancing false alarms against missed words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The proportion of words tagged as verbs by the model that were actually verbs in the ground truth.</p>", "feedback": "<p>Correct. Precision measures the reliability of positive predictions for a given category.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The physical speed at which the computer monitor refreshes pixels.</p>", "feedback": "<p>Incorrect. Display refresh rates do not measure classification precision.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The total number of words in the entire manuscript.</p>", "feedback": "<p>Incorrect. Total word count is corpus size, not category precision.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The font size of the XML elements on the screen.</p>", "feedback": "<p>Incorrect. Visual typography is separate from statistical precision.</p>"}]}}, {"step": 22, "title": "The Confusion Matrix: Where Models Stumble", "content": "**The Confusion Matrix: Where Models Stumble**\n\nWhen a model makes mistakes, where do those errors happen? To diagnose error patterns, linguists use a tool called a **confusion matrix**.\n\nA confusion matrix is a table that plots human ground-truth tags against machine predictions. Rows represent the actual human tags, and columns represent what the computer predicted.\n\nIn historical English, taggers frequently confuse nouns and adjectives. In the phrase *Peace and Friendship Treaty*, the word *Peace* is a noun functioning as a modifier. A tagger might predict `ADJ` instead of `NOUN`. In French, taggers sometimes confuse past participles (`VERB`) with predicate adjectives (`ADJ`). Looking at a confusion matrix reveals which grammatical boundaries are most fragile in your document.\n\n**Vocabulary.** *Confusion Matrix*. A diagnostic table that records how often each actual category is confused with another category by an automated model.\n\n**Takeaway:** A confusion matrix highlights systematic error patterns, showing which parts of speech are most frequently confused by automated models.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: The Confusion Matrix: Where Models Stumble", "questiontext": "<p>What analytical insight does a confusion matrix provide when auditing an automated tagger?</p>", "generalfeedback": "<p>A confusion matrix highlights systematic error patterns, showing which parts of speech are most frequently confused by automated models.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It reveals systematic patterns of error by showing which specific grammatical categories are confused with each other.</p>", "feedback": "<p>Correct. A confusion matrix plots actual categories against predicted categories, exposing confusion pairs like ADJ vs NOUN.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It displays an encrypted password required to unlock the operating system.</p>", "feedback": "<p>Incorrect. A confusion matrix is a statistical error-analysis table.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes student grades based on random dice rolls.</p>", "feedback": "<p>Incorrect. Confusion matrices are scientific diagnostic tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces all vowels in the document with consonants.</p>", "feedback": "<p>Incorrect. Text characters remain unaltered in diagnostic audits.</p>"}]}}, {"step": 23, "title": "Diagnosing Out-of-Vocabulary (OOV) Failures", "content": "**Diagnosing Out-of-Vocabulary (OOV) Failures**\n\nThe most common error in historical NLP is the Out-of-Vocabulary failure. When an algorithm encounters an unfamiliar word, how does it fail?\n\nLook for these three common OOV symptoms in your output:\n<ol>\n  <li><strong>Identity Fallback:</strong> The model simply copies the surface spelling into the lemma field (e.g., surface *promis'd* receives lemma *promis'd* instead of *promise*).</li>\n  <li><strong>Fictitious Headwords:</strong> The model applies a modern rule inappropriately, inventing a non-existent word (e.g., predicting *shew* for *shew'd*).</li>\n  <li><strong>Unknown Tags:</strong> The model assigns an `X` (unknown) or default `NOUN` tag to any word it cannot parse.</li>\n</ol>\n\nWhenever you spot an OOV error, record it in your work notes. This provides the evidence you will use to refine your workflow.\n\n**Takeaway:** OOV failures typically show up as copied surface spellings, invented headwords, or default noun tags.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Diagnosing Out-of-Vocabulary (OOV) Failures", "questiontext": "<p>What is the identity fallback symptom in an Out-of-Vocabulary lemmatization failure?</p>", "generalfeedback": "<p>OOV failures typically show up as copied surface spellings, invented headwords, or default noun tags.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model copies the inflected surface spelling directly into the lemma field because it cannot find the root.</p>", "feedback": "<p>Correct. When a model cannot find a headword, it frequently falls back to outputting the surface token as the lemma.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model replaces the user's name on their university ID card.</p>", "feedback": "<p>Incorrect. Identity fallback refers to duplicating surface strings into lemma fields.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model converts all text into French automatically.</p>", "feedback": "<p>Incorrect. Fallback copies the source token verbatim.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer reboots into safe mode.</p>", "feedback": "<p>Incorrect. Identity fallback is an algorithm output behavior, not a system crash.</p>"}]}}, {"step": 24, "title": "Archaic Inflection Errors: Suffix Errors", "content": "**Archaic Inflection Errors: Suffix Errors**\n\nAnother major failure mode stems from historical grammar endings that have vanished from modern speech.\n\nIn 18th-century French, imperfect verbs ended in *-oit* (*décrétoit*, *faisoit*). Modern French models are trained on texts using *-ait* (*décrétait*, *faisait*). Because the suffix *-oit* does not match any regular modern verb paradigm, the model fails to recognize the verb. It may guess that *décrétoit* is an obscure noun or foreign word.\n\nIn 18th-century English, formal verbs took archaic suffixes (*doth*, *hath*, *speaketh*). While modern English models usually recognize *doth* as an archaic auxiliary, rarer forms like *witnesseth* are often misclassified as adjectives or common nouns. Documenting these suffix errors proves why historical texts require specialized domain handling.\n\n**Takeaway:** Historical grammar endings like French *-oit* or English *-eth* trigger errors because modern statistical models do not recognize them as active verb suffixes.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Archaic Inflection Errors: Suffix Mismatches", "questiontext": "<p>Why does an eighteenth-century English verb form like witnesseth often deceive modern automated taggers?</p>", "generalfeedback": "<p>Historical inflectional endings like French -oit or English -eth trigger errors because modern statistical models do not recognize them as active verb suffixes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because the archaic -eth suffix is absent from active modern verb paradigms, leading models to guess noun or adjective.</p>", "feedback": "<p>Correct. Modern language models are trained on contemporary endings and misclassify obsolete inflectional suffixes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because words ending in -th are prohibited in English legal documents.</p>", "feedback": "<p>Incorrect. Formal legal instruments made extensive use of archaic suffixes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the word contains too many syllables to fit into computer memory.</p>", "feedback": "<p>Incorrect. Memory buffers easily handle polysyllabic words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the scribe wrote the word using invisible ink.</p>", "feedback": "<p>Incorrect. Historical ink is fully visible on the parchment leaf.</p>"}]}}, {"step": 25, "title": "Exporting Automated Output to TEI XML", "content": "**Exporting Automated Output to TEI XML**\n\nOnce your Python script processes your text, you can automatically convert the output into valid TEI XML.\n\nHere is a simple Python function that writes TEI `<w>` elements from SpaCy tokens:\n\n```python\ndef export_tei(doc, output_path):\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"<s>\\n\")\n        for token in doc:\n            if token.is_punct:\n                f.write(f'  <pc pos=\"PUNCT\">{token.text}</pc>\\n')\n            else:\n                f.write(f'  <w lemma=\"{token.lemma_}\" pos=\"{token.pos_}\">{token.text}</w>\\n')\n        f.write(\"</s>\\n\")\n```\n\nRunning this function produces `nlp_baseline.xml`. Now you have two comparable XML files in your repository: the manual ground truth you hand-crafted yesterday. The automated version produced by the python pipeline today.\n\n**Takeaway:** A short Python loop can convert automated NLP output directly into valid TEI `<w>` and `<pc>` XML tags.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Exporting Automated Output to TEI XML", "questiontext": "<p>How does a Python script transform processed SpaCy tokens into standard TEI P5 linguistic markup?</p>", "generalfeedback": "<p>A short Python loop can convert automated NLP output directly into valid TEI <w> and <pc> XML tags.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By writing <s> sentence containers enclosing <w lemma=\"...\" pos=\"...\"> words and <pc> punctuation elements.</p>", "feedback": "<p>Correct. Scripting the conversion outputs standard TEI XML preserving tokens and computational annotations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By saving the text as an unformatted audio recording.</p>", "feedback": "<p>Incorrect. Audio recordings cannot serve as TEI XML markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By printing words onto paper and mailing them to a library.</p>", "feedback": "<p>Incorrect. Python scripts write structured XML files directly to disk.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting all attributes and leaving only empty angle brackets.</p>", "feedback": "<p>Incorrect. TEI linguistic markup stores lemmas and POS tags directly in attributes.</p>"}]}}, {"step": 26, "title": "Auditing the Machine TEI Against the Manual Baseline", "content": "**Auditing the Machine TEI Against the Manual Baseline**\n\nNow comes the crucial scientific step: comparing the two XML files side by side.\n\nIn VS Code, open both files and use the built-in diff viewer:\n```bash\ncode --diff ground_truth_manual.xml nlp_baseline.xml\n```\n\nThe diff viewer highlights every discrepancy in red and green. Read through the differences line by line:\n<ul>\n  <li>Did the automated tool split contractions in the same places you did?</li>\n  <li>Did it predict the same dictionary lemma as your OED or TLFi authority?</li>\n  <li>Did it assign the same UPOS tag?</li>\n</ul>\n\nThis side-by-side audit reveals the exact error rate of the automated pipeline on historical prose.\n\n**Takeaway:** Diffing your manual XML against the machine-generated XML in VS Code exposes every automated discrepancy instantly.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Auditing the Machine TEI Against the Manual Baseline", "questiontext": "<p>What tool in VS Code enables editors to execute a fast, side-by-side audit of manual vs. automated TEI markup?</p>", "generalfeedback": "<p>Diffing your manual XML against the machine-generated XML in VS Code exposes every automated discrepancy instantly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The built-in graphical diff viewer (code --diff file1 file2).</p>", "feedback": "<p>Correct. The diff viewer highlights discrepancies in red and green, exposing tag and lemma disagreements instantly.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The spellchecker dictionary toggle.</p>", "feedback": "<p>Incorrect. Spellcheckers do not compare two files side by side.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The audio volume mixer.</p>", "feedback": "<p>Incorrect. Audio tools have no text comparison capability.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The screen brightness slider.</p>", "feedback": "<p>Incorrect. Brightness controls monitor illumination, not file differences.</p>"}]}}, {"step": 27, "title": "Documenting Algorithm Quirks in `NLP_BENCHMARK.md`", "content": "**Documenting Algorithm Quirks in `NLP_BENCHMARK.md`**\n\nTo preserve your findings, record your results in a project report called `NLP_BENCHMARK.md`.\n\nYour benchmark report should include four sections:\n<ol>\n  <li><strong>Pipeline Specifications:</strong> Which tool and model were used (e.g., SpaCy 3.7 with <code>en_core_web_sm</code>)?</li>\n  <li><strong>Accuracy Scores:</strong> Overall token accuracy, POS accuracy, and lemma accuracy percentages.</li>\n  <li><strong>Discrepancy Log:</strong> A table listing every token where the computer disagreed with your manual ground truth.</li>\n  <li><strong>Error Diagnosis:</strong> An analysis explaining why the machine failed (e.g., OOV archaic spelling, homograph ambiguity, tokenization split).</li>\n</ol>\n\nWriting this report ensures that your digital edition maintains full methodological transparency.\n\n**Takeaway:** Record pipeline versions, accuracy scores, discrepancy tables, and error causes in `NLP_BENCHMARK.md`.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Documenting Algorithm Quirks in NLP_BENCHMARK.md", "questiontext": "<p>Why should digital textual editors document automated tool performance in a benchmark report?</p>", "generalfeedback": "<p>Record pipeline versions, accuracy scores, discrepancy tables, and error causes in NLP_BENCHMARK.md.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To maintain scholarly transparency regarding pipeline specifications, overall accuracy, and known error patterns.</p>", "feedback": "<p>Correct. A benchmark report provides an explicit audit trail documenting computational reliability and limitations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To charge external scholars a licensing fee for reading the edition.</p>", "feedback": "<p>Incorrect. Scholarly documentation supports open, verifiable research.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prevent search engines from discovering the digital edition online.</p>", "feedback": "<p>Incorrect. Documentation aids scholarly discoverability and citation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI schemas throw fatal validation errors without a markdown benchmark file.</p>", "feedback": "<p>Incorrect. XML validators check XML schemas independently.</p>"}]}}, {"step": 28, "title": "Preprocessing Strategies: Can Normalization Rescue the Tagger?", "content": "**Preprocessing Strategies: Can Normalization Rescue the Tagger?**\n\nAfter seeing how historical spellings trip up automated taggers, a natural question arises: can we fix these errors before the tagger runs?\n\nYes! This is where your work from Module 6 pays off. In Module 6, you built regularized readings using `<reg>` tags (*acknowledged* for *acknowledg'd*, *décrétait* for *décrétoit*).\n\nIf you feed the **regularized reading text** into SpaCy instead of the raw diplomatic transcript, accuracy jumps dramatically! Because the normalized text uses modern spelling, the tagger's dictionary lookups succeed. The model correctly identifies *décréter* and *acknowledge*. You can then transfer those accurate lemmas back onto your diplomatic `<w>` elements.\n\n**Takeaway:** Preprocessing text with Module 6 regularizations dramatically reduces OOV errors and boosts automated tagging accuracy.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Preprocessing Strategies: Can Normalization Rescue the Tagger?", "questiontext": "<p>How does feeding Module 6 regularized readings into an NLP pipeline improve automated tagging accuracy?</p>", "generalfeedback": "<p>Preprocessing text with Module 6 regularizations dramatically reduces OOV errors and boosts automated tagging accuracy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Modernized spellings match the pipeline's internal dictionary, eliminating Out-of-Vocabulary lookup failures.</p>", "feedback": "<p>Correct. Preprocessing historical spelling slips into standard modern equivalents allows dictionary lookups to succeed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the computer to run ten times faster by skipping punctuation.</p>", "feedback": "<p>Incorrect. Speed is unchanged; accuracy increases because dictionary matches succeed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all nouns and replaces them with numbers.</p>", "feedback": "<p>Incorrect. Normalization updates orthography while preserving linguistic tokens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically translates old French into modern German.</p>", "feedback": "<p>Incorrect. Regularization operates within the document's original language.</p>"}]}}, {"step": 29, "title": "Preparing for Friday's AI-Assisted Parsing Test", "content": "**Preparing for Friday's AI-Assisted Parsing Test**\n\nToday you evaluated a deterministic natural language processing tool. You saw its speed, its consistency, and its vulnerabilities when facing historical language shifts.\n\nOn Friday, in Lesson 8.3, you will test a completely different technology: large language model AI in VS Code Antigravity. Unlike deterministic taggers, modern AI models have seen vast amounts of historical literature during training. They can often recognize eighteenth-century French and archaic English with remarkable intuition.\n\nHowever, AI models bring their own risks, including hallucinated lemmas and unpredictable outputs. Today's deterministic baseline and Tuesday's manual ground truth provide the twin reference points you will use to audit Friday's AI output.\n\n**Takeaway:** Today's deterministic NLP benchmark provides the essential comparison point for evaluating Friday's AI language models.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Preparing for Friday's AI-Assisted Parsing Test", "questiontext": "<p>What role will today's deterministic NLP benchmark play in Friday's Lesson 8.3?</p>", "generalfeedback": "<p>Today's deterministic NLP benchmark provides the essential comparison point for evaluating Friday's AI language models.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It provides the second reference point in a three-way comparative audit alongside manual truth and AI prompts.</p>", "feedback": "<p>Correct. Evaluating AI models requires comparing them against both manual ground truth and deterministic taggers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It will be discarded so that Friday's class can start from scratch.</p>", "feedback": "<p>Incorrect. Each stage of our three-step comparative cycle builds directly on the previous baseline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It will be converted into a commercial mobile phone application.</p>", "feedback": "<p>Incorrect. Course work focuses on critical digital textual scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It will replace the instructor's syllabus.</p>", "feedback": "<p>Incorrect. Benchmarks are analytical research assets.</p>"}]}}, {"step": 30, "title": "The Limits and Power of Deterministic Algorithms", "content": "**The Limits and Power of Deterministic Algorithms**\n\nDeterministic NLP pipelines are among the most powerful tools in computational textual scholarship. They allow a single researcher to analyze millions of words in minutes, revealing large-scale stylistic patterns and grammatical shifts across centuries.\n\nYet algorithms are not infallible authorities. They are statistical mirrors of the data on which they were trained. When turned loose on the rich, irreg. Beautiful prose of historical documents, they require human guidance, careful preprocessing, and rigorous validation.\n\nBy establishing a manual ground truth, measuring machine accuracy. Diagnosing error patterns, you have learned how to use automated tools critically and responsibly. You are no longer just running software; you are conducting rigorous computational scholarship.\n\n**Takeaway:** Deterministic tools offer incredible sp. Scholarly rigor requires measuring their limits against human ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: The Limits and Power of Deterministic Algorithms", "questiontext": "<p>What is the ultimate scholarly takeaway regarding deterministic NLP tools in digital humanities?</p>", "generalfeedback": "<p>Deterministic tools offer incredible speed and scale, but scholarly rigor requires measuring their limits against human ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They provide immense scale and speed, but their statistical limits require critical human guidance and validation.</p>", "feedback": "<p>Correct. Algorithms automate large-scale processing, but human expertise remains the essential anchor of accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They make human reading and textual scholarship completely obsolete.</p>", "feedback": "<p>Incorrect. Automated tools depend entirely on human ground truth and validation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They are too slow to be useful for any research project.</p>", "feedback": "<p>Incorrect. Deterministic pipelines process thousands of words per second.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They can only process texts written in modern English.</p>", "feedback": "<p>Incorrect. Deterministic tools support hundreds of modern and historical languages.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
