    <script>
        const lessonData = {"course_title": "Rule-Based Normalization: Regular Expressions in VS Code", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "From Prose Policy to Deterministic Code", "content": "**From Prose Policy to Deterministic Code**\n\nYesterday in Lesson 6.1, you performed normalization by hand. You sat with your reconciled diplomatic text in VS Code, examined words one by one, and manually wrapped target spellings and abbreviations in TEI `<choice>` tags. In doing so, you formulated an explicit Editorial Regularization Policy and catalogued your decisions in a Rule Ledger in `NORMALIZATION.md`.\n\nToday, we take the crucial step from manual human execution to automated, deterministic computing. Instead of reading through hundreds of lines and manually typing tags every time an archaic spelling appears, we want a tool to locate every occurrence of our target patterns and apply our transformations systematically.\n\nThe transition from a human editorial policy to an automated rule is profound. Prose editorial policies tolerate vagueness. A policy that says \"regularize archaic terminal *-ck* on adjectives\" seems perfectly clear to a human reader, who instinctively knows that *publick* should become *public*, but *black* should remain *black*. A computer possesses no such historical or linguistic intuition. To a machine, *black* ends in *-ck* just as surely as *publick* does.\n\nImplementing an automated rule therefore acts as an unforgiving audit of your editorial policy. When an automated rule produces a catastrophic mistake—such as turning *black* into *blac* or *track* into *trac*—it exposes an unstated assumption in your human thinking. Deterministic rules force us to state our exact criteria with mathematical precision (Friedl, 2006).\n\n**Vocabulary.** *Deterministic automation* — A computational process that always produces the exact same output when given the same input and rules, without randomness or opacity. *Policy audit* — The process of testing an editorial policy through formal code to uncover unstated ambiguities or edge cases.\n\n**Takeaway:** Translating a human editorial policy into deterministic rules audits your scholarly thinking by exposing unstated assumptions and edge cases.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: From Prose Policy to Deterministic Code", "questiontext": "<p>Why does translating an editorial prose policy into automated code act as an audit of scholarly thinking?</p>", "generalfeedback": "<p>Translating a human editorial policy into deterministic rules audits your scholarly thinking by exposing unstated assumptions and edge cases.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Prose policies tolerate unstated human assumptions; code forces the editor to state every condition, boundary, and exception with mathematical precision.</p>", "feedback": "<p>Correct. A computer lacks intuitive historical judgement, forcing the editor to define exact rules and confront previously unnoticed ambiguities.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Writing code automatically deletes all historical abbreviations from the repository.</p>", "feedback": "<p>Incorrect. Translating a policy into code defines how text is transformed; it does not arbitrarily delete data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Prose policies cannot be stored on modern operating systems without being converted to binary code.</p>", "feedback": "<p>Incorrect. Prose policies are stored as standard text files; the issue is algorithmic precision.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating policies into code allows editors to bypass XML schema validation checks.</p>", "feedback": "<p>Incorrect. Schema validation is always required regardless of whether edits were made by hand or by code.</p>"}]}}, {"step": 2, "title": "What Is a Regular Expression?", "content": "**What Is a Regular Expression?**\n\nTo automate text normalization deterministically, digital scholars do not need to write thousands of lines of low-level software. Instead, we use one of the most powerful and elegant tools in modern computing: **Regular Expressions** (commonly abbreviated as **regex**).\n\nA regular expression is a formalized pattern-matching language designed to search, match, and transform text based on structural patterns rather than fixed literal words (Jurafsky & Martin, 2024). Instead of searching for the exact literal word *publick*, a regular expression allows you to specify: \"find any sequence of letters that begins at a word boundary, ends with the letters *ck*, and is preceded by a specific root.\"\n\nRegular expressions originated in theoretical computer science and formal language theory in the 1950s, representing finite-state automata that recognize regular languages. Today, regular expression engines are embedded into virtually every programming language, shell utility (like `grep` and `sed`), and modern text editor.\n\nIn digital textual editing, regex is the premier tool for deterministic normalization. A single well-crafted regular expression can scan a 500-page historical witness, identify every instance of a 18th-century spelling variant or thorn contraction, and reformat it into valid, multi-element TEI `<choice>` markup in milliseconds.\n\n**Vocabulary.** *Regular expression (regex)* — A specialized formal language consisting of literal characters and metacharacters used to describe search patterns in text. *Pattern matching* — The computational search for sequences of characters that conform to a specified grammatical rule.\n\n**Takeaway:** A regular expression is a concise, formal pattern-matching language that allows digital editors to search and transform text based on structural rules rather than fixed literal strings.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: What Is a Regular Expression?", "questiontext": "<p>What is a regular expression (regex) in computational text processing?</p>", "generalfeedback": "<p>A regular expression is a concise, formal pattern-matching language that allows digital editors to search and transform text based on structural rules rather than fixed literal strings.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A concise, formal pattern-matching language used to search and transform text based on structural rules rather than fixed literal strings.</p>", "feedback": "<p>Correct. Regex describes classes and patterns of text (such as words ending in specific suffixes), allowing broad, rule-based matching.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A machine-learning algorithm that generates artificial handwriting on digital canvas images.</p>", "feedback": "<p>Incorrect. Regex is a deterministic, rule-based pattern matching language, not a generative image model.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A legal document signed by an archival library granting reproduction rights.</p>", "feedback": "<p>Incorrect. Regular expressions are a core computational string manipulation tool, not a legal instrument.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An interactive quiz format built into Moodle for testing student reading comprehension.</p>", "feedback": "<p>Incorrect. Regular expressions are used inside text editors and programming languages to process strings.</p>"}]}}, {"step": 3, "title": "The VS Code Regex Engine", "content": "**The VS Code Regex Engine**\n\nMany novice students assume that running regular expressions requires learning a complex programming language like Python, installing external libraries, and executing command-line scripts. In reality, **Visual Studio Code has a world-class regular expression engine built directly into its editor**.\n\nWhenever you open the Find and Replace widget in VS Code (`Cmd+F` or `Cmd+H` on macOS; `Ctrl+F` or `Ctrl+H` on Windows), you have access to a complete JavaScript/PCRE-compatible regular expression processor. To activate regex mode, you simply click the **Use Regular Expression** icon (which looks like `.*`) in the Find box, or press `Alt+R` (`Option+Cmd+R` on macOS).\n\nUsing regex inside VS Code offers a decisive pedagogical advantage over running background scripts: **immediate real-time visual feedback**.\n\nWhen you write a regex pattern in a Python script and run it over a file, the script executes blindly in memory. If your pattern contains a subtle defect, it will silently corrupt thousands of words before you realize a mistake occurred. In VS Code, as soon as you type a regex pattern into the Find box, the editor instantly highlights every single matching character in yellow across your entire open document. \n\nYou can visually inspect what matches, see what was missed, and immediately detect if your pattern accidentally captures XML tags or milestone markers *before* you execute a single replacement.\n\n**Vocabulary.** *VS Code regex mode* — An interactive editor setting (toggled with `.*` or `Alt+R`) that interprets search strings as regular expressions. *Real-time visual feedback* — The instant editor highlighting of matching text patterns, allowing safe pre-execution inspection.\n\n**Takeaway:** VS Code provides an interactive, full-featured regular expression engine with real-time visual highlighting, making pattern testing visible and safe before execution.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The VS Code Regex Engine", "questiontext": "<p>What is the primary pedagogical advantage of testing regular expressions directly inside the VS Code editor?</p>", "generalfeedback": "<p>VS Code provides an interactive, full-featured regular expression engine with real-time visual highlighting, making pattern testing visible and safe before execution.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>VS Code highlights all matching text in yellow in real time, allowing editors to visually inspect matches before executing replacements.</p>", "feedback": "<p>Correct. Immediate visual feedback lets you see over-matches or tag collisions instantly, preventing silent corruption before replacement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code automatically corrects all spelling mistakes in historical manuscripts without user input.</p>", "feedback": "<p>Incorrect. VS Code executes the exact pattern provided; it does not replace scholarly judgment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code converts all regular expressions into ancient Greek characters.</p>", "feedback": "<p>Incorrect. The regex engine operates on standard Unicode characters across all languages.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code is the only software in the world capable of processing regular expressions.</p>", "feedback": "<p>Incorrect. Regex is supported across almost all programming languages, but VS Code provides live visual highlighting.</p>"}]}}, {"step": 4, "title": "Literal Characters vs. Metacharacters", "content": "**Literal Characters vs. Metacharacters**\n\nA regular expression is composed of two distinct types of characters: **literal characters** and **metacharacters** (Friedl, 2006).\n\nA **literal character** is an ordinary alphanumeric symbol that matches only itself. If you type the letter `p`, the regex matches the character `p`. If you type `treaty`, the regex matches the exact sequence `t-r-e-a-t-y`.\n\nA **metacharacter**, by contrast, is a special reserved symbol that carries an operational meaning in the regex grammar. Instead of matching itself literally, a metacharacter instructs the engine to perform a structural test, such as matching any character, repeating a pattern, or anchoring to a boundary.\n\nThe fundamental regex metacharacters include:\n\n<ul>\n  <li><code>.</code> (Dot): Matches any single character except a newline.</li>\n  <li><code>*</code>, <code>+</code>, <code>?</code> (Quantifiers): Control how many times the preceding character or group may repeat.</li>\n  <li><code>[</code> and <code>]</code> (Brackets): Define a character class or set.</li>\n  <li><code>(</code> and <code>)</code> (Parentheses): Define a capturing group.</li>\n  <li><code>^</code> and <code>$</code> (Anchors): Match the beginning and end of a line.</li>\n  <li><code>\\</code> (Backslash): The escape character, used to neutralize a metacharacter or invoke special escape sequences.</li>\n</ul>\n\nIf you want to match a literal period (such as the dot in the abbreviation *publ.*), you cannot simply type `.`, because a bare dot matches any letter or space. You must **escape** it with a backslash: `\\.`. The backslash tells the regex engine: \"treat the following symbol as an ordinary literal character, not as a special command.\"\n\n**Vocabulary.** *Literal character* — A character that matches only itself in a regex search. *Metacharacter* — A reserved character with special syntactic meaning that controls pattern matching. *Escaping* — Prefixing a metacharacter with a backslash (`\\`) to force the engine to match it as a literal symbol.\n\n**Takeaway:** Regular expressions combine literal characters that match themselves with metacharacters that control pattern structure; reserved symbols must be escaped with a backslash to match literally.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Literal Characters vs. Metacharacters", "questiontext": "<p>What must an editor do to search for a literal period (.) in a regular expression without matching arbitrary characters?</p>", "generalfeedback": "<p>Regular expressions combine literal characters that match themselves with metacharacters that control pattern structure; reserved symbols must be escaped with a backslash to match literally.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Escape the period with a preceding backslash (\\.) to neutralize its operational meaning as a metacharacter.</p>", "feedback": "<p>Correct. A bare dot matches any single character; prefixing it with a backslash forces the engine to match a literal period.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Surround the period with quotation marks like '.' in the Find box.</p>", "feedback": "<p>Incorrect. Quotation marks inside regex are matched literally, not used as syntax delimiters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the period from the manuscript image prior to running the search.</p>", "feedback": "<p>Incorrect. Image files are immutable archival records and are not edited.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Type the word 'DOT' in all capital letters in the search field.</p>", "feedback": "<p>Incorrect. The regex engine does not interpret English word synonyms for punctuation.</p>"}]}}, {"step": 5, "title": "Character Classes and Sets: `[...]`", "content": "**Character Classes and Sets: `[...]`**\n\nIn historical documents, writers frequently substitute vowels or interchangeable consonants. For example, an 18th-century French writer might spell a word with an acute accent, a grave accent, or no accent at all. To match any one of several alternative characters at a specific position, regular expressions provide **character classes**, enclosed in square brackets: `[...]`.\n\nA character class matches **exactly one character** from the set of characters listed inside the brackets:\n\n<ul>\n  <li><code>[aeiou]</code>: Matches any single lowercase English vowel.</li>\n  <li><code>[ſs]</code>: Matches either a historical long <em>s</em> (<em>ſ</em>) or a standard short <em>s</em>.</li>\n  <li><code>[0-9]</code>: Matches any single decimal digit from 0 to 9. (The hyphen indicates an inclusive range).</li>\n  <li><code>[a-zA-Z]</code>: Matches any single uppercase or lowercase English letter.</li>\n</ul>\n\nInside a character class, most normal metacharacters lose their special meaning. For example, `[.]` matches a literal period without needing a backslash.\n\nFurthermore, placing a caret (`^`) as the **first character** inside the brackets negates the class, matching any character that is *not* in the set. For digital humanities text editors working in XML, the negated character class `[^<>]` is one of the most vital patterns in existence: it matches any character that is not an opening or closing angle bracket, preventing search patterns from accidentally spilling into XML tags.\n\n**Vocabulary.** *Character class* — A regex pattern enclosed in square brackets `[...]` that matches any single character contained within the set. *Negated character class* — A character class starting with `[^...]` that matches any character *except* those listed.\n\n**Takeaway:** Use character classes `[...]` to match alternative single characters (such as `[ſs]`), and negated classes like `[^<>]` to safely exclude XML markup.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Character Classes and Sets: [...]", "questiontext": "<p>Why is the negated character class [^<>] particularly valuable when working with TEI XML documents?</p>", "generalfeedback": "<p>Use character classes [...] to match alternative single characters (such as [ſs]), and negated classes like [^<>] to safely exclude XML markup.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It matches any character except an opening or closing angle bracket, keeping searches safely confined inside text nodes.</p>", "feedback": "<p>Correct. Negated classes like [^<>] prevent regex patterns from matching across XML tags, protecting markup from accidental corruption.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It instructs the operating system to delete all empty lines from the file.</p>", "feedback": "<p>Incorrect. [^<>] matches characters other than angle brackets; it does not manage newlines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts all lowercase letters into uppercase small caps.</p>", "feedback": "<p>Incorrect. Character classes define search sets, not typographical casing transformations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It validates whether the document complies with the Text Encoding Initiative P5 schema.</p>", "feedback": "<p>Incorrect. Schema validation is performed by dedicated XML parsers, not character classes.</p>"}]}}, {"step": 6, "title": "Section 6", "content": "**Quantifiers: Matching Repetitions (`+`, `*`, `?`)**\n\nHistorical words vary not only in which letters appear, but in how many times a letter is repeated. In Maud Lewis's letters, consonants are often doubled phonetically (e.g., *allways*), while scribal flourishes can introduce variable spaces. To control how many times a character or group repeats, regular expressions use **quantifiers**:\n\n<ul>\n  <li><code>+</code> (Plus): Matches the preceding element <strong>one or more times</strong>. For example, <code>l+</code> matches <em>l</em>, <em>ll</em>, or <em>lll</em>.</li>\n  <li><code>*</code> (Asterisk): Matches the preceding element <strong>zero or more times</strong>. For example, <code>e*</code> matches nothing, or <em>e</em>, or <em>ee</em>.</li>\n  <li><code>?</code> (Question Mark): Matches the preceding element <strong>zero or one time</strong> (making it optional). For example, <code>colou?r</code> matches both British <em>colour</em> and American <em>color</em>.</li>\n</ul>\n\nA critical concept every digital editor must understand is **greediness**. By default, quantifiers in regular expressions are greedy: they consume as much text as possible.\n\nConsider what happens if you have the XML line `<orig>publick</orig> and <orig>traffick</orig>` and you search with the pattern `<orig>.*</orig>`. You might expect the engine to match the first tag. Instead, because `.*` is greedy, it starts at the first `<orig>`, consumes all the text across the middle of the line, and stops only at the *final* `</orig>`! It swallows both words and the word *and* between them.\n\nTo prevent greedy over-matching, you can make a quantifier lazy by appending a question mark (e.g., `.*?`), or even better, use a negated character class: `<orig>[^<]*</orig>`.\n\n**Vocabulary.** *Quantifier* — A regex symbol (`+`, `*`, `?`) specifying how many instances of the preceding character or group must occur. *Greedy matching* — The default regex behavior of consuming the longest possible matching string. *Lazy matching* — A quantifier modified with `?` that consumes the shortest possible matching string.\n\n**Takeaway:** Quantifiers control repetition, but default to greedy matching; use negated classes like `[^<]*` to prevent patterns from swallowing multiple tags across a line.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Quantifiers: Matching Repetitions (+, *, ?)", "questiontext": "<p>What is the danger of using a greedy quantifier like .* when searching inside an XML file?</p>", "generalfeedback": "<p>Quantifiers control repetition, but default to greedy matching; use negated classes like [^<]* to prevent patterns from swallowing multiple tags across a line.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It consumes as much text as possible across the line, potentially swallowing multiple XML tags and intervening words.</p>", "feedback": "<p>Correct. Greedy matching extends to the furthest possible match; editors use lazy quantifiers (.*?) or negated sets ([^<]*) to avoid over-matching.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It causes the computer processor to overheat and permanently shut down.</p>", "feedback": "<p>Incorrect. Greedy quantifiers consume text strings in memory; they do not cause hardware damage.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts all numbers in the XML document into Roman numerals.</p>", "feedback": "<p>Incorrect. Quantifiers specify repetition count, not numerical numeral conversion.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents the user from saving the document in UTF-8 encoding.</p>", "feedback": "<p>Incorrect. File encoding is independent of search quantifier behavior.</p>"}]}}, {"step": 7, "title": "The Inviolable Rule: Word Boundaries (`\\b`)", "content": "**The Inviolable Rule: Word Boundaries (`\\b`)**\n\nIf there is one metacharacter that every digital humanities editor must memorize, revere, and never forget, it is the **word boundary anchor**: `\\b`.\n\nA word boundary is an anchor: it does not consume any physical characters. Instead, `\\b` asserts a physical position: the boundary between a word character (letters, numbers, underscores) and a non-word character (spaces, punctuation, quotes, or tag brackets) (Friedl, 2006).\n\nConsider what happens if you neglect to use `\\b`. Suppose you want to find the archaic contraction *ye* in an 18th-century document and replace it with *the*. If you search for the bare letters `ye` without word boundaries, look at what gets matched:\n\n<ul>\n  <li><em>ye</em> in <em>ye Governor</em> (Correct match)</li>\n  <li><em>ye</em> inside <em>yesterday</em> &rarr; becomes <em>thesturday</em>!</li>\n  <li><em>ye</em> inside <em>eye</em> &rarr; becomes <em>ethe</em>!</li>\n  <li><em>ye</em> inside <em>lawyer</em> &rarr; becomes <em>lawther</em>!</li>\n  <li><em>ye</em> inside <em>bye</em> &rarr; becomes <em>bthe</em>!</li>\n</ul>\n\nSearching for unanchored strings will violently dismantle your text. If you search for *in*, you will replace the middle of *point*, *prince*, and *administrative*. \n\nBy wrapping your target in word boundaries—`\\bye\\b`—you instruct the regex engine to match the letters *y* and *e* **only when they exist as a standalone, isolated word**, surrounded by spaces or punctuation. In textual normalization, **never search for a word without `\\b` anchors**.\n\n**Vocabulary.** *Word boundary (`\\b`)* — A zero-width anchor that matches the boundary between a word character and a non-word character (such as whitespace or punctuation). *Substring corruption* — The disastrous accidental replacement of letters inside unrelated longer words caused by omitting word boundaries.\n\n**Takeaway:** Always enclose word patterns in word boundary anchors (`\\bpattern\\b`) to prevent catastrophic accidental replacements inside longer words.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: The Inviolable Rule: Word Boundaries (\\b)", "questiontext": "<p>What disaster occurs if an editor searches for an archaic word like 'ye' without word boundary anchors (\\b)?</p>", "generalfeedback": "<p>Always enclose word patterns in word boundary anchors (\\bpattern\\b) to prevent catastrophic accidental replacements inside longer words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The pattern matches 'ye' inside unrelated words, corrupting words like 'yesterday', 'eye', and 'lawyer'.</p>", "feedback": "<p>Correct. Without \\b, substring matching replaces letters inside longer words, causing catastrophic textual corruption.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The XML validator immediately revokes the editor's GitHub account credentials.</p>", "feedback": "<p>Incorrect. The consequence is severe textual corruption within the document, not an account revocation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The text editor crashes and refuses to reopen until the operating system is reinstalled.</p>", "feedback": "<p>Incorrect. The editor executes the unanchored search normally, producing corrupt replacements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All words in the file are automatically translated into 18th-century French.</p>", "feedback": "<p>Incorrect. Unanchored matching replaces character substrings; it does not translate languages.</p>"}]}}, {"step": 8, "title": "Capturing Groups: The Power of Parentheses `(...)`", "content": "**Capturing Groups: The Power of Parentheses `(...)`**\n\nSearching for text is only half the battle. In digital editing, we do not merely want to find words; we want to restructure them. We want to take an original word, capture its root stem, and wrap it inside TEI tags. To achieve this, regular expressions use **capturing groups**, defined by parentheses: `(...)`.\n\nWhen you enclose part of a regex pattern in parentheses, the regex engine performs two actions:\n<ol>\n  <li>It groups the enclosed characters into a single logical unit.</li>\n  <li>It saves whichever specific text matched inside those parentheses into an internal memory slot (a register).</li>\n</ol>\n\nCapturing groups are numbered automatically from left to right based on the order of their opening parentheses: Group 1, Group 2, Group 3, and so on (Jurafsky & Martin, 2024).\n\nFor example, consider the pattern:\n\n```regex\n\\b(\\w+)ck\\b\n```\n\nHere, `\\w+` matches one or more word characters (letters). Because `\\w+` is enclosed in parentheses, it forms **Group 1**. The trailing letters `ck` sit outside the parentheses.\n\nWhen this pattern encounters the word *publick*, the entire pattern matches the full word *publick*. But inside memory, **Group 1 captures solely the root stem: *public***. When the pattern encounters *authentick*, Group 1 captures *authenti*. \n\nCapturing groups allow you to isolate the variable parts of a word so you can reuse them dynamically during replacement.\n\n**Vocabulary.** *Capturing group* — A sub-pattern enclosed in parentheses `(...)` whose matched content is stored in memory for retrieval during replacement. *Group numbering* — The sequential assignment of matched groups (`$1`, `$2`) ordered by their opening parentheses from left to right.\n\n**Takeaway:** Enclose sub-patterns in parentheses to create capturing groups that store matched word stems in memory for dynamic reuse.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Capturing Groups: The Power of Parentheses (...)", "questiontext": "<p>What is the purpose of enclosing a sub-pattern in parentheses (...) in a regular expression?</p>", "generalfeedback": "<p>Enclose sub-patterns in parentheses to create capturing groups that store matched word stems in memory for dynamic reuse.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It defines a capturing group that isolates matched text and stores it in memory for dynamic reuse during replacement.</p>", "feedback": "<p>Correct. Parentheses save whatever matched inside them into registers ($1, $2) so stems can be wrapped in XML tags.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It instructs the editor to print the enclosed text in bold italics in the browser.</p>", "feedback": "<p>Incorrect. Parentheses are regex grouping metacharacters, not HTML styling tags.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It marks the enclosed text as a confidential secret hidden from student peer reviewers.</p>", "feedback": "<p>Incorrect. Capturing groups are computational mechanisms for string storage during replacement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the search engine to ignore the enclosed letters completely during matching.</p>", "feedback": "<p>Incorrect. The enclosed letters are actively matched and stored in memory.</p>"}]}}, {"step": 9, "title": "Backreferences in the Replace Box: `$1` and `$2`", "content": "**Backreferences in the Replace Box: `$1` and `$2`**\n\nOnce a regular expression captures text into a group, how do you insert that captured text into your replacement string? In VS Code, you retrieve captured groups using **backreferences**: `$1`, `$2`, `$3`, and so on.\n\nWhen you type `$1` in the VS Code Replace box, the editor replaces that token with whichever characters were matched by the first capturing group. If your pattern has a second group, `$2` retrieves the second group. The special token `$0` represents the *entire* matched string.\n\nLet us see how capturing groups and backreferences work together in a simple example:\n\n```text\nFind:    \\b(\\w+)ck\\b\nReplace: $1c\n```\n\nLet us trace how the engine processes this command on the word *publick*:\n<ol>\n  <li>The search pattern matches the full word <code>publick</code>.</li>\n  <li>Group 1 captures the stem: <code>public</code>.</li>\n  <li>The Replace field instructs the editor: insert the text of Group 1 (<code>public</code>), followed by the literal letter <code>c</code>.</li>\n  <li>Result: <code>publicc</code> (Notice the spelling error! If the stem was <em>public</em>, adding <em>c</em> produced two <em>c</em>'s!).</li>\n</ol>\n\nThis simple trace illustrates why precision is vital. If our root stem already ends in *c*, we do not want to add *c*; we simply want to drop the *k*! The correct pattern would be:\n\n```text\nFind:    \\b(\\w+c)k\\b\nReplace: $1\n```\n\nHere, Group 1 captures *public* (including the *c*). The replace token `$1` outputs *public*, cleanly dropping the terminal *k*.\n\n**Vocabulary.** *Backreference* — A special replacement syntax (such as `$1` or `$2`) that outputs the text stored by a specific capturing group. *Replacement token* — A placeholder in the replacement field that dynamically references captured search data.\n\n**Takeaway:** In the VS Code Replace box, use `$1`, `$2`, etc., to output the exact text captured by your search parentheses, dynamically reconstructing your words.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Backreferences in the Replace Box: $1 and $2", "questiontext": "<p>In the VS Code Replace box, how does an editor insert the text matched by the first capturing group?</p>", "generalfeedback": "<p>In the VS Code Replace box, use $1, $2, etc., to output the exact text captured by your search parentheses, dynamically reconstructing your words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By typing the backreference token $1 into the replacement string.</p>", "feedback": "<p>Correct. In VS Code, $1 retrieves Group 1, $2 retrieves Group 2, and $0 retrieves the entire matched string.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By typing the word 'FIRST_GROUP' in capital letters surrounded by asterisks.</p>", "feedback": "<p>Incorrect. VS Code uses the standard backreference syntax $1.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By pressing the Tab key three times while holding the Shift key.</p>", "feedback": "<p>Incorrect. Backreferences are written as literal tokens ($1, $2) in the Replace field.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By copying and pasting the text manually from the Explorer sidebar.</p>", "feedback": "<p>Incorrect. Backreferences dynamically output captured text automatically.</p>"}]}}, {"step": 10, "title": "Generating TEI `<choice>` Dynamically in VS Code", "content": "**Generating TEI `<choice>` Dynamically in VS Code**\n\nNow we arrive at the central technique of automated digital normalization. By combining capturing groups with literal XML tags in the VS Code Replace box, we can **generate complete, validated TEI `<choice>` structures automatically**.\n\nRecall our manual encoding goal from yesterday: we want to transform historical *publick* into:\n\n```xml\n<choice><orig>publick</orig><reg resp=\"#editor\">public</reg></choice>\n```\n\nTyping that entire block by hand took thirty seconds. With regular expressions in VS Code, we can generate it in one keystroke across all occurrences:\n\n```text\nFind:    \\b(\\w+c)k\\b\nReplace: <choice><orig>$1k</orig><reg resp=\"#editor\">$1</reg></choice>\n```\n\nLet us trace what VS Code does when it executes this command on *publick*:\n<ol>\n  <li>The Find pattern matches <code>publick</code>.</li>\n  <li>Group 1 captures the stem <code>public</code> into <code>$1</code>.</li>\n  <li>The Replace box outputs:\n    <ul>\n      <li>Literal XML: <code>&lt;choice&gt;&lt;orig&gt;</code></li>\n      <li><code>$1k</code> &rarr; inserts <code>public</code> followed by literal <code>k</code> (reproducing the original word <code>publick</code>!).</li>\n      <li>Literal XML: <code>&lt;/orig&gt;&lt;reg resp=\"#editor\"&gt;</code></li>\n      <li><code>$1</code> &rarr; inserts the regularized stem <code>public</code>.</li>\n      <li>Literal XML: <code>&lt;/reg&gt;&lt;/choice&gt;</code></li>\n    </ul>\n  </li>\n</ol>\n\nThe resulting text is perfect, fully formed, valid TEI markup. The editor did not need to write a Python script; the regex engine in VS Code constructed the entire multi-element parallel XML structure dynamically.\n\n**Vocabulary.** *Dynamic XML generation* — Using regex replacement backreferences to construct complex structural markup around captured text strings. *Markup automation* — Automating the insertion of repetitive tagging structures while preserving original witness readings.\n\n**Takeaway:** Combine captured stems with literal XML tags in the VS Code Replace box to generate complete, validated TEI `<choice>` blocks instantly.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Generating TEI <choice> Dynamically in VS Code", "questiontext": "<p>Which replacement pattern correctly transforms a captured stem ($1) into a complete TEI <choice> block for terminal -ck words?</p>", "generalfeedback": "<p>Combine captured stems with literal XML tags in the VS Code Replace box to generate complete, validated TEI <choice> blocks instantly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<choice><orig>$1ck</orig><reg resp='#editor'>$1c</reg></choice>", "feedback": "<p>Correct. This replacement dynamically reconstructs the original spelling in <orig> and the regularized form in <reg> with @resp.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<choice><abbr>$1ck</abbr><expan resp='#editor'>$1c</expan></choice>", "feedback": "<p>Incorrect. Terminal -ck variation is orthographic regularization (<orig>/<reg>), not an abbreviation (<abbr>/<expan>).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<choice><sic>$1ck</sic><corr resp='#editor'>$1c</corr></choice>", "feedback": "<p>Incorrect. Acceptable historical spelling variants must not be tagged as scribal blunders (<sic>).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<reg resp='#editor'>$1c</reg>", "feedback": "<p>Incorrect. This replaces the original reading destructively without preserving the diplomatic witness in <choice> and <orig>.</p>"}]}}, {"step": 11, "title": "Case Sensitivity and Case Preservation in VS Code", "content": "**Case Sensitivity and Case Preservation in VS Code**\n\nHistorical documents constantly alternate between uppercase and lowercase letters. An 18th-century text might print *Publick* with a capital *P* at the start of a sentence and *publick* with a lowercase *p* in the middle of a line.\n\nHow does regular expression matching handle capitalization? In VS Code, case sensitivity is controlled by two dedicated toggles in the Find and Replace widget:\n\n<ol>\n  <li><strong>Match Case (`Alt+C`):</strong> When this toggle is active, the search is strictly case-sensitive. Searching for <code>publick</code> will ignore <code>Publick</code>. When inactive, the search matches both.</li>\n  <li><strong>Preserve Case:</strong> In the Replace box, VS Code features an extraordinary built-in button labeled <strong>Preserve Case</strong> (an icon showing uppercase and lowercase <code>AB</code>). When active, VS Code automatically matches the capitalization style of the replacement string to the matched text! If the search matches lowercase <code>publick</code>, it outputs lowercase <code>public</code>; if it matches capitalized <code>Publick</code>, it outputs capitalized <code>Public</code>!</li>\n</ol>\n\nAlternatively, you can handle casing explicitly within your regex pattern using character classes:\n\n```regex\n\\b([Pp]ublic)k\\b\n```\n\nHere, Group 1 captures either *Public* or *public*, preserving the exact initial casing inside `$1` when output into `<orig>` and `<reg>`.\n\nUnderstanding casing prevents duplicate rules. Rather than writing one rule for lowercase words and a second rule for capitalized words, a single case-aware pattern handles both cleanly.\n\n**Vocabulary.** *Match Case* — A toggle (`Alt+C`) enforcing strict character casing during regex search. *Preserve Case* — A VS Code feature that automatically adapts replacement text capitalization to match the original source word.\n\n**Takeaway:** Use the Match Case and Preserve Case toggles in VS Code, or case-insensitive character classes like `[Pp]`, to handle capitalized and lowercase variants within a single rule.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Case Sensitivity and Case Preservation in VS Code", "questiontext": "<p>How can an editor regularize both capitalized 'Publick' and lowercase 'publick' without writing two separate rules?</p>", "generalfeedback": "<p>Use the Match Case and Preserve Case toggles in VS Code, or case-insensitive character classes like [Pp], to handle capitalized and lowercase variants within a single rule.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Activate the 'Preserve Case' button in the Replace widget, or use an initial character class like [Pp] in the search pattern.</p>", "feedback": "<p>Correct. Preserve Case adapts replacement casing to match the source, and [Pp] explicitly captures both uppercase and lowercase forms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete all capital letters from the historical document before running any searches.</p>", "feedback": "<p>Incorrect. Capital letters are authentic historical witness evidence and must never be deleted.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Set the computer operating system language to an all-lowercase dialect.</p>", "feedback": "<p>Incorrect. Operating system language settings do not alter editor regex casing mechanics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Duplicate the XML document into two separate files and run one rule in each file.</p>", "feedback": "<p>Incorrect. Casing is handled cleanly within a single file using case-aware regex tools.</p>"}]}}, {"step": 12, "title": "Rule 1 in Practice: 18th-Century Terminal `-ck`", "content": "**Rule 1 in Practice: 18th-Century Terminal `-ck`**\n\nNow let us apply these principles to our first real historical case study: 18th-century adjectives ending in *-ck* (from the 1752 Treaty and colonial legal records).\n\nSuppose we begin with a simple pattern:\n\n```text\nFind:    \\b(\\w+)ck\\b\nReplace: <choice><orig>$1ck</orig><reg resp=\"#editor\">$1c</reg></choice>\n```\n\nLet us test this rule against a realistic sample sentence from an 18th-century colonial document:\n\n```text\n\"The publick traffick of black cattle shall be conducted by a politick truck.\"\n```\n\nIf you click \"Replace All\" in VS Code with that simple pattern, look at the disaster that occurs:\n<ul>\n  <li><em>publick</em> &rarr; correctly regularized to <em>public</em>.</li>\n  <li><em>traffick</em> &rarr; correctly regularized to <em>traffic</em>.</li>\n  <li><em>black</em> &rarr; transformed to <em>blac</em>! (Fatal error: <em>black</em> is a modern standard word!).</li>\n  <li><em>politick</em> &rarr; correctly regularized to <em>politic</em>.</li>\n  <li><em>truck</em> &rarr; transformed to <em>truc</em>! (Fatal error: <em>truck</em> is a modern standard word!).</li>\n</ul>\n\nThis test demonstrates the fundamental danger of naive regular expressions: **over-matching**. Our rule was too broad. It assumed that *every* word ending in *-ck* was an archaic 18th-century variant, forgetting that English has dozens of native Germanic words (*back*, *black*, *thick*, *quick*, *truck*, *lock*, *duck*) where *-ck* is standard orthography!\n\nA rule that fixes three words while corrupting two others is unacceptable in scholarship. We must refine our rule.\n\n**Vocabulary.** *Over-matching* — When a regex pattern is too general, capturing unintended words and producing erroneous replacements. *Naive pattern* — A simplistic pattern that fails to account for linguistic exceptions or homographs.\n\n**Takeaway:** Naive regular expressions over-match; always test patterns against diverse sentences to ensure they do not corrupt standard modern vocabulary like *black* or *truck*.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Rule 1 in Practice: 18th-Century Terminal -ck", "questiontext": "<p>Why does a naive regular expression like \\b(\\w+)ck\\b produce catastrophic errors on 18th-century English texts?</p>", "generalfeedback": "<p>Naive regular expressions over-match; always test patterns against diverse sentences to ensure they do not corrupt standard modern vocabulary like black or truck.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It over-matches native Germanic words where -ck is modern standard orthography, corrupting words like 'black' to 'blac' and 'truck' to 'truc'.</p>", "feedback": "<p>Correct. A broad pattern assumes all -ck words are archaic variants, corrupting standard modern vocabulary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It causes the XML file to be rejected by modern web browsers due to unencoded ampersands.</p>", "feedback": "<p>Incorrect. Over-matching produces spelling errors; it does not affect character entities.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts all verbs into passive voice participles automatically.</p>", "feedback": "<p>Incorrect. Regex matches letter patterns; it does not alter grammatical voice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the editor to re-transcribe the entire document by hand.</p>", "feedback": "<p>Incorrect. The error is resolved by refining the regex pattern to target specific historical roots.</p>"}]}}, {"step": 13, "title": "Refining Regex Rules: Stems and Root Whitelists", "content": "**Refining Regex Rules: Stems and Root Whitelists**\n\nHow do we refine Rule 1 so that it regularizes *publick* and *traffick* without touching *black* or *truck*?\n\nIn regular expressions, when a broad phonetic or morphological pattern has numerous common exceptions, the solution is to use **alternation** (`|`) to restrict the pattern to an explicit list of known historical roots (Friedl, 2006).\n\nInstead of matching any arbitrary word characters with `\\w+`, we specify the exact root stems that historically underwent the *-ck* to *-c* spelling reform:\n\n```text\nFind:    \\b(authenti|criti|fantasti|musick|politi|publi|traffi)ck\\b\n```\n\nNotice what this refined pattern does:\n<ol>\n  <li>The parentheses group an explicit whitelist of historical Latin and Greek stems that ended in <em>-ck</em> in 18th-century English.</li>\n  <li>The pipe symbol (<code>|</code>) functions as a logical OR. The engine matches <em>authenti</em> OR <em>criti</em> OR <em>publi</em>, etc.</li>\n  <li>It requires the matched root to be immediately followed by literal <code>ck</code> and a word boundary.</li>\n</ol>\n\nNow let us write the replacement pattern:\n\n```text\nReplace: <choice><orig>$1ck</orig><reg resp=\"#editor\">$1c</reg></choice>\n```\n\nWhen this refined rule scans our test sentence:\n<ul>\n  <li><em>publick</em> matches &rarr; regularized to <em>public</em>.</li>\n  <li><em>traffick</em> matches &rarr; regularized to <em>traffic</em>.</li>\n  <li><em>black</em>: the stem <em>bla</em> is not in our whitelist &rarr; ignored completely!</li>\n  <li><em>truck</em>: the stem <em>tru</em> is not in our whitelist &rarr; ignored completely!</li>\n</ul>\n\nBy constraining the search with root alternation, our rule achieves **100% precision**. It transforms every legitimate target and touches zero innocent words.\n\n**Vocabulary.** *Alternation (`|`)* — A regex operator functioning as a logical OR, matching either the pattern on its left or its right. *Root whitelisting* — Restricting a regex pattern to an explicit enumeration of validated historical stems to prevent false positives.\n\n**Takeaway:** Use alternation `(stem1|stem2|stem3)` to restrict normalization rules to validated historical roots, eliminating false positive errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Refining Regex Rules: Stems and Root Whitelists", "questiontext": "<p>How do digital editors eliminate false positives when regularizing 18th-century -ck words?</p>", "generalfeedback": "<p>Use alternation (stem1|stem2|stem3) to restrict normalization rules to validated historical roots, eliminating false positive errors.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By using alternation to restrict the pattern to an explicit whitelist of historical Latin and Greek roots: \\b(publi|traffi|authenti)ck\\b.</p>", "feedback": "<p>Correct. Root whitelisting ensures that only validated historical targets are matched, leaving words like 'black' and 'track' completely untouched.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By adding the word 'PLEASE' at the beginning of the regular expression.</p>", "feedback": "<p>Incorrect. Regex engines parse formal syntax, not polite natural language requests.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the letter 'k' from every word in the entire document indiscriminately.</p>", "feedback": "<p>Incorrect. Blind deletion creates hundreds of false positive errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By converting the XML document into an uncompressed TIFF image file.</p>", "feedback": "<p>Incorrect. Normalization is a text markup process, not an image format conversion.</p>"}]}}, {"step": 14, "title": "Rule 2 in Practice: The Long s (`ſ`)", "content": "**Rule 2 in Practice: The Long s (`ſ`)**\n\nOur second historical rule addresses the typographical **long s** (Unicode `ſ` / `U+017F`), ubiquitous in printed books and broadsides prior to roughly 1800.\n\nIn the 1752 Treaty, the long *s* is used for lowercase *s* at the beginning and in the middle of words, while the round *s* is used at the end (e.g., *ſaid*, *firſt*, *witneſses*).\n\nHow should an editor handle the long *s* with regular expressions?\n\nFirst, you must consult your **Editorial Policy**:\n<ul>\n  <li><strong>Policy Option A (Global Graphemic Modernization):</strong> Many modern digital editions consider the long <em>s</em> to be a purely typographical font feature (like a ligature or font variant) rather than a spelling variation. Under this policy, you simply replace all instances of <code>ſ</code> with modern <code>s</code> globally across the text.\n    <pre><code>Find:    ſ\nReplace: s</code></pre>\n  </li>\n  <li><strong>Policy Option B (Full TEI Parallel Tracking):</strong> If your edition is a strict paleographical study documenting 18th-century typographical habits, you may choose to record every long <em>s</em> inside a <code>&lt;choice&gt;</code> block:\n    <pre><code>Find:    \\b(\\w*)ſ(\\w*)\\b\nReplace: &lt;choice&gt;&lt;orig&gt;$1ſ$2&lt;/orig&gt;&lt;reg resp=\"#editor\"&gt;$1s$2&lt;/reg&gt;&lt;/choice&gt;</code></pre>\n  </li>\n</ul>\n\nNotice that Option B wraps the entire word containing the long *s* into `<choice>`. If a word contains two long *s*'s (like *witneſses*), running a single-letter regex requires care so you do not nest `<choice>` tags inside `<choice>` tags. For most undergraduate projects, Option A (or replacing `ſ` before line-level normalization) is standard practice.\n\n**Vocabulary.** *Typographical regularization* — Standardizing archaic letterforms (such as long *s*) that represent font conventions rather than distinct lexical spellings. *Character-level vs. word-level* — Choosing whether to tag individual letters or wrap the entire containing word in TEI markup.\n\n**Takeaway:** The long *s* (`ſ`) can be regularized globally as a typographical feature or wrapped at word level in `<choice>`, depending on your stated editorial policy.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Rule 2 in Practice: The Long s (ſ)", "questiontext": "<p>What is the primary editorial difference between Policy Option A and Policy Option B when handling the long s (ſ)?</p>", "generalfeedback": "<p>The long s (ſ) can be regularized globally as a typographical feature or wrapped at word level in <choice>, depending on your stated editorial policy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Option A treats long s as a typographical font convention regularized globally to 's'; Option B records every long s inside a TEI <choice> block.</p>", "feedback": "<p>Correct. Editors choose between global font modernization and detailed word-level paleographical tracking depending on project goals.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Option A is legally permitted only in Europe, while Option B is required in North America.</p>", "feedback": "<p>Incorrect. Both options are standard scholarly methods used internationally.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Option A permanently deletes all vowels, while Option B doubles all consonants.</p>", "feedback": "<p>Incorrect. Both options concern solely the letterform long s (ſ) and its modern counterpart s.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Option A requires Python programming, while Option B requires writing in C++.</p>", "feedback": "<p>Incorrect. Both options can be executed directly inside the VS Code editor.</p>"}]}}, {"step": 15, "title": "Rule 3 in Practice: Thorn Contractions (`ye` and `yt`)", "content": "**Rule 3 in Practice: Thorn Contractions (`ye` and `yt`)**\n\nOur third rule automates the expansion of early modern scribal contractions in colonial documents, specifically the thorn abbreviations *y<hi rend=\"superscript\">e</hi>* (*the*) and *y<hi rend=\"superscript\">t</hi>* (*that*).\n\nIn your diplomatic transcription from Week 4, you may have transcribed these words either as plain text (*ye*, *yt*) or with superscript tags (*y<sup>e</sup>* or `y<hi rend=\"superscript\">e</hi>`).\n\nLet us build a regex rule to handle plain text *ye* first. Expanding thorn changes the initial letter itself (*y* becomes *th*), so a captured *y* cannot be reused in the expansion. Write one rule per case instead:\n\n```text\nRule 3a (lowercase):\nFind:    \\bye\\b\nReplace: <choice><abbr>ye</abbr><expan resp=\"#editor\">the</expan></choice>\n\nRule 3b (capitalized):\nFind:    \\bYe\\b\nReplace: <choice><abbr>Ye</abbr><expan resp=\"#editor\">The</expan></choice>\n```\n\nLet us trace these rules:\n<ol>\n  <li><code>\\bye\\b</code> matches only the standalone lowercase <em>ye</em>; with <strong>Match Case</strong> switched on, it ignores <em>Ye</em>, which Rule 3b handles.</li>\n  <li>Why not one rule with <code>\\b([Yy])e\\b</code> and <code>$1he</code>? Because <code>$1</code> reproduces the captured letter: <em>ye</em> would become <em>yhe</em>, and <em>Ye</em> would become <em>Yhe</em>. A backreference copies what was matched; it cannot turn <em>y</em> into <em>th</em>.</li>\n</ol>\n\nNow, what if your transcription already contains superscript tags, such as `y<hi rend=\"superscript\">e</hi>`?\n\n```text\nFind:    \\by<hi rend=\"superscript\">e</hi>\nReplace: <choice><abbr>y<hi rend=\"superscript\">e</hi></abbr><expan resp=\"#editor\">the</expan></choice>\n```\n\nBecause the tag `<hi rend=\"superscript\">e</hi>` is literal XML, we include it directly in our search pattern. The regex matches the letter *y* followed immediately by the superscript tag, wrapping the entire historical graphic unit into `<abbr>` and supplying the expanded modern word in `<expan>`. Repeat it with a capital *Y* and *The* for sentence-initial forms, and the same way for *y<sup>t</sup>* (*that*).\n\n**Vocabulary.** *Thorn pattern* — A regex designed to identify pseudo-archaic *y*-abbreviations and map them to standard *th*-words. *Superscript matching* — Matching embedded XML formatting tags as part of an abbreviation search string.\n\n**Takeaway:** Expanding thorn changes the initial letter (*y* becomes *th*), so write one rule per case (*ye* to *the*, *Ye* to *The*); a backreference can only copy the captured letter.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Rule 3 in Practice: Thorn Contractions (ye and yt)", "questiontext": "<p>When expanding early modern 'ye' into 'the', what precaution must an editor observe?</p>", "generalfeedback": "<p>Expanding thorn changes the initial letter (y becomes th), so write one rule per case (ye to the, Ye to The), and check each match is not the pronoun ye.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Ensure that the word is a genuine thorn abbreviation for 'the' rather than the authentic archaic second-person pronoun 'ye' ('ye shall know').</p>", "feedback": "<p>Correct. The string 'ye' can be either an abbreviation for 'the' or a genuine personal pronoun; editors verify context before replacing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ensure that the word 'ye' is spelled backwards in the XML header.</p>", "feedback": "<p>Incorrect. Words are never spelled backwards in TEI markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Confirm that the computer has been restarted within the last twenty minutes.</p>", "feedback": "<p>Incorrect. Computational regex execution is unrelated to operating system uptime.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete all surrounding punctuation marks so the word can expand cleanly.</p>", "feedback": "<p>Incorrect. Punctuation marks are essential textual evidence and must be preserved.</p>"}]}}, {"step": 16, "title": "Rule 4 in Practice: Early French Verb Endings (`-oit` and `-oient`)", "content": "**Rule 4 in Practice: Early French Verb Endings (`-oit` and `-oient`)**\n\nNow let us turn to our French Revolutionary decree (Ace's project). In 1791 French official printing, the imperfect indicative and conditional verb endings are systematically printed with *oi* instead of modern *ai*:\n\n<ul>\n  <li>3rd-person singular: <em>-oit</em> (modern <em>-ait</em>), as in <em>étoit</em> &rarr; <em>était</em>, <em>dérogeoit</em> &rarr; <em>dérogeait</em>.</li>\n  <li>3rd-person plural: <em>-oient</em> (modern <em>-aient</em>), as in <em>étoient</em> &rarr; <em>étaient</em>, <em>faisoient</em> &rarr; <em>faisaient</em>.</li>\n</ul>\n\nCan we automate this transformation in VS Code? Yes, but French needs one adjustment first. VS Code's search engine treats only the unaccented letters *a* to *z*, the digits and the underscore as \"word characters\". To it, *é* is punctuation, so `\\w` stops at *é* and `\\b` sees a boundary in the middle of *étoit*. Try `\\b(\\w+)oit\\b` on *étoit* and it matches only *toit*: the replacement splits the word into `é<choice><orig>toit</orig>...`. And `\\bétoit\\b` never matches at all.\n\nThe fix is to name letters by their Unicode category. `\\p{L}` means \"any letter, accented or not\", and the lookarounds `(?<!\\p{L})` and `(?!\\p{L})` mean \"no letter just before\" and \"no letter just after\". Together they do the job `\\b` does in English. We write two targeted rules:\n\n```text\nRule 4a (Singular Imperfect):\nFind:    (?<!\\p{L})(\\p{L}+)oit(?!\\p{L})\nReplace: <choice><orig>$1oit</orig><reg resp=\"#editor\">$1ait</reg></choice>\n\nRule 4b (Plural Imperfect):\nFind:    (?<!\\p{L})(\\p{L}+)oient(?!\\p{L})\nReplace: <choice><orig>$1oient</orig><reg resp=\"#editor\">$1aient</reg></choice>\n```\n\nNotice what happens during execution:\n<ol>\n  <li>Rule 4a matches the whole word <em>étoit</em>. Group 1 captures the verbal root <code>ét</code>.</li>\n  <li>The Replace field reconstructs the original word in <code>&lt;orig&gt;$1oit&lt;/orig&gt;</code> and supplies the modern spelling in <code>&lt;reg resp=\"#editor\"&gt;$1ait&lt;/reg&gt;</code>.</li>\n  <li>Result: <code>&lt;choice&gt;&lt;orig&gt;étoit&lt;/orig&gt;&lt;reg resp=\"#editor\"&gt;était&lt;/reg&gt;&lt;/choice&gt;</code>.</li>\n</ol>\n\n(Python's `re` module treats accented letters as word characters by default, so in a Python script the plain `\\b(\\w+)oit\\b` does reach the whole word.)\n\nWhat about nouns or adjectives ending in *-oit*, such as *droit* (law/right) or *étroit* (narrow)?\nIf we ran Rule 4a as written, would *droit* become *drait*? \n**YES!** In modern French, *droit* is still spelled *droit*!\n\nThis demonstrates why Rule Ordering and Whitelisting matter. In French, nouns like *droit* must either be excluded or the verb stems must be explicitly whitelisted, for example `(?<!\\p{L})(ét|av|fais|déroge)oit(?!\\p{L})`. Testing in VS Code reveals this immediately!\n\n**Vocabulary.** *Voltairean verb rule* — A regex automating the historical French orthographic shift from *oi* to *ai* in verb conjugations. *Grammatical homograph* — Words sharing a terminal spelling where some are verbs requiring regularization and others are invariant nouns (like *droit*).\n\n**Takeaway:** Automating French *-oit* to *-ait* regularizes imperfect verbs, but editors must protect invariant nouns like *droit* from accidental corruption.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Rule 4 in Practice: Early French Verb Endings (-oit and -oient)", "questiontext": "<p>Why must an editor protect the word 'droit' when running a regex to regularize 18th-century French verbs ending in -oit?</p>", "generalfeedback": "<p>Automating French -oit to -ait regularizes imperfect verbs, but editors must protect invariant nouns like droit from accidental corruption.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>In modern French, 'droit' is an invariant noun/adjective whose spelling did not change, unlike imperfect verbs like 'étoit' which became 'était'.</p>", "feedback": "<p>Correct. 'Droit' is not an imperfect verb; regularizing it to 'drait' is a severe false-positive error.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The word 'droit' was legally protected by the French monarchy against digital editing.</p>", "feedback": "<p>Incorrect. The issue is linguistic accuracy in modern French orthography, not royal patents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema treats the letters d-r-o-i-t as an unclosed XML tag.</p>", "feedback": "<p>Incorrect. 'Droit' is ordinary text, but regex cannot distinguish verbs from nouns without careful constraints.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The French National Assembly banned the letter 'a' from official decrees in 1791.</p>", "feedback": "<p>Incorrect. The letter 'a' was widely used; the Voltairean reform replaced -oit with -ait.</p>"}]}}, {"step": 17, "title": "Rule 5 in Practice: Maud Lewis Phonetic Doubling", "content": "**Rule 5 in Practice: Maud Lewis Phonetic Doubling**\n\nNow let us examine vernacular English correspondence (Olyvia's Maud Lewis project). In personal letters, writers frequently double consonants phonetically, writing *allways* for *always*, *untill* for *until*, or *truely* for *truly*.\n\nUnlike colonial treaties, vernacular personal letters do not follow an official government printing style. Their spelling reflects individual acoustic habits. Therefore, building broad morphological rules (like \"reduce all double *l*'s\") is completely impossible, because words like *ball*, *call*, and *yellow* require double *l*'s!\n\nFor vernacular writing, the correct deterministic strategy is **explicit vocabulary alternation**:\n\n```text\nFind:    \\b([Aa])llways\\b\nReplace: <choice><orig>$1llways</orig><reg resp=\"#editor\">$1lways</reg></choice>\n```\n\n```text\nFind:    \\b([Uu])ntill\\b\nReplace: <choice><orig>$1ntill</orig><reg resp=\"#editor\">$1ntil</reg></choice>\n```\n\n```text\nFind:    \\b([Tt])ruely\\b\nReplace: <choice><orig>$1ruely</orig><reg resp=\"#editor\">$1ruly</reg></choice>\n```\n\nNotice how clean and safe these rules are:\n<ul>\n  <li>Each rule targets an exact, known phonetic quirk identified during your close reading in Step 1.</li>\n  <li>Word boundaries (<code>\\b</code>) ensure that the rule matches only the complete standalone word.</li>\n  <li>Initial character classes (<code>[Aa]</code>, <code>[Uu]</code>) preserve capitalization whether the word opens a sentence or sits mid-line.</li>\n  <li>The rule cannot possibly produce false positives on unrelated words.</li>\n</ul>\n\nIn digital editing, a set of five precise, explicit rules is infinitely superior to one clever, complex rule that corrupts words you never intended to touch.\n\n**Vocabulary.** *Explicit vocabulary rule* — A regex targeting specific, pre-identified variant words rather than broad grammatical patterns. *Vernacular targeting* — Adapting regex precision to the individualized phonetic habits of personal correspondence.\n\n**Takeaway:** For vernacular correspondence, use targeted explicit word rules rather than broad morphological patterns to eliminate false positives.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Rule 5 in Practice: Maud Lewis Phonetic Doubling", "questiontext": "<p>Why is a broad rule like 'replace all double consonants with single consonants' inappropriate for Maud Lewis's letters?</p>", "generalfeedback": "<p>For vernacular correspondence, use targeted explicit word rules rather than broad morphological patterns to eliminate false positives.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Standard English requires double consonants in common words like 'ball', 'call', and 'yellow'; broad rules corrupt standard words.</p>", "feedback": "<p>Correct. Vernacular phonetic doubling is idiosyncratic; editors use targeted rules for specific words like 'allways' or 'untill'.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Maud Lewis wrote in an unencoded Maritime dialect that cannot be represented in UTF-8.</p>", "feedback": "<p>Incorrect. Her letters are written in English and encoded in standard Unicode UTF-8.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI Guidelines forbid the use of regular expressions on personal correspondence.</p>", "feedback": "<p>Incorrect. Regex is a standard tool across all genres of digital scholarly editing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Consonants cannot be doubled in XML documents without causing parser crashes.</p>", "feedback": "<p>Incorrect. XML parsers process doubled consonants identically to any other text.</p>"}]}}, {"step": 18, "title": "Rule 6 in Practice: Unpunctuated Contractions", "content": "**Rule 6 in Practice: Unpunctuated Contractions**\n\nIn vernacular writing and informal manuscripts, authors frequently omit the apostrophe in common negative contractions, writing *dont*, *cant*, *wont*, and *didnt*.\n\nCan we write a regular expression to add the missing apostrophe inside a TEI `<choice>` block?\n\nLet us test a pattern in VS Code:\n\n```text\nFind:    \\b([Dd])ont\\b\nReplace: <choice><orig>$1ont</orig><reg resp=\"#editor\">$1on't</reg></choice>\n```\n\n```text\nFind:    \\b([Cc])ant\\b\nReplace: <choice><orig>$1ant</orig><reg resp=\"#editor\">$1an't</reg></choice>\n```\n\nThese rules work beautifully for *dont* and *cant*. But now consider the word **wont**:\n\n```text\nFind:    \\b([Ww])ont\\b\nReplace: <choice><orig>$1ont</orig><reg resp=\"#editor\">$1on't</reg></choice>\n```\n\nIn English, **wont** is an authentic dictionary word! It is an archaic noun and adjective meaning \"accustomed, habit, or custom\" (as in \"as was his wont\", or \"he was wont to rise early\").\n\nIf a 19th-century author or colonial writer writes \"according to his wont\", and your regex blindly replaces it with *won't* (will not), you have introduced a catastrophic semantic blunder into your text!\n\nThis is why regular expressions cannot be trusted blindly. An automated tool matches character strings, not meaning. In Section 21, we will see how VS Code's \"Find Next\" stepping protects you from this exact homograph trap.\n\n**Vocabulary.** *Lexical homograph trap* — When an unpunctuated contraction (like *wont*) is identical in spelling to a valid, unrelated word (like *wont* = custom), risking false-positive replacement.\n\n**Takeaway:** Unpunctuated contractions like *dont* can be regularized with regex, but homographs like *wont* require human contextual verification.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Rule 6 in Practice: Unpunctuated Contractions", "questiontext": "<p>What lexical trap must an editor avoid when writing a regex to regularize unpunctuated 'wont' to 'won't'?</p>", "generalfeedback": "<p>Unpunctuated contractions like dont can be regularized with regex, but homographs like wont require human contextual verification.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>'Wont' is an authentic English word meaning 'habit' or 'custom'; blindly replacing it with 'won't' alters the sentence's meaning.</p>", "feedback": "<p>Correct. 'Wont' is a semantic homograph; automated replacement corrupts sentences where it means habit rather than will not.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The word 'wont' cannot be saved in a text file that contains XML tags.</p>", "feedback": "<p>Incorrect. 'Wont' is a normal text string; the danger is semantic misinterpretation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Adding an apostrophe causes web browsers to delete the following sentence.</p>", "feedback": "<p>Incorrect. Apostrophes are standard punctuation characters in XML and HTML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema requires all contractions to be spelled with three apostrophes.</p>", "feedback": "<p>Incorrect. Contractions follow standard lexicography inside <reg>.</p>"}]}}, {"step": 19, "title": "The Golden Rule of XML-Safe Regex", "content": "**The Golden Rule of XML-Safe Regex**\n\nWhen working in TEI, you are not editing raw plain text. You are editing text **already embedded inside an XML markup tree**.\n\nThis structural reality introduces a severe hazard that destroys hundreds of student files every semester: **regex patterns that accidentally match XML tags**.\n\nConsider what happens if you write a search pattern using a bare dot: `.*`. Remember that a dot matches *any* character, including `<` and `>`. If you search for:\n\n```regex\n\\b(in).*\\b\n```\n\nThe dot can match directly across an XML tag! It might match the *in* in `<div type=\"section\">`, swallow the attribute, cross the closing bracket, and match into the text! If you hit replace, you will tear open the XML tag, corrupting the document hierarchy and causing immediate schema validation failure.\n\nTo prevent this catastrophe, memorize and follow **The Golden Rule of XML-Safe Regex**:\n\n<table style=\"width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1; text-align: left;\">\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Rule</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Dangerous Pattern</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">XML-Safe Pattern</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Why It Protects You</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><strong>1. Restrict Wildcards</strong></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>.*</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>[^&lt;&gt;]*</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Refuses to match angle brackets; stays strictly inside text nodes.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><strong>2. Use Word Characters</strong></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>.+</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>\\w+</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Matches only letters and digits; stops instantly at punctuation and tags.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><strong>3. Anchor Boundaries</strong></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>ye</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>\\bye\\b</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Prevents matching attributes like <code>type=\"poem\"</code>.</td>\n    </tr>\n  </tbody>\n</table>\n\n**Vocabulary.** *XML-safe regex* — A regular expression specifically constrained to prevent matching or corrupting XML element tags, attribute quotes, or bracket delimiters. *Tag corruption* — The accidental mutilation of XML syntax caused by unconstrained regex wildcards.\n\n**Takeaway:** Never use unconstrained wildcards (`.*`) in XML; use `\\w+` or `[^<>]*` to ensure your search patterns stay strictly confined within text nodes.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: The Golden Rule of XML-Safe Regex", "questiontext": "<p>According to the Golden Rule of XML-Safe Regex, why should editors replace bare wildcards (.*) with [^<>]*?</p>", "generalfeedback": "<p>Never use unconstrained wildcards (.*) in XML; use \\w+ or [^<>]* to ensure your search patterns stay strictly confined within text nodes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The pattern [^<>]* refuses to match angle brackets, preventing the search from accidentally matching into or across XML tags.</p>", "feedback": "<p>Correct. Restricting wildcards ensures that regular expressions operate strictly on text nodes and never mutilate XML element markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Angle brackets are automatically deleted by the operating system during regex execution.</p>", "feedback": "<p>Incorrect. Angle brackets remain intact, but bare wildcards can match them and corrupt tags.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The pattern [^<>]* speeds up computer processing by disabling the computer monitor.</p>", "feedback": "<p>Incorrect. It provides syntactic containment within XML text nodes, protecting document integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema requires all regular expressions to be registered with the Library of Congress.</p>", "feedback": "<p>Incorrect. XML-safe regex is an editorial coding discipline, not a government registry.</p>"}]}}, {"step": 20, "title": "Milestones and Line Breaks: Protecting `<lb/>`", "content": "**Milestones and Line Breaks: Protecting `<lb/>`**\n\nIn Lesson 6.1, we established that when a word is divided across a line break, the physical milestone `<lb/>` must reside inside the `<orig>` element:\n\n```xml\n<choice>\n  <orig>Gov-<lb n=\"13\"/>ernor</orig>\n  <reg resp=\"#editor\">Governor</reg>\n</choice>\n```\n\nNow ask yourself: what happens if you run an automated regular expression search for the word *Governor* across that line?\n\n```regex\n\\bGovernor\\b\n```\n\nWill it match? **NO!** \n\nTo the regular expression engine, the characters on the page are `Gov-<lb n=\"13\"/>ernor`. The letters *G-o-v* are immediately followed by a hyphen and an angle bracket `<`. Because an angle bracket is a non-word character, `\\b` asserts a boundary, and the search fails to find *Governor*.\n\nFurthermore, what if you write a regex to regularize hyphenated words:\n\n```regex\n\\b(\\w+)-<lb n=\"\\d+\"/>(\\w+)\\b\n```\n\nThis pattern will successfully match the hyphenated split! And you can write a replacement that wraps it cleanly into TEI:\n\n```text\nReplace: <choice><orig>$1-<lb n=\"13\"/>$2</orig><reg resp=\"#editor\">$1$2</reg></choice>\n```\n\nHowever, because line numbers vary on every line, hardcoding line numbers in regex replacement is complex. For hyphenated words split across line breaks, **it is almost always safer and faster to regularize them by hand** during Step 1, using automated regex only for words that sit completely within a single typographic line.\n\n**Vocabulary.** *Milestone collision* — The failure of a regex pattern to match a word because an empty XML milestone (like `<lb/>`) interrupts the character sequence. *Hyphenated split* — A word broken across two lines by a hyphen and an `<lb/>` element.\n\n**Takeaway:** Words split across lines by `<lb/>` tags will not match standard single-word regex patterns; handle split words manually in Step 1.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Milestones and Line Breaks: Protecting <lb/>", "questiontext": "<p>Why will a standard regular expression like \\bGovernor\\b fail to match a word split across lines as 'Gov-<lb n='13'/>ernor'?</p>", "generalfeedback": "<p>Words split across lines by <lb/> tags will not match standard single-word regex patterns; handle split words manually in Step 1.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The physical milestone tag and hyphen interrupt the character sequence, causing the word boundary check to fail.</p>", "feedback": "<p>Correct. To the regex engine, angle brackets and hyphens are non-word characters; split words are best handled manually in Step 1.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Line break tags are invisible to regular expression search engines.</p>", "feedback": "<p>Incorrect. Regex reads XML tags as literal characters, which is why they interrupt the word match.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The word 'Governor' is legally prohibited from crossing line boundaries in TEI.</p>", "feedback": "<p>Incorrect. Line breaks can occur anywhere in historical manuscripts; encoding them is standard practice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema deletes any word that contains more than eight letters across a line break.</p>", "feedback": "<p>Incorrect. Schema validation does not limit word lengths across milestone tags.</p>"}]}}, {"step": 21, "title": "Interactive Step-and-Replace vs. Blind \"Replace All\"", "content": "**Interactive Step-and-Replace vs. Blind \"Replace All\"**\n\nIn the VS Code Replace widget, there are two replacement buttons:\n<ol>\n  <li><strong>Replace (`Enter` or `Cmd+Alt+Enter`):</strong> Replaces the single currently highlighted match and advances the cursor to the next match.</li>\n  <li><strong>Replace All (`Cmd+Option+Enter` or `Ctrl+Alt+Enter`):</strong> Replaces every match in the entire document instantly in a single unmonitored pass.</li>\n</ol>\n\nTo novice editors, \"Replace All\" feels like magic. You press one button, and fifty words are instantly regularized.\n\nIn professional textual editing, **blind \"Replace All\" is the single greatest cause of corrupted editions**.\n\nWhen you click \"Replace All\", you surrender your human eyes. You assume that your regex pattern is mathematically perfect, that it has zero false positives, that no homographs exist in the document, and that no XML attributes happen to share the same letters. If your rule contains a subtle flaw, \"Replace All\" multiplies that flaw across fifty lines in a microsecond.\n\nInstead, professional digital editors practice **Interactive Step-and-Re
