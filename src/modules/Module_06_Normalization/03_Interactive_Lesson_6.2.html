place**:\n\n<ul>\n  <li>Press <code>Enter</code> to jump to Match 1. Look at it. Confirm that it is a genuine target word, not a homograph or tag.</li>\n  <li>Click <code>Replace</code>. Watch the replacement happen. Verify that the newly inserted <code>&lt;choice&gt;</code> block looks syntactically valid.</li>\n  <li>Press <code>Enter</code> to advance to Match 2. Repeat.</li>\n  <li>Only after you have stepped through 5 or 6 matches and verified with 100% certainty that your rule is performing flawlessly should you ever consider clicking \"Replace All\" for the remainder of that specific rule.</li>\n</ul>\n\n**Vocabulary.** *Interactive Step-and-Replace* — The disciplined editorial practice of visually inspecting each regex match before confirming replacement. *Blind replacement* — Executing a global \"Replace All\" command without inspecting individual matches, risking silent textual corruption.\n\n**Takeaway:** Always use Interactive Step-and-Replace to inspect matches individually; never execute blind \"Replace All\" without prior visual verification.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Interactive Step-and-Replace vs. Blind 'Replace All'", "questiontext": "<p>Why do professional digital textual editors strongly discourage executing blind 'Replace All' commands?</p>", "generalfeedback": "<p>Always use Interactive Step-and-Replace to inspect matches individually; never execute blind 'Replace All' without prior visual verification.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Blind replacement multiplies any flaw or false positive across the entire file in an instant without visual verification.</p>", "feedback": "<p>Correct. Stepping through matches individually ensures that homographs, tags, and unexpected edge cases are inspected before confirmation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Clicking 'Replace All' permanently locks the file so that no future edits can ever be made.</p>", "feedback": "<p>Incorrect. Files can always be edited or restored from Git, but blind replacements introduce silent errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Replace All button is an experimental feature that only works on mainframe computers.</p>", "feedback": "<p>Incorrect. Replace All is standard in VS Code, but dangerous in textual scholarship without verification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace All causes the XML schema to rewrite the TEI Header automatically.</p>", "feedback": "<p>Incorrect. Replace All alters text in the editor; it does not rewrite header metadata.</p>"}]}}, {"step": 22, "title": "Measuring Rule Quality: True Positives vs. False Positives", "content": "**Measuring Rule Quality: True Positives vs. False Positives**\n\nIn computational linguistics and information retrieval, the quality of an automated rule is measured using four fundamental diagnostic categories (Jurafsky & Martin, 2024):\n\n<ol>\n  <li><strong>True Positive (TP):</strong> The rule matches a word that legitimately required normalization, and transforms it correctly (e.g., matching <em>publick</em> and regularizing it to <em>public</em>).</li>\n  <li><strong>False Positive (FP):</strong> The rule matches a word that should NOT have been touched, and corrupts it (e.g., matching <em>black</em> and changing it to <em>blac</em>, or matching <em>wont</em> and changing it to <em>won't</em>). In digital editing, a False Positive is an editorial disaster.</li>\n  <li><strong>False Negative (FN):</strong> The rule misses a word that legitimately required normalization, leaving it unregularized (e.g., failing to match <em>politick</em> because of an unexpected capital letter).</li>\n  <li><strong>True Negative (TN):</strong> The rule correctly ignores words that did not require normalization (e.g., correctly skipping words like <em>peace</em>, <em>governor</em>, and <em>the</em>).</li>\n</ol>\n\nEvery time you test a regular expression on your 20-line workshop passage, you must count these outcomes:\n\n```text\nTP = Legitimate targets correctly regularized\nFP = Innocent words corrupted by the rule\nFN = Legitimate targets missed by the rule\n```\n\nIf your rule produces even a single False Positive ($FP > 0$), the rule is broken. You must stop, analyze the match, and refine your regex pattern before proceeding.\n\n**Vocabulary.** *True Positive (TP)* — A legitimate target correctly identified and transformed by a rule. *False Positive (FP)* — An innocent word wrongly matched and transformed by a rule (a commission error). *False Negative (FN)* — A legitimate target overlooked by a rule (an omission error).\n\n**Takeaway:** Evaluate every regex rule by tracking True Positives (successes), False Positives (disastrous over-matches), and False Negatives (missed targets).\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Measuring Rule Quality: True Positives vs. False Positives", "questiontext": "<p>In the diagnostic evaluation of regular expressions, what constitutes a False Positive (FP)?</p>", "generalfeedback": "<p>Evaluate every regex rule by tracking True Positives (successes), False Positives (disastrous over-matches), and False Negatives (missed targets).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>An innocent word that was wrongly matched and corrupted by a rule that should not have touched it.</p>", "feedback": "<p>Correct. A False Positive is a commission error (such as turning 'black' into 'blac'); even a single FP indicates a defective rule.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A word that was correctly identified and regularized according to the editorial policy.</p>", "feedback": "<p>Incorrect. A correct transformation of a legitimate target is a True Positive (TP).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A target word that was overlooked by the regular expression and left unregularized.</p>", "feedback": "<p>Incorrect. A missed target is a False Negative (FN).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A line of text that contains zero spelling errors or abbreviations.</p>", "feedback": "<p>Incorrect. Correctly skipped text represents a True Negative (TN).</p>"}]}}, {"step": 23, "title": "Precision and Recall in Digital Editing", "content": "**Precision and Recall in Digital Editing**\n\nTo quantify the performance of your regular expressions mathematically, digital textual scholarship borrows two core metrics from data science: **Precision** and **Recall** (Bollmann, 2019).\n\n**Precision** measures how accurate your rule is when it takes an action. It answers the question: *Of all the words this rule matched and transformed, what percentage was actually correct?*\n\n$$\\text{Precision} = \\frac{\\text{True Positives}}{\\text{True Positives} + \\text{False Positives}}$$\n\nIf your rule transforms 10 words, and 9 were genuine archaic spellings while 1 was a modern word corrupted by accident, your precision is:\n\n$$\\text{Precision} = \\frac{9}{9 + 1} = 0.90 \\text{ (90\\%)}$$\n\n**Recall** measures the completeness of your rule. It answers the question: *Of all the archaic words that existed in the text, what percentage did your rule successfully find?*\n\n$$\\text{Recall} = \\frac{\\text{True Positives}}{\\text{True Positives} + \\text{False Negatives}}$$\n\nIf there were 12 archaic words in your document, and your rule found 9 of them while missing 3, your recall is:\n\n$$\\text{Recall} = \\frac{9}{9 + 3} = 0.75 \\text{ (75\\%)}$$\n\nIn scholarly editing, **Precision always outranks Recall**. A rule with 100% precision and 75% recall is completely acceptable: it safely normalizes 9 words and leaves 3 for manual review. But a rule with 100% recall and 70% precision corrupts your text with false positives! Strive for 100% precision in every rule you write.\n\n**Vocabulary.** *Precision* — The proportion of matched instances that were genuine, correct targets ($TP / [TP + FP]$). *Recall* — The proportion of all actual targets in the text that were successfully retrieved by the rule ($TP / [TP + FN]$). *Scholarly precision priority* — The editorial principle that avoiding false positives is far more important than achieving total recall.\n\n**Takeaway:** In digital editing, precision must always outrank recall: it is far better to miss a variant for manual review than to corrupt a single word with a false positive.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Precision and Recall in Digital Editing", "questiontext": "<p>Why does Precision always outrank Recall in academic scholarly editing?</p>", "generalfeedback": "<p>In digital editing, precision must always outrank recall: it is far better to miss a variant for manual review than to corrupt a single word with a false positive.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It is far better to miss a variant for manual review than to corrupt a single word with an automated false positive.</p>", "feedback": "<p>Correct. High recall with poor precision introduces errors into the text; high precision guarantees that every automated change is authentic.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Recall cannot be calculated mathematically on historical text files.</p>", "feedback": "<p>Incorrect. Recall is calculated as TP / (TP + FN); the issue is editorial data integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Precision is required by university grading rubrics, whereas Recall is ignored by professors.</p>", "feedback": "<p>Incorrect. Both are scientific metrics, but precision prevents the introduction of corrupt data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A document with high recall cannot be committed to a Git repository.</p>", "feedback": "<p>Incorrect. Git tracks all text files; the priority reflects scholarly fidelity to the historical witness.</p>"}]}}, {"step": 24, "title": "Auditing Rules against Yesterday's Manual Ground Truth", "content": "**Auditing Rules against Yesterday's Manual Ground Truth**\n\nHow do you know what your True Positives, False Positives, and False Negatives actually are? You discover them by **auditing your automated regex output against yesterday's manual ground truth**.\n\nYesterday in Step 1, you hand-encoded your 20-line passage into `transcription_reconciled_manual.xml`. Every tag in that file was placed with verified human scholarly judgment.\n\nToday in Step 2, you create a duplicate file: `transcription_reconciled_regex.xml`. You run your VS Code regular expressions across this second file.\n\nNow, open both files side by side in Visual Studio Code:\n<ol>\n  <li>Right-click on `transcription_reconciled_manual.xml` in the Explorer panel and select <strong>Select for Compare</strong>.</li>\n  <li>Right-click on `transcription_reconciled_regex.xml` and select <strong>Compare with Selected</strong>.</li>\n</ol>\n\nVS Code opens a side-by-side **Diff Editor**:\n<ul>\n  <li>Where the two files match identically in green: your regex rule matched your manual ground truth perfectly (<strong>True Positive</strong>).</li>\n  <li>Where your regex file changed a word that your manual ground truth left alone: you have caught a <strong>False Positive</strong>!</li>\n  <li>Where your manual ground truth has a <code>&lt;choice&gt;</code> block that your regex file missed: you have caught a <strong>False Negative</strong>!</li>\n</ul>\n\nThis visual diff transforms proofreading into an exact science. You do not have to guess whether your regex worked; the diff highlights every discrepancy with surgical precision.\n\n**Vocabulary.** *Side-by-side diff* — A comparative editor interface displaying two versions of a file side by side, highlighting additions, deletions, and character discrepancies in color. *Ground truth audit* — Evaluating automated script or regex outputs by measuring their exact divergence from a hand-verified baseline.\n\n**Takeaway:** Use VS Code's side-by-side diff editor to compare your regex output against your manual ground truth, visually exposing every false positive and false negative.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Auditing Rules against Yesterday's Manual Ground Truth", "questiontext": "<p>How does opening a side-by-side diff in VS Code allow an editor to audit automated regular expressions?</p>", "generalfeedback": "<p>Use VS Code's side-by-side diff editor to compare your regex output against your manual ground truth, visually exposing every false positive and false negative.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Discrepancies between the manual ground truth and the regex output are highlighted in color, exposing false positives and missed targets instantly.</p>", "feedback": "<p>Correct. The diff editor compares the files character by character, showing exactly where automated rules diverged from verified human judgment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically translates both documents into modern Italian for comparison with Vatican manuscripts.</p>", "feedback": "<p>Incorrect. The diff editor highlights textual additions and deletions within the active workspace.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all lines where the two files disagree, leaving only identical text.</p>", "feedback": "<p>Incorrect. The diff view is an analytical display tool; it does not delete disputed text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It merges both files into a binary image that cannot be edited.</p>", "feedback": "<p>Incorrect. The diff editor displays live editable text files side by side.</p>"}]}}, {"step": 25, "title": "Documenting Regex Patterns in the Rule Ledger", "content": "**Documenting Regex Patterns in the Rule Ledger**\n\nIn Workshop 6, your regular expression rules must be documented with complete scholarly transparency. A rule that lives only in your personal editor history is not reproducible research.\n\nOpen your `NORMALIZATION.md` file from yesterday. You will now expand your Editorial Rule Ledger by adding two new technical columns: **Regex Search Pattern** and **Regex Replacement String**:\n\n<table style=\"width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1; text-align: left;\">\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Rule ID</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Description</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Regex Search Pattern</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Regex Replacement String</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Observed FP / Limitations</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>R-01</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Archaic terminal <em>-ck</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>\\b(publi|traffi)ck\\b</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>&lt;choice&gt;&lt;orig&gt;$1ck&lt;/orig&gt;&lt;reg resp=\"#editor\"&gt;$1c&lt;/reg&gt;&lt;/choice&gt;</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">0 FP; restricted to root whitelist to avoid <em>black</em>.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>R-02</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Thorn contraction <em>ye</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>\\bye\\b</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>&lt;choice&gt;&lt;abbr&gt;ye&lt;/abbr&gt;&lt;expan resp=\"#editor\"&gt;the&lt;/expan&gt;&lt;/choice&gt;</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">0 FP with Match Case on; capitalized <em>Ye</em> is a separate rule; each match inspected to ensure it is not the pronoun <em>ye</em>.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>R-03</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Maud Lewis <em>allways</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>\\b([Aa])llways\\b</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>&lt;choice&gt;&lt;orig&gt;$1llways&lt;/orig&gt;&lt;reg resp=\"#editor\"&gt;$1lways&lt;/reg&gt;&lt;/choice&gt;</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">0 FP; 100% precision on target personal hand.</td>\n    </tr>\n  </tbody>\n</table>\n\nDocumenting your exact search and replacement strings guarantees that any external evaluator can verify your rules, replicate your results, and test your code against new folios.\n\n**Vocabulary.** *Reproducible research* — The scientific standard requiring scholars to publish the exact data, rules, and computational parameters used to generate their findings. *Documented ledger* — A formal record pairing scholarly rationales with executable technical code.\n\n**Takeaway:** Record your exact regex search and replacement patterns in `NORMALIZATION.md`, documenting their observed precision and edge cases.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Documenting Regex Patterns in the Rule Ledger", "questiontext": "<p>What must an editor add to their Rule Ledger in NORMALIZATION.md during Step 2?</p>", "generalfeedback": "<p>Record your exact regex search and replacement patterns in NORMALIZATION.md, documenting their observed precision and edge cases.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The exact Regex Search Pattern and Replacement String for each rule, along with observed false positives and precision notes.</p>", "feedback": "<p>Correct. Documenting executable patterns and empirical performance guarantees reproducible digital scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A handwritten signature from a notary public authenticating the regular expressions.</p>", "feedback": "<p>Incorrect. Transparency is achieved through open code and documentation, not legal notarization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A copy of the complete Python source code for the Linux operating system kernel.</p>", "feedback": "<p>Incorrect. The ledger records project-specific normalization rules and patterns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The serial number of the computer processor used to execute the search.</p>", "feedback": "<p>Incorrect. Hardware serial numbers are irrelevant; the rules must be reproducible on any computer.</p>"}]}}, {"step": 26, "title": "The Scaffolded Bridge: What Is Python `re`?", "content": "**The Scaffolded Bridge: What Is Python `re`?**\n\nNow that you have mastered regular expressions inside VS Code, you possess an invaluable secret: **you already understand the core engine behind automated text processing in Python**.\n\nStudents often fear programming because they imagine that writing Python requires learning an entirely alien way of thinking. But in Python, regular expressions are handled by a standard library module named `re`. \n\nAnd here is the crucial realization: **the syntax of regular expressions in Python is identical to the syntax in VS Code**.\n\nThe character classes `[...]`, the quantifiers `+` and `*`, the word boundaries `\\b`, the capturing groups `()`, and the root alternations `(a|b)` that you tested in VS Code operate with the exact same mathematical logic in Python!\n\nThe only difference is how the engine is invoked. In VS Code, you press `Cmd+F` and click `Replace`. In Python, you write a single function call:\n\n```python\nimport re\n\nnew_text = re.sub(pattern, replacement, original_text)\n```\n\nThe function `re.sub()` stands for \"substitute\". It takes your regex pattern, takes your replacement string, scans the text, and returns the transformed document. Python is simply an automated container for the exact regular expressions you have already mastered.\n\n**Vocabulary.** *Python `re` module* — The built-in Python library providing regular expression pattern matching and string substitution functions. *`re.sub()`* — The Python function that searches a string for a regex pattern and replaces matches with a specified replacement string.\n\n**Takeaway:** Python's `re.sub()` uses the exact same regular expression syntax as VS Code; Python merely acts as an automated wrapper for your existing regex rules.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: The Scaffolded Bridge: What Is Python re?", "questiontext": "<p>Why is transitioning from VS Code regular expressions to Python's re module straightforward for students?</p>", "generalfeedback": "<p>Python's re.sub() uses the exact same regular expression syntax as VS Code; Python merely acts as an automated wrapper for your existing regex rules.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Python's re.sub() uses the exact same regular expression syntax, metacharacters, and grouping logic as VS Code.</p>", "feedback": "<p>Correct. The regex grammar (\\b, character classes, quantifiers, groups) is identical; Python simply provides an automated function wrapper.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Python automatically translates English regular expressions into Chinese characters.</p>", "feedback": "<p>Incorrect. Python executes standard regular expression syntax identically across all environments.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code was programmed in Python and requires Python scripts to open XML files.</p>", "feedback": "<p>Incorrect. VS Code is built on Electron/TypeScript; regex syntax is standardized across platforms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Python deletes all regular expressions and replaces them with neural network weights.</p>", "feedback": "<p>Incorrect. The Python re module is a deterministic regular expression engine.</p>"}]}}, {"step": 27, "title": "A 10-Line Python Script Recipe (`normalize.py`)", "content": "**A 10-Line Python Script Recipe (`normalize.py`)**\n\nFor students who want to take their digital skills to the next level, you can translate your VS Code rules into an executable Python script (`normalize.py`) in less than ten lines of code.\n\nHere is the complete, canonical Python script recipe:\n\n```python\nimport re\nfrom pathlib import Path\n\n# 1. Read the input XML file\ntext = Path(\"transcription_reconciled.xml\").read_text(encoding=\"utf-8\")\n\n# 2. Apply your regex rules sequentially\ntext = re.sub(r\"\\b(publi|traffi)ck\\b\", r'<choice><orig>\\1ck</orig><reg resp=\"#editor\">\\1c</reg></choice>', text)\ntext = re.sub(r\"\\bye\\b\", r'<choice><abbr>ye</abbr><expan resp=\"#editor\">the</expan></choice>', text)\ntext = re.sub(r\"\\b([Aa])llways\\b\", r'<choice><orig>\\1llways</orig><reg resp=\"#editor\">\\1lways</reg></choice>', text)\n\n# 3. Write the transformed output file\nPath(\"transcription_reconciled_regex.xml\").write_text(text, encoding=\"utf-8\")\nprint(\"Normalization complete! Saved to transcription_reconciled_regex.xml\")\n```\n\nNotice two critical details:\n<ol>\n  <li><strong>Raw Strings (<code>r\"...\"</code>):</strong> Always prefix your regex patterns and replacement strings in Python with the letter <code>r</code> (e.g., <code>r\"\\b...\\b\"</code>). The <code>r</code> stands for \"raw string\", which prevents Python from misinterpreting backslashes like <code>\\b</code> as special escape characters.</li>\n  <li><strong>Backreference Syntax:</strong> In Python replacement strings, backreferences are written with backslashes (<code>\\1</code>, <code>\\2</code>) rather than dollar signs (<code>$1</code>, <code>$2</code>).</li>\n</ol>\n\nRunning this script (`python3 normalize.py`) executes all your rules simultaneously in a fraction of a second.\n\n**Vocabulary.** *Raw string (`r\"...\"`)* — A Python string literal that treats backslashes as literal characters, essential for writing regular expression patterns. *Sequential pipeline* — Applying multiple transformation rules one after another, passing the output of each rule as the input to the next.\n\n**Takeaway:** A 10-line Python script using `re.sub()` chains your tested regular expressions into an automated, one-click normalization pipeline.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: A 10-Line Python Script Recipe (normalize.py)", "questiontext": "<p>In a Python regular expression script, why are regex patterns written as raw strings prefixed with r (e.g., r'\\bpattern\\b')?</p>", "generalfeedback": "<p>A 10-line Python script using re.sub() chains your tested regular expressions into an automated, one-click normalization pipeline.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The raw string prefix prevents Python from misinterpreting backslashes as special escape sequences like newlines or tabs.</p>", "feedback": "<p>Correct. Raw strings pass backslashes directly to the regex engine intact, preventing syntax errors in patterns like \\b.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The letter r stands for 'RESTRICTED', preventing unauthorized users from copying the code.</p>", "feedback": "<p>Incorrect. The r indicates a raw string literal in Python syntax.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Prefixing strings with r tells Python to execute the code in reverse order.</p>", "feedback": "<p>Incorrect. Raw strings preserve backslashes; they do not alter execution direction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The r prefix is required by the TEI Consortium for all XML-processing scripts.</p>", "feedback": "<p>Incorrect. Raw strings are a standard feature of the Python programming language.</p>"}]}}, {"step": 28, "title": "Batching Rules: The Sequential Execution Pipeline", "content": "**Batching Rules: The Sequential Execution Pipeline**\n\nWhen you run multiple regular expressions—whether sequentially in VS Code or in a Python script—you are executing a **sequential transformation pipeline**.\n\nIn a pipeline, the order in which rules execute is load-bearing. Rule 1 runs on the original text and produces an intermediate text. Rule 2 runs on that intermediate text and produces a second intermediate text. If your rules interact with the same words, the order of execution can produce unexpected side effects.\n\nConsider this rule-ordering dilemma:\n\n```text\nRule A (Capitalization): Regularize common-noun capitals: Treaty -> treaty\nRule B (Thorn Expansion): Expand Ye -> The\n```\n\nIf Rule A runs first with an unconstrained casing pattern, it might turn *Ye* into *ye*. When Rule B runs second, its capitalized pattern `\\bYe\\b` will fail to find anything, because Rule A already lowercased it!\n\nTo prevent pipeline collisions:\n<ol>\n  <li><strong>Run specific rules before general rules:</strong> Always execute narrow, exact rules (like expanding unique abbreviations) before applying broad spelling or casing regularizations.</li>\n  <li><strong>Never run a rule on already-tagged markup:</strong> Ensure that your patterns do not match text that is already inside a <code>&lt;choice&gt;</code> block. For example, if you replace <em>publick</em> with <code>&lt;choice&gt;...&lt;/choice&gt;</code>, make sure a subsequent rule does not match the word <em>publick</em> inside your newly generated <code>&lt;orig&gt;</code> tag!</li>\n</ol>\n\nTesting your pipeline sequentially in VS Code reveals these ordering traps before they cause damage.\n\n**Vocabulary.** *Rule ordering* — The deliberate sequence in which automated transformations are applied to prevent adverse interactions between rules. *Pipeline collision* — An error where an earlier rule alters text in a way that breaks a subsequent rule or re-matches already-tagged markup.\n\n**Takeaway:** Order your rules carefully—executing narrow specific abbreviations before general casing rules—to prevent pipeline collisions.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Batching Rules: The Sequential Execution Pipeline", "questiontext": "<p>Why does rule ordering matter when executing multiple regular expressions in a pipeline?</p>", "generalfeedback": "<p>Order your rules carefully—executing narrow specific abbreviations before general casing rules—to prevent pipeline collisions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Earlier rules transform the text, and if ordered improperly, they can alter target words or re-match already-tagged markup.</p>", "feedback": "<p>Correct. Rules execute sequentially; applying broad rules first can destroy patterns needed by subsequent specific rules.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer processor refuses to execute more than one regular expression per calendar day.</p>", "feedback": "<p>Incorrect. Pipelines execute dozens of rules in milliseconds; ordering governs linguistic interactions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Running rules in sequence causes the file encoding to change from UTF-8 to ASCII.</p>", "feedback": "<p>Incorrect. File encoding remains UTF-8; ordering affects textual and markup state.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema scrambles all XML tags if rules are run in alphabetical order.</p>", "feedback": "<p>Incorrect. The hazard is linguistic and markup collisions between successive transformations.</p>"}]}}, {"step": 29, "title": "When Deterministic Regex Fails: Context-Dependency", "content": "**When Deterministic Regex Fails: Context-Dependency**\n\nAs powerful as regular expressions are, every digital editor must recognize their absolute theoretical and practical limits: **regular expressions have no access to semantic context**.\n\nA regular expression matches formal character strings. It does not know who wrote the document, what century it was composed in, what the grammatical syntax of the sentence is, or what the author intended.\n\nRegex fails whenever normalization is **context-dependent**:\n\n<ul>\n  <li><strong>Syntactic Ambiguity:</strong> In 18th-century French, deciding whether a word ending in <em>-oit</em> is an imperfect verb (needing regularization to <em>-ait</em>) or an invariant noun (like <em>droit</em>) requires understanding grammatical parts of speech. Regex cannot parse parts of speech.</li>\n  <li><strong>Semantic Homographs:</strong> In English, deciding whether <em>wont</em> means <em>won't</em> (will not) or <em>wont</em> (custom) requires understanding the sentence's meaning.</li>\n  <li><strong>Poetic Restraint:</strong> In Emily Dickinson's poetry, deciding whether a capitalized word like <em>Door</em> is an accidental 18th-century habit or a deliberate metaphysical personification requires literary sensitivity that no mathematical regex can ever possess.</li>\n</ul>\n\nThis boundary marks the transition to Friday's session. Where deterministic regex stops, artificial intelligence models and large language models step in with the ability to perform contextual semantic disambiguation.\n\n**Vocabulary.** *Context-dependency* — A linguistic situation where the correct interpretation or normalization of a word depends on surrounding sentence semantics rather than raw spelling. *Semantic blindness* — The inability of regular expressions to comprehend meaning, syntax, or authorial intent.\n\n**Takeaway:** Regular expressions excel at mechanical, unambiguous pattern matching, but fail on context-dependent words, syntactic homographs, and poetic nuance.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: When Deterministic Regex Fails: Context-Dependency", "questiontext": "<p>Under what linguistic conditions do deterministic regular expressions fail, requiring contextual human or AI judgment?</p>", "generalfeedback": "<p>Regular expressions excel at mechanical, unambiguous pattern matching, but fail on context-dependent words, syntactic homographs, and poetic nuance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When words are syntactic or semantic homographs whose correct normalization depends on surrounding sentence meaning rather than raw spelling.</p>", "feedback": "<p>Correct. Regex is blind to sentence semantics; words like French 'droit' or English 'wont' require contextual disambiguation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whenever a document is longer than twenty-five physical printed pages.</p>", "feedback": "<p>Incorrect. Regex processes texts of any length; the limitation is semantic blindness, not document length.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whenever a historical manuscript was written on calfskin parchment rather than paper.</p>", "feedback": "<p>Incorrect. Physical writing surfaces do not affect computational string processing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whenever an XML file contains more than five paragraph elements.</p>", "feedback": "<p>Incorrect. Regex matches across XML hierarchies normally; it fails on semantic ambiguity.</p>"}]}}, {"step": 30, "title": "Review and Workshop 6 Step 2 Deliverables", "content": "**Review and Workshop 6 Step 2 Deliverables**\n\nToday you bridged the gap between human editorial policy and automated computational execution. You mastered regular expressions directly inside the VS Code editor, demonstrated the power of word boundaries and capturing groups, generated TEI `<choice>` markup dynamically, and audited your rules against your manual ground truth.\n\nBefore concluding today's session, review the **Workshop 6 Step 2 Checklist**:\n\n<ol>\n  <li><strong>Regex Rules Formulated:</strong> Have you created at least 3 to 5 distinct regular expressions corresponding to the active rules in your Rule Ledger?</li>\n  <li><strong>Word Boundaries Enforced:</strong> Are all your word search patterns strictly anchored with <code>\\b</code> to prevent accidental substring corruption?</li>\n  <li><strong>XML-Safe Patterns Used:</strong> Have you ensured that no unconstrained wildcards (<code>.*</code>) match across XML tags or milestone markers?</li>\n  <li><strong>Dynamic `<choice>` Generated:</strong> Did your replacement patterns successfully construct complete, valid TEI <code>&lt;choice&gt;</code> blocks with <code>&lt;orig&gt;</code>/<code>&lt;reg&gt;</code> or <code>&lt;abbr&gt;</code>/<code>&lt;expan&gt;</code>?</li>\n  <li><strong>Audited via Side-by-Side Diff:</strong> Have you compared your regex-transformed file against yesterday's manual ground truth in VS Code, calculating your True Positives and eliminating False Positives?</li>\n  <li><strong>Rule Ledger Updated in `NORMALIZATION.md`:</strong> Have you recorded your exact regex patterns, replacement strings, and observed precision metrics in your project ledger?</li>\n  <li><strong>Schema Validated:</strong> Does your transformed XML document validate with <strong>0 errors</strong> in VS Code?</li>\n</ol>\n\nWith Step 2 complete, you have an audited deterministic baseline ready for Friday, where we will unleash generative AI models on the same text and test whether they enhance or over-normalize our historical documents.\n\n**Vocabulary.** *Step 2 milestone* — The completion of the deterministic regular expression pass, documented in the Rule Ledger and verified against the manual ground truth baseline.\n\n**Takeaway:** Step 2 automates your normalization policy using validated, XML-safe regular expressions, establishing an audited baseline for Friday's AI comparison.\n\n---\n\n## References\n\nBollmann, M. (2019). A large-scale comparison of historical text normalization systems. In *Proceedings of the 2019 conference of the North American chapter of the Association for Computational Linguistics: Human language technologies* (Vol. 1, pp. 3887–3898). Association for Computational Linguistics. https://doi.org/10.18653/v1/N19-1389\n\nBurnard, L. (2014). *What is the Text Encoding Initiative? How to add intelligent markup to digital resources*. OpenEdition Press. https://doi.org/10.4000/books.oep.426\n\nFriedl, J. E. (2006). *Mastering regular expressions* (3rd ed.). O'Reilly Media.\n\nJurafsky, D., & Martin, J. H. (2024). *Speech and language processing: An introduction to natural language processing, computational linguistics, and speech recognition* (3rd ed. draft). Stanford University. https://web.stanford.edu/~jurafsky/slp3/\n\nTEI Consortium. (2024). *TEI P5: Guidelines for electronic text encoding and interchange* (version 4.8.0). TEI Consortium. https://tei-c.org/guidelines/p5/", "html": null, "image_b64": null, "question": {"name": "30 Question: Review and Workshop 6 Step 2 Deliverables", "questiontext": "<p>Which of the following is a core deliverable for Step 2 of Workshop 6?</p>", "generalfeedback": "<p>Step 2 automates your normalization policy using validated, XML-safe regular expressions, establishing an audited baseline for Friday's AI comparison.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Documented regex search and replacement patterns in NORMALIZATION.md and a validated XML file resulting from audited deterministic execution.</p>", "feedback": "<p>Correct. Step 2 requires the documented regex rules, precision audit notes, and a validated TEI XML file with 0 schema errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A commercial software license purchased from Microsoft for automated word processing.</p>", "feedback": "<p>Incorrect. All tools used in the course are open-source or built into VS Code.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A printed facsimile of the manuscript framed in glass for physical display.</p>", "feedback": "<p>Incorrect. Workshop deliverables are digital XML and Markdown files committed to Git.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A signed statement confirming that no computers were used during the week.</p>", "feedback": "<p>Incorrect. Step 2 specifically evaluates deterministic computational automation.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
