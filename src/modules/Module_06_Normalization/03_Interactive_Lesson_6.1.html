tive (normalizing very little) or liberal (modernizing thoroughly) is a defensible scholarly choice. What is completely indefensible is being inconsistent.\n\nConsider the consequences of inconsistency in a digital corpus. If a corpus linguist runs a script across your edition to count occurrences of the lemma *treaty*, and half of your instances are tagged `<reg>treaty</reg>` while the other half are left untagged as diplomatic *Treaty*, the resulting statistical frequency will be wrong by 50%. Your inconsistency directly corrupts downstream quantitative research.\n\nTo maintain consistency:\n\n<ul>\n  <li><strong>Apply rules globally:</strong> If your policy dictates that 18th-century terminal *k* on adjectives is regularized, every single instance must receive the identical `<choice>` markup.</li>\n  <li><strong>Treat identical abbreviations identically:</strong> If *y<hi rend=\"superscript\">e</hi>* is expanded to *the* on line 2, it must be expanded to *the* on line 20, unless clear contextual evidence indicates a different meaning.</li>\n  <li><strong>Log every exception:</strong> If you intentionally deviate from your standard rule in a specific line—for example, preserving a variant because it forms a poetic rhyme—you must document that specific exception in your project notes.</li>\n</ul>\n\n**Vocabulary.** *Internal consistency* — The rigorous application of the same editorial rules across every line and folio of an edition. *Corpus corruption* — The skewing of downstream statistical or lexical analyses caused by erratic or unstated editorial practices.\n\n**Takeaway:** Consistency is the cardinal rule of digital editing: an editor must apply their stated regularization policy systematically to every occurrence in the text.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: The Principle of Consistency", "questiontext": "<p>What is the primary risk of inconsistent normalization across a digital text corpus?</p>", "generalfeedback": "<p>Consistency is the cardinal rule of digital editing: an editor must apply their stated regularization policy systematically to every occurrence in the text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It skews quantitative lexical and concordance searches, producing inaccurate statistical frequencies for downstream researchers.</p>", "feedback": "<p>Correct. If half the instances of an archaic word are normalized and half are missed, quantitative corpus research becomes unreliable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It causes the computer operating system to corrupt the hard drive sectors storing the XML file.</p>", "feedback": "<p>Incorrect. Inconsistent editorial markup affects textual scholarship, not computer hardware.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It permanently prevents the TEI Header from recording the author's name.</p>", "feedback": "<p>Incorrect. The TEI header records metadata independently of body text consistency.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the validator to reject all subsequent image files uploaded to the repository.</p>", "feedback": "<p>Incorrect. Image files and XML text validation are separate pipeline stages.</p>"}]}}, {"step": 23, "title": "Building the Editorial Rule Ledger", "content": "**Building the Editorial Rule Ledger**\n\nTo ensure absolute consistency, professional digital editors do not normalize text on the fly. Instead, they construct an **Editorial Rule Ledger**.\n\nA Rule Ledger is a structured table that catalogues every rule in your policy before you begin encoding. It serves as your working blueprint during manual editing, your specifications sheet when writing regular expressions on Wednesday, and your grading rubric when auditing AI outputs on Friday.\n\nFor Workshop 6, your Rule Ledger will be recorded in a markdown file named `NORMALIZATION.md` in your repository. It contains five core columns:\n\n<table style=\"width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1; text-align: left;\">\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Rule ID</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Pattern / Category</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Diplomatic Example</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Regularized Form</th>\n      <th style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Scholarly Rationale</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>R-01</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Terminal <em>-ck</em> in adjectives</td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><em>publick</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><em>public</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Standard modern English lexicography; aligns with OED.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>R-02</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Thorn contraction</td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><em>y<sup>e</sup></em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><em>the</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Expand historical thorn substitution to modern definite article.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><code>R-03</code></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Substantive noun capital</td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><em>Treaty</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\"><em>treaty</em></td>\n      <td style=\"padding: 0.5rem; border: 1px solid #cbd5e1;\">Standardize 18th-century capital to lowercase for sentence parsing.</td>\n    </tr>\n  </tbody>\n</table>\n\nBy maintaining this ledger, you transform subjective feelings into an auditable scientific protocol.\n\n**Vocabulary.** *Rule Ledger* — A structured catalogue defining every active regularization rule, its input pattern, target replacement, and scholarly rationale. *Rule ID* — A unique alphanumeric identifier (e.g., `R-01`) assigned to an editorial rule for tracking and auditing.\n\n**Takeaway:** Maintain an explicit Editorial Rule Ledger with unique rule IDs and clear rationales to track every transformation applied to your text.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Building the Editorial Rule Ledger", "questiontext": "<p>What is an Editorial Rule Ledger in digital textual scholarship?</p>", "generalfeedback": "<p>Maintain an explicit Editorial Rule Ledger with unique rule IDs and clear rationales to track every transformation applied to your text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A structured table cataloguing every active regularization rule, its input pattern, regularized replacement, and scholarly rationale.</p>", "feedback": "<p>Correct. The Rule Ledger acts as the master blueprint for manual encoding, regular expressions, and AI auditing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A financial accounting spreadsheet used to track the cost of server hosting.</p>", "feedback": "<p>Incorrect. An Editorial Rule Ledger tracks textual transformations, not financial accounts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A private cryptographic key used to encrypt student grades in Moodle.</p>", "feedback": "<p>Incorrect. It is an open, auditable record of editorial standardization rules.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A legal contract signed between the archival library and the software developer.</p>", "feedback": "<p>Incorrect. The ledger documents scholarly regularization decisions within the project repository.</p>"}]}}, {"step": 24, "title": "Categorizing Regularization Rules", "content": "**Categorizing Regularization Rules**\n\nTo keep your Rule Ledger organized and effective, divide your rules into four distinct **linguistic and typographical categories**:\n\n<ol>\n  <li><strong>Orthographic / Phonological Rules:</strong> Variations in spelling reflecting historical sound changes, dialect, or pre-reform orthography (e.g., <em>publick</em> &rarr; <em>public</em>, French <em>étoit</em> &rarr; <em>était</em>, Lewis's <em>allways</em> &rarr; <em>always</em>). These are encoded with `<orig>` and `<reg>`.</li>\n  <li><strong>Abbreviation / Expansion Rules:</strong> Graphic compressions, suspensions, contractions, and brevigraphs (e.g., <em>y<sup>e</sup></em> &rarr; <em>the</em>, <em>Gov<sup>r</sup></em> &rarr; <em>Governor</em>, <em>&amp;</em> &rarr; <em>and</em>). These are encoded with `<abbr>` and `<expan>`.</li>\n  <li><strong>Typographical / Graphemic Rules:</strong> Letterform substitutions that do not change spelling or meaning, such as replacing the long <em>s</em> (<em>ſ</em>) with short <em>s</em>. Many editors handle this as a global display transformation, or encode it as `<orig>ſ</orig><reg>s</reg>`.</li>\n  <li><strong>Syntactic / Casing Rules:</strong> Regularizing substantive common-noun capitalization or joining split compound words (e.g., <em>to morrow</em> &rarr; <em>tomorrow</em>).</li>\n</ol>\n\nCategorizing your rules prevents category confusion. It ensures that when you write regular expressions on Wednesday, you know exactly which XML tags (`<reg>` vs. `<expan>`) your replacement patterns should generate.\n\n**Vocabulary.** *Rule categorization* — Grouping editorial transformations by their linguistic mechanism (spelling, abbreviation, typography, or casing). *Graphemic variation* — Different physical shapes representing the same underlying letter (such as long *s* versus round *s*).\n\n**Takeaway:** Categorize your rules into orthographic, abbreviation, typographical, and casing groups to ensure appropriate TEI tagging.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Categorizing Regularization Rules", "questiontext": "<p>Why is it beneficial to categorize rules into orthographic, abbreviation, typographical, and casing groups?</p>", "generalfeedback": "<p>Categorize your rules into orthographic, abbreviation, typographical, and casing groups to ensure appropriate TEI tagging.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It prevents category confusion and ensures that replacement patterns generate the correct TEI elements (<reg> vs. <expan>).</p>", "feedback": "<p>Correct. Categorization maps each linguistic phenomenon to its proper TEI tag pair (<orig>/<reg> versus <abbr>/<expan>).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema requires all XML files to contain exactly four separate <text> elements.</p>", "feedback": "<p>Incorrect. A TEI document typically contains one <body>; categorization organizes editorial rules.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Uncategorized rules cause VS Code to crash whenever a search is conducted.</p>", "feedback": "<p>Incorrect. VS Code searches uncategorized text normally, but structured rules prevent human error.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Categorizing rules allows editors to skip validation checks during Moodle export.</p>", "feedback": "<p>Incorrect. Schema validation is always required regardless of rule categorization.</p>"}]}}, {"step": 25, "title": "Documenting the Policy in the TEI Header", "content": "**Documenting the Policy in the TEI Header**\n\nIn a professional digital scholarly edition, your editorial policy is not just kept in an informal notebook; it is permanently encoded directly inside the document's **TEI Header** (TEI Consortium, 2024).\n\nThe TEI Header provides a dedicated structural element inside `<encodingDesc>` called `<editorialDecl>` (editorial declaration). Within `<editorialDecl>`, you place the `<normalization>` element to explain your policy in formal prose:\n\n```xml\n<teiHeader>\n  <!-- ... fileDesc ... -->\n  <encodingDesc>\n    <editorialDecl>\n      <normalization method=\"markup\">\n        <p>This edition regularizes historical 18th-century orthography and expands \n           abbreviations using parallel <gi>choice</gi> markup. Original spellings are \n           preserved in <gi>orig</gi> and regularized modern American English forms are \n           supplied in <gi>reg</gi> following Merriam-Webster's Collegiate Dictionary \n           (11th ed.). Abbreviations are expanded in <gi>expan</gi>. Common-noun \n           capitalization has been regularized to lowercase.</p>\n      </normalization>\n    </editorialDecl>\n  </encodingDesc>\n</teiHeader>\n```\n\nNotice the attribute `method=\"markup\"`. This attribute explicitly informs any digital repository or harvesting bot that the normalization has been accomplished using parallel TEI tags (`<choice>`), rather than by silently overwriting the text (`method=\"silent\"`). \n\nDocumenting your policy in the header guarantees that your edition remains self-describing, transparent, and compliant with FAIR data principles decades after publication.\n\n**Vocabulary.** *`<editorialDecl>`* — TEI Header element detailing the editorial practices, declarations, and policies applied to the text. *`<normalization>`* — TEI Header element specifying the degree and method of orthographic normalization applied. *`method=\"markup\"`* — An attribute declaring that normalization is encoded non-destructively using TEI tags.\n\n**Takeaway:** Record your editorial policy inside the `<editorialDecl>` and `<normalization>` elements of your TEI Header, declaring `method=\"markup\"` for non-destructive transparency.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Documenting the Policy in the TEI Header", "questiontext": "<p>Where in the TEI Header should an editor formally declare their normalization policy?</p>", "generalfeedback": "<p>Record your editorial policy inside the <editorialDecl> and <normalization> elements of your TEI Header, declaring method='markup' for non-destructive transparency.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Inside <encodingDesc> within the <editorialDecl> and <normalization> elements, declaring method='markup'.</p>", "feedback": "<p>Correct. The <editorialDecl> element formally records editorial practices, and method='markup' declares non-destructive tagging.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside <fileDesc> within the <publicationStmt> element, declaring status='secret'.</p>", "feedback": "<p>Incorrect. <publicationStmt> records publisher and licensing information, not editorial normalization methods.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside <profileDesc> within the <creation> element, declaring language='python'.</p>", "feedback": "<p>Incorrect. <creation> documents the historical date and place of original composition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>At the very end of <body> inside a hidden HTML comment block.</p>", "feedback": "<p>Incorrect. Formal TEI metadata belongs in dedicated header elements, not trailing comments.</p>"}]}}, {"step": 26, "title": "Manual Normalization in VS Code", "content": "**Manual Normalization in VS Code**\n\nNow that your policy is established and your Rule Ledger is built, you are ready to begin the manual work in Visual Studio Code.\n\nToday's exercise focuses on a **20-line excerpt** selected from your consensus reconciled text in `transcription_reconciled.xml`. Working by hand is slow and deliberate, and that friction is precisely where learning happens. Hand-encoding forces you to examine every word with an editor's eye, noticing ambiguities that automated tools gloss over.\n\nFollow this systematic manual workflow:\n\n<ol>\n  <li><strong>Open your reconciled transcription:</strong> In VS Code, open your `transcription_reconciled.xml` file. Ensure that the Red Hat XML and Scholarly XML extensions are active, displaying valid green checkmarks in the status bar.</li>\n  <li><strong>Identify candidate words:</strong> Read your 20-line passage word by word against your Editorial Rule Ledger. When you encounter a candidate word—such as an archaic spelling like <em>publick</em> or an abbreviation like <em>w<sup>ch</sup></em>—confirm which rule ID applies.</li>\n  <li><strong>Insert the `<choice>` block:</strong> Wrap the target word carefully. Cut the original word into `<orig>` or `<abbr>`, and type your regularized or expanded word into `<reg resp=\"#editor\">` or `<expan resp=\"#editor\">`.</li>\n  <li><strong>Verify tag placement:</strong> Ensure that surrounding whitespace is outside the `<choice>` tags, and confirm that any existing milestone tags like `<lb/>` are not accidentally deleted or misplaced.</li>\n</ol>\n\n**Vocabulary.** *Hand-encoding* — The deliberate, manual insertion of XML tags around text, developing close-reading paleographical discipline. *Whitespace discipline* — Ensuring that spaces between words remain outside tagging structures to prevent collapsed words in downstream rendering.\n\n**Takeaway:** Manual normalization in VS Code builds editorial discipline by requiring you to evaluate every word against your explicit policy ledger.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Manual Normalization in VS Code", "questiontext": "<p>Why does Step 1 of the normalization module require hand-encoding in VS Code before using automated tools?</p>", "generalfeedback": "<p>Manual normalization in VS Code builds editorial discipline by requiring you to evaluate every word against your explicit policy ledger.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Hand-encoding builds editorial discipline, forcing the editor to closely evaluate every word against the policy and discover unstated edge cases.</p>", "feedback": "<p>Correct. Manual work establishes the essential human baseline and reveals ambiguities that automated scripts overlook.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modern computers lack the processing power to run automated regular expressions without human pre-typing.</p>", "feedback": "<p>Incorrect. Computers execute regex in milliseconds; manual encoding is a deliberate pedagogical and methodological step.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI Consortium fines academic institutions that use automated tools without manual pre-approval.</p>", "feedback": "<p>Incorrect. There are no fines or bureaucratic bans; manual ground truth is a scientific best practice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Hand-encoding is required because VS Code does not support regular expression search.</p>", "feedback": "<p>Incorrect. VS Code has a powerful built-in regex engine, which will be introduced on Wednesday.</p>"}]}}, {"step": 27, "title": "Keyboard Shortcuts and Snippets for `<choice>`", "content": "**Keyboard Shortcuts and Snippets for `<choice>`**\n\nTyping `<choice><orig></orig><reg resp=\"#editor\"></reg></choice>` by hand twenty times is tedious and prone to typing errors. Fortunately, VS Code provides powerful editing features that accelerate manual encoding without sacrificing human judgment.\n\nYou can dramatically speed up manual normalization using two techniques:\n\n<ol>\n  <li><strong>Wrap with Abbreviation / Emmet:</strong> Highlight the target word in your editor, open the Command Palette (<code>Cmd+Shift+P</code> on macOS or <code>Ctrl+Shift+P</code> on Windows), type <em>Emmet: Wrap with Abbreviation</em>, and type <code>choice>orig</code>. This instantly wraps your highlighted word inside <code>&lt;choice&gt;&lt;orig&gt;target&lt;/orig&gt;&lt;/choice&gt;</code>. Then simply place your cursor after <code>&lt;/orig&gt;</code> and type your <code>&lt;reg&gt;</code> tag.</li>\n  <li><strong>Custom User Snippets:</strong> You can create a custom XML snippet in VS Code. Go to <em>Code &rarr; Settings &rarr; User Snippets</em>, select <code>xml.json</code>, and add a snippet named \"TEI Choice Regularization\":\n  <pre><code>\"TEI Choice Regularization\": {\n  \"prefix\": \"treg\",\n  \"body\": [\n    \"&lt;choice&gt;\",\n    \"  &lt;orig&gt;$TM_SELECTED_TEXT$1&lt;/orig&gt;\",\n    \"  &lt;reg resp=\\\"#editor\\\"&gt;$2&lt;/reg&gt;\",\n    \"&lt;/choice&gt;\"\n  ],\n  \"description\": \"Wrap selected text in TEI choice with orig and reg\"\n}</code></pre>\n  With this snippet saved, you simply highlight any word, type your snippet prefix, and press <code>Tab</code>: the editor wraps your word in `<orig>` and jumps your cursor directly into `<reg>` ready to type the modern spelling!</li>\n</ol>\n\n**Vocabulary.** *User snippet* — A custom keyboard shortcut in an editor that expands a short prefix into a pre-formatted template of code or markup. *`$TM_SELECTED_TEXT`* — A snippet variable that captures whichever characters were highlighted in the editor when the shortcut was triggered.\n\n**Takeaway:** Configure custom VS Code XML snippets to automate the repetitive typing of `<choice>` structures while keeping every editorial decision under manual human control.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Keyboard Shortcuts and Snippets for <choice>", "questiontext": "<p>How can an editor streamline manual XML encoding in VS Code without sacrificing human judgment?</p>", "generalfeedback": "<p>Configure custom VS Code XML snippets to automate the repetitive typing of <choice> structures while keeping every editorial decision under manual human control.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By creating custom user snippets in VS Code that expand short prefixes into pre-formatted <choice> templates around selected text.</p>", "feedback": "<p>Correct. Custom snippets eliminate repetitive tag typing while keeping every editorial decision under manual human control.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By permanently turning off XML schema validation in the VS Code settings.</p>", "feedback": "<p>Incorrect. Disabling validation hides syntax errors and produces broken XML files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By writing the entire transcription in Microsoft Word and pasting it into VS Code.</p>", "feedback": "<p>Incorrect. Microsoft Word introduces smart quotes and non-standard formatting that corrupt XML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By delegating the transcription to an unmonitored background bot without reviewing the text.</p>", "feedback": "<p>Incorrect. Unmonitored automation defeats the purpose of human baseline creation.</p>"}]}}, {"step": 28, "title": "Validating Normalized TEI against the Schema", "content": "**Validating Normalized TEI against the Schema**\n\nEvery time you edit XML, you must validate your file against the schema before moving forward. A single unclosed tag or mismatched element name breaks the entire document hierarchy.\n\nIn VS Code, the Scholarly XML and Red Hat XML extensions continuously validate your document against your project's RELAX NG schema (`msdesc.rng` or `tei_all.rng`). As you insert `<choice>` blocks, watch for real-time validation feedback:\n\n<ul>\n  <li><strong>Valid Child Combinations:</strong> The TEI schema strictly governs what elements may appear inside `<choice>`. Valid pairings include:\n    <ul>\n      <li>`<orig>` and `<reg>` (orthographic variation)</li>\n      <li>`<abbr>` and `<expan>` (abbreviations)</li>\n      <li>`<sic>` and `<corr>` (corrections)</li>\n      <li>`<unclear>` paired with supplied readings</li>\n    </ul>\n    You cannot arbitrarily invent child elements or leave `<choice>` empty.</li>\n  <li><strong>Red Squiggly Underlines:</strong> If you see a red squiggly line under `<choice>`, hover your cursor over it. The schema validator will tell you if you forgot a closing tag, misnamed an element (such as typing `<regular>` instead of `<reg>`), or placed elements in an invalid order.</li>\n  <li><strong>Zero Errors in the Problems Panel:</strong> Open the Problems panel (<code>Cmd+Shift+M</code> or <code>Ctrl+Shift+M</code>). Before saving your work, verify that your document reports exactly <strong>0 errors</strong>.</li>\n</ul>\n\n**Vocabulary.** *Schema validation* — The automated process of verifying that an XML document conforms strictly to the structural and content rules of a formal schema. *Problems panel* — The VS Code interface listing all active syntax and validation errors across your open workspace.\n\n**Takeaway:** Constantly monitor the VS Code Problems panel to ensure that every newly inserted `<choice>` block validates with zero schema errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Validating Normalized TEI against the Schema", "questiontext": "<p>What should an editor do if a newly inserted <choice> block displays a red squiggly underline in VS Code?</p>", "generalfeedback": "<p>Constantly monitor the VS Code Problems panel to ensure that every newly inserted <choice> block validates with zero schema errors.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Hover over the tag to read the schema validation error, check for unclosed tags or invalid child elements, and consult the Problems panel.</p>", "feedback": "<p>Correct. The Problems panel and hover tooltips identify the exact syntax or structural violation according to the active RELAX NG schema.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Immediately delete the entire paragraph to make the red underline disappear.</p>", "feedback": "<p>Incorrect. The error should be diagnosed and corrected, not solved by destroying text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ignore the underline because TEI schemas do not recognize the <choice> element.</p>", "feedback": "<p>Incorrect. <choice> is a core TEI element; an error indicates invalid children, attributes, or unclosed tags.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Restart the computer operating system to clear the editor's visual cache.</p>", "feedback": "<p>Incorrect. Schema validation errors reflect real syntax problems in the document markup.</p>"}]}}, {"step": 29, "title": "Preparing Your Manual Ground Truth for Wednesday", "content": "**Preparing Your Manual Ground Truth for Wednesday**\n\nToday's manual work is not just an isolated classroom exercise. The 20-line passage you hand-encode today serves a crucial methodological purpose: **it is your Ground Truth reference baseline for the rest of Week 6**.\n\nTomorrow, you will not be editing text by hand. Instead, you will build deterministic regular expression rules in VS Code to automate these same normalizations. On Friday, you will instruct an AI model to normalize the text using natural language prompts.\n\nHow will you know whether your regular expressions worked correctly? How will you know whether the AI hallucinated an expansion or over-normalized an archaic word?\n\nYou will know by **diffing** their outputs against today's manual ground truth. Because you spent today examining each word, consulting your policy ledger, and hand-encoding each `<choice>` block with verified scholarly judgment, today's file (`transcription_reconciled_manual.xml`) represents the gold standard of accuracy.\n\nWhen you measure Wednesday's and Friday's automated passes, every point where they match your manual file will count as a confirmed true positive. Every point where an automated tool changes a word that your manual ground truth left alone will expose a potential false positive or hypercorrection.\n\n**Vocabulary.** *Ground truth baseline* — An independently verified, hand-curated dataset used as the objective standard for testing and measuring the accuracy of automated models. *Gold standard* — The authoritative benchmark in a comparative experiment against which all other results are evaluated.\n\n**Takeaway:** Your hand-encoded manual passage serves as the indispensable ground truth baseline against which Wednesday's regular expressions and Friday's AI outputs will be rigorously evaluated.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Preparing Your Manual Ground Truth for Wednesday", "questiontext": "<p>Why is today's hand-encoded 20-line passage described as a 'Ground Truth' baseline?</p>", "generalfeedback": "<p>Your hand-encoded manual passage serves as the indispensable ground truth baseline against which Wednesday's regular expressions and Friday's AI outputs will be rigorously evaluated.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It represents the verified gold standard of scholarly judgment against which Wednesday's regular expressions and Friday's AI passes will be measured.</p>", "feedback": "<p>Correct. Without an independently verified manual baseline, an editor cannot calculate true positives, false positives, or hypercorrections.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is called ground truth because it must be carved into a physical stone tablet before submission.</p>", "feedback": "<p>Incorrect. Ground truth is a scientific term for an independently verified reference dataset.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is a legal term indicating that the document has been approved by the Supreme Court.</p>", "feedback": "<p>Incorrect. In data science and digital humanities, ground truth denotes the benchmark reference data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It means that no other person is ever allowed to read or criticize the transcription.</p>", "feedback": "<p>Incorrect. Ground truth datasets are shared and audited openly in peer review.</p>"}]}}, {"step": 30, "title": "Review and Workshop 6 Step 1 Checklist", "content": "**Review and Workshop 6 Step 1 Checklist**\n\nToday you laid the intellectual and structural foundations for the entire normalization module. You moved from the raw physical witness to a dual-layered digital edition that reconciles historical preservation with modern digital accessibility.\n\nBefore concluding today's work, review the **Workshop 6 Step 1 Checklist** to confirm that your repository is fully prepared:\n\n<ol>\n  <li><strong>20-Line Consensus Excerpt:</strong> Have you selected a clear 20-line passage from your consensus text in `transcription_reconciled.xml` and saved it as the foundation for your normalization workshop?</li>\n  <li><strong>Editorial Policy Formulated:</strong> Have you written a clear paragraph defining your normalization scope, exclusions, and target authority dictionary?</li>\n  <li><strong>Rule Ledger Catalogued:</strong> Have you created `NORMALIZATION.md` with an Editorial Rule Ledger containing at least 3 to 5 distinct rules with unique Rule IDs (`R-01`, `R-02`, etc.)?</li>\n  <li><strong>Manual Markup Applied:</strong> Have you hand-encoded all target words in your excerpt using proper TEI `<choice>` markup with `<orig>`/`<reg resp=\"#editor\">` and `<abbr>`/`<expan resp=\"#editor\">`?</li>\n  <li><strong>Fidelity Maintained:</strong> Have you verified that physical milestones (`<lb/>`) remain inside `<orig>` and that authorial poetic or dialectal choices have not been improperly erased?</li>\n  <li><strong>Schema Validated:</strong> Does your XML file validate with <strong>0 errors</strong> in VS Code?</li>\n</ol>\n\nWith Step 1 complete, you are ready for Wednesday, where you will translate these manual decisions into deterministic regular expressions.\n\n**Vocabulary.** *Step 1 milestone* — The completion of the manual baseline transcription and policy ledger, locking the ground truth for comparative evaluation.\n\n**Takeaway:** Completing Step 1 establishes a validated manual ground truth and an explicit rule ledger, preparing you to automate and audit normalization throughout the rest of the week.\n\n---\n\n## References\n\nBurnard, L. (2014). *What is the Text Encoding Initiative? How to add intelligent markup to digital resources*. OpenEdition Press. https://doi.org/10.4000/books.oep.426\n\nClemens, R., & Graham, T. (2007). *Introduction to manuscript studies*. Cornell University Press.\n\nDriscoll, M. J. (2006). Levels of transcription. In L. Burnard, K. O'Brien O'Keeffe, & J. Unsworth (Eds.), *Electronic textual editing* (pp. 254–261). Modern Language Association of America.\n\nPierazzo, E. (2015). *Digital scholarly editing: Theories, models and methods*. Ashgate Publishing.\n\nTEI Consortium. (2024). *TEI P5: Guidelines for electronic text encoding and interchange* (version 4.8.0). TEI Consortium. https://tei-c.org/guidelines/p5/", "html": null, "image_b64": null, "question": {"name": "30 Question: Review and Workshop 6 Step 1 Checklist", "questiontext": "<p>Which of the following is a mandatory deliverable for Step 1 of Workshop 6?</p>", "generalfeedback": "<p>Completing Step 1 establishes a validated manual ground truth and an explicit rule ledger, preparing you to automate and audit normalization throughout the rest of the week.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A 20-line excerpt encoded with validated TEI <choice> markup, accompanied by a documented Editorial Rule Ledger in NORMALIZATION.md.</p>", "feedback": "<p>Correct. Step 1 requires the hand-encoded TEI excerpt and the explicit policy rule ledger establishing the ground truth baseline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 5,000-line Python script that automatically deletes all historical abbreviations from the repository.</p>", "feedback": "<p>Incorrect. Step 1 is manual; automated rules are explored on Wednesday.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A signed legal waiver transferring ownership of the manuscript to the university library.</p>", "feedback": "<p>Incorrect. Student workshops involve open pedagogical exercises on public historical documents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 30-slide PowerPoint presentation with custom voiceover recordings for each section.</p>", "feedback": "<p>Incorrect. The deliverables are the validated TEI XML file and the markdown rule ledger.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
