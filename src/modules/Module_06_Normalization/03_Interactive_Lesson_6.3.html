y; their weakness is unwanted modernization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Category B discrepancies prove that computers should never be used for digital editing.</p>", "feedback": "<p>Incorrect. Category B demonstrates the necessity of combining rule-based safety with AI discovery.</p>"}]}}, {"step": 21, "title": "Discrepancy Category C: Mutual Failure and Complex Paleography", "content": "**Discrepancy Category C: Mutual Failure and Complex Paleography**\n\nThe third category of divergence occurs when **both automated passes failed**: **Category C: Mutual Failure**.\n\nCategory C discrepancies occur at points of deep physical, paleographical, or linguistic ambiguity where neither mathematical pattern matching nor statistical token prediction can substitute for human scholarly immersion.\n\nExamples of Category C failures across our cohort documents include:\n<ul>\n  <li><strong>Faded or Damaged Writing:</strong> A word where several letters are obscured by an ink blot or water stain. The regex pattern failed because the letters did not match standard characters. The AI model hallucinated a completely fabricated word because it predicted what ought to be there based on context, rather than reporting physical damage! Only your manual pass correctly used <code>&lt;unclear&gt;</code> and <code>&lt;gap/&gt;</code>.</li>\n  <li><strong>Hyphenated Line Breaks across Folders:</strong> A word split across a folio boundary. Both automated tools failed to link the two halves.</li>\n  <li><strong>Private Poetic Punctuation:</strong> Dickinson's variable dashes. Regex had no way to interpret the pen stroke, while the AI model aggressively converted the dashes into standard commas and semicolons, violating your explicit negative prompt!</li>\n</ul>\n\nCategory C discrepancies are the most intellectually rewarding sections of your workshop report. They highlight the precise boundaries where automated digital tools break down and where the indispensable expertise of the human scholar remains sovereign.\n\n**Vocabulary.** *Category C discrepancy* — A divergence where both deterministic regex and generative AI failed, proving that human paleographical judgment was strictly required. *Sovereignty of scholarship* — The principle that automated tools assist, but can never replace, human critical expertise.\n\n**Takeaway:** Category C discrepancies expose points of complex physical damage or poetic nuance where both regex and AI fail, proving the irreplaceable necessity of human judgment.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Discrepancy Category C: Mutual Failure and Complex Paleography", "questiontext": "<p>What causes a Category C discrepancy where both regex and AI fail to produce the correct normalization?</p>", "generalfeedback": "<p>Category C discrepancies expose points of complex physical damage or poetic nuance where both regex and AI fail, requiring authoritative human judgment.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Complex paleographical phenomena like heavily abbreviated multi-word phrases, obscure legal idioms, or ambiguous physical manuscript damage.</p>", "feedback": "<p>Correct. Severe manuscript degradation or rare historical idioms exceed the capacity of simple patterns and general LLM priors, demanding human expertise.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A power outage at the local electrical substation.</p>", "feedback": "<p>Incorrect. Computational failures stem from linguistic and paleographic complexity, not power cuts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI Consortium changing all XML specifications during the night.</p>", "feedback": "<p>Incorrect. TEI schemas are stable international standards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The student accidentally opening a PDF file in an image viewer.</p>", "feedback": "<p>Incorrect. The issue is paleographical ambiguity within the transcribed text.</p>"}]}}, {"step": 22, "title": "Calculating the Hypercorrection Rate", "content": "**Calculating the Hypercorrection Rate**\n\nTo make your comparative audit empirical and scientific, you will calculate a formal quantitative metric for your AI pass: the **Hypercorrection Rate (HR)**.\n\nThe Hypercorrection Rate measures the proportion of an AI model's proposed editorial interventions that were unauthorized, excessive, or linguistically destructive:\n\n$$\text{Hypercorrection Rate} = \frac{\text{Total AI Hypercorrections}}{\text{Total AI Editorial Interventions}}$$\n\nLet us trace a concrete calculation on a 20-line passage:\n<ol>\n  <li>Suppose Gemini generated a total of <strong>16</strong> <code>&lt;choice&gt;</code> blocks across your passage (Total Interventions = 16).</li>\n  <li>You audit each of the 16 blocks against your manual ground truth.</li>\n  <li>You discover:\n    <ul>\n      <li>12 blocks were legitimate orthographic regularizations (True Positives).</li>\n      <li>2 blocks replaced valid archaic words with modern synonyms (Lexical Substitutions: <em>betwixt</em> $\to$ <em>between</em>).</li>\n      <li>1 block modernized a dialect verb inflection (Morphological Modernization: <em>we was</em> $\to$ <em>we were</em>).</li>\n      <li>1 block invented an unwritten military title in an expansion (Hallucinated Expansion).</li>\n    </ul>\n  </li>\n  <li>Total Hypercorrections = $2 + 1 + 1 = 4$.</li>\n</ol>\n\nNow calculate the Hypercorrection Rate:\n\n$$\text{Hypercorrection Rate} = \frac{4}{16} = 0.25 \text{ (25\\%)}$$\n\nA Hypercorrection Rate of 25% means that **one out of every four edits proposed by the AI model was linguistically destructive**. Publishing this metric in your edition's documentation provides critical transparency for future researchers evaluating your dataset.\n\n**Vocabulary.** *Hypercorrection Rate (HR)* — The mathematical proportion of an automated tool's proposed edits that represent unauthorized modernizations or hallucinations ($H / \text{Total Edits}$). *Quantitative audit* — Supporting qualitative textual observations with exact mathematical error frequencies.\n\n**Takeaway:** Calculate the Hypercorrection Rate ($H / \text{Total Edits}$) to quantify the exact frequency with which an AI model over-stepped its scholarly boundaries.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Calculating the Hypercorrection Rate", "questiontext": "<p>How is the Hypercorrection Rate calculated when auditing an AI normalization pass?</p>", "generalfeedback": "<p>Calculate the Hypercorrection Rate (H / Total Edits) to quantify the exact frequency with which an AI model exceeded your editorial policy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Divide the number of hypercorrected or over-normalized tokens (H) by the total number of normalization proposals made by the model.</p>", "feedback": "<p>Correct. The Hypercorrection Rate (H / Total Edits) measures the proportion of model interventions that inappropriately modernized or corrupted the text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Multiply the number of words by the file size in megabytes.</p>", "feedback": "<p>Incorrect. Hypercorrection rate is a precision metric based on editorial error counts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Divide the student's grade by the number of hours spent in the computer lab.</p>", "feedback": "<p>Incorrect. The formula measures model error, not student time.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Subtract the number of lines from the number of paragraphs in the TEI body.</p>", "feedback": "<p>Incorrect. The metric evaluates linguistic accuracy against editorial policy.</p>"}]}}, {"step": 23, "title": "Evaluating Precision and Recall for the AI Pass", "content": "**Evaluating Precision and Recall for the AI Pass**\n\nJust as you evaluated your deterministic regex rules on Wednesday using Precision and Recall, you must now calculate the identical metrics for your generative AI pass.\n\nRecall the core definitions:\n\n$$\text{Precision} = \frac{\text{True Positives}}{\text{True Positives} + \text{False Positives}}$$\n\n$$\text{Recall} = \frac{\text{True Positives}}{\text{True Positives} + \text{False Negatives}}$$\n\nLet us evaluate the AI pass from our previous section:\n<ul>\n  <li><strong>True Positives (TP):</strong> The AI correctly identified and regularized 12 legitimate historical variants that matched your manual ground truth policy.</li>\n  <li><strong>False Positives (FP):</strong> The AI committed 4 hypercorrections on words that should have been left alone ($FP = 4$).</li>\n  <li><strong>False Negatives (FN):</strong> Suppose your manual ground truth contained 14 legitimate target words, meaning the AI overlooked 2 archaic spellings ($FN = 2$).</li>\n</ul>\n\nNow calculate Precision and Recall:\n\n$$\text{Precision} = \frac{12}{12 + 4} = \frac{12}{16} = 0.75 \text{ (75\\%)}$$\n\n$$\text{Recall} = \frac{12}{12 + 2} = \frac{12}{14} = 0.857 \text{ (85.7\\%)}$$\n\nNow compare this with Wednesday's deterministic regex!\nOften, you will find a fascinating comparative trade-off:\n<ul>\n  <li><strong>Regex:</strong> Precision = 100%, Recall = 71% (Regex made zero mistakes, but missed irregular inflections).</li>\n  <li><strong>Generative AI:</strong> Precision = 75%, Recall = 85.7% (AI caught more variations, but introduced destructive hypercorrections!).</li>\n</ul>\n\nThis mathematical comparison is the heart of digital humanities. It proves empirically why neither tool can be trusted in isolation.\n\n**Vocabulary.** *Comparative metrics* — Measuring Precision and Recall across multiple distinct methodologies applied to the identical textual benchmark. *Methodological trade-off* — The common phenomenon where deterministic rules maximize precision while generative models maximize recall at the expense of accuracy.\n\n**Takeaway:** Comparing Precision and Recall reveals the fundamental trade-off: deterministic regex maximizes precision, while generative AI maximizes recall at the risk of false positives.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Evaluating Precision and Recall for the AI Pass", "questiontext": "<p>In the context of historical text normalization, how do deterministic regex and generative AI typically compare on Precision and Recall?</p>", "generalfeedback": "<p>Comparing Precision and Recall reveals the fundamental trade-off: deterministic regex maximizes precision, while generative AI maximizes recall at the risk of false positives.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Regex typically exhibits high Precision and lower Recall, while AI achieves higher Recall at the expense of lower Precision (higher false positives).</p>", "feedback": "<p>Correct. Regex rarely makes unauthorized edits when patterns are strict, but misses variations; AI catches almost all variants but produces unwanted hypercorrections.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Regex and AI always produce mathematically identical Precision and Recall scores of 1.0.</p>", "feedback": "<p>Incorrect. Every method exhibits distinct trade-offs between coverage and error rate.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Regex has 0% Precision because it cannot understand human feelings.</p>", "feedback": "<p>Incorrect. Precision measures whether the executed edits were valid, which regex achieves through strict matching.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>AI has 0% Recall because it refuses to read 18th-century documents.</p>", "feedback": "<p>Incorrect. AI has broad recall because it recognizes semantic variations across historical periods.</p>"}]}}, {"step": 24, "title": "Synthesizing the Final Normalized Text", "content": "**Synthesizing the Final Normalized Text**\n\nNow that your three-way audit is complete, you must assemble the final production artifact of Week 6: `transcription_normalized.xml`.\n\nThe final normalized file is not simply a copy of File 1, File 2, or File 3. It is a **scholarly synthesis** that brings together the best elements of all three passes:\n\n<ol>\n  <li><strong>Start with your Manual Ground Truth:</strong> Use <code>transcription_reconciled_manual.xml</code> as your master foundation. It contains your verified line breaks, your careful policy choices, and your human restraint.</li>\n  <li><strong>Incorporate Valid AI Discoveries (Category A):</strong> Where the AI model successfully caught legitimate inflections or variants that you and your regex rules overlooked, adopt those specific <code>&lt;choice&gt;</code> blocks into your master file. Attribute them with <code>resp=\"#gemini\"</code>.</li>\n  <li><strong>Reject All AI Hypercorrections (Category B):</strong> Where the AI model committed lexical substitution or dialect erasure, ensure that the original witness reading remains clean and unaltered.</li>\n  <li><strong>Resolve Complex Ambiguities (Category C):</strong> Where automated tools failed on damaged text or poetic punctuation, verify that your manual paleographical encoding correctly uses <code>&lt;unclear&gt;</code> or preserved dashes.</li>\n</ol>\n\nThe resulting document represents the gold standard of digital scholarship: a human-curated text enhanced by computational speed and artificial intelligence, where every single character has been verified by a responsible scholar.\n\n**Vocabulary.** *Scholarly synthesis* — Constructing a final authoritative text by critically selecting the strongest verified readings across manual, algorithmic, and AI passes. *Curated edition* — A digital text where automated suggestions have been vetted and authorized by human editorial judgment.\n\n**Takeaway:** The final normalized file synthesizes the best of all three passes, adopting valid AI discoveries while rejecting automated hypercorrections under human oversight.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Synthesizing the Final Normalized Text", "questiontext": "<p>How should an editor construct the final normalized edition (consensus_normalized.xml) from the three experimental passes?</p>", "generalfeedback": "<p>The final normalized file synthesizes the best of all three passes, adopting valid AI discoveries while rejecting all hypercorrections and hallucinations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Start with the verified manual baseline, adopt valid candidates caught by regex and AI, and reject all AI hypercorrections and hallucinated expansions.</p>", "feedback": "<p>Correct. The final text synthesizes the strengths of all methods: human philological judgment adjudicates candidates surfaced by rules and AI.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Accept all AI proposals blindly without reading the manuscript.</p>", "feedback": "<p>Incorrect. Blind acceptance imports severe hypercorrections and erases historical evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete all <choice> tags and keep only modern English prose.</p>", "feedback": "<p>Incorrect. The goal is a digital edition with parallel diplomatic and normalized readings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Let the computer randomly select between regex and AI using a coin flip.</p>", "feedback": "<p>Incorrect. Scholarly editing requires reasoned, accountable decision-making.</p>"}]}}, {"step": 25, "title": "Documenting AI Attribution in the TEI Header", "content": "**Documenting AI Attribution in the TEI Header**\n\nIn academic digital scholarship, using artificial intelligence is completely acceptable—provided that it is **transparently acknowledged and attributed**. Secretly using AI to generate markup and presenting it as your own manual work is a grave breach of academic integrity.\n\nThe TEI Header provides built-in mechanisms for attributing automated and artificial intelligence contributions (TEI Consortium, 2024).\n\nIn your `transcription_normalized.xml` file, update your TEI Header in two specific places:\n\n<ol>\n  <li><strong>In `<titleStmt>`:</strong> Add a formal statement of responsibility recording the AI model used in the workflow:\n    <pre><code>&lt;titleStmt&gt;\n  &lt;title&gt;Normalized Edition of Witness RG 1 Vol 430 No 2&lt;/title&gt;\n  &lt;author&gt;Ken Penner&lt;/author&gt;\n  &lt;respStmt&gt;\n    &lt;resp&gt;Manual normalization, policy design, and editorial audit&lt;/resp&gt;\n    &lt;name xml:id=\"KP\"&gt;Ken Penner&lt;/name&gt;\n  &lt;/respStmt&gt;\n  &lt;respStmt&gt;\n    &lt;resp&gt;Automated normalization suggestions generated by Gemini 2.5 Pro via VS Code Antigravity&lt;/resp&gt;\n    &lt;name xml:id=\"gemini\"&gt;Google Gemini 2.5 Pro&lt;/name&gt;\n  &lt;/respStmt&gt;\n&lt;/titleStmt&gt;</code></pre>\n  </li>\n  <li><strong>In `<revisionDesc>`:</strong> Log the date, model, and nature of the automated pass:\n    <pre><code>&lt;revisionDesc&gt;\n  &lt;change when=\"2026-10-09\" who=\"#KP\"&gt;Synthesized final normalized edition; audited AI suggestions from #gemini and rejected 4 hypercorrections.&lt;/change&gt;\n&lt;/revisionDesc&gt;</code></pre>\n  </li>\n</ol>\n\nNotice how this transparently records the collaboration: the human editor is named as the primary authority, the AI model is acknowledged as an automated contributor, and every tag carrying `resp=\"#gemini\"` resolves to a valid identifier in the header.\n\n**Vocabulary.** *AI attribution* — Transparently documenting the specific AI models, versions, and prompting workflows used to generate digital edition markup. *`<respStmt>`* — The TEI Header element defining roles and responsibilities of all human and automated project contributors.\n\n**Takeaway:** Transparently attribute AI assistance in your TEI Header using `<respStmt>` and `<change>` tags, linking `resp=\"#gemini\"` to an explicit model identifier.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Documenting AI Attribution in the TEI Header", "questiontext": "<p>Why is documenting AI tool usage, model version, and system prompt in the <teiHeader> an academic integrity requirement?</p>", "generalfeedback": "<p>Transparently attribute AI assistance in your TEI Header using <respStmt> and <change> tags, linking @resp='#ai' to an explicit methodology description.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It provides a transparent computational provenance trail, allowing future scholars to understand which interventions were machine-suggested.</p>", "feedback": "<p>Correct. Digital humanities demands reproducible and accountable scholarship; automated interventions must be attributed and documented.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI Header is a commercial advertisement board for AI software vendors.</p>", "feedback": "<p>Incorrect. The TEI Header records scholarly and bibliographic metadata, not advertisements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Documenting AI tools automatically exempts the student from taking final exams.</p>", "feedback": "<p>Incorrect. Documenting methods is a standard requirement for academic rigor.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows AI companies to claim legal copyright over the student's historical edition.</p>", "feedback": "<p>Incorrect. Provenance documentation records scholarly methodology; copyright rests with authorial/editorial rights.</p>"}]}}, {"step": 26, "title": "Writing the Comparative Reflection Report", "content": "**Writing the Comparative Reflection Report**\n\nThe final component of Workshop 6 is composing your **Comparative Reflection Report**, recorded in `NORMALIZATION.md`.\n\nYour report should be between **300 and 500 words**, written in clear academic prose. It synthesizes your findings from the three-way audit and evaluates what the exercise revealed about your document.\n\nStructure your report into four distinct sections:\n\n<ol>\n  <li><strong>Methodological Overview (approx. 75 words):</strong> Briefly describe your 20-line passage and state the core principles of your Editorial Regularization Policy.</li>\n  <li><strong>Quantitative Results (approx. 100 words):</strong> Report your empirical metrics in a clean markdown table:\n    <ul>\n      <li>Deterministic Regex: True Positives, False Positives, Precision, Recall.</li>\n      <li>Generative AI: True Positives, False Positives, Hypercorrection Rate, Precision, Recall.</li>\n    </ul>\n  </li>\n  <li><strong>Discrepancy Analysis (approx. 200 words):</strong> Discuss at least one concrete example from each discrepancy category:\n    <ul>\n      <li>One Category A instance where AI succeeded over regex.</li>\n      <li>One Category B instance where regex protected text from an AI hypercorrection.</li>\n      <li>One Category C instance where both automated tools struggled.</li>\n    </ul>\n  </li>\n  <li><strong>Scholarly Conclusion (approx. 75 words):</strong> Conclude with a reflection on how automated tools impact the preservation of historical language and dialect in your specific witness.</li>\n</ol>\n\nThis report is where you earn your grade. It demonstrates that you are not merely a technician running software, but a critical humanist capable of evaluating computational tools with scholarly rigor.\n\n**Vocabulary.** *Comparative reflection report* — A structured academic synthesis evaluating the empirical performance and qualitative trade-offs of manual, regex, and AI text processing.\n\n**Takeaway:** Structure your 300–500 word reflection report around your policy overview, quantitative metrics table, discrepancy analysis, and scholarly conclusions.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Writing the Comparative Reflection Report", "questiontext": "<p>What should form the analytical core of the Workshop 6 Comparative Reflection Report?</p>", "generalfeedback": "<p>Structure your 300-500 word reflection report around your policy overview, quantitative metrics table, discrepancy analysis, and lessons learned.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A discussion of specific discrepancy categories (A, B, C) supported by quantitative metrics and philological analysis of why each method succeeded or failed.</p>", "feedback": "<p>Correct. The reflection must bridge quantitative metrics with deep qualitative analysis of linguistic and computational behavior.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A summary of the weather during the week the workshop was assigned.</p>", "feedback": "<p>Incorrect. The report analyzes normalization methodology and textual discrepancies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A fictional story about an 18th-century scribe traveling through time.</p>", "feedback": "<p>Incorrect. The assignment requires scholarly reflection on digital editing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A list of complaints about how difficult it is to install software.</p>", "feedback": "<p>Incorrect. The report focuses on editorial decisions and comparative results.</p>"}]}}, {"step": 27, "title": "Ethical Dimensions of AI in Cultural Heritage", "content": "**Ethical Dimensions of AI in Cultural Heritage**\n\nBefore completing our study of automated normalization, we must pause to consider the broader **ethical and political dimensions of artificial intelligence in digital humanities**.\n\nArtificial intelligence models are not neutral, objective mathematical conduits. They are commercial technologies built by multinational corporations, trained on contemporary internet data that overwhelmingly reflects standard, wealthy, modern Anglo-American cultural norms (Pierazzo, 2015).\n\nWhen an AI model encounters historical documents, it instinctively attempts to discipline those documents:\n<ul>\n  <li>It flattens working-class vernacular voices (like Maud Lewis) into corporate business English.</li>\n  <li>It smooths over the idiosyncratic, resistant rhythms of female poets (like Emily Dickinson) into standard Victorian metrics.</li>\n  <li>It homogenizes non-standard regional spellings, erasing the rich diversity of historical dialects.</li>\n</ul>\n\nIf digital scholars blindly accept AI-generated text without rigorous manual auditing, we risk creating a homogenized, algorithmic digital archive where the authentic linguistic friction of the past has been quietly scrubbed away.\n\nThe role of the digital humanist is to stand as a guardian of historical alterity. We use artificial intelligence to accelerate indexing and accessibility, but we never allow an algorithm to decide what the past sounded like. The scholar's critical eye remains the ultimate ethical defense of human memory.\n\n**Vocabulary.** *Linguistic homogenization* — The erasure of regional, dialectal, and historical linguistic diversity by automated AI language models. *Historical alterity* — The fundamental, authentic difference of past languages, cultures, and mindsets from modern contemporary norms.\n\n**Takeaway:** Digital humanists must ethically guard against AI linguistic homogenization, ensuring that automated tools never erase the authentic, non-standard voices of historical writers.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Ethical Dimensions of AI in Cultural Heritage", "questiontext": "<p>What ethical danger arises when large language models are used uncritically to process minority dialects, Indigenous documents, or working-class letters?</p>", "generalfeedback": "<p>Digital humanists must ethically guard against AI linguistic homogenization, ensuring that automated tools preserve rather than erase non-standard historical voices.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Linguistic homogenization, where the AI erases authentic cultural, regional, and socioeconomic voices to conform to standardized prestige dialects.</p>", "feedback": "<p>Correct. Generative models trained on dominant prestige dialects can homogenize unique historical voices if applied without strict ethical and editorial safeguards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI model will physically steal the paper manuscripts from museum display cases.</p>", "feedback": "<p>Incorrect. The ethical risk is linguistic and representational, not physical theft.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Minority languages cannot be processed by computers due to Unicode restrictions.</p>", "feedback": "<p>Incorrect. Modern Unicode supports virtually all global scripts and linguistic characters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI will automatically convert all historical letters into legal copyright lawsuits.</p>", "feedback": "<p>Incorrect. Linguistic flattening of non-standard voices is the primary cultural heritage danger.</p>"}]}}, {"step": 28, "title": "Validating the Final Normalized Edition", "content": "**Validating the Final Normalized Edition**\n\nBefore committing your files to Git and submitting Workshop 6, you must conduct a comprehensive **validation sweep** across your entire project repository.\n\nIn digital editing, an unvalidated XML file is considered broken. A single syntax error prevents TEI Publisher, web browsers, or search engines from reading your document.\n\nComplete this pre-submission validation checklist in VS Code:\n\n<ol>\n  <li><strong>Verify XML Schema Compliance:</strong> Open <code>transcription_normalized.xml</code>. Open the Problems panel (<code>Cmd+Shift+M</code>). Confirm that the document displays <strong>0 errors</strong> against your project's RELAX NG schema.</li>\n  <li><strong>Check Milestone Integrity:</strong> Search for <code>&lt;lb/&gt;</code> tags. Verify that every single line break from your consensus diplomatic text is present, in order, with its original line number intact.</li>\n  <li><strong>Audit Attribution Tags:</strong> Ensure that every `<reg>` and `<expan>` element carries an authorized `@resp` attribute pointing to a valid identifier in the TEI Header (`#editor`, `#KP`, or `#gemini`).</li>\n  <li><strong>Confirm Non-Destructive Markup:</strong> Verify that no raw text was deleted; every normalization must exist as a parallel pairing inside a valid <code>&lt;choice&gt;</code> block.</li>\n</ol>\n\nWhen your Problems panel displays a clean green checkmark with zero errors, your digital edition satisfies the highest technical standards of professional scholarship.\n\n**Vocabulary.** *Validation sweep* — An exhaustive pre-publication review verifying schema conformance, milestone preservation, and attribution accuracy across all project files. *Zero-error baseline* — The mandatory technical standard requiring digital edition files to pass schema validation without syntax violations.\n\n**Takeaway:** Conduct an exhaustive validation sweep before submission, ensuring your final normalized XML passes schema validation with zero errors and preserves all milestones.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Validating the Final Normalized Edition", "questiontext": "<p>What two validation checks must the final synthesized XML file pass before submission?</p>", "generalfeedback": "<p>Conduct an exhaustive validation sweep before submission, ensuring your final normalized XML passes schema checks and preserves all structural tags.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>XML well-formedness (properly closed and nested tags) and TEI schema validity (compliance with project element definitions and attributes).</p>", "feedback": "<p>Correct. A scholarly edition must be technically well-formed and valid against the TEI schema to ensure interoperability and digital preservation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An internet speed test and a hard drive defragmentation check.</p>", "feedback": "<p>Incorrect. Validation checks verify XML structure and schema conformance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A copyright registration with the federal trademark office.</p>", "feedback": "<p>Incorrect. Technical validation is performed locally against the TEI RNG schema.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A virus scan of the student's personal email account.</p>", "feedback": "<p>Incorrect. XML validation evaluates the document markup itself.</p>"}]}}, {"step": 29, "title": "Preparing for Week 7: Collation", "content": "**Preparing for Week 7: Collation**\n\nCongratulations! By completing Week 6, you have mastered the first four foundational stages of the scholarly editing pipeline:\n<ol>\n  <li><strong>Cataloguing & Metadata (Module 2):</strong> Creating the TEI Header and authority files.</li>\n  <li><strong>Imaging & IIIF (Module 3):</strong> Binding facsimile images to structural canvas zones.</li>\n  <li><strong>Diplomatic Transcription (Module 4):</strong> Keying the physical witness line by line.</li>\n  <li><strong>Reconciliation & Normalization (Modules 5 & 6):</strong> Building a consensus text and encoding parallel standardizations and abbreviation expansions.</li>\n</ol>\n\nYour document is now in pristine condition. It preserves the exact historical handwriting of the witness, while simultaneously providing modern standard lemmas and expanded abbreviations for automated computational tools.\n\nWhere do we go next?\n\nAfter next week's **Fall Study Break (Oct 12–16)**, we return in **Week 7 (Module 07: Collation)** to confront the fundamental challenge of textual criticism: **comparing multiple witnesses of the same work**.\n\nIn Week 7, you will take your normalized text and compare it against alternative manuscript witnesses or printed editions of the same text. You will learn to perform manual collation on paper, run automated multi-witness alignment algorithms using the **CollateX** engine, and deploy AI models to classify textual variants into substitutions, additions, omissions, and transpositions.\n\nYour normalized text is the essential engine that makes automated collation possible: because you regularized spelling, CollateX will align the words correctly rather than stumbling over superficial orthographic noise!\n\n**Vocabulary.** *Textual collation* — The systematic comparison of multiple physical witnesses of the same work to identify, record, and analyze textual variations. *CollateX* — The premier open-source algorithmic engine used by digital humanists to align and collate multi-witness texts.\n\n**Takeaway:** Your normalized text provides the clean baseline needed for Week 7, where you will use CollateX to align and collate multiple historical witnesses.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Preparing for Week 7: Collation", "questiontext": "<p>Why is a rigorously normalized text essential for automated collation in Week 7?</p>", "generalfeedback": "<p>Your normalized text provides the clean baseline needed for Week 7, where you will use CollateX to align and collate multiple historical witnesses.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Collation algorithms (like CollateX) align texts word by word; superficial spelling variations obscure substantive textual variants unless normalized beforehand.</p>", "feedback": "<p>Correct. Normalization levels non-significant orthographic noise so collation algorithms can pinpoint genuine textual additions, omissions, and revisions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>CollateX only accepts files written in modern French.</p>", "feedback": "<p>Incorrect. CollateX works across languages once textual tokens are aligned.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Collation software deletes all punctuation marks permanently from the repository.</p>", "feedback": "<p>Incorrect. Collation analyzes textual variance; normalization provides the necessary aligned baseline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Without normalization, computers refuse to boot into the operating system.</p>", "feedback": "<p>Incorrect. The issue is algorithmic alignment of text witnesses.</p>"}]}}, {"step": 30, "title": "Review and Workshop 6 Master Checklist", "content": "**Review and Workshop 6 Master Checklist**\n\nToday you brought Week 6 to its triumphant scholarly conclusion. You explored the capabilities of generative artificial intelligence, constructed negative prompts, diagnosed hypercorrections, executed a three-way comparative audit, and synthesized a final normalized digital edition.\n\nBefore submitting Workshop 6, review the **Master Deliverables Checklist**:\n\n<ol>\n  <li><strong>Consensus Excerpt Base:</strong> A clean 20-line passage from <code>transcription_reconciled.xml</code>.</li>\n  <li><strong>File 1 (Manual Pass):</strong> <code>transcription_reconciled_manual.xml</code> hand-encoded with validated TEI <code>&lt;choice&gt;</code> markup in Lesson 6.1.</li>\n  <li><strong>File 2 (Regex Pass):</strong> <code>transcription_reconciled_regex.xml</code> automated using XML-safe regular expressions in Lesson 6.2.</li>\n  <li><strong>File 3 (AI Pass):</strong> <code>transcription_reconciled_ai.xml</code> generated by Gemini in VS Code Antigravity with strict negative prompts in Lesson 6.3.</li>\n  <li><strong>File 4 (Final Synthesis):</strong> <code>transcription_normalized.xml</code> synthesizing the best verified readings across all passes, validated with 0 schema errors.</li>\n  <li><strong>Documentation in `NORMALIZATION.md`:</strong>\n    <ul>\n      <li>Your explicit Editorial Regularization Policy statement.</li>\n      <li>Your completed Rule Ledger cataloguing Rule IDs, descriptions, regex patterns, and replacements.</li>\n      <li>Your 300–500 word Comparative Reflection Report containing your metrics table and Category A, B, and C discrepancy analysis.</li>\n    </ul>\n  </li>\n  <li><strong>TEI Header Updated:</strong> Transparent attribution recorded in <code>&lt;editorialDecl&gt;</code> and <code>&lt;respStmt&gt;</code> with <code>resp=\"#gemini\"</code>.</li>\n</ol>\n\nCommit your files to your local repository. Enjoy your well-earned Fall Study Break next week, and return ready to conquer multi-witness collation in Week 7!\n\n**Vocabulary.** *Master checklist* — The comprehensive verification inventory ensuring all code, XML data, and analytical documentation are complete and validated before submission.\n\n**Takeaway:** Completing the Master Checklist guarantees that your workshop submission contains all four XML passes, a documented Rule Ledger, and an audited reflection report.\n\n---\n\n## References\n\nBollmann, M. (2019). A large-scale comparison of historical text normalization systems. In *Proceedings of the 2019 conference of the North American chapter of the Association for Computational Linguistics: Human language technologies* (Vol. 1, pp. 3887–3898). Association for Computational Linguistics. https://doi.org/10.18653/v1/N19-1389\n\nBurnard, L. (2014). *What is the Text Encoding Initiative? How to add intelligent markup to digital resources*. OpenEdition Press. https://doi.org/10.4000/books.oep.426\n\nJurafsky, D., & Martin, J. H. (2024). *Speech and language processing: An introduction to natural language processing, computational linguistics, and speech recognition* (3rd ed. draft). Stanford University. https://web.stanford.edu/~jurafsky/slp3/\n\nPierazzo, E. (2015). *Digital scholarly editing: Theories, models and methods*. Ashgate Publishing.\n\nTEI Consortium. (2024). *TEI P5: Guidelines for electronic text encoding and interchange* (version 4.8.0). TEI Consortium. https://tei-c.org/guidelines/p5/", "html": null, "image_b64": null, "question": {"name": "30 Question: Review and Workshop 6 Master Checklist", "questiontext": "<p>Which of the following packages represents the complete deliverable set for Workshop 6?</p>", "generalfeedback": "<p>Completing the Master Checklist guarantees that your workshop submission contains all four XML passes, a documented TEI Header, and a rigorous reflection report.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Four valid TEI XML files (manual, regex, AI, final normalized), an updated TEI Header with AI attribution, and a Comparative Reflection Report.</p>", "feedback": "<p>Correct. The complete workshop package captures the full experimental trajectory and critical reflection.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A PowerPoint presentation with twenty animated transitions and no XML files.</p>", "feedback": "<p>Incorrect. The workshop requires encoded TEI XML files and a written report.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A single raw text file with all XML tags stripped out.</p>", "feedback": "<p>Incorrect. Valid TEI XML structure is the core technical deliverable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An audio recording of the student reading the manuscript aloud.</p>", "feedback": "<p>Incorrect. The assignment requires digital textual editions and computational auditing.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
