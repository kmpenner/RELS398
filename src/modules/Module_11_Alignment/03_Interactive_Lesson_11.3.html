    <script>
        const lessonData = {"course_title": "Lesson 11.3: AI-Assisted Alignment and Gloss Generation", "subtitle": "AI-Assisted Alignment & Three-Way Audit", "total_sections": 30, "slides": [{"step": 1, "title": "Entering Step 3: AI-Assisted Text Alignment", "content": "**Entering Step 3: AI-Assisted Text Alignment**\n\nThis week we have explored two very different methods for aligning historical texts. On Tuesday, you aligned sentences and authored Leipzig glosses completely by hand. On Wednesday, you tested automated length-based algorithms.\n\nToday is Friday, Meeting #30. We arrive at Step 3 of our comparative cycle: **artificial intelligence**.\n\nLarge language models (such as Claude and Gemini) possess extensive training in multilingual grammar. Unlike simple length formulas, AI models understand syntax, vocabulary, and context. They can analyze historical French verbs, colonial treaty clauses, and informal English correspondence.\n\nToday you will prompt an AI model directly inside VS Code to propose sentence alignments and four-line Leipzig glosses. Then you will conduct a rigorous audit against your Tuesday ground truth.\n\n**Takeaway:** AI models bring semantic and grammatical understanding to alignment, offering powerful assistance that must be audited against human expertise.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: Entering Step 3: AI-Assisted Text Alignment", "questiontext": "<p>What distinctive capability do neural AI models bring to text alignment that simple length formulas lack?</p>", "generalfeedback": "<p>AI models bring semantic and grammatical understanding to alignment, offering powerful assistance that must be audited against human expertise.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Deep semantic and grammatical understanding of multilingual syntax, vocabulary, and context.</p>", "feedback": "<p>Correct. Unlike length-based formulas, AI models understand grammatical structure and can recognize relationships across complex reordered translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The ability to print physical books without using electricity.</p>", "feedback": "<p>Incorrect. AI models run computationally in digital environments.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A legal guarantee that all generated text is 100% free of errors.</p>", "feedback": "<p>Incorrect. AI models frequently make subtle errors and require rigorous human auditing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Automatic deletion of all historical French and Latin vocabulary.</p>", "feedback": "<p>Incorrect. AI models analyze multilingual historical vocabulary.</p>"}]}}, {"step": 2, "title": "How AI Differs from Deterministic Algorithms", "content": "**How AI Differs from Deterministic Algorithms**\n\nIt is important to understand how neural AI models differ from Wednesday's deterministic tools:\n\n* **Deterministic Tools:** Follow rigid mathematical length formulas. They do not know what words mean. They never hallucinate, but they break when sentence structures shift.\n* **AI Models:** Predict probable linguistic patterns based on vast multilingual training data. They understand grammar and semantics, but they can occasionally invent false facts.\n\n<table>\n  <thead>\n    <tr>\n      <th style=\"width: 25%;\">Method</th>\n      <th style=\"width: 35%;\">How It Operates</th>\n      <th style=\"width: 40%;\">Primary Risk</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Manual (Tuesday)</strong></td>\n      <td>Human philological expertise.</td>\n      <td>Slow; human fatigue on long texts.</td>\n    </tr>\n    <tr>\n      <td><strong>Deterministic (Wed)</strong></td>\n      <td>Character length formulas.</td>\n      <td>Cascading domino errors on sentence splits.</td>\n    </tr>\n    <tr>\n      <td><strong>AI-Assisted (Friday)</strong></td>\n      <td>Neural pattern prediction.</td>\n      <td>Hallucinated grammatical categories and tags.</td>\n    </tr>\n  </tbody>\n</table>\n\nUnderstanding these differences helps you choose the right tool for each editorial task.\n\n**Takeaway:** While deterministic tools rely on fixed length calculations, AI models predict linguistic patterns and require supervision against hallucinations.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: How AI Differs from Deterministic Algorithms", "questiontext": "<p>What is a primary operational difference between deterministic tools and neural AI models?</p>", "generalfeedback": "<p>While deterministic tools rely on fixed length calculations, AI models predict linguistic patterns and require supervision against hallucinations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Deterministic tools follow fixed mathematical formulas without guessing, while AI models predict probable linguistic patterns.</p>", "feedback": "<p>Correct. Deterministic tools never hallucinate but struggle with shifted syntax; AI models understand syntax but can invent non-standard facts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deterministic tools only work on mobile phones, while AI models only run on supercomputers.</p>", "feedback": "<p>Incorrect. Both tools run on standard laptop computers in VS Code.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deterministic tools require internet access, while AI models require paper index cards.</p>", "feedback": "<p>Incorrect. Deterministic scripts run offline locally.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>AI models are completely incapable of processing English text.</p>", "feedback": "<p>Incorrect. AI models excel at processing English and multilingual text.</p>"}]}}, {"step": 3, "title": "AI Inside Visual Studio Code", "content": "**AI Inside Visual Studio Code**\n\nIn RELS 398, you do not need to switch back and forth to an external web browser chat. You can interact with AI assistants directly inside Visual Studio Code.\n\nUsing AI in your editor offers major advantages:\n\n* **Direct File Context:** The AI can see your open source XML and translation files simultaneously.\n* **Inline Diff Views:** You can review AI suggestions in a split screen before accepting them into your document.\n* **No File Copying:** You do not have to copy and paste sensitive historical files into third-party websites.\n\nHaving the AI embedded in your workspace makes the comparative audit fast and comfortable.\n\n**Takeaway:** Working with AI directly inside VS Code allows you to review suggestions in split editor diff views without leaving your workspace.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: AI Inside Visual Studio Code", "questiontext": "<p>Why is working with AI assistants directly inside VS Code advantageous for digital editors?</p>", "generalfeedback": "<p>Working with AI directly inside VS Code allows you to review suggestions in split editor diff views without leaving your workspace.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows editors to review suggestions in side-by-side diff views with direct file context, avoiding external copy-pasting.</p>", "feedback": "<p>Correct. Embedded AI tools inspect open workspace files directly and allow students to accept or reject diffs cleanly.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically locks the laptop keyboard so students cannot type.</p>", "feedback": "<p>Incorrect. VS Code empowers students to edit and control their text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It sends all student grades directly to social media.</p>", "feedback": "<p>Incorrect. VS Code is a secure, private development environment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the user's local Git repository to save storage space.</p>", "feedback": "<p>Incorrect. VS Code integrates with Git to preserve version control.</p>"}]}}, {"step": 4, "title": "Prompt Engineering for Structured Alignment", "content": "**Prompt Engineering for Structured Alignment**\n\nAI models are conversational by default. If you ask an AI casually to \"align these sentences,\" it might write a chatty paragraph or invent its own informal formatting.\n\nTo produce scholarly data, you must write a **structured system prompt**:\n\n* Define its exact role: \"You are an expert computational philologist and TEI XML specialist.\"\n* Specify the input files: Provide the exact source text with `xml:id` attributes.\n* Define the output format: Demand a valid TEI `<linkGrp>` element with no conversational filler.\n* State explicit constraints: Forbid the model from skipping sentences or inventing extra IDs.\n\nClear instructions produce clean, valid XML markup.\n\n**Takeaway:** Structured prompts with explicit roles, input boundaries, and output formats force AI models to generate clean, valid TEI markup.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Prompt Engineering for Structured Alignment", "questiontext": "<p>Why must editors provide structured system prompts rather than casual chat requests when generating TEI markup?</p>", "generalfeedback": "<p>Structured prompts with explicit roles, input boundaries, and output formats force AI models to generate clean, valid TEI markup.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To force the AI to produce well-formed XML data and prevent conversational filler or unrequested formatting.</p>", "feedback": "<p>Correct. Structured prompts specify role, exact input boundaries, schema rules, and expected XML tags.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models become angry if you speak to them casually.</p>", "feedback": "<p>Incorrect. Models do not have feelings; structured prompts ensure machine-readable data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because casual prompts cause the computer's fan to stop spinning.</p>", "feedback": "<p>Incorrect. Prompt structure affects text generation, not cooling hardware.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI guidelines require prompts to be written in rhyming verse.</p>", "feedback": "<p>Incorrect. Prompts are written in clear, concise technical English.</p>"}]}}, {"step": 5, "title": "Prompting for Four-Line Leipzig Glosses", "content": "**Prompting for Four-Line Leipzig Glosses**\n\nPrompting for Leipzig interlinear glosses requires even stricter guidelines. The model must maintain perfect vertical column alignment across four distinct lines.\n\nIn your prompt, specify the four required tiers:\n\n1. `Line 1`: Exact historical surface text (no modernized spelling).\n2. `Line 2`: Morpheme breakdown with hyphens (`-`).\n3. `Line 3`: Uppercase grammatical labels and lowercase lexical roots.\n4. `Line 4`: Fluent English translation in quotation marks.\n\nAdd a strict formatting rule:\n\n* \"Every word in Line 1 must correspond to exactly one vertical column in Line 2 and Line 3.\"\n* \"Separate columns with multiple spaces so they align visually on screen.\"\n\nGiving the AI a concrete template prevents shifted columns.\n\n**Takeaway:** Prompting for Leipzig glosses requires demanding four synchronized tiers, standard uppercase tags, and preserved historical surface orthography.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Prompting for Four-Line Leipzig Glosses", "questiontext": "<p>What critical formatting constraint must be emphasized when prompting an AI for Leipzig glosses?</p>", "generalfeedback": "<p>Prompting for Leipzig glosses requires demanding four synchronized tiers, standard uppercase tags, and preserved historical surface orthography.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Demanding that every word in Line 1 correspond to exactly one vertical column in Line 2 and Line 3.</p>", "feedback": "<p>Correct. Forcing strict column synchronization prevents horizontal shifting and maintains morpheme-by-morpheme alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Demanding that all four lines be translated into modern Spanish.</p>", "feedback": "<p>Incorrect. Leipzig glosses analyze the primary source language using standard grammatical tags and an English translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Instructing the AI to delete all vowels from the historical text.</p>", "feedback": "<p>Incorrect. Historical spelling must be fully preserved.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Requiring that every sentence be exactly one hundred words long.</p>", "feedback": "<p>Incorrect. Sentence lengths vary according to the historical witness.</p>"}]}}, {"step": 6, "title": "Negative Constraints: What to Forbid", "content": "**Negative Constraints: What to Forbid**\n\nIn prompt engineering, what you forbid is often more important than what you request. These restrictions are called **negative constraints**.\n\nEssential negative constraints for linguistic alignment:\n\n* **Do NOT modernize Line 1:** Forbid the AI from silently fixing historical spelling or removing archaic accents.\n* **Do NOT use hyphens for portmanteaux:** Remind the AI to follow Rule 2 (use periods `.` for fused grammatical categories).\n* **Do NOT hallucinate Latin or Greek roots:** Ensure the AI glosses the actual words on the page rather than classical roots from unrelated languages.\n* **Do NOT skip difficult words:** The AI must gloss every historical token.\n\nNegative constraints act like guardrails, keeping the AI focused on rigorous scholarship.\n\n**Takeaway:** Negative constraints prevent the AI from modernizing historical spelling, hallucinating classical roots, or violating Leipzig punctuation rules.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Negative Constraints: What to Forbid", "questiontext": "<p>What is the function of negative constraints in prompt engineering for digital editions?</p>", "generalfeedback": "<p>Negative constraints prevent the AI from modernizing historical spelling, hallucinating classical roots, or violating Leipzig punctuation rules.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They establish explicit boundaries that forbid the AI from modernizing spelling, hallucinating roots, or skipping words.</p>", "feedback": "<p>Correct. Negative constraints act like guardrails, preventing models from committing common generative errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They prevent students from asking questions in classroom discussions.</p>", "feedback": "<p>Incorrect. Negative constraints apply to AI prompts, not human students.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They force the computer to shut down if an error occurs.</p>", "feedback": "<p>Incorrect. Constraints guide text generation within the AI model.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete negative numbers from financial spreadsheets.</p>", "feedback": "<p>Incorrect. Negative constraints are prompt instructions that forbid specific behaviors.</p>"}]}}, {"step": 7, "title": "AI Failure Mode 1: Silent Modernization", "content": "**AI Failure Mode 1: Silent Modernization**\n\nThe most common mistake modern AI models make is **silent modernization**.\n\nAI models are trained on billions of modern web pages. Consequently, they have a powerful bias toward contemporary spelling:\n\n* In Ace's 1791 French decree, the AI might change 18th-century *décréta* to modern *décrète*.\n* In Andromeda's 1752 treaty, it might modernize *agree-d* to *agreed* or *compleat* to *complete*.\n* In Maud Lewis's letter, it might correct informal colloquialisms into stiff formal English.\n\nIn a digital critical edition, silent modernization is an editorial crime. Line 1 must always reflect the authentic historical witness.\n\n**Takeaway:** AI models naturally bias toward modern spelling; editors must audit Line 1 to ensure historical orthography was not silently altered.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: AI Failure Mode 1: Silent Modernization", "questiontext": "<p>What is \"silent modernization\" in AI-assisted textual editing?</p>", "generalfeedback": "<p>AI models naturally bias toward modern spelling; editors must audit Line 1 to ensure historical orthography was not silently altered.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When an AI model automatically and unnoticed alters historical orthography into contemporary standard spelling in Line 1.</p>", "feedback": "<p>Correct. AI models naturally bias toward modern web spelling, frequently smoothing over archaic spellings unless audited by an editor.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When an author purchases a new laptop without telling the instructor.</p>", "feedback": "<p>Incorrect. Silent modernization refers to unauthorized alteration of historical text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When a manuscript fades over centuries due to sunlight exposure.</p>", "feedback": "<p>Incorrect. That is physical degradation, not editorial modernization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When an XML parser changes all font sizes to twelve points.</p>", "feedback": "<p>Incorrect. It refers to spelling alterations in the text stream.</p>"}]}}, {"step": 8, "title": "AI Failure Mode 2: The Portmanteau Confusion (Rule 2)", "content": "**AI Failure Mode 2: The Portmanteau Confusion (Rule 2)**\n\nThe second common AI error involves Leipzig Rule 2: confusing hyphens (`-`) and periods (`.`).\n\nAI models frequently make this mistake:\n\n* They see the French third-person singular past verb *parla*.\n* Instead of writing `speak-3SG.PST` with periods, they write `speak-3-SG-PST` with hyphens.\n* This implies that *3*, *SG*, and *PST* are three separate physical letters that can be cut apart with scissors.\n\nIn French and English inflected forms, these categories are fused together in a single ending. You must manually correct hyphens to periods in Line 3.\n\n**Takeaway:** AI models often use hyphens instead of periods for fused grammatical features, violating Leipzig Rule 2.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: AI Failure Mode 2: The Portmanteau Confusion (Rule 2)", "questiontext": "<p>How do AI models commonly violate Leipzig Rule 2 in Line 3 of an interlinear gloss?</p>", "generalfeedback": "<p>AI models often use hyphens instead of periods for fused grammatical features, violating Leipzig Rule 2.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They use hyphens instead of periods for fused grammatical categories (e.g. writing speak-3-SG-PST instead of speak-3SG.PST).</p>", "feedback": "<p>Correct. Hyphens imply physical morpheme cuts; periods must be used when multiple categories belong to an indivisible ending.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They replace all words with exclamation marks.</p>", "feedback": "<p>Incorrect. The error is punctuation confusion between hyphens and periods.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They write all grammatical labels in lowercase cursive font.</p>", "feedback": "<p>Incorrect. AI models usually use uppercase, but misapply hyphens.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete Line 3 entirely and refuse to write it.</p>", "feedback": "<p>Incorrect. Models generate Line 3 but frequently violate Rule 2 punctuation.</p>"}]}}, {"step": 9, "title": "AI Failure Mode 3: Hallucinated Grammatical Tags", "content": "**AI Failure Mode 3: Hallucinated Grammatical Tags**\n\nLarge language models are probabilistic text generators. When they encounter an unfamiliar historical word, they sometimes invent plausible-sounding grammatical labels.\n\nExamples of **hallucinated tags**:\n\n* Labeling an ordinary English preposition as an ancient Greek particle (`PRT.HES`).\n* Inventing complex case labels (like `ABL.LOC.INSTR`) that do not exist in French.\n* Mistaking a proper personal name for a Latin verb.\n\nWhen auditing Line 3, check every uppercase label against the official Leipzig list. If a tag looks unfamiliar, verify it in the standard guidelines.\n\n**Takeaway:** AI models occasionally invent plausible but non-standard grammatical abbreviations, requiring human verification against standard Leipzig lists.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: AI Failure Mode 3: Hallucinated Grammatical Tags", "questiontext": "<p>What should an editor do when an AI model proposes an unfamiliar uppercase tag in Line 3?</p>", "generalfeedback": "<p>AI models occasionally invent plausible but non-standard grammatical abbreviations, requiring human verification against standard Leipzig lists.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verify the abbreviation against the official Leipzig Glossing Rules list and replace it if it is non-standard.</p>", "feedback": "<p>Correct. AI models occasionally invent plausible-sounding but non-existent tags; human verification against official lists is essential.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Assume the AI is smarter than all human linguists and accept the tag without checking.</p>", "feedback": "<p>Incorrect. Scholarly editing requires empirical verification, not blind trust.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the entire TEI document and drop out of university.</p>", "feedback": "<p>Incorrect. Catching and correcting AI mistakes is the core learning objective.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Change the tag to a random emoji symbol.</p>", "feedback": "<p>Incorrect. Scholarly XML avoids informal symbols.</p>"}]}}, {"step": 10, "title": "AI Failure Mode 4: Word Order and Pronoun Enclisis", "content": "**AI Failure Mode 4: Word Order and Pronoun Enclisis**\n\nIn historical languages, pronouns and clitics often attach to verbs in complex ways. In French, pronouns invert in questions and legal formulas (*dit-il*, *donnez-moi*).\n\nWhen an AI attempts word-by-word alignment:\n\n* It often stumbles on inverted pronouns.\n* It may gloss the verb correctly but drop the attached pronoun completely.\n* Or it might swap the order of the glosses, causing vertical columns to collapse.\n\nWatching for attached pronouns and clitics is essential when auditing Romance and Indigenous language alignments.\n\n**Takeaway:** Inverted pronouns, clitics, and irregular word orders frequently cause AI models to drop tokens or shift alignment columns.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: AI Failure Mode 4: Word Order and Pronoun Enclisis", "questiontext": "<p>Why do inverted pronouns and clitics in French (such as dit-il or donnez-moi) challenge AI word alignment?</p>", "generalfeedback": "<p>Inverted pronouns, clitics, and irregular word orders frequently cause AI models to drop tokens or shift alignment columns.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They alter standard word order and attach to verbs, causing models to drop pronouns or shift alignment columns.</p>", "feedback": "<p>Correct. Non-linear attachment and clitic inversion frequently cause generative models to lose column synchronization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because French pronouns were outlawed during the French Revolution.</p>", "feedback": "<p>Incorrect. Pronouns remained in active use in revolutionary decrees.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because pronouns have no grammatical meaning in Romance languages.</p>", "feedback": "<p>Incorrect. Pronouns carry essential person, number, and case information.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because clitics cannot be typed on a standard computer keyboard.</p>", "feedback": "<p>Incorrect. Clitics are standard alphabetic characters.</p>"}]}}, {"step": 11, "title": "The Three-Way Comparative Audit", "content": "**The Three-Way Comparative Audit**\n\nToday you will assemble all three versions of your text alignment side by side:\n\n1. **Version A (Tuesday Manual):** Your verified human gold standard.\n2. **Version B (Wednesday Deterministic):** Length-based Gale-Church algorithm.\n3. **Version C (Friday AI):** Neural model proposed links and glosses.\n\nIn VS Code, you can open three editor columns or compare files side by side. \n\nComparing all three versions simultaneously provides deep insight. You will see where simple mathematics succeeded, where neural models excelled, and where human judgment was required to resolve difficult passages.\n\n**Takeaway:** The three-way comparative audit compares manual, deterministic, and AI-assisted outputs side by side to reveal the unique profile of each method.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: The Three-Way Comparative Audit", "questiontext": "<p>What are the three components compared in Friday's three-way comparative audit?</p>", "generalfeedback": "<p>The three-way comparative audit compares manual, deterministic, and AI-assisted outputs side by side to reveal the unique profile of each method.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Version A (Tuesday Manual), Version B (Wednesday Deterministic), and Version C (Friday AI).</p>", "feedback": "<p>Correct. Comparing human baseline, mathematical algorithm, and neural model side by side reveals the unique strengths and limits of each approach.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>English, Spanish, and Italian print editions.</p>", "feedback": "<p>Incorrect. The audit compares three computational methods applied to the student's primary witness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Word, Excel, and PowerPoint files.</p>", "feedback": "<p>Incorrect. The files are TEI XML documents in the course repository.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Breakfast, lunch, and dinner menus.</p>", "feedback": "<p>Incorrect. The audit evaluates textual alignment data.</p>"}]}}, {"step": 12, "title": "Case Study: AI on Ace's 1791 French Decree", "content": "**Case Study: AI on Ace's 1791 French Decree**\n\nLet us examine how Claude and Gemini perform on Ace's 1791 French decree (*Loi relative à la fabrication des assignats*).\n\nKey findings from the AI test:\n\n* **Sentence Alignment:** Unlike the length formula, the AI easily recognized that the eighty-word sentence was split into two English sentences. It proposed a clean 1:2 link with 100% precision.\n* **Leipzig Glossing:** The AI successfully identified French grammatical gender (`F.SG` on *nationale*).\n* **Failure Point:** In Line 1, the AI silently removed the space in `L' Assemblée`, changing it to modern `L'Assemblée`. \n\nAce had to restore the historical spacing to keep Line 1 faithful to the 1791 print witness.\n\n**Takeaway:** AI models handle complex 1:2 sentence splits effortlessly, but they require oversight to preserve historical spacing and orthography.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Case Study: AI on Ace's 1791 French Decree", "questiontext": "<p>What was a major strength of the AI model when aligning Ace's French decree compared to Wednesday's length formula?</p>", "generalfeedback": "<p>AI models handle complex 1:2 sentence splits effortlessly, but they require oversight to preserve historical spacing and orthography.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It understood semantics and easily recognized that an eighty-word French legal sentence was split into two English sentences (a 1:2 split).</p>", "feedback": "<p>Correct. Neural AI models comprehend semantic meaning across clauses, handling complex structural splits effortlessly.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically printed paper assignat bank notes on Ace's desk.</p>", "feedback": "<p>Incorrect. The model processes digital text, not physical currency.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It refused to process any text written before 1800.</p>", "feedback": "<p>Incorrect. The model processed the 1791 revolutionary text successfully.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaced the French law with an American constitution clause.</p>", "feedback": "<p>Incorrect. The model aligned the authentic French decree text.</p>"}]}}, {"step": 13, "title": "Case Study: AI on Andromeda's 1752 Treaty", "content": "**Case Study: AI on Andromeda's 1752 Treaty**\n\nAndromeda tested the AI models on the formal legal clauses of the 1752 Peace and Friendship Treaty.\n\nResults from the treaty test:\n\n* **Sentence Alignment:** The AI successfully matched all numbered treaty articles. It also recognized formal preamble language that the length formula struggled with.\n* **Linguistic Glossing:** The AI accurately glossed modal auxiliaries (*shall* as `OBLIG` or `FUT`) and passive participles (*renew-ed* as `renew-PST.PTCP`).\n* **Failure Point:** In Line 3, the AI glossed archaic colonial spellings by inventing fake Latin root names.\n\nAndromeda corrected the roots to plain English vocabulary (*agree*, *treaty*, *peace*).\n\n**Takeaway:** AI models excel at analyzing formal treaty syntax and passive verbs, but editors must ensure roots remain in accessible English.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Case Study: AI on Andromeda's 1752 Treaty", "questiontext": "<p>What failure mode did Andromeda catch when testing AI models on the 1752 Peace and Friendship Treaty?</p>", "generalfeedback": "<p>AI models excel at analyzing formal treaty syntax and passive verbs, but editors must ensure roots remain in accessible English.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The AI attempted to invent fake Latin root names for archaic colonial English spellings in Line 3.</p>", "feedback": "<p>Correct. Andromeda intervened to replace the hallucinated roots with standard, accessible English vocabulary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI deleted all references to the province of Nova Scotia.</p>", "feedback": "<p>Incorrect. The AI preserved place names but struggled with lexical root naming.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI translated the treaty into modern computer programming code.</p>", "feedback": "<p>Incorrect. The model produced linguistic glosses, but with classical hallucinations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI refused to open the file because it was too peaceful.</p>", "feedback": "<p>Incorrect. Models process treaty texts without ideological objections.</p>"}]}}, {"step": 14, "title": "Case Study: AI on Olyvia's Maud Lewis Letters", "content": "**Case Study: AI on Olyvia's Maud Lewis Letters**\n\nOlyvia prompted the AI to align Maud Lewis's 1967 personal letters with a parallel modern French translation.\n\nObservations from the folk art test:\n\n* **Informal Syntax:** The AI easily handled Maud's conversational clauses without getting confused by missing periods.\n* **Dialectal Nuance:** The AI recognized regional Maritime expressions (such as *was glad to hear*) and produced an idiomatic French translation.\n* **Failure Point:** The AI attempted to \"correct\" Maud's grammar in Line 1, replacing her colloquial phrasing with formal prose.\n\nOlyvia rejected the AI's grammatical corrections, preserving Maud Lewis's authentic voice as an artist.\n\n**Takeaway:** While AI translates vernacular English smoothly, editors must protect the authentic voice of personal correspondence from AI over-correction.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Case Study: AI on Olyvia's Maud Lewis Letters", "questiontext": "<p>Why did Olyvia reject the AI's grammatical alterations in Line 1 of her Maud Lewis letter gloss?</p>", "generalfeedback": "<p>While AI translates vernacular English smoothly, editors must protect the authentic voice of personal correspondence from AI over-correction.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The AI attempted to \"correct\" Maud Lewis's informal conversational phrasing into formal prose, erasing her authentic artistic voice.</p>", "feedback": "<p>Correct. Human editors must protect historical and vernacular voices from AI normalization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Maud Lewis requested that no computers ever read her writing.</p>", "feedback": "<p>Incorrect. Maud Lewis passed away in 1970 before personal computers existed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the AI refused to generate a French translation.</p>", "feedback": "<p>Incorrect. The AI generated a translation, but over-corrected the source text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because personal letters are not allowed to contain verbs.</p>", "feedback": "<p>Incorrect. Letters naturally contain verbs and expressive language.</p>"}]}}, {"step": 15, "title": "Measuring AI Performance: A Three-Way Scorecard", "content": "**Measuring AI Performance: A Three-Way Scorecard**\n\nTo complete your comparative audit, build a summary scorecard in your notes:\n\n<table>\n  <thead>\n    <tr>\n      <th style=\"width: 25%;\">Evaluation Metric</th>\n      <th style=\"width: 25%;\">Manual (Tue)</th>\n      <th style=\"width: 25%;\">Deterministic (Wed)</th>\n      <th style=\"width: 25%;\">AI-Assisted (Fri)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Sentence Precision</strong></td>\n      <td>100% (Gold Standard)</td>\n      <td>85% – 95% (Shift on splits)</td>\n      <td>95% – 100% (Handles splits)</td>\n    </tr>\n    <tr>\n      <td><strong>Execution Speed</strong></td>\n      <td>Slow (45 mins)</td>\n      <td>Instant (1 second)</td>\n      <td>Fast (10 seconds)</td>\n    </tr>\n    <tr>\n      <td><strong>Grammar Depth</strong></td>\n      <td>High (Careful glosses)</td>\n      <td>None (Length only)</td>\n      <td>High (Needs Rule 2 audit)</td>\n    </tr>\n    <tr>\n      <td><strong>Orthographic Fidelity</strong></td>\n      <td>100% (Exact witness)</td>\n      <td>100% (Unchanged)</td>\n      <td>85% (Biased toward modern)</td>\n    </tr>\n  </tbody>\n</table>\n\nThis scorecard clearly shows the trade-offs of each method.\n\n**Takeaway:** A comparative scorecard documents precision, speed, depth, and orthographic fidelity across all three alignment approaches.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Measuring AI Performance: A Three-Way Scorecard", "questiontext": "<p>According to our three-way evaluation scorecard, what is a primary trade-off of neural AI models compared to manual editing?</p>", "generalfeedback": "<p>A comparative scorecard documents precision, speed, depth, and orthographic fidelity across all three alignment approaches.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>AI is dramatically faster and grammatically capable, but has lower orthographic fidelity due to modern spelling biases.</p>", "feedback": "<p>Correct. AI models process text in seconds but require vigilant auditing to prevent silent modernization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>AI models are completely free of all errors and require zero human checking.</p>", "feedback": "<p>Incorrect. AI models frequently make subtle errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Manual editing is ten times faster than running a computer algorithm.</p>", "feedback": "<p>Incorrect. Manual editing is slow and deliberate.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deterministic tools produce more hallucinations than generative AI models.</p>", "feedback": "<p>Incorrect. Deterministic tools follow fixed formulas and never hallucinate.</p>"}]}}, {"step": 16, "title": "Synthesizing the Reconciled Alignment File", "content": "**Synthesizing the Reconciled Alignment File**\n\nNow you will create your final alignment deliverable: `alignment_reconciled.xml`.\n\nHow to synthesize your reconciled file:\n\n1. Start with your clean TEI document structure.\n2. Adopt the sentence pairings that were verified across both manual and AI runs.\n3. Where the AI proposed a better handling of a 1:2 split, adopt the AI's link.\n4. Where the AI hallucinated or modernized spelling, enforce your manual ground truth.\n5. Ensure all `xml:id` targets and `#` hash marks are valid and well-formed.\n\nThis synthesized file represents the best of human expertise and computational assistance.\n\n**Takeaway:** The reconciled alignment file merges the speed of AI suggestions with the rigorous fidelity of human ground truth.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Synthesizing the Reconciled Alignment File", "questiontext": "<p>What is the final deliverable synthesized from your alignment audit, and what does it represent?</p>", "generalfeedback": "<p>The reconciled alignment file merges the speed of AI suggestions with the rigorous fidelity of human ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>alignment_reconciled.xml, representing the optimal combination of computational speed and human scholarly fidelity.</p>", "feedback": "<p>Correct. The reconciled file adopts verified AI structural links while enforcing human ground truth on difficult historical phrasing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A handwritten paper letter mailed to the university president.</p>", "feedback": "<p>Incorrect. The deliverable is a validated TEI XML file in the repository.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An audio recording of the student reading the translation out loud.</p>", "feedback": "<p>Incorrect. That is a spoken reading, not a TEI alignment file.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A blank text file with no content.</p>", "feedback": "<p>Incorrect. The file contains a complete, verified &lt;linkGrp&gt; structure.</p>"}]}}, {"step": 17, "title": "Synthesizing Reconciled Leipzig Glosses", "content": "**Synthesizing Reconciled Leipzig Glosses**\n\nNext, create your final gloss deliverable: `gloss_reconciled.xml`.\n\nSteps for the reconciled gloss:\n\n* Select three rich, representative sentences from your primary witness.\n* Check Line 1 letter-by-letter against your facsimile image to guarantee 100% historical authenticity.\n* Verify Line 2 morpheme hyphens.\n* Verify Line 3 uppercase grammatical labels and ensure periods are used for portmanteaux.\n* Polish Line 4 to ensure the modern English translation is natural, fluent, and placed in quotation marks.\n\nYour completed gloss stands as a permanent contribution to digital philology.\n\n**Takeaway:** The reconciled gloss file delivers three verified, publication-ready Leipzig glosses that combine historical accuracy with linguistic precision.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Synthesizing Reconciled Leipzig Glosses", "questiontext": "<p>What verification step is essential before finalizing gloss_reconciled.xml?</p>", "generalfeedback": "<p>The reconciled gloss file delivers three verified, publication-ready Leipzig glosses that combine historical accuracy with linguistic precision.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Checking Line 1 letter-by-letter against the high-resolution facsimile image to guarantee authentic historical spelling.</p>", "feedback": "<p>Correct. Checking the digital image ensures that no automated modernization or OCR slips survived into the publication-ready gloss.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all quotation marks from Line 4.</p>", "feedback": "<p>Incorrect. Line 4 translations must be enclosed in quotation marks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replacing all hyphens with exclamation marks.</p>", "feedback": "<p>Incorrect. Hyphens are required for morpheme boundaries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Converting all text into twelve-point Comic Sans font.</p>", "feedback": "<p>Incorrect. Scholarly editions use clean UTF-8 text encoding.</p>"}]}}, {"step": 18, "title": "TEI Header Attribution for AI Assistance", "content": "**TEI Header Attribution for AI Assistance**\n\nScholarly integrity requires total transparency about computational tools. If an AI model assisted in generating alignments or glosses, that assistance must be documented in the `<teiHeader>`.\n\nIn your TEI header, add a `<change>` record inside `<revisionDesc>`:\n\n```xml\n<revisionDesc>\n  <change when=\"2026-11-20\" who=\"#ken\" resp=\"#ai\">\n    Sentence alignment audited against Gale-Church and Claude AI. \n    AI suggestions adopted for 1:2 splits; historical surface text verified by hand.\n  </change>\n</revisionDesc>\n```\n\nYou can also use the `@resp` attribute on individual `<linkGrp>` or `<link>` elements (`resp=\"#ai\"` or `resp=\"#manual\"`).\n\nTransparency builds trust with your readers and peers.\n\n**Takeaway:** Transparent TEI header documentation explicitly records AI assistance, detailing which suggestions were adopted and who verified the text.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: TEI Header Attribution for AI Assistance", "questiontext": "<p>How is AI assistance ethically and transparently recorded in a TEI XML document?</p>", "generalfeedback": "<p>Transparent TEI header documentation explicitly records AI assistance, detailing which suggestions were adopted and who verified the text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By adding a &lt;change&gt; element in &lt;revisionDesc&gt; with @resp=\"#ai\" detailing which suggestions were adopted and verified.</p>", "feedback": "<p>Correct. Documenting AI contributions in the teiHeader ensures full scholarly transparency and attribution.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By hiding all references to computers so readers think the editor is a genius.</p>", "feedback": "<p>Incorrect. Hiding AI contributions violates academic integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the &lt;teiHeader&gt; entirely from the document.</p>", "feedback": "<p>Incorrect. The teiHeader is the mandatory cataloguing core of any TEI edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By sending an anonymous letter to the Text Encoding Initiative.</p>", "feedback": "<p>Incorrect. Attribution is recorded directly within the document metadata.</p>"}]}}, {"step": 19, "title": "Validating Reconciled XML in VS Code", "content": "**Validating Reconciled XML in VS Code**\n\nBefore saving your final files, run a complete validation check inside Visual Studio Code:\n\n1. Open `alignment_reconciled.xml` and `gloss_reconciled.xml`.\n2. Inspect the bottom status bar for XML errors. Ensure it displays \"No Problems.\"\n3. Run `xmllint --noout` in your VS Code terminal to verify well-formed syntax.\n4. Verify that every sentence ID inside `<standOff>` points to an existing `<s xml:id=\"...\">` tag.\n\nA document that fails validation cannot be rendered or published. Taking two minutes to validate guarantees your work is sound.\n\n**Takeaway:** Always run xmllint and editor validation checks to ensure reconciled alignment files are well-formed and schema-compliant.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Validating Reconciled XML in VS Code", "questiontext": "<p>Which command-line utility is run in the VS Code terminal to verify that reconciled alignment XML has zero well-formedness errors?</p>", "generalfeedback": "<p>Always run xmllint and editor validation checks to ensure reconciled alignment files are well-formed and schema-compliant.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>xmllint --noout</p>", "feedback": "<p>Correct. xmllint --noout parses the file and reports any syntax errors without cluttering the screen with text output.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>git push --force</p>", "feedback": "<p>Incorrect. git push transfers files to GitHub; it does not validate XML syntax.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>rm -rf /</p>", "feedback": "<p>Incorrect. That dangerous command deletes files from the operating system.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>python -m http.server</p>", "feedback": "<p>Incorrect. That launches a local web server, not an XML parser.</p>"}]}}, {"step": 20, "title": "Documenting Methodology in ALIGNMENT.md", "content": "**Documenting Methodology in ALIGNMENT.md**\n\nEvery scholarly edition includes an editorial methodology report. In your project repository, open `ALIGNMENT.md` and complete the final section:\n\nInclude the following sections:\n\n* **The Corpus:** Description of your primary witness and parallel translation.\n* **The Manual Baseline:** Summary of your Tuesday 10-sentence hand alignment.\n* **Deterministic Evaluation:** Gale-Church accuracy, precision, recall, and abbreviation traps.\n* **AI Evaluation:** AI model used, prompt design, strengths, and failure modes (modernization, Rule 2 errors).\n* **Editorial Synthesis:** Rationale for your final reconciled decisions.\n\nThis report documents your intellectual journey across the three-step cycle.\n\n**Takeaway:** The ALIGNMENT.md report provides a complete scholarly record of your corpus, methodology, metrics, and editorial synthesis.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Documenting Methodology in ALIGNMENT.md", "questiontext": "<p>What is the scholarly purpose of the ALIGNMENT.md file in your project repository?</p>", "generalfeedback": "<p>The ALIGNMENT.md report provides a complete scholarly record of your corpus, methodology, metrics, and editorial synthesis.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To provide an editorial methodology report documenting your corpus, baseline metrics, algorithmic evaluations, and synthesis rationale.</p>", "feedback": "<p>Correct. ALIGNMENT.md gives readers and peer reviewers full transparency into how the edition was constructed and audited.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To store secret passwords for classroom Wi-Fi networks.</p>", "feedback": "<p>Incorrect. ALIGNMENT.md is an academic documentation report.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To list the student's daily cafeteria expenses.</p>", "feedback": "<p>Incorrect. The report focuses strictly on textual scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To replace the primary manuscript transcription.</p>", "feedback": "<p>Incorrect. It accompanies the XML edition as an explanatory methodology document.</p>"}]}}, {"step": 21, "title": "Building Bilingual Reading Interfaces", "content": "**Building Bilingual Reading Interfaces**\n\nWhy did we do all this alignment work? What does it look like to the public reader?\n\nWhen your edition is published on the web:\n\n* A reader can view your historical witness and English translation in parallel columns.\n* Clicking any historical sentence highlights the corresponding English sentence instantly.\n* Hovering over a glossed word reveals its Leipzig grammatical breakdown and dictionary definition.\n* Scholars can search for specific grammatical forms (such as all occurrences of past subjunctive verbs) across the bilingual corpus.\n\nAlignment transforms static manuscripts into dynamic, interactive reading environments.\n\n**Takeaway:** Sentence alignment and interlinear glossing power dynamic web interfaces with sentence highlighting, word hovers, and cross-lingual search.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Building Bilingual Reading Interfaces", "questiontext": "<p>How does standoff sentence alignment enhance the public reading experience on a scholarly website?</p>", "generalfeedback": "<p>Sentence alignment and interlinear glossing power dynamic web interfaces with sentence highlighting, word hovers, and cross-lingual search.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows interactive interfaces to highlight corresponding sentences when clicked and provide word-level grammatical popups.</p>", "feedback": "<p>Correct. Standoff links enable dynamic, synchronized reading views, hover definitions, and cross-lingual search.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents users from reading the text on mobile phones.</p>", "feedback": "<p>Incorrect. Web editions are designed to be responsive across devices.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces all text with video advertisements.</p>", "feedback": "<p>Incorrect. Scholarly editions prioritize clean, accessible reading.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires readers to pass a Latin exam before opening the website.</p>", "feedback": "<p>Incorrect. Digital alignment makes historical texts accessible to non-specialists.</p>"}]}}, {"step": 22, "title": "Connecting Alignment to the Semester Portfolio", "content": "**Connecting Alignment to the Semester Portfolio**\n\nLet us look at how Module 11 fits into your overall term portfolio:\n\n* **Module 2:** Codicological cataloguing and TEI header.\n* **Module 3:** Facsimile images and IIIF canvases.\n* **Module 4 & 5:** Diplomatic transcription and AI reconciliation.\n* **Module 6:** Regularization and normalized reading text.\n* **Module 7:** CSS and HTML rendering views.\n* **Module 8 & 9:** Linguistic lemmatization and named entity markup.\n* **Module 10:** Git consolidation, CI/CD, and peer review.\n* **Module 11 (Today):** Bilingual translation alignment and Leipzig glossing.\n\nYour digital edition is now nearly complete! You have constructed an edition with deep scholarly metadata and bilingual accessibility.\n\n**Takeaway:** Module 11 provides the bilingual translation and linguistic glossing layer of your comprehensive digital edition portfolio.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Connecting Alignment to the Semester Portfolio", "questiontext": "<p>What role does Module 11 (Alignment) play within your comprehensive semester digital edition?</p>", "generalfeedback": "<p>Module 11 provides the bilingual translation and linguistic glossing layer of your comprehensive digital edition portfolio.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It adds the bilingual translation and linguistic glossing layer, making the historical witness accessible to modern readers.</p>", "feedback": "<p>Correct. Module 11 connects transcription, metadata, and stylesheets to parallel translation and morphological analysis.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces all previous ten modules so you can throw them away.</p>", "feedback": "<p>Incorrect. Each module builds an incremental layer of the final edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It serves as an optional extra-credit exercise that will not be graded.</p>", "feedback": "<p>Incorrect. Module 11 is a core graded milestone of the course.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes your teiHeader to simplify the final submission.</p>", "feedback": "<p>Incorrect. The teiHeader remains essential to the complete portfolio.</p>"}]}}, {"step": 23, "title": "Ethical Considerations in AI Philology", "content": "**Ethical Considerations in AI Philology**\n\nUsing AI in historical textual scholarship introduces important ethical responsibilities:\n\n* **Attribution:** Never pretend AI output was produced entirely by your own hand.\n* **Historical Accuracy:** Never allow an AI model to smooth over historical prejudice, difficult syntax, or archaic vocabulary.\n* **Indigenous Contexts:** In treaty scholarship, translations carry real legal and political weight. AI models must never alter treaty meanings without indigenous consultation.\n* **Preserving Student Voice:** Use AI as an editorial assistant, not as a replacement for your own critical thinking.\n\nEthical scholarship prioritizes historical truth and transparent human accountability.\n\n**Takeaway:** Ethical digital scholarship requires honest attribution, preservation of difficult historical truths, and active human accountability.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Ethical Considerations in AI Philology", "questiontext": "<p>What is a critical ethical rule when using AI to analyze historical treaties and legal documents?</p>", "generalfeedback": "<p>Ethical digital scholarship requires honest attribution, preservation of difficult historical truths, and active human accountability.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>AI models must never be allowed to silently alter legal obligations or smooth over historical colonial realities without human scrutiny.</p>", "feedback": "<p>Correct. In treaty and legal scholarship, every word carries historical and political weight that requires transparent human accountability.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>AI models should be allowed to rewrite treaties to make them sound friendlier.</p>", "feedback": "<p>Incorrect. Historical editing preserves authentic historical evidence, not sanitized rewrites.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translators must hide all references to historical treaties from the public.</p>", "feedback": "<p>Incorrect. Digital scholarship aims for open public access and truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Editors must delete all words that are difficult to pronounce.</p>", "feedback": "<p>Incorrect. Scholarly fidelity preserves historical linguistic complexity.</p>"}]}}, {"step": 24, "title": "Git Hygiene: Staging and Committing Module 11", "content": "**Git Hygiene: Staging and Committing Module 11**\n\nWith your alignment files reconciled and verified, it is time to record your work in Git.\n\nOpen your VS Code terminal and run clean, disciplined Git commands:\n\n1. Check repository status: `git status`\n2. Stage your Module 11 deliverables: `git add alignment_reconciled.xml gloss_reconciled.xml ALIGNMENT.md`\n3. Commit with a meaningful commit message: `git commit -m \"Module 11: complete three-way alignment audit and synthesize reconciled TEI files\"`\n4. Push to your GitHub remote: `git push origin main`\n\nDisciplined version control ensures your hard work is backed up and safe on the cloud.\n\n**Takeaway:** Stage and commit your reconciled alignment files with descriptive commit messages, pushing your progress safely to GitHub.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Git Hygiene: Staging and Committing Module 11", "questiontext": "<p>What is the correct Git workflow for safely recording your completed Module 11 deliverables?</p>", "generalfeedback": "<p>Stage and commit your reconciled alignment files with descriptive commit messages, pushing your progress safely to GitHub.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Check git status, stage files with git add, commit with a descriptive message, and push to origin main.</p>", "feedback": "<p>Correct. Disciplined git staging, committing, and pushing ensures your work is tracked and backed up safely on GitHub.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the .git folder and re-initialize the repository every Friday.</p>", "feedback": "<p>Incorrect. Deleting .git destroys version history and remote tracking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Email your XML files to yourself as attachments and ignore Git completely.</p>", "feedback": "<p>Incorrect. RELS 398 teaches professional Git and GitHub collaborative workflows.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Shut down your computer without saving and hope the cloud remembers.</p>", "feedback": "<p>Incorrect. You must explicitly stage and commit files locally before pushing.</p>"}]}}, {"step": 25, "title": "Common Novice Pitfalls in AI Alignment", "content": "**Common Novice Pitfalls in AI Alignment**\n\nAs you finalize your work today, beware of these four common AI pitfalls:\n\n1. **Accepting AI Modernization:** Failing to notice that the AI changed an 18th-century spelling into modern English in Line 1.\n2. **Ignoring Leipzig Rule 2:** Leaving hyphens in Line 3 where periods are required for fused grammatical categories.\n3. **Conversational AI Chatter in XML:** Forgetting to remove introductory AI text like *\"Here is your TEI XML file:\"* before saving.\n4. **Unbalanced Line Counts:** Submitting a gloss where Line 1 has four words but Line 2 has five words.\n\nA careful final pass in VS Code will catch all four errors.\n\n**Takeaway:** Common AI alignment errors include silent spelling modernization, Rule 2 hyphen confusion, leftover conversational text, and unbalanced columns.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Common Novice Pitfalls in AI Alignment", "questiontext": "<p>What simple visual check should you always perform on AI-generated Leipzig glosses before submitting them?</p>", "generalfeedback": "<p>Common AI alignment errors include silent spelling modernization, Rule 2 hyphen confusion, leftover conversational text, and unbalanced columns.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verify that Line 1 has not been modernized and that every word column aligns vertically across all four lines.</p>", "feedback": "<p>Correct. Checking column balance and historical spelling prevents common AI generative shifts from slipping into your edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Check that the text is printed on parchment paper.</p>", "feedback": "<p>Incorrect. Deliverables are digital XML files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Verify that every word begins with the letter Z.</p>", "feedback": "<p>Incorrect. Words follow historical orthography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ensure that all punctuation marks have been deleted.</p>", "feedback": "<p>Incorrect. Punctuation carries essential syntactic and Leipzig meaning.</p>"}]}}, {"step": 26, "title": "The Role of Human Judgment in Digital Philology", "content": "**The Role of Human Judgment in Digital Philology**\n\nThis week has demonstrated a profound truth of digital humanities scholarship.\n\nNo algorithm—whether a 1993 mathematical formula or a 2026 neural network—can replace human historical understanding:\n\n* An algorithm can count letters.\n* An AI can predict likely grammar tags.\n* Only a human scholar understands the cultural context, emotional nuance, and political consequences of historical writing.\n\nComputers provide speed and scale. Humans provide judgment, empathy, and truth.\n\n**Takeaway:** Computational tools provide speed and scale, but human scholars provide the critical judgment and historical empathy that define scholarly editions.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: The Role of Human Judgment in Digital Philology", "questiontext": "<p>Why will artificial intelligence never replace human scholars in digital critical editing?</p>", "generalfeedback": "<p>Computational tools provide speed and scale, but human scholars provide the critical judgment and historical empathy that define scholarly editions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Computers provide speed and pattern detection, but only human scholars provide historical empathy, cultural context, and critical judgment.</p>", "feedback": "<p>Correct. True textual scholarship requires interpretive wisdom and historical responsibility that algorithms cannot possess.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computers will eventually run out of numbers to calculate.</p>", "feedback": "<p>Incorrect. Computers have limitless mathematical capacity, but lack human understanding.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because human scholars can type faster than computer microchips.</p>", "feedback": "<p>Incorrect. Computers process data exponentially faster than human typing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because digital editions will be completely banned in the future.</p>", "feedback": "<p>Incorrect. Digital scholarly editions are the future of textual humanities.</p>"}]}}, {"step": 27, "title": "Reviewing the Week 11 Milestone Checklist", "content": "**Reviewing the Week 11 Milestone Checklist**\n\nBefore leaving class today, verify that you have completed all deliverables for Module 11:\n\n* [x] **Tuesday:** Hand-aligned 10 sentences (`alignment_manual.xml`) and authored 3 Leipzig glosses (`gloss_manual.xml`).\n* [x] **Wednesday:** Ran automated Gale-Church alignment and audited precision/recall (`alignment_deterministic.xml`).\n* [x] **Friday:** Prompted AI in VS Code, conducted three-way comparative audit, and synthesized `alignment_reconciled.xml` and `gloss_reconciled.xml`.\n* [x] **Methodology Report:** Documented metrics and reflection in `ALIGNMENT.md`.\n* [x] **Validation:** All XML files pass `xmllint --noout` with zero errors.\n\nChecking off these items confirms you have mastered bilingual text alignment.\n\n**Takeaway:** Verifying all five milestone deliverables ensures your repository meets professional standards for bilingual digital scholarship.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Reviewing the Week 11 Milestone Checklist", "questiontext": "<p>Which set of files constitutes the complete deliverable suite for Module 11?</p>", "generalfeedback": "<p>Verifying all five milestone deliverables ensures your repository meets professional standards for bilingual digital scholarship.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>alignment_manual.xml, gloss_manual.xml, alignment_deterministic.xml, alignment_reconciled.xml, gloss_reconciled.xml, and ALIGNMENT.md.</p>", "feedback": "<p>Correct. These files document the complete progression from manual ground truth to algorithmic testing, AI auditing, and reconciled synthesis.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A single empty text file named homework.txt.</p>", "feedback": "<p>Incorrect. Module 11 produces comprehensive TEI XML and methodology files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A collection of selfie photos taken in the university library.</p>", "feedback": "<p>Incorrect. Deliverables consist of digital philology datasets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A printed textbook purchased from the university bookstore.</p>", "feedback": "<p>Incorrect. Students build their own original digital editions.</p>"}]}}, {"step": 28, "title": "Preparing for Next Week: Module 12 (Scholarly Commentary)", "content": "**Preparing for Next Week: Module 12 (Scholarly Commentary)**\n\nNext week, we move into **Module 12: Scholarly Commentary and Annotation**.\n\nNow that your text is transcribed, regularized, lemmatized, aligned, and glossed, you are ready to write scholarly commentary:\n\n* Explaining historical context, people, and legal debates.\n* Linking passages to external historical archives and encyclopedias.\n* Encoding scholarly annotations using TEI `<note>`, `<annotation>`, and the Open Annotation Data Model.\n\nYour edition is growing from a raw manuscript into a rich, interactive educational resource.\n\n**Takeaway:** Module 12 builds upon text alignment by introducing scholarly commentary notes and linked historical annotations.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Preparing for Next Week: Module 12 (Scholarly Commentary)", "questiontext": "<p>What new dimension will Module 12 add to your digital edition next week?</p>", "generalfeedback": "<p>Module 12 builds upon text alignment by introducing scholarly commentary notes and linked historical annotations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Scholarly commentary notes, historical explanations, and linked annotations using TEI &lt;note&gt; and &lt;annotation&gt;.</p>", "feedback": "<p>Correct. Module 12 builds upon alignment by contextualizing historical passages with scholarly commentary and linked data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all transcriptions and replacing them with video games.</p>", "feedback": "<p>Incorrect. Module 12 enhances your existing transcription with commentary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Switching to a completely different language for the rest of the semester.</p>", "feedback": "<p>Incorrect. You continue refining your chosen primary document.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Abandoning XML to write essays by hand with quill pens.</p>", "feedback": "<p>Incorrect. The course continues in VS Code with advanced TEI annotation standards.</p>"}]}}, {"step": 29, "title": "Peer Review and Classroom Discussion", "content": "**Peer Review and Classroom Discussion**\n\nTake five minutes to look at your neighbor's screen in MULH 3032:\n\n* Compare how Ace's French decree handles gender agreement compared to Andromeda's English treaty verbs.\n* Look at Olyvia's Maud Lewis glosses and discuss how vernacular handwriting challenges AI translation models.\n* Share one interesting AI mistake you caught during today's lab.\n\nDiscussing computational errors with your peers transforms mistakes into valuable learning moments.\n\n**Takeaway:** Sharing alignment challenges and AI failure modes with peers deepens your collective understanding of digital philology.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Peer Review and Classroom Discussion", "questiontext": "<p>Why is comparing computational errors with your peers in class valuable?</p>", "generalfeedback": "<p>Sharing alignment challenges and AI failure modes with peers deepens your collective understanding of digital philology.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It transforms computational mistakes into collective learning moments, revealing how different genres challenge algorithms.</p>", "feedback": "<p>Correct. Discussing discrepancies across French decrees, treaties, and letters deepens understanding of linguistic diversity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows students to copy each other's homework without doing any work.</p>", "feedback": "<p>Incorrect. Peer discussion fosters collaborative learning, not academic dishonesty.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves which student is the worst editor in the class.</p>", "feedback": "<p>Incorrect. Collaborative editing is supportive and constructive.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is an official requirement of the Canadian postal service.</p>", "feedback": "<p>Incorrect. It is a classroom pedagogical practice in digital humanities.</p>"}]}}, {"step": 30, "title": "Conclusion: Mastery of the Three-Step Cycle", "content": "**Conclusion: Mastery of the Three-Step Cycle**\n\nCongratulations on completing Module 11!\n\nThis week you achieved a major milestone:\n\n* You practiced manual scholarship, experiencing the intellectual discipline of word-by-word glossing.\n* You explored deterministic algorithms, demystifying how computers calculate sentence correspondence.\n* You supervised generative AI, discovering its incredible linguistic power and learning to catch its subtle errors.\n\nYou have proven that you can harness modern technology while upholding the highest standards of historical scholarship.\n\n**Takeaway:** Mastering the Three-Step Comparative Cycle empowers you to lead digital humanities research with computational skill and critical human judgment.", "html": null, "image_b64": null, "question": {"name": "30 Question: Conclusion: Mastery of the Three-Step Cycle", "questiontext": "<p>What core capability have you mastered by completing the Three-Step Comparative Cycle for text alignment?</p>", "generalfeedback": "<p>Mastering the Three-Step Comparative Cycle empowers you to lead digital humanities research with computational skill and critical human judgment.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The ability to harness automated algorithms and artificial intelligence while maintaining rigorous human philological oversight.</p>", "feedback": "<p>Correct. Mastering manual, deterministic, and AI methods allows you to lead digital textual scholarship with technical power and critical wisdom.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The ability to memorize the entire Oxford English Dictionary.</p>", "feedback": "<p>Incorrect. The course teaches digital methods, not dictionary memorization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The power to predict tomorrow's winning lottery numbers.</p>", "feedback": "<p>Incorrect. Digital philology evaluates textual data, not gambling odds.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The skill to repair broken computer hardware with a screwdriver.</p>", "feedback": "<p>Incorrect. The course focuses on digital text encoding and humanities methodology.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
