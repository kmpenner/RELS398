    <script>
        const lessonData = {"course_title": "Lesson 11.1: Aligning Translation Sentences and Authoring Interlinear Glosses by Hand", "subtitle": "Manual Sentence Alignment & Leipzig Glossing by Hand", "total_sections": 30, "slides": [{"step": 1, "title": "Why Align Texts in a Digital Edition?", "content": "**Why Align Texts in a Digital Edition?**\n\nIn a printed book, translations usually sit on a facing page. Readers must look back and forth across the gutter. You must guess which English phrase matches each historical word. If the translator reorders sentences, the connection becomes confusing. Printed pages cannot show exact word links.\n\nDigital editions solve this problem through **translation alignment**. Alignment creates explicit, clickable links between a source text and its translation. Instead of guessing, readers can click any historical sentence to see its modern translation. \n\nAlignment also holds editors accountable. Translators sometimes skip difficult phrases or smooth over strange grammar. When you link every sentence directly, all editorial decisions become visible. Nothing is hidden from the reader.\n\nToday you begin the three-step comparative cycle for text alignment. Today you will align sentences and words completely by hand. Your manual work will create the gold standard for testing automated tools tomorrow.\n\n**Takeaway:** Digital alignment replaces guesswork with explicit links, connecting historical sentences directly to their modern translations.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: Why Align Texts in a Digital Edition?", "questiontext": "<p>Why is digital translation alignment superior to traditional facing-page print layouts?</p>", "generalfeedback": "<p>Digital alignment replaces guesswork with explicit links, connecting historical sentences directly to their modern translations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It creates explicit, machine-readable links connecting historical sentences directly to their modern translations.</p>", "feedback": "<p>Correct. Digital alignment eliminates guesswork by providing clickable, explicit connections between source sentences and modern translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically translates historical documents into modern slang without human oversight.</p>", "feedback": "<p>Incorrect. Alignment links verified human translations to their historical sources rather than generating unverified slang.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the original historical language so readers only see modern English.</p>", "feedback": "<p>Incorrect. Digital editions preserve both the original historical witness and the translation side by side.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts all manuscripts into physical paper facsimiles to avoid digital screens.</p>", "feedback": "<p>Incorrect. Alignment is a computational method designed specifically for digital reading environments.</p>"}]}}, {"step": 2, "title": "What is a Parallel Bitext?", "content": "**What is a Parallel Bitext?**\n\nIn computational humanities, two connected language versions are called a **bitext**. A bitext is not simply two files stored in the same folder. It is a single data structure that links two texts together.\n\nEvery bitext contains two distinct parts:\n\n* **The Source Text:** The historical document in its original language (such as French, Latin, or 18th-century English).\n* **The Target Text:** The translation or modern reading version (usually modern English).\n\n<table>\n  <thead>\n    <tr>\n      <th style=\"width: 25%;\">Edition Type</th>\n      <th style=\"width: 40%;\">How Texts Are Stored</th>\n      <th style=\"width: 35%;\">Reader Experience</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Monolingual</strong></td>\n      <td>One text file in one language.</td>\n      <td>Readers see only original words.</td>\n    </tr>\n    <tr>\n      <td><strong>Facing-Page Print</strong></td>\n      <td>Two static pages side by side.</td>\n      <td>Readers visually hunt for matches.</td>\n    </tr>\n    <tr>\n      <td><strong>Digital Bitext</strong></td>\n      <td>Two text streams linked by explicit IDs.</td>\n      <td>Readers click to inspect linked pairs.</td>\n    </tr>\n  </tbody>\n</table>\n\nWhen you build a bitext, you map historical meaning across language boundaries. You show exactly how historical expressions translate into contemporary terms.\n\n**Takeaway:** A bitext is a paired data structure linking an original source text to its translation through explicit digital connections.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: What is a Parallel Bitext?", "questiontext": "<p>What defines a parallel bitext in digital humanities and computational philology?</p>", "generalfeedback": "<p>A bitext is a paired data structure linking an original source text to its translation through explicit digital connections.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A paired data structure linking an original source text to its translation through explicit digital connections.</p>", "feedback": "<p>Correct. A bitext consists of a source text and a target translation joined together by formal digital links.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A single text file that contains only English vocabulary without any historical witness.</p>", "feedback": "<p>Incorrect. A bitext always requires two language streams linked together.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Two completely unrelated books stored in separate archives that share no common themes.</p>", "feedback": "<p>Incorrect. A bitext pairs an original historical text with its corresponding translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A physical printing press capable of printing two colors of ink at the same time.</p>", "feedback": "<p>Incorrect. Bitext is a computational data concept, not a printing press mechanism.</p>"}]}}, {"step": 3, "title": "The Novice Setup in VS Code: Split Editor", "content": "**The Novice Setup in VS Code: Split Editor**\n\nBecause you are working by hand today, Visual Studio Code offers a helpful visual feature. You do not need to switch back and forth between tabs. Instead, you can view both files side by side.\n\nTo set up a side-by-side view in VS Code:\n\n1. Open your source file (for example, `source_transcription.xml`).\n2. Go to the top menu bar and select **View > Editor Layout > Two Columns**.\n3. You can also press `Cmd+\\` on macOS or `Ctrl+\\` on Windows.\n4. Drag your translation file (such as `translation_english.xml`) into the right pane.\n\nNow you have your historical text on the left and your English translation on the right. You can scroll through both files simultaneously.\n\nThis visual arrangement prevents mental fatigue. It allows you to inspect sentence boundaries and verify correspondences before typing any markup.\n\n**Takeaway:** Using a two-column split editor in VS Code lets you inspect source texts and translations side by side without switching tabs.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Novice Setup in VS Code: Split Editor", "questiontext": "<p>How do you view your source text and translation side by side in Visual Studio Code without switching tabs?</p>", "generalfeedback": "<p>Using a two-column split editor in VS Code lets you inspect source texts and translations side by side without switching tabs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Select View > Editor Layout > Two Columns (or press Cmd+\\ on macOS / Ctrl+\\ on Windows) to open a split editor.</p>", "feedback": "<p>Correct. The split editor layout displays both files side by side, allowing simultaneous scrolling and comparison.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Close VS Code and print both files on paper to read them on a physical desk.</p>", "feedback": "<p>Incorrect. VS Code provides built-in multi-column split editor views directly in the application.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Paste the English translation directly into the middle of the French XML file on every line.</p>", "feedback": "<p>Incorrect. Mingling translation text into the source file corrupts the XML hierarchy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Run a command in the terminal to permanently delete the translation file.</p>", "feedback": "<p>Incorrect. You need both files open simultaneously to perform alignment.</p>"}]}}, {"step": 4, "title": "Sentences as Meaningful Units", "content": "**Sentences as Meaningful Units**\n\nBefore linking words, you must link larger grammatical units. The most natural unit of human thought is the **sentence**.\n\nIn historical manuscripts, sentences are not always easy to spot. Scribes often used erratic punctuation. An 18th-century French decree might run for fifteen lines before reaching a period. A personal letter might use dashes instead of periods.\n\nWhen aligning historical texts, treat a sentence as a complete grammatical thought:\n\n* It expresses a coherent action or statement.\n* It usually contains a subject and a verb.\n* It corresponds to a distinct sentence in a modern translation.\n\nIn your TEI XML file, you mark sentences using the standard `<s>` tag. Wrapping sentences in `<s>` tags creates clear targets for digital alignment.\n\n**Takeaway:** Sentences marked with `<s>` tags provide the fundamental grammatical building blocks for sentence-level alignment.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Sentences as Meaningful Units", "questiontext": "<p>Which standard TEI XML element is used to mark sentence boundaries for translation alignment?</p>", "generalfeedback": "<p>Sentences marked with &lt;s&gt; tags provide the fundamental grammatical building blocks for sentence-level alignment.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The &lt;s&gt; element, which wraps a complete grammatical sentence.</p>", "feedback": "<p>Correct. The TEI &lt;s&gt; tag denotes a sentence unit, providing a clean target for sentence-level alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The &lt;body&gt; tag, which marks the entire document text.</p>", "feedback": "<p>Incorrect. &lt;body&gt; contains the entire main text, not individual sentences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The &lt;gap&gt; tag, which indicates missing or illegible text.</p>", "feedback": "<p>Incorrect. &lt;gap&gt; records lacunae or damage, not sentence boundaries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The &lt;title&gt; tag, which gives the title of the work.</p>", "feedback": "<p>Incorrect. &lt;title&gt; is for bibliographic titles, not running text sentences.</p>"}]}}, {"step": 5, "title": "Assigning Unique Identifiers (`xml:id`)", "content": "**Assigning Unique Identifiers (`xml:id`)**\n\nTo link two sentences, the computer needs a way to address them. You give each sentence a unique name using the `xml:id` attribute.\n\nThink of an `xml:id` as a street address:\n\n* Every address in a town must be unique.\n* No two sentences in your file may share the same `xml:id`.\n* The ID should be short and predictable.\n\nFor our course, we use a simple naming convention:\n\n* Source sentences use the prefix `s`: `xml:id=\"s1\"`, `xml:id=\"s2\"`, `xml:id=\"s3\"`.\n* Translation sentences use the prefix `t`: `xml:id=\"t1\"`, `xml:id=\"t2\"`, `xml:id=\"t3\"`.\n\n```xml\n<!-- In the French source file -->\n<s xml:id=\"s1\">La Nation fait les assignats.</s>\n\n<!-- In the English translation file -->\n<s xml:id=\"t1\">The Nation creates the paper currency.</s>\n```\n\nThese IDs allow you to create clean, unambiguous links.\n\n**Takeaway:** Every sentence receives a unique `xml:id` attribute so that external link elements can point to it without ambiguity.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Assigning Unique Identifiers (xml:id)", "questiontext": "<p>Why must every sentence in an alignment project receive a unique xml:id attribute?</p>", "generalfeedback": "<p>Every sentence receives a unique xml:id attribute so that external link elements can point to it without ambiguity.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To give each sentence a unique digital address so external link elements can connect them without ambiguity.</p>", "feedback": "<p>Correct. Unique xml:id attributes act like postal addresses, allowing link elements to pair specific sentences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To change the font color of the sentence to bright green in the web browser.</p>", "feedback": "<p>Incorrect. xml:id is an identifier attribute, not a visual styling rule.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To translate French words into English automatically without human review.</p>", "feedback": "<p>Incorrect. xml:id only identifies elements; it does not perform language translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To lock the file so that no other student can open it on their computer.</p>", "feedback": "<p>Incorrect. xml:id does not encrypt or password-protect files.</p>"}]}}, {"step": 6, "title": "One-to-One Correspondences (1:1)", "content": "**One-to-One Correspondences (1:1)**\n\nThe most straightforward alignment is a **one-to-one (1:1)** match. In a 1:1 match, exactly one source sentence translates into exactly one target sentence.\n\nConsider this pair from an 18th-century proclamation:\n\n* Source `s1`: *The Governor signed the treaty in council.*\n* Target `t1`: *Le gouverneur a signé le traité en conseil.*\n\nBoth sentences start at the same point and finish at the same point. Their grammatical boundaries match. In modern translations of straightforward prose, 1:1 matches make up about eighty percent of all alignments.\n\nWhen you find a 1:1 match, your editorial job is simple. You pair sentence `s1` directly with translation `t1`.\n\n**Takeaway:** A one-to-one alignment occurs when a single source sentence maps directly onto a single translated sentence.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: One-to-One Correspondences (1:1)", "questiontext": "<p>What is a one-to-one (1:1) sentence alignment?</p>", "generalfeedback": "<p>A one-to-one alignment occurs when a single source sentence maps directly onto a single translated sentence.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>An alignment where exactly one source sentence maps directly onto a single translated sentence.</p>", "feedback": "<p>Correct. A 1:1 alignment pairs a single source sentence (such as s1) with a single target sentence (such as t1).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An alignment where one word in language A translates to ten words in language B.</p>", "feedback": "<p>Incorrect. That describes lexical expansion, not sentence-level 1:1 alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An alignment where an entire book is summarized into a single sentence.</p>", "feedback": "<p>Incorrect. That is an abstract or summary, not a sentence alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An alignment where every vowel is replaced by the number 1.</p>", "feedback": "<p>Incorrect. Alignment links semantic and grammatical units, not character substitutions.</p>"}]}}, {"step": 7, "title": "One-to-Many Alignments (1:N)", "content": "**One-to-Many Alignments (1:N)**\n\nHistorical writers loved long, complex sentences. An 18th-century legal decree often piles clause upon clause with semicolons. Modern English style prefers shorter, clearer sentences.\n\nWhen a translator breaks one long historical sentence into two modern sentences, you have a **one-to-many (1:N)** alignment:\n\n* Source `s4`: One long French legal clause of sixty words.\n* Target `t4`: The first modern English sentence explaining the decree.\n* Target `t5`: The second modern English sentence detailing the penalty.\n\nYou cannot force the translator's work back into a single sentence. Instead, your digital alignment must acknowledge reality. You link the single source sentence `s4` to both translation sentences: `t4` and `t5`.\n\n**Takeaway:** A one-to-many alignment connects a single complex source sentence to multiple shorter modern translated sentences.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: One-to-Many Alignments (1:N)", "questiontext": "<p>When does an editor create a one-to-many (1:N) alignment?</p>", "generalfeedback": "<p>A one-to-many alignment connects a single complex source sentence to multiple shorter modern translated sentences.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When a single complex historical source sentence is split into multiple shorter modern sentences in the translation.</p>", "feedback": "<p>Correct. A 1:N alignment connects one long source sentence (e.g. s4) to multiple translated sentences (e.g. t4 and t5).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When an editor translates a document into twenty different European languages at once.</p>", "feedback": "<p>Incorrect. 1:N refers to the ratio of source sentences to target sentences within a single translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When a manuscript page has multiple physical ink stains.</p>", "feedback": "<p>Incorrect. Physical stains are codicological defects, not translational sentence splits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When an entire paragraph is accidentally erased from the translation.</p>", "feedback": "<p>Incorrect. Omission is a 1:0 alignment, not a 1:N alignment.</p>"}]}}, {"step": 8, "title": "Many-to-One Alignments (N:1)", "content": "**Many-to-One Alignments (N:1)**\n\nThe opposite pattern also happens. Sometimes an original author writes several brief, telegraphic sentences. The translator combines them into a single flowing English sentence.\n\nThis pattern is a **many-to-one (N:1)** alignment:\n\n* Source `s8`: *It rained.*\n* Source `s9`: *The roads were bad.*\n* Target `t8`: *Because it rained, the roads were muddy and impassable.*\n\nIn this example, the translator merged two historical sentences into one. \n\nWhen you link them, your alignment points from multiple source IDs to one target ID: `s8` and `s9` link to `t8`. Recognizing these shifts teaches you how translators interpret historical style.\n\n**Takeaway:** A many-to-one alignment links multiple concise source sentences to a single combined translation sentence.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Many-to-One Alignments (N:1)", "questiontext": "<p>What occurs during a many-to-one (N:1) alignment?</p>", "generalfeedback": "<p>A many-to-one alignment links multiple concise source sentences to a single combined translation sentence.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Multiple concise historical source sentences are combined into a single flowing translated sentence.</p>", "feedback": "<p>Correct. In an N:1 alignment, several short source sentences (e.g. s8 and s9) map onto a single combined translation sentence (t8).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A translator expands a single English word into five French paragraphs.</p>", "feedback": "<p>Incorrect. That would be a massive expansion, not a many-to-one sentence combination.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Multiple scribes copy the same document simultaneously in different rooms.</p>", "feedback": "<p>Incorrect. That describes historical scriptorium production, not text alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A student submits multiple identical homework assignments to Moodle.</p>", "feedback": "<p>Incorrect. N:1 alignment relates to grammatical sentence correspondence.</p>"}]}}, {"step": 9, "title": "Omissions and Additions (1:0 and 0:1)", "content": "**Omissions and Additions (1:0 and 0:1)**\n\nSometimes a historical sentence has no translation at all. Other times, a modern translator adds an explanatory sentence not found in the original document.\n\nThese situations create special alignment patterns:\n\n* **Omission (1:0):** A source sentence was omitted from the translation. You mark its target as `#none` or leave it unlinked.\n* **Addition (0:1):** A modern translator added an introductory sentence to give context. It has no source counterpart.\n\n<table>\n  <thead>\n    <tr>\n      <th style=\"width: 20%;\">Type</th>\n      <th style=\"width: 30%;\">Source Count</th>\n      <th style=\"width: 30%;\">Target Count</th>\n      <th style=\"width: 20%;\">Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>1:1</strong></td>\n      <td>One sentence</td>\n      <td>One sentence</td>\n      <td>Standard sentence</td>\n    </tr>\n    <tr>\n      <td><strong>1:N</strong></td>\n      <td>One sentence</td>\n      <td>Two or more sentences</td>\n      <td>Split legal clause</td>\n    </tr>\n    <tr>\n      <td><strong>N:1</strong></td>\n      <td>Two or more sentences</td>\n      <td>One sentence</td>\n      <td>Combined notes</td>\n    </tr>\n    <tr>\n      <td><strong>1:0</strong></td>\n      <td>One sentence</td>\n      <td>Zero sentences</td>\n      <td>Omitted formula</td>\n    </tr>\n  </tbody>\n</table>\n\nRecording omissions and additions ensures your digital edition remains honest about textual discrepancies.\n\n**Takeaway:** Textual asymmetries include omissions (1:0) and additions (0:1), where sentences exist in only one language.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Omissions and Additions (1:0 and 0:1)", "questiontext": "<p>How does a digital alignment record an omission where a historical sentence was left untranslated?</p>", "generalfeedback": "<p>Textual asymmetries include omissions (1:0) and additions (0:1), where sentences exist in only one language.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By leaving the source sentence unlinked or explicitly directing its target pointer to #none.</p>", "feedback": "<p>Correct. Recording omissions as 1:0 alignments (or pointing to #none) documents that the source sentence has no translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By inventing a fake English sentence and pretending the historical author wrote it.</p>", "feedback": "<p>Incorrect. Scholarly ethics prohibit fabricating translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the historical sentence from the original manuscript XML file.</p>", "feedback": "<p>Incorrect. You must never delete historical text to hide translation discrepancies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By crashing the computer so the XML file cannot be saved.</p>", "feedback": "<p>Incorrect. Alignment standards cleanly handle omissions without errors.</p>"}]}}, {"step": 10, "title": "Inline Markup vs. Standoff Markup", "content": "**Inline Markup vs. Standoff Markup**\n\nHow should we store these alignment links in XML? There are two different approaches: **inline markup** and **standoff markup**.\n\nIn inline markup, you place the translation directly inside the original text. You might put an `<add>` or `<note>` tag right next to every historical word. \n\nInline markup causes serious problems:\n\n* It clutters the historical text with modern words.\n* It ruins the facsimile layout and line breaks.\n* It makes validating the primary document difficult.\n\nFor translation alignment, the Text Encoding Initiative (TEI) strongly recommends **standoff markup**. In standoff markup, the source text and the translation live in clean, separate blocks. The links sit in a third location, pointing to both files.\n\n**Takeaway:** Standoff markup stores alignment links separately from text content, keeping both original and translation files clean and valid.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Inline Markup vs. Standoff Markup", "questiontext": "<p>Why does the TEI community strongly recommend standoff markup over inline markup for translation alignment?</p>", "generalfeedback": "<p>Standoff markup stores alignment links separately from text content, keeping both original and translation files clean and valid.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Standoff markup keeps source and translation files clean and independent, preventing modern words from cluttering historical text.</p>", "feedback": "<p>Correct. Standoff markup stores links in a separate block, preserving the layout and schema validity of both text streams.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inline markup is forbidden by international copyright law in Canada.</p>", "feedback": "<p>Incorrect. Markup architecture is a technical design choice, not a copyright statute.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Standoff markup makes XML files run ten times faster on old laptops.</p>", "feedback": "<p>Incorrect. Standoff markup is chosen for structural clarity and modularity, not raw CPU speed.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inline markup converts all XML tags into capital letters automatically.</p>", "feedback": "<p>Incorrect. Inline markup simply embeds notes directly within the text stream.</p>"}]}}, {"step": 11, "title": "The TEI Standoff Philosophy", "content": "**The TEI Standoff Philosophy**\n\nStandoff markup treats your edition like a small library:\n\n1. Book 1 is your transcribed manuscript witness.\n2. Book 2 is your modern English translation.\n3. The catalog index is your standoff link group.\n\nNeither book is scribbled in or damaged by the catalog index. If you decide to add a second translation later (such as modern French or Mi'kmaw), you do not touch the original manuscript XML. You simply add another set of links.\n\nThis separation of concerns makes your digital edition durable. It follows the best practices of modern software design. It protects your hard work from accidental corruption.\n\n**Takeaway:** The TEI standoff architecture separates text content from analytical links, allowing multiple translations without altering the base text.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: The TEI Standoff Philosophy", "questiontext": "<p>How does the TEI standoff architecture allow an edition to support multiple translations over time?</p>", "generalfeedback": "<p>The TEI standoff architecture separates text content from analytical links, allowing multiple translations without altering the base text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>New translations can be added with their own link groups without modifying the original manuscript transcription.</p>", "feedback": "<p>Correct. Because links sit outside the text, you can add new translations (e.g. French, Mi'kmaw, German) without touching the source XML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces all translations to merge into a single gigantic paragraph.</p>", "feedback": "<p>Incorrect. Standoff markup preserves distinct, modular text files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires the original manuscript to be destroyed once the translation is complete.</p>", "feedback": "<p>Incorrect. Digital editions aim to preserve historical manuscript witnesses indefinitely.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It restricts the edition to exactly one English translation forever.</p>", "feedback": "<p>Incorrect. The main advantage of standoff architecture is that it easily accommodates multiple translations.</p>"}]}}, {"step": 12, "title": "Introducing `<linkGrp>` and `<link>`", "content": "**Introducing `<linkGrp>` and `<link>`**\n\nThe official TEI element for grouping alignment connections is `<linkGrp>` (link group). Inside `<linkGrp>`, each individual connection is represented by a `<link>` element.\n\nThe `<link>` element uses a single attribute named `@target`. The `@target` attribute holds the IDs of the two connected items, separated by a space:\n\n```xml\n<linkGrp type=\"translation-alignment\">\n  <link target=\"#s1 #t1\"/>\n  <link target=\"#s2 #t2\"/>\n  <link target=\"#s3 #t3\"/>\n</linkGrp>\n```\n\nNotice the number sign (`#`) before each ID. The number sign tells the XML processor: \"Look for an element with this `xml:id` within this project.\"\n\nIf one source sentence matches two translation sentences, you list all three IDs in the target:\n\n```xml\n<link target=\"#s4 #t4 #t5\"/>\n```\n\n**Takeaway:** The `<link>` element pairs sentence IDs using the `@target` attribute, prefixing each ID with a number sign (`#`).\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Introducing <linkGrp> and <link>", "questiontext": "<p>In a TEI &lt;link&gt; element, what prefix must precede every xml:id listed in the @target attribute?</p>", "generalfeedback": "<p>The &lt;link&gt; element pairs sentence IDs using the @target attribute, prefixing each ID with a number sign (#).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A number sign or hash symbol (#), which indicates an ID reference within the document.</p>", "feedback": "<p>Correct. The hash symbol (#s1 #t1) tells the XML processor to resolve the name as a local element ID.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An exclamation point (!), which tells the parser to highlight the sentence.</p>", "feedback": "<p>Incorrect. Exclamation marks are not the standard XML ID pointer prefix.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A dollar sign ($), which marks currency in 18th-century treaties.</p>", "feedback": "<p>Incorrect. Hash marks (#) are used for ID references in TEI and HTML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An ampersand (&amp;), which creates an XML character entity.</p>", "feedback": "<p>Incorrect. Ampersands escape entities; URI ID references require a hash mark.</p>"}]}}, {"step": 13, "title": "Placing the `<linkGrp>` in the TEI Document", "content": "**Placing the `<linkGrp>` in the TEI Document**\n\nWhere does `<linkGrp>` go inside your XML file? \n\nIn TEI P5, you have two approved locations:\n\n1. **Inside `<standOff>`:** Modern TEI includes a dedicated `<standOff>` element placed right after `<teiHeader>` or after `</text>`.\n2. **Inside `<back>`:** You can place a `<div type=\"alignments\">` inside the document's `<back>` matter.\n\nHere is a typical document structure using `<standOff>`:\n\n```xml\n<TEI xmlns=\"http://www.tei-c.org/ns/1.0\">\n  <teiHeader>\n    <!-- Cataloguing metadata -->\n  </teiHeader>\n  <text>\n    <!-- Primary transcription -->\n  </text>\n  <standOff>\n    <linkGrp type=\"translation-alignment\">\n      <link target=\"#s1 #t1\"/>\n      <link target=\"#s2 #t2\"/>\n    </linkGrp>\n  </standOff>\n</TEI>\n```\n\nKeeping `<linkGrp>` inside `<standOff>` makes it easy for automated tools to locate your links.\n\n**Takeaway:** Place your `<linkGrp>` elements inside a `<standOff>` element at the end of your TEI document for clean organization.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Placing the <linkGrp> in the TEI Document", "questiontext": "<p>Where is the standard location for a &lt;linkGrp&gt; element inside a TEI document?</p>", "generalfeedback": "<p>Place your &lt;linkGrp&gt; elements inside a &lt;standOff&gt; element at the end of your TEI document for clean organization.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Inside a dedicated &lt;standOff&gt; element, or within a &lt;div type=\"alignments\"&gt; in &lt;back&gt;.</p>", "feedback": "<p>Correct. TEI P5 provides the &lt;standOff&gt; element (or back matter divs) specifically to hold external link groups.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside the &lt;titleStmt&gt; of the &lt;teiHeader&gt; before the author name.</p>", "feedback": "<p>Incorrect. titleStmt contains metadata about the edition title, not text alignment links.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside a &lt;graphic&gt; element embedded in the banner image.</p>", "feedback": "<p>Incorrect. Graphic elements link image URLs, not parallel text alignments.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scattered randomly between words in the manuscript transcription.</p>", "feedback": "<p>Incorrect. That would defeat the entire purpose of standoff markup.</p>"}]}}, {"step": 14, "title": "Validating Standoff Links in VS Code", "content": "**Validating Standoff Links in VS Code**\n\nWhen authoring standoff links by hand, it is easy to make a small typing error. If you mistype an ID, the link breaks.\n\nHere is how to check your links in VS Code:\n\n1. Check that every ID in `@target` starts with `#`. Typing `target=\"s1 t1\"` without `#` is an invalid pointer.\n2. Verify that the target sentence actually exists. If you write `#s5`, open your source pane and make sure `<s xml:id=\"s5\">` is present.\n3. Watch for red squiggly lines. If your XML schema checks ID references, VS Code will flag broken links immediately.\n4. Check for duplicate IDs. Every `xml:id` must be completely unique across the file.\n\nTaking five minutes to check these four rules will save hours of debugging later.\n\n**Takeaway:** Valid standoff links always include the `#` prefix and point directly to existing, unique `xml:id` attributes.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Validating Standoff Links in VS Code", "questiontext": "<p>What is a common error when writing standoff links by hand in VS Code?</p>", "generalfeedback": "<p>Valid standoff links always include the # prefix and point directly to existing, unique xml:id attributes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Forgetting the hash mark (#) before an ID, writing target=\"s1 t1\" instead of target=\"#s1 #t1\".</p>", "feedback": "<p>Correct. Omitting the hash mark creates an invalid pointer that XML processors cannot resolve.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Saving the file with the .xml file extension.</p>", "feedback": "<p>Incorrect. .xml is the correct and required file extension.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Using lowercase letters for sentence IDs like s1 and t1.</p>", "feedback": "<p>Incorrect. Lowercase letters are standard and valid in xml:id attributes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Leaving spaces between the target IDs inside the attribute quotes.</p>", "feedback": "<p>Incorrect. Spaces are required to separate multiple IDs inside the @target attribute.</p>"}]}}, {"step": 15, "title": "Moving from Sentences to Words: Why We Need Finer Detail", "content": "**Moving from Sentences to Words: Why We Need Finer Detail**\n\nSentence alignment is helpful for general readers. But scholarly editions require deeper analysis.\n\nScholars often ask detailed linguistic questions:\n\n* Exactly which historical French word translates as \"deputy\"?\n* How did the 1752 treaty express colonial sovereignty in legal terminology?\n* What grammatical form was Maud Lewis using when she wrote colloquial phrases?\n\nTo answer these questions, we must look below the sentence level. We must examine individual words and word parts. In linguistics, this fine-grained analysis is called **interlinear glossing**.\n\n**Takeaway:** While sentence alignment links general ideas, interlinear glossing exposes the exact grammatical mechanics of individual words.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Moving from Sentences to Words: Why We Need Finer Detail", "questiontext": "<p>Why do scholarly digital editions require word-level and morpheme-level analysis in addition to sentence alignment?</p>", "generalfeedback": "<p>While sentence alignment links general ideas, interlinear glossing exposes the exact grammatical mechanics of individual words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To analyze specific grammatical choices, terminology, and historical phrasing that sentence alignment cannot reveal.</p>", "feedback": "<p>Correct. While sentence alignment shows general meaning, interlinear glossing exposes the exact grammatical mechanics of individual words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To make the XML files as large as possible to consume hard drive storage.</p>", "feedback": "<p>Incorrect. Scholarly markup aims for philological precision, not unnecessary file bloat.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because sentences are completely meaningless in historical linguistics.</p>", "feedback": "<p>Incorrect. Sentences are essential units, but word-level analysis provides deeper grammatical detail.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prevent students from reading the English translation.</p>", "feedback": "<p>Incorrect. Interlinear glossing enhances reading comprehension by explaining every word component.</p>"}]}}, {"step": 16, "title": "What is an Interlinear Gloss?", "content": "**What is an Interlinear Gloss?**\n\nAn **interlinear gloss** is a line of explanation written directly between the lines of a text. \n\nThe practice has ancient roots:\n\n* Medieval scribes wrote Latin glosses over Celtic and Old English texts.\n* Monks added Greek words between Hebrew scriptural lines.\n* 19th-century travelers wrote phonetic translations above Indigenous words.\n\nIn modern scholarship, interlinear glosses are not casual notes. They follow a rigorous international standard called the **Leipzig Glossing Rules**. The Leipzig rules turn informal marginal notes into a standardized grammatical language.\n\n**Takeaway:** Interlinear glossing places grammatical and lexical explanations directly between text lines following standardized linguistic rules.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: What is an Interlinear Gloss?", "questiontext": "<p>What is an interlinear gloss in historical manuscript scholarship and linguistics?</p>", "generalfeedback": "<p>Interlinear glossing places grammatical and lexical explanations directly between text lines following standardized linguistic rules.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A line of linguistic or lexical explanation written directly between the lines of a text.</p>", "feedback": "<p>Correct. Interlinear glosses place grammatical and translation notes between text lines, following rigorous linguistic conventions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A decorative border painted in gold leaf on the cover of a leather book.</p>", "feedback": "<p>Incorrect. That is illumination or binding decoration, not an interlinear gloss.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A footnote placed at the very end of a printed book in tiny six-point font.</p>", "feedback": "<p>Incorrect. Glosses sit between text lines (interlinear), not in endnotes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A list of books borrowed from a university library during study break.</p>", "feedback": "<p>Incorrect. That is a library circulation record.</p>"}]}}, {"step": 17, "title": "The Leipzig Glossing Rules: An Overview", "content": "**The Leipzig Glossing Rules: An Overview**\n\nThe **Leipzig Glossing Rules** were developed by the Max Planck Institute for Evolutionary Anthropology and the University of Leipzig. They establish four rules of syntax and layout for multilingual texts.\n\nThe goal of the Leipzig rules is transparency:\n\n* Anyone in the world should be able to understand the grammatical structure of your text, even if they do not speak the language.\n* Every grammatical label must come from a shared list of standard abbreviations.\n* Punctuation marks inside glosses have precise mathematical meanings.\n\nLearning these rules allows you to present historical documents with professional scientific clarity.\n\n**Takeaway:** The Leipzig Glossing Rules provide an international standard for formatting multilingual texts so their grammar is clear to any scholar.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: The Leipzig Glossing Rules: An Overview", "questiontext": "<p>What was the primary motivation behind the creation of the Leipzig Glossing Rules?</p>", "generalfeedback": "<p>The Leipzig Glossing Rules provide an international standard for formatting multilingual texts so their grammar is clear to any scholar.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To establish an international standard so that any scholar can understand a text's grammar without needing to speak the language.</p>", "feedback": "<p>Correct. The Leipzig rules ensure worldwide transparency and consistency across multilingual linguistic editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force all historical documents to be translated into German.</p>", "feedback": "<p>Incorrect. The rules govern formatting and notation, not the target language.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To ban English words from digital scholarly editions.</p>", "feedback": "<p>Incorrect. The Leipzig rules work with any source and target languages.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To make linguistic textbooks impossible for beginners to read.</p>", "feedback": "<p>Incorrect. The rules standardize notation specifically to make texts accessible and clear.</p>"}]}}, {"step": 18, "title": "The Four-Tier Architecture of Leipzig Glossing", "content": "**The Four-Tier Architecture of Leipzig Glossing**\n\nA complete Leipzig gloss uses four vertical lines, stacked directly on top of each other:\n\n1. **Line 1 (Source Text):** The exact historical words from your manuscript witness.\n2. **Line 2 (Morpheme Breakdown):** The words divided into their grammatical stems and endings.\n3. **Line 3 (Grammar Gloss):** Standardized labels identifying what each ending does grammatically.\n4. **Line 4 (Free Translation):** A natural English sentence enclosed in quotation marks.\n\n```text\nLine 1: Les     citoyens parlèrent.\nLine 2: le-s    citoyen-s parlé-rent\nLine 3: DEF-PL  citizen-PL speak-3PL.PST\nLine 4: \"The citizens spoke.\"\n```\n\nEach vertical column aligns word-for-word. A reader can look straight down to see how each historical ending works.\n\n**Takeaway:** The four-line Leipzig layout moves systematically from raw historical spelling to grammatical breakdown, linguistic labels, and modern translation.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: The Four-Tier Architecture of Leipzig Glossing", "questiontext": "<p>What are the four vertical lines in a standard Leipzig interlinear gloss?</p>", "generalfeedback": "<p>The four-line Leipzig layout moves systematically from raw historical spelling to grammatical breakdown, linguistic labels, and modern translation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Line 1: Surface Text; Line 2: Morpheme Breakdown; Line 3: Grammar Gloss; Line 4: Free Translation.</p>", "feedback": "<p>Correct. The four tiers systematically move from historical spelling to morphemic segmentation, grammatical labels, and fluent translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Line 1: English; Line 2: French; Line 3: Spanish; Line 4: German.</p>", "feedback": "<p>Incorrect. The tiers represent analytical linguistic layers, not four European languages.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Line 1: Date; Line 2: Time; Line 3: Room; Line 4: Instructor.</p>", "feedback": "<p>Incorrect. Those are timetable metadata fields, not interlinear gloss tiers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Line 1: Title; Line 2: Paragraph; Line 3: Sentence; Line 4: Period.</p>", "feedback": "<p>Incorrect. Those are text structural levels, not Leipzig gloss lines.</p>"}]}}, {"step": 19, "title": "Tier 1: The Historical Surface Text", "content": "**Tier 1: The Historical Surface Text**\n\nLine 1 displays the **surface text**. The surface text is what your eyes see on the physical page.\n\nWhen authoring Line 1:\n\n* Preserve the historical spelling exactly as found in your document.\n* Retain original accents, archaic letters, and contractions.\n* Do not modernize spellings or expand abbreviations here.\n* Separate each word with a space so it aligns with the lines below.\n\nFor Ace's French decree, Line 1 preserves 18th-century spellings like *assignats*. For Olyvia's letters, Line 1 preserves Maud Lewis's original handwriting and punctuation.\n\n**Takeaway:** Line 1 preserves the raw historical spelling of the witness without modernization or silent alterations.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Tier 1: The Historical Surface Text", "questiontext": "<p>What should an editor do with historical spelling, accents, and punctuation in Line 1 of a Leipzig gloss?</p>", "generalfeedback": "<p>Line 1 preserves the raw historical spelling of the witness without modernization or silent alterations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Preserve the historical spelling and punctuation exactly as written in the manuscript witness.</p>", "feedback": "<p>Correct. Line 1 records the authentic historical surface text without modernization or silent alterations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modernize all words to conform to standard 2026 Canadian English spelling.</p>", "feedback": "<p>Incorrect. Line 1 must preserve the witness; modern phrasing belongs in Line 4.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete all accented letters because computers cannot display them.</p>", "feedback": "<p>Incorrect. Modern UTF-8 encoding fully supports all historical accented characters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translate the words into Latin before typing them into Line 1.</p>", "feedback": "<p>Incorrect. Line 1 holds the primary language of the source artifact.</p>"}]}}, {"step": 20, "title": "Tier 2: Word and Morpheme Segmentation", "content": "**Tier 2: Word and Morpheme Segmentation**\n\nA **morpheme** is the smallest meaningful unit in a language. For example, the English word *cats* has two morphemes: the base noun *cat* and the plural ending *-s*.\n\nIn Line 2 of your gloss, you divide words into their constituent morphemes:\n\n* Use a hyphen (`-`) to separate prefixes, stems, and suffixes.\n* If a word cannot be broken into smaller pieces, leave it without hyphens.\n* Align each segmented word directly beneath its Line 1 counterpart.\n\nIn French:\n\n* Line 1: *décrets*\n* Line 2: *décret-s* (stem + plural suffix)\n\nSegmenting morphemes makes the building blocks of historical vocabulary visible to students and readers.\n\n**Takeaway:** Line 2 breaks complex words into stems and grammatical endings using hyphens to mark boundaries.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Tier 2: Word and Morpheme Segmentation", "questiontext": "<p>What punctuation mark is used in Line 2 to separate words into their constituent morphemes (stems and endings)?</p>", "generalfeedback": "<p>Line 2 breaks complex words into stems and grammatical endings using hyphens to mark boundaries.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A hyphen (-), which marks physical boundaries between prefixes, stems, and suffixes.</p>", "feedback": "<p>Correct. Hyphens in Line 2 separate distinct morphemic building blocks (e.g. décret-s).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An asterisk (*), which denotes a reconstructed word in historical linguistics.</p>", "feedback": "<p>Incorrect. Asterisks mark unverified or reconstructed forms, not morpheme boundaries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An exclamation mark (!), which indicates an imperative command.</p>", "feedback": "<p>Incorrect. Exclamation marks are grammatical sentence punctuation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A plus sign (+), which is used only for mathematical addition.</p>", "feedback": "<p>Incorrect. Leipzig Rule 2 specifically designates the hyphen for morpheme cuts.</p>"}]}}, {"step": 21, "title": "Tier 3: Grammatical Abbreviations", "content": "**Tier 3: Grammatical Abbreviations**\n\nLine 3 is where you provide grammatical definitions. The Leipzig standard uses a shared vocabulary of capital abbreviations.\n\nHere are the most common labels you will use:\n\n* `DEF`: Definite article (*the*)\n* `INDF`: Indefinite article (*a*, *an*)\n* `SG`: Singular\n* `PL`: Plural\n* `PST`: Past tense\n* `PRS`: Present tense\n* `1`, `2`, `3`: First, second, or third person\n* `NEG`: Negative particle (*not*)\n\nWhenever you gloss a lexical stem, use regular lowercase English (*citizen*, *speak*, *letter*). Whenever you gloss a grammatical function, use standard uppercase labels (`PL`, `PST`).\n\n**Takeaway:** Line 3 combines lowercase English meanings for word stems with standard uppercase abbreviations for grammatical endings.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Tier 3: Grammatical Abbreviations", "questiontext": "<p>In Line 3 of a Leipzig gloss, how are grammatical category labels visually distinguished from lexical meanings?</p>", "generalfeedback": "<p>Line 3 combines lowercase English meanings for word stems with standard uppercase abbreviations for grammatical endings.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Grammatical labels are written in standard uppercase abbreviations (e.g. PL, PST), while lexical stems are written in lowercase English.</p>", "feedback": "<p>Correct. The Leipzig rules reserve capital letters for grammatical functions (PL, DEF, PST) and lowercase for word translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Grammatical labels are written in red ink while word stems are written in blue ink.</p>", "feedback": "<p>Incorrect. Leipzig rules rely on case conventions (uppercase vs lowercase), not text color.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Grammatical labels are enclosed in square brackets with smiley faces.</p>", "feedback": "<p>Incorrect. Scholarly standards avoid informal symbols.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All words in Line 3 must be written entirely in Greek letters.</p>", "feedback": "<p>Incorrect. Line 3 uses standard Latin alphabet abbreviations.</p>"}]}}, {"step": 22, "title": "The Hyphen vs. The Period: Rule 2 Explained", "content": "**The Hyphen vs. The Period: Rule 2 Explained**\n\nThe most famous rule in the Leipzig system is Rule 2. It governs punctuation in Line 3:\n\n* **Use a Hyphen (`-`)** when there is a visible boundary in Line 2. A hyphen connects separate parts:\n  * Line 2: *book-s*\n  * Line 3: *book-PL* (one hyphen above, one hyphen below).\n\n* **Use a Period (`.`)** when a single indivisible piece expresses multiple grammatical meanings at once:\n  * In the French word *parla* (\"he spoke\"), the single letter *-a* expresses third person, singular, and past tense all together.\n  * Line 2: *parl-a*\n  * Line 3: *speak-3SG.PST*\n\nThe period signals that *3*, *SG*, and *PST* cannot be separated into distinct physical letters.\n\n**Takeaway:** Hyphens mark physical boundaries between distinct morphemes; periods join multiple grammatical concepts packed into a single ending.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: The Hyphen vs. The Period: Rule 2 Explained", "questiontext": "<p>According to Leipzig Rule 2, when should a period (.) be used between labels in Line 3 instead of a hyphen?</p>", "generalfeedback": "<p>Hyphens mark physical boundaries between distinct morphemes; periods join multiple grammatical concepts packed into a single ending.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When a single indivisible morpheme expresses multiple grammatical meanings at the same time (e.g. speak-3SG.PST).</p>", "feedback": "<p>Correct. A period joins multiple grammatical labels that belong to a single fused ending that cannot be physically separated.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whenever an editor gets tired of typing hyphens.</p>", "feedback": "<p>Incorrect. Punctuation in Leipzig glosses has precise linguistic meanings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only at the very end of the sentence to show it is finished.</p>", "feedback": "<p>Incorrect. That describes normal sentence punctuation; inside Line 3, periods join portmanteau categories.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whenever a word has more than ten letters.</p>", "feedback": "<p>Incorrect. Word length does not determine morphemic punctuation.</p>"}]}}, {"step": 23, "title": "Tier 4: The Free Idiomatic Translation", "content": "**Tier 4: The Free Idiomatic Translation**\n\nLine 4 provides the **free translation**. \n\nWhile Lines 2 and 3 provide a literal, word-by-word breakdown, Line 4 gives the complete sentence in natural, idiomatic English. It shows how a fluent speaker would express the thought today.\n\nGuidelines for Line 4:\n\n* Always enclose the translation in double quotation marks.\n* Use standard modern English punctuation and capitalization.\n* Do not force awkward word order just to match the historical language.\n* Ensure the translation captures the full legal or personal meaning of the passage.\n\nLine 4 provides the context that makes the linguistic analysis above it meaningful.\n\n**Takeaway:** Line 4 delivers a fluent, idiomatic English translation enclosed in quotation marks, conveying the complete meaning of the passage.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Tier 4: The Free Idiomatic Translation", "questiontext": "<p>What is the formatting convention for Line 4 in a Leipzig interlinear gloss?</p>", "generalfeedback": "<p>Line 4 delivers a fluent, idiomatic English translation enclosed in quotation marks, conveying the complete meaning of the passage.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It is a fluent, natural English translation enclosed in quotation marks.</p>", "feedback": "<p>Correct. Line 4 conveys the complete thought in idiomatic English, enclosed in double quotation marks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is a word-for-word literal translation that ignores English grammar.</p>", "feedback": "<p>Incorrect. Word-for-word analysis belongs in Lines 2 and 3; Line 4 provides fluent idiomatic English.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It must be written in rhyming poetry with exactly fourteen lines.</p>", "feedback": "<p>Incorrect. Line 4 is a prose translation of the sentence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It should be left blank so the student can guess the meaning.</p>", "feedback": "<p>Incorrect. A complete four-line gloss always provides the translation on Line 4.</p>"}]}}, {"step": 24, "title": "Case Study 1: French Revolutionary Decree (Ace's Document)", "content": "**Case Study 1: French Revolutionary Decree (Ace's Document)**\n\nLet us examine how to gloss an excerpt from Ace's 1791 French decree (*Loi relative à la fabrication des assignats*).\n\nHere is an official legal sentence:\n*Line 1:* *L' Assemblée Nationale décrète la fabrication.*\n\nNow we author the four Leipzig tiers:\n\n* **Line 1 (Surface):** `L' Assemblée National-e décrète la fabrication.`\n* **Line 2 (Segmentation):** `l' assemblée national-e décrèt-e la fabrication`\n* **Line 3 (Gloss):** `DEF.SG assembly national-F.SG decree-3SG.PRS DEF.F.SG manufacture`\n* **Line 4 (Translation):** `\"The National Assembly decrees the manufacture.\"`\n\nNotice how `l'` is glossed as `DEF.SG` with a period, because the single letter indicates both a definite article and singular number.\n\n**Takeaway:** Applying Leipzig rules to 18th-century French clarifies how gender, number, and verb conjugations function in legal proclamations.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Case Study 1: French Revolutionary Decree (Ace's Document)", "questiontext": "<p>When glossing Ace's 1791 French decree, why is the article l' glossed as DEF.SG with a period?</p>", "generalfeedback": "<p>Applying Leipzig rules to 18th-century French clarifies how gender, number, and verb conjugations function in legal proclamations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because the single letter l' expresses both definite article status and singular number in one indivisible piece.</p>", "feedback": "<p>Correct. The single consonant conveys two grammatical categories simultaneously, so Leipzig Rule 2 requires a period between DEF and SG.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the French printer made a typo on the printing press.</p>", "feedback": "<p>Incorrect. Elision of the article before a vowel is standard French grammar.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the period indicates that the word is secret.</p>", "feedback": "<p>Incorrect. The period indicates combined grammatical features.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because French laws were forbidden from using hyphens in 1791.</p>", "feedback": "<p>Incorrect. French legal documents used standard orthography.</p>"}]}}, {"step": 25, "title": "Case Study 2: Peace and Friendship Treaty of 1752 (Andromeda's Document)", "content": "**Case Study 2: Peace and Friendship Treaty of 1752 (Andromeda's Document)**\n\nAndromeda's document is the 1752 Peace and Friendship Treaty concluded in Halifax. It features formal colonial treaty language.\n\nConsider this opening clause:\n*Line 1:* *It is agreed that the Treaty of 1726 shall be renewed.*\n\nIn colonial documents, formal modal verbs like *shall* carry legal force. When glossing historical English into a parallel modern version:\n\n* **Line 1:** `It is agree-d that the Treaty of 1726 shall be renew-ed.`\n* **Line 2:** `it is agree-d that the treaty of 1726 shall be renew-ed`\n* **Line 3:** `3SG.EXPL be.3SG.PRS agree-PST.PTCP COMP DEF treaty of 1726 OBLIG be renew-PST.PTCP`\n* **Line 4:** `\"It is agreed that the 1726 Treaty must be renewed.\"`\n\nGlossing legal terms reveals how power, obligation, and agreement were encoded in colonial treaties.\n\n**Takeaway:** Glossing historical legal English highlights the precise function of modal verbs and passive agreements in colonial treaties.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Case Study 2: Peace and Friendship Treaty of 1752 (Andromeda's Document)", "questiontext": "<p>How does interlinear glossing help students analyze historical colonial treaties like the 1752 treaty?</p>", "generalfeedback": "<p>Glossing historical legal English highlights the precise function of modal verbs and passive agreements in colonial treaties.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It isolates formal legal phrasing, obligations, and modal verbs like shall, revealing how agreements were structured.</p>", "feedback": "<p>Correct. Glossing legal terminology clarifies the exact grammatical mechanisms governing rights and obligations in historical treaties.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves that colonial treaties were printed on modern laser printers.</p>", "feedback": "<p>Incorrect. The 1752 treaty was printed on historical rag paper with movable type.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts all treaty terms into Latin religious prayers.</p>", "feedback": "<p>Incorrect. Glossing analyzes the actual legal language of the document.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all references to historical dates and locations.</p>", "feedback": "<p>Incorrect. Codicological and historical context is preserved throughout.</p>"}]}}, {"step": 26, "title": "Case Study 3: Folk Art Correspondence (Olyvia's Document)", "content": "**Case Study 3: Folk Art Correspondence (Olyvia's Document)**\n\nOlyvia's document is an intimate 1967 personal letter written by Nova Scotia folk artist Maud Lewis to Leonard Kinnear.\n\nMaud Lewis wrote in an informal, vernacular style:\n*Line 1:* *I got your letter and was glad to hear from you.*\n\nBecause Maud's text is already in modern English, why do we gloss it? \n\n1. **Vernacular Grammar:** Dialectal phrases and regional idioms can be glossed to explain their historical and cultural nuance.\n2. **Translation Alignment:** Her letters can be aligned with a parallel French translation for bilingual Canadian research.\n3. **Normalized Reading Text:** An informal handwritten sentence can be aligned directly with an editorial regularized version.\n\nAlignment is not just for ancient languages. It clarifies relationships between informal handwriting and formal published editions.\n\n**Takeaway:** Interlinear glossing and alignment help scholars document vernacular dialect, informal handwriting, and parallel French translations.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Case Study 3: Folk Art Correspondence (Olyvia's Document)", "questiontext": "<p>Why is alignment and glossing valuable for Olyvia's 1967 Maud Lewis letters, even though they are written in English?</p>", "generalfeedback": "<p>Interlinear glossing and alignment help scholars document vernacular dialect, informal handwriting, and parallel French translations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows editors to align vernacular handwritten expressions with normalized reading texts or parallel French translations.</p>", "feedback": "<p>Correct. Alignment links informal vernacular handwriting to regularized reading editions and enables bilingual Canadian editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Maud Lewis wrote her personal letters in ancient Classical Greek.</p>", "feedback": "<p>Incorrect. Maud Lewis wrote in 20th-century Maritime English.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because personal letters are not allowed in digital archives without complete translation.</p>", "feedback": "<p>Incorrect. Letters are valuable primary sources that benefit from linguistic alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because folk art can only be understood through computer algorithms.</p>", "feedback": "<p>Incorrect. Digital alignment supports human appreciation of folk art and personal writing.</p>"}]}}, {"step": 27, "title": "Encoding Leipzig Glosses in TEI XML", "content": "**Encoding Leipzig Glosses in TEI XML**\n\nHow do we represent a four-line Leipzig gloss inside TEI XML? The TEI provides specialized linguistic elements:\n\n* `<w>`: Represents a single word.\n* `<m>`: Represents an individual morpheme inside a word.\n* `<gloss>`: Contains the grammatical or lexical definition.\n\nHere is how a single glossed word looks in clean TEI:\n\n```xml\n<w xml:id=\"w1\">\n  <m type=\"root\">parl</m>\n  <m type=\"suffix\">-er</m>\n  <gloss>speak-INF</gloss>\n</w>\n```\n\nWhen you want to display the full four lines on a web page, you can group them inside an `<interlinear>` or `<table>` structure. This ensures the columns line up perfectly on screen.\n\n**Takeaway:** TEI encodes interlinear glosses using `<w>` for words, `<m>` for morphemes, and `<gloss>` for linguistic definitions.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Encoding Leipzig Glosses in TEI XML", "questiontext": "<p>Which three TEI XML elements are typically used to represent words, morphemes, and glosses?</p>", "generalfeedback": "<p>TEI encodes interlinear glosses using &lt;w&gt; for words, &lt;m&gt; for morphemes, and &lt;gloss&gt; for linguistic definitions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>&lt;w&gt; for words, &lt;m&gt; for morphemes, and &lt;gloss&gt; for grammatical definitions.</p>", "feedback": "<p>Correct. TEI provides &lt;w&gt;, &lt;m&gt;, and &lt;gloss&gt; specifically for fine-grained linguistic markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>&lt;cat&gt;, &lt;dog&gt;, and &lt;bird&gt;.</p>", "feedback": "<p>Incorrect. Those are animal names, not valid TEI elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>&lt;div&gt;, &lt;p&gt;, and &lt;lb/&gt;.</p>", "feedback": "<p>Incorrect. Those represent larger structural layout units (sections, paragraphs, line breaks), not morphemes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>&lt;author&gt;, &lt;publisher&gt;, and &lt;date&gt;.</p>", "feedback": "<p>Incorrect. Those are bibliographic metadata elements.</p>"}]}}, {"step": 28, "title": "Common Novice Pitfalls in Manual Alignment", "content": "**Common Novice Pitfalls in Manual Alignment**\n\nWhen students first align texts by hand, four common mistakes occur:\n\n1. **The Missing Hash Mark:** Writing `target=\"s1 t1\"` instead of `target=\"#s1 #t1\"`. Without `#`, your software thinks you are linking to an external website.\n2. **Unbalanced Columns:** Putting three words in Line 1, but four glosses in Line 3. Every word above must have exactly one corresponding gloss column below.\n3. **Confusing Hyphens and Periods:** Using hyphens when no physical letter boundary exists in the text.\n4. **Accidentally Deleting Original Spacing:** Removing spaces between words, causing gloss columns to collapse together.\n\nChecking for these simple issues ensures your manual work is flawless.\n\n**Takeaway:** Common alignment mistakes include missing `#` hash prefixes, mismatched column counts, and improper use of hyphens versus periods.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Common Novice Pitfalls in Manual Alignment", "questiontext": "<p>What visual formatting problem occurs if you put three words in Line 1 but four gloss columns in Line 3?</p>", "generalfeedback": "<p>Common alignment mistakes include missing # hash prefixes, mismatched column counts, and improper use of hyphens versus periods.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The columns become misaligned, destroying the vertical word-by-word correspondence.</p>", "feedback": "<p>Correct. Every word column in Line 1 must correspond exactly to one gloss column in Line 3 to preserve vertical alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer monitor will immediately turn off.</p>", "feedback": "<p>Incorrect. Unbalanced columns cause a visual formatting error, not hardware failure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The text will automatically convert into a PDF notes file.</p>", "feedback": "<p>Incorrect. Mismatched columns break the layout; they do not trigger automated compilation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The French words will be replaced by Latin numbers.</p>", "feedback": "<p>Incorrect. Text tokens remain unchanged, but the alignment columns become shifted.</p>"}]}}, {"step": 29, "title": "Creating Your Tuesday Ground Truth File", "content": "**Creating Your Tuesday Ground Truth File**\n\nToday in class, you will create two clean files in your personal project folder:\n\n1. `alignment_manual.xml`: A TEI file containing your 10-sentence passage and a standoff `<linkGrp>` linking source sentences to translation sentences.\n2. `gloss_manual.xml`: A clean file containing your four-line Leipzig interlinear gloss for three selected sentences.\n\nTake your time. Read each sentence carefully. Adjudicate every word division against your historical document.\n\nThis file is your **ground truth**. It represents human scholarly judgment. You will keep this file safe to test automated tools later this week.\n\n**Takeaway:** Your Tuesday manual files establish the verified human ground truth against which all algorithmic and AI tools will be measured.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Creating Your Tuesday Ground Truth File", "questiontext": "<p>What role do today's manual files (alignment_manual.xml and gloss_manual.xml) play in your semester project?</p>", "generalfeedback": "<p>Your Tuesday manual files establish the verified human ground truth against which all algorithmic and AI tools will be measured.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They establish the verified human ground truth against which all automated and AI tools will be evaluated.</p>", "feedback": "<p>Correct. Today's manual baseline is the gold standard used to measure the accuracy of deterministic and AI tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They are temporary scratch files that should be deleted as soon as class ends.</p>", "feedback": "<p>Incorrect. These files are essential course deliverables that benchmark the entire week's work.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They are printed out and mailed to the National Archives in Paris.</p>", "feedback": "<p>Incorrect. They remain in your project repository as local digital milestones.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They replace your final portfolio so you do not have to do any more work this term.</p>", "feedback": "<p>Incorrect. Today's work builds one key component of your comprehensive edition portfolio.</p>"}]}}, {"step": 30, "title": "Looking Ahead: Why Today's Manual Work Matters", "content": "**Looking Ahead: Why Today's Manual Work Matters**\n\nCongratulations on completing your first manual alignment and linguistic gloss!\n\nHere is why your manual effort is so valuable:\n\n* **Wednesday's Lesson (Deterministic Tools):** Tomorrow we will introduce automated sentence alignment software (the Gale-Church algorithm). You will test whether a computer script can match the sentences you aligned by hand.\n* **Friday's Lesson (AI Assistance):** On Friday, you will ask an AI model in VS Code to generate alignments and Leipzig glosses. You will evaluate where the AI succeeded and where it stumbled.\n\nWithout today's manual baseline, you would have no way to evaluate automated tools. Scholarly digital editions always begin with human expertise.\n\n**Takeaway:** Today's manual alignment provides the essential benchmark required to test and audit automated and AI-assisted tools for the rest of the week.", "html": null, "image_b64": null, "question": {"name": "30 Question: Looking Ahead: Why Today's Manual Work Matters", "questiontext": "<p>How will you use today's manual alignment work during tomorrow's deterministic class meeting?</p>", "generalfeedback": "<p>Today's manual alignment provides the essential benchmark required to test and audit automated and AI-assisted tools for the rest of the week.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>You will test whether an automated alignment algorithm can match the sentence connections you created by hand.</p>", "feedback": "<p>Correct. Tomorrow's automated tools will be audited directly against the human gold standard you created today.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>You will discard your work and let the computer start over from scratch.</p>", "feedback": "<p>Incorrect. The computer output is measured against your manual ground truth.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>You will manually calculate statistical matrix multiplications on a chalkboard.</p>", "feedback": "<p>Incorrect. You will use automated tools to test against your manual baseline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>You will switch to a completely different language and abandon your manuscript.</p>", "feedback": "<p>Incorrect. You continue working with your chosen primary document.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
