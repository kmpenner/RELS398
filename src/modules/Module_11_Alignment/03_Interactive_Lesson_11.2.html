    <script>
        const lessonData = {"course_title": "Lesson 11.2: Automated Sentence Alignment and Rule-Based Tools", "subtitle": "Deterministic Sentence Alignment Tools", "total_sections": 30, "slides": [{"step": 1, "title": "The Need for Automated Sentence Alignment", "content": "**The Need for Automated Sentence Alignment**\n\nYesterday you aligned historical sentences completely by hand. You matched ten sentence pairs and inspected every word. Doing ten sentences by hand is pleasant and educational. \n\nHowever, historical documents are often much longer. A legal code can contain hundreds of pages. A diplomatic registry can span thousands of clauses. Aligning ten thousand sentences by hand would take months of tedious labor.\n\nThis is where computational algorithms help. Computers can compare sentence lengths and vocabulary in seconds. They can propose alignments across vast digital corpora.\n\nToday we explore Step 2 of the three-step cycle: **deterministic tools**. We will examine how automated algorithms align bilingual sentences, and we will measure their accuracy against your Tuesday manual ground truth.\n\n**Takeaway:** Automated sentence alignment algorithms scale up translation linking across thousands of sentences, freeing human scholars from repetitive manual labor.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: The Need for Automated Sentence Alignment", "questiontext": "<p>Why do scholars use automated sentence alignment algorithms when editing historical documents?</p>", "generalfeedback": "<p>Automated sentence alignment algorithms scale up translation linking across thousands of sentences, freeing human scholars from repetitive manual labor.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To scale up translation linking across long documents containing hundreds or thousands of sentences.</p>", "feedback": "<p>Correct. While manual alignment is ideal for short passages, automated algorithms allow scholars to process large corpora without months of tedious labor.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To permanently replace human editors so no one needs to read the manuscript.</p>", "feedback": "<p>Incorrect. Automated tools assist human scholars; they do not replace human editorial judgment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because human scholars are legally forbidden from aligning texts by hand.</p>", "feedback": "<p>Incorrect. Manual alignment is the primary gold standard taught in digital editing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To translate historical languages into binary machine code.</p>", "feedback": "<p>Incorrect. Alignment links natural language translations, not machine code.</p>"}]}}, {"step": 2, "title": "What Does \"Deterministic\" Mean in Text Alignment?", "content": "**What Does \"Deterministic\" Mean in Text Alignment?**\n\nIn computer science, a **deterministic algorithm** follows fixed, transparent mathematical rules. It does not guess. It does not use neural networks or artificial intelligence.\n\nKey qualities of deterministic tools:\n\n* Given the exact same two text files, the algorithm always produces the exact same alignment.\n* Every decision can be traced back to an explicit mathematical calculation.\n* The rules are predictable, repeatable, and transparent.\n\nDeterministic tools are the bedrock of scholarly computing. Because they operate on clear rules, you can understand exactly why an algorithm made a correct link or why it made a mistake.\n\n**Takeaway:** Deterministic tools follow fixed mathematical rules, producing predictable, transparent, and reproducible alignment results.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: What Does \"Deterministic\" Mean in Text Alignment?", "questiontext": "<p>What is the primary characteristic of a deterministic alignment algorithm?</p>", "generalfeedback": "<p>Deterministic tools follow fixed mathematical rules, producing predictable, transparent, and reproducible alignment results.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It follows fixed, transparent mathematical rules and always produces the exact same result given the same input.</p>", "feedback": "<p>Correct. Deterministic tools are fully predictable, transparent, and repeatable, with no hidden neural guessing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It uses artificial intelligence to hallucinate missing words.</p>", "feedback": "<p>Incorrect. Deterministic algorithms follow explicit mathematical rules rather than generative neural models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes its output randomly every time you run it on your computer.</p>", "feedback": "<p>Incorrect. Deterministic means non-random; identical inputs always produce identical outputs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires an expensive commercial software license to execute.</p>", "feedback": "<p>Incorrect. Most deterministic alignment algorithms are open source and freely available.</p>"}]}}, {"step": 3, "title": "The Core Intuition: Length-Based Alignment", "content": "**The Core Intuition: Length-Based Alignment**\n\nHow can a computer match sentences in two different languages without understanding what the words mean?\n\nIn 1993, researchers William Gale and Kenneth Church discovered a fascinating linguistic truth. When humans translate text, sentence length remains remarkably consistent:\n\n* A short source sentence almost always produces a short translated sentence.\n* A long source paragraph almost always produces a long translated paragraph.\n* Translators rarely turn a five-word clause into a fifty-word speech.\n\nThis insight forms the basis of **length-based sentence alignment** (the Gale-Church algorithm). Instead of reading the words, the computer simply counts characters. It pairs sentences whose character lengths match expected linguistic ratios.\n\n**Takeaway:** Length-based alignment relies on the fact that translated sentences naturally correlate in length with their original source sentences.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Core Intuition: Length-Based Alignment", "questiontext": "<p>What fundamental linguistic observation forms the basis of the Gale-Church length-based alignment algorithm?</p>", "generalfeedback": "<p>Length-based alignment relies on the fact that translated sentences naturally correlate in length with their original source sentences.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Translated sentences naturally correlate in length with their original source sentences.</p>", "feedback": "<p>Correct. Gale and Church discovered that long sentences translate into long sentences and short sentences translate into short sentences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translators always reverse the order of sentences in every chapter.</p>", "feedback": "<p>Incorrect. Translations generally follow the chronological order of the source text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All French words have exactly five letters when translated into English.</p>", "feedback": "<p>Incorrect. Word lengths vary wildly; overall sentence lengths correlate.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Sentences in historical documents can only be aligned if they rhyme.</p>", "feedback": "<p>Incorrect. Alignment operates on prose and poetry regardless of rhyme.</p>"}]}}, {"step": 4, "title": "Character Counts vs. Word Counts", "content": "**Character Counts vs. Word Counts**\n\nWhy did Gale and Church count individual characters rather than whole words?\n\nLanguages differ significantly in how they build words:\n\n* Some languages use many short helper words (prepositions, articles, auxiliary verbs).\n* Other languages combine concepts into long, inflected compound words.\n* English might use three words (*in the house*) where Latin uses one (*domi*).\n\nHowever, total character length (the number of letters) remains surprisingly stable across European translations. On average, a French sentence has about 1.15 characters for every 1.0 character in its English translation.\n\nBy comparing character counts rather than word counts, length-based algorithms avoid errors caused by differing word-formation habits.\n\n**Takeaway:** Counting characters rather than words provides a more stable baseline for comparing sentence lengths across different languages.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Character Counts vs. Word Counts", "questiontext": "<p>Why do length-based algorithms like Gale-Church count characters rather than words?</p>", "generalfeedback": "<p>Counting characters rather than words provides a more stable baseline for comparing sentence lengths across different languages.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Character counts provide a more stable ratio across languages with differing word-formation habits.</p>", "feedback": "<p>Correct. Languages differ in how many separate words they use to express a concept, but total character count remains remarkably consistent.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Computers cannot count words because spaces are invisible to processors.</p>", "feedback": "<p>Incorrect. Computers easily count spaces, but character counts are linguistically more stable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Word counts are protected by international copyright laws.</p>", "feedback": "<p>Incorrect. Word counts are statistical measurements, not copyrighted property.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Character counts allow the algorithm to ignore vowels entirely.</p>", "feedback": "<p>Incorrect. The algorithm counts all characters including vowels and consonants.</p>"}]}}, {"step": 5, "title": "Sentence Boundary Detection", "content": "**Sentence Boundary Detection**\n\nBefore an algorithm can count characters in a sentence, it must know where each sentence starts and ends. This task is called **sentence boundary detection** or **sentence tokenization**.\n\nTo a computer, a text file is just a long ribbon of letters. The computer must search for sentence endings:\n\n* Periods (`.`), question marks (`?`), and exclamation points (`!`).\n* Whitespace following the punctuation mark.\n* A capital letter starting the next word.\n\nIn modern clean prose, sentence boundary detection is fairly easy. In historical documents, however, punctuation is full of traps.\n\n**Takeaway:** Sentence boundary detection splits raw text into discrete sentence units by identifying terminal punctuation and whitespace.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Sentence Boundary Detection", "questiontext": "<p>What is the primary function of sentence boundary detection (sentence tokenization)?</p>", "generalfeedback": "<p>Sentence boundary detection splits raw text into discrete sentence units by identifying terminal punctuation and whitespace.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Splitting a continuous ribbon of text into discrete sentence units by identifying terminal punctuation and whitespace.</p>", "feedback": "<p>Correct. Sentence splitters search for periods, exclamation marks, question marks, and trailing spaces to divide text into sentences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all capital letters from the historical document.</p>", "feedback": "<p>Incorrect. Capital letters are preserved and help signal new sentence starts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating Latin sentences into German syntax.</p>", "feedback": "<p>Incorrect. Sentence tokenization segments text within a single language.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Combining all paragraphs into a single continuous line.</p>", "feedback": "<p>Incorrect. Boundary detection divides text into smaller units rather than merging them.</p>"}]}}, {"step": 6, "title": "Historical Punctuation Traps", "content": "**Historical Punctuation Traps**\n\nHistorical manuscripts frequently confuse automated sentence splitters.\n\nCommon historical stumbling blocks include:\n\n* **Abbreviations:** Periods after titles and shortened words (*Mr.*, *Capt.*, *art.*, *décr.*) look like sentence endings.\n* **Archaic Punctuation:** Colon dashes (`:-`), virgules (`/`), and raised dots that modern software does not recognize.\n* **Run-On Legal Syntax:** 18th-century French decrees and English treaties often run for thirty lines without a single period.\n* **Informal Writing:** Maud Lewis letters often omit periods entirely or use dashes to separate thoughts.\n\nIf the sentence splitter breaks a sentence at the wrong spot, every downstream alignment will fail.\n\n**Takeaway:** Historical abbreviations, non-standard punctuation, and run-on legal clauses can trick automated sentence splitters.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Historical Punctuation Traps", "questiontext": "<p>Why do historical manuscripts frequently cause automated sentence splitters to fail?</p>", "generalfeedback": "<p>Historical abbreviations, non-standard punctuation, and run-on legal clauses can trick automated sentence splitters.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Periods following abbreviations (like Mr. or art.) and non-standard marks are easily mistaken for sentence endings.</p>", "feedback": "<p>Correct. Automated tools confuse abbreviation dots and archaic punctuation with true sentence boundaries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Historical scribes only wrote in lowercase letters without any ink.</p>", "feedback": "<p>Incorrect. Historical scribes used ink and diverse punctuation systems.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ancient documents dissolve whenever a computer scans them.</p>", "feedback": "<p>Incorrect. Digital surrogates protect physical documents from damage.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modern software refuses to open documents created before 1900.</p>", "feedback": "<p>Incorrect. Software processes text strings regardless of historical date.</p>"}]}}, {"step": 7, "title": "Visualizing the Alignment Matrix", "content": "**Visualizing the Alignment Matrix**\n\nTo understand how an alignment algorithm works, visualize a two-dimensional grid or **alignment matrix**.\n\nImagine a grid:\n\n* Source sentences are listed along the vertical axis (from top to bottom).\n* Translation sentences are listed along the horizontal axis (from left to right).\n\nEach cell in the grid represents a possible pairing between source sentence `s` and target sentence `t`.\n\nIf two texts run in the exact same chronological order, the correct alignment forms a diagonal line from the top-left corner down to the bottom-right corner. The algorithm's job is to find the most probable diagonal path across the grid.\n\n**Takeaway:** An alignment matrix plots source sentences against target sentences, where correct correspondences form a diagonal path across the grid.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: Visualizing the Alignment Matrix", "questiontext": "<p>In a two-dimensional alignment matrix, what visual shape does a correct, chronological alignment typically form?</p>", "generalfeedback": "<p>An alignment matrix plots source sentences against target sentences, where correct correspondences form a diagonal path across the grid.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A diagonal path running from the top-left corner down to the bottom-right corner.</p>", "feedback": "<p>Correct. When two parallel texts proceed in the same chronological order, corresponding sentence pairs form a diagonal path.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A perfect circle in the exact center of the computer screen.</p>", "feedback": "<p>Incorrect. Text alignment progresses sequentially across axes, not in a circle.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A vertical line along the left margin with no horizontal movement.</p>", "feedback": "<p>Incorrect. That would mean every source sentence mapped to the same single target sentence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A random scatter of dots resembling static noise on a television.</p>", "feedback": "<p>Incorrect. Random scatter indicates completely failed, unaligned text.</p>"}]}}, {"step": 8, "title": "The Cost Function: Scoring Sentence Pairs", "content": "**The Cost Function: Scoring Sentence Pairs**\n\nHow does the computer decide which path across the grid to take? It uses a **cost function**.\n\nA cost function assigns a mathematical penalty score to every potential cell:\n\n* If the length of source `s1` matches the expected length of target `t1`, the penalty score is near zero (an excellent match).\n* If `s1` is twenty characters long and `t1` is three hundred characters long, the penalty score is very high (an improbable match).\n\nThe algorithm calculates the penalty scores for all possible combinations. It selects the overall path through the grid that has the lowest total penalty.\n\n**Takeaway:** A cost function assigns penalty scores based on length differences, allowing the algorithm to find the path of least resistance.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: The Cost Function: Scoring Sentence Pairs", "questiontext": "<p>How does a cost function guide an alignment algorithm across the grid?</p>", "generalfeedback": "<p>A cost function assigns penalty scores based on length differences, allowing the algorithm to find the path of least resistance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It assigns penalty scores based on length differences, allowing the algorithm to find the path of least resistance.</p>", "feedback": "<p>Correct. Pairs with expected length ratios receive low penalties, while improbable pairings receive high penalties.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It calculates the financial dollar cost of hiring a human translator.</p>", "feedback": "<p>Incorrect. Cost in computer science refers to mathematical penalty, not money.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It charges the student five dollars for every error in their XML markup.</p>", "feedback": "<p>Incorrect. Cost functions are internal mathematical algorithms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the longest sentence in the document to save memory.</p>", "feedback": "<p>Incorrect. Cost functions score pairs; they do not delete text.</p>"}]}}, {"step": 9, "title": "Allowing for Structural Shifts", "content": "**Allowing for Structural Shifts**\n\nA naive algorithm would only look for simple one-to-one matches down the main diagonal. But real translations contain structural shifts.\n\nThe Gale-Church algorithm considers six possible move types at every step:\n\n* **1:1:** One source sentence maps to one target sentence.\n* **1:2:** One source sentence splits into two target sentences.\n* **2:1:** Two source sentences merge into one target sentence.\n* **1:0:** A source sentence was omitted in translation.\n* **0:1:** A target sentence was added with no source equivalent.\n* **2:2:** Two source sentences correspond to two target sentences as a combined block.\n\nThe algorithm tests each move type, searching for the lowest penalty score across the whole document.\n\n**Takeaway:** Robust alignment algorithms evaluate multiple move types (including splits and merges) to accommodate translational variations.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Allowing for Structural Shifts", "questiontext": "<p>Which move type in the Gale-Church algorithm represents a single source sentence split into two modern translated sentences?</p>", "generalfeedback": "<p>Robust alignment algorithms evaluate multiple move types (including splits and merges) to accommodate translational variations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A 1:2 alignment.</p>", "feedback": "<p>Correct. A 1:2 move pairs one source sentence with two target sentences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 1:0 alignment.</p>", "feedback": "<p>Incorrect. 1:0 represents an omission where text was untranslated.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 2:1 alignment.</p>", "feedback": "<p>Incorrect. 2:1 represents two source sentences merged into one target sentence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 0:1 alignment.</p>", "feedback": "<p>Incorrect. 0:1 represents an added target sentence with no source counterpart.</p>"}]}}, {"step": 10, "title": "The \"Domino Effect\" in Alignment Slippage", "content": "**The \"Domino Effect\" in Alignment Slippage**\n\nWhat happens when an automated algorithm makes a single mistake?\n\nBecause the algorithm reads sequentially from beginning to end, a single error can trigger a **domino effect**:\n\n* Suppose the algorithm accidentally aligns source sentence `s4` with translation `t5`.\n* Every subsequent sentence is now off by one.\n* Sentence `s5` will be incorrectly paired with `t6`, and `s6` will be paired with `t7`.\n\nThis cascading failure continues until the algorithm hits a major structural break or a massive length difference that forces it back on track.\n\nRecognizing the domino effect is crucial when auditing automated results.\n\n**Takeaway:** A single misalignment can cause a cascading domino effect where all subsequent sentences become shifted by one position.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: The \"Domino Effect\" in Alignment Slippage", "questiontext": "<p>What is the \"domino effect\" in automated sentence alignment?</p>", "generalfeedback": "<p>A single misalignment can cause a cascading domino effect where all subsequent sentences become shifted by one position.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A cascading failure where a single incorrect link causes all subsequent sentence pairs to be shifted by one position.</p>", "feedback": "<p>Correct. Because the algorithm reads sequentially, one missed link can throw all following sentences out of alignment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An algorithm that plays board games instead of reading historical texts.</p>", "feedback": "<p>Incorrect. Domino effect is a metaphor for cascading sequential errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A feature that automatically adds black and white dots to the XML tags.</p>", "feedback": "<p>Incorrect. The term describes alignment slippage across sequential text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A crash caused by placing a laptop on an uneven wooden desk.</p>", "feedback": "<p>Incorrect. It refers to data misalignment, not physical hardware balance.</p>"}]}}, {"step": 11, "title": "Lexical Anchors: Preventing Cascading Errors", "content": "**Lexical Anchors: Preventing Cascading Errors**\n\nHow do scholars prevent cascading alignment errors? We use **lexical anchors** (also called landmark words or cognates).\n\nLexical anchors are words that are easy for computers to identify in both languages:\n\n* **Proper Names:** *Louis*, *Halifax*, *Maud*, *Kinnear*, *Chebucto*.\n* **Dates and Numbers:** *1752*, *1791*, *1967*, *Article 3*.\n* **Cognates:** Words that look almost identical across languages (*constitution*, *assemblée*, *nation*).\n\nWhen the algorithm sees *1752* in source sentence `s8` and in translation sentence `t8`, it locks them together. These anchor points act like pins along the diagonal path, stopping domino errors in their tracks.\n\n**Takeaway:** Lexical anchors like dates, numbers, and proper names provide fixed landmark points that prevent cascading alignment errors.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Lexical Anchors: Preventing Cascading Errors", "questiontext": "<p>How do lexical anchors like dates and proper names prevent cascading alignment errors?</p>", "generalfeedback": "<p>Lexical anchors like dates, numbers, and proper names provide fixed landmark points that prevent cascading alignment errors.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They act as fixed landmark points that lock specific sentences together and stop domino errors in their tracks.</p>", "feedback": "<p>Correct. Numbers (1752, 1791) and names (Halifax, Louis) match easily across languages, providing firm anchor points.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They automatically translate all adjectives into modern English slang.</p>", "feedback": "<p>Incorrect. Anchors pin sentence pairs together; they do not alter vocabulary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete all XML tags from the document to simplify the file.</p>", "feedback": "<p>Incorrect. Anchors operate within XML sentence structures.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They prevent students from editing the text in Visual Studio Code.</p>", "feedback": "<p>Incorrect. Anchors assist algorithmic matching without restricting editing.</p>"}]}}, {"step": 12, "title": "Interactive Alignment Tools: Web GUIs", "content": "**Interactive Alignment Tools: Web GUIs**\n\nFor beginners, you do not need to write complex command-line scripts in Python to run sentence alignment. The digital humanities community has built excellent interactive web tools.\n\nTwo popular tools include:\n\n* **Alpheios Alignment Editor:** An open-source web application where you paste source and target texts. The system proposes initial alignments, and you drag and drop sentences to adjust connections.\n* **Ugarit Translation Alignment:** A browser-based platform designed for historical languages that exports clean TEI XML.\n\nThese graphical user interfaces (GUIs) let you harness algorithmic power while keeping full visual control over the results.\n\n**Takeaway:** Interactive web tools like Alpheios let scholars run alignment algorithms and manually adjust connections through a visual interface.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Interactive Alignment Tools: Web GUIs", "questiontext": "<p>What is the main benefit of using an interactive web tool like the Alpheios Alignment Editor for beginners?</p>", "generalfeedback": "<p>Interactive web tools like Alpheios let scholars run alignment algorithms and manually adjust connections through a visual interface.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows students to run alignment algorithms and adjust connections visually without writing complex command-line scripts.</p>", "feedback": "<p>Correct. Web GUIs provide drag-and-drop visual interfaces that make algorithmic alignment accessible to novices.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces Visual Studio Code completely so students never have to look at XML.</p>", "feedback": "<p>Incorrect. Web tools export clean XML that students inspect and validate in VS Code.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically writes the student's final term paper for them.</p>", "feedback": "<p>Incorrect. Alignment tools assist text linking, not paper drafting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It connects to social media to share student homework publicly.</p>", "feedback": "<p>Incorrect. DH tools focus on scholarship and research privacy.</p>"}]}}, {"step": 13, "title": "Step-by-Step: Using an Alignment Web GUI", "content": "**Step-by-Step: Using an Alignment Web GUI**\n\nHere is the standard workflow when using a web alignment tool:\n\n1. **Prepare Your Text:** Copy your clean transcription text into your clipboard.\n2. **Paste into Columns:** Open the tool in your web browser. Paste the historical source text on the left and your English translation on the right.\n3. **Run Automatic Splitting:** Click the button to detect sentence boundaries. Verify that the sentence cuts look correct.\n4. **Inspect Initial Links:** Review the algorithm's proposed sentence pairs.\n5. **Drag to Correct:** If you spot a split (1:2) or merge (2:1), drag the sentence boxes together.\n6. **Export TEI XML:** Click export to download your clean `<linkGrp>` markup.\n\nThis visual workflow avoids terminal friction while producing professional XML data.\n\n**Takeaway:** Web alignment tools follow a simple paste, split, align, adjust, and export workflow that eliminates command-line frustration.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Step-by-Step: Using an Alignment Web GUI", "questiontext": "<p>What is the standard workflow when using a web-based text alignment tool?</p>", "generalfeedback": "<p>Web alignment tools follow a simple paste, split, align, adjust, and export workflow that eliminates command-line frustration.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Paste texts, detect sentence boundaries, inspect proposed links, drag to correct errors, and export TEI XML.</p>", "feedback": "<p>Correct. This simple visual workflow allows students to harness automated algorithms while maintaining full editorial control.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete both text files, restart the computer, and retype everything in Latin.</p>", "feedback": "<p>Incorrect. Web tools process existing transcriptions and translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Print both files on paper, cut them with scissors, and paste them onto cardboard.</p>", "feedback": "<p>Incorrect. Alignment tools operate digitally inside the browser.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Send an email to the university registrar asking for permission to align words.</p>", "feedback": "<p>Incorrect. Alignment is a standard classroom computational lab exercise.</p>"}]}}, {"step": 14, "title": "Translating Tool Output into TEI Standoff Markup", "content": "**Translating Tool Output into TEI Standoff Markup**\n\nWhen you export data from an alignment tool, inspect the resulting XML.\n\nA clean export produces a standard TEI `<linkGrp>`:\n\n```xml\n<linkGrp type=\"sentence-alignment\">\n  <link target=\"#s1 #t1\"/>\n  <link target=\"#s2 #t2\"/>\n  <link target=\"#s3 #t3 #t4\"/>\n</linkGrp>\n```\n\nCheck the exported file against your document:\n\n* Do the IDs in the `@target` attributes match the `xml:id` values in your transcription?\n* Are the hash marks (`#`) present on every target?\n* Is the `<linkGrp>` wrapped inside a `<standOff>` container?\n\nUnderstanding the underlying XML ensures you can fix formatting errors easily.\n\n**Takeaway:** Always inspect exported alignment XML to verify that target IDs, hash marks, and standOff containers conform to TEI standards.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Translating Tool Output into TEI Standoff Markup", "questiontext": "<p>When inspecting XML exported from an alignment tool, what should an editor immediately verify?</p>", "generalfeedback": "<p>Always inspect exported alignment XML to verify that target IDs, hash marks, and standOff containers conform to TEI standards.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>That target IDs match declared xml:id attributes, hash marks (#) are present, and the linkGrp is properly placed.</p>", "feedback": "<p>Correct. Verifying IDs, hash prefixes, and standoff placement ensures exported data integrates cleanly into your project.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That all words have been translated into ancient Classical Greek.</p>", "feedback": "<p>Incorrect. Exported data preserves the languages of your source and translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the XML file contains at least fifty decorative images.</p>", "feedback": "<p>Incorrect. linkGrp files contain text link coordinates, not graphic illustrations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That all sentence tags have been replaced by HTML paragraphs.</p>", "feedback": "<p>Incorrect. TEI scholarly editions use &lt;s&gt; tags and standoff links.</p>"}]}}, {"step": 15, "title": "Word-Level Alignment: Beyond the Sentence", "content": "**Word-Level Alignment: Beyond the Sentence**\n\nOnce sentences are linked, can algorithms align individual words?\n\nSentence alignment is relatively easy because sentence order rarely changes. Word alignment is much harder because different languages use radically different word orders:\n\n* In English, adjectives precede nouns (*the white cat*).\n* In French, adjectives often follow nouns (*le chat blanc*).\n* German puts verbs at the very end of subordinate clauses.\n\nAutomated word alignment tools must map complex word shuffles without getting confused by reordered syntax.\n\n**Takeaway:** Word-level alignment is more challenging than sentence alignment because languages frequently invert or reorder words.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: Word-Level Alignment: Beyond the Sentence", "questiontext": "<p>Why is word-level alignment significantly more difficult for algorithms than sentence-level alignment?</p>", "generalfeedback": "<p>Word-level alignment is more challenging than sentence alignment because languages frequently invert or reorder words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Languages frequently invert or reorder words, creating complex non-linear mapping patterns.</p>", "feedback": "<p>Correct. Sentences usually follow chronological order, but words shuffle (e.g. French adjectives following nouns while English adjectives precede them).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Words are too small for modern computer microprocessors to detect.</p>", "feedback": "<p>Incorrect. Computers easily process individual characters and words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Word alignment is forbidden by international copyright conventions.</p>", "feedback": "<p>Incorrect. Word-level alignment is a standard computational linguistics method.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because all words in historical documents are spelled identically.</p>", "feedback": "<p>Incorrect. Historical spelling variation makes alignment harder, not identical.</p>"}]}}, {"step": 16, "title": "Bilingual Dictionaries and Lookup Tables", "content": "**Bilingual Dictionaries and Lookup Tables**\n\nHow do deterministic tools approach word alignment? They rely on **bilingual dictionaries** and lookup tables.\n\nA deterministic word aligner checks each word against a dictionary:\n\n* It looks up the French word *décret* and finds English *decree*.\n* If both words appear in linked sentences `s1` and `t1`, it creates a word link.\n* It checks inflected forms against a lemmatized vocabulary list.\n\nWhen a word appears in the dictionary, alignment is fast and accurate. But when historical spelling diverges from modern dictionaries, the rule-based approach stalls.\n\n**Takeaway:** Deterministic word aligners use bilingual dictionaries to match words across linked sentences, succeeding when vocabulary is standardized.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Bilingual Dictionaries and Lookup Tables", "questiontext": "<p>How do deterministic word aligners use bilingual dictionaries to match vocabulary?</p>", "generalfeedback": "<p>Deterministic word aligners use bilingual dictionaries to match words across linked sentences, succeeding when vocabulary is standardized.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They look up source words and match them with target words in corresponding sentences when terms appear in the dictionary.</p>", "feedback": "<p>Correct. Deterministic aligners check standardized vocabulary lists to establish direct lexical correspondences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They translate entire books automatically using neural deep learning.</p>", "feedback": "<p>Incorrect. Deterministic tools use fixed lookup tables, not neural networks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete any word that does not have an exact five-letter English translation.</p>", "feedback": "<p>Incorrect. Lookup tables handle words of any character length.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They guess the meaning of words by analyzing the student's keystrokes.</p>", "feedback": "<p>Incorrect. Alignment algorithms analyze text files, not keyboard hardware.</p>"}]}}, {"step": 17, "title": "The Out-of-Vocabulary (OOV) Bottleneck", "content": "**The Out-of-Vocabulary (OOV) Bottleneck**\n\nWhen historical words do not appear in modern dictionaries, we call them **out-of-vocabulary (OOV)** words.\n\nHistorical documents are filled with OOV words:\n\n* Archaic legal terms (*assignats*, *billon*, *lettres patentes*).\n* Regional place names (*Cobequid*, *Chebucto*, *Digby Gut*).\n* Historical spelling variations (*agree-d*, *compleat*, *recompence*).\n\nA rule-based dictionary cannot link a word it has never seen. When an algorithm encounters an OOV word, it leaves the word unaligned or guesses incorrectly.\n\nHuman editors must step in to bridge these lexical gaps.\n\n**Takeaway:** Out-of-vocabulary words like archaic spellings and local place names cannot be resolved by standard bilingual dictionaries alone.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: The Out-of-Vocabulary (OOV) Bottleneck", "questiontext": "<p>What are out-of-vocabulary (OOV) words in historical digital philology?</p>", "generalfeedback": "<p>Out-of-vocabulary words like archaic spellings and local place names cannot be resolved by standard bilingual dictionaries alone.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Archaic terms, local place names, and spelling variants that do not appear in modern standardized dictionaries.</p>", "feedback": "<p>Correct. OOV words cannot be resolved by standard lookup tables because the dictionary lacks records for historical forms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Words that students are forbidden from saying out loud in class.</p>", "feedback": "<p>Incorrect. OOV is a computational linguistics term for missing dictionary entries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Words that contain more than twenty consonants in a row.</p>", "feedback": "<p>Incorrect. OOV refers to lexical absence in a reference database, not word length.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>English words that were invented after the year 2000.</p>", "feedback": "<p>Incorrect. In historical editing, OOV words are typically archaic historical terms.</p>"}]}}, {"step": 18, "title": "Comparing Manual and Deterministic Results", "content": "**Comparing Manual and Deterministic Results**\n\nNow we come to the core pedagogical exercise of our three-step cycle: **the comparative audit**.\n\nYou have two sets of sentence alignments:\n\n1. **Set A (Your Tuesday Baseline):** Hand-crafted in VS Code, representing verified human judgment.\n2. **Set B (Wednesday's Algorithm):** Produced automatically by length-based alignment software.\n\nPlace both files side by side in VS Code using the two-column split editor. Compare them sentence by sentence. Where did the algorithm agree with your human choices? Where did it make a different choice?\n\n**Takeaway:** Comparing automated algorithmic results against your manual baseline reveals the strengths and weaknesses of computational methods.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Comparing Manual and Deterministic Results", "questiontext": "<p>What is the primary objective of comparing your Tuesday manual alignment against Wednesday's automated algorithmic output?</p>", "generalfeedback": "<p>Comparing automated algorithmic results against your manual baseline reveals the strengths and weaknesses of computational methods.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To evaluate the algorithm's accuracy against a verified human gold standard and understand its failure modes.</p>", "feedback": "<p>Correct. The comparative audit reveals where mathematical formulas succeed and where human intervention remains necessary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prove that computers are completely useless and should be thrown away.</p>", "feedback": "<p>Incorrect. Algorithms scale up processing speed; auditing teaches how to supervise them effectively.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force the student to delete their Tuesday manual files.</p>", "feedback": "<p>Incorrect. Tuesday's manual baseline is preserved as the permanent gold standard.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To see which student can type the fastest in the terminal.</p>", "feedback": "<p>Incorrect. The exercise is a rigorous qualitative and quantitative audit, not a typing speed race.</p>"}]}}, {"step": 19, "title": "Calculating Accuracy: Precision and Recall", "content": "**Calculating Accuracy: Precision and Recall**\n\nTo evaluate the algorithm scientifically, we use two standard metrics: **Precision** and **Recall**.\n\nThink of them in plain terms:\n\n* **Precision:** Out of all the links the algorithm proposed, how many were actually correct?\n* **Recall:** Out of all the true links that exist in the text, how many did the algorithm manage to find?\n\n<table>\n  <thead>\n    <tr>\n      <th style=\"width: 25%;\">Metric</th>\n      <th style=\"width: 40%;\">Plain English Definition</th>\n      <th style=\"width: 35%;\">Formula</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Precision</strong></td>\n      <td>How reliable are the proposed links?</td>\n      <td>Correct Links / Total Proposed Links</td>\n    </tr>\n    <tr>\n      <td><strong>Recall</strong></td>\n      <td>How complete is the alignment?</td>\n      <td>Correct Links / Total True Links</td>\n    </tr>\n  </tbody>\n</table>\n\nCalculating these two percentages gives you an objective measurement of algorithmic quality.\n\n**Takeaway:** Precision measures the accuracy of proposed links, while recall measures how many total true links were captured.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Calculating Accuracy: Precision and Recall", "questiontext": "<p>In text alignment evaluation, what does Precision measure?</p>", "generalfeedback": "<p>Precision measures the accuracy of proposed links, while recall measures how many total true links were captured.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The proportion of proposed links that are genuinely correct (Correct Links / Total Proposed Links).</p>", "feedback": "<p>Correct. Precision answers: when the algorithm claimed two sentences matched, how often was it right?</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The physical weight of the manuscript in grams.</p>", "feedback": "<p>Incorrect. Precision is a statistical accuracy metric, not a physical scale measurement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The speed at which the computer processor cooled down after running.</p>", "feedback": "<p>Incorrect. Precision evaluates link correctness, not CPU temperature.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The total number of sentences in the entire French archive.</p>", "feedback": "<p>Incorrect. That is corpus size, not alignment precision.</p>"}]}}, {"step": 20, "title": "Case Study: Auditing Ace's 1791 French Decree", "content": "**Case Study: Auditing Ace's 1791 French Decree**\n\nLet us see how a length-based algorithm performs on Ace's French Revolutionary decree.\n\nThe French decree contains formal administrative clauses:\n\n* Sentence 1 announces the decree (*L'Assemblée Nationale décrète...*).\n* Sentence 2 is an eighty-word sentence specifying metal currency denominations.\n\nWhat happens during automated alignment?\n\n* **Success:** Sentence 1 is short in French and short in English. The algorithm scores a clean 1:1 match with 100% precision.\n* **Failure:** In Sentence 2, the English translator split the eighty-word sentence into two clear English sentences. The length algorithm attempted a 1:1 match and failed.\n\nHuman intervention was required to change the 1:1 link into a 1:2 link.\n\n**Takeaway:** Length-based tools handle simple French clauses easily but struggle when translators split long administrative sentences.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Case Study: Auditing Ace's 1791 French Decree", "questiontext": "<p>Why did the length-based alignment algorithm struggle on Sentence 2 of Ace's French decree?</p>", "generalfeedback": "<p>Length-based tools handle simple French clauses easily but struggle when translators split long administrative sentences.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The English translator split an eighty-word French legal sentence into two shorter English sentences (a 1:2 split).</p>", "feedback": "<p>Correct. The length algorithm expected a 1:1 ratio and failed when the translator divided the long administrative clause.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because 1791 French decrees were written backwards from right to left.</p>", "feedback": "<p>Incorrect. French is written left to right; the challenge was sentence splitting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the algorithm crashed whenever it encountered the word assignat.</p>", "feedback": "<p>Incorrect. Length algorithms count characters; they do not crash on specific words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the French National Assembly banned all English translations.</p>", "feedback": "<p>Incorrect. The failure was a structural 1:2 translation asymmetry.</p>"}]}}, {"step": 21, "title": "Case Study: Auditing Andromeda's 1752 Treaty", "content": "**Case Study: Auditing Andromeda's 1752 Treaty**\n\nAndromeda's document is the 1752 Peace and Friendship Treaty. It features numbered articles.\n\nNumbered articles provide a huge advantage for alignment algorithms:\n\n* Every article begins with an explicit label (*Article 1*, *Article 2*, *Article 3*).\n* Numbers act as perfect lexical anchors.\n* Even if sentence lengths vary, the Roman numerals keep the algorithm on track.\n\nBecause the treaty text has strong structural anchors, the automated alignment achieved nearly 95% precision. \n\nStructured legal texts with numbered divisions are the easiest genre for automated tools to align.\n\n**Takeaway:** Numbered articles and Roman numerals act as structural anchors that dramatically boost alignment accuracy in legal treaties.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Case Study: Auditing Andromeda's 1752 Treaty", "questiontext": "<p>Why did automated alignment achieve exceptionally high accuracy (95%) on Andromeda's 1752 treaty?</p>", "generalfeedback": "<p>Numbered articles and Roman numerals act as structural anchors that dramatically boost alignment accuracy in legal treaties.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Numbered articles and Roman numerals provided unmistakable structural anchors that kept the algorithm aligned.</p>", "feedback": "<p>Correct. Numbered headings act like pins along the alignment matrix diagonal, preventing cascading slippage.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the treaty was translated into modern English by an artificial intelligence model.</p>", "feedback": "<p>Incorrect. The 1752 treaty is a historical 18th-century English proclamation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the treaty contains only one sentence in total.</p>", "feedback": "<p>Incorrect. The treaty contains multiple articles and extensive legal clauses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because colonial treaties were encoded in XML in 1752.</p>", "feedback": "<p>Incorrect. XML was created in the late 1990s.</p>"}]}}, {"step": 22, "title": "Case Study: Auditing Olyvia's Maud Lewis Letter", "content": "**Case Study: Auditing Olyvia's Maud Lewis Letter**\n\nOlyvia's document is an informal handwritten letter by Maud Lewis.\n\nLetters present distinct challenges for length-based algorithms:\n\n* Maud's sentences are brief and conversational (*I got your letter. Was glad to hear.*).\n* Punctuation is sporadic; thoughts flow together without periods.\n* In a parallel French translation, colloquial Maritime expressions require longer French phrasing.\n\nBecause the sentence boundaries were ambiguous, the automated sentence splitter struggled. It merged two short thoughts into one block. \n\nThis case demonstrates why personal letters require careful human boundary checking before running automated tools.\n\n**Takeaway:** Informal letters with conversational syntax and sporadic punctuation require human boundary editing before algorithms can succeed.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Case Study: Auditing Olyvia's Maud Lewis Letter", "questiontext": "<p>Why did automated sentence boundary detection require manual human editing on Olyvia's Maud Lewis letters?</p>", "generalfeedback": "<p>Informal letters with conversational syntax and sporadic punctuation require human boundary editing before algorithms can succeed.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Maud Lewis used informal conversational syntax with sporadic periods, causing the tool to merge distinct thoughts.</p>", "feedback": "<p>Correct. Informal handwriting and conversational writing lack standard punctuation boundaries, confusing automated splitters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Maud Lewis wrote her letters in secret invisible ink.</p>", "feedback": "<p>Incorrect. Her letters are written in standard ink on personal stationery.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because letters written in Nova Scotia cannot be read by computers in Canada.</p>", "feedback": "<p>Incorrect. Software operates identically regardless of regional geographic location.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Maud Lewis refused to write letters with more than five words.</p>", "feedback": "<p>Incorrect. Her letters feature flowing personal narratives.</p>"}]}}, {"step": 23, "title": "Evaluating Non-Isomorphic Alignments", "content": "**Evaluating Non-Isomorphic Alignments**\n\nIn linguistics, **isomorphism** means having the exact same shape or structure. When two languages share the same sentence structure, alignment is isomorphic.\n\n**Non-isomorphic alignments** occur when two languages express the same meaning using completely different grammatical structures:\n\n* A single French passive participle requires an English subordinate clause with three words.\n* A legal idiom in the 1752 treaty requires a full sentence explanation in modern French.\n\nDeterministic algorithms expect roughly equal ratios. When syntax becomes non-isomorphic, length formulas break down. Documenting these moments teaches us where languages diverge in expressive style.\n\n**Takeaway:** Non-isomorphic structures occur when languages use radically different grammatical forms to express the same thought.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Evaluating Non-Isomorphic Alignments", "questiontext": "<p>What characterizes a non-isomorphic alignment between historical source and target texts?</p>", "generalfeedback": "<p>Non-isomorphic structures occur when languages use radically different grammatical forms to express the same thought.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The two languages use radically different grammatical structures to express the same underlying thought.</p>", "feedback": "<p>Correct. Non-isomorphism occurs when structural shapes diverge, such as an idiom or single participle requiring a full explanatory clause.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Both texts use the exact same words in the exact same grammatical order.</p>", "feedback": "<p>Incorrect. That describes an isomorphic, word-for-word correspondence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The translation was created on a completely different planet.</p>", "feedback": "<p>Incorrect. Non-isomorphic structures reflect natural cross-lingual grammatical divergence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The XML file fails validation because of a missing closing tag.</p>", "feedback": "<p>Incorrect. Non-isomorphism is a linguistic concept, not an XML syntax error.</p>"}]}}, {"step": 24, "title": "Pre-Processing Your Texts for Better Alignment", "content": "**Pre-Processing Your Texts for Better Alignment**\n\nIf you want automated tools to succeed, you should prepare your texts beforehand. This preparation is called **pre-processing**.\n\nSimple pre-processing steps for novices:\n\n1. **Clean Up Broken Words:** Remove hyphenated line-end splits from transcription files (*fa- / brication* becomes *fabrication*).\n2. **Standardize Abbreviations:** Expand known abbreviations or protect trailing periods (*Mr.* becomes `Mr_`).\n3. **Harmonize Paragraphs:** Ensure that both files have the same number of paragraph breaks before running sentence splitters.\n\nSpending three minutes cleaning text before alignment saves an hour of manual corrections later.\n\n**Takeaway:** Pre-processing text by cleaning line breaks, harmonizing paragraphs, and protecting abbreviations drastically improves alignment accuracy.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Pre-Processing Your Texts for Better Alignment", "questiontext": "<p>Which simple pre-processing step helps prevent automated sentence splitters from misidentifying sentence endings?</p>", "generalfeedback": "<p>Pre-processing text by cleaning line breaks, harmonizing paragraphs, and protecting abbreviations drastically improves alignment accuracy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Standardizing or protecting abbreviation periods (e.g. converting Mr. to Mr_) before running the splitter.</p>", "feedback": "<p>Correct. Protecting abbreviation dots ensures the tool only splits text at genuine sentence terminals.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting every capital letter from the entire document.</p>", "feedback": "<p>Incorrect. Capital letters help identify sentence boundaries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replacing all spaces with exclamation marks.</p>", "feedback": "<p>Incorrect. That would create chaos for tokenization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Printing the file on yellow paper to improve optical contrast.</p>", "feedback": "<p>Incorrect. Pre-processing operates on digital text files.</p>"}]}}, {"step": 25, "title": "Automated Standoff Generation in Python", "content": "**Automated Standoff Generation in Python**\n\nFor students interested in how tools work behind the scenes, a simple Python script can generate `<linkGrp>` markup in seconds.\n\nHere is the general structure of an alignment script:\n\n1. It reads the source file and extracts all elements with `xml:id` attributes starting with `s`.\n2. It reads the translation file and extracts all elements with IDs starting with `t`.\n3. It compares character lengths and pairs matching IDs.\n4. It writes a clean `<linkGrp>` block to an output file.\n\nYou do not need to write this script today. But knowing that the logic is straightforward demystifies digital tools.\n\n**Takeaway:** Scripted alignment simply automates ID extraction, length comparison, and XML writing into a repeatable loop.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Automated Standoff Generation in Python", "questiontext": "<p>What basic operations does a simple Python alignment script perform to produce TEI markup?</p>", "generalfeedback": "<p>Scripted alignment simply automates ID extraction, length comparison, and XML writing into a repeatable loop.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It extracts sentence IDs from both files, compares their character lengths, and writes paired IDs into a &lt;linkGrp&gt;.</p>", "feedback": "<p>Correct. Scripted alignment automates extraction, mathematical comparison, and XML generation into a fast, repeatable loop.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It builds a physical robot that types on a mechanical typewriter.</p>", "feedback": "<p>Incorrect. Python scripts run digital data processing loops.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates the document into twenty languages using Google Translate.</p>", "feedback": "<p>Incorrect. Alignment scripts link existing texts; they do not generate machine translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the user's hard drive after every execution.</p>", "feedback": "<p>Incorrect. The script safely writes clean XML markup.</p>"}]}}, {"step": 26, "title": "Saving Your Wednesday Alignment File", "content": "**Saving Your Wednesday Alignment File**\n\nToday you will save your verified algorithmic output in your project repository.\n\nFile naming convention:\n\n* File path: `alignment_deterministic.xml`.\n* Location: Your project root folder alongside `alignment_manual.xml`.\n* Content: Your 10-sentence passage with automated links that you have inspected, corrected, and verified.\n\nIn the file header, record any changes you had to make to the algorithm's initial proposal. Documenting your edits shows how human expertise refines computational output.\n\n**Takeaway:** Save your inspected algorithmic output as alignment_deterministic.xml, documenting any corrections made to the computer's proposals.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Saving Your Wednesday Alignment File", "questiontext": "<p>What is the standard naming convention for your inspected algorithmic alignment output in your project folder?</p>", "generalfeedback": "<p>Save your inspected algorithmic output as alignment_deterministic.xml, documenting any corrections made to the computer's proposals.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>alignment_deterministic.xml</p>", "feedback": "<p>Correct. Saving the file as alignment_deterministic.xml distinguishes the algorithmic output from your Tuesday manual file.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>final_everything_done_v2_really_final.txt</p>", "feedback": "<p>Incorrect. Professional course repositories require standardized, disciplined naming conventions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>my_homework.docx</p>", "feedback": "<p>Incorrect. All course deliverables are encoded in TEI XML, not Microsoft Word.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>deleted_file.trash</p>", "feedback": "<p>Incorrect. The file is a permanent course deliverable.</p>"}]}}, {"step": 27, "title": "Documenting Discrepancies in ALIGNMENT.md", "content": "**Documenting Discrepancies in ALIGNMENT.md**\n\nA scholarly edition does not just publish data; it explains its editorial methodology.\n\nIn your project repository, open `ALIGNMENT.md` and record your findings:\n\n* Total sentence pairs tested.\n* Number of pairs the algorithm got right on the first try.\n* Number of pairs that required human correction.\n* Calculated Precision and Recall percentages.\n* A brief paragraph explaining why the algorithm struggled on specific sentences.\n\nThis reflection document forms part of your semester portfolio.\n\n**Takeaway:** Documenting alignment metrics and failure modes in ALIGNMENT.md provides scholarly transparency for your digital edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Documenting Discrepancies in ALIGNMENT.md", "questiontext": "<p>What key information should you record in your ALIGNMENT.md reflection document?</p>", "generalfeedback": "<p>Documenting alignment metrics and failure modes in ALIGNMENT.md provides scholarly transparency for your digital edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Total pairs tested, precision and recall percentages, and a qualitative explanation of why the algorithm struggled on specific sentences.</p>", "feedback": "<p>Correct. Documenting quantitative metrics and qualitative failure modes ensures scholarly transparency and methodology reporting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The weather forecast for Halifax for the next two weeks.</p>", "feedback": "<p>Incorrect. The reflection records textual scholarship and algorithmic performance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A list of every student's favorite pizza toppings.</p>", "feedback": "<p>Incorrect. The document is an academic methodology report.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A copy of the entire university course catalogue.</p>", "feedback": "<p>Incorrect. ALIGNMENT.md focuses specifically on your primary witness and alignment findings.</p>"}]}}, {"step": 28, "title": "Common Novice Pitfalls in Algorithmic Alignment", "content": "**Common Novice Pitfalls in Algorithmic Alignment**\n\nWhen working with automated alignment tools, watch out for these four traps:\n\n1. **Trusting the Algorithm Blindly:** Assuming that because a computer generated the links, they must be correct. Always verify by eye.\n2. **Ignoring the Domino Effect:** Missing a single shifted link at sentence four, resulting in eight misaligned sentences below it.\n3. **Mismatched IDs After Export:** Exporting generic IDs (`src_1`, `tgt_1`) from a web tool that do not match your project's `xml:id` convention.\n4. **Deleting Punctuation in Pre-Processing:** Accidentally erasing periods needed for sentence splitting while cleaning up text.\n\nStaying alert to these pitfalls ensures your data remains rigorous.\n\n**Takeaway:** Avoid blind trust in algorithms, check for cascading shifts, and ensure exported IDs match your project's naming conventions.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Common Novice Pitfalls in Algorithmic Alignment", "questiontext": "<p>Why is \"blind trust\" in automated alignment tools dangerous for digital critical editions?</p>", "generalfeedback": "<p>Avoid blind trust in algorithms, check for cascading shifts, and ensure exported IDs match your project's naming conventions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Algorithms frequently slip on historical abbreviations and split sentences, causing cascading errors that corrupt the edition.</p>", "feedback": "<p>Correct. Without careful human verification, automated errors pass unnoticed into the published scholarly record.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because alignment algorithms are programmed by hackers to steal bank passwords.</p>", "feedback": "<p>Incorrect. The tools are scholarly software; the danger is data inaccuracy, not security theft.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computers are incapable of processing numbers greater than ten.</p>", "feedback": "<p>Incorrect. Computers excel at mathematics; they struggle with human linguistic nuance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because university professors dislike computers.</p>", "feedback": "<p>Incorrect. Digital methods are taught specifically to harness computational tools with scholarly rigor.</p>"}]}}, {"step": 29, "title": "The Limits of Deterministic Tools", "content": "**The Limits of Deterministic Tools**\n\nDeterministic tools are fast, transparent, and reproducible. But they have clear limits:\n\n* They do not understand semantics, context, or metaphor.\n* They cannot recognize when a translator translated a phrase idiomatically rather than literally.\n* They fail when historical spelling is inconsistent or unstandardized.\n\nA length formula knows that two sentences are fifty characters long. It cannot tell you whether the sentences actually mean the same thing. Human judgment remains irreplaceable.\n\n**Takeaway:** While deterministic tools excel at speed and mathematical transparency, they lack semantic understanding and cannot interpret figurative language.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: The Limits of Deterministic Tools", "questiontext": "<p>What fundamental capability do deterministic alignment tools lack compared to human scholars?</p>", "generalfeedback": "<p>While deterministic tools excel at speed and mathematical transparency, they lack semantic understanding and cannot interpret figurative language.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They lack semantic understanding and cannot interpret context, figurative language, or idiomatic expressions.</p>", "feedback": "<p>Correct. Deterministic tools compare character lengths mathematically; they do not comprehend the meaning of human words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They cannot run on electricity.</p>", "feedback": "<p>Incorrect. Computers run on electricity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They cannot process text written in the English alphabet.</p>", "feedback": "<p>Incorrect. Deterministic tools process Latin, Greek, French, and English characters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They are incapable of saving files to a local hard drive.</p>", "feedback": "<p>Incorrect. Tools easily save data to storage.</p>"}]}}, {"step": 30, "title": "Looking Ahead: Step 3 (AI Assistance on Friday)", "content": "**Looking Ahead: Step 3 (AI Assistance on Friday)**\n\nCongratulations on completing Step 2 of the alignment cycle!\n\nHere is how our comparative progression connects:\n\n* **Tuesday (Manual):** You authored 10 sentence pairs and three Leipzig glosses by hand (human gold standard).\n* **Wednesday (Deterministic):** You tested length-based algorithms, inspected alignment matrices, and calculated precision and recall.\n* **Friday (AI-Assisted):** On Friday, you will use artificial intelligence (Claude and Gemini in VS Code) to propose sentence alignments and Leipzig glosses.\n\nYou will compare all three methods side by side. You will see exactly where statistical rules succeed and where neural AI models provide deeper linguistic insights.\n\n**Takeaway:** Today's deterministic audit bridges manual human scholarship with Friday's AI-assisted alignment tools.", "html": null, "image_b64": null, "question": {"name": "30 Question: Looking Ahead: Step 3 (AI Assistance on Friday)", "questiontext": "<p>How will Friday's class meeting complete the Three-Step Comparative Cycle for text alignment?</p>", "generalfeedback": "<p>Today's deterministic audit bridges manual human scholarship with Friday's AI-assisted alignment tools.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>You will use artificial intelligence (Claude and Gemini in VS Code) to propose alignments and glosses, comparing all three methods side by side.</p>", "feedback": "<p>Correct. Friday introduces AI-assisted alignment, completing the comparative triad: Manual (Tuesday) vs. Deterministic (Wednesday) vs. AI (Friday).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>You will abandon your edition and play video games for the rest of the term.</p>", "feedback": "<p>Incorrect. Friday completes the core methodological cycle of Topic 11.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>You will print your XML file and burn it in a fireplace.</p>", "feedback": "<p>Incorrect. Digital editions are preserved and expanded throughout the semester.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>You will write a paper explaining why Greek is the only language that matters.</p>", "feedback": "<p>Incorrect. Our cohort works across French, colonial treaty English, and 20th-century Maritime correspondence.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
