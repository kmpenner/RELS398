    <script>
        const lessonData = {"course_title": "AI Diplomatic Transcription via Gemini in VS Code Antigravity", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "Why Single-Pass Transcription Cannot Verify Itself", "content": "**Why Single-Pass Transcription Cannot Verify Itself**\n\nLast week, you transcribed your primary witness page by hand into witness.xml. You sat with the digital image, studied the handwriting or printed typography, and keyed every word into TEI XML. That manual transcription represents substantial scholarly labor, and it serves as your initial ground truth.\n\nHowever, in scholarly editing, no single-pass transcription is ever accepted as an unquestioned authority. Human eyes are subject to cognitive fatigue, visual strain, and attentional lapses. When you read a document, your brain constantly anticipates what ought to come next. If an 18th-century clerk accidentally repeated a word across a line break, your eye easily skips the repetition. If two letters resemble each other in a cramped cursive script, your brain quietly resolves the ambiguity toward modern English sense.\n\nThese slips are not careless mistakes; they are fundamental features of human cognition. Because you are the author of your own transcription, your mind will naturally overlook its own blind spots during a second reading. An unverified reference silently incorporates these errors into every downstream analysis. To measure accuracy honestly, we must acknowledge that a single pass cannot verify itself.\n\n**Vocabulary.** *Single-pass transcription* — A transcription produced by one person in a single reading, without independent cross-checking.\n\n**Takeaway:** Single-pass transcription inevitably contains silent errors, so it cannot serve as an unverified ground truth reference.\n\n---", "image_b64": null, "question": {"name": "01 Question: Why Single-Pass Transcription Cannot Verify Itself", "questiontext": "<p>Why can a single-pass manual transcription not serve as an unverified ground truth in scholarly editing?</p>", "generalfeedback": "<p>Single-pass transcription inevitably contains silent errors, so it cannot serve as an unverified ground truth reference.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Human cognition naturally anticipates meaning and suffers fatigue, causing transcribers to overlook their own errors during self-review.</p>", "feedback": "<p>Correct. Cognitive auto-correction and visual fatigue cause transcribers to miss their own omissions and slips, meaning a single pass cannot independently verify itself.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Single-pass transcriptions always fail XML schema validation when checked by automated linters.</p>", "feedback": "<p>Incorrect. Schema validation tests whether XML syntax conforms to a grammar, not whether the transcribed characters match the physical manuscript.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scholarly standards require at least three institutional signatures before any transcription file can be committed to Git.</p>", "feedback": "<p>Incorrect. The issue is cognitive verification and error localization, not bureaucratic institutional approval.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modern operating systems cannot parse Unicode text files created by a single user account.</p>", "feedback": "<p>Incorrect. Operating systems parse text files identically regardless of how many users contributed to authoring.</p>"}]}}, {"step": 2, "title": "The Principle of Double-Transcription", "content": "**The Principle of Double-Transcription**\n\nTo overcome the limits of single-pass human transcription, documentary projects rely on double-transcription (often called double-keying). The foundational principle, formalized by researchers like Haaf, Wiegand, and Geyken (2013), is simple yet statistically powerful: two independent transcribers will rarely commit the exact same error at the exact same character position.\n\nIf Person A and Person B both transcribe a historical broadside without consulting each other, they will agree on the vast majority of characters. Where their transcriptions match identically, the probability that the text accurately reflects the manuscript is extremely high. \n\nWhere their transcriptions disagree, an error is almost certainly present in one of the passes. Rather than forcing a scholar to re-read thousands of words from scratch, double-transcription transforms proofreading into an efficient, targeted review. The point of comparison—the diff—acts like a spotlight, highlighting the exact coordinates where human or machine judgment faltered. Disagreement does not represent failure; it localizes the editorial decision precisely where attention is needed.\n\n**Vocabulary.** *Double-transcription* — The practice of transcribing the same document independently twice to detect errors through comparison.\n\n**Takeaway:** Comparing two independent transcription passes reliably pinpoints errors because independent observers rarely make the same slip.\n\n---", "image_b64": null, "question": {"name": "02 Question: The Principle of Double-Transcription", "questiontext": "<p>What is the primary methodological advantage of double-transcription in digital humanities projects?</p>", "generalfeedback": "<p>Comparing two independent transcription passes reliably pinpoints errors because independent observers rarely make the same slip.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Independent transcribers rarely make identical errors, allowing discrepancies between the two passes to pinpoint exact locations requiring review.</p>", "feedback": "<p>Correct. Discrepancies between independent passes narrow proofreading down to specific disputed points rather than requiring exhaustive line-by-line re-reading.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It doubles the storage size of the Git repository, satisfying archival redundancy quotas.</p>", "feedback": "<p>Incorrect. The goal of double-transcription is editorial accuracy and error localization, not artificial file size inflation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically converts historical abbreviations into modern standardized spellings without human intervention.</p>", "feedback": "<p>Incorrect. Double-transcription identifies character differences; normalization is a separate editorial stage.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents optical character recognition engines from reading the underlying digital image.</p>", "feedback": "<p>Incorrect. Double-transcription is an editorial methodology for validating text, not a tool for blocking OCR.</p>"}]}}, {"step": 3, "title": "Human vs. Machine: Two Complementary Error Profiles", "content": "**Human vs. Machine: Two Complementary Error Profiles**\n\nIn traditional commercial digitization, double-keying required hiring two separate human transcribers. In this course, we adapt this methodology to the digital age: Pass 1 is your manual diplomatic transcription, and Pass 2 is an AI transcription generated by Gemini in VS Code Antigravity.\n\nThis human-plus-AI pairing is methodologically superior to having the same human type the text twice. When a single human re-keys a document, their second pass often repeats the identical cognitive biases of the first pass. But human editors and neural vision models possess radically different error profiles.\n\nHuman transcribers excel at codicological context. You understand that a dark smudge across a line is an ink blot, not a letter; you recognize that faint pencil writing between lines is an authorial revision. However, you are vulnerable to attentional fatigue, skipping repetitive lines or missing punctuation dashes. \n\nConversely, multimodal vision models never experience physical fatigue or visual eye-strain. A model processes line twenty with the same intensity as line one. However, the model lacks historical consciousness: it may misinterpret broken typography, hallucinate missing words, or silently modernize spelling. Because human and machine fail in completely different ways, their disagreements expose nearly every flaw.\n\n**Vocabulary.** *Error profile* — The characteristic patterns and types of mistakes typically made by a specific person, tool, or algorithmic model.\n\n**Takeaway:** Human transcribers and multimodal AI models make completely different types of errors, making them ideal partners for double-transcription.\n\n---", "image_b64": null, "question": {"name": "03 Question: Human vs. Machine: Two Complementary Error Profiles", "questiontext": "<p>Why is pairing a human transcriber with a multimodal AI model methodologically effective for double-transcription?</p>", "generalfeedback": "<p>Human transcribers and multimodal AI models make completely different types of errors, making them ideal partners for double-transcription.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Humans and AI models have different error profiles, meaning the machine catches human fatigue slips while the human catches AI hallucinations.</p>", "feedback": "<p>Correct. Because human cognitive slips and neural network hallucinations rarely overlap, their discrepancies expose errors effectively.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The AI model can sign legal copyright release waivers on behalf of the human transcriber.</p>", "feedback": "<p>Incorrect. Legal copyright and licensing are human administrative concerns, not the reason for pairing transcription error profiles.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Multimodal models automatically delete the human transcription file if any discrepancy exceeds three characters.</p>", "feedback": "<p>Incorrect. Both transcription passes are preserved for comparative adjudication; neither file is deleted.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Human transcribers are required by TEI guidelines to verify that neural networks consume sufficient GPU electrical power.</p>", "feedback": "<p>Incorrect. TEI guidelines govern documentary markup schemas, not hardware energy verification.</p>"}]}}, {"step": 4, "title": "The Multimodal Vision Advantage", "content": "**The Multimodal Vision Advantage**\n\nIn earlier decades of digital humanities, computer-assisted transcription was a multi-stage pipeline. A researcher had to pre-process images (deskewing, binarization), train custom optical character recognition (OCR) or handwritten text recognition (HTR) models, manually draw baseline polygons around every line of text, and tune language dictionaries.\n\nToday, large multimodal models like Gemini transform this landscape. A multimodal vision model does not merely process an isolated strip of black-and-white pixels. Instead, it examines the entire high-resolution image in its visual context. It simultaneously attends to letterforms, line spacing, margins, indentations, and document layout.\n\nWhen you send an archival image to Gemini inside the VS Code Antigravity extension, the model evaluates the visual features of the document alongside textual prompts. It can recognize that an italicized block at the top of a page is a heading, that a block of capitalized text is a legal proclamation, or that ragged-right line breaks represent poetic verse. \n\nThis visual awareness allows the model to produce structured diplomatic markup directly from the image. However, because multimodal vision models are trained on massive corpora of modern text, their vision is filtered through statistical language prediction, creating unique risks that editors must manage.\n\n**Vocabulary.** *Multimodal model* — An artificial intelligence model capable of processing and reasoning across multiple data types, such as text and images simultaneously.\n\n**Takeaway:** Modern multimodal vision models analyze high-resolution document images directly without needing separate OCR bounding-box pipelines.\n\n---", "image_b64": null, "question": {"name": "04 Question: The Multimodal Vision Advantage", "questiontext": "<p>How do modern multimodal vision models differ from traditional multi-stage OCR pipelines in document transcription?</p>", "generalfeedback": "<p>Modern multimodal vision models analyze high-resolution document images directly without needing separate OCR bounding-box pipelines.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They evaluate high-resolution document images and structural layout directly within their visual context without requiring manual line segmentation.</p>", "feedback": "<p>Correct. Multimodal models integrate visual feature recognition and text transcription in an end-to-end process without separate line binarization pipelines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They alter the underlying master TIFF image file by permanently burning digital fonts into the parchment pixels.</p>", "feedback": "<p>Incorrect. Multimodal models generate text output non-destructively; they do not alter the pixels of the source image.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They only accept plain ASCII text files and cannot process raster photographs or digital scans.</p>", "feedback": "<p>Incorrect. Multimodal vision models explicitly accept raster images such as JPEG, PNG, or TIFF files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They require all historical documents to be translated into modern Greek before layout analysis can begin.</p>", "feedback": "<p>Incorrect. Multimodal models analyze documents in their original historical languages directly.</p>"}]}}, {"step": 5, "title": "The Autoregressive Trap: Silent Modernization", "content": "**The Autoregressive Trap: Silent Modernization**\n\nWhile multimodal models possess powerful visual capabilities, their underlying architecture is autoregressive: they generate output by calculating the statistical probability of the next token based on training data. Because the vast majority of their training data consists of modern, standardized English and French, models have a built-in statistical bias toward modern grammar and spelling.\n\nIn scholarly editing, this tendency manifests as the autoregressive trap of silent modernization. When an AI model encounters an 18th-century abbreviation like Janry, its language model strongly predicts the common modern token January. When it reads an early modern ye, it frequently emits the. When it sees a historical long-s (ſ), it automatically outputs modern s.\n\nFor an everyday user asking an AI to summarize a letter, this auto-correction seems helpful. For a scholarly editor preparing a diplomatic edition, silent modernization is a catastrophic failure. A diplomatic edition exists precisely to record historical linguistic variation, scribal habits, and period orthography. \n\nIf an AI silently modernizes your document, it destroys the very historical evidence you are trying to preserve. To prevent this, editors must construct rigorous prompt boundaries that explicitly command the model to suppress its modernization reflex.\n\n**Vocabulary.** *Silent modernization* — The unintentional replacement of historical spelling or punctuation with modern standard forms by an automated model.\n\n**Takeaway:** Autoregressive language models naturally smooth archaic words into modern tokens, making strict negative prompt constraints essential.\n\n---", "image_b64": null, "question": {"name": "05 Question: The Autoregressive Trap: Silent Modernization", "questiontext": "<p>Why do large multimodal models frequently suffer from the 'silent modernization' trap when transcribing historical documents?</p>", "generalfeedback": "<p>Autoregressive language models naturally smooth archaic words into modern tokens, making strict negative prompt constraints essential.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Their underlying autoregressive architecture statistically favors common modern words over archaic historical spellings found in early manuscripts.</p>", "feedback": "<p>Correct. Autoregressive language models predict high-probability modern tokens, naturally smoothing historical spellings like 'Janry' into modern 'January'.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Archival libraries intentionally program AI models to censor historical vocabulary to protect student sensitivities.</p>", "feedback": "<p>Incorrect. The phenomenon is a technical consequence of statistical language model training, not institutional censorship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XML schemas reject historical spellings and force models to emit twentieth-century vocabulary.</p>", "feedback": "<p>Incorrect. XML schemas validate structural tag syntax, not the vocabulary or spelling of text inside elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The optical resolution of digital scans degrades whenever an archaic letterform is processed by a GPU.</p>", "feedback": "<p>Incorrect. Digital scans remain unchanged; the bias occurs entirely during algorithmic text generation.</p>"}]}}, {"step": 6, "title": "The Scope of Diplomatic Transcription", "content": "**The Scope of Diplomatic Transcription**\n\nBefore prompting Gemini, we must re-anchor ourselves in the scope of diplomatic transcription. A diplomatic transcription is an act of documentary witness: its goal is to record what is physically present on the artifact, without modern editorial intervention.\n\nWhen authoring a diplomatic transcription in TEI XML, you record original letterforms, abbreviations, punctuation marks, line breaks, and page boundaries. You do not correct misspelled words, you do not expand shortened terms, and you do not regularize punctuation. If Emily Dickinson wrote a short dash that resembles a hyphen, you transcribe a dash, not a modern comma. If a colonial treaty clerk omitted a closing quotation mark, you leave it unclosed.\n\nThis boundary is crucial because scholarly editing proceeds in stages. You cannot produce a trustworthy modernized reading edition until you have established a rock-solid diplomatic baseline. If you mix transcription with modernization during the first pass, you permanently obscure the physical evidence of the witness. In today's lab, our prompt must command Gemini to operate strictly as a diplomatic transcriber, holding every modernizing impulse in check.\n\n**Vocabulary.** *Diplomatic transcription* — A precise digital transcription that represents the physical document exactly as written, preserving original spelling, lineation, and physical layout.\n\n**Takeaway:** Diplomatic transcription records what is physically on the page, not what an editor thinks should have been written.\n\n---", "image_b64": null, "question": {"name": "06 Question: The Scope of Diplomatic Transcription", "questiontext": "<p>What is the primary defining principle of a diplomatic transcription in digital scholarly editing?</p>", "generalfeedback": "<p>Diplomatic transcription records what is physically on the page, not what an editor thinks should have been written.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It records what is physically written on the manuscript page without modernizing spelling, expanding abbreviations, or regularizing punctuation.</p>", "feedback": "<p>Correct. Diplomatic transcription preserves the exact physical testimony of the artifact before any editorial normalization takes place.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates all foreign legal phrases into contemporary diplomatic English for government archives.</p>", "feedback": "<p>Incorrect. Diplomatic transcription refers to documentary fidelity (from the Latin 'diploma'), not political diplomacy or translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces all handwritten text with standardized digital typography approved by the International Standards Organization.</p>", "feedback": "<p>Incorrect. Diplomatic transcription records the original text as written, rather than standardizing it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires transcribers to discard damaged pages and transcribe only pristine, undamaged folios.</p>", "feedback": "<p>Incorrect. Physical damage and illegible text are documented using specialized TEI elements, not discarded.</p>"}]}}, {"step": 7, "title": "Why Normalization Remains Locked Until Week 6", "content": "**Why Normalization Remains Locked Until Week 6**\n\nIn TEI XML, the vocabulary for editorial intervention is rich and powerful. Elements like `<choice>`, `<orig>`, `<reg>`, `<abbr>`, and `<expan>` allow editors to pair historical spellings with modern equivalents. For instance, you could wrap an abbreviated term in `<choice>`, encoding both the scribal form (`<abbr>&amp;c.</abbr>`) and the editorial expansion (`<expan>et cetera</expan>`).\n\nHowever, in this course, we deliberately lock those elements away until Week 6. Why? Because normalization is an interpretive act, whereas transcription is an evidentiary act. \n\nIf you or the AI introduce normalization during the transcription phase, it becomes impossible to disentangle scribal evidence from editorial conjecture. Did the author really write 'et cetera', or did the machine assume it? Did the 1791 decree print 'loix', or did the model supply modern 'lois'?\n\nBy restricting both your manual pass (Pass 1) and Gemini's AI pass (Pass 2) to pure diplomatic markup, we ensure that both files speak the exact same vocabulary. When we diff them on Friday, every highlighted discrepancy will represent a genuine disagreement about what is inked on the page, not a difference in editorial preference. Normalization begins only after reconciliation is complete.\n\n**Vocabulary.** *Normalization* — The editorial process of standardizing variant historical spellings, expanding abbreviations, or regularizing punctuation for modern readers.\n\n**Takeaway:** Editorial normalization elements like choice, orig, and expan remain locked until Week 6 so we can establish an untainted diplomatic baseline.\n\n---", "image_b64": null, "question": {"name": "07 Question: Why Normalization Remains Locked Until Week 6", "questiontext": "<p>Why are TEI elements like &lt;choice&gt;, &lt;orig&gt;, &lt;reg&gt;, &lt;abbr&gt;, and &lt;expan&gt; forbidden in this week's transcription passes?</p>", "generalfeedback": "<p>Editorial normalization elements like choice, orig, and expan remain locked until Week 6 so we can establish an untainted diplomatic baseline.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They represent interpretive editorial regularization, which must be separated from pure diplomatic transcription to prevent confusing evidence with conjecture.</p>", "feedback": "<p>Correct. Keeping normalization locked until Week 6 ensures that both passes record pure physical testimony, allowing discrepancies to reflect genuine paleographical differences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI Consortium officially deprecated those elements in the P5 schema release.</p>", "feedback": "<p>Incorrect. Elements like `<choice>` and `<orig>` are fully valid and widely used in TEI P5; they are restricted here for pedagogical and methodological reasons.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code's XML validator crashes whenever an &lt;abbr&gt; tag appears inside a paragraph element.</p>", "feedback": "<p>Incorrect. VS Code validates these elements smoothly; the restriction is methodological, not a software bug.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Multimodal vision models refuse to process images if prompt instructions mention XML attributes.</p>", "feedback": "<p>Incorrect. Multimodal models process image prompts with XML attribute specifications routinely.</p>"}]}}, {"step": 8, "title": "Core Structural Containers: text, body, and div", "content": "**Core Structural Containers: text, body, and div**\n\nEvery valid TEI document organizes its transcription inside a rigid structural hierarchy. Just as the physical manuscript contains pages, gatherings, and columns, your XML document organizes text into nested containers.\n\nThe outermost container for transcribed content is `<text>`. In the TEI architecture, `<text>` sits as a sibling to `<teiHeader>` and `<facsimile>` directly inside the root `<TEI>` element. Inside `<text>` sits `<body>`, which holds the primary textual content of the document (excluding front matter like modern title pages or back matter like indexes).\n\nInside `<body>`, you must declare at least one text division using `<div>`. A `<div>` represents an organic section of the document: a single poem, a legal decree, a personal letter, or a colonial treaty. \n\nCrucially, in the TEI grammar enforced by schemas like `msdesc.rng`, a `<div>` cannot hold bare character data directly. You cannot simply open `<div>` and begin typing words. All running text inside a `<div>` must be enclosed within paragraph containers (`<p>`) for prose, or line groups (`<lg>`) and lines (`<l>`) for poetry. When prompting Gemini, we must ensure it builds this three-tier hierarchy correctly.\n\n**Vocabulary.** *Structural container* — An XML element whose primary function is to group and organize other elements hierarchically rather than holding bare text directly.\n\n**Takeaway:** In TEI XML, all transcribed text must be housed hierarchically inside text, body, and div containers.\n\n---", "image_b64": null, "question": {"name": "08 Question: Core Structural Containers: text, body, and div", "questiontext": "<p>What is the required structural hierarchy for containing transcribed running text in a TEI document?</p>", "generalfeedback": "<p>In TEI XML, all transcribed text must be housed hierarchically inside text, body, and div containers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Running text must be nested inside &lt;text&gt;, &lt;body&gt;, and &lt;div&gt;, and wrapped within &lt;p&gt; for prose or &lt;lg&gt;&lt;l&gt; for verse.</p>", "feedback": "<p>Correct. TEI requires `<text>`, `<body>`, and `<div>` as hierarchical wrappers, and forbids placing bare text directly inside `<div>` without `<p>` or `<lg><l>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Running text is typed directly inside the &lt;teiHeader&gt; under the &lt;publicationStmt&gt; container.</p>", "feedback": "<p>Incorrect. The `<teiHeader>` holds metadata about the document, while `<text>` holds the actual transcription.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All words must be wrapped in separate &lt;surface&gt; elements inside the &lt;facsimile&gt; tree.</p>", "feedback": "<p>Incorrect. The `<facsimile>` tree holds image coordinates; textual transcriptions belong in `<text>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>TEI XML forbids using containers and requires all text to sit in an unnested flat sequence of paragraphs.</p>", "feedback": "<p>Incorrect. TEI is inherently hierarchical and enforces structured containment via schemas.</p>"}]}}, {"step": 9, "title": "Physical Page Milestones: Linking pb to surface", "content": "**Physical Page Milestones: Linking pb to surface**\n\nHistorical texts are continuous streams of language, but physical documents are bound books, folded sheets, or printed broadsides. To reconcile the continuous flow of language with the physical boundaries of paper, TEI uses empty milestone elements.\n\nThe most fundamental page milestone is `<pb/>` (page beginning). Because a page break is a single point in space rather than a container that wraps text, `<pb/>` is an empty element (self-closing). It sits in the transcription stream exactly where the reader turns the page or where the physical leaf begins.\n\nIn Module 3, you created a `<surface>` element in your `<facsimile>` block with a unique identifier, such as `xml:id=\"diary_p1\"` or `xml:id=\"f338r\"`. The `<pb/>` element bridges the digital image and the transcription through its `@facs` attribute:\n\n```xml\n<pb facs=\"#f338r\" n=\"1r\"/>\n```\n\nThe hashtag (#) is mandatory: it turns the attribute value into a URI fragment pointer that links directly to the `xml:id` on your `<surface>`. By including `<pb facs=\"#...\"/>` at the start of your AI prompt rules, you ensure that Gemini anchors its transcription to the specific physical surface you calibrated in Lesson 3.2.\n\n**Vocabulary.** *Page break milestone (pb)* — An empty XML element that marks the boundary where a new physical page begins in the source document.\n\n**Takeaway:** The empty milestone pb marks page boundaries and connects the transcription to the facsimile image via its facs attribute.\n\n---", "image_b64": null, "question": {"name": "09 Question: Physical Page Milestones: Linking pb to surface", "questiontext": "<p>How does the &lt;pb/&gt; element connect transcribed text to the physical image in a TEI document?</p>", "generalfeedback": "<p>The empty milestone pb marks page boundaries and connects the transcription to the facsimile image via its facs attribute.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It uses a self-closing milestone with a @facs attribute containing a hashtag pointer that matches the xml:id of a &lt;surface&gt; element.</p>", "feedback": "<p>Correct. The `<pb facs=\"#id\"/>` milestone links the point of page transition directly to the corresponding `<surface>` in the `<facsimile>` block.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It encloses all the text of the page inside a closing &lt;/pb&gt; container tag.</p>", "feedback": "<p>Incorrect. `<pb/>` is an empty milestone element in TEI and must never be used as a container.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It downloads a high-resolution JPEG directly from the library server into the browser cache.</p>", "feedback": "<p>Incorrect. `<pb/>` is a markup milestone, not an HTTP downloading script.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes the previous page's transcription from memory to prevent XML memory overflows.</p>", "feedback": "<p>Incorrect. XML parsers retain the full document structure; milestones simply mark physical boundaries.</p>"}]}}, {"step": 10, "title": "Lineation as Codicological Evidence: lb", "content": "**Lineation as Codicological Evidence: lb**\n\nIn printed books and manuscripts, line breaks are physical accidents of layout, margins, and script size. A sentence may start on line 4, wrap onto line 5, and conclude on line 6. In a normalized reading edition, these line breaks are usually discarded. In a diplomatic edition, lineation is primary codicological evidence.\n\nTEI represents physical line breaks using the empty milestone element `<lb/>`. It is placed at the start of each new physical line (or immediately at the break point). Because it is a milestone, it does not interrupt the grammatical structure of the sentence:\n\n```xml\n<p>\n  <lb n=\"1\"/>When I have fears that I may cease to be\n  <lb n=\"2\"/>Before my pen has glean'd my teeming brain,\n</p>\n```\n\nRecording lineation is vital for double-transcription. When comparing two passes, aligning text line by line allows you to detect omitted words instantly. If Person A recorded eight words on line 3 and Person B recorded seven, the diff immediately isolates the missing word. \n\nWhen prompting Gemini, we must explicitly demand that it output `<lb/>` at every physical line break visible on the manuscript. If a model generates a single unformatted prose paragraph, it destroys the physical alignment needed for Friday's diffing lab.\n\n**Vocabulary.** *Line break milestone (lb)* — An empty XML element that marks the point where a physical line of text ends and the next line begins on the document.\n\n**Takeaway:** Physical line breaks are marked with empty lb milestones, recording scribal lineation without disrupting grammatical sentences.\n\n---", "image_b64": null, "question": {"name": "10 Question: Lineation as Codicological Evidence: lb", "questiontext": "<p>Why is the empty milestone &lt;lb/&gt; essential in diplomatic transcription?</p>", "generalfeedback": "<p>Physical line breaks are marked with empty lb milestones, recording scribal lineation without disrupting grammatical sentences.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It records the exact physical lineation of the document without breaking the grammatical hierarchy of paragraphs or stanzas.</p>", "feedback": "<p>Correct. `<lb/>` milestones mark where lines physically break on the artifact, providing the alignment grid needed for comparative reconciliation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces web browsers to display text in fixed-width Courier font.</p>", "feedback": "<p>Incorrect. Font styling is controlled by CSS, whereas `<lb/>` records documentary lineation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically calculates the physical width of the manuscript page in millimeters.</p>", "feedback": "<p>Incorrect. Bounding dimensions are recorded in `<surface>`, not by line break milestones.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It indicates that the author used a typewriter rather than a fountain pen.</p>", "feedback": "<p>Incorrect. `<lb/>` is used across all media, from stone epigraphs to handwritten letters and printed books.</p>"}]}}, {"step": 11, "title": "Marking Physical Ambiguity: unclear", "content": "**Marking Physical Ambiguity: unclear**\n\nIn historical manuscripts, letterforms are frequently ambiguous. Faded ink, paper foxing, water stains, or erratic cursive handwriting can make it difficult to determine whether a word ends in `-ed`, `-ing`, or `-eth`.\n\nIn diplomatic transcription, an editor never guesses in silence. When you or an AI model encounter a word that cannot be verified with absolute certainty, you wrap the candidate reading in the `<unclear>` element:\n\n```xml\n<p>\n  <lb n=\"4\"/>paid to the <unclear>treasurer</unclear> on Tuesday last\n</p>\n```\n\nThe `<unclear>` element tells downstream readers and computational algorithms: 'A reading is proposed here based on visible traces, but it remains paleographically doubtful.' You can also add attributes like `reason=\"faded\"` or `reason=\"cramped\"` to record the physical cause of the doubt.\n\nWhen evaluating AI output, watching how the model uses `<unclear>` is highly revealing. Poorly prompted models rarely admit doubt—they hallucinate high-probability words over blurred text. A well-prompted model will appropriately flag difficult readings with `<unclear>`, allowing you to review the original ink during reconciliation.\n\n**Vocabulary.** *unclear element* — A TEI element used to wrap words or characters that cannot be deciphered with certainty due to ink fading, staining, or cramped handwriting.\n\n**Takeaway:** The unclear tag indicates that text is readable but uncertain, documenting genuine paleographical ambiguity without guessing.\n\n---", "image_b64": null, "question": {"name": "11 Question: Marking Physical Ambiguity: unclear", "questiontext": "<p>What is the scholarly purpose of the TEI &lt;unclear&gt; element in diplomatic markup?</p>", "generalfeedback": "<p>The unclear tag indicates that text is readable but uncertain, documenting genuine paleographical ambiguity without guessing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It flags a proposed reading as paleographically doubtful due to physical degradation or ambiguous handwriting without silently guessing.</p>", "feedback": "<p>Correct. `<unclear>` explicitly marks candidate readings as uncertain, preserving the distinction between clear physical evidence and doubtful interpretation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It hides the text from student readers until they complete a Moodle quiz.</p>", "feedback": "<p>Incorrect. `<unclear>` is a scholarly transcription tag, not an access control mechanism on a learning management system.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It commands the printer to blur the typography when publishing the critical edition.</p>", "feedback": "<p>Incorrect. `<unclear>` documents manuscript evidence; rendering engines typically represent it with sublinear dots or brackets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It signals that the author was suffering from temporary memory loss when composing the text.</p>", "feedback": "<p>Incorrect. The tag records visual illegibility on the witness, not the psychological state of the historical author.</p>"}]}}, {"step": 12, "title": "Recording Physical Loss: gap", "content": "**Recording Physical Loss: gap**\n\nSometimes an artifact is not merely stained or faded; it is physically damaged. Wormholes eat through parchment leaves; corners of letters tear away; acidic ink burns holes through paper; moisture obliterates ink strokes completely.\n\nWhen text is entirely lost to physical destruction, editors cannot use `<unclear>` because there is no candidate word to wrap. Instead, TEI provides the empty milestone element `<gap/>`. It marks a physical lacuna in the document:\n\n```xml\n<p>\n  <lb n=\"7\"/>received from the said <gap reason=\"damage\" unit=\"words\" extent=\"2\"/> upon receipt\n</p>\n```\n\nA `<gap/>` element must never be left bare. Scholarly practice requires at least two attributes: `@reason` (such as `reason=\"damage\"`, `reason=\"lacuna\"`, or `reason=\"cancellation\"`) and an estimate of the loss using `@unit` and `@extent` (e.g. `unit=\"chars\" extent=\"5\"` or `unit=\"words\" extent=\"1\"`).\n\nIn AI transcription, physical gaps are an acute danger zone. If a document has a torn corner, an unconstrained language model will effortlessly hallucinate text to fill the sentence. Teaching Gemini to output `<gap reason=\"damage\"/>` over physical lacunae is one of the central achievements of rigorous prompt engineering.\n\n**Vocabulary.** *gap element* — An empty TEI milestone marking a location where text was omitted from the transcription because of physical destruction, lacunae, or total illegibility.\n\n**Takeaway:** The gap element records physical lacunae or illegible holes where no text can be deciphered, specifying the reason and extent.\n\n---", "image_b64": null, "question": {"name": "12 Question: Recording Physical Loss: gap", "questiontext": "<p>How should an editor encode a physical tear in a manuscript where several words are completely destroyed?</p>", "generalfeedback": "<p>The gap element records physical lacunae or illegible holes where no text can be deciphered, specifying the reason and extent.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Using an empty &lt;gap/&gt; element with attributes specifying the cause and estimated extent of the loss, such as reason=\"damage\" unit=\"words\" extent=\"3\".</p>", "feedback": "<p>Correct. `<gap>` marks physical text loss where nothing can be deciphered, recording the physical cause and estimated quantity of lost text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By writing three question marks inside a paragraph container.</p>", "feedback": "<p>Incorrect. Informal symbols like '???' are non-standard; TEI provides standardized XML markup via `<gap/>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By inventing plausible words based on similar 18th-century documents and presenting them as authentic ink.</p>", "feedback": "<p>Incorrect. Silently supplying words over physical tears violates diplomatic fidelity and creates false historical evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the line entirely and renumbering the remaining lines on the page.</p>", "feedback": "<p>Incorrect. Diplomatic lineation must record the physical reality of the page, including lines interrupted by lacunae.</p>"}]}}, {"step": 13, "title": "Poetry vs. Prose: Metrical Lines and Stanzas", "content": "**Poetry vs. Prose: Metrical Lines and Stanzas**\n\nA major architectural distinction in TEI is the contrast between prose and verse. Prose flows continuously within paragraph containers (`<p>`). Poetry, however, possesses metrical structure: it is organized into stanzas, couplets, and metrical lines.\n\nIn TEI, poetry is wrapped in a line group element: `<lg>`. Each metrical verse line is wrapped in a line element: `<l>`. \n\nCrucially, you must distinguish between a metrical line (`<l>`) and a physical line break (`<lb/>`). A metrical line is an intellectual, rhythmical unit defined by the poet. A physical line break is an accident of paper width. In Emily Dickinson's poetic manuscripts, Dickinson frequently wrote a single metrical line that was too long for her narrow paper, forcing her pencil to wrap onto a second physical line:\n\n```xml\n<lg type=\"stanza\">\n  <l n=\"1\"><lb n=\"1\"/>Because I could not stop for Death –</l>\n  <l n=\"2\"><lb n=\"2\"/>He kindly stopped for me –</l>\n  <l n=\"3\"><lb n=\"3\"/>The Carriage held but just Ourselves –<lb n=\"4\"/>and Immortality.</l>\n</lg>\n```\n\nNotice line 3: it is one metrical line (`<l>`), but it contains an internal line break (`<lb n=\"4\"/>`) where Dickinson wrapped the phrase 'and Immortality.' For prose and culinary witnesses—including Jay's Dickinson cake recipe, Ace's decree, Olyvia's letter, and Andromeda's treaty—`<p>` containers are used; `<lg>` and `<l>` are reserved strictly for verse.\n\n**Vocabulary.** *Line group (lg)* — A TEI container used to wrap stanzas, couplets, or other verse groupings in poetic transcriptions.\n\n**Takeaway:** Poetry requires line groups (lg) and metrical lines (l), nesting lb milestones where physical margins force a poetic line to wrap.\n\n---", "image_b64": null, "question": {"name": "13 Question: Poetry vs. Prose: Metrical Lines and Stanzas", "questiontext": "<p>How should a transcriber encode a poetic verse line that wraps across two physical lines on narrow manuscript paper?</p>", "generalfeedback": "<p>Poetry requires line groups (lg) and metrical lines (l), nesting lb milestones where physical margins force a poetic line to wrap.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Wrap the entire metrical line in an &lt;l&gt; element, inserting an empty &lt;lb/&gt; milestone at the physical point where the text wraps.</p>", "feedback": "<p>Correct. Nesting `<lb/>` inside `<l>` accurately captures both the conceptual poetic verse and the physical lineation of the paper.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Split the poem into two completely separate &lt;div&gt; containers.</p>", "feedback": "<p>Incorrect. Stanzas and metrical lines belong within the same division; splitting into divisions corrupts the poem's structure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the wrapped words to prevent the poem from overflowing modern smartphone screens.</p>", "feedback": "<p>Incorrect. Diplomatic transcription records all manuscript text regardless of screen display constraints.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the second line with an &lt;unclear&gt; tag to indicate irregular layout.</p>", "feedback": "<p>Incorrect. Wrapped text is not illegible; it simply reflects physical lineation encoded with `<lb/>`.</p>"}]}}, {"step": 14, "title": "Layout Complexities: Columns and Marginalia", "content": "**Layout Complexities: Columns and Marginalia**\n\nHistorical documents rarely follow simple single-column layouts. Printed broadsides and decrees, such as Ace's 1791 French decree or Andromeda's 1752 treaty, frequently organize text into parallel vertical columns. Personal letters and manuscript leaves, such as Olyvia's Maud Lewis letter or Jay's Dickinson recipe leaf, often feature marginal additions, interlinear glosses, or text running sideways along the edge of the leaf.\n\nWhen transcribing multi-column documents, transcribers use column break milestones: `<cb n=\"1\"/>` and `<cb n=\"2\"/>`. \n\nThe most common failure mode for automated vision models on multi-column pages is horizontal reading order confusion. An unguided AI model reads horizontally across the page, concatenating line 1 of Column 1 with line 1 of Column 2 into a single nonsensical sentence. \n\nIn scholarly editing, columns must be transcribed in their logical reading order: Column 1 from top to bottom, followed by Column 2 from top to bottom. When dealing with marginal additions, TEI provides elements like `<add place=\"margin\">`, allowing transcribers to anchor floating text to its physical location. When prompting Gemini, we must ensure it understands the column flow of the document.\n\n**Vocabulary.** *Column break (cb)* — An empty TEI milestone element marking the boundary between adjacent vertical text columns on a page.\n\n**Takeaway:** Complex page layouts like multiple columns require empty milestones like cb to preserve sequential reading order.\n\n---", "image_b64": null, "question": {"name": "14 Question: Layout Complexities: Columns and Marginalia", "questiontext": "<p>What is a frequent reading order error committed by automated vision models on multi-column historical documents?</p>", "generalfeedback": "<p>Complex page layouts like multiple columns require empty milestones like cb to preserve sequential reading order.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Reading horizontally across both columns simultaneously, merging unrelated lines from separate columns into garbled sentences.</p>", "feedback": "<p>Correct. Automated models frequently read across margins horizontally rather than transcribing Column 1 completely before proceeding to Column 2.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting the right-hand column because it assumes the text is a duplicate photocopy.</p>", "feedback": "<p>Incorrect. Models do not delete columns; they typically misread the spatial sequence of lines across columns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inverting the language of the second column from French to Latin automatically.</p>", "feedback": "<p>Incorrect. Column layout errors involve reading order and spatial sequence, not automatic language translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Refusing to parse any page that contains more than twenty-five words per column.</p>", "feedback": "<p>Incorrect. Large vision models readily process dense pages containing hundreds of words.</p>"}]}}, {"step": 15, "title": "Introduction to VS Code Antigravity", "content": "**Introduction to VS Code Antigravity**\n\nIn this course, we do not use third-party web portals or external commercial chat interfaces for our transcription work. All work takes place directly inside Visual Studio Code using the Antigravity extension.\n\nAntigravity integrates modern multimodal models (including Gemini 3.1 Pro and Gemini 3.8 Flash) directly into your local development environment. This integration offers three major scholarly advantages:\n\n1. Workspace Awareness: Antigravity operates directly inside your local git repository. It can see your schema files (`msdesc.rng`), your project directory structure, and your local image files.\n2. Multimodal Image Attachment: You can drag and drop high-resolution archival photographs directly into the chat interface or reference them by relative file paths (e.g. `images/yourpage.jpg`).\n3. Clean Code Emission: Antigravity is built specifically for code and markup engineering. It excels at emitting pure, syntax-highlighted XML blocks without the conversational conversational clutter typical of consumer web chatbots.\n\nBy running Gemini inside VS Code Antigravity, you keep your entire scholarly workflow unified: prompt authoring, model generation, file creation, schema validation, and git commits all happen in one window.\n\n**Vocabulary.** *VS Code Antigravity* — An advanced AI-assisted coding and agentic environment integrated into Visual Studio Code, enabling direct multimodal interaction with codebase files and images.\n\n**Takeaway:** The Antigravity extension in VS Code connects multimodal Gemini models directly to your workspace repository and local document images.\n\n---", "image_b64": null, "question": {"name": "15 Question: Introduction to VS Code Antigravity", "questiontext": "<p>What is a key advantage of using the Antigravity extension in VS Code for scholarly transcription rather than an external web chat interface?</p>", "generalfeedback": "<p>The Antigravity extension in VS Code connects multimodal Gemini models directly to your workspace repository and local document images.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It operates directly within your local project repository, allowing direct multimodal image attachment and immediate local schema validation.</p>", "feedback": "<p>Correct. Working inside VS Code Antigravity keeps image assets, prompt interaction, XML output, schema validation, and Git version control in a unified workflow.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It bypasses university network firewalls to access restricted darknet manuscript repositories.</p>", "feedback": "<p>Incorrect. Antigravity operates on your local workspace files using standard authorized API connections.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It guarantees that the AI model will never make a paleographical error on handwritten text.</p>", "feedback": "<p>Incorrect. No model or interface is error-free; Antigravity provides the toolchain to audit and reconcile errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically converts all XML files into proprietary Microsoft Word docx binaries.</p>", "feedback": "<p>Incorrect. Antigravity works with open, standard text and XML formats.</p>"}]}}, {"step": 16, "title": "Preparing Your Workspace and Witness Image", "content": "**Preparing Your Workspace and Witness Image**\n\nBefore launching any AI prompt, a scholarly editor ensures that their digital workbench is orderly. A disorganized working tree leads to confusion about which file contains which pass.\n\nFirst, check your project repository in VS Code. Open the Terminal panel (`Ctrl + ~` or ``Cmd + ~``) and verify that your high-resolution page image is present inside the `images/` directory:\n\n```bash\nls -la images/\n```\n\nYou should see your primary witness image—for example, `images/diary_p1.jpg`, `images/am338_p1.jpg`, or `images/decree_1791.jpg`. \n\nSecond, run `git status`. Ensure that your manual transcription work from last week is safely committed to `witness.xml`. If you have uncommitted edits, stage and commit them now:\n\n```bash\ngit commit -am \"Pre-reconciliation: manual diplomatic transcription finalized\"\n```\n\nHaving a clean git commit creates an immutable reference point. If anything goes wrong during today's AI experiments, your manual ground truth remains completely protected in your repository history. Now you are ready to open Antigravity and attach your image.\n\n**Vocabulary.** *Working tree* — The local directory of project files on your computer managed by Git, containing your source documents, images, and markup.\n\n**Takeaway:** Before prompting the model, verify that your high-resolution witness image is correctly placed in images/ and that your repository is clean.\n\n---", "image_b64": null, "question": {"name": "16 Question: Preparing Your Workspace and Witness Image", "questiontext": "<p>Why must you verify that your manual transcription is committed in Git before running an AI transcription prompt?</p>", "generalfeedback": "<p>Before prompting the model, verify that your high-resolution witness image is correctly placed in images/ and that your repository is clean.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Committing creates a permanent snapshot of your manual baseline in version control, ensuring it cannot be accidentally overwritten or lost.</p>", "feedback": "<p>Correct. A clean Git commit protects your Pass 1 manual ground truth before generating Pass 2 with an AI model.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Antigravity extension refuses to launch if uncommitted files exist in the workspace.</p>", "feedback": "<p>Incorrect. Antigravity runs regardless, but committing protects your scholarly labor from accidental overwrites.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Git requires all images to be converted into SVG vectors before text transcription can begin.</p>", "feedback": "<p>Incorrect. Git tracks raster images (JPEG, PNG, TIFF) as binary files without requiring vector conversion.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Uncommitted XML files will cause the computer's CPU to overheat during multimodal inference.</p>", "feedback": "<p>Incorrect. Uncommitted files have no effect on hardware temperatures or API inference execution.</p>"}]}}, {"step": 17, "title": "Anatomy of a Paleographical Prompt", "content": "**Anatomy of a Paleographical Prompt**\n\nPrompt engineering in the digital humanities is not about casual conversation; it is about defining formal technical specifications. A model responds to the constraints you construct. If you simply ask Gemini, 'What does this page say?', it will return a chatty, modern English summary with casual remarks about historical context.\n\nAn effective paleographical prompt consists of three distinct anatomical components:\n\n1. Scholarly Persona: Assign the model a clear professional role. 'You are an expert paleographer and scholarly text encoder specializing in 18th-century diplomatic manuscript transcription.'\n2. Grammatical Scope: Specify the exact XML element vocabulary allowed in the output. Explicitly list `<text>`, `<body>`, `<div>`, `<p>`, `<pb>`, `<lb/>`, `<unclear>`, and `<gap>` (along with `<lg>` and `<l>` for verse).\n3. Documentary Invariants: Define what must be preserved without alteration—original spelling, capitalization, punctuation, and physical line breaks.\n\nBy structuring your prompt with these three pillars, you transform an open-ended conversational chatbot into a focused, deterministic transcription engine.\n\n**Vocabulary.** *System prompt* — The overarching set of instructions and persona constraints given to an AI model to govern its behavior and output formatting.\n\n**Takeaway:** An effective paleographical prompt establishes a scholarly persona, defines exact permitted XML tags, and sets strict transcription rules.\n\n---", "image_b64": null, "question": {"name": "17 Question: Anatomy of a Paleographical Prompt", "questiontext": "<p>What are the three essential components of a rigorous paleographical prompt for automated document transcription?</p>", "generalfeedback": "<p>An effective paleographical prompt establishes a scholarly persona, defines exact permitted XML tags, and sets strict transcription rules.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A defined scholarly persona, an explicit list of permitted XML elements, and clear rules governing documentary invariants.</p>", "feedback": "<p>Correct. Establishing a professional role, constraining the XML element vocabulary, and enforcing documentary fidelity ensures reliable diplomatic output.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A request for polite conversation, a list of student names, and an offer of academic co-authorship.</p>", "feedback": "<p>Incorrect. Prompts must be formal technical specifications, not conversational pleasantries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A mandate to translate the text into modern Latin, German, and French simultaneously.</p>", "feedback": "<p>Incorrect. Diplomatic transcription preserves the original language of the witness artifact.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An instruction to delete all vowels to compress the output for low-bandwidth cellular modems.</p>", "feedback": "<p>Incorrect. Diplomatic fidelity requires transcribing every character exactly as inked on the page.</p>"}]}}, {"step": 18, "title": "Negative Constraints: Forbidding Editorial Smoothing", "content": "**Negative Constraints: Forbidding Editorial Smoothing**\n\nIn prompt engineering, what you forbid is often more important than what you request. Because multimodal LLMs have an overwhelming statistical prior toward generating modern, standard English prose, positive instructions alone ('transcribe faithfully') are rarely sufficient to stop them from smoothing archaic text.\n\nTo keep the model within strict diplomatic boundaries, you must employ explicit **negative constraints**. A negative constraint directly commands the model to suppress a specific automated reflex:\n\n- 'Do NOT modernize or normalize archaic spelling (e.g. preserve ye, Janry, hath, loix).'\n- 'Do NOT expand scribal abbreviations or contractions (e.g. keep &c., Govr, honble as written).'\n- 'Do NOT correct historical punctuation, grammatical errors, or typos.'\n- 'Do NOT use editorial elements like `<choice>`, `<orig>`, `<reg>`, `<abbr>`, or `<expan>`.'\n\nNegative constraints act like guardrails along a mountain road. They actively prevent the model's autoregressive decoders from sliding down the high-probability path of modern linguistic standardization. When you test your prompt today, check whether your negative constraints successfully held the model to historical reality.\n\n**Vocabulary.** *Negative constraint* — A prompt instruction that explicitly specifies what an AI model must NOT do, preventing common default behaviors.\n\n**Takeaway:** Negative constraints are critical to suppress the model's natural tendency to modernize spelling and expand abbreviations.\n\n---", "image_b64": null, "question": {"name": "18 Question: Negative Constraints: Forbidding Editorial Smoothing", "questiontext": "<p>Why are explicit negative constraints necessary when prompting an AI model for diplomatic transcription?</p>", "generalfeedback": "<p>Negative constraints are critical to suppress the model's natural tendency to modernize spelling and expand abbreviations.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They actively suppress the model's statistical tendency to modernize spelling, expand abbreviations, and correct historical grammar.</p>", "feedback": "<p>Correct. Because LLMs naturally default to standard modern language, negative constraints are required to enforce historical fidelity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They instruct the GPU to run in reverse, reducing electrical power consumption by half.</p>", "feedback": "<p>Incorrect. Negative constraints are linguistic directives for the model, not electrical hardware instructions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They prevent the XML parser from reporting errors when an unclosed tag is detected.</p>", "feedback": "<p>Incorrect. XML parsers strictly enforce syntax; negative constraints govern the text emitted by the AI model.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They ensure that the model deletes all punctuation marks to conform to biblical scriptio continua.</p>", "feedback": "<p>Incorrect. Diplomatic transcription preserves historical punctuation as written.</p>"}]}}, {"step": 19, "title": "Enforcing Clean, Parseable XML Output", "content": "**Enforcing Clean, Parseable XML Output**\n\nWhen you interact with an AI model, its default conversational behavior is to wrap code in markdown fences and precede it with conversational filler: 'Sure! Here is the diplomatic transcription of the page you attached: ... I hope this was helpful! Let me know if you need anything else.'\n\nIn an automated workflow, conversational filler is friction. You cannot save markdown banter directly into an XML file; it will crash the XML parser with syntax errors.\n\nTo eliminate this friction, include strict output formatting directives in your prompt:\n\n- 'Return ONLY the clean, well-formed TEI XML block.'\n- 'Do NOT include conversational introductions, markdown explanations, or post-transcription commentary.'\n- 'Ensure all tags are properly closed and all entity references are valid.'\n\nWhen Gemini obeys this constraint, its entire response in the Antigravity chat panel will be a single, pure XML element tree starting with `<text>` and ending with `</text>`. You can copy the entire block with one click or direct Antigravity to write it straight to `transcription_ai.xml`.\n\n**Vocabulary.** *Parseable output* — Computer-generated text that conforms strictly to syntax rules so that software can read it directly without manual cleaning.\n\n**Takeaway:** Instruct the model to emit only valid XML without conversational markdown filler so the output can be saved directly as a file.\n\n---", "image_b64": null, "question": {"name": "19 Question: Enforcing Clean, Parseable XML Output", "questiontext": "<p>What is the operational benefit of instructing an AI model to return 'ONLY the clean, well-formed XML block'?</p>", "generalfeedback": "<p>Instruct the model to emit only valid XML without conversational markdown filler so the output can be saved directly as a file.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It eliminates conversational conversational filler and markdown text that would otherwise cause syntax errors when saved to an XML file.</p>", "feedback": "<p>Correct. Demanding pure XML ensures the generated text can be saved and parsed immediately without tedious manual cleaning.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It encrypts the transcription using military-grade AES-256 security algorithms.</p>", "feedback": "<p>Incorrect. Clean XML output is human-readable plain text, not encrypted ciphertext.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the model to run five times faster by skipping all neural network layers.</p>", "feedback": "<p>Incorrect. The prompt constrains output formatting; it does not alter neural network architecture.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically translates the document into machine-executable binary assembly code.</p>", "feedback": "<p>Incorrect. The model outputs TEI XML markup, not binary machine code.</p>"}]}}, {"step": 20, "title": "Cohort Case Study: Jay and Dickinson's Recipe Script", "content": "**Cohort Case Study: Jay and Dickinson's Recipe Script**\n\nTo see how these principles operate on real historical witnesses, we examine our four student projects. For Jay, the witness is Emily Dickinson's autograph culinary manuscript, \"Recipe for Black Cake\" (Houghton Library MS Am 1118.7, JL 835a). Dickinson's culinary hand presents three major challenges for multimodal vision:\n\n1. Numerals and Fractions: The recipe contains fractions and quantities (`19 Eggs`, `1 1/2 Currants`, `1/2 pint Brandi`). Watch how Gemini transcribes historical numbers. Does it mistake a looped `19` for `12`, or drop whole numbers in mixed fractions like `1 1/2`?\n2. Idiosyncratic Dashes and Tildes: Dickinson separated ingredients and steps with variable horizontal strokes, hyphens, and tilde-like marks (e.g. `2 Sugar-`, `Cloves ~ Mace-`). Does Gemini capture these distinct marks, or normalize them all into modern commas or standard hyphens?\n3. List Lineation vs. Narrative Prose: The leaf transitions from an ingredient inventory into narrative baking instructions (`Beat Butter and sugar together -`). Jay must verify that Gemini preserves physical line breaks (`<lb/>`) across both sections within `<p>`, rather than attempting to wrap items in poetic stanzas (`<lg>`).\n\nWhatever Gemini proposes, Jay must not correct it yet! Save Gemini's raw choices into `transcription_ai.xml`. Finding where the machine struggled with Dickinson's numerals and punctuation strokes is the exact goal of Friday's diff.\n\n**Vocabulary.** *Culinary manuscript* — A handwritten domestic recipe or formula, characterized by ingredient lists, physical quantities, and informal punctuation strokes.\n\n**Takeaway:** On Dickinson's recipe manuscript, verify whether Gemini preserves historical numerals, fractions, and idiosyncratic dash punctuation within prose containers.\n\n---", "image_b64": null, "question": {"name": "20 Question: Cohort Case Study: Jay and Dickinson's Recipe Script", "questiontext": "<p>When transcribing Emily Dickinson's autograph recipe for Black Cake (MS Am 1118.7) with Gemini, what specific visual feature requires careful inspection?</p>", "generalfeedback": "<p>On Dickinson's recipe manuscript, verify whether Gemini preserves historical numerals, fractions, and idiosyncratic dash punctuation within prose containers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Her historical numerals and mixed fractions (such as 19 Eggs or 1 1/2 Currants) and variable punctuation strokes.</p>", "feedback": "<p>Correct. Dickinson's distinct numeral loops, fractions, and idiosyncratic dash punctuation provide key tests for multimodal transcription models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Her use of fourteenth-century Carolingian minuscule script.</p>", "feedback": "<p>Incorrect. Dickinson wrote in a distinctive nineteenth-century American cursive hand, not medieval minuscule.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The gold leaf illumination applied to the initial capital letters of her stanzas.</p>", "feedback": "<p>Incorrect. Dickinson wrote on everyday paper and stationery without gold illumination.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Greek marginal glosses written by her publisher in the left margin.</p>", "feedback": "<p>Incorrect. Dickinson's manuscript recipe does not feature Greek marginal glosses.</p>"}]}}, {"step": 21, "title": "Cohort Case Study: Ace and Revolutionary Typography", "content": "**Cohort Case Study: Ace and Revolutionary Typography**\n\nFor Ace, the project witness is a printed French Revolutionary decree from 1791 (Archives nationales série D, Comité des décrets). A printed document might seem simpler than cursive handwriting, but 18th-century French legal printing introduces distinct challenges:\n\n1. The Historical Long-s (ſ): In 1791, French printers still used the medial long-s (`ſ`) in words like `aſſemblée` or `ſerment`. An unguided language model will almost certainly 'correct' these to modern standard `s`. Ace must inspect `transcription_ai.xml` to see whether Gemini preserved the historical glyph `ſ` or normalized it.\n2. Two-Column Layout: The decree is printed in two parallel vertical columns. Ace must verify that Gemini transcribed down Column 1 completely before beginning Column 2, rather than reading horizontally across the central rule.\n3. Legal Colophons: The foot of the decree contains printer information, dates, and names of legislative commissioners. Ace must ensure these lines are captured inside `<p>` blocks with `<lb/>` milestones.\n\nObserving whether the model preserves `ſ` or collapses it to `s` provides Ace with direct empirical evidence of autoregressive smoothing for Friday's report.\n\n**Vocabulary.** *Long-s (ſ)* — An archaic letterform of the lowercase letter 's' commonly used in printing before the early nineteenth century.\n\n**Takeaway:** On French Revolutionary printed decrees, check whether Gemini preserves historical long-s glyphs and follows multi-column reading order.\n\n---", "image_b64": null, "question": {"name": "21 Question: Cohort Case Study: Ace and Revolutionary Typography", "questiontext": "<p>What historical typographic feature should Ace specifically look for in Gemini's transcription of the 1791 French decree?</p>", "generalfeedback": "<p>On French Revolutionary printed decrees, check whether Gemini preserves historical long-s glyphs and follows multi-column reading order.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Whether the model preserved the historical printed long-s (ſ) or silently modernized it to a standard 's'.</p>", "feedback": "<p>Correct. The long-s (`ſ`) is a classic indicator of whether a vision model respected historical typography or applied modern autoregressive smoothing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whether the decree was printed in Cyrillic letters by Russian printers.</p>", "feedback": "<p>Incorrect. The 1791 decree is a French legal document printed in Latin typography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whether the paper contains embedded magnetic barcodes for automated sorting.</p>", "feedback": "<p>Incorrect. Magnetic barcodes were invented in the twentieth century and do not exist on eighteenth-century paper.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Whether all French nouns were automatically translated into German legal terminology.</p>", "feedback": "<p>Incorrect. The model should transcribe the French text as printed without translation.</p>"}]}}, {"step": 22, "title": "Cohort Case Study: Olyvia and Folk-Art Cursive", "content": "**Cohort Case Study: Olyvia and Folk-Art Cursive**\n\nFor Olyvia, the witness is a personal handwritten letter by Nova Scotia folk artist Maud Lewis (1903–1970). Maud Lewis lived with severe rheumatoid arthritis, which shaped her physical hand and script. Her letters feature distinct characteristics:\n\n1. Vernacular and Colloquial Spelling: Maud Lewis wrote with lively, informal, and phonetic spelling typical of rural mid-20th-century Nova Scotia. She was not writing an academic treatise. An AI model trained on formal prose will constantly attempt to 'fix' her grammar and spelling. Olyvia must check whether Gemini respected Maud's authentic voice.\n2. Baselines and Word Spacing: Due to physical constraints in her hands, Maud's letter baselines drift across the page, and word spacing can be irregular. Does Gemini correctly recognize word boundaries, or does it fuse words together?\n3. Faded Ink and Creases: The letter was folded into an envelope and exhibits ink fading along creases. Olyvia must verify whether Gemini appropriately used `<unclear>` or `<gap>` over faded ink, or if it hallucinated words over illegible spots.\n\nOlyvia's reconciliation report on Friday will center on defending Maud's authentic vernacular handwriting against machine smoothing.\n\n**Vocabulary.** *Vernacular orthography* — Informal, phonetic, or non-standard spelling used by individuals outside formal institutional or academic settings.\n\n**Takeaway:** On Maud Lewis's handwritten letters, verify that Gemini respects her informal vernacular spelling and marks faded ink with unclear.\n\n---", "image_b64": null, "question": {"name": "22 Question: Cohort Case Study: Olyvia and Folk-Art Cursive", "questiontext": "<p>When evaluating Gemini's transcription of Maud Lewis's handwritten letter, what is Olyvia's primary editorial concern?</p>", "generalfeedback": "<p>On Maud Lewis's handwritten letters, verify that Gemini respects her informal vernacular spelling and marks faded ink with unclear.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Ensuring the model did not 'correct' Maud's authentic vernacular spelling and grammar into standardized formal English.</p>", "feedback": "<p>Correct. Preserving vernacular orthography against automated grammatical smoothing is critical to maintaining documentary fidelity for folk artists.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Checking whether Maud Lewis used medieval Latin abbreviations in her signatures.</p>", "feedback": "<p>Incorrect. Maud Lewis was a twentieth-century Canadian folk artist writing in English, not Latin.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Verifying that all words were typed using a standard mechanical Remington typewriter.</p>", "feedback": "<p>Incorrect. The witness is an authentic handwritten manuscript letter, not a typewritten document.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ensuring that the model calculated the chemical acidity of the envelope paper.</p>", "feedback": "<p>Incorrect. Multimodal transcription extracts text and layout; chemical analysis is a physical lab procedure.</p>"}]}}, {"step": 23, "title": "Cohort Case Study: Andromeda and Treaty Structure", "content": "**Cohort Case Study: Andromeda and Treaty Structure**\n\nFor Andromeda, the witness is the Peace and Friendship Treaty of 1752, concluded between Governor Peregrine Thomas Hopson and Chief Jean-Baptiste Cope of the Mi'kmaq (Nova Scotia Archives RG 1 vol 430 no 2). This colonial legal instrument presents complex codicological features:\n\n1. Official Legal Formulae: The treaty opens with grand 18th-century diplomatic titles and legal declarations ('Treaty or Articles of Peace and Friendship made and concluded...'). Capitalization is heavy and deliberate. Andromeda must check whether Gemini preserved these capitalized legal nouns.\n2. Bilingual Columns: The printed broadside contains parallel English and French columns. Andromeda must ensure that Gemini transcribed the target column accurately without jumping between languages mid-sentence.\n3. Totem / Mark Representation: Chief Cope did not sign with an alphabetic signature; the treaty records his totem mark (a representation of a totem figure). How does a vision model handle non-alphabetic marks? Does it omit the mark, describe it in words, or flag it?\n\nAndromeda's evaluation on Friday will examine how digital tools handle cross-cultural legal instruments and non-alphabetic attestations.\n\n**Vocabulary.** *Parallel text* — A document layout in which two different language versions or textual recensions are presented side-by-side on the same page.\n\n**Takeaway:** On the 1752 Peace and Friendship Treaty broadside, check bilingual column boundaries and representations of Chief Cope's totem mark.\n\n---", "image_b64": null, "question": {"name": "23 Question: Cohort Case Study: Andromeda and Treaty Structure", "questiontext": "<p>What unique challenge does the 1752 Peace and Friendship Treaty present to an AI transcription model?</p>", "generalfeedback": "<p>On the 1752 Peace and Friendship Treaty broadside, check bilingual column boundaries and representations of Chief Cope's totem mark.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Capturing bilingual parallel columns, 18th-century legal capitalization, and non-alphabetic totem marks like Chief Cope's sign.</p>", "feedback": "<p>Correct. Colonial treaties combine formal legal typography, parallel bilingual layouts, and non-alphabetic cultural marks that challenge automated models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Transcribing ancient Egyptian hieroglyphic cartouches in the preamble.</p>", "feedback": "<p>Incorrect. The 1752 treaty is a colonial North American document in English and French, not Egyptian hieroglyphs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Resolving digital watermarks embedded by modern television broadcast networks.</p>", "feedback": "<p>Incorrect. The treaty is an archival document preserved in the Nova Scotia Archives.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Translating the entire document into hexadecimal computer code.</p>", "feedback": "<p>Incorrect. The transcription task produces TEI XML text, not binary hexadecimal code.</p>"}]}}, {"step": 24, "title": "Creating the Independent File: transcription_ai.xml", "content": "**Creating the Independent File: transcription_ai.xml**\n\nOnce Gemini finishes generating the transcription in the Antigravity chat panel, you must save it into your repository as an independent artifact. \n\nIn the VS Code file explorer (or via the Terminal), create a new file in your project root named `transcription_ai.xml`:\n\n```bash\ntouch transcription_ai.xml\n```\n\nOpen `transcription_ai.xml` in the editor. Copy the entire XML output from the Antigravity chat and paste it into the file. If Antigravity generated a full TEI wrapper with `<teiHeader>`, ensure the header metadata is present; if it emitted only `<text>`, you can wrap it in the minimal TEI root skeleton matching your project.\n\nThe absolute golden rule of this phase is: **NEVER overwrite witness.xml.** \n\nYour `witness.xml` holds your manual Pass 1. Today's file `transcription_ai.xml` holds your machine Pass 2. If you paste the AI text into `witness.xml`, you destroy your manual work and eliminate the possibility of diffing the two passes on Friday. Both files must exist independently side-by-side in your repository.\n\n**Vocabulary.** *transcription_ai.xml* — The dedicated local file in your repository containing the raw, unedited AI diplomatic transcription generated by Gemini.\n\n**Takeaway:** Save the model's raw output into transcription_ai.xml, keeping it strictly separate from your manual witness.xml file.\n\n---", "image_b64": null, "question": {"name": "24 Question: Creating the Independent File: transcription_ai.xml", "questiontext": "<p>Why must Gemini's transcription be saved to transcription_ai.xml rather than being pasted into witness.xml?</p>", "generalfeedback": "<p>Save the model's raw output into transcription_ai.xml, keeping it strictly separate from your manual witness.xml file.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Pasting into witness.xml would over
