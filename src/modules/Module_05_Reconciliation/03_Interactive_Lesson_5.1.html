write and destroy your manual Pass 1, making it impossible to diff the two passes during Friday's reconciliation.</p>", "feedback": "<p>Correct. Double-transcription requires preserving both independent passes in separate files so they can be compared and adjudicated.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code limits all files named witness.xml to a maximum file size of twenty kilobytes.</p>", "feedback": "<p>Incorrect. VS Code has no arbitrary 20 KB limit on file names; the requirement is methodological.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Git will automatically delete your repository if two files contain similar paragraph elements.</p>", "feedback": "<p>Incorrect. Git handles similar and diverging files smoothly; that is the core purpose of version control.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema prohibits any file from having the word 'witness' in its name.</p>", "feedback": "<p>Incorrect. File names are arbitrary operating system labels; schemas validate XML content.</p>"}]}}, {"step": 25, "title": "XML Entity Escaping: The Bare Ampersand Trap", "content": "**XML Entity Escaping: The Bare Ampersand Trap**\n\nThe moment you paste Gemini's output into `transcription_ai.xml`, look at the VS Code editor window. Do you see red squiggly underlines? Look at the Problems panel (`Ctrl + Shift + M` or `Cmd + Shift + M`).\n\nThe most common syntax error produced by AI models in diplomatic transcription is the **bare ampersand trap**. In 18th- and 19th-century English, the ampersand was universally used in abbreviations like `&c.` (for *et cetera*), `Mr. & Mrs.`, or `Smith & Co.`. \n\nIn XML, however, the ampersand (`&`) is a reserved delimiter used exclusively to open entity references (like `&amp;`, `&lt;`, or `&gt;`). When an XML parser encounters a bare ampersand followed by a letter (like `&c.`), it assumes you are calling an entity named `&c;`. Because `c` is not a defined entity, the parser crashes with a fatal fatal syntax error: 'The entity name must immediately follow the & in the entity reference.'\n\nTo fix this, every literal ampersand in the text must be escaped as `&amp;`:\n\n```xml\n<p>paid for bread &amp;c. on Tuesday</p>\n```\n\nScanning for and fixing raw ampersands is the first diagnostic step in validating your AI pass.\n\n**Vocabulary.** *Entity escaping* — The practice of replacing reserved characters in XML (like `&` and `<`) with predefined entity references (like `&amp;` and `&lt;`).\n\n**Takeaway:** In XML, bare ampersands are syntax errors; all literal ampersands like '&c.' must be escaped as `&amp;c.`\n\n---", "image_b64": null, "question": {"name": "25 Question: XML Entity Escaping: The Bare Ampersand Trap", "questiontext": "<p>Why does an AI transcription containing the historical abbreviation '&c.' produce an XML syntax error?</p>", "generalfeedback": "<p>In XML, bare ampersands are syntax errors; all literal ampersands like '&c.' must be escaped as `&amp;c.`</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The ampersand is a reserved XML delimiter, so literal ampersands must be written as the entity reference &amp;amp;c.</p>", "feedback": "<p>Correct. In XML, bare ampersands are reserved for entity references; writing a literal '&' without escaping it as `&amp;` causes a fatal parse error.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The letter 'c' is forbidden from appearing in TEI documents composed in the 21st century.</p>", "feedback": "<p>Incorrect. All alphabetic characters are valid; the error is caused entirely by the unescaped ampersand delimiter.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI schema requires the Latin phrase 'et cetera' to be spelled out in full Greek letters.</p>", "feedback": "<p>Incorrect. TEI permits historical abbreviations, provided reserved XML characters are properly escaped.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>VS Code's spell checker automatically flags all Latin abbreviations as malicious software viruses.</p>", "feedback": "<p>Incorrect. The error is an XML well-formedness syntax error, not an antivirus alert.</p>"}]}}, {"step": 26, "title": "Schema Validation Against msdesc.rng", "content": "**Schema Validation Against msdesc.rng**\n\nOnce syntax errors like bare ampersands are resolved, your file is *well-formed*. But in TEI scholarly editing, well-formedness is only the first hurdle: your document must also be *valid* against the project schema.\n\nIn this course, we validate against our vendored RELAX NG schema: `labs/msdesc.rng`. This schema defines what elements can exist, in what order, and what attributes they may carry.\n\nOpen `transcription_ai.xml` in VS Code with the Scholarly XML / Red Hat XML extension enabled. At the top of your XML file, ensure the model included the schema association processing instruction, or link it directly:\n\n`<?xml-model href=\"labs/msdesc.rng\" type=\"application/xml\" schematypens=\"http://relaxng.org/ns/structure/1.0\"?>`\n\nAlternatively, you can test the file from the VS Code Terminal using the native command-line tool `xmllint`:\n\n```bash\nxmllint --noout --relaxng labs/msdesc.rng transcription_ai.xml\n```\n\nIf the terminal reports `transcription_ai.xml validates`, your file satisfies the grammatical standards of the course. If errors appear, check the line numbers reported in the Problems panel.\n\n**Vocabulary.** *Schema validation* — The automated process of checking an XML document against a formal grammar (such as RELAX NG) to ensure structural conformity.\n\n**Takeaway:** Validate transcription_ai.xml against msdesc.rng in VS Code, ensuring all tags follow the TEI grammar to achieve 0 errors.\n\n---", "image_b64": null, "question": {"name": "26 Question: Schema Validation Against msdesc.rng", "questiontext": "<p>What is the difference between an XML file being 'well-formed' and being 'valid' against msdesc.rng?</p>", "generalfeedback": "<p>Validate transcription_ai.xml against msdesc.rng in VS Code, ensuring all tags follow the TEI grammar to achieve 0 errors.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Well-formed means the XML adheres to basic syntax rules (closed tags, escaped entities); valid means it conforms to the specific TEI grammar defined in the schema.</p>", "feedback": "<p>Correct. Any XML file with matching tags and escaped entities is well-formed, but it is only valid if its elements and hierarchy conform to the project schema.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Well-formed files are stored on local hard drives; valid files are stored in cloud data centers.</p>", "feedback": "<p>Incorrect. Well-formedness and validity are structural and grammatical properties of the XML code itself.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Well-formed files contain no spelling errors; valid files contain no punctuation marks.</p>", "feedback": "<p>Incorrect. Schema validation tests XML element hierarchy and attributes, not natural language spelling.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Well-formed files can only be read by Google Chrome; valid files can only be read by Mozilla Firefox.</p>", "feedback": "<p>Incorrect. Both properties are vendor-neutral standards evaluated by standard XML parsers.</p>"}]}}, {"step": 27, "title": "Diagnosing Common AI Structural Errors", "content": "**Diagnosing Common AI Structural Errors**\n\nWhen checking `transcription_ai.xml` against `msdesc.rng`, AI models typically commit one of three recurring structural errors:\n\n1. Unclosed Milestone Tags: An AI will occasionally emit `<lb>` or `<pb>` with a trailing closing tag like `<lb>word</lb>`. In TEI, line breaks and page breaks are empty milestones. They must be self-closing: `<lb/>` and `<pb/>`.\n2. Bare Text Inside `<div>`: An AI frequently forgets paragraph wrappers, outputting text directly inside `<div>`:\n```xml\n<!-- INVALID -->\n<div>\n  <lb n=\"1\"/>To the Honorable Council...\n</div>\n```\nIn `msdesc.rng`, character data inside `<div>` must be wrapped in `<p>` (or `<lg><l>` for verse):\n```xml\n<!-- VALID -->\n<div>\n  <p><lb n=\"1\"/>To the Honorable Council...</p>\n</div>\n```\n\n3. Hallucinated Element Names: Untuned models sometimes invent plausible-sounding XML tags like `<header>`, `<signature>`, or `<stanza>`. TEI does not have a `<stanza>` tag—it uses `<lg type=\"stanza\">`. \n\nDiagnosing and fixing these structural container issues ensures your AI pass is ready for computational diffing.\n\n**Vocabulary.** *Structural validation error* — A schema violation that occurs when elements are improperly nested, misplaced, or unclosed according to the grammar.\n\n**Takeaway:** Common AI structural errors include unclosed milestones, placing bare text in div, and inventing non-existent element names.\n\n---", "image_b64": null, "question": {"name": "27 Question: Diagnosing Common AI Structural Errors", "questiontext": "<p>How should an editor correct an AI-generated TEI block that places running text directly inside a &lt;div&gt; without a paragraph wrapper?</p>", "generalfeedback": "<p>Common AI structural errors include unclosed milestones, placing bare text in div, and inventing non-existent element names.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Wrap the running text and its line break milestones within a &lt;p&gt; element inside the &lt;div&gt;.</p>", "feedback": "<p>Correct. In TEI, character data in a `<div>` must be contained within `<p>` for prose or `<lg><l>` for verse.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the &lt;div&gt; element completely and place the text directly inside the &lt;facsimile&gt; container.</p>", "feedback": "<p>Incorrect. Textual transcriptions belong inside `<div>` under `<body>`; `<facsimile>` holds image coordinates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Change the file extension from .xml to .txt so the schema stops checking the structure.</p>", "feedback": "<p>Incorrect. Renaming the file bypasses validation rather than fixing the underlying structural markup error.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace all words with &lt;unclear/&gt; tags to satisfy the schema parser.</p>", "feedback": "<p>Incorrect. Schema rules require valid structural containment, not obfuscation of text content.</p>"}]}}, {"step": 28, "title": "Preserving Raw Discrepancies for Friday", "content": "**Preserving Raw Discrepancies for Friday**\n\nWhen reviewing `transcription_ai.xml`, you will inevitably spot places where Gemini misread a word, skipped a punctuation dash, or normalized a historical spelling.\n\nYour immediate human instinct will be to correct Gemini's errors: 'Gemini modernized this to January, but the manuscript actually reads Janry—I should correct it to Janry right now.'\n\n**DO NOT DO THIS.** Resist the urge to edit the text!\n\nYou should only fix XML structural syntax errors (like unescaped `&amp;` or unclosed `<lb/>`) so that the file validates. You must deliberately leave all of Gemini's paleographical errors, misreadings, and modernizations intact in `transcription_ai.xml`.\n\nWhy? Because Friday's lab (Meeting #13) is dedicated to diffing and reconciliation. The entire intellectual exercise of Friday is running a comparative diff, locating every discrepancy between your manual pass and the AI pass, and evaluating why the discrepancy occurred. If you fix Gemini's mistakes today, you eliminate the discrepancies, destroying the object of study before the lab even begins. Preserve the raw machine pass in all its flawed glory!\n\n**Vocabulary.** *Raw discrepancy* — An unedited divergence between two transcription passes that represents a difference in paleographical interpretation.\n\n**Takeaway:** Do not 'fix' paleographical errors in transcription_ai.xml; preserving raw model mistakes is essential for Friday's diffing lab.\n\n---", "image_b64": null, "question": {"name": "28 Question: Preserving Raw Discrepancies for Friday", "questiontext": "<p>Why must you avoid correcting paleographical reading mistakes made by Gemini in transcription_ai.xml during today's lab?</p>", "generalfeedback": "<p>Do not 'fix' paleographical errors in transcription_ai.xml; preserving raw model mistakes is essential for Friday's diffing lab.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Preserving the machine's authentic mistakes provides the necessary discrepancies for Friday's comparative diffing and reconciliation lab.</p>", "feedback": "<p>Correct. The goal of double-transcription is to compare independent passes; cleaning up the AI's readings beforehand destroys the comparative evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Antigravity API charges a monetary penalty for every character modified after generation.</p>", "feedback": "<p>Incorrect. API costs are incurred during inference generation, not when editing local files on disk.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Modifying text in an AI file causes the Git repository index to corrupt permanently.</p>", "feedback": "<p>Incorrect. Git tracks all file modifications safely; the restriction is methodological, not technical.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>TEI guidelines state that AI models must be legally credited as co-authors on all corrected words.</p>", "feedback": "<p>Incorrect. AI models are computational tools, not legal authors; preserving raw output serves comparative auditing.</p>"}]}}, {"step": 29, "title": "Committing Pass 2 to Version Control", "content": "**Committing Pass 2 to Version Control**\n\nWith `transcription_ai.xml` generated and validated to 0 schema errors, the final operational step of today's session is creating a permanent version control record.\n\nIn scholarly digital editing, provenance is paramount. You must be able to prove to readers and reviewers exactly which text was produced by human calipers and which text was generated by a neural model.\n\nIn the VS Code Terminal, stage your new file:\n```bash\ngit add transcription_ai.xml\n```\n\nNow, commit the file with an informative commit message that documents the model and tool used:\n```bash\ngit commit -m \"Step 2: AI diplomatic transcription generated via Gemini in VS Code Antigravity\"\n```\n\nVerify your commit by checking the log:\n```bash\ngit log -n 2 --oneline\n```\n\nYou should see your manual baseline commit followed by your AI baseline commit. Both independent passes are now frozen in your cryptographic Git history. Neither can be tampered with or confused with the other. You have built the two pillars required for textual reconciliation.\n\n**Vocabulary.** *Version control snapshot* — An immutable, cryptographically hashed record of file states committed to a Git repository at a specific point in time.\n\n**Takeaway:** Stage and commit transcription_ai.xml to Git, documenting the model parameters and prompt in your commit message.\n\n---", "image_b64": null, "question": {"name": "29 Question: Committing Pass 2 to Version Control", "questiontext": "<p>Why is committing transcription_ai.xml to Git with an explicit commit message a vital scholarly practice?</p>", "generalfeedback": "<p>Stage and commit transcription_ai.xml to Git, documenting the model parameters and prompt in your commit message.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It creates an immutable, verifiable record of the AI's independent pass before any reconciliation or editing takes place.</p>", "feedback": "<p>Correct. A Git commit establishes provenance, proving that Pass 2 was generated independently before comparative reconciliation began.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It sends an automated invoice to Google Cloud billing to finalize payment for the model.</p>", "feedback": "<p>Incorrect. Git is a local version control system; it does not communicate with cloud billing systems.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It locks your operating system hard drive to prevent any further typing before Friday.</p>", "feedback": "<p>Incorrect. Version control records project history without locking operating system hardware.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts the XML file into an uneditable PDF document for archival storage.</p>", "feedback": "<p>Incorrect. Git tracks the text file in its native XML format; it does not convert it to PDF.</p>"}]}}, {"step": 30, "title": "Synthesis: Calibrating the Two-Pass Baseline", "content": "**Synthesis: Calibrating the Two-Pass Baseline**\n\nTake a moment to review what you have accomplished across the first half of Week 5. \n\nYou began with a realization rooted in cognitive psychology and editorial theory: no single human pass, no matter how carefully keyed, can serve as an unverified ground truth. Human fatigue and cognitive auto-correction inevitably introduce silent slips.\n\nTo solve this, you applied the principle of double-transcription. Rather than relying on a second human transcriber, you deployed a modern multimodal vision model—Gemini inside VS Code Antigravity. You formulated a disciplined paleographical prompt equipped with negative constraints, forbidding the model from indulging its natural impulse to modernize spelling or expand abbreviations.\n\nYou captured the model's raw output in `transcription_ai.xml`, fixed syntax issues like bare ampersands, validated the file to 0 schema errors against `msdesc.rng`, and committed it to Git alongside `witness.xml`.\n\nYou now hold two independent, fully validated diplomatic transcriptions of the exact same physical artifact. On Friday (Meeting #13), we will open them side by side in VS Code, inspect every discrepancy, and build our third, reconciled consensus text.\n\n**Vocabulary.** *Reconciliation baseline* — The paired set of independent transcriptions (Pass 1 manual + Pass 2 AI) ready for comparative diffing and consensus adjudication.\n\n**Takeaway:** By establishing two independent, validated diplomatic passes, you have built the foundation for Friday's reconciliation lab.\n\n---\n\n## References\n\nBawden, R., Clérice, T., Glaise, A., Pinche, A., & Smith, D. (2026).\n*Pre-editorial normalization for automatically transcribed medieval manuscripts in\nOld French and Latin* (arXiv:2602.13905). https://arxiv.org/abs/2602.13905\n\nHaaf, S., Wiegand, F., & Geyken, A. (2013). Measuring the correctness of\ndouble-keying: Error classification and quality control in a large corpus of\nTEI-annotated historical text. *Journal of the Text Encoding Initiative*, (4).\nhttps://doi.org/10.4000/jtei.739\n\nPeer, M., Scius-Bertrand, A., & Fischer, A. (2025). CTC transcription alignment of\nthe Bullinger letters: Automatic improvement of annotation quality. In *ICCV\nWorkshop Proceedings*. IEEE.\n\nSingh, L. G., & Middleton, S. E. (2025). Tabular context-aware optical character\nrecognition and tabular data reconstruction for historical records.\n*International Journal on Document Analysis and Recognition, 28*.\nhttps://doi.org/10.1007/s10032-025-00543-9\n\nTEI Consortium. (2026). *TEI P5: Guidelines for electronic text encoding and\ninterchange*. https://www.tei-c.org/release/doc/tei-p5-doc/en/html/\n\nvan Strien, D., Beelen, K., Ardanuy, M. C., Hosseini, K., McGillivray, B., &\nColavizza, G. (2020). Assessing the impact of OCR quality on downstream NLP tasks.\nIn *Proceedings of the 12th International Conference on Agents and Artificial\nIntelligence*. INSTICC. https://doi.org/10.5220/0009169004840496", "image_b64": null, "question": {"name": "30 Question: Synthesis: Calibrating the Two-Pass Baseline", "questiontext": "<p>What is the final status of your project repository at the conclusion of Lesson 5.1?</p>", "generalfeedback": "<p>By establishing two independent, validated diplomatic passes, you have built the foundation for Friday's reconciliation lab.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The repository holds two independent, schema-validated diplomatic passes (witness.xml and transcription_ai.xml) ready for comparative diffing on Friday.</p>", "feedback": "<p>Correct. Completing Lesson 5.1 means establishing two independent, validated passes in version control, ready for line-by-line reconciliation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All transcriptions have been merged into a single commercial eBook published on Amazon Kindle.</p>", "feedback": "<p>Incorrect. The project is an academic digital edition in progress, not a commercial eBook release.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All XML files have been permanently deleted to save disk space for Week 6 audio files.</p>", "feedback": "<p>Incorrect. Both transcription passes are carefully preserved to enable comparative reconciliation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manuscript image has been permanently erased from library servers following automated transcription.</p>", "feedback": "<p>Incorrect. Source images remain permanently housed in archival repositories; digital editions reference them non-destructively.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
