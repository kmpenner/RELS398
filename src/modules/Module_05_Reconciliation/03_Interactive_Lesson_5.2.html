    <script>
        const lessonData = {"course_title": "Lesson 5.2: Diffing and Reconciling Transcriptions in VS Code", "subtitle": "Module 05: Reconciliation", "total_sections": 30, "slides": [{"step": 1, "title": "The Reconciliation Objective: Synthesis Over Surrender", "content": "**The Reconciliation Objective: Synthesis Over Surrender**\n\nWelcome to Meeting #13. Today you reach the culmination of Week 5: textual reconciliation. \n\nOver the past week, you generated two independent diplomatic transcriptions of your manuscript page. In Week 4, you keyed Pass 1 entirely by hand into `witness.xml`. On Tuesday (Meeting #12), you used Gemini in VS Code Antigravity to produce Pass 2 in `transcription_ai.xml`. \n\nNow, you sit with two completed drafts that disagree with each other. A novice might be tempted to simply pick one file and discard the other, or blindly trust the artificial intelligence model because its output looks clean and polished. In scholarly editing, this surrender is unacceptable.\n\nReconciliation is not about picking a winner. It is about **synthesis**. You are the senior editor of your digital edition. Your task today is to open both drafts side by side, inspect every line where they diverge, interrogate the physical evidence on your digital image, and synthesize the best readings into a third, authoritative file: `transcription_reconciled.xml`. Where Gemini caught a slip you made due to tired eyes, you accept its reading. Where Gemini hallucinated or smoothed historical spelling, you defend the physical ink. You are the ultimate judge.\n\n**Vocabulary.** *Synthesis* — The intellectual act of evaluating multiple drafts to create a single superior, verified text.\n\n**Takeaway:** Textual reconciliation is an active act of scholarly adjudication, not a passive acceptance of machine output.\n\n---", "image_b64": null, "question": {"name": "01 Question: The Reconciliation Objective: Synthesis Over Surrender", "questiontext": "<p>What is the primary intellectual objective of textual reconciliation in digital scholarly editing?</p>", "generalfeedback": "<p>Textual reconciliation is an active act of scholarly adjudication, not a passive acceptance of machine output.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To critically evaluate discrepancies between independent drafts and synthesize the most accurate readings into an authoritative consensus text.</p>", "feedback": "<p>Correct. Reconciliation is an act of scholarly adjudication, comparing independent passes to synthesize a superior, verified consensus text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To automatically overwrite the human transcription with whichever output the AI model produced most quickly.</p>", "feedback": "<p>Incorrect. Editorial reconciliation requires human critical evaluation against manuscript evidence, not passive surrender to machine output.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To delete both transcription files and replace them with modern commercial translations found online.</p>", "feedback": "<p>Incorrect. The goal is establishing an authoritative diplomatic edition of the primary artifact, not replacing it with translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To merge all differences blindly using an automated script without consulting the manuscript image.</p>", "feedback": "<p>Incorrect. Automated merging accepts hallucinations and errors without verification; editors must adjudicate each divergence.</p>"}]}}, {"step": 2, "title": "The Three-Pass Textual Architecture", "content": "**The Three-Pass Textual Architecture**\n\nTo understand your workflow today, you must keep the three-pass textual architecture clear in your mind:\n\n- **Pass 1 (`witness.xml`):** The human manual diplomatic baseline. Authored in Week 4, this draft reflects your careful reading of handwriting, physical layout, and codicological features. It carries human perceptual fatigue and cognitive auto-correction, but also human common sense and historical context.\n- **Pass 2 (`transcription_ai.xml`):** The machine diplomatic baseline. Generated on Tuesday via Gemini in VS Code Antigravity, this draft was produced under strict negative constraints. It never tires and reads microscopic letter strokes consistently, but it is prone to hallucination and silent modernization.\n- **Pass 3 (`transcription_reconciled.xml`):** The reconciled consensus baseline. Synthesized today, this file represents your adjudicated ground truth. It adopts the strengths of both passes while eliminating the distinct flaws of each.\n\nAll three files use the exact same diplomatic XML vocabulary taught in Week 4: `<text>`, `<body>`, `<div>`, `<p>`, `<pb/>`, `<lb/>`, `<unclear>`, and `<gap/>` (plus `<lg>` and `<l>` for poetry). Furthermore, all three files must remain permanently in your repository. Preserving this three-pass lineage provides complete scholarly transparency: anyone inspecting your digital edition can trace exactly how your text evolved from raw image to finished consensus.\n\n**Vocabulary.** *Textual architecture* — The systematic multi-stage progression of draft versions from raw witness to reconciled consensus.\n\n**Takeaway:** Your repository preserves three distinct stages: Pass 1 (manual), Pass 2 (AI), and Pass 3 (reconciled consensus).\n\n---", "image_b64": null, "question": {"name": "02 Question: The Three-Pass Textual Architecture", "questiontext": "<p>Why must all three transcription files (witness.xml, transcription_ai.xml, and transcription_reconciled.xml) remain in your Git repository?</p>", "generalfeedback": "<p>Your repository preserves three distinct stages: Pass 1 (manual), Pass 2 (AI), and Pass 3 (reconciled consensus).</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To preserve full scholarly provenance, allowing readers to trace how editorial decisions resolved differences between human and machine passes.</p>", "feedback": "<p>Correct. Retaining all three files demonstrates complete editorial transparency and provenance for the final consensus reading.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Git repositories crash if any XML file is removed from the working tree.</p>", "feedback": "<p>Incorrect. Git handles file additions and deletions easily; retaining the files is a methodological requirement of scholarly transparency.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To satisfy cloud storage quotas required by academic server hosting agreements.</p>", "feedback": "<p>Incorrect. File retention serves scholarly accountability and auditability, not arbitrary storage quotas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the TEI schema compiler requires three identical copies of every page to validate.</p>", "feedback": "<p>Incorrect. The schema validates individual XML files independently; it does not mandate triple copies.</p>"}]}}, {"step": 3, "title": "Understanding the VS Code Diff Engine", "content": "**Understanding the VS Code Diff Engine**\n\nHow do you compare two long XML files without reading them word-by-word with a magnifying glass? The answer is a computational tool called a **diff engine**.\n\nThe concept of a diff dates back to early Unix computing (specifically Douglas McIlroy's 1974 algorithm). A diff engine takes two text streams—a source and a target—and calculates the shortest sequence of edits (insertions, deletions, and replacements) necessary to transform the first into the second.\n\nIn modern code editors like Visual Studio Code, the diff engine is integrated into an interactive graphical interface. Rather than dumping cryptic terminal markers like `---` and `+++`, VS Code displays both files side-by-side in synchronized split panes:\n\n- Red or light coral shading marks text present in the left file but absent in the right (deletions).\n- Green or light mint shading marks text present in the right file but absent in the left (insertions).\n- Synchronized scrolling ensures that as you move down the document, matching lines remain horizontally aligned.\n\nBy using the diff engine, you let the computer do what computers do best: pinpointing exact coordinate differences. This frees your human intellect to do what humans do best: evaluating the historical meaning of those differences against the manuscript.\n\n**Vocabulary.** *Diff engine* — An algorithmic tool that computes and visually highlights character and line discrepancies between two files.\n\n**Takeaway:** VS Code's diff engine compares two files line-by-line, highlighting deletions, insertions, and intra-line edits.\n\n---", "image_b64": null, "question": {"name": "03 Question: Understanding the VS Code Diff Engine", "questiontext": "<p>How does a graphical diff engine assist a digital editor during transcription reconciliation?</p>", "generalfeedback": "<p>VS Code's diff engine compares two files line-by-line, highlighting deletions, insertions, and intra-line edits.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It automatically computes and visually highlights character and line discrepancies between two files in synchronized split panes.</p>", "feedback": "<p>Correct. A diff engine automates the mechanical task of locating textual divergences, allowing the editor to focus on evaluating evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically corrects all historical spelling errors using a modern online dictionary.</p>", "feedback": "<p>Incorrect. A diff engine highlights textual differences; it does not evaluate historical spelling or apply corrections.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates archaic Latin legal terms into contemporary English prose.</p>", "feedback": "<p>Incorrect. Diff tools compare text streams character by character; they do not perform language translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts XML markup into desktop publishing formats for commercial printing.</p>", "feedback": "<p>Incorrect. Diff engines are text comparison utilities, not layout or printing software.</p>"}]}}, {"step": 4, "title": "Launching Side-by-Side Comparison in VS Code", "content": "**Launching Side-by-Side Comparison in VS Code**\n\nOpening two files for comparison in VS Code is straightforward and can be accomplished in two different ways:\n\n**Method 1: Using the File Explorer (Graphical)**\n\n1. Open the File Explorer sidebar in VS Code (`Ctrl+Shift+E` or `Cmd+Shift+E` on macOS).\n2. Right-click on your manual transcription file (`witness.xml`) and select **Select for Compare**.\n3. Right-click on your AI transcription file (`transcription_ai.xml`) and select **Compare with Selected**.\n4. VS Code immediately opens a new tab titled `witness.xml ↔ transcription_ai.xml` showing both files side-by-side.\n\n**Method 2: Using the Integrated Terminal (Command Line)**\nYou can also launch the diff view directly from the terminal prompt:\n```bash\ncode --diff witness.xml transcription_ai.xml\n```\n\nOnce the diff tab opens, configure your workspace for optimal adjudication. Split your physical monitor or position your windows so that your high-resolution manuscript image is visible alongside VS Code. You cannot reconcile text in a vacuum: your digital image is your primary source of truth, and you must consult it for every single highlighted diff chunk.\n\n**Vocabulary.** *Split diff viewer* — A side-by-side editing interface that displays the original and modified files simultaneously.\n\n**Takeaway:** Use the File Explorer or terminal to compare witness.xml and transcription_ai.xml in VS Code's split diff view.\n\n---", "image_b64": null, "question": {"name": "04 Question: Launching Side-by-Side Comparison in VS Code", "questiontext": "<p>What is the recommended graphical workflow for opening two transcription files in VS Code's diff viewer?</p>", "generalfeedback": "<p>Use the File Explorer or terminal to compare witness.xml and transcription_ai.xml in VS Code's split diff view.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Right-click the first file in the Explorer and choose 'Select for Compare', then right-click the second file and choose 'Compare with Selected'.</p>", "feedback": "<p>Correct. This two-click sequence immediately loads both files into VS Code's side-by-side comparison tab.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Drag both files into the trash bin and restore them simultaneously from the operating system dock.</p>", "feedback": "<p>Incorrect. Moving files to the trash deletes them from your working tree rather than opening them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Rename both files to index.html and preview them in a standard web browser.</p>", "feedback": "<p>Incorrect. Renaming files breaks Git tracking and XML schema validation without opening a diff.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Print both XML files onto physical paper and hold them up against a classroom window.</p>", "feedback": "<p>Incorrect. VS Code provides built-in computational side-by-side diffing designed specifically for this task.</p>"}]}}, {"step": 5, "title": "Navigating Diff Chunks: Insertions, Deletions, and Modifications", "content": "**Navigating Diff Chunks: Insertions, Deletions, and Modifications**\n\nWhen you open a diff, the editor groups contiguous differences into distinct units called **diff chunks**. A diff chunk can be as small as a single punctuation mark or as large as an entire paragraph where lineation diverged.\n\nTo navigate diff chunks efficiently without missing subtle one-character discrepancies:\n\n1. **The Navigation Toolbar:** In the top right corner of the diff editor tab, look for the navigation arrows: **Go to Next Change** (down arrow) and **Go to Previous Change** (up arrow).\n2. **Keyboard Shortcuts:** You can jump between differences instantly:\n   - macOS: `Option+F5` (Next Change), `Shift+Option+F5` (Previous Change)\n   - Windows/Linux: `Alt+F5` (Next Change), `Shift+Alt+F5` (Previous Change)\n3. **The Overview Ruler (Minimap):** On the far right edge of the editor window, the vertical scrollbar displays colored tick marks showing the distribution of differences throughout the file. Blue or green tick marks represent additions; red marks indicate deletions.\n\nWorking through your file chunk-by-chunk using keyboard shortcuts ensures disciplined, comprehensive review. Never skim or scroll rapidly: an unexamined diff chunk might contain a critical scribal abbreviation or an AI hallucination.\n\n**Vocabulary.** *Diff chunk* — A contiguous block of text containing one or more lines where two files differ.\n\n**Takeaway:** Navigate methodically through diff chunks using keyboard shortcuts or the diff minimap rather than scrolling aimlessly.\n\n---", "image_b64": null, "question": {"name": "05 Question: Navigating Diff Chunks: Insertions, Deletions, and Modifications", "questiontext": "<p>How should a digital editor navigate through textual discrepancies in VS Code's diff viewer?</p>", "generalfeedback": "<p>Navigate methodically through diff chunks using keyboard shortcuts or the diff minimap rather than scrolling aimlessly.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Use the 'Next Change' and 'Previous Change' commands (or keyboard shortcuts) to step systematically through each diff chunk.</p>", "feedback": "<p>Correct. Stepping chunk-by-chunk using navigation shortcuts ensures that every single discrepancy is examined without accidental oversight.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scroll down the page as fast as possible while looking only for red-colored words.</p>", "feedback": "<p>Incorrect. Rapid scrolling easily misses subtle one-character differences or missing line breaks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Close the diff editor after inspecting the first two lines and assume the remaining lines match.</p>", "feedback": "<p>Incorrect. Discrepancies occur throughout historical documents; every section requires review.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Zoom out to 10% magnification so the entire document fits onto a single screen.</p>", "feedback": "<p>Incorrect. Extreme zoom out makes character-level text unreadable, preventing paleographical inspection.</p>"}]}}, {"step": 6, "title": "Reading Diff Highlighting: Block vs. Character-Level Changes", "content": "**Reading Diff Highlighting: Block vs. Character-Level Changes**\n\nVS Code uses a two-tier visual highlighting system to communicate exactly what kind of divergence has occurred:\n\n1. **Line-Level Background Tinting:** When a line contains any difference, the entire line receives a pale, semi-transparent background color (light red/coral on the left, light green/mint on the right). This signals that the line as a whole does not match.\n2. **Intra-Line Character Highlighting:** Within that tinted line, VS Code applies a darker, more saturated background color directly behind the specific characters that differ. \n\nFor example, consider an 18th-century line where the manual pass keyed `the publick peace` and Gemini produced `the public peace`:\n\n- The entire line is lightly shaded in both panes.\n- In the left pane (`witness.xml`), the letter `k` in `publick` is highlighted with a rich, darker tint.\n- In the right pane (`transcription_ai.xml`), the space following `public` is highlighted, indicating that the `k` is missing.\n\nLearning to read this two-tier shading allows you to diagnose discrepancies in seconds. You don't have to re-read the entire sentence; your eye focuses immediately on the darker character-level highlights. That darker highlight tells you exactly what historical feature is under dispute.\n\n**Vocabulary.** *Intra-line highlighting* — The darker shading within a diff line that pinpoints the exact character coordinates of a discrepancy.\n\n**Takeaway:** Diff lines use pale background tinting for the changed line and darker highlighting for exact character differences.\n\n---", "image_b64": null, "question": {"name": "06 Question: Reading Diff Highlighting: Block vs. Character-Level Changes", "questiontext": "<p>What does darker, more saturated highlighting within a shaded diff line indicate in VS Code?</p>", "generalfeedback": "<p>Diff lines use pale background tinting for the changed line and darker highlighting for exact character differences.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It pinpoints the exact individual characters or punctuation marks that differ between the two lines.</p>", "feedback": "<p>Correct. Intra-line saturated highlighting isolates the exact character-level coordinates of the textual disagreement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It indicates that the line violates XML schema grammar rules.</p>", "feedback": "<p>Incorrect. Schema errors are indicated by red wavy squigglies, not intra-line diff highlights.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It highlights words that are copyrighted by commercial publishers.</p>", "feedback": "<p>Incorrect. Diff highlighting is purely an edit-distance comparison between local files; it has no copyright awareness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It marks lines that have been locked and cannot be edited by the user.</p>", "feedback": "<p>Incorrect. Highlighting indicates differences, not file permission locks.</p>"}]}}, {"step": 7, "title": "The Danger of Automated Merge: Why Manual Adjudication is Mandatory", "content": "**The Danger of Automated Merge: Why Manual Adjudication is Mandatory**\n\nIn software engineering, developers frequently use automated merge tools (`git merge`) to combine code branches. If Developer A changed line 10 and Developer B changed line 50, the git merge engine automatically merges both changes without asking questions.\n\nIn historical textual scholarship, **automated merging is strictly forbidden**.\n\nWhy? Because git merge algorithms possess zero historical consciousness. A merge algorithm cannot look at an 18th-century manuscript image. It does not know that an author used a quill pen, that ink faded across a fold, or that printers used the medial long-s (`ſ`). \n\nIf an AI model silently 'corrected' an archaic word from `ye` to `the`, an automated merge tool might accept the AI's version simply because it looks like a modern dictionary word. In doing so, the algorithm destroys historical evidence and corrupts your edition.\n\nEvery difference between your passes represents a fork in scholarly interpretation. You cannot delegate that interpretation to a heuristic script. You must look at the primary manuscript image, inspect the physical ink, and make an active, documented editorial decision. That is why we create our third file manually through adjudication.\n\n**Vocabulary.** *Automated merge* — A blind computational operation that accepts changes without contextual evaluation of historical evidence.\n\n**Takeaway:** Never accept automated three-way merges on historical texts; every difference demands paleographical scrutiny.\n\n---", "image_b64": null, "question": {"name": "07 Question: The Danger of Automated Merge: Why Manual Adjudication is Mandatory", "questiontext": "<p>Why are automated git merge algorithms inappropriate for reconciling historical manuscript transcriptions?</p>", "generalfeedback": "<p>Never accept automated three-way merges on historical texts; every difference demands paleographical scrutiny.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Automated merge tools lack historical and visual context, and would blindly incorporate AI modernizations and hallucinations into the text.</p>", "feedback": "<p>Correct. Automated algorithms evaluate text purely by string matching, destroying historical orthography and accepting unverified AI smoothing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because automated merges automatically delete the local repository from the computer hard drive.</p>", "feedback": "<p>Incorrect. Merge tools combine text streams; they do not delete repositories.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because git merge commands can only be executed by certified system administrators.</p>", "feedback": "<p>Incorrect. Git merge is a standard user command, but methodologically flawed for textual scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because XML files cannot be read by version control systems.</p>", "feedback": "<p>Incorrect. XML files are plain text and are tracked by Git natively.</p>"}]}}, {"step": 8, "title": "Establishing the Third File: transcription_reconciled.xml", "content": "**Establishing the Third File: transcription_reconciled.xml**\n\nNow we begin hands-on construction. Before adjudicating any lines, you must create the container for your reconciled consensus text: `transcription_reconciled.xml`.\n\n**Step-by-Step File Initialization:**\n\n1. In the VS Code File Explorer, duplicate your manual transcription file (`witness.xml`) or create a new file in your repository root named `transcription_reconciled.xml`.\n2. Ensure that this new file opens with the full standard TEI container hierarchy:\n```xml\n<text>\n  <body>\n    <div>\n      <pb facs=\"#[surface-id]\" n=\"[page-num]\"/>\n      <!-- Adjudicated paragraphs, lines, and milestones go here -->\n    </div>\n  </body>\n</text>\n```\n\n3. Open `transcription_reconciled.xml` in an editor pane alongside your diff tab.\n\nAs you step through the diff chunks between `witness.xml` and `transcription_ai.xml`, you will build `transcription_reconciled.xml` line by line. If `witness.xml` is correct, keep its line. If `transcription_ai.xml` is superior, paste its reading into `transcription_reconciled.xml`. If both missed something, write the corrected reading directly into the reconciled file.\n\nNotice the fundamental rule: **you do not edit witness.xml or transcription_ai.xml today**. Those two files remain frozen as historical records of Pass 1 and Pass 2. All edits occur exclusively in `transcription_reconciled.xml`.\n\n**Vocabulary.** *Consensus document* — The third, authoritative file synthesized from the best verified readings of prior passes.\n\n**Takeaway:** Create transcription_reconciled.xml as an independent file to house your reconciled readings without overwriting earlier passes.\n\n---", "image_b64": null, "question": {"name": "08 Question: Establishing the Third File: transcription_reconciled.xml", "questiontext": "<p>What is the correct editing procedure when building transcription_reconciled.xml during reconciliation?</p>", "generalfeedback": "<p>Create transcription_reconciled.xml as an independent file to house your reconciled readings without overwriting earlier passes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Apply all adjudicated decisions and corrections exclusively to transcription_reconciled.xml, leaving witness.xml and transcription_ai.xml untouched.</p>", "feedback": "<p>Correct. Leaving the first two passes untouched preserves their integrity as baseline evidence, while the third file captures the reconciled consensus.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Edit witness.xml directly and delete transcription_ai.xml once finished.</p>", "feedback": "<p>Incorrect. Overwriting Pass 1 destroys the manual baseline, ruining the project's provenance trail.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Paste both files into transcription_reconciled.xml one after the other to double the length of the document.</p>", "feedback": "<p>Incorrect. The reconciled file is an adjudicated consensus text of the page, not a concatenated dump of duplicate drafts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Save all changes directly into msdesc.rng to modify the underlying schema grammar.</p>", "feedback": "<p>Incorrect. The schema file msdesc.rng defines structural validation rules, not manuscript text content.</p>"}]}}, {"step": 9, "title": "The Four Discrepancy Categories", "content": "**The Four Discrepancy Categories**\n\nAs you compare Pass 1 and Pass 2, you will encounter dozens of differences. To prevent cognitive overwhelm, textual scholars categorize discrepancies into a structured **error taxonomy**. \n\nIn this course, every divergence falls into one of four distinct categories:\n\n1. **Category A: Human Perceptual Fatigue (AI Correct).** You missed a letter, skipped an obscure word, or misread a clear character because your eyes were tired. Gemini caught it.\n2. **Category B: AI Hallucination / Autoregressive Smoothing (Human Correct).** Gemini modernized spelling, expanded an abbreviation, invented words over smudges, or smoothed syntax. Your manual reading is faithful to the physical ink.\n3. **Category C: Genuine Physical Ambiguity (Both Uncertain).** The manuscript itself is damaged, faded, torn, or stained. Both human and machine struggled.\n4. **Category D: Layout and Structural Divergence.** Differences in line breaks (`<lb/>`), paragraph boundaries (`<p>`), or verse containers (`<lg><l>`).\n\nMemorize these four categories. In Friday's lab and in tonight's assignment reflection (`RECONCILIATION.md`), you will formally report your diff results using this exact taxonomy.\n\n**Vocabulary.** *Error taxonomy* — A structured classification system used to group and analyze different types of transcription discrepancies.\n\n**Takeaway:** Classify every divergence into one of four categories: human fatigue, machine smoothing, physical ambiguity, or structural layout.\n\n---", "image_b64": null, "question": {"name": "09 Question: The Four Discrepancy Categories", "questiontext": "<p>Which discrepancy category applies when an AI model silently modernizes historical spelling or invents words over ink smudges?</p>", "generalfeedback": "<p>Classify every divergence into one of four categories: human fatigue, machine smoothing, physical ambiguity, or structural layout.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Category B: AI Hallucination / Autoregressive Smoothing (Human Correct).</p>", "feedback": "<p>Correct. Category B describes instances where the neural model deviates from physical ink to produce standardized or fabricated text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Category A: Human Perceptual Fatigue.</p>", "feedback": "<p>Incorrect. Category A is when the human made a fatigue slip and the AI was correct.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Category C: Genuine Physical Ambiguity.</p>", "feedback": "<p>Incorrect. Category C describes instances where the artifact itself is physically damaged or ambiguous to both observers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Category D: Layout and Structural Divergence.</p>", "feedback": "<p>Incorrect. Category D concerns layout elements like milestones and structural containers.</p>"}]}}, {"step": 10, "title": "Category A: Catching Human Perceptual Fatigue", "content": "**Category A: Catching Human Perceptual Fatigue**\n\nLet us examine Category A in detail. When you transcribed your page by hand in Week 4, you were reading unfamiliar historical scripts—perhaps 18th-century cursive or mid-20th-century folk handwriting. Close paleographical reading is exhausting. After thirty minutes, human attention degrades.\n\nCommon human fatigue errors include:\n\n- Dropping small grammatical particles (e.g. skipping 'the', 'of', or 'and').\n- Inverting adjacent letters (e.g. typing 'recieve' instead of 'receive' or vice-versa).\n- Misreading unambiguous characters due to visual habit (e.g. reading an archaic letter 'e' as an 'o').\n\nWhen you examine a diff chunk and see that Gemini transcribed a letter or word that you omitted, zoom in on your high-resolution image. Look closely at the physical ink. If the ink clearly shows the word that Gemini captured, celebrate! The AI model has served as an indefatigable second reader, catching an error caused by human fatigue.\n\n**Your Action:** Accept Gemini's reading into `transcription_reconciled.xml`. Take note of this occurrence for your reflection report: human-machine double-keying has successfully caught a human slip.\n\n**Vocabulary.** *Perceptual fatigue* — Cognitive exhaustion from prolonged close reading that causes transcribers to miss visual details.\n\n**Takeaway:** When Gemini correctly reads characters that you misread due to fatigue, accept the machine reading into your consensus file.\n\n---", "image_b64": null, "question": {"name": "10 Question: Category A: Catching Human Perceptual Fatigue", "questiontext": "<p>What should an editor do when a diff reveals that Gemini correctly captured a manuscript word that the human transcriber skipped?</p>", "generalfeedback": "<p>When Gemini correctly reads characters that you misread due to fatigue, accept the machine reading into your consensus file.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verify the word against the primary image and accept Gemini's reading into transcription_reconciled.xml.</p>", "feedback": "<p>Correct. When image verification confirms the machine was accurate, the reading is adopted into the reconciled consensus text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Reject Gemini's reading to protect human pride and maintain the original human error.</p>", "feedback": "<p>Incorrect. Scholarly editing prioritizes fidelity to the historical witness above personal pride.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the entire paragraph containing the skipped word to hide the error from reviewers.</p>", "feedback": "<p>Incorrect. Deleting text corrupts the completeness of the digital edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Mark the word with a <gap/> element to pretend the manuscript was physically destroyed.</p>", "feedback": "<p>Incorrect. `<gap/>` is reserved for genuine physical loss, not transcriber oversights.</p>"}]}}, {"step": 11, "title": "Cognitive Blind Spots: The Repetition and Skipping Effect", "content": "**Cognitive Blind Spots: The Repetition and Skipping Effect**\n\nOne of the most pervasive cognitive phenomena in textual transmission is **eye-skip** (historically called *parablepsis* or *homoioteleuton*). \n\nWhen a historical text contains identical or similar words in close proximity, the human eye easily loses its place on the page:\n\n```\nLine 4: ...shall pay to the treasurer the sum of fifty pounds...\nLine 5: ...and upon payment to the treasurer shall receive a receipt...\n```\n\nIf a human transcriber looks away to type \"to the treasurer\" from Line 4, their eye often returns to the *second* occurrence on Line 5. As a result, the entire phrase between the two occurrences is silently omitted. Scribes in medieval scriptoria committed this exact error thousands of times, and modern students do the same.\n\nConversely, a computer vision model does not have an eye that wanders between lines. It processes visual patches systematically across pixel space. In a diff, an eye-skip appears as a sudden multi-word deletion in the manual pass.\n\nWhen you see a large deletion chunk in `witness.xml`, check the manuscript image immediately. If you jumped a line, restore the missing text from `transcription_ai.xml` into `transcription_reconciled.xml`.\n\n**Vocabulary.** *Eye-skip (parablepsis)* — An error where the transcriber's eye jumps between similar words or letters, skipping text in between.\n\n**Takeaway:** Human readers frequently skip repeated words or jump lines; machine vision models reliably flag these omissions.\n\n---", "image_b64": null, "question": {"name": "11 Question: Cognitive Blind Spots: The Repetition and Skipping Effect", "questiontext": "<p>What is the paleographical term for an error where a transcriber's eye jumps between identical words, accidentally omitting the text in between?</p>", "generalfeedback": "<p>Human readers frequently skip repeated words or jump lines; machine vision models reliably flag these omissions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Parablepsis (eye-skip).</p>", "feedback": "<p>Correct. Parablepsis or eye-skip is a classic scribal and editorial error caused by visual jumping between similar word endings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Dittography.</p>", "feedback": "<p>Incorrect. Dittography is the accidental repetition of a letter or word, rather than omission.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Metathesis.</p>", "feedback": "<p>Incorrect. Metathesis is the transposition of adjacent letters or sounds within a word.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Haplography.</p>", "feedback": "<p>Incorrect. Haplography is copying once what should be copied twice, closely related but distinct from line-jumping eye-skip.</p>"}]}}, {"step": 12, "title": "Category B: Identifying Machine Hallucination", "content": "**Category B: Identifying Machine Hallucination**\n\nNow we turn to Category B: machine failure. Large multimodal models like Gemini are autoregressive neural networks. They are trained to predict the most statistically probable next token given the prompt and the image context.\n\nWhile this predictive power makes them remarkably fluent, it also creates their greatest paleographical danger: **hallucination**.\n\nWhen an AI model encounters an ink smudge, a dark crease, or an ambiguous ligature, it does not stop and confess uncertainty unless forced to do so. Instead, the language model inside the vision architecture attempts to 'fill in the blank.' It predicts what word *ought* to appear in an 18th-century sentence, and emits that word as if it were plainly visible on the parchment!\n\nIn a diff, machine hallucination typically appears where `transcription_ai.xml` presents a complete, elegant sentence, but `witness.xml` contains an `<unclear>` tag or a partial word.\n\nWhen you check the image, you will see the truth: there is only a smudge of faded ink. Gemini invented the word out of thin air.\n\n**Your Action:** Reject the hallucination! Defend the physical document. Preserve your manual reading or mark the doubtful reading with `<unclear>` in `transcription_reconciled.xml`.\n\n**Vocabulary.** *Hallucination* — A neural model error where the system generates plausible-sounding text unsupported by physical ink on the image.\n\n**Takeaway:** Reject machine readings that invent missing letters or smooth out messy manuscript realities.\n\n---", "image_b64": null, "question": {"name": "12 Question: Category B: Identifying Machine Hallucination", "questiontext": "<p>How should an editor respond when Gemini generates a complete word over an ink blot where no distinct letters are visible?</p>", "generalfeedback": "<p>Reject machine readings that invent missing letters or smooth out messy manuscript realities.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Reject Gemini's hallucinated word and mark the damaged area with an appropriate TEI uncertainty element like <unclear> or <gap/>.</p>", "feedback": "<p>Correct. Editors must reject machine hallucinations that invent text over physical damage, preserving authentic manuscript evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Accept the word because neural models have telepathic access to the original author's intentions.</p>", "feedback": "<p>Incorrect. AI models predict statistical token patterns; they have no telepathic knowledge of history.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Change the manuscript image using an image editor to match what the AI predicted.</p>", "feedback": "<p>Incorrect. Falsifying archival images is scholarly malpractice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Email Google support asking them to rewrite the model weights before continuing the workshop.</p>", "feedback": "<p>Incorrect. Adjudicating model failures is a normal and expected part of scholarly reconciliation.</p>"}]}}, {"step": 13, "title": "The Modernization Reflex: Defending Archaic Orthography", "content": "**The Modernization Reflex: Defending Archaic Orthography**\n\nThe most frequent Category B error is what we call the **modernization reflex** (or autoregressive smoothing). \n\nMultimodal foundation models are trained on billions of words of modern web text, news articles, and contemporary literature. Standard English orthography acts like a powerful gravitational pull on the model's outputs. Even when you instruct Gemini with strict negative constraints, the model will constantly attempt to 'correct' historical spelling:\n\n- `publick` $\\to$ modernized to `public`\n- `compleat` $\\to$ modernized to `complete`\n- `shew` $\\to$ modernized to `show`\n- `Janry` $\\to$ modernized to `January`\n- `ye` $\\to$ modernized to `the`\n\nIn the diff editor, these modernizations appear as crisp character-level discrepancies. Look at `witness.xml`: you transcribed `compleat` because the author wrote `c-o-m-p-l-e-a-t`. Look at `transcription_ai.xml`: Gemini emitted `complete`.\n\nRemember: our goal this week is **diplomatic transcription**. We want to preserve the exact physical and orthographical testimony of the witness. Do not let the machine homogenize historical language.\n\n**Your Action:** Reject Gemini's modernized spelling. Keep the authentic archaic spelling in `transcription_reconciled.xml`.\n\n**Vocabulary.** *Archaic orthography* — Historical spelling practices that differ from modern standardized dictionaries.\n\n**Takeaway:** When Gemini silently modernizes historical spellings like 'compleat' or 'publick', reject the edit and defend the authentic ink.\n\n---", "image_b64": null, "question": {"name": "13 Question: The Modernization Reflex: Defending Archaic Orthography", "questiontext": "<p>Why do multimodal vision models frequently modernize historical spellings despite explicit prompt constraints forbidding it?</p>", "generalfeedback": "<p>When Gemini silently modernizes historical spellings like 'compleat' or 'publick', reject the edit and defend the authentic ink.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Their training on vast corpora of modern text creates a statistical bias toward standardized contemporary vocabulary.</p>", "feedback": "<p>Correct. Autoregressive language models have a strong statistical prior toward modern standard spelling, causing them to smooth historical orthography.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI guidelines strictly prohibit transcribing archaic spelling in digital editions.</p>", "feedback": "<p>Incorrect. TEI diplomatic transcription exists specifically to preserve authentic historical spelling.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the VS Code diff extension automatically rewrites XML text before displaying it.</p>", "feedback": "<p>Incorrect. The diff extension displays files exactly as written; it does not alter file content.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because historical English authors deliberately designed their spelling to confuse modern neural networks.</p>", "feedback": "<p>Incorrect. Historical spelling reflected contemporary phonetic and regional conventions long before computing.</p>"}]}}, {"step": 14, "title": "Scribal Abbreviations vs. Silent AI Expansion", "content": "**Scribal Abbreviations vs. Silent AI Expansion**\n\nA related failure mode in Category B is the **silent expansion of abbreviations**. \n\nHistorical writers made extensive use of abbreviations. Paper and parchment were expensive, and writing with a quill pen was labor-intensive. Standard abbreviations included:\n\n- Brevigraphs like `&` and `&c.` (et cetera)\n- Suspensions like `Govr` (Governor) or `Honble` (Honorable)\n- Superscript letters (e.g. `y^e` for *the*, `y^t` for *that*, `w^ch` for *which*)\n\nWhen Gemini encounters `Govr`, its internal language model recognizes the semantic concept 'Governor'. Unless strictly constrained, it will often output `<p>Governor</p>` instead of `<p>Govr</p>`.\n\nIn Week 6 (Normalization), we will learn how to encode abbreviations and their modern expansions together using TEI elements like `<choice>`, `<abbr>`, and `<expan>`. \n\n**However, this week, normalization elements are strictly locked!** Today, we are establishing the pure, unexpanded diplomatic baseline. If Gemini expanded an abbreviation, it broke the diplomatic boundary.\n\n**Your Action:** Reject the expanded word. Keep the unexpanded historical abbreviation in `transcription_reconciled.xml`.\n\n**Vocabulary.** *Scribal abbreviation* — A shortened written form or symbol used by historical writers to conserve parchment, ink, or writing time.\n\n**Takeaway:** Keep abbreviations like '&c.', 'ye', and 'Govr' exactly as written; do not let Gemini silently expand them.\n\n---", "image_b64": null, "question": {"name": "14 Question: Scribal Abbreviations vs. Silent AI Expansion", "questiontext": "<p>How should a transcriber handle an instance where Gemini expanded the scribal abbreviation 'Govr' into the full word 'Governor'?</p>", "generalfeedback": "<p>Keep abbreviations like '&c.', 'ye', and 'Govr' exactly as written; do not let Gemini silently expand them.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Reject the expansion and retain the abbreviated form 'Govr' to preserve diplomatic fidelity.</p>", "feedback": "<p>Correct. In diplomatic transcription, abbreviations must remain unexpanded; interpretive expansion is deferred until normalization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Accept 'Governor' and delete the manuscript image to prevent anyone from noticing.</p>", "feedback": "<p>Incorrect. Suppressing evidence violates basic scholarly ethics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Wrap the word in an <expan> tag immediately, ignoring the Week 5 boundary rules.</p>", "feedback": "<p>Incorrect. Normalization tags remain locked until Week 6 to keep the diplomatic baseline clean.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Change the author of the manuscript to Gemini 1.5 in the teiHeader.</p>", "feedback": "<p>Incorrect. The manuscript author remains the historical person; the AI is merely a transcription tool.</p>"}]}}, {"step": 15, "title": "Long-s (ſ) and Historical Letterforms", "content": "**Long-s (ſ) and Historical Letterforms**\n\nFor students working with 18th-century printed texts (such as Ace's 1791 French Revolutionary Decree), one particular glyph creates continuous diff discrepancies: the **medial long-s (`ſ`)**.\n\nIn European printing from the Renaissance until around 1800, printers used two distinct lowercase forms of the letter 's':\n\n- The short round 's' (`s`) was used at the end of words (e.g. `leurs`, `dans`).\n- The long-s (`ſ`) was used at the beginning and in the middle of words (e.g. `aſſemblée`, `ſerment`, `neceſſaire`).\n\nThe long-s looks very similar to a lowercase 'f', but lacks the full right-hand horizontal crossbar.\n\nStandard AI vision models constantly collapse the long-s into a modern round 's'. When viewing the diff of Ace's decree:\n\n- `witness.xml` contains `aſſemblée` (using Unicode `U+017F`).\n- `transcription_ai.xml` contains `assemblée` (using modern `s`).\n\nWhile modernizing the long-s is common in popular reprints, in a diplomatic digital edition we preserve the exact typographic testimony of the 1791 printing press. \n\n**Your Action:** Preserve the historical long-s glyph (`ſ`) in `transcription_reconciled.xml`.\n\n**Vocabulary.** *Medial long-s (ſ)* — An archaic lowercase letterform resembling an 'f' without a crossbar, used medially in 18th-century typography.\n\n**Takeaway:** If Gemini normalized the long-s (ſ) into a modern 's', restore the historical glyph to preserve printed testimony.\n\n---", "image_b64": null, "question": {"name": "15 Question: Long-s (ſ) and Historical Letterforms", "questiontext": "<p>In historical printed texts prior to 1800, what is the significance of the medial long-s (ſ) character?</p>", "generalfeedback": "<p>If Gemini normalized the long-s (ſ) into a modern 's', restore the historical glyph to preserve printed testimony.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It is a distinct historical typographic letterform that must be preserved in diplomatic transcription rather than normalized to round 's'.</p>", "feedback": "<p>Correct. The long-s is an authentic feature of early modern typography and is preserved in strict diplomatic editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It represents a printing error where the press operator inserted a broken 'f' by mistake.</p>", "feedback": "<p>Incorrect. The long-s was a standard, intentional typographical convention used across Europe for centuries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It indicates that the text was translated from German into French.</p>", "feedback": "<p>Incorrect. Long-s was used across Latin, English, French, Italian, and many other languages.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is an obsolete mathematical symbol denoting integration over curved surfaces.</p>", "feedback": "<p>Incorrect. While the calculus integral sign derives from long-s, in text it is simply an alphabetical character.</p>"}]}}, {"step": 16, "title": "Category C: Genuine Physical Ambiguity on the Artifact", "content": "**Category C: Genuine Physical Ambiguity on the Artifact**\n\nCategory C represents the moments where the disagreement between Pass 1 and Pass 2 is not caused by human error or machine bias, but by the physical condition of the artifact itself.\n\nManuscripts are physical objects that have survived decades or centuries of handling, folding, dampness, and chemical decay:\n\n- Ink fades to faint yellowish ghosts of letters.\n- Acidic iron-gall ink burns through paper fibers.\n- Moisture creates water stains and cockling.\n- Folds, tears, and seal wax obscure written lines.\n\nWhen you reach a Category C diff chunk, you will notice that both you and Gemini hesitated:\n\n- Perhaps you transcribed `p<unclear>ai</unclear>d` while Gemini guessed `part`.\n- Perhaps you left a blank space while Gemini output `trans<unclear>action</unclear>`.\n\nNeither reading is completely right or completely wrong. The physical reality of the page is genuinely ambiguous. \n\nIn digital editing, you do not force a fake resolution. TEI provides specialized markup designed specifically to communicate scholarly uncertainty with mathematical precision: `<unclear>` and `<gap/>`.\n\n**Vocabulary.** *Physical ambiguity* — Manuscript uncertainty caused by physical damage, ink fading, paper tears, or heavy smudges.\n\n**Takeaway:** Where both human and machine struggle with damaged physical ink, resolve the disagreement with TEI scholarly markup.\n\n---", "image_b64": null, "question": {"name": "16 Question: Category C: Genuine Physical Ambiguity on the Artifact", "questiontext": "<p>What characterizes a Category C discrepancy during transcription reconciliation?</p>", "generalfeedback": "<p>Where both human and machine struggle with damaged physical ink, resolve the disagreement with TEI scholarly markup.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The manuscript itself is physically damaged, faded, or torn, causing genuine uncertainty for both human and machine observers.</p>", "feedback": "<p>Correct. Category C discrepancies stem from physical degradation of the primary witness rather than observer error.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The XML schema was corrupted by a computer virus during download.</p>", "feedback": "<p>Incorrect. Category C refers to manuscript condition, not software corruption.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The student forgot to save their file before closing VS Code.</p>", "feedback": "<p>Incorrect. File handling mistakes are user operational issues, not documentary ambiguities.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The library restricted copyright access to the manuscript image.</p>", "feedback": "<p>Incorrect. Category C addresses physical legibility on the artifact itself.</p>"}]}}, {"step": 17, "title": "Adjudicating Faded Ink: The Decisive Use of unclear", "content": "**Adjudicating Faded Ink: The Decisive Use of unclear**\n\nWhen you adjudicate a Category C reading where ink is faded but partially decipherable, the TEI `<unclear>` element is your primary tool.\n\nA foundational principle of scholarly editing is: **never guess in silence**. \n\nIf you or Gemini believe that a faded stroke represents the word \"Tuesday\", but the letters \"es\" are smeared by a thumbprint, do not output bare `Tuesday`. Typing bare text implies to the reader that the manuscript is pristine. \n\nInstead, enclose the uncertain reading inside `<unclear>`:\n```xml\n<p><lb n=\"12\"/>paid on <unclear>Tuesday</unclear> last</p>\n```\n\nYou can even apply `<unclear>` to individual characters within a word:\n```xml\n<p><lb n=\"12\"/>paid on Tu<unclear>es</unclear>day last</p>\n```\n\nWhen someone views your digital edition, the rendering stylesheet will display `<unclear>` text with sublinear dots or brackets, alerting the reader to the editorial uncertainty. Using `<unclear>` demonstrates scholarly integrity: you provide your best paleographical hypothesis while honestly signaling the limits of physical evidence.\n\n**Vocabulary.** *unclear element* — A TEI tag wrapping candidate readings that are probable but visually uncertain due to manuscript degradation.\n\n**Takeaway:** Wrap ambiguous readings in the unclear tag rather than guessing silently or omitting doubtful characters.\n\n---", "image_b64": null, "question": {"name": "17 Question: Adjudicating Faded Ink: The Decisive Use of unclear", "questiontext": "<p>Why is wrapping doubtful words in &lt;unclear&gt; superior to typing them as plain text in a diplomatic edition?</p>", "generalfeedback": "<p>Wrap ambiguous readings in the unclear tag rather than guessing silently or omitting doubtful characters.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It explicitly communicates to readers that the reading is an editorial hypothesis rather than pristine physical evidence.</p>", "feedback": "<p>Correct. The `<unclear>` tag preserves scholarly transparency by flagging readings that cannot be verified with absolute certainty.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It encrypts the text with AES-256 so unauthorized readers cannot decipher the word.</p>", "feedback": "<p>Incorrect. TEI tags structure and contextualize text; they do not apply cryptographic encryption.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It causes web browsers to automatically translate the word into modern standard French.</p>", "feedback": "<p>Incorrect. `<unclear>` marks visual illegibility, not language translation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents the XML file from being indexed by search engine crawlers.</p>", "feedback": "<p>Incorrect. Markup semantics inform search indexing rather than blocking it.</p>"}]}}, {"step": 18, "title": "Documenting Lacunae: When to Deploy gap", "content": "**Documenting Lacunae: When to Deploy gap**\n\nWhat happens when text is not merely faded, but physically non-existent? \n\n- A moth or bookworm ate a hole through the leaf.\n- A wax seal tore away the corner of the letter when opened.\n- Fire or water completely obliterated a three-word patch of script.\n\nWhen there are zero surviving ink traces, you cannot use `<unclear>` because there are no candidate letters to wrap. Guessing words out of thin air is hallucination.\n\nInstead, TEI provides the empty milestone element `<gap/>`. The `<gap/>` element records a physical **lacuna** without guessing the missing letters.\n\nScholarly standards require you to specify why the text is missing and approximately how much is lost:\n```xml\n<!-- Three characters lost to an ink blot -->\n<p><lb n=\"5\"/>paid to <gap reason=\"damage\" unit=\"chars\" extent=\"3\"/> on arrival</p>\n\n<!-- Approximately two whole words lost to a torn paper corner -->\n<p><lb n=\"6\"/>received from <gap reason=\"tear\" unit=\"words\" extent=\"2\"/> upon receipt</p>\n```\n\nNotice that `<gap/>` is self-closing (`<gap ... />`). It never wraps text because there is no text to wrap. In `transcription_reconciled.xml`, use `<gap/>` to mark physical absence honestly.\n\n**Vocabulary.** *Lacuna* — A physical gap or hole in the document surface where text has been completely destroyed.\n\n**Takeaway:** Use empty milestone gap elements with reason and extent attributes when text is physically obliterated by damage.\n\n---", "image_b64": null, "question": {"name": "18 Question: Documenting Lacunae: When to Deploy gap", "questiontext": "<p>Under what physical condition must an editor use &lt;gap/&gt; instead of &lt;unclear&gt;?</p>", "generalfeedback": "<p>Use empty milestone gap elements with reason and extent attributes when text is physically obliterated by damage.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>When physical damage has completely obliterated the text, leaving no surviving ink strokes to propose a candidate reading.</p>", "feedback": "<p>Correct. `<gap/>` records complete physical loss (lacunae), whereas `<unclear>` wraps doubtful but visible candidate letters.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the transcriber disagrees with the author's political opinions.</p>", "feedback": "<p>Incorrect. Personal opinions have no bearing on diplomatic markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the text is written in verse rather than prose.</p>", "feedback": "<p>Incorrect. Poetic verse is marked with `<lg>` and `<l>`, not `<gap/>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>When the XML file exceeds 50 kilobytes in total size.</p>", "feedback": "<p>Incorrect. File size does not dictate markup choices.</p>"}]}}, {"step": 19, "title": "Category D: Structural and Layout Discrepancies", "content": "**Category D: Structural and Layout Discrepancies**\n\nCategory D encompasses differences that are not about spelling or words, but about **XML structure and layout architecture**.\n\nCommon Category D discrepancies include:\n\n1. **Missing Container Tags:** Gemini may have placed text directly inside `<div>` without wrapping it in `<p>` (prose) or `<lg><l>` (verse). This causes immediate schema validation failure against `msdesc.rng`.\n2. **Displaced Page Milestones:** One pass placed `<pb facs=\"#...\"/>` before `<div>`, while the other placed it inside `<div>`. In standard TEI, `<pb/>` sits inside `<div>` right before the first line of the page.\n3. **Mismatched Line Breaks:** Gemini broke a line at word ten, while you broke it at word eleven.\n4. **Column Flow Conflicts:** In a multi-column document, one pass read horizontally across columns while the other read vertically down Column 1 and then Column 2.\n\nWhen resolving Category D discrepancies in `transcription_reconciled.xml`, your primary guide is the TEI structural grammar:\n\n- `<text>` $\\to$ contains `<body>` $\\to$ contains `<div>`\n- `<div>` $\\to$ contains `<p>` (prose) or `<lg>` (verse)\n- `<p>` $\\to$ contains running text interleaved with `<lb/>` milestones\n\nEnsure that your reconciled consensus document obeys this strict hierarchy from top to bottom.\n\n**Vocabulary.** *Layout discrepancy* — A divergence between two passes concerning lineation, column boundaries, or structural tag hierarchy.\n\n**Takeaway:** Resolve structural differences by enforcing valid TEI containment: text inside body inside div.\n\n---", "image_b64": null, "question": {"name": "19 Question: Category D: Structural and Layout Discrepancies", "questiontext": "<p>What is the correct TEI hierarchy for organizing prose transcription inside a document division?</p>", "generalfeedback": "<p>Resolve structural differences by enforcing valid TEI containment: text inside body inside div.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Running text and line break milestones must be contained within <p> elements inside the <div>.</p>", "feedback": "<p>Correct. In valid TEI schemas like `msdesc.rng`, character data in a `<div>` must be wrapped within `<p>` containers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Running text must be typed directly inside <div> without any paragraph or verse wrapper.</p>", "feedback": "<p>Incorrect. Bare text directly inside `<div>` violates schema grammar.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All lines must be placed inside the teiHeader under sourceDesc.</p>", "feedback": "<p>Incorrect. The teiHeader contains metadata, not document transcriptions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Line breaks must be placed inside facsimile surfaces alongside coordinate coordinates.</p>", "feedback": "<p>Incorrect. The `<facsimile>` section defines image coordinates; transcription markup belongs in `<text>`.</p>"}]}}, {"step": 20, "title": "Reconciling Physical Lineation: lb Milestones", "content": "**Reconciling Physical Lineation: lb Milestones**\n\nOne of the most frequent diff differences between Pass 1 and Pass 2 involves the placement of `<lb/>` milestones.\n\nIn diplomatic transcription, `<lb/>` (line beginning) is an empty milestone element. It does not wrap words; it simply marks the spatial point where a writer or typesetter dropped to a new physical line on the page.\n\nConsider this diff discrepancy:\n\n- Pass 1 (`witness.xml`):\n```xml\n<p><lb n=\"1\"/>To the Honorable Council of Safety\n<lb n=\"2\"/>Gentlemen</p>\n```\n\n- Pass 2 (`transcription_ai.xml`):\n```xml\n<p><lb n=\"1\"/>To the Honorable Council of Safety Gentlemen</p>\n```\n\nGemini omitted `<lb n=\"2\"/>` because in modern English grammar, \"Gentlemen\" is a salutation that might sit on the same line in a flowing email. But on the physical artifact, the writer dropped down to a new line!\n\nLook at the image. Did the author physically drop down? Yes. Therefore, Pass 1 is correct. \n\n**Formatting Best Practice:** In `transcription_reconciled.xml`, always place each `<lb/>` milestone on a new visual line in your editor:\n```xml\n<p>\n  <lb n=\"1\"/>To the Honorable Council of Safety\n  <lb n=\"2\"/>Gentlemen\n</p>\n```\nThis makes your XML mirror the visual lineation of the manuscript, making future proofreading effortless.\n\n**Vocabulary.** *Physical lineation* — The literal arrangement of words across lines on the page, independent of grammar or metre.\n\n**Takeaway:** Ensure lb milestones mark every physical line break on the artifact, aligning Pass 3 with the physical page coordinates.\n\n---", "image_b64": null, "question": {"name": "20 Question: Reconciling Physical Lineation: lb Milestones", "questiontext": "<p>Why must every physical line break on the manuscript artifact be marked with an empty &lt;lb/&gt; milestone?</p>", "generalfeedback": "<p>Ensure lb milestones mark every physical line break on the artifact, aligning Pass 3 with the physical page coordinates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It records the documentary lineation of the historical artifact, preserving the spatial layout for codicological study.</p>", "feedback": "<p>Correct. Diplomatic editions record physical lineation using `<lb/>` milestones to preserve the material structure of the witness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It tells the web browser to play an audible bell sound whenever the reader finishes a sentence.</p>", "feedback": "<p>Incorrect. Line breaks do not trigger audio effects in web browsers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the XML file to be printed on legal-sized paper rather than standard letter size.</p>", "feedback": "<p>Incorrect. Printing dimensions are governed by print styles, not TEI line milestones.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is required by the United States Library of Congress for copyright registration.</p>", "feedback": "<p>Incorrect. Line milestones are a scholarly encoding convention, not a legal copyright mandate.</p>"}]}}, {"step": 21, "title": "Reconciling Prose Paragraphs: p vs. Poetry lg and l", "content": "**Reconciling Prose Paragraphs: p vs. Poetry lg and l**\n\nDuring diff reconciliation, check how each pass handled high-level textual containers. TEI enforces a rigid distinction between prose and poetry:\n\n- **Prose Documents (Ace, Olyvia, Andromeda):** Legal decrees, personal correspondence, and colonial treaties are continuous prose. All running text must be wrapped inside paragraph containers: `<p>`. \n- **Poetry Manuscripts (Jay):** Metrical verse cannot be wrapped in `<p>`. It must be organized into stanzas using line groups (`<lg>`), and each poetic metrical line must be wrapped in a line element (`<l>`).\n\nIf Gemini transcribed a prose document using `<l>` tags for every physical line, or transcribed Emily Dickinson's poem as a flat prose `<p>` paragraph, it made a major structural error!\n\nIn `transcription_reconciled.xml`, correct the container markup:\n```xml\n<!-- PROSE EXAMPLE (Ace, Olyvia, Andromeda) -->\n<div>\n  <p>\n    <lb n=\"1\"/>We the undersigned commissioners...\n  </p>\n</div>\n\n<!-- POETRY EXAMPLE (Jay) -->\n<div>\n  <lg type=\"stanza\">\n    <l n=\"1\"><lb n=\"1\"/>I would not stop for Death –</l>\n    <l n=\"2\"><lb n=\"2\"/>He kindly stopped for me –</l>\n  </lg>\n</div>\n```\nEnforcing proper paragraph and verse wrappers ensures your text validates cleanly against `msdesc.rng`.\n\n**Vocabulary.** *Paragraph wrapper (p)* — The standard TEI container enclosing running prose sentences within a text division.\n\n**Takeaway:** Wrap prose running text inside p containers, reserving lg and l for poetic verse.\n\n---", "image_b64": null, "question": {"name": "21 Question: Reconciling Prose Paragraphs: p vs. Poetry lg and l", "questiontext": "<p>How should an editor structure an 18th-century personal prose letter inside a TEI <div> container?</p>", "generalfeedback": "<p>Wrap prose running text inside p containers, reserving lg and l for poetic verse.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Enclose the running prose sentences and interleaved <lb/> milestones within <p> paragraph elements.</p>", "feedback": "<p>Correct. Prose documents require `<p>` paragraph wrappers to enclose text and milestones within divisions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Wrap each individual word in a separate <lg> line group container.</p>", "feedback": "<p>Incorrect. `<lg>` is reserved for verse stanzas; wrapping individual words in line groups corrupts the hierarchy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Place all text directly inside the <teiHeader> without any <div> or <p> tags.</p>", "feedback": "<p>Incorrect. The header holds metadata; transcription text belongs inside `<div><p>` in the `<body>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete all paragraph breaks to create a continuous 10,000-character single-line string.</p>", "feedback": "<p>Incorrect. Removing paragraph divisions destroys the prose structure of the document.</p>"}]}}, {"step": 22, "title": "Cohort Adjudication: Jay and Dickinson's Variant Readings", "content": "**Cohort Adjudication: Jay and Dickinson's Variant Readings**\n\nNow let us review the specific adjudication targets for each member of our four-person cohort.\n\nFor **Jay**, working with Emily Dickinson's poem manuscript (`MS Am 1118.3 [338]`):\n\n1. **Idiosyncratic Dashes:** Dickinson wrote dashes of varying lengths, slants, and heights. Inspect the diff between Pass 1 and Pass 2:\n   - Did you transcribe spaced hyphens (` - `) while Gemini output em-dashes (`—`)?\n   - Adjudicate according to your editorial policy. In diplomatic transcription, recording an en-dash (`–`) or spaced dash is standard. Ensure consistency throughout `transcription_reconciled.xml`.\n2. **Narrow Paper Line Wraps:** Dickinson's paper was narrow (~100 mm wide). Line 3 of a stanza might wrap onto a second physical line on the page. In `transcription_reconciled.xml`, verify that the metrical line is wrapped in `<l>`, with an empty `<lb/>` milestone marking the physical wrap:\n   ```xml\n   <l n=\"3\"><lb n=\"3\"/>The Carriage held but just Ourselves –\n   <lb n=\"4\"/>and Immortality.</l>\n   ```\n\n3. **Pencil Revisions:** Dickinson frequently wrote variant word choices in pencil above the pen-and-ink lines. Did Gemini skip the pencil variants or fuse them into the sentence? In Pass 3, decide whether to record the interlinear pencil reading or note it with `<unclear>`.\n\nDocument your adjudication of Dickinson's dashes and wraps in your reflection report!\n\n**Vocabulary.** *Interlinear variant* — Alternative words or phrases written between lines or in margins by the author during revision.\n\n**Takeaway:** For Jay's Dickinson poem, ensure stanza structures (lg/l) and line-wrap milestones (lb) correctly reflect the narrow manuscript sheet.\n\n---", "image_b64": null, "question": {"name": "22 Question: Cohort Adjudication: Jay and Dickinson's Variant Readings", "questiontext": "<p>When reconciling Emily Dickinson's poetry manuscripts, how should Jay encode a metrical line that physically wraps across two lines on narrow paper?</p>", "generalfeedback": "<p>For Jay's Dickinson poem, ensure stanza structures (lg/l) and line-wrap milestones (lb) correctly reflect the narrow manuscript sheet.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Wrap the complete metrical verse in a single <l> element, inserting an <lb/> milestone where the physical wrap occurs.</p>", "feedback": "<p>Correct. Metrical lines are enclosed in `<l>`, while physical paper wrapping is documented with internal `<lb/>` milestones.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Split the poem into two separate <div> containers to represent each physical half-line.</p>", "feedback": "<p>Incorrect. Divisions represent major sections; splitting a verse line into separate divisions destroys poetic structure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete the wrapped second line to ensure the poem fits neatly onto modern smartphone displays.</p>", "feedback": "<p>Incorrect. Diplomatic transcription preserves all manuscript text regardless of screen display dimensions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the wrapped words with a <gap/> element to hide the narrow paper margins.</p>", "feedback": "<p>Incorrect. `<gap/>` is reserved for physical damage or loss, not line wrapping.</p>"}]}}, {"step": 23, "title": "Cohort Adjudication: Ace and Two-Column Decrees", "content": "**Cohort Adjudication: Ace and Two-Column Decrees**\n\nFor **Ace**, working with the 1791 French Revolutionary National Assembly Decree:\n\n1. **Sequential Column Flow:** The decree is printed in two parallel vertical columns separated by a central rule. A major AI failure mode in multi-column broadsides is reading horizontally across both columns (e.g. reading line 1 of Column 1, followed immediately by line 1 of Column 2).\n   - In your diff, check whether Gemini read horizontally or vertically.\n   - In `transcription_reconciled.xml`, enforce the correct reading order: transcribe completely down Column 1, then proceed down Column 2. You can use `<cb n=\"1\"/>` and `<cb n=\"2\"/>` (column break milestones) to mark column transitions.\n2. **Historical Long-s (`ſ`):** Inspect every instance where Gemini replaced `ſ` with modern `s`. In `transcription_reconciled.xml`, restore the authentic 18th-century long-s glyph (`ſ`) to preserve the physical testimony of the Paris revolutionary press.\n3. **Colophons and Attestations:** At the bottom of the decree, verify that official printing attestations, commissioner signatures, and legal dates are properly grouped in `<p>` blocks with `<lb/>` milestones.\n\nAce's reflection report should highlight whether Gemini respected columnar layout or required manual structural intervention.\n\n**Vocabulary.** *Columnar reading order* — The vertical sequential flow of text down one printed column before starting the adjacent column.\n\n**Takeaway:** For Ace's French Decree, verify that the reconciled text flows down Column 1 before Column 2, preserving historical typography.\n\n---", "image_b64": null, "question": {"name": "23 Question: Cohort Adjudication: Ace and Two-Column Decrees", "questiontext": "<p>What is the primary layout challenge when reconciling Gemini's transcription of Ace's two-column French Revolutionary Decree?</p>", "generalfeedback": "<p>For Ace's French Decree, verify that the reconciled text flows down Column 1 before Column 2, preserving historical typography.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Ensuring the text flows sequentially down Column 1 and then Column 2, rather than reading horizontally across the columns.</p>", "feedback": "<p>Correct. Vision models frequently read horizontally across multi-column layouts; editors must enforce sequential vertical column order.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Converting all French legal terminology into Latin church hymns.</p>", "feedback": "<p>Incorrect. The decree is a secular civil legal document, not church liturgical music.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Changing the printing date from 1791 to 2026 to make the document appear contemporary.</p>", "feedback": "<p>Incorrect. Diplomatic editing preserves historical chronology; falsifying dates is malpractice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Removing all capital letters to conform to minimalist lowercase design trends.</p>", "feedback": "<p>Incorrect. Capitalization is historical evidence that must be preserved as printed.</p>"}]}}, {"step": 24, "title": "Cohort Adjudication: Olyvia and Maud Lewis's Folk Orthography", "content": "**Cohort Adjudication: Olyvia and Maud Lewis's Folk Orthography**\n\nFor **Olyvia**, working with the handwritten personal letter by Nova Scotia folk artist Maud Lewis (1903–1970):\n\n1. **Defending Vernacular Orthography:** Maud Lewis wrote with lively, informal, and phonetic spelling typical of rural mid-20th-century Nova Scotia. In your diff, look for instances where Gemini \"corrected\" Maud's spelling or grammar:\n   - Did Maud write *bin* and Gemini changed it to *been*?\n   - Did Maud write *dont* without an apostrophe and Gemini inserted the apostrophe?\n   - In `transcription_reconciled.xml`, **reject every one of Gemini's corrections!** Maud's letter is a precious cultural artifact. Correcting her spelling is an act of patronizing editorial erasure. Defend Maud's authentic voice.\n2. **Drifting Baselines and Faded Creases:** Because of severe arthritis in her hands, Maud's lines drift across the page. Where the paper was folded into an envelope, ink may be faded along the crease.\n   - If both you and Gemini struggled with a crease, evaluate whether the reading is probable enough for `<unclear>` or if it should be marked with `<gap reason=\"faded\"/>`.\n   - Ensure `<lb/>` milestones capture where Maud started new lines as her script drifted.\n\nOlyvia's reflection report will center on protecting folk-art historical expression from the homogenizing tendencies of large language models.\n\n**Vocabulary.** *Folk orthography* — Informal, phonetic, and non-standard writing produced outside institutional schooling.\n\n**Takeaway:** For Olyvia's Maud Lewis letter, vigorously defend Maud's authentic folk spelling against modern machine smoothing.\n\n---", "image_b64": null, "question": {"name": "24 Question: Cohort Adjudication: Olyvia and Maud Lewis's Folk Orthography", "questiontext": "<p>When reconciling Maud Lewis's handwritten letter, why must Olyvia reject Gemini's spelling corrections?</p>", "generalfeedback": "<p>For Olyvia's Maud Lewis letter, vigorously defend Maud's authentic folk spelling against modern machine smoothing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Maud's informal vernacular orthography is authentic cultural evidence that must be preserved rather than erased by modern machine norms.</p>", "feedback": "<p>Correct. Editorial integrity requires defending authentic folk spelling against artificial modernization and homogenization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Canadian copyright law makes it illegal to correct spelling in handwritten letters.</p>", "feedback": "<p>Incorrect. The imperative is scholarly and ethical, not a statutory copyright restriction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Moodle quiz algorithms give zero points if an apostrophe is detected in an XML tag.</p>", "feedback": "<p>Incorrect. Moodle processes apostrophes normally; the issue is historical accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Maud Lewis requested in her will that no computer ever read her personal mail.</p>", "feedback": "<p>Incorrect. The editorial decision is guided by digital humanities standards, not fictional testamentary clauses.</p>"}]}}, {"step": 25, "title": "Cohort Adjudication: Andromeda and Bilingual Treaty Margins", "content": "**Cohort Adjudication: Andromeda and Bilingual Treaty Margins**\n\nFor **Andromeda**, working with the 1752 Peace and Friendship Treaty between Governor Peregrine Thomas Hopson and Chief Major Jean-Baptiste Cope:\n\n1. **Legal Article Structure:** The treaty is organized into a formal preamble followed by numbered articles. In `transcription_reconciled.xml`, verify that each article is properly enclosed in a `<p>` container with line breaks (`<lb/>`):\n   ```xml\n   <p>\n     <lb n=\"15\"/>1. It is agreed that the said Tribe of Mickmack Indians...\n   </p>\n   ```\n\n2. **Capitalization and Honorifics:** 18th-century treaties feature heavy, idiosyncratic capitalization of legal nouns (*Tribe*, *Treaty*, *His Majesty*, *Peace*, *Friendship*). Check your diff: did Gemini lower-case any of these capitalized terms? Preserve the full 18th-century capitalization as written.\n3. **Totem Marks and Signatures:** At the foot of the document, Chief Cope signed not with alphabetic English script, but with his personal totem mark. Check how Pass 1 and Pass 2 handled this mark:\n   - If Gemini ignored the mark or output a random punctuation symbol, replace it in `transcription_reconciled.xml` with appropriate descriptive markup:\n     `<figure><figDesc>Totem mark of Chief Major Jean-Baptiste Cope</figDesc></figure>`\n\n   - Link the mark to its physical coordinates if calibrated in Module 3.\n\nAndromeda's reflection will document the technical challenge of encoding non-alphabetic indigenous legal signatures within an XML transcription.\n\n**Vocabulary.** *Diplomatic treaty layout* — Formal layout conventions separating preamble, numbered articles, signatures, and tribal totem marks.\n\n**Takeaway:** For Andromeda's 1752 Treaty, ensure legal article headings, signatures, and Cope's totem mark are cleanly structured.\n\n---", "image_b64": null, "question": {"name": "25 Question: Cohort Adjudic
