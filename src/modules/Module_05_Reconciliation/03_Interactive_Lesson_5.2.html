ation: Andromeda and Bilingual Treaty Margins", "questiontext": "<p>How should non-alphabetic indigenous marks, such as Chief Cope's totem on the 1752 Treaty, be represented in diplomatic TEI?</p>", "generalfeedback": "<p>For Andromeda's 1752 Treaty, ensure legal article headings, signatures, and Cope's totem mark are cleanly structured.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Use a descriptive element like <figure><figDesc>Totem mark...</figDesc></figure> rather than ignoring it or guessing a keyboard character.</p>", "feedback": "<p>Correct. Totem marks and non-alphabetic signatures are codicological figures, best documented with `<figure>` and `<figDesc>`.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Replace the mark with an emoji icon of a feather or bird.</p>", "feedback": "<p>Incorrect. Project rules and scholarly standards strictly forbid emojis in academic TEI editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Omit the mark entirely because TEI XML is only capable of recording alphabetic letters.</p>", "feedback": "<p>Incorrect. TEI provides robust elements like `<figure>` specifically to record non-textual graphic elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Type the word 'SIGNATURE' in capital letters and delete the British governor's signature.</p>", "feedback": "<p>Incorrect. Diplomatic editing preserves all textual and graphical testimony faithfully.</p>"}]}}, {"step": 26, "title": "Schema Validation: Driving transcription_reconciled.xml to Zero Errors", "content": "**Schema Validation: Driving transcription_reconciled.xml to Zero Errors**\n\nWith your line-by-line adjudication complete and `transcription_reconciled.xml` fully drafted, you must subject the file to strict automated quality control.\n\nIn the VS Code Terminal, run the schema validation command against the course grammar:\n```bash\npython3 -m jing msdesc.rng transcription_reconciled.xml\n```\n(Or use the XML extension's built-in validation indicator in the bottom status bar).\n\nYour target is absolute: **0 errors**.\n\nCommon validation diagnostics and fixes:\n\n1. **Error: `element \"text\" not allowed here`:** You placed text directly inside `<div>`. Wrap the sentences in `<p>...</p>` (or `<lg><l>...</l></lg>` for poetry).\n2. **Error: `character \"&\" is the first character of a delimiter but must not start a general entity`:** You transcribed a literal ampersand (`&c.`). Escape every raw ampersand as `&amp;c.`.\n3. **Error: `element \"lb\" not allowed here`:** You used a closing tag like `</lb>`. Change it to an empty milestone: `<lb/>`.\n4. **Error: `required attribute \"facs\" missing`:** Your `<pb/>` tag is missing its surface pointer. Add `@facs=\"#your_surface_id\"`.\n\nKeep fixing and re-validating until the validator outputs zero warnings and zero errors. A file that fails schema validation cannot be accepted into the digital edition.\n\n**Vocabulary.** *Deterministic validation* — Automated verification confirming that an XML document strictly obeys every rule of a schema grammar.\n\n**Takeaway:** Validate transcription_reconciled.xml against msdesc.rng, resolving every syntax and hierarchy error to reach 0 errors.\n\n---", "image_b64": null, "question": {"name": "26 Question: Schema Validation: Driving transcription_reconciled.xml to Zero Errors", "questiontext": "<p>What is the mandatory validation benchmark that transcription_reconciled.xml must meet before assignment submission?</p>", "generalfeedback": "<p>Validate transcription_reconciled.xml against msdesc.rng, resolving every syntax and hierarchy error to reach 0 errors.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It must validate with zero errors and zero warnings against the msdesc.rng schema grammar.</p>", "feedback": "<p>Correct. Every digital edition file must achieve zero schema errors to ensure structural validity and interoperability.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It must contain at least 15 unresolved errors to demonstrate that the editor was working hard.</p>", "feedback": "<p>Incorrect. Errors indicate broken XML syntax or invalid structure; zero errors is the required standard.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It only needs to validate if the student intends to pursue graduate studies in computer science.</p>", "feedback": "<p>Incorrect. Schema validation is a mandatory quality gate for all students in the course.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It must be converted into an unformatted Microsoft Word document before validation.</p>", "feedback": "<p>Incorrect. Schema validation is performed natively on the TEI XML file using Jing or the XML language server.</p>"}]}}, {"step": 27, "title": "Writing the Reconciliation Reflection (RECONCILIATION.md)", "content": "**Writing the Reconciliation Reflection (RECONCILIATION.md)**\n\nThe final deliverable of Week 5 is not code; it is scholarly writing. In your repository root, create a markdown document named `RECONCILIATION.md`.\n\nYour reflection report must be **300 to 500 words** and organized into three structured sections:\n\n**1. Quantitative Overview:**\n\n- How many total diff chunks separated your manual pass from your AI pass?\n- What was the rough distribution across the four categories (e.g. \"We identified 4 Category A human slips, 11 Category B machine smoothings, 2 Category C ink ambiguities, and 3 Category D lineation differences\")?\n\n**2. Qualitative Adjudication Analysis:**\n\n- Provide at least one specific concrete example of a **Category A** slip where Gemini caught an error you made due to fatigue. What was the word? Why did you miss it?\n- Provide at least one specific concrete example of a **Category B** failure where Gemini hallucinated or modernized spelling. How did you defend the manuscript ink?\n- Discuss any **Category C** physical ambiguities. Did you choose `<unclear>` or `<gap/>`, and why?\n\n**3. Tool Evaluation:**\n\n- Based on your empirical results, what are the strengths and dangers of using multimodal AI in digital paleography?\n\nWrite with academic precision. This report proves to evaluators that your final consensus text is the product of deliberate scholarly methodology.\n\n**Vocabulary.** *Methodological reflection* — A written scholarly explanation documenting editorial decisions, error patterns, and tool evaluation.\n\n**Takeaway:** Compose a 300–500 word report in RECONCILIATION.md detailing what Gemini caught, where it failed, and how you adjudicated.\n\n---", "image_b64": null, "question": {"name": "27 Question: Writing the Reconciliation Reflection (RECONCILIATION.md)", "questiontext": "<p>What are the three required sections of the RECONCILIATION.md reflection report?</p>", "generalfeedback": "<p>Compose a 300–500 word report in RECONCILIATION.md detailing what Gemini caught, where it failed, and how you adjudicated.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Quantitative Overview, Qualitative Adjudication Analysis, and Tool Evaluation.</p>", "feedback": "<p>Correct. The reflection requires quantitative metrics of the diff, concrete qualitative case examples across the error categories, and tool evaluation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Plot Summary, Character Development, and Movie Review.</p>", "feedback": "<p>Incorrect. The assignment is a scholarly editing reflection, not a film or fiction critique.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Billing Invoice, Bank Account Details, and Software License Agreement.</p>", "feedback": "<p>Incorrect. Course assignments require academic reflections, not commercial financial documents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Weekly Diary, Meal Schedule, and Fitness Log.</p>", "feedback": "<p>Incorrect. Reflections must focus strictly on textual paleography and editorial adjudication.</p>"}]}}, {"step": 28, "title": "Documenting Provenance: The Value of Negative Findings", "content": "**Documenting Provenance: The Value of Negative Findings**\n\nA common anxiety among student researchers is the fear of failure. When novice editors see that Gemini modernized dozens of words or hallucinated text over an ink smudge, they sometimes worry that they 'prompted the model incorrectly' or that their lab experiment failed.\n\nIn the digital humanities, **negative findings are primary scholarly data**.\n\nWhen you document that Gemini 1.5 Pro or Gemini 2.0 consistently converted the 18th-century long-s (`ſ`) into a modern `s`, or that it modernized Maud Lewis's vernacular spelling despite three explicit prompt instructions forbidding modernization, you have discovered an empirical truth about the architecture of large language models!\n\nYou are proving that autoregressive foundation models have an innate bias toward contemporary standardization. That discovery is a valuable research finding. When published in your reflection, it alerts future historians, archivists, and editors to the specific vulnerabilities of AI transcription pipelines.\n\nDo not conceal machine failures. Document them rigorously with line numbers, diff quotes, and comparative analysis in `RECONCILIATION.md`. Scholarly honesty is the hallmark of genuine research.\n\n**Vocabulary.** *Negative finding* — An experimental result showing where a computational tool or model failed to perform accurately.\n\n**Takeaway:** Documenting where AI failed (such as silent modernizations) is valuable scholarly research, not an embarrassing mistake.\n\n---", "image_b64": null, "question": {"name": "28 Question: Documenting Provenance: The Value of Negative Findings", "questiontext": "<p>Why are negative findings—such as documenting where an AI model repeatedly failed to follow prompt constraints—valuable in digital humanities research?</p>", "generalfeedback": "<p>Documenting where AI failed (such as silent modernizations) is valuable scholarly research, not an embarrassing mistake.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They provide empirical evidence of algorithmic biases and failure modes, warning future scholars where automated tools cannot be trusted.</p>", "feedback": "<p>Correct. Documenting computational limitations and model failures produces vital methodological knowledge for the research community.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They allow university administrators to demand financial refunds from software vendors.</p>", "feedback": "<p>Incorrect. Academic research is concerned with methodological truth, not vendor litigation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They automatically lower the student's final course grade to punish the computer's mistakes.</p>", "feedback": "<p>Incorrect. Students are graded on the rigour of their adjudication and critical analysis, not the model's accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They force the Git repository to revert to its initial empty commit state.</p>", "feedback": "<p>Incorrect. Research discoveries are committed and preserved in Git, never reverted.</p>"}]}}, {"step": 29, "title": "The Transcription Assignment Submission Checklist", "content": "**The Transcription Assignment Submission Checklist**\n\nTonight at **11:00 PM (Friday, Oct 2)**, the formal **Transcription Assignment** is due. \n\nBefore you conclude your work session, review the final submission checklist to guarantee full marks:\n\n1. **`witness.xml` (Pass 1):** Your manual diplomatic transcription from Week 4. Untouched today. Valid TEI.\n2. **`transcription_ai.xml` (Pass 2):** Gemini's Antigravity AI transcription from Tuesday. Untouched today. Valid TEI.\n3. **`transcription_reconciled.xml` (Pass 3):** Your newly synthesized consensus transcription. Fully adjudicated. Validates to **0 errors** against `msdesc.rng`.\n4. **`RECONCILIATION.md`:** Your 300–500 word reflection report detailing quantitative diff metrics, concrete category examples, and AI tool evaluation.\n\n**Git Submission Command:**\nIn your VS Code terminal, stage and commit the entire deliverable bundle:\n```bash\ngit add witness.xml transcription_ai.xml transcription_reconciled.xml RECONCILIATION.md\ngit commit -m \"Step 3: completed transcription reconciliation and reflection report\"\n```\n\nVerify your commit using `git status` (should report 'working tree clean') and `git log -n 1 --stat`. You have completed the hardest technical milestone of the term!\n\n**Vocabulary.** *Deliverable bundle* — The complete package of required files committed to version control and submitted for evaluation.\n\n**Takeaway:** Verify that your repository contains all four required files: witness.xml, transcription_ai.xml, transcription_reconciled.xml, and RECONCILIATION.md.\n\n---", "image_b64": null, "question": {"name": "29 Question: The Transcription Assignment Submission Checklist", "questiontext": "<p>What four specific files comprise the complete deliverable bundle for the Transcription Assignment due tonight?</p>", "generalfeedback": "<p>Verify that your repository contains all four required files: witness.xml, transcription_ai.xml, transcription_reconciled.xml, and RECONCILIATION.md.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>witness.xml, transcription_ai.xml, transcription_reconciled.xml, and RECONCILIATION.md.</p>", "feedback": "<p>Correct. The bundle requires Pass 1 (manual), Pass 2 (AI), Pass 3 (reconciled consensus), and the reflection report.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>index.html, styles.css, script.js, and package.json.</p>", "feedback": "<p>Incorrect. Those are commercial web development files, not TEI digital edition deliverables.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>slides.pptx, audio.mp3, video.mp4, and photo.jpg.</p>", "feedback": "<p>Incorrect. The assignment requires XML transcription files and a markdown reflection report.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>final_paper.docx, syllabus.pdf, gradebook.xlsx, and backup.zip.</p>", "feedback": "<p>Incorrect. The course uses plain text TEI XML and Git version control for assignments.</p>"}]}}, {"step": 30, "title": "Looking Ahead: The Bridge to Week 6 Normalization", "content": "**Looking Ahead: The Bridge to Week 6 Normalization**\n\nCongratulations! By completing `transcription_reconciled.xml`, you have established an authoritative, verified diplomatic baseline for your historical document.\n\nTake a moment to appreciate where you stand. You began with a raw high-resolution photograph. You calibrated its physical boundaries in Module 3. You transcribed its text by hand, tested an advanced AI model, and rigorously adjudicated every discrepancy. You have transformed ink on paper into clean, standardized, machine-readable digital data.\n\n**What Happens Next Week (Week 6: Normalization)?**\nIn Meeting #14 on Tuesday, we finally unlock the editorial elements we deliberately kept locked all week:\n\n- `<choice>`: The parent element linking original testimony to editorial intervention.\n- `<orig>` and `<reg>`: Linking original historical spelling (e.g. `publick`) to modern standardized spelling (`public`).\n- `<abbr>` and `<expan>`: Linking historical scribal abbreviations (`&c.`, `Govr`) to their full expansions (`et cetera`, `Governor`).\n\nBecause your diplomatic baseline in `transcription_reconciled.xml` is uncorrupted by silent modernizations, you will be able to apply these normalization elements with total scholarly confidence. Rest well this weekend; on Tuesday, we begin editorial normalization!\n\n**Vocabulary.** *Editorial normalization* — The stage where historical orthography is linked to modern standardized forms via choice elements.\n\n**Takeaway:** Your reconciled diplomatic baseline provides the uncorrupted foundation for next week's editorial normalization.\n\n---", "image_b64": null, "question": {"name": "30 Question: Looking Ahead: The Bridge to Week 6 Normalization", "questiontext": "<p>How does completing transcription_reconciled.xml prepare students for Week 6 (Normalization)?</p>", "generalfeedback": "<p>Your reconciled diplomatic baseline provides the uncorrupted foundation for next week's editorial normalization.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It establishes an uncorrupted diplomatic baseline, providing the verified physical text onto which editorial <choice>, <reg>, and <expan> tags will be applied.</p>", "feedback": "<p>Correct. A rigorous diplomatic baseline is the prerequisite for editorial normalization; without it, editors confuse historical evidence with modern conjectures.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows students to discard the manuscript and invent a fictional narrative.</p>", "feedback": "<p>Incorrect. Digital editing preserves primary evidence, never inventing fiction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It eliminates the need for any further class meetings or coursework this semester.</p>", "feedback": "<p>Incorrect. Reconciliation is Step 3; normalization, critical apparatus, and web publication follow in subsequent weeks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts the repository into a blockchain cryptocurrency wallet.</p>", "feedback": "<p>Incorrect. The course teaches digital humanities and scholarly editing, not cryptocurrency.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
