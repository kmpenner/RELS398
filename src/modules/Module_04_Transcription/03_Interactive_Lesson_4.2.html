es.\n- Time spent recorded.\n\nIf your score is worse than 15%, do not start correcting. The output is not worth the effort. Diagnose instead, in the order from section 14: line-finding, then alignment, then how much training material, then the starting model.\n\n**Vocabulary.** *Spot-check* — verifying a few samples rather than everything. *Diagnose* — work out the cause before attempting a fix.\n\n**Takeaway:** If validation CER exceeds 15%, diagnose rather than correct — check layout, then alignment, then data volume, then base model.\n\n---", "image_b64": null, "question": {"name": "25 Question: Checklist Before You Leave", "questiontext": "<p>In what order should you diagnose a model that scored worse than 15%?</p>", "generalfeedback": "<p>If validation CER exceeds 15%, diagnose rather than correct — check layout, then alignment, then data volume, then base model.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Line-finding, then alignment, then how much training material, then the starting model.</p>", "feedback": "<p>Correct. Most first models are fixable, and the order runs from the most likely cause to the least.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Starting model, then training passes, then image resolution, then alignment.</p>", "feedback": "<p>Incorrect. The starting model is checked last, not first — line-finding faults are far more common.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Retrain immediately with more passes before investigating anything.</p>", "feedback": "<p>Incorrect. More passes will not fix bad strips or mismatched text, and it spends shared credits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Correct the output first, then retrain on the corrections.</p>", "feedback": "<p>Incorrect. Above 15% the output is not worth correcting — that is the whole point of the threshold.</p>"}]}}, {"step": 26, "title": "Things That Go Wrong Today", "content": "**Things That Go Wrong Today**\n\nThe failures that keep happening, and what they mean.\n\n| Symptom | Likely cause | What to check |\n| --- | --- | --- |\n| Import fails | Address not reachable publicly | `curl` from outside your network |\n| Some lines not found | Faint ink; settings | Look, then fix by hand |\n| No accents at all in the output | Strips cutting them off | Look at the extracted strips |\n| Fluent nonsense | Text attached one line out | Spot-check picture against words |\n| Score far worse than expected | Starting model wrong for the script | Confirm script and date |\n| Good on one leaf, bad on another | Different layouts | Test each layout separately |\n| Training improves, held-back lines worsen | Memorizing | Stop at the low point |\n| Words glued together | Words run together on the page | Expected; note it for Week 5 |\n| Short forms spelled out | Starting model learned tidy text | Pick a diplomatic starting model |\n\nRows three and four are today's signature failures, and both are invisible in the output itself. Missing accents look like the program being weak at Greek rather than a strip problem. Text attached one line out reads perfectly and simply belongs somewhere else.\n\nThe remedy for both is the same, and it is worth keeping as a general rule: when output is wrong in a way you cannot explain, go and look at what the program actually saw. The extracted strip is the truth about the input, and nearly every baffling failure is visible there.\n\n**Vocabulary.** *Symptom* — what you observe going wrong. *Cause* — the underlying fault, often several steps earlier.\n\n**Takeaway:** When output is inexplicably wrong, look at the extracted line image — that is what the model actually saw.\n\n---", "image_b64": null, "question": {"name": "26 Question: Things That Go Wrong Today", "questiontext": "<p>The output is fluent and reads coherently, but it does not match the page. What is the likely cause?</p>", "generalfeedback": "<p>When output is inexplicably wrong, look at the extracted line image — that is what the model actually saw.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Your transcription was attached one line out, so the model learned each line's picture with the next line's words.</p>", "feedback": "<p>Correct. The text is internally coherent and simply belongs somewhere else — spot-check picture against words to confirm.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The strips were cut too tightly, removing the accents.</p>", "feedback": "<p>Incorrect. That produces text missing its accents, not coherent text belonging elsewhere.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The base model was trained on tidied text and is spelling short forms out.</p>", "feedback": "<p>Incorrect. That shows as expanded abbreviations, not as wholesale displacement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model overfitted and is reproducing memorized training lines.</p>", "feedback": "<p>Incorrect. Memorized lines would match the page they came from. Here the pairing itself is wrong.</p>"}]}}, {"step": 27, "title": "Writing Down What You Did", "content": "**Writing Down What You Did**\n\nYour Week 5 report needs an account of today's work. Writing it now is far easier than reconstructing it later.\n\nRecord in `logs/htr-method-w4.md`:\n\n- Which platform, and which version.\n- Which model you started from, what it was trained on, how it performs.\n- Your own material: which leaves, how many lines, how produced.\n- What line-fixing was needed, and of what kind.\n- Whether you changed the line-finding settings, and to what.\n- How you trained: how many lines held back, how many passes, when you stopped.\n- The score, and what it was measured on.\n- Which leaves you then ran the model over.\n- The kinds of mistake you saw, with counts.\n- Time spent at each stage.\n\nThis is a methods section. Its job is to let a reader — or you in December — see what was done and judge whether the results mean what they seem to. A score of 6.2% means nothing without knowing the starting model, how much material, and what was in the held-back set.\n\nIt also protects you. If your Week 5 results are surprising, this record is what lets you work out why. Without it, a strange number is simply strange, and your only option is doing the work again.\n\nCommit it with a `docs:` prefix.\n\n**Vocabulary.** *Methods section* — the part of a report saying exactly what was done. *Provenance* — the documented history of how something was made.\n\n**Takeaway:** A CER figure is uninterpretable without its base model, training volume, and validation set — record the methodology today.\n\n---", "image_b64": null, "question": {"name": "27 Question: Writing Down What You Did", "questiontext": "<p>Why is a score of 6.2% meaningless on its own?</p>", "generalfeedback": "<p>A CER figure is uninterpretable without its base model, training volume, and validation set — record the methodology today.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Without the starting model, the amount of training material, and what was in the held-back set, nobody can tell what it measures.</p>", "feedback": "<p>Correct. Record it now — if Week 5's results surprise you, this is what lets you work out why.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because scores must always be reported alongside a word-level figure as well.</p>", "feedback": "<p>Incorrect. A word-level figure helps, but it is not what makes the character figure interpretable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because 6.2% is within the margin of error for any small test set.</p>", "feedback": "<p>Incorrect. Nothing in the lesson suggests that. The problem is missing context, not statistical noise.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because scores are only comparable between students using the same manuscript.</p>", "feedback": "<p>Incorrect. They are not comparable between manuscripts, but that is not why the methodology is recorded.</p>"}]}}, {"step": 28, "title": "Preparing for Friday", "content": "**Preparing for Friday**\n\nFriday is remote, and it puts the same passage through a general AI model.\n\nHave all of this available from wherever you will be:\n\n- Your repository, pushed.\n- Yesterday's transcription, tagged.\n- Today's raw output, tagged.\n- Today's sorted mistakes and methods notes.\n- Your images, reachable from outside your network.\n- A working Greek keyboard on the machine you will use.\n- Access to an AI model that accepts pictures.\n\nFriday's comparison is three-way: your typing, today's specialist model, and Friday's general model, all on the same lines. Having all three saved under tags is what makes that comparison exact rather than roughly right.\n\nSet your expectation now, so the result is a measurement rather than a shock. Going by the published figures in section 23, Friday's output will probably be much worse than today's on historical Greek. It will also arrive in minutes instead of a whole session. Week 5 needs you to hold both of those facts at once.\n\nCheck your setup today, following Lesson 4.1 section 23. Every item takes two minutes now and none of them takes two minutes on Friday morning.\n\n**Vocabulary.** *Three-way comparison* — measuring three versions of the same passage against each other. *Tag* — a permanent name on one saved version.\n\n**Takeaway:** Tag all three states so Friday's three-way comparison is exact, and expect the general model to be much worse and much faster.\n\n---", "image_b64": null, "question": {"name": "28 Question: Preparing for Friday", "questiontext": "<p>Why must all three versions be saved under tags before Friday?</p>", "generalfeedback": "<p>Tag all three states so Friday's three-way comparison is exact, and expect the general model to be much worse and much faster.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Friday compares your typing, today's model, and the general AI on the same lines, and tags make that comparison exact rather than approximate.</p>", "feedback": "<p>Correct. A tag is a permanent name for one particular version, retrievable from anywhere.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because tagged versions are the only ones that can be pushed from off campus.</p>", "feedback": "<p>Incorrect. Any commit can be pushed. Tags do need pushing explicitly, which is a separate trap.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the AI model reads the tags to know which version to compare against.</p>", "feedback": "<p>Incorrect. It reads a picture. The tags are for you and for Week 5.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because untagged work is not eligible for the Transcription Assignment.</p>", "feedback": "<p>Incorrect. The requirement is methodological — exact retrieval of the state that was measured.</p>"}]}}, {"step": 29, "title": "What Good Work Looks Like Here", "content": "**What Good Work Looks Like Here**\n\n\"Trained a model\" and \"trained a model well\" are different achievements.\n\nAn acceptable result is a trained model with a recorded score and output you have looked at.\n\nGood work also:\n\n- Fixes the line-finding thoroughly, including the strips around accents.\n- Checks that text is attached to the right lines instead of assuming it.\n- Chooses a starting model deliberately and says why.\n- Holds back a representative set of lines, not a convenient one.\n- Sorts mistakes into kinds rather than just counting them.\n- Tells line-finding failures apart from reading failures.\n- Records cost — time and effort — alongside quality.\n- Commits raw output separately from corrections, fully labelled.\n- Says what the model does badly, and offers a reason.\n\nThat last one is what makes this scholarship rather than button-pushing. \"6% wrong, and it drops breathings on one particular letter, fails on this scribe's short form for *kai*, and falls apart on the glossed leaf\" is far more useful than \"6% wrong\" — because it tells you what to fix, what to check by hand, and what to say about whether this method suits this manuscript.\n\n**Vocabulary.** *Qualitative* — concerning the kind of thing, not the amount. *Hypothesis* — a proposed explanation you can go on to test.\n\n**Takeaway:** Reporting *what* the model gets wrong and why is the scholarly contribution; the CER number alone is tool operation.\n\n---", "image_b64": null, "question": {"name": "29 Question: What Good Work Looks Like Here", "questiontext": "<p>What turns today's work from button-pushing into scholarship?</p>", "generalfeedback": "<p>Reporting *what* the model gets wrong and why is the scholarly contribution; the CER number alone is tool operation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Saying what the model gets wrong and why — which letterform, which short form, which kind of page.</p>", "feedback": "<p>Correct. That tells you what to fix, what to check by hand, and whether the method suits this manuscript. A bare score does none of it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Reaching a score below 5%, which is the threshold for a publishable model.</p>", "feedback": "<p>Incorrect. There is no such threshold, and a low score can conceal serious damage.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Training several models and reporting the best score achieved.</p>", "feedback": "<p>Incorrect. Reporting only the best run hides more than it shows.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Using the largest available base model, to rule out undertraining.</p>", "feedback": "<p>Incorrect. Larger is not better here — matched is better.</p>"}]}}, {"step": 30, "title": "Synthesis: An Instrument with Edges", "content": "**Synthesis: An Instrument with Edges**\n\nWhat today established about the machine step.\n\nA specialized reading model is an instrument with **edges**. It reads ink and produces letters, and it is competent exactly as far as its examples went. Inside that boundary, on handwriting it has seen, it is fast, cheap, consistent, and — because it barely models language — inclined to fail loudly rather than to invent (Puigcerver, 2017; AlKendi et al., 2024).\n\nHow well it works depends on things you control. The line-finding has to be fixed, because the reading step only ever sees what line-finding produced, and chopped strips delete Greek accents before the model lays eyes on them (Perdiki & Konstantinidou, 2023). Your text must be attached to the right lines. The starting model must match the script. And you must start from an existing model, because that alone was the difference between 17% and 4% on identical material (Perdiki & Konstantinidou, 2023).\n\nJudging it takes more than a number. A score holds only for pages laid out like the ones it was tested on, treats every difference as equal, and can look excellent while the model quietly modernizes away the very fidelity your edition exists to preserve (Levchenko, 2024).\n\nFriday tests the opposite kind of instrument: no edges, trained on everything, able to draw on what language usually does — and therefore able to produce fluent text that is not on the page. Comparing the two is the point of the week.\n\n**For Friday.** Remote. Bring the seven items in section 28, with all three versions tagged.\n\n**Vocabulary.** *Bounded* — limited to a defined range of material. *Fluent* — reading smoothly, which is not the same as being correct.\n\n**Takeaway:** An HTR model reads ink within the bounds of its training and fails conspicuously; Friday's instrument reads expectation too, and fails fluently.\n\n---\n\n## References\n\nAlKendi, W., Gechter, F., Heyberger, L., & Guyeux, C. (2024). Advancements and\nchallenges in handwritten text recognition: A comprehensive survey. *Journal of\nImaging*.\n\neScriptorium/Kraken. (2024). *eScriptorium platform documentation*.\nhttps://escriptorium.eu/about\n\nGeelhaar, T. (2022). *Carolingian minuscule model CMM 9th–11th c.* Transkribus\nModel. https://www.transkribus.org/models/latin-carolingian-minuscule\n\nLevchenko, M. A. (2024). *Evaluating LLMs for historical document OCR: A\nmethodological framework for digital humanities*.\n\nLi, M., Lv, T., Chen, J., Cui, L., Lu, Y., Florencio, D., Zhang, C., Li, Z., & Wei,\nF. (2023). TrOCR: Transformer-based optical character recognition with pre-trained\nmodels. *Proceedings of the AAAI Conference on Artificial Intelligence, 37*(11),\n13094–13102.\n\nMattingly, W. J. B., et al. (2024). *When simpler is better: Evaluating translation\npipelines for medieval Latin manuscripts*.\n\nPerdiki, E., & Konstantinidou, M. (2023). Preparing big manuscript data for\nhierarchical clustering with minimal HTR training. *Journal of Data Mining &\nDigital Humanities*. https://jdmdh.episciences.org/12664/pdf\n\nPuigcerver, J. (2017). *PyLaia: A deep learning toolkit for handwritten document\nanalysis*. https://github.com/jpuigcerver/PyLaia", "image_b64": null, "question": {"name": "30 Question: Synthesis: An Instrument with Edges", "questiontext": "<p>What does it mean to call a trained reading model \"an instrument with edges\"?</p>", "generalfeedback": "<p>An HTR model reads ink within the bounds of its training and fails conspicuously; Friday's instrument reads expectation too, and fails fluently.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It reads ink and produces letters, and its competence extends exactly as far as its examples went — no further, and it does not pretend otherwise.</p>", "feedback": "<p>Correct. Inside that boundary it is fast, cheap, consistent, and inclined to fail loudly rather than to invent.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It works only on rectangular pages with clearly ruled margins.</p>", "feedback": "<p>Incorrect. The edges are the limits of its training, not a physical constraint on the page.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It has a fixed maximum accuracy that no amount of training can exceed.</p>", "feedback": "<p>Incorrect. Accuracy improves with better data. The boundary is about what material it can handle.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It must be retrained from scratch whenever the manuscript changes.</p>", "feedback": "<p>Incorrect. You fine-tune it further — starting from scratch is precisely what you should never do.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
