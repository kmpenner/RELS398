 {"step": 29, "title": "Looking Ahead: Module 10 and Textual Consolidation", "content": "**Looking Ahead: Module 10 and Textual Consolidation**\n\nNext week, we move into **Module 10: Consolidation**.\n\nOver the first nine modules, you learned and practiced every individual stage of the digital textual pipeline: cataloguing, imaging, transcription, reconciliation, normalization, rendering, lemmatization, and entity markup.\n\nIn Module 10, you will consolidate these diverse markup layers into a unified, publication-ready TEI master edition. You will resolve overlapping tags, streamline your `teiHeader`, and prepare your complete digital edition for final scholarly publication.\n\n**Vocabulary.** *Textual Consolidation* — Merging and reconciling multiple markup layers into a unified, master digital edition. *Master Edition* — The definitive, fully encoded digital text that combines all analytical annotations.\n\n**Takeaway:** Module 10 consolidates all nine digital markup layers into a unified, publication-ready master edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Looking Ahead: Module 10 and Textual Consolidation", "questiontext": "<p>What is the focus of Module 10 next week as we build toward the final project?</p>", "generalfeedback": "<p>Module 10 consolidates transcription, normalization, and markup into a unified, publication-grade digital edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Textual consolidation: uniting transcription, normalization, linguistic markup, and entity tagging into a cohesive, publication-ready TEI edition.</p>", "feedback": "<p>Correct. Module 10 integrates all preceding analytical layers into a unified digital critical apparatus and publication pipeline.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Abandoning all digital work and switching to finger painting.</p>", "feedback": "<p>Incorrect. Module 10 consolidates our computational philology workflow.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Learning how to design smartphone video games from scratch.</p>", "feedback": "<p>Incorrect. Coursework focuses on digital methods for historical documents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Erasing all project work and starting over from Week 1.</p>", "feedback": "<p>Incorrect. Module 10 builds directly on all previous modules to produce the final edition.</p>"}]}}, {"step": 30, "title": "The Final Stage Gate: Committing Your Completed Portfolio", "content": "**The Final Stage Gate: Committing Your Completed Portfolio**\n\nYou have reached the final stage gate for Topic 9: Named Entities.\n\nYou mastered the three-step comparative cycle: establishing human ground truth, testing deterministic NLP pipelines, and auditing generative artificial intelligence. You held automated models accountable to historical facts and proved the necessity of human scholarship.\n\nStage and commit all remaining files to your repository on the `main` branch:\n```bash\ngit add ai_entity_parser.py ground_truth_entities_ai.xml ENTITY_AUDIT.md\ngit commit -m \"Week 9 Step 3: AI entity markup and three-way comparative audit\"\n```\n\nSubmit your portfolio on Moodle before 11:00 PM tonight. Congratulations on completing Module 9!\n\n**Vocabulary.** *Portfolio Completion* — Successfully delivering all required policy, baseline, and audit files for a course module. *Final Stage Gate* — The concluding milestone that locks in all project deliverables for grading.\n\n**Takeaway:** Committing your AI parser, markup, and capstone audit completes Module 9 and locks in your final portfolio for submission.\n\n---", "html": null, "image_b64": null, "question": {"name": "30 Question: The Final Stage Gate: Committing Your Completed Portfolio", "questiontext": "<p>What is the final action required to complete Topic 9 before closing your work session?</p>", "generalfeedback": "<p>Completing the final stage gate requires verifying linter gates, committing clean files, and updating the ledger.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verify all files pass linting and schema checks, then commit the entire Module 9 package to git with a clear, descriptive message.</p>", "feedback": "<p>Correct. Running the final linter gate and committing your complete portfolio locks in your work for the module.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Shut down the computer by pulling the power cord out of the wall without saving.</p>", "feedback": "<p>Incorrect. Improper shutdown risks data corruption and loses unsaved work.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Post your private passwords to public social media websites.</p>", "feedback": "<p>Incorrect. Security credentials must always be protected.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete your local repository from the computer.</p>", "feedback": "<p>Incorrect. The working tree must be preserved and committed.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
