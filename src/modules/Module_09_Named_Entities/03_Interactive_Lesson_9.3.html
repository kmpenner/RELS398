    <script>
        const lessonData = {"course_title": "AI-Assisted Entity Tagging, Entity Linking, and Comparative Audit", "subtitle": "Interactive Lesson", "total_sections": 30, "slides": [{"step": 1, "title": "The AI Revolution in Philology: Flexible Models for Historical Prose", "content": "**The AI Revolution in Philology: Flexible Models for Historical Prose**\n\nOver the past two meetings, you explored two different ways to find historical entities. On Tuesday, you established human ground truth through close reading and authority research. On Wednesday, you ran deterministic natural language processing pipelines using SpaCy and gazetteer lists. You saw that while automated models process archives in seconds, rigid statistical rules struggle with archaic spelling and complex syntax.\n\nToday, we complete our three-step comparative cycle by introducing generative artificial intelligence. Large language models (LLMs) operate fundamentally differently from traditional statistical sequence taggers. Instead of analyzing text through isolated token windows, generative models process rich, multi-sentence semantic context.\n\nGenerative AI understands historical rhetorical patterns and informal prose with remarkable flexibility. But it brings severe hazards: non-deterministic output, prompt drift, and fabricated facts. Today, you will command an AI model in VS Code, audit its predictions against human ground truth, and synthesize your final portfolio for Assignment 9.\n\n**Vocabulary.** *Generative AI* — Large language models that generate structured text, code, or annotations based on contextual prompts. *Context Window* — The span of text that a language model can process and analyze simultaneously.\n\n**Takeaway:** Generative AI brings contextual flexibility to historical prose but requires rigorous human auditing to prevent hallucinations.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: The AI Revolution in Philology: Flexible Models for Historical Prose", "questiontext": "<p>Why are modern Large Language Models (LLMs) uniquely powerful for processing historical prose compared to older statistical taggers?</p>", "generalfeedback": "<p>LLMs bring deep semantic context and world knowledge to historical texts, surpassing the narrow window of traditional sequence taggers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Their billions of parameters capture rich contextual semantics, multilingual syntax, and world knowledge across centuries of textual history.</p>", "feedback": "<p>Correct. LLMs leverage deep contextual representations and vast multilingual pretraining to handle complex historical vocabulary and syntax.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>LLMs contain physical time-travel antennas that communicate directly with dead authors.</p>", "feedback": "<p>Incorrect. LLMs are computational language models trained on digital text corpora, not supernatural devices.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>LLMs are guaranteed to be 100% error-free and never require human review.</p>", "feedback": "<p>Incorrect. LLMs frequently hallucinate facts or syntax, requiring rigorous human verification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>LLMs can only process text written in binary machine code.</p>", "feedback": "<p>Incorrect. LLMs process natural human languages fluently.</p>"}]}}, {"step": 2, "title": "Why LLMs Excel at Historical Names: Semantic and Syntactic Depth", "content": "**Why LLMs Excel at Historical Names: Semantic and Syntactic Depth**\n\nTraditional sequence taggers like SpaCy evaluate each word primarily through local grammatical transitions. If an unfamiliar word appears, the statistical chain fractures.\n\nLarge language models are trained on billions of parameters across historical books, encyclopedias, and diverse web corpora. They understand that an eighteenth-century phrase like *in the twenty-sixth year of His Majesty's reign* functions as a calendar expression, even though it contains no numbers.\n\nFurthermore, LLMs handle informal language with ease. When Maud Lewis refers casually to *Everett*, an AI model recognizes from the surrounding letter that Everett is her husband. It connects the casual mention to his full identity without needing an explicit honorific title like *Mr.* or *Governor*.\n\n**Vocabulary.** *Semantic Depth* — An algorithm's ability to understand overarching meaning rather than superficial word patterns. *Implicit Entity* — A person or place referred to indirectly through kinship words, pronouns, or titles.\n\n**Takeaway:** Large language models interpret complex historical syntax and informal names by analyzing broad semantic meaning.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: Why LLMs Excel at Historical Names: Semantic and Syntactic Depth", "questiontext": "<p>How do LLMs overcome the boundary errors that plague statistical sequence taggers like SpaCy?</p>", "generalfeedback": "<p>Broad contextual attention allows LLMs to resolve complex entity spans and honorific titles without clipping.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They model entire sentence structures and rhetorical discourse, recognizing that honorifics, titles, and multipart names belong to a single entity.</p>", "feedback": "<p>Correct. Global attention mechanisms allow LLMs to understand complex noun phrases and honorific formulas far better than local window taggers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete all titles from historical documents before reading them.</p>", "feedback": "<p>Incorrect. LLMs retain and analyze titles within their semantic context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They look up every word in a printed book using a robotic scanner.</p>", "feedback": "<p>Incorrect. LLMs operate as digital neural networks processing token embeddings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They force every person's name to be exactly three words long.</p>", "feedback": "<p>Incorrect. LLMs accommodate variable-length entity spans naturally.</p>"}]}}, {"step": 3, "title": "The Hallucination Hazard: Inventing Plausible Fiction", "content": "**The Hallucination Hazard: Inventing Plausible Fiction**\n\nThe greatest strength of generative AI is also its greatest danger: its fluency. Language models are probabilistic token predictors, not factual databases.\n\nWhen an AI model does not know an authority identifier, it does not stop and admit defeat. Instead, it predicts what a plausible identifier ought to look like. If you ask an unconstrained model to find the Wikidata Q-identifier for a minor French clerk or a local colonial settler, it will effortlessly invent a fake number like `Q9847125`.\n\nTo the untrained eye, the generated XML looks flawless: tags match, attributes are present, and the format validates. But the identifier points to an unrelated modern topic, or to a web page that does not exist. Digital humanists must never accept AI output without verifying external links.\n\n**Vocabulary.** *Model Hallucination* — When an AI model generates plausible-sounding but completely fabricated facts or identifiers. *Fluent Falsehood* — Text that appears grammatically correct and convincing but is factually untrue.\n\n**Takeaway:** Language models invent plausible-sounding authority identifiers when unconstrained; editors must verify all external links.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Hallucination Hazard: Inventing Plausible Fiction", "questiontext": "<p>What is the 'hallucination hazard' when using generative AI for named entity linking?</p>", "generalfeedback": "<p>The hallucination hazard occurs when generative models invent plausible but non-existent identifiers or historical facts.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model confabulates plausible-sounding but completely fictitious Wikidata Q-identifiers, historical biographies, or citations.</p>", "feedback": "<p>Correct. Generative models prioritize probabilistic linguistic fluency and will invent synthetic URLs or Q-numbers if ungrounded.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model displays animated psychedelic graphics on the computer monitor.</p>", "feedback": "<p>Incorrect. In machine learning, hallucination refers to confabulated or ungrounded factual claims, not visual graphics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer catches fire due to excessive processor heat.</p>", "feedback": "<p>Incorrect. Hallucination is a semantic fidelity failure, not physical combustion.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The model deletes all punctuation marks from the English language.</p>", "feedback": "<p>Incorrect. Punctuation handling is unrelated to the hallucination of non-existent entity records.</p>"}]}}, {"step": 4, "title": "Prompt Engineering: Zero-Shot vs. Few-Shot Annotation", "content": "**Prompt Engineering: Zero-Shot vs. Few-Shot Annotation**\n\nThe quality of AI-generated markup depends entirely on prompt engineering. How you instruct the model determines whether you receive scholarly markup or useless fiction.\n\nIn **zero-shot prompting**, you give the model an instruction with no examples: *Tag the named entities in this eighteenth-century text*. The model guesses at your conventions, invents custom XML tags, and modernizes spelling without your permission.\n\nIn **few-shot prompting**, you provide explicit persona instructions, strict rules, and two or three concrete input-output examples. By showing the model exactly how you want tags, IDs, and attributes formatted, you lock its output into valid TEI XML.\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Prompting Strategy</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Input Structure</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Typical Failure Modes</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Scholarly Suitability</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Zero-Shot</td>\n      <td style=\"padding: 0.5rem;\">Bare instruction without examples</td>\n      <td style=\"padding: 0.5rem;\">Custom tags, modernizes spelling, invents URIs</td>\n      <td style=\"padding: 0.5rem;\">Unsuitable for academic editions</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">Few-Shot</td>\n      <td style=\"padding: 0.5rem;\">Persona + strict rules + 2-3 exemplars</td>\n      <td style=\"padding: 0.5rem;\">Minor boundary slips, prompt drift on long texts</td>\n      <td style=\"padding: 0.5rem;\">Standard for digital scholarship</td>\n    </tr>\n  </tbody>\n</table>\n\n**Vocabulary.** *Zero-Shot Prompting* — Giving an AI model a task without providing demonstration examples. *Few-Shot Prompting* — Providing an AI model with several concrete input-output examples to guide its behavior.\n\n**Takeaway:** Few-shot prompting with concrete examples forces language models to follow strict TEI schema guidelines.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Prompt Engineering: Zero-Shot vs. Few-Shot Annotation", "questiontext": "<p>What distinguishes a 'few-shot' prompt from a 'zero-shot' prompt in named entity tagging?</p>", "generalfeedback": "<p>Few-shot prompts provide concrete exemplary demonstrations, guiding the model toward strict schema compliance and boundary accuracy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A few-shot prompt provides curated input/output examples demonstrating the exact desired XML structure and edge-case handling before the test text.</p>", "feedback": "<p>Correct. Providing concrete demonstration examples anchors the model's output syntax and dramatically reduces structural errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A zero-shot prompt costs ten dollars, while a few-shot prompt is free.</p>", "feedback": "<p>Incorrect. Zero-shot and few-shot refer to in-context learning examples, not financial costs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A few-shot prompt can only run three times before expiring.</p>", "feedback": "<p>Incorrect. Prompts can be executed repeatedly without limitation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A zero-shot prompt is written in Chinese, while a few-shot prompt is written in German.</p>", "feedback": "<p>Incorrect. Both prompting strategies can be authored in any language.</p>"}]}}, {"step": 5, "title": "Injecting Editorial Policies: Positive and Negative Constraints", "content": "**Injecting Editorial Policies: Positive and Negative Constraints**\n\nTo achieve reliable results, your system prompt must incorporate the rules from your `ENTITY_POLICIES.md` file.\n\nScholarly prompts require two types of constraints:\n\n1. **Positive Constraints:** Explicit rules stating what the model must do (e.g., *Use TEI persName, placeName, orgName, and date tags; normalize dates using the when attribute in YYYY-MM-DD format*).\n\n2. **Negative Constraints:** Explicit prohibitions stating what the model must never do (e.g., *Do NOT alter historical spelling inside tags; do NOT invent authority identifiers; do NOT include conversational preamble*).\n\nNegative constraints are essential. They prevent the model from modernizing eighteenth-century spellings like *shew'd* or adding polite commentary before the XML.\n\n**Vocabulary.** *Positive Constraint* — An instruction that directs an algorithm on what actions or formats it must produce. *Negative Constraint* — A rule forbidding an algorithm from performing specific actions, such as altering text.\n\n**Takeaway:** Combining positive guidelines with negative constraints keeps AI models focused on strict schema conformity.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Injecting Editorial Policies: Positive and Negative Constraints", "questiontext": "<p>Why must prompt templates include explicit negative constraints (e.g. 'DO NOT invent Q-identifiers')?</p>", "generalfeedback": "<p>Negative constraints explicitly block models from inventing fake identifiers when no authoritative record exists.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Generative models are biased toward providing complete answers and will invent synthetic IDs to fill perceived gaps unless explicitly forbidden.</p>", "feedback": "<p>Correct. Negative constraints override generative confabulation defaults and enforce the Verified Absence rule.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because negative words make the computer processor run faster.</p>", "feedback": "<p>Incorrect. Negative constraints guide semantic generation; they do not alter hardware clock speeds.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because positive rules are forbidden by computer programming syntax.</p>", "feedback": "<p>Incorrect. Both positive and negative instructions are valid natural language constraints.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force the model to delete the text if an entity is missing.</p>", "feedback": "<p>Incorrect. Negative constraints prevent fake data generation while keeping text intact.</p>"}]}}, {"step": 6, "title": "Automating AI Prompts in VS Code: ai_entity_parser.py", "content": "**Automating AI Prompts in VS Code: ai_entity_parser.py**\n\nIn today's lab, you will not copy and paste text into a public web chat. Instead, you will execute a Python script in VS Code called `ai_entity_parser.py`.\n\nThe script reads your manuscript excerpt, packages it with your system prompt and few-shot examples, and sends it to the language model API. It captures the generated XML, validates its structure, and saves it to `ground_truth_entities_ai.xml`.\n\nAutomating the interaction through code gives you an exact, reproducible record of your parameters, temperature settings, and model versions. Every step in your editorial workflow is documented in your repository.\n\n**Vocabulary.** *API Script* — A programmatic script that communicates with a remote server or model automatically. *Reproducibility* — The scientific principle that an experiment can be run by others and produce the same results.\n\n**Takeaway:** Automating AI queries through Python scripts creates an exact, reproducible audit trail in your project repository.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Automating AI Prompts in VS Code: ai_entity_parser.py", "questiontext": "<p>Why do scholars use a scripted Python runner (`ai_entity_parser.py`) in VS Code rather than manual interactive web chats?</p>", "generalfeedback": "<p>Scripted API execution locks in model parameters, ensures reproducible results, and preserves audit trails.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A scripted runner ensures deterministic parameters (e.g. temperature=0.0), structured logging, repeatable execution, and version control.</p>", "feedback": "<p>Correct. Scripted pipelines guarantee reproducibility, parameter consistency, and automated integration into downstream audit workflows.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because web browsers are illegal for university researchers to open.</p>", "feedback": "<p>Incorrect. Web browsers are standard research tools, but manual chatting is non-reproducible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because interactive chats automatically erase the user's hard drive.</p>", "feedback": "<p>Incorrect. Web chat interfaces do not erase storage devices.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Python scripts cannot connect to cloud AI models.</p>", "feedback": "<p>Incorrect. Python is the primary programming language used to interface with AI APIs.</p>"}]}}, {"step": 7, "title": "The TEI XML Schema Quality Gate", "content": "**The TEI XML Schema Quality Gate**\n\nBefore you compare AI predictions against your human baseline, the generated XML must pass two strict quality gates.\n\nThe first gate is **well-formedness and validation**. Every opening tag must have a matching closing tag. Attribute names must be spelled correctly (`ref=`, not `link=`). Date formats must conform to ISO 8601.\n\nThe second gate is **textual integrity**. The AI must not alter a single character of your manuscript witness. If the model modernized *décrétoit* to *décrétait* or expanded abbreviations without using `<choice>`, the file fails the quality gate immediately.\n\nOpen the Problems panel in VS Code (`Ctrl+Shift+M`) to confirm that `ground_truth_entities_ai.xml` validates to zero errors.\n\n**Vocabulary.** *Quality Gate* — A mandatory validation test that a file must pass before being accepted into a pipeline. *Textual Integrity* — Preserving the exact characters of the primary manuscript without unauthorized alterations.\n\n**Takeaway:** AI-generated XML must pass schema validation and preserve original spelling before being audited.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: The TEI XML Schema Quality Gate", "questiontext": "<p>What is the very first quality gate an AI-generated TEI XML fragment must pass before evaluation?</p>", "generalfeedback": "<p>AI outputs must pass schema validation first; malformed XML is immediately rejected as invalid.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Well-formed XML syntax and strict TEI P5 Relax NG schema validation.</p>", "feedback": "<p>Correct. An output with unclosed tags, illegal attributes, or malformed nesting cannot be integrated into a scholarly edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Conversion into an MP3 audio file.</p>", "feedback": "<p>Incorrect. Scholarly editions evaluate structured textual XML, not audio conversions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Approval by a commercial advertising agency.</p>", "feedback": "<p>Incorrect. Commercial advertising has no role in scholarly XML validation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A spelling check against modern slang dictionaries.</p>", "feedback": "<p>Incorrect. Historical texts preserve archaic orthography and validate against formal TEI schemas.</p>"}]}}, {"step": 8, "title": "The Token Alignment Gate: Matching Entity Spans", "content": "**The Token Alignment Gate: Matching Entity Spans**\n\nBefore calculating accuracy scores, you must verify **token alignment** between your manual and AI files.\n\nAn automated script cannot calculate precision if the two files disagree on word boundaries. For example, if your manual file tagged `Major Jean Baptiste Cope` as twenty characters and the AI split the title into separate elements, the comparison script must align those spans.\n\nEnsure that both files contain the exact same continuous passage. In `ai_entity_parser.py`, you can run an automated alignment checker that verifies word counts before running the comparative evaluation.\n\n**Vocabulary.** *Span Alignment* — Matching start and end word positions between two different annotation files. *Alignment Gate* — A verification step ensuring that text spans match before mathematical scoring begins.\n\n**Takeaway:** Verifying span alignment between manual and AI files ensures that mathematical scoring is fair and accurate.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: The Token Alignment Gate: Matching Entity Spans", "questiontext": "<p>Why is the 'Token Alignment Gate' essential when validating LLM predictions against the manual ground truth?</p>", "generalfeedback": "<p>The token alignment gate ensures the LLM did not silently alter, modernize, or drop primary witness tokens.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>LLMs may subtly rephrase, modernize, or drop words from the primary text, destroying direct token-for-token comparability.</p>", "feedback": "<p>Correct. Generative models occasionally 'clean up' or alter historical text; verification ensures the underlying witness tokens remain untouched.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because tokens in computer memory decay if not measured every five minutes.</p>", "feedback": "<p>Incorrect. Digital tokens in memory do not physically decay.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because token alignment is required by the local electric company.</p>", "feedback": "<p>Incorrect. Utility companies do not regulate computational linguistics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because non-aligned tokens cause the computer monitor to turn upside down.</p>", "feedback": "<p>Incorrect. Visual display orientation is unrelated to textual token indexing.</p>"}]}}, {"step": 9, "title": "The Three-Way Comparative Diff in VS Code", "content": "**The Three-Way Comparative Diff in VS Code**\n\nNow comes the heart of our module: the **Three-Way Comparative Audit**. You will compare all three passes side by side in Visual Studio Code:\n\n1. **Manual Ground Truth (`ground_truth_entities_manual.xml`):** The human baseline (Tuesday).\n\n2. **Deterministic NLP (`ner_baseline.xml`):** The SpaCy sequence model (Wednesday).\n\n3. **AI-Assisted Model (`ground_truth_entities_ai.xml`):** The LLM prompt output (Friday).\n\nOpen VS Code split editors to view the files simultaneously, or run split diffs:\n```bash\ncode --diff ground_truth_entities_manual.xml ground_truth_entities_ai.xml\n```\n\nYou can now observe exactly where the deterministic tool stumbled, where the AI succeeded, and where both failed.\n\n**Vocabulary.** *Three-Way Audit* — A comparative study evaluating manual, deterministic, and AI methods on the same passage. *Split Editor* — A screen layout displaying multiple files side by side in an editor.\n\n**Takeaway:** The three-way audit compares manual, deterministic, and AI annotations side by side to reveal their relative strengths.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: The Three-Way Comparative Diff in VS Code", "questiontext": "<p>What three distinct tiers of data are compared in the Three-Way Comparative Audit?</p>", "generalfeedback": "<p>The Three-Way Comparative Audit contrasts manual ground truth, statistical NLP, and generative AI predictions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Tier 1: Manual Human Ground Truth; Tier 2: Deterministic/Statistical NLP (SpaCy); Tier 3: Generative AI (LLM).</p>", "feedback": "<p>Correct. The audit triangulates human expertise, statistical machine learning, and generative AI across identical text spans.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Three different translations of the Bible into modern Spanish.</p>", "feedback": "<p>Incorrect. The audit compares three annotation methodologies on the student's primary witness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Three different web browsers running on three different operating systems.</p>", "feedback": "<p>Incorrect. Software browsing environments are not the subject of the linguistic audit.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Three random files chosen from the internet.</p>", "feedback": "<p>Incorrect. The comparison evaluates three structured tiers on the same manuscript excerpt.</p>"}]}}, {"step": 10, "title": "Scoring the AI Pass: Precision, Recall, and F1-Score", "content": "**Scoring the AI Pass: Precision, Recall, and F1-Score**\n\nJust as you measured SpaCy's accuracy on Wednesday, you will now calculate mathematical scores for the AI model.\n\nCount your True Positives, False Positives, and False Negatives:\n\n* **Precision:** How many of the AI's entity tags matched your manual ground truth?\n\n* **Recall:** Did the AI discover all twenty entities that you identified by hand?\n\n* **F1-Score:** What is the balanced harmonic score of the AI model?\n\nCompare these numbers directly against Wednesday's SpaCy scores. In most historical documents, generative AI achieves higher Recall than SpaCy because it recognizes unusual syntax, but it may have lower Precision due to over-tagging common nouns.\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Method</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Precision (%)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Recall (%)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">F1-Score (%)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Primary Failure Mode</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Manual Baseline (9.1)</td>\n      <td style=\"padding: 0.5rem;\">100.0%</td>\n      <td style=\"padding: 0.5rem;\">100.0%</td>\n      <td style=\"padding: 0.5rem;\">100.0%</td>\n      <td style=\"padding: 0.5rem;\">Slow, labor-intensive craft</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Deterministic NLP (9.2)</td>\n      <td style=\"padding: 0.5rem;\">78.5%</td>\n      <td style=\"padding: 0.5rem;\">65.0%</td>\n      <td style=\"padding: 0.5rem;\">71.1%</td>\n      <td style=\"padding: 0.5rem;\">OOV spelling, toponym blindness</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">Generative AI (9.3)</td>\n      <td style=\"padding: 0.5rem;\">88.2%</td>\n      <td style=\"padding: 0.5rem;\">90.0%</td>\n      <td style=\"padding: 0.5rem;\">89.1%</td>\n      <td style=\"padding: 0.5rem;\">Over-tagging, invented URIs</td>\n    </tr>\n  </tbody>\n</table>\n\n**Vocabulary.** *Comparative Metrics* — Using identical mathematical formulas to benchmark two different technologies against a single human baseline. *Over-Tagging* — Tagging ordinary capitalized nouns as entities when they are merely general concepts.\n\n**Takeaway:** Computing comparative scores reveals that AI models often achieve higher recall than rule-based taggers but require auditing for precision.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Scoring the AI Pass: Precision, Recall, and F1-Score", "questiontext": "<p>If an LLM identifies 18 entity spans correctly, misses 2 ground truth entities, and hallucinates 2 false entities, what are its Precision and Recall?</p>", "generalfeedback": "<p>Calculating precision (TP/(TP+FP)) and recall (TP/(TP+FN)) provides empirical accuracy metrics for LLM performance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Precision = 90% (18/20), Recall = 90% (18/20), and F1-score = 90%.</p>", "feedback": "<p>Correct. Precision = TP/(TP+FP) = 18/20 = 0.90; Recall = TP/(TP+FN) = 18/20 = 0.90; F1 = 2*(0.9*0.9)/(0.9+0.9) = 0.90.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Precision = 50%, Recall = 100%, and F1-score = 75%.</p>", "feedback": "<p>Incorrect. With 18 true positives out of 20 predictions and 20 targets, precision and recall are both 90%.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Precision = 100%, Recall = 0%, and F1-score = 0%.</p>", "feedback": "<p>Incorrect. A model with 18 correct hits does not have zero recall.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Precision = 10%, Recall = 10%, and F1-score = 10%.</p>", "feedback": "<p>Incorrect. Mathematical calculations must follow standard evaluation formulas.</p>"}]}}, {"step": 11, "title": "Building the Three-Way Discrepancy Matrix", "content": "**Building the Three-Way Discrepancy Matrix**\n\nIn your capstone report, `ENTITY_AUDIT.md`, you will compile a comprehensive comparative matrix across all twenty mentions.\n\nThe table features five columns:\n\n1. **Mention:** The raw text string in the manuscript.\n\n2. **Manual Ground Truth (9.1):** Your verified human tag and authority link.\n\n3. **Deterministic NLP (9.2):** What SpaCy predicted.\n\n4. **Generative AI (9.3):** What the LLM predicted.\n\n5. **Scholarly Analysis:** Which method succeeded and why.\n\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 0.5rem; text-align: left;\">Mention</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Manual Truth (9.1)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">NLP (9.2)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">AI (9.3)</th>\n      <th style=\"padding: 0.5rem; text-align: left;\">Analysis</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Major Cope</td>\n      <td style=\"padding: 0.5rem;\"><code>persName (dcb:cope)</code></td>\n      <td style=\"padding: 0.5rem;\"><code>Cope (PER)</code></td>\n      <td style=\"padding: 0.5rem;\"><code>persName (dcb:cope)</code></td>\n      <td style=\"padding: 0.5rem;\">AI included title and linked DCB correctly</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 0.5rem;\">Chigabenakady</td>\n      <td style=\"padding: 0.5rem;\"><code>placeName (geonames)</code></td>\n      <td style=\"padding: 0.5rem;\">[Missed]</td>\n      <td style=\"padding: 0.5rem;\"><code>placeName</code></td>\n      <td style=\"padding: 0.5rem;\">AI recognized place; prompt prevented fake ID</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 0.5rem;\">Assemblée</td>\n      <td style=\"padding: 0.5rem;\"><code>orgName (wikidata)</code></td>\n      <td style=\"padding: 0.5rem;\"><code>LOC</code></td>\n      <td style=\"padding: 0.5rem;\"><code>orgName</code></td>\n      <td style=\"padding: 0.5rem;\">AI resolved organization type cleanly</td>\n    </tr>\n  </tbody>\n</table>\n\n**Vocabulary.** *Discrepancy Matrix* — A multi-column table displaying side-by-side annotations across three distinct workflows. *Scholarly Analysis* — Evaluating the theoretical and practical reasons behind divergent machine readings.\n\n**Takeaway:** The three-way discrepancy matrix provides a clear, side-by-side comparison of human, statistical, and AI annotations.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Building the Three-Way Discrepancy Matrix", "questiontext": "<p>What is the primary analytical function of the Three-Way Discrepancy Matrix in `ENTITY_AUDIT.md`?</p>", "generalfeedback": "<p>The Three-Way Discrepancy Matrix maps token-by-token consensus and divergence across human, statistical, and generative methods.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To place Manual, SpaCy, and LLM annotations side by side for every disputed token, revealing exactly where and why methods diverge.</p>", "feedback": "<p>Correct. The matrix provides a structured, comparative view of consensus and divergence across all three methodologies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To calculate the monthly financial cost of running university servers.</p>", "feedback": "<p>Incorrect. The matrix evaluates linguistic annotation agreement, not server costs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To serve as a cryptographic key for encrypting credit card numbers.</p>", "feedback": "<p>Incorrect. Scholarly matrices are analytical tables, not encryption ciphers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To list all books published in the seventeenth century.</p>", "feedback": "<p>Incorrect. The matrix focuses specifically on the excerpt under audit.</p>"}]}}, {"step": 12, "title": "Cohort Synthesis A: Ace and French Revolutionary Entities", "content": "**Cohort Synthesis A: Ace and French Revolutionary Entities**\n\nLet us look at how the three methods performed on Ace's 1791 French Revolutionary decree.\n\nOn Wednesday, SpaCy's French sequence model struggled with elided articles and legislative committees. It tagged `l'Assemblée nationale` as a location and completely overlooked minor signers like `Dejoly`.\n\nThe generative AI model performed significantly better. Informed by prompt context about 1791 constitutional France, the AI recognized that the National Assembly was a legislative body (`orgName`). It separated the elided article `l'` from the entity span. However, the AI attempted to invent a French national archive identifier for `Dejoly` that did not exist. Ace's manual ground truth was essential to catch the hallucination.\n\n**Vocabulary.** *Contextual Recovery* — When an AI model uses broad historical understanding to identify an entity that rigid taggers missed. *Fabricated Identifier* — A fake archive number invented by an AI model to satisfy a prompt request.\n\n**Takeaway:** In French revolutionary texts, AI models resolve complex institutional bodies but tend to invent fake archive identifiers.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: Cohort Synthesis A: Ace and French Revolutionary Entities", "questiontext": "<p>In Ace's 1791 French Revolutionary decree, how did the LLM typically compare with SpaCy on institutional names like 'Comité des décrets'?</p>", "generalfeedback": "<p>LLMs demonstrate superior syntactic boundary retention on multi-token French political institutions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The LLM captured the complete organizational span (<orgName>) without dropping determiners, whereas SpaCy frequently truncated boundaries.</p>", "feedback": "<p>Correct. LLMs handle French institutional multi-word nominal expressions with superior boundary completeness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The LLM refused to read French and translated everything into Japanese.</p>", "feedback": "<p>Incorrect. Multilingual LLMs handle French historical text natively.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>SpaCy achieved 100% perfection while the LLM produced only random punctuation.</p>", "feedback": "<p>Incorrect. Both tools produced valuable data, but LLMs demonstrated superior span recognition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Neither tool was able to find any words in the decree.</p>", "feedback": "<p>Incorrect. Both pipelines extracted entities successfully.</p>"}]}}, {"step": 13, "title": "Cohort Synthesis B: Olyvia and Maud Lewis's Folk Correspondence", "content": "**Cohort Synthesis B: Olyvia and Maud Lewis's Folk Correspondence**\n\nIn Olyvia's Maud Lewis letter, the three-way comparison highlights the difference between rigid models and contextual models on informal writing.\n\nSpaCy struggled with casual first names and rural place names. It tagged *Everett* with low confidence and missed *Marshalltown* entirely because the hamlet was absent from modern training corpora.\n\nThe generative AI model easily identified *Everett* as a person and *Marshalltown* as a place. Because LLMs have ingested regional Canadian culture and art history, the model recognized Maud Lewis's rural home. However, the AI tended to over-tag common objects, attempting to tag *paintings* or *cards* as corporate works. Olyvia's manual policy restrained the model's over-enthusiasm.\n\n**Vocabulary.** *Cultural Ingestion* — An AI model's ability to recall regional artistic or cultural facts from its training data. *Over-Generalization* — Tagging ordinary everyday items as formal cultural titles.\n\n**Takeaway:** In informal correspondence, AI models recognize rural places and first names but tend to over-tag common descriptive words.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: Cohort Synthesis B: Olyvia and Maud Lewis's Folk Correspondence", "questiontext": "<p>In Olyvia's Maud Lewis letters, what significant advantage did the LLM demonstrate over deterministic gazetteers?</p>", "generalfeedback": "<p>LLMs use surrounding epistolary discourse to disambiguate informal personal first names into full biographical identities.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The LLM inferred from epistolary context that 'Everett' was Maud's husband Everett Lewis, whereas gazetteers missed the bare first name.</p>", "feedback": "<p>Correct. Contextual reasoning allows LLMs to resolve informal personal references that static gazetteers miss completely.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The LLM bought an antique painting from Maud Lewis.</p>", "feedback": "<p>Incorrect. Software models cannot purchase material physical art.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The gazetteer deleted all vowel letters from the text.</p>", "feedback": "<p>Incorrect. Gazetteers do not delete characters from text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The LLM refused to process letters written by female artists.</p>", "feedback": "<p>Incorrect. AI models process texts without demographic discrimination.</p>"}]}}, {"step": 14, "title": "Cohort Synthesis C: Andromeda and the 1752 Treaty", "content": "**Cohort Synthesis C: Andromeda and the 1752 Treaty**\n\nIn Andromeda's 1752 Treaty, the three-way comparison demonstrates the high stakes of diplomatic and Indigenous sovereignty.\n\nSpaCy suffered from toponym blindness, completely skipping the Indigenous district of *Chigabenakady*. It truncated *Major Jean Baptiste Cope* into a bare surname and confused sovereign councils with physical buildings.\n\nThe generative AI model succeeded in capturing full composite titles: `Major Jean Baptiste Cope, Chief Sachem`. Guided by prompt rules, it recognized *Chigabenakady* as a geographic place. However, when asked to link the place, the AI attempted to attach a modern colonial municipality in Ontario with a similar name. Andromeda's manual ground truth rescued the historical Mi'kmaw territory from automated geographic displacement.\n\n**Vocabulary.** *Geographic Displacement* — When an automated tool attaches a historical place to a modern municipality in the wrong province. *Composite Title* — An entity mention that combines multiple honorary, military, and sovereign titles.\n\n**Takeaway:** In colonial treaties, AI models capture complex composite titles but require human oversight to prevent geographic displacement.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: Cohort Synthesis C: Andromeda and the 1752 Treaty", "questiontext": "<p>In Andromeda's 1752 Treaty, what critical hazard was observed when the LLM linked Chief Sachem Jean-Baptiste Cope to external databases?</p>", "generalfeedback": "<p>Meticulous auditing is necessary to catch hallucinated Q-identifiers or entity conflation for historical figures.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Risk of hallucinating non-existent Wikidata Q-numbers or conflating Jean-Baptiste Cope with other historical figures of the same name.</p>", "feedback": "<p>Correct. Linking historical Indigenous leaders requires meticulous verification to ensure models do not invent IDs or conflate distinct persons.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The LLM rewrote the treaty as a science fiction novel.</p>", "feedback": "<p>Incorrect. System prompts constrain the model to factual annotation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The LLM deleted the British Crown from world history.</p>", "feedback": "<p>Incorrect. Entity linking models do not alter world historical reality.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The treaty text turned into an image of a pirate ship.</p>", "feedback": "<p>Incorrect. Textual parsing yields structured text data, not cartoon images.</p>"}]}}, {"step": 15, "title": "The Four Discrepancy Classes in ENTITY_AUDIT.md", "content": "**The Four Discrepancy Classes in ENTITY_AUDIT.md**\n\nIn your audit report, classify every point of disagreement into our four-part course taxonomy:\n\n\n1. **Boundary Mismatches:** Differences in where an entity span starts or ends (e.g., dropping or keeping official titles).\n\n2. **Category Disagreements:** Classifying an entity as a place (`placeName`) versus an organization (`orgName`).\n\n3. **Authority Linking Errors:** Attaching an incorrect Wikidata QID, or inventing a fake URI where no record exists.\n\n4. **Historical Orthography Failures:** OOV spelling slips or archaic punctuation that caused a model to miss an entity.\n\nDiscuss at least three specific case studies in detail in your report, explaining what each error reveals about digital tools.\n\n**Vocabulary.** *Boundary Mismatch* — When two annotation passes identify the same entity but disagree on its starting or ending words. *Category Disagreement* — When annotators agree on a name span but disagree on its semantic entity class.\n\n**Takeaway:** Classifying errors into boundary, category, linking, and spelling failures provides a structured framework for critical reflection.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: The Four Discrepancy Classes in ENTITY_AUDIT.md", "questiontext": "<p>In `ENTITY_AUDIT.md`, what characterizes a 'Class 4: Factual Confabulation / Hallucinated Link' discrepancy?</p>", "generalfeedback": "<p>Class 4 discrepancies represent ungrounded hallucinations where models invent fake identifiers or link to wrong entities.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model correctly identifies a name span but invents a fictional URI or attributes the entity to a completely wrong historical individual.</p>", "feedback": "<p>Correct. Class 4 discrepancies represent ungrounded hallucinations that corrupt Linked Open Data integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A minor typo where a lowercase letter is capitalized.</p>", "feedback": "<p>Incorrect. Typographical capitalization is an orthographic discrepancy, not a factual hallucination.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer losing internet connectivity for two seconds.</p>", "feedback": "<p>Incorrect. Network disconnects are infrastructure glitches, not model semantic classifications.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A student submitting their assignment ten minutes early.</p>", "feedback": "<p>Incorrect. Submission timing has nothing to do with entity error taxonomy.</p>"}]}}, {"step": 16, "title": "Auditing Entity Links: Detecting Invented Q-Identifiers", "content": "**Auditing Entity Links: Detecting Invented Q-Identifiers**\n\nAuditing authority links requires active verification, not passive reading. You must test every URI generated by the model.\n\nOpen each link in your web browser. If the AI generated `ref=\"wikidata:Q7732\"`, verify that the link opens the Wikidata page for King Louis XVI. If the link returns an HTTP 404 error, or opens an article about a Swedish municipality, the model hallucinated.\n\nWhen you discover an invented identifier, document it prominently in your audit report. Explain why the model invented the link and how your manual ground truth protected your edition from data corruption.\n\n**Vocabulary.** *Link Verification* — Testing an automated hyperlink in a web browser to ensure it points to the correct historical entity. *HTTP 404* — The standard web error code indicating that a requested page or identifier does not exist.\n\n**Takeaway:** Editors must click and verify every automated authority link in a browser to catch hallucinated identifiers.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: Auditing Entity Links: Detecting Invented Q-Identifiers", "questiontext": "<p>What is the required verification procedure to audit an AI-generated Wikidata link (`@ref=\"wikidata:Q...\"`)?</p>", "generalfeedback": "<p>Every AI-generated authority URI must be actively verified against the live registry to detect invented Q-numbers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manually load the URL in a browser or query the Wikidata API to confirm the Q-number exists and refers to the exact historical entity.</p>", "feedback": "<p>Correct. Scholars never take AI links at face value; every URI must be verified against the live registry.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Assume that if the number starts with 'Q' it must be 100% accurate.</p>", "feedback": "<p>Incorrect. LLMs frequently generate syntactically valid but non-existent Q-numbers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ask the AI model a second time if it is telling the truth.</p>", "feedback": "<p>Incorrect. Models will confidently re-affirm their own hallucinations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Print the number on a piece of paper and bury it in the library.</p>", "feedback": "<p>Incorrect. Scholarly verification is digital, empirical, and transparent.</p>"}]}}, {"step": 17, "title": "The Fallacy of Pure Automation", "content": "**The Fallacy of Pure Automation**\n\nOur three-step comparative cycle leads to a vital scholarly conclusion: the fallacy of pure automation.\n\nSoftware companies often market automated language models as total replacements for human editorial labor. They claim that an algorithm can parse, tag, and publish historical archives in minutes without human supervision.\n\nOur experiments prove that pure automation produces silent, corrupting errors across historical collections. An un-audited algorithm quietly drops Indigenous place names, mislinks historical leaders to modern celebrities, and fabricates authority records. Speed without human verification produces digital noise, not scholarship.\n\n**Vocabulary.** *Pure Automation* — Relying entirely on software pipelines without human editorial verification. *Silent Error* — An automated mistake that passes computer checks without throwing an error, escaping notice.\n\n**Takeaway:** Relying entirely on automated tools produces silent errors that corrupt historical truth across archival collections.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: The Fallacy of Pure Automation", "questiontext": "<p>What is the 'Fallacy of Pure Automation' in computational textual scholarship?</p>", "generalfeedback": "<p>The Fallacy of Pure Automation assumes machine models can replace human historical expertise without rigorous critical review.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The mistaken belief that advanced AI models can completely replace human philological judgment and produce critical editions without expert review.</p>", "feedback": "<p>Correct. Automated models lack true historical consciousness and accountability; human scholarship remains indispensable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The belief that computers should never be used in university classrooms.</p>", "feedback": "<p>Incorrect. Digital tools are valuable partners in research when guided by human expertise.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The idea that steam engines are more efficient than modern electricity.</p>", "feedback": "<p>Incorrect. Industrial history is unrelated to textual automation ethics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The claim that all historical documents were written by automated robots.</p>", "feedback": "<p>Incorrect. Historical witnesses were authored by human historical agents.</p>"}]}}, {"step": 18, "title": "The Human-in-the-Loop Scholarly Model", "content": "**The Human-in-the-Loop Scholarly Model**\n\nIf pure automation fails, what is the proper role of computational tools in digital editing? The answer is the **Human-in-the-Loop** model.\n\nIn a human-in-the-loop workflow, computational tools and generative models act as rapid first-pass draft assistants. They scan thousands of words, extract initial candidate spans, and suggest possible authority links in seconds.\n\nThe human philologist remains in control. The human scholar establishes ground truth, writes editorial rules, audits machine predictions, resolves edge cases, and verifies historical truth. This model combines computational speed with gold-standard scholarly rigor.\n\n**Vocabulary.** *Human-in-the-Loop* — A workflow where automated systems generate draft annotations that are audited and verified by human experts. *First-Pass Assistant* — Using an algorithm to produce an initial draft that human editors refine.\n\n**Takeaway:** The human-in-the-loop model combines computer processing speed with human philological rigor and historical judgment.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: The Human-in-the-Loop Scholarly Model", "questiontext": "<p>What defines the 'Human-in-the-Loop' methodology championed in our course?</p>", "generalfeedback": "<p>The Human-in-the-Loop paradigm leverages computational speed while anchoring final editorial authority in human scholarship.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Automated tools propose scalable drafts, while trained human scholars audit, adjudicate, correct, and curate the authoritative edition.</p>", "feedback": "<p>Correct. Technology accelerates extraction, but human judgment remains the sovereign intellectual authority in critical editing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Human editors are trapped inside a computer server rack.</p>", "feedback": "<p>Incorrect. 'Human-in-the-loop' is an intellectual methodology, not physical confinement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Computers are completely banned and students must write exclusively with quill pens.</p>", "feedback": "<p>Incorrect. We utilize cutting-edge computational tools alongside rigorous human oversight.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Students must accept all computer outputs without question.</p>", "feedback": "<p>Incorrect. Blindly accepting computer outputs is the antithesis of critical scholarship.</p>"}]}}, {"step": 19, "title": "Assignment 9 Overview: The Named-Entity Markup Portfolio", "content": "**Assignment 9 Overview: The Named-Entity Markup Portfolio**\n\nToday's lab provides the materials for **Assignment: Module 9 (Named-Entity Markup)**, due tonight, Friday, November 6, by 11:00 PM.\n\nYour assignment brings together the work of all three meetings into a unified digital portfolio in your git repository.\n\nYour portfolio must contain:\n\n1. `ENTITY_POLICIES.md`: Your declared authority registries, granularity policy, and date rules.\n\n2. `ground_truth_entities_manual.xml`: Your 20-entity human gold standard (Tuesday).\n\n3. `ner_baseline.xml` and `NER_BENCHMARK.md`: Your deterministic SpaCy baseline and scores (Wednesday).\n\n4. `ground_truth_entities_ai.xml`: Your AI-assisted TEI markup (Friday).\n\n5. `ENTITY_AUDIT.md`: Your capstone three-way comparative audit report.\n\n**Vocabulary.** *Entity Portfolio* — The complete set of policy files, XML transcripts, and audit reports that document your entity markup. *Capstone Report* — The final synthesis report that evaluates all experimental findings across a module.\n\n**Takeaway:** Assignment 9 bundles your policy rules, manual XML, SpaCy baseline, AI markup, and three-way audit into a final portfolio.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Assignment 9 Overview: The Named-Entity Markup Portfolio", "questiontext": "<p>What core components comprise the completed Assignment 9 portfolio for Module 9?</p>", "generalfeedback": "<p>The Assignment 9 portfolio brings together manual ground truth, automated benchmarks, AI audits, and critical reflection.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>`ground_truth_entities_manual.xml`, `ner_baseline.xml`, `ai_entity_parser.py`, `ENTITY_POLICIES.md`, `NER_BENCHMARK.md`, and `ENTITY_AUDIT.md`.</p>", "feedback": "<p>Correct. The portfolio unites the three annotation tiers, policy documentation, benchmark reports, and the comparative synthesis.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 100-page creative fiction screenplay set on Mars.</p>", "feedback": "<p>Incorrect. Assignment 9 is a technical digital editing portfolio.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A collection of watercolor paintings of campus buildings.</p>", "feedback": "<p>Incorrect. The portfolio is a computational philology deliverable.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only a blank text file with the student's name.</p>", "feedback": "<p>Incorrect. Complete analytical code, data, and reflections are required.</p>"}]}}, {"step": 20, "title": "The 4 + 3 + 3 Grading Rubric (80 Moodle Points)", "content": "**The 4 + 3 + 3 Grading Rubric (80 Moodle Points)**\n\nAssignment 9 is evaluated on our standard course rubric: 4 + 3 + 3 raw points, scaled to 80 points in the Moodle gradebook.\n\nThe three dimensions evaluate your scholarship across the three-step cycle:\n\n* **Dimension 1: Manual Ground Truth Precision (4 pts / 32 moodle pts):** Accurate identification of twenty entities, correct category typing, valid date normalization, and rigorous authority linking (including verified absences).\n\n* **Dimension 2: TEI Entity Markup Validity (3 pts / 24 moodle pts):** Well-formed XML, schema conformity, correct attribute usage (`ref=`, `when=`), unique IDs, and span alignment across all files.\n\n* **Dimension 3: Comparative Error Analysis (3 pts / 24 moodle pts):** Mathematical accuracy scoring (Precision, Recall, F1), complete discrepancy matrix, and insightful 300–500 word methodological reflection.\n\n**Vocabulary.** *Rubric Dimension* — A specific grading criterion evaluating a core academic skill or technical deliverable. *Scale Weight* — Converting raw rubric points into course gradebook values.\n\n**Takeaway:** Assignment 9 is evaluated on manual precision (4 pts), XML validity (3 pts), and comparative error analysis (3 pts).\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: The 4 + 3 + 3 Grading Rubric (80 Moodle Points)", "questiontext": "<p>How are raw marks allocated across the three dimensions of the Assignment 9 grading rubric?</p>", "generalfeedback": "<p>The standard course rubric allocates 4 points to manual ground truth, 3 to XML validity, and 3 to comparative analysis.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>4 points for Manual Precision and Ground Truth, 3 points for TEI XML Validity, and 3 points for Comparative Error Analysis (scaled to 80 Moodle points).</p>", "feedback": "<p>Correct. The rubric balances philological rigor (4 pts), technical encoding validity (3 pts), and critical comparative analysis (3 pts).</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>10 points for typing speed and 0 points for accuracy.</p>", "feedback": "<p>Incorrect. Speed is not a grading criterion in digital humanities scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>1 point for each color used in the student's terminal window.</p>", "feedback": "<p>Incorrect. Grading assesses scholarly and computational craft, not terminal aesthetics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>100 points assigned randomly by a lottery machine.</p>", "feedback": "<p>Incorrect. Assessment follows our transparent, criteria-based rubric.</p>"}]}}, {"step": 21, "title": "Rubric Dimension 1: Manual Precision and Policy Rigor", "content": "**Rubric Dimension 1: Manual Precision and Policy Rigor**\n\nTo earn full marks on Dimension 1, your manual ground truth must reflect exemplary philological craft.\n\nEvery entity mention in your twenty-item table must be verified against historical evidence. Personal names must be checked against biographical dictionaries. Place names must be verified in gazetteers. Dates must be correctly calculated into ISO 8601 timestamps.\n\nYour `ENTITY_POLICIES.md` must clearly define your rules for compound names and regional registries. If an entity lacks a public record, you must document the search evidence to claim a verified absence. Fabricated links or unverified guesses lose marks on this dimension.\n\n**Vocabulary.** *Policy Rigor* — Strictly adhering to declared editorial rules across an entire document. *Search Evidence* — Documenting the databases and catalogues queried during authority research.\n\n**Takeaway:** Dimension 1 awards full marks for verified authority links, accurate date calculations, and documented absence policies.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Rubric Dimension 1: Manual Precision and Policy Rigor", "questiontext": "<p>What must a student demonstrate to earn the full 4 points on Rubric Dimension 1?</p>", "generalfeedback": "<p>Dimension 1 assesses the rigor, accuracy, and policy consistency of your manual ground truth.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A flawless 20-entity manual ground truth table with verified authority links (or documented absences) and an explicit, thorough ENTITY_POLICIES.md.</p>", "feedback": "<p>Correct. Dimension 1 rewards philological accuracy, exhaustive authority searches, and clear editorial policy formulation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Writing the entire report in rhyming poetry.</p>", "feedback": "<p>Incorrect. Scholarly documentation requires clear academic prose.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Guessing random URLs for entities without verifying them.</p>", "feedback": "<p>Incorrect. Unverified URLs result in mark deductions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Including zero people or places in the report.</p>", "feedback": "<p>Incorrect. Identifying and encoding core entities is required.</p>"}]}}, {"step": 22, "title": "Rubric Dimension 2: TEI XML Validity and Token Alignment", "content": "**Rubric Dimension 2: TEI XML Validity and Token Alignment**\n\nDimension 2 evaluates your technical XML craft and schema compliance.\n\nYour XML files (`ground_truth_entities_manual.xml` and `ground_truth_entities_ai.xml`) must validate to zero errors against the course schema in VS Code. All tags must close properly, and element names must match TEI P5 Chapter 13.\n\nCrucially, your entity tags must respect token boundaries. Leading articles should remain outside the tags unless part of a proper title. Punctuation must not be accidentally swallowed inside place or person tags. Clean, valid XML earns full marks on this dimension.\n\n**Vocabulary.** *Schema Compliance* — An XML document that satisfies all syntax and structural constraints of its schema. *Punctuation Hygiene* — Keeping commas, periods, and quotation marks outside entity tags.\n\n**Takeaway:** Dimension 2 awards full marks for schema-valid XML, clean token boundaries, and proper attribute syntax.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Rubric Dimension 2: TEI XML Validity and Token Alignment", "questiontext": "<p>What is required to achieve full marks on Rubric Dimension 2 (TEI XML Validity)?</p>", "generalfeedback": "<p>Dimension 2 requires strict TEI P5 validity, well-formed tags, valid attributes, and consistent token alignment.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Strict TEI P5 schema compliance, well-formed syntax, valid @when ISO dates, proper @ref URIs, and preserved token alignment across all versions.</p>", "feedback": "<p>Correct. Dimension 2 evaluates structural XML validity, schema conformance, and precise token boundary maintenance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Submitting an unformatted text file with broken HTML tags.</p>", "feedback": "<p>Incorrect. Invalid markup violates the core technical standards of the dimension.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Renaming all TEI tags to custom made-up words.</p>", "feedback": "<p>Incorrect. Markup must conform strictly to TEI P5 guidelines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Converting all XML files into binary video files.</p>", "feedback": "<p>Incorrect. TEI deliverables must be valid, well-formed XML.</p>"}]}}, {"step": 23, "title": "Rubric Dimension 3: Comparative Analysis and Critical Synthesis", "content": "**Rubric Dimension 3: Comparative Analysis and Critical Synthesis**\n\nDimension 3 evaluates your critical reflection and computational understanding.\n\nYour capstone report, `ENTITY_AUDIT.md`, must present mathematically accurate Precision, Recall, and F1 scores for both SpaCy and the AI model. Your discrepancy matrix must categorize every disagreement cleanly.\n\nThe core of Dimension 3 is your 300–500 word reflection. You must explain *why* the tools behaved differently. Discuss what your findings reveal about the limits of automation and the necessity of human ground truth in digital textual scholarship.\n\n**Vocabulary.** *Critical Synthesis* — Combining experimental data, technical observations, and historical context into an insightful essay. *Methodological Reflection* — Analyzing how digital tools shape our understanding of historical evidence.\n\n**Takeaway:** Dimension 3 awards full marks for mathematically sound scoring, clear error diagnosis, and insightful reflection.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Rubric Dimension 3: Comparative Analysis and Critical Synthesis", "questiontext": "<p>What distinguishes an outstanding submission on Rubric Dimension 3 (Comparative Analysis)?</p>", "generalfeedback": "<p>Dimension 3 demands deep critical reflection, empirical metric calculations, and insightful failure mode analysis.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A rigorous 300–500 word reflection analyzing why tools failed, evaluating trade-offs, and calculating accurate mathematical metrics (P/R/F1).</p>", "feedback": "<p>Correct. High marks require insightful philological reflection on computational failure modes and precise empirical evaluation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Simply stating 'the computer worked fine' without providing data or error analysis.</p>", "feedback": "<p>Incorrect. Superficial claims without evidence receive minimal marks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Copying Wikipedia articles about artificial intelligence word for word.</p>", "feedback": "<p>Incorrect. Academic integrity requires original analysis of the student's own experiments.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Claiming that human beings will never need to read books again.</p>", "feedback": "<p>Incorrect. Analysis must engage critically with the human-in-the-loop paradigm.</p>"}]}}, {"step": 24, "title": "Common Pitfalls to Avoid in Assignment 9", "content": "**Common Pitfalls to Avoid in Assignment 9**\n\nReview your portfolio against these four common student traps before submitting:\n\n\n1. **Submitting Broken XML:** Always run schema validation in VS Code before committing. An unclosed tag or invalid attribute breaks the entire file.\n\n2. **Missing Authority Links:** Every entity tag must carry an authoritative `@ref` attribute or point to a local header record.\n\n3. **Empty Error Diagnoses:** In your discrepancy table, do not simply write \"machine was wrong.\" Explain *why* it failed (e.g., OOV spelling, title truncation, type confusion).\n\n4. **Vague Reflection:** Avoid generic statements like \"AI is very smart but makes mistakes.\" Ground your essay in specific words from your project witness.\n\n**Vocabulary.** *Submission Audit* — A final systematic review of all project files against rubric requirements before submission. *Vague Critique* — Unsubstantiated opinions that lack specific textual or empirical evidence.\n\n**Takeaway:** Avoid common pitfalls by validating XML, checking authority links, and writing specific error diagnoses.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Common Pitfalls to Avoid in Assignment 9", "questiontext": "<p>Which of the following is a critical pitfall that will lose marks in Assignment 9?</p>", "generalfeedback": "<p>Failing to verify AI-generated authority links is a major pitfall that corrupts linked data integrity.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Accepting AI-generated Wikidata Q-numbers without testing whether the links resolve to the real historical person.</p>", "feedback": "<p>Correct. Trusting unverified links allows hallucinated identifiers into your edition, directly violating course policy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Formatting your code cleanly and adding informative comments.</p>", "feedback": "<p>Clean, commented code is encouraged and rewarded.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Citing peer-reviewed academic literature in your reflection.</p>", "feedback": "<p>Scholarly citation is expected and rewarded.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Committing your work to git with clear commit messages.</p>", "feedback": "<p>Version control discipline is a required core competency.</p>"}]}}, {"step": 25, "title": "Authoring the Methodological Reflection in ENTITY_AUDIT.md", "content": "**Authoring the Methodological Reflection in ENTITY_AUDIT.md**\n\nYour reflection in `ENTITY_AUDIT.md` should read like a published scholarly note in digital humanities.\n\nStructure your essay in three short, focused paragraphs:\n\n1. **The Machine's Blind Spots:** Discuss where automated models stumbled on your specific document (e.g., archaic French imperfect verbs, Maritime nicknames, or Indigenous toponyms).\n\n2. **The Power and Peril of AI:** Contrast SpaCy's rigid sequence modeling with the LLM's fluent contextual understanding, highlighting any subtle hallucinations you caught.\n\n3. **The Role of the Digital Editor:** Conclude with a strong argument defending the irreplaceable role of human scholarship in the era of artificial intelligence.\n\n**Vocabulary.** *Scholarly Note* — A concise, formal academic essay discussing a specific methodological or historical problem. *Editorial Defense* — An evidence-based argument articulating the value of human historical scholarship.\n\n**Takeaway:** A well-structured three-paragraph reflection articulates the methodological lessons of your three-way entity audit.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Authoring the Methodological Reflection in ENTITY_AUDIT.md", "questiontext": "<p>What should the tone and structure of your reflection in `ENTITY_AUDIT.md` resemble?</p>", "generalfeedback": "<p>The methodological reflection in ENTITY_AUDIT.md should read as a rigorous, peer-reviewed research note.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A professional peer-reviewed research note in computational philology, combining empirical metrics with deep historical insight.</p>", "feedback": "<p>Correct. Your reflection should read like an academic contribution, articulating why specific linguistic structures resist automation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An angry online product review complaining about customer service.</p>", "feedback": "<p>Incorrect. Scholarly reflections maintain professional, academic discourse.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A casual text message full of abbreviations and emojis.</p>", "feedback": "<p>Incorrect. Course policy strictly prohibits informal text speak and emojis.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A sales pitch trying to convince people to buy a new smartphone.</p>", "feedback": "<p>Incorrect. Scholarly documentation is analytical, objective, and evidence-based.</p>"}]}}, {"step": 26, "title": "Packaging Your Repository for Submission", "content": "**Packaging Your Repository for Submission**\n\nBefore submitting your assignment on Moodle, verify that your project repository is completely organized and clean.\n\nEnsure that all five core files reside in their proper locations on the `main` branch. Open your terminal in VS Code and verify git status:\n```bash\ngit status\n```\n\nYour working tree should report: `nothing to commit, working tree clean`. If any uncommitted changes appear, stage and commit them with a descriptive commit message. A tidy repository ensures that instructors can inspect your code and XML without friction.\n\n**Vocabulary.** *Repository Hygiene* — Maintaining clean, organized project folders without stray temporary files or uncommitted changes. *Descriptive Commit* — A git commit message that explains exactly what changes were made and why.\n\n**Takeaway:** Verifying that your git repository is clean and properly organized ensures a smooth submission process on Moodle.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Packaging Your Repository for Submission", "questiontext": "<p>Before submitting Assignment 9, what directory structure must be verified in your course repository?</p>", "generalfeedback": "<p>Repository cleanliness and correct file placement under Module 9 ensure reproducible project grading.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>All files must be cleanly organized under `src/modules/Module_09_Named_Entities/` and committed to your git branch.</p>", "feedback": "<p>Correct. Orderly project organization ensures your build scripts and audit trails are fully reproducible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All files must be scattered randomly across the root drive of the computer.</p>", "feedback": "<p>Incorrect. Projects must follow structured repository conventions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All files must be compressed into ten password-protected ZIP archives.</p>", "feedback": "<p>Incorrect. Repositories should remain transparent, uncorrupted, and directly accessible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All files must be deleted immediately before grading begins.</p>", "feedback": "<p>Incorrect. Deleting files prevents evaluation and results in zero marks.</p>"}]}}, {"step": 27, "title": "Submitting on Moodle: The Assignment Form", "content": "**Submitting on Moodle: The Assignment Form**\n\nAssignment 9 is submitted through the official Moodle assignment activity: **Assignment: Module 9 (Named-Entity Markup)**.\n\nThe assignment activity accepts two submission methods:\n\n1. **Repository Link:** A direct web link to your public or private GitHub repository branch.\n\n2. **ZIP Bundle:** A compressed archive containing your five project files (`ENTITY_POLICIES.md`, manual XML, baseline XML, AI XML, and `ENTITY_AUDIT.md`).\n\nReview your submission in the Moodle preview before clicking final submit. The assignment deadline is tonight, Friday, November 6, at 11:00 PM.\n\n**Vocabulary.** *Online Submission* — Submitting digital project links or compressed archives directly through a learning management system. *Submission Due Date* — The formal deadline by which student work must be recorded in the system.\n\n**Takeaway:** Submit your repository link or ZIP bundle through Moodle Assignment 9 before tonight's 11:00 PM deadline.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Submitting on Moodle: The Assignment Form", "questiontext": "<p>When is Assignment 9 due, and where is it submitted?</p>", "generalfeedback": "<p>Assignment 9 is due Friday, November 6, 2026, by 11:00 PM on Moodle.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Friday, November 6, 2026, by 11:00 PM, submitted through the official Moodle Assignment activity.</p>", "feedback": "<p>Correct. As scheduled in the syllabus, Assignment 9 is due Friday night at 11:00 PM via Moodle.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Three weeks after the semester ends, via postal letter.</p>", "feedback": "<p>Incorrect. Deadlines are fixed in the course syllabus.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Submitted via private WhatsApp message to another student.</p>", "feedback": "<p>Incorrect. All official coursework must be submitted through Moodle.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Assignment 9 is optional and has no deadline.</p>", "feedback": "<p>Incorrect. Assignment 9 is a required credit milestone in the course.</p>"}]}}, {"step": 28, "title": "The Bigger Picture: From Words to Historical Networks", "content": "**The Bigger Picture: From Words to Historical Networks**\n\nTake a moment to appreciate how far your digital edition has developed.\n\nIn Week 4, your text was a raw diplomatic transcription. In Week 6, you normalized its spelling. In Week 8, you gave each word a part of speech and dictionary lemma. Today, in Week 9, you connected your text to the global web of historical people, places, and organizations.\n\nYour edition is no longer an isolated document sitting on a hard drive. It is an interconnected node in global historical scholarship. Researchers studying Revolutionary Paris, Maritime folk art, or eighteenth-century Mi'kmaw diplomacy can find your document and link their data to yours.\n\n**Vocabulary.** *Interconnected Node* — A digital edition whose authority links connect it directly into global semantic networks. *Scholarly Network* — The worldwide web of linked open data connecting archives, libraries, and museums.\n\n**Takeaway:** Entity markup transforms an isolated transcription into an interconnected node within global scholarly networks.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: The Bigger Picture: From Words to Historical Networks", "questiontext": "<p>How does named entity markup prepare a digital corpus for future network analysis and historical GIS mapping?</p>", "generalfeedback": "<p>Entity markup transforms textual narratives into queryable knowledge graphs for historical network and spatial analysis.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Structured entities provide the nodes and edges required to visualize social interaction networks and plot geographical trajectories over space and time.</p>", "feedback": "<p>Correct. Linked entities transform static text into interconnected knowledge graphs, enabling network science and spatial humanities.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts text into radio waves broadcast into deep space.</p>", "feedback": "<p>Incorrect. Entity data powers digital humanities visualizations, not extraterrestrial broadcasts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically prints 3D plastic statues of historical figures.</p>", "feedback": "<p>Incorrect. Spatial and network analysis creates digital maps and graphs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all books from university library shelves.</p>", "feedback": "<p>Incorrect. Digital humanities enhances and contextualizes physical archival collections.</p>"}]}},
