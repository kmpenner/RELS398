rained model is fine-tuned on this ground truth dataset for several epochs. The network adjusts its internal weights to recognize the specific letterforms, ink characteristics, and layout quirks of the target author.\n- **Evaluation and Deployment:** The fine-tuned model is evaluated on unseen test pages; once it achieves low character error rates (CER) and high boundary intersection-over-union (IoU), it is deployed across the remaining hundreds of archival pages in the collection.\n\n**Takeaway:** Fine-tuning pre-trained foundation models on small, curated ground-truth samples (10-20 pages) adapts vision algorithms to specific historical hands and print styles.\n\n---", "image_b64": null, "question": {"name": "23 Question: Fine-Tuning Vision Models on Historical Hands and Document Types", "questiontext": "<p>Why is 'transfer learning' (fine-tuning a pre-trained model on 10–20 curated pages) preferred over training a document vision model from scratch?</p>", "generalfeedback": "<p>Fine-tuning pre-trained foundation models on small, curated ground-truth samples (10-20 pages) adapts vision algorithms to specific historical hands and print styles.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Training from scratch requires hundreds of thousands of annotated historical images, whereas fine-tuning leverages existing general feature representations efficiently.</p>", "feedback": "<p>Correct. Fine-tuning adapts rich pre-trained visual filters to specialized historical hands using only a small, feasible scholarly ground-truth dataset.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because training from scratch is prohibited by international software copyright treaties.</p>", "feedback": "<p>Incorrect. Training from scratch is legally permitted, but practically infeasible due to data and compute requirements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because pre-trained models can only be run on commercial mainframe computers.</p>", "feedback": "<p>Incorrect. Fine-tuned models run on standard modern desktop computers and laptops with GPUs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because fine-tuning permanently deletes the model's ability to read English words.</p>", "feedback": "<p>Incorrect. Transfer learning retains general character and language understanding while specializing.</p>"}]}}, {"step": 24, "title": "Active Learning and Human-in-the-Loop: Correcting AI Predictions Iteratively", "content": "**Active Learning and Human-in-the-Loop: Correcting AI Predictions Iteratively**\n\nThe most effective scholarly AI workflows do not treat artificial intelligence as an autonomous, hands-off black box. Instead, they implement an **Active Learning** framework with a **Human-in-the-Loop (HITL)** architecture.\n\nThe active learning lifecycle operates as an iterative feedback loop:\n\n- **Initial Batch Prediction:** A baseline model predicts layout zones and text baselines for a batch of newly digitized documents.\n- **Confidence Sorting:** The system evaluates its own predictions, ranking them by mathematical confidence scores. Pages with ambiguous layouts or low-confidence baselines are flagged and pushed to the top of the review queue.\n- **Human Editorial Correction:** The scholar opens an interactive review interface (such as eScriptorium, Transkribus, or a custom web dashboard) and rapidly corrects misaligned baselines, adjusts clipped bounding boxes, and fixes reading order connections.\n- **Incremental Retraining:** The corrected pages are added to the training set, and the model undergoes incremental fine-tuning. With each review cycle, the model becomes more accurate, requiring fewer human corrections on subsequent batches.\n\nThis collaborative dynamic harnesses the high processing speed of AI while anchoring editorial authority firmly in human scholarly expertise.\n\n**Takeaway:** Active learning implements an iterative human-in-the-loop workflow where scholars correct low-confidence AI predictions, continually improving model accuracy.\n\n---", "image_b64": null, "question": {"name": "24 Question: Active Learning and Human-in-the-Loop: Correcting AI Predictions Iteratively", "questiontext": "<p>How does an Active Learning framework optimize the human editor's time during a large-scale transcription and layout project?</p>", "generalfeedback": "<p>Active learning implements an iterative human-in-the-loop workflow where scholars correct low-confidence AI predictions, continually improving model accuracy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The model ranks predictions by uncertainty, presenting only the most ambiguous, low-confidence pages for human review while retraining incrementally on corrections.</p>", "feedback": "<p>Correct. Active learning focuses human expertise strictly on difficult or error-prone pages, maximizing model improvement with minimal human effort.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces human scholars with fully autonomous AI agents that publish editions without human review.</p>", "feedback": "<p>Incorrect. Active learning is fundamentally built on human-in-the-loop validation and governance.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires the human editor to inspect every single pixel on every page using an analog magnifying glass.</p>", "feedback": "<p>Incorrect. Active learning avoids redundant manual inspection by triaging high-confidence predictions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces the editor to write 100 lines of assembly code before opening each image.</p>", "feedback": "<p>Incorrect. Active learning uses user-friendly graphical interfaces (like eScriptorium or Transkribus).</p>"}]}}, {"step": 25, "title": "Confidence Scoring and Error Detection: When Does the Vision Model Fail?", "content": "**Confidence Scoring and Error Detection: When Does the Vision Model Fail?**\n\nA critical methodological requirement for academic digital editions is knowing when an automated algorithm's output can be trusted and when it must be flagged for human audit. Deep learning vision models provide internal **confidence scores** (softmax probabilities between 0.0 and 1.0) for every predicted bounding box, baseline, and recognized character.\n\nCommon failure modes in historical document vision include:\n\n- **Gutter Shadow Hallucinations:** In bound codices or thick pamphlets, deep shadows in the central gutter can be misclassified as dark text blocks or column dividers.\n- **Stain and Foxing False Positives:** Dark water stains, iron gall ink acid burnouts, or grease spots frequently trigger false-positive zone detections, causing the model to draw boxes around blank, discolored paper.\n- **Wavy Baseline Drift:** When text curves dramatically across distorted parchment or warped paper leaves, models with insufficient spatial attention may drop the baseline mid-sentence or jump to an adjacent line.\n- **Automated Triage Pipelines:** Editors write threshold validation scripts: any predicted zone with a confidence score below a specified cutoff (e.g., 0.85) is automatically tagged with `@cert=\"low\"` in TEI XML and routed to a dedicated human review queue before publication.\n\n**Takeaway:** Confidence scoring enables automated quality triage, flagging ambiguous zones, gutter shadows, and false positives for mandatory human editorial review.\n\n---", "image_b64": null, "question": {"name": "25 Question: Confidence Scoring and Error Detection: When Does the Vision Model Fail?", "questiontext": "<p>What automated quality assurance mechanism can digital edition pipelines implement using model confidence scores?</p>", "generalfeedback": "<p>Confidence scoring enables automated quality triage, flagging ambiguous zones, gutter shadows, and false positives for mandatory human editorial review.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Triage pipelines that automatically attach `@cert='low'` to predicted zones below a probability threshold and route them to a human editorial audit queue.</p>", "feedback": "<p>Correct. Confidence thresholds allow pipelines to isolate uncertain predictions for mandatory human review before publication.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Pipelines that automatically delete any document page containing difficult handwriting.</p>", "feedback": "<p>Incorrect. Difficult pages must be preserved and transcribed carefully by human scholars, never deleted.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Algorithms that increase the brightness of the computer screen whenever confidence is low.</p>", "feedback": "<p>Incorrect. Screen brightness does not solve algorithmic layout uncertainty.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scripts that penalize the student's grade if the machine learning model makes an inference error.</p>", "feedback": "<p>Incorrect. Model errors are normal computational probabilities, not student errors.</p>"}]}}, {"step": 26, "title": "Ethical and Scholarly Integrity: The Risk of Generative Hallucination in Archival Images", "content": "**Ethical and Scholarly Integrity: The Risk of Generative Hallucination in Archival Images**\n\nThe rapid emergence of generative artificial intelligence (including diffusion models and generative adversarial networks) introduces profound ethical hazards for historical disciplines. While generative models can remove stains, restore missing parchment fragments, or synthesize photorealistic text, their use in documentary editing threatens the core foundation of scholarly truth.\n\nKey ethical principles for AI imaging in historical scholarship:\n\n- **The Prohibition on Generative Reconstruction:** Generative models must **never** be used to 'repair' torn paper or synthesize missing ink strokes in published archival facsimiles. To publish a generative reconstruction as a primary surrogate is to commit documentary falsification.\n- **Analytical Derivatives vs. Master Records:** AI enhancements (such as contrast boosting, bleed-through removal, or color classification) must always be categorized as *analytical derivatives* or *interpretive layers*. The unaltered raw camera capture must remain permanently accessible as the primary witness.\n- **Transparency and Methodological Disclosure:** Every digital edition that employs AI image processing or layout analysis must include an explicit methodology statement in the TEI `<teiHeader>` (`<encodingDesc>`), disclosing the exact models, software versions, training datasets, and post-processing scripts utilized.\n\n**Takeaway:** Scholarly integrity strictly forbids generative fabrication of missing historical evidence; AI derivatives must be transparently disclosed, and raw masters must remain accessible.\n\n---", "image_b64": null, "question": {"name": "26 Question: Ethical and Scholarly Integrity: The Risk of Generative Hallucination in Archival Images", "questiontext": "<p>Why is the use of generative AI to digitally 'fill in' missing paper fragments or restore faded text considered documentary falsification in scholarly editing?</p>", "generalfeedback": "<p>Scholarly integrity strictly forbids generative fabrication of missing historical evidence; AI derivatives must be transparently disclosed, and raw masters must remain accessible.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Generative models fabricate statistically probable content rather than recovering historical reality, presenting synthetic invention as authentic documentary evidence.</p>", "feedback": "<p>Correct. Fabricating missing historical text or paper violates scholarly ethics; editions must document lacunae truthfully.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because generative models use too much internet bandwidth to be downloaded.</p>", "feedback": "<p>Incorrect. The ethical objection is epistemological and documentary, not bandwidth-related.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because all generative AI models are legally owned by foreign governments.</p>", "feedback": "<p>Incorrect. The prohibition is an ethical scholarly standard, independent of foreign legal claims.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because historical documents are legally required to remain illegible.</p>", "feedback": "<p>Incorrect. Editions strive for legibility, but only through verifiable historical evidence and transparent editorial argumentation.</p>"}]}}, {"step": 27, "title": "The Black Box Problem: Explainability and Reproducibility in AI Imaging Workflows", "content": "**The Black Box Problem: Explainability and Reproducibility in AI Imaging Workflows**\n\nIn Lesson 3.2, we emphasized that deterministic tools like ImageMagick and libvips are fully reproducible: the exact same bash script executed on the same TIFF master will yield the exact same pixel matrix on any computer, indefinitely. Deep neural networks, however, introduce the **black box problem**: complex models contain hundreds of millions of parameters whose internal decision pathways cannot be fully scrutinized or explained.\n\nFurthermore, AI workflows face severe **reproducibility crises**:\n\n- **Model Drift and Deprecation:** Commercial cloud APIs (such as closed multimodal LLM endpoints) are frequently updated or deprecated by vendors without notice. A script calling a proprietary cloud model in 2026 may produce completely different bounding boxes or fail entirely when executed in 2028.\n- **Hardware and Dependency Variations:** Differences in CUDA drivers, floating-point GPU architectures, or deep learning library versions (e.g., PyTorch) can introduce subtle variations in model inference.\n- **Scholarly Countermeasures:** To ensure long-term reproducibility, academic projects should:\n  - Prefer open-weight models (such as open-source Hugging Face models or Kraken weights) that can be archived locally.\n  - Pin all software dependencies in containerized environments (Docker or Singularity).\n  - Archive the exact model weights, random seeds, and configuration parameters alongside the digital edition.\n\n**Takeaway:** The black box nature of neural networks threatens scholarly reproducibility; editors must prioritize open-weight models, containerized pipelines, and archived model checkpoints.\n\n---", "image_b64": null, "question": {"name": "27 Question: The Black Box Problem: Explainability and Reproducibility in AI Imaging Workflows", "questiontext": "<p>Why does reliance on closed, third-party commercial cloud APIs threaten the long-term reproducibility of academic digital editions?</p>", "generalfeedback": "<p>The black box nature of neural networks threatens scholarly reproducibility; editors must prioritize open-weight models, containerized pipelines, and archived model checkpoints.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Cloud vendors frequently modify, update, or deprecate models without notice, meaning identical code run two years later will produce different, unreproducible results.</p>", "feedback": "<p>Correct. Proprietary API drift breaks scientific reproducibility; academic editions should prioritize archived, open-weight models.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because commercial cloud APIs only operate during normal North American business hours.</p>", "feedback": "<p>Incorrect. Cloud APIs run continuously, but their underlying model weights change without user control.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because cloud models automatically convert all image files into proprietary vector graphics.</p>", "feedback": "<p>Incorrect. Cloud models output standard data structures, but their inference algorithms are unstable over time.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because academic libraries refuse to allow computers connected to the internet.</p>", "feedback": "<p>Incorrect. Digital editions rely heavily on the internet; stability and open archiving ensure long-term preservation.</p>"}]}}, {"step": 28, "title": "Integrating AI Pipelines with Open-Source Deterministic Tools", "content": "**Integrating AI Pipelines with Open-Source Deterministic Tools**\n\nAI does not operate in isolation; the most robust and efficient digital imaging workflows combine the perceptual intelligence of deep learning with the high-speed mathematical rigor of deterministic command-line utilities.\n\nA production-grade hybrid imaging pipeline leverages the complementary strengths of both paradigms:\n\n- **Pre-Processing with Deterministic Tools:** Raw camera files are normalized, calibrated against ICC profiles, and deskewed using deterministic tools like ImageMagick and libvips before being fed to AI vision models. Feeding clean, uniform images to neural networks drastically reduces inference errors.\n- **AI-Powered Perception and Coordinate Generation:** The normalized images are processed by vision models to detect text baselines, identify marginal stamps, extract bounding boxes, and align transcriptions.\n- **Deterministic Post-Processing and Tiling:** The detected coordinates are passed to `vips` to crop high-resolution regional derivatives or generate deep-zoom pyramidal TIFFs for IIIF image servers.\n- **Glue Code in Python:** A lightweight Python controller orchestrates the entire flow, executing shell commands, passing JSON coordinate payloads between tools, and validating final outputs against XML schemas.\n\nThis hybrid architecture achieves maximum computational performance, absolute mathematical precision, and semantic intelligence.\n\n**Takeaway:** Production imaging combines deterministic tools (ImageMagick/libvips) for pre-processing and tiling with deep learning models for semantic perception and zone extraction.\n\n---", "image_b64": null, "question": {"name": "28 Question: Integrating AI Pipelines with Open-Source Deterministic Tools", "questiontext": "<p>In a production-grade digital imaging workflow, why are deterministic tools (like libvips and ImageMagick) used in tandem with AI models rather than relying on AI alone?</p>", "generalfeedback": "<p>Production imaging combines deterministic tools (ImageMagick/libvips) for pre-processing and tiling with deep learning models for semantic perception and zone extraction.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Deterministic tools provide ultra-fast, mathematically exact image pre-processing, ICC color calibration, and deep-zoom tiling that neural networks cannot perform efficiently.</p>", "feedback": "<p>Correct. Hybrid pipelines pair the mathematical precision and speed of deterministic utilities with the semantic perceptual intelligence of deep learning.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models are incapable of opening images larger than 100 pixels wide.</p>", "feedback": "<p>Incorrect. AI models can process large images, but tiling and color mathematics are far more efficiently handled by tools like libvips.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because ImageMagick is owned by the United Nations Educational, Scientific and Cultural Organization.</p>", "feedback": "<p>Incorrect. ImageMagick is an independent open-source software project.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because deterministic tools automatically translate 18th-century French legal vocabulary.</p>", "feedback": "<p>Incorrect. Deterministic tools manipulate pixel arrays; language interpretation is handled by human editors or language models.</p>"}]}}, {"step": 29, "title": "Building an End-to-End AI Imaging Pipeline: From Raw Scans to Validated TEI/IIIF", "content": "**Building an End-to-End AI Imaging Pipeline: From Raw Scans to Validated TEI/IIIF**\n\nTo synthesize all the concepts mastered across this module, let us trace the complete end-to-end journey of an archival document through a state-of-the-art digital imaging pipeline:\n\n- **1. Ingest and Quality Audit:** Raw camera captures are validated for focus and completeness using automated quality control scripts (Section 14).\n- **2. Deterministic Normalization:** Images are calibrated against color targets and converted to archival 16-bit TIFF masters with embedded ICC profiles.\n- **3. Smart Sorting and Renaming:** Unsupervised clustering and folio-recognition models sort files and apply standardized archival filenames (Section 12).\n- **4. Document Layout Analysis:** Semantic segmentation models identify text bodies, running headers, seals, and marginalia, generating high-precision baseline polylines (Sections 05-06).\n- **5. Forced Text-Image Alignment:** Pre-existing human transcriptions are aligned with visual ink strokes using CTC forced alignment (Section 18).\n- **6. TEI Facsimile Construction:** Python automation scripts assemble page dimensions, `<surface>` containers, and `<zone>` coordinates into schema-valid TEI XML, injecting `@facs` pointers into the transcribed body (Sections 19-20).\n- **7. IIIF Derivative Compilation:** Libvips generates pyramidal tiled TIFFs, and metadata scripts emit IIIF Presentation Manifests and W3C Web Annotation lists (Sections 22, 28).\n- **8. Human Verification and Publication:** The digital edition is deployed to interactive viewers (Mirador / TEI Publisher) for final editorial audit and public scholarly research.\n\n**Takeaway:** The end-to-end imaging pipeline automates ingestion, normalization, segmentation, alignment, TEI authoring, and IIIF compilation while preserving human verification gates.\n\n---", "image_b64": null, "question": {"name": "29 Question: Building an End-to-End AI Imaging Pipeline: From Raw Scans to Validated TEI/IIIF", "questiontext": "<p>In an end-to-end digital imaging pipeline, at what point does human editorial verification take place?</p>", "generalfeedback": "<p>The end-to-end imaging pipeline automates ingestion, normalization, segmentation, alignment, TEI authoring, and IIIF compilation while preserving human verification gates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>At critical quality gates throughout the pipeline, particularly during layout triage, reading-order verification, and final digital edition approval.</p>", "feedback": "<p>Correct. Scholarly pipelines incorporate deliberate human-in-the-loop verification gates rather than operating as unverified autonomous loops.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only before the photograph is taken; once digitized, human editors are locked out of the software.</p>", "feedback": "<p>Incorrect. Human editors actively audit and refine predictions throughout the digital lifecycle.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Never; modern digital humanities standards forbid human scholars from modifying computational outputs.</p>", "feedback": "<p>Incorrect. Human scholarly judgment is the ultimate authority in critical editing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Only after the digital edition has been printed onto microfilm and buried in an underground vault.</p>", "feedback": "<p>Incorrect. Review occurs interactively during digital preparation and before publication.</p>"}]}}, {"step": 30, "title": "The Methodological Triad: Synthesizing Manual, Deterministic, and AI-Assisted Imaging", "content": "**The Methodological Triad: Synthesizing Manual, Deterministic, and AI-Assisted Imaging**\n\nAs we conclude Topic 3: IIIF Imaging, we can now appreciate the profound methodological synergy uniting the three lessons of this comparative cycle:\n\n- **Lesson 3.1 (Manual):** Taught us the foundational architecture of the TEI Guidelines—the conceptual rigor of `<facsimile>`, `<surface>`, and `<zone>`—and the physical realities of camera optics, cradles, raking light, and multispectral imaging. Without understanding physical materiality and spatial coordinates, an editor cannot evaluate digital representations.\n- **Lesson 3.2 (Deterministic):** Introduced us to the open protocols of the International Image Interoperability Framework (IIIF) and the mathematical transparency of open-source command-line tools like GIMP, ImageMagick, and libvips. Deterministic algorithms guarantee verifiable, reproducible pixel transformations and efficient pyramidal deep zoom.\n- **Lesson 3.3 (AI-Assisted):** Demonstrated how statistical computer vision models overcome the manual labor bottleneck by automating layout segmentation, baseline tracing, image naming, and text-image alignment under human-in-the-loop supervision.\n\nNeither manual tracing, deterministic scripting, nor artificial intelligence is sufficient on its own. The modern digital humanist operates at the intersection of all three: using manual expertise to define standards and verify truth, deterministic tools to guarantee reproducibility and speed, and AI models to scale deep scholarship across the world's documentary heritage.\n\n**Takeaway:** The complete digital edition synthesizes manual encoding standards, deterministic mathematical reproducibility, and AI-driven perceptual automation under human scholarly governance.", "image_b64": null, "question": {"name": "30 Question: The Methodological Triad: Synthesizing Manual, Deterministic, and AI-Assisted Imaging", "questiontext": "<p>What is the defining methodological strength of synthesizing manual encoding, deterministic image processing, and AI-assisted automation?</p>", "generalfeedback": "<p>The complete digital edition synthesizes manual encoding standards, deterministic mathematical reproducibility, and AI-driven perceptual automation under human scholarly governance.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manual expertise guarantees scholarly standards and truth; deterministic tools guarantee mathematical reproducibility; AI models provide the speed to scale across large corpuses.</p>", "feedback": "<p>Correct. Each paradigm addresses the weaknesses of the others, creating a balanced, verifiable, and scalable digital scholarly practice.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It guarantees that the resulting digital edition can only be read on a single brand of tablet computer.</p>", "feedback": "<p>Incorrect. Open standards (TEI and IIIF) guarantee universal, platform-independent accessibility.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It eliminates the need for physical archives, allowing universities to discard original manuscripts.</p>", "feedback": "<p>Incorrect. Digital editions complement and celebrate physical manuscripts; they never justify deaccessioning artifacts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves that historical manuscripts can be completely understood without reading their text.</p>", "feedback": "<p>Incorrect. Digital methods serve to deepen and enrich our reading of historical texts.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
