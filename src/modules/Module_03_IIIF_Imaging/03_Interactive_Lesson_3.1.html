are working environments where sensitive historical artifacts are exposed to active lighting and handling. Archives enforce strict environmental parameters to prevent physical degradation during the imaging process.\n\n**Relative Humidity (RH) and Temperature:**\nOrganic materials like parchment, paper, and leather are **hygroscopic**: they absorb and release moisture in equilibrium with the surrounding air.\n\n- **Parchment Cockling:** Parchment is exceptionally responsive to humidity shifts. If the imaging studio is too dry, parchment contracts rapidly, causing severe planar cockling, buckling, and ink flaking. If humidity is too high, gelatinization and biological mold risks increase.\n\n- *Standard Parameters:* Archival studios maintain temperature between 18°C and 22°C (64°F–72°F) and relative humidity between 45% and 55%, with continuous monitoring.\n\n**Light Exposure and Thermal Damage:**\nOld-fashioned tungsten or halogen studio lamps generate intense infrared radiation (heat). Directing halogen lamps at an ancient manuscript dries the substrate within minutes, causing dramatic curling and cracking.\n\n- Modern digitization studios exclusively use **high-CRI (Color Rendering Index > 95) cold LED lighting**. LED lamps emit virtually zero infrared radiation and zero ultraviolet (UV) radiation in their visible output, protecting sensitive pigments from thermal shock and photochemical fading.\n\n- Total lux exposure must be minimized: lights are extinguished when setting up or taking breaks, illuminating the manuscript only during active framing and exposure.\n\n**Takeaway:** Imaging studios must maintain stable temperature and 45-55% relative humidity while using cold LED illumination to prevent thermal shock and photochemical damage.\n\n---", "image_b64": null, "question": {"name": "22 Question: Environmental Stability: Temperature, Relative Humidity, and Light Exposure", "questiontext": "<p>How do rapid fluctuations in relative humidity (RH) in an imaging studio affect parchment manuscripts?</p>", "generalfeedback": "<p>Imaging studios must maintain stable temperature and 45-55% relative humidity while using cold LED illumination to prevent thermal shock and photochemical damage.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Parchment is hygroscopic and rapidly absorbs or releases moisture, causing planar buckling, cockling, and shearing forces that detach ink flakes.</p>", "feedback": "<p>Correct. Parchment responds dramatically to humidity shifts by curling, shrinking, or cockling, endangering fragile ink layers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Humidity fluctuations alter the gravitational weight of the manuscript by several hundred kilograms.</p>", "feedback": "<p>Incorrect. Moisture absorption changes weight slightly, but not by hundreds of kilograms; the damage is physical cockling and ink flaking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Dry air causes parchment to transform permanently into synthetic cellulose plastic.</p>", "feedback": "<p>Incorrect. Parchment is animal skin collagen; it does not turn into plant cellulose or plastic.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>High humidity causes camera lenses to permanently lose their ability to record light in the green spectrum.</p>", "feedback": "<p>Incorrect. Studio climate control protects the manuscript, not camera sensor color channels.</p>"}]}}, {"step": 23, "title": "The Electromagnetic Spectrum in Manuscript Autopsy", "content": "**The Electromagnetic Spectrum in Manuscript Autopsy**\n\nHuman vision occupies a very narrow slice of the electromagnetic spectrum, perceiving radiation only between wavelengths of approximately 400 nanometers (violet) and 700 nanometers (red). However, physical documents interact with electromagnetic radiation far beyond these human biological limits.\n\nThe basic physics of light-matter interaction underpins all advanced manuscript imaging:\n\n- **Reflection:** Photons bounce off the surface at the same wavelength.\n\n- **Absorption:** Material absorbs incident energy, converting it to heat or chemical potential.\n\n- **Transmission:** Photons pass through the substrate.\n\n- **Fluorescence (Photoluminescence):** High-energy, short-wavelength photons (such as ultraviolet) are absorbed by a material, exciting electrons to higher energy states. When the electrons relax, they emit lower-energy, longer-wavelength photons in the visible spectrum.\n\nDifferent historical writing materials exhibit radically different chemical behaviors across these spectral bands. Iron-gall ink, carbon ink, madder lake, vermilion, verdigris, and animal collagen all possess unique **spectral reflectance curves**. \n\nWhen ink has faded to human invisibility, or when a text has been deliberately erased to create a palimpsest, standard visible photography records only white parchment. But by probing the manuscript with non-visible wavelengths—ultraviolet and infrared—scholars can exploit chemical differences between ink residues and parchment to recover lost text.\n\n**Takeaway:** Physical documents interact with radiation beyond the visible 400-700 nm band; exploiting reflection, absorption, and fluorescence across the spectrum reveals hidden text.\n\n---", "image_b64": null, "question": {"name": "23 Question: The Electromagnetic Spectrum in Manuscript Autopsy", "questiontext": "<p>What physical phenomenon occurs when a historical document undergoes ultraviolet fluorescence (photoluminescence)?</p>", "generalfeedback": "<p>Physical documents interact with radiation beyond the visible 400-700 nm band; exploiting reflection, absorption, and fluorescence across the spectrum reveals hidden text.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Molecules absorb high-energy, short-wavelength ultraviolet radiation and re-emit lower-energy, longer-wavelength photons in the visible spectrum.</p>", "feedback": "<p>Correct. Fluorescence absorbs non-visible UV photons and emits visible light, revealing chemical variations on the document surface.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The document reflects UV radiation at exactly double its original frequency into the gamma ray spectrum.</p>", "feedback": "<p>Incorrect. Emitted fluorescence is always of lower energy and longer wavelength (Stokes shift) than excitation light.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Parchment completely neutralizes all incoming photons, cooling the imaging room by several degrees.</p>", "feedback": "<p>Incorrect. Energy is conserved; absorbed photons are converted to fluorescence and heat.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The manuscript emits an audible radio signal that can be decoded with FM radio antennas.</p>", "feedback": "<p>Incorrect. Photoluminescence is an optical electromagnetic emission, not an acoustic or radio wave.</p>"}]}}, {"step": 24, "title": "Raking Light: Revealing Dry-Point, Ruling, and Surface Topography", "content": "**Raking Light: Revealing Dry-Point, Ruling, and Surface Topography**\n\nNot all textual and codicological evidence involves ink. Scribes used metal styluses, bone folders, and lead points to execute **pricking and ruling**—the geometric grid that guided text alignment across the page. Readers used dry-point styluses to scratch glosses, translations, and musical notation into margins without ink. Over centuries, parchment leaves also retain the structural memory of erased text, scraping marks, seals, and bookbinding impressions.\n\nUnder direct, perpendicular illumination, these physical depressions are invisible because they contain no colored pigment. **Raking light** solves this problem by using directional visible light cast at a very shallow, grazing angle (5 to 15 degrees) across the document plane.\n\nThe optical mechanics of raking light rely on three-dimensional surface topography:\n\n- When grazing light strikes an indented groove, the near lip of the depression casts a deep shadow into the trough, while the far raised lip catches a bright highlight.\n\n- This creates extreme local luminance contrast that transforms microscopic depth variations into prominent 2D shadow patterns.\n\n- Rotating the light around the document exposes features running in different directions: horizontal ruling lines require light from the top or bottom, while vertical prickings require light from the sides.\n\nRaking light is a non-destructive, purely optical technique that requires no specialized sensors—only a directional lamp and careful angle adjustment.\n\n**Takeaway:** Raking light illuminates surfaces at shallow grazing angles, casting sharp shadows inside inkless depressions to reveal dry-point glosses, ruling, and erased topography.\n\n---", "image_b64": null, "question": {"name": "24 Question: Raking Light: Revealing Dry-Point, Ruling, and Surface Topography", "questiontext": "<p>How does raking light reveal dry-point glosses, pricking, and erased ruling that contain no ink pigment?</p>", "generalfeedback": "<p>Raking light illuminates surfaces at shallow grazing angles, casting sharp shadows inside inkless depressions to reveal dry-point glosses, ruling, and erased topography.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Directing light at a shallow grazing angle casts high-contrast shadows inside surface depressions and creates bright highlights on raised edges.</p>", "feedback": "<p>Correct. Low-angle grazing light converts three-dimensional surface relief into high-contrast two-dimensional shadow patterns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Grazing light excites radioactive fluorescence in calcium carbonate particles within parchment.</p>", "feedback": "<p>Incorrect. Raking light uses visible light and optical shadow contrast; it does not rely on radioactivity or fluorescence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The shallow light angle chemically burns away the top layer of paper fibers to expose the under-text.</p>", "feedback": "<p>Incorrect. Raking light is completely non-invasive and non-destructive.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Raking light magnetizes iron ions in ancient ink to draw them upward to the surface.</p>", "feedback": "<p>Incorrect. Dry-point glosses contain no ink; raking light reveals physical geometric indentation through shadow.</p>"}]}}, {"step": 25, "title": "Reflectance Transformation Imaging (RTI): Mathematical Surface Normal Modeling", "content": "**Reflectance Transformation Imaging (RTI): Mathematical Surface Normal Modeling**\n\nWhile manual raking light photography creates compelling visual evidence, it produces only static photographs tied to one specific lighting angle. **Reflectance Transformation Imaging (RTI)**—incorporating Polynomial Texture Mapping (PTM)—is an advanced computational imaging technique that models the continuous three-dimensional shape and surface reflectance of an artifact.\n\n**The RTI Capture Workflow:**\n\n1. The camera is fixed on a rigid tripod directly above the document, facing perpendicular to the surface. Neither the camera nor the document moves during the entire session.\n\n2. A small, shiny black sphere (such as a polished bearing ball) is placed on the copyboard next to the object.\n\n3. An operator fires a movable flash or LED light from dozens of different angles, forming a virtual hemisphere over the document (typically 36 to 64 exposures).\n\n4. In every shot, the shiny sphere captures a bright specular highlight. RTI software uses the position of this highlight on the sphere to calculate the exact 3D vector of the incoming light source for that exposure.\n\n**Mathematical Synthesis:**\nRTI software does not build a simple image stack. It fits a mathematical function (a biquadratic polynomial) to the luminance variation of *every individual pixel* across all lighting directions. This calculates the **surface normal vector**—the precise perpendicular direction of the physical plane at each pixel.\n\nIn the interactive RTI viewer, scholars can synthetically move a virtual light source in real time across the document. Furthermore, algorithmic enhancement modes like **diffuse gain** and **specular enhancement** can strip away distracting surface color, exaggerating micro-topography beyond what physical light could ever reveal.\n\n**Takeaway:** RTI calculates mathematical surface normal vectors from dozens of known light angles, generating an interactive, relightable 3D surface model of the document.\n\n---", "image_b64": null, "question": {"name": "25 Question: Reflectance Transformation Imaging (RTI): Mathematical Surface Normal Modeling", "questiontext": "<p>How does Reflectance Transformation Imaging (RTI) create an interactive, relightable 3D surface model of a historical artifact?</p>", "generalfeedback": "<p>RTI calculates mathematical surface normal vectors from dozens of known light angles, generating an interactive, relightable 3D surface model of the document.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It captures exposures from multiple known light angles and fits a mathematical polynomial to luminance variation per pixel, computing surface normal vectors.</p>", "feedback": "<p>Correct. RTI derives mathematical surface normal vectors from a stationary camera and moving light source, allowing synthetic relighting in software.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It uses a laser scanner to carve a physical replica of the manuscript out of solid acrylic plastic.</p>", "feedback": "<p>Incorrect. RTI is computational imaging, not physical 3D printing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It generates synthetic textures using a generative text-to-image neural network trained on unrelated artwork.</p>", "feedback": "<p>Incorrect. RTI measures true physical surface reflectance polynomials; it does not hallucinate synthetic textures.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It rotates the manuscript continuously on an electric turntable at 500 revolutions per minute.</p>", "feedback": "<p>Incorrect. The manuscript and camera remain completely stationary during RTI capture; only the light source moves.</p>"}]}}, {"step": 26, "title": "Ultraviolet (UV) Fluorescence: Recovering Erased Iron-Gall Inks and Palimpsests", "content": "**Ultraviolet (UV) Fluorescence: Recovering Erased Iron-Gall Inks and Palimpsests**\n\nIn the Middle Ages, writing parchment was costly and scarce. When an older text was deemed obsolete, scribes frequently scraped off the ink with pumice stones and knives, washed the membrane with weak acids, and wrote a new text over the cleaned surface. This recycled manuscript is known as a **palimpsest** (from the Greek for \"scraped again\"). The original underlying writing is termed the *scriptio inferior*; the newer upper text is the *scriptio superior*.\n\nTo the naked eye, the *scriptio inferior* is often completely erased. However, chemical scraping rarely removes all iron-gall ink. Iron-gall ink is formed by reacting oak gall tannins with ferrous sulfate (vitriol). The resulting iron tannate complexes penetrate deep into the collagen fiber matrix of the animal skin.\n\n**The Physics of UV Fluorescence:**\nWhen irradiated with narrowband **ultraviolet light (typically ~365 nm UV-A)**, parchment collagen undergoes natural photoluminescence: it absorbs high-energy UV radiation and fluoresces brightly in the pale greenish-blue visible spectrum.\n\nHowever, residual iron compounds in the erased ink act as **fluorescence quenchers**:\n\n- Iron ions absorb both the incoming UV excitation and the emitted visible fluorescence, preventing the parchment beneath the ink strokes from glowing.\n\n- As a result, the erased writing stands out in stark, dark contrast against the brightly glowing parchment background.\n\n- Photographing UV fluorescence requires a UV-blocking barrier filter on the camera lens, ensuring the sensor captures only the visible fluorescent emission, not reflected UV glare.\n\nUV fluorescence imaging is the cornerstone method for uncovering lost classical and biblical texts hidden beneath later medieval liturgies.\n\n**Takeaway:** UV-A radiation excites bright fluorescence in parchment collagen while residual iron-gall ink quenches it, causing erased palimpsest text to reappear as dark strokes.\n\n---", "image_b64": null, "question": {"name": "26 Question: Ultraviolet (UV) Fluorescence: Recovering Erased Iron-Gall Inks and Palimpsests", "questiontext": "<p>Why does erased iron-gall ink in a palimpsest appear as dark text against a brightly glowing background under UV-A illumination?</p>", "generalfeedback": "<p>UV-A radiation excites bright fluorescence in parchment collagen while residual iron-gall ink quenches it, causing erased palimpsest text to reappear as dark strokes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Parchment collagen fluoresces bright greenish-blue under UV, but residual iron compounds in the erased ink quench and absorb the fluorescence.</p>", "feedback": "<p>Correct. Collagen glows while iron tannate complexes absorb UV and quench fluorescence, making erased strokes stand out as dark lines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Iron-gall ink reflects 100% of UV rays, blinding the camera sensor wherever words were written.</p>", "feedback": "<p>Incorrect. Iron compounds absorb UV radiation and quench emission rather than reflecting it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Erased ink ignites in tiny microscopic flames that appear black on digital sensors.</p>", "feedback": "<p>Incorrect. UV imaging does not ignite manuscripts; quenching is a non-destructive quantum photophysical process.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The UV light chemically restores erased ink back into its original liquid black dye state.</p>", "feedback": "<p>Incorrect. UV imaging does not chemically restore ink; it creates optical contrast between glowing parchment and quenching residues.</p>"}]}}, {"step": 27, "title": "Infrared (IR) Reflectography: Penetrating Over-Inking, Soot, and Pigments", "content": "**Infrared (IR) Reflectography: Penetrating Over-Inking, Soot, and Pigments**\n\nWhile ultraviolet radiation operates at shorter, higher-energy wavelengths than visible light, **infrared (IR) reflectography** operates at longer wavelengths, typically in the near-infrared band between 750 nanometers and 1100 nanometers (and extending to 2500 nm in short-wave IR).\n\nInfrared imaging exploits a fundamental chemical distinction between historical writing materials:\n\n- **Carbon Ink:** Made from soot, charcoal, or bone black suspended in gum Arabic. Carbon particles are exceptionally stable and absorb electromagnetic radiation uniformly across visible and infrared wavelengths. Carbon ink remains pitch black under IR.\n\n- **Iron-Gall Ink:** Highly absorptive in visible light, but becomes increasingly transparent at wavelengths above 800 nm.\n\n- **Organic Inks and Stains:** Many organic pigments, blood, soot deposits, and chemical corrosion products become entirely transparent under infrared illumination.\n\n**Applications in Document Recovery:**\n\n1. **Censored and Redacted Text:** If an inquisitor or modern censor used iron-gall ink or organic dyes to cross out text written in carbon ink, illuminating the document with infrared light causes the obscuring ink to turn transparent, exposing the underlying carbon text cleanly.\n\n2. **Fire and Smoke Damage:** In documents salvaged from fires (such as the Cotton Library fire of 1731), soot and charred paper obscure the text. Infrared penetrates the surface soot, reflecting off the uncharred paper fibers below.\n\n3. **Underdrawings in Illuminations:** Infrared reflectography penetrates opaque pigment layers (such as lapis lazuli or lead white) in manuscript miniatures, revealing the artist's original carbon-drawn preliminary sketches.\n\nStandard digital cameras have an internal IR-cut filter over their sensors; archival IR photography requires cameras with this filter removed (\"full-spectrum conversions\") fitted with screw-on IR bandpass filters.\n\n**Takeaway:** Infrared reflectography exploits the transparency of iron-gall inks and organic pigments at longer wavelengths to penetrate stains, redactions, and charring.\n\n---", "image_b64": null, "question": {"name": "27 Question: Infrared (IR) Reflectography: Penetrating Over-Inking, Soot, and Pigments", "questiontext": "<p>How does infrared reflectography allow scholars to read carbon-ink text that has been crossed out or obscured with iron-gall ink or soot?</p>", "generalfeedback": "<p>Infrared reflectography exploits the transparency of iron-gall inks and organic pigments at longer wavelengths to penetrate stains, redactions, and charring.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Iron-gall ink and organic stains become transparent at infrared wavelengths above 800 nm, while carbon ink remains completely opaque and absorptive.</p>", "feedback": "<p>Correct. Carbon absorbs infrared radiation while iron-gall ink and soot become transparent, revealing the underlying carbon strokes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Infrared light heats the iron-gall ink until it physically evaporates from the document.</p>", "feedback": "<p>Incorrect. Infrared imaging is non-destructive and non-thermal; it exploits optical transmission differences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Carbon ink emits bright green laser beams when illuminated by infrared wavelengths.</p>", "feedback": "<p>Incorrect. Carbon ink simply absorbs infrared radiation; it does not emit lasers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Infrared radiation converts modern ballpoint pen ink into ancient Roman imperial purple dye.</p>", "feedback": "<p>Incorrect. Infrared imaging is an analytical diagnostic tool; it does not alter ink chemistry.</p>"}]}}, {"step": 28, "title": "Multispectral and Hyperspectral Imaging: Multi-Band Capture and Spectral Stacks", "content": "**Multispectral and Hyperspectral Imaging: Multi-Band Capture and Spectral Stacks**\n\nWhile raking light, UV, and IR each offer powerful qualitative tools, **multispectral imaging (MSI)** unites them into a rigorous, quantitative scientific framework. Rather than capturing a single exposure, an MSI system captures an aligned stack of narrowband photographic exposures spanning the ultraviolet, visible, and infrared spectra (typically 365 nm to 950 nm).\n\nA standard multispectral imaging workflow employs:\n\n- **Narrowband LED Arrays:** Illuminating the document sequentially with 12 to 24 distinct, monochromatic LED wavelengths in rapid succession.\n\n- **Monochrome Scientific Sensors:** High-resolution monochrome sensors (without color Bayer filters) that maximize quantum efficiency across all wavelengths.\n\n- **Filter Wheels:** Combining broadband illumination with liquid crystal tunable filters (LCTF) or optical interference bandpass filters in front of the lens.\n\n**The Image Cube:**\nThe result of an MSI capture is an **image cube**: a spatial grid of pixels where every pixel contains a discrete spectral reflectance curve across dozens of measured wavelengths.\n\nBecause materials possess unique spectral signatures, advanced computational algorithms can process this data cube:\n\n- **Principal Component Analysis (PCA):** Mathematical dimensionality reduction that compresses variance across dozens of bands into high-contrast false-color composite images, separating faint erased palimpsest text from dominant over-text.\n\n- **Independent Component Analysis (ICA) and Spectral Angle Mapping:** Isolating and segmenting specific chemical ink recipes based on their mathematical spectral profiles.\n\nMultispectral imaging represents the gold standard of non-destructive document recovery, responsible for recovering the Archimedes Palimpsest, the 1752 French Declaration drafts, and ancient Dead Sea Scroll fragments.\n\n**Takeaway:** Multispectral imaging captures aligned narrow-band exposures from UV to IR, producing an image cube that mathematical algorithms process to separate illegible inks.\n\n---", "image_b64": null, "question": {"name": "28 Question: Multispectral and Hyperspectral Imaging: Multi-Band Capture and Spectral Stacks", "questiontext": "<p>What is an 'image cube' in multispectral imaging, and how is it used to recover lost manuscript text?</p>", "generalfeedback": "<p>Multispectral imaging captures aligned narrow-band exposures from UV to IR, producing an image cube that mathematical algorithms process to separate illegible inks.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A stack of coregistered images across narrow UV, visible, and IR bands, where algorithms process per-pixel spectral curves to mathematically separate inks.</p>", "feedback": "<p>Correct. The image cube records spatial coordinates $(x,y)$ and spectral wavelength $(\\lambda)$, enabling statistical algorithms (like PCA) to isolate faint inks.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A cubic glass display case designed to protect illuminated manuscripts from cosmic radiation in museum vaults.</p>", "feedback": "<p>Incorrect. An image cube is a multi-dimensional digital data structure, not a physical museum display case.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 3D spatial model that renders the manuscript as an unreadable geometric cube in virtual reality.</p>", "feedback": "<p>Incorrect. The image cube represents a multi-band data stack, not an unreadable geometric shape.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A hardware memory chip installed inside cameras that prevents students from downloading copyright-protected images.</p>", "feedback": "<p>Incorrect. Image cube refers to the $(x,y,\\lambda)$ spectral dataset, not digital rights hardware.</p>"}]}}, {"step": 29, "title": "Archival Capture Workflows: From Sensor to Unprocessed Master", "content": "**Archival Capture Workflows: From Sensor to Unprocessed Master**\n\nA successful digitization campaign relies on an undisrupted, standardized data pipeline. If photographic files are captured in lossy formats, named haphazardly, or modified destructively during shooting, the integrity of the digital surrogate is permanently degraded.\n\nArchival capture adheres strictly to the **master file preservation model**:\n\n1. **RAW Sensor Capture:** All exposures must be captured in the camera's uncompressed, proprietary RAW format (or open DNG). RAW files contain the unprocessed linear sensor data directly from the analog-to-digital converter, before white balance, tone curves, or color matrix interpolation are applied.\n\n2. **Non-Destructive Processing:** In post-capture processing software (such as Lightroom, Capture One, or open-source RawTherapee), lens correction profiles and custom ICC color targets are applied. No sharpening or lossy compression is introduced at this stage.\n\n3. **Uncompressed Archival Masters:** Processed files are exported as uncompressed, 16-bit or 8-bit **TIFF files** (Tagged Image File Format). The TIFF file serves as the permanent archival master surrogate.\n\n4. **Metadata Preservation:** Camera EXIF metadata (shutter speed, aperture, ISO, sensor serial number) must remain embedded in the file headers. Archival technical metadata (operator name, equipment model, light source, color profile) is recorded in accompanying technical logs.\n\nStandardized file naming is non-negotiable. File names must reflect repository, collection, shelfmark, and surface sequence (e.g., `NSA_RG1_v430_no2_f01r_master.tif`).\n\n**Takeaway:** Archival workflows capture uncompressed RAW sensor data, exporting uncompressed TIFF masters with embedded technical metadata and systematic shelfmark file naming.\n\n---", "image_b64": null, "question": {"name": "29 Question: Archival Capture Workflows: From Sensor to Unprocessed Master", "questiontext": "<p>Why do preservation digitization standards mandate capturing in uncompressed RAW sensor format and exporting uncompressed TIFF master files?</p>", "generalfeedback": "<p>Archival workflows capture uncompressed RAW sensor data, exporting uncompressed TIFF masters with embedded technical metadata and systematic shelfmark file naming.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>RAW capture preserves unmanipulated linear sensor data, and uncompressed TIFF masters prevent irreversible lossy compression artifacts from degrading evidence.</p>", "feedback": "<p>Correct. Archival preservation requires uncompressed linear data and lossless master storage to preserve every pixel of historical evidence intact.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because JPEG files automatically delete all metadata headers after twenty-four hours.</p>", "feedback": "<p>Incorrect. JPEGs retain EXIF metadata, but their lossy 8-bit discrete cosine transform compression permanently discards fine visual detail.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because RAW sensor files are small enough to be sent via SMS text messaging to student smartphones.</p>", "feedback": "<p>Incorrect. RAW files are very large multi-megabyte files; the mandate ensures quality, not compact transmission.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because international archival agreements require all digital images to be encrypted with 256-bit military passwords.</p>", "feedback": "<p>Incorrect. Preservation standards emphasize open, unencrypted, accessible formats like uncompressed TIFF and DNG.</p>"}]}}, {"step": 30, "title": "The Digital Surrogate: Integrating Physical Capture into the TEI Edition", "content": "**The Digital Surrogate: Integrating Physical Capture into the TEI Edition**\n\nWe arrive at the synthesis of physical document autopsy and digital text encoding. Digitization is not the end of the scholarly workflow; it is the physical foundation upon which the entire digital scholarly edition rests. The high-resolution master captures produced in the studio find their intellectual home inside the TEI architecture.\n\nWhen physical capture is complete, the images are integrated into the edition's `<facsimile>` structure:\n```xml\n<facsimile>\n  <surface xml:id=\"nsa_treaty_1752_sheet\" ulx=\"0\" uly=\"0\" lrx=\"4800\" lry=\"6000\">\n    <graphic url=\"derivatives/nsa_rg1_v430_no2_master.jpg\" width=\"4800px\" height=\"6000px\"/>\n    <!-- English column zone -->\n    <zone xml:id=\"z_eng_col\" ulx=\"350\" uly=\"800\" lrx=\"2300\" lry=\"5200\" type=\"column\" corresp=\"#txt_eng\"/>\n    <!-- French column zone -->\n    <zone xml:id=\"z_fr_col\"  ulx=\"2500\" uly=\"800\" lrx=\"4450\" lry=\"5200\" type=\"column\" corresp=\"#txt_fr\"/>\n    <!-- Bushell printer colophon -->\n    <zone xml:id=\"z_colophon\" ulx=\"350\" uly=\"5300\" lrx=\"4450\" lry=\"5700\" type=\"colophon\" corresp=\"#txt_colophon\"/>\n  </surface>\n</facsimile>\n```\n\nIn the `<teiHeader>`, the `<physDesc>` element documents the physical autopsy findings: support material, dimensions, condition, and evidence of ruling or seals. The `<encodingDesc>` records the photographic hardware, lens, lighting equipment, and resolution parameters used during capture.\n\nBy tying physical handling, calibrated photography, multispectral analysis, and TEI facsimile encoding into a continuous chain of evidence, the digital edition achieves the highest standard of modern scholarship: complete transparency from the material atom to the encoded digital tag.\n\n**Takeaway:** A mature digital edition integrates physical autopsy findings into the `<teiHeader>` and anchors photographic surrogates directly into `<facsimile>` zones and coordinates.", "image_b64": null, "question": {"name": "30 Question: The Digital Surrogate: Integrating Physical Capture into the TEI Edition", "questiontext": "<p>In a completed digital scholarly edition, how do the results of physical document autopsy and high-resolution imaging connect to the TEI XML markup?</p>", "generalfeedback": "<p>A mature digital edition integrates physical autopsy findings into the `<teiHeader>` and anchors photographic surrogates directly into `<facsimile>` zones and coordinates.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Physical metrics and capture parameters are documented in `<physDesc>` and `<encodingDesc>`, while photographic surrogates and zones are anchored in `<facsimile>`.</p>", "feedback": "<p>Correct. A mature digital edition documents physical autopsy in the header and binds digital images and spatial zones in `<facsimile>` to transcribed text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>All digital photographs are deleted after encoding to ensure that the edition exists purely as unverified abstract text.</p>", "feedback": "<p>Incorrect. Digital editions unite visual surrogates with encoded transcriptions; deleting images would eliminate primary evidence.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The TEI XML file replaces all physical manuscript originals, which are routinely destroyed by archives after digitization.</p>", "feedback": "<p>Incorrect. Archives preserve physical artifacts permanently; digital surrogates provide access and protection, not destruction.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Physical autopsy data must be kept secret by editors to prevent readers from discovering scribal errors.</p>", "feedback": "<p>Incorrect. Scholarly editing values complete transparency, making autopsy findings and facsimiles accessible to all researchers.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
