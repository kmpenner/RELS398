tifier (e.g., <code>...:1.2@καὶ[3]</code>).</p>", "feedback": "<p>Correct. Sub-reference syntax uses <code>@token[index]</code> to target specific words or character offsets mathematically without altering base XML markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By inserting a new XML element <code>&lt;third_kai&gt;</code> into the middle of the manuscript text.</p>", "feedback": "<p>Incorrect. Sub-references address tokens externally via URNs without modifying the underlying text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By specifying the line number and column number in Roman numerals.</p>", "feedback": "<p>Incorrect. CTS sub-references use string indexing on canonical passage nodes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By calculating the SHA-256 cryptographic hash of the surrounding paragraph.</p>", "feedback": "<p>Incorrect. Hashes identify Git commits, not sub-passage word occurrences in CTS.</p>"}]}}, {"step": 23, "title": "CITE URNs for Non-Textual Artifacts: Folios, Images, and Papyri", "content": "**CITE URNs for Non-Textual Artifacts: Folios, Images, and Papyri**\n\nWhile CTS URNs address abstract textual hierarchies, digital editions also encompass physical artifacts: manuscript folios, papyrus fragments, physical inscriptions, and high-resolution digital images. The broader CITE Architecture provides the **CITE2 URN** protocol for non-textual cultural objects (Blackwell & Smith, 2019; Babeu, 2019).\n\nA CITE2 URN identifies objects within structured collections:\n\n`urn:cite2:NAMESPACE:COLLECTION.VERSION:OBJECT_ID`\n\n```\nManuscript Folio Object:\nurn:cite2:hmt:msA.v1:62r\n\nHigh-Resolution IIIF Image:\nurn:cite2:hmt:va_images.v1:VA062RN_0062\n\nImage Region of Interest (Bounding Box Coordinates):\nurn:cite2:hmt:va_images.v1:VA062RN_0062@0.15,0.22,0.60,0.18\n```\n\nBy pairing CTS URNs (identifying the text) with CITE2 URNs (identifying the image and physical leaf), a digital scholarly edition establishes a complete, bi-directional alignment between the transcribed words, the physical parchment folio, and the digital facsimile pixels (Blackwell & Smith, 2019; Babeu, 2019).\n\nThis alignment allows users to click on any word in a digital critical edition and immediately highlight the exact pixels on the high-resolution manuscript image where the scribe wrote that word.\n\n**Takeaway:** CITE2 URNs identify physical manuscript folios and high-resolution images, linking textual transcriptions directly to visual facsimiles.\n\n---", "question": {"name": "23 Question: CITE URNs for Non-Textual Artifacts: Folios, Images, and Papyri", "questiontext": "<p>What is the structural role of the CITE2 URN protocol within the broader CITE Architecture?</p>", "generalfeedback": "<p>CITE2 URNs identify physical manuscript folios and high-resolution images, linking textual transcriptions directly to visual facsimiles.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It provides persistent, canonical identifiers for non-textual cultural objects, physical folios, and high-resolution image regions of interest.</p>", "feedback": "<p>Correct. While CTS addresses textual trees, CITE2 addresses physical artifacts and image bounding boxes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces RELAX NG as the validation engine for XML syntax checking.</p>", "feedback": "<p>Incorrect. CITE2 is a canonical identification protocol, not a schema validation language.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is an encryption algorithm used to restrict access to copyrighted museum images.</p>", "feedback": "<p>Incorrect. CITE2 is an open identification standard designed for scholarly linking and transparency.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts printed books into audio speech recordings automatically.</p>", "feedback": "<p>Incorrect. CITE2 identifies physical and visual objects within structured collections.</p>"}]}}, {"step": 24, "title": "The Linked Fragment: Citing Lost Authors and Textual Reuses", "content": "**The Linked Fragment: Citing Lost Authors and Textual Reuses**\n\nA profound challenge in classical philology is encoding *fragments*—lost historical texts that survive only as brief quotations, paraphrases, or allusions preserved within the surviving works of later authors (Berti, 2016).\n\nIn traditional print editions (such as Felix Jacoby's *Fragmente der griechischen Historiker*), editors printed reconstructed fragments in isolation, severing them from their physical host contexts. In digital philology, Monica Berti demonstrates that CTS URNs and TEI XML allow scholars to represent the \"linked fragment\" with total contextual fidelity (Berti, 2016).\n\nUsing TEI `<cit>` markup paired with CTS URNs, an editor records both the citing host text and the cited lost author:\n\n```xml\n<cit>\n  <quote>\n    <!-- Text of the lost fragment as quoted by the host author -->\n    <w ref=\"urn:cts:greekLit:tlg0016.tlg001:1.10\">...</w>\n  </quote>\n  <bibl>\n    <author ref=\"https://viaf.org/viaf/100189914\">Hecataeus of Miletus</author>\n    <title ref=\"urn:cts:greekLit:tlg0592.tlg001\">Genealogiai</title>\n    <citedRange>Frag. 15</citedRange>\n  </bibl>\n</cit>\n```\n\nThis architecture ensures that a fragment is never ripped from its manuscript host; the CTS URN anchors the quote to its exact place in the surviving witness while simultaneously connecting it to the author's virtual collected works (Berti, 2016).\n\n**Takeaway:** CTS URNs and TEI `<cit>` elements model fragmentary text reuses, preserving the physical host context while linking citations to lost works.\n\n---", "question": {"name": "24 Question: The Linked Fragment: Citing Lost Authors and Textual Reuses", "questiontext": "<p>In digital classical philology, how do TEI <code>&lt;cit&gt;</code> markup and CTS URNs represent fragmentary quotations of lost authors (the \"linked fragment\")?</p>", "generalfeedback": "<p>CTS URNs and TEI `<cit>` elements model fragmentary text reuses, preserving the physical host context while linking citations to lost works.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By anchoring the quoted text to its exact place in the surviving host manuscript while simultaneously linking its bibliographic attribution to the lost author's canonical URN.</p>", "feedback": "<p>Correct. This preserves the material context of the quotation without severing the fragment from its surviving host text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting the surrounding host text so that only the lost author's words remain visible.</p>", "feedback": "<p>Incorrect. The linked fragment methodology explicitly preserves the surrounding host text context.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By forging synthetic complete texts using generative artificial intelligence.</p>", "feedback": "<p>Incorrect. Scholarly digital editions document historical witnesses rather than fabricating lost texts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By reclassifying all fragmentary quotes as modern copyright violations.</p>", "feedback": "<p>Incorrect. Classical textual reuse is scholarly evidence, not modern copyright infringement.</p>"}]}}, {"step": 25, "title": "CTS Implementations and Web Microservices", "content": "**CTS Implementations and Web Microservices**\n\nA persistent URN is an abstract identifier; to be useful to human researchers, it must be resolved into actual digital data. This resolution is handled by Canonical Text Services web microservices (Tiepmar & Heyer, 2014).\n\nA CTS service is an API that accepts standardized HTTP requests and returns structured XML or JSON responses. The CTS specification defines five mandatory request verbs (Tiepmar & Heyer, 2014):\n\n1. `GetCapabilities`: Returns an inventory of all textgroups, works, editions, and translations available on the server.\n2. `GetValidReff`: Returns a list of all valid passage URNs within a given text or range.\n3. `GetPassage`: Returns the transcribed TEI XML text for a specific passage URN.\n4. `GetPassagePlus`: Returns the passage text along with preceding and following passage citations for navigation.\n5. `GetFirstUrn` / `GetPrevNextUrn`: Navigates linearly across the citation tree.\n\n```\nExample HTTP CTS API Request:\nhttps://cts.perseids.org/api/cts?request=GetPassage&urn=urn:cts:greekLit:tlg0527.tlg001.perseus-grc1:1.1\n\nServer Response:\n<GetPassage>\n  <request><urn>urn:cts:greekLit:tlg0527.tlg001.perseus-grc1:1.1</urn></request>\n  <reply>\n    <passage>\n      <TEI xmlns=\"http://www.tei-c.org/ns/1.0\">\n        <div type=\"edition\" n=\"urn:cts:greekLit:tlg0527.tlg001.perseus-grc1\">\n          <div type=\"textpart\" subtype=\"chapter\" n=\"1\">\n            <div type=\"textpart\" subtype=\"verse\" n=\"1\">\n              <p>ΟΡΑΣΙΣ ΗΝ ΕΙΔΕΝ ΗΣΑΙΑΣ ΥΙΟΣ ΑΜΩΣ...</p>\n            </div>\n          </div>\n        </div>\n      </TEI>\n    </passage>\n  </reply>\n</GetPassage>\n```\n\nBecause CTS services speak a standardized protocol, a client application can pull Greek texts from Leipzig, Latin texts from Harvard, and Syriac texts from Oxford into a single unified collation interface (Tiepmar & Heyer, 2014).\n\n**Takeaway:** CTS web microservices expose standardized API endpoints (`GetPassage`, `GetValidReff`) that resolve abstract URNs into structured XML text fragments.\n\n---", "question": {"name": "25 Question: CTS Implementations and Web Microservices", "questiontext": "<p>Which mandatory CTS API request verb returns the transcribed TEI XML text for a specific passage URN?</p>", "generalfeedback": "<p>CTS web microservices expose standardized API endpoints (`GetPassage`, `GetValidReff`) that resolve abstract URNs into structured XML text fragments.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<code>GetPassage</code>", "feedback": "<p>Correct. <code>GetPassage</code> resolves a passage URN and returns the corresponding structured XML text fragment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>GetCapabilities</code>", "feedback": "<p>Incorrect. <code>GetCapabilities</code> returns an inventory of all available textgroups, works, and editions on the server.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>GetValidReff</code>", "feedback": "<p>Incorrect. <code>GetValidReff</code> returns a list of valid passage URNs within a work or range.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<code>DropDatabase</code>", "feedback": "<p>Incorrect. <code>DropDatabase</code> is a destructive SQL database command, not a CTS request verb.</p>"}]}}, {"step": 26, "title": "Integrating CTS URNs into the `<teiHeader>` and Body", "content": "**Integrating CTS URNs into the `<teiHeader>` and Body**\n\nTo ensure that your digital edition is fully CTS-compliant, you must embed canonical identifiers directly into your TEI Header and structural text body.\n\nIn the `<teiHeader>`, the `<msItem>` and `<title>` elements declare the canonical work identifier via the `@ref` attribute. In the `<body>` of the document, each hierarchical division (`<div>`) declares its structural subtype and canonical citation number (`@n`):\n\n```xml\n<teiHeader>\n  <fileDesc>\n    <sourceDesc>\n      <msDesc>\n        <msContents>\n          <msItem n=\"2\">\n            <title ref=\"urn:cts:greekLit:tlg0527.tlg001\">Book of Isaiah</title>\n          </msItem>\n        </msContents>\n      </msDesc>\n    </sourceDesc>\n  </fileDesc>\n</teiHeader>\n\n<text>\n  <body xml:lang=\"grc\" n=\"urn:cts:greekLit:tlg0527.tlg001.vat-gr-2125\">\n    <div type=\"textpart\" subtype=\"book\" n=\"1\">\n      <div type=\"textpart\" subtype=\"chapter\" n=\"1\">\n        <div type=\"textpart\" subtype=\"verse\" n=\"1\">\n          <p>ΟΡΑΣΙΣ ΗΝ ΕΙΔΕΝ ΗΣΑΙΑΣ ΥΙΟΣ ΑΜΩΣ...</p>\n        </div>\n        <div type=\"textpart\" subtype=\"verse\" n=\"2\">\n          <p>ΑΚΟΥΕ ΟΥΡΑΝΕ ΚΑΙ ΕΝΩΤΙΖΟΥ ΓΗ...</p>\n        </div>\n      </div>\n    </div>\n  </body>\n</text>\n```\n\nBy nesting `<div type=\"textpart\" subtype=\"chapter\" n=\"1\">` and `<div type=\"textpart\" subtype=\"verse\" n=\"1\">`, your XML tree mirrors the exact OHCO2 citation hierarchy, allowing automated CTS scrapers to harvest your text without manual configuration.\n\nThis alignment ensures that your edition can participate directly in distributed text service networks, automated alignment engines, and multi-witness collation pipelines.\n\n**Takeaway:** Embedding CTS URNs in `<msItem>` and structural `<div type=\"textpart\">` elements aligns the TEI XML tree with the canonical citation hierarchy.\n\n---", "question": {"name": "26 Question: Integrating CTS URNs into the teiHeader and Body", "questiontext": "<p>How does a TEI document structurally align its transcribed body text with the Canonical Text Services hierarchy?</p>", "generalfeedback": "<p>Embedding CTS URNs in `<msItem>` and structural `<div type=\"textpart\">` elements aligns the TEI XML tree with the canonical citation hierarchy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By nesting <code>&lt;div type=\"textpart\" subtype=\"chapter\" n=\"1\"&gt;</code> elements whose hierarchy mirrors the canonical citation tree.</p>", "feedback": "<p>Correct. Structural <code>&lt;div type=\"textpart\"&gt;</code> elements with <code>@n</code> numbers enable automated CTS parsers to harvest citable text nodes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By formatting all text as a single unbroken string inside <code>&lt;teiHeader&gt;</code>.</p>", "feedback": "<p>Incorrect. Transcriptions belong in <code>&lt;text&gt;&lt;body&gt;</code>, not the metadata header, and require hierarchical division.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By removing all XML tags and uploading a raw Microsoft Word document.</p>", "feedback": "<p>Incorrect. CTS integration requires structured, valid TEI XML divisions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By replacing ancient verse numbers with modern page numbers from a 19th-century print edition.</p>", "feedback": "<p>Incorrect. CTS relies on canonical intellectual divisions, not transient print page numbers.</p>"}]}}, {"step": 27, "title": "Hands-On: Validating and Enriching the Primary Witness Header", "content": "**Hands-On: Validating and Enriching the Primary Witness Header**\n\nNow we execute the core practical work of Meeting #4. You will take yesterday's hand-written XML file (`03a_Lesson_2.1_Primary_Witness_Header.xml`), open it in Oxygen XML Editor, and execute a complete deterministic validation and linked data audit.\n\nFollow these systematic steps:\n\n1. **Schema Association:** Verify that the `<?xml-model?>` processing instructions for the TEI consolidated RELAX NG schema and Schematron rules are active at the top of your file.\n2. **Grammar Validation:** Run the Oxygen validator (`Validate Document` / `Ctrl+Shift+V` or `Cmd+Shift+V`). Inspect the error log:\n   - Fix all invalid element nesting (e.g., ensure `<supportDesc>` is inside `<objectDesc>`).\n   - Correct all non-standard date strings into ISO 8601 format (`YYYY-MM-DD` or `YYYY`).\n   - Fix all capitalization and entity escape errors.\n3. **Cross-Reference Auditing:** Run the Schematron audit:\n   - Ensure all `@hand` pointers (e.g., `#h1`) correspond to valid `<handNote xml:id=\"h1\">` declarations.\n   - Verify that all `<msItem>` elements contain valid `<locus>` foliation coordinates.\n4. **Linked Data Enrichment:**\n   - Attach VIAF URIs to all historical authors, editors, and scribes (`<persName ref=\"...\">`).\n   - Attach Getty TGN or Pleiades URIs to your manuscript's place of origin and current settlement (`<placeName ref=\"...\">`).\n   - Attach Getty AAT URIs to physical support materials (`<material ref=\"...\">`).\n   - Assign the canonical CTS URN to your primary work in `<msItem>` and `<body>`.\n\nSave your validated file as `src/modules/Topic_02_Cataloguing/03a_Lesson_2.2_Primary_Witness_Header_Validated.xml`.\n\n**Takeaway:** The validation lab transforms raw manual markup into a certified, schema-valid, linked-data-enriched digital manuscript record.\n\n---", "question": {"name": "27 Question: Hands-On: Validating and Enriching the Primary Witness Header", "questiontext": "<p>What are the core technical tasks required to transition a hand-written TEI header into a validated, linked-data-enriched record in Lesson 2.2?</p>", "generalfeedback": "<p>The validation lab transforms raw manual markup into a certified, schema-valid, linked-data-enriched digital manuscript record.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Resolving schema nesting errors in Oxygen, converting dates to ISO 8601, verifying <code>@hand</code> Schematron pointers, and embedding VIAF/AAT URIs and CTS URNs.</p>", "feedback": "<p>Correct. These systematic steps ensure both internal structural validity and external semantic interoperability.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting the manuscript description and replacing it with an automated Wikipedia summary.</p>", "feedback": "<p>Incorrect. The lab enriches the primary codicological ground truth rather than replacing it with secondary summaries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Converting the XML file into an uncompressed WAV audio file.</p>", "feedback": "<p>Incorrect. Text encoding and linked data remain in XML and RDF text formats.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Removing all attribute quotes to test whether the parser can operate in non-strict mode.</p>", "feedback": "<p>Incorrect. Unquoted attributes violate basic well-formedness and cause immediate fatal parser crashes.</p>"}]}}, {"step": 28, "title": "Extracting RDF Triples from TEI via XSLT and SPARQL", "content": "**Extracting RDF Triples from TEI via XSLT and SPARQL**\n\nOnce a TEI Header is validated and enriched with URIs, it can be automatically converted into RDF semantic triples. This transformation is typically executed using XSLT (Extensible Stylesheet Language Transformations) stylesheets (Koho et al., 2021).\n\nAn XSLT script traverses the validated TEI XML tree, matches `<msDesc>`, `<origin>`, and `<persName>` elements, and outputs standard RDF/XML or Turtle syntax:\n\n```xml\n<!-- Conceptual XSLT Rule for Generating RDF Triples from TEI -->\n<xsl:template match=\"tei:msDesc\">\n  <rdf:Description rdf:about=\"http://example.org/manuscript/{@xml:id}\">\n    <rdf:type rdf:resource=\"http://erlangen-crm.org/current/E22_Man-Made_Object\"/>\n    <crm:P1_is_identified_by>\n      <xsl:value-of select=\"tei:msIdentifier/tei:idno\"/>\n    </crm:P1_is_identified_by>\n    <crm:P46i_forms_part_of rdf:resource=\"{tei:msIdentifier/tei:repository/@ref}\"/>\n  </rdf:Description>\n</xsl:template>\n```\n\nWhen this transformation is executed across thousands of TEI documents, the resulting RDF graphs are ingested into a triple store (such as GraphDB or Apache Jena) and queried via SPARQL:\n\n```sparql\nPREFIX crm: <http://erlangen-crm.org/current/>\nPREFIX tei: <http://www.tei-c.org/ns/1.0/>\n\nSELECT ?manuscript ?shelfmark ?place\nWHERE {\n  ?manuscript a crm:E22_Man-Made_Object ;\n              crm:P1_is_identified_by ?shelfmark ;\n              crm:P108i_was_produced_by ?production .\n  ?production crm:P7_took_place_at ?place .\n  FILTER (CONTAINS(STR(?place), \"Alexandria\"))\n}\n```\n\nThis query searches millions of records in seconds, demonstrating the immense analytical payoff of structured, linked metadata (Koho et al., 2021; Koho et al., 2023).\n\n**Takeaway:** Validated TEI headers are transformed into RDF triples via XSLT, enabling lightning-fast SPARQL queries across decentralized international repositories.\n\n---", "question": {"name": "28 Question: Extracting RDF Triples from TEI via XSLT and SPARQL", "questiontext": "<p>How are validated TEI manuscript headers converted into queryable Linked Open Data triples for ingestion into triple stores?</p>", "generalfeedback": "<p>Validated TEI headers are transformed into RDF triples via XSLT, enabling lightning-fast SPARQL queries across decentralized international repositories.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>An XSLT stylesheet parses the XML tree, transforming elements like <code>&lt;msDesc&gt;</code> and <code>&lt;persName&gt;</code> into RDF/XML or Turtle triples queryable via SPARQL.</p>", "feedback": "<p>Correct. XSLT automates the extraction of graph triples from hierarchical XML trees.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By printing out the XML file and scanning it with an optical bar code reader.</p>", "feedback": "<p>Incorrect. Triple extraction is an automated software transformation via XSLT scripts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By manually typing 20 million lines of SQL insert commands in a terminal.</p>", "feedback": "<p>Incorrect. XSLT stylesheets automate batch graph extraction across thousands of files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting all element tags and preserving only numerical dates.</p>", "feedback": "<p>Incorrect. RDF requires subjects, predicates, and objects, which are mapped from structured XML elements and attributes.</p>"}]}}, {"step": 29, "title": "Auditing the Deterministic Pass: Clean Validation as the Stage Gate", "content": "**Auditing the Deterministic Pass: Clean Validation as the Stage Gate**\n\nBefore concluding today's deterministic session, you must verify that your enriched document passes all validation gates with **zero errors and zero warnings**.\n\nIn the RELS 398 curriculum, validation is not an optional checklist; it is an unforgiving stage gate. You cannot proceed to Friday's AI evaluation lab if your underlying ground-truth XML file contains broken trees or invalid datatypes.\n\nRun the repository linter and schema checker from your terminal:\n\n```bash\n# Verify Git status\ngit status\n\n# Stage your validated, linked TEI file\ngit add src/modules/Topic_02_Cataloguing/03a_Lesson_2.2_Primary_Witness_Header_Validated.xml\n\n# Commit the deterministic milestone with an informative audit log\ngit commit -m \"Topic 02: Validated primary witness header against RELAX NG, Schematron, and LOD authorities\"\n```\n\nDocument your validation results in your personal lab notes: record how many syntax errors Oxygen caught in your Tuesday draft, what types of errors they were (e.g., date formats, nesting, unclosed tags), and how you resolved them. This error log will form the quantitative baseline for Friday's comparative report.\n\n**Takeaway:** A zero-error validation report is the mandatory stage gate that certifies your ground truth before comparative AI benchmarking.\n\n---", "question": {"name": "29 Question: Auditing the Deterministic Pass: Clean Validation as the Stage Gate", "questiontext": "<p>Why does the RELS 398 curriculum enforce a strict zero-error validation stage gate before allowing students to proceed to AI benchmarking?</p>", "generalfeedback": "<p>A zero-error validation report is the mandatory stage gate that certifies your ground truth before comparative AI benchmarking.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>An unvalidated or broken XML baseline cannot serve as a scientific ground truth, corrupting all downstream comparative measurements and error scoring.</p>", "feedback": "<p>Correct. The manual ground truth must be certified error-free against formal schemas before it can evaluate probabilistic AI outputs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Oxygen XML Editor locks the student's computer account if a file contains warnings.</p>", "feedback": "<p>Incorrect. Oxygen reports errors for human review; the gate is a pedagogical and methodological requirement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because AI models refuse to process text files that have not been digitally signed by an archbishop.</p>", "feedback": "<p>Incorrect. AI models process any text, which is why rigorous human-certified baselines are necessary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To ensure students spend the entire semester debugging XML syntax rather than studying manuscripts.</p>", "feedback": "<p>Incorrect. Deterministic validation provides an efficient, verifiable foundation for philological analysis.</p>"}]}}, {"step": 30, "title": "Synthesis: The Triple Infrastructure of Digital Philology", "content": "**Synthesis: The Triple Infrastructure of Digital Philology**\n\nToday's meeting has integrated the three indispensable pillars of modern digital textual scholarship:\n\n1. **TEI XML & RELAX NG:** Provides the granular, hierarchical markup vocabulary and structural grammar to represent the complex materiality of handwritten codices (Cummings, 2018; TEI Consortium, 2025).\n2. **RDF & Linked Open Data:** Connects local document strings to global semantic knowledge graphs, turning isolated files into interoperable nodes on the Semantic Web (Koho et al., 2021; Koho et al., 2023).\n3. **CTS URNs & CITE Architecture:** Establishes permanent, machine-actionable, canonical citations that identify texts, passages, and manuscript folios independently of physical servers (Blackwell & Smith, 2019; Smith, 2009).\n\n| Infrastructure Layer | Core Standard & Schema | Primary Function in Digital Scholarship | Scholarly Benefit |\n| --- | --- | --- | --- |\n| Codicological Markup | TEI XML / RELAX NG | Internal document grammar and manuscript description | Preserves material and paleographic nuances in machine-readable trees |\n| Semantic Web Graph | RDF / Linked Open Data | Global entity reconciliation and cross-repository queries | Connects local text strings to international authority knowledge bases |\n| Citation Ontology | CTS URN / CITE Architecture | Technology-independent, machine-actionable text addressing | Provides persistent, granular citations down to words and substrings |\n\n```\nComparative Cycle Progress — Week 2 (Topic 02):\n[X] Tue: Manual — Hand-written TEI Header and msDesc (Human Ground Truth)\n[X] Wed: Deterministic — RELAX NG & Schematron validation in Oxygen, RDF LOD, CTS URNs\n[ ] Fri: AI-Assisted — LLM metadata extraction scored against your manual baseline\n```\n\nOn Friday, we complete the cycle with Step 3: AI-assisted metadata extraction. You will prompt Large Language Models and computer vision pipelines to catalogue your manuscript passage automatically, scoring their outputs directly against the validated ground truth you certified today.\n\n**Takeaway:** TEI XML, RDF Linked Open Data, and CTS URNs form the three-part computational infrastructure that makes digital textual scholarship permanent, interoperable, and reproducible.\n\n---\n\n## References\n\nBabeu, A. (2019). Digital catalogs of ancient Greek authors and works through papyrological data. In M. Berti (Ed.), *Digital Classical Philology: Ancient Greek and Latin in the Digital Revolution* (pp. 55–72). De Gruyter Saur. https://doi.org/10.1515/9783110599572\n\nBerti, M. (2016). The linked fragment: TEI and the encoding of text reuses of lost authors. *Journal of the Text Encoding Initiative*, 8. https://doi.org/10.4000/jtei.1218\n\nBlackwell, C., & Smith, N. (2019). The CITE Architecture: A conceptual and practical overview. In M. Berti (Ed.), *Digital Classical Philology: Ancient Greek and Latin in the Digital Revolution* (pp. 73–94). De Gruyter Saur.\n\nBüttner, A., & Kautz, M. (2013). Bibliotheca Laureshamensis – digital: virtuelle Klosterbibliothek Lorsch. *Pergament und Stein (Lorscher Studien 2)*, 5–8.\n\nCummings, J. (2018). The Text Encoding Initiative and the study of literature. In R. Siemens & S. Schreibman (Eds.), *A Companion to Digital Literary Studies* (pp. 451–476). Blackwell.\n\nKoho, M., Burrows, T., Hyvönen, E., Ikkala, E., Page, K., Ransom, L., ... & Wijsman, H. (2021). Harmonizing and publishing heterogeneous premodern manuscript metadata as Linked Open Data. *Journal of the Association for Information Science and Technology*, 73(2), 240–257. https://doi.org/10.1002/asi.24499\n\nKoho, M., Coladangelo, L. P., Ransom, L., & Emery, D. (2023). Wikibase model for premodern manuscript metadata harmonization, linked data integration, and discovery. *ACM Journal on Computing and Cultural Heritage*, 16(3), Article 56. https://doi.org/10.1145/3594723\n\nLe Bœuf, P. (2012). Modeling rare and unique documents: Using FRBRoo/CIDOC CRM. *Journal of Archival Organization*, 10(2), 96–106.\n\nSmith, N. (2009). Citation in classical studies. *Digital Humanities Quarterly*, 3(1).\n\nTEI Consortium. (2025). *TEI P5: Guidelines for Electronic Text Encoding and Interchange*. Version 4.8.0. https://tei-c.org/release/doc/tei-p5-doc/en/html/\n\nTiepmar, J., & Heyer, G. (2014). A new implementation for Canonical Text Services. In *Proceedings of the Workshop on Human-Computer Tractable Data for the Digital Humanities* (pp. 1–8).", "question": {"name": "30 Question: Synthesis: The Triple Infrastructure of Digital Philology", "questiontext": "<p>How do TEI XML, RDF Linked Open Data, and CTS URNs combine to form the foundational infrastructure of modern digital textual scholarship?</p>", "generalfeedback": "<p>TEI XML, RDF Linked Open Data, and CTS URNs form the three-part computational infrastructure that makes digital textual scholarship permanent, interoperable, and reproducible.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>TEI provides granular internal codicological markup; RDF connects entities to global knowledge graphs; CTS provides permanent, technology-independent canonical citations.</p>", "feedback": "<p>Correct. Together, these three layers guarantee internal structural fidelity, external semantic interoperability, and permanent citable addressing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>TEI manages web hosting servers; RDF designs user interface layouts; CTS prints paper volumes.</p>", "feedback": "<p>Incorrect. None of these standards perform server hosting, graphic UI layout, or physical printing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They serve as three competing commercial products that cannot be used in the same project.</p>", "feedback": "<p>Incorrect. They are open, complementary standards that integrate seamlessly in digital editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They replace the need for historical scholarship by automating textual criticism completely.</p>", "feedback": "<p>Incorrect. They provide computational infrastructure for human scholarship rather than replacing critical judgement.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
