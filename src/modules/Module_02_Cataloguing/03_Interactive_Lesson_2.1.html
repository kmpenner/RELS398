ent columns and detect text baselines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically re-formats the physical parchment leaves to fit modern widescreen computer monitors.</p>", "feedback": "<p>Incorrect. <code>&lt;layoutDesc&gt;</code> records historical page dimensions, not modern display screen scaling.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It dictates the CSS styling rules used to render HTML web editions in modern browsers.</p>", "feedback": "<p>Incorrect. TEI describes semantic and codicological data; web presentation is controlled by stylesheets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates abbreviations and ligatures into expanded Unicode Greek characters.</p>", "feedback": "<p>Incorrect. Textual normalization occurs in transcription markup, not in layout descriptions.</p>"}]}}, {"step": 20, "title": "Paleographic Analysis: The `<handDesc>` and `<handNote>` Elements", "content": "**Paleographic Analysis: The `<handDesc>` and `<handNote>` Elements**\n\nFollowing `<objectDesc>`, the next critical component of `<physDesc>` is `<handDesc>` (hand description). A manuscript may be written by a single scribe or by multiple collaborating scribes across centuries.\n\nWithin `<handDesc>`, each distinct scribal hand is assigned a `<handNote>` element with a unique `@xml:id`. The `<handNote>` describes the script family, ink color, letterform ductus, and chronological period of that hand.\n\n```xml\n<handDesc hands=\"3\">\n  <summary>Written primarily in a formal 6th-century Byzantine uncial hand, with extensive 6th- and 7th-century marginal hands.</summary>\n  \n  <handNote xml:id=\"h1\" scope=\"major\" script=\"uncial\" medium=\"brown-ink\">\n    <p><label>Hand 1 (Primary Scribe):</label> Formal Egyptian/Byzantine uncial (majuscule), upright, round, with slight serifs on vertical strokes of tau and gamma. Brown iron-gall ink. Responsible for the primary biblical text.</p>\n  </handNote>\n  \n  <handNote xml:id=\"h2\" scope=\"minor\" script=\"cursive-uncial\" medium=\"black-ink\">\n    <p><label>Hand 2 (Hexaplaric Corrector):</label> Rapid semi-uncial hand writing in dark blackish-green ink in outer margins. Responsible for supplying variant readings from Aquila, Symmachus, and Theodotion.</p>\n  </handNote>\n  \n  <handNote xml:id=\"h3\" scope=\"minor\" script=\"byzantine-minuscule\" medium=\"faded-ink\">\n    <p><label>Hand 3 (Late Scholiast):</label> Early minuscule hand (9th/10th century) adding occasional theological glosses in lower margins.</p>\n  </handNote>\n</handDesc>\n```\n\nAssigning `@xml:id=\"h1\"`, `@xml:id=\"h2\"`, etc., enables you to tag every word, line, or marginal addition in your transcription with a `@hand` attribute (e.g., `<add hand=\"#h2\">`), explicitly linking text fragments to specific scribes.\n\nIn ancient manuscripts, scribes also used distinctive abbreviations known as *nomina sacra* (e.g., ΘΣ for Θεός, ΚΣ for Κύριος) written with a supralinear stroke. Documenting how each hand treats nomina sacra provides vital paleographical diagnostic data.\n\n**Takeaway:** The `<handDesc>` and `<handNote>` elements document distinct scribal hands, establishing unique `@xml:id` handles for granular paleographic attribution in transcriptions.\n\n---", "question": {"name": "20 Question: Paleographic Analysis: The handDesc and handNote Elements", "questiontext": "<p>Why must each <code>&lt;handNote&gt;</code> declared in <code>&lt;handDesc&gt;</code> possess a unique <code>@xml:id</code>?</p>", "generalfeedback": "<p>The `<handDesc>` and `<handNote>` elements document distinct scribal hands, establishing unique `@xml:id` handles for granular paleographic attribution in transcriptions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To establish persistent identifier handles that can be referenced by <code>@hand</code> attributes on specific words, lines, or marginal additions in the transcription.</p>", "feedback": "<p>Correct. Assigning <code>@xml:id=\"h1\"</code> allows transcription tags like <code>&lt;add hand=\"#h1\"&gt;</code> to link text directly to that scribal hand.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To register the scribe's legal identity with modern national copyright databases.</p>", "feedback": "<p>Incorrect. Ancient scribes have no modern copyright registrations; IDs serve internal document linking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To satisfy XML well-formedness rules that require all elements to have unique identifiers.</p>", "feedback": "<p>Incorrect. <code>xml:id</code> is an optional attribute in XML syntax, though required by project Schematron rules for hand linking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prevent other scholars from editing the paleographical description of that hand.</p>", "feedback": "<p>Incorrect. Identifiers enable machine navigation and attribution, not write-protection.</p>"}]}}, {"step": 21, "title": "Decorations, Miniatures, and Marginal Signs: `<decoDesc>`", "content": "**Decorations, Miniatures, and Marginal Signs: `<decoDesc>`**\n\nManuscripts frequently contain non-textual graphic elements, ranging from full-page illuminations to subtle philological punctuation signs. These features are documented in `<decoDesc>` (decoration description).\n\nInside `<decoDesc>`, each distinct decorative element or system of signs is encoded inside a `<decoNote>` element. In biblical manuscripts like Codex Marchalianus, critical signs—such as Aristarchian asterisks and obels—are vital philological data (Ceriani, 1890).\n\n```xml\n<decoDesc>\n  <decoNote type=\"initials\">\n    <p>Enlarged uncial initials at the beginning of each biblical book (approx. 25-30 mm high), decorated with simple red and green geometric penwork.</p>\n  </decoNote>\n  <decoNote type=\"philological-signs\">\n    <p>Extensive use of Origenian hexaplaric signs in left margins: asterisks (※) marking words present in Hebrew but missing in the Old Greek, and obels (÷) marking words present in the Old Greek but absent in Hebrew.</p>\n  </decoNote>\n  <decoNote type=\"miniatures\" subtype=\"frontispiece\">\n    <p>No figurative miniatures; decorative knotted headpieces at the opening of Isaiah (fol. 59r) and Jeremiah (fol. 143r).</p>\n  </decoNote>\n</decoDesc>\n```\n\nDocumenting these signs in the header provides the cataloguing framework required when you later transcribe marginal signs in Topic 04 and Topic 08.\n\nOrigen's Hexapla placed six parallel columns side-by-side to compare the Hebrew text with Greek translations. In copies of the Septuagint derived from the Hexapla, scribes transferred Origen's critical signs into the margins, making them indispensable evidence for textual criticism (Ceriani, 1890).\n\n**Takeaway:** The `<decoDesc>` module catalogues artistic illuminations, decorated initials, and critical philological signs like asterisks and obels.\n\n---", "question": {"name": "21 Question: Decorations, Miniatures, and Marginal Signs: decoDesc", "questiontext": "<p>In biblical manuscripts like Codex Marchalianus, why are critical signs like asterisks and obels catalogued in <code>&lt;decoDesc&gt;</code>?</p>", "generalfeedback": "<p>The `<decoDesc>` module catalogues artistic illuminations, decorated initials, and critical philological signs like asterisks and obels.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They represent specialized graphic and philological signs marking additions and omissions relative to the Hexaplaric Hebrew and Greek texts.</p>", "feedback": "<p>Correct. Origenian signs are vital philological data that straddle the boundary between decorative symbols and text-critical apparatus.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They are decorative errors created when the scribe's pen accidentally dripped ink onto the parchment.</p>", "feedback": "<p>Incorrect. Asterisks (※) and obels (÷) are deliberate, structured text-critical symbols.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They indicate that the manuscript was condemned as heretical by ecclesiastical censors.</p>", "feedback": "<p>Incorrect. Hexaplaric signs indicate textual alignment with the Hebrew text in Origen's Hexapla.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They are modern watermarks pressed into the paper during nineteenth-century rebinding.</p>", "feedback": "<p>Incorrect. These signs were written in the 6th and 7th centuries in the manuscript margins.</p>"}]}}, {"step": 22, "title": "The Binding and Structural Protection: `<bindingDesc>`", "content": "**The Binding and Structural Protection: `<bindingDesc>`**\n\nA codex is protected by its binding. However, very few premodern manuscripts retain their original bindings; most surviving codices have been rebound multiple times across their historical lifecycle.\n\nWithin `<physDesc>`, the `<bindingDesc>` element records the physical construction, boards, covering materials, clasps, and conservation history of the binding.\n\n```xml\n<bindingDesc>\n  <binding contemporary=\"false\">\n    <p>Vatican Library conservation binding executed in 1968. Dark brown morocco leather over modern wooden boards, gold-stamped on spine with the arms of Pope Paul VI and the shelfmark <quote>Vat. Gr. 2125</quote>.</p>\n    <condition>\n      <p>Excellent modern structural condition; spine tight, sewing on five modern raised cords with acid-free Japanese paper guards.</p>\n    </condition>\n    <decoNote>Blind-tooled fillets on front and back boards.</decoNote>\n  </binding>\n</bindingDesc>\n```\n\nThe attribute `@contemporary=\"false\"` explicitly states that the binding is not contemporary with the sixth-century manufacturing of the parchment leaves. This distinction prevents researchers from mistaking modern binding structures for late antique craft.\n\nWhen older binding fragments—such as medieval pastedowns or fragments of lost manuscripts used as spine lining—are preserved during rebinding, their presence is documented inside `<binding>` child elements.\n\n**Takeaway:** The `<bindingDesc>` documents the bookbinding materials, sewing structure, and conservation history, explicitly distinguishing contemporary bindings from modern rebinding.\n\n---", "question": {"name": "22 Question: The Binding and Structural Protection: bindingDesc", "questiontext": "<p>Why is the attribute <code>@contemporary=\"false\"</code> critical when encoding a manuscript's <code>&lt;bindingDesc&gt;</code>?</p>", "generalfeedback": "<p>The `<bindingDesc>` documents the bookbinding materials, sewing structure, and conservation history, explicitly distinguishing contemporary bindings from modern rebinding.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It explicitly indicates that the binding was produced in a later period than the leaves, preventing scholars from mistaking modern rebinding for original late antique craft.</p>", "feedback": "<p>Correct. Most surviving ancient codices were rebound in the early modern or modern era; documenting non-contemporary bindings preserves historical accuracy.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It declares that the binding is damaged and cannot be safely handled in a library reading room.</p>", "feedback": "<p>Incorrect. Physical condition is recorded in <code>&lt;condition&gt;</code>; contemporary status addresses historical synchronicity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It instructs digital viewers to display the manuscript without rendering its binding covers.</p>", "feedback": "<p>Incorrect. The attribute informs codicological metadata rather than suppressing image display.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It certifies that the binding materials were sourced from synthetic modern polymers rather than animal hides.</p>", "feedback": "<p>Incorrect. A 1968 morocco leather binding is non-contemporary with a 6th-century codex despite using animal leather.</p>"}]}}, {"step": 23, "title": "The Chronological Lifecycle: The `<history>` Element", "content": "**The Chronological Lifecycle: The `<history>` Element**\n\nThe fourth major branch of `<msDesc>` is `<history>`. The `<history>` element formalizes the chronological lifecycle and historical movement of the artifact across time and space (TEI Consortium, 2025).\n\nA manuscript is not a static museum object; it is an itinerant survivor. It was manufactured at a specific date in a specific scriptorium (`<origin>`), possessed by a succession of monastic communities, private collectors, or royal libraries (`<provenance>`), and ultimately accessioned into its current repository (`<acquisition>`).\n\n| Historical Stage | TEI Child Element | Codicological and Custodial Scope |\n| --- | --- | --- |\n| Manufacturing Moment | `<origin>` | Scribal production date, scriptorium place, and scribe |\n| First Custodial Phase | `<provenance>` (1) | Early monastic preservation and medieval library holdings |\n| Second Custodial Phase | `<provenance>` (2) | Renaissance humanistic collectors and private ownership |\n| Institutional Accession | `<acquisition>` | Formal transfer and entry into current institutional repository |\n\nBy structuring history into distinct chronological events, TEI aligns directly with event-centric Linked Open Data ontologies like CIDOC-CRM (Le Bœuf, 2012; Koho et al., 2021). Each historical transfer represents a discrete event with its own temporal bounds, geographic locations, and historical agents.\n\n**Takeaway:** The `<history>` element traces the temporal lifecycle of the codex, dividing its history into origin, sequential provenance transfers, and modern institutional acquisition.\n\n---", "question": {"name": "23 Question: The Chronological Lifecycle: The history Element", "questiontext": "<p>How does the TEI <code>&lt;history&gt;</code> module organize the temporal lifecycle of a manuscript artifact?</p>", "generalfeedback": "<p>The `<history>` element traces the temporal lifecycle of the codex, dividing its history into origin, sequential provenance transfers, and modern institutional acquisition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By dividing history into discrete, sequential stages: production (<code>&lt;origin&gt;</code>), custodial transfers (<code>&lt;provenance&gt;</code>), and institutional accession (<code>&lt;acquisition&gt;</code>).</p>", "feedback": "<p>Correct. This event-centric structure aligns TEI metadata directly with Linked Open Data ontologies like CIDOC-CRM.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By generating a continuous prose biography that merges scribal production with modern restoration.</p>", "feedback": "<p>Incorrect. TEI structures historical lifecycle into distinct, typed event elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By recording only the current twentieth-century archival acquisition while omitting premodern owners.</p>", "feedback": "<p>Incorrect. Premodern ownership transfers are comprehensively modeled in sequential <code>&lt;provenance&gt;</code> nodes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By converting historical Julian dates into radioactive carbon-dating decay curves.</p>", "feedback": "<p>Incorrect. <code>&lt;history&gt;</code> records documentary and paleographical lifecycle events.</p>"}]}}, {"step": 24, "title": "Dating and Localizing the Manuscript: `<origin>`", "content": "**Dating and Localizing the Manuscript: `<origin>`**\n\nThe `<origin>` element records the circumstances of the manuscript's creation. It captures *when* the manuscript was written (`<origDate>`) and *where* it was written (`<origPlace>`).\n\nDating premodern manuscripts is inherently uncertain. When a colophon is missing, palaeographers estimate date ranges based on script style, orthography, and material support. The TEI provides machine-readable date attributes to capture this scholarly uncertainty:\n\n- `@when`: A single exact date (e.g., `@when=\"1245-04-12\"`).\n- `@notBefore` and `@notAfter`: A bounding date range (e.g., `@notBefore=\"0550\"` and `@notAfter=\"0599\"` for the sixth century).\n- `@from` and `@to`: A known period of continuous production.\n- `@cert`: Editorial certainty (`high`, `medium`, `low`).\n\n```xml\n<history>\n  <origin>\n    <origDate notBefore=\"0550\" notAfter=\"0599\" cert=\"medium\" evidence=\"palaeographic\">\n      Late 6th century CE (ca. 550–600 CE)\n    </origDate>\n    <origPlace ref=\"https://pleiades.stoa.org/places/727070\">\n      Egypt (likely Alexandria or the Nitrian Desert)\n    </origPlace>\n    <p>Produced in an established Byzantine-Egyptian scriptorium, as evidenced by distinctive Coptic-influenced uncial letterforms and Egyptian orthographic patterns (Ceriani, 1890).</p>\n  </origin>\n</history>\n```\n\nBy encoding `@evidence=\"palaeographic\"`, the editor explicitly documents the scholarly basis for the assigned date, distinguishing stylistic dating from explicit colophon dates.\n\n**Takeaway:** The `<origin>` element uses ISO 8601 attributes like `@notBefore` and `@notAfter` to represent historical dating ranges and palaeographical uncertainty.\n\n---", "question": {"name": "24 Question: Dating and Localizing the Manuscript: origin", "questiontext": "<p>When dating a manuscript without an explicit colophon, how does TEI represent palaeographical date ranges and uncertainty in <code>&lt;origDate&gt;</code>?</p>", "generalfeedback": "<p>The `<origin>` element uses ISO 8601 attributes like `@notBefore` and `@notAfter` to represent historical dating ranges and palaeographical uncertainty.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By using ISO 8601 interval attributes (<code>@notBefore</code> and <code>@notAfter</code>) combined with qualitative certainty attributes (<code>@cert</code> and <code>@evidence</code>).</p>", "feedback": "<p>Correct. Attributes like <code>notBefore=\"0550\" notAfter=\"0599\" cert=\"medium\"</code> provide machine-computable boundaries while recording scholarly uncertainty.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By writing conversational approximate phrases like 'around the late sixth century' directly into the <code>@when</code> attribute.</p>", "feedback": "<p>Incorrect. Machine-readable date attributes require strict ISO 8601 formatting; prose descriptions belong in element content.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By assigning an arbitrary single year and omitting any indication of editorial uncertainty.</p>", "feedback": "<p>Incorrect. Forcing an exact year misrepresents historical knowledge and distorts temporal filtering.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By leaving the date field completely blank whenever a colophon is absent.</p>", "feedback": "<p>Incorrect. Palaeographical date estimates are valuable scholarship and should be encoded with explicit bounding attributes.</p>"}]}}, {"step": 25, "title": "Custodial Chain and Migration: The `<provenance>` Sequence", "content": "**Custodial Chain and Migration: The `<provenance>` Sequence**\n\nBetween its creation and its arrival in a modern research library, a manuscript often migrated across continents through sales, bequests, confiscations, and gifts. Each discrete historical transfer of custody is encoded in an independent `<provenance>` element (Koho et al., 2021).\n\nRecording provenance as a sequence of distinct events allows computational knowledge graphs to map the migration of cultural heritage across centuries (Koho et al., 2021).\n\n```xml\n<history>\n  <origin><!-- ... --></origin>\n  \n  <provenance notBefore=\"0800\" notAfter=\"0900\">\n    <p>Preserved in the Library of the Monastery of Saint Macarius the Great in the Nitrian Desert (Wadi El Natrun, Egypt) during the 9th century.</p>\n  </provenance>\n  \n  <provenance notBefore=\"1500\" notAfter=\"1550\">\n    <p>Acquired by the humanist scholar and collector René Marchal, Abbot of Saint-Nom in Paris, from whose collection the manuscript derives its traditional name <name type=\"ms-nickname\">Codex Marchalianus</name>.</p>\n  </provenance>\n  \n  <provenance when=\"1738\">\n    <p>Passed into the collection of Cardinal François de Mailly, Archbishop of Reims, who subsequently gifted the volume to Pope Clement XII for the Vatican Library in 1738.</p>\n  </provenance>\n</history>\n```\n\nWhen a manuscript contains former library shelfmarks or bookplates, these physical traces are encoded within their respective `<provenance>` elements, establishing a verifiable physical audit trail for each custodial transfer (Koho et al., 2021).\n\n**Takeaway:** The custodial chain is modeled as a chronological sequence of `<provenance>` elements, enabling computational tracking of manuscript migrations across time and geography.\n\n---", "question": {"name": "25 Question: Custodial Chain and Migration: The provenance Sequence", "questiontext": "<p>Why is the custodial history of a codex encoded as a sequence of discrete <code>&lt;provenance&gt;</code> elements rather than a single narrative block?</p>", "generalfeedback": "<p>The custodial chain is modeled as a chronological sequence of `<provenance>` elements, enabling computational tracking of manuscript migrations across time and geography.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Each distinct transfer of ownership can be assigned independent dates, places, and agents, enabling knowledge graphs to track migrations across time and space.</p>", "feedback": "<p>Correct. Discrete provenance events can be transformed into RDF triples and mapped spatially in projects like Mapping Manuscript Migrations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>XML schemas prohibit <code>&lt;provenance&gt;</code> elements from containing more than one sentence of text.</p>", "feedback": "<p>Incorrect. Elements can contain paragraphs, but discrete events allow granular temporal and spatial modeling.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Multiple provenance tags are required to prove legal title in international cultural property restitution claims.</p>", "feedback": "<p>Incorrect. Provenance markup serves scholarly and archival discovery rather than legal litigation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A new provenance tag must be generated each time a patron checks out the manuscript in a reading room.</p>", "feedback": "<p>Incorrect. Modern reading room consultations are administrative records, not custodial provenance transfers.</p>"}]}}, {"step": 26, "title": "Administrative and Acquisition Metadata: `<acquisition>` and `<additional>`", "content": "**Administrative and Acquisition Metadata: `<acquisition>` and `<additional>`**\n\nThe final elements of the manuscript description record institutional acquisition and supplementary administrative metadata.\n\nThe `<acquisition>` element sits inside `<history>` and details the specific date, method, and transaction by which the manuscript entered its current repository. Following `<history>`, the optional `<additional>` element records administrative surrogates (microfilms, digitizations), secondary literature (`<listBibl>`), and cross-references to external catalogues.\n\n```xml\n<history>\n  <!-- origin and provenance -->\n  <acquisition when=\"1738-06-15\">\n    <p>Accessioned into the Biblioteca Apostolica Vaticana on June 15, 1738, under the reign of Pope Clement XII, entered into the Latin-Greek inventory as <quote>Vat. gr. 2125</quote>.</p>\n  </acquisition>\n</history>\n\n<additional>\n  <adminInfo>\n    <recordHist>\n      <source>\n        <p>Codicological metadata transcribed from Ceriani (1890) and updated against the online Vatican Library DVL catalogue records.</p>\n      </source>\n    </recordHist>\n  </adminInfo>\n  <listBibl>\n    <bibl>Ceriani, A. M. (1890). <title>De Codice Marchaliano seu Vaticano Graeco 2125: Prophetarum Bibliothecae Vaticanae commentatio</title>. Romae.</bibl>\n  </listBibl>\n</additional>\n```\n\nRecording secondary literature in `<listBibl>` ensures that future editors can trace the scholarly genealogy of every codicological claim made in the digital header.\n\n**Takeaway:** The `<acquisition>` and `<additional>` elements document the institutional accession history, cataloguing sources, and related secondary bibliography for the manuscript.\n\n---", "question": {"name": "26 Question: Administrative and Acquisition Metadata: acquisition and additional", "questiontext": "<p>What is the distinct role of the <code>&lt;additional&gt;</code> container following the <code>&lt;history&gt;</code> element in <code>&lt;msDesc&gt;</code>?</p>", "generalfeedback": "<p>The `<acquisition>` and `<additional>` elements document the institutional accession history, cataloguing sources, and related secondary bibliography for the manuscript.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It holds supplementary administrative records, secondary bibliography (<code>&lt;listBibl&gt;</code>), and references to digital surrogates and microfilms.</p>", "feedback": "<p>Correct. <code>&lt;additional&gt;</code> catalogues external documentation, catalogues, and secondary scholarly literature about the codex.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It stores the full transcribed text of any missing folios discovered after publication.</p>", "feedback": "<p>Incorrect. Transcribed texts belong in <code>&lt;text&gt;</code>, not in header administrative containers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It contains the compiled binary machine code for the online edition's web server.</p>", "feedback": "<p>Incorrect. TEI is a document encoding standard, not a software executable container.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It serves as a temporary quarantine area for unvalidated XML tags.</p>", "feedback": "<p>Incorrect. All elements in the document must be valid according to the active schema.</p>"}]}}, {"step": 27, "title": "Common Syntax Traps in Hand-Authoring TEI Headers", "content": "**Common Syntax Traps in Hand-Authoring TEI Headers**\n\nWhen writing XML by hand without the safety net of an interactive compiler, beginners frequently fall into predictable syntax traps. Understanding these common defects will help you audit your draft before tomorrow's validation lab.\n\n| Syntax Defect | Error Description | Prevention and Solution |\n| --- | --- | --- |\n| Unescaped ampersand | Writing `&` directly in text content (e.g., `Clemens & Graham`) | Always write `&amp;` in XML text nodes. |\n| Tag case mismatch | Mismatched capitalization (e.g., `<msDesc>` closed with `</msdesc>`) | Enforce exact case consistency across opening and closing tags. |\n| Missing attribute quotes | Omitting quotes around attribute values (e.g., `<measure quantity=416>`) | Always surround attribute values with double quotes (`quantity=\"416\"`). |\n| Illegal element nesting | Placing `<msContents>` outside `<msDesc>` or `<titleStmt>` outside `<fileDesc>` | Review the strict TEI hierarchy before closing parent elements. |\n| Incomplete self-closure | Writing `<pb>` or `<lb>` without a trailing slash | Use explicit self-closing syntax: `<pb/>`, `<lb/>`, `<dimensions/>`. |\n\nTaking time to manually trace your element openings and closures line-by-line prevents cascade parsing errors where a single missing bracket invalidates hundreds of subsequent lines.\n\nFurthermore, pay close attention to XML attribute naming conventions: attributes like `@xml:id` and `@xml:lang` belong to the reserved XML namespace and require the `xml:` prefix, whereas standard TEI attributes like `@type`, `@n`, and `@ref` must never carry a prefix.\n\n**Takeaway:** Hand-written XML requires rigorous manual checking for unescaped characters, case mismatches, missing quotes, and improper tag containment.\n\n---", "question": {"name": "27 Question: Common Syntax Traps in Hand-Authoring TEI Headers", "questiontext": "<p>Which coding mistake in an XML text node will cause an immediate fatal parser crash during well-formedness checking?</p>", "generalfeedback": "<p>Hand-written XML requires rigorous manual checking for unescaped characters, case mismatches, missing quotes, and improper tag containment.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Writing a bare ampersand (<code>&amp;</code>) in text content instead of the escaped entity reference <code>&amp;amp;</code>.</p>", "feedback": "<p>Correct. Bare ampersands conflict with XML entity delimiter syntax and cause fatal parser termination.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Using British spelling conventions (such as 'colour') instead of American English.</p>", "feedback": "<p>Incorrect. Natural language orthography has no effect on XML well-formedness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Indenting child elements with two spaces instead of four spaces.</p>", "feedback": "<p>Incorrect. Whitespace between tags is not syntactically invalid in XML.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Writing comments using standard <code>&lt;!-- comment --&gt;</code> syntax.</p>", "feedback": "<p>Incorrect. Comment syntax is fully valid and supported in well-formed XML.</p>"}]}}, {"step": 28, "title": "Building the Ground Truth: The Student's Primary Witness Header", "content": "**Building the Ground Truth: The Student's Primary Witness Header**\n\nNow you synthesize all twenty-seven preceding sections into a complete, working XML document. Today's lab deliverable is to hand-author the full `<teiHeader>` for the primary manuscript witness you selected in Week 1.\n\nOpen a basic plain-text editor (such as VS Code with XML extensions disabled, nano, or TextEdit in plain-text mode). Do not use Oxygen XML Editor today; do not use automated schema autocomplete.\n\nYour file must contain the following complete structure:\n\n1. The XML declaration: `<?xml version=\"1.0\" encoding=\"UTF-8\"?>`\n2. The root `<TEI>` element declaring the TEI namespace: `<TEI xmlns=\"http://www.tei-c.org/ns/1.0\">`\n3. A complete `<teiHeader>` containing:\n   - `<fileDesc>` with `<titleStmt>`, `<publicationStmt>`, and `<sourceDesc>`\n   - An `<msDesc>` inside `<sourceDesc>` with `<msIdentifier>`, `<msContents>`, `<physDesc>`, and `<history>`\n4. A stub `<text>` element containing a placeholder division for next week's transcription:\n   ```xml\n   <text>\n     <body>\n       <div type=\"transcription\">\n         <p><!-- Diplomatic transcription will be authored here in Topic 04 --></p>\n       </div>\n     </body>\n   </text>\n   ```\n\nSave your file in your personal Git repository under the path `src/modules/Topic_02_Cataloguing/03a_Lesson_2.1_Primary_Witness_Header.xml`.\n\nEnsure that your header contains real codicological data derived from your inspection of your manuscript's digital facsimiles and published catalogue records, rather than placeholder lorem ipsum text.\n\n**Takeaway:** Hand-authoring your selected manuscript's complete `<teiHeader>` creates the foundational XML ground truth for the remainder of the semester.\n\n---", "question": {"name": "28 Question: Building the Ground Truth: The Student's Primary Witness Header", "questiontext": "<p>What deliverable constitutes the foundational human ground truth authored in Lesson 2.1?</p>", "generalfeedback": "<p>Hand-authoring your selected manuscript's complete `<teiHeader>` creates the foundational XML ground truth for the remainder of the semester.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A complete, hand-written <code>&lt;teiHeader&gt;</code> and <code>&lt;msDesc&gt;</code> for the student's chosen manuscript witness, drafted without schema autocomplete.</p>", "feedback": "<p>Correct. Hand-authoring the primary witness header establishes the reference baseline against which automated validation and AI extractions are benchmarked.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A 50-page printed critical edition containing collations of twenty distinct manuscripts.</p>", "feedback": "<p>Incorrect. Topic 02 focuses on cataloguing the single primary witness chosen by the student.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A fully functional relational SQL database containing all Greek manuscripts in the Vatican Library.</p>", "feedback": "<p>Incorrect. The course produces standardized TEI XML editions rather than SQL databases.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An AI-generated summary of nineteenth-century German scholarship on the Septuagint.</p>", "feedback": "<p>Incorrect. Tuesday's lab requires manual human text encoding rather than automated AI summaries.</p>"}]}}, {"step": 29, "title": "Preparing for Wednesday's Audit: Deliverables and Configuration", "content": "**Preparing for Wednesday's Audit: Deliverables and Configuration**\n\nBefore you conclude today's session, you must commit your hand-authored XML file to Git version control. Today's commit represents your unassisted, manual editorial work.\n\nFollow the version control discipline established in Topic 01 (Huskey, 2024). Review your file status, verify that your changes are staged cleanly, and compose an atomic commit message describing your codicological decisions.\n\n```bash\n# Verify the status of your newly created header\ngit status\n\n# Stage your hand-written TEI header\ngit add src/modules/Topic_02_Cataloguing/03a_Lesson_2.1_Primary_Witness_Header.xml\n\n# Create an atomic commit documenting your manual baseline\ngit commit -m \"Topic 02: Hand-authored initial teiHeader and msDesc for primary witness\"\n```\n\nDo not edit this file further today. Tomorrow morning, in Lesson 2.2, you will open this exact file in Oxygen XML Editor and subject it to deterministic RELAX NG and Schematron schema validation. Every error that Oxygen flags tomorrow will be a direct measurement of the gap between human intuition and formal computational schemas.\n\nFreezing your manual ground truth in Git ensures that your comparative experiment remains mathematically valid and auditable throughout the course.\n\n**Takeaway:** Committing your hand-written XML file to Git freezes your manual ground truth, establishing the baseline for tomorrow's deterministic schema audit.\n\n---", "question": {"name": "29 Question: Preparing for Wednesday's Audit: Deliverables and Configuration", "questiontext": "<p>Why must the hand-authored XML file be committed to Git version control at the conclusion of Lesson 2.1 without further editing?</p>", "generalfeedback": "<p>Committing your hand-written XML file to Git freezes your manual ground truth, establishing the baseline for tomorrow's deterministic schema audit.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To freeze the unassisted manual baseline so that tomorrow's deterministic schema audit measures genuine human intuition against formal rules.</p>", "feedback": "<p>Correct. Committing to Git preserves the untouched manual ground truth needed for quantitative error scoring in subsequent labs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Git repositories automatically repair any syntax errors in XML files overnight.</p>", "feedback": "<p>Incorrect. Git is a version control system that stores exact snapshots; it does not modify file contents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because university policy requires all student assignments to be publicly pushed to remote servers immediately.</p>", "feedback": "<p>Incorrect. The local commit preserves the audit trail; pushing is governed by project session protocols.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To convert the XML file into an immutable PDF companion document.</p>", "feedback": "<p>Incorrect. PDF compilation is a distinct downstream build step, not a property of Git commits.</p>"}]}}, {"step": 30, "title": "Synthesis: The Header as an Argument in Structural Form", "content": "**Synthesis: The Header as an Argument in Structural Form**\n\nA TEI Header is not administrative overhead; it is a scholarly argument in structural form. When you decide how to represent a manuscript's quire structure, how to date its scribal hands, and how to identify its historical owners, you are performing original textual scholarship (Le Bœuf, 2012; TEI Consortium, 2025).\n\nThe manual step of this week's comparative cycle has forced you to slow down and confront the material complexity of your historical witness. By translating physical parchment, ruling patterns, and ink traces into rigid XML elements, you have experienced the profound epistemological shift from discursive cataloguing to formal data modeling.\n\n```\nComparative Cycle Progress — Week 2 (Topic 02):\n[X] Tue: Manual — Hand-written TEI Header and msDesc (Human Ground Truth)\n[ ] Wed: Deterministic — RELAX NG & Schematron validation in Oxygen, RDF LOD, CTS URNs\n[ ] Fri: AI-Assisted — LLM metadata extraction scored against your manual baseline\n```\n\nTomorrow, we move to Step 2: deterministic validation. You will see how formal schemas act as unyielding gatekeepers, ensuring that your humanistic interpretations conform perfectly to global computational standards.\n\nAs you step away from your editor today, reflect on the decisions you made. Every tag you chose represents a theoretical claim about how a physical historical object should be represented in a digital medium.\n\n**Takeaway:** A TEI Header is an explicit scholarly argument that translates physical manuscript materiality into a formal, auditable digital data architecture.\n\n---\n\n## References\n\nCeriani, A. M. (1890). *De Codice Marchaliano seu Vaticano Graeco 2125: Prophetarum Bibliothecae Vaticanae commentatio*. Romae.\n\nHuskey, S. J. (2024). Editorial workflows in the digital age: Git and version control for textual scholarship. *Digital Humanities Quarterly*, 18(2).\n\nKoho, M., Burrows, T., Hyvönen, E., Ikkala, E., Page, K., Ransom, L., ... & Wijsman, H. (2021). Harmonizing and publishing heterogeneous premodern manuscript metadata as Linked Open Data. *Journal of the Association for Information Science and Technology*, 73(2), 240–257. https://doi.org/10.1002/asi.24499\n\nLe Bœuf, P. (2012). Modeling rare and unique documents: Using FRBRoo/CIDOC CRM. *Journal of Archival Organization*, 10(2), 96–106.\n\nTEI Consortium. (2025). *TEI P5: Guidelines for Electronic Text Encoding and Interchange*. Version 4.8.0. https://tei-c.org/release/doc/tei-p5-doc/en/html/", "question": {"name": "30 Question: Synthesis: The Header as an Argument in Structural Form", "questiontext": "<p>Why is a TEI Header properly understood as an intellectual argument rather than mere administrative metadata?</p>", "generalfeedback": "<p>A TEI Header is an explicit scholarly argument that translates physical manuscript materiality into a formal, auditable digital data architecture.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Every decision regarding quire structure, hand attribution, date boundaries, and content segmentation represents an explicit, testable philological interpretation.</p>", "feedback": "<p>Correct. Encoding codicological metadata translates physical materiality into a formal, structured thesis about the artifact's production and history.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It contains rhetorical polemics defending the editor's religious beliefs against secular critics.</p>", "feedback": "<p>Incorrect. The argument is codicological and methodological, not confessional or polemical.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is designed to replace the need for scholars to ever consult physical manuscripts again.</p>", "feedback": "<p>Incorrect. Digital descriptions enhance and guide consultation of physical witnesses rather than claiming to replace them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is authored by artificial intelligence algorithms that operate independently of human scholarship.</p>", "feedback": "<p>Incorrect. The header represents human editorial scholarship structured within a computational schema.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            document.getElementById('markdown-content').innerHTML = marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
