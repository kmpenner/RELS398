re XML document validate with zero errors in VS Code?</li>\n</ul>\n\nChecking off each item prepares your text for presentation styling.\n\n**Takeaway:** Use an editorial checklist to confirm that all historical, material, and policy declarations are complete and valid.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Checklists for Editorial Completeness", "questiontext": "<p>Why should editors work through an editorial completeness checklist before moving to visual presentation styling?</p>", "generalfeedback": "<p>Use an editorial checklist to confirm that all historical, material, and policy declarations are complete and valid.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To ensure that all historical context, material descriptions, normalization policies, and licenses are valid before writing CSS styles.</p>", "feedback": "<p>Correct. Sound editorial content must be established before designing presentation stylesheets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To delay finishing the assignment as long as possible.</p>", "feedback": "<p>Incorrect. Checklists keep work organized and prevent missed deadlines.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because university servers reject files that lack a checklist.</p>", "feedback": "<p>Incorrect. Checklists are human quality assurance workflows.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To avoid having to write any XML code.</p>", "feedback": "<p>Incorrect. Checklists verify that XML code is complete and compliant.</p>"}]}}, {"step": 30, "title": "Synthesis: Preparing for Presentation Styling in Lesson 13.2", "content": "**Synthesis: Preparing for Presentation Styling in Lesson 13.2**\n\nCongratulations! Today you established the intellectual foundation of your capstone edition:\n<ol>\n  <li>You contextualized your primary witness within its unique historical, political, and material setting.</li>\n  <li>You formulated clear editorial principles in a machine-actionable TEI <code>&lt;editorialDecl&gt;</code>.</li>\n  <li>You selected open access licenses to make your research accessible and reusable.</li>\n</ol>\n\nTomorrow, in **Lesson 13.2**, we will shift from editorial principles to visual presentation. You will explore the **TEI Processing Model**, learning how to map semantic XML elements to beautiful web layouts and typography using CSS stylesheets.\n\nOpen VS Code, review your editorial declaration, and get ready to bring your edition to life on screen!\n\n**Takeaway:** Having formulated editorial principles in Lesson 13.1, you are ready to style your edition for the web in Lesson 13.2.", "html": null, "image_b64": null, "question": {"name": "30 Question: Synthesis: Preparing for Presentation Styling in Lesson 13.2", "questiontext": "<p>What is the next step in our capstone studio after formulating editorial principles in Lesson 13.1?</p>", "generalfeedback": "<p>Having formulated editorial principles in Lesson 13.1, you are ready to style your edition for the web in Lesson 13.2.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Exploring the TEI Processing Model and mapping semantic XML tags to visual web presentation using CSS in Lesson 13.2.</p>", "feedback": "<p>Correct. Lesson 13.2 takes your validated XML master and styles it for interactive web display.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deleting all XML markup and writing the edition in plain notepad.</p>", "feedback": "<p>Incorrect. Lesson 13.2 builds directly upon your TEI master markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Printing the entire internet onto paper.</p>", "feedback": "<p>Incorrect. Digital humanities focuses on curated, sustainable publishing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Skipping the rest of the semester to take a vacation.</p>", "feedback": "<p>Incorrect. The course concludes with the publication of your capstone edition portfolio.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
</html>
