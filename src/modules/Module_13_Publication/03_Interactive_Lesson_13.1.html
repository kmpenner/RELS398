    <script>
        const lessonData = {"course_title": "Formulating Editorial Principles, Methodology, and the Edition Introduction", "subtitle": "RELS 398 / ENGL 398 Digital Methods", "total_sections": 30, "slides": [{"step": 1, "title": "Entering the Studio: The Capstone Digital Scholarly Edition", "content": "**Entering the Studio: The Capstone Digital Scholarly Edition**\n\nWelcome to Week 13. Over the past twelve weeks, you have learned the core crafts of digital textual scholarship. You began in September with basic text files and the command line. You catalogued historical documents, transcribed handwritten ink, normalized archaic spelling, parsed grammar, aligned translations, and authored commentary.\n\nThis week is our **capstone publication studio**. There is no three-step cycle this week. Instead, every class meeting focuses on bringing your work together into a unified digital scholarly edition.\n\nA digital edition is not just a folder of separate files. It is an integrated scholarly publication. Readers should be able to view high-resolution page images, read your careful transcription, inspect your historical notes, and check your editorial decisions.\n\nThis week, you will assemble your work into a publication-grade edition. Today, you will write the editorial introduction and formal editorial principles.\n\n**Vocabulary.** *Digital Scholarly Edition (DSE)* — a digital publication of a historical text that provides critical paratexts, images, and tools beyond a printed book. *Capstone Studio* — a collaborative workshop where students integrate semester-long projects into finished publications.\n\n**Takeaway:** Week 13 brings together all your semester projects into an integrated, publication-grade digital scholarly edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: Entering the Studio: The Capstone Digital Scholarly Edition", "questiontext": "<p>What is the primary goal of Week 13's capstone publication studio?</p>", "generalfeedback": "<p>Week 13 brings together all your semester projects into an integrated, publication-grade digital scholarly edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To bring together all eight semester editorial layers into a unified, publication-grade digital scholarly edition.</p>", "feedback": "<p>Correct. Week 13 integrates transcription, normalization, lemmatization, named entities, alignment, and commentary into a coherent edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To begin a brand new course on video game animation.</p>", "feedback": "<p>Incorrect. Week 13 is the capstone studio for our historical document editing course.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To delete all previous assignments to prepare for the winter semester.</p>", "feedback": "<p>Incorrect. Students synthesize their semester research rather than deleting it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To replace primary archival witnesses with modern textbooks.</p>", "feedback": "<p>Incorrect. The edition showcases primary historical witnesses.</p>"}]}}, {"step": 2, "title": "The Anatomy of a Digital Edition Portfolio", "content": "**The Anatomy of a Digital Edition Portfolio**\n\nA complete digital edition unites several editorial layers created across the term:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 25%;\">Editorial Layer</th>\n      <th style=\"padding: 8px; text-align: left; width: 40%;\">What It Provides</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">TEI XML Element</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>1. Catalogue Metadata</strong></td>\n      <td style=\"padding: 8px;\">Document title, repository, dates, and physical description</td>\n      <td style=\"padding: 8px;\"><code>&lt;teiHeader&gt;</code>, <code>&lt;msDesc&gt;</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>2. Facsimile Binding</strong></td>\n      <td style=\"padding: 8px;\">High-resolution archival images with coordinate zones</td>\n      <td style=\"padding: 8px;\"><code>&lt;facsimile&gt;</code>, <code>&lt;surface&gt;</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>3. Diplomatic Text</strong></td>\n      <td style=\"padding: 8px;\">Exact character-by-character transcription of ink on paper</td>\n      <td style=\"padding: 8px;\"><code>&lt;body&gt;</code>, <code>&lt;lb/&gt;</code>, <code>&lt;pb/&gt;</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>4. Regularized Text</strong></td>\n      <td style=\"padding: 8px;\">Standardized modern spelling for searchability</td>\n      <td style=\"padding: 8px;\"><code>&lt;choice&gt;</code>, <code>&lt;orig&gt;</code>, <code>&lt;reg&gt;</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>5. Linguistic Markup</strong></td>\n      <td style=\"padding: 8px;\">Dictionary lemmas and grammatical tags</td>\n      <td style=\"padding: 8px;\"><code>&lt;w lemma=\"\" pos=\"\"&gt;</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>6. Named Entities</strong></td>\n      <td style=\"padding: 8px;\">People, places, and organizations linked to authority records</td>\n      <td style=\"padding: 8px;\"><code>&lt;persName&gt;</code>, <code>&lt;placeName&gt;</code></td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>7. Parallel Alignment</strong></td>\n      <td style=\"padding: 8px;\">Bilingual translation linked sentence by sentence</td>\n      <td style=\"padding: 8px;\"><code>&lt;linkGrp&gt;</code>, <code>&lt;link&gt;</code></td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>8. Scholarly Commentary</strong></td>\n      <td style=\"padding: 8px;\">Historical, linguistic, and intertextual notes in standoff markup</td>\n      <td style=\"padding: 8px;\"><code>&lt;standOff&gt;</code>, <code>&lt;note&gt;</code></td>\n    </tr>\n  </tbody>\n</table>\n\nWhen these layers link together seamlessly, your edition becomes an authoritative research tool.\n\n**Takeaway:** A digital edition combines eight distinct editorial layers into a single structured master document.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: The Anatomy of a Digital Edition Portfolio", "questiontext": "<p>Which TEI XML element serves as the container for scholarly commentary notes in our digital edition architecture?</p>", "generalfeedback": "<p>A digital edition combines eight distinct editorial layers into a single structured master document.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The <standOff> container, which keeps editorial interpretation cleanly separated from the primary text.</p>", "feedback": "<p>Correct. The <standOff> element houses interpretive commentary notes without interrupting the primary diplomatic text body.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The <teiHeader> element alone.</p>", "feedback": "<p>Incorrect. The teiHeader contains metadata and cataloguing, while standoff holds commentary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The <facsimile> container.</p>", "feedback": "<p>Incorrect. The facsimile element binds digital page images.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The <titleStmt> element.</p>", "feedback": "<p>Incorrect. The titleStmt declares titles and authors within the header.</p>"}]}}, {"step": 3, "title": "The Purpose of the Editorial Introduction", "content": "**The Purpose of the Editorial Introduction**\n\nHistorical documents cannot explain their own origins. A raw transcription leaves readers with urgent questions:\n<ul>\n  <li>Where is the original manuscript kept today?</li>\n  <li>Who created this document, and why?</li>\n  <li>What condition is the paper or parchment in?</li>\n  <li>What rules did the editor follow when expanding abbreviations or modernizing words?</li>\n</ul>\n\nThe **Editorial Introduction** answers these questions. It is the scholar's preface. It sets up your authority as an editor. It gives readers the historical context they need to understand your primary witness.\n\nWithout an introduction, your edition is a puzzle. With an introduction, your edition becomes a trustworthy scholarly reference.\n\n**Takeaway:** The editorial introduction sets up context, explains document history, and makes editorial decisions transparent to readers.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Purpose of the Editorial Introduction", "questiontext": "<p>Why must an editor author an Editorial Introduction for their digital scholarly edition?</p>", "generalfeedback": "<p>The editorial introduction sets up context, explains document history, and makes editorial decisions transparent to readers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To establish authority, explain historical context, document the physical witness, and make editorial rules transparent.</p>", "feedback": "<p>Correct. Without an introduction, readers cannot determine why a document matters or how the text was edited.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To increase the word count of the repository to win a contest.</p>", "feedback": "<p>Incorrect. Introductions provide essential scholarly context, not artificial word counts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because Canadian copyright law mandates a 10,000-word introduction for all student papers.</p>", "feedback": "<p>Incorrect. Introductions fulfill academic scholarship standards, not copyright length mandates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To conceal the names of the historical authors.</p>", "feedback": "<p>Incorrect. Introductions document and celebrate historical authors and their witnesses.</p>"}]}}, {"step": 4, "title": "The Twofold Introduction: Narrative Preface vs Machine Metadata", "content": "**The Twofold Introduction: Narrative Preface vs Machine Metadata**\n\nIn a standard printed book, the introduction is simply a written essay at the beginning. In a digital edition, the introduction exists in two complementary forms:\n<ul>\n  <li><strong>The Narrative Preface:</strong> A readable essay written for humans. It appears on the opening webpage or the first pages of a printed PDF. It explains historical background and summarizes key findings.</li>\n  <li><strong>The Machine-Actionable Metadata:</strong> Structured XML tags stored inside the <code>&lt;teiHeader&gt;</code>. Software can read this data to index dates, creators, and editorial rules automatically.</li>\n</ul>\n\nBoth forms are vital:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 30%;\">Feature</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">Narrative Preface</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">TEI Header Metadata</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Audience</strong></td>\n      <td style=\"padding: 8px;\">Human students and researchers</td>\n      <td style=\"padding: 8px;\">Search engines and XML processors</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Format</strong></td>\n      <td style=\"padding: 8px;\">Markdown prose or HTML paragraphs</td>\n      <td style=\"padding: 8px;\">Standardized TEI XML elements</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Primary Location</strong></td>\n      <td style=\"padding: 8px;\"><code>README.md</code> and front matter</td>\n      <td style=\"padding: 8px;\"><code>&lt;teiHeader&gt;&lt;encodingDesc&gt;</code></td>\n    </tr>\n  </tbody>\n</table>\n\nToday you will author both the narrative prose and its structured TEI representation.\n\n**Takeaway:** Digital editions provide a twofold introduction: narrative prose for human readers and structured XML metadata for machines.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: The Twofold Introduction: Narrative Preface vs Machine Metadata", "questiontext": "<p>How do the two forms of the digital introduction differ in audience and format?</p>", "generalfeedback": "<p>Digital editions provide a twofold introduction: narrative prose for human readers and structured XML metadata for machines.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The narrative preface is a readable essay for human scholars, while the TEI header contains machine-actionable XML metadata for software.</p>", "feedback": "<p>Correct. Humans read the narrative preface, while search engines and digital humanities tools process the structured TEI header.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The narrative preface is written in Latin, while the XML header is written in French.</p>", "feedback": "<p>Incorrect. Language choice is governed by scholarship, not an arbitrary language split.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The narrative preface is deleted after grading, while the XML header is published.</p>", "feedback": "<p>Incorrect. Both components are published as permanent parts of the digital edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The narrative preface contains only numbers, while the header contains only pictures.</p>", "feedback": "<p>Incorrect. Both forms present rich contextual and methodological information.</p>"}]}}, {"step": 5, "title": "The Single-Witness Documentary Edition", "content": "**The Single-Witness Documentary Edition**\n\nIn older philology, scholars often worked with dozens of damaged copies of ancient Greek or Latin texts. They built family trees of manuscripts (called *stemmata*) to reconstruct a lost original.\n\nOur course takes a different, modern path: the **single-witness documentary edition**.\n\nEach student in our cohort is working with one unique archival document:\n<ul>\n  <li>Ace edits a specific 1791 Paris printing of a revolutionary decree.</li>\n  <li>Olyvia edits a handwritten personal letter mailed by Maud Lewis in 1967.</li>\n  <li>Andromeda edits the official 1752 treaty proclamation held in Halifax.</li>\n</ul>\n\nIn documentary editing, our goal is not to fix or alter the past. Our goal is to represent our specific witness with absolute fidelity, documenting its physical ink, handwriting quirks, and social context.\n\n**Vocabulary.** *Documentary Edition* — a scholarly edition focused on representing the exact text and physical features of a specific historical manuscript or print copy.\n\n**Takeaway:** Our cohort creates single-witness documentary editions, prioritizing deep fidelity to individual historical artifacts over multi-witness collation.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: The Single-Witness Documentary Edition", "questiontext": "<p>Why does our 2026 cohort create single-witness documentary editions rather than multi-witness stemmata?</p>", "generalfeedback": "<p>Our cohort creates single-witness documentary editions, prioritizing deep fidelity to individual historical artifacts over multi-witness collation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because each student edits a unique historical artifact requiring deep codicological fidelity rather than reconstructing a lost ancestor.</p>", "feedback": "<p>Correct. Documentary editions represent individual archival witnesses with complete fidelity to physical ink and layout.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because multi-witness collation was permanently outlawed by the TEI Consortium.</p>", "feedback": "<p>Incorrect. Collation is standard TEI practice for multi-witness traditions, but our cohort works with single witnesses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computers crash when attempting to process more than one text file at a time.</p>", "feedback": "<p>Incorrect. Modern computers process thousands of texts simultaneously.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because historical manuscripts never survive in more than one copy.</p>", "feedback": "<p>Incorrect. Many ancient works survive in dozens of copies, but our cohort's projects are unique documents.</p>"}]}}, {"step": 6, "title": "Introducing Ace's Witness: 1791 French Revolutionary Decree", "content": "**Introducing Ace's Witness: 1791 French Revolutionary Decree**\n\nLet us examine how to write the introduction for Ace's document: the *Loi relative à la fabrication des assignats* (May 1791).\n\nKey historical points to cover in the introduction:\n<ul>\n  <li><strong>Political Context:</strong> In 1791, the National Assembly was restructuring France. The monarchy was losing power, and King Louis XVI was forced to sanction assembly laws.</li>\n  <li><strong>Economic Crisis:</strong> France faced massive public debt. The assembly issued paper money (*assignats*) backed by confiscated church lands.</li>\n  <li><strong>The 5-Livre Problem:</strong> Early notes were only printed in huge amounts. Workers and soldiers could not buy food. This decree ordered the production of small 5-livre bills to fix coin shortages.</li>\n  <li><strong>Physical Printing:</strong> Printed by the Imprimerie Royale in Paris, featuring official royal typography and legal seals.</li>\n</ul>\n\nThe introduction explains why this small piece of paper represents a turning point in world history.\n\n**Takeaway:** Ace's introduction frames the 1791 decree within the French Revolution's monetary collapse, paper assignats, and royal legal sanction.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Introducing Ace's Witness: 1791 French Revolutionary Decree", "questiontext": "<p>What primary historical problem did the May 1791 assignat decree address during the French Revolution?</p>", "generalfeedback": "<p>Ace's introduction frames the 1791 decree within the French Revolution's monetary collapse, paper assignats, and royal legal sanction.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>A severe shortage of small-denomination currency for daily wages and food purchases, addressed by authorizing 5-livre notes.</p>", "feedback": "<p>Correct. Early assignats were only printed in massive sums, making daily commerce impossible for common workers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A shortage of printing ink at the Imprimerie Royale.</p>", "feedback": "<p>Incorrect. The decree addressed monetary liquidity and small currency, not ink supplies.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>King Louis XVI's refusal to sign any document written in French.</p>", "feedback": "<p>Incorrect. The King signed French legislation until his overthrow in 1792.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>An invasion of Paris by British naval warships.</p>", "feedback": "<p>Incorrect. Paris is an inland city and was not invaded by warships in May 1791.</p>"}]}}, {"step": 7, "title": "Introducing Olyvia's Witness: 1967 Maud Lewis Letter", "content": "**Introducing Olyvia's Witness: 1967 Maud Lewis Letter**\n\nNext, let us consider Olyvia's document: Maud Lewis's February 1967 letter to Leonard Kinnear.\n\nKey biographical and cultural points to include:\n<ul>\n  <li><strong>The Writer:</strong> Maud Lewis (1903–1970) lived in a tiny one-room house in Marshalltown near Digby, Nova Scotia. Despite severe arthritis, she painted cheerful scenes of maritime life.</li>\n  <li><strong>The Correspondent:</strong> Leonard Kinnear was an amateur collector from Moncton, New Brunswick, who ordered paintings through the mail.</li>\n  <li><strong>The 1960s Art Market:</strong> Following national CBC television broadcasts in 1965, tourists and collectors flooded her cottage. Maud continued selling paintings for just \\$6.00 each.</li>\n  <li><strong>Physical Characteristics:</strong> Handwritten in blue ink on folded letter paper, featuring phonetic folk spelling and intimate personal updates.</li>\n</ul>\n\nThe introduction helps readers appreciate the quiet dignity of Nova Scotia's most beloved folk artist.\n\n**Takeaway:** Olyvia's introduction highlights Maud Lewis's daily life, modest pricing, folk spelling, and personal correspondence with collector Leonard Kinnear.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: Introducing Olyvia's Witness: 1967 Maud Lewis Letter", "questiontext": "<p>What cultural reality of Maud Lewis's life should Olyvia's introduction emphasize?</p>", "generalfeedback": "<p>Olyvia's introduction highlights Maud Lewis's daily life, modest pricing, folk spelling, and personal correspondence with collector Leonard Kinnear.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Her modest pricing of \\$6.00 per painting sold from her home, despite growing national fame following CBC television broadcasts.</p>", "feedback": "<p>Correct. Maud Lewis maintained humble roadside and mail pricing despite widespread national attention.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Her international career managing corporate commercial galleries in Paris.</p>", "feedback": "<p>Incorrect. Maud Lewis lived simply in Marshalltown and never managed European galleries.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Her secret identity as a Canadian federal cabinet minister.</p>", "feedback": "<p>Incorrect. Maud Lewis was an internationally celebrated Nova Scotia folk painter.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Her complete refusal to correspond with anyone outside Digby County.</p>", "feedback": "<p>Incorrect. She corresponded with collectors across Canada, including Leonard Kinnear in Moncton.</p>"}]}}, {"step": 8, "title": "Introducing Andromeda's Witness: 1752 Peace and Friendship Treaty", "content": "**Introducing Andromeda's Witness: 1752 Peace and Friendship Treaty**\n\nNow let us look at Andromeda's document: the 1752 Peace and Friendship Treaty concluded at Halifax.\n\nKey diplomatic and legal context to include:\n<ul>\n  <li><strong>Signatories:</strong> Negotiated between Mi'kmaw Chief Jean-Baptiste Cope of Shubenacadie and Nova Scotia Governor Peregrine Hopson.</li>\n  <li><strong>Diplomatic Purpose:</strong> Renewed peaceful trade and security following years of colonial conflict in Mi'kma'ki.</li>\n  <li><strong>Key Provisions:</strong> Guaranteed hunting and fishing rights, promised gift exchanges, and set up a government trading post (truckhouse).</li>\n  <li><strong>Archival Provenance:</strong> Preserved in the Nova Scotia Archives in Halifax (Record Group 1, volume 430, number 2).</li>\n</ul>\n\nThe introduction grounds the treaty in 18th-century Maritime history, explaining its lasting importance for Indigenous rights.\n\n**Takeaway:** Andromeda's introduction documents the 1752 treaty negotiations between Chief Cope and Governor Hopson, emphasizing ongoing Mi'kmaw resource rights.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: Introducing Andromeda's Witness: 1752 Peace and Friendship Treaty", "questiontext": "<p>What key provision did the 1752 Treaty at Halifax establish regarding Mi'kmaw resource rights?</p>", "generalfeedback": "<p>Andromeda's introduction documents the 1752 treaty negotiations between Chief Cope and Governor Hopson, emphasizing ongoing Mi'kmaw resource rights.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It recognized the 'free liberty of Hunting and Fishing as usual' and established a regulated government trading post (truckhouse).</p>", "feedback": "<p>Correct. The 1752 Treaty confirmed ongoing resource harvesting and regulated commercial trade between Mi'kmaq and British authorities.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It required the Mi'kmaq to relocate permanently to Great Britain.</p>", "feedback": "<p>Incorrect. The treaty governed peace and trade within traditional Mi'kmaw territory in Nova Scotia.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It banned all trading between Indigenous people and colonial merchants.</p>", "feedback": "<p>Incorrect. The treaty explicitly promoted regulated trade through truckhouses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It declared that Nova Scotia would become a colony of Spain.</p>", "feedback": "<p>Incorrect. Nova Scotia was a British crown colony in 1752.</p>"}]}}, {"step": 9, "title": "Describing the Physical Artifact in `<sourceDesc>` and `<msDesc>`", "content": "**Describing the Physical Artifact in `<sourceDesc>` and `<msDesc>`**\n\nIn TEI XML, physical descriptions live inside the `<teiHeader>`. You record them using `<sourceDesc>` and `<msDesc>`:\n<pre><code>&lt;sourceDesc&gt;\n  &lt;msDesc&gt;\n    &lt;msIdentifier&gt;\n      &lt;country&gt;Canada&lt;/country&gt;\n      &lt;region&gt;Nova Scotia&lt;/region&gt;\n      &lt;settlement&gt;Halifax&lt;/settlement&gt;\n      &lt;repository&gt;Nova Scotia Archives&lt;/repository&gt;\n      &lt;idno&gt;RG 1 vol 430 no 2&lt;/idno&gt;\n    &lt;/msIdentifier&gt;\n    &lt;physDesc&gt;\n      &lt;objectDesc form=\"single_sheet\"&gt;\n        &lt;supportDesc material=\"paper\"&gt;\n          &lt;extent&gt;4 pages (folded folio)&lt;/extent&gt;\n        &lt;/supportDesc&gt;\n      &lt;/objectDesc&gt;\n    &lt;/physDesc&gt;\n  &lt;/msDesc&gt;\n&lt;/sourceDesc&gt;</code></pre>\n\nThis markup records where the physical object is stored and what it is made of, creating a permanent archival record.\n\n**Takeaway:** Use msDesc inside sourceDesc to record the repository, shelfmark, physical support, and dimensions of your document.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: Describing the Physical Artifact in sourceDesc and msDesc", "questiontext": "<p>Where in the TEI header are the repository name, call number, and physical dimensions recorded?</p>", "generalfeedback": "<p>Use msDesc inside sourceDesc to record the repository, shelfmark, physical support, and dimensions of your document.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Inside the <sourceDesc> element, structured within <msDesc>, <msIdentifier>, and <physDesc>.</p>", "feedback": "<p>Correct. The <msDesc> module provides structured containers for repository identifiers and physical codicology.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside the <revisionDesc> change logs.</p>", "feedback": "<p>Incorrect. RevisionDesc tracks file editing history, not physical artifact metadata.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Scattered inside footnote elements in the text body.</p>", "feedback": "<p>Incorrect. Physical manuscript descriptions belong in the TEI header.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In a separate Microsoft Excel spreadsheet outside the project.</p>", "feedback": "<p>Incorrect. TEI embeds codicological descriptions directly within the master XML header.</p>"}]}}, {"step": 10, "title": "Documenting Materiality: Parchment, Paper, Seals, and Ink", "content": "**Documenting Materiality: Parchment, Paper, Seals, and Ink**\n\nA digital edition should help readers imagine the physical object. In your introduction, describe its physical material:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 25%;\">Material Feature</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">What to Look For</th>\n      <th style=\"padding: 8px; text-align: left; width: 40%;\">Cohort Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Support Medium</strong></td>\n      <td style=\"padding: 8px;\">Handmade rag paper vs machine paper</td>\n      <td style=\"padding: 8px;\">1791 French decree on laid rag paper with chain lines.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Ink &amp; Medium</strong></td>\n      <td style=\"padding: 8px;\">Iron gall ink, printing ink, or ballpoint</td>\n      <td style=\"padding: 8px;\">Maud Lewis writing in blue commercial ballpoint ink.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Seals &amp; Stamps</strong></td>\n      <td style=\"padding: 8px;\">Wax seals, ink revenue stamps, ribbons</td>\n      <td style=\"padding: 8px;\">Red wax signet seals on the 1752 treaty parchment.</td>\n    </tr>\n  </tbody>\n</table>\n\nNoticing these details bridges digital screens and historical reality.\n\n**Takeaway:** Describing paper, ink, and wax seals connects digital readers to the physical craftsmanship of historical documents.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Documenting Materiality: Parchment, Paper, Seals, and Ink", "questiontext": "<p>Why is documenting material details like paper chain lines, wax seals, and ink types valuable in a digital edition?</p>", "generalfeedback": "<p>Describing paper, ink, and wax seals connects digital readers to the physical craftsmanship of historical documents.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It connects digital readers to the physical craftsmanship, legal authenticity, and material context of the original artifact.</p>", "feedback": "<p>Correct. Describing material features preserves codicological evidence that flat screen pixels might otherwise obscure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because digital files cannot be opened unless the user knows the chemical formula of the ink.</p>", "feedback": "<p>Incorrect. XML parsers process text without chemical formulas.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To allow students to manufacture counterfeit historical documents.</p>", "feedback": "<p>Incorrect. Scholarly editing promotes historical research, not forgery.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because wax seals contain computer microchips that store data.</p>", "feedback": "<p>Incorrect. 18th-century wax seals are physical wax impressions, not electronic chips.</p>"}]}}, {"step": 11, "title": "Documenting Provenance and Archival Custody", "content": "**Documenting Provenance and Archival Custody**\n\nHow did this piece of paper survive from the past into our hands today? That story is its **provenance**.\n\nDocumenting provenance prevents forgeries and explains why texts survived:\n<ul>\n  <li><strong>Institutional Custody:</strong> Treaties and decrees were kept in official colonial council chests or government record offices.</li>\n  <li><strong>Private Custody:</strong> Personal letters were kept in desk drawers, passed down through families, and later sold at estate auctions.</li>\n</ul>\n\nIn TEI XML, record this history inside `<history>` and `<provenance>`:\n<pre><code>&lt;history&gt;\n  &lt;provenance&gt;\n    Purchased by Leonard Kinnear in 1967; preserved in the Kinnear family collection;\n    sold at Heffel Fine Art Auction in 2022.\n  &lt;/provenance&gt;\n&lt;/history&gt;</code></pre>\n\nTracing custody shows that your document is authentic.\n\n**Takeaway:** Provenance documents how a manuscript traveled from its historical creator to modern archives and collections.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Documenting Provenance and Archival Custody", "questiontext": "<p>What is the scholarly purpose of the <provenance> element inside the TEI header?</p>", "generalfeedback": "<p>Provenance documents how a manuscript traveled from its historical creator to modern archives and collections.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To document the historical chain of custody from the original creator through private owners to modern archival repositories.</p>", "feedback": "<p>Correct. Provenance establishes document authenticity by tracing its ownership and preservation history over time.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To calculate how many miles the manuscript traveled on an airplane.</p>", "feedback": "<p>Incorrect. Provenance records historical ownership and archival custody, not flight mileage.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To record the bank account numbers of private manuscript collectors.</p>", "feedback": "<p>Incorrect. Financial account details must never be stored in scholarly metadata.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To determine which student types the fastest in the computer lab.</p>", "feedback": "<p>Incorrect. Provenance pertains to historical artifact custody.</p>"}]}}, {"step": 12, "title": "The TEI Editorial Declaration: `<editorialDecl>`", "content": "**The TEI Editorial Declaration: `<editorialDecl>`**\n\nThe most important part of your technical introduction is the **Editorial Declaration** (`<editorialDecl>`).\n\nThe `<editorialDecl>` lives inside `<encodingDesc>`. It is the formal contract between you and your reader. It states your exact editorial policies:\n<ul>\n  <li>Did you silently fix spelling mistakes, or did you preserve them?</li>\n  <li>Did you expand abbreviations?</li>\n  <li>How did you divide sentences?</li>\n  <li>What secondary dictionaries did you consult?</li>\n</ul>\n\nIf an editor changes a historical text without explaining their rules, readers cannot trust the edition. The `<editorialDecl>` makes every rule explicit.\n\n**Takeaway:** The editorialDecl element declares your explicit rules for transcription, correction, and normalization, ensuring scholarly trust.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: The TEI Editorial Declaration: editorialDecl", "questiontext": "<p>What is the function of the <editorialDecl> element in the TEI header?</p>", "generalfeedback": "<p>The editorialDecl element declares your explicit rules for transcription, correction, and normalization, ensuring scholarly trust.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It declares explicit policies governing transcription fidelity, spelling normalization, correction, and annotation scope.</p>", "feedback": "<p>Correct. The editorial declaration serves as the methodological contract explaining all editorial choices to the reader.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically submits student grades to the university registrar.</p>", "feedback": "<p>Incorrect. The editorial declaration is scholarly metadata, not an administrative grading tool.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes any spelling mistake without notifying the reader.</p>", "feedback": "<p>Incorrect. Editorial declarations make changes explicit and transparent.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes the background color of the operating system.</p>", "feedback": "<p>Incorrect. Editorial declarations contain text-critical metadata.</p>"}]}}, {"step": 13, "title": "The `<correction>` Element: Handling Errors and Emendations", "content": "**The `<correction>` Element: Handling Errors and Emendations**\n\nEvery historical document contains scribal slips, printer errors, or ink blots. The `<correction>` element explains how you handled them:\n<pre><code>&lt;editorialDecl&gt;\n  &lt;correction status=\"high\" method=\"markup\"&gt;\n    &lt;p&gt;Apparent scribal slips are preserved in the text using &lt;orig&gt; tags.\n    Editorial corrections are supplied in &lt;reg&gt; or &lt;corr&gt; without altering\n    the diplomatic baseline.&lt;/p&gt;\n  &lt;/correction&gt;\n&lt;/editorialDecl&gt;</code></pre>\n\nAttributes explain your approach:\n<ul>\n  <li><code>status=\"high\"</code> means you checked corrections carefully against the image.</li>\n  <li><code>method=\"markup\"</code> means you used TEI tags (like <code>&lt;choice&gt;</code>) rather than silently rewriting words.</li>\n</ul>\n\nThis transparency protects historical evidence.\n\n**Takeaway:** The correction element explains how scribal slips and typographical errors were identified, preserved, or corrected.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: The correction Element: Handling Errors and Emendations", "questiontext": "<p>In the TEI <correction> declaration, what does the attribute method='markup' signify?</p>", "generalfeedback": "<p>The correction element explains how scribal slips and typographical errors were identified, preserved, or corrected.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>That corrections are applied using explicit TEI tags (like <choice>) rather than silently altering the source text.</p>", "feedback": "<p>Correct. Method='markup' indicates that both original and corrected readings remain visible in the XML tree.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the editor used a red felt-tip marker on the original parchment.</p>", "feedback": "<p>Incorrect. Scholars never deface physical archival manuscripts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the document was converted into an uncompressed audio file.</p>", "feedback": "<p>Incorrect. Method='markup' describes digital XML tagging conventions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the editor refused to correct any errors under any circumstances.</p>", "feedback": "<p>Incorrect. Method='markup' indicates that corrections were made via transparent tags.</p>"}]}}, {"step": 14, "title": "The `<normalization>` Element: Articulating Regularization Rules", "content": "**The `<normalization>` Element: Articulating Regularization Rules**\n\nIn Module 6, you studied normalization. You learned how to regularize historical spelling variations using `<choice>`, `<orig>`, and `<reg>`.\n\nInside `<normalization>`, summarize the rules from your `NORMALIZATION.md` ledger:\n<pre><code>&lt;normalization method=\"markup\"&gt;\n  &lt;p&gt;Historical spelling forms are retained in &lt;orig&gt; and regularized\n  to modern orthography in &lt;reg&gt;. In the 1791 French decree, eighteenth-century\n  imperfect verb endings in -oit are regularized to modern -ait.&lt;/p&gt;\n&lt;/normalization&gt;</code></pre>\n\nStating these rules clearly helps readers understand your search features.\n\n**Takeaway:** The normalization element documents regularized spelling patterns, such as updating eighteenth-century verb endings.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: The normalization Element: Articulating Regularization Rules", "questiontext": "<p>Why must the <normalization> element provide concrete examples of regularized historical spellings?</p>", "generalfeedback": "<p>The normalization element documents regularized spelling patterns, such as updating eighteenth-century verb endings.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To provide readers and search software with exact rules on how archaic variants (like -oit to -ait) were modernized.</p>", "feedback": "<p>Correct. Clear rules ensure that searches across regularized text behave predictably and transparently.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because readers will be fined if they misspell historical French verbs.</p>", "feedback": "<p>Incorrect. Academic documentation serves clarity, not financial penalties.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prove that eighteenth-century scribes were uneducated.</p>", "feedback": "<p>Incorrect. Historical spelling reflected contemporary conventions, not lack of education.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI schemas reject any document with fewer than fifty examples.</p>", "feedback": "<p>Incorrect. Schemas validate XML structure, not arbitrary quota counts.</p>"}]}}, {"step": 15, "title": "The `<quotation>` and `<hyphenation>` Elements", "content": "**The `<quotation>` and `<hyphenation>` Elements**\n\nPunctuation and line breaks present special editorial problems in historical texts:\n<ul>\n  <li><strong>Quotation Marks:</strong> 18th-century scribes often used margin marks or indentation instead of modern quotation marks.</li>\n  <li><strong>End-of-Line Hyphens:</strong> When a word splits across two lines, did you keep the hyphen or join the word?</li>\n</ul>\n\nExplain your policy using standard TEI elements:\n<pre><code>&lt;quotation marks=\"none\"&gt;\n  &lt;p&gt;Direct speech is not enclosed in modern quotation marks unless present\n  in the primary ink.&lt;/p&gt;\n&lt;/quotation&gt;\n&lt;hyphenation eol=\"all\"&gt;\n  &lt;p&gt;End-of-line hyphens are preserved as written on the page using milestone\n  &lt;lb break=\"no\"/&gt; elements.&lt;/p&gt;\n&lt;/hyphenation&gt;</code></pre>\n\nThese declarations ensure your text can be searched and displayed accurately.\n\n**Takeaway:** Declare quotation and hyphenation rules so readers understand how line breaks and spoken dialogue are handled.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: The quotation and hyphenation Elements", "questiontext": "<p>How does declaring hyphenation rules (e.g. eol='all' and <lb break='no'/>) help digital edition users?</p>", "generalfeedback": "<p>Declare quotation and hyphenation rules so readers understand how line breaks and spoken dialogue are handled.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It clarifies whether words split across line breaks are preserved with hyphens or rejoined for digital full-text searching.</p>", "feedback": "<p>Correct. Proper hyphenation markup preserves lineation while allowing search engines to match compound words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It permanently deletes all hyphens from the English language.</p>", "feedback": "<p>Incorrect. Hyphenation rules govern specific document formatting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces web browsers to display all text in a single vertical column.</p>", "feedback": "<p>Incorrect. Layout rendering is controlled by CSS, not hyphenation metadata.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It prevents readers from copying and pasting text.</p>", "feedback": "<p>Incorrect. TEI editions promote accessible, reusable scholarship.</p>"}]}}, {"step": 16, "title": "The `<interpretation>` Element: Defining Annotation Scope", "content": "**The `<interpretation>` Element: Defining Annotation Scope**\n\nIn Module 12, you wrote commentary notes. In your editorial declaration, use `<interpretation>` to define the scope of your notes:\n<pre><code>&lt;interpretation&gt;\n  &lt;p&gt;Scholarly commentary notes are organized into three distinct categories:\n  philological (explaining archaic words), historical (documenting institutions\n  and events), and intertextual (tracing legal text reuse). All notes are stored\n  in stand-off markup within &lt;standOff&gt;.&lt;/p&gt;\n&lt;/interpretation&gt;</code></pre>\n\nThis tells readers what kinds of notes to expect and where they are stored in the XML document.\n\n**Takeaway:** The interpretation element explains the categories, purpose, and standoff architecture of your commentary notes.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: The interpretation Element: Defining Annotation Scope", "questiontext": "<p>What should an editor define inside the <interpretation> element of their editorial declaration?</p>", "generalfeedback": "<p>The interpretation element explains the categories, purpose, and standoff architecture of your commentary notes.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The thematic categories, scholarly purpose, and standoff architecture of their commentary notes.</p>", "feedback": "<p>Correct. The interpretation element explains the taxonomy and research goals guiding explanatory notes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Their personal political opinions about modern elections.</p>", "feedback": "<p>Incorrect. Editorial declarations pertain to the historical edition, not modern partisan politics.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The names of all movie actors who starred in historical films.</p>", "feedback": "<p>Incorrect. Commentary declarations focus on the primary textual witness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The daily weather forecast for Halifax during the exam period.</p>", "feedback": "<p>Incorrect. Editorial paratexts document scholarship, not meteorology.</p>"}]}}, {"step": 17, "title": "Stating Linguistic Policies: Lemmas, Glosses, and Dictionaries", "content": "**Stating Linguistic Policies: Lemmas, Glosses, and Dictionaries**\n\nIn Module 8 and Module 11, you parsed grammar and aligned translations. In your introduction, document the reference dictionaries you consulted:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 30%;\">Document</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">Linguistic Focus</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">Authoritative Reference</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>1791 French Decree</strong></td>\n      <td style=\"padding: 8px;\">Revolutionary legal French</td>\n      <td style=\"padding: 8px;\"><em>Dictionnaire de l'Académie française</em> (5th ed., 1798).</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>1752 Peace Treaty</strong></td>\n      <td style=\"padding: 8px;\">Colonial British treaty English</td>\n      <td style=\"padding: 8px;\">Oxford English Dictionary historical quotations.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>1967 Maud Lewis Letter</strong></td>\n      <td style=\"padding: 8px;\">Maritime folk phonetic dialect</td>\n      <td style=\"padding: 8px;\">Dictionary of Canadianisms on Historical Principles.</td>\n    </tr>\n  </tbody>\n</table>\n\nNaming your reference sources proves that your linguistic tags reflect sound scholarship.\n\n**Takeaway:** Citing authoritative historical dictionaries in your introduction validates your linguistic lemmas and grammatical glosses.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Stating Linguistic Policies: Lemmas, Glosses, and Dictionaries", "questiontext": "<p>Why is citing specific historical dictionaries (like the 1798 Academy dictionary or the OED) essential in your introduction?</p>", "generalfeedback": "<p>Citing authoritative historical dictionaries in your introduction validates your linguistic lemmas and grammatical glosses.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It establishes the empirical authority behind your lemmatizations and grammatical glosses, proving they reflect historical usage.</p>", "feedback": "<p>Correct. Grounding linguistic analysis in authoritative dictionaries ensures that definitions reflect historical reality.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because digital editions are required to purchase advertisements for dictionary publishers.</p>", "feedback": "<p>Incorrect. Citing scholarly dictionaries is academic attribution, not commercial marketing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prove that historical words have never changed their meanings over time.</p>", "feedback": "<p>Incorrect. Languages evolve continuously; historical dictionaries document that evolution.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because XML parsers crash if they cannot connect to an online dictionary API.</p>", "feedback": "<p>Incorrect. XML files are standalone documents that do not depend on external APIs to validate.</p>"}]}}, {"step": 18, "title": "Stating Named Entity and Authority Control Policies", "content": "**Stating Named Entity and Authority Control Policies**\n\nIn Module 9, you tagged historical people, places, and organizations. Your introduction should explain your authority control policy:\n<ul>\n  <li>Which authority registries did you consult (Wikidata, VIAF, Canadian Biography)?</li>\n  <li>How did you handle people who do not appear in official databases?</li>\n  <li>How did you handle historical places whose names have changed?</li>\n</ul>\n\nExplain that unlisted historical people (like local Digby neighbors) are described through careful archive notes, while prominent figures link to persistent Wikidata QIDs.\n\n**Takeaway:** Document your authority control strategy, explaining how historical entities are linked to Wikidata, VIAF, or local archive records.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Stating Named Entity and Authority Control Policies", "questiontext": "<p>How should an editorial introduction address historical figures who lack official records in global authority databases like VIAF?</p>", "generalfeedback": "<p>Document your authority control strategy, explaining how historical entities are linked to Wikidata, VIAF, or local archive records.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By explaining that unlisted individuals are identified through local archival records, while prominent figures link to Wikidata QIDs.</p>", "feedback": "<p>Correct. A mature digital edition accounts for both prominent figures and historically marginalized local individuals.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By deleting unlisted people from the historical transcription.</p>", "feedback": "<p>Incorrect. Editors never erase real historical people from primary sources.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By inventing fake authority records with fabricated numbers.</p>", "feedback": "<p>Incorrect. Fabricating authority identifiers violates academic integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By claiming that all people without Wikipedia pages never existed.</p>", "feedback": "<p>Incorrect. Most historical people lived without modern encyclopedic entries.</p>"}]}}, {"step": 19, "title": "Stating Commentary Policies: Documenting AI Assistance and HITL Vetting", "content": "**Stating Commentary Policies: Documenting AI Assistance and HITL Vetting**\n\nIn Module 12, you used AI assistants to draft commentary notes under strict Human-in-the-Loop (HITL) supervision.\n\nYour introduction must state this computational method openly:\n<p style=\"background-color: #f8fafc; border-left: 4px solid #64748b; padding: 12px; margin: 12px 0;\">\n<em>\"Initial commentary drafts were generated using large language models. All factual claims, treaty clauses, and historical citations were audited against primary archival witnesses by the human editor. Fabricated references were rejected. Final editorial authority rests exclusively with the human editor, recorded via @resp attributes.\"</em>\n</p>\n\nHonest disclosure is the gold standard of modern digital scholarship.\n\n**Takeaway:** The introduction must explicitly disclose AI assistance, describing the verification protocols used to ensure historical accuracy.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Stating Commentary Policies: Documenting AI Assistance and HITL Vetting", "questiontext": "<p>What is the required standard for disclosing generative AI assistance in a scholarly digital edition?</p>", "generalfeedback": "<p>The introduction must explicitly disclose AI assistance, describing the verification protocols used to ensure historical accuracy.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Explicitly disclosing the AI model used, describing the prompt guardrails, and documenting human verification protocols in the method statement.</p>", "feedback": "<p>Correct. Academic integrity requires transparent disclosure of AI drafting tools alongside proof of human editorial verification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Pretending the AI model was a human co-author with a faculty appointment.</p>", "feedback": "<p>Incorrect. AI models are software tools, not human academic authors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Concealing AI assistance completely to avoid academic scrutiny.</p>", "feedback": "<p>Incorrect. Secret AI use constitutes academic dishonesty.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Refusing to publish any edition that touched a computer.</p>", "feedback": "<p>Incorrect. Computational methods are welcomed when practiced transparently and critically.</p>"}]}}, {"step": 20, "title": "The Editorial Method Statement: Ethical Transparency", "content": "**The Editorial Method Statement: Ethical Transparency**\n\nPutting all these policies together produces your **Editorial Method Statement**.\n\nThis statement appears as a prominent section in your introduction. It explains:\n<ol>\n  <li>The scope of the project and why this document was chosen.</li>\n  <li>The principles governing transcription and character representation.</li>\n  <li>The criteria used to annotate people, places, and legal terms.</li>\n  <li>The tools used for digital encoding and verification.</li>\n</ol>\n\nWriting this statement gives you an opportunity to reflect on your journey as a digital humanist.\n\n**Takeaway:** The Editorial Method Statement synthesizes your transcription, normalization, annotation, and verification principles into a clear public manifesto.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: The Editorial Method Statement: Ethical Transparency", "questiontext": "<p>What is the purpose of an Editorial Method Statement in a capstone digital edition?</p>", "generalfeedback": "<p>The Editorial Method Statement synthesizes your transcription, normalization, annotation, and verification principles into a clear public manifesto.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To synthesize all transcription, normalization, annotation, and verification principles into a clear, unified public manifesto.</p>", "feedback": "<p>Correct. The method statement articulates the editor's overarching philosophy, making their scholarship transparent and reproducible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To serve as a legal waiver preventing readers from criticizing the edition.</p>", "feedback": "<p>Incorrect. Scholarship invites peer critique and review.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To list the retail price of printed copies of the edition.</p>", "feedback": "<p>Incorrect. Method statements articulate scholarly principles, not retail pricing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To replace the need for providing any primary text.</p>", "feedback": "<p>Incorrect. The method statement introduces and accompanies the primary text.</p>"}]}}, {"step": 21, "title": "Licensing and Copyright in `<publicationStmt>`", "content": "**Licensing and Copyright in `<publicationStmt>`**\n\nWho owns your digital edition? Can other scholars reuse your XML code?\n\nYou must answer these questions inside `<publicationStmt>`:\n<pre><code>&lt;publicationStmt&gt;\n  &lt;publisher&gt;St. Francis Xavier University&lt;/publisher&gt;\n  &lt;pubPlace&gt;Antigonish, Nova Scotia&lt;/pubPlace&gt;\n  &lt;date when=\"2026-12\"&gt;December 2026&lt;/date&gt;\n  &lt;availability status=\"free\"&gt;\n    &lt;licence target=\"https://creativecommons.org/licenses/by/4.0/\"&gt;\n      Distributed under a Creative Commons Attribution 4.0 International License (CC BY 4.0).\n    &lt;/licence&gt;\n  &lt;/availability&gt;\n&lt;/publicationStmt&gt;</code></pre>\n\nWithout a license, your work exists in legal limbo. With a Creative Commons license, scholars around the world can study and build upon your research.\n\n**Takeaway:** Declare publisher, publication date, and open access licensing in publicationStmt to make your edition legally reusable.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Licensing and Copyright in publicationStmt", "questiontext": "<p>What legal problem occurs if a digital edition is published without a license in <publicationStmt>?</p>", "generalfeedback": "<p>Declare publisher, publication date, and open access licensing in publicationStmt to make your edition legally reusable.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The edition exists under 'all rights reserved' by default, creating legal uncertainty that prevents other scholars from reusing the data.</p>", "feedback": "<p>Correct. Declaring an open license grants explicit legal permission for researchers to study and build upon your XML data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The computer hard drive automatically erases itself after forty-eight hours.</p>", "feedback": "<p>Incorrect. Lack of a license creates legal ambiguity, not hardware failure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The university police immediately confiscate the student's laptop.</p>", "feedback": "<p>Incorrect. Licensing is an intellectual property standard, not a criminal matter.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The document is automatically translated into ancient Greek.</p>", "feedback": "<p>Incorrect. Licensing affects legal reuse rights, not language translation.</p>"}]}}, {"step": 22, "title": "Choosing an Open Access License: Creative Commons (CC BY / CC0)", "content": "**Choosing an Open Access License: Creative Commons (CC BY / CC0)**\n\nIn digital humanities, we practice **multi-tiered licensing**:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 25%;\">Project Asset</th>\n      <th style=\"padding: 8px; text-align: left; width: 35%;\">Recommended License</th>\n      <th style=\"padding: 8px; text-align: left; width: 40%;\">What It Allows</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Editorial Text &amp; Notes</strong></td>\n      <td style=\"padding: 8px;\"><strong>CC BY 4.0</strong> (Attribution)</td>\n      <td style=\"padding: 8px;\">Free sharing and adaptation, provided you receive author credit.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Metadata &amp; XML Schemas</strong></td>\n      <td style=\"padding: 8px;\"><strong>CC0 1.0</strong> (Public Domain)</td>\n      <td style=\"padding: 8px;\">Unrestricted global sharing for library discovery catalogs.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Python / Shell Scripts</strong></td>\n      <td style=\"padding: 8px;\"><strong>MIT License</strong></td>\n      <td style=\"padding: 8px;\">Free software reuse and modification by other programmers.</td>\n    </tr>\n  </tbody>\n</table>\n\nApplying the right license to each layer ensures maximum accessibility and fair scholarly credit.\n\n**Takeaway:** Use CC BY for editorial prose, CC0 for catalogue metadata, and MIT for scripts to enable open scholarship.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Choosing an Open Access License: Creative Commons (CC BY / CC0)", "questiontext": "<p>In multi-tiered licensing, which license is recommended for catalogue metadata and XML schemas to ensure maximum library discovery?</p>", "generalfeedback": "<p>Use CC BY for editorial prose, CC0 for catalogue metadata, and MIT for scripts to enable open scholarship.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Creative Commons Zero (CC0 1.0 Public Domain Dedication), allowing unrestricted global harvesting by library systems.</p>", "feedback": "<p>Correct. CC0 waives copyright restrictions on metadata, allowing global library catalogs to index your edition freely.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Strict All Rights Reserved commercial copyright.</p>", "feedback": "<p>Incorrect. All Rights Reserved prevents open library catalog harvesting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A commercial patent held by Apple or Google.</p>", "feedback": "<p>Incorrect. Digital editions are scholarly works, not commercial hardware patents.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>A secret nondisclosure agreement signed by the instructor.</p>", "feedback": "<p>Incorrect. Open access scholarship promotes public discovery rather than secrecy.</p>"}]}}, {"step": 23, "title": "Organizing the Capstone Project Repository in VS Code", "content": "**Organizing the Capstone Project Repository in VS Code**\n\nBefore assembling your master files, organize your project workspace into a clean folder structure:\n<pre><code>my_edition_portfolio/\n├── README.md               # Public introduction and project overview\n├── LICENSE.md              # Open access licensing terms\n├── index.html              # Interactive web edition player\n├── edition.pdf             # Formatted print-ready PDF volume\n└── xml/\n    ├── edition_master.xml  # Complete canonical TEI XML document\n    └── schema/             # TEI Relax NG schema file</code></pre>\n\nA tidy project folder makes compiling and testing smooth. It also allows external scholars to explore your code easily on GitHub.\n\n**Takeaway:** Organize your project into clear folders for XML sources, web players, PDF deliverables, and license documentation.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Organizing the Capstone Project Repository in VS Code", "questiontext": "<p>Why is a clean folder structure (separating XML sources, web players, and PDF outputs) vital in a project repository?</p>", "generalfeedback": "<p>Organize your project into clear folders for XML sources, web players, PDF deliverables, and license documentation.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It ensures that transformation scripts run smoothly and allows external scholars to navigate your edition easily on GitHub.</p>", "feedback": "<p>Correct. Consistent directory organization is essential for automated build pipelines and open research collaboration.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because disorganized folders cause laptops to overheat and catch fire.</p>", "feedback": "<p>Incorrect. Folder organization affects workflow clarity, not hardware temperature.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because GitHub deletes repositories that contain more than three folders.</p>", "feedback": "<p>Incorrect. GitHub supports deeply nested directory structures.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To hide your primary XML files from your classmates.</p>", "feedback": "<p>Incorrect. Repositories are designed for transparent sharing and peer review.</p>"}]}}, {"step": 24, "title": "Master File Structure: Combining Header, Text, and Standoff", "content": "**Master File Structure: Combining Header, Text, and Standoff**\n\nYour final `edition_master.xml` file brings all your semester work into one elegant document:\n<pre><code>&lt;TEI xmlns=\"http://www.tei-c.org/ns/1.0\"&gt;\n  &lt;teiHeader&gt;\n    &lt;fileDesc&gt; ... &lt;/fileDesc&gt;\n    &lt;encodingDesc&gt;\n      &lt;editorialDecl&gt; ... &lt;/editorialDecl&gt;\n    &lt;/encodingDesc&gt;\n  &lt;/teiHeader&gt;\n  &lt;facsimile&gt; ... &lt;/facsimile&gt;\n  &lt;text&gt;\n    &lt;body&gt; ... &lt;/body&gt;\n  &lt;/text&gt;\n  &lt;standOff&gt;\n    &lt;interpGrp type=\"commentary\"&gt; ... &lt;/interpGrp&gt;\n  &lt;/standOff&gt;\n&lt;/TEI&gt;</code></pre>\n\nEvery element has its proper place. The `<teiHeader>` describes the edition, `<text>` holds the primary words, and `<standOff>` holds your research commentary.\n\n**Takeaway:** The canonical TEI master document combines teiHeader, facsimile, text body, and standOff commentary in a single XML file.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Master File Structure: Combining Header, Text, and Standoff", "questiontext": "<p>What are the three primary child elements directly under the root <TEI> element in our master edition?</p>", "generalfeedback": "<p>The canonical TEI master document combines teiHeader, facsimile, text body, and standOff commentary in a single XML file.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<teiHeader> (metadata and policies), <text> (primary body transcription), and <standOff> (commentary notes).", "feedback": "<p>Correct. This tripartite architecture cleanly separates document metadata, primary transcription, and interpretive research.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<title>, <author>, and <date>.", "feedback": "<p>Incorrect. These are sub-elements inside the header, not primary children of root TEI.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<html>, <head>, and <body>.", "feedback": "<p>Incorrect. These are standard HTML web elements, not TEI P5 elements.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<file1>, <file2>, and <file3>.", "feedback": "<p>Incorrect. TEI uses semantic element names established by international guidelines.</p>"}]}}, {"step": 25, "title": "Validating the Master TEI File Against Schema", "content": "**Validating the Master TEI File Against Schema**\n\nBefore publishing any digital edition, you must test its syntax. A broken XML tag can crash web players or break PDF layout pipelines.\n\nIn VS Code, run your validation sweep:\n<ol>\n  <li><strong>Check Well-Formedness:</strong> Confirm all opening tags have matching closing tags.</li>\n  <li><strong>Verify XML Identifiers:</strong> Confirm that every <code>xml:id</code> is unique and that every <code>@target</code> pointer begins with a hash mark (<code>#</code>).</li>\n  <li><strong>Validate Against Schema:</strong> Check your file against the official TEI Relax NG schema in VS Code.</li>\n</ol>\n\nA green checkmark in VS Code confirms that your document complies with international digital humanities standards.\n\n**Takeaway:** Run schema validation in VS Code to ensure well-formed tags, unique identifiers, and valid pointer references.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Validating the Master TEI File Against Schema", "questiontext": "<p>What does a green validation checkmark in VS Code indicate when checking your master TEI XML file?</p>", "generalfeedback": "<p>Run schema validation in VS Code to ensure well-formed tags, unique identifiers, and valid pointer references.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>That your XML markup is well-formed, contains unique identifiers, and strictly adheres to the official TEI Relax NG schema rules.</p>", "feedback": "<p>Correct. Validation confirms that your digital edition complies with international standards without syntax errors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That your historical essay has received a final grade of 100%.</p>", "feedback": "<p>Incorrect. Schema validation verifies technical syntax, not qualitative grading.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That the computer battery is fully charged.</p>", "feedback": "<p>Incorrect. Validation checkmarks indicate XML compliance, not battery status.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>That all historical people mentioned in the document are still alive.</p>", "feedback": "<p>Incorrect. Technical validators inspect code structure, not biological longevity.</p>"}]}}, {"step": 26, "title": "Writing a Project README.md for External Scholars", "content": "**Writing a Project README.md for External Scholars**\n\nWhen visitors view your GitHub repository, the first file they see is `README.md`.\n\nYour `README.md` acts as your project's digital front door:\n<ul>\n  <li><strong>Project Title:</strong> State the document title and your name.</li>\n  <li><strong>Project Summary:</strong> Two paragraphs explaining what the document is and why it matters.</li>\n  <li><strong>Quick Start:</strong> Instructions on how to view the interactive web edition or download the PDF.</li>\n  <li><strong>Editorial Summary:</strong> A concise summary of your transcription and commentary policies.</li>\n  <li><strong>Citation:</strong> How other scholars should cite your digital edition in their research.</li>\n</ul>\n\nA clear README invites the world to explore your scholarship.\n\n**Takeaway:** The project README.md welcomes visitors, summarizes document history, provides quick viewing links, and provides citation formats.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Writing a Project README.md for External Scholars", "questiontext": "<p>Why is the project README.md called the 'digital front door' of your edition repository?</p>", "generalfeedback": "<p>The project README.md welcomes visitors, summarizes document history, provides quick viewing links, and provides citation formats.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because it is the first file displayed when visitors arrive at your repository, welcoming readers and explaining how to explore the edition.</p>", "feedback": "<p>Correct. A well-crafted README orients visitors, provides viewing links, and outlines project goals.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because it locks the repository so that nobody can view the files.</p>", "feedback": "<p>Incorrect. The README invites visitors rather than locking files.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because it acts as a physical wooden door on the computer screen.</p>", "feedback": "<p>Incorrect. 'Front door' is a metaphor for welcoming introductory documentation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because it only works when accessed from a front porch.</p>", "feedback": "<p>Incorrect. The README can be accessed globally on any web connection.</p>"}]}}, {"step": 27, "title": "Peer Reviewing the Editorial Introduction", "content": "**Peer Reviewing the Editorial Introduction**\n\nScholarly publishing relies on **peer review**. Before submitting your capstone edition, exchange introductions with a classmate.\n\nWhen reviewing a classmate's introduction, ask:\n<ul>\n  <li>Does the introduction clearly explain who wrote the document and where it is kept?</li>\n  <li>Are the physical dimensions and materials described accurately?</li>\n  <li>Does the editorial declaration clearly explain how spelling variations were handled?</li>\n  <li>Is the prose clear, engaging, and free of modern clichés?</li>\n</ul>\n\nConstructive peer feedback helps you catch missing details before final evaluation.\n\n**Takeaway:** Peer review helps editors identify missing archival details and clarify editorial principles before final publication.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Peer Reviewing the Editorial Introduction", "questiontext": "<p>How does exchanging editorial introductions with a classmate during peer review improve your edition?</p>", "generalfeedback": "<p>Peer review helps editors identify missing archival details and clarify editorial principles before final publication.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows an outside reader to identify missing archival shelfmarks, vague normalization rules, or unclear historical context before final submission.</p>", "feedback": "<p>Correct. Peer review catches oversights and ensures that your principles are understandable to other scholars.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows students to copy each other's homework without doing any research.</p>", "feedback": "<p>Incorrect. Peer review provides constructive feedback on unique individual projects.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It forces both students to change their primary historical documents.</p>", "feedback": "<p>Incorrect. Peer review refines documentation without changing project witnesses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically publishes the edition in a major academic journal.</p>", "feedback": "<p>Incorrect. Classroom peer review prepares students for formal scholarly publication standards.</p>"}]}}, {"step": 28, "title": "Common Flaws in Student Editorial Introductions", "content": "**Common Flaws in Student Editorial Introductions**\n\nWhen reviewing your introduction, watch out for these frequent beginner mistakes:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px; text-align: left; width: 30%;\">Common Flaw</th>\n      <th style=\"padding: 8px; text-align: left; width: 70%;\">Editorial Correction</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Missing Shelfmark</strong></td>\n      <td style=\"padding: 8px;\">Always state the exact archival repository name and call number.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Vague Normalization Rules</strong></td>\n      <td style=\"padding: 8px;\">Do not just say \"spelling was modernized\"; give specific examples of updated verb endings or letters.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Unattributed AI Drafts</strong></td>\n      <td style=\"padding: 8px;\">Always disclose AI drafting tools and describe human verification steps.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Broken XML Targets</strong></td>\n      <td style=\"padding: 8px;\">Check that every <code>@target</code> points to a real <code>xml:id</code> anchor in your text.</td>\n    </tr>\n  </tbody>\n</table>\n\nEliminating these flaws ensures your edition achieves professional quality.\n\n**Takeaway:** Avoid common beginner errors by providing specific shelfmarks, concrete normalization examples, and verified XML pointers.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Common Flaws in Student Editorial Introductions", "questiontext": "<p>Which common beginner mistake undermines the scholarly trust of an editorial introduction?</p>", "generalfeedback": "<p>Avoid common beginner errors by providing specific shelfmarks, concrete normalization examples, and verified XML pointers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Failing to provide the exact archival repository name, shelfmark, and call number for the primary witness.</p>", "feedback": "<p>Correct. An edition without archival shelfmarks cannot be verified against the physical artifact.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Using 12-point font instead of 11-point font in notes.</p>", "feedback": "<p>Incorrect. Font size is a styling choice, not an epistemological flaw.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Writing in complete, grammatical English sentences.</p>", "feedback": "<p>Incorrect. Clear, grammatical writing is the hallmark of good scholarship.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Citing authoritative historical dictionaries.</p>", "feedback": "<p>Incorrect. Citing authoritative dictionaries strengthens an edition.</p>"}]}}, {"step": 29, "title": "Checklists for Editorial Completeness", "content": "**Checklists for Editorial Completeness**\n\nBefore moving to visual styling in tomorrow's lesson, verify your editorial completeness:\n<ul>\n  <li>[ ] Is the historical narrative preface written and saved in <code>README.md</code>?</li>\n  <li>[ ] Is the <code>&lt;msDesc&gt;</code> complete with repository, support, and physical dimensions?</li>\n  <li>[ ] Does the <code>&lt;editorialDecl&gt;</code> contain explicit <code>&lt;correction&gt;</code> and <code>&lt;normalization&gt;</code> tags?</li>\n  <li>[ ] Are reference dictionaries and authority files explicitly named?</li>\n  <li>[ ] Is the open access license declared in <code>&lt;publicationStmt&gt;</code> and <code>LICENSE.md</code>?</li>\n  <li>[ ] Does the enti
