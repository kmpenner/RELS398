back": "<p>Converting TEI standoff notes into W3C JSON-LD makes your commentary accessible to web browsers and external digital archives.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Inside the 'body' property within a 'TextualBody' object.</p>", "feedback": "<p>Correct. The W3C specification places annotation comments inside the body property, typically with type 'TextualBody'.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside the computer's operating system kernel.</p>", "feedback": "<p>Incorrect. Note data resides inside the JSON-LD data structure.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>In the filename of the computer hard drive partition.</p>", "feedback": "<p>Incorrect. Textual content is encoded in the file body, not disk partition labels.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside an invisible comment hidden from web browsers.</p>", "feedback": "<p>Incorrect. The body is the primary visible content payload of the annotation.</p>"}]}}, {"step": 26, "title": "Designing a rule-based Commentary Index Table", "content": "**Designing a rule-based Commentary Index Table**\n\nIn your digital edition, readers need a way to browse notes by category without reading every page linearly. A rule-based commentary index provides this structured access.\n\nAn effective index table includes five core columns:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px. Text-align: left;\">Note ID</th>\n      <th style=\"padding: 8px. Text-align: left;\">Anchor Target</th>\n      <th style=\"padding: 8px. Text-align: left;\">Category &amp. Subtype</th>\n      <th style=\"padding: 8px. Text-align: left;\">Headword / Topic</th>\n      <th style=\"padding: 8px. Text-align: left;\">External Authority Link</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><code>note_01</code></td>\n      <td style=\"padding: 8px;\"><code>#s3</code></td>\n      <td style=\"padding: 8px;\">Historical / Biographical</td>\n      <td style=\"padding: 8px;\">Chief Jean-Baptiste Cope</td>\n      <td style=\"padding: 8px;\">Dictionary of Canadian Biography (biographi.ca)</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><code>note_02</code></td>\n      <td style=\"padding: 8px;\"><code>#w14</code></td>\n      <td style=\"padding: 8px;\">Philological / word</td>\n      <td style=\"padding: 8px;\">Truckhouse</td>\n      <td style=\"padding: 8px;\">Oxford English Dictionary</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><code>note_03</code></td>\n      <td style=\"padding: 8px;\"><code>#s5</code></td>\n      <td style=\"padding: 8px;\">text-linking / Legal</td>\n      <td style=\"padding: 8px;\">1725 Dummer's Treaty</td>\n      <td style=\"padding: 8px;\">Nova Scotia Archives RG 1</td>\n    </tr>\n  </tbody>\n</table>\n\nPublishing this index at the end of your edition allows students and researchers to navigate annotations directly by topic.\n\n**Vocabulary.** *Commentary Index* — a structured tabular directory listing all annotations in an edition by identifier, category. Target. *Headword* — the primary term or title identifying a specific reference entry.\n\n**Takeaway:** A commentary index table organizes all edition notes into a clear directory with categories, headwords, and authority links.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Designing a rule-based Commentary Index Table", "questiontext": "<p>What key metadata columns should be included in a commentary index table to enable efficient thematic browsing?</p>", "generalfeedback": "<p>A commentary index table organizes all edition notes into a clear directory with categories, headwords, and authority links.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Note ID, Anchor Target, Category/Subtype, Headword/Topic, and External Authority Link.</p>", "feedback": "<p>Correct. These five columns provide a complete directory allowing readers to navigate notes by identifier, domain, topic, and linked data authority.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Author's home address, social security number, and bank account balance.</p>", "feedback": "<p>Incorrect. Private personal data must never be recorded in digital edition tables.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Monitor refresh rate, keyboard serial number, and room temperature.</p>", "feedback": "<p>Incorrect. Hardware metrics are irrelevant to scholarly commentary indexes.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Three random numbers chosen by rolling dice.</p>", "feedback": "<p>Incorrect. Commentary indexes require accurate, verified scholarly metadata.</p>"}]}}, {"step": 27, "title": "Evaluating Candidate Matches: The Human Gatekeeper", "content": "**Evaluating Candidate Matches: The Human Gatekeeper**\n\nWhen running automated discovery tools, remember that an algorithmic match is only a **proposal**. It is not a proven fact.\n\nEvery automated candidate must pass three human evaluative gates:\n<ol>\n  <li><strong>Gate 1: Historical Plausibility:</strong> Was the earlier text physically accessible to the author? (Maud Lewis in 1967 Digby could not have borrowed phrasing from an unpublished private diary in Paris).</li>\n  <li><strong>Gate 2: Idiomatic Coincidence:</strong> Is the match simply a standard everyday greeting or common speech idiom rather than an intentional literary allusion?</li>\n  <li><strong>Gate 3: Editorial Significance:</strong> Does documenting this connection actually help the reader understand the text, or does it clutter the edition with useless trivia?</li>\n</ol>\n\nIf a candidate match fails any of these gates, reject it. Your reputation as an editor depends on filtering out noise.\n\n**Vocabulary.** *Candidate Match* — a potential text parallel surfaced by an algorithm that requires human verification. *Evaluative Gate* — a strict quality checkpoint a match must satisfy before being admitted to an edition.\n\n**Takeaway:** Treat all algorithmic matches as proposals; apply strict historical plausibility and significance gates before accepting notes into your edition.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Evaluating Candidate Matches: The Human Gatekeeper", "questiontext": "<p>Why must editors apply a historical plausibility gate before accepting an algorithmic match into a scholarly commentary?</p>", "generalfeedback": "<p>Treat all algorithmic matches as proposals; apply strict historical plausibility and significance gates before accepting notes into your edition.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To verify that the earlier text was historically accessible to the author, eliminating coincidental phrase overlaps that could not represent real influence.</p>", "feedback": "<p>Correct. An algorithm only knows that words match; human historians must verify whether historical contact and transmission were plausible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To ensure that the modern digital edition will never be criticized online.</p>", "feedback": "<p>Incorrect. Plausibility gates guarantee scholarly rigor, but do not prevent critique.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because copyright law requires all historical authors to sign digital consent forms.</p>", "feedback": "<p>Incorrect. Historical texts from the 18th and 20th centuries do not require retrospective digital consent.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force the algorithm to run faster on modern computer processors.</p>", "feedback": "<p>Incorrect. Evaluative gates are human intellectual reviews conducted after the algorithm runs.</p>"}]}}, {"step": 28, "title": "Documenting rule-based Discoveries in `COMMENTARY.md`", "content": "**Documenting rule-based Discoveries in `COMMENTARY.md`**\n\nOpen your `COMMENTARY.md` research ledger. Today you record your rule-based experiments and audit findings.\n\nAdd a new section titled `## Wednesday Audit: rule-based Discovery`:\n<ol>\n  <li><strong>Search Strategy:</strong> What keywords, regex proximity patterns, or multi-file searches did you execute?</li>\n  <li><strong>Algorithm Results Table:</strong>\n    <ul>\n      <li>Matches Found: list every surfaced parallel with source location.</li>\n      <li>Classification: label each as True Positive (genuine historical link) or False Positive (coincidental overlap).</li>\n    </ul>\n  </li>\n  <li><strong>Ground Truth Comparison:</strong> Did the automated search catch the notes you wrote on Tuesday? What did it miss, and why?</li>\n  <li><strong>W3C Export Verification:</strong> Confirm that your <code>annotation.json</code> file passes JSON-LD syntax validation.</li>\n</ol>\n\nDocumenting these metrics proves that your edition rests on disciplined comparative research.\n\n**Vocabulary.** *True Positive* — an automated match that represents a genuine, verified historical connection. *False Positive* — an automated match caused by accidental similarity that carries no real historical link.\n\n**Takeaway:** Record search strategies, true/false positive counts, and ground truth comparisons in `COMMENTARY.md` to document your algorithmic audit.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Documenting rule-based Discoveries in COMMENTARY.md", "questiontext": "<p>In your research ledger, why is it essential to distinguish between True Positives and False Positives in your algorithm results table?</p>", "generalfeedback": "<p>Record search strategies, true/false positive counts, and ground truth comparisons in `COMMENTARY.md` to document your algorithmic audit.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It provides an honest, empirical measurement of algorithm precision, documenting which candidate matches were real connections and which were noise.</p>", "feedback": "<p>Correct. Tracking true vs false positives documents the efficacy and limitations of automated text reuse tools.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically deletes all false matches from the internet permanently.</p>", "feedback": "<p>Incorrect. Ledgers record scholarly observations; they do not delete remote web data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves that computer algorithms are always completely useless.</p>", "feedback": "<p>Incorrect. Documenting precision demonstrates the complementary value of automated search alongside human vetting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows the student to avoid writing their final exam.</p>", "feedback": "<p>Incorrect. Research ledgers document laboratory milestones, not exam exemptions.</p>"}]}}, {"step": 29, "title": "Preparing for Friday: The Shift to AI-Assisted Commentary", "content": "**Preparing for Friday: The Shift to AI-Assisted Commentary**\n\nToday you explored rule-based tools. You saw that algorithms excel at rigid, verbatim matching. However, struggle with synonyms, summaries, and cultural meaning.\n\nThis sets the stage for Friday's final step in the comparative cycle: **Artificial Intelligence**.\n\nLarge language models (like Gemini and Claude) operate completely differently from rule-based tools:\n<ul>\n  <li>They understand synonyms, context, and semantic meaning.</li>\n  <li>They can draft fluent, informative explanations of complex historical events in seconds.</li>\n  <li><strong>However:</strong> Unlike rule-based tools, language models can hallucinate plausible-sounding falsehoods, invent non-existent book citations, and misdate historical treaties.</li>\n</ul>\n\nOn Friday, we will test whether AI models can draft accurate commentary notes for Ace, Olyvia. Andromeda's documents, and we will audit their suggestions against Tuesday's manual ground truth and today's rule-based findings.\n\n**Vocabulary.** *Hallucination* — a phenomenon where a generative language model produces plausible-sounding but factually fabricated information. *Three-Way Cycle* — comparing manual human work, rule-based algorithms, and generative AI models.\n\n**Takeaway:** rule-based tools provide predictable string matching, setting the stage for evaluating AI models that understand semantic context but risk factual hallucination.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Preparing for Friday: The Shift to AI-Assisted Commentary", "questiontext": "<p>What fundamental difference distinguishes generative large language models from deterministic search algorithms?</p>", "generalfeedback": "<p>rule-based tools provide predictable string matching, setting the stage for evaluating AI models that understand semantic context but risk factual hallucination.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Language models understand semantic context and generate fluent prose, but carry a significant risk of hallucinating plausible-sounding falsehoods.</p>", "feedback": "<p>Correct. Generative AI excels at synthesizing context and fluency, but requires rigorous verification against hallucinations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Language models only work when disconnected from the internet.</p>", "feedback": "<p>Incorrect. Generative models operate through cloud APIs and local servers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Deterministic algorithms can think and feel emotions, while language models cannot.</p>", "feedback": "<p>Incorrect. Neither tool possesses consciousness; deterministic tools follow fixed rules, while LLMs predict token distributions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Language models never make factual errors under any circumstances.</p>", "feedback": "<p>Incorrect. Generative models frequently hallucinate fake citations and historical inaccuracies.</p>"}]}}, {"step": 30, "title": "Synthesis: The Complementarity of Tools", "content": "**Synthesis: The Complementarity of Tools**\n\nToday you expanded your digital editing toolkit from local XML files to automated search algorithms and international web standards.\n\nYou learned:\n<ul>\n  <li>How rule-based algorithms use stoplists, TF-IDF rarity, and word proximity to uncover text reuse.</li>\n  <li>Why algorithms excel at finding verbatim legal boilerplate but miss conceptual summaries.</li>\n  <li>How the W3C Web Annotation Data Model structures commentary into Annotation, Target, and Body.</li>\n  <li>Why the <code>TextQuoteSelector</code> ensures notes survive website updates on the dynamic web.</li>\n  <li>How Linked Open Data and knowledge graphs connect local archival notes to global scholarship.</li>\n</ul>\n\nNeither manual research nor automated algorithms can solve the challenges of digital editing alone. Manual work ensures intellectual depth. Rule-based tools provide archival scale. Web standards ensure global accessibility. When combined, they produce resilient, world-class scholarly editions.\n\n**Vocabulary.** *Complementarity* — the way different tools and methods compensate for each other's weaknesses when combined effectively. *Scholarly Rigor* — adhering to strict evidential and methodological standards in research.\n\n**Takeaway:** Combining manual human depth, rule-based archival scale, and W3C web standards produces durable, connected digital scholarly editions.", "html": null, "image_b64": null, "question": {"name": "30 Question: Synthesis: The Complementarity of Tools", "questiontext": "<p>How do manual scholarship, deterministic algorithms, and W3C web standards complement one another in digital edition design?</p>", "generalfeedback": "<p>Combining manual human depth, rule-based archival scale, and W3C web standards produces durable, connected digital scholarly editions.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Manual research provides intellectual depth, deterministic tools provide archival scale, and web standards provide global interoperability.</p>", "feedback": "<p>Correct. Combining human depth, algorithmic scale, and open web standards produces resilient, world-class digital editions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They compete against one another until only one single tool survives.</p>", "feedback": "<p>Incorrect. Different tools serve complementary functions within an integrated workflow.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They allow editors to publish historical editions without reading the primary text.</p>", "feedback": "<p>Incorrect. Rigorous digital editing requires deep engagement with the primary witness.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They ensure that no student ever needs to learn computer skills again.</p>", "feedback": "<p>Incorrect. Modern humanities scholarship integrates advanced digital and conceptual competencies.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
</html>
