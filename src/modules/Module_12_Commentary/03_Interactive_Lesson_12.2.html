    <script>
        const lessonData = {"course_title": "Deterministic Intertextual Discovery and Linked Web Annotation", "subtitle": "RELS 398 / ENGL 398 Digital Methods", "total_sections": 30, "slides": [{"step": 1, "title": "The Algorithmic Search for Text Reuse", "content": "**The Algorithmic Search for Text Reuse**\n\nYesterday you wrote commentary notes by hand. You researched historical dictionaries and tracked down legal citations. That manual work is rewarding. However, it is slow. A scholar can only read one sentence at a time. No human editor can memorize thousands of archival pages to spot every hidden cross-reference.\n\nrule-based algorithms solve this scale problem. A rule-based tool runs fixed mathematical and word rules. When given the same input, it always produces the same output. It does not guess or hallucinate like an artificial intelligence model.\n\nIn text analysis, rule-based algorithms look for text reuse. They scan large collections of documents to find repeated phrases, shared legal formulas, and literary echoes.\n\nConsider our three course documents:\n<ul>\n  <li><strong>Andromeda (1752 Treaty):</strong> Did the British authorities copy specific clauses from the earlier 1725 Dummer's Treaty? An algorithm can compare both texts in seconds.</li>\n  <li><strong>Ace (1791 French Decree):</strong> Does the decree reuse standard formulas from the 1789 Declaration of the Rights of Man? An algorithm highlights every matching phrase.</li>\n  <li><strong>Olyvia (1967 Maud Lewis Letter):</strong> Did Maud Lewis use standard phrases when selling her art to collectors? A comparison across her surviving letters reveals her recurring formulas.</li>\n</ul>\n\n**Vocabulary.** *rule-based Algorithm* — a digital process with predictable, rule-based behavior that always yields identical results for a given input. *Text Reuse* — the repetition of identical or modified text across different documents.\n\n**Takeaway:** rule-based text reuse algorithms scan vast document collections using fixed rules to discover shared phrases and citations beyond human memory.\n\n---", "html": null, "image_b64": null, "question": {"name": "01 Question: The Algorithmic Search for Text Reuse", "questiontext": "<p>Why do scholars use deterministic algorithms to search for text reuse across historical archives?</p>", "generalfeedback": "<p>rule-based text reuse algorithms scan vast document collections using fixed rules to discover shared phrases and citations beyond human memory.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They scan vast document collections using fixed rules to discover shared phrases and citations beyond human memory limits.</p>", "feedback": "<p>Correct. Deterministic algorithms run predictable, rule-based operations that never hallucinate, surfacing connections humans miss.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They rewrite historical documents into modern slang automatically.</p>", "feedback": "<p>Incorrect. Text reuse algorithms detect shared phrasing, not slang rewriting.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They delete older archival documents to free up server hard drive space.</p>", "feedback": "<p>Incorrect. Algorithms preserve and analyze historical texts, never delete them.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>They replace human historians with automated robots that grade student papers.</p>", "feedback": "<p>Incorrect. Text discovery tools assist scholars with discovery rather than replacing scholarly evaluation.</p>"}]}}, {"step": 2, "title": "The Mechanics of Text Reuse: word vs. sentence", "content": "**The Mechanics of Text Reuse: word vs. sentence**\n\nWhen writers borrow from earlier texts, they reuse language in different ways. Some writers copy word-for-word. Others modify phrases to fit new contexts.\n\nText reuse falls into two main forms:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px. Text-align: left;\">Reuse Type</th>\n      <th style=\"padding: 8px. Text-align: left;\">Definition</th>\n      <th style=\"padding: 8px. Text-align: left;\">Detection Difficulty</th>\n      <th style=\"padding: 8px. Text-align: left;\">Cohort Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Verbatim Reuse</strong></td>\n      <td style=\"padding: 8px;\">Exact, word-for-word repetition of a phrase</td>\n      <td style=\"padding: 8px;\">Easy (simple string matching in VS Code)</td>\n      <td style=\"padding: 8px;\"><em>\"saving to the said Tribe the free liberty of Hunting\"</em> in 1725 and 1752 treaties.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Modified Reuse</strong></td>\n      <td style=\"padding: 8px;\">Shared vocabulary with altered word order or grammar</td>\n      <td style=\"padding: 8px;\">Moderate (requires lemmatization and proximity rules)</td>\n      <td style=\"padding: 8px;\">French decree modifying a 1790 finance law: changing past tense verbs to modern legal mandates.</td>\n    </tr>\n  </tbody>\n</table>\n\nSimple string search in VS Code (`Cmd+F`) finds verbatim loans easily. But when authors change a word or reorder a clause, simple search fails. Advanced tools use statistical proximity and n-grams to detect these subtle connections.\n\n**Vocabulary.** *Verbatim Reuse* — copying text character-for-character without modification. *Modified Reuse* — adapting an earlier text through summary, grammatical changes, or word omissions.\n\n**Takeaway:** Text reuse ranges from verbatim copying to modified summary, requiring different algorithmic detection strategies.\n\n---", "html": null, "image_b64": null, "question": {"name": "02 Question: The Mechanics of Text Reuse: word vs. sentence", "questiontext": "<p>What is the difference between verbatim text reuse and modified text reuse in historical documents?</p>", "generalfeedback": "<p>Text reuse ranges from verbatim copying to modified summary, requiring different algorithmic detection strategies.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verbatim reuse is exact, word-for-word repetition, while modified reuse adapts language through paraphrase, word order changes, or omission.</p>", "feedback": "<p>Correct. Verbatim loans are easily detected by string matching, whereas modified reuse requires proximity scoring and lemmatization.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Verbatim reuse occurs only in poetry, while modified reuse occurs only in legal statutes.</p>", "feedback": "<p>Incorrect. Both forms of text reuse occur across all genres of historical writing.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Verbatim reuse is always illegal plagiarism, while modified reuse is always authorized.</p>", "feedback": "<p>Incorrect. Historical text reuse was a standard scribal and legal drafting practice, not modern copyright infringement.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Verbatim reuse changes the language, while modified reuse keeps all characters identical.</p>", "feedback": "<p>Incorrect. This completely reverses the definitions.</p>"}]}}, {"step": 3, "title": "The Tesserae Framework: Principles of text-linking Discovery", "content": "**The Tesserae Framework: Principles of text-linking Discovery**\n\nOne of the most famous digital humanities tools for finding text reuse is the *Tesserae Project*, developed at the University at Buffalo. Originally designed for classical Latin and Greek poetry, its core principles apply to historical documents in any language.\n\nTesserae operates on a simple principle: **pairing of shared meaningful words**.\n<ol>\n  <li>The algorithm breaks texts into small segments (usually sentences or poetic lines).</li>\n  <li>It ignores common filler words like \"the\", \"and\", and \"in\".</li>\n  <li>It searches for pairs of sentences that share two or more rare vocabulary words.</li>\n  <li>It scores each match based on how close the words appear to each other and how rare those words are in the wider language.</li>\n</ol>\n\nIf two sentences share two common words like \"king\" and \"day\", the score is low. But if two sentences share rare terms like \"assignats\" and \"counterfeiting\", the algorithm flags a strong text-linking link.\n\n**Vocabulary.** *Tesserae* — an open-source digital tool that finds text-linking parallels using word pairing scoring. *pairing* — the appearance of two or more specific words within the same sentence or window of text.\n\n**Takeaway:** The Tesserae framework discovers text reuse by scoring the pairing of shared words based on rarity and physical proximity.\n\n---", "html": null, "image_b64": null, "question": {"name": "03 Question: The Tesserae Framework: Principles of text-linking Discovery", "questiontext": "<p>How does the Tesserae framework discover text reuse between historical texts?</p>", "generalfeedback": "<p>The Tesserae framework discovers text reuse by scoring the pairing of shared words based on rarity and physical proximity.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>By identifying and scoring sentence pairs that share two or more rare vocabulary words within a close textual window.</p>", "feedback": "<p>Correct. Tesserae calculates match scores based on word rarity and physical proximity between shared terms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By comparing the color and chemical composition of the ink on digitized manuscripts.</p>", "feedback": "<p>Incorrect. Tesserae analyzes digital text strings, not physical chemical ink properties.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By translating both documents into classical Greek and counting the syllables.</p>", "feedback": "<p>Incorrect. Tesserae operates directly on the target vocabulary of the texts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By asking human volunteers to vote on which text is more beautifully written.</p>", "feedback": "<p>Incorrect. Tesserae is an automated computational algorithm, not a crowd-sourced voting platform.</p>"}]}}, {"step": 4, "title": "Preprocessing: Stoplists and Normalization", "content": "**Preprocessing: Stoplists and Normalization**\n\nBefore an algorithm can compare historical texts, you must prepare the data. If you feed raw transcriptions into an algorithm, punctuation marks, capital letters, and common words distort the results.\n\nText preprocessing involves three essential steps:\n<ol>\n  <li><strong>Punctuation Removal:</strong> Periods, commas, and hyphens are stripped so words match cleanly.</li>\n  <li><strong>Case Folding:</strong> Converting all letters to lowercase so that \"Treaty\" matches \"treaty\".</li>\n  <li><strong>Applying a Stoplist:</strong> Filtering out the most common grammatical words in the language.</li>\n</ol>\n\nA *stoplist* is a list of high-frequency words that carry little distinct meaning. In English, a stoplist contains words such as *the, of, and, to, in, that, is, was*. In French, it contains *le, la, les, de, et, en, du, pour*.\n\nIf you omit the stoplist, almost every sentence matches every other sentence because they all contain \"the\" and \"and\". Removing stopwords allows the algorithm to focus exclusively on meaningful nouns, verbs, and adjectives.\n\n**Vocabulary.** *Stoplist* — a curated list of high-frequency words excluded from digital search to prevent noise. *Case Folding* — normalizing all text to lowercase to ensure uniform matching.\n\n**Takeaway:** Preprocessing historical text through case folding, punctuation removal, and stoplists is essential for finding meaningful text reuse.\n\n---", "html": null, "image_b64": null, "question": {"name": "04 Question: Preprocessing: Stoplists and Normalization", "questiontext": "<p>Why must editors apply a stoplist before running text reuse algorithms on primary documents?</p>", "generalfeedback": "<p>Preprocessing historical text through case folding, punctuation removal, and stoplists is essential for finding meaningful text reuse.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To filter out ubiquitous grammatical words (like 'the', 'and', 'in') that would otherwise cause every sentence to match by accident.</p>", "feedback": "<p>Correct. Removing high-frequency stopwords prevents false matches and forces the algorithm to focus on meaningful content words.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To delete all swear words from historical manuscripts before students read them.</p>", "feedback": "<p>Incorrect. A stoplist filters high-frequency function words, not offensive language.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To prevent unauthorized users from downloading the document from GitHub.</p>", "feedback": "<p>Incorrect. Stoplists are data preprocessing tools, not security access controls.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because XML parsers crash if they encounter the word 'the'.</p>", "feedback": "<p>Incorrect. XML parsers process common words without difficulty.</p>"}]}}, {"step": 5, "title": "Word Rarity and TF-IDF Weighting", "content": "**Word Rarity and TF-IDF Weighting**\n\nHow does an algorithm know which words are truly important? In human reading, your brain naturally focuses on specialized words. Computers achieve this using a statistical formula called **TF-IDF** (Term Frequency–Inverse Document Frequency).\n\nTF-IDF evaluates words based on two balances:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px. Text-align: left;\">Component</th>\n      <th style=\"padding: 8px. Text-align: left;\">Formula Meaning</th>\n      <th style=\"padding: 8px. Text-align: left;\">Effect on Word Score</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Term Frequency (TF)</strong></td>\n      <td style=\"padding: 8px;\">How often a word appears in a specific sentence</td>\n      <td style=\"padding: 8px;\">Words appearing multiple times score higher within that passage.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Inverse Document Frequency (IDF)</strong></td>\n      <td style=\"padding: 8px;\">How rare the word is across the whole corpus</td>\n      <td style=\"padding: 8px;\">Words that appear everywhere receive near-zero weight. Rare words receive high scores.</td>\n    </tr>\n  </tbody>\n</table>\n\nFor example, in Andromeda's treaty, the word \"governor\" appears on almost every page, so its IDF score is low. But the word \"Truckhouse\" appears in only two articles. Its high IDF score signals to the algorithm that this sentence contains a unique legal provision.\n\n**Vocabulary.** *TF-IDF* — a statistical weight measuring how important a word is to a specific document within a collection. *Inverse Document Frequency* — a calculation that boosts rare terms and discounts ubiquitous words.\n\n**Takeaway:** TF-IDF weighting mathematically models scholarly intuition by prioritizing rare, distinctive terms over ubiquitous vocabulary.\n\n---", "html": null, "image_b64": null, "question": {"name": "05 Question: Word Rarity and TF-IDF Weighting", "questiontext": "<p>In the TF-IDF statistical weighting formula, how does Inverse Document Frequency (IDF) help identify important text parallels?</p>", "generalfeedback": "<p>TF-IDF weighting mathematically models scholarly intuition by prioritizing rare, distinctive terms over ubiquitous vocabulary.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It assigns high numerical weights to rare terms while discounting common words that appear across the entire corpus.</p>", "feedback": "<p>Correct. IDF ensures that specialized legal terms like 'Truckhouse' score much higher than generic words like 'governor'.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It counts the total number of pages in the printed book.</p>", "feedback": "<p>Incorrect. IDF evaluates vocabulary rarity across documents, not physical page counts.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It measures how fast the user can type words on a keyboard.</p>", "feedback": "<p>Incorrect. IDF is an algorithmic text analysis metric, not a human typing test.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes any word that appears fewer than three times in the document.</p>", "feedback": "<p>Incorrect. IDF boosts rare words rather than deleting them.</p>"}]}}, {"step": 6, "title": "Distance Scoring: Word Proximity", "content": "**Distance Scoring: Word Proximity**\n\nVocabulary rarity alone is not enough to confirm text reuse. Two rare words might appear in the same document simply by accident. To confirm an intentional borrow or legal formula, algorithms measure physical word distance.\n\nConsider two sentences:\n<ul>\n  <li><strong>Sentence A:</strong> <em>\"The Chief agreed to establish a Truckhouse on the Shubenacadie River.\"</em> (The words \"Truckhouse\" and \"Shubenacadie\" are separated by only 3 words).</li>\n  <li><strong>Sentence B:</strong> <em>\"A Truckhouse was opened in January. At the same time, five months later troops surveyed the distant Shubenacadie.\"</em> (The words are separated by 14 words).</li>\n</ul>\n\nSentence A shows high phrase density. The words appear tightly grouped, suggesting a formulaic legal clause. Sentence B shows low phrase density.\n\nrule-based tools like Tesserae calculate a distance score: words that appear close together receive a bonus. At the same time, words spread across long paragraphs are penalized.\n\n**Vocabulary.** *Phrase Density* — the closeness of matching words within a text span. *Proximity Penalty* — reducing a match score when shared words are separated by many intervening terms.\n\n**Takeaway:** Measuring word proximity ensures that algorithms prioritize compact, formulaic phrases over accidental, distant word pairings.\n\n---", "html": null, "image_b64": null, "question": {"name": "06 Question: Distance Scoring: Word Proximity", "questiontext": "<p>Why do intertextual discovery algorithms apply a proximity penalty when matching words in a candidate passage?</p>", "generalfeedback": "<p>Measuring word proximity ensures that algorithms prioritize compact, formulaic phrases over accidental, distant word pairings.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Words appearing close together in a compact phrase indicate intentional borrowing, while words spread far apart are often coincidental.</p>", "feedback": "<p>Correct. Compact phrase density is a strong indicator of formulaic legal text reuse or direct quotation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because computer memory runs out if words are more than ten inches apart on screen.</p>", "feedback": "<p>Incorrect. Proximity scoring is an analytical heuristic, not a memory hardware constraint.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force historical authors to write shorter sentences in the future.</p>", "feedback": "<p>Incorrect. Algorithms analyze historical text as written; they cannot alter past authors.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because long sentences are forbidden in digital editions.</p>", "feedback": "<p>Incorrect. Digital editions accommodate historical sentences of any length.</p>"}]}}, {"step": 7, "title": "Precision vs. Recall in Algorithmic Discovery", "content": "**Precision vs. Recall in Algorithmic Discovery**\n\nWhen configuring any automated search tool, editors face a fundamental trade-off: **Precision vs. Recall**.\n\nThese two concepts measure search quality:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px. Text-align: left;\">Metric</th>\n      <th style=\"padding: 8px. Text-align: left;\">Definition</th>\n      <th style=\"padding: 8px. Text-align: left;\">High Setting Outcome</th>\n      <th style=\"padding: 8px. Text-align: left;\">Risk of Extreme Setting</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Precision</strong></td>\n      <td style=\"padding: 8px;\">What percentage of discovered matches are genuine historical connections?</td>\n      <td style=\"padding: 8px;\">Almost every result is a true parallel.</td>\n      <td style=\"padding: 8px;\">You miss many subtle, modified echoes (False Negatives).</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Recall</strong></td>\n      <td style=\"padding: 8px;\">What percentage of all true historical connections did the tool find?</td>\n      <td style=\"padding: 8px;\">The tool captures nearly every parallel in the archive.</td>\n      <td style=\"padding: 8px;\">The editor must sort through hundreds of irrelevant false alarms (False Positives).</td>\n    </tr>\n  </tbody>\n</table>\n\nIn digital editing, we usually aim for balanced settings: strict enough to filter out pure noise. However, broad enough to surface unexpected connections.\n\n**Vocabulary.** *Precision* — the proportion of retrieved results that are relevant. *Recall* — the proportion of all relevant items that were successfully retrieved.\n\n**Takeaway:** Editorial tool configuration balances precision against recall, trading off between missing subtle parallels and filtering out false alarms.\n\n---", "html": null, "image_b64": null, "question": {"name": "07 Question: Precision vs. Recall in Algorithmic Discovery", "questiontext": "<p>When configuring an automated text reuse tool, what happens if an editor sets the match threshold for extremely high precision?</p>", "generalfeedback": "<p>Editorial tool configuration balances precision against recall, trading off between missing subtle parallels and filtering out false alarms.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The tool returns almost exclusively genuine historical parallels, but misses many subtle or modified borrowings (false negatives).</p>", "feedback": "<p>Correct. High precision minimizes false alarms at the expense of lower recall, missing modified or paraphrased text reuse.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The tool crashes the computer and deletes all project files.</p>", "feedback": "<p>Incorrect. Changing match thresholds adjusts search stringency without crashing systems.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The tool captures 100% of all parallels with zero missed items.</p>", "feedback": "<p>Incorrect. Capturing all parallels describes high recall, which typically lowers precision.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The tool begins generating fictional hallucinations.</p>", "feedback": "<p>Incorrect. Deterministic algorithms run fixed mathematical rules and never hallucinate.</p>"}]}}, {"step": 8, "title": "What rule-based Algorithms Catch", "content": "**What rule-based Algorithms Catch**\n\nrule-based text reuse tools are remarkably powerful within their specific domain. They excel at finding patterns that human eyes overlook during long reading sessions.\n\nrule-based algorithms reliably catch:\n<ul>\n  <li><strong>Verbatim legal Formulas:</strong> In Ace's French decrees, phrases like <em>\"l'Assemblée Nationale a décrété et décrète\"</em> appear across hundreds of parliamentary laws. An algorithm tags every occurrence instantly.</li>\n  <li><strong>uniform Treaty Clauses:</strong> In Andromeda's 1752 treaty, formal promises of peace match earlier 1725 articles word-for-word across separate archival volumes.</li>\n  <li><strong>Commercial Boilerplate:</strong> In Olyvia's Maud Lewis letters, recurring sales phrases (such as asking for payment by money order or listing price per painting) are surfaced across different correspondents.</li>\n  <li><strong>Direct Quotations:</strong> Unattributed citations from earlier official notices or scripture are highlighted with mathematical certainty.</li>\n</ul>\n\n**Vocabulary.** *Boilerplate* — uniform, formulaic text reused in legal or administrative documents with little modification. *Verbatim Match* — an exact character-level match between two passages.\n\n**Takeaway:** rule-based tools excel at surfacing verbatim legal formulas, commercial boilerplate, and direct legal cross-references.\n\n---", "html": null, "image_b64": null, "question": {"name": "08 Question: What rule-based Algorithms Catch", "questiontext": "<p>Which type of textual connection are deterministic algorithms most effective at detecting across historical corpora?</p>", "generalfeedback": "<p>rule-based tools excel at surfacing verbatim legal formulas, commercial boilerplate, and direct legal cross-references.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Verbatim statutory formulas, standardized treaty articles, and identical commercial boilerplate.</p>", "feedback": "<p>Correct. Deterministic tools excel at surfacing exact lexical repetitions that span across large archival collections.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Subtle psychological motivations of historical figures.</p>", "feedback": "<p>Incorrect. Psychological motivations require deep historical interpretation, not string matching.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Ironic literary metaphors that contain no shared vocabulary.</p>", "feedback": "<p>Incorrect. Algorithms cannot detect metaphors that share zero vocabulary.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Predictions of 21st-century technological inventions in 18th-century treaties.</p>", "feedback": "<p>Incorrect. Historical documents do not predict future technologies.</p>"}]}}, {"step": 9, "title": "What rule-based Algorithms Miss", "content": "**What rule-based Algorithms Miss**\n\nWhile rule-based algorithms are fast and reliable, they have serious blind spots. Because they operate on literal vocabulary matching, they fail whenever meaning is conveyed through non-literal language.\n\nrule-based algorithms fail to detect:\n<ul>\n  <li><strong>Synonym Substitution:</strong> If a later French decree replaces <em>\"fabrication\"</em> with <em>\"création\"</em>, a word-matching tool sees zero connection.</li>\n  <li><strong>Conceptual Parallels:</strong> If an author alludes to an idea without using the author's exact words, the algorithm is completely blind to the connection.</li>\n  <li><strong>Ironic Reversals:</strong> If a writer mocks an earlier political decree by negating its phrasing, string tools miss the rhetorical nuance.</li>\n  <li><strong>Spelling Variations:</strong> In historical manuscripts, if Maud Lewis spells \"February\" as \"Febuary\", an un-normalized string search misses the match.</li>\n</ul>\n\nThis is why automated tools cannot work alone. They require a human editor to review candidates, understand synonyms, and evaluate historical intent.\n\n**Vocabulary.** *Synonymic Substitution* — replacing a word with an equivalent term having the same meaning. *False Negative* — a genuine historical parallel that an automated tool failed to discover.\n\n**Takeaway:** rule-based tools are blind to synonyms, conceptual allusions, and spelling variations, requiring human oversight to catch missed connections.\n\n---", "html": null, "image_b64": null, "question": {"name": "09 Question: What rule-based Algorithms Miss", "questiontext": "<p>Why do deterministic word-matching algorithms fail to detect conceptual allusions and paraphrases?</p>", "generalfeedback": "<p>rule-based tools are blind to synonyms, conceptual allusions, and spelling variations, requiring human oversight to catch missed connections.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>They match literal character strings and lemmas, making them blind to synonym substitutions, structural metaphors, and conceptual echoes.</p>", "feedback": "<p>Correct. If an author expresses the same idea using different words, simple string matching algorithms see zero connection.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because digital computers are not permitted to read historical literature.</p>", "feedback": "<p>Incorrect. Computers can process literature, but string algorithms lack semantic comprehension.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because all historical authors wrote in secret encrypted code.</p>", "feedback": "<p>Incorrect. Archival documents were written in standard natural languages of their era.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because algorithms only operate on numbers, not text.</p>", "feedback": "<p>Incorrect. String algorithms process text characters directly.</p>"}]}}, {"step": 10, "title": "Auditing Algorithmic Output Against Tuesday's Ground Truth", "content": "**Auditing Algorithmic Output Against Tuesday's Ground Truth**\n\nIn the three-step cycle, Tuesday's manual notes serve as your **gold standard ground truth**. Today, you test whether an automated search algorithm can discover the same notes you wrote by hand.\n\nWhen auditing algorithmic output:\n<ol>\n  <li><strong>Run the Search:</strong> Execute your automated search across your project corpus.</li>\n  <li><strong>Compare Matches:</strong> Did the algorithm find the text-linking references you identified on Tuesday?\n    <ul>\n      <li>If yes, the algorithm validated your manual discovery and saved time.</li>\n      <li>If it found references you missed, the algorithm expanded your research.</li>\n      <li>If it missed references you found, analyze why (e.g., did synonym substitution hide the parallel?).</li>\n    </ul>\n  </li>\n  <li><strong>Log False Alarms:</strong> Note how many coincidental word pairs the tool reported that have no historical relationship.</li>\n</ol>\n\nThis comparative audit reveals the true capabilities and limits of automated tools.\n\n**Vocabulary.** *Audit* — a systematic evaluation of digital output against an established, verified benchmark. *Gold Standard* — human-verified data used to evaluate automated accuracy.\n\n**Takeaway:** Auditing algorithmic results against manual ground truth reveals tool strengths, uncovers missed parallels, and identifies false positives.\n\n---", "html": null, "image_b64": null, "question": {"name": "10 Question: Auditing Algorithmic Output Against Tuesday's Ground Truth", "questiontext": "<p>In the three-step comparative cycle, how does auditing algorithmic results against Tuesday's manual notes advance your research?</p>", "generalfeedback": "<p>Auditing algorithmic results against manual ground truth reveals tool strengths, uncovers missed parallels, and identifies false positives.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It reveals whether the algorithm validated your hand-crafted discoveries, identifies newly surfaced true parallels, and tallies false alarms.</p>", "feedback": "<p>Correct. Benchmarking against ground truth allows scholars to measure algorithmic precision and identify blind spots.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows students to discard their primary sources and submit computer code instead.</p>", "feedback": "<p>Incorrect. The primary sources remain the foundation of the edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves that human scholars should never read primary sources manually.</p>", "feedback": "<p>Incorrect. Manual reading creates the ground truth benchmark that makes evaluation possible.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It changes the date of the historical treaty in official government archives.</p>", "feedback": "<p>Incorrect. Auditing digital tools has no effect on historical chronology.</p>"}]}}, {"step": 11, "title": "Beyond the Local File: The Need for Web Annotation", "content": "**Beyond the Local File: The Need for Web Annotation**\n\nIn Lesson 12.1, you stored notes inside the TEI `<standOff>` block of your local XML file. That local structure is ideal for publishing a self-contained edition. But what happens when you want to share annotations across the open internet?\n\nHistorical scholarship increasingly happens across distributed web platforms:\n<ul>\n  <li>A researcher at the Nova Scotia Archives wants to annotate a digitized scan of the 1752 Treaty on their website.</li>\n  <li>A student at StFX wants to link their commentary note to that remote archive scan without asking the archivist for write access to their server.</li>\n  <li>An art historian wants to attach an explanatory note directly to a Maud Lewis painting hosted on the Art Gallery of Nova Scotia website.</li>\n</ul>\n\nYou cannot edit the XML files of remote museum servers. To allow anyone to annotate any web document without modifying the underlying server files, the World Wide Web Consortium (W3C) created the **Web Annotation Data Model**.\n\n**Vocabulary.** *Distributed Annotation* — attaching comments to remote web resources without modifying the host server's source files. *W3C* — the World Wide Web Consortium, the international standards organization for the web.\n\n**Takeaway:** Web annotation standards allow scholars to attach commentary to remote archival images and texts across the internet without altering host servers.\n\n---", "html": null, "image_b64": null, "question": {"name": "11 Question: Beyond the Local File: The Need for Web Annotation", "questiontext": "<p>Why did the scholarly community develop international web annotation standards beyond local TEI XML standoff files?</p>", "generalfeedback": "<p>Web annotation standards allow scholars to attach commentary to remote archival images and texts across the internet without altering host servers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To allow scholars to attach commentary to remote archival scans and web pages without requiring write access to the host museum servers.</p>", "feedback": "<p>Correct. Web annotation decouples notes from host server storage, allowing decentralized commentary across the public internet.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI XML was permanently banned by the United Nations.</p>", "feedback": "<p>Incorrect. TEI XML remains the premier international standard for text encoding.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force all digital editions to be viewed exclusively on mobile phones.</p>", "feedback": "<p>Incorrect. Web standards ensure device independence across all platforms.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because local hard drives cannot store more than five annotations.</p>", "feedback": "<p>Incorrect. Local storage capacity is not the issue; cross-institutional sharing is.</p>"}]}}, {"step": 12, "title": "The W3C Web Annotation Data Model", "content": "**The W3C Web Annotation Data Model**\n\nPublished as an official W3C Recommendation in 2017, the *Web Annotation Data Model* formalizes how digital notes are structured on the web.\n\nThe model is built on a clean three-part structure:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px. Text-align: left;\">Component</th>\n      <th style=\"padding: 8px. Text-align: left;\">Role in Model</th>\n      <th style=\"padding: 8px. Text-align: left;\">Plain English Meaning</th>\n      <th style=\"padding: 8px. Text-align: left;\">Example</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Annotation</strong></td>\n      <td style=\"padding: 8px;\">The overarching container</td>\n      <td style=\"padding: 8px;\">The note object itself, with metadata (author, date, motivation).</td>\n      <td style=\"padding: 8px;\">Created by Ace on Nov 25, 2026.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Target</strong></td>\n      <td style=\"padding: 8px;\">What is being annotated</td>\n      <td style=\"padding: 8px;\">The destination web page, image region, or text sentence.</td>\n      <td style=\"padding: 8px;\">A specific line in the 1791 French decree scan.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Body</strong></td>\n      <td style=\"padding: 8px;\">What the note says</td>\n      <td style=\"padding: 8px;\">The explanatory comment, transcription, or classification.</td>\n      <td style=\"padding: 8px;\">\"Assignats were paper currency issued in 1789.\"</td>\n    </tr>\n  </tbody>\n</table>\n\nBy standardizing notes into Annotation, Target, and Body, annotations become shareable across any software platform on the web.\n\n**Vocabulary.** *Annotation Body* — the content or comment being attached to a target. *Annotation Target* — the specific resource, web page, or image region being annotated.\n\n**Takeaway:** The W3C Web Annotation Data Model structures commentary into three universal components: the Annotation, the Target, and the Body.\n\n---", "html": null, "image_b64": null, "question": {"name": "12 Question: The W3C Web Annotation Data Model", "questiontext": "<p>What are the three core structural components of every annotation in the W3C Web Annotation Data Model?</p>", "generalfeedback": "<p>The W3C Web Annotation Data Model structures commentary into three universal components: the Annotation, the Target, and the Body.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>The Annotation container, the Target (what is being annotated), and the Body (what the annotation says).</p>", "feedback": "<p>Correct. The W3C specification structures every annotation into Annotation, Target, and Body.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Header, the Paragraph, and the Footer.</p>", "feedback": "<p>Incorrect. These describe traditional HTML document layout sections.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Username, the Password, and the Credit Card.</p>", "feedback": "<p>Incorrect. These are e-commerce authentication fields.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>The Input, the Processor, and the Output.</p>", "feedback": "<p>Incorrect. These describe general computing architecture.</p>"}]}}, {"step": 13, "title": "JSON-LD: The Language of Web Annotations", "content": "**JSON-LD: The Language of Web Annotations**\n\nWhile TEI uses XML, modern web architecture predominantly uses JSON (JavaScript Object Notation). To represent semantic linked data, web annotations use **JSON-LD** (JSON for Linked Data).\n\nJSON-LD allows plain JSON objects to act as linked data by including a `@context` declaration:\n```json\n{\n  \"@context\": \"http://www.w3.org/ns/anno.jsonld\",\n  \"id\": \"http://example.org/annotations/anno1\",\n  \"type\": \"Annotation\",\n  \"motivation\": \"commenting\",\n  \"body\": {\n    \"type\": \"TextualBody\",\n    \"value\": \"Peregrine Hopson served as Governor of Nova Scotia from 1752 to 1753.\",\n    \"format\": \"text/plain\"\n  },\n  \"target\": \"https://archives.novascotia.ca/treaty1752#clause3\"\n}\n```\n\nNotice how intuitive this is:\n<ul>\n  <li><code>@context</code> tells web software that this file follows official W3C rules.</li>\n  <li><code>motivation</code> states why the note was made (e.g., commenting).</li>\n  <li><code>body</code> contains the student's historical note.</li>\n  <li><code>target</code> points to the live URL of the treaty in the Nova Scotia Archives.</li>\n</ul>\n\n**Vocabulary.** *JSON-LD* — a lightweight data format that encodes Linked Open Data within standard JSON syntax. *`@context`* — a JSON-LD property linking property names to uniform web ontologies.\n\n**Takeaway:** JSON-LD serializes W3C Web Annotations into a web-native, machine-readable format that connects commentary to live URLs.\n\n---", "html": null, "image_b64": null, "question": {"name": "13 Question: JSON-LD: The Language of Web Annotations", "questiontext": "<p>In a W3C Web Annotation serialized in JSON-LD, what is the role of the @context property?</p>", "generalfeedback": "<p>JSON-LD serializes W3C Web Annotations into a web-native, machine-readable format that connects commentary to live URLs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It links property names to standardized W3C linked data vocabularies, ensuring that web software interprets keys like 'body' and 'target' correctly.</p>", "feedback": "<p>Correct. The @context declaration provides the semantic schema mapping that turns plain JSON into Linked Open Data.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It hides the author's email address from computer hackers.</p>", "feedback": "<p>Incorrect. @context defines ontology mappings, not user privacy settings.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically translates the note into seven different foreign languages.</p>", "feedback": "<p>Incorrect. @context maps data keys, not human language translations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It tells the web browser to delete the file after twenty-four hours.</p>", "feedback": "<p>Incorrect. Web annotations are persistent data objects.</p>"}]}}, {"step": 14, "title": "The W3C Motivation Taxonomy", "content": "**The W3C Motivation Taxonomy**\n\nWhy did an editor create a note? In human writing, you understand an author's goal from tone and context. Computers need explicit signals.\n\nThe W3C standard provides a controlled vocabulary of **motivations**:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px. Text-align: left;\">W3C Motivation</th>\n      <th style=\"padding: 8px. Text-align: left;\">Scholarly Purpose</th>\n      <th style=\"padding: 8px. Text-align: left;\">Cohort Use Case</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><code>commenting</code></td>\n      <td style=\"padding: 8px;\">Explaining meaning, history, or context</td>\n      <td style=\"padding: 8px;\">Explaining who Governor Hopson was.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><code>identifying</code></td>\n      <td style=\"padding: 8px;\">Attaching an authority record to a person or place</td>\n      <td style=\"padding: 8px;\">Linking \"Marshalltown\" to its GeoNames entry.</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><code>linking</code></td>\n      <td style=\"padding: 8px;\">Connecting one text directly to another</td>\n      <td style=\"padding: 8px;\">Linking the 1752 treaty to the 1725 treaty text.</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><code>transcribing</code></td>\n      <td style=\"padding: 8px;\">Providing a reading of physical handwriting on an image</td>\n      <td style=\"padding: 8px;\">Transcribing Maud Lewis's handwritten letter on a photograph.</td>\n    </tr>\n  </tbody>\n</table>\n\nDeclaring your motivation allows web software to display notes appropriately—for example, showing `identifying` tags as clickable badges and `commenting` notes as sidebars.\n\n**Vocabulary.** *Motivation* — the declared scholarly purpose or reason why an annotation was created. *Taxonomy* — a structured classification system.\n\n**Takeaway:** Specifying a W3C motivation (`commenting`, `identifying`, `linking`) clarifies the scholarly purpose of each digital note for web software.\n\n---", "html": null, "image_b64": null, "question": {"name": "14 Question: The W3C Motivation Taxonomy", "questiontext": "<p>Which W3C motivation should be assigned to an annotation that attaches an external authority record to a person or place?</p>", "generalfeedback": "<p>Specifying a W3C motivation (`commenting`, `identifying`, `linking`) clarifies the scholarly purpose of each digital note for web software.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>motivation: 'identifying'</p>", "feedback": "<p>Correct. The 'identifying' motivation signals that the annotation attaches an authoritative identity or gazetteer record to a textual entity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>motivation: 'bookmarking'</p>", "feedback": "<p>Incorrect. 'Bookmarking' records a location for future reading, not authority identification.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>motivation: 'moderating'</p>", "feedback": "<p>Incorrect. 'Moderating' evaluates forum comment quality, not entity authority linking.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>motivation: 'questioning'</p>", "feedback": "<p>Incorrect. 'Questioning' raises doubts or queries, whereas authority tagging identifies entities.</p>"}]}}, {"step": 15, "title": "The Anchoring Problem on the Dynamic Web", "content": "**The Anchoring Problem on the Dynamic Web**\n\nOn the public web, anchoring annotations is much harder than inside your local XML file. Websites change constantly. Website redesigns modify HTML layout. Text is updated, and image coordinates shift.\n\nIf your annotation simply says: <em>\"Attach this note to character 450 on page X\"</em>, any minor update to the web page will break your anchor. The note either appears in the wrong spot or disappears completely.\n\nTo make web annotations durable across website edits, the W3C standard invented **Selectors**. A selector is a smart mechanism that describes how to find the target passage even if the page layout shifts.\n\n**Vocabulary.** *Dynamic Web* — web pages whose content or styling changes over time through database updates or redesigns. *Selector* — an algorithm or pattern that locates a target passage within a digital document.\n\n**Takeaway:** Web annotations require resilient selectors to ensure notes stay attached to target text even when website layouts are updated.\n\n---", "html": null, "image_b64": null, "question": {"name": "15 Question: The Anchoring Problem on the Dynamic Web", "questiontext": "<p>Why are raw character offsets especially unreliable for anchoring annotations on public web pages?</p>", "generalfeedback": "<p>Web annotations require resilient selectors to ensure notes stay attached to target text even when website layouts are updated.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Website redesigns, template updates, and text revisions constantly shift character positions, causing notes to attach to the wrong text or disappear.</p>", "feedback": "<p>Correct. Dynamic web pages change frequently, making fragile character counts obsolete upon any layout update.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because web browsers cannot count characters higher than ten.</p>", "feedback": "<p>Incorrect. Browsers process millions of characters, but DOM positions shift during edits.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the W3C strictly outlaws using numbers on web pages.</p>", "feedback": "<p>Incorrect. Numbers are standard data types in all web protocols.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because character offsets cause computer screens to flicker.</p>", "feedback": "<p>Incorrect. Anchor fragility is a data consistency problem, not a visual display glitch.</p>"}]}}, {"step": 16, "title": "The `TextQuoteSelector`: Robust Text Anchoring", "content": "**The `TextQuoteSelector`: Robust Text Anchoring**\n\nThe most resilient selector for web text is the **`TextQuoteSelector`**. Instead of counting characters or HTML divs, it uses the text itself, surrounded by its immediate context.\n\nA `TextQuoteSelector` records three strings:\n<ol>\n  <li><strong>`exact`:</strong> The exact text being annotated.</li>\n  <li><strong>`prefix`:</strong> The few words immediately preceding the target in the original page.</li>\n  <li><strong>`suffix`:</strong> The few words immediately following the target in the original page.</li>\n</ol>\n\nHere is a JSON-LD example for Maud Lewis's letter:\n```json\n\"selector\": {\n  \"type\": \"TextQuoteSelector\",\n  \"exact\": \"I have two small paintings done\",\n  \"prefix\": \"Dear Mr. Kinnear, \",\n  \"suffix\": \", one of oxen and one of cats.\"\n}\n```\n\nEven if the web archivist changes the webpage font, wraps the letter in new HTML tags, or adds introductory paragraphs, the browser can search for the prefix, exact text, and suffix, reattaching the note perfectly!\n\n**Vocabulary.** *`TextQuoteSelector`* — a resilient W3C selector that locates a target by matching the exact phrase and its immediate surrounding words. *Prefix / Suffix* — context strings used to disambiguate identical phrases on a page.\n\n**Takeaway:** The `TextQuoteSelector` ensures annotations survive web redesigns by locking onto the target phrase and its surrounding context words.\n\n---", "html": null, "image_b64": null, "question": {"name": "16 Question: The TextQuoteSelector: Robust Text Anchoring", "questiontext": "<p>How does the W3C TextQuoteSelector ensure that an annotation stays attached to its target text even if the webpage HTML changes?</p>", "generalfeedback": "<p>The `TextQuoteSelector` ensures annotations survive web redesigns by locking onto the target phrase and its surrounding context words.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It records the exact target phrase along with its immediate prefix and suffix words, allowing software to search for and relocate the phrase in context.</p>", "feedback": "<p>Correct. The combination of prefix, exact text, and suffix disambiguates repeated phrases and survives surrounding HTML redesigns.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It locks the remote museum server so that archivists cannot edit their own web pages.</p>", "feedback": "<p>Incorrect. Annotations cannot lock or restrict remote server administration.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It downloads the entire internet into a single text file on your laptop.</p>", "feedback": "<p>Incorrect. Selectors store small context strings, not entire websites.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It converts the webpage into an uneditable paper printout.</p>", "feedback": "<p>Incorrect. Web annotations operate dynamically within digital browsers.</p>"}]}}, {"step": 17, "title": "Positional and Image Selectors", "content": "**Positional and Image Selectors**\n\nWhile text quotes are ideal for prose, historical documents also include digitized facsimile images, maps. Archival photographs. W3C defines specialized selectors for these media.\n\nKey selector types include:\n<ul>\n  <li><strong>`TextPositionSelector`:</strong> Records starting and ending character numbers (e.g., characters 100 to 145). Fast to compute, but fragile on updated web pages.</li>\n  <li><strong>`FragmentSelector`:</strong> Points to standard media fragments. For IIIF images, it defines a rectangular bounding box:\n    <pre><code>\"selector\": {\n  \"type\": \"FragmentSelector\",\n  \"conformsTo\": \"http://www.w3.org/TR/media-frags/\",\n  \"value\": \"xywh=160,240,400,120\"\n}</code></pre>\n  </li>\n</ul>\n\nWith an image fragment selector, you can attach a note directly to King Louis XVI's signature at the bottom of Ace's French decree, or to Maud Lewis's painted signature on an archival photograph!\n\n**Vocabulary.** *Media Fragment* — a W3C standard for addressing temporal or spatial regions of media files using URL coordinates (`xywh`). *Bounding Box* — the rectangular pixel boundaries enclosing an image feature.\n\n**Takeaway:** Image fragment selectors allow scholars to attach commentary directly to specific visual regions on digitized manuscript scans and photographs.\n\n---", "html": null, "image_b64": null, "question": {"name": "17 Question: Positional and Image Selectors", "questiontext": "<p>Which W3C selector allows an editor to attach a commentary note to a specific visual region on a high-resolution digitized treaty scan?</p>", "generalfeedback": "<p>Image fragment selectors allow scholars to attach commentary directly to specific visual regions on digitized manuscript scans and photographs.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>FragmentSelector with spatial media fragment coordinates (e.g., xywh=160,240,400,120).</p>", "feedback": "<p>Correct. Spatial fragment selectors define rectangular bounding boxes on images and facsimiles conforming to media fragment standards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>TextQuoteSelector without any image data.</p>", "feedback": "<p>Incorrect. Text quote selectors match text strings, not pixel coordinates on image facsimiles.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>CSS FontSelector with color values.</p>", "feedback": "<p>Incorrect. Font selectors style typography, not spatial image coordinates.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>GPS GeolocationSelector for outdoor satellite tracking.</p>", "feedback": "<p>Incorrect. Digital image coordinates address pixel space on a canvas, not satellite GPS.</p>"}]}}, {"step": 18, "title": "Selector Chains for Maximum Durability", "content": "**Selector Chains for Maximum Durability**\n\nWhat happens if a website changes so drastically that a single selector fails? Professional web annotation platforms solve this by using **Selector Chains**.\n\nIn a selector chain, an annotation includes multiple selectors in a list:\n<ol>\n  <li>First, the browser tries a fast <code>FragmentSelector</code> or <code>TextPositionSelector</code>.</li>\n  <li>If the position shifted due to page edits, the browser falls back to the resilient <code>TextQuoteSelector</code>.</li>\n  <li>If the exact words were slightly modernized, an XPath selector attempts to locate the containing paragraph.</li>\n</ol>\n\nBy combining fast positional lookups with robust text quote searches, selector chains ensure that historical notes survive for years on the evolving web.\n\n**Vocabulary.** *Selector Chain* — an ordered list of fallback selectors that increases the likelihood of successfully resolving a digital annotation anchor. *Graceful Degradation* — software behavior where a system falls back to secondary methods if the primary method fails.\n\n**Takeaway:** Combining positional lookups and text quote selectors into chains guarantees maximum durability for digital commentary on the web.\n\n---", "html": null, "image_b64": null, "question": {"name": "18 Question: Selector Chains for Maximum Durability", "questiontext": "<p>Why do robust web annotation platforms combine multiple selectors into an ordered selector chain?</p>", "generalfeedback": "<p>Combining positional lookups and text quote selectors into chains guarantees maximum durability for digital commentary on the web.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>To implement graceful degradation, attempting fast positional lookups first and falling back to resilient text quote matching if page edits occurred.</p>", "feedback": "<p>Correct. Selector chains maximize speed when pages are static and guarantee recovery when pages are modified.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To confuse search engines so that competing universities cannot read the annotations.</p>", "feedback": "<p>Incorrect. Selector chains enhance data recovery, not obfuscation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the W3C requires every annotation to be written in three different computer languages.</p>", "feedback": "<p>Incorrect. Selector chains are an anchoring resilience strategy within JSON-LD.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>To force users to click three times before viewing a note.</p>", "feedback": "<p>Incorrect. Selector chains execute automatically behind the scenes without extra clicks.</p>"}]}}, {"step": 19, "title": "Collaborative Web Annotation with Hypothes.is", "content": "**Collaborative Web Annotation with Hypothes.is**\n\nTo see W3C web annotation in real-world practice, scholars use tools like **Hypothes.is**.\n\nHypothes.is is an open-source platform that brings an annotation layer to any website or PDF online:\n<ul>\n  <li>You install a browser extension or add a simple script to your web page.</li>\n  <li>When you highlight text on any website (such as the Nova Scotia Archives or the British Library), a sidebar opens.</li>\n  <li>You type your commentary note, add tags (like `#treaty` or `#assignats`), and click save.</li>\n  <li>Behind the scenes, Hypothes.is automatically generates a full W3C JSON-LD annotation with a `TextQuoteSelector`!</li>\n  <li>Your notes can be private for personal research, shared with a classroom group, or published publicly.</li>\n</ul>\n\nThis means our three students could collaborate on annotating historical treaty scans across different universities in real time.\n\n**Vocabulary.** *Hypothes.is* — an open-source digital platform that enables collaborative annotation across public web pages and online PDFs. *Annotation Layer* — a digital interface overlaying notes on top of web content without modifying the host site.\n\n**Takeaway:** Platforms like Hypothes.is operationalize the W3C standard, allowing students and scholars to annotate live web pages and PDFs collaboratively.\n\n---", "html": null, "image_b64": null, "question": {"name": "19 Question: Collaborative Web Annotation with Hypothes.is", "questiontext": "<p>How does the Hypothes.is platform operationalize W3C web annotation standards for classroom teaching?</p>", "generalfeedback": "<p>Platforms like Hypothes.is operationalize the W3C standard, allowing students and scholars to annotate live web pages and PDFs collaboratively.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows students and instructors to highlight and annotate live web pages and online PDFs collaboratively, generating standard JSON-LD notes behind the scenes.</p>", "feedback": "<p>Correct. Hypothes.is provides an accessible browser overlay that generates W3C-compliant annotations across public websites and PDFs.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces the university library catalog with a private social media chat room.</p>", "feedback": "<p>Incorrect. Hypothes.is is an academic annotation platform, not social media chat.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically grades student essays using generative artificial intelligence.</p>", "feedback": "<p>Incorrect. Hypothes.is is a human collaborative annotation tool, not an automated grading bot.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It blocks all students from accessing historical archives online.</p>", "feedback": "<p>Incorrect. Hypothes.is facilitates collaborative engagement with online archives.</p>"}]}}, {"step": 20, "title": "Semantic Tagging and Authority Linking with Recogito", "content": "**Semantic Tagging and Authority Linking with Recogito**\n\nAnother celebrated digital humanities platform built on W3C standards is **Recogito**, created by the Pelagios Network.\n\nRecogito is specifically designed for historical documents, maps, and archival scans:\n<ul>\n  <li>It allows editors to upload historical texts or high-resolution images.</li>\n  <li>When you highlight a place name like \"Halifax\" or \"Digby\", Recogito automatically queries global gazetteers (such as GeoNames and Pleiades).</li>\n  <li>It displays a map showing the historical location and prompts you to confirm the match.</li>\n  <li>Once confirmed, Recogito stores the annotation in W3C format, complete with authority URIs and latitude/longitude coordinates.</li>\n</ul>\n\nRecogito bridges the gap between text reading and geographic visualization, turning text mentions into interactive maps.\n\n**Vocabulary.** *Recogito* — a digital humanities tool for collaborative semantic annotation of historical texts, maps. Images. *Geoparsing* — identifying place names in text and mapping them to geographic coordinates.\n\n**Takeaway:** Recogito demonstrates how W3C web annotations connect textual mentions of places to interactive maps and global gazetteers.\n\n---", "html": null, "image_b64": null, "question": {"name": "20 Question: Semantic Tagging and Authority Linking with Recogito", "questiontext": "<p>What primary scholarly capability does the Recogito platform provide when annotating historical texts and maps?</p>", "generalfeedback": "<p>Recogito demonstrates how W3C web annotations connect textual mentions of places to interactive maps and global gazetteers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows editors to highlight place names, automatically queries global gazetteers like GeoNames, and plots historical entities on interactive maps.</p>", "feedback": "<p>Correct. Recogito links textual place mentions to geographic coordinates and visualizes them on interactive maps.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically purchases antique maps from online auction websites.</p>", "feedback": "<p>Incorrect. Recogito is a scholarly research tool, not an e-commerce purchasing bot.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all historical place names and replaces them with modern postal codes.</p>", "feedback": "<p>Incorrect. Recogito preserves historical toponyms while linking them to gazetteer records.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates English documents into computer assembly code.</p>", "feedback": "<p>Incorrect. Recogito performs semantic annotation and geoparsing, not low-level code compilation.</p>"}]}}, {"step": 21, "title": "Linked Open Data and Knowledge Graphs", "content": "**Linked Open Data and Knowledge Graphs**\n\nWhen you connect commentary notes to global authority files (such as Wikidata, GeoNames, or VIAF), your digital edition joins a global **Knowledge Graph**.\n\nIn a traditional library catalog, documents sit on separate shelves. But in a Linked Open Data knowledge graph, data forms a web of relationships:\n<ul>\n  <li><em>Peregrine Hopson</em> (Wikidata Q7167799) <strong>[was governor of]</strong> <em>Nova Scotia</em> (Wikidata Q1952).</li>\n  <li><em>The Treaty of 1752</em> <strong>[was signed by]</strong> <em>Jean-Baptiste Cope</em> (Wikidata Q6168886).</li>\n  <li><em>Maud Lewis</em> (Wikidata Q1479154) <strong>[lived in]</strong> <em>Digby County</em> (Wikidata Q2630244).</li>\n</ul>\n\nWhen your edition exports its annotations in JSON-LD, external researchers can query these relationships computationally, discovering connections between colonial Canada, revolutionary Europe, and twentieth-century art history.\n\n**Vocabulary.** *Knowledge Graph* — a structured network of interconnected concepts, entities. Relationships encoded in linked data standards. *RDF (Resource Description Framework)* — the foundational W3C data model for linked data.\n\n**Takeaway:** Linking annotations to global authorities integrates local student editions into a worldwide knowledge graph of historical data.\n\n---", "html": null, "image_b64": null, "question": {"name": "21 Question: Linked Open Data and Knowledge Graphs", "questiontext": "<p>In a Linked Open Data knowledge graph, how are historical entities connected to one another?</p>", "generalfeedback": "<p>Linking annotations to global authorities integrates local student editions into a worldwide knowledge graph of historical data.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Through subject-predicate-object semantic statements (triples) linking persistent URIs, such as Hopson [governed] Nova Scotia.</p>", "feedback": "<p>Correct. Knowledge graphs encode relationships between real-world entities using standardized RDF triples.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By saving all historical documents in one giant Microsoft Excel spreadsheet.</p>", "feedback": "<p>Incorrect. Knowledge graphs use graph databases and linked data standards, not local flat spreadsheets.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By printing paper cards and mailing them to the national archives.</p>", "feedback": "<p>Incorrect. Linked Open Data is a decentralized digital web architecture.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>By ensuring that all historical figures have identical personal names.</p>", "feedback": "<p>Incorrect. URIs disambiguate figures with similar names, preserving distinct historical identities.</p>"}]}}, {"step": 22, "title": "Querying Commentary Networks with SPARQL", "content": "**Querying Commentary Networks with SPARQL**\n\nHow do researchers query vast knowledge graphs? In relational databases, developers use SQL. In the world of Linked Open Data, scholars use **SPARQL** (SPARQL Protocol and RDF Query Language).\n\nA SPARQL query searches for graph patterns across linked datasets. For example, a researcher can ask:\n<pre><code>SELECT ?treaty ?governor ?date WHERE {\n  ?treaty wdt:P31 wd:Q131569 .       # is a treaty\n  ?treaty wdt:P1001 wd:Q1952 .       # jurisdiction: Nova Scotia\n  ?treaty wdt:P580 ?date .           # signed date\n  ?treaty wdt:P110 ?governor .       # signed by governor\n}</code></pre>\n\nIn a single query taking less than one second, the database returns every colonial treaty signed in Nova Scotia, its signing date, and the governing British official!\n\nBy authoring standards-compliant commentary, our student editions prepare historical data for this advanced digital scholarship.\n\n**Vocabulary.** *SPARQL* — the standard semantic query language used to retrieve and manipulate data stored in Resource Description Framework (RDF) format. *Graph Pattern* — a query template specifying conditions that data nodes and links must satisfy.\n\n**Takeaway:** SPARQL enables scholars to execute complex relational queries across distributed linked data networks and digital commentaries.\n\n---", "html": null, "image_b64": null, "question": {"name": "22 Question: Querying Commentary Networks with SPARQL", "questiontext": "<p>What is the primary role of the SPARQL query language in digital humanities research?</p>", "generalfeedback": "<p>SPARQL enables scholars to execute complex relational queries across distributed linked data networks and digital commentaries.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It executes structured relational queries across distributed Linked Open Data graphs to extract specific historical entities and relationships.</p>", "feedback": "<p>Correct. SPARQL allows researchers to query complex RDF graphs across the web to answer multi-variable historical research questions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It formats text into decorative italic fonts in Microsoft Word.</p>", "feedback": "<p>Incorrect. SPARQL is a semantic query language, not a word processor styling tool.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It checks whether student laptops are connected to the university Wi-Fi network.</p>", "feedback": "<p>Incorrect. SPARQL queries databases, not campus network hardware.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes spam emails from the instructor's inbox automatically.</p>", "feedback": "<p>Incorrect. SPARQL queries graph data, not email servers.</p>"}]}}, {"step": 23, "title": "Comparing TEI Standoff XML vs. W3C JSON-LD", "content": "**Comparing TEI Standoff XML vs. W3C JSON-LD**\n\nAs a digital editor, you now know two major annotation frameworks: TEI Standoff XML (Lesson 12.1) and W3C Web Annotation JSON-LD (Lesson 12.2). Which one should you use?\n\nBoth frameworks have distinct architectural strengths:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n    <tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1;\">\n      <th style=\"padding: 8px. Text-align: left;\">Feature</th>\n      <th style=\"padding: 8px. Text-align: left;\">TEI Standoff XML</th>\n      <th style=\"padding: 8px. Text-align: left;\">W3C JSON-LD</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Primary Purpose</strong></td>\n      <td style=\"padding: 8px;\">Long-term archival preservation of texts</td>\n      <td style=\"padding: 8px;\">Dynamic, web-native sharing across sites</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>File Relationship</strong></td>\n      <td style=\"padding: 8px;\">Self-contained inside the edition document</td>\n      <td style=\"padding: 8px;\">External notes pointing to remote URLs</td>\n    </tr>\n    <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n      <td style=\"padding: 8px;\"><strong>Schema Validation</strong></td>\n      <td style=\"padding: 8px;\">Strict XML Schema / Relax NG validation</td>\n      <td style=\"padding: 8px;\">Flexible JSON Schema and RDF graphs</td>\n    </tr>\n    <tr>\n      <td style=\"padding: 8px;\"><strong>Best Humanities Use</strong></td>\n      <td style=\"padding: 8px;\">Publishing complete critical scholarly editions</td>\n      <td style=\"padding: 8px;\">Annotating remote archives, images, and maps</td>\n    </tr>\n  </tbody>\n</table>\n\nIn modern digital publishing, projects often maintain primary source editions in TEI XML, then export notes to JSON-LD for interactive web exploration.\n\n**Vocabulary.** *Data data sharing* — the ability of different digital systems and software to exchange and interpret data seamlessly. *Serialization* — converting structured in-memory data objects into a text format (like XML or JSON) for storage or transmission.\n\n**Takeaway:** TEI XML is ideal for archival textual editions, while W3C JSON-LD excels at web-native sharing and distributed annotation across remote servers.\n\n---", "html": null, "image_b64": null, "question": {"name": "23 Question: Comparing TEI Standoff XML vs. W3C JSON-LD", "questiontext": "<p>Why do many digital publishing projects maintain their primary source edition in TEI XML while exporting annotations to W3C JSON-LD?</p>", "generalfeedback": "<p>TEI XML is ideal for archival textual editions, while W3C JSON-LD excels at web-native sharing and distributed annotation across remote servers.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>TEI XML provides rigorous archival validation for the primary text, while JSON-LD provides lightweight interoperability for interactive web browsers.</p>", "feedback": "<p>Correct. Combining TEI XML for archival depth with JSON-LD for web distribution leverages the unique strengths of both standards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because TEI XML cannot be opened on computers made after 2010.</p>", "feedback": "<p>Incorrect. TEI XML is completely compatible with modern computing systems.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because JSON-LD files are completely immune to computer viruses.</p>", "feedback": "<p>Incorrect. JSON-LD is a data serialization format; security depends on system architecture.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because universities require all student work to be stored in at least ten conflicting formats.</p>", "feedback": "<p>Incorrect. Combining complementary standards is a deliberate, reasoned architectural strategy.</p>"}]}}, {"step": 24, "title": "Hands-On Exercise: Searching for Text Reuse in VS Code", "content": "**Hands-On Exercise: Searching for Text Reuse in VS Code**\n\nLet us practice finding text reuse deterministically in Visual Studio Code.\n\nFollow these practical steps:\n<ol>\n  <li><strong>Identify Candidate Phrases:</strong> Review your primary witness passage. Highlight a formulaic phrase (e.g., <em>\"free liberty of hunting\"</em> in Andromeda's treaty, or <em>\"l'Assemblée Nationale\"</em> in Ace's decree).</li>\n  <li><strong>Use VS Code Multi-File Search:</strong> Press <code>Cmd+Shift+F</code> (macOS) or <code>Ctrl+Shift+F</code> (Windows) to open global search across your workspace.</li>\n  <li><strong>Configure Search Boundaries:</strong>\n    <ul>\n      <li>In the <em>files to include</em> box, type <code>src/</code> or your historical corpus directory.</li>\n      <li>Search for the exact phrase to detect verbatim loans.</li>\n      <li>Use regex mode (click the <code>.*</code> icon) to search with flexible word gaps: <code>liberty\\s+(?:\\w+\\s+){1,4}hunting</code>. This finds \"liberty\" and \"hunting\" separated by up to four words!</li>\n    </ul>\n  </li>\n  <li><strong>Review Discovered Matches:</strong> Record matching filenames, line numbers, and surrounding context.</li>\n</ol>\n\n**Vocabulary.** *Multi-File Search* — querying an entire folder or project directory simultaneously in an editor. *Regular Expression Proximity* — using regex wildcards to match words within a specified distance.\n\n**Takeaway:** Use VS Code multi-file and regex search to detect verbatim formulas and proximity matches across your project corpus.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Hands-On Exercise: Searching for Text Reuse in VS Code", "questiontext": "<p>When searching for text reuse across your workspace in VS Code, what is the advantage of using regex proximity search over plain string search?</p>", "generalfeedback": "<p>Use VS Code multi-file and regex search to detect verbatim formulas and proximity matches across your project corpus.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It allows you to find two meaningful words that appear near each other even if minor intervening words or punctuation differ.</p>", "feedback": "<p>Correct. Regex patterns like 'liberty\\s+(?:\\w+\\s+){1,4}hunting' capture modified text reuse that exact string search misses.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically translates the document into medieval Latin.</p>", "feedback": "<p>Incorrect. Regex search queries local text; it does not translate languages.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It turns off all computer security firewalls permanently.</p>", "feedback": "<p>Incorrect. Text search within an editor has no impact on system firewalls.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It guarantees that 100% of discovered matches are intentional plagiarisms.</p>", "feedback": "<p>Incorrect. Editors must still evaluate whether discovered proximity matches represent genuine text reuse.</p>"}]}}, {"step": 25, "title": "Hands-On Exercise: Converting a TEI Note to W3C JSON-LD", "content": "**Hands-On Exercise: Converting a TEI Note to W3C JSON-LD**\n\nNow let us convert one of the manual standoff notes you wrote on Tuesday into a W3C Web Annotation JSON-LD object.\n\nTake your historical note identifying Governor Hopson or Chief Cope from Lesson 12.1:\n<ol>\n  <li>Create a new file named <code>annotation.json</code> in your project folder.</li>\n  <li>Add the standard W3C <code>@context</code> and <code>type</code> headers.</li>\n  <li>Set the <code>motivation</code> to <code>\"commenting\"</code>.</li>\n  <li>Put your note text into the <code>body</code> object.</li>\n  <li>In the <code>target</code> object, specify the source URL and build a <code>TextQuoteSelector</code> with <code>exact</code>, <code>prefix</code>, and <code>suffix</code> strings from your document.</li>\n</ol>\n\nHere is the completed conversion template:\n```json\n{\n  \"@context\": \"http://www.w3.org/ns/anno.jsonld\",\n  \"type\": \"Annotation\",\n  \"motivation\": \"commenting\",\n  \"body\": {\n    \"type\": \"TextualBody\",\n    \"value\": \"Major Jean-Baptiste Cope was principal Chief of the Shubenacadie Mi'kmaq who led treaty negotiations.\",\n    \"format\": \"text/plain\"\n  },\n  \"target\": {\n    \"source\": \"https://archives.novascotia.ca/treaties/1752/\",\n    \"selector\": {\n      \"type\": \"TextQuoteSelector\",\n      \"exact\": \"Major Jean Baptiste Cope\",\n      \"prefix\": \"between His Excellency Peregrine Thomas Hopson and \",\n      \"suffix\": \", Chief Sachem of the Tribe\"\n    }\n  }\n}\n```\n\n**Vocabulary.** *Data Conversion* — translating data from one representation format into another while preserving semantic meaning. *TextualBody* — a W3C entity representing plain or HTML text content inside an annotation.\n\n**Takeaway:** Converting TEI standoff notes into W3C JSON-LD makes your commentary accessible to web browsers and external digital archives.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Hands-On Exercise: Converting a TEI Note to W3C JSON-LD", "questiontext": "<p>When translating a TEI standoff note into a W3C Web Annotation JSON-LD object, where does the note text reside?</p>", "generalfeed
