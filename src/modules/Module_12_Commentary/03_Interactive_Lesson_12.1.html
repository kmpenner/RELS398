s an orphaned pointer.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Restart your computer three times in succession.</p>", "feedback": "<p>Incorrect. Restarting hardware does not audit XML pointer references.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Print the XML code onto paper and inspect it with a magnifying glass.</p>", "feedback": "<p>Incorrect. Software search in VS Code is vastly faster and less error-prone than manual paper inspection.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Delete all IDs so that no links can ever break.</p>", "feedback": "<p>Incorrect. Deleting IDs destroys the entire annotation linkage architecture.</p>"}]}}, {"step": 24, "title": "Case Study: The Dickinson College Commentaries Model", "content": "**Case Study: The Dickinson College Commentaries Model**\n\nTo understand how professional digital humanities projects handle commentary, consider the *Dickinson College Commentaries* (DCC) directed by Christopher Francese.\n\nDCC publishes digital editions of historical Latin and Greek texts designed specifically for intermediate students and researchers. Their commentary model follows several principles that match our course approach:\n<ul>\n  <li><strong>Clear Separation of Layers:</strong> The base reading text is displayed cleanly on the left. Meanwhile, vocabulary glosses and historical notes appear in collapsible sidebars on the right.</li>\n  <li><strong>Controlled Vocabulary Tiers:</strong> Notes are strictly divided into vocabulary explanations, grammatical analyses, and historical/geographical context.</li>\n  <li><strong>Linked Open Data Gazetteers:</strong> Every ancient toponym links to the <em>Pleiades</em> gazetteer of ancient places. This provides coordinates and map views.</li>\n  <li><strong>Novice-Centered Explanations:</strong> Instead of assuming graduate-level language knowledge, DCC notes explain historical idioms in clear, accessible English.</li>\n</ul>\n\nBy adopting this modular, user-focused architecture, our student editions achieve the same clarity and usability as major university digital projects.\n\n**Vocabulary.** *Toponym* — the proper name of a place or geographical feature. *Gazetteer* — a geographical dictionary or directory providing coordinates and historical information about places.\n\n**Takeaway:** The Dickinson College Commentaries model shows how clean visual separation, controlled categories, and linked gazetteers make historical texts accessible to students.\n\n---", "html": null, "image_b64": null, "question": {"name": "24 Question: Case Study: The Dickinson College Commentaries Model", "questiontext": "<p>What key pedagogical design feature makes the Dickinson College Commentaries model highly effective for student readers?</p>", "generalfeedback": "<p>The Dickinson College Commentaries model shows how clean visual separation, controlled categories, and linked gazetteers make historical texts accessible to students.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It cleanly separates base reading text from collapsible commentary sidebars, grouping notes into distinct lexical, grammatical, and historical categories.</p>", "feedback": "<p>Correct. DCC avoids visual clutter by categorizing notes and displaying them in dedicated side panels beside the clean reading text.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It translates every historical text into computer binary code.</p>", "feedback": "<p>Incorrect. DCC editions are designed for human students learning historical languages, not computers.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It requires students to pass an entrance exam before allowing them to view the website.</p>", "feedback": "<p>Incorrect. DCC is an open-access public humanities project.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all historical names from the text to avoid confusing novices.</p>", "feedback": "<p>Incorrect. Historical names are retained and enriched with gazetteer links.</p>"}]}}, {"step": 25, "title": "Case Study: Scholarly Commentary in Legal and archive Editions", "content": "**Case Study: Scholarly Commentary in Legal and archive Editions**\n\nWhile classical editions often emphasize literary style, archive and legal editions (such as the *Early Canadiana Online* project or the French *Archives Parlementaires*) require a distinct commentary strategy.\n\nWhen annotating colonial proclamations or revolutionary statutes:\n<ul>\n  <li><strong>Focus on standard and Sanction:</strong> The commentary must explain who held the legal standard to issue the document. In Ace's 1791 decree, notes must explain why the King's seal appears alongside the signature of the President of the National Assembly.</li>\n  <li><strong>Documenting Legal Precedents:</strong> In Andromeda's 1752 Treaty, the commentary must trace how each article reflects British colonial policies set in earlier treaties with First Nations across the Atlantic seaboard.</li>\n  <li><strong>Social Impact vs. Official Rhetoric:</strong> Official legal decrees often claim that laws were universally welcomed. Scholarly notes provide the reality check, detailing public protests, financial panic, or indigenous sovereignty concerns omitted from the official record.</li>\n</ul>\n\nEditorial neutrality does not mean ignoring historical controversy. It means documenting multiple perspectives using verified archive evidence.\n\n**Vocabulary.** *Statute* — a formal written enactment of a legislative standard that governs a city, state, or country. *Royal Sanction* — the formal approval of a bill by a monarch, necessary for legislation to take legal effect in constitutional monarchies.\n\n**Takeaway:** archive and legal commentary studies legislative standard, historical precedents, and the social realities behind official administrative rhetoric.\n\n---", "html": null, "image_b64": null, "question": {"name": "25 Question: Case Study: Scholarly Commentary in Legal and archive Editions", "questiontext": "<p>When annotating official state documents like the 1791 French decree or the 1752 British treaty, why must commentary examine institutional authority?</p>", "generalfeedback": "<p>archive and legal commentary studies legislative standard, historical precedents, and the social realities behind official administrative rhetoric.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Because official documents reflect specific legal jurisdictions and political power struggles that determine whether an act had binding legal validity.</p>", "feedback": "<p>Correct. Legal commentary must explain who held legislative power, what royal sanctions were required, and how laws were received by the public.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because legal documents are always works of pure fiction that have no historical consequences.</p>", "feedback": "<p>Incorrect. Treaties and revolutionary decrees had profound political and economic consequences.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because the TEI Guidelines forbid annotating non-legal texts.</p>", "feedback": "<p>Incorrect. TEI is used for literature, personal letters, religious texts, and archival records alike.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Because editors are required to agree with all actions taken by historical governments.</p>", "feedback": "<p>Incorrect. Critical commentary maintains scholarly objectivity and evaluates historical realities.</p>"}]}}, {"step": 26, "title": "Designing Your Commentary Editorial Policy", "content": "**Designing Your Commentary Editorial Policy**\n\nBefore drafting a complete set of notes, professional editors establish an Editorial Policy. Without a written policy, you will inevitably write too many notes on some paragraphs and none on others.\n\nYour commentary policy should answer four basic questions:\n<table style=\"width: 100%; border-collapse: collapse; margin: 1rem 0;\">\n  <thead>\n<tr style=\"background-color: #f1f5f9. Border-bottom: 2px solid #cbd5e1. \">\n<th style=\"padding: 8px. Text-align: left. \">Policy Question</th>\n<th style=\"padding: 8px. Text-align: left. \">Decision Criteria</th>\n<th style=\"padding: 8px. Text-align: left. \">Example Standard</th>\n    </tr>\n  </thead>\n  <tbody>\n<tr style=\"border-bottom: 1px solid #e2e8f0. \">\n<td style=\"padding: 8px. \"><strong>Who is your target reader?</strong></td>\n<td style=\"padding: 8px. \">Determines assumed prior knowledge</td>\n<td style=\"padding: 8px. \">Undergraduate humanities students who need explanations of 18th-century currency.</td>\n    </tr>\n<tr style=\"border-bottom: 1px solid #e2e8f0. \">\n<td style=\"padding: 8px. \"><strong>What triggers a lexical note?</strong></td>\n<td style=\"padding: 8px. \">Threshold for obsolete vocabulary</td>\n<td style=\"padding: 8px. \">Any word absent from a standard modern collegiate dictionary, or used in an obsolete sense.</td>\n    </tr>\n<tr style=\"border-bottom: 1px solid #e2e8f0. \">\n<td style=\"padding: 8px. \"><strong>What entities require naming?</strong></td>\n<td style=\"padding: 8px. \">Selection rule for historical figures</td>\n<td style=\"padding: 8px. \">Every named historical person and every geographical location mentioned in the text.</td>\n    </tr>\n    <tr>\n<td style=\"padding: 8px. \"><strong>What is the maximum note length?</strong></td>\n<td style=\"padding: 8px. \">Prevents sprawling essays</td>\n<td style=\"padding: 8px. \">Notes must be concise (between 30 and 75 words) with at least one external reference.</td>\n    </tr>\n  </tbody>\n</table>\n\nDocumenting these guidelines in a short `COMMENTARY.md` file guarantees consistency across all your edition notes.\n\n**Vocabulary.** *Editorial Policy* — a written statement governing the principles, scope, and formatting standards applied by an editor to a text. *Annotation Threshold* — the set criteria that determine whether a textual feature merits an explanatory note.\n\n**Takeaway:** Establish a clear commentary editorial policy defining target audience, entity naming rules, and note length limits before writing.\n\n---", "html": null, "image_b64": null, "question": {"name": "26 Question: Designing Your Commentary Editorial Policy", "questiontext": "<p>What is the primary benefit of defining a written Commentary Editorial Policy in COMMENTARY.md before annotating?</p>", "generalfeedback": "<p>Establish a clear commentary editorial policy defining target audience, entity naming rules, and note length limits before writing.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It establishes consistent rules for target audience, entity identification thresholds, and note length limits, preventing uneven coverage across the edition.</p>", "feedback": "<p>Correct. A written policy ensures that all parts of the document receive balanced, consistent scholarly attention.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It guarantees that the edition will automatically win international book prizes.</p>", "feedback": "<p>Incorrect. Editorial policies ensure consistency and rigor, but do not guarantee awards.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It allows the editor to skip verifying facts in historical dictionaries.</p>", "feedback": "<p>Incorrect. An editorial policy mandates rigorous fact-checking rather than skipping it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It restricts the edition to being read only on Apple computers.</p>", "feedback": "<p>Incorrect. TEI digital editions are platform-independent.</p>"}]}}, {"step": 27, "title": "Hands-On Exercise: Building the Standoff TEI Shell", "content": "**Hands-On Exercise: Building the Standoff TEI Shell**\n\nLet us now build the complete standoff TEI XML shell in VS Code. Create a new file named `commentary_hand.xml` or open your existing project TEI file.\n\nAssemble the following components:\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<TEI xmlns=\"http://www.tei-c.org/ns/1.0\">\n  <teiHeader>\n    <fileDesc>\n      <titleStmt>\n        <title>Scholarly Commentary on Primary Witness</title>\n        <editor xml:id=\"ed1\">Student Editor</editor>\n      </titleStmt>\n      <publicationStmt>\n        <p>RELS 398 Digital Methods Course Project</p>\n      </publicationStmt>\n      <sourceDesc>\n        <p>Authored commentary anchored to primary archival witness.</p>\n      </sourceDesc>\n    </fileDesc>\n  </teiHeader>\n  <text>\n    <body>\n      <div type=\"transcription\">\n        <!-- Your base text with xml:id anchors -->\n      </div>\n    </body>\n  </text>\n  <standOff>\n    <interpGrp type=\"categories\">\n      <interp xml:id=\"cat_phil\">Philological &amp; Lexical</interp>\n      <interp xml:id=\"cat_hist\">Historical &amp; Contextual</interp>\n      <interp xml:id=\"cat_inter\">Intertextual &amp; Citational</interp>\n    </interpGrp>\n    <div type=\"commentary\">\n      <!-- Your typed standoff notes go here -->\n    </div>\n  </standOff>\n</TEI>\n```\n\nVerify that your file validates against the TEI schema in VS Code.\n\n**Vocabulary.** *TEI Shell* — the foundational XML document structure containing `teiHeader`, `text`, and optional `standOff` containers. *Well-Formedness Check* — confirming that all opening tags match closing tags and syntax is valid.\n\n**Takeaway:** The standoff TEI shell provides a robust structure combining the `teiHeader`, base text record `<body>`, and annotations in `<standOff>`.\n\n---", "html": null, "image_b64": null, "question": {"name": "27 Question: Hands-On Exercise: Building the Standoff TEI Shell", "questiontext": "<p>In the complete TEI standoff shell, where does the &lt;standOff&gt; container reside relative to the other major structural elements?</p>", "generalfeedback": "<p>The standoff TEI shell provides a robust structure combining the `teiHeader`, base text record `<body>`, and annotations in `<standOff>`.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Directly after the closing &lt;/text&gt; tag and immediately before the final closing &lt;/TEI&gt; tag.</p>", "feedback": "<p>Correct. The &lt;standOff&gt; element is a direct child of &lt;TEI&gt;, sitting alongside &lt;teiHeader&gt; and &lt;text&gt;.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside the &lt;teiHeader&gt; within the title statement.</p>", "feedback": "<p>Incorrect. The teiHeader describes document metadata, not standoff annotations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>At the very beginning of the file before the XML declaration.</p>", "feedback": "<p>Incorrect. The XML declaration must always be the first line of an XML file.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Inside a separate Microsoft Excel spreadsheet file on the Desktop.</p>", "feedback": "<p>Incorrect. The standoff block is an integral part of the TEI XML file.</p>"}]}}, {"step": 28, "title": "Authoring a Five-Note Reference Corpus", "content": "**Authoring a Five-Note Reference Corpus**\n\nFor today's lab milestone, you will author five high-quality commentary notes by hand on a single excerpt of your document.\n\nYour five notes must include:\n<ol>\n  <li><strong>Two language / Lexical Notes:</strong> Explaining an archaic term, unusual spelling, or technical legal phrase.</li>\n  <li><strong>Two Historical / Contextual Notes:</strong> explaining a named person, place, or institution, complete with an external standard URI (Wikidata, GeoNames, or Dictionary of Canadian Biography).</li>\n  <li><strong>One Intertextual Note:</strong> Explaining a cross-reference, legal precedent, letter, or museum collection object.</li>\n</ol>\n\nHere is a checklist for every note you write:\n<ul>\n  <li>Does the note carry a valid `@target` starting with `#`?</li>\n  <li>Does it specify `@type` and `@subtype`?</li>\n  <li>Does it identify the author using `@resp`?</li>\n  <li>Does the text inside avoid fluff, providing concise, verified information?</li>\n</ul>\n\nThis hand-authored five-note set is your manual reference corpus.\n\n**Vocabulary.** *Reference Corpus* — a verified, hand-curated dataset used as the gold standard for measuring automated and AI tools. *Gold Standard* — ground-truth data created with maximum human accuracy.\n\n**Takeaway:** Authoring five diverse commentary notes creates a reliable manual gold standard for evaluating deterministic search tools and AI models.\n\n---", "html": null, "image_b64": null, "question": {"name": "28 Question: Authoring a Five-Note Reference Corpus", "questiontext": "<p>What is the purpose of authoring a diverse five-note manual reference corpus in today's lab milestone?</p>", "generalfeedback": "<p>Authoring five diverse commentary notes creates a reliable manual gold standard for evaluating deterministic search tools and AI models.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It establishes a verified, human-curated gold standard across lexical, historical, and intertextual categories for evaluating algorithmic and AI tools later in the week.</p>", "feedback": "<p>Correct. Today's hand-crafted reference notes provide the baseline against which Wednesday's deterministic tools and Friday's AI prompts will be measured.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It fulfills the complete publication requirements of a ten-volume academic edition.</p>", "feedback": "<p>Incorrect. Five notes constitute an introductory laboratory sample, not a complete multi-volume edition.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It proves that human editors will never be needed in digital humanities again.</p>", "feedback": "<p>Incorrect. The manual corpus demonstrates that human judgment is the essential foundation of quality annotation.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It automatically submits the student's final term paper to Moodle.</p>", "feedback": "<p>Incorrect. It is a laboratory reference corpus for comparative benchmarking.</p>"}]}}, {"step": 29, "title": "Documenting Your Manual Notes in `COMMENTARY.md`", "content": "**Documenting Your Manual Notes in `COMMENTARY.md`**\n\nIn professional software development and digital editing, data files are accompanied by records. In your project workspace, create a markdown file named `COMMENTARY.md`.\n\nIn `COMMENTARY.md`, record:\n<ol>\n  <li><strong>Document Summary:</strong> Title, archive shelfmark, date, and selected passage.</li>\n  <li><strong>Note Inventory Table:</strong> A table listing each note's ID, target anchor, category, and core topic.</li>\n  <li><strong>Sources Consulted:</strong> A book list of dictionaries, historical books. archive registers used to verify your facts.</li>\n  <li><strong>Editorial Reflection (150–250 words):</strong> Discuss the challenges of manual commentary. Which notes took the longest to research? Where did modern dictionaries fail to explain historical terms?</li>\n</ol>\n\nThis markdown ledger tracks your editorial decisions and will be updated on Wednesday and Friday as you compare manual notes with algorithmic and AI-assisted annotation.\n\n**Vocabulary.** *records Ledger* — a structured text record tracking editorial decisions, research sources, and audit findings over time. *book list* — a systematic list of books, articles, and archive documents cited in scholarly work.\n\n**Takeaway:** Document your research process and note inventory in `COMMENTARY.md` to maintain a permanent record of your editorial sources and methodology.\n\n---", "html": null, "image_b64": null, "question": {"name": "29 Question: Documenting Your Manual Notes in COMMENTARY.md", "questiontext": "<p>Why is maintaining a research ledger in COMMENTARY.md a vital practice in digital scholarly editing?</p>", "generalfeedback": "<p>Document your research process and note inventory in `COMMENTARY.md` to maintain a permanent record of your editorial sources and methodology.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>It records consulted dictionaries, historical sources, note inventories, and reflective analysis, providing a durable audit trail of editorial decisions.</p>", "feedback": "<p>Correct. A documentation ledger tracks the research evidence supporting every note and documents the editor's methodological decisions.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It replaces the XML file so that students do not need to learn digital markup.</p>", "feedback": "<p>Incorrect. The markdown ledger documents the XML edition; it does not replace it.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It deletes all previous git commit messages from the repository history.</p>", "feedback": "<p>Incorrect. Ledgers document project work and are tracked in git alongside code and markup.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>It is an optional decorative exercise with no academic or professional value.</p>", "feedback": "<p>Incorrect. Transparent research documentation is a core standard of professional digital scholarship.</p>"}]}}, {"step": 30, "title": "Synthesis: The Human-in-the-Loop Foundation", "content": "**Synthesis: The Human-in-the-Loop Foundation**\n\nToday you have explored the foundational craft of scholarly commentary. You learned why commentary is an essential interpretive layer of a digital edition, distinct from physical text record and linguistic normalization.\n\nYou mastered key technical skills in Visual Studio Code:\n<ul>\n  <li>Classifying notes into language, historical, and intertextual categories.</li>\n  <li>setting stable, non-breaking `xml:id` anchors in running text.</li>\n  <li>Encoding annotations in a clean TEI `<standOff>` container using Chapter 17 principles.</li>\n  <li>Connecting notes to text anchors via `@target` with proper `#` URI syntax.</li>\n  <li>Enriching commentary with Linked Open Data standard records and book citations.</li>\n</ul>\n\nAs we move forward in Week 12, remember: no computer algorithm and no artificial intelligence model can replace human judgment. Tomorrow, we will test deterministic tools for finding intertextual cross-references. On Friday, we will test large language models for drafting notes. But whatever automated tools propose, you—the human scholar—remain the final standard.\n\n**Vocabulary.** *Human-in-the-Loop* — a workflow model where automated and AI systems assist humans, but human experts make all final critical decisions. *Scholarly Judgment* — the informed, critical evaluation of historical evidence and textual meaning.\n\n**Takeaway:** Manual commentary sets up the irreplaceable human gold standard against which all automated and AI-assisted annotation tools must be evaluated.", "html": null, "image_b64": null, "question": {"name": "30 Question: Synthesis: The Human-in-the-Loop Foundation", "questiontext": "<p>What core principle governs the relationship between human scholars and automated digital or AI tools in text commentary?</p>", "generalfeedback": "<p>Manual commentary sets up the irreplaceable human gold standard against which all automated and AI-assisted annotation tools must be evaluated.</p>", "answers": [{"fraction": 100.0, "is_correct": true, "text": "<p>Automated tools can assist with search and draft generation, but human scholars remain the essential authority responsible for critical judgment and verification.</p>", "feedback": "<p>Correct. The human-in-the-loop principle ensures that technology accelerates editorial workflows while human experts guarantee intellectual integrity.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>AI models should be allowed to publish commentary without human review or oversight.</p>", "feedback": "<p>Incorrect. Unreviewed AI text frequently contains hallucinations, anachronisms, and fake citations.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Human scholars should refuse to use computers or search engines under any circumstances.</p>", "feedback": "<p>Incorrect. Computational tools are powerful aids when guided by trained human judgment.</p>"}, {"fraction": 0.0, "is_correct": false, "text": "<p>Algorithms always understand historical documents better than human historians.</p>", "feedback": "<p>Incorrect. Language models process statistical token patterns, lacking genuine historical understanding or lived experience.</p>"}]}}]};
        let currentIdx = 0;

        function renderSlide() {
            const slide = lessonData.slides[currentIdx];
            document.getElementById('section-badge').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('section-title').innerText = slide.title;
            
            const imgContainer = document.getElementById('slide-image-container');
            if (slide.image_b64) {
                imgContainer.innerHTML = `<img src="${slide.image_b64}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">`;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.innerHTML = '';
                imgContainer.style.display = 'none';
            }

            document.getElementById('markdown-content').innerHTML = slide.html || marked.parse(slide.content);
            document.getElementById('stats-counter').innerText = `Section ${slide.step} of ${lessonData.total_sections}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / lessonData.total_sections) * 100}%`;

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').innerText = currentIdx === lessonData.total_sections - 1 ? 'Finish Lesson 🎉' : 'Next →';

            const checkContainer = document.getElementById('check-container');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'feedback-box';
            feedbackBox.style.display = 'none';

            if (slide.question && slide.question.answers && slide.question.answers.length > 0) {
                checkContainer.style.display = 'block';
                document.getElementById('question-text').innerHTML = slide.question.questiontext;
                const optsList = document.getElementById('options-list');
                optsList.innerHTML = '';

                slide.question.answers.forEach((ans, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.innerHTML = `<span style="font-weight:700; color:var(--stfx-blue);">${String.fromCharCode(65 + idx)}.</span> <div>${ans.text}</div>`;
                    optDiv.onclick = () => selectOption(optDiv, ans, slide.question);
                    optsList.appendChild(optDiv);
                });
            } else {
                checkContainer.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectOption(elem, ans, q) {
            const allOpts = document.querySelectorAll('.option-item');
            allOpts.forEach(o => o.style.pointerEvents = 'none');

            const feedbackBox = document.getElementById('feedback-box');
            if (ans.is_correct) {
                elem.classList.add('correct');
                feedbackBox.className = 'feedback-box correct';
                feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${ans.feedback || q.generalfeedback || 'Great job!'}`;
            } else {
                elem.classList.add('incorrect');
                feedbackBox.className = 'feedback-box incorrect';
                feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${ans.feedback || 'Please review the concept above.'}`;
            }
            feedbackBox.style.display = 'block';
        }

        function nextSlide() {
            if (currentIdx < lessonData.total_sections - 1) {
                currentIdx++;
                renderSlide();
            } else {
                alert('Congratulations! You have completed this interactive lesson!');
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        document.addEventListener('DOMContentLoaded', renderSlide);
    </script>
</body>
